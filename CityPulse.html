<!DOCTYPE html>
<html lang="en" data-theme="city">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e18">
<title>CITYPULSE — Smart City Platform</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#0a0e18;--bg2:#0f1422;--bg3:#151c30;--bg4:#1d2640;
  --panel:#101626;--panel2:#181f34;--panel3:#202a48;--panel4:#2a3660;
  --bd:#1f2a48;--bd2:#2e3c60;--bd3:#425480;
  --tx:#e8eeff;--tx2:#a8b4d4;--tx3:#7080a0;--mu:#485880;
  --c1:#00d4ff;--c1h:#80e8ff;--c1l:#00a3cc;
  --c2:#a855f7;--c2h:#d0a0ff;--c2l:#8033cc;
  --c3:#00ff9d;--c3h:#80ffc8;--c3l:#00cc7a;
  --c4:#ffb800;--c4h:#ffd980;--c4l:#cc9200;
  --c5:#ff2d9e;--c5h:#ff80c8;--c5l:#cc2277;
  --c6:#5b8dff;--c6h:#a8c0ff;--c6l:#3a68cc;
  --c7:#ff6b00;--c7h:#ffa040;--c7l:#cc5500;
  --c8:#c8ff00;--c8h:#e0ff80;--c8l:#a0cc00;
  --ok:#00ff9d;--warn:#ffb800;--err:#ff2d9e;--info:#00d4ff;
  --critical:#ff2d9e;--urgent:#ff6b00;--attention:#ffb800;
  --safe:#00ff9d;--medium:#00d4ff;
  --g1:linear-gradient(135deg,#00d4ff,#a855f7);
  --g2:linear-gradient(135deg,#ff2d9e,#ffb800);
  --g3:linear-gradient(135deg,#00ff9d,#00d4ff);
  --g4:linear-gradient(135deg,#ff6b00,#ff2d9e);
  --g5:linear-gradient(135deg,#5b8dff,#a855f7);
  --gHolo:linear-gradient(120deg,#00d4ff,#a855f7,#ff2d9e,#00ff9d,#ffb800,#00d4ff);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.6);
  --sh2:0 4px 16px rgba(0,0,0,.75);
  --sh3:0 8px 32px rgba(0,0,0,.85);
  --shGlow:0 0 24px rgba(0,212,255,.35);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#eef2f9;--bg3:#e2e8f5;--bg4:#d0d8ec;
  --panel:#ffffff;--panel2:#f8fafd;--panel3:#eef3fa;--panel4:#dce4f2;
  --bd:#dce4f2;--bd2:#b8c4dc;--bd3:#94a4c0;
  --tx:#0a1428;--tx2:#3a4870;--tx3:#5a6888;--mu:#8090b0;
  --c1:#0088cc;--c1h:#00a0e0;--c1l:#005580;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
}
[data-theme="sunset"]{
  --bg:#180a14;--bg2:#220e1c;--bg3:#301628;--bg4:#402034;
  --panel:#1a0c14;--panel2:#2a1018;--panel3:#3c1828;--panel4:#4c2034;
  --bd:#3c1828;--bd2:#5a2c40;--bd3:#7a4058;
  --tx:#ffe8f5;--tx2:#d8a8c8;--tx3:#a07898;--mu:#705068;
  --c1:#ff4080;--c1h:#ff80b0;--c1l:#cc2060;
  --c2:#ffb800;--c2h:#ffd060;--c2l:#cc9200;
}
[data-theme="forest"]{
  --bg:#051208;--bg2:#0a1e10;--bg3:#102816;--bg4:#183820;
  --panel:#08180c;--panel2:#102816;--panel3:#183820;--panel4:#204a28;
  --bd:#183820;--bd2:#285030;--bd3:#3c7040;
  --tx:#c8f0d0;--tx2:#88c898;--tx3:#508868;--mu:#386848;
  --c1:#00ff88;--c1h:#80ffc0;--c1l:#00cc68;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:250px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--gHolo);background-size:300% auto;
  animation:holoShift 5s linear infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;box-shadow:var(--shGlow);
}
@keyframes holoShift{0%{background-position:0% center}100%{background-position:300% center}}
.sb-title{
  font-weight:800;font-size:.98rem;letter-spacing:1.5px;line-height:1;
  background:var(--gHolo);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holoShift 6s linear infinite;
}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-city{
  padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--bd);flex-shrink:0;
}
.city-name{font-size:.78rem;font-weight:700;color:var(--tx)}
.city-meta{font-size:.62rem;color:var(--tx3);margin-top:2px;display:flex;gap:8px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(0,212,255,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c5);color:#fff;
  min-width:16px;text-align:center;font-family:var(--mono);
}
.nav-item.active .ni-badge{background:rgba(0,0,0,.3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.98rem;flex-shrink:0}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:8px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:4px;right:4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--c5);color:#fff;border-radius:var(--rf);
  font-size:.55rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g1);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(0,212,255,.35);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(0,212,255,.4)}
.btn.danger{background:var(--c5);color:#fff;border-color:transparent}
.btn.warn{background:var(--c4);color:#000;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:11px}
.card.glow{border-color:var(--c1);box-shadow:var(--shGlow),var(--sh1)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:18px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.pink::before{background:var(--g2)}
.kpi.green::before{background:var(--g3)}
.kpi.warm::before{background:var(--g4)}
.kpi.violet::before{background:var(--g5)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;
}
.kpi-value{
  font-size:1.5rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;color:var(--tx);
}
.kpi-value.critical{color:var(--c5)}
.kpi-value.warn{color:var(--c4)}
.kpi-value.safe{color:var(--c3)}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:6px;line-height:1.4}
.kpi-delta{
  font-size:.66rem;font-weight:600;margin-top:6px;
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:var(--rf);
}
.kpi-delta.up{background:rgba(0,255,157,.15);color:var(--c3)}
.kpi-delta.down{background:rgba(255,45,158,.15);color:var(--c5)}
.kpi-delta.neutral{background:var(--panel3);color:var(--tx3)}

.table-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700}
.table-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:10px 14px;text-align:left;
  font-size:.6rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.7px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{padding:11px 14px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;white-space:nowrap;
}
.badge.critical{background:rgba(255,45,158,.18);color:var(--c5);border:1px solid rgba(255,45,158,.35)}
.badge.urgent{background:rgba(255,107,0,.18);color:var(--c7);border:1px solid rgba(255,107,0,.35)}
.badge.attention{background:rgba(255,184,0,.18);color:var(--c4);border:1px solid rgba(255,184,0,.35)}
.badge.safe{background:rgba(0,255,157,.18);color:var(--c3);border:1px solid rgba(0,255,157,.35)}
.badge.info{background:rgba(0,212,255,.18);color:var(--c1);border:1px solid rgba(0,212,255,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}
.badge.purple{background:rgba(168,85,247,.18);color:var(--c2);border:1px solid rgba(168,85,247,.35)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field label .req{color:var(--c5);margin-left:3px}
.field label .hint{color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0;font-size:.65rem;margin-left:6px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,212,255,.15);
}
.field textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.5}
.field small{font-size:.63rem;color:var(--tx3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row.three{grid-template-columns:1fr 1fr 1fr;gap:12px}

.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.8);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

.chart-box{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}
.chart-canvas{width:100%;height:220px;display:block}

.empty{
  text-align:center;padding:44px 20px;color:var(--tx3);font-size:.78rem;
}
.empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:5px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.66rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}

.divider{height:1px;background:var(--bd);margin:14px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.74rem;gap:10px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.entity-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  cursor:pointer;transition:var(--t);
  position:relative;overflow:hidden;
}
.entity-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.entity-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;bottom:0;
  background:var(--c1);
}
.entity-card.pink::before{background:var(--c5)}
.entity-card.green::before{background:var(--c3)}
.entity-card.warm::before{background:var(--c4)}
.entity-card.violet::before{background:var(--c2)}
.ec-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.ec-title{font-weight:700;font-size:.88rem;line-height:1.3;color:var(--tx)}
.ec-meta{font-size:.66rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.ec-desc{font-size:.74rem;color:var(--tx2);line-height:1.55;margin-bottom:12px;flex:1}
.ec-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--bd);
  font-size:.66rem;color:var(--tx3);gap:8px;flex-wrap:wrap;
}

.progress{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--g1);transition:width .5s;border-radius:4px}

.mono{font-family:var(--mono)}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}

/* Issue/Feed items */
.feed-item{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;margin-bottom:10px;
  transition:var(--t);
}
.feed-item:hover{border-color:var(--bd2);box-shadow:var(--sh2)}
.fi-head{display:flex;gap:12px;align-items:start;margin-bottom:10px}
.fi-avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--g1);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;flex-shrink:0;
}
.fi-body{flex:1;min-width:0}
.fi-name{font-weight:700;font-size:.8rem;color:var(--tx)}
.fi-meta{font-size:.62rem;color:var(--tx3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.fi-content{font-size:.78rem;line-height:1.6;color:var(--tx);margin:8px 0}
.fi-image{
  width:100%;max-height:240px;border-radius:var(--rs);
  background:linear-gradient(135deg,var(--panel2),var(--panel3));
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);font-size:.7rem;margin:8px 0;overflow:hidden;
}
.fi-actions{display:flex;gap:14px;padding-top:10px;border-top:1px solid var(--bd);margin-top:10px}
.fi-action{
  display:flex;align-items:center;gap:5px;
  font-size:.68rem;color:var(--tx3);cursor:pointer;transition:var(--t);
}
.fi-action:hover{color:var(--c1)}
.fi-action.liked{color:var(--c5)}
.fi-tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.fi-tag{
  padding:2px 7px;border-radius:100px;
  background:var(--panel3);font-size:.6rem;color:var(--tx2);
  font-weight:600;
}

/* Map */
.city-map{
  position:relative;background:#000;
  border-radius:var(--r);border:1px solid var(--bd);
  overflow:hidden;height:520px;
}
.city-map canvas{width:100%;height:100%;display:block;cursor:crosshair}
.map-legend{
  position:absolute;top:12px;left:12px;
  background:rgba(10,14,24,.9);backdrop-filter:blur(8px);
  border:1px solid var(--bd);border-radius:var(--rxs);
  padding:10px 12px;font-size:.66rem;
}
.map-legend .li{display:flex;align-items:center;gap:7px;padding:2px 0}
.map-legend .pin{width:10px;height:10px;border-radius:50%}

/* Events */
.event-card{
  display:flex;gap:12px;padding:14px;
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);margin-bottom:10px;
  cursor:pointer;transition:var(--t);
}
.event-card:hover{border-color:var(--c1);transform:translateX(3px)}
.ec-date{
  width:60px;flex-shrink:0;
  text-align:center;
  background:var(--panel2);border-radius:var(--rxs);
  padding:8px 4px;
}
.ec-day{font-size:1.5rem;font-weight:800;font-family:var(--mono);color:var(--c1);line-height:1}
.ec-month{font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700;margin-top:3px}
.ec-body{flex:1;min-width:0}
.ec-evt-title{font-weight:700;font-size:.85rem;color:var(--tx);margin-bottom:3px}
.ec-evt-meta{font-size:.68rem;color:var(--tx3)}
.ec-evt-desc{font-size:.72rem;color:var(--tx2);line-height:1.5;margin-top:6px}

/* Poll */
.poll-bar{
  height:36px;background:var(--panel2);border-radius:var(--rxs);
  margin:6px 0;position:relative;overflow:hidden;
  cursor:pointer;transition:var(--t);border:1px solid var(--bd);
}
.poll-bar:hover{border-color:var(--c1)}
.poll-bar-fill{
  height:100%;background:var(--g1);opacity:.4;
  position:absolute;left:0;top:0;transition:width .3s;
}
.poll-bar-text{
  position:absolute;inset:0;padding:0 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:.74rem;font-weight:600;
  z-index:1;
}

/* Business cards */
.business-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  cursor:pointer;transition:var(--t);
}
.business-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--c1)}
.bc-category{
  display:inline-block;padding:2px 8px;border-radius:100px;
  background:var(--panel2);color:var(--c1);
  font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;
}

@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .page{padding:0;background:#fff;color:#000}
  body{overflow:visible;height:auto;background:#fff;color:#000}
}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh3)}
  .tb-menu{display:flex}
  .field-row,.field-row.three,.grid-2,.grid-3{grid-template-columns:1fr}
  .page{padding:14px}
  .page-title{font-size:1.15rem}
  .card-grid{grid-template-columns:1fr}
  .city-map{height:380px}
}
@media (min-width:901px){.sidebar{transform:none!important}}

<script>
"use strict";
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){
  var e=document.createElement(t);
  if(a)for(var k in a){
    if(k==='class')e.className=a[k];
    else if(k==='style'&&typeof a[k]==='object')Object.assign(e.style,a[k]);
    else if(k==='text')e.textContent=a[k];
    else if(k==='html')e.innerHTML=a[k];
    else if(k.indexOf('on')===0)e[k]=a[k];
    else e.setAttribute(k,a[k]);
  }
  if(c){
    if(typeof c==='string')e.innerHTML=c;
    else if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});
    else e.appendChild(c);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function addDays(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function lastNDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function safeFloat(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}
function fmtMoney(n){
  n=Number(n)||0;
  var neg=n<0;n=Math.abs(n);
  return (neg?'-':'$')+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function fmtNum(n){
  n=Number(n)||0;
  return n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}

function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ'};
  var t2=el('div',{class:'toast '+type});
  t2.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t2);
  setTimeout(function(){
    t2.classList.add('leaving');
    setTimeout(function(){t2.remove()},320);
  },2800);
}
function openModal(o){
  o=o||{};
  var box=$('modalBox');
  box.className='modal-box'+(o.wide?' wide':'')+(o.narrow?' narrow':'');
  $('modalTitle').textContent=o.title||'';
  $('modalBody').innerHTML=o.body||'';
  $('modalFoot').innerHTML=o.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(o.onOpen)setTimeout(o.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,msg,fn,danger){
  openModal({
    title:title,narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.6;font-size:.82rem">'+esc(msg)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">Confirm</button>',
    onOpen:function(){$('confirmYes').onclick=function(){closeModal();fn()}}
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal({
    title:title,narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(State))}
  catch(e){toast('Save failed','error')}
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var d=JSON.parse(raw);
    Object.keys(State).forEach(function(k){if(d[k]!==undefined)State[k]=d[k]});
    return true;
  }catch(e){return false}
}
function logActivity(type,desc){
  State.activity.unshift({id:uid('a'),type:type,desc:desc,ts:nowISO()});
  if(State.activity.length>300)State.activity=State.activity.slice(0,300);
}

var CurrentRoute='dashboard';

function navigate(route){
  if(!ROUTES[route])route='dashboard';
  CurrentRoute=route;
  var r=ROUTES[route];
  $('tbTitle').textContent=r.title;
  $('tbSub').textContent=r.sub;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var nav=$('sbNav');
  if(!nav)return;
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var order=['Overview','311','Community','Civic','Getting Around','System'];
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      var badge='';
      var r=item.route;
      if(r==='issues'){
        var open=State.issues.filter(function(i){return i.status==='new'||i.status==='in_progress'}).length;
        if(open>0)badge='<span class="ni-badge">'+open+'</span>';
      }else if(r==='alerts'){
        var urgent=State.alerts.filter(function(a){return a.severity==='urgent'||a.severity==='attention'}).length;
        if(urgent>0)badge='<span class="ni-badge">'+urgent+'</span>';
      }else if(r==='events'){
        var upcoming=State.events.filter(function(e){return e.date>=today()&&e.date<=addDays(today(),7)}).length;
        if(upcoming>0)badge='<span class="ni-badge">'+upcoming+'</span>';
      }
      html+='<div class="nav-item'+(item.route===CurrentRoute?' active':'')+'" onclick="navigate(\''+item.route+'\')">'+
            '<span class="ni-icon">'+item.meta.icon+'</span>'+
            '<span>'+esc(item.meta.title)+'</span>'+badge+'</div>';
    });
  });
  nav.innerHTML=html;
  updateSbCity();
}
function updateSbCity(){
  var el2=$('sbCityName');if(el2)el2.textContent=State.settings.cityName+', '+State.settings.cityState;
  var el3=$('sbCityMeta');
  if(el3)el3.innerHTML='<span>'+fmtNum(State.settings.population)+'</span><span>·</span><span>'+State.settings.userDistrict+'</span>';
}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
function closeSidebar(){$('sidebar').classList.remove('open')}

function toggleTheme(){
  var themes=['city','light','sunset','forest'];
  var cur=document.documentElement.getAttribute('data-theme')||'city';
  var i=themes.indexOf(cur);
  i=(i+1)%themes.length;
  document.documentElement.setAttribute('data-theme',themes[i]);
  State.settings.theme=themes[i];
  saveState();
  toast('Theme: '+themes[i],'info');
}

function renderPage(){
  var fn=window['render_'+CurrentRoute];
  if(typeof fn==='function'){
    $('page').innerHTML=fn();
    var after=window['after_'+CurrentRoute];
    if(typeof after==='function')setTimeout(after,20);
  }else{
    $('page').innerHTML='<div class="empty"><span class="icon">🚧</span><h4>Under construction</h4></div>';
  }
  updateAlertBadge();
}

function getAlerts(){
  var alerts=[];
  State.alerts.filter(function(a){return a.severity==='urgent'}).forEach(function(a){
    alerts.push({type:'urgent',icon:'🚨',title:a.title,msg:a.msg,route:'alerts'});
  });
  // My issues updates
  State.issues.filter(function(i){return i.reportedBy===State.settings.userName&&i.status==='resolved'&&!i.notified}).forEach(function(i){
    alerts.push({type:'info',icon:'✓',title:'Your issue was resolved',msg:i.title,route:'issues'});
  });
  // Volunteer shifts tomorrow
  State.myVolunteerShifts.filter(function(s){return s.date===addDays(today(),1)}).forEach(function(s){
    var op=State.volunteerOps.find(function(o){return o.id===s.opId});
    if(op)alerts.push({type:'attention',icon:'🤝',title:'Volunteer shift tomorrow',msg:op.title+' at '+op.location,route:'volunteer'});
  });
  // Events today
  State.events.filter(function(e){return e.date===today()}).forEach(function(e){
    alerts.push({type:'attention',icon:'📅',title:'Event today',msg:e.title+' at '+e.time,route:'events'});
  });
  // Polls closing soon
  State.polls.filter(function(p){return !p.votedOption&&daysBetween(today(),p.closesAt)<=3&&daysBetween(today(),p.closesAt)>=0}).forEach(function(p){
    alerts.push({type:'info',icon:'🗳️',title:'Poll closing soon',msg:p.question,route:'polls'});
  });
  return alerts;
}
function getAlertCount(){return getAlerts().length}
function updateAlertBadge(){
  var cnt=getAlertCount();
  var b=$('alertBadge');
  if(b){
    if(cnt>0){b.textContent=cnt;b.style.display='flex'}
    else b.style.display='none';
  }
}
function showAlerts(){
  var alerts=getAlerts();
  var body='';
  if(!alerts.length){
    body='<div class="empty"><span class="icon">✓</span><h4>All clear</h4><p>No urgent alerts right now.</p></div>';
  }else{
    alerts.forEach(function(a){
      body+='<div class="stat-line" style="cursor:pointer;padding:12px 0" onclick="closeModal();navigate(\''+a.route+'\')">';
      body+='<div style="display:flex;gap:12px;align-items:start;flex:1">';
      body+='<span style="font-size:1.3rem">'+a.icon+'</span>';
      body+='<div><div style="font-weight:600;font-size:.82rem">'+esc(a.title)+'</div>';
      body+='<div style="font-size:.72rem;color:var(--tx2);margin-top:2px">'+esc(a.msg)+'</div></div></div>';
      body+='</div>';
    });
  }
  openModal({title:'🔔 Alerts ('+alerts.length+')',wide:true,body:body});
}

function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=42,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*(max/4))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7,gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    ctx.fillStyle=d.color||opts.color||'#00d4ff';
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);ctx.lineTo(x,padT+cH);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>8)label=label.slice(0,7)+'…';
    ctx.fillText(label,x+bw/2,H-10);
  });
}
function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*((max-min)/4))).toFixed(range<10?1:0),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    ctx.fillText(d.x,padL+(i/(len-1||1))*cW,H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#00d4ff','#a855f7','#00ff9d','#ffb800','#ff2d9e'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);ctx.lineTo(padL,padT+cH);
      ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    }
    ctx.beginPath();
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      ctx.moveTo(x,y);ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=color;ctx.fill();
  });
}
function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-24;
  var inner=r*0.6;
  var start=-Math.PI/2;
  var colors=['#00d4ff','#a855f7','#00ff9d','#ffb800','#ff2d9e','#5b8dff','#ff6b00','#c8ff00'];
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||colors[i%colors.length];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(opts.label||String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.sub||'',cx,cy+18);
}

function setMapFilter(f){

function after_map(){
  var canvas=$('mapCanvas');
  if(!canvas)return;
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.fillStyle='#0a0e18';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(0,212,255,.08)';
  ctx.lineWidth=1;
  for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Simulated "roads"
  ctx.strokeStyle='rgba(100,120,160,.2)';
  ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,H/3);ctx.lineTo(W,H/4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H*2/3);ctx.lineTo(W,H*3/4);ctx.stroke();

  var filter=window._mapFilter||'all';
  var filterIssues=State.issues.filter(function(i){
    if(filter==='all')return true;
    return i.status===filter;
  });

  var plotted=filterIssues.map(function(i){
    var x=(i.lng+117.33)/0.06*W;
    var y=(34.08-i.lat)/0.06*H;
    x=clamp(x,20,W-20);
    y=clamp(y,20,H-20);
    return {x:x,y:y,issue:i};
  });

  plotted.forEach(function(p){
    var i=p.issue;
    var color=i.status==='resolved'||i.status==='closed'?'#00ff9d':i.status==='in_progress'?'#ffb800':'#00d4ff';
    var radius=i.priority==='urgent'?10:i.priority==='high'?8:6;

    // Glow
    ctx.beginPath();
    ctx.arc(p.x,p.y,radius+6,0,Math.PI*2);
    ctx.fillStyle=color+'30';
    ctx.fill();

    // Pin
    ctx.beginPath();
    ctx.arc(p.x,p.y,radius,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.strokeStyle='#000';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });

  // Store for click detection
  canvas._plotted=plotted;

  // City center marker
  ctx.beginPath();
  ctx.arc(W/2,H/2,4,0,Math.PI*2);
  ctx.fillStyle='#a855f7';
  ctx.fill();
  ctx.fillStyle='rgba(168,85,247,.8)';
  ctx.font='11px monospace';
  ctx.textAlign='center';
  ctx.fillText('City Center',W/2,H/2-10);

  canvas.onclick=function(e){
    var r=canvas.getBoundingClientRect();
    var cx=e.clientX-r.left;
    var cy=e.clientY-r.top;
    var plotted=canvas._plotted||[];
    var best=null,bestD=20;
    plotted.forEach(function(p){
      var d=Math.sqrt((p.x-cx)*(p.x-cx)+(p.y-cy)*(p.y-cy));
      if(d<bestD){bestD=d;best=p}
    });
    if(best)viewIssue(best.issue.id);
  };
}

function render_polls(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🗳️</span>Community Polls</div>';
  html+='<div class="page-desc">Share your opinion on city decisions</div></div>';
  html+='</div>';

  if(!State.polls.length){
    html+='<div class="empty"><span class="icon">🗳️</span><h4>No polls yet</h4></div>';
    return html;
  }

  State.polls.forEach(function(p){
    var closed=daysBetween(today(),p.closesAt)<0;
    html+='<div class="card pad-lg mb-16">';
    html+='<div style="font-size:.92rem;font-weight:700;margin-bottom:6px">'+esc(p.question)+'</div>';
    html+='<div style="font-size:.66rem;color:var(--tx3);margin-bottom:14px">'+p.totalVotes+' votes · '+(closed?'Closed':(daysBetween(today(),p.closesAt)===0?'Closes today':'Closes in '+daysBetween(today(),p.closesAt)+' days'))+'</div>';
    p.options.forEach(function(opt){
      var pct=p.totalVotes>0?(opt.votes/p.totalVotes*100):0;
      var voted=p.votedOption===opt.id;
      html+='<div class="poll-bar" onclick="votePoll(\''+p.id+'\',\''+opt.id+'\')" style="'+(voted?'border-color:var(--c1)':'')+'">';
      html+='<div class="poll-bar-fill" style="width:'+pct+'%"></div>';
      html+='<div class="poll-bar-text">';
      html+='<span>'+(voted?'✓ ':'')+esc(opt.label)+'</span>';
      html+='<span class="mono">'+pct.toFixed(1)+'% ('+opt.votes+')</span>';
      html+='</div></div>';
    });
    html+='</div>';
  });

  return html;
}
function votePoll(pollId,optId){
  var p=State.polls.find(function(x){return x.id===pollId});
  if(!p)return;
  if(p.votedOption===optId){
    toast('Already voted for this option','info');
    return;
  }
  if(p.votedOption){
    // Change vote
    var old=p.options.find(function(o){return o.id===p.votedOption});
    if(old){old.votes--;p.totalVotes--}
  }
  var opt=p.options.find(function(o){return o.id===optId});
  if(opt){opt.votes++;p.totalVotes++}
  p.votedOption=optId;
  logActivity('civic','Voted on: '+p.question.slice(0,50));
  saveState();renderPage();
  toast('Vote cast!','success');
}

function setThemeOption(t){
  State.settings.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  saveState();renderPage();
}
function saveSettings(){
  State.settings.userName=$('stName').value.trim()||'Citizen';
  State.settings.userAvatar=$('stAvatar').value||'👤';
  State.settings.userDistrict=$('stDistrict').value;
  State.settings.cityName=$('stCity').value.trim()||'Riverside';
  saveState();
  updateSbCity();
  toast('Settings saved','success');
  renderPage();
}
function exportData(){
  var json=JSON.stringify(State,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='citypulse-'+today()+'.json';
  a.click();
  toast('Exported','success');
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        confirmDialog('Import','Replace current data?',function(){
          Object.keys(State).forEach(function(k){if(data[k]!==undefined)State[k]=data[k]});
          saveState();renderNav();renderPage();updateSbCity();
          toast('Imported','success');
        },true);
      }catch(e){toast('Import failed','error')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  confirmDialog('Reset Everything','Delete all your data? This cannot be undone.',function(){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  },true);
}

function initApp(){
  var loaded=loadState();
  if(!loaded||!State.issues.length){
    seedDemoData();
    saveState();
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'city');
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='dashboard')after_dashboard();
    if(CurrentRoute==='budget')after_budget();
    if(CurrentRoute==='neighborhood')after_neighborhood();
    if(CurrentRoute==='map')after_map();
  });
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.key==='?'){e.preventDefault();openHelp()}
    if(e.key==='g'){
      window._gk=true;setTimeout(function(){window._gk=false},1000);return;
    }
    if(window._gk){
      var map={'d':'dashboard','f':'feed','r':'report','i':'issues','m':'map','e':'events','a':'alerts','b':'businesses','v':'volunteer','p':'polls','u':'budget','c':'council','t':'transit','g':'green','s':'settings'};
      if(map[e.key])navigate(map[e.key]);
    }
  });
  renderNav();
  renderPage();
  updateAlertBadge();
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  setInterval(updateAlertBadge,60000);
  window.addEventListener('beforeunload',saveState);
  setTimeout(function(){toast('Welcome to '+State.settings.cityName+'! 🏙️','success')},400);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
