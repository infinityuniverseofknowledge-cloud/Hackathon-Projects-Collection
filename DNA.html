  MODULES.orf.scan();
}

/* ================================================================
   MODULE 5: CODON TABLE
   ================================================================ */
registerModule('codon',{
  title:'Codon Table',
  icon:'📋',
  desc:'The genetic code, visualized. 64 codons map to 20 amino acids + 3 stop signals. Color-coded by amino acid.',
  init:function(){
    logMsg('Codon table loaded','success');
  },
  tick:function(dt){STATE.time+=dt;},
  step:function(){},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020806';
    ctx.fillRect(0,0,W,H);
    var c=STATE.codon;
    /* Layout: 4×4×4 grid organized as U/C/A/G blocks */
    var bases=['U','C','A','G'];
    /* DNA equivalent */
    var dnaBase={'U':'T','C':'C','A':'A','G':'G'};
    var pad=40;
    var titleY=40;
    ctx.fillStyle='#40ffa0';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('GENETIC CODE · RNA CODON TABLE',pad,titleY);
    /* Cell size */
    var cols=16; /* 4 blocks of 4 columns */
    var rows=4;
    var availW=W-2*pad;
    var availH=H-100;
    var cellW=availW/cols;
    var cellH=availH/rows;
    var cellSize=Math.min(cellW,cellH);
    var gridW=cellSize*cols;
    var gridH=cellSize*rows;
    var ox=(W-gridW)/2;
    var oy=titleY+30;
    /* Draw each codon */
    for(var b1=0;b1<4;b1++){
      for(var b2=0;b2<4;b2++){
        for(var b3=0;b3<4;b3++){
          var codon=bases[b1]+bases[b2]+bases[b3];
          var dnaCodon=dnaBase[bases[b1]]+dnaBase[bases[b2]]+dnaBase[bases[b3]];
          var aa=CODON_TABLE[dnaCodon]||'?';
          var info=AA_INFO[aa];
          var col=b1*4+b3;
          var row=b2;
          var x=ox+col*cellSize;
          var y=oy+row*cellSize;
          /* Highlight selected */
          var isSel=codon===c.selected;
          /* Background */
          var bg=info?info.color:'#808080';
          ctx.globalAlpha=isSel?1:0.75;
          ctx.fillStyle=bg;
          ctx.fillRect(x+2,y+2,cellSize-4,cellSize-4);
          ctx.globalAlpha=1;
          /* Border */
          if(isSel){
            ctx.strokeStyle='#ffffff';
            ctx.lineWidth=3;
            ctx.strokeRect(x+2,y+2,cellSize-4,cellSize-4);
          } else {
            ctx.strokeStyle='rgba(0,0,0,.4)';
            ctx.lineWidth=1;
            ctx.strokeRect(x+2,y+2,cellSize-4,cellSize-4);
          }
          /* Codon label */
          ctx.fillStyle='#040a08';
          ctx.font='bold '+(cellSize>60?14:cellSize>40?11:9)+'px monospace';
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(codon,x+cellSize/2,y+cellSize*0.35);
          /* Amino acid single letter */
          ctx.font='bold '+(cellSize>60?20:cellSize>40?14:11)+'px monospace';
          if(aa==='*'){
            ctx.fillText('■',x+cellSize/2,y+cellSize*0.7);
          } else {
            ctx.fillText(aa,x+cellSize/2,y+cellSize*0.7);
          }
        }
      }
    }
    /* Labels for axes */
    ctx.fillStyle='#40ffa0';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    /* Top: second base */
    for(var b1=0;b1<4;b1++){
      for(var b3=0;b3<4;b3++){
        if(b3!==0)continue;
        /* Skip - show second base at block level below */
      }
    }
    /* Second base labels centered above each block (b1) */
    for(var b1=0;b1<4;b1++){
      var blockX=ox+(b1*4+2)*cellSize;
      ctx.fillStyle='#40ffa0';
      ctx.font='bold 14px monospace';
      ctx.fillText(bases[b1],blockX,oy-14);
    }
    /* Third base small labels inside blocks */
    for(var b1=0;b1<4;b1++){
      for(var b3=0;b3<4;b3++){
        var x=ox+(b1*4+b3)*cellSize+cellSize/2;
        ctx.fillStyle='rgba(64,255,160,.5)';
        ctx.font='9px monospace';
        ctx.fillText(bases[b3],x,oy+gridH+12);
      }
    }
    /* First base (rows) - to the right of grid */
    for(var b2=0;b2<4;b2++){
      var y=oy+b2*cellSize+cellSize/2;
      ctx.fillStyle='#40ffa0';
      ctx.font='bold 14px monospace';
      ctx.textAlign='left';
      ctx.fillText(bases[b2],ox+gridW+10,y);
    }
    ctx.textAlign='center';
    /* Info panel */
    ctx.fillStyle='rgba(8,20,16,.9)';
    ctx.strokeStyle='rgba(64,255,160,.4)';
    ctx.beginPath();ctx.roundRect(20,H-70,W-40,55,8);ctx.fill();ctx.stroke();
    /* Show selected codon detail */
    var selAA=CODON_TABLE[c.selected.replace(/U/g,'T')];
    var selInfo=AA_INFO[selAA];
    ctx.fillStyle='#40ffa0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('Selected: '+c.selected,32,H-46);
    ctx.fillStyle=selInfo?selInfo.color:'#fff';
    ctx.fillText((selAA==='*'?'STOP':'Amino acid '+selInfo.name+' ('+selAA+')'),140,H-46);
    ctx.fillStyle='#4a8068';
    ctx.font='10px monospace';
    ctx.fillText('Click any codon to highlight. The genetic code is degenerate — most amino acids are encoded by multiple codons.',32,H-24);
    setStatsHTML(
      '<div>Codons: 64</div>'+
      '<div>Amino acids: 20</div>'+
      '<div>Stop codons: 3</div>'+
      '<div>Selected: '+c.selected+'</div>'
    );
    updateBadge('📋 Codon table · selected '+c.selected+(selAA?' → '+selInfo.name:''));
    $('sbMode').textContent='Codon Table';
  },
  onDown:function(p){
    var c=STATE.codon;
    var bases=['U','C','A','G'];
    var pad=40,titleY=40;
    var cols=16,rows=4;
    var availW=CANV.W-2*pad;
    var availH=CANV.H-100;
    var cellW=availW/cols,cellH=availH/rows;
    var cellSize=Math.min(cellW,cellH);
    var gridW=cellSize*cols,gridH=cellSize*rows;
    var ox=(CANV.W-gridW)/2;
    var oy=titleY+30;
    if(p.x<ox||p.x>ox+gridW||p.y<oy||p.y>oy+gridH)return;
    var col=Math.floor((p.x-ox)/cellSize);
    var row=Math.floor((p.y-oy)/cellSize);
    var b1=Math.floor(col/4);
    var b3=col%4;
    var b2=row;
    var codon=bases[b1]+bases[b2]+bases[b3];
    c.selected=codon;
    /* Convert to DNA for AA lookup */
    var dna=CODON_TABLE[codon.replace(/U/g,'T')];
  },
  controls:function(){
    var c=STATE.codon;
    var html='';
    html+='<div class="sec"><h4>Selected codon</h4><div class="kv">';
    var selAA=CODON_TABLE[c.selected.replace(/U/g,'T')];
    var selInfo=AA_INFO[selAA];
    html+='<div class="row"><span class="k">Codon (RNA)</span><span class="v" style="color:var(--c1);font-size:.75rem">'+c.selected+'</span></div>';
    html+='<div class="row"><span class="k">Codon (DNA)</span><span class="v">'+c.selected.replace(/U/g,'T')+'</span></div>';
    html+='<div class="row"><span class="k">Amino acid</span><span class="v" style="color:'+(selInfo?selInfo.color:'#fff')+'">'+(selAA==='*'?'STOP':selInfo.name+' ('+selAA+')')+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Jump to codon</h4>';
    html+='<div class="chip-row">';
    ['AUG','UAA','UAG','UGA','UUU','GGG'].forEach(function(cd){
      html+='<div class="chip" onclick="STATE.codon.selected=\''+cd+'\';renderLeftPanel()">'+cd+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>All stop codons</h4>';
    html+='<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--c3)">'+
      'UAA — ochre<br>'+
      'UAG — amber<br>'+
      'UGA — opal<br><br>'+
      '<span style="color:var(--tx2)">Also known as "nonsense" codons. They terminate translation.</span>'
    '</div></div>';
    html+='<div class="sec"><h4>Start codon</h4>';
    html+='<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c1)">AUG</b> = Methionine<br>'+
      'In prokaryotes also GUG, UUG (rare).'+
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Genetic code</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Reading frame of 3 nucleotides = codon<br>'+
      '4³ = 64 possible codons<br>'+
      '61 code amino acids, 3 are stop signals'+
      '</div></div>'+
      '<div class="sec"><h4>Degeneracy</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Most amino acids have multiple codons:<br>'+
      '• Leu, Ser, Arg — 6 codons each<br>'+
      '• Met, Trp — 1 codon each<br><br>'+
      'The third position is often "wobble" — less constrained.'+
      '</div></div>'+
      '<div class="sec"><h4>Reading frame</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Same DNA, three forward frames:<br><br>'+
      'ATG GCA TTT GGC ...<br>'+
      'A TGG CAT TTG GC...<br>'+
      'AT GGC ATT TGG C...<br><br>'+
      'Only one frame usually encodes a meaningful protein.'+
      '</div></div>'+
      '<div class="sec"><h4>Evolution</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'The genetic code is nearly universal across all life — strong evidence for common ancestry.<br><br>'+
      'Minor variants exist in mitochondria and some protists.'+
      '</div></div>';
  }
});
</script>
<script>
var TABS=[
  {key:'align',icon:'🧬',label:'Align'},
  {key:'phylo',icon:'🌳',label:'Phylogeny'},
  {key:'rna',icon:'🔗',label:'RNA Fold'},
  {key:'orf',icon:'🔍',label:'ORF Finder'},
  {key:'codon',icon:'📋',label:'Codon Table'}
];
function buildTabs(){
  var tabs=$('tbTabs');tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active')});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active')});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');if(!body)return;
  var m=MODULES[STATE.currentTab];if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.7rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4><div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div style="font-size:.6rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b style="color:var(--c1)">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.6rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c1)':l.type==='warn'?'var(--c4)':'var(--c2)';
    html+='<div style="padding:3px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Running':'Paused','info',900);
}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900);}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['bio','light','mono'];
function toggleTheme(){

}

    '<div class="sec"><h4>📚 Modules</h4><div style="font-size:.62rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)">'+
    '<b style="color:var(--c1)">🧬 Align</b> — Smith-Waterman + Needleman-Wunsch with traceback<br>'+
    '<b style="color:var(--c1)">🌳 Phylogeny</b> — UPGMA dendrogram from distance matrix<br>'+
    '<b style="color:var(--c1)">🔗 RNA Fold</b> — Nussinov O(n³) secondary structure<br>'+
    '<b style="color:var(--c1)">🔍 ORF Finder</b> — 6 reading frames, DNA → protein<br>'+
    '<b style="color:var(--c1)">📋 Codon Table</b> — 64-codon genetic code, color-coded'+

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* Animated DNA double helix for boot */
function animateBootHelix(){
  var bc=$('bootHelix');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  var t0=performance.now();
  function frame(){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    var t=(performance.now()-t0)/1000;
    bctx.clearRect(0,0,bc.width,bc.height);
    var cy=bc.height/2;
    var amp=90;
    var period=400;
    var phase=t*1.2;
    /* Draw two sine waves (strands) and rungs */
    var bases=['#40ffa0','#40d0ff','#ff60a0','#ffd040'];
    for(var x=0;x<bc.width;x+=8){
      var y1=cy+Math.sin(x/period+phase)*amp;
      var y2=cy-Math.sin(x/period+phase)*amp;
      /* Strand 1 */
      bctx.fillStyle='#40ffa0';
      bctx.globalAlpha=0.55;
      bctx.beginPath();bctx.arc(x,y1,3,0,Math.PI*2);bctx.fill();
      /* Strand 2 */
      bctx.fillStyle='#40d0ff';
      bctx.beginPath();bctx.arc(x,y2,3,0,Math.PI*2);bctx.fill();
      bctx.globalAlpha=1;
      /* Rungs every 4th x */
      if(Math.floor(x/8)%4===0){
        var col=bases[Math.floor(x/32)%bases.length];
        bctx.strokeStyle=col;
        bctx.globalAlpha=0.25;
        bctx.lineWidth=1.5;
        bctx.beginPath();bctx.moveTo(x,y1);bctx.lineTo(x,y2);bctx.stroke();
        bctx.globalAlpha=1;
      }
    }
    requestAnimationFrame(frame);
  }
  frame();
}

var BOOT_STEPS=[
  'Compiling Smith-Waterman / Needleman-Wunsch DP...',
  'Loading genetic code (64 codons → 20 amino acids)...',
  'Initializing Nussinov O(n³) folding...',
  'Building UPGMA clustering engine...',
  'Setting up 6-frame ORF scanner...',
  'Loading primate/mammal distance matrices...',
  'Rendering DNA double helix...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  animateBootHelix();
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('DNA ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('DNA initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='reading';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});
