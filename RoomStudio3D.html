<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Room Studio 3D — Interior First-Person</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0a14;color:#e8e8ff}
canvas{display:block;position:absolute;inset:0;touch-action:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
input,select,textarea{-webkit-user-select:text;user-select:text}

:root{
  --bg:#0a0a14;--pnl:rgba(15,15,30,.94);--pnl2:rgba(25,25,45,.95);
  --bd:rgba(120,120,200,.25);--bd2:rgba(120,120,200,.5);
  --tx:#e8e8ff;--tx2:#a0a0c8;--tx3:#606080;
  --c1:#7a5cff;--c2:#00d4ff;--c3:#ff4db8;--c4:#ffb020;--c5:#00ffb0;
  --er:#ff5a5a;--ok:#00ffb0;
  --mono:'JetBrains Mono',Consolas,monospace;
}

#toolbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:20;
  background:linear-gradient(180deg,rgba(15,15,30,.96),rgba(15,15,30,.88));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#toolbar::-webkit-scrollbar{display:none}
.tb-logo{display:flex;align-items:center;gap:8px;padding-right:12px;
  border-right:1px solid var(--bd);flex-shrink:0}
.tb-logo .ico{width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#7a5cff,#00d4ff);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 16px rgba(122,92,255,.5)}
.tb-logo .nm{font-weight:800;font-size:.82rem;letter-spacing:1.5px;
  background:linear-gradient(135deg,#7a5cff,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.tb-logo .sub{font-size:.52rem;color:var(--tx3);letter-spacing:1px;margin-top:1px}
.tbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;
  border-radius:7px;border:1px solid var(--bd);
  background:rgba(25,25,45,.7);color:var(--tx);font-weight:600;
  font-size:.72rem;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tbtn:hover{background:rgba(40,40,70,.9);border-color:var(--bd2);transform:translateY(-1px)}
.tbtn.on{background:linear-gradient(135deg,#7a5cff,#00d4ff);color:#000;border-color:transparent}
.tbtn.er{background:rgba(255,90,90,.15);border-color:rgba(255,90,90,.5);color:#ff9a9a}
.tbtn.ok{background:rgba(0,255,176,.15);border-color:rgba(0,255,176,.5);color:#a0ffd0}
.tbtn.wr{background:rgba(255,176,32,.15);border-color:rgba(255,176,32,.5);color:#ffd080}
.sep{width:1px;height:26px;background:var(--bd);margin:0 4px;flex-shrink:0}

#sidebar{position:absolute;top:52px;bottom:0;left:0;width:280px;z-index:15;
  background:var(--pnl);backdrop-filter:blur(14px);
  border-right:1px solid var(--bd);
  display:flex;flex-direction:column;transition:transform .25s}
#sidebar.hidden{transform:translateX(-100%)}
.sb-tabs{display:flex;border-bottom:1px solid var(--bd);
  overflow-x:auto;flex-shrink:0;background:rgba(0,0,0,.25)}
.sb-tabs::-webkit-scrollbar{display:none}
.sb-tab{padding:9px 12px;font-size:.62rem;font-weight:700;
  color:var(--tx2);border-bottom:2px solid transparent;
  white-space:nowrap;cursor:pointer;letter-spacing:.5px}
.sb-tab.on{color:#fff;border-bottom-color:var(--c1);
  background:linear-gradient(180deg,transparent,rgba(122,92,255,.15))}
.sb-body{flex:1;overflow-y:auto;padding:10px}
.sb-body::-webkit-scrollbar{width:6px}
.sb-body::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{padding:8px 5px;background:rgba(30,30,55,.75);
  border:1px solid var(--bd);border-radius:7px;
  text-align:center;cursor:pointer;transition:all .15s;
  font-size:.6rem;line-height:1.25;overflow:hidden}
.card:hover{background:rgba(50,50,90,.9);border-color:var(--c1);
  transform:translateY(-2px);box-shadow:0 6px 18px rgba(122,92,255,.35)}
.card .sw{width:18px;height:18px;margin:0 auto 4px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card .nm{font-weight:600;font-size:.56rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.card .pr{font-size:.5rem;color:var(--tx3);margin-top:2px}

#props{position:absolute;top:52px;right:0;width:270px;bottom:0;z-index:15;
  background:var(--pnl);backdrop-filter:blur(14px);
  border-left:1px solid var(--bd);
  display:flex;flex-direction:column;transition:transform .25s;
  overflow-y:auto;padding:12px}
#props.hidden{transform:translateX(100%)}
#props::-webkit-scrollbar{width:6px}
#props::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.props-title{font-size:.7rem;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--tx2);
  padding-bottom:8px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:.58rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 9px;
  background:rgba(0,0,0,.35);border:1px solid var(--bd);
  border-radius:6px;color:var(--tx);font-size:.72rem;transition:all .15s}
.field input:focus,.field select:focus{border-color:var(--c1);
  box-shadow:0 0 0 2px rgba(122,92,255,.25)}
.field input[type=color]{padding:2px;height:36px;cursor:pointer}
.field input[type=range]{padding:0;height:5px;-webkit-appearance:none;
  background:var(--bd);border-radius:3px}
.field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--c1);
  cursor:pointer;box-shadow:0 0 10px var(--c1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.empty{color:var(--tx3);font-style:italic;text-align:center;
  padding:24px 8px;font-size:.68rem;line-height:1.6}

#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#crosshair{position:absolute;top:50%;left:50%;
  width:22px;height:22px;transform:translate(-50%,-50%);
  pointer-events:none;opacity:.85}
#crosshair::before,#crosshair::after{content:'';position:absolute;
  background:rgba(255,255,255,.85);box-shadow:0 0 4px #000}
#crosshair::before{left:50%;top:0;width:2px;height:100%;
  transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;
  transform:translateY(-50%)}
#crosshair.on::before,#crosshair.on::after{background:#00ffb0}

.joystick{position:absolute;bottom:24px;width:140px;height:140px;
  border-radius:50%;pointer-events:auto;
  background:radial-gradient(circle,rgba(30,30,60,.55) 0%,
    rgba(20,20,40,.75) 70%,rgba(10,10,20,.85) 100%);
  border:2px solid rgba(122,92,255,.5);
  box-shadow:0 0 30px rgba(122,92,255,.3),
    inset 0 0 30px rgba(0,0,0,.5);
  touch-action:none}
#joyL{left:20px}
#joyR{right:20px}
.joystick::after{content:'';position:absolute;inset:16px;
  border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
.stick{position:absolute;top:50%;left:50%;
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,
    rgba(200,180,255,.95),rgba(122,92,255,.75) 60%,
    rgba(50,30,120,.9) 100%);
  box-shadow:0 6px 20px rgba(122,92,255,.6),
    inset 0 -3px 8px rgba(0,0,0,.3);
  transform:translate(-50%,-50%);pointer-events:none;
  transition:transform .05s}
.joystick .lbl{position:absolute;bottom:-22px;left:50%;
  transform:translateX(-50%);font-size:.55rem;color:var(--tx3);
  letter-spacing:1.5px;font-weight:700;white-space:nowrap}

#stats{position:absolute;top:64px;left:50%;transform:translateX(-50%);
  padding:5px 12px;background:rgba(10,10,25,.88);
  border:1px solid var(--bd);border-radius:100px;
  font-family:var(--mono);font-size:.62rem;color:var(--tx2);
  display:flex;gap:14px;pointer-events:auto;
  backdrop-filter:blur(10px);white-space:nowrap}
#stats b{color:#00ffb0;font-weight:700}

#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  padding:9px 18px;background:rgba(15,15,30,.96);
  border:1px solid var(--bd);border-left:3px solid var(--c1);
  border-radius:7px;font-size:.72rem;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:30;max-width:80%}
#toast.on{opacity:1}

#help{position:absolute;top:64px;right:290px;padding:8px 12px;
  background:rgba(10,10,25,.85);border:1px solid var(--bd);
  border-radius:7px;font-size:.6rem;color:var(--tx2);
  line-height:1.7;pointer-events:none;max-width:200px}
#help b{color:#00ffb0}
#help kbd{background:rgba(255,255,255,.1);padding:1px 5px;
  border-radius:3px;font-family:var(--mono);font-size:.55rem;
  border:1px solid rgba(255,255,255,.15)}

#loading{position:absolute;inset:0;background:#0a0a14;z-index:100;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading .ldr{width:50px;height:50px;border-radius:50%;
  border:3px solid rgba(122,92,255,.2);border-top-color:#7a5cff;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .msg{color:#a0a0c8;font-size:.8rem;letter-spacing:1px}
#loading .err{color:#ff5a5a;font-size:.75rem;max-width:80%;
  text-align:center;line-height:1.6;padding:0 20px}

.mode-pill{position:absolute;top:64px;left:12px;padding:5px 12px;
  background:linear-gradient(135deg,#7a5cff,#00d4ff);
  color:#000;font-weight:800;font-size:.62rem;
  border-radius:100px;letter-spacing:1.5px;pointer-events:none}

@media(max-width:900px){
  #sidebar{width:220px}
  #props{width:210px}
  #help{display:none}
  .joystick{width:120px;height:120px;bottom:16px}
  #joyL{left:12px}
  #joyR{right:12px}
  .stick{width:48px;height:48px}
  #stats{font-size:.55rem;gap:8px;padding:4px 8px}
}
</style>
</head>

<div id="loading">
  <div class="ldr"></div>
  <div class="msg" id="loadMsg">Carregando Room Studio 3D...</div>
  <div class="err" id="loadErr"></div>
</div>

<div id="toolbar">
  <div class="tb-logo">
    <div class="ico">&#127968;</div>
    <div>
      <div class="nm">ROOM STUDIO 3D</div>
      <div class="sub">FIRST-PERSON DESIGNER</div>
    </div>
  </div>
  <button class="tbtn on" id="btnWalk" onclick="setMode('walk')">&#128694; Andar</button>
  <button class="tbtn" id="btnEdit" onclick="setMode('edit')">&#9998; Editar</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="addAtCrosshair()">&#10133; Adicionar</button>
  <button class="tbtn" onclick="deleteSelected()">&#128465; Apagar</button>
  <button class="tbtn er" onclick="clearRoom()">&#128683; Limpar</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="toggleSidebar()">&#9776; Cat&#225;logo</button>
  <button class="tbtn" onclick="toggleProps()">&#9881; Propriedades</button>
  <div class="sep"></div>
  <button class="tbtn wr" onclick="saveRoom()">&#128190; Salvar</button>
  <button class="tbtn wr" onclick="loadRoom()">&#128194; Carregar</button>
  <button class="tbtn wr" onclick="exportRoom()">&#128229; Exportar</button>
  <div class="sep"></div>
  <button class="tbtn" onclick="resetView()">&#8635; Reset</button>
</div>

<div id="sidebar">
  <div class="sb-tabs" id="sbTabs"></div>
  <div class="sb-body" id="sbBody"></div>
</div>

<div id="props" class="hidden">
  <div class="props-title">&#9881; Propriedades</div>
  <div id="propsBody"><div class="empty">Nenhum objeto selecionado.<br>Clique em um objeto ou adicione um novo.</div></div>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div class="mode-pill" id="modePill">MODO: ANDAR</div>
  <div id="stats">
    <span>FPS <b id="fps">--</b></span>
    <span>X <b id="px">0.0</b></span>
    <span>Y <b id="py">0.0</b></span>
    <span>Z <b id="pz">0.0</b></span>
    <span>Obj <b id="ocount">0</b></span>
  </div>
  <div id="help">
    <b>Controles:</b><br>
    <kbd>W A S D</kbd> mover<br>
    <kbd>Arrastar</kbd> olhar<br>
    <kbd>Shift</kbd> correr<br>
    <kbd>E</kbd> adicionar<br>
    <kbd>Del</kbd> apagar<br>
    <kbd>R</kbd> reset
  </div>
  <div class="joystick" id="joyL">
    <div class="stick" id="stickL"></div>
    <div class="lbl">MOVER</div>
  </div>
  <div class="joystick" id="joyR">
    <div class="stick" id="stickR"></div>
    <div class="lbl">OLHAR</div>
  </div>
</div>

<div id="toast"></div>

/* ============== Room construction ============== */
function buildRoom(){
  while(roomGroup.children.length){
    var c = roomGroup.children[0];
    roomGroup.remove(c);
    disposeNode(c);
  }

  var W = APP.roomW, D = APP.roomD, H = APP.roomH;

  var wallMat  = new THREE.MeshStandardMaterial({color:APP.wallColor,  roughness:0.92, metalness:0.02});
  var floorMat = new THREE.MeshStandardMaterial({color:APP.floorColor, roughness:0.65, metalness:0.05});
  var ceilMat  = new THREE.MeshStandardMaterial({color:APP.ceilColor,  roughness:0.95, metalness:0});

  var floorGeo = new THREE.PlaneGeometry(W, D);
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  roomGroup.add(floor);

  var ceil = new THREE.Mesh(floorGeo.clone(), ceilMat);
  ceil.rotation.x = Math.PI/2;
  ceil.position.y = H;
  roomGroup.add(ceil);

  var wallGeoX = new THREE.PlaneGeometry(D, H);
  var wallGeoZ = new THREE.PlaneGeometry(W, H);

  var w1 = new THREE.Mesh(wallGeoZ, wallMat);
  w1.position.set(0, H/2, -D/2);
  w1.receiveShadow = true;
  roomGroup.add(w1);

  var w2 = new THREE.Mesh(wallGeoZ.clone(), wallMat);
  w2.position.set(0, H/2, D/2);
  w2.rotation.y = Math.PI;
  w2.receiveShadow = true;
  roomGroup.add(w2);

  var w3 = new THREE.Mesh(wallGeoX, wallMat);
  w3.position.set(-W/2, H/2, 0);
  w3.rotation.y = Math.PI/2;
  w3.receiveShadow = true;
  roomGroup.add(w3);

  var w4 = new THREE.Mesh(wallGeoX.clone(), wallMat);
  w4.position.set(W/2, H/2, 0);
  w4.rotation.y = -Math.PI/2;
  w4.receiveShadow = true;
  roomGroup.add(w4);

  /* Rodapé */
  var trimMat = new THREE.MeshStandardMaterial({color:0x2a1a0a, roughness:0.6});
  var th = 0.08, tt = 0.03;
  var t1 = new THREE.Mesh(new THREE.BoxGeometry(W, th, tt), trimMat);
  t1.position.set(0, th/2, -D/2 + tt/2);
  roomGroup.add(t1);
  var t2 = new THREE.Mesh(new THREE.BoxGeometry(W, th, tt), trimMat);
  t2.position.set(0, th/2, D/2 - tt/2);
  roomGroup.add(t2);
  var t3 = new THREE.Mesh(new THREE.BoxGeometry(tt, th, D), trimMat);
  t3.position.set(-W/2 + tt/2, th/2, 0);
  roomGroup.add(t3);
  var t4 = new THREE.Mesh(new THREE.BoxGeometry(tt, th, D), trimMat);
  t4.position.set(W/2 - tt/2, th/2, 0);
  roomGroup.add(t4);
}

function disposeNode(n){
  if(n.geometry) n.geometry.dispose();
  if(n.material){
    if(Array.isArray(n.material)) n.material.forEach(function(m){m.dispose()});
    else n.material.dispose();
  }
}

      new THREE.MeshStandardMaterial({color:0xe8e8e8})
    );
    mull2.position.z = d/2 + 0.001;
    g.add(mull2);
    return g;
  },

  box: function(color, size){
    var g = new THREE.Group();
    var w = size[0], h = size[1], d = size[2];
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({color:color, roughness:0.7})
    );
    m.position.y = h/2;
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
    return g;
  }
};

function buildObject(def){
  var builder = BUILDERS[def.type] || BUILDERS.box;
  var grp = builder(def.color, [def.w, def.h, def.d]);
  grp.userData.def = def;
  grp.userData.w = def.w;
  grp.userData.h = def.h;
  grp.userData.d = def.d;
  return grp;
}

/* ============== Add / delete ============== */
function getSpawnPos(){
  var dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
  dir.y = 0;
  dir.normalize();
  var pos = APP.player.pos.clone().add(dir.multiplyScalar(2.5));
  pos.y = 0;
  var mx = APP.roomW/2 - 0.6;
  var mz = APP.roomD/2 - 0.6;
  pos.x = clamp(pos.x, -mx, mx);
  pos.z = clamp(pos.z, -mz, mz);
  return pos;
}

function addObject(def, pos){
  if(!def){ showToast('Escolha um item no catálogo primeiro'); return; }
  pos = pos || getSpawnPos();
  var obj = buildObject(def);
  obj.position.copy(pos);
  obj.userData.uid = ++APP._id;
  objectsGroup.add(obj);
  APP.objects.push(obj);
  updateCount();
  showToast('Adicionado: ' + def.name);
}

function addAtCrosshair(){
  if(APP.currentPick){
    addObject(APP.currentPick);
  } else {
    var list = getCatList(APP.currentCat);
    if(list && list.length){
      addObject(list[0]);
    } else {
      showToast('Nenhum item disponível');
    }
  }
}

function deleteSelected(){
  if(!APP.selected){ showToast('Nada selecionado'); return; }
  var idx = APP.objects.indexOf(APP.selected);
  if(idx >= 0) APP.objects.splice(idx, 1);
  objectsGroup.remove(APP.selected);
  disposeNode(APP.selected);
  APP.selected = null;
  updateCount();
  refreshProps();
  showToast('Removido');
}

function clearRoom(){
  if(!confirm('Apagar todos os objetos do quarto?')) return;
  for(var i=APP.objects.length-1;i>=0;i--){
    objectsGroup.remove(APP.objects[i]);
    disposeNode(APP.objects[i]);
  }
  APP.objects = [];
  APP.selected = null;
  updateCount();
  refreshProps();
  showToast('Quarto limpo');
}

function updateCount(){
  var el = $('ocount');
  if(el) el.textContent = APP.objects.length;
}

/* ============== Selection / raycast ============== */
function pickObject(){
  raycaster.setFromCamera({x:0, y:0}, camera);
  var hits = raycaster.intersectObjects(objectsGroup.children, true);
  if(hits.length){
    var top = hits[0].object;
    while(top.parent && top.parent !== objectsGroup) top = top.parent;
    if(top.parent === objectsGroup){
      APP.selected = top;
      refreshProps();
      showToast('Selecionado: ' + (top.userData.def ? top.userData.def.name : 'objeto'));
      return;
    }
  }
  APP.selected = null;
  refreshProps();
}

/* ============== Properties panel ============== */
function refreshProps(){
  var body = $('propsBody');
  if(!body) return;
  if(!APP.selected){
    body.innerHTML = '<div class="empty">Nenhum objeto selecionado.<br>Toque em um objeto ou adicione um novo.</div>';
    return;
  }
  var o = APP.selected;
  var d = o.userData.def || {};
  var xMax = (APP.roomW/2 - 0.3).toFixed(1);
  var zMax = (APP.roomD/2 - 0.3).toFixed(1);

  var html = '';
  html += '<div class="field"><label>Nome</label><input type="text" id="pName" value="' + (d.name||'Objeto') + '"></div>';
  html += '<div class="field"><label>Cor</label><input type="color" id="pColor" value="' + (d.color||'#ffffff') + '"></div>';
  html += '<div class="field"><label>Posição X</label><input type="range" id="pX" min="-' + xMax + '" max="' + xMax + '" step="0.05" value="' + o.position.x.toFixed(2) + '"></div>';
  html += '<div class="field"><label>Posição Z</label><input type="range" id="pZ" min="-' + zMax + '" max="' + zMax + '" step="0.05" value="' + o.position.z.toFixed(2) + '"></div>';
  html += '<div class="field"><label>Rotação Y (' + Math.round((o.rotation.y*180/Math.PI)) + '°)</label><input type="range" id="pRY" min="0" max="360" step="1" value="' + ((o.rotation.y*180/Math.PI).toFixed(0)) + '"></div>';
  html += '<div class="field"><label>Escala</label><input type="range" id="pS" min="0.3" max="3" step="0.05" value="' + o.scale.x.toFixed(2) + '"></div>';
  html += '<div class="row3">';
  html += '<button class="tbtn" onclick="rotateSel(-15)">-15&#176;</button>';
  html += '<button class="tbtn" onclick="rotateSel(15)">+15&#176;</button>';
  html += '<button class="tbtn" onclick="duplicateSel()">Dup</button>';
  html += '</div>';
  html += '<div class="row2" style="margin-top:8px">';
  html += '<button class="tbtn er" onclick="deleteSelected()">Apagar</button>';
  html += '<button class="tbtn" onclick="deselect()">Desselec.</button>';
  html += '</div>';

  body.innerHTML = html;

  var nameEl = $('pName'); if(nameEl) nameEl.oninput = function(){ if(o.userData.def) o.userData.def.name = this.value; };
  var colEl = $('pColor'); if(colEl) colEl.oninput = function(){
    var c = this.value;
    o.traverse(function(child){
      if(child.isMesh && child.material){
        if(Array.isArray(child.material)) child.material.forEach(function(m){ if(m.color) m.color.set(c); });
        else if(child.material.color) child.material.color.set(c);
      }
    });
    if(o.userData.def) o.userData.def.color = c;
  };
  var xEl = $('pX'); if(xEl) xEl.oninput = function(){ o.position.x = parseFloat(this.value); };
  var zEl = $('pZ'); if(zEl) zEl.oninput = function(){ o.position.z = parseFloat(this.value); };
  var rEl = $('pRY'); if(rEl) rEl.oninput = function(){ o.rotation.y = parseFloat(this.value) * Math.PI / 180; };
  var sEl = $('pS'); if(sEl) sEl.oninput = function(){ var s = parseFloat(this.value); o.scale.set(s, s, s); };
}

function rotateSel(deg){
  if(!APP.selected) return;
  APP.selected.rotation.y += deg * Math.PI / 180;
  refreshProps();
}

function duplicateSel(){
  if(!APP.selected) return;
  var src = APP.selected;
  var d = src.userData.def;
  if(!d) return;
  var copyDef = JSON.parse(JSON.stringify(d));
  var pos = src.position.clone();
  pos.x += 0.6;
  pos.z += 0.6;
  addObject(copyDef, pos);
}

function deselect(){
  APP.selected = null;
  refreshProps();
}

/* ============== Joystick ============== */
function setupJoystick(baseEl, stickEl, onChange){
  if(!baseEl || !stickEl) return;
  var active = false;
  var activeId = null;
  var cx = 0, cy = 0, R = 60;

  function start(x, y){
    var r = baseEl.getBoundingClientRect();
    cx = r.left + r.width/2;
    cy = r.top + r.height/2;
    R = r.width/2 - 24;
    if(R < 20) R = 40;
    active = true;
    move(x, y);
  }

  function move(x, y){
    var dx = x - cx;
    var dy = y - cy;
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d > R){ dx = dx / d * R; dy = dy / d * R; }
    stickEl.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    onChange(dx / R, dy / R);
  }

  function end(){
    active = false;
    activeId = null;
    stickEl.style.transform = 'translate(-50%, -50%)';
    onChange(0, 0);
  }

  baseEl.addEventListener('touchstart', function(e){
    e.preventDefault();
    if(activeId !== null) return;
    var t = e.changedTouches[0];
    activeId = t.identifier;
    start(t.clientX, t.clientY);
  }, {passive:false});

  baseEl.addEventListener('touchmove', function(e){
    if(!active || activeId === null) return;
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if(t.identifier === activeId){ move(t.clientX, t.clientY); break; }
    }
  }, {passive:false});

  baseEl.addEventListener('touchend', function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier === activeId){ end(); return; }
    }
  });
  baseEl.addEventListener('touchcancel', end);

  baseEl.addEventListener('mousedown', function(e){
    e.preventDefault();
    if(activeId !== null) return;
    activeId = 'mouse';
    start(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', function(e){
    if(active && activeId === 'mouse') move(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', function(){
    if(active && activeId === 'mouse') end();
  });
}

/* ============== Look controls ============== */
function setupLookControls(){
  var dragging = false;
  var lastX = 0, lastY = 0;
  var sens = 0.0025;

  function isOnJoystick(target){
    return target && target.closest && target.closest('.joystick');
  }

  renderer.domElement.addEventListener('mousedown', function(e){
    if(isOnJoystick(e.target)) return;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  document.addEventListener('mousemove', function(e){
    if(!dragging) return;
    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    APP.player.yaw -= dx * sens;
    APP.player.pitch -= dy * sens;
    APP.player.pitch = clamp(APP.player.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
  });
  document.addEventListener('mouseup', function(){ dragging = false; });

  var touchId = null;
  var tLastX = 0, tLastY = 0;

  renderer.domElement.addEventListener('touchstart', function(e){
    if(isOnJoystick(e.target)) return;
    if(touchId !== null) return;
    var t = e.changedTouches[0];
    touchId = t.identifier;
    tLastX = t.clientX;
    tLastY = t.clientY;
  }, {passive:false});

  renderer.domElement.addEventListener('touchmove', function(e){
    if(touchId === null) return;
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if(t.identifier === touchId){
        var dx = t.clientX - tLastX;
        var dy = t.clientY - tLastY;
        tLastX = t.clientX;
        tLastY = t.clientY;
        APP.player.yaw -= dx * sens * 0.9;
        APP.player.pitch -= dy * sens * 0.9;
        APP.player.pitch = clamp(APP.player.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
        break;
      }
    }
  }, {passive:false});

  renderer.domElement.addEventListener('touchend', function(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier === touchId){ touchId = null; return; }
    }
  });

  /* click → selecionar em modo edit */
  renderer.domElement.addEventListener('click', function(e){
    if(APP.mode === 'edit' && !isOnJoystick(e.target)) pickObject();
  });
}

/* ============== Player update ============== */
function updatePlayer(dt){
  var jx = APP.joyL.x;
  var jy = APP.joyL.y;

  var kx = 0, kz = 0;
  if(APP.keys['w'] || APP.keys['arrowup'])    kz -= 1;
  if(APP.keys['s'] || APP.keys['arrowdown'])  kz += 1;
  if(APP.keys['a'] || APP.keys['arrowleft'])  kx -= 1;
  if(APP.keys['d'] || APP.keys['arrowright']) kx += 1;

  var mx = kx + jx;
  var mz = kz + jy;

  var len = Math.sqrt(mx*mx + mz*mz);
  if(len > 1){ mx /= len; mz /= len; }

  var speed = 3.0;
  if(APP.keys['shift']) speed = 5.5;

  var dir = new THREE.Vector3(mx, 0, mz);
  dir.applyEuler(new THREE.Euler(0, APP.player.yaw, 0, 'YXZ'));
  dir.multiplyScalar(speed * dt);

  var newX = APP.player.pos.x + dir.x;
  var newZ = APP.player.pos.z + dir.z;

  var limX = APP.roomW/2 - APP.player.radius;
  var limZ = APP.roomD/2 - APP.player.radius;
  newX = clamp(newX, -limX, limX);
  newZ = clamp(newZ, -limZ, limZ);

  for(var i=0;i<APP.objects.length;i++){
    var o = APP.objects[i];
    var ow = (o.userData.w || 0.5) * o.scale.x;
    var od = (o.userData.d || 0.5) * o.scale.z;
    var ox = o.position.x;
    var oz = o.position.z;
    var pr = APP.player.radius;

    if(newX + pr > ox - ow/2 && newX - pr < ox + ow/2 &&
       newZ + pr > oz - od/2 && newZ - pr < oz + od/2){
      var dxr = (newX < ox) ? (ox - ow/2) - (newX + pr) : (ox + ow/2) - (newX - pr);
      var dzr = (newZ < oz) ? (oz - od/2) - (newZ + pr) : (oz + od/2) - (newZ - pr);
      if(Math.abs(dxr) < Math.abs(dzr)) newX += dxr;
      else newZ += dzr;
    }
  }

  APP.player.pos.x = newX;
  APP.player.pos.z = newZ;
  APP.player.pos.y = APP.player.height;

  camera.position.copy(APP.player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = APP.player.yaw;
  camera.rotation.x = APP.player.pitch;
  camera.rotation.z = 0;
}

/* ============== Save / load ============== */
function serializeRoom(){
  return {
    version: 2,
    roomW: APP.roomW,
    roomD: APP.roomD,
    roomH: APP.roomH,
    wallColor: APP.wallColor,
    floorColor: APP.floorColor,
    ceilColor: APP.ceilColor,
    player: {
      x: APP.player.pos.x,
      y: APP.player.pos.y,
      z: APP.player.pos.z,
      yaw: APP.player.yaw,
      pitch: APP.player.pitch
    },
    objects: APP.objects.map(function(o){
      return {
        def: o.userData.def,
        pos: [o.position.x, o.position.y, o.position.z],
        rotY: o.rotation.y,
        scale: o.scale.x
      };
    })
  };
}

function saveRoom(){
  try{
    localStorage.setItem('roomstudio_room_v2', JSON.stringify(serializeRoom()));
    showToast('Sala salva (' + APP.objects.length + ' objetos)');
  }catch(e){ showToast('Erro ao salvar'); }
}

function loadRoom(){
  try{
    var raw = localStorage.getItem('roomstudio_room_v2') || localStorage.getItem('roomstudio_room');
    if(!raw){ showToast('Nenhum save encontrado'); return; }
    applyRoomData(JSON.parse(raw));
    showToast('Sala carregada');
  }catch(e){ showToast('Erro ao carregar'); }
}

function exportRoom(){
  try{
    var blob = new Blob([JSON.stringify(serializeRoom(), null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'room3d.json';
    a.click();
    showToast('Exportado');
  }catch(e){ showToast('Erro ao exportar'); }
}

function clearRoomSilent(){
  for(var i=APP.objects.length-1;i>=0;i--){
    objectsGroup.remove(APP.objects[i]);
    disposeNode(APP.objects[i]);
  }
  APP.objects = [];
  APP.selected = null;
}

function applyRoomData(data){
  clearRoomSilent();
  if(data.roomW) APP.roomW = data.roomW;
  if(data.roomD) APP.roomD = data.roomD;
  if(data.roomH) APP.roomH = data.roomH;
  if(data.wallColor) APP.wallColor = data.wallColor;
  if(data.floorColor) APP.floorColor = data.floorColor;
  if(data.ceilColor) APP.ceilColor = data.ceilColor;
  buildRoom();
  if(data.player){
    APP.player.pos.set(data.player.x || 0, APP.player.height, data.player.z || 0);
    APP.player.yaw = data.player.yaw || 0;
    APP.player.pitch = data.player.pitch || 0;
  }
  if(data.objects){
    data.objects.forEach(function(o){
      var def = o.def || {name:'Objeto', type:'box', color:'#aaa', w:0.5, h:0.5, d:0.5};
      var obj = buildObject(def);
      if(o.pos) obj.position.set(o.pos[0], o.pos[1] || 0, o.pos[2]);
      if(o.rotY) obj.rotation.y = o.rotY;
      if(o.scale) obj.scale.set(o.scale, o.scale, o.scale);
      objectsGroup.add(obj);
      APP.objects.push(obj);
    });
  }
  updateCount();
}

/* ============== Main loop ============== */
function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);

  if(APP.joyR.x !== 0 || APP.joyR.y !== 0){
    APP.player.yaw   -= APP.joyR.x * 2.5 * dt;
    APP.player.pitch -= APP.joyR.y * 2.5 * dt;
    APP.player.pitch = clamp(APP.player.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
  }

  if(APP.mode === 'walk'){
    updatePlayer(dt);
  } else {
    camera.position.copy(APP.player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = APP.player.yaw;
    camera.rotation.x = APP.player.pitch;
  }

  APP.frameCount++;
  var now = performance.now();
  if(now - APP.lastFpsTime > 500){
    APP.fps = Math.round(APP.frameCount * 1000 / (now - APP.lastFpsTime));
    APP.frameCount = 0;
    APP.lastFpsTime = now;
    var el = $('fps'); if(el) el.textContent = APP.fps;
    var ex = $('px'); if(ex) ex.textContent = APP.player.pos.x.toFixed(1);
    var ey = $('py'); if(ey) ey.textContent = APP.player.pos.y.toFixed(1);
    var ez = $('pz'); if(ez) ez.textContent = APP.player.pos.z.toFixed(1);
  }

  renderer.render(scene, camera);
}

/* ============== Boot ============== */
function boot(){
  try{
    if(typeof THREE === 'undefined'){
      throw new Error('Three.js não carregou. Verifique sua conexão com a internet.');
    }
    if(typeof CAT_FURNITURE === 'undefined'){
      throw new Error('Catálogos não carregaram. Recarregue a página.');
    }

    initThree();
    buildRoom();

    APP.player.pos = new THREE.Vector3(0, APP.player.height, APP.roomD/2 - 1);
    APP.player.yaw = Math.PI;
    APP.player.pitch = -0.05;

    setupLookControls();
    setupKeyboard();
    setupJoystick($('joyL'), $('stickL'), function(x, y){ APP.joyL.x = x; APP.joyL.y = y; });
    setupJoystick($('joyR'), $('stickR'), function(x, y){ APP.joyR.x = x; APP.joyR.y = y; });

    buildSbTabs();
    buildSbBody();

    window.addEventListener('resize', function(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* Objetos iniciais de demonstração */
    addObject({name:'Cama Casal', type:'bed', color:'#8a5230', w:1.55, h:0.55, d:2.05}, new THREE.Vector3(-3.5, 0, -3));
    addObject({name:'Guarda-Roupa', type:'wardrobe', color:'#5a3a1e', w:1.2, h:2.2, d:0.6}, new THREE.Vector3(-3.5, 0, 0.5));
    addObject({name:'Mesa Centro', type:'table', color:'#6b4a28', w:1.1, h:0.42, d:0.6}, new THREE.Vector3(0, 0, 0));
    addObject({name:'Sofá 3 Lug', type:'sofa', color:'#3a3a4a', w:2.4, h:0.85, d:0.95}, new THREE.Vector3(0, 0, 3));
    addObject({name:'TV Painel', type:'tv', color:'#1a1a1a', w:1.2, h:0.7, d:0.08}, new THREE.Vector3(0, 0, -4.8));
    addObject({name:'Estante', type:'shelf', color:'#3a2818', w:0.9, h:1.8, d:0.35}, new THREE.Vector3(3, 0, -3));
    addObject({name:'Planta', type:'plant', color:'#2a6a2a', w:0.5, h:1.1, d:0.5}, new THREE.Vector3(3.5, 0, 3));

    var loading = $('loading');
    if(loading) setTimeout(function(){ loading.classList.add('hide'); }, 300);

    animate();

  }catch(err){
    console.error(err);
    var errEl = $('loadErr');
    if(errEl) errEl.textContent = err.message || String(err);
    var msgEl = $('loadMsg');
    if(msgEl) msgEl.textContent = 'Erro ao iniciar';
  }
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(boot, 50);
} else {
  window.addEventListener('load', boot);
}
</script>
