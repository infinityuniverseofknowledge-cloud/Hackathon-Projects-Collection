   ================================================================ */
registerModule('geodesic',{
  title:'Geodesic Distance',
  icon:'📏',
  desc:'Great-circle distance between two points. Haversine on sphere, Vincenty on WGS84 ellipsoid.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var g=STATE.geodesic;
    g.haversine=haversine(g.a.lat,g.a.lon,g.b.lat,g.b.lon);
    g.vincenty=vincenty(g.a.lat,g.a.lon,g.b.lat,g.b.lon);
    g.bearing=initialBearing(g.a.lat,g.a.lon,g.b.lat,g.b.lon);
    /* Generate waypoints along great circle */
    g.points=[];
    var N=64;
    var d=g.haversine/EARTH_RADIUS_KM;
    var lat1=g.a.lat*DEG2RAD,lon1=g.a.lon*DEG2RAD;
    var lat2=g.b.lat*DEG2RAD,lon2=g.b.lon*DEG2RAD;
    for(var i=0;i<=N;i++){
      var f=i/N;
      var A=Math.sin((1-f)*d)/Math.sin(d);
      var B=Math.sin(f*d)/Math.sin(d);
      if(d<1e-9){g.points.push({lat:g.a.lat,lon:g.a.lon});continue;}
      var x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
      var y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
      var z=A*Math.sin(lat1)+B*Math.sin(lat2);
      var lat=Math.atan2(z,Math.sqrt(x*x+y*y))*RAD2DEG;
      var lon=Math.atan2(y,x)*RAD2DEG;
      g.points.push({lat:lat,lon:lon});
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var g=STATE.geodesic;
    /* Set up projection — use orthographic centered on midpoint */
    var midLat=(g.a.lat+g.b.lat)/2;
    var midLon=(g.a.lon+g.b.lon)/2;
    if(Math.abs(g.a.lon-g.b.lon)>180)midLon=(g.a.lon+g.b.lon)/2+180;
    var proj=PROJECTIONS.orthographic;
    proj.center.lon=midLon;
    proj.center.lat=midLat;
    var W2=Math.min(W,H)*0.85;
    var cx=W/2,cy=H/2;
    function toScreen(lon,lat){
      var c=proj.forward.call(proj,lon,lat);
      if(!isFinite(c.x))return null;
      return {x:cx+c.x*W2*0.5,y:cy+c.y*W2*0.5};
    }
    /* Globe outline */
    ctx.strokeStyle='rgba(64,255,176,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(cx,cy,W2*0.5,0,Math.PI*2);
    ctx.stroke();
    /* Graticule */
    ctx.strokeStyle='rgba(64,255,176,.12)';
    ctx.lineWidth=1;
    for(var lat=-60;lat<=60;lat+=30){
      ctx.beginPath();
      var started=false;
      for(var lon=-180;lon<=180;lon+=5){
        var sp=toScreen(lon,lat);
        if(!sp)continue;
        if(!started){ctx.moveTo(sp.x,sp.y);started=true;}
        else ctx.lineTo(sp.x,sp.y);
      }
      ctx.stroke();
    }
    for(var lon2=-150;lon2<=180;lon2+=30){
      ctx.beginPath();
      var started2=false;
      for(var lat2=-85;lat2<=85;lat2+=5){
        var sp2=toScreen(lon2,lat2);
        if(!sp2)continue;
        if(!started2){ctx.moveTo(sp2.x,sp2.y);started2=true;}
        else ctx.lineTo(sp2.x,sp2.y);
      }
      ctx.stroke();
    }
    /* Continents */
    ctx.fillStyle='rgba(40,180,120,.3)';
    ctx.strokeStyle='rgba(64,255,176,.5)';
    ctx.lineWidth=1;
    CONTINENT_DATA.forEach(function(poly){
      ctx.beginPath();
      var started=false;
      poly.forEach(function(pt){
        var sp=toScreen(pt[0],pt[1]);
        if(!sp)return;
        if(!started){ctx.moveTo(sp.x,sp.y);started=true;}
        else ctx.lineTo(sp.x,sp.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    });
    /* Great circle path */
    if(g.showGreatCircle&&g.points.length>0){
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=2.5;
      ctx.beginPath();
      g.points.forEach(function(pt,i){
        var sp=toScreen(pt.lon,pt.lat);
        if(!sp)return;
        if(i===0)ctx.moveTo(sp.x,sp.y);else ctx.lineTo(sp.x,sp.y);
      });
      ctx.stroke();
      /* Dashed midpoint marker */
      if(g.points.length>2){
        var mid=g.points[Math.floor(g.points.length/2)];
        var msp=toScreen(mid.lon,mid.lat);
        if(msp){
          ctx.fillStyle='#40d0ff';
          ctx.beginPath();ctx.arc(msp.x,msp.y,5,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        }
      }
    }
    /* Markers */
    var pa=toScreen(g.a.lon,g.a.lat);
    var pb=toScreen(g.b.lon,g.b.lat);
    if(pa){
      ctx.fillStyle='#40ffb0';
      ctx.beginPath();ctx.arc(pa.x,pa.y,10,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#04090c';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('A',pa.x,pa.y+1);
      ctx.textBaseline='alphabetic';
    }
    if(pb){
      ctx.fillStyle='#ff5060';
      ctx.beginPath();ctx.arc(pb.x,pb.y,10,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#04090c';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('B',pb.x,pb.y+1);
      ctx.textBaseline='alphabetic';
    }
    /* Info panel */
    ctx.fillStyle='rgba(8,18,15,.9)';
    ctx.strokeStyle='rgba(64,255,176,.4)';
    ctx.beginPath();ctx.roundRect(20,H-180,320,160,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40ffb0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('GEODESIC MEASUREMENTS',32,H-160);
    ctx.font='11px monospace';
    ctx.fillStyle='#d8f0e8';
    ctx.fillText('Haversine (sphere):',32,H-136);
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.fillText(fmt(g.haversine,2)+' km',180,H-136);
    ctx.fillStyle='#d8f0e8';
    ctx.font='11px monospace';
    ctx.fillText('Vincenty (WGS84):',32,H-116);
    ctx.fillStyle='#ffe040';
    ctx.font='bold 12px monospace';
    ctx.fillText(fmt(g.vincenty.distance,2)+' km',180,H-116);
    ctx.fillStyle='#d8f0e8';
    ctx.font='11px monospace';
    ctx.fillText('Bearing (initial):',32,H-96);
    ctx.fillStyle='#ff5060';
    ctx.font='bold 12px monospace';
    ctx.fillText(fmt(g.bearing,2)+'°',180,H-96);
    ctx.fillStyle='#d8f0e8';
    ctx.font='11px monospace';
    ctx.fillText('Difference:',32,H-76);
    ctx.fillStyle='#a060ff';
    ctx.fillText(fmt(Math.abs(g.haversine-g.vincenty.distance),4)+' km',180,H-76);
    /* Compare values */
    ctx.fillStyle='#d8f0e8';
    ctx.fillText('Δ distance / Earth R:',32,H-56);
    ctx.fillStyle='#40ffb0';
    ctx.fillText(fmt(g.haversine/EARTH_RADIUS_KM,4)+' rad ('+fmt(g.haversine/EARTH_RADIUS_KM*RAD2DEG,2)+'°)',180,H-56);
    ctx.fillStyle='#d8f0e8';
    ctx.fillText('Initial bearing:',32,H-36);
    ctx.fillStyle='#40d0ff';
    ctx.fillText(fmt(g.vincenty.initialBearing,2)+'° / final '+fmt(g.vincenty.finalBearing,2)+'°',180,H-36);
    setStatsHTML(
      '<div>Haversine: '+fmt(g.haversine,1)+' km</div>'+
      '<div>Vincenty: '+fmt(g.vincenty.distance,1)+' km</div>'+
      '<div>Bearing: '+fmt(g.bearing,1)+'°</div>'+
      '<div>ΔR: '+fmt(g.haversine/EARTH_RADIUS_KM,4)+' rad</div>'
    );
    updateBadge('📏 Geodesic · '+fmt(g.vincenty.distance,0)+' km');
    $('sbMode').textContent='Geodesic';
    $('sbPts').textContent=g.points.length;
  },
  onDown:function(p){
    /* Pick nearest marker and drag */
    var W=CANV.W,H=CANV.H;
    var g=STATE.geodesic;
    var midLat=(g.a.lat+g.b.lat)/2;
    var midLon=(g.a.lon+g.b.lon)/2;
    var proj=PROJECTIONS.orthographic;
    proj.center.lon=midLon;proj.center.lat=midLat;
    var W2=Math.min(W,H)*0.85;
    var cx=W/2,cy=H/2;
    function toScreen(lon,lat){
      var c=proj.forward.call(proj,lon,lat);
      if(!isFinite(c.x))return null;
      return {x:cx+c.x*W2*0.5,y:cy+c.y*W2*0.5};
    }
    var pa=toScreen(g.a.lon,g.a.lat);
    var pb=toScreen(g.b.lon,g.b.lat);
    if(pa&&Math.hypot(pa.x-p.x,pa.y-p.y)<20)g.drag='a';
    else if(pb&&Math.hypot(pb.x-p.x,pb.y-p.y)<20)g.drag='b';
  },
  onMove:function(p){
    var g=STATE.geodesic;
    if(!INPUT.down||!g.drag)return;
    var W=CANV.W,H=CANV.H;
    var midLat=(g.a.lat+g.b.lat)/2;
    var midLon=(g.a.lon+g.b.lon)/2;
    var proj=PROJECTIONS.orthographic;
    proj.center.lon=midLon;proj.center.lat=midLat;
    var W2=Math.min(W,H)*0.85;
    var cx=W/2,cy=H/2;
    var nx=(p.x-cx)/(W2*0.5);
    var ny=(p.y-cy)/(W2*0.5);
    if(nx*nx+ny*ny>1)return;
    var ll=proj.inverse.call(proj,nx,ny);
    if(!isFinite(ll.lon)||!isFinite(ll.lat))return;
    g[g.drag].lat=clamp(ll.lat,-89,89);
    g[g.drag].lon=ll.lon;
    this.compute();
  },
  onUp:function(){STATE.geodesic.drag=null;},
  controls:function(){
    var g=STATE.geodesic;
    var html='';
    html+='<div class="sec"><h4>Point A ('+esc(g.a.name)+')</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Latitude</span><span>'+fmt(g.a.lat,4)+'°</span></div>';
    html+='<input type="range" min="-85" max="85" step="0.5" value="'+g.a.lat+'" oninput="STATE.geodesic.a.lat=parseFloat(this.value);MODULES.geodesic.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Longitude</span><span>'+fmt(g.a.lon,4)+'°</span></div>';
    html+='<input type="range" min="-180" max="180" step="1" value="'+g.a.lon+'" oninput="STATE.geodesic.a.lon=parseFloat(this.value);MODULES.geodesic.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Point B ('+esc(g.b.name)+')</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Latitude</span><span>'+fmt(g.b.lat,4)+'°</span></div>';
    html+='<input type="range" min="-85" max="85" step="0.5" value="'+g.b.lat+'" oninput="STATE.geodesic.b.lat=parseFloat(this.value);MODULES.geodesic.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Longitude</span><span>'+fmt(g.b.lon,4)+'°</span></div>';
    html+='<input type="range" min="-180" max="180" step="1" value="'+g.b.lon+'" oninput="STATE.geodesic.b.lon=parseFloat(this.value);MODULES.geodesic.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="setGeoPair(\'London\',51.5074,-0.1278,\'New York\',40.7128,-74.0060)">London → New York</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setGeoPair(\'Tokyo\',35.6895,139.6917,\'Sydney\',-33.8688,151.2093)">Tokyo → Sydney</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setGeoPair(\'São Paulo\',-23.5505,-46.6333,\'Cape Town\',-33.9249,18.4241)">São Paulo → Cape Town</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setGeoPair(\'North Pole\',89,0,\'South Pole\',-89,0)">Pole to Pole</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setGeoPair(\'Equator\',0,0,\'Equator+\',0,90)">Along equator (90°)</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var g=STATE.geodesic;
    return '<div class="sec"><h4>Haversine Formula</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'a = sin²(Δφ/2) + cos(φ₁)·cos(φ₂)·sin²(Δλ/2)<br>'+
      'd = 2R·atan2(√a, √(1−a))<br><br>'+
      'R = 6371 km (mean Earth radius)<br><br>'+
      'Assumes spherical Earth. Accurate to ~0.5% for most distances.'+
      '</div></div>'+
      '<div class="sec"><h4>Vincenty Formula</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Iterative solution using WGS84 ellipsoid:<br>'+
      'a = 6378.137 km (equatorial)<br>'+
      'b = 6356.752 km (polar)<br>'+
      'f = 1/298.257 (flattening)<br><br>'+
      'Converges in ~5 iterations. Accuracy ~0.5 mm.'+
      '</div></div>'+
      '<div class="sec"><h4>Results</h4><div class="kv">'+
      '<div class="row"><span class="k">Haversine</span><span class="v">'+fmt(g.haversine,2)+' km</span></div>'+
      '<div class="row"><span class="k">Vincenty</span><span class="v">'+fmt(g.vincenty.distance,2)+' km</span></div>'+
      '<div class="row"><span class="k">Initial bearing</span><span class="v">'+fmt(g.bearing,2)+'°</span></div>'+
      '<div class="row"><span class="k">Final bearing</span><span class="v">'+fmt(g.vincenty.finalBearing,2)+'°</span></div>'+
      '<div class="row"><span class="k">Angular distance</span><span class="v">'+fmt(g.haversine/EARTH_RADIUS_KM*RAD2DEG,3)+'°</span></div>'+
      '</div></div>';
  }
});
function setGeoPair(nameA,latA,lonA,nameB,latB,lonB){
  STATE.geodesic.a={name:nameA,lat:latA,lon:lonA};
  STATE.geodesic.b={name:nameB,lat:latB,lon:lonB};
  MODULES.geodesic.compute();
  renderLeftPanel();
}

<script>
/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'world',icon:'🌍',label:'World Map'},
  {key:'interp',icon:'🗻',label:'Interpolation'},
  {key:'contour',icon:'⛰️',label:'Contours'},
  {key:'triangulation',icon:'△',label:'Delaunay'},
  {key:'cluster',icon:'🔵',label:'Clustering'},
  {key:'geodesic',icon:'📏',label:'Geodesic'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Cursor lon</span><span class="v">'+fmt(STATE.cursorLon,3)+'°</span></div>'+
      '<div class="row"><span class="k">Cursor lat</span><span class="v">'+fmt(STATE.cursorLat,3)+'°</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--c4)':l.type==='success'?'var(--c1)':'var(--c2)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['atlas','paper','sunset'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    world:{projection:STATE.world.projection,zoom:STATE.world.zoom,centerLon:STATE.world.centerLon,centerLat:STATE.world.centerLat},
    interp:{method:STATE.interp.method,points:STATE.interp.points.length},
    contour:{terrain:STATE.contour.terrain,levels:STATE.contour.levels},
    triangulation:{numPoints:STATE.triangulation.numPoints,distribution:STATE.triangulation.distribution},
    cluster:{eps:STATE.cluster.eps,minPts:STATE.cluster.minPts},
    geodesic:{a:STATE.geodesic.a,b:STATE.geodesic.b}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='geo-config.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Config exported','success');
}

}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key>='1'&&e.key<='6'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Loading 8 map projections...',
  'Compiling WGS84 ellipsoid constants...',
  'Initializing Haversine + Vincenty solvers...',
  'Preparing Kriging variogram models...',
  'Building marching squares lookup tables...',
  'Warming up Delaunay triangulation...',
  'Preparing DBSCAN spatial index...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('GEO ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('GEO initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
