/* ---------- TERMINAL (bottom dock) ---------- */
function termWriteMain(msg,cls){
  var out=$('termOut');
  if(!out)return;
  var line=el('div',{class:'term-line '+(cls||'')});
  line.innerHTML=msg;
  out.appendChild(line);
  out.scrollTop=out.scrollHeight;
}

function executeShell(line){
  var parts=line.trim().match(/(?:[^\s"]+|"[^"]*")+/g)||[];
  if(!parts.length)return null;
  var cmd=parts[0];var args=parts.slice(1).map(function(a){return a.replace(/^"|"$/g,'');});
  var tree=currentTree();

  try{
    switch(cmd){
      case 'help': return 'Commands: help, ls, tree, new, load, gen, algo, stat, save, load-store, export, sample, clear, theme, quit';
      case 'ls': {
        if(!tree)return 'No tree loaded.';
        return tree.name+' ('+TreeOps.count(tree.root)+' nodes, depth '+TreeOps.depth(tree.root)+')';
      }
      case 'tree': {
        if(!tree)return 'No tree loaded.';
        var lines=[];
        lines.push(tree.root.name);
        (function rec(n,pre){
          var kids=n.children||[];
          kids.forEach(function(c,i){
            var last=i===kids.length-1;
            lines.push(pre+(last?'└── ':'├── ')+c.name);
            rec(c,pre+(last?'    ':'│   '));
          });
        })(tree.root,'');
        return '<pre style="margin:0;font-family:var(--mono);font-size:.7rem;line-height:1.5">'+esc(lines.join('\n'))+'</pre>';
      }
      case 'new': {
        var name=args.join(' ')||('Tree_'+new Date().toTimeString().substr(0,5).replace(/:/g,''));
        var root=makeNode(name);
        var t={id:uid('t'),name:name,root:root,meta:{created:Date.now()}};
        STATE.trees[t.id]=t;STATE.currentTreeId=t.id;
        renderNav();renderInspector();refreshModule();
        return '<span class="ok">Created tree: '+esc(name)+'</span>';
      }
      case 'load': {
        var key=args[0];
        if(!key)return '<span class="err">Usage: load &lt;template-key&gt; | load gen:&lt;generator-key&gt;</span>';
        if(key.indexOf('gen:')===0){createFromGenerator(key.substr(4),args.slice(1).map(function(x){return parseInt(x);}));return '<span class="ok">Generated</span>';}
        if(TEMPLATES[key]){createFromTemplate(key);return '<span class="ok">Loaded template: '+key+'</span>';}
        return '<span class="err">Unknown template: '+esc(key)+'</span>';
      }
      case 'templates': return Object.keys(TEMPLATES).join(', ');
      case 'generators': return Object.keys(GENERATORS).join(', ');
      case 'gen': {
        var g=args[0];
        if(!g)return 'Usage: gen &lt;name&gt; [args]';
        if(!GENERATORS[g])return '<span class="err">Unknown: '+esc(g)+'</span>';
        createFromGenerator(g,args.slice(1).map(function(x){return parseInt(x);}));
        return '<span class="ok">Generated: '+esc(g)+'</span>';
      }
      case 'algo': {
        var a=args[0];
        if(!a)return 'Algorithms: '+Object.keys(ALGORITHMS).join(', ');
        if(!ALGORITHMS[a])return '<span class="err">Unknown: '+esc(a)+'</span>';
        if(!tree)return '<span class="err">No tree</span>';
        var r=ALGORITHMS[a].run(tree.root);
        var out='<span class="ok">Result: '+esc(String(r.result||'—'))+'</span>';
        r.steps.slice(0,20).forEach(function(s){out+='\n  '+esc(s.msg);});
        return out;
      }
      case 'stat': {
        if(!tree)return '<span class="err">No tree</span>';
        return 'Nodes: '+TreeOps.count(tree.root)+'\nDepth: '+TreeOps.depth(tree.root)+'\nLeaves: '+TreeOps.leaves(tree.root);
      }
      case 'save': STORE.save();return '<span class="ok">State saved.</span>';
      case 'export': {
        if(!tree)return '<span class="err">No tree</span>';
        var fmt=args[0]||'json';
        var f=DATA_FORMATS[fmt];if(!f)return '<span class="err">Unknown format: '+esc(fmt)+'</span>';
        var text=f.export(tree.root);
        return '<pre style="max-height:200px;overflow:auto;font-family:var(--mono);font-size:.65rem">'+esc(text.substr(0,2000))+'</pre>';
      }
      case 'code': {
        if(!tree)return '<span class="err">No tree</span>';
        var lang=args[0]||'python';
        var l=LANGS[lang];if(!l)return '<span class="err">Unknown language: '+esc(lang)+'</span>';
        var code=l.generate(tree.root);
        return '<pre style="max-height:280px;overflow:auto;font-family:var(--mono);font-size:.65rem">'+esc(code.substr(0,2000))+'</pre>';
      }
      case 'sample': {
        var t2=createFromTemplate('filesystem');
        return '<span class="ok">Sample loaded.</span>';
      }
      case 'clear': clearConsole();return null;
      case 'theme': {
        var t=args[0];
        if(!t)return 'Themes: arbor, dark, light, cyber, amber, ocean, royal';
        document.documentElement.setAttribute('data-theme',t);
        return '<span class="ok">Theme: '+esc(t)+'</span>';
      }
      case 'sort':
        if(!tree)return '<span class="err">No tree</span>';
        TreeOps.sort(tree.root,'name');renderNav();renderVisualize();return '<span class="ok">Sorted</span>';
      case 'focus': {
        var id=args[0];
        if(!id)return '<span class="err">Usage: focus &lt;node-id&gt;</span>';
        setSelectedNode(id);return '<span class="ok">Focused: '+esc(id)+'</span>';
      }
      case 'quit': case 'exit':
        return 'Just close the tab. You can\'t quit reality either.';
      default: return '<span class="err">Unknown command: '+esc(cmd)+'. Type "help".</span>';
    }
  }catch(e){return '<span class="err">Error: '+esc(e.message)+'</span>';}
}

var BOOT_STEPS=[
  'Loading ARBORIS kernel...',
  'Mounting virtual tree store...',
  'Loading templates ('+Object.keys(TEMPLATES).length+')...',
  'Loading generators ('+Object.keys(GENERATORS).length+')...',
  'Loading code generators ('+Object.keys(LANGS).length+')...',
  'Loading algorithms ('+Object.keys(ALGORITHMS).length+')...',
  'Loading data formats ('+Object.keys(DATA_FORMATS).length+')...',
  'Initializing UI modules...',
  'Wiring terminal shell...',
  'System ready.'
];

function bootSequence(){
  var pct=0;var idx=0;
  var fill=$('bootFill');var log=$('bootLog');var pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(4,10);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('ARBORIS OS ready','success');
      },400);
    }
  },150);
}

window.addEventListener('DOMContentLoaded',function(){
  // Try to restore state
  var restored=STORE.load();
  if(!restored||!Object.keys(STATE.trees).length){
    createFromTemplate('filesystem');
  }
  buildTopbar();
  renderNav();
  renderInspector();
  switchModule('visualize');

  // Terminal input
  var ti=$('termInput');
  var hist=[];var hi=-1;
  ti.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var cmd=ti.value.trim();
      ti.value='';
      if(!cmd)return;
      termWriteMain('<span class="hi">arboris&gt;</span> '+esc(cmd),'');
      hist.push(cmd);hi=hist.length;
      var r=executeShell(cmd);
      if(r!=null)termWriteMain(r,'');
    }else if(e.key==='ArrowUp'){
      if(hist.length){hi=Math.max(0,hi-1);ti.value=hist[hi]||'';e.preventDefault();}
    }else if(e.key==='ArrowDown'){
      if(hist.length){hi=Math.min(hist.length,hi+1);ti.value=hist[hi]||'';e.preventDefault();}
    }
  });
  termWriteMain('<span class="hi">ARBORIS Shell v1.0</span>','');
  termWriteMain('Type <span class="hi">help</span> for commands, <span class="hi">sample</span> to load a demo tree.','dim');
  termWriteMain('','');

  // Global shortcuts
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
    if(e.ctrlKey&&e.code==='KeyS'){e.preventDefault();STORE.save();toast('Saved','success');}
    if(e.ctrlKey&&e.code==='KeyE'){e.preventDefault();exportQuickJSON();}
    if(e.key==='Delete'&&STATE.selectedNodeId){e.preventDefault();deleteSelected();}
    if(e.key==='F2'){e.preventDefault();renameSelected();}
    if(e.key==='Tab'&&STATE.selectedNodeId){e.preventDefault();addChildToSelected();}
  });

  // Auto-save on unload
  window.addEventListener('beforeunload',function(){STORE.save();});

  bootSequence();
});

console.log('%cTemplates: '+Object.keys(TEMPLATES).length+'  ·  Generators: '+Object.keys(GENERATORS).length+'  ·  Languages: '+Object.keys(LANGS).length+'  ·  Algorithms: '+Object.keys(ALGORITHMS).length,'color:#3ee28c');
console.log('%cData formats: '+Object.keys(DATA_FORMATS).length,'color:#52d4ff');
</script>
