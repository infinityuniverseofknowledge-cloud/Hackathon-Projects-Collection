<!DOCTYPE html>
<html lang="en" data-theme="arbor">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a120e">
<title>ARBORIS — Universal Tree Platform</title>
<style>
/* ================================================================
   ARBORIS DESIGN SYSTEM
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%}
body{height:100vh;overflow:hidden;font-family:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
canvas{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#0a120e;--bg2:#0e1a14;--bg3:#13241a;--bg4:#1a2c20;
  --panel:#0c1812;--panel2:#112018;--panel3:#17301f;--panel4:#1e3a26;
  --bd:#1e3a2a;--bd2:#2a5038;--bd3:#3a6a4a;
  --tx:#e8f5ec;--tx2:#a8c8b4;--tx3:#6a9078;--mu:#456050;
  --c1:#3ee28c;--c1h:#80ffc0;--c1l:#2aa868;--c1d:#1a6840;
  --c2:#52d4ff;--c2h:#a0e8ff;--c2l:#2a90c0;
  --c3:#ffc94a;--c3h:#ffe090;--c3l:#b88a20;
  --c4:#ff6b8a;--c4h:#ff9fb0;--c4l:#c04060;
  --c5:#b880ff;--c5h:#d0a8ff;--c5l:#8040c0;
  --c6:#40e0d0;--c6h:#80f0e8;--c6l:#20a8a0;
  --c7:#ff8a3d;--c7h:#ffb080;--c7l:#c05820;
  --c8:#7cff3d;--c8h:#b0ff80;--c8l:#4ac020;
  --c9:#ff4dd2;--c9h:#ff80e0;--c9l:#c02098;
  --c10:#40a0ff;--c10h:#80c0ff;--c10l:#2068c0;
  --ok:#3ee28c;--warn:#ffc94a;--err:#ff6b8a;--info:#52d4ff;
  --g1:linear-gradient(135deg,#3ee28c,#52d4ff);
  --g2:linear-gradient(135deg,#ff6b8a,#ffc94a);
  --g3:linear-gradient(135deg,#40e0d0,#3ee28c);
  --g4:linear-gradient(135deg,#b880ff,#ff6b8a);
  --g5:linear-gradient(135deg,#ffc94a,#ff8a3d);
  --g6:linear-gradient(135deg,#52d4ff,#b880ff);
  --gArbor:linear-gradient(120deg,#3ee28c,#52d4ff,#b880ff,#ffc94a,#3ee28c);
  --gGlass:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.5);
  --sh2:0 12px 48px rgba(0,0,0,.7);
  --shGlow:0 0 20px rgba(62,226,140,.4);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --sans:'Inter','SF Pro Display',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace;
  --disp:'Cinzel','Cormorant Garamond','Orbitron',serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
  --t3:all .4s cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{--bg:#000;--bg2:#080808;--bg3:#101010;--panel:#0c0c0c;--panel2:#141414;--panel3:#1c1c1c;--bd:#222;--bd2:#333}
[data-theme="light"]{--bg:#eef5f0;--bg2:#e0ece4;--bg3:#d0e0d8;--panel:#fff;--panel2:#f5faf7;--panel3:#e8f0ec;
  --bd:#c8d8ce;--bd2:#a8c0b0;--tx:#0a1a12;--tx2:#3a5042;--tx3:#6a8874;--mu:#90a89a}
[data-theme="cyber"]{--bg:#0a0018;--bg2:#14002a;--bg3:#1e003c;--panel:#14002a;--panel2:#1e003c;--panel3:#28004e;
  --bd:#3c006e;--bd2:#5a00a0;--bd3:#7800d0;--tx:#f0e8ff;--tx2:#c0a8ff;--tx3:#9068d0;
  --c1:#00ffff;--c1h:#80ffff;--c2:#ff00ff;--c3:#ffff00;--c4:#ff0080;
  --g1:linear-gradient(135deg,#00ffff,#ff00ff)}
[data-theme="amber"]{--bg:#1a0e00;--bg2:#281800;--bg3:#382200;--panel:#281800;--panel2:#382200;
  --bd:#684400;--bd2:#906000;--tx:#ffe8c0;--tx2:#d8b880;--tx3:#a08848;
  --c1:#ffb800;--c2:#ff6b00;--c3:#ffe040;--c4:#ff3b00;
  --g1:linear-gradient(135deg,#ffb800,#ff6b00)}
[data-theme="ocean"]{--bg:#000820;--bg2:#001030;--bg3:#001848;--panel:#001028;--panel2:#001840;
  --bd:#003878;--bd2:#0050a8;--tx:#d0e8ff;--tx2:#90c0ff;--tx3:#6090d0;
  --c1:#00a0ff;--c2:#00ffd0;--c3:#40c0ff;--c4:#0080ff;
  --g1:linear-gradient(135deg,#00a0ff,#00ffd0)}
[data-theme="royal"]{--bg:#0a0520;--bg2:#140a38;--bg3:#1e1050;--panel:#140a38;--panel2:#1e1050;
  --bd:#482890;--bd2:#6038b8;--tx:#e8d8ff;--tx2:#c0a0ff;--tx3:#9870e0;
  --c1:#a050ff;--c2:#ff50c0;--c3:#8060ff;--c4:#c040ff;
  --g1:linear-gradient(135deg,#a050ff,#ff50c0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#0a120e;z-index:10000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s;font-family:var(--mono)}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3.5rem;font-weight:900;letter-spacing:10px;
  background:var(--gArbor);background-size:300% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;animation:holo 3s linear infinite;
  margin-bottom:6px;text-shadow:0 0 40px var(--c1)}
.boot-sub{font-size:.7rem;color:var(--c3);letter-spacing:6px;margin-bottom:32px;opacity:.7}
.boot-bar{width:280px;height:3px;background:#111;border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .2s;box-shadow:0 0 12px var(--c1)}
.boot-log{font-size:.65rem;color:var(--c3);text-align:left;width:340px;height:120px;overflow:hidden;margin-top:18px;line-height:1.6}
.boot-log .ok{color:var(--c1)}.boot-log .warn{color:var(--c3)}.boot-log .err{color:var(--c4)}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:44px;background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:4px;font-size:.95rem;
  background:var(--gArbor);background-size:300% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;
  padding:0 8px 0 4px;cursor:pointer}
.tb-modules{display:flex;gap:2px;flex:1;overflow-x:auto;height:100%;align-items:center}
.tb-mod{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rxs);
  cursor:pointer;transition:var(--t1);font-size:.75rem;font-weight:600;color:var(--tx2);
  white-space:nowrap;height:32px}
.tb-mod:hover{background:var(--panel2);color:var(--tx)}
.tb-mod.active{background:var(--g1);color:#0a120e;box-shadow:0 0 16px rgba(62,226,140,.3)}
.tb-mod .m-icon{font-size:.95rem}
.tb-actions{display:flex;gap:6px;align-items:center}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);
  border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);
  display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#nav{width:240px;background:var(--panel2);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#nav.collapsed{width:44px}
.nav-head{padding:10px 12px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-title{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3)}
.nav-body{flex:1;overflow-y:auto;padding:8px}
.tree-item{padding:5px 8px;border-radius:var(--rxxs);cursor:pointer;font-size:.72rem;
  display:flex;align-items:center;gap:6px;transition:var(--t1);color:var(--tx2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-item:hover{background:var(--panel3);color:var(--tx)}
.tree-item.active{background:rgba(62,226,140,.15);color:var(--c1)}
.tree-item .ti-icon{font-size:.85rem}
.tree-item .ti-meta{margin-left:auto;font-size:.6rem;color:var(--tx3);font-family:var(--mono)}
.tree-children{margin-left:12px;border-left:1px dashed var(--bd2);padding-left:4px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
.work-toolbar{height:40px;background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:6px;padding:0 12px;flex-shrink:0;overflow-x:auto}
.wt-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);color:var(--tx);cursor:pointer;
  font-size:.7rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.wt-btn:hover{background:var(--panel3);border-color:var(--c1)}
.wt-btn.primary{background:var(--g1);color:#0a120e;border-color:transparent}
.wt-btn.primary:hover{box-shadow:0 0 16px rgba(62,226,140,.4)}
.wt-btn.danger{background:var(--panel2);color:var(--c4);border-color:var(--bd)}
.wt-btn.danger:hover{border-color:var(--c4);background:rgba(255,107,138,.1)}
.wt-sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.wt-title{font-size:.75rem;font-weight:700;margin-right:8px}
.work-body{flex:1;overflow:auto;padding:20px;position:relative}
.work-body.nopad{padding:0}

#inspector{width:280px;background:var(--panel2);border-left:1px solid var(--bd);
  display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#inspector.collapsed{width:44px}
.ins-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ins-body{flex:1;overflow-y:auto;padding:12px}
.ins-section{margin-bottom:16px}
.ins-section h4{font-size:.62rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:8px;font-weight:700}
.ins-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:.7rem;border-bottom:1px solid var(--bd)}
.ins-row:last-child{border-bottom:none}
.ins-row .ir-label{color:var(--tx3)}
.ins-row .ir-value{color:var(--tx);font-family:var(--mono);font-size:.68rem;text-align:right;word-break:break-all}
.ins-empty{text-align:center;color:var(--tx3);padding:30px 12px;font-size:.7rem}

#console{height:180px;background:var(--bg2);border-top:1px solid var(--bd);
  display:flex;flex-direction:column;flex-shrink:0;transition:height .2s}
#console.collapsed{height:28px}
.console-head{height:28px;background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0;font-size:.68rem;color:var(--tx3)}
.console-head .ch-tab{padding:3px 10px;border-radius:var(--rxxs);cursor:pointer;
  transition:var(--t1);font-weight:600;color:var(--tx3);display:flex;align-items:center;gap:5px}
.console-head .ch-tab:hover{background:var(--panel2);color:var(--tx)}
.console-head .ch-tab.active{background:var(--panel2);color:var(--c1)}
.console-head .ch-actions{margin-left:auto;display:flex;gap:4px}
.console-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.term-out{flex:1;overflow-y:auto;padding:10px 14px;
  font-family:var(--mono);font-size:.7rem;line-height:1.55;color:var(--c1);background:#000}
.term-line{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.term-line.ok{color:var(--c1)}.term-line.err{color:var(--c4)}
.term-line.warn{color:var(--c3)}.term-line.info{color:var(--c2)}
.term-line.dim{color:var(--tx3)}.term-line.hi{color:var(--c5);font-weight:700}
.term-prompt{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#000;border-top:1px solid #1a2c20}
.term-prompt .tp{color:var(--c1);font-family:var(--mono);font-weight:700;font-size:.7rem}
.term-prompt input{flex:1;background:transparent;color:var(--c1);font-family:var(--mono);font-size:.7rem;caret-color:var(--c1)}

.ws-card{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ws-card h3{font-size:.85rem;font-weight:700;margin-bottom:10px;color:var(--tx)}
.ws-card .wc-sub{font-size:.7rem;color:var(--tx3);margin-bottom:12px;line-height:1.5}
.ws-grid{display:grid;gap:10px}
.ws-grid.c2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ws-grid.c3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ws-grid.c4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:12px;text-align:center}
.stat .s-v{font-size:1.4rem;font-weight:800;font-family:var(--mono);color:var(--c1);line-height:1.1}
.stat .s-l{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:700}

.inp,.sel,.txa{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rxs);
  padding:8px 11px;color:var(--tx);font-size:.75rem;width:100%;transition:var(--t1)}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(62,226,140,.15)}
.txa{font-family:var(--mono);font-size:.7rem;line-height:1.6;resize:vertical;min-height:120px}
.lbl{font-size:.62rem;color:var(--tx3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--rxs);
  background:var(--panel2);border:1px solid var(--bd);color:var(--tx);cursor:pointer;
  font-size:.72rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.btn:hover{background:var(--panel3);border-color:var(--c1)}
.btn.primary{background:var(--g1);color:#0a120e;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 18px rgba(62,226,140,.4)}
.btn.danger{color:var(--c4)}
.btn.danger:hover{border-color:var(--c4);background:rgba(255,107,138,.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2);border-color:var(--bd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.65rem}

.list{display:flex;flex-direction:column;gap:2px}
.li{padding:8px 11px;border-radius:var(--rxs);cursor:pointer;font-size:.72rem;
  display:flex;align-items:center;gap:8px;transition:var(--t1);border:1px solid transparent}
.li:hover{background:var(--panel2);border-color:var(--bd)}
.li.active{background:rgba(62,226,140,.1);border-color:var(--c1);color:var(--c1)}
.li .li-icon{font-size:.9rem}
.li .li-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .li-meta{font-size:.6rem;color:var(--tx3);font-family:var(--mono)}

#treeCanvas{display:block;cursor:grab;user-select:none;background:var(--bg2)}
#treeCanvas.dragging{cursor:grabbing}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh2);max-width:640px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;animation:modalIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal.lg{max-width:900px}
.modal.xl{max-width:1200px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;
  color:var(--tx3);cursor:pointer;font-size:1rem;transition:var(--t1);
  display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--panel2);color:var(--c4)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);
  border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);
  font-size:.72rem;font-weight:500;max-width:340px;min-width:200px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px)}
.toast.success{border-left-color:var(--c1)}
.toast.warn{border-left-color:var(--c3)}
.toast.error{border-left-color:var(--c4)}
.toast.info{border-left-color:var(--c2)}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;font-size:.72rem;font-weight:600;
  color:var(--tx3);border-bottom:2px solid transparent;transition:var(--t1);white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--c1);border-bottom-color:var(--c1)}

.code{background:#000;border:1px solid var(--bd);border-radius:var(--rs);
  padding:14px;font-family:var(--mono);font-size:.7rem;line-height:1.55;
  color:var(--c1);overflow:auto;max-height:60vh;white-space:pre;
  user-select:text;tab-size:2}
.code .k{color:var(--c5)}.code .s{color:var(--c3)}.code .c{color:var(--tx3);font-style:italic}
.code .n{color:var(--c2)}.code .v{color:var(--c1)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:var(--rf);background:var(--panel2);
  border:1px solid var(--bd);font-size:.65rem;color:var(--tx2);cursor:pointer;transition:var(--t1)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#0a120e;border-color:transparent;font-weight:700}

.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .e-icon{font-size:3.5rem;opacity:.4;margin-bottom:14px}
.empty h3{color:var(--tx2);font-size:.9rem;margin-bottom:8px;font-weight:600}
.empty p{font-size:.72rem;line-height:1.6;margin-bottom:16px;max-width:400px;margin-left:auto;margin-right:auto}

.progress{height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--g1);border-radius:4px;transition:width .3s}

@media(max-width:900px){
  #nav{width:180px}
  #inspector{width:220px}
}
@media(max-width:700px){
  #nav{width:0;overflow:hidden}
  #inspector{width:0;overflow:hidden}
  .work-body{padding:12px}
  .tb-mod span:not(.m-icon){display:none}
}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">ARBORIS</div>
  <div class="boot-sub">TREE · DATA · INFORMATION</div>

"use strict";

/* ============ UTILS ============ */
function $(id){return document.getElementById(id);}
function $$(s){return document.querySelectorAll(s);}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='text')e.textContent=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;
    else e.setAttribute(k,v);}
  if(children){if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
    else e.appendChild(children);}
  return e;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'id')+'_'+Math.random().toString(36).substr(2,9);}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rndF(a,b){return Math.random()*(b-a)+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function nowStr(){return new Date().toTimeString().split(' ')[0];}
function deepClone(o){return JSON.parse(JSON.stringify(o));}
function debounce(fn,ms){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a);},ms||200);};}
function fmtNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

/* ============ TOAST ============ */
function toast(msg,type,dur){
  type=type||'info';dur=dur||2600;
  var icons={success:'✅',warn:'⚠️',error:'❌',info:'ℹ️'};
  var t=el('div',{class:'toast '+type});
  t.innerHTML='<span style="font-size:1rem">'+(icons[type]||'ℹ️')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t);
  setTimeout(function(){
    t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all .3s';
    setTimeout(function(){t.remove();},300);},dur);
}

/* ============ MODAL ============ */
var _modalOnClose=null;
function openModal(title,bodyHTML,footerHTML,opts){
  opts=opts||{};
  $('modalTitle').textContent=title;
  if(typeof bodyHTML==='string')$('modalBody').innerHTML=bodyHTML;
  else if(bodyHTML instanceof HTMLElement){$('modalBody').innerHTML='';$('modalBody').appendChild(bodyHTML);}
  $('modalFoot').innerHTML=footerHTML||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').className='modal'+(opts.size?' '+opts.size:'');
  $('modalBg').classList.add('show');
  _modalOnClose=opts.onClose||null;
  if(opts.onMount)opts.onMount();
}
function closeModal(){
  $('modalBg').classList.remove('show');
  if(_modalOnClose){try{_modalOnClose();}catch(e){}}_modalOnClose=null;
}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modalBg').classList.contains('show'))closeModal();});

/* ============ TREE MODEL ============ */
var _nodeCounter=0;
function makeNode(name,opts){
  opts=opts||{};
  return {
    id:opts.id||('n'+(++_nodeCounter)+'_'+Math.random().toString(36).substr(2,5)),
    name:name!=null?name:'Node',
    type:opts.type||'default',
    value:opts.value!=null?opts.value:'',
    meta:opts.meta||{},
    children:opts.children||[],
    collapsed:!!opts.collapsed
  };
}

var TreeOps={
  walk:function(node,cb,depth,parent){
    depth=depth||0;cb(node,depth,parent);
    if(node.children)node.children.forEach(function(c){TreeOps.walk(c,cb,depth+1,node);});
  },
  count:function(node){var n=0;TreeOps.walk(node,function(){n++;});return n;},
  depth:function(node){
    if(!node.children||!node.children.length)return 0;
    return 1+Math.max.apply(null,node.children.map(TreeOps.depth));
  },
  leaves:function(node){var n=0;TreeOps.walk(node,function(x){if(!x.children||!x.children.length)n++;});return n;},
  find:function(node,id){
    if(node.id===id)return node;
    if(node.children)for(var i=0;i<node.children.length;i++){
      var r=TreeOps.find(node.children[i],id);if(r)return r;}
    return null;
  },
  findParent:function(node,id){
    if(node.children)for(var i=0;i<node.children.length;i++){
      if(node.children[i].id===id)return node;
      var r=TreeOps.findParent(node.children[i],id);if(r)return r;}
    return null;
  },
  path:function(node,id){
    var p=[];
    function walk(n){
      p.push(n);
      if(n.id===id)return true;
      if(n.children)for(var i=0;i<n.children.length;i++)if(walk(n.children[i]))return true;
      p.pop();return false;
    }
    walk(node);return p;
  },
  clone:function(node){
    var n=makeNode(node.name,{type:node.type,value:node.value,meta:deepClone(node.meta||{}),collapsed:node.collapsed});
    n.children=(node.children||[]).map(TreeOps.clone);
    return n;
  },
  remove:function(root,id){
    if(root.children)for(var i=0;i<root.children.length;i++){
      if(root.children[i].id===id){root.children.splice(i,1);return true;}
      if(TreeOps.remove(root.children[i],id))return true;}
    return false;
  },
  insert:function(parent,node,index){
    if(index!=null)parent.children.splice(index,0,node);else parent.children.push(node);
  },
  move:function(root,nodeId,newParentId,index){
    if(nodeId===newParentId)return false;
    var node=TreeOps.find(root,nodeId);if(!node)return false;
    var desc=false;TreeOps.walk(node,function(n){if(n.id===newParentId)desc=true;});
    if(desc)return false;
    var parent=TreeOps.findParent(root,nodeId);if(!parent)return false;
    parent.children.splice(parent.children.indexOf(node),1);
    var np=TreeOps.find(root,newParentId);
    if(!np){parent.children.push(node);return false;}
    if(index!=null)np.children.splice(index,0,node);else np.children.push(node);
    return true;
  },
  sort:function(node,by){
    if(!node.children)return;
    node.children.forEach(function(c){TreeOps.sort(c,by);});
    node.children.sort(function(a,b){
      if(by==='name')return a.name.localeCompare(b.name);
      if(by==='type')return (a.type||'').localeCompare(b.type||'');
      if(by==='size')return TreeOps.count(b)-TreeOps.count(a);
      return 0;});
  },
  filter:function(root,pred){
    function rec(n){
      var kids=(n.children||[]).map(rec).filter(Boolean);
      if(pred(n)||kids.length){
        var c=makeNode(n.name,{id:n.id,type:n.type,value:n.value,meta:deepClone(n.meta||{}),collapsed:n.collapsed});
        c.children=kids;return c;
      }
      return null;
    }
    return rec(root);
  },
  maxWidth:function(root){
    var levels={};
    TreeOps.walk(root,function(n,d){levels[d]=(levels[d]||0)+1;});
    return Math.max.apply(null,Object.keys(levels).map(function(k){return levels[k];}));
  }
};

/* ============ STATE ============ */
var STATE={
  trees:{},           // id -> tree
  currentTreeId:null,
  currentModule:'visualize',
  selectedNodeId:null,
  clipboard:null,
  history:[],
  historyIdx:-1,
  settings:{
    theme:'arbor',
    gridSnap:false,
    nodeWidth:110,
    nodeHeight:38,
    levelGap:80,
    siblingGap:18,
    animation:true,
    showValues:false,
    showIds:false,
    showTypes:false
  }
};

function currentTree(){return STATE.trees[STATE.currentTreeId];}
function currentRoot(){
  var t=currentTree();
  return t?t.root:null;
}
function setSelectedNode(id){
  STATE.selectedNodeId=id;
  renderInspector();
  if(Arboris.MODULES[STATE.currentModule]&&Arboris.MODULES[STATE.currentModule].onSelect)
    Arboris.MODULES[STATE.currentModule].onSelect(id);
}

/* ============ PERSISTENCE ============ */
var STORE={
  key:'arboris-state-v1',
  save:function(){
    try{
      var data={
        trees:STATE.trees,
        currentTreeId:STATE.currentTreeId,
        settings:STATE.settings,
        nodeCounter:_nodeCounter
      };
      localStorage.setItem(this.key,JSON.stringify(data));
    }catch(e){console.warn('save failed',e);}
  },
  load:function(){
    try{
      var raw=localStorage.getItem(this.key);
      if(!raw)return false;
      var d=JSON.parse(raw);
      if(d.trees)STATE.trees=d.trees;
      if(d.currentTreeId)STATE.currentTreeId=d.currentTreeId;
      if(d.settings)Object.assign(STATE.settings,d.settings);
      if(d.nodeCounter)_nodeCounter=d.nodeCounter;
      return true;
    }catch(e){return false;}
  }
};
setInterval(function(){STORE.save();},5000);

/* ============ CONSOLE / TERMINAL ============ */
function termWrite(msg,cls){
  var out=$('termOut');
  if(!out)return;
  var line=el('div',{class:'term-line '+(cls||'')});
  line.innerHTML=msg;
  out.appendChild(line);
  out.scrollTop=out.scrollHeight;
}
function clearConsole(){
  $('termOut').innerHTML='';
}

/* ============ NAV ============ */
function toggleNav(){var n=$('nav');n.classList.toggle('collapsed');}
function toggleInspector(){var i=$('inspector');i.classList.toggle('collapsed');}
function toggleConsole(){var c=$('console');c.classList.toggle('collapsed');}

function renderNav(){
  var body=$('navBody');
  if(!body)return;
  var tree=currentTree();
  if(!tree){
    body.innerHTML='<div style="padding:20px;text-align:center;color:var(--tx3);font-size:.7rem">No tree loaded</div>';
    return;
  }
  var html='<div class="tree-item active" style="font-weight:700">'+
    '<span class="ti-icon">🌳</span><span>'+esc(tree.name)+'</span>'+
    '<span class="ti-meta">'+TreeOps.count(tree.root)+'</span></div>';
  html+='<div class="tree-children" id="navTree"></div>';
  body.innerHTML=html;
  var cont=$('navTree');
  function rec(node,parentEl){
    node.children.forEach(function(c){
      var item=el('div',{class:'tree-item'+(STATE.selectedNodeId===c.id?' active':''),'data-id':c.id});
      var icon=c.type==='folder'?'📁':(c.children&&c.children.length?'🌿':'🍃');
      item.innerHTML='<span class="ti-icon">'+icon+'</span><span>'+esc(c.name)+'</span>'+
        '<span class="ti-meta">'+(c.children.length||'')+'</span>';
      item.onclick=function(){setSelectedNode(c.id);};
      item.ondblclick=function(){c.collapsed=!c.collapsed;renderNav();};
      parentEl.appendChild(item);
      if(c.children.length&&!c.collapsed){
        var sub=el('div',{class:'tree-children'});
        parentEl.appendChild(sub);
        rec(c,sub);
      }
    });
  }
  rec(tree.root,cont);
}

/* ============ INSPECTOR ============ */
function renderInspector(){
  var body=$('inspectorBody');
  if(!body)return;
  var tree=currentTree();
  if(!tree){body.innerHTML='<div class="ins-empty">No tree loaded</div>';return;}
  var node=STATE.selectedNodeId?TreeOps.find(tree.root,STATE.selectedNodeId):null;
  var html='';
  html+='<div class="ins-section"><h4>Tree</h4>'+
    '<div class="ins-row"><span class="ir-label">Name</span><span class="ir-value">'+esc(tree.name)+'</span></div>'+
    '<div class="ins-row"><span class="ir-label">Nodes</span><span class="ir-value">'+TreeOps.count(tree.root)+'</span></div>'+
    '<div class="ins-row"><span class="ir-label">Depth</span><span class="ir-value">'+TreeOps.depth(tree.root)+'</span></div>'+
    '<div class="ins-row"><span class="ir-label">Leaves</span><span class="ir-value">'+TreeOps.leaves(tree.root)+'</span></div>'+
    '</div>';
  if(node){
    html+='<div class="ins-section"><h4>Node</h4>'+
      '<div class="ins-row"><span class="ir-label">ID</span><span class="ir-value">'+esc(node.id)+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Name</span><span class="ir-value">'+esc(node.name)+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Type</span><span class="ir-value">'+esc(node.type||'-')+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Value</span><span class="ir-value">'+esc(node.value||'-')+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Children</span><span class="ir-value">'+node.children.length+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Subtree</span><span class="ir-value">'+TreeOps.count(node)+'</span></div>'+
      '<div class="ins-row"><span class="ir-label">Sub-depth</span><span class="ir-value">'+TreeOps.depth(node)+'</span></div>'+
      '</div>';
    html+='<div class="ins-section"><h4>Actions</h4>'+
      '<button class="btn primary" style="width:100%;margin-bottom:6px" onclick="addChildToSelected()">+ Add Child</button>'+
      '<button class="btn" style="width:100%;margin-bottom:6px" onclick="renameSelected()">✏️ Rename</button>'+
      '<button class="btn" style="width:100%;margin-bottom:6px" onclick="duplicateSelected()">📋 Duplicate</button>'+
      '<button class="btn danger" style="width:100%" onclick="deleteSelected()">🗑 Delete</button>'+
      '</div>';
  }else{
    html+='<div class="ins-section"><div class="ins-empty">Select a node to inspect</div></div>';
  }
  body.innerHTML=html;
}

/* ============ THEME ============ */
function toggleTheme(){
  var themes=['arbor','dark','light','cyber','amber','ocean','royal'];
  var cur=document.documentElement.getAttribute('data-theme');
  var i=themes.indexOf(cur);
  var next=themes[(i+1)%themes.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.settings.theme=next;
  toast('Theme: '+next,'success');
}

/* ============ EDIT OPS ============ */
function addChildToSelected(){
  var tree=currentTree();if(!tree)return;
  var node=STATE.selectedNodeId?TreeOps.find(tree.root,STATE.selectedNodeId):tree.root;
  if(!node)return;
  var n=makeNode('New Node');
  node.children.push(n);
  setSelectedNode(n.id);
  renderNav();
  refreshModule();
}
function renameSelected(){
  var tree=currentTree();if(!tree||!STATE.selectedNodeId)return;
  var node=TreeOps.find(tree.root,STATE.selectedNodeId);
  if(!node)return;
  var newName=prompt('New name:',node.name);
  if(newName==null)return;
  node.name=newName;
  renderNav();renderInspector();refreshModule();
}
function duplicateSelected(){
  var tree=currentTree();if(!tree||!STATE.selectedNodeId)return;
  var node=TreeOps.find(tree.root,STATE.selectedNodeId);
  if(!node)return;
  var parent=TreeOps.findParent(tree.root,node.id);
  if(!parent)return;
  var clone=TreeOps.clone(node);
  clone.name=node.name+' (copy)';
  var idx=parent.children.indexOf(node);
  parent.children.splice(idx+1,0,clone);
  setSelectedNode(clone.id);
  renderNav();refreshModule();
}
function deleteSelected(){
  var tree=currentTree();if(!tree||!STATE.selectedNodeId)return;
  if(STATE.selectedNodeId===tree.root.id){toast('Cannot delete root','warn');return;}
  if(!confirm('Delete this node and its subtree?'))return;
  TreeOps.remove(tree.root,STATE.selectedNodeId);
  STATE.selectedNodeId=null;
  renderNav();renderInspector();refreshModule();
}

/* ============ TOP BAR MODULES ============ */
var Arboris={MODULES:{},ORDER:[]};
function registerModule(key,def){def.key=key;Arboris.MODULES[key]=def;Arboris.ORDER.push(key);}
function buildTopbar(){
  var bar=$('tbModules');if(!bar)return;
  bar.innerHTML='';
  Arboris.ORDER.forEach(function(k){
    var m=Arboris.MODULES[k];
    if(m.hidden)return;
    var t=el('div',{class:'tb-mod'+(STATE.currentModule===k?' active':''),'data-m':k});
    t.innerHTML='<span class="m-icon">'+m.icon+'</span><span>'+esc(m.title)+'</span>';
    t.onclick=function(){switchModule(k);};
    bar.appendChild(t);
  });
}
function switchModule(k){
  if(!Arboris.MODULES[k])return;
  STATE.currentModule=k;
  $$('#tbModules .tb-mod').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-m')===k);});
  renderModule();
}
function refreshModule(){
  if(Arboris.MODULES[STATE.currentModule]&&Arboris.MODULES[STATE.currentModule].render)
    Arboris.MODULES[STATE.currentModule].render($('workBody'),$('workToolbar'));
}
function renderModule(){
  var m=Arboris.MODULES[STATE.currentModule];
  if(!m)return;
  $('workToolbar').innerHTML='';
  $('workBody').innerHTML='';
  if(m.toolbar)try{m.toolbar($('workToolbar'));}catch(e){console.error(e);}
  if(m.render)try{m.render($('workBody'),$('workToolbar'));}catch(e){
    console.error(e);
    $('workBody').innerHTML='<div class="empty"><div class="e-icon">⚠️</div><h3>Module error</h3><p>'+esc(e.message)+'</p></div>';
  }
}

/* ============ EXPORT HELPERS ============ */
function exportQuickJSON(){
  var tree=currentTree();
  if(!tree){toast('No tree loaded','warn');return;}
  var json=JSON.stringify(tree,null,2);
  downloadText(json,tree.name.replace(/\s+/g,'_')+'.json');
}
function downloadText(text,filename){
  var blob=new Blob([text],{type:'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename||'export.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
  toast('Downloaded: '+filename,'success');
}
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copied','success');},function(){fallbackCopy(text);});
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');ta.value=text;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied','success');}catch(e){toast('Copy failed','error');}
  ta.remove();
}

GENERATORS.random=function(n,depth){
  n=n||30;depth=depth||4;
  function rec(level){
    var node=makeNode('Node '+rnd(1,999),{type:pick(['folder','file','item'])});
    if(level<depth){
      var kids=rnd(0,4);
      for(var i=0;i<kids&&n>0;i++){n--;node.children.push(rec(level+1));}
    }
    return node;
  }
  return rec(0);
};
GENERATORS.balanced=function(depth){
  depth=depth||4;
  function rec(level,path){
    var node=makeNode('N'+path,{type:'binary'});
    if(level<depth){node.children.push(rec(level+1,path+'0'));node.children.push(rec(level+1,path+'1'));}
    return node;
  }
  return rec(0,'');
};
GENERATORS.fibonacci=function(depth){
  depth=depth||6;
  function fib(n,path){
    var node=makeNode('F('+n+')',{type:'fib',value:String(n)});
    if(n>1){node.children.push(fib(n-1,path+'L'));node.children.push(fib(n-2,path+'R'));}
    return node;
  }
  return fib(depth,'');
};
GENERATORS.ternary=function(depth){
  depth=depth||3;
  function rec(level,path){
    var node=makeNode('T'+path,{type:'ternary'});

    return node;
  }
  return rec(0,'');
};

GENERATORS.caterpillar=function(n){

GENERATORS.complete=function(depth){
  depth=depth||3;
  var total=Math.pow(2,depth+1)-1;
  var nodes=[];
  for(var i=0;i<total;i++)nodes.push(makeNode('N'+i,{type:'complete'}));
  for(var i=0;i<total;i++){
    var l=2*i+1,r=2*i+2;
    if(l<total)nodes[i].children.push(nodes[l]);
    if(r<total)nodes[i].children.push(nodes[r]);
  }
  return nodes[0];
};
GENERATORS.bst=function(n,min,max){
  n=n||15;min=min||1;max=max||100;
  var root=makeNode(String(rnd(min,max)),{type:'bst'});
  function insert(node,v){
    if(v<parseInt(node.name)){
      if(node.children[0])insert(node.children[0],v);
      else node.children[0]=makeNode(String(v),{type:'bst'});
    }else{
      if(node.children[1])insert(node.children[1],v);
      else node.children[1]=makeNode(String(v),{type:'bst'});
    }
  }
  for(var i=1;i<n;i++)insert(root,rnd(min,max));
  return root;
};

      node.children.push(rec(level+1,path+'b'));

    return node;

      for(var i=0;i<kids;i++){

    }
    return node;
  }
  return rec(n,0);

GENERATORS.lsystem=function(depth){
  depth=depth||5;
  var axiom='A';

  for(var i=0;i<depth;i++){
    var next='';
    for(var j=0;j<str.length;j++)next+=rules[str[j]]||str[j];
    str=next;
  }
  var pos=0;
  function build(){
    if(pos>=str.length)return null;
    var ch=str[pos++];
    var node=makeNode(ch,{type:'lsystem'});
    if(ch==='A'&&pos<str.length){
      var c1=build();if(c1)node.children.push(c1);
      var c2=build();if(c2)node.children.push(c2);
    }else if(ch==='B'&&pos<str.length){
      var c3=build();if(c3)node.children.push(c3);
    }
    return node;
  }

GENERATORS.heap=function(n){
  n=n||20;
  var vals=[];
  for(var i=0;i<n;i++)vals.push(rnd(1,100));
  vals.sort(function(a,b){return a-b;});
  var nodes=vals.map(function(v){return makeNode(String(v),{type:'heap'});});
  for(var i=0;i<n;i++){
    var l=2*i+1,r=2*i+2;
    if(l<n)nodes[i].children.push(nodes[l]);
    if(r<n)nodes[i].children.push(nodes[r]);
  }
  return nodes[0];
};
GENERATORS.filesystem=function(n,depth){
  n=n||40;depth=depth||4;
  var names=['src','docs','tests','build','assets','lib','bin','config','scripts','data','tmp','public','dist'];
  var files=['index.js','main.py','README.md','config.json','package.json','.gitignore','app.ts','utils.js','style.css','test.spec.js'];
  function rec(level){
    if(level>=depth||n<=0)return null;
    var isFile=Math.random()<0.4||level>=depth;
    var name=isFile?pick(files):pick(names);
    var node=makeNode(name,{type:isFile?'file':'folder'});
    if(isFile){node.value=rnd(1,5000)+' B';n--;return node;}
    var kids=rnd(0,4);
    for(var i=0;i<kids&&n>0;i++){
      var c=rec(level+1);
      if(c)node.children.push(c);
    }
    n--;
    return node;
  }
  return rec(0)||makeNode('empty');
};
GENERATORS.orgchart=function(depth,fanout){

  var firstNames=['Alice','Bob','Carol','Dave','Eve','Frank','Grace','Hank','Ivy','Jack','Kate','Leo','Mia','Nate','Olivia','Pete'];
  var lastNames=['Smith','Johnson','Lee','Wang','Kumar','Garcia','Chen','Patel','Brown','Kim'];

  return rec(0,'');
};
GENERATORS.taxonomy=function(depth){

};
GENERATORS.knowledge=function(depth,fanout){

GENERATORS.randomjson=function(n){
  n=n||30;
  function rec(remaining,level){
    var node=makeNode(pick(['users','posts','comments','tags','meta','data','items','list','items'])+'_'+rnd(1,99),{type:pick(['object','array','string','number','boolean'])});

  }

};

GENERATORS.decisiontree=function(depth){
  depth=depth||4;
  var attrs=['Outlook','Temperature','Humidity','Wind','Pressure','Visibility','Season'];

    if(level>=depth||Math.random()<0.3)return makeNode(pick(['Yes','No']),{type:'leaf',value:pick(['Yes','No'])});

  }
  return rec(0);

GENERATORS.binarytree=function(depth){
  depth=depth||5;
  function rec(level){
    var node=makeNode(String(rnd(1,999)),{type:'binary'});
    if(level<depth){
      node.children.push(rec(level+1));

GENERATORS.sparse=function(n){
  n=n||25;
  var root=makeNode('Root',{type:'sparse'});
  var nodes=[root];
  for(var i=0;i<n;i++){
    var parent=pick(nodes);
    var child=makeNode('S'+i,{type:'sparse'});
    parent.children.push(child);
    nodes.push(child);
  }
  return root;
};
GENERATORS.deep=function(depth){
  depth=depth||20;
  var root=makeNode('D0',{type:'deep'});
  var cur=root;
  for(var i=1;i<=depth;i++){
    var c=makeNode('D'+i,{type:'deep'});
    cur.children.push(c);
    cur=c;
  }
  return root;
};
GENERATORS.wide=function(n){
  n=n||40;
  var root=makeNode('Wide Root',{type:'wide'});
  for(var i=0;i<n;i++)root.children.push(makeNode('Child '+i,{type:'leaf'}));
  return root;
};

function createFromTemplate(key){
  var t=TEMPLATES[key];
  if(!t)return null;
  var root=t.build();
  var tree={id:uid("t"),name:t.title,description:t.desc,root:root,meta:{created:Date.now(),template:key}};
  STATE.trees[tree.id]=tree;
  STATE.currentTreeId=tree.id;
  STATE.selectedNodeId=null;
  renderNav();renderInspector();refreshModule();
  toast("Created: "+t.title,"success");
  return tree;
}
function createFromGenerator(key,args){
  var g=GENERATORS[key];
  if(!g)return null;
  var root=g.apply(null,args||[]);
  var tree={id:uid("g"),name:"Generated ("+key+")",description:"Procedurally generated tree",root:root,meta:{created:Date.now(),generator:key,args:args}};

  STATE.currentTreeId=tree.id;
  STATE.selectedNodeId=null;
  renderNav();renderInspector();refreshModule();
  toast("Generated: "+key,"success");
  return tree;
}

/* --- helpers --- */
function csvEsc(s){s=String(s||'');if(/[",\n]/.test(s))return '"'+s.replace(/"/g,'""')+'"';return s;}
function dotEsc(s){return String(s).replace(/"/g,'\\"');}
function mmEsc(s){return String(s).replace(/"/g,'&quot;');}
function newickEsc(s){return String(s).replace(/[();,\s]/g,'_');}

function toYAML(node,ind){
  var pad='  '.repeat(ind);
  var L=[];
  L.push(pad+'- id: '+JSON.stringify(node.id));
  L.push(pad+'  name: '+JSON.stringify(node.name));
  if(node.type&&node.type!=='default')L.push(pad+'  type: '+JSON.stringify(node.type));
  if(node.value)L.push(pad+'  value: '+JSON.stringify(String(node.value)));
  if(node.children&&node.children.length){
    L.push(pad+'  children:');
    node.children.forEach(function(c){L.push(toYAML(c,ind+2));});
  }
  return L.join('\n');
}

function parseSimpleYAML(text){
  /* Basic YAML list of trees */
  var lines=text.split('\n');
  var root=makeNode('root');
  var stack=[{ind:-1,node:root}];
  lines.forEach(function(line){
    if(!line.trim()||line.trim().startsWith('#'))return;
    var m=line.match(/^(\s*)-?\s*(.*)$/);
    if(!m)return;
    var indent=m[1].length;
    var rest=m[2];
    var kv=rest.match(/^(\w+):\s*(.*)$/);
    while(stack.length>1&&stack[stack.length-1].ind>=indent)stack.pop();
    var parent=stack[stack.length-1].node;
    if(kv){
      var k=kv[1],v=kv[2].trim();
      if(k==='name'){parent.name=v;}
      else if(k==='id'){parent.id=v;}
      else if(k==='value'){parent.value=v;}
      else if(k==='type'){parent.type=v;}
    }else if(rest){
      var nn=makeNode(rest);
      parent.children.push(nn);
      stack.push({ind:indent,node:nn});
    }
  });
  return root;
}

function parseXMLTree(text){
  var parser=new DOMParser();
  var doc=parser.parseFromString(text,'text/xml');
  function nodeFrom(el){
    var n=makeNode(el.getAttribute('id')||el.getAttribute('name')||el.tagName||'node');
    var nameEl=el.querySelector(':scope > name');
    if(nameEl)n.name=nameEl.textContent;
    n.type=el.getAttribute('type')||'default';
    n.value=el.getAttribute('value')||'';
    var children=el.querySelectorAll(':scope > node');
    children.forEach(function(c){n.children.push(nodeFrom(c));});
    return n;
  }
  var root=doc.documentElement;
  if(root.tagName==='root'&&root.querySelector(':scope > node'))return nodeFrom(root.querySelector(':scope > node'));
  return nodeFrom(root);
}

function parseCSVTree(text){
  var lines=text.trim().split('\n');
  var header=lines[0].split(',');
  var idIdx=header.indexOf('id'),parentIdx=header.indexOf('parent_id'),nameIdx=header.indexOf('name'),typeIdx=header.indexOf('type'),valueIdx=header.indexOf('value');
  var nodesById={};var root=null;
  lines.slice(1).forEach(function(line){
    var parts=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(function(s){return s.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"');});
    var n=makeNode(parts[nameIdx]||'Node');
    n.id=parts[idIdx];
    if(typeIdx>=0)n.type=parts[typeIdx];
    if(valueIdx>=0)n.value=parts[valueIdx];
    nodesById[n.id]=n;
    var pid=parts[parentIdx];
    if(!pid){root=n;}
    else if(nodesById[pid])nodesById[pid].children.push(n);
  });
  return root||makeNode('empty');
}

function normalizeImported(obj){
  if(!obj||typeof obj!=='object')return makeNode(String(obj));
  var n=makeNode(obj.name||obj.title||obj.id||'Node');
  if(obj.id)n.id=String(obj.id);
  if(obj.type)n.type=String(obj.type);
  if(obj.value)n.value=String(obj.value);
  if(Array.isArray(obj.children)){
    obj.children.forEach(function(c){n.children.push(normalizeImported(c));});
  }
  return n;
}

var ALGORITHMS={};

function algreg(key,def){def.key=key;ALGORITHMS[key]=def;}

algreg('dfs-pre',{name:'DFS Pre-Order',icon:'⬇️',desc:'Visit root, then children left-to-right (recursive)',
  run:function(root){

algreg('dfs-post',{name:'DFS Post-Order',icon:'⬆️',desc:'Visit children then root (recursive)',
  run:function(root){
    var order=[];var steps=[];
    function rec(n){(n.children||[]).forEach(rec);steps.push({id:n.id,type:'visit',msg:'Visit '+n.name});order.push(n.id);}
    rec(root);return {order:order,steps:steps,complexity:'O(n)',space:'O(h)'};
  }});
algreg('dfs-in',{name:'DFS In-Order',icon:'↔️',desc:'Left, root, right (binary trees)',
  run:function(root){
    var order=[];var steps=[];
    function rec(n){(n.children||[]).forEach(function(c,i){if(i===0)rec(c);});steps.push({id:n.id,type:'visit',msg:'Visit '+n.name});order.push(n.id);(n.children||[]).forEach(function(c,i){if(i>0)rec(c);});}
    rec(root);return {order:order,steps:steps,complexity:'O(n)',space:'O(h)'};
  }});
algreg('bfs',{name:'BFS Level-Order',icon:'📊',desc:'Visit nodes level by level using a queue',
  run:function(root){
    var order=[];var steps=[];var q=[root];
    while(q.length){
      var n=q.shift();
      steps.push({id:n.id,type:'visit',msg:'Visit '+n.name});
      order.push(n.id);
      (n.children||[]).forEach(function(c){q.push(c);});
    }
    return {order:order,steps:steps,complexity:'O(n)',space:'O(w)'};
  }});
algreg('height',{name:'Height / Depth',icon:'📏',desc:'Compute tree height',
  run:function(root){
    var steps=[];
    function h(n){
      if(!n.children||!n.children.length){steps.push({id:n.id,type:'leaf',msg:'Leaf: h=0'});return 0;}
      var mh=0;(n.children).forEach(function(c){mh=Math.max(mh,h(c));});
      steps.push({id:n.id,type:'visit',msg:'h='+n.name+' = '+(mh+1)});
      return mh+1;
    }
    var hh=h(root);
    return {order:[],steps:steps,result:'Height = '+hh,complexity:'O(n)',space:'O(h)'};
  }});
algreg('count',{name:'Count Nodes',icon:'🔢',desc:'Count total nodes recursively',
  run:function(root){
    var steps=[];var c=0;
    function rec(n){c++;steps.push({id:n.id,type:'count',msg:'+1 ('+n.name+') → '+c});(n.children||[]).forEach(rec);}
    rec(root);
    return {order:[],steps:steps,result:'Total = '+c,complexity:'O(n)',space:'O(h)'};
  }});
algreg('mirror',{name:'Mirror / Invert',icon:'🔄',desc:'Reverse children order of every node',
  run:function(root){
    var steps=[];
    function rec(n){(n.children||[]).reverse();steps.push({id:n.id,type:'visit',msg:'Swapped children of '+n.name});(n.children||[]).forEach(rec);}
    rec(root);
    return {order:[],steps:steps,result:'Tree mirrored',complexity:'O(n)',space:'O(h)'};
  }});
algreg('diameter',{name:'Diameter',icon:'📐',desc:'Longest path between any two nodes',
  run:function(root){
    var steps=[];var best=0;
    function h(n){
      if(!n.children||!n.children.length)return 0;
      var hs=(n.children).map(h).sort(function(a,b){return b-a;});
      var top=hs[0]||0;var second=hs[1]||0;
      best=Math.max(best,top+second+2);
      steps.push({id:n.id,type:'visit',msg:'Through '+n.name+': '+(top+second+2)});
      return top+1;
    }
    h(root);
    return {order:[],steps:steps,result:'Diameter = '+best,complexity:'O(n)',space:'O(h)'};
  }});
algreg('lca',{name:'Lowest Common Ancestor',icon:'🔗',desc:'Find LCA of two node IDs',
  run:function(root,idA,idB){
    if(!idA||!idB)return {order:[],steps:[{id:root.id,type:'info',msg:'Need two node IDs'}],result:'—'};
    var pa=TreeOps.path(root,idA);var pb=TreeOps.path(root,idB);
    var steps=[];var lca=null;
    for(var i=0;i<Math.min(pa.length,pb.length);i++){
      steps.push({id:pa[i].id,type:'visit',msg:'Compare '+pa[i].name});
      if(pa[i].id===pb[i].id)lca=pa[i];else break;
    }
    return {order:[],steps:steps,result:lca?('LCA = '+lca.name+' ('+lca.id+')'):'Not found',complexity:'O(n)',space:'O(h)'};
  }});
algreg('leafpaths',{name:'All Root→Leaf Paths',icon:'🛤️',desc:'Enumerate every path from root to leaf',
  run:function(root){
    var paths=[];var steps=[];
    function rec(n,path){
      path=path.concat([n.name]);
      if(!n.children||!n.children.length){paths.push(path.join(' → '));steps.push({id:n.id,type:'leaf',msg:'Path: '+path.join(' → ')});return;}
      (n.children).forEach(function(c){rec(c,path);});
    }
    rec(root,[]);
    return {order:[],steps:steps,result:paths.length+' paths found',complexity:'O(n·h)',space:'O(h)'};
  }});
algreg('balanced',{name:'Check Balanced',icon:'⚖️',desc:'Check if tree is height-balanced',
  run:function(root){
    var steps=[];var ok=true;
    function h(n){
      if(!n.children||!n.children.length)return 0;
      var hs=(n.children).map(h);
      var max=Math.max.apply(null,hs);var min=Math.min.apply(null,hs);
      if(max-min>1){ok=false;steps.push({id:n.id,type:'err',msg:'Unbalanced at '+n.name+' (Δ='+(max-min)+')'});}
      else steps.push({id:n.id,type:'ok',msg:'Balanced at '+n.name+' (Δ='+(max-min)+')'});
      return max+1;
    }
    h(root);
    return {order:[],steps:steps,result:ok?'Balanced ✓':'Unbalanced ✗',complexity:'O(n)',space:'O(h)'};
  }});
algreg('sum',{name:'Sum Node Values',icon:'➕',desc:'Sum all numeric node values',
  run:function(root){
    var steps=[];var total=0;
    TreeOps.walk(root,function(n){
      var v=parseFloat(n.value);
      if(!isNaN(v)){total+=v;steps.push({id:n.id,type:'visit',msg:'+'+v+' = '+total});}
    });
    return {order:[],steps:steps,result:'Sum = '+total,complexity:'O(n)',space:'O(h)'};
  }});
algreg('maxpath',{name:'Max Path Sum',icon:'💰',desc:'Maximum root-to-leaf sum (numeric values)',
  run:function(root){
    var steps=[];var best=-Infinity;
    function rec(n,sum){
      var v=parseFloat(n.value);if(!isNaN(v))sum+=v;
      if(!n.children||!n.children.length){
        if(sum>best)best=sum;
        steps.push({id:n.id,type:'leaf',msg:'Path sum: '+sum});
        return;
      }
      (n.children).forEach(function(c){rec(c,sum);});
    }
    rec(root,0);
    return {order:[],steps:steps,result:'Max = '+best,complexity:'O(n)',space:'O(h)'};
  }});
algreg('serialize',{name:'Serialize',icon:'📝',desc:'Serialize tree to compact string',
  run:function(root){
    var out='';
    function rec(n){out+=n.name+'(';if(n.children)n.children.forEach(function(c){rec(c);});out+=')';}
    rec(root);
    return {order:[],steps:[{id:root.id,type:'info',msg:'Serialized '+out.length+' chars'}],result:out.length>200?out.substr(0,200)+'...':out,complexity:'O(n)',space:'O(n)'};
  }});
algreg('traverse-parallel',{name:'Parallel BFS',icon:'⚡',desc:'BFS processing each level in parallel',
  run:function(root){
    var steps=[];var level=0;var cur=[root];
    while(cur.length){
      steps.push({id:null,type:'level',msg:'Level '+level+': '+cur.length+' node(s)'});
      var next=[];
      cur.forEach(function(n){steps.push({id:n.id,type:'visit',msg:'Process '+n.name});(n.children||[]).forEach(function(c){next.push(c);});});
      cur=next;level++;
    }
    return {order:[],steps:steps,result:level+' levels processed',complexity:'O(n)',space:'O(w)'};
  }});
algreg('longest-path',{name:'Longest Path (Weighted)',icon:'📈',desc:'Longest weighted root-to-leaf path',
  run:function(root){
    var steps=[];var bestPath=null;var bestSum=-Infinity;
    function rec(n,sum,path){
      var v=parseFloat(n.value);if(!isNaN(v))sum+=v;
      path=path.concat([n.name]);
      if(!n.children||!n.children.length){
        if(sum>bestSum){bestSum=sum;bestPath=path.slice();}
        return;
      }
      (n.children).forEach(function(c){rec(c,sum,path);});
    }
    rec(root,0,[]);
    if(bestPath)steps.push({id:null,type:'info',msg:'Path: '+bestPath.join(' → ')});
    return {order:[],steps:steps,result:'Sum = '+bestSum,complexity:'O(n)',space:'O(h)'};
  }});
algreg('trie-search',{name:'Trie Search',icon:'🔤',desc:'Demonstrate prefix search on trie structure',
  run:function(root,prefix){
    prefix=prefix||'a';
    var steps=[];var cur=root;
    for(var i=0;i<prefix.length;i++){
      var ch=prefix[i];var found=null;
      (cur.children||[]).forEach(function(c){if(c.name===ch)found=c;});
      if(!found){steps.push({id:cur.id,type:'err',msg:'Not found: '+prefix[i]});return {order:[],steps:steps,result:'Not found'};}
      steps.push({id:found.id,type:'visit',msg:'Consume '+ch});
      cur=found;
    }
    return {order:[],steps:steps,result:'Prefix "'+prefix+'" found',complexity:'O(m)',space:'O(1)'};
  }});
algreg('avl-rotate',{name:'AVL Rotations (sim)',icon:'🔄',desc:'Simulate AVL right rotation on a node',
  run:function(root){
    var steps=[];var target=null;
    TreeOps.walk(root,function(n){if(!target&&n.children&&n.children.length>=2)target=n;});
    if(!target){steps.push({id:root.id,type:'info',msg:'No node with 2 children'});return {order:[],steps:steps,result:'No-op'};}
    var A=target,B=target.children[0];
    steps.push({id:A.id,type:'visit',msg:'Rotate right at '+A.name});
    if(B&&B.children){
      var T2=B.children[1];
      B.children[1]=A;
      if(T2)A.children[0]=T2;else A.children.shift();
      var parent=TreeOps.findParent(root,A.id);
      if(parent){var idx=parent.children.indexOf(A);parent.children[idx]=B;}
      else{root=B;}
      steps.push({id:B.id,type:'ok',msg:B.name+' is new root of subtree'});
    }
    return {order:[],steps:steps,result:'Rotation applied',complexity:'O(1)',space:'O(1)',mutated:true};
  }});
algreg('heapify',{name:'Heapify (sim)',icon:'🔺',desc:'Heapify numeric values as min-heap',
  run:function(root){
    var steps=[];var vals=[];
    TreeOps.walk(root,function(n){var v=parseFloat(n.value);if(!isNaN(v))vals.push(v);});
    if(vals.length<2){steps.push({id:root.id,type:'info',msg:'Need ≥2 numeric nodes'});return {order:[],steps:steps,result:'No-op'};}
    vals.sort(function(a,b){return a-b;});
    steps.push({id:null,type:'info',msg:'Sorted: '+vals.join(', ')});
    TreeOps.walk(root,function(n){var v=parseFloat(n.value);if(!isNaN(v))n.value=String(vals.shift());});
    return {order:[],steps:steps,result:'Heapified',mutated:true};
  }});
algreg('prune',{name:'Prune Depth > N',icon:'✂️',desc:'Remove all nodes deeper than N',
  run:function(root,depth){
    depth=depth||3;
    var steps=[];
    function rec(n,d){
      if(d>=depth){if(n.children.length)steps.push({id:n.id,type:'cut',msg:'Cut '+n.children.length+' children of '+n.name});n.children=[];return;}
      (n.children).forEach(function(c){rec(c,d+1);});
    }
    rec(root,0);
    return {order:[],steps:steps,result:'Pruned at depth '+depth,complexity:'O(n)',space:'O(h)',mutated:true};
  }});
algreg('shuffle',{name:'Shuffle Children',icon:'🎲',desc:'Randomly shuffle children of every node',
  run:function(root){
    var steps=[];
    TreeOps.walk(root,function(n){for(var i=n.children.length-1;i>0;i--){var j=rnd(0,i);var t=n.children[i];n.children[i]=n.children[j];n.children[j]=t;}});
    steps.push({id:root.id,type:'info',msg:'All child lists shuffled'});
    return {order:[],steps:steps,result:'Shuffled',mutated:true};
  }});
algreg('renumber',{name:'Renumber IDs',icon:'🔢',desc:'Assign sequential IDs to all nodes',
  run:function(root){
    var steps=[];var i=0;
    TreeOps.walk(root,function(n){n.id='node_'+(i++);});
    steps.push({id:root.id,type:'info',msg:'Renumbered '+i+' nodes'});
    return {order:[],steps:steps,result:i+' nodes renumbered',mutated:true};
  }});
algreg('trim-leaf-values',{name:'Trim Whitespace',icon:'✨',desc:'Trim whitespace from names and values',
  run:function(root){
    var n=0;
    TreeOps.walk(root,function(x){if(x.name){var t=x.name.trim();if(t!==x.name){x.name=t;n++;}}if(x.value){x.value=x.value.trim();}});
    return {order:[],steps:[{id:root.id,type:'info',msg:'Trimmed '+n+' names'}],result:'Done',mutated:true};
  }});
algreg('sort-children',{name:'Sort Children by Name',icon:'🔤',desc:'Alphabetically sort children at each level',
  run:function(root){
    TreeOps.sort(root,'name');
    return {order:[],steps:[{id:root.id,type:'info',msg:'All levels sorted'}],result:'Sorted',mutated:true};
  }});

window.ALGORITHMS=ALGORITHMS;
</script>
<script>

  toolbar:function(bar){

      '<option value="tree-v">Vertical Tree</option>'+
      '<option value="tree-h">Horizontal Tree</option>'+

      '<option value="outline">Indented Outline</option>'+

      return;
    }
    body.innerHTML='<div id="vizWrap" style="position:relative;width:100%;min-height:100%;overflow:auto;background:var(--bg2);border-radius:var(--rs)"></div>';
    renderVisualize();

var _vizZoom=1;
function vizZoom(d){_vizZoom=clamp(_vizZoom+d,0.3,2.5);var w=$('vizWrap');if(w)w.style.transform='scale('+_vizZoom+')';}
function vizResetZoom(){_vizZoom=1;var w=$('vizWrap');if(w)w.style.transform='scale(1)';}
function vizAutoLayout(){_vizZoom=1;renderVisualize();toast('Layout refreshed','success');}

function renderVisualize(){
  var wrap=$('vizWrap');if(!wrap)return;
  var root=currentRoot();if(!root)return;
  var layout=($('vizLayout')&&$('vizLayout').value)||'tree-v';
  var s=STATE.settings;
  if(layout==='outline'){wrap.innerHTML=renderOutline(root);bindVizEvents(wrap);return;}
  var nodes=[];
  var nodeW=s.nodeWidth,nodeH=s.nodeHeight,levelGap=s.levelGap,sibGap=s.siblingGap;
  if(layout==='tree-v'){
    var levelY=[];var leafX=0;
    function walk(n,depth,parent){
      if(depth>=levelY.length)levelY.push(0);
      n._d=depth;
      if(!n.children||!n.children.length){
        n._x=leafX;leafX+=nodeW+sibGap;
      }else{
        n.children.forEach(function(c){walk(c,depth+1,n);});
        var first=n.children[0]._x,last=n.children[n.children.length-1]._x;
        n._x=(first+last)/2;
      }
      levelY[depth]=Math.max(levelY[depth],n._x+nodeW);
    }
    walk(root,0,null);
    var maxX=0;TreeOps.walk(root,function(n){if(n._x>maxX)maxX=n._x;});
    var maxD=TreeOps.depth(root);
    var W=maxX+nodeW+80,H=(maxD+1)*(nodeH+levelGap)+80;
    wrap.style.minHeight=H+'px';
    var svg='<svg width="'+W+'" height="'+H+'" style="display:block">';
    svg+='<g transform="translate(40,40)">';
    // Edges
    TreeOps.walk(root,function(n){
      (n.children||[]).forEach(function(c){
        var x1=n._x+nodeW/2,y1=n._d*(nodeH+levelGap)+nodeH;
        var x2=c._x+nodeW/2,y2=c._d*(nodeH+levelGap);
        svg+='<path d="M'+x1+' '+y1+' C'+x1+' '+(y1+levelGap/2)+' '+x2+' '+(y2-levelGap/2)+' '+x2+' '+y2+'" fill="none" stroke="rgba(62,226,140,.35)" stroke-width="1.5"/>';
      });
    });
    // Nodes
    TreeOps.walk(root,function(n){
      var x=n._x,y=n._d*(nodeH+levelGap);
      var isSel=STATE.selectedNodeId===n.id;
      var isLeaf=!n.children||!n.children.length;
      svg+='<g transform="translate('+x+','+y+')" data-id="'+n.id+'" class="viz-node" style="cursor:pointer">';
      svg+='<rect width="'+nodeW+'" height="'+nodeH+'" rx="7" fill="'+(isSel?'#17301f':'#112018')+'" stroke="'+(isSel?'#3ee28c':'#2a5038')+'" stroke-width="'+(isSel?2:1.5)+'" '+(isLeaf?'stroke-dasharray="4,3"':'')+'/>';
      svg+='<text x="'+(nodeW/2)+'" y="'+(nodeH/2+4)+'" text-anchor="middle" fill="#e8f5ec" font-size="11" font-family="Inter">'+esc(n.name.length>14?n.name.substr(0,13)+'…':n.name)+'</text>';
      if(STATE.settings.showValues&&n.value)svg+='<text x="'+(nodeW/2)+'" y="'+(nodeH-4)+'" text-anchor="middle" fill="#6a9078" font-size="9" font-family="monospace">'+esc(String(n.value).substr(0,16))+'</text>';
      svg+='</g>';
    });
    svg+='</g></svg>';
    wrap.innerHTML=svg;
  }else if(layout==='tree-h'){
    var leafY=0;
    function walkH(n,depth){
      n._d=depth;
      if(!n.children||!n.children.length){
        n._y=leafY;leafY+=nodeH+sibGap;
      }else{
        n.children.forEach(function(c){walkH(c,depth+1);});
        var f=n.children[0]._y,l=n.children[n.children.length-1]._y;
        n._y=(f+l)/2;
      }
    }
    walkH(root,0);
    var maxY=0;TreeOps.walk(root,function(n){if(n._y>maxY)maxY=n._y;});
    var maxDH=TreeOps.depth(root);
    var W2=(maxDH+1)*(nodeW+levelGap)+80,H2=maxY+nodeH+80;
    wrap.style.minHeight=H2+'px';
    var svg2='<svg width="'+W2+'" height="'+H2+'" style="display:block"><g transform="translate(40,40)">';
    TreeOps.walk(root,function(n){
      (n.children||[]).forEach(function(c){
        var x1=n._d*(nodeW+levelGap)+nodeW,y1=n._y+nodeH/2;
        var x2=c._d*(nodeW+levelGap),y2=c._y+nodeH/2;
        svg2+='<path d="M'+x1+' '+y1+' C'+(x1+levelGap/2)+' '+y1+' '+(x2-levelGap/2)+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="rgba(62,226,140,.35)" stroke-width="1.5"/>';
      });
    });
    TreeOps.walk(root,function(n){
      var x=n._d*(nodeW+levelGap),y=n._y;
      var isSel=STATE.selectedNodeId===n.id;
      var isLeaf=!n.children||!n.children.length;
      svg2+='<g transform="translate('+x+','+y+')" data-id="'+n.id+'" style="cursor:pointer">';
      svg2+='<rect width="'+nodeW+'" height="'+nodeH+'" rx="7" fill="'+(isSel?'#17301f':'#112018')+'" stroke="'+(isSel?'#3ee28c':'#2a5038')+'" stroke-width="'+(isSel?2:1.5)+'" '+(isLeaf?'stroke-dasharray="4,3"':'')+'/>';
      svg2+='<text x="'+(nodeW/2)+'" y="'+(nodeH/2+4)+'" text-anchor="middle" fill="#e8f5ec" font-size="11">'+esc(n.name.length>14?n.name.substr(0,13)+'…':n.name)+'</text>';
      svg2+='</g>';
    });
    svg2+='</g></svg>';
    wrap.innerHTML=svg2;
  }else if(layout==='radial'){
    var cx=Math.max(400,wrap.clientWidth/2||400),cy=400;
    var R=Math.min(cx-60,340);
    var maxDR=TreeOps.depth(root)||1;
    // Assign angles
    var leaves=0;TreeOps.walk(root,function(n){if(!n.children||!n.children.length)leaves++;});
    var cursor=0;
    TreeOps.walk(root,function(n){
      if(!n.children||!n.children.length){n._a=cursor/leaves*Math.PI*2;cursor++;}
    });
    function setAngle(n){
      if(n._a!==undefined)return n._a;
      if(!n.children||!n.children.length){n._a=0;return 0;}
      var sum=0;(n.children).forEach(function(c){sum+=setAngle(c);});
      n._a=sum/n.children.length;return n._a;
    }
    setAngle(root);
    var W3=cx*2+40,H3=cy*2+40;
    wrap.style.minHeight=H3+'px';
    var svg3='<svg width="'+W3+'" height="'+H3+'" style="display:block"><g transform="translate('+cx+','+cy+')">';
    TreeOps.walk(root,function(n){
      var r=n._d/maxDR*R;
      var x=Math.cos(n._a)*r,y=Math.sin(n._a)*r;
      (n.children||[]).forEach(function(c){
        var r2=c._d/maxDR*R;
        var x2=Math.cos(c._a)*r2,y2=Math.sin(c._a)*r2;
        svg3+='<line x1="'+x+'" y1="'+y+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(62,226,140,.35)" stroke-width="1.2"/>';
      });
    });
    TreeOps.walk(root,function(n){
      var r=n._d/maxDR*R;
      var x=Math.cos(n._a)*r,y=Math.sin(n._a)*r;
      var isSel=STATE.selectedNodeId===n.id;
      svg3+='<g transform="translate('+x+','+y+')" data-id="'+n.id+'" style="cursor:pointer">';
      svg3+='<circle r="18" fill="'+(isSel?'#17301f':'#112018')+'" stroke="'+(isSel?'#3ee28c':'#2a5038')+'" stroke-width="'+(isSel?2:1.5)+'"/>';
      svg3+='<text y="4" text-anchor="middle" fill="#e8f5ec" font-size="9">'+esc(n.name.substr(0,6))+'</text>';
      svg3+='</g>';
    });
    svg3+='</g></svg>';
    wrap.innerHTML=svg3;
  }
  bindVizEvents(wrap);
}

function bindVizEvents(wrap){
  wrap.querySelectorAll('[data-id]').forEach(function(g){
    g.addEventListener('click',function(e){
      e.stopPropagation();
      setSelectedNode(this.getAttribute('data-id'));
      renderVisualize();
    });
  });
}

function renderOutline(root){
  var html='<div style="padding:24px;font-family:var(--mono);font-size:.78rem;line-height:2">';
  function rec(n,d){
    var pad='  '.repeat(d);
    var isSel=STATE.selectedNodeId===n.id;
    var icon=n.children&&n.children.length?'📂':'📄';
    html+='<div data-id="'+n.id+'" style="padding:2px 8px;border-radius:4px;cursor:pointer;'+(isSel?'background:rgba(62,226,140,.15);color:var(--c1)':'')+'" class="outline-item">'+
      esc(pad)+icon+' '+esc(n.name)+(n.value?' <span style="color:var(--tx3)">— '+esc(n.value)+'</span>':'')+'</div>';
    (n.children||[]).forEach(function(c){rec(c,d+1);});
  }
  rec(root,0);
  html+='</div>';
  return html;
}
document.addEventListener('click',function(e){
  var oi=e.target.closest('.outline-item');
  if(oi&&oi.parentElement&&oi.parentElement.closest('#vizWrap')){setSelectedNode(oi.getAttribute('data-id'));renderVisualize();}
});

  STATE.settings[k]=!STATE.settings[k];

}

function renderCode(){
  var root=currentRoot();if(!root)return;
  var sel=$('codeLang');if(!sel)return;
  var key=sel.value;
  var lang=LANGS[key];if(!lang)return;
  try{
    var code=lang.generate(root);
    $('codeOut').textContent=code;
    $('codeOut')._code=code;
  }catch(e){
    $('codeOut').textContent='Error: '+e.message;
  }
}
function copyCode(){var c=$('codeOut');if(c&&c._code)copyToClipboard(c._code);}
function downloadCode(){
  var sel=$('codeLang');if(!sel)return;
  var lang=LANGS[sel.value];if(!lang)return;
  downloadText($('codeOut')._code||'',(currentTree().name||'tree').replace(/\s+/g,'_')+'.'+lang.ext);
}

function switchDataTab(t,el){
  $$('[data-dtab]').forEach(function(x){x.classList.remove('active');});
  el.classList.add('active');
  $('dataExport').style.display=t==='export'?'block':'none';
  $('dataImport').style.display=t==='import'?'block':'none';
}

function exportFormat(k){
  var root=currentRoot();if(!root)return;
  var f=DATA_FORMATS[k];if(!f||!f.export)return;
  try{
    var text=f.export(root);
    $('dataOut').textContent=text;
    $('dataOut')._text=text;
    $('dataOut')._name=currentTree().name.replace(/\s+/g,'_')+'.'+f.ext;
  }catch(e){$('dataOut').textContent='Error: '+e.message;}
  setTimeout(function(){copyToClipboard($('dataOut')._text);},10);
}

function doImport(){
  var fmt=$('importFormat').value;
  var text=$('importText').value;
  if(!text.trim()){toast('Paste some data first','warn');return;}
  var f=DATA_FORMATS[fmt];if(!f||!f.import){toast('Import not supported for '+fmt,'warn');return;}
  try{
    var root=f.import(text);
    var tree={id:uid('imp'),name:'Imported ('+fmt+')',description:'Imported from '+fmt,root:root,meta:{created:Date.now(),importFormat:fmt}};
    STATE.trees[tree.id]=tree;
    STATE.currentTreeId=tree.id;
    STATE.selectedNodeId=null;
    renderNav();renderInspector();
    toast('Imported '+TreeOps.count(root)+' nodes','success');
    switchModule('visualize');
  }catch(e){toast('Import failed: '+e.message,'error',5000);}
}

function loadExampleImport(){
  var fmt=$('importFormat').value;
  var ex={
    json:JSON.stringify({id:'root',name:'Project',type:'folder',children:[{id:'a',name:'src'},{id:'b',name:'docs',children:[{id:'c',name:'guide.md'}]},{id:'d',name:'package.json'}]},null,2),
    yaml:'- id: root\n  name: Project\n  type: folder\n  children:\n  - id: a\n    name: src\n  - id: b\n    name: docs\n  - id: c\n    name: README.md',
    xml:'<?xml version="1.0"?>\n<node id="root" type="folder"><name>Project</name><node id="a"><name>src</name></node><node id="b"><name>docs</name></node></node>',
    csv:'id,parent_id,name,type,value,depth\nroot,,Project,folder,,0\na,root,src,folder,,1\nb,root,docs,folder,,1\nc,b,guide.md,file,1.2KB,2'
  };
  $('importText').value=ex[fmt]||'';
}

registerModule('algorithms',{
  icon:'🔬',title:'Algorithms',
  render:function(body){
    var keys=Object.keys(ALGORITHMS);
    var html='<div class="ws-card"><h3>🔬 Tree Algorithms</h3><p class="wc-sub">'+keys.length+' algorithms. Select to run and visualize step-by-step.</p>'+
      '<div class="ws-grid c2" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">';
    keys.forEach(function(k){
      var a=ALGORITHMS[k];
      html+='<div class="ws-card" style="margin:0;cursor:pointer" onclick="runAlgorithm(\''+k+'\')">'+
        '<div style="font-size:1.4rem;margin-bottom:6px">'+a.icon+'</div>'+
        '<div style="font-weight:700;font-size:.82rem;margin-bottom:4px">'+esc(a.name)+'</div>'+
        '<div style="font-size:.68rem;color:var(--tx3);line-height:1.4">'+esc(a.desc)+'</div>'+
        '</div>';
    });
    html+='</div></div>';
    body.innerHTML=html;
  }
});

function runAlgorithm(key){
  var root=currentRoot();if(!root){toast('No tree loaded','warn');return;}
  var a=ALGORITHMS[key];if(!a)return;
  var args=[];
  if(key==='prune'){
    var d=prompt('Prune depth (nodes deeper than this are removed):','3');
    if(d==null)return;
    args.push(parseInt(d));
  }
  if(key==='lca'){
    var a1=prompt('First node ID:',STATE.selectedNodeId||root.children[0]&&root.children[0].id||root.id);
    if(a1==null)return;
    var a2=prompt('Second node ID:',root.children[1]&&root.children[1].id||root.id);
    if(a2==null)return;
    args.push(a1,a2);
  }
  if(key==='trie-search'){
    var p=prompt('Prefix to search:','a');
    if(p==null)return;
    args.push(p);
  }
  try{
    var result=a.run.apply(null,[root].concat(args));
    showAlgorithmResult(a,result);
    if(result.mutated){renderNav();renderVisualize();refreshModule();}
  }catch(e){
    toast('Algorithm error: '+e.message,'error');
  }
}

function showAlgorithmResult(a,result){
  var html='<div class="ws-card"><h3>'+a.icon+' '+esc(a.name)+'</h3>'+
    '<div class="kv"><div class="row"><span class="k">Result</span><span class="v">'+esc(String(result.result||'—'))+'</span></div>'+
    (result.complexity?'<div class="row"><span class="k">Time</span><span class="v">'+esc(result.complexity)+'</span></div>':'')+
    (result.space?'<div class="row"><span class="k">Space</span><span class="v">'+esc(result.space)+'</span></div>':'')+
    '<div class="row"><span class="k">Steps</span><span class="v">'+result.steps.length+'</span></div>'+
    '</div></div>';
  html+='<div class="ws-card"><h3>📜 Execution Steps</h3>'+
    '<div class="code" style="max-height:340px">'+result.steps.map(function(s,i){
      var cls={visit:'info',leaf:'ok',err:'err',cut:'err',ok:'ok',info:'dim',level:'hi',count:'dim'}[s.type]||'';
      return (i+1)+'. ['+(s.type||'?')+'] '+esc(s.msg||'');
    }).join('\n')+'</div></div>';
  if(result.order&&result.order.length){
    html+='<div class="ws-card"><h3>🎯 Visit Order</h3><div style="font-family:var(--mono);font-size:.7rem;color:var(--c1);word-break:break-all">'+
      result.order.join(' → ')+'</div></div>';
  }
  openModal(a.icon+' '+a.name,html,'<button class="btn primary" onclick="closeModal()">Close</button>',{size:'lg'});
}

/* ---------- MODULE: ANALYTICS ---------- */
registerModule('analytics',{
  icon:'📈',title:'Analytics',
  render:function(body){
    var root=currentRoot();
    if(!root){body.innerHTML='<div class="empty"><div class="e-icon">📈</div><h3>No tree</h3></div>';return;}
    var total=TreeOps.count(root);
    var depth=TreeOps.depth(root);
    var leaves=TreeOps.leaves(root);
    var internals=total-leaves;
    var avgBranching=(total-1)/Math.max(1,internals);
    var width=TreeOps.maxWidth(root);
    // Level distribution
    var levelDist={};TreeOps.walk(root,function(n,d){levelDist[d]=(levelDist[d]||0)+1;});
    var maxLevel=Math.max.apply(null,Object.keys(levelDist).map(Number));
    var maxCount=Math.max.apply(null,Object.values(levelDist));
    // Type distribution
    var typeDist={};TreeOps.walk(root,function(n){typeDist[n.type]=(typeDist[n.type]||0)+1;});
    var html='<div class="ws-card"><h3>📊 Tree Statistics</h3><div class="ws-grid c4">'+
      '<div class="stat"><div class="s-v">'+total+'</div><div class="s-l">Nodes</div></div>'+
      '<div class="stat"><div class="s-v">'+depth+'</div><div class="s-l">Depth</div></div>'+
      '<div class="stat"><div class="s-v">'+leaves+'</div><div class="s-l">Leaves</div></div>'+
      '<div class="stat"><div class="s-v">'+internals+'</div><div class="s-l">Internal</div></div>'+
      '<div class="stat"><div class="s-v">'+width+'</div><div class="s-l">Max Width</div></div>'+
      '<div class="stat"><div class="s-v">'+avgBranching.toFixed(2)+'</div><div class="s-l">Avg Branching</div></div>'+
      '<div class="stat"><div class="s-v">'+(leaves?total/leaves).toFixed(2):'—'+(leaves?total/leaves:0).toFixed(2):'—'}</div><div class="s-l">Node/Leaf Ratio</div></div>'+
      '<div class="stat"><div class="s-v">'+(depth?total/depth:0).toFixed(1)+'</div><div class="s-l">Node/Depth</div></div>'+
      '</div></div>';
    html+='<div class="ws-card"><h3>📉 Level Distribution</h3>';
    Object.keys(levelDist).sort(function(a,b){return parseInt(a)-parseInt(b);}).forEach(function(lvl){
      var c=levelDist[lvl];
      var pct=c/maxCount*100;
      html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.7rem">'+
        '<span style="width:60px;color:var(--tx3);font-family:var(--mono)">Level '+lvl+'</span>'+
        '<div class="progress" style="flex:1"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
        '<span style="width:50px;text-align:right;font-family:var(--mono);color:var(--c1)">'+c+'</span>'+
        '</div>';
    });
    html+='</div>';
    html+='<div class="ws-card"><h3>🏷️ Type Distribution</h3><div class="list">';
    Object.keys(typeDist).sort(function(a,b){return typeDist[b]-typeDist[a];}).forEach(function(t){
      html+='<div class="li"><span class="li-icon">🔖</span><span class="li-name">'+esc(t)+'</span><span class="li-meta">'+typeDist[t]+'</span></div>';
    });
    html+='</div></div>';
    // Longest root-to-leaf path
    var longest='';var maxLen=0;
    function rec(n,path){path=path.concat([n.name]);if(!n.children||!n.children.length){if(path.length>maxLen){maxLen=path.length;longest=path.join(' → ');}return;}(n.children).forEach(function(c){rec(c,path);});}
    rec(root,[]);
    html+='<div class="ws-card"><h3>🛤️ Longest Root→Leaf Path</h3><div style="font-family:var(--mono);font-size:.7rem;color:var(--c1);word-break:break-all">'+esc(longest)+'</div></div>';
    body.innerHTML=html;
  }
});

function doQuery(){
  var root=currentRoot();if(!root)return;
  var name=$('qName').value.toLowerCase();
  var type=$('qType').value.toLowerCase();
  var value=$('qValue').value.toLowerCase();
  var results=[];
  TreeOps.walk(root,function(n,d){
    if(name&&n.name.toLowerCase().indexOf(name)===-1)return;
    if(type&&(n.type||'').toLowerCase().indexOf(type)===-1)return;
    if(value&&String(n.value||'').toLowerCase().indexOf(value)===-1)return;
    results.push({node:n,depth:d});
  });
  var html='<div class="ws-card"><h3>'+results.length+' results</h3>';
  if(!results.length)html+='<div style="color:var(--tx3);font-size:.72rem;padding:12px 0">No matches</div>';
  else{
    html+='<div class="list">';
    results.slice(0,100).forEach(function(r){
      html+='<div class="li" onclick="setSelectedNode(\''+r.node.id+'\');switchModule(\'visualize\');">'+
        '<span class="li-icon">🔖</span>'+
        '<span class="li-name">'+esc(r.node.name)+'</span>'+
        '<span class="li-meta">d='+r.depth+' · '+esc(r.node.type||'—')+'</span></div>';
    });
    html+='</div>';
    if(results.length>100)html+='<div style="color:var(--tx3);font-size:.68rem;margin-top:8px">Showing first 100 of '+results.length+'</div>';
  }
  html+='</div>';
  $('queryResults').innerHTML=html;
}
function clearQuery(){$('qName').value='';$('qType').value='';$('qValue').value='';$('queryResults').innerHTML='';}
