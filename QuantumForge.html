<!DOCTYPE html>
<html lang="en" data-theme="quantum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#06021a">
<title>QUANTUMFORGE — Quantum Computing Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#06021a;--bg2:#0a0426;--bg3:#100636;--bg4:#180a48;
  --panel:#0a0426;--panel2:#120838;--panel3:#1a0c4c;--panel4:#241260;
  --bd:#1e0e54;--bd2:#2e1870;--bd3:#422690;
  --tx:#e8e0ff;--tx2:#b0a0e0;--tx3:#8068c0;--mu:#584090;
  --c1:#00e0ff;--c1h:#80f0ff;--c1l:#00a8c8;
  --c2:#c050ff;--c2h:#e0a0ff;--c2l:#9030e0;
  --c3:#00ffc0;--c3h:#80ffe0;--c3l:#00c898;
  --c4:#ffb800;--c4h:#ffd980;--c4l:#cc9200;
  --c5:#ff2d9e;--c5h:#ff80c8;--c5l:#cc2277;
  --c6:#5b8dff;--c6h:#a8c0ff;--c6l:#3a68cc;
  --c7:#ff6b00;--c7h:#ffa040;--c7l:#cc5500;
  --c8:#c8ff00;--c8h:#e0ff80;--c8l:#a0cc00;
  --ok:#00ffc0;--warn:#ffb800;--err:#ff2d9e;--info:#00e0ff;
  --critical:#ff2d9e;--urgent:#ff6b00;--attention:#ffb800;
  --safe:#00ffc0;--medium:#00e0ff;
  --g1:linear-gradient(135deg,#00e0ff,#c050ff);
  --g2:linear-gradient(135deg,#ff2d9e,#ffb800);
  --g3:linear-gradient(135deg,#00ffc0,#00e0ff);
  --g4:linear-gradient(135deg,#ff6b00,#ff2d9e);
  --g5:linear-gradient(135deg,#5b8dff,#c050ff);
  --gHolo:linear-gradient(120deg,#00e0ff,#c050ff,#ff2d9e,#00ffc0,#ffb800,#00e0ff);
  --gQuantum:linear-gradient(135deg,#00e0ff,#c050ff,#00ffc0);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.7);
  --sh2:0 4px 16px rgba(0,0,0,.8);
  --sh3:0 8px 32px rgba(0,0,0,.9);
  --shGlow:0 0 24px rgba(0,224,255,.4);
  --shGlowPurple:0 0 24px rgba(192,80,255,.4);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f5f2ff;--bg2:#ede8ff;--bg3:#e2dbff;--bg4:#d0c4ff;
  --panel:#ffffff;--panel2:#f8f5ff;--panel3:#ede8ff;--panel4:#ddd0ff;
  --bd:#ddd0ff;--bd2:#b8a4e8;--bd3:#9480c8;
  --tx:#0a0430;--tx2:#3a3070;--tx3:#605890;--mu:#9088b8;
  --c1:#0080c0;--c1h:#00a0e0;--c1l:#005580;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
}
[data-theme="cyberpunk"]{
  --bg:#0a0014;--bg2:#140020;--bg3:#1e0030;--bg4:#2a0044;
  --panel:#140020;--panel2:#1e0030;--panel3:#2a0044;--panel4:#3a0058;
  --bd:#3a0058;--bd2:#5c0088;--bd3:#8800c0;
  --tx:#ffe8ff;--tx2:#e0a8e0;--tx3:#b070b0;--mu:#805880;
  --c1:#ff00ff;--c1h:#ff80ff;--c1l:#cc00cc;
  --c2:#00ffff;--c2h:#80ffff;--c2l:#00cccc;
}
[data-theme="matrix"]{
  --bg:#000800;--bg2:#001200;--bg3:#001c00;--bg4:#002a00;
  --panel:#001200;--panel2:#002000;--panel3:#002e00;--panel4:#004000;
  --bd:#004000;--bd2:#006800;--bd3:#009000;
  --tx:#b0ffc0;--tx2:#60c080;--tx3:#308050;--mu:#205040;
  --c1:#00ff40;--c1h:#80ffb0;--c1l:#00cc30;
  --c2:#00ffa0;--c2h:#80ffd0;--c2l:#00cc80;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--gQuantum);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;box-shadow:var(--shGlow);
  position:relative;overflow:hidden;
}
.sb-logo::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 60%);
  animation:quantumSpin 4s linear infinite;
}
@keyframes quantumSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sb-title{
  font-weight:800;font-size:.98rem;letter-spacing:1.5px;line-height:1;
  background:var(--gHolo);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:holoShift 6s linear infinite;
}
@keyframes holoShift{0%{background-position:0% center}100%{background-position:300% center}}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-qubit{
  padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--bd);flex-shrink:0;
}
.sb-qubit .lab{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:6px}
.qubit-btns{display:flex;gap:4px}
.qubit-btn{
  flex:1;padding:6px 0;border-radius:var(--rxxs);
  background:var(--panel2);border:1px solid var(--bd);
  color:var(--tx2);font-family:var(--mono);font-weight:700;
  cursor:pointer;transition:var(--t);font-size:.72rem;
}
.qubit-btn:hover{background:var(--panel3);color:var(--tx)}
.qubit-btn.active{background:var(--c1);color:#000;border-color:var(--c1)}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(0,224,255,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#fff;
  min-width:16px;text-align:center;font-family:var(--mono);
}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.98rem;flex-shrink:0}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:8px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}

.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g1);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(0,224,255,.35);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(0,224,255,.4)}
.btn.quantum{background:var(--g2);color:#fff;border-color:transparent}
.btn.danger{background:var(--c5);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:11px}
.card.glow{border-color:var(--c1);box-shadow:var(--shGlow),var(--sh1)}
.card.purple{border-color:var(--c2);box-shadow:var(--shGlowPurple),var(--sh1)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:18px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.purple::before{background:var(--g5)}
.kpi.pink::before{background:var(--g2)}
.kpi.green::before{background:var(--g3)}
.kpi.warm::before{background:var(--g4)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;
}
.kpi-value{
  font-size:1.5rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;color:var(--tx);
}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:6px;line-height:1.4}

.chart-box{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}
.chart-canvas{width:100%;height:220px;display:block}

.empty{
  text-align:center;padding:44px 20px;color:var(--tx3);font-size:.78rem;
}
.empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:5px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.66rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;white-space:nowrap;
}
.badge.c1{background:rgba(0,224,255,.18);color:var(--c1);border:1px solid rgba(0,224,255,.35)}
.badge.c2{background:rgba(192,80,255,.18);color:var(--c2);border:1px solid rgba(192,80,255,.35)}
.badge.c3{background:rgba(0,255,192,.18);color:var(--c3);border:1px solid rgba(0,255,192,.35)}
.badge.c4{background:rgba(255,184,0,.18);color:var(--c4);border:1px solid rgba(255,184,0,.35)}
.badge.c5{background:rgba(255,45,158,.18);color:var(--c5);border:1px solid rgba(255,45,158,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}

.divider{height:1px;background:var(--bd);margin:14px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.74rem;gap:10px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,224,255,.15);
}
.field textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.5}

.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:1000px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* Circuit Builder */
.circuit-wrap{
  background:#000;border-radius:var(--r);
  border:1px solid var(--bd);padding:16px;
  overflow-x:auto;
}
.circuit-grid{
  display:grid;gap:8px;align-items:center;
  min-width:fit-content;
}
.circuit-row{
  display:flex;align-items:center;gap:8px;height:60px;
}
.circuit-label{
  width:70px;flex-shrink:0;
  font-family:var(--mono);font-weight:700;
  font-size:.82rem;color:var(--c1);
  text-align:right;padding-right:10px;
}
.circuit-wire{
  display:flex;gap:0;align-items:center;
  flex:1;
}
.circuit-col{
  width:56px;flex-shrink:0;
  height:60px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.circuit-col::before{
  content:'';position:absolute;left:0;right:0;top:50%;
  height:2px;background:var(--bd2);
}
.circuit-col .gate-slot{
  position:relative;z-index:2;
  width:44px;height:44px;
  border-radius:8px;background:var(--panel);
  border:1px dashed var(--bd3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:800;font-size:.9rem;
  color:var(--tx3);cursor:pointer;
  transition:var(--t);
}
.circuit-col .gate-slot:hover{border-color:var(--c1);color:var(--c1);background:var(--panel2)}
.circuit-col .gate-slot.filled{
  border-style:solid;border-color:transparent;
  color:#fff;font-weight:800;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
.gate-slot[data-gate="H"]{background:linear-gradient(135deg,#00e0ff,#0080c0)}
.gate-slot[data-gate="X"]{background:linear-gradient(135deg,#ff2d9e,#cc2277)}
.gate-slot[data-gate="Y"]{background:linear-gradient(135deg,#c050ff,#8033cc)}
.gate-slot[data-gate="Z"]{background:linear-gradient(135deg,#ffb800,#cc9200)}
.gate-slot[data-gate="S"]{background:linear-gradient(135deg,#00ffc0,#00c898)}
.gate-slot[data-gate="T"]{background:linear-gradient(135deg,#5b8dff,#3a68cc)}
.gate-slot[data-gate="Rx"]{background:linear-gradient(135deg,#ff6b00,#cc5500)}
.gate-slot[data-gate="Ry"]{background:linear-gradient(135deg,#c8ff00,#a0cc00)}
.gate-slot[data-gate="Rz"]{background:linear-gradient(135deg,#ff8040,#cc6020)}
.gate-slot[data-gate="MEASURE"]{background:linear-gradient(135deg,#7080a0,#404860)}

/* Gate palette */
.gate-palette{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:8px;
}
.gate-pal{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--rxs);padding:10px 6px;
  text-align:center;cursor:pointer;
  transition:var(--t);
}
.gate-pal:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,224,255,.15)}
.gate-pal .gp-sym{
  font-family:var(--mono);font-weight:800;font-size:1.2rem;
  color:var(--c1);margin-bottom:4px;
}
.gate-pal .gp-name{font-size:.6rem;color:var(--tx3);font-weight:600}

/* Bloch sphere */
.bloch-wrap{
  position:relative;
  background:#000;border-radius:var(--r);
  border:1px solid var(--bd);
  overflow:hidden;
  aspect-ratio:1;
  max-width:500px;margin:0 auto;
}
.bloch-wrap canvas{width:100%;height:100%;display:block;cursor:grab}
.bloch-wrap canvas:active{cursor:grabbing}

/* State display */
.state-vec{
  background:#000;border-radius:var(--rxs);
  padding:14px;font-family:var(--mono);

<script>
"use strict";

/* ================================================================
   UTILS
   ================================================================ */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ'};

  $('toasts').appendChild(t2);
  setTimeout(function(){t2.classList.add('leaving');setTimeout(function(){t2.remove()},320)},2800);
}
function openModal(o){

  box.className='modal-box'+(o.wide?' wide':'')+(o.narrow?' narrow':'');

function closeModal(){$('modal').classList.remove('open')}

/* ================================================================
   COMPLEX NUMBERS
   ================================================================ */
function C(re,im){return {re:re||0,im:im||0}}
function cAdd(a,b){return {re:a.re+b.re,im:a.im+b.im}}
function cSub(a,b){return {re:a.re-b.re,im:a.im-b.im}}
function cMul(a,b){return {re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function cScale(a,s){return {re:a.re*s,im:a.im*s}}
function cAbs(a){return Math.sqrt(a.re*a.re+a.im*a.im)}
function cAbs2(a){return a.re*a.re+a.im*a.im}
function cConj(a){return {re:a.re,im:-a.im}}
function cExp(a){var e=Math.exp(a.re);return {re:e*Math.cos(a.im),im:e*Math.sin(a.im)}}
function cSqrt(a){var r=Math.sqrt(cAbs(a));var theta=Math.atan2(a.im,a.re)/2;return {re:r*Math.cos(theta),im:r*Math.sin(theta)}}
function cStr(a,dec){
  dec=dec===undefined?3:dec;
  var r=a.re.toFixed(dec);
  var im=Math.abs(a.im).toFixed(dec);
  var sign=a.im>=0?'+':'-';
  return r+sign+im+'i';
}
function cStrShort(a){
  if(Math.abs(a.im)<1e-10)return a.re.toFixed(3);
  if(Math.abs(a.re)<1e-10)return a.im.toFixed(3)+'i';
  return a.re.toFixed(3)+(a.im>=0?'+':'-')+Math.abs(a.im).toFixed(3)+'i';
}

/* ================================================================
   MATRIX OPERATIONS (with complex entries)
   Matrices as arrays of arrays of {re,im}
   ================================================================ */
function matMul(A,B){
  var n=A.length,m=B[0].length,k=A[0].length;
  var R=[];
  for(var i=0;i<n;i++){
    R[i]=[];
    for(var j=0;j<m;j++){
      var sum=C(0,0);
      for(var l=0;l<k;l++)sum=cAdd(sum,cMul(A[i][l],B[l][j]));
      R[i][j]=sum;
    }
  }
  return R;
}
function matVec(M,v){
  var n=M.length,k=M[0].length;
  var R=[];
  for(var i=0;i<n;i++){
    var sum=C(0,0);
    for(var j=0;j<k;j++)sum=cAdd(sum,cMul(M[i][j],v[j]));
    R[i]=sum;
  }
  return R;
}
function tensor(A,B){
  var a=A.length,b=A[0].length,c=B.length,d=B[0].length;
  var R=[];
  for(var i=0;i<a*c;i++){
    R[i]=[];
    for(var j=0;j<b*d;j++){
      var ai=Math.floor(i/c),bi=i%c;
      var aj=Math.floor(j/d),bj=j%d;
      R[i][j]=cMul(A[ai][aj],B[bi][bj]);
    }
  }
  return R;
}
function identity(n){
  var R=[];
  for(var i=0;i<n;i++){
    R[i]=[];
    for(var j=0;j<n;j++)R[i][j]=i===j?C(1,0):C(0,0);
  }
  return R;
}

/* ================================================================
   QUANTUM GATES
   Single qubit gates: 2x2 matrices
   ================================================================ */
var SQRT2_INV=1/Math.sqrt(2);

var GATES={
  I:{name:'Identity',matrix:[[C(1,0),C(0,0)],[C(0,0),C(1,0)]],symbol:'I',desc:'Do nothing'},
  X:{name:'Pauli-X (NOT)',matrix:[[C(0,0),C(1,0)],[C(1,0),C(0,0)]],symbol:'X',desc:'Bit flip: |0⟩↔|1⟩'},
  Y:{name:'Pauli-Y',matrix:[[C(0,0),C(0,-1)],[C(0,1),C(0,0)]],symbol:'Y',desc:'Bit + phase flip'},
  Z:{name:'Pauli-Z',matrix:[[C(1,0),C(0,0)],[C(0,0),C(-1,0)]],symbol:'Z',desc:'Phase flip: |1⟩→−|1⟩'},
  H:{name:'Hadamard',matrix:[[C(SQRT2_INV,0),C(SQRT2_INV,0)],[C(SQRT2_INV,0),C(-SQRT2_INV,0)]],symbol:'H',desc:'Creates superposition'},
  S:{name:'S (Phase)',matrix:[[C(1,0),C(0,0)],[C(0,0),C(0,1)]],symbol:'S',desc:'90° phase gate'},
  Sdg:{name:'S† (S-dagger)',matrix:[[C(1,0),C(0,0)],[C(0,0),C(0,-1)]],symbol:'S†',desc:'−90° phase gate'},
  T:{name:'T (π/8)',matrix:[[C(1,0),C(0,0)],[C(0,0),cExp(C(0,Math.PI/4))]],symbol:'T',desc:'45° phase gate'},
  Tdg:{name:'T† (T-dagger)',matrix:[[C(1,0),C(0,0)],[C(0,0),cExp(C(0,-Math.PI/4))]],symbol:'T†',desc:'−45° phase gate'},
  Rx:{name:'Rotation X',matrix:null,symbol:'Rx',desc:'Rotate around X axis',param:true,paramDefault:Math.PI/2,
    build:function(theta){
      var c=Math.cos(theta/2),s=Math.sin(theta/2);
      return [[C(c,0),C(0,-s)],[C(0,-s),C(c,0)]];
    }},
  Ry:{name:'Rotation Y',matrix:null,symbol:'Ry',desc:'Rotate around Y axis',param:true,paramDefault:Math.PI/2,
    build:function(theta){
      var c=Math.cos(theta/2),s=Math.sin(theta/2);
      return [[C(c,0),C(-s,0)],[C(s,0),C(c,0)]];
    }},
  Rz:{name:'Rotation Z',matrix:null,symbol:'Rz',desc:'Rotate around Z axis',param:true,paramDefault:Math.PI/2,
    build:function(theta){
      return [[cExp(C(0,-theta/2)),C(0,0)],[C(0,0),cExp(C(0,theta/2))]];
    }}
};

var TWO_QUBIT_GATES={
  CNOT:{name:'CNOT',desc:'Controlled-NOT (control: target flipped)'},
  CZ:{name:'CZ',desc:'Controlled-Z'},
  SWAP:{name:'SWAP',desc:'Swap two qubits'}
};

/* ================================================================
   QUANTUM STATE — n qubit state vector (2^n complex amplitudes)
   ================================================================ */
var QState={
  n:2,
  vector:[], // array of complex amplitudes, length 2^n

  init:function(n){
    this.n=n;
    this.vector=[];
    var size=1<<n;
    for(var i=0;i<size;i++)this.vector.push(C(i===0?1:0,0));
  },

  reset:function(){
    this.init(this.n);
  },

  // Apply single-qubit gate to qubit k
  applySingleGate:function(gateMatrix,k){
    var n=this.n;
    var size=1<<n;
    var newVec=new Array(size);
    for(var i=0;i<size;i++)newVec[i]=C(0,0);
    for(var i=0;i<size;i++){
      var bit=(i>>(n-1-k))&1;
      var pairBit=i^(1<<(n-1-k));
      if(bit===0){
        var a=this.vector[i];
        var b=this.vector[pairBit];
        newVec[i]=cAdd(cMul(gateMatrix[0][0],a),cMul(gateMatrix[0][1],b));
        newVec[pairBit]=cAdd(cMul(gateMatrix[1][0],a),cMul(gateMatrix[1][1],b));
      }
    }
    this.vector=newVec;
  },

  // Apply CNOT (control, target)
  applyCNOT:function(control,target){
    var n=this.n;
    var size=1<<n;
    var newVec=new Array(size);
    for(var i=0;i<size;i++)newVec[i]=C(0,0);
    for(var i=0;i<size;i++){
      var cBit=(i>>(n-1-control))&1;
      if(cBit===1){
        var flipped=i^(1<<(n-1-target));
        newVec[flipped]=this.vector[i];
      }else{
        newVec[i]=this.vector[i];
      }
    }
    this.vector=newVec;
  },

  applyCZ:function(control,target){
    var n=this.n;
    var size=1<<n;
    var newVec=new Array(size);
    for(var i=0;i<size;i++)newVec[i]=this.vector[i];
    for(var i=0;i<size;i++){
      var cBit=(i>>(n-1-control))&1;
      var tBit=(i>>(n-1-target))&1;
      if(cBit===1&&tBit===1)newVec[i]=cScale(this.vector[i],-1);
    }
    this.vector=newVec;
  },

  applySWAP:function(a,b){
    var n=this.n;
    var size=1<<n;
    var newVec=new Array(size);
    for(var i=0;i<size;i++){
      var aBit=(i>>(n-1-a))&1;
      var bBit=(i>>(n-1-b))&1;
      var newI=i;
      if(aBit!==bBit){
        newI=i^(1<<(n-1-a))^(1<<(n-1-b));
      }
      newVec[newI]=this.vector[i];
    }
    this.vector=newVec;
  },

  // Measurement (returns collapsed state and measured bitstring)
  measure:function(){
    var probs=this.probabilities();
    var r=Math.random();
    var cum=0;
    var outcome=0;
    for(var i=0;i<probs.length;i++){
      cum+=probs[i];
      if(r<cum){outcome=i;break}
      outcome=i;
    }
    // Collapse
    var n=this.n;
    var size=1<<n;
    var newVec=new Array(size);
    for(var i=0;i<size;i++)newVec[i]=i===outcome?C(1,0):C(0,0);
    var oldVec=this.vector;
    this.vector=newVec;
    return outcome;
  },

  probabilities:function(){
    return this.vector.map(function(a){return cAbs2(a)});
  },

  // Get reduced density matrix for a single qubit (other qubits traced out)
  reducedDensityMatrix:function(qubit){
    var n=this.n;
    var size=1<<n;
    var rho=[[C(0,0),C(0,0)],[C(0,0),C(0,0)]];
    for(var i=0;i<size;i++){
      for(var j=0;j<size;j++){
        var bi=(i>>(n-1-qubit))&1;
        var bj=(j>>(n-1-qubit))&1;
        // Only keep terms where other qubits match
        var otherMatch=true;
        for(var k=0;k<n;k++){
          if(k===qubit)continue;
          if(((i>>(n-1-k))&1)!==((j>>(n-1-k))&1)){otherMatch=false;break}
        }
        if(otherMatch){
          rho[bi][bj]=cAdd(rho[bi][bj],cMul(this.vector[i],cConj(this.vector[j])));
        }
      }
    }
    return rho;
  },

  // Get Bloch vector (x, y, z) for a single qubit
  blochVector:function(qubit){
    var rho=this.reducedDensityMatrix(qubit);
    // rho = [[a, b],[c, d]]
    var a=rho[0][0],b=rho[0][1],c2=rho[1][0],d=rho[1][1];
    // x = 2*Re(b), y = 2*Im(b), z = a.re - d.re
    var x=2*b.re;
    var y=2*b.im;
    var z=a.re-d.re;
    return {x:x,y:y,z:z};
  },

  // Purity of a single qubit (1 = pure, 0.5 = maximally mixed)
  purity:function(qubit){
    var rho=this.reducedDensityMatrix(qubit);
    // Tr(rho^2)
    var r00=cAbs2(rho[0][0]);
    var r11=cAbs2(rho[1][1]);
    var r01=cAbs2(rho[0][1]);
    var r10=cAbs2(rho[1][0]);
    return r00+r11+2*r01;
  },

  // Whether the state is entangled (Von Neumann entropy > 0)
  isEntangled:function(){
    if(this.n<2)return false;
    for(var q=0;q<this.n;q++){
      if(this.purity(q)<0.999)return true;
    }
    return false;
  },

  toString:function(){
    var out='';
    for(var i=0;i<this.vector.length;i++){
      var a=this.vector[i];
      if(cAbs(a)<1e-10)continue;
      var bits=i.toString(2).padStart(this.n,'0');
      out+='|'+bits+'⟩: '+cStr(a)+'\n';
    }
    return out;
  }
};

/* ================================================================
   CIRCUIT MODEL
   ================================================================ */
var Circuit={
  n:2,
  depth:12,
  gates:[], // gates[qubit][column] = {type:'H'} or {type:'CNOT',target:1} or null

  init:function(n,depth){
    this.n=n;
    this.depth=depth||12;
    this.gates=[];
    for(var q=0;q<n;q++){
      this.gates.push(new Array(this.depth).fill(null));
    }
  },

  clear:function(){
    for(var q=0;q<this.n;q++)for(var c=0;c<this.depth;c++)this.gates[q][c]=null;
  },

  setGate:function(qubit,col,gate){
    if(qubit<0||qubit>=this.n||col<0||col>=this.depth)return;
    this.gates[qubit][col]=gate;
  },

  removeGate:function(qubit,col){
    this.setGate(qubit,col,null);
  },

  // Run the circuit on QState
  run:function(){
    QState.init(this.n);
    for(var c=0;c<this.depth;c++){
      // Process column
      var processed=new Array(this.n).fill(false);
      for(var q=0;q<this.n;q++){
        if(processed[q])continue;
        var g=this.gates[q][c];
        if(!g)continue;
        if(g.type==='CNOT'){
          QState.applyCNOT(q,g.target);
          processed[q]=true;
          processed[g.target]=true;
        }else if(g.type==='CZ'){
          QState.applyCZ(q,g.target);
          processed[q]=true;
          processed[g.target]=true;
        }else if(g.type==='SWAP'){
          QState.applySWAP(q,g.target);
          processed[q]=true;
          processed[g.target]=true;
        }else if(g.type==='MEASURE'){
          // Skip during unitary simulation
          processed[q]=true;
        }else if(GATES[g.type]){
          var gate=GATES[g.type];
          var matrix=gate.matrix;
          if(gate.param&&g.param!==undefined){
            matrix=gate.build(g.param);
          }
          QState.applySingleGate(matrix,q);
          processed[q]=true;
        }
      }
    }
  }
};

   STATE STORAGE

var CurrentRoute='dashboard';

function navigate(route){

function renderNav(){
  var nav=$('sbNav');
  if(!nav)return;
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var order=['Explore','Learn','Advanced','System'];
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      var badge='';
      if(item.route==='measure'&&State.measurementHistory.length)badge='<span class="ni-badge">'+State.measurementHistory.length+'</span>';
      if(item.route==='saved'&&State.savedCircuits.length)badge='<span class="ni-badge">'+State.savedCircuits.length+'</span>';
      html+='<div class="nav-item'+(item.route===CurrentRoute?' active':'')+'" onclick="navigate(\''+item.route+'\')">'+

            '<span>'+esc(item.meta.title)+'</span>'+badge+'</div>';

  });

<script>
"use strict";
/* ================================================================
   CHARTS
   ================================================================ */
function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=44,padR=14,padT=14,padB=44;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.max(max,0.01);
  max=Math.ceil(max*1.15*100)/100;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*(max/4))).toFixed(2),padL-6,y+3);
  }
  var bw=cW/data.length*0.7,gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    var grad=ctx.createLinearGradient(x,y,x,padT+cH);
    grad.addColorStop(0,d.color||opts.color||'#00e0ff');
    grad.addColorStop(1,(d.color||opts.color||'#00e0ff')+'40');
    ctx.fillStyle=grad;
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);ctx.lineTo(x,padT+cH);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>10)label=label.slice(0,9)+'…';
    ctx.fillText(label,x+bw/2,H-24);
    // Value
    if(d.y>0.001){
      ctx.fillStyle='#e8e0ff';
      ctx.font='bold 10px -apple-system';
      ctx.fillText(d.y.toFixed(3),x+bw/2,padT+cH-6);
      ctx.font='10px -apple-system';
    }
  });
}

function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*((max-min)/4))).toFixed(2),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    ctx.fillText(d.x,padL+(i/(len-1||1))*cW,H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#00e0ff','#c050ff','#00ffc0','#ffb800','#ff2d9e'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);ctx.lineTo(padL,padT+cH);
      ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    }
  });
}

function selectGate(g){
  BuildState.selectedGate=g;
  BuildState.pendingMulti=null;
  renderPage();
}
function selectTwoQubitGate(g){
  BuildState.pendingMulti=g;
  renderPage();
}
function clickCircuitCell(q,c){
  if(BuildState.pendingMulti){
    // Two-qubit gate: need control then target
    if(!BuildState._pendingControl){
      BuildState._pendingControl={qubit:q,col:c};
      toast('Control set on q'+q+' — now click the TARGET qubit in the same column','info');
      return;
    }
    var control=BuildState._pendingControl;
    if(control.col!==c){
      toast('Target must be in the same column','warn');
      return;
    }
    if(control.qubit===q){
      toast('Target must be a different qubit','warn');
      BuildState._pendingControl=null;
      return;
    }
    Circuit.setGate(control.qubit,c,{type:BuildState.pendingMulti,target:q});
    Circuit.setGate(q,c,{type:BuildState.pendingMulti,target:control.qubit,isTarget:true});
    BuildState._pendingControl=null;
    toast(BuildState.pendingMulti+' placed','success');
    Circuit.run();
    renderPage();
    return;
  }
  // Single-qubit gate
  var existing=Circuit.gates[q][c];
  if(existing&&existing.type===BuildState.selectedGate){
    // Remove if same
    Circuit.setGate(q,c,null);
  }else{
    var gateDef=GATES[BuildState.selectedGate];
    var gateData={type:BuildState.selectedGate};
    if(gateDef.param)gateData.param=BuildState.selectedParam;
    Circuit.setGate(q,c,gateData);
  }
  Circuit.run();
  renderPage();
}

function saveCurrentCircuit(){
  var name=prompt('Circuit name:','Circuit '+new Date().toLocaleString());
  if(!name)return;
  State.savedCircuits.unshift({
    id:uid('circ'),
    name:name,
    n:Circuit.n,
    depth:Circuit.depth,
    gates:JSON.parse(JSON.stringify(Circuit.gates)),
    savedAt:new Date().toISOString()
  });
  if(State.savedCircuits.length>50)State.savedCircuits=State.savedCircuits.slice(0,50);
  saveState();
  logActivity('save','Saved circuit: '+name);
  toast('Circuit saved','success');
}

function after_bloch(){
  drawBlochSphere();
  var c=$('blochCanvas');
  if(!c)return;
  c.addEventListener('mousedown',function(e){
    BlochState.dragging=true;
    BlochState.lastX=e.clientX;
    BlochState.lastY=e.clientY;
  });
  document.addEventListener('mousemove',function(e){
    if(!BlochState.dragging)return;
    var dx=e.clientX-BlochState.lastX;
    var dy=e.clientY-BlochState.lastY;
    BlochState.lastX=e.clientX;
    BlochState.lastY=e.clientY;
    BlochState.rotateY+=dx*0.01;
    BlochState.rotateX+=dy*0.01;
    BlochState.rotateX=clamp(BlochState.rotateX,-Math.PI/2+0.01,Math.PI/2-0.01);
    drawBlochSphere();
  });
  document.addEventListener('mouseup',function(){BlochState.dragging=false});
}

function drawBlochSphere(){
  var c=$('blochCanvas');
  if(!c)return;
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;
  c.height=rect.height*dpr;
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  var cx=W/2,cy=H/2;
  var R=Math.min(W,H)*0.35;

  ctx.clearRect(0,0,W,H);

  // Background gradient
  var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  bg.addColorStop(0,'rgba(0,224,255,.05)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Rotation matrices
  var cosX=Math.cos(BlochState.rotateX),sinX=Math.sin(BlochState.rotateX);
  var cosY=Math.cos(BlochState.rotateY),sinY=Math.sin(BlochState.rotateY);
  function project(x,y,z){
    // Rotate around Y
    var x1=x*cosY-z*sinY;
    var z1=x*sinY+z*cosY;
    // Rotate around X
    var y2=y*cosX-z1*sinX;
    var z2=y*sinX+z1*cosX;
    return {x:cx+x1*R,y:cy-y2*R,z:z2};
  }

  // Draw sphere outline (equator circles)
  ctx.strokeStyle='rgba(0,224,255,.25)';
  ctx.lineWidth=1;

  // Equator (XZ plane)
  ctx.beginPath();
  for(var t=0;t<=64;t++){
    var a=t/64*Math.PI*2;
    var p=project(Math.cos(a),0,Math.sin(a));
    if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  // Longitude circle (YZ plane)
  ctx.beginPath();
  for(var t=0;t<=64;t++){
    var a=t/64*Math.PI*2;
    var p=project(0,Math.cos(a),Math.sin(a));
    if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  // Longitude circle (XY plane)
  ctx.beginPath();
  for(var t=0;t<=64;t++){
    var a=t/64*Math.PI*2;
    var p=project(Math.cos(a),Math.sin(a),0);
    if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  // Axes
  var axes=[
    {dir:[1,0,0],label:'X',color:'#ff2d9e'},
    {dir:[0,1,0],label:'Y',color:'#c050ff'},
    {dir:[0,0,1],label:'Z',color:'#00ffc0'}
  ];
  axes.forEach(function(ax){
    var p1=project(-ax.dir[0],-ax.dir[1],-ax.dir[2]);
    var p2=project(ax.dir[0],ax.dir[1],ax.dir[2]);
    ctx.strokeStyle=ax.color+'60';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();
    // Label
    var pl=project(ax.dir[0]*1.15,ax.dir[1]*1.15,ax.dir[2]*1.15);
    ctx.fillStyle=ax.color;
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    ctx.fillText(ax.label,pl.x,pl.y+4);
  });

  // State vector
  var bv=QState.blochVector(BlochState.qubit);
  var mag=Math.sqrt(bv.x*bv.x+bv.y*bv.y+bv.z*bv.z);
  var end=project(bv.x,bv.y,bv.z);
  var origin=project(0,0,0);

  // Arrow
  ctx.strokeStyle='#00e0ff';
  ctx.lineWidth=3;
  ctx.shadowColor='#00e0ff';
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.moveTo(origin.x,origin.y);
  ctx.lineTo(end.x,end.y);
  ctx.stroke();
  ctx.shadowBlur=0;

  // Arrow head
  var angle=Math.atan2(end.y-origin.y,end.x-origin.x);
  ctx.fillStyle='#00e0ff';
  ctx.beginPath();
  ctx.moveTo(end.x,end.y);
  ctx.lineTo(end.x-12*Math.cos(angle-0.4),end.y-12*Math.sin(angle-0.4));
  ctx.lineTo(end.x-12*Math.cos(angle+0.4),end.y-12*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fill();

  // State point
  ctx.beginPath();
  ctx.arc(end.x,end.y,6,0,Math.PI*2);
  ctx.fillStyle='#00e0ff';
  ctx.shadowColor='#00e0ff';
  ctx.shadowBlur=20;
  ctx.fill();
  ctx.shadowBlur=0;

  // Info text
  ctx.fillStyle='rgba(232,224,255,.7)';
  ctx.font='11px monospace';
  ctx.textAlign='left';
  ctx.fillText('|r| = '+mag.toFixed(3),12,H-30);
  ctx.fillText('q'+BlochState.qubit,W-40,H-30);
}

function after_measure(){
  var c=$('measureChart');
  if(!c)return;
  var theoryProbs=QState.probabilities();
  var observed={};
  State.measurementHistory.forEach(function(m){
    observed[m.outcome]=(observed[m.outcome]||0)+1;
  });
  var total=State.measurementHistory.length;
  // Draw comparison bars
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=rect.height*dpr;
  var ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  var padL=44,padR=14,padT=14,padB=44;
  var cW=W-padL-padR,cH=H-padT-padB;
  var n=1<<QState.n;
  var max=Math.max(0.01,Math.max.apply(null,theoryProbs))*1.15;
  if(total>0){
    var maxObs=0;
    for(var k in observed)maxObs=Math.max(maxObs,observed[k]/total);
    max=Math.max(max,maxObs*1.15);
  }
  ctx.strokeStyle='rgba(30,14,84,1)';
  ctx.fillStyle='rgba(128,104,192,1)';
  ctx.font='10px monospace';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*(max/4))).toFixed(2),padL-6,y+3);
  }
  var bw=cW/n*0.35,gap=cW/n;
  for(var i2=0;i2<n;i2++){
    var bits=i2.toString(2).padStart(QState.n,'0');
    var x=padL+i2*gap+gap*0.15;
    // Theory bar
    var h1=(theoryProbs[i2]/max)*cH;
    ctx.fillStyle='rgba(0,224,255,.7)';
    ctx.fillRect(x,padT+cH-h1,bw,h1);
    // Observed bar
    var obs=observed[bits]||0;
    var obsP=total>0?obs/total:0;
    var h2=(obsP/max)*cH;
    ctx.fillStyle='rgba(192,80,255,.7)';
    ctx.fillRect(x+bw+2,padT+cH-h2,bw,h2);
    // Label
    ctx.fillStyle='rgba(232,224,255,.7)';
    ctx.textAlign='center';
    ctx.fillText('|'+bits+'⟩',x+bw,H-24);
  }
  // Legend
  ctx.textAlign='left';
  ctx.fillStyle='rgba(0,224,255,.9)';
  ctx.fillRect(padL,padT-10,12,6);
  ctx.fillStyle='rgba(232,224,255,.8)';
  ctx.fillText('Theory',padL+18,padT-4);
  ctx.fillStyle='rgba(192,80,255,.9)';
  ctx.fillRect(padL+80,padT-10,12,6);
  ctx.fillStyle='rgba(232,224,255,.8)';
  ctx.fillText('Observed',padL+98,padT-4);
}

function singleShot(){
  var outcome=QState.measure();
  var bits=outcome.toString(2).padStart(QState.n,'0');
  State.measurementHistory.unshift({
    id:uid('m'),outcome:bits,outcomeInt:outcome,n:QState.n,ts:new Date().toISOString()
  });
  saveState();
  toast('Outcome: |'+bits+'⟩','success');
  renderPage();
}
function manyShots(count){
  // Save current state
  var savedVector=QState.vector.map(function(a){return {re:a.re,im:a.im}});
  for(var i=0;i<count;i++){
    var outcome=QState.measure();
    var bits=outcome.toString(2).padStart(QState.n,'0');
    State.measurementHistory.unshift({
      id:uid('m'),outcome:bits,outcomeInt:outcome,n:QState.n,ts:new Date().toISOString()
    });
    // Restore for next shot
    QState.vector=savedVector.map(function(a){return {re:a.re,im:a.im}});
  }
  if(State.measurementHistory.length>1000)State.measurementHistory=State.measurementHistory.slice(0,1000);
  saveState();
  toast(count+' shots recorded','success');
  renderPage();
}

<script>

var PlayState={theta:0,phi:0};

function render_playground(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🎮</span>Qubit Playground</div>';

  html+='<p style="font-size:.72rem;color:var(--tx2);line-height:1.7;margin-bottom:14px">Any single-qubit pure state can be written as |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩ where θ is polar angle (0 to π) and φ is azimuthal (0 to 2π).</p>';

  html+='<div class="field"><label>Polar angle θ = <span class="mono">'+PlayState.theta.toFixed(3)+'</span> rad ('+(PlayState.theta/Math.PI*180).toFixed(1)+'°)</label>';
  html+='<input type="range" min="0" max="'+(Math.PI).toFixed(4)+'" step="0.01" value="'+PlayState.theta+'" oninput="PlayState.theta=parseFloat(this.value);renderPage()" style="width:100%"></div>';

  html+='<div class="field"><label>Azimuthal angle φ = <span class="mono">'+PlayState.phi.toFixed(3)+'</span> rad ('+(PlayState.phi/Math.PI*180).toFixed(1)+'°)</label>';

function drawPlaygroundBloch(){
  var c=$('playBlochCanvas');
  if(!c)return;
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;
  c.height=rect.height*dpr;
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  var cx=W/2,cy=H/2;
  var R=Math.min(W,H)*0.35;
  ctx.clearRect(0,0,W,H);

  var rotY=0.6,rotX=-0.4;
  var cosX=Math.cos(rotX),sinX=Math.sin(rotX);
  var cosY=Math.cos(rotY),sinY=Math.sin(rotY);
  function project(x,y,z){
    var x1=x*cosY-z*sinY;
    var z1=x*sinY+z*cosY;
    var y2=y*cosX-z1*sinX;
    var z2=y*sinX+z1*cosX;
    return {x:cx+x1*R,y:cy-y2*R,z:z2};
  }

  // Sphere outline
  ctx.strokeStyle='rgba(192,80,255,.25)';
  ctx.lineWidth=1;
  for(var axis=0;axis<3;axis++){
    ctx.beginPath();
    for(var t=0;t<=64;t++){
      var a=t/64*Math.PI*2;
      var p;
      if(axis===0)p=project(Math.cos(a),0,Math.sin(a));
      else if(axis===1)p=project(0,Math.cos(a),Math.sin(a));
      else p=project(Math.cos(a),Math.sin(a),0);
      if(t===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }

  // Axes
  var axes=[
    {dir:[1,0,0],label:'X',color:'#ff2d9e'},
    {dir:[0,1,0],label:'Y',color:'#c050ff'},
    {dir:[0,0,1],label:'Z',color:'#00ffc0'}
  ];
  axes.forEach(function(ax){
    var p1=project(-ax.dir[0],-ax.dir[1],-ax.dir[2]);
    var p2=project(ax.dir[0],ax.dir[1],ax.dir[2]);
    ctx.strokeStyle=ax.color+'60';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();
    var pl=project(ax.dir[0]*1.15,ax.dir[1]*1.15,ax.dir[2]*1.15);
    ctx.fillStyle=ax.color;
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    ctx.fillText(ax.label,pl.x,pl.y+4);
  });

  // State vector from theta/phi
  var x=Math.sin(PlayState.theta)*Math.cos(PlayState.phi);
  var y=Math.sin(PlayState.theta)*Math.sin(PlayState.phi);
  var z=Math.cos(PlayState.theta);
  var end=project(x,y,z);
  var origin=project(0,0,0);
  ctx.strokeStyle='#00e0ff';
  ctx.lineWidth=3;
  ctx.shadowColor='#00e0ff';
  ctx.shadowBlur=15;
  ctx.beginPath();
  ctx.moveTo(origin.x,origin.y);
  ctx.lineTo(end.x,end.y);
  ctx.stroke();
  ctx.shadowBlur=0;
  var angle=Math.atan2(end.y-origin.y,end.x-origin.x);
  ctx.fillStyle='#00e0ff';
  ctx.beginPath();
  ctx.moveTo(end.x,end.y);
  ctx.lineTo(end.x-12*Math.cos(angle-0.4),end.y-12*Math.sin(angle-0.4));
  ctx.lineTo(end.x-12*Math.cos(angle+0.4),end.y-12*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(end.x,end.y,6,0,Math.PI*2);
  ctx.fillStyle='#00e0ff';
  ctx.shadowColor='#00e0ff';
  ctx.shadowBlur=20;
  ctx.fill();
  ctx.shadowBlur=0;
}

  html+='<div>H|+⟩ = |0⟩    H|−⟩ = |1⟩</div>';
  html+='<div>H = (X+Z)/√2 = (1/√2) [ 1  1 ; 1 −1 ]</div>';

  html+='<div style="margin-top:12px;color:var(--c1)">H on n qubits:</div>';
  html+='<div>H^⊗n |0...0⟩ = (1/√(2ⁿ)) Σ |x⟩ for all x in {0,1}ⁿ</div>';
  html+='</div>';
  html+='</div>';

  html+='<div class="card pad-lg mb-16">';

  html+='<div style="margin-top:12px;color:var(--c1)">Expectation value:</div>';

  html+='</div>';

  html+='<div class="card pad-lg mb-16">';
  html+='<h3 style="font-size:.88rem;margin-bottom:12px">🔗 Entanglement</h3>';
  html+='<div class="state-vec">';
  html+='<div>Bell state: |Φ+⟩ = (|00⟩+|11⟩)/√2</div>';
  html+='<div>Cannot be written as |a⟩⊗|b⟩ (non-separable)</div>';
  html+='<div>Reduced density matrix is mixed: ρ = I/2</div>';
  html+='<div>Measuring q0 instantly determines q1</div>';
  html+='<div style="margin-top:12px;color:var(--c1)">Von Neumann entropy:</div>';
  html+='<div>S(ρ) = −Tr(ρ log ρ)</div>';
  html+='<div>S = 0 for pure states, S = 1 for maximally mixed</div>';
  html+='</div>';
  html+='</div>';

  html+='</div>';

  return html;
}

var GLOSSARY=[
  ['Amplitude','Complex number αᵢ in |ψ⟩ = Σ αᵢ|i⟩. Squared magnitude gives probability.'],
  ['Ancilla','Helper qubit used in algorithms but not part of the answer.'],
  ['Bell state','Maximally entangled two-qubit state like (|00⟩+|11⟩)/√2.'],
  ['Bloch sphere','3D geometric representation of single-qubit states.'],
  ['Bra-ket notation','Dirac notation: |ψ⟩ is a state, ⟨ψ| is its dual.'],
  ['Circuit','Sequence of gates applied to a set of qubits.'],
  ['CNOT','Two-qubit gate: flips target qubit if control is |1⟩.'],
  ['Coherence','Preservation of quantum superposition over time.'],
  ['Decoherence','Loss of quantum information due to interaction with environment.'],
  ['Density matrix','ρ = Σ pᵢ|ψᵢ⟩⟨ψᵢ|. Describes both pure and mixed states.'],
  ['Entanglement','Quantum correlation where qubits cannot be described independently.'],
  ['Gate','Unitary operation on one or more qubits.'],
  ['GHZ state','3+ qubit generalization of Bell state: (|000⟩+|111⟩)/√2.'],
  ['Hadamard','Gate that creates equal superposition: H|0⟩ = (|0⟩+|1⟩)/√2.'],
  ['Ket','|ψ⟩ — notation for a quantum state vector.'],
  ['Measurement','Reading out a qubit, collapsing its state to a basis vector.'],
  ['Mixed state','Statistical mixture of pure states; Bloch vector length < 1.'],
  ['No-cloning','Theorem: unknown quantum state cannot be copied.'],
  ['Oracle','Black-box function in quantum algorithm that marks solutions.'],
  ['Pauli gates','X, Y, Z — fundamental single-qubit operations.'],
  ['Phase','The complex angle e^(iφ) in an amplitude.'],
  ['Pure state','State fully described by a single ket. Bloch vector on sphere surface.'],
  ['Qubit','Quantum bit: 2-level quantum system. Superposition of |0⟩ and |1⟩.'],
  ['QFT','Quantum Fourier Transform. Quantum version of DFT.'],
  ['Superposition','Linear combination of basis states α|0⟩ + β|1⟩.'],
  ['Teleportation','Moving a quantum state using entanglement + classical bits.'],
  ['Tensor product','Way to combine multiple qubit states: |a⟩⊗|b⟩.'],
  ['Toffoli','3-qubit gate: flip target if both controls are |1⟩.'],
  ['Unitary','Matrix U with U†U = I. Preserves probability.'],
  ['Universal gate set','Small set of gates that can approximate any unitary.'],
  ['Von Neumann entropy','S = −Tr(ρ log ρ). Measures quantum uncertainty.']
];

function render_noise(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">📉</span>Noise Simulator</div>';

  html+='<p style="font-size:.74rem;color:var(--tx2);line-height:1.6;margin-bottom:12px">Real quantum computers suffer from decoherence — qubits lose their quantum properties due to environmental interaction. This simulator shows the effect of depolarizing noise.</p>';

  html+='<div class="grid-2">';
  html+='<div>';
  html+='<div class="field"><label>Noise probability p: <span class="mono" id="noisePVal">0.10</span></label>';
  html+='<input type="range" id="noiseP" min="0" max="1" step="0.01" value="0.10" oninput="document.getElementById(\'noisePVal\').textContent=parseFloat(this.value).toFixed(2)" style="width:100%"></div>';
  html+='</div>';
  html+='<div style="display:flex;gap:8px;align-items:flex-end">';
  html+='<button class="btn primary" onclick="applyNoise()">🎲 Apply Noise</button>';
  html+='<button class="btn" onclick="runCircuit();toast(\'State restored\',\'success\')">↺ Restore</button>';
  html+='</div>';
  html+='</div>';
  html+='</div>';

  html+='<div class="card pad-lg mb-16">';
  html+='<h3 style="font-size:.88rem;margin-bottom:12px">Current Purity</h3>';
  var purities=[];
  for(var q=0;q<QState.n;q++)purities.push(QState.purity(q));
  var avgPurity=purities.reduce(function(a,b){return a+b},0)/purities.length;
  html+='<div class="kpi-grid" style="margin-bottom:0">';
  html+='<div class="kpi"><div class="kpi-label">Average purity</div><div class="kpi-value">'+avgPurity.toFixed(4)+'</div><div class="kpi-hint">'+(avgPurity>0.99?'Essentially pure':avgPurity>0.7?'Somewhat mixed':'Very mixed')+'</div></div>';

  html+='</div>';

  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.88rem;margin-bottom:12px">Understanding Noise Types</h3>';
  html+='<div class="state-vec">';
  html+='<div style="color:var(--c1)">Depolarizing channel:</div>';
  html+='<div>ρ → (1−p)ρ + p·I/2 (for single qubit)</div>';
  html+='<div>Randomly applies X, Y, or Z with probability p/3 each</div>';
  html+='<div style="margin-top:12px;color:var(--c1)">Amplitude damping:</div>';
  html+='<div>Models energy loss: |1⟩ → |0⟩ with probability γ</div>';
  html+='<div>Used for T1 relaxation modeling</div>';
  html+='<div style="margin-top:12px;color:var(--c1)">Phase damping:</div>';
  html+='<div>Loses phase coherence without energy loss</div>';
  html+='<div>Used for T2 dephasing modeling</div>';
  html+='</div>';
  html+='</div>';

  return html;
}

function applyNoise(){
  var p=parseFloat($('noiseP').value);
  var n=QState.n;
  var size=1<<n;
  // Depolarizing noise per qubit
  for(var q=0;q<n;q++){
    if(Math.random()<p){
      // Apply random Pauli
      var r=Math.random();
      var gate='X';
      if(r<0.33)gate='X';
      else if(r<0.66)gate='Y';
      else gate='Z';
      QState.applySingleGate(GATES[gate].matrix,q);
    }
  }
  logActivity('noise','Applied noise p='+p.toFixed(2));
  toast('Noise applied (p='+p.toFixed(2)+')','warn');
  renderPage();
}

var CompareState={snapshots:[]};

function render_compare(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">⚖️</span>State Comparison</div>';
  html+='<div class="page-desc">Compare quantum states over time</div></div>';

  html+='<button class="btn primary" onclick="snapshotState()">📸 Snapshot Current</button>';
  html+='<button class="btn danger" onclick="CompareState.snapshots=[];renderPage()">🗑 Clear All</button>';
  html+='</div></div>';

  if(!CompareState.snapshots.length){
    html+='<div class="empty"><span class="icon">⚖️</span><h4>No snapshots yet</h4><p>Take a snapshot to compare quantum states.</p></div>';
    return html;
  }

  html+='<div class="card pad-lg mb-16">';
  html+='<h3 style="font-size:.88rem;margin-bottom:12px">Fidelity Matrix</h3>';
  html+='<p style="font-size:.72rem;color:var(--tx2);line-height:1.6;margin-bottom:12px">Fidelity F(ψ,φ) = |⟨ψ|φ⟩|² measures how similar two quantum states are. 1 = identical, 0 = orthogonal.</p>';
  html+='<div class="ref-table"><table><thead><tr><th></th>';
  CompareState.snapshots.forEach(function(s,i){html+='<th>#'+(i+1)+'</th>'});
  html+='</tr></thead><tbody>';
  CompareState.snapshots.forEach(function(s1,i){
    html+='<tr><td><strong>#'+(i+1)+'</strong></td>';
    CompareState.snapshots.forEach(function(s2,j){
      var f=stateFidelity(s1,s2);
      var cls=f>0.999?'c3':f>0.9?'c1':f>0.5?'c4':'c5';
      html+='<td class="mono"><span class="badge '+cls+'">'+f.toFixed(4)+'</span></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  html+='</div>';

  html+='<div class="grid-2">';
  CompareState.snapshots.forEach(function(s,i){
    html+='<div class="card pad-lg">';
    html+='<div style="display:flex;justify-content:space-between;align-items:start">';
    html+='<div><div style="font-weight:700;font-size:.85rem">Snapshot #'+(i+1)+'</div>';
    html+='<div style="font-size:.68rem;color:var(--tx3);margin-top:2px">'+new Date(s.ts).toLocaleTimeString()+'</div></div>';
    html+='<button class="btn ghost xs" onclick="CompareState.snapshots.splice('+i+',1);renderPage()">✕</button>';
    html+='</div>';
    html+='<div class="state-vec mt-12" style="max-height:200px;font-size:.68rem">';
    for(var k=0;k<s.vector.length;k++){
      var a=s.vector[k];
      if(cAbs(a)<1e-10)continue;
      var bits=k.toString(2).padStart(s.n,'0');
      html+='<div>|'+bits+'⟩: '+cStrShort(a)+' ('+(cAbs2(a)*100).toFixed(2)+'%)</div>';
    }
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';

  return html;
}

function snapshotState(){
  CompareState.snapshots.push({
    ts:new Date().toISOString(),
    n:QState.n,
    vector:QState.vector.map(function(a){return {re:a.re,im:a.im}})
  });
  toast('Snapshot captured','success');
  renderPage();
}

function stateFidelity(s1,s2){
  if(s1.n!==s2.n)return 0;
  var sum=C(0,0);
  for(var i=0;i<s1.vector.length;i++){
    sum=cAdd(sum,cMul(cConj(s1.vector[i]),s2.vector[i]));
  }
  return cAbs2(sum);
}

function exportData(){

  a.download='quantumforge-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Exported','success');
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(data.savedCircuits)State.savedCircuits=data.savedCircuits;
        if(data.measurementHistory)State.measurementHistory=data.measurementHistory;
        if(data.settings)State.settings=Object.assign(State.settings,data.settings);
        saveState();renderPage();
        toast('Imported','success');
      }catch(e){toast('Import failed','error')}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================================================================
   INIT
   ================================================================ */
function initApp(){
  var loaded=loadState();
  if(!loaded){
    // fresh
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'quantum');
  // Initialize circuit
  Circuit.n=State.settings.n||2;
  Circuit.init(Circuit.n,Circuit.depth);
  QState.init(Circuit.n);
  // Wire sidebar
  renderQubitButtons();
  renderNav();
  renderPage();
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='bloch')drawBlochSphere();
    if(CurrentRoute==='playground')drawPlaygroundBloch();
  });
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.key==='r'){runCircuit()}
    if(e.key==='m'){measureAll()}
    if(e.key==='?'){openHelp()}
  });
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  window.addEventListener('beforeunload',saveState);
  setTimeout(function(){toast('⚛️ QuantumForge ready','success')},300);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
