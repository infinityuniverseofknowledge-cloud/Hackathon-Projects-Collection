<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0612">
<title>SONICFORGE — Music Production Studio</title>
<style>
/* ================================================================
   SONICFORGE — Design System
   Dark studio / neon synthwave aesthetic
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#0a0612;--bg2:#0f0a1a;--bg3:#151024;--bg4:#1d1633;
  --panel:#120c20;--panel2:#1a1230;--panel3:#241a42;--panel4:#2e2258;
  --bd:#251a48;--bd2:#3a2a6a;--bd3:#554090;
  --tx:#f0e8ff;--tx2:#b8a8e0;--tx3:#8070b0;--mu:#5a4a90;
  --c1:#00ffd5;--c1h:#80ffe8;--c1l:#00ccaa;
  --c2:#ff2d9e;--c2h:#ff80c8;--c2l:#cc2277;
  --c3:#a855f7;--c3h:#d0a0ff;--c3l:#8033cc;
  --c4:#ffb800;--c4h:#ffd980;--c4l:#cc9200;
  --c5:#00d4ff;--c5h:#80e8ff;--c5l:#00a3cc;
  --c6:#ff6b00;--c6h:#ffa040;--c6l:#cc5500;
  --c7:#c8ff00;--c7h:#e0ff80;--c7l:#a0cc00;
  --c8:#ff0066;--c8h:#ff80a8;--c8l:#cc0052;
  --c9:#5b8dff;--c9h:#a8c0ff;--c9l:#3a68cc;
  --c10:#00ff9d;--c10h:#80ffc8;--c10l:#00cc7a;
  --ok:#00ff9d;--warn:#ffb800;--err:#ff2d9e;--info:#00d4ff;
  --g1:linear-gradient(135deg,#00ffd5,#a855f7);
  --g2:linear-gradient(135deg,#ff2d9e,#ffb800);
  --g3:linear-gradient(135deg,#00d4ff,#a855f7);
  --g4:linear-gradient(135deg,#00ff9d,#00d4ff);
  --g5:linear-gradient(135deg,#a855f7,#ff2d9e);
  --gHolo:linear-gradient(120deg,#00ffd5,#a855f7,#ff2d9e,#ffb800,#00d4ff,#00ffd5);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.7);
  --sh2:0 4px 16px rgba(0,0,0,.8);
  --sh3:0 8px 32px rgba(0,0,0,.9);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --shGlow1:0 0 20px rgba(0,255,213,.5);
  --shGlow2:0 0 20px rgba(255,45,158,.5);
  --shGlow3:0 0 20px rgba(168,85,247,.5);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{--bg:#000;--bg2:#0a0a0a;--panel:#101010;--panel2:#181818;--bd:#282828;--c1:#ffffff;--c2:#888}
[data-theme="amber"]{
  --bg:#140a02;--bg2:#1e0e04;--bg3:#2a1408;--bg4:#361c10;
  --panel:#1a0c04;--panel2:#2a1408;--panel3:#361c10;--panel4:#442418;
  --bd:#3a1e0a;--bd2:#5a3014;--bd3:#804420;
  --tx:#ffe8c8;--tx2:#d8b080;--tx3:#a08050;--mu:#705838;
  --c1:#ffb800;--c1h:#ffd060;--c1l:#cc9200;
  --c2:#ff6b00;--c2h:#ffa040;--c2l:#cc5500;
  --c3:#ffe040;--c3h:#fff080;--c3l:#cca800;
  --c4:#ff3b00;--c4h:#ff8040;--c4l:#cc2e00;
}
[data-theme="ice"]{
  --bg:#020810;--bg2:#04101e;--bg3:#06182c;--bg4:#0a2038;
  --panel:#04101e;--panel2:#06182c;--panel3:#0a2038;--panel4:#0e2848;
  --bd:#0a2038;--bd2:#103458;--bd3:#184878;
  --tx:#d8f0ff;--tx2:#90c0e0;--tx3:#6090b0;--mu:#406880;
  --c1:#00d4ff;--c1h:#80e8ff;--c1l:#00a3cc;
  --c2:#00ffd5;--c2h:#80ffe8;--c2l:#00ccaa;
  --c3:#5b8dff;--c3h:#a8c0ff;--c3l:#3a68cc;
  --c4:#00ff9d;--c4h:#80ffc8;--c4l:#00cc7a;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

/* ================================================================
   LAYOUT
   ================================================================ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:12px 14px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.sb-logo{
  width:36px;height:36px;border-radius:9px;
  background:var(--gHolo);background-size:300% auto;
  animation:holoShift 5s linear infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(168,85,247,.5);
}
@keyframes holoShift{0%{background-position:0% center}100%{background-position:300% center}}
.sb-title{
  font-weight:800;font-size:.92rem;letter-spacing:1.5px;line-height:1;
  background:var(--gHolo);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:holoShift 6s linear infinite;
}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(0,255,213,.3)}
.nav-item.active .ni-icon{color:#000}
.nav-item .ni-icon{font-size:.95rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#fff;
  min-width:16px;text-align:center;font-family:var(--mono);
}
.nav-item.active .ni-badge{background:rgba(0,0,0,.3);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:52px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.94rem;flex-shrink:0;letter-spacing:.5px}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:6px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn.active{background:var(--c1);color:#000;box-shadow:var(--shGlow1)}

.page{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.page-title{font-size:1.3rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g3);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(0,212,255,.4);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:3px;margin-left:44px}

/* ================================================================
   TRANSPORT BAR
   ================================================================ */
.transport{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:var(--panel2);
  border:1px solid var(--bd);border-radius:var(--r);
  margin-bottom:14px;flex-wrap:wrap;
}
.tx-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--panel3);border:1px solid var(--bd2);
  color:var(--tx);cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);flex-shrink:0;
}
.tx-btn:hover{background:var(--panel4);border-color:var(--c1)}
.tx-btn.play{
  width:46px;height:46px;font-size:1.15rem;
  background:var(--g1);color:#000;border:none;
  box-shadow:0 0 20px rgba(0,255,213,.4);
}
.tx-btn.play:hover{box-shadow:0 0 30px rgba(0,255,213,.7);transform:scale(1.05)}
.tx-btn.rec{background:var(--c8);color:#fff;border-color:var(--c8)}
.tx-btn.rec.on{animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 8px var(--c8)}50%{box-shadow:0 0 24px var(--c8),0 0 40px var(--c8)}}
.tx-btn.on{background:var(--c1);color:#000}

.tx-display{
  background:#000;border:1px solid var(--bd2);border-radius:var(--rxs);
  padding:6px 14px;font-family:var(--mono);
  display:flex;gap:14px;align-items:center;flex-shrink:0;
}
.tx-display .big{
  font-size:1.3rem;font-weight:700;color:var(--c1);
  letter-spacing:2px;text-shadow:0 0 10px var(--c1);
}
.tx-display .label{font-size:.55rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}

.tx-sliders{
  display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap;
}
.tx-slider{
  display:flex;align-items:center;gap:8px;
  padding:4px 10px;background:var(--panel3);border-radius:var(--rxs);
}
.tx-slider .lab{font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700;letter-spacing:.6px}
.tx-slider input[type=range]{
  width:100px;height:5px;-webkit-appearance:none;
  background:var(--bd2);border-radius:3px;padding:0;
}
.tx-slider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--c1);cursor:pointer;box-shadow:0 0 8px var(--c1);
}
.tx-slider .val{font-family:var(--mono);font-size:.65rem;color:var(--c1);min-width:32px;text-align:right}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(0,255,213,.4)}
.btn.pink{background:var(--g2);color:#fff;border-color:transparent}
.btn.violet{background:var(--g5);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:var(--c8);color:#fff;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.on{background:var(--c1);color:#000;border-color:transparent}

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:10px}
.card.glow{border-color:var(--c1);box-shadow:0 0 20px rgba(0,255,213,.15),var(--sh1)}

/* ================================================================
   STEP SEQUENCER
   ================================================================ */
.seq-wrap{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;margin-bottom:14px;
}
.seq-head{
  padding:10px 14px;background:var(--panel2);
  border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;
}
.seq-head h3{font-size:.85rem;font-weight:700;letter-spacing:.5px}
.seq-grid{
  overflow-x:auto;padding:10px 14px;
}
.seq-row{
  display:grid;grid-template-columns:100px repeat(16,1fr);
  gap:4px;margin-bottom:4px;align-items:center;
  min-width:700px;
}
.seq-row .row-label{
  padding:5px 8px;background:var(--panel2);border-radius:var(--rxxs);
  font-size:.68rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.6px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:var(--t);
}
.seq-row .row-label:hover{background:var(--panel3);color:var(--tx)}
.seq-row .row-label .mini-btn{
  width:18px;height:18px;border-radius:50%;
  background:var(--panel3);border:none;color:var(--tx2);
  cursor:pointer;font-size:.6rem;display:flex;align-items:center;justify-content:center;
  transition:var(--t);margin-left:4px;
}
.seq-row .row-label .mini-btn:hover{background:var(--c1);color:#000}
.seq-cell{
  aspect-ratio:1;border-radius:var(--rxxs);
  background:var(--bg3);border:1px solid var(--bd);
  cursor:pointer;transition:var(--t);
  position:relative;min-height:28px;
}
.seq-cell:hover{border-color:var(--c1);transform:scale(1.05)}
.seq-cell.beat{background:var(--bg4);border-color:var(--bd2)}
.seq-cell.active{background:var(--c1);border-color:var(--c1h);box-shadow:0 0 12px var(--c1)}
.seq-cell.active.acc{background:var(--c2);border-color:var(--c2h);box-shadow:0 0 12px var(--c2)}
.seq-cell.playing{outline:2px solid var(--c4);outline-offset:-2px}
.seq-cell.playing.active{background:var(--c4);border-color:var(--c4h);box-shadow:0 0 20px var(--c4)}
.seq-cell.playing.acc{background:var(--c6);border-color:var(--c6h);box-shadow:0 0 20px var(--c6)}

/* ================================================================
   PIANO ROLL
   ================================================================ */
.piano-roll{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;
}
.pr-toolbar{
  padding:10px 14px;background:var(--panel2);
  border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;
}
.pr-toolbar h3{font-size:.85rem;font-weight:700}
.pr-canvas-wrap{
  overflow:auto;padding:0;
  background:#000;
  position:relative;
}
.pr-canvas{display:block;cursor:crosshair}

/* ================================================================
   MIXER
   ================================================================ */
.mixer{
  display:flex;gap:10px;padding:14px;
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow-x:auto;
}
.mixer-ch{
  width:90px;flex-shrink:0;
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--rxs);padding:8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.mixer-ch .ch-name{
  font-size:.62rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.6px;
  text-align:center;width:100%;
  padding:2px 4px;border-radius:3px;
}
.mixer-ch .ch-color{width:100%;height:3px;border-radius:2px}
.mixer-ch .ch-fader{
  width:100%;height:140px;
  display:flex;justify-content:center;
  position:relative;
}
.mixer-ch input[type=range].vertical{
  writing-mode:bt-lr;-webkit-appearance:slider-vertical;
  width:100%;height:140px;padding:0;margin:0;
  background:transparent;
}
.mixer-ch input[type=range].vertical::-webkit-slider-runnable-track{
  width:4px;background:var(--bd2);border-radius:2px;
}
.mixer-ch input[type=range].vertical::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:12px;
  border-radius:2px;background:var(--c1);cursor:pointer;
  box-shadow:0 0 8px var(--c1);margin-left:-8px;
}
.mixer-ch .ch-btns{display:flex;gap:3px;width:100%;justify-content:center}
.mixer-ch .ch-btn{
  flex:1;padding:3px 0;border-radius:3px;
  background:var(--panel3);border:1px solid var(--bd2);
  font-size:.55rem;font-weight:700;color:var(--tx2);
  cursor:pointer;transition:var(--t);text-align:center;
}
.mixer-ch .ch-btn.mute.on{background:var(--c8);color:#fff;border-color:var(--c8)}
.mixer-ch .ch-btn.solo.on{background:var(--c4);color:#000;border-color:var(--c4)}
.mixer-ch .ch-btn:hover{border-color:var(--c1)}
.mixer-ch .ch-db{font-size:.6rem;font-family:var(--mono);color:var(--c1);min-height:14px}
.mixer-ch .ch-vu{
  width:100%;height:8px;background:var(--bg3);border-radius:3px;
  overflow:hidden;position:relative;
}
.mixer-ch .ch-vu .vu-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg,var(--c10),var(--c4),var(--c8));
  transition:width .08s linear;
}

/* ================================================================
   SYNTH PANEL
   ================================================================ */
.synth-panel{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;margin-bottom:14px;
}
.synth-panel h3{
  font-size:.85rem;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.synth-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:14px;
}
.synth-module{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--rxs);padding:12px;
}
.synth-module h4{
  font-size:.65rem;color:var(--c1);text-transform:uppercase;
  letter-spacing:1.2px;font-weight:800;margin-bottom:10px;
}
.knob-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:8px;
}
.knob{
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.knob-ring{
  width:52px;height:52px;border-radius:50%;
  background:conic-gradient(var(--c1) 0deg,var(--bd2) 0deg,var(--bd2) 360deg);
  display:flex;align-items:center;justify-content:center;
  cursor:ns-resize;position:relative;transition:box-shadow .15s;
  box-shadow:inset 0 0 10px rgba(0,0,0,.5);
}
.knob-ring:hover{box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 0 12px var(--c1)}
.knob-ring::after{
  content:'';position:absolute;top:2px;left:50%;
  width:2px;height:10px;background:var(--c1);
  border-radius:2px;transform-origin:50% 24px;
  transform:translateX(-50%) rotate(0deg);
  transition:transform .05s;
}
.knob-inner{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--panel4),var(--panel));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.6rem;font-weight:700;
  color:var(--c1);pointer-events:none;
}
.knob label{
  font-size:.55rem;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.8px;font-weight:700;text-align:center;
}

/* ================================================================
   EFFECTS RACK
   ================================================================ */
.fx-rack{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;
}
.fx-unit{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  transition:var(--t);position:relative;
  overflow:hidden;
}
.fx-unit::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--gHolo);background-size:200% auto;
  animation:holoShift 8s linear infinite;opacity:.6;
}
.fx-unit.active::before{opacity:1}
.fx-unit h3{
  font-size:.8rem;font-weight:700;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
  color:var(--tx);
}
.fx-toggle{
  width:36px;height:20px;border-radius:10px;
  background:var(--bd2);border:none;cursor:pointer;
  position:relative;transition:var(--t);
}
.fx-toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;transition:var(--t);
}
.fx-toggle.on{background:var(--c1)}
.fx-toggle.on::after{left:18px;background:#000}
.fx-knobs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(65px,1fr));
  gap:8px;margin-top:10px;
}

/* ================================================================
   PATTERNS + SONGS
   ================================================================ */
.pattern-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.pattern-card{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--r);padding:12px;cursor:pointer;
  transition:var(--t);position:relative;
}
.pattern-card:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,255,213,.2)}
.pattern-card.active{border-color:var(--c1);background:linear-gradient(135deg,var(--panel2),rgba(0,255,213,.08));box-shadow:0 0 20px rgba(0,255,213,.25)}
.pattern-card .pc-name{font-weight:700;font-size:.8rem;margin-bottom:4px}
.pattern-card .pc-meta{font-size:.62rem;color:var(--tx3);font-family:var(--mono)}
.pattern-card .pc-viz{
  height:24px;margin-top:8px;display:flex;gap:1px;align-items:flex-end;
}
.pattern-card .pc-viz .pv-bar{
  flex:1;background:var(--c3);border-radius:1px;transition:var(--t);
}
.song-timeline{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;overflow-x:auto;
}
.song-lanes{
  display:flex;gap:2px;margin-bottom:6px;
}
.song-slot{
  min-width:60px;padding:6px;background:var(--panel2);
  border:1px solid var(--bd);border-radius:var(--rxxs);
  font-size:.62rem;font-family:var(--mono);
  text-align:center;cursor:pointer;transition:var(--t);
  position:relative;
}
.song-slot.active{background:var(--c1);color:#000;font-weight:800;border-color:var(--c1h);box-shadow:0 0 12px var(--c1)}
.song-slot.empty{opacity:.4}
.song-slot:hover{border-color:var(--c1)}

/* ================================================================
   KEYBOARD
   ================================================================ */
.keyboard{
  display:flex;height:90px;
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:6px;gap:2px;
  overflow-x:auto;
}
.key-white{
  flex:1;min-width:32px;
  background:linear-gradient(180deg,#fff,#ddd);
  border:1px solid #888;border-radius:0 0 6px 6px;
  cursor:pointer;position:relative;
  transition:background .05s;user-select:none;
}
.key-white:hover{background:linear-gradient(180deg,#eee,#bbb)}
.key-white.active{background:linear-gradient(180deg,var(--c1),var(--c1l));border-color:var(--c1h)}
.key-white .kn{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.5rem;color:#666}
.key-black{
  width:20px;height:60%;
  background:linear-gradient(180deg,#333,#000);
  border:1px solid #000;border-radius:0 0 4px 4px;
  cursor:pointer;position:absolute;top:6px;
  z-index:2;transition:background .05s;
}
.key-black:hover{background:linear-gradient(180deg,#555,#222)}
.key-black.active{background:linear-gradient(180deg,var(--c2),var(--c2l))}
.kb-wrap{
  position:relative;flex:1;min-width:32px;
}

/* ================================================================
   LOOPS + PRESETS
   ================================================================ */
.loop-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.loop-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:12px;
  cursor:pointer;transition:var(--t);
  border-left:4px solid var(--c1);
}
.loop-card:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,255,213,.15)}
.loop-card .lc-head{display:flex;justify-content:space-between;align-items:start;gap:8px}
.loop-card .lc-name{font-weight:700;font-size:.8rem}
.loop-card .lc-cat{font-size:.6rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px}
.loop-card .lc-desc{font-size:.68rem;color:var(--tx2);margin-top:6px;line-height:1.5}

/* ================================================================
   MODAL
   ================================================================ */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.8);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:620px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700;letter-spacing:.4px}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

/* ================================================================
   TOASTS
   ================================================================ */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:320px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast.pink{border-left-color:var(--c2);background:linear-gradient(135deg,var(--panel),rgba(255,45,158,.08))}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* ================================================================
   MISC
   ================================================================ */
.empty{
  text-align:center;padding:44px 20px;color:var(--tx3);font-size:.78rem;
}
.empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:5px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.66rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}

.divider{height:1px;background:var(--bd);margin:14px 0}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:14px}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.74rem;gap:10px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;color:var(--c1)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,255,213,.15);
}
.field textarea{resize:vertical;min-height:80px;font-family:var(--mono)}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Meter bars */
.meter{
  height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;position:relative;
}
.meter-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--c10),var(--c4) 70%,var(--c8));
  transition:width .05s linear;border-radius:3px;
}
.meter-fill.clip{background:var(--c8)}

/* VU display (top bar) */
.vu-bar{
  display:flex;gap:2px;align-items:center;padding:0 8px;
}
.vu-seg{
  width:4px;height:14px;border-radius:1px;background:var(--bd2);
  transition:background .1s;
}
.vu-seg.on{background:var(--c1)}
.vu-seg.on.peak{background:var(--c4)}
.vu-seg.on.clip{background:var(--c8)}

/* Waveform display */
.wave-display{
  background:#000;border:1px solid var(--bd);
  border-radius:var(--rxs);height:60px;position:relative;
  overflow:hidden;
}
.wave-display canvas{width:100%;height:100%;display:block}

/* Spectrum */
.spectrum{
  background:#000;border:1px solid var(--bd);
  border-radius:var(--rxs);height:80px;position:relative;overflow:hidden;
}
.spectrum canvas{width:100%;height:100%;display:block}

/* Timeline ruler */
.timeline-ruler{
  display:flex;height:24px;background:var(--panel2);
  border-radius:var(--rxxs);overflow:hidden;margin-bottom:4px;
}
.timeline-tick{
  flex:1;border-right:1px solid var(--bd2);
  font-size:.55rem;color:var(--tx3);font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.timeline-tick.beat{background:var(--bg3)}

/* Playhead */
.playhead{
  position:absolute;top:0;bottom:0;width:2px;
  background:var(--c4);box-shadow:0 0 8px var(--c4);
  pointer-events:none;transition:left .04s linear;z-index:5;
}

/* Print */
@media print{
  .sidebar,.topbar,.transport,.no-print{display:none!important}
  .page{padding:0;background:#fff;color:#000}
  body{overflow:visible;height:auto;background:#fff;color:#000}
}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh3)}
  .tb-menu{display:flex}
  .form-row,.grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}
  .page{padding:12px}
  .tx-sliders{width:100%;margin-left:0;margin-top:8px;justify-content:center}
  .seq-row{min-width:600px;grid-template-columns:80px repeat(16,1fr)}
  .knob-ring{width:44px;height:44px}
  .knob-inner{width:30px;height:30px;font-size:.55rem}
}
@media (min-width:901px){.sidebar{transform:none!important}}

.text-ok{color:var(--ok)}
.text-warn{color:var(--warn)}
.text-err{color:var(--err)}
.text-mu{color:var(--tx3)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">🎛️</div>
      <div style="flex:1;min-width:0">
        <div class="sb-title">SONICFORGE</div>
        <div class="sb-sub">Studio DAW</div>
      </div>
      <button class="icon-btn" onclick="closeSidebar()" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="tb-menu" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="tb-title" id="tbTitle">Sequencer</div>
        <div class="tb-sub" id="tbSub">Pattern editor</div>
      </div>
      <div class="vu-bar" id="vuBar"></div>
      <div class="tb-actions">
        <button class="icon-btn" onclick="panicStop()" title="Panic (stop all)">🛑</button>
        <button class="icon-btn" onclick="toggleMetronome()" title="Metronome" id="metroBtn">🎵</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌓</button>
        <button class="icon-btn" onclick="openHelp()" title="Help">❓</button>
        <button class="icon-btn" onclick="showAlerts()" title="System">
          ⚙️<span class="badge" id="alertBadge" style="display:none">0</span>
        </button>
      </div>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox">
    <div class="modal-head">
      <h2 id="modalTitle">Modal</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<script>
"use strict";

/* ================================================================
   UTILITIES
   ================================================================ */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){
  var e=document.createElement(t);
  if(a)for(var k in a){
    if(k==='class')e.className=a[k];
    else if(k==='style'&&typeof a[k]==='object')Object.assign(e.style,a[k]);
    else if(k==='text')e.textContent=a[k];
    else if(k==='html')e.innerHTML=a[k];
    else if(k.indexOf('on')===0)e[k]=a[k];
    else e.setAttribute(k,a[k]);
  }
  if(c){
    if(typeof c==='string')e.innerHTML=c;
    else if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});
    else e.appendChild(c);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function safeFloat(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}
function dbToGain(db){return Math.pow(10,db/20)}
function gainToDb(g){return g>0?20*Math.log10(g):-100}
function fmtDb(g){
  if(g<=0)return '-∞';
  var d=20*Math.log10(g);
  if(d<=-60)return '-∞';
  return (d>0?'+':'')+d.toFixed(1);
}
function noteToFreq(semitone){
  // MIDI note to frequency. A4 = 69 = 440Hz
  return 440*Math.pow(2,(semitone-69)/12);
}
function noteName(midi){
  var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[midi%12]+(Math.floor(midi/12)-1);
}

function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ',pink:'♪'};
  var t2=el('div',{class:'toast '+type});
  t2.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t2);
  setTimeout(function(){
    t2.classList.add('leaving');
    setTimeout(function(){t2.remove()},320);
  },2800);
}

function openModal(o){
  o=o||{};
  var box=$('modalBox');
  box.className='modal-box'+(o.wide?' wide':'')+(o.narrow?' narrow':'');
  $('modalTitle').textContent=o.title||'';
  $('modalBody').innerHTML=o.body||'';
  $('modalFoot').innerHTML=o.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(o.onOpen)setTimeout(o.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,msg,fn,danger){
  openModal({
    title:title,narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.6;font-size:.82rem">'+esc(msg)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">Confirm</button>',
    onOpen:function(){$('confirmYes').onclick=function(){closeModal();fn()}}
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal({
    title:title,narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

/* ================================================================
   STATE + STORAGE
   ================================================================ */
var STORAGE_KEY='sonicforge_v1';

var State={
  version:1,
  settings:{
    theme:'neon',
    bpm:120,
    swing:0,
    masterVolume:0.85,
    metronomeOn:false,
    metronomeVolume:0.4,
    autoSave:true,
    projectName:'Untitled',
    lastSaved:null
  },
  synth:{
    osc1Wave:'sawtooth',
    osc1Detune:0,
    osc1Octave:0,
    osc2Wave:'square',
    osc2Detune:7,
    osc2Octave:0,
    osc2Mix:0.5,
    filterType:'lowpass',
    filterCutoff:3000,
    filterResonance:2,
    filterEnv:0.6,
    attack:0.01,
    decay:0.2,
    sustain:0.5,
    release:0.3,
    glide:0,
    voiceMode:'poly'
  },
  drums:{
    kick:{tune:0.5,decay:0.3,drive:0.3,enabled:true,vol:0.9},
    snare:{tune:0.5,decay:0.2,noise:0.7,enabled:true,vol:0.8},
    hihat:{tune:0.5,decay:0.05,noise:0.5,enabled:true,vol:0.6},
    clap:{tune:0.5,decay:0.15,noise:0.8,enabled:true,vol:0.7},
    tom:{tune:0.5,decay:0.3,drive:0.2,enabled:true,vol:0.7},
    cymbal:{tune:0.5,decay:0.8,noise:0.6,enabled:true,vol:0.5},
    rim:{tune:0.6,decay:0.1,drive:0.1,enabled:true,vol:0.6},
    cowbell:{tune:0.5,decay:0.2,drive:0.15,enabled:true,vol:0.55}
  },
  effects:{
    reverb:{enabled:true,mix:0.25,size:0.6,damp:0.4,vol:1.0},
    delay:{enabled:false,mix:0.3,time:0.375,feedback:0.4,vol:1.0},

function navigate(route){
  if(!ROUTES[route])route='sequencer';
  CurrentRoute=route;
  var r=ROUTES[route];
  $('tbTitle').textContent=r.title;
  $('tbSub').textContent=r.sub;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var nav=$('sbNav');
  if(!nav)return;
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var order=['Studio','Arrangement','Play','System'];
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      html+='<div class="nav-item'+(item.route===CurrentRoute?' active':'')+'" onclick="navigate(\''+item.route+'\')">'+
            '<span class="ni-icon">'+item.meta.icon+'</span>'+
            '<span>'+esc(item.meta.title)+'</span></div>';
    });
  });
  nav.innerHTML=html;
}

function renderPage(){
  var fn=window['render_'+CurrentRoute];
  if(typeof fn==='function'){
    $('page').innerHTML=fn();
    var after=window['after_'+CurrentRoute];
    if(typeof after==='function')setTimeout(after,20);
  }else{
    $('page').innerHTML='<div class="empty"><span class="icon">🚧</span><h4>Under construction</h4></div>';

}

/* ================================================================
   AUDIO ENGINE
   ================================================================ */
var AudioEngine={
  ctx:null,
  masterGain:null,
  compressor:null,
  analyser:null,
  masterMeter:null,
  activeVoices:[],
  channels:{},
  reverb:{node:null,convolver:null},
  delay:{node:null,feedback:null,time:null},
  chorus:{node:null,osc:null,depthGain:null},
  distortion:{node:null,tone:null},
  filter:{node:null},
  metronomeOn:false,
  metronomeTimer:null,
  metroBeat:0,

  init:function(){
    if(this.ctx)return;
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext;
      this.ctx=new Ctx();
      this.masterGain=this.ctx.createGain();
      this.masterGain.gain.value=State.settings.masterVolume;
      this.compressor=this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value=-12;
      this.compressor.ratio.value=4;
      this.analyser=this.ctx.createAnalyser();
      this.analyser.fftSize=2048;
      this.masterGain.connect(this.compressor);
      this.compressor.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      // Create channel gains
      Object.keys(State.mixer).forEach((function(k){
        if(k==='master')return;
        var g=this.ctx.createGain();
        var mg=this.mixerToGain(k);
        g.gain.value=mg;
        g.connect(this.masterGain);
        this.channels[k]={gain:g,meter:this.ctx.createAnalyser()};
        this.channels[k].meter.fftSize=256;
        g.connect(this.channels[k].meter);
      }).bind(this));
      this.buildEffects();
      // Setup VU meter animation
      this.setupVU();
    }catch(e){
      toast('Audio init failed: '+e.message,'error');
    }
  },

  mixerToGain:function(key){
    var m=State.mixer[key];
    if(!m||m.mute)return 0;
    // Check solo
    var anySolo=Object.keys(State.mixer).some(function(k){return k!=='master'&&State.mixer[k].solo});
    if(anySolo&&!m.solo)return 0;
    return m.volume;
  },

  updateMixer:function(){
    if(!this.ctx)return;
    Object.keys(this.channels).forEach((function(k){
      this.channels[k].gain.gain.setTargetAtTime(this.mixerToGain(k),this.ctx.currentTime,0.02);
    }).bind(this));
    this.masterGain.gain.setTargetAtTime(State.mixer.master.mute?0:State.mixer.master.volume,this.ctx.currentTime,0.02);
  },

  buildEffects:function(){
    if(!this.ctx)return;
    // Reverb (impulse-based)
    var reverbDuration=0.5+State.effects.reverb.size*3;
    var rate=this.ctx.sampleRate;
    var length=rate*reverbDuration;
    var impulse=this.ctx.createBuffer(2,length,rate);
    for(var ch=0;ch<2;ch++){
      var data=impulse.getChannelData(ch);
      for(var i=0;i<length;i++){
        data[i]=(Math.random()*2-1)*Math.pow(1-i/length,1+State.effects.reverb.damp*5);
      }
    }
    this.reverb.convolver=this.ctx.createConvolver();
    this.reverb.convolver.buffer=impulse;
    var revDry=this.ctx.createGain();
    var revWet=this.ctx.createGain();
    revDry.gain.value=1-State.effects.reverb.mix;
    revWet.gain.value=State.effects.reverb.mix;
    this.reverb.node=this.ctx.createGain();
    this.reverb.node.connect(revDry);
    this.reverb.node.connect(this.reverb.convolver);
    this.reverb.convolver.connect(revWet);
    revDry.connect(this.masterGain);
    revWet.connect(this.masterGain);

    // Delay
    this.delay.node=this.ctx.createGain();
    this.delay.time=this.ctx.createDelay(2.0);
    this.delay.feedback=this.ctx.createGain();
    var delDry=this.ctx.createGain();
    var delWet=this.ctx.createGain();
    delDry.gain.value=1;
    delWet.gain.value=State.effects.delay.mix;
    this.delay.time.delayTime.value=State.effects.delay.time;
    this.delay.feedback.gain.value=State.effects.delay.feedback;
    this.delay.node.connect(delDry);
    this.delay.node.connect(this.delay.time);
    this.delay.time.connect(this.delay.feedback);
    this.delay.feedback.connect(this.delay.time);
    this.delay.time.connect(delWet);
    delDry.connect(this.masterGain);
    delWet.connect(this.masterGain);

    // Chorus
    this.chorus.node=this.ctx.createGain();
    this.chorus.osc=this.ctx.createOscillator();
    this.chorus.osc.frequency.value=State.effects.chorus.rate;
    this.chorus.depthGain=this.ctx.createGain();
    this.chorus.depthGain.gain.value=State.effects.chorus.depth*0.005;
    var chDelay=this.ctx.createDelay(0.05);
    chDelay.delayTime.value=0.015;
    this.chorus.osc.connect(this.chorus.depthGain);
    this.chorus.depthGain.connect(chDelay.delayTime);
    var chWet=this.ctx.createGain();
    var chDry=this.ctx.createGain();
    chWet.gain.value=State.effects.chorus.mix*State.effects.chorus.enabled?1:0;
    chDry.gain.value=1;
    this.chorus.node.connect(chDry);
    this.chorus.node.connect(chDelay);
    chDelay.connect(chWet);
    chDry.connect(this.masterGain);
    chWet.connect(this.masterGain);
    this.chorus.osc.start();

    // Distortion (waveshaper)
    this.distortion.node=this.ctx.createGain();
    var shaper=this.ctx.createWaveShaper();
    shaper.curve=this.makeDistortionCurve(State.effects.distortion.drive*100);
    shaper.oversample='4x';
    this.distortion.tone=this.ctx.createBiquadFilter();
    this.distortion.tone.type='lowpass';
    this.distortion.tone.frequency.value=1000+State.effects.distortion.tone*10000;
    this.distortion.node.connect(shaper);
    shaper.connect(this.distortion.tone);
    this.distortion.tone.connect(this.masterGain);
    this.distortion.shaper=shaper;

    // Filter (additional)
    this.filter.node=this.ctx.createBiquadFilter();
    this.filter.node.type=State.effects.filter.type;
    this.filter.node.frequency.value=State.effects.filter.cutoff;
    this.filter.node.Q.value=State.effects.filter.resonance;
    this.filter.node.connect(this.masterGain);
  },

  makeDistortionCurve(amount){
    var k=amount||50;
    var n=44100;
    var curve=new Float32Array(n);
    for(var i=0;i<n;i++){
      var x=i*2/n-1;
      curve[i]=(3+k)*x*20*Math.PI/180/(Math.PI+k*Math.abs(x));
    }
    return curve;
  },

  updateEffects:function(){
    if(!this.ctx)return;
    // Update reverb mix
    var dry=1-State.effects.reverb.mix;
    var wet=State.effects.reverb.mix;
    // Simple approximation - rebuild reverb when size changes
    // Skip full rebuild for now — update wet/dry indirectly by rebuilding impulse
    this.rebuildReverbImpulse();
    // Delay
    this.delay.time.delayTime.setTargetAtTime(State.effects.delay.time,this.ctx.currentTime,0.05);
    this.delay.feedback.gain.setTargetAtTime(State.effects.delay.feedback,this.ctx.currentTime,0.05);
    // Chorus
    if(this.chorus.osc)this.chorus.osc.frequency.setTargetAtTime(State.effects.chorus.rate,this.ctx.currentTime,0.05);
    if(this.chorus.depthGain)this.chorus.depthGain.gain.setTargetAtTime(State.effects.chorus.depth*0.005,this.ctx.currentTime,0.05);
    // Distortion
    if(this.distortion.shaper){
      this.distortion.shaper.curve=this.makeDistortionCurve(State.effects.distortion.drive*100);
    }
    if(this.distortion.tone){
      this.distortion.tone.frequency.setTargetAtTime(1000+State.effects.distortion.tone*10000,this.ctx.currentTime,0.05);
    }
    // Filter
    if(this.filter.node){
      this.filter.node.frequency.setTargetAtTime(State.effects.filter.cutoff,this.ctx.currentTime,0.05);
      this.filter.node.Q.setTargetAtTime(State.effects.filter.resonance,this.ctx.currentTime,0.05);
    }
  },

  rebuildReverbImpulse:function(){
    if(!this.ctx||!this.reverb.convolver)return;
    var dur=0.5+State.effects.reverb.size*3;
    var rate=this.ctx.sampleRate;
    var length=Math.max(rate*0.1,rate*dur);
    var impulse=this.ctx.createBuffer(2,length,rate);
    for(var ch=0;ch<2;ch++){
      var data=impulse.getChannelData(ch);
      for(var i=0;i<length;i++){
        data[i]=(Math.random()*2-1)*Math.pow(1-i/length,1+State.effects.reverb.damp*5);
      }
    }
    this.reverb.convolver.buffer=impulse;
  },

  /* ---------- SYNTH VOICE ---------- */
  playSynth:function(midi,duration,channel){
    if(!this.ctx)this.init();
    if(!this.ctx)return;
    var s=State.synth;
    var freq=noteToFreq(midi);
    var now=this.ctx.currentTime;
    var dur=duration||0.5;
    var ch=channel||'synth';
    var target=this.channels[ch]?this.channels[ch].gain:this.masterGain;

    // Osc 1
    var osc1=this.ctx.createOscillator();
    osc1.type=s.osc1Wave;
    osc1.frequency.value=freq*Math.pow(2,s.osc1Octave);
    osc1.detune.value=s.osc1Detune;
    // Osc 2
    var osc2=this.ctx.createOscillator();
    osc2.type=s.osc2Wave;
    osc2.frequency.value=freq*Math.pow(2,s.osc2Octave);
    osc2.detune.value=s.osc2Detune;
    var osc2Gain=this.ctx.createGain();
    osc2Gain.gain.value=s.osc2Mix;
    // Filter
    var filter=this.ctx.createBiquadFilter();
    filter.type=s.filterType;
    filter.frequency.value=s.filterCutoff;
    filter.Q.value=s.filterResonance;
    // Envelope
    var ampEnv=this.ctx.createGain();
    ampEnv.gain.setValueAtTime(0,now);
    ampEnv.gain.linearRampToValueAtTime(1,now+s.attack);
    ampEnv.gain.linearRampToValueAtTime(s.sustain,now+s.attack+s.decay);
    ampEnv.gain.setValueAtTime(s.sustain,now+Math.max(s.attack+s.decay,dur-0.1));
    ampEnv.gain.exponentialRampToValueAtTime(0.001,now+dur+s.release);
    // Filter env
    var fEnvAmount=s.filterEnv*s.filterCutoff;
    filter.frequency.setValueAtTime(s.filterCutoff+fEnvAmount,now);
    filter.frequency.exponentialRampToValueAtTime(Math.max(100,s.filterCutoff),now+s.attack+s.decay);

    osc1.connect(filter);
    osc2.connect(osc2Gain);
    osc2Gain.connect(filter);
    filter.connect(ampEnv);
    ampEnv.connect(target);

    var voice={osc1:osc1,osc2:osc2,env:ampEnv,channel:ch,midi:midi,started:now};
    this.activeVoices.push(voice);
    osc1.start(now);
    osc2.start(now);
    var stopTime=now+dur+s.release+0.05;
    osc1.stop(stopTime);
    osc2.stop(stopTime);
    setTimeout((function(){
      var idx=this.activeVoices.indexOf(voice);
      if(idx>-1)this.activeVoices.splice(idx,1);
    }).bind(this),(stopTime-now)*1000+50);
  },

  /* ---------- DRUM SYNTHESIS ---------- */
  playDrum:function(type,velocity){
    if(!this.ctx)this.init();
    if(!this.ctx)return;
    velocity=velocity||1;
    var now=this.ctx.currentTime;
    var target=this.channels['drums']?this.channels['drums'].gain:this.masterGain;
    var d=State.drums[type];
    if(!d||!d.enabled)return;

    if(type==='kick'){
      var osc=this.ctx.createOscillator();
      var env=this.ctx.createGain();
      osc.type='sine';
      var f0=40+d.tune*60;
      osc.frequency.setValueAtTime(f0*3,now);
      osc.frequency.exponentialRampToValueAtTime(f0,now+0.05);
      env.gain.setValueAtTime(0,now);
      env.gain.linearRampToValueAtTime(1*velocity,now+0.002);
      env.gain.exponentialRampToValueAtTime(0.001,now+d.decay*1.5);
      osc.connect(env);
      if(d.drive>0){
        var shaper=this.ctx.createWaveShaper();
        shaper.curve=this.makeDistortionCurve(d.drive*80);
        shaper.oversample='2x';
        env.connect(shaper);
        shaper.connect(target);
      }else{
        env.connect(target);
      }
      osc.start(now);
      osc.stop(now+d.decay*1.5+0.05);
    }else if(type==='snare'){
      // Tone
      var osc2=this.ctx.createOscillator();
      var env2=this.ctx.createGain();
      osc2.type='triangle';
      osc2.frequency.value=150+d.tune*100;
      env2.gain.setValueAtTime(0,now);
      env2.gain.linearRampToValueAtTime(0.6*velocity,now+0.002);
      env2.gain.exponentialRampToValueAtTime(0.001,now+d.decay);
      osc2.connect(env2);
      env2.connect(target);
      osc2.start(now);
      osc2.stop(now+d.decay+0.05);
      // Noise
      var noise=this.createNoise(now,d.decay);
      var nEnv=this.ctx.createGain();
      nEnv.gain.setValueAtTime(0,now);
      nEnv.gain.linearRampToValueAtTime(d.noise*velocity,now+0.002);
      nEnv.gain.exponentialRampToValueAtTime(0.001,now+d.decay*1.3);
      var nFilt=this.ctx.createBiquadFilter();
      nFilt.type='highpass';
      nFilt.frequency.value=1000;
      noise.connect(nFilt);
      nFilt.connect(nEnv);
      nEnv.connect(target);
    }else if(type==='hihat'){
      var noise2=this.createNoise(now,d.decay);
      var hEnv=this.ctx.createGain();
      hEnv.gain.setValueAtTime(0,now);
      hEnv.gain.linearRampToValueAtTime(0.5*velocity,now+0.001);
      hEnv.gain.exponentialRampToValueAtTime(0.001,now+d.decay);
      var hFilt=this.ctx.createBiquadFilter();
      hFilt.type='highpass';
      hFilt.frequency.value=7000;
      noise2.connect(hFilt);
      hFilt.connect(hEnv);
      hEnv.connect(target);
    }else if(type==='clap'){
      for(var i=0;i<3;i++){
        var cn=this.createNoise(now+i*0.008,0.05);
        var ce=this.ctx.createGain();
        ce.gain.setValueAtTime(0,now+i*0.008);
        ce.gain.linearRampToValueAtTime(d.noise*velocity*0.7,now+i*0.008+0.001);
        ce.gain.exponentialRampToValueAtTime(0.001,now+i*0.008+0.05);
        var cf=this.ctx.createBiquadFilter();
        cf.type='bandpass';
        cf.frequency.value=1200+i*100;
        cf.Q.value=1.5;
        cn.connect(cf);cf.connect(ce);ce.connect(target);
      }
    }else if(type==='tom'){
      var tOsc=this.ctx.createOscillator();
      var tEnv=this.ctx.createGain();
      tOsc.type='sine';
      var tf0=100+d.tune*80;
      tOsc.frequency.setValueAtTime(tf0*1.8,now);
      tOsc.frequency.exponentialRampToValueAtTime(tf0,now+d.decay);
      tEnv.gain.setValueAtTime(0,now);
      tEnv.gain.linearRampToValueAtTime(0.8*velocity,now+0.005);
      tEnv.gain.exponentialRampToValueAtTime(0.001,now+d.decay);
      tOsc.connect(tEnv);tEnv.connect(target);
      tOsc.start(now);tOsc.stop(now+d.decay+0.05);
    }else if(type==='cymbal'){
      var cn2=this.createNoise(now,d.decay);
      var ce2=this.ctx.createGain();
      ce2.gain.setValueAtTime(0,now);
      ce2.gain.linearRampToValueAtTime(0.4*velocity,now+0.01);
      ce2.gain.exponentialRampToValueAtTime(0.001,now+d.decay*1.5);
      var cf2=this.ctx.createBiquadFilter();
      cf2.type='highpass';
      cf2.frequency.value=6000;
      cn2.connect(cf2);cf2.connect(ce2);ce2.connect(target);
    }else if(type==='rim'){
      var rOsc=this.ctx.createOscillator();
      var rEnv=this.ctx.createGain();
      rOsc.type='square';
      rOsc.frequency.value=400+d.tune*300;
      rEnv.gain.setValueAtTime(0,now);
      rEnv.gain.linearRampToValueAtTime(0.5*velocity,now+0.001);
      rEnv.gain.exponentialRampToValueAtTime(0.001,now+d.decay);
      var rFilt=this.ctx.createBiquadFilter();
      rFilt.type='bandpass';
      rFilt.frequency.value=800;
      rFilt.Q.value=8;
      rOsc.connect(rFilt);rFilt.connect(rEnv);rEnv.connect(target);
      rOsc.start(now);rOsc.stop(now+d.decay+0.05);
    }else if(type==='cowbell'){
      var c1=this.ctx.createOscillator();
      var c2=this.ctx.createOscillator();
      c1.type='square';c2.type='square';
      c1.frequency.value=540+d.tune*100;
      c2.frequency.value=800+d.tune*100;
      var cEnv=this.ctx.createGain();
      cEnv.gain.setValueAtTime(0,now);
      cEnv.gain.linearRampToValueAtTime(0.4*velocity,now+0.002);
      cEnv.gain.exponentialRampToValueAtTime(0.001,now+d.decay);
      var cFilt=this.ctx.createBiquadFilter();
      cFilt.type='bandpass';
      cFilt.frequency.value=800;
      cFilt.Q.value=3;
      c1.connect(cFilt);c2.connect(cFilt);cFilt.connect(cEnv);cEnv.connect(target);
      c1.start(now);c2.start(now);
      c1.stop(now+d.decay+0.05);c2.stop(now+d.decay+0.05);
    }
  },

  createNoise:function(startTime,duration){
    var length=Math.max(1024,Math.ceil(this.ctx.sampleRate*duration));
    var buffer=this.ctx.createBuffer(1,length,this.ctx.sampleRate);
    var data=buffer.getChannelData(0);
    for(var i=0;i<length;i++)data[i]=Math.random()*2-1;
    var src=this.ctx.createBufferSource();
    src.buffer=buffer;
    src.start(startTime);
    return src;
  },

  stopAll:function(){
    this.activeVoices.slice().forEach(function(v){
      try{v.osc1.stop();v.osc2.stop();}catch(e){}
    });
    this.activeVoices=[];
  },

  /* ---------- METRONOME ---------- */
  startMetronome:function(){
    this.stopMetronome();
    var interval=60000/State.settings.bpm/4;
    this.metroBeat=0;
    this.metronomeTimer=setInterval((function(){
      if(!State.settings.metronomeOn){this.stopMetronome();return}
      this.metroBeat=(this.metroBeat+1)%4;
      var freq=this.metroBeat===0?880:440;
      this.playClick(freq);
    }).bind(this),interval);
  },
  stopMetronome:function(){
    if(this.metronomeTimer){clearInterval(this.metronomeTimer);this.metronomeTimer=null}
  },
  playClick:function(freq){
    if(!this.ctx)return;
    var now=this.ctx.currentTime;
    var osc=this.ctx.createOscillator();
    var env=this.ctx.createGain();
    osc.type='square';
    osc.frequency.value=freq;
    env.gain.setValueAtTime(0,now);
    env.gain.linearRampToValueAtTime(State.settings.metronomeVolume*0.3,now+0.001);
    env.gain.exponentialRampToValueAtTime(0.001,now+0.03);
    osc.connect(env);
    env.connect(this.masterGain);
    osc.start(now);
    osc.stop(now+0.05);
  },

  /* ---------- VU ---------- */
  setupVU:function(){
    var bar=$('vuBar');
    if(!bar)return;
    bar.innerHTML='';
    for(var i=0;i<12;i++){
      bar.appendChild(el('div',{class:'vu-seg'}));
    }
    var self=this;
    function update(){
      if(!self.analyser)return;
      var buf=new Uint8Array(self.analyser.frequencyBinCount);
      self.analyser.getByteTimeDomainData(buf);
      var max=0;
      for(var i=0;i<buf.length;i++){
        var v=Math.abs(buf[i]-128)/128;
        if(v>max)max=v;
      }
      var segs=bar.querySelectorAll('.vu-seg');
      var lit=Math.round(max*12);
      for(var j=0;j<segs.length;j++){
        if(j<lit){
          segs[j].className='vu-seg on'+(j>=10?' clip':(j>=8?' peak':''));
        }else{
          segs[j].className='vu-seg';
        }
      }
      requestAnimationFrame(update);
    }
    update();
  },

  /* ---------- WAVEFORM CAPTURE (offline render) ---------- */
  renderPatternToBuffer:function(callback){
    // Renders one loop of current pattern using OfflineAudioContext
    var steps=State.pattern.steps;
    var stepDur=(60/State.settings.bpm)/4;
    var duration=steps*stepDur+1.5;
    var sampleRate=44100;
    var ctx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(2,Math.ceil(sampleRate*duration),sampleRate);

    // Master
    var master=ctx.createGain();
    master.gain.value=State.mixer.master.volume;
    master.connect(ctx.destination);

    // Mixer channels
    var chGains={};
    ['drums','synth','bass'].forEach(function(k){
      var g=ctx.createGain();
      g.gain.value=State.mixer[k].mute?0:State.mixer[k].volume;
      g.connect(master);
      chGains[k]=g;
    });

    // Trigger drums and notes at scheduled times
    var drumTypes=['kick','snare','hihat','clap','tom','cymbal','rim','cowbell'];
    for(var s=0;s<steps;s++){
      var t=s*stepDur;
      drumTypes.forEach(function(type){
        if(State.pattern.tracks[type]&&State.pattern.tracks[type][s]){
          var vel=State.pattern.velocities[type+':'+s]||1;
          renderDrum(ctx,chGains.drums,type,vel,t);
        }
      });
    }
    // Notes
    (State.pattern.notes||[]).forEach(function(n){
      var t=n.step*stepDur;
      var dur=(n.length||1)*stepDur*0.9;
      renderSynthNote(ctx,chGains.synth,n.midi,dur,t);
    });

    // Effects
    var rev=ctx.createConvolver();
    var dur2=0.5+State.effects.reverb.size*3;
    var rl=Math.ceil(sampleRate*dur2);
    var imp=ctx.createBuffer(2,rl,sampleRate);
    for(var ch=0;ch<2;ch++){
      var d=imp.getChannelData(ch);
      for(var i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2);
    }
    rev.buffer=imp;
    var revSend=ctx.createGain();
    revSend.gain.value=State.effects.reverb.enabled?State.effects.reverb.mix:0;
    var revOut=ctx.createGain();
    revOut.gain.value=1;
    revSend.connect(rev);
    rev.connect(revOut);
    revOut.connect(ctx.destination);
    master.connect(revSend);

    ctx.startRendering().then(function(buf){
      callback(buf);
    }).catch(function(e){
      toast('Render failed: '+e.message,'error');
    });
  }
};

/* Offline render helpers */
function renderDrum(ctx,target,type,velocity,time){
  var d=State.drums[type];
  if(!d||!d.enabled)return;
  if(type==='kick'){
    var osc=ctx.createOscillator();
    var env=ctx.createGain();
    osc.type='sine';
    var f0=40+d.tune*60;
    osc.frequency.setValueAtTime(f0*3,time);
    osc.frequency.exponentialRampToValueAtTime(f0,time+0.05);
    env.gain.setValueAtTime(0,time);
    env.gain.linearRampToValueAtTime(velocity,time+0.002);
    env.gain.exponentialRampToValueAtTime(0.001,time+d.decay*1.5);
    osc.connect(env);env.connect(target);
    osc.start(time);osc.stop(time+d.decay*1.5+0.05);
  }else if(type==='snare'){
    var osc2=ctx.createOscillator();
    var env2=ctx.createGain();
    osc2.type='triangle';
    osc2.frequency.value=150+d.tune*100;
    env2.gain.setValueAtTime(0,time);
    env2.gain.linearRampToValueAtTime(0.6*velocity,time+0.002);
    env2.gain.exponentialRampToValueAtTime(0.001,time+d.decay);
    osc2.connect(env2);env2.connect(target);
    osc2.start(time);osc2.stop(time+d.decay+0.05);
    var noise=offlineNoise(ctx,d.decay,time);
    var nEnv=ctx.createGain();
    nEnv.gain.setValueAtTime(0,time);
    nEnv.gain.linearRampToValueAtTime(d.noise*velocity,time+0.002);
    nEnv.gain.exponentialRampToValueAtTime(0.001,time+d.decay*1.3);
    var nFilt=ctx.createBiquadFilter();
    nFilt.type='highpass';nFilt.frequency.value=1000;
    noise.connect(nFilt);nFilt.connect(nEnv);nEnv.connect(target);
  }else if(type==='hihat'){
    var noise2=offlineNoise(ctx,d.decay,time);
    var hEnv=ctx.createGain();
    hEnv.gain.setValueAtTime(0,time);
    hEnv.gain.linearRampToValueAtTime(0.5*velocity,time+0.001);
    hEnv.gain.exponentialRampToValueAtTime(0.001,time+d.decay);
    var hFilt=ctx.createBiquadFilter();
    hFilt.type='highpass';hFilt.frequency.value=7000;
    noise2.connect(hFilt);hFilt.connect(hEnv);hEnv.connect(target);
  }else if(type==='clap'){
    for(var i=0;i<3;i++){
      var cn=offlineNoise(ctx,0.05,time+i*0.008);
      var ce=ctx.createGain();
      ce.gain.setValueAtTime(0,time+i*0.008);
      ce.gain.linearRampToValueAtTime(d.noise*velocity*0.7,time+i*0.008+0.001);
      ce.gain.exponentialRampToValueAtTime(0.001,time+i*0.008+0.05);
      var cf=ctx.createBiquadFilter();
      cf.type='bandpass';cf.frequency.value=1200+i*100;cf.Q.value=1.5;
      cn.connect(cf);cf.connect(ce);ce.connect(target);
    }
  }else if(type==='tom'){
    var tOsc=ctx.createOscillator();
    var tEnv=ctx.createGain();
    tOsc.type='sine';
    var tf0=100+d.tune*80;
    tOsc.frequency.setValueAtTime(tf0*1.8,time);
    tOsc.frequency.exponentialRampToValueAtTime(tf0,time+d.decay);
    tEnv.gain.setValueAtTime(0,time);
    tEnv.gain.linearRampToValueAtTime(0.8*velocity,time+0.005);
    tEnv.gain.exponentialRampToValueAtTime(0.001,time+d.decay);
    tOsc.connect(tEnv);tEnv.connect(target);
    tOsc.start(time);tOsc.stop(time+d.decay+0.05);
  }else if(type==='cymbal'){
    var cn2=offlineNoise(ctx,d.decay,time);
    var ce2=ctx.createGain();
    ce2.gain.setValueAtTime(0,time);
    ce2.gain.linearRampToValueAtTime(0.4*velocity,time+0.01);
    ce2.gain.exponentialRampToValueAtTime(0.001,time+d.decay*1.5);
    var cf2=ctx.createBiquadFilter();
    cf2.type='highpass';cf2.frequency.value=6000;
    cn2.connect(cf2);cf2.connect(ce2);ce2.connect(target);
  }else if(type==='rim'){
    var rOsc=ctx.createOscillator();
    var rEnv=ctx.createGain();
    rOsc.type='square';rOsc.frequency.value=400+d.tune*300;
    rEnv.gain.setValueAtTime(0,time);
    rEnv.gain.linearRampToValueAtTime(0.5*velocity,time+0.001);
    rEnv.gain.exponentialRampToValueAtTime(0.001,time+d.decay);
    var rFilt=ctx.createBiquadFilter();
    rFilt.type='bandpass';rFilt.frequency.value=800;rFilt.Q.value=8;
    rOsc.connect(rFilt);rFilt.connect(rEnv);rEnv.connect(target);
    rOsc.start(time);rOsc.stop(time+d.decay+0.05);
  }else if(type==='cowbell'){
    var c1=ctx.createOscillator();
    var c2=ctx.createOscillator();
    c1.type='square';c2.type='square';
    c1.frequency.value=540+d.tune*100;
    c2.frequency.value=800+d.tune*100;
    var cEnv=ctx.createGain();
    cEnv.gain.setValueAtTime(0,time);
    cEnv.gain.linearRampToValueAtTime(0.4*velocity,time+0.002);
    cEnv.gain.exponentialRampToValueAtTime(0.001,time+d.decay);
    var cFilt=ctx.createBiquadFilter();
    cFilt.type='bandpass';cFilt.frequency.value=800;cFilt.Q.value=3;
    c1.connect(cFilt);c2.connect(cFilt);cFilt.connect(cEnv);cEnv.connect(target);
    c1.start(time);c2.start(time);
    c1.stop(time+d.decay+0.05);c2.stop(time+d.decay+0.05);
  }
}
function offlineNoise(ctx,duration,time){
  var length=Math.max(1024,Math.ceil(ctx.sampleRate*duration));
  var buffer=ctx.createBuffer(1,length,ctx.sampleRate);
  var data=buffer.getChannelData(0);
  for(var i=0;i<length;i++)data[i]=Math.random()*2-1;
  var src=ctx.createBufferSource();
  src.buffer=buffer;src.start(time);
  return src;
}
function renderSynthNote(ctx,target,midi,dur,time){
  var s=State.synth;
  var freq=noteToFreq(midi);
  var osc1=ctx.createOscillator();
  osc1.type=s.osc1Wave;
  osc1.frequency.value=freq*Math.pow(2,s.osc1Octave);
  osc1.detune.value=s.osc1Detune;
  var osc2=ctx.createOscillator();
  osc2.type=s.osc2Wave;
  osc2.frequency.value=freq*Math.pow(2,s.osc2Octave);
  osc2.detune.value=s.osc2Detune;
  var osc2Gain=ctx.createGain();osc2Gain.gain.value=s.osc2Mix;
  var filter=ctx.createBiquadFilter();
  filter.type=s.filterType;
  filter.frequency.value=s.filterCutoff;
  filter.Q.value=s.filterResonance;
  var env=ctx.createGain();
  env.gain.setValueAtTime(0,time);
  env.gain.linearRampToValueAtTime(1,time+s.attack);
  env.gain.linearRampToValueAtTime(s.sustain,time+s.attack+s.decay);
  env.gain.setValueAtTime(s.sustain,time+Math.max(s.attack+s.decay,dur));
  env.gain.exponentialRampToValueAtTime(0.001,time+dur+s.release);
  osc1.connect(filter);osc2.connect(osc2Gain);osc2Gain.connect(filter);
  filter.connect(env);env.connect(target);
  osc1.start(time);osc2.start(time);
  osc1.stop(time+dur+s.release+0.05);osc2.stop(time+dur+s.release+0.05);
}

function randomizePattern(){
  var drumTypes=['kick','snare','hihat','clap','tom','cymbal','rim','cowbell'];
  var steps=State.pattern.steps;
  // Smart randomization
  drumTypes.forEach(function(t){
    State.pattern.tracks[t]=new Array(steps).fill(0);
  });
  // Kick on quarters sometimes
  for(var i=0;i<steps;i+=4){
    if(Math.random()<0.85)State.pattern.tracks.kick[i]=1;
  }
  // Snare on 2 and 4
  for(var j=4;j<steps;j+=8){
    if(Math.random()<0.9)State.pattern.tracks.snare[j]=1;
  }
  // Hihats on 8th
  for(var k=0;k<steps;k+=2){
    if(Math.random()<0.7)State.pattern.tracks.hihat[k]=1;
  }
  // Random claps
  for(var l=4;l<steps;l+=8){
    if(Math.random()<0.4)State.pattern.tracks.clap[l]=1;
  }
  // Random other elements
  ['tom','cymbal','rim','cowbell'].forEach(function(t){
    for(var m=0;m<steps;m++){
      if(Math.random()<0.08)State.pattern.tracks[t][m]=1;
    }
  });
  saveState();renderPage();
  toast('Pattern randomized','success');
}

function togglePlay(){
  if(Transport.playing){
    pauseSequencer();
  }else{
    startSequencer();
  }
}
function startSequencer(){
  AudioEngine.init();
  if(!AudioEngine.ctx)return;
  if(AudioEngine.ctx.state==='suspended')AudioEngine.ctx.resume();
  Transport.playing=true;
  Transport.stepDur=(60/State.settings.bpm)/4;
  Transport.nextStepTime=AudioEngine.ctx.currentTime+0.05;
  Transport.currentStep=0;
  $('txPlay').innerHTML='⏸';
  schedulerLoop();
  toast('▶ Playing','success');
}
function pauseSequencer(){
  Transport.playing=false;
  if(Transport.timerId){clearTimeout(Transport.timerId);Transport.timerId=null}
  $('txPlay').innerHTML='▶';
}
function stopSequencer(){
  Transport.playing=false;
  Transport.currentStep=0;
  if(Transport.timerId){clearTimeout(Transport.timerId);Transport.timerId=null}
  var e=$('txPlay');if(e)e.innerHTML='▶';
  updateSeqHighlights();
}
function toggleRecord(){
  Transport.recording=!Transport.recording;
  var btn=$('txRec');
  if(btn)btn.classList.toggle('on',Transport.recording);
  toast(Transport.recording?'⏺ Recording enabled':'Recording off',Transport.recording?'warn':'info');
}
function schedulerLoop(){
  if(!Transport.playing)return;
  var ctx=AudioEngine.ctx;
  var lookahead=0.1;
  while(Transport.nextStepTime<ctx.currentTime+lookahead){
    scheduleStep(Transport.currentStep,Transport.nextStepTime);
    Transport.nextStepTime+=Transport.stepDur;
    Transport.currentStep=(Transport.currentStep+1)%State.pattern.steps;
  }
  // UI update at ~30fps
  updateSeqHighlights();
  Transport.timerId=setTimeout(schedulerLoop,25);
}
function scheduleStep(step,time){
  // Apply swing
  var swingOffset=0;
  if(step%2===1){
    swingOffset=Transport.stepDur*State.settings.swing/100*0.5;
  }
  var t=time+swingOffset;
  var drumTypes=['kick','snare','hihat','clap','tom','cymbal','rim','cowbell'];
  drumTypes.forEach(function(type){
    if(State.drums[type].enabled&&State.pattern.tracks[type]&&State.pattern.tracks[type][step]){
      var acc=State.pattern.accents[type+':'+step];
      var vel=acc?1.3:(State.pattern.velocities[type+':'+step]||1);
      scheduleDrumAt(type,vel,t);
    }
  });
}
function scheduleDrumAt(type,velocity,time){
  // Simplified: uses AudioContext scheduling by triggering immediately with time offset
  // For accuracy we would need full offline-style scheduling; here we approximate with a short delay
  var delay=(time-AudioEngine.ctx.currentTime)*1000;
  if(delay<0)delay=0;
  setTimeout(function(){AudioEngine.playDrum(type,velocity)},delay);
}

function after_piano(){
  drawPianoRoll();
  var canvas=$('prCanvas');
  if(canvas){
    var dragging=false;
    var dragStartCell=null;
    canvas.addEventListener('mousedown',function(e){
      var rect=canvas.getBoundingClientRect();
      var x=e.clientX-rect.left;
      var y=e.clientY-rect.top+$('.pr-canvas-wrap').scrollTop;
      var step=Math.floor((x-40)/30);
      var midi=127-Math.floor(y/24);
      if(step<0||step>=State.pattern.steps)return;
      if(e.button===2){
        // Right-click delete
        var idx=(State.pattern.notes||[]).findIndex(function(n){return n.step===step&&n.midi===midi});
        if(idx>-1){
          State.pattern.notes.splice(idx,1);
          saveState();drawPianoRoll();
        }
        return;
      }
      // Left click add
      var existing=(State.pattern.notes||[]).findIndex(function(n){return n.step===step&&n.midi===midi});
      if(existing>-1){
        State.pattern.notes.splice(existing,1);
      }else{
        if(!State.pattern.notes)State.pattern.notes=[];
        State.pattern.notes.push({step:step,midi:midi,length:PianoRoll.noteLength});
        // Preview
        AudioEngine.init();
        AudioEngine.playSynth(midi,PianoRoll.noteLength*0.15);
      }
      saveState();drawPianoRoll();
    });
    canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
}

function drawPianoRoll(){
  var canvas=$('prCanvas');
  if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  // Keyboard background
  ctx.fillStyle='#0a0a14';
  ctx.fillRect(0,0,W,H);
  // Row backgrounds (piano keys)
  for(var m=127;m>=0;m--){
    var y=(127-m)*24;
    var isBlack=[1,3,6,8,10].indexOf(m%12)>-1;
    ctx.fillStyle=isBlack?'#141420':'#1a1a28';
    ctx.fillRect(40,y,W-40,24);
    // Key label
    ctx.fillStyle=isBlack?'#333':'#ddd';
    ctx.fillRect(0,y,40,24);
    ctx.fillStyle=isBlack?'#888':'#222';
    ctx.font='9px monospace';
    ctx.fillText(noteName(m),4,y+16);
    if(m%12===0){
      ctx.fillStyle=isBlack?'#444':'#888';
      ctx.fillRect(38,y,2,24);
    }
  }
  // Grid
  ctx.strokeStyle='rgba(0,255,213,.06)';
  for(var s=0;s<=State.pattern.steps;s++){
    var x=40+s*30;
    ctx.beginPath();
    ctx.moveTo(x,0);ctx.lineTo(x,H);
    ctx.stroke();
    if(s%4===0){
      ctx.strokeStyle='rgba(0,255,213,.2)';
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
      ctx.strokeStyle='rgba(0,255,213,.06)';
    }
  }
  // Playhead
  var playX=40+Transport.currentStep*30;
  ctx.strokeStyle='#ffb800';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(playX,0);ctx.lineTo(playX,H);ctx.stroke();
  // Notes
  (State.pattern.notes||[]).forEach(function(n){
    var x=40+n.step*30;
    var y=(127-n.midi)*24;
    var w=(n.length||2)*30;
    var grad=ctx.createLinearGradient(x,y,x+w,y+24);
    grad.addColorStop(0,'#00ffd5');
    grad.addColorStop(1,'#a855f7');
    ctx.fillStyle=grad;
    ctx.fillRect(x+1,y+1,w-2,22);
    ctx.strokeStyle='#000';
    ctx.lineWidth=1;
    ctx.strokeRect(x+1,y+1,w-2,22);
  });
}

function knobHTML(label,value,min,max,step,key,unit,invert){
  var pct=(value-min)/(max-min);
  var angle=-135+pct*270;
  return '<div class="knob">'+
    '<div class="knob-ring" style="background:conic-gradient(from 225deg,var(--c1) 0deg,var(--c1) '+(pct*270)+'deg,var(--bd2) '+(pct*270)+'deg,var(--bd2) 270deg,transparent 270deg)" data-key="'+key+'" data-min="'+min+'" data-max="'+max+'" data-step="'+step+'" data-value="'+value+'"'+(invert?' data-invert="1"':'')+'>'+
      '<div class="knob-inner">'+(unit==='Hz'?Math.round(Math.pow(10,value))+'':(value<1?value.toFixed(2):Math.round(value*100)/100))+'</div>'+
    '</div>'+
    '<label>'+label+'</label>'+
    '</div>';
}

function after_synth(){
  // Attach knob interaction
  $$('.knob-ring').forEach(function(ring){
    var dragging=false,startY=0,startVal=0;
    var key=ring.getAttribute('data-key');
    var min=parseFloat(ring.getAttribute('data-min'));
    var max=parseFloat(ring.getAttribute('data-max'));
    var step=parseFloat(ring.getAttribute('data-step'));
    var value=parseFloat(ring.getAttribute('data-value'));

    function onDown(e){
      dragging=true;
      startY=e.touches?e.touches[0].clientY:e.clientY;
      startVal=value;
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging)return;
      var y=e.touches?e.touches[0].clientY:e.clientY;
      var dy=startY-y;
      var range=max-min;
      var newVal=clamp(startVal+dy*range/200,min,max);
      newVal=Math.round(newVal/step)*step;
      value=newVal;
      ring.setAttribute('data-value',newVal);
      var pct=(newVal-min)/(max-min);
      var angle=-135+pct*270;
      ring.style.background='conic-gradient(from 225deg,var(--c1) 0deg,var(--c1) '+(pct*270)+'deg,var(--bd2) '+(pct*270)+'deg,var(--bd2) 270deg,transparent 270deg)';
      var inner=ring.querySelector('.knob-inner');
      if(key==='filterCutoffLog'){
        inner.textContent=Math.round(Math.pow(10,newVal))+'';
      }else{
        inner.textContent=newVal<1?newVal.toFixed(2):Math.round(newVal*100)/100;
      }
    }
    function onUp(){
      if(!dragging)return;
      dragging=false;
      if(key==='filterCutoffLog'){
        State.synth.filterCutoff=Math.round(Math.pow(10,value));
      }else{
        State.synth[key]=value;
      }
      AudioEngine.updateEffects();
      saveState();
    }
    ring.addEventListener('mousedown',onDown);
    ring.addEventListener('touchstart',onDown,{passive:false});
    document.addEventListener('mousemove',onMove);
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('mouseup',onUp);
    document.addEventListener('touchend',onUp);
  });
}

  saveState();
  navigate('sequencer');
  toast('Loaded: '+p.name,'success');

function after_keyboard(){
  buildKeyboard();
  // Key mappings
  var keyMap={
    'a':0,'w':1,'s':2,'e':3,'d':4,'f':5,'t':6,'g':7,'y':8,'h':9,'u':10,'j':11,'k':12,'o':13,'l':14,'p':15,';':16
  };
  document.addEventListener('keydown',keyHandler);
  document.addEventListener('keyup',keyUpHandler);
  window._keyMap=keyMap;
  window._activeKeys={};
}

function keyHandler(e){
  if(CurrentRoute!=='keyboard')return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  var k=e.key.toLowerCase();
  var map=window._keyMap;
  if(!map||map[k]===undefined)return;
  if(window._activeKeys[k])return;
  window._activeKeys[k]=true;
  var midi=(KeyboardState.octave+1)*12+map[k];
  AudioEngine.init();
  AudioEngine.playSynth(midi,0.8);
  var key=document.querySelector('.key-white[data-midi="'+midi+'"], .key-black[data-midi="'+midi+'"]');
  if(key)key.classList.add('active');
}
function keyUpHandler(e){
  var k=e.key.toLowerCase();
  if(window._activeKeys&&window._activeKeys[k]){
    delete window._activeKeys[k];
    $$('.key-white.active,.key-black.active').forEach(function(x){x.classList.remove('active')});
  }
}

function setOctave(o){
  KeyboardState.octave=o;
  renderPage();
}

function buildKeyboard(){
  var kb=$('keyboard');
  if(!kb)return;
  kb.innerHTML='';
  var oct=KeyboardState.octave;
  var whiteNotes=[0,2,4,5,7,9,11];
  var blackNotes={1:0,3:1,6:3,8:4,10:5};
  for(var o=0;o<2;o++){
    for(var i=0;i<7;i++){
      var midi=(oct+o)*12+whiteNotes[i];
      var key=el('div',{class:'key-white','data-midi':midi});
      key.innerHTML='<span class="kn">'+noteName(midi)+'</span>';
      key.onclick=function(){triggerKey(parseInt(this.getAttribute('data-midi')))};
      kb.appendChild(key);
      // Add black key
      if(blackNotes[i+1]!==undefined||i<6){
        var blackOffset=[null,1,null,1,null,null,null];
        // Determine if this position has a black key after it
        var hasBlack=[true,true,false,true,true,true,false][i];
        if(hasBlack){
          var blackMidi=midi+1;
          var bk=el('div',{class:'key-black','data-midi':blackMidi});
          bk.onclick=function(e){e.stopPropagation();triggerKey(parseInt(this.getAttribute('data-midi')))};
          key.appendChild(bk);
        }
      }
    }
  }
}

function triggerKey(midi){
  AudioEngine.init();
  AudioEngine.playSynth(midi,0.6);
  toast('♪ '+noteName(midi),'info');
}
