    var wav=encodeWav(buffer);
    var blob=new Blob([wav],{type:'audio/wav'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sonicforge-'+slugify(State.pattern.name)+'-'+today()+'.wav';
    a.click();
    toast('WAV downloaded ('+bytes(blob.size)+')','success');
    logActivity('export','WAV exported: '+State.pattern.name);
  });
}

function slugify(s){return String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function bytes(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}

/* Standard WAV encoder */
function encodeWav(audioBuffer){
  var numChannels=audioBuffer.numberOfChannels;
  var sampleRate=audioBuffer.sampleRate;
  var length=audioBuffer.length;
  var bytesPerSample=2;
  var blockAlign=numChannels*bytesPerSample;
  var byteRate=sampleRate*blockAlign;
  var dataSize=length*blockAlign;
  var buffer=new ArrayBuffer(44+dataSize);
  var view=new DataView(buffer);
  function writeString(offset,str){
    for(var i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i));
  }
  writeString(0,'RIFF');
  view.setUint32(4,36+dataSize,true);
  writeString(8,'WAVE');
  writeString(12,'fmt ');
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,numChannels,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28,byteRate,true);
  view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true);
  writeString(36,'data');
  view.setUint32(40,dataSize,true);
  var offset=44;
  var channels=[];
  for(var c=0;c<numChannels;c++)channels.push(audioBuffer.getChannelData(c));
  for(var i=0;i<length;i++){
    for(var ch=0;ch<numChannels;ch++){
      var s=Math.max(-1,Math.min(1,channels[ch][i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7FFF,true);
      offset+=2;
    }
  }
  return buffer;
}

function exportProject(){
  var data={
    type:'sonicforge-project',
    version:1,
    exportedAt:nowISO(),
    settings:State.settings,
    synth:State.synth,
    drums:State.drums,
    effects:State.effects,
    mixer:State.mixer,
    pattern:State.pattern,
    patterns:State.patterns,
    song:State.song,
    customPresets:State.customPresets
  };
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sonicforge-project-'+today()+'.json';
  a.click();
  toast('Project exported','success');
  logActivity('export','Project exported');
}

function importProject(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,.sfp,.txt';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!data.settings){toast('Invalid project file','error');return}
        confirmDialog('Import Project','Replace all current work?',function(){
          if(data.settings)State.settings=Object.assign(State.settings,data.settings);
          if(data.synth)State.synth=Object.assign(State.synth,data.synth);
          if(data.drums)State.drums=Object.assign(State.drums,data.drums);
          if(data.effects)State.effects=Object.assign(State.effects,data.effects);
          if(data.mixer)State.mixer=Object.assign(State.mixer,data.mixer);
          if(data.pattern)State.pattern=data.pattern;
          if(data.patterns)State.patterns=data.patterns;
          if(data.song)State.song=data.song;
          saveState();
          AudioEngine.updateMixer();
          AudioEngine.updateEffects();
          renderNav();renderPage();
          toast('Project imported','success');
        },true);
      }catch(e){
        toast('Import failed: '+e.message,'error');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function exportPatternText(){
  var steps=State.pattern.steps;
  var drumTypes=['kick','snare','hihat','clap','tom','cymbal','rim','cowbell'];
  var lines=[];
  lines.push('SONICFORGE PATTERN: '+State.pattern.name);
  lines.push('BPM: '+State.settings.bpm);
  lines.push('Steps: '+steps);
  lines.push('');
  drumTypes.forEach(function(t){
    var row=drumTypes.indexOf(t);
    var pattern=State.pattern.tracks[t]||[];
    var str='';
    for(var i=0;i<steps;i++){
      var v=pattern[i]?1:0;
      var acc=State.pattern.accents[t+':'+i]?1:0;
      if(acc)str+='X ';
      else if(v)str+='o ';
      else str+='. ';
    }
    lines.push(t.padEnd(10)+'| '+str);
  });
  if(State.pattern.notes&&State.pattern.notes.length){
    lines.push('');
    lines.push('Notes:');
    State.pattern.notes.forEach(function(n){
      lines.push('  Step '+n.step+': '+noteName(n.midi)+' (length '+n.length+')');
    });
  }
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sonicforge-pattern-'+today()+'.txt';
  a.click();
  toast('Pattern text downloaded','success');
}

function loadSynthPreset(){

function screenshotPattern(){
  var steps=State.pattern.steps;
  var drumTypes=['kick','snare','hihat','clap','tom','cymbal','rim','cowbell'];
  var canvas=document.createElement('canvas');
  var cell=40;
  var W=80+steps*cell;
  var H=60+drumTypes.length*cell+60;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#0a0612';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#00ffd5';
  ctx.font='bold 18px sans-serif';
  ctx.fillText('SONICFORGE · '+State.pattern.name,W/2-ctx.measureText('SONICFORGE · '+State.pattern.name).width/2,30);
  ctx.fillStyle='#b8a8e0';
  ctx.font='12px monospace';
  ctx.fillText('BPM '+State.settings.bpm+' · '+steps+' steps',20,50);
  drumTypes.forEach(function(t,row){
    var y=70+row*cell;
    ctx.fillStyle='#8070b0';
    ctx.font='11px monospace';
    ctx.fillText(t,10,y+cell/2);
    var pattern=State.pattern.tracks[t]||[];
    for(var i=0;i<steps;i++){
      var x=80+i*cell;
      var active=pattern[i];
      var acc=State.pattern.accents[t+':'+i];
      if(acc)ctx.fillStyle='#ff2d9e';
      else if(active)ctx.fillStyle='#00ffd5';
      else if(i%4===0)ctx.fillStyle='#241a42';
      else ctx.fillStyle='#151024';
      ctx.fillRect(x+2,y+2,cell-4,cell-4);
      if(active||acc){
        ctx.strokeStyle='#000';
        ctx.lineWidth=1;
        ctx.strokeRect(x+2,y+2,cell-4,cell-4);
      }
    }
  });
  canvas.toBlob(function(blob){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='sonicforge-'+slugify(State.pattern.name)+'.png';
    a.click();
    toast('Screenshot saved','success');
  });
}

  State.mixer.master.volume=State.settings.masterVolume;
  AudioEngine.updateMixer();
  saveState();

/* ================================================================
   INIT + GLOBAL KEYS
   ================================================================ */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='Escape'){closeModal();return}
  if(e.key===' '){e.preventDefault();togglePlay()}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveState();toast('Saved','success')}
  if(e.key==='?'){
    e.preventDefault();
    openHelp();
  }
});

function initApp(){
  var loaded=loadState();
  if(!loaded||!State.patterns.length){
    seedDemoData();
    saveState();
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'neon');
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='piano')drawPianoRoll();
  });
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  renderNav();
  renderPage();
  // Show metronome state
  if(State.settings.metronomeOn){
    var mb=$('metroBtn');
    if(mb)mb.classList.add('active');
  }
  setInterval(function(){
    if(State.settings.autoSave)saveState();
  },30000);
  window.addEventListener('beforeunload',saveState);
  // Welcome
  setTimeout(function(){toast('Welcome to SonicForge — press ▶ or Space to play','pink')},400);
  // Periodic playhead UI update when playing
  setInterval(function(){
    if(Transport.playing){
      var e=$('txStep');if(e)e.textContent=Transport.currentStep+1;
      var e2=$('txStep2');if(e2)e2.textContent=Transport.currentStep+1;
      if(CurrentRoute==='piano')drawPianoRoll();
    }
  },50);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
