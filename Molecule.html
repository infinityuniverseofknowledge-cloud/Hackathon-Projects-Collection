/* ══════════════ VSEPR ══════════════ */
R.vsepr=function(dt){
  clear();
  headline('VSEPR Geometry','valence shell electron pair repulsion');
  if(!S.sim.vsepr){S.sim.vsepr={bp:4,lp:0}}
  var v=S.sim.vsepr;
  var geom=vseprGeometry(v.bp,v.lp);
  /* Draw geometry */
  var cx=S.W/2-80,cy=S.H/2;
  var R0=Math.min(S.W,S.H)*0.2;
  if(geom){
    /* Compute positions */
    var positions=[];
    var total=v.bp+v.lp;
    if(total===2){
      positions=[[0,1,'bp'],[-Math.PI,1,'bp']];
    } else if(total===3){
      positions=[[-Math.PI/2,1,'bp'],[Math.PI/6,1,'bp'],[Math.PI*5/6,1,'bp']];
    } else if(total===4){
      positions=[[0,0.7,'bp'],[Math.PI*2/3,0.7,'bp'],[Math.PI*4/3,0.7,'bp'],[0,-0.7,'bp']];
    } else if(total===5){
      positions=[[0,1,'bp'],[Math.PI*2/5,1,'bp'],[Math.PI*4/5,1,'bp'],[Math.PI*6/5,1,'bp'],[Math.PI*8/5,1,'bp']];
    } else if(total===6){
      for(var i=0;i<6;i++)positions.push([i*Math.PI/3,1,'bp']);
    }
    /* Mark lone pairs first */
    var lpAssigned=0;
    var bonds=[];
    var lps=[];
    positions.forEach(function(p,i){
      /* If lone pair, place at end */
      if(i>=v.bp+lps.length&&lpAssigned<v.lp){
        lps.push(p);
        lpAssigned++;
      } else {
        bonds.push(p);
      }
    });
    /* Redistribute: lp on equatorial positions preferentially (for 5-coord) */
    /* Simple: reassign lps to last positions */
    bonds=[];
    lps=[];
    for(var i=0;i<v.bp;i++)bonds.push(positions[i]);
    for(var i=v.bp;i<positions.length;i++)lps.push(positions[i]);
    /* Central atom */
    S.ctx.fillStyle='#8c5cf0';
    S.ctx.beginPath();S.ctx.arc(cx,cy,16,0,Math.PI*2);S.ctx.fill();
    S.ctx.fillStyle='#d0c8e8';
    S.ctx.font='700 14px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.textBaseline='middle';
    S.ctx.fillText('M',cx,cy);
    S.ctx.textBaseline='alphabetic';
    /* Draw bonds */
    bonds.forEach(function(p){
      var x=cx+Math.cos(p[0])*R0*p[1];
      var y=cy+Math.sin(p[0])*R0*p[1];
      S.ctx.strokeStyle='#ffb347';
      S.ctx.lineWidth=3;
      S.ctx.beginPath();
      S.ctx.moveTo(cx,cy);
      S.ctx.lineTo(x,y);
      S.ctx.stroke();
      /* Ligand atom */
      S.ctx.fillStyle='#4dd0ff';
      S.ctx.beginPath();S.ctx.arc(x,y,12,0,Math.PI*2);S.ctx.fill();
      S.ctx.fillStyle='#04061a';
      S.ctx.font='700 11px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.textBaseline='middle';
      S.ctx.fillText('X',x,y);
      S.ctx.textBaseline='alphabetic';
    });
    /* Lone pairs */
    lps.forEach(function(p){
      var x=cx+Math.cos(p[0])*R0*p[1]*1.1;
      var y=cy+Math.sin(p[0])*R0*p[1]*1.1;
      S.ctx.fillStyle='#ff4d3d';
      S.ctx.beginPath();S.ctx.arc(x,y,8,0,Math.PI*2);S.ctx.fill();
      S.ctx.fillStyle='#04061a';
      S.ctx.font='700 10px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.textBaseline='middle';
      S.ctx.fillText(':',x,y);
      S.ctx.textBaseline='alphabetic';
    });
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,280);
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.strokeRect(infoX+.5,80.5,299,279);
  S.ctx.fillStyle='#b088ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('MOLECULAR SHAPE',infoX+15,100);
  if(geom){
    var rows=[
      ['Bonding pairs',v.bp],
      ['Lone pairs',v.lp],
      ['Total domains',v.bp+v.lp],
      ['Electron geometry',geom.name],
      ['Molecular shape',geom.shape],
      ['Bond angle',fmt(geom.angle,1)+'°'],
      ['Example',geom.example]
    ];
    rows.forEach(function(r,i){
      S.ctx.fillStyle='#8888b0';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText(r[0],infoX+15,130+i*22);
      S.ctx.fillStyle='#b088ff';
      S.ctx.textAlign='right';
      S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
      S.ctx.textAlign='left';
    });
  }
};

/* ══════════════ Crystal Lattices ══════════════ */
R.crystal=function(dt){
  clear();
  headline('Crystal Lattices','Bravais · basis · coordination');
  if(!S.sim.crystal){S.sim.crystal={type:'fcc',n:2}}
  var c=S.sim.crystal;
  var positions=buildCrystal(c.type,c.n,1);
  /* 3D render */
  var cx=S.W/2-100,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.5/(c.n);
  var angle=S.t*0.2;
  var projected=[];
  positions.forEach(function(p){
    var x=p.x-c.n/2;
    var y=p.y-c.n/2;
    var z=p.z-c.n/2;
    var xr=x*Math.cos(angle)-z*Math.sin(angle);
    var zr=x*Math.sin(angle)+z*Math.cos(angle);
    projected.push({
      sx:cx+xr*scale,
      sy:cy-y*scale,
      z:zr,
      type:p.type
    });
  });
  projected.sort(function(a,b){return a.z-b.z});
  /* Draw bonds */
  for(var i=0;i<projected.length;i++){
    for(var j=i+1;j<projected.length;j++){
      var d=Math.sqrt(Math.pow(projected[i].sx-projected[j].sx,2)+Math.pow(projected[i].sy-projected[j].sy,2));
      if(d<scale*0.9){
        var alpha=clamp(0.5-(projected[i].z+projected[j].z)/10,0.1,0.6);
        S.ctx.strokeStyle='rgba(255,179,71,'+alpha+')';
        S.ctx.lineWidth=1.5;
        S.ctx.beginPath();
        S.ctx.moveTo(projected[i].sx,projected[i].sy);
        S.ctx.lineTo(projected[j].sx,projected[j].sy);
        S.ctx.stroke();
      }
    }
  }
  /* Draw atoms */
  projected.forEach(function(p){
    var typeColor='#ffb347';
    if(p.type==='Na')typeColor='#8c5cf0';
    if(p.type==='Cl')typeColor='#00ff9d';
    if(p.type==='Cs')typeColor='#ff4d3d';
    var rad=Math.max(4,8+(p.z/scale));
    var grd=S.ctx.createRadialGradient(p.sx-rad*0.3,p.sy-rad*0.3,0,p.sx,p.sy,rad);
    grd.addColorStop(0,'#ffffff');
    grd.addColorStop(0.5,typeColor);
    grd.addColorStop(1,typeColor);
    S.ctx.fillStyle=grd;
    S.ctx.beginPath();S.ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);S.ctx.fill();
    S.ctx.strokeStyle='#04061a';
    S.ctx.lineWidth=1;
    S.ctx.stroke();
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,280);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,279);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CRYSTAL STRUCTURE',infoX+15,100);
  var packing={
    sc:'52.4% (simple cubic)',
    bcc:'68.0% (body-centered)',
    fcc:'74.0% (face-centered cubic = CCP)',
    hcp:'74.0% (hexagonal close-packed)',
    diamond:'34.0% (diamond cubic)',
    nacl:'rock salt (6:6)',
    cscl:'cesium chloride (8:8)'
  };
  var cn={sc:6,bcc:8,fcc:12,hcp:12,diamond:4,nacl:6,cscl:8};
  var atomsPerCell={sc:1,bcc:2,fcc:4,hcp:2,diamond:8,nacl:4,cscl:1};
  var rows=[
    ['Type',c.type.toUpperCase()],
    ['Atoms/cell',atomsPerCell[c.type]||0],
    ['Coordination #',cn[c.type]||0],
    ['Packing eff.',packing[c.type]||'—'],
    ['Total atoms',positions.length],
    ['Unit cells',c.n+'×'+c.n+'×'+c.n]
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Bragg Diffraction ══════════════ */
R.bragg=function(dt){
  clear();
  headline("Bragg's Law",'nλ = 2d·sin(θ)');
  if(!S.sim.bragg){S.sim.bragg={type:'fcc',a:400,h:1,k:1,l:1,lambda:154}}
  var b=S.sim.bragg;
  /* Compute d-spacing */
  var d=dSpacing(b.type,b.h,b.k,b.l,b.a);
  /* Find allowed reflections for fcc/bcc */
  var allowed=[];
  for(var h=0;h<=4;h++)for(var k=0;k<=4;k++)for(var l=0;l<=4;l++){
    if(h===0&&k===0&&l===0)continue;
    var hkl=h*h+k*k+l*l;
    var ok=true;
    if(b.type==='fcc'){
      /* FCC: h,k,l all even or all odd */
      var even=(h%2===0)+(k%2===0)+(l%2===0);
      ok=(even===0||even===3);
    } else if(b.type==='bcc'){
      ok=((h+k+l)%2===0);
    } else if(b.type==='sc'){
      ok=true;
    }
    if(!ok)continue;
    var dval=b.a/Math.sqrt(hkl);
    /* Calculate Bragg angle */
    var sinTheta=b.lambda/(2*dval);
    if(sinTheta<=1&&sinTheta>0){
      allowed.push({h:h,k:k,l:l,d:dval,theta:Math.asin(sinTheta)*180/Math.PI,dhkl:hkl});
    }
  }
  /* Plot diffraction pattern */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'2θ (degrees)','intensity');
  /* Add gaussian peaks */
  var samples=500;
  var intensity=new Float64Array(samples);
  var maxInt=0;
  allowed.forEach(function(ref){
    var peakCenter=2*ref.theta;
    for(var i=0;i<samples;i++){
      var twoTheta=10+140*i/samples;
      var d=twoTheta-peakCenter;
      var inten=Math.exp(-d*d/0.5);
      if(inten>0.01)intensity[i]+=inten;
      if(intensity[i]>maxInt)maxInt=intensity[i];
    }
  });
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<samples;i++){
    var twoTheta=10+140*i/samples;
    var x=padL+i/samples*plotW;
    var y=padT+plotH-(intensity[i]/maxInt)*plotH*0.9;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Label peaks */
  allowed.slice(0,8).forEach(function(ref){
    var peakX=padL+((2*ref.theta-10)/140)*plotW;
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='8px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.save();
    S.ctx.translate(peakX,padT+plotH-10);
    S.ctx.rotate(-Math.PI/3);
    S.ctx.textAlign='right';
    S.ctx.fillText('('+ref.h+ref.k+ref.l+')',0,0);
    S.ctx.restore();
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,260);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,259);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText("BRAGG'S LAW",infoX+15,100);
  var rows=[
    ['Lattice',b.type.toUpperCase()],
    ['a (pm)',b.a],
    ['λ (pm)',b.lambda],
    ['Reflection','('+b.h+b.k+b.l+')'],
    ['d_(hkl)',fmt(d,2)+' pm'],
    ['2θ',fmt(2*Math.asin(b.lambda/(2*d))*180/Math.PI,3)+'°'],
    ['Allowed reflections',allowed.length],
    ['First 4 peaks',''],
    ['Rule (fcc)','h,k,l all even or odd'],
    ['Rule (bcc)','h+k+l even']
  ];
  allowed.slice(0,4).forEach(function(r){
    rows.push(['  ('+r.h+r.k+r.l+')',fmt(2*r.theta,2)+'°']);
  });
  rows.forEach(function(r,i){
    if(i*22+130>S.H-40)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Conformational Analysis ══════════════ */
R.conform=function(dt){
  clear();
  headline('Conformational Analysis','Newman projections & dihedral scan');
  if(!S.sim.conform){S.sim.conform={angle:0}}
  var c=S.sim.conform;
  c.angle+=dt*20;
  /* Newman projection */
  var cx=S.W/2-100,cy=S.H/2;
  var R0=Math.min(S.W,S.H)*0.18;
  /* Front carbon - three H at 0, 120, 240 */
  var frontAngles=[0,120,240];
  var backAngles=[60,180,300];
  var angRad=c.angle*Math.PI/180;
  /* Back atom (behind) */
  S.ctx.fillStyle='rgba(255,179,71,.3)';
  S.ctx.beginPath();S.ctx.arc(cx,cy,6,0,Math.PI*2);S.ctx.fill();
  /* Back H (rotate by dihedral angle) */
  backAngles.forEach(function(a){
    var ar=(a+angRad)*Math.PI/180;
    var x=cx+Math.cos(ar)*R0*0.7;
    var y=cy+Math.sin(ar)*R0*0.7;
    S.ctx.strokeStyle='rgba(255,179,71,.4)';
    S.ctx.lineWidth=6;
    S.ctx.beginPath();
    S.ctx.moveTo(cx,cy);
    S.ctx.lineTo(x,y);
    S.ctx.stroke();
    S.ctx.fillStyle='rgba(255,179,71,.5)';
    S.ctx.beginPath();S.ctx.arc(x,y,10,0,Math.PI*2);S.ctx.fill();
    S.ctx.fillStyle='#04061a';
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.textBaseline='middle';
    S.ctx.fillText('H',x,y);
  });
  /* Front carbon */
  S.ctx.fillStyle='#8c5cf0';
  S.ctx.beginPath();S.ctx.arc(cx,cy,8,0,Math.PI*2);S.ctx.fill();
  /* Front H */
  frontAngles.forEach(function(a){
    var ar=a*Math.PI/180;
    var x=cx+Math.cos(ar)*R0;
    var y=cy+Math.sin(ar)*R0;
    S.ctx.strokeStyle='#8c5cf0';
    S.ctx.lineWidth=4;
    S.ctx.beginPath();
    S.ctx.moveTo(cx,cy);
    S.ctx.lineTo(x,y);
    S.ctx.stroke();
    S.ctx.fillStyle='#b088ff';
    S.ctx.beginPath();S.ctx.arc(x,y,10,0,Math.PI*2);S.ctx.fill();
    S.ctx.fillStyle='#04061a';
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textBaseline='middle';
    S.ctx.fillText('H',x,y);
  });
  S.ctx.textBaseline='alphabetic';
  /* Energy plot */
  var padL=80,padT=S.H-160,padR=40,padB=60;
  var plotW=S.W-padL-padR,plotH=Math.min(120,S.H-padT-40);
  if(plotH>60){
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('DIHEDRAL ENERGY',padL,padT-5);
    S.ctx.fillStyle='rgba(10,14,46,.7)';
    S.ctx.fillRect(padL,padT,plotW,plotH);
    S.ctx.strokeStyle='rgba(255,179,71,.3)';
    S.ctx.strokeRect(padL+.5,padT+.5,plotW-1,plotH-1);
    var energies=[];
    for(var i=0;i<=180;i++){
      energies.push(newmanProjection(i*2));
    }
    var eMax=Math.max.apply(null,energies);
    var eMin=Math.min.apply(null,energies);
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    energies.forEach(function(e,i){
      var x=padL+(i/180)*plotW;
      var y=padT+plotH-(e-eMin)/(eMax-eMin||1)*plotH*0.9;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    });
    S.ctx.stroke();
    /* Current marker */
    var curE=newmanProjection(((c.angle%360)+360)%360>180?((c.angle%360)+360)%360-180:((c.angle%360)+360)%360);
    var xc2=padL+(Math.abs(c.angle%180)/180)*plotW;
    var yc2=padT+plotH-(curE-eMin)/(eMax-eMin||1)*plotH*0.9;
    S.ctx.fillStyle='#00ff9d';
    S.ctx.beginPath();S.ctx.arc(xc2,yc2,6,0,Math.PI*2);S.ctx.fill();
    /* Labels */
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('0° (syn)',padL,padT+plotH+15);
    S.ctx.fillText('60° (gauche)',padL+(60/180)*plotW,padT+plotH+15);
    S.ctx.fillText('120° (eclipsed)',padL+(120/180)*plotW,padT+plotH+15);
    S.ctx.fillText('180° (anti)',padL+plotW,padT+plotH+15);
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CONFORMATION',infoX+15,100);
  var dih=((c.angle%360)+360)%360;
  var state=dih<30||dih>330?'Syn':(dih>150&&dih<210?'Anti':(Math.abs(dih-60)<20||Math.abs(dih-300)<20?'Gauche':'Eclipsed'));
  var relE=newmanProjection(dih%180);
  var rows=[
    ['Dihedral angle',fmt(dih,1)+'°'],
    ['Conformation',state],
    ['Relative E',fmt(relE,3)+' kJ/mol'],
    ['Syn (0°)','Highest energy'],
    ['Gauche (±60°)','Local minimum'],
    ['Anti (180°)','Global minimum'],
    ['Barrier','~12 kJ/mol']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};
</script>
<script>
/* ══════════════ IR Spectrum ══════════════ */
R.ir=function(dt){
  clear();
  headline('IR Spectrum','characteristic group frequencies');
  if(!S.sim.ir){S.sim.ir={groups:['O-H stretch (alcohol)','C-H stretch (alkane)','C=O stretch (ketone)','C-O stretch']}}
  var ir=S.sim.ir;
  /* Build groups list with strength */
  var activeGroups=[];
  IR_GROUPS.forEach(function(g){
    if(ir.groups.indexOf(g.name)>=0){
      activeGroups.push(Object.assign({},g,{strength:1}));
    }
  });
  /* Plot spectrum */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'wavenumber (cm⁻¹)','transmittance');
  var samples=800;
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<samples;i++){
    var wn=4000-3600*i/samples;
    var absorb=0;
    activeGroups.forEach(function(g){
      var mid=(g.range[0]+g.range[1])/2;
      var width=Math.abs(g.range[1]-g.range[0])/2+20;
      var d=wn-mid;
      absorb+=g.strength*Math.exp(-d*d/(2*width*width));
    });
    var T=clamp(1-absorb*0.85,0.05,1);
    var x=padL+(i/samples)*plotW;
    var y=padT+plotH-(1-T)*plotH;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Peak labels */
  activeGroups.forEach(function(g){
    var mid=(g.range[0]+g.range[1])/2;
    var x=padL+((4000-mid)/3600)*plotW;
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='8px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.save();
    S.ctx.translate(x,padT+40);
    S.ctx.rotate(-Math.PI/2);
    S.ctx.textAlign='left';
    S.ctx.fillText(g.name.substring(0,20),0,0);
    S.ctx.restore();
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,S.H-120);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,S.H-121);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ACTIVE GROUPS ('+activeGroups.length+')',infoX+15,100);
  var y=130;
  activeGroups.forEach(function(g,i){
    if(i*24+130>S.H-60)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText(g.name.substring(0,24),infoX+15,y+i*24);
    S.ctx.fillStyle='#ffd080';
    S.ctx.fillText(g.range[0]+'-'+g.range[1]+' cm⁻¹',infoX+15,y+i*24+11);
  });
};

/* ══════════════ NMR Spectrum ══════════════ */
R.nmr=function(dt){
  clear();
  headline('¹H NMR Spectrum','chemical shifts');
  if(!S.sim.nmr){S.sim.nmr={shifts:[
    {ppm:1.3,nH:6,mult:'t',name:'CH₃'},
    {ppm:3.5,nH:4,mult:'t',name:'CH₂-O'}
  ]}}
  var nmr=S.sim.nmr;
  /* Plot NMR */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'chemical shift (ppm)','intensity');
  var ppmMin=0,ppmMax=12;
  var samples=800;
  var intensity=new Float64Array(samples);
  var maxI=0;
  nmr.shifts.forEach(function(s){
    var peaks=multplicityPattern(multToInt(s.mult));
    var nP=s.nH;
    var lineW=0.02;
    var coupling=0.012;
    for(var i=0;i<samples;i++){
      var ppm=ppmMax-(ppmMax-ppmMin)*i/samples;
      var sub=0;
      peaks.forEach(function(pk,pidx){
        var offset=(pidx-(peaks.length-1)/2)*coupling;
        var d=ppm-(s.ppm+offset);
        sub+=pk*(lineW)/(d*d+lineW*lineW);
      });
      intensity[i]+=sub;
      if(intensity[i]>maxI)maxI=intensity[i];
    }
  });
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<samples;i++){
    var x=padL+i/samples*plotW;
    var y=padT+plotH-(intensity[i]/maxI)*plotH*0.9;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Peak labels */
  nmr.shifts.forEach(function(s){
    var x=padL+((ppmMax-s.ppm)/(ppmMax-ppmMin))*plotW;
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(s.name+' ('+s.mult+','+s.nH+'H)',x,padT+30);
    S.ctx.fillText(fmt(s.ppm,2),x,padT+50);
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,280);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,279);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('NMR DATA',infoX+15,100);
  var totH=0;
  nmr.shifts.forEach(function(s){totH+=s.nH});
  var rows=[
    ['Total protons',totH],
    ['Signals',nmr.shifts.length],
    ['Range (ppm)',ppmMin+'-'+ppmMax],
    ['Solvent','CDCl₃ (7.26 ppm)'],
    ['Ref','TMS (0 ppm)'],
    ['Multiplicity rules','n+1'],
    ['------------------',''],
  ];
  nmr.shifts.forEach(function(s){
    rows.push([s.name,fmt(s.ppm,3)+' ppm']);
    rows.push(['  '+s.mult+', '+s.nH+'H','']);
  });
  rows.forEach(function(r,i){
    if(i*22+130>S.H-40)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};
function multToInt(m){
  if(m==='s')return 1;
  if(m==='d')return 2;
  if(m==='t')return 3;
  if(m==='q')return 4;
  if(m==='m')return 5;
  return 1;
}

/* ══════════════ UV-Vis ══════════════ */
R.uvvis=function(dt){
  clear();
  headline('UV-Visible Spectroscopy','electronic transitions');
  if(!S.sim.uv){S.sim.uv={lambda:400}}
  var uv=S.sim.uv;
  /* Plot absorption vs λ */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'wavelength (nm)','absorbance');
  var samples=400;
  var peaks=[
    {lambda:220,width:15,A:0.8,name:'π→π*'},
    {lambda:280,width:20,A:0.4,name:'n→π*'},
    {lambda:450,width:60,A:0.3,name:'d-d'},
    {lambda:550,width:50,A:0.2,name:'d-d'}
  ];
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<samples;i++){
    var lambda=200+i/samples*700;
    var A=0;
    peaks.forEach(function(p){
      A+=p.A*Math.exp(-Math.pow(lambda-p.lambda,2)/(2*p.width*p.width));
    });
    var x=padL+(i/samples)*plotW;
    var y=padT+plotH-A*plotH;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Peak labels */
  peaks.forEach(function(p){
    var x=padL+((p.lambda-200)/700)*plotW;
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(p.name,x,padT+30);
  });
  /* Visible spectrum bar */
  var specY=padT+plotH+30;
  for(var i=0;i<plotW;i+=2){
    var nm=200+(i/plotW)*700;
    var rgb=wavelengthToRGB(nm);
    S.ctx.fillStyle='rgb('+rgb.r+','+rgb.g+','+rgb.b+')';
    S.ctx.fillRect(padL+i,specY,2,20);
  }
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(padL+.5,specY+.5,plotW-1,19);
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ELECTRONIC TRANSITIONS',infoX+15,100);
  var dE=CONST.h*CONST.c/(uv.lambda*1e-9);
  var rows=[
    ['λ transition',uv.lambda+' nm'],
    ['Energy ΔE',expo(dE,3)+' J'],
    ['  in eV',fmt(dE/CONST.eV,3)+' eV'],
    ['  in cm⁻¹',fmt(1e7/uv.lambda,0)],
    ['Beer-Lambert','A = ε·c·l'],
    ['Molar absorptivity ε','L/mol/cm'],
    ['Chromophore','conjugated system'],
    ['π→π* shift','red with conjugation']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Mass Spec ══════════════ */
R.mspec=function(dt){
  clear();
  headline('Mass Spectrum','fragmentation patterns');
  if(!S.sim.mspec){S.sim.mspec={formula:'C6H6',M:78}}
  var ms=S.sim.mspec;
  var fragments=massSpecFragments(ms.formula);
  /* Draw peaks */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'m/z','relative abundance (%)');
  var maxMass=0;
  fragments.forEach(function(f){if(f.mass>maxMass)maxMass=f.mass});
  fragments.forEach(function(f){
    var x=padL+(f.mass/maxMass)*plotW;
    var h=f.relative/100*plotH*0.9;
    S.ctx.fillStyle=f.relative===100?'#ffb347':'#8c5cf0';
    S.ctx.fillRect(x-3,padT+plotH-h,6,h);
    S.ctx.fillStyle='#d0c8e8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(fmt(f.mass,1),x,padT+plotH+15);
    /* Label */
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='8px "JetBrains Mono",monospace';
    S.ctx.fillText(f.formula.substring(0,8),x,padT+plotH-h-5);
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#b088ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('MS FRAGMENTS',infoX+15,100);
  var rows=[
    ['Formula',ms.formula],
    ['M+.',fmt(fragments[0].mass,4)],
    ['Fragments',fragments.length],
    ['Base peak','M (100%)'],
    ['Isotope pattern','See isotopes module']
  ];
  fragments.slice(1).forEach(function(f){
    rows.push([f.formula,fmt(f.mass,2)+' ('+Math.round(f.relative)+'%)']);

  rows.forEach(function(r,i){
    if(i*22+130>S.H-40)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#b088ff';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

  }
  else if(id==='vsepr'){

      html+='<div class="chip" style="display:inline-block;padding:3px 8px;background:var(--panel3);border:1px solid var(--bd2);border-radius:8px;font-family:var(--mo);font-size:10px;color:var(--am2);cursor:pointer;margin:2px" onclick="S.sim.vsepr.bp='+p[1]+';S.sim.vsepr.lp='+p[2]+';renderInfo()">'+p[0]+'</div>';

    NMR_1H_SHIFTS.slice(0,10).forEach(function(s){

function prop(k,v,cls){
  return '<div class="prop"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v)+'</span></div>';
}
function toggleIRGroup(name){
  if(!S.sim.ir)S.sim.ir={groups:[]};
  var idx=S.sim.ir.groups.indexOf(name);
  if(idx>=0)S.sim.ir.groups.splice(idx,1);
  else S.sim.ir.groups.push(name);
  renderInfo();
}

function bindInteractions(){
  S.cv.addEventListener('click',function(e){
    var r=S.cv.getBoundingClientRect();
    var x=e.clientX-r.left;
    var y=e.clientY-r.top;
    if(S.module==='ptable'&&S.sim.ptCells){
      S.sim.ptCells.forEach(function(c){
        if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){
          S.sim.currentZ=c.Z;
          toast('Element '+c.Z,'am');
        }
      });
    }
  });
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key===' '){
      e.preventDefault();
      if(S.sim.md)S.sim.md.running=!S.sim.md.running;
      toast('Toggled','am');
    }
    else if(e.key==='r'||e.key==='R'){
      if(S.module==='md')S.sim.md.reinit=true;
      if(S.module==='vacf')S.sim.vacf={history:[]};
    }
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

function renderModule(){
  var r=R[S.module];
  if(r)r(0);
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#04061a';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff4d3d';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'loading periodic table…',pct:12},
    {msg:'initializing MD engine…',pct:26},
    {msg:'compiling Hückel solver…',pct:42},
    {msg:'calibrating spectrometers…',pct:58},
    {msg:'initializing quantum chemistry…',pct:74},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,180);
  }
  setTimeout(next,200);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  boot();
  requestAnimationFrame(loop);
  console.log('%c MOLECULE ','background:linear-gradient(90deg,#ffb347,#8c5cf0);color:#04061a;padding:10px 22px;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('Computational Chemistry & MD Workbench · '+MODULES.length+' modules');
  console.log('Real Hückel · Lennard-Jones MD · VSEPR · Bragg · NMR');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
