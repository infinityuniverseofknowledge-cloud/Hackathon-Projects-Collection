<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MOLECULE — Computational Chemistry Workbench</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#04061a;color:#d0c8e8;font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
:root{
  --bg:#04061a;--bg2:#080a24;--panel:#0a0e2e;--panel2:#101638;--panel3:#1a2254;--panel4:#262f70;
  --bd:#101638;--bd2:#1c2554;--bd3:#2e3a78;
  --tx:#d0c8e8;--tx2:#8888b0;--tx3:#4a4a88;--tx4:#1c2554;
  --am:#ffb347;--am2:#ffd080;--am3:#cc8811;
  --pu:#8c5cf0;--pu2:#b088ff;--pu3:#5c2ecc;
  --gr:#00ff9d;--gr2:#5cffc0;--gr3:#00a566;
  --rd:#ff4d3d;--rd2:#ff8578;--rd3:#cc2211;
  --cy:#4dd0ff;--cy2:#80e5ff;--cy3:#0891cc;
  --pk:#ff4d9d;--pk2:#ff85c0;
  --mo:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --sa:'Inter',-apple-system,system-ui,sans-serif;
  --di:'Orbitron','Chakra Petch','Inter',sans-serif;
  --t:.15s cubic-bezier(.4,0,.2,1);
}
::selection{background:rgba(255,179,71,.35);color:#fff}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--bd3)}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 20% 15%,rgba(255,179,71,.10),transparent 40%),
  radial-gradient(circle at 80% 85%,rgba(140,92,240,.10),transparent 45%),
  radial-gradient(circle at 50% 50%,rgba(0,255,157,.03),transparent 60%),
  linear-gradient(rgba(255,179,71,.02) 1px,transparent 1px) 0 0/50px 50px,
  linear-gradient(90deg,rgba(255,179,71,.02) 1px,transparent 1px) 0 0/50px 50px,
  #04061a}

#shell{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}

.top{height:50px;background:linear-gradient(180deg,rgba(10,14,46,.96),rgba(4,6,26,.96));backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;position:relative;z-index:100}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--am),var(--pu),transparent);opacity:.7}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--di);font-weight:900;font-size:1.3rem;letter-spacing:4px;color:var(--am);text-shadow:0 0 24px rgba(255,179,71,.6)}
.brand-sub{font-family:var(--mo);font-size:9px;letter-spacing:2.4px;color:var(--tx3);text-transform:uppercase}
.div{width:1px;height:24px;background:var(--bd2)}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:#000;border:1px solid var(--bd2);border-radius:3px}
.chip span{font-family:var(--mo);font-size:9px;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase}
.chip b{font-family:var(--mo);font-size:11px;color:var(--am2);font-weight:600}
.chip b.pu{color:var(--pu2)}
.chip b.gr{color:var(--gr2)}
.chip b.cy{color:var(--cy2)}
.chip b.rd{color:var(--rd2)}
.stats{display:flex;gap:14px;margin-left:auto;font-family:var(--mo);font-size:10px;letter-spacing:.8px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font-size:8px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px}
.stat .v{color:var(--am2);font-weight:600}

.main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}

.nav{width:250px;background:rgba(10,14,46,.94);backdrop-filter:blur(12px);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-search{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-search input{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11px;color:var(--am2);letter-spacing:.5px;transition:var(--t)}
.nav-search input:focus{border-color:var(--am);box-shadow:0 0 0 3px rgba(255,179,71,.12)}
.nav-search input::placeholder{color:var(--tx3)}
.nav-cat{padding:11px 0 3px}
.nav-cat-label{font-family:var(--mo);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);padding:0 13px 5px;font-weight:600}
.nav-item{padding:6px 13px;font-size:12px;color:var(--tx2);cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:10px;position:relative}
.nav-item:hover{background:rgba(255,179,71,.06);color:var(--tx)}
.nav-item.active{background:linear-gradient(90deg,rgba(255,179,71,.14),transparent);color:var(--am2);border-left:2px solid var(--am);padding-left:11px}
.nav-item .ico{font-size:13px;width:18px;text-align:center;opacity:.85;font-family:var(--mo)}

.stage{flex:1;position:relative;overflow:hidden;background:transparent;min-width:0;display:flex;flex-direction:column}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stageContent{position:absolute;inset:0;pointer-events:none;z-index:5}

.info{width:340px;background:rgba(10,14,46,.94);backdrop-filter:blur(12px);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.info-head{padding:13px 17px;border-bottom:1px solid var(--bd);position:relative;background:linear-gradient(180deg,rgba(255,179,71,.05),transparent)}
.info-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--am),transparent);opacity:.55}
.info-title{font-family:var(--di);font-size:1.15rem;font-weight:700;color:var(--tx);letter-spacing:.5px}
.info-sub{font-family:var(--mo);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.info-body{padding:14px 17px 24px;flex:1}

.prop{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-family:var(--mo);font-size:11px;gap:12px;align-items:baseline}
.prop:last-child{border-bottom:none}
.prop .k{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;flex-shrink:0}
.prop .v{color:var(--tx);text-align:right;font-weight:500;word-break:break-word}
.prop .v.am{color:var(--am2)}
.prop .v.pu{color:var(--pu2)}
.prop .v.gr{color:var(--gr2)}
.prop .v.cy{color:var(--cy2)}
.prop .v.rd{color:var(--rd2)}
.prop .v.pk{color:var(--pk2)}

.sec-head{font-family:var(--mo);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);margin:15px 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-head::before{content:'';flex:1;height:1px;background:var(--bd);order:-1}
.sec-head::after{content:'';flex:0 0 8px;height:1px;background:var(--am)}
.sec-head:first-child{margin-top:0}

.btn{padding:7px 13px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);border-radius:3px;font-family:var(--mo);font-size:10.5px;font-weight:500;letter-spacing:.4px;cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel3);border-color:var(--am);color:var(--am2)}
.btn.primary{background:linear-gradient(135deg,var(--am),var(--am3));color:#04061a;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.12);box-shadow:0 4px 22px rgba(255,179,71,.4)}
.btn.pu{background:linear-gradient(135deg,var(--pu),var(--pu3));color:#fff;border-color:transparent;font-weight:600}
.btn.gr{background:linear-gradient(135deg,var(--gr),var(--gr3));color:#04061a;border-color:transparent;font-weight:600}
.btn.cy{background:linear-gradient(135deg,var(--cy),var(--cy3));color:#04061a;border-color:transparent;font-weight:600}
.btn.rd{background:rgba(255,77,61,.15);border-color:var(--rd);color:var(--rd2)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.full{width:100%;justify-content:center}

.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mo);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11.5px;color:var(--am2);letter-spacing:.3px;transition:var(--t)}
.field textarea{resize:vertical;min-height:70px;line-height:1.55;font-family:var(--mo);font-size:11px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--am);box-shadow:0 0 0 3px rgba(255,179,71,.1)}
.field select option{background:#0a0e2e;color:var(--am2)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 13px;background:rgba(10,14,46,.96);border:1px solid var(--bd2);border-left:3px solid var(--am);font-family:var(--mo);font-size:10.5px;color:var(--tx);letter-spacing:.3px;max-width:340px;animation:tin .25s;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:3px}
.toast.pu{border-left-color:var(--pu)}
.toast.gr{border-left-color:var(--gr)}
.toast.rd{border-left-color:var(--rd)}
.toast.cy{border-left-color:var(--cy)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

#boot{position:fixed;inset:0;background:#04061a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9990;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.boot-canvas{width:200px;height:200px;position:relative;margin-bottom:8px}
.boot-canvas svg{width:100%;height:100%}
.boot-canvas svg *{opacity:0;animation:molIn .5s forwards}
.boot-canvas svg *:nth-child(1){animation-delay:.05s}
.boot-canvas svg *:nth-child(2){animation-delay:.15s}
.boot-canvas svg *:nth-child(3){animation-delay:.25s}
.boot-canvas svg *:nth-child(4){animation-delay:.35s}
.boot-canvas svg *:nth-child(5){animation-delay:.45s}
.boot-canvas svg *:nth-child(6){animation-delay:.55s}
.boot-canvas svg *:nth-child(7){animation-delay:.65s}
.boot-canvas svg *:nth-child(8){animation-delay:.75s}
.boot-canvas svg *:nth-child(9){animation-delay:.85s}
.boot-canvas svg *:nth-child(10){animation-delay:.95s}
.boot-canvas svg *:nth-child(11){animation-delay:1.05s}
.boot-canvas svg *:nth-child(12){animation-delay:1.15s}
@keyframes molIn{to{opacity:1}}
.boot-mark{font-family:var(--di);font-size:2.4rem;font-weight:900;letter-spacing:7px;color:var(--am);text-shadow:0 0 40px rgba(255,179,71,.7)}
.boot-sub{font-family:var(--mo);font-size:10px;letter-spacing:4px;color:var(--tx3);text-transform:uppercase}
.boot-bar{width:300px;height:2px;background:var(--panel3);overflow:hidden;border-radius:1px}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--am),var(--pu));transition:width .3s;box-shadow:0 0 12px var(--am)}

.hint{font-family:var(--mo);font-size:10.5px;color:var(--tx3);line-height:1.7;letter-spacing:.3px}
.hint b{color:var(--tx2)}
.kbd{display:inline-block;padding:1px 5px;background:var(--panel3);border:1px solid var(--bd2);border-radius:3px;font-family:var(--mo);font-size:9.5px;color:var(--am2);font-weight:600;margin:0 2px}
.hidden{display:none!important}

@media(max-width:1000px){.nav{width:190px}.info{width:290px}}
@media(max-width:760px){.nav{width:56px}.nav-item span:not(.ico){display:none}.nav-cat-label{display:none}.info{width:240px}}
</style>
</head>
<body>

<div id="bg"></div>

<div id="boot">
  <div class="boot-canvas">
    <svg viewBox="0 0 200 200" fill="none" stroke="#ffb347" stroke-width="1.3">
      <ellipse cx="100" cy="100" rx="60" ry="22" stroke="#8c5cf0" opacity="0.5" transform="rotate(0 100 100)"/>
      <ellipse cx="100" cy="100" rx="60" ry="22" stroke="#8c5cf0" opacity="0.5" transform="rotate(60 100 100)"/>
      <ellipse cx="100" cy="100" rx="60" ry="22" stroke="#8c5cf0" opacity="0.5" transform="rotate(120 100 100)"/>
      <circle cx="100" cy="100" r="12" fill="#ffb347" stroke="none"/>
      <circle cx="100" cy="100" r="20" stroke="#ffb347" opacity="0.3"/>
      <circle cx="160" cy="100" r="6" fill="#4dd0ff" stroke="none"/>
      <circle cx="100" cy="40" r="6" fill="#ff4d3d" stroke="none"/>
      <circle cx="70" cy="130" r="6" fill="#00ff9d" stroke="none"/>
      <circle cx="130" cy="130" r="6" fill="#8c5cf0" stroke="none"/>
      <circle cx="40" cy="100" r="5" fill="#ff4d9d" stroke="none"/>
      <circle cx="100" cy="160" r="5" fill="#ffd080" stroke="none"/>
      <circle cx="100" cy="60" r="4" fill="#80e5ff" stroke="none"/>
      <text x="100" y="196" fill="#ffb347" font-size="9" text-anchor="middle" font-family="monospace" stroke="none">H₂O · 18.015 g/mol</text>
    </svg>
  </div>
  <div class="boot-mark">MOLECULE</div>
  <div class="boot-sub">computational chemistry workbench</div>
  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-sub" id="bootStatus" style="font-size:8px">initializing…</div>
</div>

<div id="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-name">MOLECULE</span>
      <span class="brand-sub">computational chemistry</span>
    </div>
    <div class="div"></div>
    <div class="chip"><span>Z</span><b id="cZ">1</b></div>
    <div class="chip"><span>Atoms</span><b class="pu" id="cAtoms">0</b></div>
    <div class="chip"><span>T</span><b class="cy" id="cTemp">298 K</b></div>
    <div class="chip"><span>Module</span><b id="cModule">Dashboard</b></div>
    <div class="stats">
      <div class="stat"><span class="k">Sim</span><span class="v" id="stSim">idle</span></div>
      <div class="stat"><span class="k">Engine</span><span class="v" id="stEngine">MD/LJ</span></div>
    </div>
  </header>

  <div class="main">
    <aside class="nav" id="nav"></aside>
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="stageContent"></div>
    </section>
    <aside class="info">
      <div class="info-head">
        <div class="info-title" id="infoTitle">Dashboard</div>
        <div class="info-sub" id="infoSub">ready</div>
      </div>
      <div class="info-body" id="infoBody"></div>
    </aside>
  </div>
</div>

<div id="toasts"></div>
<script>
"use strict";
var $=function(i){return document.getElementById(i)};
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c!=null){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(n,d){d=d==null?3:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function expo(n,d){if(n===0)return '0';if(!isFinite(n)||isNaN(n))return '—';d=d==null?3:d;var e=Math.floor(Math.log10(Math.abs(n)));return fmt(n/Math.pow(10,e),d)+'×10'+sup(e)}
function sup(n){var m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};return String(n).split('').map(function(c){return m[c]||c}).join('')}
function sub(n){var m={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','-':'₋'};return String(n).split('').map(function(c){return m[c]||c}).join('')}
function commas(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function toast(msg,kind,dur){dur=dur||2400;var t=el('div',{class:'toast '+(kind||''),text:msg});$('toasts').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove()},320)},dur)}

/* Vector 3D */
function V(x,y,z){return {x:x||0,y:y||0,z:z||0}}
function vAdd(a,b){return V(a.x+b.x,a.y+b.y,a.z+b.z)}
function vSub(a,b){return V(a.x-b.x,a.y-b.y,a.z-b.z)}
function vScale(a,s){return V(a.x*s,a.y*s,a.z*s)}
function vDot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
function vCross(a,b){return V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x)}
function vLen(a){return Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)}
function vNorm(a){var l=vLen(a);return l<1e-15?V(0,0,0):vScale(a,1/l)}
function vDist(a,b){return vLen(vSub(a,b))}

/* Matrix (general) */
var Mat={
  zeros:function(n,m){m=m||n;var A=[];for(var i=0;i<n;i++)A.push(new Float64Array(m));return A},
  identity:function(n){var A=Mat.zeros(n);for(var i=0;i<n;i++)A[i][i]=1;return A},
  clone:function(A){var n=A.length;var B=[];for(var i=0;i<n;i++)B.push(Float64Array.from(A[i]));return B},
  mul:function(A,B){var n=A.length,k=B.length,m=B[0].length;var X=Mat.zeros(n,m);for(var i=0;i<n;i++)for(var p=0;p<k;p++){var a=A[i][p];if(a===0)continue;var Bp=B[p],Xi=X[i];for(var j=0;j<m;j++)Xi[j]+=a*Bp[j]}return X},
  transpose:function(A){var n=A.length,m=A[0].length;var B=Mat.zeros(m,n);for(var i=0;i<n;i++)for(var j=0;j<m;j++)B[j][i]=A[i][j];return B}
};

/* Symmetric eigenvalue via Jacobi rotation */
function jacobiEigen(A,maxIter){
  maxIter=maxIter||100;
  var n=A.length;
  var M=Mat.clone(A);
  var Vm=Mat.identity(n);
  for(var iter=0;iter<maxIter;iter++){
    var off=0;
    for(var i=0;i<n;i++)for(var j=i+1;j<n;j++)off+=M[i][j]*M[i][j];
    if(off<1e-14)break;
    for(var p=0;p<n;p++)for(var q=p+1;q<n;q++){
      if(Math.abs(M[p][q])<1e-15)continue;
      var theta=(M[q][q]-M[p][p])/(2*M[p][q]);
      var t=Math.sign(theta)/(Math.abs(theta)+Math.sqrt(theta*theta+1));
      var c=1/Math.sqrt(t*t+1);
      var s=t*c;
      for(var i2=0;i2<n;i2++){
        var mip=M[i2][p],miq=M[i2][q];
        M[i2][p]=c*mip-s*miq;
        M[i2][q]=s*mip+c*miq;
      }
      for(var j2=0;j2<n;j2++){
        var mpj=M[p][j2],mqj=M[q][j2];
        M[p][j2]=c*mpj-s*mqj;
        M[q][j2]=s*mpj+c*mqj;
      }
      for(var k=0;k<n;k++){
        var vkp=Vm[k][p],vkq=Vm[k][q];
        Vm[k][p]=c*vkp-s*vkq;
        Vm[k][q]=s*vkp+c*vkq;
      }
    }
  }
  var vals=[];for(var i3=0;i3<n;i3++)vals.push(M[i3][i3]);
  return {values:vals,vectors:Vm};
}

/* ODE integrators */
function rk4Vec(f,t,y,dt){
  var n=y.length;
  var k1=f(t,y);
  var y2=new Float64Array(n);for(var i=0;i<n;i++)y2[i]=y[i]+0.5*dt*k1[i];
  var k2=f(t+0.5*dt,y2);

function gammaFn(x){

/* FFT (radix-2) */
function fft(re,im){
  var n=re.length;
  for(var i=1,j=0;i<n;i++){
    var bit=n>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){var t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}
  }
  for(var len=2;len<=n;len<<=1){
    var ang=-2*Math.PI/len;
    var wR=Math.cos(ang),wI=Math.sin(ang);
    for(var i=0;i<n;i+=len){
      var cR=1,cI=0;
      for(var k=0;k<len/2;k++){
        var uR=re[i+k],uI=im[i+k];
        var vR=re[i+k+len/2]*cR-im[i+k+len/2]*cI;
        var vI=re[i+k+len/2]*cI+im[i+k+len/2]*cR;
        re[i+k]=uR+vR;im[i+k]=uI+vI;
        re[i+k+len/2]=uR-vR;im[i+k+len/2]=uI-vI;
        var nR=cR*wR-cI*wI;cI=cR*wI+cI*wR;cR=nR;

/* Color helpers */
function hsl2rgb(h,s,l){
  h=((h%360)+360)%360;
  s=clamp(s,0,1);l=clamp(l,0,1);
  var c=(1-Math.abs(2*l-1))*s;
  var x=c*(1-Math.abs((h/60)%2-1));
  var m=l-c/2;
  var r,g,b;
  if(h<60){r=c;g=x;b=0}
  else if(h<120){r=x;g=c;b=0}
  else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}
  else if(h<300){r=x;g=0;b=c}
  else {r=c;g=0;b=x}
  return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
}

<script>
/* ═══════════════════════════════════════════════════
   MOLECULE · Chemistry algorithms

/* ══════════ Ideal gas law ══════════ */
function idealGas(P,V,n,T){
  /* P·V = n·R·T (any three solve for fourth) */
  if(P==null)return n*CONST.R*T/V;
  if(V==null)return n*CONST.R*T/P;
  if(n==null)return P*V/(CONST.R*T);
  if(T==null)return P*V/(n*CONST.R);
}
/* Van der Waals */
function vanDerWaals(P,V,n,T,a,b){
  return (P+n*n*a/(V*V))*(V-n*b)-n*CONST.R*T;
}
function solveVdW(P,n,T,a,b){
  /* Find V such that VdW = 0 using bisection */
  var lo=n*b*1.001,hi=n*CONST.R*T/P*10;
  for(var i=0;i<100;i++){
    var mid=(lo+hi)/2;
    var f=vanDerWaals(P,mid,n,T,a,b);
    if(f>0)hi=mid;else lo=mid;
  }
  return (lo+hi)/2;
}

/* ══════════ Maxwell-Boltzmann distribution ══════════ */
function maxwellBoltzmann(v,m,T){
  /* f(v) for speed distribution */
  var a=Math.sqrt(m/(2*Math.PI*CONST.kB*T));
  return 4*Math.PI*Math.pow(a,3)*v*v*Math.exp(-m*v*v/(2*CONST.kB*T));
}
function mostProbableSpeed(m,T){return Math.sqrt(2*CONST.kB*T/m)}
function meanSpeed(m,T){return Math.sqrt(8*CONST.kB*T/(Math.PI*m))}
function rmsSpeed(m,T){return Math.sqrt(3*CONST.kB*T/m)}

/* ══════════ Arrhenius ══════════ */
function arrhenius(A,Ea,T){return A*Math.exp(-Ea/(CONST.R*T))}
function arrheniusSolve_T(A,Ea,k){return -Ea/(CONST.R*Math.log(k/A))}

/* ══════════ Michaelis-Menten ══════════ */
function michaelisMenten(S,Vmax,Km){return Vmax*S/(Km+S)}
function lineweaverBurk(S,v){
  /* 1/v = (Km/Vmax)(1/S) + 1/Vmax */
  return {x:1/S,y:1/v};
}
/* Kinetics: A → B first order; A + B → C second order; etc. */
function firstOrder(A0,k,t){return A0*Math.exp(-k*t)}
function secondOrder(A0,B0,k,t){
  if(Math.abs(A0-B0)<1e-6){
    return A0/(1+A0*k*t);
  }
  var ratio=B0*(A0-A0*Math.exp(k*(A0-B0)*t))/(A0-B0*Math.exp(k*(A0-B0)*t));
  return A0*B0*Math.exp(-k*(A0-B0)*t)/(B0-A0*Math.exp(-k*(A0-B0)*t));
}
function halfLife(order,k,A0){
  if(order===1)return Math.log(2)/k;
  if(order===2)return 1/(k*A0);
  return 0;
}

/* ══════════ Lennard-Jones potential ══════════
   V(r) = 4ε[(σ/r)¹² − (σ/r)⁶]
*/
function ljPotential(r,eps,sigma){
  var sr=sigma/r;
  var sr6=Math.pow(sr,6);
  return 4*eps*(sr6*sr6-sr6);
}
function ljForce(r,eps,sigma){
  var sr=sigma/r;
  var sr6=Math.pow(sr,6);
  return 24*eps*(2*sr6*sr6-sr6)/r;
}
function ljMinDistance(sigma){return sigma*Math.pow(2,1/6)}

/* ══════════ Radial distribution function ══════════ */
function computeRDF(positions,boxSize,nBins){
  /* positions: array of {x,y,z} */
  var hist=new Float64Array(nBins);
  var rMax=boxSize/2;
  var dr=rMax/nBins;
  var N=positions.length;
  for(var i=0;i<N;i++){
    for(var j=i+1;j<N;j++){
      var dx=positions[i].x-positions[j].x;
      var dy=positions[i].y-positions[j].y;
      var dz=positions[i].z-positions[j].z;
      /* Minimum image convention */
      dx-=boxSize*Math.round(dx/boxSize);
      dy-=boxSize*Math.round(dy/boxSize);
      dz-=boxSize*Math.round(dz/boxSize);
      var r=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(r<rMax){
        var bin=Math.floor(r/dr);
        if(bin<nBins)hist[bin]+=2;
      }
    }
  }
  /* Normalize: g(r) = hist(r) / (N·ρ·4πr²dr) */
  var rho=N/(boxSize*boxSize*boxSize);
  var g=new Float64Array(nBins);
  for(var k=0;k<nBins;k++){
    var rMid=(k+0.5)*dr;
    var Vshell=4*Math.PI*rMid*rMid*dr;
    var ideal=N*rho*Vshell;
    g[k]=ideal>0?hist[k]/ideal:0;
  }
  return {g:g,dr:dr,rMax:rMax};
}

/* ══════════ MD engine with LJ potential ══════════ */
function initializeMDFluid(N,boxSize){
  var positions=[];
  /* Simple cubic lattice */
  var nSide=Math.ceil(Math.pow(N,1/3));
  var spacing=boxSize/nSide;
  for(var i=0;i<N;i++){
    var x=(i%nSide+0.5)*spacing;
    var y=(Math.floor(i/nSide)%nSide+0.5)*spacing;
    var z=(Math.floor(i/(nSide*nSide))+0.5)*spacing;
    positions.push(V(x,y,z));
  }
  var velocities=[];
  for(var j=0;j<N;j++){
    velocities.push(V(rnd(-1,1),rnd(-1,1),rnd(-1,1)));
  }
  return {pos:positions,vel:velocities,boxSize:boxSize,N:N};
}
function mdForces(positions,boxSize,eps,sigma,cutoff){
  var N=positions.length;
  var forces=[];
  for(var i=0;i<N;i++)forces.push(V(0,0,0));
  var PE=0;
  for(var i=0;i<N;i++){
    for(var j=i+1;j<N;j++){
      var dx=positions[i].x-positions[j].x;
      var dy=positions[i].y-positions[j].y;
      var dz=positions[i].z-positions[j].z;
      dx-=boxSize*Math.round(dx/boxSize);
      dy-=boxSize*Math.round(dy/boxSize);
      dz-=boxSize*Math.round(dz/boxSize);
      var r2=dx*dx+dy*dy+dz*dz;
      var r=Math.sqrt(r2);
      if(r<cutoff&&r>1e-10){
        var f=ljForce(r,eps,sigma);
        var fx=f*dx/r,fy=f*dy/r,fz=f*dz/r;
        forces[i].x+=fx;forces[i].y+=fy;forces[i].z+=fz;
        forces[j].x-=fx;forces[j].y-=fy;forces[j].z-=fz;
        PE+=ljPotential(r,eps,sigma);
      }
    }
  }
  return {forces:forces,PE:PE};
}
function mdStep(state,dt,eps,sigma,cutoff){
  var F0=mdForces(state.pos,state.boxSize,eps,sigma,cutoff);
  var newPos=[];
  for(var i=0;i<state.N;i++){
    newPos.push(V(
      state.pos[i].x+state.vel[i].x*dt+0.5*F0.forces[i].x*dt*dt,
      state.pos[i].y+state.vel[i].y*dt+0.5*F0.forces[i].y*dt*dt,
      state.pos[i].z+state.vel[i].z*dt+0.5*F0.forces[i].z*dt*dt
    ));
  }
  /* PBC */
  for(var i=0;i<state.N;i++){
    newPos[i].x=((newPos[i].x%state.boxSize)+state.boxSize)%state.boxSize;
    newPos[i].y=((newPos[i].y%state.boxSize)+state.boxSize)%state.boxSize;
    newPos[i].z=((newPos[i].z%state.boxSize)+state.boxSize)%state.boxSize;
  }
  var F1=mdForces(newPos,state.boxSize,eps,sigma,cutoff);
  var newVel=[];
  for(var j=0;j<state.N;j++){
    newVel.push(V(
      state.vel[j].x+0.5*(F0.forces[j].x+F1.forces[j].x)*dt,
      state.vel[j].y+0.5*(F0.forces[j].y+F1.forces[j].y)*dt,
      state.vel[j].z+0.5*(F0.forces[j].z+F1.forces[j].z)*dt
    ));
  }
  var KE=0;
  for(var k=0;k<state.N;k++){
    KE+=0.5*(newVel[k].x*newVel[k].x+newVel[k].y*newVel[k].y+newVel[k].z*newVel[k].z);
  }
  return {pos:newPos,vel:newVel,KE:KE,PE:F1.PE,boxSize:state.boxSize,N:state.N};
}

/* ══════════ Velocity autocorrelation function ══════════ */
function vacf(vHistory){
  var n=vHistory.length;
  if(n<2)return [];
  var v0=vHistory[0];
  var out=[];
  for(var lag=0;lag<Math.floor(n/2);lag++){
    var sum=0,count=0;
    for(var t=0;t+lag<n;t++){
      var a=vHistory[t],b=vHistory[t+lag];
      sum+=a.x*b.x+a.y*b.y+a.z*b.z;
      count++;
    }
    out.push(count?sum/count:0);
  }
  return out;
}

/* ══════════ Hückel MO for π systems ══════════
   Builds Hückel Hamiltonian for a linear polyene (N carbons)
   H_ii = α, H_ij = β for bonded neighbors
*/
function huckelLinearPolyene(nC){
  var H=Mat.zeros(nC);
  for(var i=0;i<nC;i++){
    H[i][i]=HUCKEL.alpha;
    if(i<nC-1){
      H[i][i+1]=HUCKEL.beta;
      H[i+1][i]=HUCKEL.beta;
    }
  }
  return H;
}
function huckelCyclic(nC){
  var H=Mat.zeros(nC);
  for(var i=0;i<nC;i++){
    H[i][i]=HUCKEL.alpha;
    H[i][(i+1)%nC]=HUCKEL.beta;
    H[(i+1)%nC][i]=HUCKEL.beta;
  }
  return H;
}
function huckelCustom(bonds,nC,hetero){
  var H=Mat.zeros(nC);
  for(var i=0;i<nC;i++){
    var shift=0;
    if(hetero&&hetero[i])shift=HUCKEL.hetero[hetero[i]].alphaShift||0;
    H[i][i]=HUCKEL.alpha+shift;
  }
  bonds.forEach(function(b){
    var scale=1;
    if(hetero&&(hetero[b[0]]||hetero[b[1]])){
      scale=HUCKEL.hetero[hetero[b[0]]||hetero[b[1]]].betaScale||1;
    }
    H[b[0]][b[1]]=HUCKEL.beta*scale;
    H[b[1]][b[0]]=HUCKEL.beta*scale;
  });
  return H;
}
function solveHuckel(nC){
  /* Solve for linear polyene by diagonalization */
  var H=huckelLinearPolyene(nC);
  var eig=jacobiEigen(H,200);
  var vals=eig.values.slice().sort(function(a,b){return a-b});
  return vals;
}

/* ══════════ Particle in a box (1D) ══════════ */
function particleInBox(n,L,m){
  /* E_n = n²h²/(8mL²) */
  m=m||CONST.me;
  return n*n*CONST.h*CONST.h/(8*m*L*L);
}
/* Particle in a 3D box */
function particleInBox3D(nx,ny,nz,Lx,Ly,Lz,m){
  m=m||CONST.me;
  var c=CONST.h*CONST.h/(8*m);
  return c*(nx*nx/(Lx*Lx)+ny*ny/(Ly*Ly)+nz*nz/(Lz*Lz));
}

/* ══════════ Harmonic oscillator ══════════ */
function harmonicEnergy(n,omega){
  /* E_n = ℏω(n + 1/2) */
  return CONST.hbar*omega*(n+0.5);
}
function harmonicWavefunction(n,x,alpha){
  /* ψ_n(x) = (1/√(2ⁿ n!))·(α/π)^(1/4)·H_n(αx)·exp(−α²x²/2) */
  var Hn=hermite(n,alpha*x);
  var norm=Math.pow(alpha/Math.PI,0.25)/Math.sqrt(Math.pow(2,n)*factorial(n));
  return norm*Hn*Math.exp(-alpha*alpha*x*x/2);
}
function hermite(n,x){
  if(n===0)return 1;
  if(n===1)return 2*x;
  var H0=1,H1=2*x;
  for(var k=2;k<=n;k++){
    var Hn=2*x*H1-2*(k-1)*H0;
    H0=H1;H1=Hn;
  }
  return H1;
}
function factorial(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r}

/* ══════════ Hydrogen radial wavefunction ══════════ */
function hydrogenRadial(n,l,r){
  /* R_nl(r) for hydrogen atom (a0 units) */
  var a0=1; /* in Bohr radii */
  var rho=2*r/(n*a0);
  var norm=Math.sqrt(Math.pow(2/n,3)*factorial(n-l-1)/(2*n*factorial(n+l)));
  var L=associatedLaguerre(n-l-1,2*l+1,rho);
  return norm*Math.exp(-rho/2)*Math.pow(rho,l)*L;
}
function associatedLaguerre(k,alpha,x){
  /* L_k^α(x) via recurrence */
  if(k===0)return 1;
  if(k===1)return 1+alpha-x;
  var L0=1,L1=1+alpha-x;
  for(var i=2;i<=k;i++){
    var Li=((2*i-1+alpha-x)*L1-(i-1+alpha)*L0)/i;
    L0=L1;L1=Li;
  }
  return L1;
}
function hydrogenEnergy(n){return -13.6/(n*n)} /* eV */

/* ══════════ VSEPR molecular geometry ══════════ */
function vseprGeometry(bondPairs,lonePairs){
  for(var i=0;i<VSEPR.length;i++){
    if(VSEPR[i].bp===bondPairs&&VSEPR[i].lp===lonePairs)return VSEPR[i];
  }
  return null;
}

/* ══════════ Crystal lattice builder ══════════ */
function buildCrystal(type,n,a){
  /* Returns atomic positions in unit cell coordinates (0-1) */
  var positions=[];
  var basis;
  if(type==='sc'){
    basis=[[0,0,0]];
  } else if(type==='bcc'){
    basis=[[0,0,0],[0.5,0.5,0.5]];
  } else if(type==='fcc'){
    basis=[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]];
  } else if(type==='hcp'){
    basis=[[0,0,0],[1/3,2/3,0.5]];
  } else if(type==='diamond'){
    basis=[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5],
           [0.25,0.25,0.25],[0.75,0.75,0.25],[0.75,0.25,0.75],[0.25,0.75,0.75]];
  } else if(type==='nacl'){
    basis=[
      [0,0,0,'Na'],[0.5,0.5,0,'Na'],[0.5,0,0.5,'Na'],[0,0.5,0.5,'Na'],
      [0.5,0,0,'Cl'],[0,0.5,0,'Cl'],[0,0,0.5,'Cl'],[0.5,0.5,0.5,'Cl']
    ];
  } else if(type==='cscl'){
    basis=[[0,0,0,'Cs'],[0.5,0.5,0.5,'Cl']];
  }
  for(var i=0;i<n;i++){
    for(var j=0;j<n;j++){
      for(var k=0;k<n;k++){
        basis.forEach(function(b){
          positions.push({
            x:(i+b[0])*a,
            y:(j+b[1])*a,
            z:(k+b[2])*a,
            type:b.length>3?b[3]:'atom'
          });
        });
      }
    }
  }
  return positions;
}

/* ══════════ NMR simulation ══════════ */
function simulateNMRSpectrum(shifts,width,range){
  /* shifts: array of {ppm, mult, nH} */
  /* Generate Lorentzian lines */
  var spectrum=[];
  var nPoints=1000;
  var ppmMin=range[0],ppmMax=range[1];
  for(var i=0;i<nPoints;i++){
    var ppm=ppmMax-(ppmMax-ppmMin)*i/nPoints;
    var inten=0;
    shifts.forEach(function(s){
      /* Multiplicity from Pascal's triangle */
      var mult=s.mult||1;
      var peaks=multplicityPattern(mult);
      var hzWidth=width;
      var ppmWidth=hzWidth/400; /* approximate at 400 MHz */
      peaks.forEach(function(pk){
        var nPeaks=peaks.length;
        for(var k=0;k<nPeaks;k++){
          var offset=(k-(nPeaks-1)/2)*ppmWidth*3;
          var d=ppm-(s.ppm+offset);
          inten+=s.nH*(peaks[k])*(ppmWidth/2)/(d*d+(ppmWidth/2)*(ppmWidth/2));
        }
      });
    });
    spectrum.push({ppm:ppm,intensity:inten});
  }
  return spectrum;
}
function multplicityPattern(n){
  /* Pascal's triangle row n-1 */
  if(n<=1)return [1];
  var prev=[1];
  for(var i=1;i<n;i++){
    var next=[1];
    for(var j=0;j<prev.length-1;j++)next.push(prev[j]+prev[j+1]);
    next.push(1);
    prev=next;
  }
  return prev;
}

/* ══════════ IR spectrum from groups ══════════ */
function simulateIRSpectrum(groups){
  var spectrum=[];
  var nPoints=1000;
  for(var i=0;i<nPoints;i++){
    var wavenumber=4000-3600*i/nPoints;
    var absorb=0;
    groups.forEach(function(g){
      var mid=(g.range[0]+g.range[1])/2;
      var width=Math.abs(g.range[1]-g.range[0])/2+20;
      var d=wavenumber-mid;
      absorb+=g.strength*Math.exp(-d*d/(2*width*width));
    });
    spectrum.push({wavenumber:wavenumber,absorbance:absorb});
  }
  return spectrum;
}

/* ══════════ Mass spec fragmentation ══════════ */
function massSpecFragments(formula){
  /* Simple heuristic: break C-C bonds, lose H, lose small groups */
  var mass=0;
  /* Parse formula: assume CnHmOoNn */
  var mC=formula.match(/C(\d*)/);var mH=formula.match(/H(\d*)/);
  var mO=formula.match(/O(\d*)/);var mN=formula.match(/N(\d*)/);
  var nC=mC?(parseInt(mC[1])||1):0;
  var nH=mH?(parseInt(mH[1])||1):0;
  var nO=mO?(parseInt(mO[1])||1):0;
  var nN=mN?(parseInt(mN[1])||1):0;
  mass=nC*12+nH*1.00783+nO*15.9949+nN*14.0031;
  var fragments=[{formula:formula,mass:mass,relative:100}];
  /* Loses CH3, H, etc */
  if(nC>1)fragments.push({formula:'M-CH₃',mass:mass-15,relative:rnd(5,30)});
  if(nH>2)fragments.push({formula:'M-H',mass:mass-1,relative:rnd(3,15)});
  if(nO>0)fragments.push({formula:'M-OH',mass:mass-17,relative:rnd(5,25)});
  if(nO>1)fragments.push({formula:'M-H₂O',mass:mass-18,relative:rnd(10,40)});
  return fragments;
}

/* ══════════ Thermodynamic cycle (Carnot, Otto, etc.) ══════════ */
function carnotCycle(Th,Tc){
  var eff=1-Tc/Th;
  return {efficiency:eff,workRatio:eff};
}
function ottoCycle(r,gamma){
  /* r = compression ratio */
  return 1-1/Math.pow(r,gamma-1);
}
function dieselCycle(r,rc,gamma){
  var num=Math.pow(r,gamma-1)*(gamma*(rc-1));
  var den=gamma*rc-1;
  return 1-num/den;
}

/* ══════════ Chemical equilibrium ══════════ */
function equilibrium(constants,initial){
  /* Simple: for A ⇌ B with K, solve equilibrium */
  /* constants: {K}, initial: {A, B} */
  var K=constants.K;
  var A=initial.A||0,B=initial.B||0;
  /* A - x = concentration of A at eq */
  /* (B+x)/(A-x) = K → x = (KA - B)/(K+1) */
  var x=(K*A-B)/(K+1);
  if(x<0)x=0;
  return {A_eq:A-x,B_eq:B+x,x:x};
}
function dGFromK(K,T){
  T=T||CONST.Tstd;
  return -CONST.R*T*Math.log(K);
}
function kFromDG(dG,T){
  T=T||CONST.Tstd;
  return Math.exp(-dG/(CONST.R*T));
}

/* ══════════ Nernst equation ══════════ */
function nernst(E0,n,Q,T){
  T=T||CONST.Tstd;
  return E0-(CONST.R*T)/(n*CONST.F)*Math.log(Q);
}
function cellEMF(Ecathode,Eanode){
  return Ecathode-Eanode;
}

/* ══════════ pH and buffers ══════════ */
function pH(concH){return -Math.log10(concH)}
function hendersonHasselbalch(pKa,base,acid){
  return pKa+Math.log10(base/acid);
}
function acidDissociation(Ka,C){
  /* Solve for [H+] in weak acid */
  var a=1,b=Ka,c=-Ka*C;
  return (-b+Math.sqrt(b*b-4*a*c))/(2*a);
}

/* ══════════ Boltzmann distribution ══════════ */
function boltzmann(E1,E2,T){
  /* Ratio of populations n2/n1 */
  return Math.exp(-(E2-E1)/(CONST.kB*T));
}
function partitionFunction(energies,T){
  var Z=0;
  for(var i=0;i<energies.length;i++)Z+=Math.exp(-energies[i]/(CONST.kB*T));
  return Z;
}

/* ══════════ Bragg diffraction ══════════ */
function braggAngle(n,lambda,d){
  /* n·λ = 2d·sin(θ) */
  var s=n*lambda/(2*d);
  if(s>1)return null;
  return Math.asin(s);
}
function dSpacing(crystal,h,k,l,a){
  if(crystal==='sc'||crystal==='bcc')return a/Math.sqrt(h*h+k*k+l*l);
  if(crystal==='fcc')return a/Math.sqrt(h*h+k*k+l*l);
  if(crystal==='hcp')return 0;
  return a/Math.sqrt(h*h+k*k+l*l);
}

/* ══════════ Raman/Raman vs IR selection rules ══════════ */
function irActive(symmetry){return symmetry!=='centrosymmetric'||false}
function ramanActive(symmetry){return true}

/* ══════════ UV-Vis electronic transitions ══════════ */
function uvVisTransition(lambda){return CONST.h*CONST.c/lambda}
function uvVisFromEnergy(dE){return CONST.h*CONST.c/dE}

/* ══════════ Conformational analysis: Newman projection ══════════ */
function newmanProjection(dihedral){
  /* Return relative energies for syn (0°), gauche (60°), anti (180°) */
  /* Approximate potential: V = V0 + V1(1+cosφ) + V2(1-cos2φ) + V3(1+cos3φ) */
  var V1=0.5,V2=2.0,V3=2.5;
  return V1*(1+Math.cos(dihedral*Math.PI/180))+V2*(1-Math.cos(2*dihedral*Math.PI/180))+V3*(1+Math.cos(3*dihedral*Math.PI/180));
}

/* ══════════ Ramachandran-like plot for dihedral scan ══════════ */
function ramachandranEnergy(phi,psi){
  /* Very simplified empirical: minima at (−60,−45) and (−120,130) */
  var e1=Math.exp(-(Math.pow(phi+60,2)/900+Math.pow(psi+45,2)/900));
  var e2=Math.exp(-(Math.pow(phi+120,2)/900+Math.pow(psi-130,2)/900));
  return -e1-e2+0.5;
}

    /* Handle lanthanides/actinides row offsets */
    var dispRow=period,dispCol=group;
    if(period===6&&group===3){return} /* skip La in main */
    if(period===7&&group===3){return}
    if(cat==='ln'){dispRow=10;dispCol=Z-57+3}
    if(cat==='an'){dispRow=11;dispCol=Z-89+3}
    var x=padL+(dispCol-1)*cw;
    var y=padT+(dispRow-1)*ch;
    var color=CAT_COLORS[cat];
    var isCurrent=Z===S.sim.currentZ;
    var isHover=hover===Z;
    /* Cell */
    S.ctx.fillStyle=isCurrent?color+'40':(isHover?color+'20':color+'12');
    S.ctx.fillRect(x+1,y+1,cw-2,ch-2);
    S.ctx.strokeStyle=isCurrent||isHover?color:color+'60';
    S.ctx.lineWidth=isCurrent?2:1;
    S.ctx.strokeRect(x+1.5,y+1.5,cw-3,ch-3);
    /* Text */
    S.ctx.fillStyle=color;
    S.ctx.font='700 '+Math.round(cw*0.32)+'px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(sym,x+cw/2,y+ch*0.45);
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='8px "JetBrains Mono",monospace';
    S.ctx.fillText(Z,x+cw*0.2,y+ch*0.25);
    S.ctx.fillText(fmt(mass,1),x+cw/2,y+ch*0.75);
    S.ctx.font='7px "JetBrains Mono",monospace';
    S.ctx.fillText(name.substring(0,6),x+cw/2,y+ch*0.92);
    /* Store cell for hit testing */
    S.sim.ptCells.push({x:x,y:y,w:cw,h:ch,Z:Z});
  });
  /* Current element info */
  var el=getElement(S.sim.currentZ);
  if(el){
    var infoX=S.W-320;
    S.ctx.fillStyle='rgba(10,14,46,.95)';
    S.ctx.fillRect(infoX,S.H-180,310,170);
    S.ctx.strokeStyle=CAT_COLORS[el[4]];
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(infoX+.5,S.H-179.5,309,169);
    S.ctx.fillStyle=CAT_COLORS[el[4]];
    S.ctx.font='900 48px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(el[1],infoX+20,S.H-120);
    S.ctx.fillStyle='#d0c8e8';
    S.ctx.font='700 14px "JetBrains Mono",monospace';
    S.ctx.fillText(el[2],infoX+110,S.H-135);
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('Z='+el[0]+'  ·  '+fmt(el[3],3)+' g/mol',infoX+110,S.H-115);
    S.ctx.fillText('Group '+el[6]+' · Period '+el[5],infoX+110,S.H-100);
    S.ctx.fillText('Radius '+el[7]+' pm  ·  EN '+fmt(el[9],2),infoX+110,S.H-85);
    S.ctx.fillText('IE '+fmt(el[8],2)+' eV',infoX+110,S.H-70);
    S.ctx.fillText('mp '+fmt(el[10],1)+' K  ·  bp '+fmt(el[11],1)+' K',infoX+110,S.H-55);
    S.ctx.fillText('ρ '+fmt(el[12],3)+' g/cm³',infoX+110,S.H-40);
  }
  /* Legend */
  S.ctx.fillStyle='#8888b0';
  S.ctx.font='9px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Click element to select',padL,S.H-30);
  var legendX=200;
  var legends=[['nm','Nonmetal'],['ng','Noble gas'],['am','Alkali'],['ae','Alkaline'],['tm','Transition'],['pt','Post-trans'],['ml','Metalloid'],['ln','Lanthanide'],['an','Actinide']];
  legends.forEach(function(l){
    S.ctx.fillStyle=CAT_COLORS[l[0]];
    S.ctx.fillRect(legendX,S.H-36,8,8);
    S.ctx.fillStyle='#8888b0';
    S.ctx.fillText(l[1],legendX+12,S.H-29);
    legendX+=85;
  });
  $('cZ').textContent=S.sim.currentZ;
};

/* ══════════════ Atomic Properties ══════════════ */
R.atomprops=function(dt){

  headline('Atomic Properties','periodic trends');
  if(!S.sim.atomProp){S.sim.atomProp={property:'radius'}}
  var props={
    radius:{label:'Atomic radius (pm)',key:7,color:'#ffb347'},
    ie:{label:'Ionization energy (eV)',key:8,color:'#ff4d3d'},
    en:{label:'Electronegativity (Pauling)',key:9,color:'#8c5cf0'},
    mass:{label:'Atomic mass (u)',key:3,color:'#4dd0ff'},
    mp:{label:'Melting point (K)',key:10,color:'#00ff9d'},
    bp:{label:'Boiling point (K)',key:11,color:'#ff4d9d'},
    density:{label:'Density (g/cm³)',key:12,color:'#80e5ff'}
  };
  var prop=props[S.sim.atomProp.property];
  /* Plot across Z=1 to 86 */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-80;
  axes(padL,padT,plotW,plotH,'atomic number Z',prop.label);
  var maxV=0;
  var pts=[];
  for(var i=0;i<86;i++){
    var el=ELEMENTS[i];
    var v=el[prop.key];
    if(v>0&&v>maxV)maxV=v;
    pts.push({Z:el[0],v:v,el:el});
  }
  /* Draw bars */
  var barW=plotW/86;
  pts.forEach(function(p,i){
    if(p.v<=0)return;
    var x=padL+i*barW;
    var h=(p.v/maxV)*plotH;
    var y=padT+plotH-h;
    var cat=p.el[4];
    S.ctx.fillStyle=CAT_COLORS[cat];
    S.ctx.globalAlpha=0.7;
    S.ctx.fillRect(x+1,y,barW-2,h);
    S.ctx.globalAlpha=1;
  });
  /* Label axes */
  S.ctx.fillStyle=prop.color;
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText(prop.label.toUpperCase(),padL,padT-20);
  /* Max value */
  S.ctx.fillStyle='#8888b0';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='right';
  S.ctx.fillText('max: '+fmt(maxV,3),padL+plotW,padT-5);
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,160);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,159);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('PERIODIC TRENDS',infoX+15,100);
  var rows=[
    ['Property',prop.label],
    ['Z range','1-86'],
    ['Max value',fmt(maxV,3)],
    ['Trend across period','↑ left to right'],
    ['Trend down group','↓ top to bottom'],
    ['Exceptions','Transition metals']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';

};

/* ══════════════ Isotopes ══════════════ */
R.isotopes=function(dt){
  clear();
  headline('Isotopes & Mass Spec','isotopic patterns');
  if(!S.sim.isotope){S.sim.isotope={formula:'C6H6'}}
  var formula=S.sim.isotope.formula;
  /* Common isotopes */
  var isotopes={
    'H':[{name:'¹H',mass:1.00783,abund:0.999885},{name:'²H',mass:2.01410,abund:0.000115}],
    'C':[{name:'¹²C',mass:12.0000,abund:0.9893},{name:'¹³C',mass:13.00335,abund:0.0107}],
    'N':[{name:'¹⁴N',mass:14.00307,abund:0.99636},{name:'¹⁵N',mass:15.00011,abund:0.00364}],
    'O':[{name:'¹⁶O',mass:15.99491,abund:0.99757},{name:'¹⁷O',mass:16.99913,abund:0.00038},{name:'¹⁸O',mass:17.99916,abund:0.00205}],
    'S':[{name:'³²S',mass:31.97207,abund:0.9499},{name:'³³S',mass:32.97146,abund:0.0075},{name:'³⁴S',mass:33.96787,abund:0.0425},{name:'³⁶S',mass:35.96708,abund:0.0001}],
    'Cl':[{name:'³⁵Cl',mass:34.96885,abund:0.7576},{name:'³⁷Cl',mass:36.96590,abund:0.2424}],
    'Br':[{name:'⁷⁹Br',mass:78.91834,abund:0.5069},{name:'⁸¹Br',mass:80.91629,abund:0.4931}],
    'F':[{name:'¹⁹F',mass:18.99840,abund:1.0}],
    'P':[{name:'³¹P',mass:30.97376,abund:1.0}],
    'I':[{name:'¹²⁷I',mass:126.90447,abund:1.0}],
    'Na':[{name:'²³Na',mass:22.98977,abund:1.0}],
    'K':[{name:'³⁹K',mass:38.96371,abund:0.9326},{name:'⁴¹K',mass:40.96183,abund:0.0673}]
  };
  /* Parse formula */
  var composition={};
  var re=/([A-Z][a-z]?)(\d*)/g;
  var m;
  while((m=re.exec(formula))!==null){
    var sym=m[1];
    var count=parseInt(m[2])||1;
    composition[sym]=(composition[sym]||0)+count;
  }
  /* Compute monoisotopic mass and isotope pattern */
  var nominalMass=0;
  var isotopeDist={};
  /* Monoisotopic uses most abundant isotope for each element */
  Object.keys(composition).forEach(function(sym){
    if(!isotopes[sym])return;
    var iso=isotopes[sym].reduce(function(mx,i){return i.abund>(mx.abund||0)?i:mx},isotopes[sym][0]);
    nominalMass+=iso.mass*composition[sym];
  });
  /* Compute M+1, M+2 contributions */
  var M1Contrib=0;
  var M2Contrib=0;
  Object.keys(composition).forEach(function(sym){
    if(!isotopes[sym])return;
    var n=composition[sym];
    var major=isotopes[sym].reduce(function(mx,i){return i.abund>(mx.abund||0)?i:mx},isotopes[sym][0]);
    /* M+1: probability of one heavy isotope (usually +1 amu) */
    isotopes[sym].forEach(function(i){
      if(i===major)return;
      if(Math.abs(i.mass-major.mass-1)<0.1){
        M1Contrib+=n*i.abund/major.abund;
      } else if(Math.abs(i.mass-major.mass-2)<0.1){
        M2Contrib+=n*i.abund/major.abund;
      }
    });
  });
  /* Plot mass spectrum */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'m/z','relative abundance');
  /* Bars */
  var peaks=[
    {mz:nominalMass-1,inten:0.02,label:'M-1'},
    {mz:nominalMass,inten:1.0,label:'M'},
    {mz:nominalMass+1,inten:M1Contrib,label:'M+1'},
    {mz:nominalMass+2,inten:M2Contrib,label:'M+2'}
  ];
  var maxMass=nominalMass+4;
  var minMass=nominalMass-3;
  var massRange=maxMass-minMass;
  peaks.forEach(function(p){
    var x=padL+((p.mz-minMass)/massRange)*plotW;
    var h=p.inten*plotH*0.9;
    S.ctx.fillStyle=p.label==='M'?'#ffb347':'#8c5cf0';
    S.ctx.fillRect(x-4,padT+plotH-h,8,h);
    S.ctx.fillStyle='#d0c8e8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(p.label,x,padT+plotH-h-5);
    S.ctx.fillText(fmt(p.mz,1),x,padT+plotH+15);
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#b088ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ISOTOPE ANALYSIS',infoX+15,100);
  var rows=[
    ['Formula',formula],
    ['Monoisotopic mass',fmt(nominalMass,4)+' u'],
    ['Nominal mass',Math.round(nominalMass)+' Da'],
    ['M+1 contribution',fmt(M1Contrib*100,2)+'%'],
    ['M+2 contribution',fmt(M2Contrib*100,3)+'%'],
    ['Elements',Object.keys(composition).length]
  ];
  Object.keys(composition).forEach(function(sym){
    rows.push(['  '+sym+' count',composition[sym]]);
  });
  rows.forEach(function(r,i){
    if(i*22+130>S.H-60)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*20);
    S.ctx.fillStyle='#b088ff';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*20);
    S.ctx.textAlign='left';
  });
  $('cZ').textContent=formula;
};
</script>
<script>
/* ══════════════ Hückel MO ══════════════ */
R.huckel=function(dt){
  clear();
  headline('Hückel Molecular Orbital Theory','π-electron systems');
  if(!S.sim.huckel){S.sim.huckel={n:6,cyclic:true}}
  var h=S.sim.huckel;
  var H=h.cyclic?huckelCyclic(h.n):huckelLinearPolyene(h.n);
  var eig=jacobiEigen(H,300);
  var energies=eig.values.slice().sort(function(a,b){return a-b});
  /* Energy levels */
  var padL=200,padT=140;
  var energyScale=(S.H-padT-120)/4;
  /* Fill π electrons */
  var nElec=h.n;
  var occ=[];
  for(var i=0;i<Math.floor(nElec/2);i++)occ.push(i);
  /* Draw levels */
  energies.forEach(function(e,i){
    var y=padT+(e-HUCKEL.alpha)/Math.abs(HUCKEL.beta)*(energyScale/2)-energyScale*0.5;
    var yMid=padT+(S.H-padT-120)/2;
    var y2=yMid+e/Math.abs(HUCKEL.beta)*energyScale*0.5;
    var isOcc=i<Math.floor(nElec/2);
    /* Energy level */
    S.ctx.strokeStyle=isOcc?'#ffb347':'#4a4a88';
    S.ctx.lineWidth=isOcc?3:1.5;
    var x0=padL+60;
    S.ctx.beginPath();
    S.ctx.moveTo(x0,y2);
    S.ctx.lineTo(x0+150,y2);
    S.ctx.stroke();
    /* Electrons */
    if(isOcc){
      S.ctx.fillStyle='#ffd080';
      S.ctx.beginPath();S.ctx.arc(x0+70,y2-8,4,0,Math.PI*2);S.ctx.fill();
      S.ctx.beginPath();S.ctx.arc(x0+80,y2-8,4,0,Math.PI*2);S.ctx.fill();
    }
    /* Label */
    S.ctx.fillStyle=isOcc?'#ffd080':'#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText('E'+i,x0-10,y2+4);
    S.ctx.textAlign='left';
    S.ctx.fillText(fmt(e,3)+'β',x0+160,y2+4);
  });
  /* Total π energy */
  var totalE=0;
  for(var i=0;i<occ.length;i++)totalE+=2*energies[occ[i]];
  /* Delocalization energy */
  var delocE=totalE-h.n*HUCKEL.beta;
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,280);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,279);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('HÜCKEL RESULTS',infoX+15,100);
  var rows=[
    ['System',h.n+'-atom '+(h.cyclic?'cyclic':'linear')],
    ['π electrons',h.n],
    ['Occupied MOs',occ.length],
    ['Total π E',fmt(totalE,3)+' β'],
    ['Reference (isolated)',fmt(h.n*HUCKEL.beta,3)+' β'],
    ['Delocalization E',fmt(delocE,3)+' β'],
    ['HOMO-LUMO gap',fmt(Math.abs(energies[occ.length]-energies[occ.length-1]),3)+' β'],
    ['Aromatic?',(h.n===4*Math.floor(h.n/4)+2&&h.cyclic)?'YES (Hückel 4n+2)':'No']
  ];
  energies.forEach(function(e,i){
    if(i>=6)return;
    rows.push(['  MO '+i, fmt(e,3)+' β']);
  });
  rows.forEach(function(r,i){
    if(i*20+130>S.H-60)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*20);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*20);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Particle in Box ══════════════ */
R.box=function(dt){
  clear();
  headline('Particle in a Box','quantum confinement');
  if(!S.sim.box){S.sim.box={L:1e-9,nMax:5,mass:'e'}}
  var b=S.sim.box;
  var m=b.mass==='e'?CONST.me:CONST.mp;
  /* Energy levels */
  var padL=100,padT=140;
  var maxE=particleInBox(b.nMax,b.L,m);
  var energyScale=(S.H-padT-120)/maxE;
  for(var n=1;n<=b.nMax;n++){
    var En=particleInBox(n,b.L,m);
    var y=padT+(S.H-padT-120)-En*energyScale;
    S.ctx.strokeStyle='#8c5cf0';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    S.ctx.moveTo(padL,y);
    S.ctx.lineTo(padL+200,y);
    S.ctx.stroke();
    /* Wavefunction */
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    for(var x=0;x<=200;x++){
      var xx=x/200*b.L;
      var psi=Math.sqrt(2/b.L)*Math.sin(n*Math.PI*xx/b.L);
      var py=y-psi*40/b.L*1e10;
      if(x===0)S.ctx.moveTo(padL+x,py);
      else S.ctx.lineTo(padL+x,py);
    }
    S.ctx.stroke();
    /* Label */
    S.ctx.fillStyle='#b088ff';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText('n='+n,padL-10,y+4);
    S.ctx.textAlign='left';
    S.ctx.fillText(expo(En/CONST.eV,3)+' eV',padL+210,y+4);
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#b088ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('QUANTUM CONFINEMENT',infoX+15,100);
  var E1=particleInBox(1,b.L,m);
  var rows=[
    ['Box length',expo(b.L,2)+' m'],
    ['Particle',b.mass==='e'?'electron':'proton'],
    ['E₁ (n=1)',expo(E1/CONST.eV,4)+' eV'],
    ['E₂ (n=2)',expo(particleInBox(2,b.L,m)/CONST.eV,4)+' eV'],
    ['E₂/E₁','4 (n² scaling)'],
    ['Gap E₂−E₁',expo((particleInBox(2,b.L,m)-E1)/CONST.eV,4)+' eV'],
    ['Wavelength λ₁',expo(2*b.L,3)+' m'],
    ['Nodes (n state)',(b.nMax-1)]
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#b088ff';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Harmonic Oscillator ══════════════ */
R.harmonic=function(dt){
  clear();
  headline('Harmonic Oscillator','vibrational energy levels');
  if(!S.sim.harm){S.sim.harm={omega:1e14,nMax:5}}
  var h=S.sim.harm;
  /* Plot potential and levels */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'x (Bohr)','energy (ℏω)');
  /* Parabola V = x²/2 */
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var x=-5+10*i/100;
    var V=x*x/2;
    var py=padT+plotH-V*plotH/13;
    if(i===0)S.ctx.moveTo(padL+i/100*plotW,py);
    else S.ctx.lineTo(padL+i/100*plotW,py);
  }
  S.ctx.stroke();
  /* Energy levels */
  for(var n=0;n<=h.nMax;n++){
    var En=n+0.5;
    var y=padT+plotH-En*plotH/13;
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    /* Classically allowed region: x = ±√(2E) */
    var xmax=Math.sqrt(2*En);
    var x0=padL+((-xmax+5)/10)*plotW;
    var x1=padL+((xmax+5)/10)*plotW;
    S.ctx.moveTo(x0,y);
    S.ctx.lineTo(x1,y);
    S.ctx.stroke();
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText('n='+n,padL-10,y+4);
  }
  /* Info */

/* ══════════════ Van der Waals ══════════════ */
R.vdw=function(dt){
  clear();
  headline('Van der Waals Equation','real gas · (P+a·n²/V²)(V−nb) = nRT');
  if(!S.sim.vdw){S.sim.vdw={n:1,T:300,a:0.364,b:0.0427}}
  var vd=S.sim.vdw;
  /* Plot P vs V isotherms */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'volume (L/mol)','pressure (atm)');
  var temps=[250,300,400,500,600];
  var colors=['#4dd0ff','#ffb347','#ff4d3d','#8c5cf0','#00ff9d'];
  var Tc=8*vd.a/(27*CONST.R*vd.b);
  temps.forEach(function(T,idx){
    S.ctx.strokeStyle=colors[idx];
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    var first=true;
    for(var i=0;i<=200;i++){
      var V=vd.b*1.01+i/200*1;
      var P=CONST.R*T/(V-vd.b)-vd.a/(V*V);
      P=P/CONST.atm;
      var x=padL+(V/1)*plotW;
      var y=padT+plotH-clamp(P/200,0,1)*plotH;
      if(P<0||P>200)continue;
      if(first){S.ctx.moveTo(x,y);first=false}
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    S.ctx.fillStyle=colors[idx];
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('T='+T+'K'+(Math.abs(T-Tc)<10?' (Tc)':''),padL+10+idx*100,padT+20);
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#ffb347';

  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('VAN DER WAALS',infoX+15,100);

  var P_vdw=CONST.R*vd.T/(0.024-vd.b)-vd.a/(0.024*0.024);
  var rows=[
    ['Gas','CO₂-like'],
    ['a',fmt(vd.a,4)+' L²·atm/mol²'],
    ['b',fmt(vd.b,4)+' L/mol'],
    ['T',fmt(vd.T,1)+' K'],
    ['T_c',fmt(Tc,2)+' K'],
    ['P_ideal (V=24L)',fmt(P_ideal/CONST.atm,3)+' atm'],
    ['P_vdW (V=24L)',fmt(P_vdw/CONST.atm,3)+' atm'],
    ['Z (compressibility)',fmt(P_vdw/(P_ideal),3)],
    ['Below T_c','Liquid-vapor coexist'],
    ['Above T_c','Supercritical fluid']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Maxwell-Boltzmann ══════════════ */
R.maxwell=function(dt){
  clear();
  headline('Maxwell-Boltzmann Distribution','molecular speed distribution');
  if(!S.sim.mb){S.sim.mb={T:300,mass:28}}
  var mb=S.sim.mb;
  var m=mb.mass*CONST.u;
  /* Plot f(v) at multiple temperatures */
  var padL=80,padT=140,padR=40,padB=80;

  var temps=[200,300,500,1000];
  var colors=['#4dd0ff','#ffb347','#ff4d3d','#8c5cf0'];
  var vMax=2000;
  /* Find global max */
  var globalMax=0;
  temps.forEach(function(T){
    for(var v=10;v<vMax;v+=10){
      var f=maxwellBoltzmann(v,m,T);
      if(f>globalMax)globalMax=f;
    }
  });
  temps.forEach(function(T,idx){
    S.ctx.strokeStyle=colors[idx];

      var v=i/200*vMax;

      var x=padL+(v/vMax)*plotW;
      var y=padT+plotH-(f/globalMax)*plotH*0.9;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    /* Most probable velocity marker */
    var vp=mostProbableSpeed(m,T);
    var xp=padL+(vp/vMax)*plotW;
    var yp=padT+plotH;
    S.ctx.fillStyle=colors[idx];
    S.ctx.beginPath();S.ctx.arc(xp,padT+plotH-2,4,0,Math.PI*2);S.ctx.fill();
    S.ctx.font='10px "JetBrains Mono",monospace';

  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('MOLECULAR SPEEDS',infoX+15,100);

    ['Gas',mb.mass+' g/mol'],

    ['  √(3/2)','=1.2247'],
    ['v_mean/v_p',fmt(vMean/vp,4)],

/* ══════════════ Thermodynamic Cycles ══════════════ */
R.cycles=function(dt){
  clear();
  headline('Thermodynamic Cycles','Carnot · Otto · Diesel');
  if(!S.sim.cycles){S.sim.cycles={type:'carnot',Th:800,Tc:300,r:10}}
  var c=S.sim.cycles;
  var eff=0;
  if(c.type==='carnot')eff=carnotCycle(c.Th,c.Tc).efficiency;
  else if(c.type==='otto')eff=ottoCycle(c.r,1.4);
  else if(c.type==='diesel')eff=dieselCycle(c.r,2,1.4);
  /* Plot PV diagram */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'volume','pressure');
  /* Draw cycle */
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2.5;
  if(c.type==='carnot'){
    var V1=1,V2=2,V3=4,V4=2;
    var P1=1/Tc*300,P2=P1*V1/V2;
    var P3=P1*(Th/Tc)*V1/V3*V3/V2*V2/(V3);
    P3=P2*(Th/Tc);
    var P4=P3*V3/V4;
    S.ctx.beginPath();
    S.ctx.moveTo(padL+V1/5*plotW,padT+plotH-P1*plotH*0.5);
    S.ctx.lineTo(padL+V2/5*plotW,padT+plotH-P2*plotH*0.5);
    S.ctx.lineTo(padL+V3/5*plotW,padT+plotH-P3*plotH*0.5);
    S.ctx.lineTo(padL+V4/5*plotW,padT+plotH-P4*plotH*0.5);
    S.ctx.closePath();
    S.ctx.stroke();
  } else if(c.type==='otto'){
    /* Otto: 1→2 isentropic compression, 2→3 constant V, 3→4 isentropic expansion, 4→1 constant V */
    var V_lo=1,V_hi=c.r;
    var P1=1,P2=P1*Math.pow(V_hi/V_lo,1.4);
    var P3=P2*2.5,P4=P3*Math.pow(V_lo/V_hi,1.4);
    S.ctx.beginPath();
    S.ctx.moveTo(padL+V_lo/12*plotW,padT+plotH-P1*plotH*0.02);
    S.ctx.lineTo(padL+V_hi/12*plotW,padT+plotH-P2*plotH*0.02);
    S.ctx.lineTo(padL+V_hi/12*plotW,padT+plotH-P3*plotH*0.02);
    S.ctx.lineTo(padL+V_lo/12*plotW,padT+plotH-P4*plotH*0.02);
    S.ctx.closePath();
    S.ctx.stroke();
  } else {
    var V_lo=1,V_hi=c.r,V_mid=V_lo*2;
    var P1=1,P2=P1*Math.pow(V_hi/V_lo,1.4);
    var P3=P2,P4=P3*Math.pow(V_lo/V_hi,1.4);
    S.ctx.beginPath();
    S.ctx.moveTo(padL+V_lo/12*plotW,padT+plotH-P1*plotH*0.02);
    S.ctx.lineTo(padL+V_hi/12*plotW,padT+plotH-P2*plotH*0.02);
    S.ctx.lineTo(padL+V_mid/12*plotW,padT+plotH-P3*plotH*0.02);
    S.ctx.lineTo(padL+V_lo/12*plotW,padT+plotH-P4*plotH*0.02);
    S.ctx.closePath();
    S.ctx.stroke();
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CYCLE ANALYSIS',infoX+15,100);
  var rows=[
    ['Cycle',c.type.charAt(0).toUpperCase()+c.type.slice(1)],
    ['Hot reservoir',fmt(c.Th,0)+' K'],
    ['Cold reservoir',fmt(c.Tc,0)+' K'],
    ['Compression ratio',fmt(c.r,1)],
    ['Efficiency η',fmt(eff*100,2)+'%'],
    ['Theoretical max',fmt(carnotCycle(c.Th,c.Tc).efficiency*100,2)+'%'],
    ['  (Carnot)',c.type==='carnot'?'← current':'← this cycle']
  ];
  if(c.type==='carnot'){
    rows.push(['Reversible','Yes (ideal)']);
    rows.push(['ΔS_universe','0']);
  } else {
    rows.push(['Irreversible','Yes']);
    rows.push(['ΔS_universe','>0']);
  }
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};
</script>
<script>
/* ══════════════ Arrhenius Kinetics ══════════════ */
R.arrhenius=function(dt){
  clear();
  headline('Arrhenius Kinetics','temperature dependence of rate');
  if(!S.sim.arr){S.sim.arr={A:1e13,Ea:75000}}
  var arr=S.sim.arr;
  /* Plot log(k) vs 1/T */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'1000/T (K⁻¹)','log₁₀ k');
  var pts=[];
  var minLog=20,maxLog=-20;
  for(var i=0;i<=100;i++){
    var T=200+i/100*800;
    var k=arrhenius(arr.A,arr.Ea,T);
    var lk=Math.log10(k);
    var x=padL+(1000/T-1)/4*plotW;
    var y=padT+plotH-clamp((lk+5)/25,0,1)*plotH;
    pts.push({T:T,k:k,x:x,y:y,lk:lk});
    if(lk<minLog)minLog=lk;
    if(lk>maxLog)maxLog=lk;
  }
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  pts.forEach(function(p,i){
    if(i===0)S.ctx.moveTo(p.x,p.y);
    else S.ctx.lineTo(p.x,p.y);
  });
  S.ctx.stroke();
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,260);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,259);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ARRHENIUS PARAMETERS',infoX+15,100);
  var k298=arrhenius(arr.A,arr.Ea,298);
  var k310=arrhenius(arr.A,arr.Ea,310);
  var rows=[
    ['Pre-exponential A',expo(arr.A,3)+' s⁻¹'],
    ['Activation E_a',fmt(arr.Ea/1000,2)+' kJ/mol'],
    ['  in eV',fmt(arr.Ea/CONST.eV,3)+' eV'],
    ['k at 298 K',expo(k298,3)],
    ['k at 310 K',expo(k310,3)],
    ['Ratio k₃₁₀/k₂₉₈',fmt(k310/k298,3)],
    ['  (~10°C)',''],
    ['Q₁₀','~2-3 (biological)'],
    ['Linear on ln(k) vs 1/T','Yes']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';

/* ══════════════ Michaelis-Menten ══════════════ */
R.mm=function(dt){
  clear();
  headline('Michaelis-Menten','enzyme kinetics');
  if(!S.sim.mm){S.sim.mm={Vmax:10,Km:2}}
  var m=S.sim.mm;
  /* Plot v vs [S] */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-200;
  axes(padL,padT,plotW,plotH,'[S] (mM)','v (μmol/min)');
  var pts=[];
  var Smax=20;
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=200;i++){
    var S_=i/200*Smax;
    var v=michaelisMenten(S_,m.Vmax,m.Km);
    var x=padL+(S_/Smax)*plotW;
    var y=padT+plotH-(v/m.Vmax)*plotH*0.95;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Vmax line */
  S.ctx.strokeStyle='rgba(0,255,157,.4)';
  S.ctx.setLineDash([4,4]);
  S.ctx.beginPath();
  S.ctx.moveTo(padL,padT+plotH*0.05);
  S.ctx.lineTo(padL+plotW,padT+plotH*0.05);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Km marker */
  var xKm=padL+(m.Km/Smax)*plotW;
  S.ctx.strokeStyle='rgba(77,208,255,.5)';
  S.ctx.beginPath();
  S.ctx.moveTo(xKm,padT);
  S.ctx.lineTo(xKm,padT+plotH);
  S.ctx.stroke();
  S.ctx.fillStyle='#80e5ff';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Km='+m.Km+' mM',xKm+5,padT+15);
  /* Lineweaver-Burk */
  var lbY=padT+plotH+60;
  var lbH=Math.min(120,S.H-lbY-40);
  if(lbH>60){
    S.ctx.fillStyle='#ffd080';
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('LINEWEAVER-BURK PLOT',padL,lbY-5);
    S.ctx.fillStyle='rgba(10,14,46,.7)';
    S.ctx.fillRect(padL,lbY,plotW,lbH);
    S.ctx.strokeStyle='rgba(255,179,71,.3)';
    S.ctx.strokeRect(padL+.5,lbY+.5,plotW-1,lbH-1);
    /* 1/v vs 1/S */
    var pts2=[];
    for(var i=1;i<=100;i++){
      var S2=i/100*Smax;
      var v2=michaelisMenten(S2,m.Vmax,m.Km);
      var x2=1/S2;
      var y2=1/v2;
      pts2.push({x:x2,y:y2});
    }
    /* Scale */
    var xMax2=Math.max.apply(null,pts2.map(function(p){return p.x}));
    var yMax2=Math.max.apply(null,pts2.map(function(p){return p.y}));
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    pts2.forEach(function(p,i){
      var px=padL+(p.x/xMax2)*plotW;
      var py=lbY+lbH-(p.y/yMax2)*lbH;
      if(i===0)S.ctx.moveTo(px,py);
      else S.ctx.lineTo(px,py);
    });
    S.ctx.stroke();
    /* Y-intercept = 1/Vmax */
    S.ctx.fillStyle='#00ff9d';
    S.ctx.beginPath();
    S.ctx.arc(padL,lbY+lbH-(1/m.Vmax/yMax2)*lbH,4,0,Math.PI*2);
    S.ctx.fill();
    S.ctx.fillStyle='#5cffc0';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText('y-int = 1/Vmax',padL+8,lbY+lbH-(1/m.Vmax/yMax2)*lbH+4);
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,240);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,239);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ENZYME KINETICS',infoX+15,100);
  var rows=[
    ['Vmax',fmt(m.Vmax,2)+' μmol/min'],
    ['Km',fmt(m.Km,2)+' mM'],
    ['  physical meaning','[S] at v=Vmax/2'],
    ['Turnover',fmt(m.Vmax*2,2)+' min⁻¹'],
    ['Catalytic eff','kcat/Km'],
    ['Km class','Moderate affinity'],
    ['Inhibitor types','comp · un-comp · non-comp'],
    ['Assumption','[E] << [S]']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Equilibrium ══════════════ */
R.equilib=function(dt){
  clear();
  headline('Chemical Equilibrium','K · ΔG · Nernst · pH');
  if(!S.sim.eq){S.sim.eq={K:10,pKa:4.75,concC:0.1,concA:0.1}}
  var eq=S.sim.eq;
  /* Plot ΔG vs reaction coordinate */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'reaction coordinate','G (kJ/mol)');
  /* For A ⇌ B: G(x) = ΔG°·x + RT·(x·ln(x)+(1-x)·ln(1-x)) */
  var dG0=-CONST.R*298*Math.log(eq.K)/1000;
  S.ctx.strokeStyle='#ffb347';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  var minG=1e9,maxG=-1e9;
  var pts=[];
  for(var i=0;i<=200;i++){
    var x=i/200;
    var G=dG0*x+CONST.R*298*(x*Math.log(x+1e-15)+(1-x)*Math.log(1-x+1e-15))/1000;
    if(G<minG)minG=G;
    if(G>maxG)maxG=G;
    pts.push({x:x,G:G});
  }
  var range=maxG-minG||1;
  pts.forEach(function(p,i){
    var x=padL+p.x*plotW;
    var y=padT+plotH-(p.G-minG+5)/range*plotH*0.9;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Equilibrium position */
  var xe=eq.K/(eq.K+1);
  var Ge=dG0*xe+CONST.R*298*(xe*Math.log(xe+1e-15)+(1-xe)*Math.log(1-xe+1e-15))/1000;
  var xMarker=padL+xe*plotW;
  var yMarker=padT+plotH-(Ge-minG+5)/range*plotH*0.9;
  S.ctx.fillStyle='#00ff9d';
  S.ctx.beginPath();S.ctx.arc(xMarker,yMarker,7,0,Math.PI*2);S.ctx.fill();
  S.ctx.fillStyle='#5cffc0';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('x_eq='+fmt(xe,3),xMarker+10,yMarker+4);
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,300);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,299);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('EQUILIBRIUM DATA',infoX+15,100);
  var pH_val=pKa_(eq.pKa,eq.concC,eq.concA);
  var rows=[
    ['K',fmt(eq.K,4)],
    ['ΔG° at 298K',fmt(dG0,3)+' kJ/mol'],
    ['Equilibrium x',fmt(xe,4)],
    ['------------------',''],
    ['pKa (weak acid)',fmt(eq.pKa,3)],
    ['[HA]',fmt(eq.concC,3)+' M'],
    ['[A⁻]',fmt(eq.concA,3)+' M'],
    ['Henderson-Hasselbalch','pH = pKa + log([A⁻]/[HA])'],
    ['Computed pH',fmt(pH_val,3)],
    ['------------------',''],
    ['Nernst','E = E° − (RT/nF)·lnQ'],
    ['  at 25°C','E = E° − (0.0592/n)·logQ']
  ];
  rows.forEach(function(r,i){
    if(i*22+130>S.H-40)return;
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
    S.ctx.textAlign='left';
  });
};
function pKa_(pKa,concBase,concAcid){return pKa+Math.log10(concBase/concAcid)}

/* ══════════════ Lennard-Jones ══════════════ */

/* ══════════════ MD Simulator ══════════════ */
R.md=function(dt){
  clear();
  headline('Molecular Dynamics','Lennard-Jones fluid · velocity Verlet');
  if(!S.sim.md||S.sim.md.reinit){
    S.sim.md={
      state:initializeMDFluid(108,10),
      eps:1,sigma:1,cutoff:2.5,dt:0.005,
      running:true,steps:0,energy:[],
      reinit:false
    };
  }
  var md=S.sim.md;
  if(md.running){
    for(var s=0;s<3;s++){
      var newState=mdStep(md.state,md.dt,md.eps,md.sigma,md.cutoff);
      /* Simple thermostat: rescale velocities to T ~ 1 */
      var KE=newState.KE;
      var Ttarget=1.0;
      var Natoms=newState.N;
      var Tcurrent=2*KE/(3*Natoms);
      var scale=Math.sqrt(Ttarget/(Tcurrent+1e-10));
      for(var i=0;i<newState.N;i++){
        newState.vel[i]=V(newState.vel[i].x*scale,newState.vel[i].y*scale,newState.vel[i].z*scale);
      }
      md.state=newState;
      md.steps++;
      /* Accumulate energy */
      if(md.steps%10===0){
        var totalKE=0;
        for(var j=0;j<newState.N;j++){
          totalKE+=0.5*(newState.vel[j].x*newState.vel[j].x+newState.vel[j].y*newState.vel[j].y+newState.vel[j].z*newState.vel[j].z);
        }
        md.energy.push({step:md.steps,KE:totalKE,PE:newState.PE});
        if(md.energy.length>200)md.energy.shift();
      }
    }
  }
  /* Render 3D-ish projection */
  var cx=S.W/2-80,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.4/md.state.boxSize;
  var angle=S.t*0.15;
  /* Sort by z */
  var projected=[];
  md.state.pos.forEach(function(p){
    var x=p.x-md.state.boxSize/2;
    var y=p.y-md.state.boxSize/2;
    var z=p.z-md.state.boxSize/2;
    /* Rotate around Z */
    var xr=x*Math.cos(angle)-y*Math.sin(angle);
    var yr=x*Math.sin(angle)+y*Math.cos(angle);
    projected.push({x:xr*scale+cx,y:yr*scale*0.7+cy,z:z,sx:cx+xr*scale,sy:cy+yr*scale*0.7,sz:z});
  });
  projected.sort(function(a,b){return a.z-b.z});
  /* Draw box outline */
  S.ctx.strokeStyle='rgba(255,179,71,.3)';
  S.ctx.lineWidth=1;
  var boxSize=md.state.boxSize;
  var corners=[V(-1,-1,-1),V(1,-1,-1),V(1,1,-1),V(-1,1,-1),V(-1,-1,1),V(1,-1,1),V(1,1,1),V(-1,1,1)];
  var proj=corners.map(function(c){
    var x=c.x*boxSize/2,y=c.y*boxSize/2;
    var xr=x*Math.cos(angle)-y*Math.sin(angle);
    var yr=x*Math.sin(angle)+y*Math.cos(angle);
    return {x:cx+xr*scale,y:cy+yr*scale*0.7};
  });
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(function(e){
    S.ctx.beginPath();
    S.ctx.moveTo(proj[e[0]].x,proj[e[0]].y);
    S.ctx.lineTo(proj[e[1]].x,proj[e[1]].y);
    S.ctx.stroke();
  });
  /* Draw atoms */
  projected.forEach(function(p){
    var rad=5-p.z*0.3;
    rad=Math.max(3,rad);
    S.ctx.fillStyle='#ffb347';
    S.ctx.beginPath();S.ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);S.ctx.fill();
    S.ctx.strokeStyle='#04061a';
    S.ctx.lineWidth=1;
    S.ctx.stroke();
    /* Highlight */
    S.ctx.fillStyle='rgba(255,208,128,.5)';
    S.ctx.beginPath();S.ctx.arc(p.sx-rad*0.3,p.sy-rad*0.3,rad*0.4,0,Math.PI*2);S.ctx.fill();
  });
  /* Energy plot */
  var eY=S.H-160;
  S.ctx.fillStyle='rgba(10,14,46,.8)';
  S.ctx.fillRect(S.W-320,eY,300,140);
  S.ctx.strokeStyle='#8c5cf0';
  S.ctx.strokeRect(S.W-319.5,eY+.5,299,139);
  S.ctx.fillStyle='#b088ff';
  S.ctx.font='700 11px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ENERGY CONVERGENCE',S.W-310,eY+18);
  if(md.energy.length>1){
    var eMax=0,eMin=1e9;
    md.energy.forEach(function(e){
      var tot=e.KE+e.PE;
      if(tot>eMax)eMax=tot;
      if(tot<eMin)eMin=tot;
    });
    var eRange=eMax-eMin||1;
    S.ctx.strokeStyle='#00ff9d';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    md.energy.forEach(function(e,i){
      var x=S.W-310+(i/md.energy.length)*280;
      var y=eY+130-((e.KE+e.PE-eMin)/eRange)*100;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    });
    S.ctx.stroke();
    S.ctx.fillStyle='#5cffc0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('total E',S.W-310,eY+130);
  }
  /* Info */
  var infoX=40;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,240,180);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,239,179);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('MD STATE',infoX+15,100);
  var Tcurr=2*md.state.KE/(3*md.state.N);
  var rows=[
    ['Atoms',md.state.N],
    ['Box size',fmt(md.state.boxSize,2)+' σ'],
    ['Density',fmt(md.state.N/Math.pow(md.state.boxSize,3),4)+' σ⁻³'],
    ['Timestep dt',fmt(md.dt,4)],
    ['Steps',md.steps],
    ['Temperature',fmt(Tcurr,3)+' ε/kB'],
    ['Kinetic E',fmt(md.state.KE,2)],
    ['Potential E',fmt(md.state.PE,2)]
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#8888b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#ffd080';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+220,130+i*22);
    S.ctx.textAlign='left';
  });
  $('cAtoms').textContent=md.state.N;
  $('stSim').textContent=md.running?'running':'paused';
};

/* ══════════════ RDF ══════════════ */
R.rdf=function(dt){
  clear();
  headline('Radial Distribution Function','g(r) structure');
  if(!S.sim.rdf||!S.sim.rdf.rdf){
    S.sim.rdf={rdf:null};
  }
  /* Compute RDF from MD state */
  if(S.sim.md&&S.sim.md.state){
    var rdf=computeRDF(S.sim.md.state.pos,S.sim.md.state.boxSize,100);
    S.sim.rdf.rdf=rdf;
  }
  var rdf=S.sim.rdf.rdf;
  /* Plot g(r) */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'r/σ','g(r)');
  if(rdf){
    var maxG=1;
    for(var i=0;i<rdf.g.length;i++)if(rdf.g[i]>maxG)maxG=rdf.g[i];
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    for(var i=0;i<rdf.g.length;i++){
      var r=(i+0.5)*rdf.dr;
      var x=padL+(r/rdf.rMax)*plotW;
      var y=padT+plotH-(rdf.g[i]/maxG)*plotH*0.9;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    /* g=1 line */
    S.ctx.strokeStyle='rgba(0,255,157,.3)';
    S.ctx.setLineDash([4,4]);
    S.ctx.beginPath();
    S.ctx.moveTo(padL,padT+plotH-(1/maxG)*plotH*0.9);
    S.ctx.lineTo(padL+plotW,padT+plotH-(1/maxG)*plotH*0.9);
    S.ctx.stroke();
    S.ctx.setLineDash([]);
    /* First peak */
    var firstPeak=0,firstPeakR=0;
    for(var i=1;i<Math.min(rdf.g.length,30);i++){
      if(rdf.g[i]>rdf.g[i-1]&&rdf.g[i]>rdf.g[i+1]&&rdf.g[i]>firstPeak){
        firstPeak=rdf.g[i];
        firstPeakR=(i+0.5)*rdf.dr;
      }
    }
    S.ctx.fillStyle='#00ff9d';
    S.ctx.beginPath();
    S.ctx.arc(padL+(firstPeakR/rdf.rMax)*plotW,padT+plotH-(firstPeak/maxG)*plotH*0.9,6,0,Math.PI*2);
    S.ctx.fill();
    S.ctx.fillStyle='#5cffc0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('1st peak r='+fmt(firstPeakR,3)+' g='+fmt(firstPeak,2),padL+(firstPeakR/rdf.rMax)*plotW+8,padT+plotH-(firstPeak/maxG)*plotH*0.9+4);
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(10,14,46,.9)';
  S.ctx.fillRect(infoX,80,300,220);
  S.ctx.strokeStyle='#ffb347';
  S.ctx.strokeRect(infoX+.5,80.5,299,219);
  S.ctx.fillStyle='#ffd080';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('STRUCTURE',infoX+15,100);
  if(rdf){
    var maxG2=0,firstPeak2=0,rPeak=0;
    for(var i=0;i<rdf.g.length;i++)if(rdf.g[i]>maxG2)maxG2=rdf.g[i];
    for(var i=1;i<Math.min(rdf.g.length,30);i++){
      if(rdf.g[i]>rdf.g[i-1]&&rdf.g[i]>rdf.g[i+1]){firstPeak2=rdf.g[i];rPeak=(i+0.5)*rdf.dr;break}
    }
    var coordNum=0;
    for(var i=0;i<Math.min(rdf.g.length,40);i++){
      var r=(i+0.5)*rdf.dr;
      coordNum+=rdf.g[i]*4*Math.PI*r*r*rdf.dr*0.85;
    }
    var rows=[
      ['First peak r',fmt(rPeak,3)+' σ'],
      ['First peak g',fmt(firstPeak2,2)],
      ['Max g(r)',fmt(maxG2,2)],
      ['Coordination #',fmt(coordNum,2)],
      ['Phase','Liquid-like'],
      ['Second peak',rdf.g.length>20?fmt(rdf.g[20],2):'—']
    ];
    rows.forEach(function(r,i){
      S.ctx.fillStyle='#8888b0';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText(r[0],infoX+15,130+i*22);
      S.ctx.fillStyle='#ffd080';
      S.ctx.textAlign='right';
      S.ctx.fillText(String(r[1]),infoX+285,130+i*22);
      S.ctx.textAlign='left';
    });
  }
};

/* ══════════════ VACF ══════════════ */
R.vacf=function(dt){
  clear();
  headline('Velocity Autocorrelation','dynamics & diffusion');
  if(!S.sim.vacf){S.sim.vacf={history:[]}}
  var vc=S.sim.vacf;
  /* Accumulate velocity history from MD */
  if(S.sim.md&&S.sim.md.state){
    var v0=S.sim.md.state.vel[0];
    vc.history.push({x:v0.x,y:v0.y,z:v0.z});
    if(vc.history.length>500)vc.history.shift();
  }
  var acf=vacf(vc.history);
  /* Plot */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'time lag','⟨v(0)·v(t)⟩');
  if(acf.length>1){
    var maxA=0;
    for(var i=0;i<acf.length;i++)if(Math.abs(acf[i])>maxA)maxA=Math.abs(acf[i]);
    S.ctx.strokeStyle='#ffb347';
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    acf.forEach(function(a,i){
      var x=padL+(i/acf.length)*plotW;

      else S.ctx.lineTo(x,y);
    });
    S.ctx.stroke();
    /* Zero line */
    S.ctx.strokeStyle='rgba(140,92,240,.3)';
    S.ctx.setLineDash([4,4]);
    S.ctx.beginPath();
    S.ctx.moveTo(padL,padT+plotH/2);
    S.ctx.lineTo(padL+plotW,padT+plotH/2);
