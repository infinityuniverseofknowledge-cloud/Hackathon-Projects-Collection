}

function saveSettings(){
  var s=State.settings;
  s.businessName=$('stBizName').value.trim();
  s.businessEmail=$('stBizEmail').value.trim();
  s.businessPhone=$('stBizPhone').value.trim();
  s.businessTaxId=$('stBizTaxId').value.trim();
  s.businessAddress=$('stBizAddr').value.trim();
  s.currency=$('stCurrency').value;
  s.taxRate=parseNum($('stTaxRate').value);
  s.invoicePrefix=$('stInvoicePrefix').value.trim()||'INV-';
  saveState();
  toast('Settings saved','success');
}

function exportAllData(){
  var data=JSON.stringify(State,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='bizlite-backup-'+today()+'.json';
  a.click();
  toast('Backup downloaded','success');
}

function importAllData(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=function(){
    var file=input.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);
        if(!confirm('Replace all current data with imported data?'))return;
        Object.keys(State).forEach(function(k){
          if(data[k]!==undefined)State[k]=data[k];
        });
        saveState();
        renderNav();renderPage();
        toast('Data imported successfully','success');
      }catch(e){
        toast('Import failed: '+e.message,'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function seedDemoDataForUser(){
  if(!confirm('Load demo data? This will ADD demo records to your existing data.'))return;
  var before={c:State.clients.length,p:State.products.length,i:State.invoices.length};
  seedDemoData();
  saveState();
  renderNav();renderPage();
  toast('Demo data loaded','success');
}

/* ================================================================
   INITIALIZATION
   ================================================================ */
var NotifiedLowStock={};

function checkAlerts(){
  // Low stock
  State.products.forEach(function(p){
    if(p.stock<=p.minStock && !NotifiedLowStock[p.id]){
      NotifiedLowStock[p.id]=true;
      notify('Low Stock Alert',p.name+' is at '+p.stock+' '+p.unit+' (min: '+p.minStock+')','warn');
    }
  });
  // Overdue invoices
  State.invoices.forEach(function(i){
    if(i.status==='pending'&&i.dueDate<today()&&i.paid<i.total){
      i.status='overdue';
    }
  });
  // Due tasks
  State.tasks.forEach(function(t){
    if(!t.done && t.due===today() && !t._notified){
      t._notified=true;
      notify('Task due today',t.title,'info');
    }
  });
  // Today's events
  State.events.forEach(function(e){
    if(e.date===today() && !e._notified){
      e._notified=true;
      notify('Event today',e.title+(e.time?' at '+e.time:''),'info');
    }
  });
}

function initApp(){
  // Load state
  var loaded=loadState();
  if(!loaded||(!State.clients.length&&!State.products.length)){
    seedDemoData();
    saveState();
  }

  // Apply theme
  if(State.settings.theme){
    document.documentElement.setAttribute('data-theme',State.settings.theme);
  }

  // Wire search
  var search=$('globalSearch');
  if(search){
    search.oninput=function(){
      var q=this.value.trim();
      if(q.length<2){return}
      var results=globalSearch(q);
      if(results.length===0)return;
      // Show first result hint
    };
    search.onkeydown=function(e){
      if(e.key==='Enter'){
        var q=this.value.trim();
        if(!q)return;
        var results=globalSearch(q);
        if(results.length>0){
          var r=results[0];
          this.value='';
          navigate(r.route);
          setTimeout(function(){
            if(r.route==='clients')viewClient(r.id);
            if(r.route==='products')viewProduct(r.id);
            if(r.route==='invoices')viewInvoice(r.id);
          },100);
        }
      }
    };
  }

  // Sidebar close button
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display='none';
    if(window.innerWidth<900)sbClose.style.display='flex';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
  });

  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='Escape')closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();openNewInvoice()}
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var s=$('globalSearch');if(s)s.focus()}
    if(e.key==='?')openModal_help();
    // Quick navigation: g+d, g+c, g+p, g+i
    if(e.key==='g'){window._gk=true;setTimeout(function(){window._gk=false},800);return}
    if(window._gk){
      if(e.key==='d')navigate('dashboard');
      if(e.key==='c')navigate('clients');
      if(e.key==='p')navigate('products');
      if(e.key==='i')navigate('invoices');
      if(e.key==='r')navigate('reports');
      if(e.key==='s')navigate('settings');
    }
  });

  // Modal backdrop
  var modal=$('modal');
  if(modal){
    modal.addEventListener('click',function(e){
      if(e.target===modal)closeModal();
    });
  }

  // Recalculate on resize for charts
  window.addEventListener('resize',function(){
    if(CurrentRoute==='dashboard')after_dashboard();
    else if(CurrentRoute==='reports')after_reports();
    else if(CurrentRoute==='cashflow')after_cashflow();
  });

  // Init UI
  renderNav();
  renderPage();
  updateNotifBadge();

  // Auto-check alerts
  setTimeout(checkAlerts,1000);
  setInterval(checkAlerts,60000);

  // Save on unload
  window.addEventListener('beforeunload',saveState);

  // Periodic autosave
  setInterval(saveState,30000);

  // Welcome toast
  setTimeout(function(){
    toast('Welcome to BizLite!','success');
  },300);

  // Wrap modal functions to accept our string identifiers
  var _openModal=openModal;
  window.openModal=function(id,opts){
    if(id==='help')return openModal_help();
    if(id==='profile')return openModal_profile();
    return _openModal(id,opts);
  };
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
