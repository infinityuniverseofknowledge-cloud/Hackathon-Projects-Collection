<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>BizLite — Small Business Suite</title>
<style>
/* ================================================================
   BIZLITE — Design System
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#fff}

:root{
  --bg:#0a0e1a;--bg2:#0f1420;--bg3:#151b2c;--bg4:#1c2338;
  --panel:#111827;--panel2:#1a2233;--panel3:#232d45;--panel4:#2d3852;
  --bd:#1f2937;--bd2:#374151;--bd3:#4b5563;
  --tx:#f3f4f6;--tx2:#9ca3af;--tx3:#6b7280;--mu:#4b5563;
  --c1:#6366f1;--c1h:#818cf8;--c1l:#4338ca;
  --c2:#10b981;--c2h:#34d399;--c2l:#059669;
  --c3:#f59e0b;--c3h:#fbbf24;--c3l:#d97706;
  --c4:#ef4444;--c4h:#f87171;--c4l:#dc2626;
  --c5:#8b5cf6;--c5h:#a78bfa;--c5l:#7c3aed;
  --c6:#06b6d4;--c6h:#22d3ee;--c6l:#0891b2;
  --c7:#ec4899;--c7h:#f472b6;--c7l:#db2777;
  --c8:#84cc16;--c8h:#a3e635;--c8l:#65a30d;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;--info:#3b82f6;
  --g1:linear-gradient(135deg,#6366f1,#8b5cf6);
  --g2:linear-gradient(135deg,#10b981,#06b6d4);
  --g3:linear-gradient(135deg,#f59e0b,#ef4444);
  --g4:linear-gradient(135deg,#ec4899,#8b5cf6);
  --r:10px;--rs:8px;--rxs:6px;--rxxs:4px;--rf:9999px;
  --sh1:0 1px 3px rgba(0,0,0,.4);
  --sh2:0 4px 12px rgba(0,0,0,.5);
  --sh3:0 8px 32px rgba(0,0,0,.7);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}

[data-theme="light"]{
  --bg:#f8fafc;--bg2:#f1f5f9;--bg3:#e2e8f0;--bg4:#cbd5e1;
  --panel:#fff;--panel2:#f8fafc;--panel3:#f1f5f9;--panel4:#e2e8f0;
  --bd:#e2e8f0;--bd2:#cbd5e1;--bd3:#94a3b8;
  --tx:#0f172a;--tx2:#475569;--tx3:#64748b;--mu:#94a3b8;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --sh3:0 8px 32px rgba(0,0,0,.15);
  --shIn:inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="nord"]{
  --bg:#2e3440;--bg2:#3b4252;--bg3:#434c5e;--bg4:#4c566a;
  --panel:#3b4252;--panel2:#434c5e;--panel3:#4c566a;--panel4:#5b667a;
  --bd:#4c566a;--bd2:#5b667a;--bd3:#7b8ba0;
  --tx:#eceff4;--tx2:#d8dee9;--tx3:#b0b8c8;--mu:#7b8ba0;
  --c1:#88c0d0;--c1h:#9fd0df;--c1l:#5e81ac;
}
[data-theme="forest"]{
  --bg:#0d1a12;--bg2:#132318;--bg3:#1a2e20;--bg4:#223a29;
  --panel:#132318;--panel2:#1a2e20;--panel3:#223a29;--panel4:#2a4633;
  --bd:#223a29;--bd2:#2f4d39;--bd3:#3d614a;
  --tx:#d8f0dd;--tx2:#a0c0a8;--tx3:#6f8b78;--mu:#4a6a55;
  --c1:#34d399;--c1h:#6ee7b7;--c1l:#059669;
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--bd3)}

/* ================================================================
   LAYOUT
   ================================================================ */
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.sb-logo{
  width:36px;height:36px;border-radius:9px;
  background:var(--g1);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(99,102,241,.4);
}
.sb-title{font-weight:800;font-size:1rem;letter-spacing:.5px;line-height:1}
.sb-sub{font-size:.6rem;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-cat{
  font-size:.6rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.2px;text-transform:uppercase;
  padding:12px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.6rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c4);color:#fff;
}
.nav-item.active .ni-badge{background:rgba(255,255,255,.25)}

/* MAIN AREA */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:52px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:32px;height:32px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-menu:hover{background:var(--panel2);color:var(--tx)}
.tb-title{font-weight:700;font-size:.95rem;flex-shrink:0}
.tb-sub{font-size:.65rem;color:var(--tx3);margin-left:4px}
.tb-search{
  flex:1;max-width:400px;position:relative;margin-left:auto;
}
.tb-search input{
  width:100%;padding:8px 12px 8px 34px;
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:var(--rxs);color:var(--tx);
  font-size:.78rem;transition:var(--t);
}
.tb-search input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.tb-search .icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--tx3);font-size:.85rem;pointer-events:none;
}
.tb-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:4px;right:4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--c4);color:#fff;
  border-radius:var(--rf);
  font-size:.55rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--g1);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.75rem;
  cursor:pointer;flex-shrink:0;
}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px}
.page-desc{font-size:.75rem;color:var(--tx3);margin-top:3px}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);
  color:var(--tx);font-size:.76rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--bd2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(99,102,241,.5)}
.btn.success{background:var(--c2);color:#fff;border-color:transparent}
.btn.success:hover{background:var(--c2h)}
.btn.danger{background:var(--c4);color:#fff;border-color:transparent}
.btn.danger:hover{background:var(--c4h)}
.btn.warn{background:var(--c3);color:#000;border-color:transparent}
.btn.warn:hover{background:var(--c3h)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.7rem}
.btn.xs{padding:3px 8px;font-size:.65rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:24px}
.card.pad-sm{padding:12px}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:20px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  position:relative;overflow:hidden;
  transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.c2::before{background:var(--g2)}
.kpi.c3::before{background:var(--g3)}
.kpi.c4::before{background:var(--g4)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.65rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:8px;
}
.kpi-value{
  font-size:1.6rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;
  color:var(--tx);
}
.kpi-delta{
  font-size:.68rem;font-weight:600;
  margin-top:6px;display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:var(--rf);
}
.kpi-delta.up{background:rgba(16,185,129,.15);color:var(--c2)}
.kpi-delta.down{background:rgba(239,68,68,.15);color:var(--c4)}
.kpi-delta.neutral{background:var(--panel3);color:var(--tx3)}

/* ================================================================
   TABLES
   ================================================================ */
.table-wrap{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;
}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700}
.table-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{
  background:var(--panel2);
  position:sticky;top:0;z-index:1;
}
th{
  padding:10px 14px;text-align:left;
  font-size:.62rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.6px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--bd);
  color:var(--tx);vertical-align:middle;
}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;
  white-space:nowrap;
}
.badge.ok{background:rgba(16,185,129,.15);color:var(--c2)}
.badge.warn{background:rgba(245,158,11,.15);color:var(--c3)}
.badge.err{background:rgba(239,68,68,.15);color:var(--c4)}
.badge.info{background:rgba(59,130,246,.15);color:var(--info)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}

/* ================================================================
   FORMS
   ================================================================ */
.form{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-size:.68rem;font-weight:700;
  color:var(--tx2);text-transform:uppercase;
  letter-spacing:.5px;
}
.field label .req{color:var(--c4);margin-left:2px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.78rem;transition:var(--t);
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(99,102,241,.15);
}
.field textarea{font-family:inherit;resize:vertical;min-height:70px}
.field small{font-size:.65rem;color:var(--tx3)}
.field-error{color:var(--c4);font-size:.65rem;margin-top:2px}

/* ================================================================
   MODAL
   ================================================================ */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:620px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:900px}
.modal-box.narrow{max-width:420px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.modal-head h2{font-size:1rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;
}

/* ================================================================
   TOASTS
   ================================================================ */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd);
  border-left:3px solid var(--info);
  box-shadow:var(--sh3);
  font-size:.75rem;font-weight:500;
  max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--c2)}
.toast.error{border-left-color:var(--c4)}
.toast.warn{border-left-color:var(--c3)}
.toast.info{border-left-color:var(--info)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* ================================================================
   CHARTS
   ================================================================ */
.chart-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}
.chart-canvas{width:100%;height:240px;display:block}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;
  font-size:.68rem;color:var(--tx2);
}
.chart-legend .li{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:10px;height:10px;border-radius:2px}

/* ================================================================
   MISC
   ================================================================ */
.empty{
  text-align:center;padding:48px 20px;color:var(--tx3);
  font-size:.8rem;
}
.empty .icon{font-size:2.5rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:6px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:3px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.65rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#fff;border-color:var(--c1)}

.divider{height:1px;background:var(--bd);margin:16px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.76rem;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700}
.stat-line .sl-value.pos{color:var(--c2)}
.stat-line .sl-value.neg{color:var(--c4)}

.pill-row{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.68rem;font-weight:600;color:var(--tx2);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--c2)}
.pill.warn .dot{background:var(--c3)}
.pill.err .dot{background:var(--c4)}

/* Loading */
.spinner{
  width:20px;height:20px;border-radius:50%;
  border:2px solid var(--bd);border-top-color:var(--c1);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================================================================
   DASHBOARD GRID
   ================================================================ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .tb-menu{display:flex}
  .form-row,.form-row.three{grid-template-columns:1fr}
  .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}
  .page{padding:14px}
  .page-title{font-size:1.1rem}
  .kpi-value{font-size:1.3rem}
  .tb-search{display:none}
}
@media (min-width:901px){.sidebar{transform:none!important}}

/* Print */
@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .page{padding:0}
  body{overflow:visible;height:auto}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">📊</div>
      <div style="flex:1;min-width:0">
        <div class="sb-title">BIZLITE</div>
        <div class="sb-sub">Business Suite</div>
      </div>
      <button class="icon-btn" onclick="closeSidebar()" style="display:none" id="sbClose">✕</button>
    </div>
    <nav class="sb-nav" id="sbNav">
      <!-- Populated by JS -->
    </nav>
  </aside>

/* ---------- DOM helpers ---------- */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k==='text')e.textContent=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0)e[k]=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  if(children){
    if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    else e.appendChild(children);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function nowISO(){return new Date().toISOString()}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtMoney(n,currency){
  currency=currency||(State.settings.currency||'USD');
  n=Number(n)||0;
  var sym={USD:'$',EUR:'€',GBP:'£',BRL:'R$',JPY:'¥',CAD:'C$',AUD:'A$',MXN:'MX$',ARS:'AR$',CNY:'¥',INR:'₹'}[currency]||currency+' ';
  var neg=n<0;n=Math.abs(n);
  var s=n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+sym+s;
}
function fmtNum(n){
  n=Number(n)||0;
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function fmtPct(n,dec){
  dec=dec===undefined?1:dec;
  return (Number(n)||0).toFixed(dec)+'%';
}
function parseNum(v){
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function slug(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function dateRange(startISO,endISO){
  var a=new Date(startISO),b=new Date(endISO),out=[];
  while(a<=b){out.push(a.toISOString().slice(0,10));a.setDate(a.getDate()+1)}
  return out;
}
function daysBetween(a,b){
  return Math.round((new Date(b)-new Date(a))/86400000);
}
function addDays(iso,n){
  var d=new Date(iso);d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function monthStart(iso){
  var d=new Date(iso);
  return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);
}
function monthEnd(iso){
  var d=new Date(iso);
  return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);
}
function startOfWeek(iso){
  var d=new Date(iso);
  var day=d.getDay();
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}

/* ---------- Toasts ---------- */
function toast(msg,type){
  type=type||'info';
  var icons={success:'✅',error:'❌',warn:'⚠️',info:'ℹ️'};
  var t=el('div',{class:'toast '+type});
  t.innerHTML='<span class="t-icon">'+(icons[type]||'ℹ️')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t);
  setTimeout(function(){
    t.classList.add('leaving');
    setTimeout(function(){t.remove()},320);
  },3200);
}

/* ---------- Modal ---------- */
function openModal(type,opts){
  opts=opts||{};
  var box=$('modalBox');
  box.className='modal-box'+(opts.wide?' wide':'')+(opts.narrow?' narrow':'');
  $('modalTitle').textContent=opts.title||'';
  $('modalBody').innerHTML=opts.body||'';
  $('modalFoot').innerHTML=opts.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(opts.onOpen)setTimeout(opts.onOpen,10);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,message,onConfirm){
  openModal('confirm',{
    title:title,
    narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.6;font-size:.82rem">'+esc(message)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn danger" id="confirmYes">Confirm</button>',
    onOpen:function(){
      $('confirmYes').onclick=function(){closeModal();onConfirm()};
    }
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal('prompt',{
    title:title,
    narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');
      inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

function saveState(){

  }catch(e){
    console.error('Save failed',e);
    toast('Failed to save data','error');
  }
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var data=JSON.parse(raw);
    Object.keys(State).forEach(function(k){
      if(data[k]!==undefined)State[k]=data[k];
    });
    return true;
  }catch(e){
    console.error('Load failed',e);
    return false;
  }
}
function resetState(){
  if(!confirm('Erase ALL data and start fresh?'))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

  State.activity.unshift({

    type:type,
    description:description,
    meta:meta||{}
  });

}

function notify(title,message,type){
  type=type||'info';
  State.notifications.unshift({
    id:uid(),
    timestamp:nowISO(),
    title:title,
    message:message,
    type:type,
    read:false
  });
  if(State.notifications.length>100)State.notifications=State.notifications.slice(0,100);
  updateNotifBadge();
}
function updateNotifBadge(){
  var unread=State.notifications.filter(function(n){return !n.read}).length;

  }
}

function findClient(id){return State.clients.find(function(c){return c.id===id})}
function findProduct(id){return State.products.find(function(p){return p.id===id})}
function findSupplier(id){return State.suppliers.find(function(s){return s.id===id})}
function findInvoice(id){return State.invoices.find(function(i){return i.id===id})}

function clientRevenue(clientId){
  return State.invoices
    .filter(function(i){return i.clientId===clientId && i.status!=='draft' && i.status!=='cancelled'})
    .reduce(function(s,i){return s+i.total},0);
}
function clientBalance(clientId){
  return State.invoices
    .filter(function(i){return i.clientId===clientId && i.status!=='draft' && i.status!=='cancelled'})
    .reduce(function(s,i){return s+(i.total-i.paid)},0);
}
function productRevenue(productId){
  var total=0;
  State.invoices.forEach(function(inv){
    if(inv.status==='draft'||inv.status==='cancelled')return;
    inv.items.forEach(function(it){
      if(it.productId===productId)total+=it.qty*it.price;
    });
  });
  return total;
}
function productSold(productId){
  var total=0;
  State.invoices.forEach(function(inv){
    if(inv.status==='draft'||inv.status==='cancelled')return;
    inv.items.forEach(function(it){
      if(it.productId===productId)total+=it.qty;
    });
  });
  return total;
}
function invoiceProfit(inv){
  var profit=0;
  inv.items.forEach(function(it){
    var cost=it.cost||(findProduct(it.productId)||{}).cost||0;
    profit+=(it.price-cost)*it.qty;
  });
  return profit;
}
function totalRevenue(startDate,endDate){
  return State.invoices
    .filter(function(i){
      if(i.status==='draft'||i.status==='cancelled')return false;
      if(startDate && i.date<startDate)return false;
      if(endDate && i.date>endDate)return false;
      return true;
    })
    .reduce(function(s,i){return s+i.total},0);
}
function totalExpenses(startDate,endDate){
  return State.expenses
    .filter(function(e){
      if(startDate && e.date<startDate)return false;
      if(endDate && e.date>endDate)return false;
      return true;
    })
    .reduce(function(s,e){return s+e.amount},0);
}
function totalPurchases(startDate,endDate){
  return State.purchases
    .filter(function(p){
      if(startDate && p.date<startDate)return false;
      if(endDate && p.date>endDate)return false;
      return true;
    })
    .reduce(function(s,p){return s+p.total},0);
}
function invoiceStatusBadge(status){
  var map={
    paid:['ok','Paid'],

    partial:['info','Partial'],

/* ================================================================
   CHART UTILITIES (Canvas-based, no dependencies)
   ================================================================ */
function drawLineChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=50,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  // Grid
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.lineWidth=1;
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  var steps=4;
  for(var i=0;i<=steps;i++){
    var y=padT+i*(cH/steps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    var val=max-(i*(max/steps));
    ctx.textAlign='right';
    ctx.fillText(fmtNum(val),padL-6,y+3);
  }
  // Line
  var strokeColor=opts.color||'#6366f1';
  var fillColor=opts.fill||'rgba(99,102,241,0.15)';
  var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
  grad.addColorStop(0,opts.gradTop||'rgba(99,102,241,0.35)');
  grad.addColorStop(1,'rgba(99,102,241,0)');
  ctx.beginPath();
  data.forEach(function(d,i){
    var x=padL+(i/(data.length-1||1))*cW;
    var y=padT+cH-(d.y/max)*cH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+cW,padT+cH);
  ctx.lineTo(padL,padT+cH);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.beginPath();
  data.forEach(function(d,i){
    var x=padL+(i/(data.length-1||1))*cW;
    var y=padT+cH-(d.y/max)*cH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=strokeColor;
  ctx.lineWidth=2;
  ctx.stroke();
  // Points
  data.forEach(function(d,i){
    if(data.length>30 && i%Math.ceil(data.length/15)!==0)return;
    var x=padL+(i/(data.length-1||1))*cW;
    var y=padT+cH-(d.y/max)*cH;
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=strokeColor;ctx.fill();
  });
  // X labels
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.textAlign='center';
  var labelEvery=Math.max(1,Math.floor(data.length/6));
  data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==data.length-1)return;
    var x=padL+(i/(data.length-1||1))*cW;
    ctx.fillText(d.x, x, H-8);
  });
}

function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=50,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  var steps=4;
  for(var i=0;i<=steps;i++){
    var y=padT+i*(cH/steps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.textAlign='right';
    ctx.fillText(fmtNum(max-(i*(max/steps))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7;
  var gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    var g=ctx.createLinearGradient(0,y,0,padT+cH);
    g.addColorStop(0,opts.colors?opts.colors[i%opts.colors.length]:'#6366f1');
    g.addColorStop(1,'rgba(99,102,241,0.4)');
    ctx.fillStyle=opts.colors?opts.colors[i%opts.colors.length]:'#6366f1';
    ctx.beginPath();
    var r=Math.min(4,bw/2);
    ctx.moveTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);
    ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);
    ctx.lineTo(x,padT+cH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    ctx.fillText(d.x, x+bw/2, H-10);
  });
}

function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-30;
  var inner=r*0.62;
  var start=-Math.PI/2;
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'][i%8];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 15px -apple-system, sans-serif';
  ctx.fillText(fmtNum(total),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.label||'Total',cx,cy+18);
}

function deleteClient(id){
  var c=findClient(id);
  if(!c)return;
  var invCount=State.invoices.filter(function(i){return i.clientId===id}).length;
  var msg='Delete client "'+c.name+'"?'+(invCount>0?' They have '+invCount+' invoice(s). Those will remain in your records.':'');
  confirmDialog('Delete Client',msg,function(){
    State.clients=State.clients.filter(function(x){return x.id!==id});
    logActivity('client','Deleted client: '+c.name);
    saveState();renderNav();renderPage();
    toast('Client deleted','success');
  });
}

function exportClientsCSV(){
  var rows=[['Name','Email','Phone','Address','Tax ID','Tags','Invoices','Revenue','Balance']];
  State.clients.forEach(function(c){
    rows.push([c.name,c.email||'',c.phone||'',c.address||'',c.taxId||'',
               (c.tags||[]).join(';'),
               State.invoices.filter(function(i){return i.clientId===c.id}).length,
               clientRevenue(c.id).toFixed(2),
               clientBalance(c.id).toFixed(2)]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='clients-'+today()+'.csv';
  a.click();
  toast('CSV exported','success');
}

      $('fName').focus();
      function updateMargin(){
        var pr=parseNum($('fPrice').value)||0;
        var co=parseNum($('fCost').value)||0;
        var m=pr>0?((pr-co)/pr*100):0;
        $('marginDisplay').textContent='Margin: '+m.toFixed(1)+'%';
        $('marginDisplay').style.color=m>30?'var(--c2)':m>15?'var(--c3)':'var(--c4)';

          sku:$('fSku').value.trim(),
          name:name,
          description:$('fDesc').value.trim(),
          category:$('fCategory').value,
          unit:$('fUnit').value.trim()||'pcs',
          price:parseNum($('fPrice').value),
          cost:parseNum($('fCost').value),
          stock:parseInt($('fStock').value)||0,
          minStock:parseInt($('fMin').value)||0
        };
        if(id){
          Object.assign(p,data);
          logActivity('product','Updated product: '+name);
          toast('Product updated','success');

          data.id=uid();
          data.createdAt=nowISO();
          State.products.push(data);
          logActivity('product','Created product: '+name);
          toast('Product created','success');

function viewProduct(id){
  var p=findProduct(id);
  if(!p){toast('Product not found','error');return}
  var sold=productSold(id);
  var revenue=productRevenue(id);
  var cost=0;
  State.invoices.forEach(function(inv){
    inv.items.forEach(function(it){if(it.productId===id)cost+=(it.cost||p.cost)*it.qty});
  });
  var profit=revenue-cost;
  var body='';
  body+='<div class="grid-4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">';
  body+='<div class="card pad-sm" style="text-align:center"><div style="font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700">Sold</div><div style="font-size:1.3rem;font-weight:800;font-family:var(--mono);margin-top:4px">'+sold+'</div></div>';
  body+='<div class="card pad-sm" style="text-align:center"><div style="font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700">Revenue</div><div style="font-size:1.05rem;font-weight:800;font-family:var(--mono);margin-top:4px;color:var(--c2)">'+fmtMoney(revenue)+'</div></div>';
  body+='<div class="card pad-sm" style="text-align:center"><div style="font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700">Profit</div><div style="font-size:1.05rem;font-weight:800;font-family:var(--mono);margin-top:4px;color:'+(profit>0?'var(--c2)':'var(--c4)')+'">'+fmtMoney(profit)+'</div></div>';
  body+='<div class="card pad-sm" style="text-align:center"><div style="font-size:.6rem;color:var(--tx3);text-transform:uppercase;font-weight:700">In Stock</div><div style="font-size:1.3rem;font-weight:800;font-family:var(--mono);margin-top:4px">'+p.stock+'</div></div>';
  body+='</div>';
  body+='<div class="card pad-sm">';
  if(p.sku)body+='<div class="stat-line"><span class="sl-label">SKU</span><span style="font-family:var(--mono)">'+esc(p.sku)+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Price</span><span style="font-family:var(--mono)">'+fmtMoney(p.price)+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Cost</span><span style="font-family:var(--mono)">'+fmtMoney(p.cost)+'</span></div>';
  var m=p.price>0?((p.price-p.cost)/p.price*100):0;
  body+='<div class="stat-line"><span class="sl-label">Margin</span><span style="font-family:var(--mono);color:var(--c2)">'+fmtPct(m)+'</span></div>';
  if(p.category)body+='<div class="stat-line"><span class="sl-label">Category</span><span>'+esc(p.category)+'</span></div>';
  if(p.description)body+='<div class="stat-line"><span class="sl-label">Description</span><span style="max-width:60%;text-align:right;font-size:.72rem;color:var(--tx2)">'+esc(p.description)+'</span></div>';
  body+='</div>';
  openModal('product-view',{title:p.name,wid:true,body:body});
}

function deleteProduct(id){

function exportProductsCSV(){
  var rows=[['SKU','Name','Category','Unit','Price','Cost','Margin%','Stock','MinStock','Sold','Revenue']];
  State.products.forEach(function(p){
    var m=p.price>0?((p.price-p.cost)/p.price*100):0;
    rows.push([p.sku||'',p.name,p.category||'',p.unit||'',p.price.toFixed(2),p.cost.toFixed(2),
               m.toFixed(1),p.stock,p.minStock,productSold(p.id),productRevenue(p.id).toFixed(2)]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='products-'+today()+'.csv';a.click();
  toast('CSV exported','success');
}

function removeInvoiceItem(i){
  InvoiceEdit.items.splice(i,1);

function invoiceItemProductChange(i,productId){
  var it=InvoiceEdit.items[i];
  if(!productId){
    it.productId='';it.sku='';it.name='';it.price=0;it.cost=0;
  }else{
    var p=findProduct(productId);

function updateInvoiceTotals(){
  var subtotal=InvoiceEdit.items.reduce(function(s,it){return s+it.qty*it.price},0);
  var taxRate=parseNum($('invTaxRate').value);
  var taxAmount=subtotal*taxRate/100;
  var discount=parseNum($('invDiscount').value);
  var total=subtotal+taxAmount-discount;
  $('invTotals').innerHTML=
    '<div class="stat-line"><span class="sl-label">Subtotal</span><span class="sl-value">'+fmtMoney(subtotal)+'</span></div>'+
    '<div class="stat-line"><span class="sl-label">Tax ('+taxRate+'%)</span><span class="sl-value">'+fmtMoney(taxAmount)+'</span></div>'+
    '<div class="stat-line"><span class="sl-label">Discount</span><span class="sl-value">−'+fmtMoney(discount)+'</span></div>'+
    '<div class="stat-line" style="border-top:2px solid var(--bd);margin-top:6px;padding-top:10px"><span class="sl-label" style="font-weight:700;font-size:.85rem">TOTAL</span><span class="sl-value" style="font-size:1.05rem;color:var(--c1)">'+fmtMoney(total)+'</span></div>';
}

function saveInvoice(){
  var clientId=$('invClient').value;
  if(!clientId){toast('Please select a client','error');return}
  if(InvoiceEdit.items.length===0){toast('Add at least one item','error');return}
  if(InvoiceEdit.items.some(function(it){return !it.name||it.qty<=0})){
    toast('Please fill all item fields','error');return;
  }
  var client=findClient(clientId);
  var subtotal=InvoiceEdit.items.reduce(function(s,it){return s+it.qty*it.price},0);
  var taxRate=parseNum($('invTaxRate').value);
  var taxAmount=subtotal*taxRate/100;
  var discount=parseNum($('invDiscount').value);
  var total=subtotal+taxAmount-discount;

  if(InvoiceEdit.id){
    var inv=findInvoice(InvoiceEdit.id);
    var oldItems=deepClone(inv.items);
    Object.assign(inv,{
      clientId:clientId,
      clientName:client?client.name:'',
      number:$('invNumber').value.trim(),
      date:$('invDate').value,
      dueDate:$('invDue').value,
      items:deepClone(InvoiceEdit.items),
      subtotal:subtotal,
      taxRate:taxRate,
      taxAmount:taxAmount,
      discount:discount,
      total:total,
      status:$('invStatus').value,
      notes:$('invNotes').value.trim()
    });
    logActivity('invoice','Updated invoice: '+inv.number);
    toast('Invoice updated','success');
  }else{
    var num=$('invNumber').value.trim();
    if(!num)num=State.settings.invoicePrefix+State.settings.nextInvoiceNumber;
    // Update stock
    InvoiceEdit.items.forEach(function(it){
      if(it.productId){
        var p=findProduct(it.productId);
        if(p)p.stock-=it.qty;
      }
    });
    var ninv={
      id:uid(),
      number:num,
      clientId:clientId,
      clientName:client?client.name:'',
      date:$('invDate').value,
      dueDate:$('invDue').value,
      items:deepClone(InvoiceEdit.items),
      subtotal:subtotal,
      taxRate:taxRate,
      taxAmount:taxAmount,
      discount:discount,
      total:total,
      paid:0,
      status:$('invStatus').value,
      notes:$('invNotes').value.trim(),
      createdAt:nowISO()
    };
    State.invoices.push(ninv);
    State.settings.nextInvoiceNumber=(State.settings.nextInvoiceNumber||1001)+1;
    logActivity('invoice','Created invoice: '+num);
    notify('Invoice created',num+' for '+fmtMoney(total),'success');
    toast('Invoice created','success');
  }
  saveState();closeModal();renderNav();renderPage();
}

function markInvoicePaid(id){
  var inv=findInvoice(id);
  if(!inv)return;
  inv.paid=inv.total;
  inv.status='paid';
  logActivity('invoice','Marked invoice '+inv.number+' as paid');
  notify('Invoice paid',inv.number+' · '+fmtMoney(inv.total),'success');
  saveState();closeModal();renderNav();renderPage();
  toast('Marked as paid','success');
}

function recordPayment(id){
  var inv=findInvoice(id);
  if(!inv)return;
  var balance=inv.total-inv.paid;
  promptDialog('Record Payment','Amount received (balance: '+fmtMoney(balance)+')',balance.toFixed(2),function(v){
    var amt=parseNum(v);
    if(amt<=0)return;
    inv.paid=Math.min(inv.total,inv.paid+amt);
    if(inv.paid>=inv.total)inv.status='paid';
    else if(inv.paid>0)inv.status='partial';
    logActivity('payment','Payment of '+fmtMoney(amt)+' on '+inv.number);
    notify('Payment recorded',fmtMoney(amt)+' on '+inv.number,'success');
    saveState();closeModal();renderNav();renderPage();
    toast('Payment recorded','success');
  },'number');
}

function exportInvoicesCSV(){
  var rows=[['Number','Client','Date','Due','Total','Paid','Balance','Status']];
  State.invoices.forEach(function(i){
    rows.push([i.number,i.clientName||'',i.date,i.dueDate,i.total.toFixed(2),i.paid.toFixed(2),(i.total-i.paid).toFixed(2),i.status]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');

function poItemProduct(i,id){
  var it=PurchaseEdit.items[i];
  var p=findProduct(id);
  if(p){it.productId=p.id;it.sku=p.sku;it.name=p.name;it.cost=p.cost}
  renderPOItems();updatePOTotals();
}
function poItemQty(i,v){PurchaseEdit.items[i].qty=Math.max(1,parseInt(v)||1);updatePOTotals()}
function poItemCost(i,v){PurchaseEdit.items[i].cost=parseNum(v);updatePOTotals()}
function updatePOTotals(){
  var sub=PurchaseEdit.items.reduce(function(s,it){return s+it.qty*it.cost},0);
  var tax=sub*0.1;
  $('poTotals').innerHTML=
    '<div class="stat-line"><span class="sl-label">Subtotal</span><span class="sl-value">'+fmtMoney(sub)+'</span></div>'+
    '<div class="stat-line"><span class="sl-label">Tax (10%)</span><span class="sl-value">'+fmtMoney(tax)+'</span></div>'+
    '<div class="stat-line" style="border-top:2px solid var(--bd);margin-top:6px;padding-top:10px"><span class="sl-label" style="font-weight:700">TOTAL</span><span class="sl-value" style="font-size:1.05rem;color:var(--c1)">'+fmtMoney(sub+tax)+'</span></div>';
}
function savePurchase(){
  var sid=$('poSup').value;
  if(!sid){toast('Select supplier','error');return}
  if(PurchaseEdit.items.length===0){toast('Add items','error');return}
  var sup=findSupplier(sid);
  var sub=PurchaseEdit.items.reduce(function(s,it){return s+it.qty*it.cost},0);
  var tax=sub*0.1;
  // Add stock
  PurchaseEdit.items.forEach(function(it){
    if(it.productId){
      var p=findProduct(it.productId);
      if(p){p.stock+=it.qty;p.cost=it.cost}
    }
  });
  State.purchases.push({
    id:uid(),
    number:$('poNum').value.trim(),
    supplierId:sid,
    supplierName:sup?sup.name:'',
    date:$('poDate').value,
    items:deepClone(PurchaseEdit.items),
    subtotal:sub,
    taxAmount:tax,
    total:sub+tax,
    status:'received',
    createdAt:nowISO()
  });
  logActivity('purchase','Created PO for '+sup.name);
  toast('Purchase order created','success');
  saveState();closeModal();renderPage();
}

  var body='<div style="background:var(--panel2);padding:20px;border-radius:var(--rxs)">';

}

var ExpensesFilter={q:'',category:'',from:'',to:''};

function render_expenses(){
  var list=State.expenses.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  if(ExpensesFilter.category)list=list.filter(function(e){return e.category===ExpensesFilter.category});
  if(ExpensesFilter.from)list=list.filter(function(e){return e.date>=ExpensesFilter.from});
  if(ExpensesFilter.to)list=list.filter(function(e){return e.date<=ExpensesFilter.to});
  if(ExpensesFilter.q){
    var q=ExpensesFilter.q.toLowerCase();
    list=list.filter(function(e){return (e.description||'').toLowerCase().indexOf(q)>-1});
  }
  var total=list.reduce(function(s,e){return s+e.amount},0);

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">Expenses</div><div class="page-desc">'+list.length+' expenses · '+fmtMoney(total)+' total</div></div>';

  html+='<div class="card pad-sm" style="margin-bottom:14px">';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';

  html+='</select>';
  html+='<input type="date" value="'+ExpensesFilter.from+'" onchange="ExpensesFilter.from=this.value;renderPage()" style="padding:8px 12px;border-radius:var(--rxs);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:.78rem">';
  html+='<input type="date" value="'+ExpensesFilter.to+'" onchange="ExpensesFilter.to=this.value;renderPage()" style="padding:8px 12px;border-radius:var(--rxs);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:.78rem">';
  html+='<button class="btn sm" onclick="ExpensesFilter={q:\'\',category:\'\',from:\'\',to:\'\'};renderPage()">Clear</button>';
  html+='</div></div>';

  if(list.length===0){
    html+='<div class="empty"><span class="icon">💸</span><h4>No expenses recorded</h4></div>';
    return html;

  html+='<div class="table-wrap"><div class="table-scroll"><table>';
  html+='<thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Method</th><th class="num">Amount</th><th style="width:80px"></th></tr></thead><tbody>';
  list.forEach(function(e){
    html+='<tr>';
    html+='<td>'+fmtDate(e.date)+'</td>';
    html+='<td>'+esc(e.description||'—')+'</td>';
    html+='<td><span class="badge neutral">'+esc(e.category||'—')+'</span></td>';
    html+='<td style="font-size:.72rem;color:var(--tx3)">'+esc(e.method||'')+'</td>';
    html+='<td class="num" style="color:var(--c4)">−'+fmtMoney(e.amount)+'</td>';

  });

  return html;

function report_pl(from,to){
  var revenue=totalRevenue(from,to);
  var cogs=0;
  State.invoices.filter(function(i){
    if(i.status==='draft'||i.status==='cancelled')return false;
    return i.date>=from&&i.date<=to;
  }).forEach(function(inv){
    inv.items.forEach(function(it){cogs+=(it.cost||0)*it.qty});
  });
  var grossProfit=revenue-cogs;
  var expenses=totalExpenses(from,to);
  var purchases=totalPurchases(from,to);
  var netProfit=grossProfit-expenses;

  var html='';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi c2"><div class="kpi-label">Revenue</div><div class="kpi-value">'+fmtMoney(revenue)+'</div></div>';
  html+='<div class="kpi c3"><div class="kpi-label">COGS</div><div class="kpi-value">'+fmtMoney(cogs)+'</div></div>';
  html+='<div class="kpi"><div class="kpi-label">Gross Profit</div><div class="kpi-value">'+fmtMoney(grossProfit)+'</div><div class="kpi-delta up">'+(revenue>0?fmtPct(grossProfit/revenue*100):'0%')+'</div></div>';
  html+='<div class="kpi c4"><div class="kpi-label">Expenses</div><div class="kpi-value">'+fmtMoney(expenses)+'</div></div>';
  html+='<div class="kpi '+(netProfit>=0?'c2':'c4')+'"><div class="kpi-label">Net Profit</div><div class="kpi-value">'+fmtMoney(netProfit)+'</div><div class="kpi-delta '+(netProfit>=0?'up':'down')+'">'+(revenue>0?fmtPct(netProfit/revenue*100):'0%')+'</div></div>';
  html+='</div>';

  html+='<div class="grid-2" style="margin-top:16px">';
  html+='<div class="chart-box"><h3>Revenue vs Expenses</h3><canvas class="chart-canvas" id="plChart1"></canvas></div>';
  html+='<div class="chart-box"><h3>Monthly Trend</h3><canvas class="chart-canvas" id="plChart2"></canvas></div>';
  html+='</div>';

  html+='<div class="card pad-lg" style="margin-top:16px">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px">Profit & Loss Statement</h3>';
  html+='<div class="stat-line" style="padding:10px 0"><span class="sl-label" style="font-weight:700">Revenue</span><span class="sl-value pos" style="font-size:1rem">'+fmtMoney(revenue)+'</span></div>';
  html+='<div class="stat-line" style="padding:8px 0"><span class="sl-label" style="padding-left:16px">Cost of Goods Sold</span><span class="sl-value">−'+fmtMoney(cogs)+'</span></div>';
  html+='<div class="stat-line" style="padding:10px 0;border-top:1px solid var(--bd)"><span class="sl-label" style="font-weight:700">Gross Profit</span><span class="sl-value '+(grossProfit>=0?'pos':'neg')+'" style="font-weight:700">'+fmtMoney(grossProfit)+'</span></div>';
  html+='<div class="stat-line" style="padding:8px 0"><span class="sl-label" style="padding-left:16px">Operating Expenses</span><span class="sl-value">−'+fmtMoney(expenses)+'</span></div>';
  html+='<div class="stat-line" style="padding:10px 0;border-top:2px solid var(--bd);margin-top:8px"><span class="sl-label" style="font-weight:700;font-size:.9rem">NET PROFIT</span><span class="sl-value '+(netProfit>=0?'pos':'neg')+'" style="font-weight:800;font-size:1.05rem">'+fmtMoney(netProfit)+'</span></div>';
  html+='</div>';
  return html;
}

function after_reports(){
  if(ReportsConfig.type==='pl'){
    var c1=$('plChart1');
    if(c1){
      var revenue=totalRevenue(ReportsConfig.from,ReportsConfig.to);
      var expenses=totalExpenses(ReportsConfig.from,ReportsConfig.to);
      drawBarChart(c1,[{x:'Revenue',y:revenue},{x:'Expenses',y:expenses}],{colors:['#10b981','#ef4444']});
    }
    var c2=$('plChart2');
    if(c2){
      var months={};
      for(var i=5;i>=0;i--){
        var d=new Date();
        d.setMonth(d.getMonth()-i);
        var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        months[key]={rev:0,exp:0};
      }
      State.invoices.forEach(function(inv){
        if(inv.status==='draft'||inv.status==='cancelled')return;
        var k=inv.date.slice(0,7);
        if(months[k])months[k].rev+=inv.total;
      });
      State.expenses.forEach(function(e){
        var k=e.date.slice(0,7);
        if(months[k])months[k].exp+=e.amount;
      });
      var arr=Object.keys(months).sort().map(function(k){
        var m=new Date(k+'-01');
        return {x:m.toLocaleString('en-US',{month:'short'}),y:months[k].rev-months[k].exp};
      });
      drawBarChart(c2,arr,{colors:['#6366f1']});
    }
  }
  if(ReportsConfig.type==='sales'){
    var c=$('salesChart');
    if(c){
      var byDay={};
      State.invoices.filter(function(i){
        return i.status!=='draft'&&i.status!=='cancelled'&&i.date>=ReportsConfig.from&&i.date<=ReportsConfig.to;
      }).forEach(function(i){
        byDay[i.date]=(byDay[i.date]||0)+i.total;
      });
      var arr=Object.keys(byDay).sort().map(function(k){return {x:k.slice(5),y:byDay[k]}});
      drawLineChart(c,arr,{color:'#6366f1'});
    }
  }
  if(ReportsConfig.type==='products'){
    var c2=$('prodReportChart');
    if(c2){
      var arr=State.products.map(function(p){return {x:p.sku||p.name.slice(0,8),y:productRevenue(p.id)}})
        .sort(function(a,b){return b.y-a.y}).slice(0,10);
      drawBarChart(c2,arr,{colors:['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ec4899','#84cc16','#ef4444','#3b82f6','#f97316']});
    }
  }
  if(ReportsConfig.type==='clients'){
    var c3=$('clientReportChart');
    if(c3){
      var arr=State.clients.map(function(cl){return {x:cl.name.slice(0,10),y:clientRevenue(cl.id)}})
        .sort(function(a,b){return b.y-a.y}).slice(0,8);
      drawBarChart(c3,arr,{colors:['#6366f1','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ec4899','#84cc16','#ef4444']});
    }
  }
  if(ReportsConfig.type==='expenses'){
    var c4=$('expReportChart');
    if(c4){
      var byCat={};
      State.expenses.filter(function(e){return e.date>=ReportsConfig.from&&e.date<=ReportsConfig.to}).forEach(function(e){
        byCat[e.category]=(byCat[e.category]||0)+e.amount;
      });
      var colors=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'];
      var arr=Object.keys(byCat).map(function(k,i){return {x:k,y:byCat[k],color:colors[i%colors.length]}});
      drawDonutChart(c4,arr,{label:'Total'});
    }
  }
}

function report_sales(from,to){
  var list=State.invoices.filter(function(i){
    return i.status!=='draft'&&i.status!=='cancelled'&&i.date>=from&&i.date<=to;
  }).sort(function(a,b){return b.date.localeCompare(a.date)});
  var total=list.reduce(function(s,i){return s+i.total},0);
  var paid=list.reduce(function(s,i){return s+i.paid},0);
  var html='';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-label">Invoices</div><div class="kpi-value">'+list.length+'</div></div>';
  html+='<div class="kpi c2"><div class="kpi-label">Total Sales</div><div class="kpi-value">'+fmtMoney(total)+'</div></div>';
  html+='<div class="kpi c3"><div class="kpi-label">Collected</div><div class="kpi-value">'+fmtMoney(paid)+'</div></div>';
  html+='<div class="kpi c4"><div class="kpi-label">Outstanding</div><div class="kpi-value">'+fmtMoney(total-paid)+'</div></div>';
  html+='</div>';
  html+='<div class="chart-box" style="margin-top:16px"><h3>Sales over time</h3><canvas class="chart-canvas" id="salesChart"></canvas></div>';
  html+='<div class="table-wrap" style="margin-top:16px"><div class="table-head"><h3>Invoices in range</h3></div><div class="table-scroll"><table>';
  html+='<thead><tr><th>Invoice</th><th>Client</th><th>Date</th><th class="num">Total</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>';
  list.slice(0,100).forEach(function(i){
    html+='<tr><td>'+esc(i.number)+'</td><td>'+esc(i.clientName||'')+'</td><td>'+fmtDate(i.date)+'</td><td class="num">'+fmtMoney(i.total)+'</td><td class="num">'+fmtMoney(i.total-i.paid)+'</td><td>'+invoiceStatusBadge(i.status)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function report_products(from,to){
  var products=State.products.map(function(p){
    var sold=0,revenue=0,cost=0;
    State.invoices.filter(function(i){
      return i.status!=='draft'&&i.status!=='cancelled'&&i.date>=from&&i.date<=to;
    }).forEach(function(inv){
      inv.items.forEach(function(it){
        if(it.productId===p.id){sold+=it.qty;revenue+=it.qty*it.price;cost+=(it.cost||p.cost)*it.qty}
      });
    });
    return {p:p,sold:sold,revenue:revenue,profit:revenue-cost};
  }).sort(function(a,b){return b.revenue-a.revenue});
  var html='';
  html+='<div class="chart-box" style="margin-bottom:16px"><h3>Top 10 products by revenue</h3><canvas class="chart-canvas" id="prodReportChart"></canvas></div>';
  html+='<div class="table-wrap"><div class="table-scroll"><table>';
  html+='<thead><tr><th>Product</th><th>SKU</th><th class="num">Sold</th><th class="num">Revenue</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
  products.forEach(function(r){
    var margin=r.revenue>0?(r.profit/r.revenue*100):0;
    html+='<tr><td>'+esc(r.p.name)+'</td><td style="font-family:var(--mono);font-size:.7rem">'+esc(r.p.sku||'')+'</td><td class="num">'+r.sold+'</td><td class="num">'+fmtMoney(r.revenue)+'</td><td class="num" style="color:var(--c2)">'+fmtMoney(r.profit)+'</td><td class="num">'+fmtPct(margin)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function report_clients(from,to){
  var rows=State.clients.map(function(c){
    var invoices=State.invoices.filter(function(i){
      return i.clientId===c.id&&i.status!=='draft'&&i.status!=='cancelled'&&i.date>=from&&i.date<=to;
    });
    var total=invoices.reduce(function(s,i){return s+i.total},0);
    var paid=invoices.reduce(function(s,i){return s+i.paid},0);
    return {c:c,count:invoices.length,total:total,balance:total-paid};
  }).sort(function(a,b){return b.total-a.total});
  var html='';
  html+='<div class="chart-box" style="margin-bottom:16px"><h3>Top clients by revenue</h3><canvas class="chart-canvas" id="clientReportChart"></canvas></div>';
  html+='<div class="table-wrap"><div class="table-scroll"><table>';
  html+='<thead><tr><th>Client</th><th class="num">Invoices</th><th class="num">Revenue</th><th class="num">Outstanding</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html+='<tr><td>'+esc(r.c.name)+'</td><td class="num">'+r.count+'</td><td class="num">'+fmtMoney(r.total)+'</td><td class="num" style="color:'+(r.balance>0?'var(--c3)':'var(--tx3)')+'">'+fmtMoney(r.balance)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function report_expenses(from,to){
  var list=State.expenses.filter(function(e){return e.date>=from&&e.date<=to});
  var total=list.reduce(function(s,e){return s+e.amount},0);
  var byCat={};
  list.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+e.amount});
  var html='';
  html+='<div class="kpi-grid"><div class="kpi c4"><div class="kpi-label">Total Expenses</div><div class="kpi-value">'+fmtMoney(total)+'</div></div><div class="kpi"><div class="kpi-label">Records</div><div class="kpi-value">'+list.length+'</div></div><div class="kpi c3"><div class="kpi-label">Categories</div><div class="kpi-value">'+Object.keys(byCat).length+'</div></div></div>';
  html+='<div class="grid-2" style="margin-top:16px">';
  html+='<div class="chart-box"><h3>By category</h3><canvas class="chart-canvas" id="expReportChart"></canvas></div>';
  html+='<div class="card pad-lg"><h3 style="font-size:.85rem;margin-bottom:12px">Breakdown</h3>';
  Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).forEach(function(k){
    var pct=total>0?byCat[k]/total*100:0;
    html+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:4px"><span>'+esc(k)+'</span><span style="font-family:var(--mono)">'+fmtMoney(byCat[k])+' · '+fmtPct(pct)+'</span></div>';
    html+='<div style="height:5px;background:var(--panel3);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--g1)"></div></div></div>';
  });
  html+='</div></div>';
  return html;
}

function report_tax(from,to){
  var invoices=State.invoices.filter(function(i){
    return i.status!=='draft'&&i.status!=='cancelled'&&i.date>=from&&i.date<=to;
  });
  var taxable=invoices.reduce(function(s,i){return s+i.subtotal},0);
  var collected=invoices.reduce(function(s,i){return s+i.taxAmount},0);
  var purchases=State.purchases.filter(function(p){return p.date>=from&&p.date<=to});
  var paid=0;
  var html='';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-label">Taxable Sales</div><div class="kpi-value">'+fmtMoney(taxable)+'</div></div>';
  html+='<div class="kpi c2"><div class="kpi-label">Tax Collected</div><div class="kpi-value">'+fmtMoney(collected)+'</div></div>';
  html+='<div class="kpi c4"><div class="kpi-label">Tax Paid on Purchases</div><div class="kpi-value">'+fmtMoney(purchases.reduce(function(s,p){return s+p.taxAmount},0))+'</div></div>';
  html+='<div class="kpi c3"><div class="kpi-label">Net Tax Owed</div><div class="kpi-value">'+fmtMoney(collected-purchases.reduce(function(s,p){return s+p.taxAmount},0))+'</div></div>';
  html+='</div>';
  html+='<div class="card pad-lg" style="margin-top:16px">';
  html+='<h3 style="font-size:.85rem;margin-bottom:12px">Tax Summary</h3>';
  html+='<div class="stat-line"><span class="sl-label">Sales tax collected</span><span class="sl-value pos">'+fmtMoney(collected)+'</span></div>';
  html+='<div class="stat-line"><span class="sl-label">Tax on purchases</span><span class="sl-value neg">−'+fmtMoney(purchases.reduce(function(s,p){return s+p.taxAmount},0))+'</span></div>';
  html+='<div class="stat-line" style="border-top:2px solid var(--bd);margin-top:8px;padding-top:12px"><span class="sl-label" style="font-weight:700">Net tax liability</span><span class="sl-value" style="font-size:1.05rem">'+fmtMoney(collected-purchases.reduce(function(s,p){return s+p.taxAmount},0))+'</span></div>';
  html+='</div>';
  return html;
}

function report_inventory(){
  var totalCost=State.products.reduce(function(s,p){return s+p.stock*p.cost},0);
  var totalRetail=State.products.reduce(function(s,p){return s+p.stock*p.price},0);
  var totalUnits=State.products.reduce(function(s,p){return s+p.stock},0);
  var low=State.products.filter(function(p){return p.stock<=p.minStock});

  html+='<div class="kpi c3"><div class="kpi-label">Cost Value</div><div class="kpi-value">'+fmtMoney(totalCost)+'</div></div>';
  html+='<div class="kpi c2"><div class="kpi-label">Retail Value</div><div class="kpi-value">'+fmtMoney(totalRetail)+'</div></div>';
  html+='<div class="kpi c4"><div class="kpi-label">Low Stock</div><div class="kpi-value">'+low.length+'</div></div>';
  html+='</div>';

  });
  html+='</tbody></table></div></div>';
  return html;

/* ================================================================
   CASH FLOW
   ================================================================ */
var CashConfig={days:60};

function render_cashflow(){
  var start=addDays(today(),-CashConfig.days+1);
  var events=[];
  State.invoices.forEach(function(i){
    if(i.status==='draft'||i.status==='cancelled')return;
    if(i.date<start)return;
    events.push({date:i.date,type:'in',label:'Invoice '+i.number,amount:i.paid,ref:i.id});
    if(i.paid<i.total){
      events.push({date:i.dueDate,type:'in-pending',label:'Expected: '+i.number,amount:i.total-i.paid,ref:i.id});
    }
  });
  State.expenses.forEach(function(e){
    if(e.date<start)return;
    events.push({date:e.date,type:'out',label:'Expense: '+(e.description||e.category),amount:e.amount,ref:e.id});
  });
  State.purchases.forEach(function(p){
    if(p.date<start)return;
    events.push({date:p.date,type:'out',label:'Purchase '+p.number,amount:p.total,ref:p.id});
  });
  events.sort(function(a,b){return b.date.localeCompare(a.date)});
  var inflow=events.filter(function(e){return e.type==='in'}).reduce(function(s,e){return s+e.amount},0);
  var pending=events.filter(function(e){return e.type==='in-pending'}).reduce(function(s,e){return s+e.amount},0);
  var outflow=events.filter(function(e){return e.type==='out'}).reduce(function(s,e){return s+e.amount},0);

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">Cash Flow</div><div class="page-desc">Last '+CashConfig.days+' days</div></div>';
  html+='<div class="chips">';
  [30,60,90,180].forEach(function(d){
    html+='<span class="chip'+(CashConfig.days===d?' active':'')+'" onclick="CashConfig.days='+d+';renderPage()">'+d+' days</span>';
  });
  html+='</div></div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi c2"><div class="kpi-label">Cash In</div><div class="kpi-value">'+fmtMoney(inflow)+'</div></div>';
  html+='<div class="kpi c4"><div class="kpi-label">Cash Out</div><div class="kpi-value">'+fmtMoney(outflow)+'</div></div>';
  html+='<div class="kpi"><div class="kpi-label">Net Flow</div><div class="kpi-value">'+fmtMoney(inflow-outflow)+'</div></div>';
  html+='<div class="kpi c3"><div class="kpi-label">Pending In</div><div class="kpi-value">'+fmtMoney(pending)+'</div></div>';
  html+='</div>';

  html+='<div class="chart-box" style="margin-bottom:16px"><h3>Daily net cash flow</h3><canvas class="chart-canvas" id="cashChart"></canvas></div>';

  html+='<div class="table-wrap"><div class="table-head"><h3>Transactions</h3></div><div class="table-scroll"><table>';
  html+='<thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>';
  events.slice(0,150).forEach(function(e){
    var color=e.type==='out'?'var(--c4)':(e.type==='in-pending'?'var(--c3)':'var(--c2)');
    var sign=e.type==='out'?'−':'+';
    html+='<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.label)+'</td><td class="num" style="color:'+color+';font-weight:600">'+sign+fmtMoney(e.amount)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function after_cashflow(){
  var c=$('cashChart');
  if(!c)return;
  var start=addDays(today(),-CashConfig.days+1);
  var byDay={};
  var d=start;
  while(d<=today()){byDay[d]=0;d=addDays(d,1)}
  State.invoices.forEach(function(i){
    if(i.status==='draft'||i.status==='cancelled')return;
    if(byDay[i.date]!==undefined)byDay[i.date]+=i.paid;
  });
  State.expenses.forEach(function(e){
    if(byDay[e.date]!==undefined)byDay[e.date]-=e.amount;
  });
  State.purchases.forEach(function(p){
    if(byDay[p.date]!==undefined)byDay[p.date]-=p.total;
  });
  var arr=Object.keys(byDay).sort().map(function(k){return {x:k.slice(5),y:byDay[k]}});
  drawLineChart(c,arr,{color:'#10b981'});
}

   CALENDAR
   ================================================================ */
var CalState={year:new Date().getFullYear(),month:new Date().getMonth()};

function render_calendar(){
  var y=CalState.year,m=CalState.month;
  var first=new Date(y,m,1);
  var startDay=first.getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var prevDays=new Date(y,m,0).getDate();

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">Calendar</div><div class="page-desc">Upcoming events and schedule</div></div>';
  html+='<div style="display:flex;gap:8px"><button class="btn" onclick="CalState.month--;if(CalState.month<0){CalState.month=11;CalState.year--}renderPage()">←</button>';
  html+='<button class="btn primary" onclick="openNewEvent()">➕ Add Event</button>';
  html+='<button class="btn" onclick="CalState.month++;if(CalState.month>11){CalState.month=0;CalState.year++}renderPage()">→</button></div>';
  html+='</div>';

  html+='<div class="card">';
  html+='<div style="text-align:center;font-size:1.1rem;font-weight:700;margin-bottom:16px">'+first.toLocaleString('en-US',{month:'long',year:'numeric'})+'</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){
    html+='<div style="text-align:center;font-size:.65rem;font-weight:700;color:var(--tx3);text-transform:uppercase;padding:6px 0">'+d+'</div>';
  });
  var cells=[];
  for(var i=startDay-1;i>=0;i--)cells.push({day:prevDays-i,other:true});
  for(var j=1;j<=daysInMonth;j++)cells.push({day:j,other:false});
  while(cells.length%7!==0)cells.push({day:cells.length-startDay-daysInMonth+1,other:true});

  cells.forEach(function(c){
    var isToday=!c.other&&c.day===new Date().getDate()&&m===new Date().getMonth()&&y===new Date().getFullYear();
    var dateStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(c.day).padStart(2,'0');
    var dayEvents=State.events.filter(function(e){return e.date===dateStr});
    html+='<div style="min-height:80px;padding:8px;background:'+(c.other?'var(--panel2)':(isToday?'var(--g1)':'var(--panel2)'))+';border-radius:var(--rxs);color:'+(isToday?'#fff':'var(--tx)')+';opacity:'+(c.other?'0.4':'1')+';cursor:pointer;transition:var(--t)" onclick="openNewEventOn(\''+dateStr+'\')">';
    html+='<div style="font-size:.75rem;font-weight:700;margin-bottom:4px">'+c.day+'</div>';
    dayEvents.slice(0,2).forEach(function(e){
      html+='<div style="font-size:.6rem;padding:2px 4px;background:rgba(255,255,255,.15);border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(e.title)+'</div>';
    });
    if(dayEvents.length>2)html+='<div style="font-size:.55rem;opacity:.7">+'+(dayEvents.length-2)+' more</div>';
    html+='</div>';
  });
  html+='</div></div>';

  var upcoming=State.events.filter(function(e){return e.date>=today()}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,10);
  html+='<div class="card pad-lg" style="margin-top:16px">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px">📅 Upcoming Events</h3>';
  if(upcoming.length===0){
    html+='<div style="color:var(--tx3);font-size:.78rem;padding:14px;text-align:center">No upcoming events</div>';
  }else{
    upcoming.forEach(function(e){
      html+='<div style="padding:10px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px;cursor:pointer" onclick="editEvent(\''+e.id+'\')">';
      html+='<div><div style="font-weight:600;font-size:.78rem">'+esc(e.title)+'</div>';
      html+='<div style="font-size:.68rem;color:var(--tx3);margin-top:2px">'+fmtDate(e.date)+(e.time?' · '+e.time:'')+' · '+esc(e.type||'event')+'</div></div>';
      html+='<div><span class="badge info">'+esc(e.type||'event')+'</span></div>';
      html+='</div>';
    });
  }
  html+='</div>';
  return html;
}

function openNewEvent(){openNewEventOn(today())}
function openNewEventOn(date){
  editEventOn(null,date);
}
function editEvent(id){
  var e=State.events.find(function(x){return x.id===id});
  if(!e)return;
  editEventOn(e,e.date);
}
function editEventOn(e,date){
  var isNew=!e;
  if(isNew)e={title:'',date:date||today(),time:'09:00',type:'meeting',notes:''};
  openModal('event',{
    title:isNew?'New Event':'Edit Event',
    narrow:true,
    body:'<div class="form">'+
         '<div class="field"><label>Title <span class="req">*</span></label><input type="text" id="evTitle" value="'+esc(e.title)+'"></div>'+
         '<div class="form-row"><div class="field"><label>Date</label><input type="date" id="evDate" value="'+e.date+'"></div>'+
         '<div class="field"><label>Time</label><input type="time" id="evTime" value="'+(e.time||'09:00')+'"></div></div>'+
         '<div class="field"><label>Type</label><select id="evType">'+
         ['meeting','call','task','reminder','deadline','other'].map(function(t){return '<option value="'+t+'"'+(e.type===t?' selected':'')+'>'+t+'</option>'}).join('')+
         '</select></div>'+
         '<div class="field"><label>Notes</label><textarea id="evNotes" rows="2">'+esc(e.notes||'')+'</textarea></div>'+
         '</div>',
    foot:(isNew?'':'<button class="btn danger" onclick="deleteEvent(\''+e.id+'\')">Delete</button>')+
         '<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveEv">Save</button>',
    onOpen:function(){
      $('evTitle').focus();
      $('saveEv').onclick=function(){
        var title=$('evTitle').value.trim();
        if(!title){toast('Title required','error');return}
        var data={title:title,date:$('evDate').value,time:$('evTime').value,type:$('evType').value,notes:$('evNotes').value.trim()};
        if(e.id)Object.assign(e,data);
        else{data.id=uid();State.events.push(data)}
        saveState();closeModal();renderPage();
        toast('Event saved','success');
      };
    }
  });
}
function deleteEvent(id){
  State.events=State.events.filter(function(x){return x.id!==id});
  saveState();closeModal();renderPage();
  toast('Event deleted','success');
}

   TASKS
   ================================================================ */
function render_tasks(){
  var active=State.tasks.filter(function(t){return !t.done});
  var done=State.tasks.filter(function(t){return t.done});
  active.sort(function(a,b){return (a.due||'').localeCompare(b.due||'')});
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">Tasks</div><div class="page-desc">'+active.length+' active · '+done.length+' completed</div></div>';
  html+='<button class="btn primary" onclick="openNewTask()">➕ New Task</button>';
  html+='</div>';

  html+='<div class="card">';
  html+='<h3 style="font-size:.85rem;margin-bottom:10px">Active</h3>';
  if(active.length===0){
    html+='<div style="color:var(--tx3);font-size:.78rem;padding:20px;text-align:center">🎉 All tasks complete!</div>';
  }else{
    active.forEach(function(t){
      var overdue=t.due&&t.due<today();
      html+='<div style="padding:10px 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px">';
      html+='<input type="checkbox" onchange="toggleTask(\''+t.id+'\')" style="width:18px;height:18px;cursor:pointer">';
      html+='<div style="flex:1;min-width:0">';
      html+='<div style="font-size:.8rem;font-weight:500">'+esc(t.title)+'</div>';
      if(t.due)html+='<div style="font-size:.65rem;color:'+(overdue?'var(--c4)':'var(--tx3)')+';margin-top:2px">'+(overdue?'⚠️ Overdue: ':'Due: ')+fmtDate(t.due)+'</div>';
      html+='</div>';

  html+='</div>';

  if(done.length>0){
    html+='<div class="card" style="margin-top:14px;opacity:.7">';

    });

  }
  return html;
}

function after_tools(){
  calcLoan();calcMarkup();calcBreakEven();calcCurrency();calcTax();calcPercent();
}
function calcLoan(){
  var P=parseNum($('lnAmt').value);
  var r=parseNum($('lnRate').value)/100/12;
  var n=parseInt($('lnTerm').value)||1;
  var M=r>0?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;
  $('lnResult').textContent=fmtMoney(M)+'/mo · total '+fmtMoney(M*n);
}
function calcMarkup(){
  var c=parseNum($('mkCost').value),p=parseNum($('mkPrice').value);
  var margin=p>0?((p-c)/p*100):0;
  var markup=c>0?((p-c)/c*100):0;
  var profit=p-c;
  $('mkResult').innerHTML='Gross Profit: <strong style="color:var(--c2)">'+fmtMoney(profit)+'</strong><br>Margin: <strong>'+margin.toFixed(2)+'%</strong><br>Markup: <strong>'+markup.toFixed(2)+'%</strong>';
}
function calcBreakEven(){
  var f=parseNum($('beFixed').value),p=parseNum($('bePrice').value),v=parseNum($('beVar').value);
  var cm=p-v;
  var units=cm>0?Math.ceil(f/cm):0;
  var revenue=units*p;
  $('beResult').innerHTML='Contribution margin: <strong>'+fmtMoney(cm)+'/unit</strong><br>Break-even units: <strong style="color:var(--c2)">'+units+'</strong><br>Break-even revenue: <strong>'+fmtMoney(revenue)+'</strong>';
}
function calcCurrency(){
  var rates={USD:1,EUR:0.92,GBP:0.79,BRL:5.02};
  var amt=parseNum($('ccAmount').value);
  var from=$('ccFrom').value;
  var usd=amt/rates[from];
  var parts=[];
  Object.keys(rates).forEach(function(k){
    if(k===from)return;
    parts.push(k+': '+fmtNum(usd*rates[k]));
  });
  $('ccResult').textContent=parts.join(' · ');
}
function calcTax(){
  var a=parseNum($('tcAmt').value),r=parseNum($('tcRate').value);
  var t=a*r/100;
  $('tcResult').innerHTML='Tax amount: <strong style="color:var(--c2)">'+fmtMoney(t)+'</strong><br>Total (with tax): <strong>'+fmtMoney(a+t)+'</strong><br>Amount (excl. tax): '+fmtMoney(a);
}
function calcPercent(){
  var x=parseNum($('pcX').value),y=parseNum($('pcY').value);
  $('pcR1').textContent='= '+(x*y/100).toFixed(2);
  var a=parseNum($('pcA').value),b=parseNum($('pcB').value);
  $('pcR2').textContent='= '+(b>0?(a/b*100).toFixed(2):'0')+'%';
}

  html+='<p style="font-size:.78rem;color:var(--tx2);line-height:1.7"><strong>BizLite</strong> — Complete small business management suite running entirely in your browser. No server, no account, no subscription. Your data stays on your device.</p>';
  html+='<p style="font-size:.72rem;color:var(--tx3);margin-top:10px">All data is stored locally in your browser. Export regularly to keep backups.</p>';
