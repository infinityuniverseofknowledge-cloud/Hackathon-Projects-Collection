<!DOCTYPE html>
<html lang="en" data-theme="monokai">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SYNTAX — Language & Algorithms Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#0d0d10;--bg2:#131318;--bg3:#1a1a22;--bg4:#252532;
  --panel:#131318;--panel2:#1a1a22;--panel3:#252532;--panel4:#32323f;
  --bd:#252532;--bd2:#3a3a48;--bd3:#5a5a70;
  --tx:#e0e0e6;--tx2:#a0a0b0;--tx3:#6a6a80;--mu:#3a3a48;
  /* Monokai syntax palette */
  --kw:#c678dd;   /* purple - keywords */
  --str:#98c379;  /* green - strings */
  --num:#d19a66;  /* orange - numbers */
  --id:#61afef;   /* blue - identifiers */
  --op:#56b6c2;   /* cyan - operators */
  --cm:#7f848e;   /* gray - comments */
  --fn:#e5c07b;   /* yellow - functions */
  --pun:#abb2bf;  /* white - punctuation */
  --err:#e06c75;  /* red - errors */

  --c1:#61afef;--c1h:#8ec8ff;--c1l:#4090c0;
  --c2:#98c379;--c2h:#b8e09a;--c2l:#709050;
  --c3:#56b6c2;--c3h:#8ee0ec;--c3l:#308890;
  --c4:#e06c75;--c4h:#ff9098;--c4l:#b04050;
  --c5:#e5c07b;--c5h:#ffe0a0;--c5l:#b09050;
  --c6:#c678dd;--c6h:#e0a0ff;--c6l:#9040c0;
  --c7:#56b6c2;--c7h:#8ee0ec;--c7l:#308890;
  --c8:#e5c07b;--c8h:#ffe0a0;--c8l:#b09050;

  --ok:#98c379;--warn:#e5c07b;--err:#e06c75;--info:#61afef;
  --g1:linear-gradient(135deg,#61afef,#c678dd);
  --g2:linear-gradient(135deg,#98c379,#56b6c2);
  --gHolo:linear-gradient(120deg,#61afef,#98c379,#e5c07b,#e06c75,#c678dd,#56b6c2,#61afef);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#fafafa;--bg2:#f0f0f5;--bg3:#e6e6ee;--panel:#fff;--panel2:#f5f5fa;--panel3:#eaeaf0;
  --bd:#d8d8e0;--bd2:#a8a8b8;--tx:#1a1a22;--tx2:#50505c;--tx3:#909098;
  --kw:#a626a4;--str:#50a14f;--num:#986801;--id:#4078f2;--op:#0184bc;--cm:#a0a1a7;--fn:#c18401;--pun:#383a42;
  --c1:#4078f2;--c2:#50a14f;--c3:#0184bc;--c4:#e45649;--c5:#c18401;--c6:#a626a4;
}
[data-theme="solarized"]{
  --bg:#002b36;--bg2:#073642;--bg3:#0a4a5a;--panel:#002b36;--panel2:#073642;--panel3:#0a4a5a;
  --bd:#0a4a5a;--bd2:#1a6a7a;--tx:#93a1a1;--tx2:#839496;--tx3:#586e75;
  --kw:#859900;--str:#2aa198;--num:#d33682;--id:#268bd2;--op:#6c71c4;--cm:#586e75;--fn:#b58900;--pun:#93a1a1;
  --c1:#268bd2;--c2:#859900;--c3:#2aa198;--c4:#dc322f;--c5:#b58900;--c6:#d33682;
}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#0d0d10;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo-wrap{position:relative;margin-bottom:18px}
.boot-braces{font-family:var(--mono);font-size:5rem;font-weight:900;letter-spacing:-4px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;
  text-shadow:0 0 60px rgba(97,175,239,.5)}
.boot-logo{font-family:var(--disp);font-size:2.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;text-align:center}
.boot-sub{font-size:.66rem;color:#61afef;letter-spacing:9px;margin-bottom:26px;opacity:.75;text-align:center}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#1a1a22;border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #61afef}
.boot-pct{font-size:.66rem;color:#61afef;margin-bottom:14px}
.boot-log{font-size:.58rem;color:#6a6a80;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#98c379}
.boot-log .info{color:#61afef}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0d0d10;box-shadow:0 0 12px rgba(97,175,239,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#1a1a22;transition:var(--t1)}
.tb-status .dot.on{background:var(--c2);box-shadow:0 0 10px var(--c2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#08080c;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:default}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(19,19,24,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:90px;line-height:1.55}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(97,175,239,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#0d0d10;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(97,175,239,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.success{color:var(--c2);border-color:var(--c2)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#0d0d10;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c2)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* Syntax colors for token display */
.tok-kw{color:var(--kw)}.tok-id{color:var(--id)}.tok-num{color:var(--num)}.tok-str{color:var(--str)}
.tok-op{color:var(--op)}.tok-cm{color:var(--cm)}.tok-pun{color:var(--pun)}.tok-fn{color:var(--fn)}
.tok-err{color:var(--err);text-decoration:underline wavy var(--err)}
.tok-ws{color:transparent}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo-wrap"><div class="boot-braces">{ }</div></div>
  <div class="boot-logo">SYNTAX</div>
  <div class="boot-sub">LANGUAGE &amp; ALGORITHMS LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('lexer')">SYNTAX</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Theory</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Steps</span><span class="sb-val c2" id="sbSteps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Tokens</span><span class="sb-val c3" id="sbTokens">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Ops</span><span class="sb-val c4" id="sbOps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Time</span><span class="sb-val c5" id="sbTime">0ms</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Lexer</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}

  var wrap=CANV.canvas.parentElement;

if(!CanvasRenderingContext2D.prototype.roundRect){

    var l=STATE.lexer;

    var guard=0;
    while(pos<src.length){
      if(++guard>100000){l.error='Infinite loop guard';break;}
      var matched=false;
      for(var i=0;i<LEX_RULES.length;i++){
        var rule=LEX_RULES[i];
        rule.re.lastIndex=pos;
        var m=rule.re.exec(src);

          var text=m[0];
          var type=rule.type;
          if(rule.classify&&!rule.classify(text))continue;

          break;

/* ================================================================
   MODULE 2: PARSER + EVALUATOR
   ================================================================ */
function tokenizeExpr(src){
  var tokens=[];
  var pos=0;
  while(pos<src.length){
    var c=src[pos];
    if(/\s/.test(c)){pos++;continue;}
    if(/[0-9]/.test(c)){
      var start=pos;
      while(pos<src.length&&/[0-9.]/.test(src[pos]))pos++;
      tokens.push({type:'NUM',value:parseFloat(src.substring(start,pos)),start:start,end:pos});
      continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      var start2=pos;
      while(pos<src.length&&/[a-zA-Z0-9_]/.test(src[pos]))pos++;
      tokens.push({type:'ID',value:src.substring(start2,pos),start:start2,end:pos});
      continue;
    }
    if('+-*/^%'.indexOf(c)>=0){tokens.push({type:'OP',value:c,start:pos,end:pos+1});pos++;continue;}
    if(c==='('||c===')'){tokens.push({type:'PUNCT',value:c,start:pos,end:pos+1});pos++;continue;}
    if(c===','){tokens.push({type:'PUNCT',value:c,start:pos,end:pos+1});pos++;continue;}
    tokens.push({type:'ERR',value:c,start:pos,end:pos+1});
    pos++;
  }
  tokens.push({type:'EOF',value:null,start:pos,end:pos});
  return tokens;
}

/* Pratt-style precedence parser for arithmetic */
function parseExpr(src){
  var toks=tokenizeExpr(src);
  var pos=0;
  function peek(){return toks[pos]}
  function next(){return toks[pos++]}
  function expect(t,v){
    var tk=peek();
    if(tk.type!==t||(v!=null&&tk.value!==v)){
      throw new Error('Expected '+(v||t)+' at position '+tk.start+' but got "'+(tk.value==null?'EOF':tk.value)+'"');
    }
    return next();
  }
  /* expr   := term (('+'|'-') term)* */
  function expr(){
    var left=term();
    while(peek().type==='OP'&&(peek().value==='+'||peek().value==='-')){
      var op=next().value;
      var right=term();
      left={type:'binop',op:op,left:left,right:right};
    }
    return left;
  }
  /* term   := factor (('*'|'/'|'%') factor)* */
  function term(){
    var left=factor();
    while(peek().type==='OP'&&(peek().value==='*'||peek().value==='/'||peek().value==='%')){
      var op=next().value;
      var right=factor();
      left={type:'binop',op:op,left:left,right:right};
    }
    return left;
  }
  /* factor := unary ('^' factor)?   -- right assoc */
  function factor(){
    var left=unary();
    if(peek().type==='OP'&&peek().value==='^'){
      next();
      var right=factor();
      return {type:'binop',op:'^',left:left,right:right};
    }
    return left;
  }
  /* unary  := ('-'|'+')? primary */
  function unary(){
    if(peek().type==='OP'&&(peek().value==='-'||peek().value==='+')){
      var op=next().value;
      return {type:'unop',op:op,arg:unary()};
    }
    return primary();
  }
  /* primary := NUM | ID | '(' expr ')' | ID '(' args ')' */
  function primary(){
    var tk=peek();
    if(tk.type==='NUM'){next();return {type:'num',value:tk.value,span:[tk.start,tk.end]}}
    if(tk.type==='ID'){
      next();
      /* Function call */
      if(peek().type==='PUNCT'&&peek().value==='('){
        next();
        var args=[];
        if(!(peek().type==='PUNCT'&&peek().value===')')){
          args.push(expr());
          while(peek().type==='PUNCT'&&peek().value===','){
            next();
            args.push(expr());
          }
        }
        expect('PUNCT',')');
        return {type:'call',name:tk.value,args:args};
      }
      return {type:'ident',name:tk.value,span:[tk.start,tk.end]};
    }
    if(tk.type==='PUNCT'&&tk.value==='('){
      next();
      var inner=expr();
      expect('PUNCT',')');
      return inner;
    }
    throw new Error('Unexpected token "'+(tk.value==null?'EOF':tk.value)+'" at position '+tk.start);
  }
  var ast=expr();
  if(peek().type!=='EOF'){
    throw new Error('Trailing token "'+peek().value+'"');
  }
  return ast;
}

/* Evaluate AST with optional path recording */
function evalAST(node,env,path){
  if(!node)return 0;
  if(node.type==='num')return node.value;
  if(node.type==='ident'){
    if(env&&env.hasOwnProperty(node.name))return env[node.name];
    throw new Error('Unknown identifier "'+node.name+'"');
  }
  if(node.type==='unop'){
    var v=evalAST(node.arg,env,path);
    return node.op==='-'?-v:v;
  }
  if(node.type==='binop'){
    var a=evalAST(node.left,env,path);
    var b=evalAST(node.right,env,path);
    if(path)path.push(node);
    if(node.op==='+')return a+b;
    if(node.op==='-')return a-b;
    if(node.op==='*')return a*b;
    if(node.op==='/')return b===0?(a===0?NaN:Infinity*a):a/b;
    if(node.op==='%')return a%b;
    if(node.op==='^')return Math.pow(a,b);
  }
  if(node.type==='call'){
    var fn=BUILTINS[node.name];
    if(!fn)throw new Error('Unknown function "'+node.name+'"');
    var args=node.args.map(function(a){return evalAST(a,env,path)});
    return fn.apply(null,args);
  }
  throw new Error('Unknown AST node type: '+node.type);
}
var BUILTINS={
  sqrt:Math.sqrt,abs:Math.abs,sin:Math.sin,cos:Math.cos,tan:Math.tan,
  log:Math.log,log2:Math.log2,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,
  round:Math.round,min:Math.min,max:Math.max,pow:Math.pow,
  pi:function(){return Math.PI}
};

/* Count AST nodes */
function countNodes(node){
  if(!node)return 0;
  var n=1;
  if(node.left)n+=countNodes(node.left);
  if(node.right)n+=countNodes(node.right);
  if(node.arg)n+=countNodes(node.arg);
  if(node.args)node.args.forEach(function(a){n+=countNodes(a)});
  return n;
}
/* Compute AST depth */
function astDepth(node){
  if(!node)return 0;
  var d=1;
  if(node.left)d=Math.max(d,1+astDepth(node.left));
  if(node.right)d=Math.max(d,1+astDepth(node.right));
  if(node.arg)d=Math.max(d,1+astDepth(node.arg));
  if(node.args)node.args.forEach(function(a){d=Math.max(d,1+astDepth(a))});
  return d;
}

/* ================================================================
   MODULE 3: REGEX ENGINE (Thompson NFA)
   ================================================================ */
function regexParse(src){
  var pos=0;
  function peek(){return pos<src.length?src[pos]:null}
  function eat(c){if(pos<src.length&&src[pos]===c){pos++;return true}return false}
  function parseAlt(){
    var parts=[parseConcat()];
    while(eat('|'))parts.push(parseConcat());
    return parts.length===1?parts[0]:{type:'alt',parts:parts};
  }
  function parseConcat(){
    var parts=[];
    while(pos<src.length&&src[pos]!=='|'&&src[pos]!==')'){
      parts.push(parseRepeat());
    }
    if(parts.length===0)return {type:'empty'};
    return parts.length===1?parts[0]:{type:'cat',parts:parts};
  }
  function parseRepeat(){
    var atom=parseAtom();
    while(true){
      if(eat('*'))atom={type:'star',inner:atom};
      else if(eat('+'))atom={type:'plus',inner:atom};
      else if(eat('?'))atom={type:'opt',inner:atom};
      else break;
    }
    return atom;
  }
  function parseAtom(){
    if(eat('(')){
      var inner=parseAlt();
      if(!eat(')'))throw new Error('Unmatched ( at position '+pos);
      return inner;
    }
    var c=peek();
    if(c===null)throw new Error('Unexpected end of pattern');
    pos++;
    if(c==='.')return {type:'any'};
    if(c==='\\'){
      var next=peek();
      if(next===null)throw new Error('Trailing backslash');
      pos++;
      return {type:'char',c:next};
    }
    return {type:'char',c:c};
  }
  var ast=parseAlt();
  if(pos<src.length)throw new Error('Unexpected "'+src[pos]+'" at position '+pos);
  return ast;
}

/* Thompson NFA construction */
function nfaFromRegex(ast){
  var states=[];
  var transitions=[];  /* {from, sym, to} — sym:null for ε, or char, or '.' for any */
  var idCounter=0;
  function newState(){
    var id=idCounter++;
    states.push({id:id,accept:false});
    return id;
  }
  function addTrans(from,sym,to){transitions.push({from:from,sym:sym,to:to})}
  function build(node){
    if(node.type==='empty'){
      var s=newState();var e=newState();
      addTrans(s,null,e);
      return {start:s,accept:e};
    }
    if(node.type==='char'){
      var s2=newState();var e2=newState();
      addTrans(s2,node.c,e2);
      return {start:s2,accept:e2};
    }
    if(node.type==='any'){
      var s3=newState();var e3=newState();
      addTrans(s3,'.',e3);
      return {start:s3,accept:e3};
    }
    if(node.type==='cat'){
      var parts=node.parts.map(build);
      for(var i=0;i<parts.length-1;i++){
        addTrans(parts[i].accept,null,parts[i+1].start);
      }
      return {start:parts[0].start,accept:parts[parts.length-1].accept};
    }
    if(node.type==='alt'){
      var s4=newState();var e4=newState();
      node.parts.forEach(function(p){
        var sub=build(p);
        addTrans(s4,null,sub.start);
        addTrans(sub.accept,null,e4);
      });
      return {start:s4,accept:e4};
    }
    if(node.type==='star'){
      var sub1=build(node.inner);
      var s5=newState();var e5=newState();
      addTrans(s5,null,sub1.start);
      addTrans(s5,null,e5);
      addTrans(sub1.accept,null,sub1.start);
      addTrans(sub1.accept,null,e5);
      return {start:s5,accept:e5};
    }
    if(node.type==='plus'){
      var sub2=build(node.inner);
      var s6=newState();var e6=newState();
      addTrans(s6,null,sub2.start);
      addTrans(sub2.accept,null,sub2.start);
      addTrans(sub2.accept,null,e6);
      return {start:s6,accept:e6};
    }
    if(node.type==='opt'){
      var sub3=build(node.inner);
      var s7=newState();var e7=newState();
      addTrans(s7,null,sub3.start);
      addTrans(s7,null,e7);
      addTrans(sub3.accept,null,e7);
      return {start:s7,accept:e7};
    }
    throw new Error('Unknown AST node '+node.type);
  }
  var frag=build(ast);
  states[frag.accept].accept=true;
  return {states:states,transitions:transitions,start:frag.start,accept:frag.accept};
}

/* ε-closure */
function epsilonClosure(nfa,set){
  var stack=Array.from(set);
  var result=new Set(set);
  while(stack.length>0){
    var s=stack.pop();
    nfa.transitions.forEach(function(t){
      if(t.from===s&&t.sym===null&&!result.has(t.to)){
        result.add(t.to);
        stack.push(t.to);
      }
    });
  }
  return result;
}

/* Simulate NFA on input; collect all step snapshots */
function nfaSimulate(nfa,input){
  var steps=[];
  var cur=epsilonClosure(nfa,[nfa.start]);
  steps.push({pos:0,states:Array.from(cur).sort(function(a,b){return a-b}),char:null});
  for(var i=0;i<input.length;i++){
    var c=input[i];
    var next=new Set();
    nfa.transitions.forEach(function(t){
      if(cur.has(t.from)&&(t.sym===c||t.sym==='.')){
        next.add(t.to);
      }
    });
    cur=epsilonClosure(nfa,next);
    steps.push({pos:i+1,states:Array.from(cur).sort(function(a,b){return a-b}),char:c});
  }
  var matched=cur.has(nfa.accept);
  return {steps:steps,matched:matched};
}

    nfaG.transitions.forEach(function(t){
      var p1=positions[t.from],p2=positions[t.to];
      var key=t.from+'-'+t.to;
      var offset=(edgeDrawCounts[key]||0);
      edgeDrawCounts[key]=offset+1;
      var dx=p2.x-p1.x,dy=p2.y-p1.y;
      var len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len,ny=dx/len;
      var curve=8+offset*4;
      var midX=(p1.x+p2.x)/2+nx*curve;
      var midY=(p1.y+p2.y)/2+ny*curve;
      /* Arrow from p1 to p2 with slight curve */
      ctx.strokeStyle=t.sym===null?'rgba(198,120,221,.5)':'rgba(97,175,239,.55)';
      ctx.lineWidth=t.sym===null?1:1.6;
      if(t.sym===null)ctx.setLineDash([3,3]);
      ctx.beginPath();
      ctx.moveTo(p1.x,p1.y);
      ctx.quadraticCurveTo(midX,midY,p2.x,p2.y);
      ctx.stroke();
      ctx.setLineDash([]);
      /* Label */
      var label=t.sym===null?'ε':(t.sym==='.'?'·':t.sym);
      ctx.fillStyle=t.sym===null?'#c678dd':'#61afef';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      var bgW=ctx.measureText(label).width+6;
      ctx.fillStyle='rgba(8,8,12,.9)';
      ctx.fillRect(midX-bgW/2,midY-7,bgW,14);
      ctx.fillStyle=t.sym===null?'#c678dd':'#61afef';
      ctx.fillText(label,midX,midY);
      ctx.textBaseline='alphabetic';
    });
    /* Draw states */
    positions.forEach(function(p,i){
      var st=nfaG.states[i];
      var isActive=activeSet.has(st.id);
      var isStart=i===nfaG.start;
      var isAccept=st.accept;
      /* Glow for active */
      if(isActive){
        ctx.fillStyle='rgba(229,192,123,.25)';
        ctx.beginPath();ctx.arc(p.x,p.y,26,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle=isActive?'#e5c07b':(isAccept?'#98c379':'#1a1a22');
      ctx.strokeStyle=isActive?'#e5c07b':'#61afef';
      ctx.lineWidth=isActive?3:2;
      ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      if(isAccept){
        ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);
        ctx.strokeStyle='#98c379';
        ctx.lineWidth=1.5;
        ctx.stroke();
      }
      /* State id */
      ctx.fillStyle=isActive?'#0d0d10':'#e0e0e6';
      ctx.font='bold 11px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(st.id,p.x,p.y+1);
      /* Start arrow */
      if(isStart){
        ctx.strokeStyle='#c678dd';
        ctx.lineWidth=2;
        ctx.beginPath();
        var ang=-Math.PI/2;
        var sx=p.x+Math.cos(ang-0.6)*24;
        var sy=p.y+Math.sin(ang-0.6)*24;
        var ex=p.x+Math.cos(ang)*22;
        var ey=p.y+Math.sin(ang)*22;
        ctx.moveTo(sx,sy);
        ctx.lineTo(ex,ey);
        ctx.stroke();
        /* Arrow head */
        ctx.beginPath();
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex-Math.cos(ang-0.4)*8,ey-Math.sin(ang-0.4)*8);
        ctx.moveTo(ex,ey);
        ctx.lineTo(ex-Math.cos(ang+0.4)*8,ey-Math.sin(ang+0.4)*8);
        ctx.stroke();
      }
      ctx.textBaseline='alphabetic';
    });
    /* Input tape with active position */
    var tapeY=H*0.7;
    var tapeX=60;
    ctx.fillStyle='#61afef';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('INPUT TAPE · position '+stepNow.pos,60,tapeY-10);
    var cellW=Math.min(40,(W-120)/Math.max(1,r.input.length));
    var cellH=40;
    for(var ci=0;ci<r.input.length;ci++){
      var cxi=tapeX+ci*cellW;
      var isCur=(ci===stepNow.pos-1)||(ci===stepNow.pos&&stepNow.char===null);
      var wasCur=(ci<stepNow.pos);
      ctx.fillStyle=isCur?'rgba(229,192,123,.25)':(wasCur?'rgba(97,175,239,.15)':'rgba(26,26,34,.7)');
      ctx.strokeStyle=isCur?'#e5c07b':(wasCur?'#61afef':'#252532');
      ctx.lineWidth=isCur?2:1;
      ctx.beginPath();ctx.roundRect(cxi,tapeY,cellW-2,cellH,4);ctx.fill();ctx.stroke();
      ctx.fillStyle=isCur?'#e5c07b':(wasCur?'#61afef':'#e0e0e6');
      ctx.font='bold 16px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(r.input[ci],cxi+(cellW-2)/2,tapeY+cellH/2);
      ctx.textBaseline='alphabetic';
    }
    /* Result */
    var resY=H-50;
    ctx.fillStyle=r.matched?'rgba(152,195,121,.2)':'rgba(224,108,117,.2)';
    ctx.strokeStyle=r.matched?'#98c379':'#e06c75';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(60,resY-30,240,30,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=r.matched?'#98c379':'#e06c75';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(r.matched?'✓ MATCH':'✕ NO MATCH',180,resY-10);
    setStatsHTML(
      '<div>States: '+r.nfa.states.length+'</div>'+
      '<div>Transitions: '+r.nfa.transitions.length+'</div>'+
      '<div>Active: '+stepNow.states.length+'</div>'+
      '<div>Position: '+stepNow.pos+'/'+r.input.length+'</div>'
    );
    updateBadge('🔎 Regex NFA · '+(r.matched?'MATCH':'no match')+' · '+r.nfa.states.length+' states');
    $('sbMode').textContent='Regex';
    $('sbSteps').textContent=stepNow.pos;
    $('sbTokens').textContent=r.nfa.states.length;
  },
  onDown:function(p){},
  controls:function(){
    var r=STATE.regex;
    var html='';
    html+='<div class="sec"><h4>Pattern</h4>';
    html+='<div class="ctrl"><input type="text" value="'+esc(r.pattern)+'" oninput="STATE.regex.pattern=this.value;MODULES.regex.compile()"></div>';
    html+='<div class="lbl" style="margin-top:6px"><span>Input</span></div>';
    html+='<div class="ctrl"><input type="text" value="'+esc(r.input)+'" oninput="STATE.regex.input=this.value;MODULES.regex.compile()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4><div class="chip-row">';
    [
      ['(a|b)*abb','aabb'],
      ['a*b','aaab'],
      ['(ab)+','abab'],
      ['a?b?c?','b'],
      ['a.c','abc'],
      ['a*','aaaa']
    ].forEach(function(p){
      html+='<div class="chip" onclick="STATE.regex.pattern='+JSON.stringify(p[0])+';STATE.regex.input='+JSON.stringify(p[1])+';MODULES.regex.compile();renderLeftPanel()">/'+esc(p[0])+'/</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Controls</h4>';
    html+='<button class="btn primary full" onclick="STATE.regex.matchIdx=0">↺ Restart sim</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.regex.compile()">↻ Recompile</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Supported syntax</h4>';
    html+='<div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">'+
      '<code>abc</code> — concatenation<br>'+
      '<code>a|b</code> — alternation<br>'+
      '<code>a*</code> — Kleene star<br>'+
      '<code>a+</code> — one or more<br>'+
      '<code>a?</code> — optional<br>'+
      '<code>.</code> — any character<br>'+
      '<code>(...)</code> — grouping<br>'+
      '<code>\\.</code> — escape'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){
    var r=STATE.regex;
    var nfaG=r.nfa;
    return '<div class="sec"><h4>Regular expressions → NFA</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b>Thompson construction</b> builds an NFA where every state has at most 2 outgoing transitions. Number of NFA states is O(|regex|).'+
      '</div></div>'+
      '<div class="sec"><h4>Building blocks</h4>'+
      '<div style="font-family:var(--mono);font-size:.58rem;line-height:1.7;color:var(--tx2)">'+
      '<code>c</code> → s₁ --c-- s₂<br>'+
      '<code>ε</code> (empty) → s₁ --ε-- s₂<br>'+
      '<code>M|N</code> → new start, new accept; ε into both, ε out of both<br>'+
      '<code>MN</code> → M.accept --ε-- N.start<br>'+
      '<code>M*</code> → new start/accept with ε loops'+
      '</div></div>'+
      '<div class="sec"><h4>Simulation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Start: ε-closure({q₀})<br>'+
      'Per char c: next = ⋃ {t | q∈S, δ(q,c)=t}; S ← ε-closure(next)<br>'+
      'Accept: S ∩ F ≠ ∅<br><br>'+
      'Time: O(|input| · |NFA|)'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      (nfaG?'<div class="row"><span class="k">NFA states</span><span class="v">'+nfaG.states.length+'</span></div>'+
      '<div class="row"><span class="k">Transitions</span><span class="v">'+nfaG.transitions.length+'</span></div>'+
      '<div class="row"><span class="k">Start</span><span class="v">'+nfaG.start+'</span></div>'+
      '<div class="row"><span class="k">Accept</span><span class="v">'+nfaG.accept+'</span></div>':'<div class="row"><span class="k">—</span></div>')+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 4: SORTING VISUALIZER
   ================================================================ */
function* bubbleSort(a){
  var n=a.length;
  for(var i=0;i<n-1;i++){
    for(var j=0;j<n-1-i;j++){
      yield {type:'compare',i:j,j:j+1};
      if(a[j]>a[j+1]){
        var t=a[j];a[j]=a[j+1];a[j+1]=t;
        yield {type:'swap',i:j,j:j+1};
      }
    }
  }
}
function* insertionSort(a){
  for(var i=1;i<a.length;i++){
    var key=a[i];
    var j=i-1;
    while(j>=0){
      yield {type:'compare',i:j,j:j+1};
      if(a[j]>key){a[j+1]=a[j];yield {type:'swap',i:j,j:j+1};j--;}
      else break;
    }
    a[j+1]=key;
    yield {type:'write',i:j+1};
  }
}
function* selectionSort(a){
  for(var i=0;i<a.length-1;i++){
    var minI=i;
    for(var j=i+1;j<a.length;j++){
      yield {type:'compare',i:minI,j:j};
      if(a[j]<a[minI])minI=j;
    }
    if(minI!==i){
      var t=a[i];a[i]=a[minI];a[minI]=t;
      yield {type:'swap',i:i,j:minI};
    }
  }
}
function* cocktailSort(a){
  var lo=0,hi=a.length-1;
  while(lo<hi){
    for(var i=lo;i<hi;i++){
      yield {type:'compare',i:i,j:i+1};
      if(a[i]>a[i+1]){var t=a[i];a[i]=a[i+1];a[i+1]=t;yield {type:'swap',i:i,j:i+1};}
    }
    hi--;
    for(var j=hi;j>lo;j--){
      yield {type:'compare',i:j-1,j:j};
      if(a[j-1]>a[j]){var t2=a[j-1];a[j-1]=a[j];a[j]=t2;yield {type:'swap',i:j-1,j:j};}
    }
    lo++;
  }
}
function* shellSort(a){
  var n=a.length;
  for(var gap=Math.floor(n/2);gap>0;gap=Math.floor(gap/2)){
    for(var i=gap;i<n;i++){
      var temp=a[i];
      var j=i;
      while(j>=gap){
        yield {type:'compare',i:j-gap,j:j};
        if(a[j-gap]>temp){a[j]=a[j-gap];yield {type:'swap',i:j-gap,j:j};j-=gap;}
        else break;
      }
      a[j]=temp;
    }
  }
}
function* quickSortHelper(a,lo,hi){
  if(lo>=hi)return;
  var pivot=a[hi];
  var i=lo-1;
  for(var j=lo;j<hi;j++){
    yield {type:'compare',i:j,j:hi};
    if(a[j]<=pivot){
      i++;
      if(i!==j){
        var t=a[i];a[i]=a[j];a[j]=t;
        yield {type:'swap',i:i,j:j};
      }
    }
  }
  if(i+1!==hi){
    var t2=a[i+1];a[i+1]=a[hi];a[hi]=t2;
    yield {type:'swap',i:i+1,j:hi};
  }
  yield* quickSortHelper(a,lo,i);
  yield* quickSortHelper(a,i+2,hi);
}
function* quickSort(a){yield* quickSortHelper(a,0,a.length-1)}

function* mergeSortHelper(a,tmp,lo,hi){
  if(lo>=hi)return;
  var mid=Math.floor((lo+hi)/2);
  yield* mergeSortHelper(a,tmp,lo,mid);
  yield* mergeSortHelper(a,tmp,mid+1,hi);
  for(var i=lo;i<=hi;i++)tmp[i]=a[i];
  var i2=lo,j=mid+1;
  for(var k=lo;k<=hi;k++){
    if(i2>mid)a[k]=tmp[j++];
    else if(j>hi)a[k]=tmp[i2++];
    else{
      yield {type:'compare',i:i2,j:j};
      if(tmp[i2]<=tmp[j])a[k]=tmp[i2++];
      else a[k]=tmp[j++];
    }
    yield {type:'write',i:k};
  }
}
function* mergeSort(a){var tmp=new Array(a.length);yield* mergeSortHelper(a,tmp,0,a.length-1)}

var SORT_ALGOS={
  bubble:{name:'Bubble Sort',gen:bubbleSort,complexity:'O(n²)'},
  insertion:{name:'Insertion Sort',gen:insertionSort,complexity:'O(n²)'},
  selection:{name:'Selection Sort',gen:selectionSort,complexity:'O(n²)'},
  cocktail:{name:'Cocktail Sort',gen:cocktailSort,complexity:'O(n²)'},
  shell:{name:'Shell Sort',gen:shellSort,complexity:'O(n^1.3)'},
  quick:{name:'Quick Sort',gen:quickSort,complexity:'O(n log n)'},
  merge:{name:'Merge Sort',gen:mergeSort,complexity:'O(n log n)'}
};

registerModule('sorting',{
  title:'Sorting Visualizer',
  icon:'📶',
  desc:'Watch 7 classic sorting algorithms race. Compare ops, swaps, and step counts — real generators, real time complexity.',
  init:function(){ this.shuffle(); },
  shuffle:function(){
    var s=STATE.sorting;
    s.array=[];
    for(var i=0;i<s.n;i++)s.array.push(rnd(1,100));
    s.steps=[];
    s.stepIdx=0;
    s.comparisons=0;
    s.swaps=0;
    s.finished=false;
    this.buildSteps();
  },
  buildSteps:function(){
    var s=STATE.sorting;
    var arr=s.array.slice();
    var gen=SORT_ALGOS[s.algorithm].gen(arr);
    var limit=30000;
    var step;
    var count=0;
    var maxVal=1;
    s.array.forEach(function(v){if(v>maxVal)maxVal=v});
    while(count<limit){
      var r=gen.next();
      if(r.done)break;
      var st=r.value;
      var snap={type:st.type,i:st.i,j:st.j,array:arr.slice(),comparisons:s.comparisons,swaps:s.swaps};
      if(st.type==='compare')s.comparisons++;
      if(st.type==='swap')s.swaps++;
      snap.comparisons=s.comparisons;
      snap.swaps=s.swaps;
      s.steps.push(snap);
      count++;
    }
    /* Reset counters for playback */
    s.comparisons=0;
    s.swaps=0;
  },
  tick:function(dt){
    STATE.time+=dt;
    var s=STATE.sorting;
    if(!STATE.playing||s.finished)return;
    s.acc+=dt*s.speed;
    while(s.acc>=1&&!s.finished){
      s.acc-=1;
      if(s.stepIdx<s.steps.length){
        s.stepIdx++;
      } else {
        s.finished=true;
        break;
      }
    }
  },
  step:function(){
    var s=STATE.sorting;
    if(s.stepIdx<s.steps.length)s.stepIdx++;
    else s.finished=true;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#08080c';
    ctx.fillRect(0,0,W,H);
    var s=STATE.sorting;
    if(!s.array.length){updateBadge('📶 Sorting · empty');return;}
    var curStep=s.stepIdx>0?s.steps[s.stepIdx-1]:null;
    var curArray=curStep?curStep.array:s.array;
    var n=curArray.length;
    var maxVal=Math.max.apply(null,curArray);
    var barW=(W-80)/n;
    var plotH=H-160;
    var plotY=60;
    var plotX=40;
    var hi1=curStep?curStep.i:-1;
    var hi2=curStep?curStep.j:-1;
    for(var i=0;i<n;i++){
      var v=curArray[i];
      var h=(v/maxVal)*plotH;
      var x=plotX+i*barW;
      var y=plotY+plotH-h;
      var color='#61afef';
      if(i===hi1||i===hi2){
        if(curStep.type==='swap')color='#e06c75';
        else if(curStep.type==='compare')color='#e5c07b';
        else color='#98c379';
      }
      /* Gradient by value */
      ctx.fillStyle=color;
      ctx.fillRect(x,y,barW-1,h);
      /* Slight glow for highlighted */
      if(i===hi1||i===hi2){
        ctx.save();
        ctx.shadowColor=color;
        ctx.shadowBlur=12;
        ctx.fillRect(x,y,barW-1,h);
        ctx.restore();
      }
    }
    /* Info */
    ctx.fillStyle='rgba(19,19,24,.9)';
    ctx.strokeStyle='rgba(97,175,239,.4)';
    ctx.beginPath();ctx.roundRect(30,20,W-60,30,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#61afef';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText(SORT_ALGOS[s.algorithm].name+' · '+SORT_ALGOS[s.algorithm].complexity,W/2-120,40);
    /* Progress bar */
    var progY=H-90;
    ctx.fillStyle='rgba(26,26,34,.8)';
    ctx.beginPath();ctx.roundRect(plotX,progY,W-80,10,5);ctx.fill();
    var prog=s.steps.length>0?s.stepIdx/s.steps.length:0;
    ctx.fillStyle='#98c379';
    ctx.beginPath();ctx.roundRect(plotX,progY,(W-80)*prog,10,5);ctx.fill();
    ctx.fillStyle='#e0e0e6';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.round(prog*100)+'% · step '+s.stepIdx+' / '+s.steps.length,W/2,progY+28);
    /* Stats */
    if(curStep){
      ctx.fillStyle='rgba(19,19,24,.9)';
      ctx.strokeStyle='rgba(229,192,123,.4)';
      ctx.beginPath();ctx.roundRect(plotX,H-45,W-80,30,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#e5c07b';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('Comparisons: '+curStep.comparisons,plotX+14,H-25);
      ctx.fillStyle='#e06c75';
      ctx.textAlign='right';
      ctx.fillText('Swaps: '+curStep.swaps,W-40,H-25);
    }
    if(s.finished){
      ctx.fillStyle='rgba(152,195,121,.15)';
      ctx.strokeStyle='#98c379';
      ctx.beginPath();ctx.roundRect(W-220,60,180,40,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#98c379';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText('✓ SORTED',W-130,86);
    }
    setStatsHTML(
      '<div>Algo: '+SORT_ALGOS[s.algorithm].name+'</div>'+
      '<div>n: '+n+'</div>'+
      '<div>Steps: '+s.steps.length+'</div>'+
      '<div>Current: '+(curStep?curStep.type:'—')+'</div>'+
      '<div>Comparisons: '+(curStep?curStep.comparisons:0)+'</div>'
    );
    updateBadge('📶 '+SORT_ALGOS[s.algorithm].name+' · n='+n+' · '+(curStep?curStep.comparisons:0)+' cmp');
    $('sbMode').textContent='Sorting';
    $('sbSteps').textContent=s.stepIdx;
    $('sbOps').textContent=curStep?curStep.comparisons:0;
  },
  onDown:function(p){},
  controls:function(){
    var s=STATE.sorting;
    var html='';
    html+='<div class="sec"><h4>Algorithm</h4><div class="chip-row">';
    Object.keys(SORT_ALGOS).forEach(function(k){
      html+='<div class="chip '+(s.algorithm===k?'active':'')+'" onclick="STATE.sorting.algorithm=\''+k+'\';MODULES.sorting.shuffle();renderLeftPanel()">'+SORT_ALGOS[k].name.split(' ')[0]+'</div>';
    });
    html+='</div>';
    html+='<div style="font-family:var(--mono);font-size:.6rem;color:var(--tx3);margin-top:6px">'+SORT_ALGOS[s.algorithm].name+' · '+SORT_ALGOS[s.algorithm].complexity+'</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Controls</h4>';
    html+='<button class="btn primary full" onclick="MODULES.sorting.shuffle()">🎲 New array</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.sorting.stepIdx=0;STATE.sorting.comparisons=0;STATE.sorting.swaps=0;STATE.sorting.finished=false">↺ Restart</button>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Array size</span><span>'+s.n+'</span></div>';
    html+='<input type="range" min="10" max="100" step="1" value="'+s.n+'" oninput="STATE.sorting.n=parseInt(this.value);MODULES.sorting.shuffle();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Speed</span><span>'+s.speed+'×</span></div>';
    html+='<input type="range" min="1" max="100" step="1" value="'+s.speed+'" oninput="STATE.sorting.speed=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Comparison</h4>';

  mathPanel:function(){

      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c4)">O(n²)</b> — Bubble, Insertion, Selection, Cocktail<br>'+
      '<b style="color:var(--c5)">O(n^1.3)</b> — Shell (best known gap sequence dependent)<br>'+
      '<b style="color:var(--c2)">O(n log n)</b> — Merge, Quick (avg)<br><br>'+
      'Quick sort worst case: O(n²) on already-sorted data with bad pivot choice. Merge sort is always O(n log n) but uses O(n) extra space.'+
      '</div></div>'+
      '<div class="sec"><h4>Stability</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+

  }
});
function compareSorting(){
  var s=STATE.sorting;
  var arr=[];
  for(var i=0;i<s.n;i++)arr.push(rnd(1,100));
  var results=[];
  Object.keys(SORT_ALGOS).forEach(function(k){
    var a=arr.slice();
    var gen=SORT_ALGOS[k].gen(a);
    var comp=0,swaps=0,steps=0;
    var r=gen.next();
    while(!r.done&&steps<1000000){
      if(r.value.type==='compare')comp++;
      if(r.value.type==='swap')swaps++;
      steps++;
      r=gen.next();
    }
    results.push({name:SORT_ALGOS[k].name,cmp:comp,swaps:swaps,steps:steps,cx:SORT_ALGOS[k].complexity});
  });
  var html='<div class="sec"><h4>Performance on same array (n='+s.n+')</h4>';
  html+='<table class="data-table"><thead><tr><th>Algorithm</th><th>Complexity</th><th>Comparisons</th><th>Swaps</th><th>Steps</th></tr></thead><tbody>';
  results.forEach(function(r){
    html+='<tr><td class="c1">'+r.name+'</td><td>'+r.cx+'</td><td class="c2">'+r.cmp+'</td><td class="c3">'+r.swaps+'</td><td>'+r.steps+'</td></tr>';
  });
  html+='</tbody></table></div>';
  openModal('📊 Sorting Comparison',html);
}

var TM_PRESETS={
  'binary-increment':{
    name:'Binary increment',
    description:'Increment a binary number on the tape.',
    initialTape:function(){var n=rnd(1,15);var s=n.toString(2);return s;},
    startState:'q0',
    haltStates:['halt'],
    transitions:[
      /* q0: reading bit; add 1 to rightmost */
      /* Start at rightmost non-blank; if 0 → 1 done; if 1 → 0, carry left */
      {state:'q0',read:'0',write:'1',move:'R',next:'halt'},
      {state:'q0',read:'1',write:'0',move:'L',next:'q0'},
      {state:'q0',read:'_',write:'1',move:'R',next:'halt'}
    ]
  },
  'palindrome':{
    name:'Palindrome checker (ab)',
    description:'Accepts strings of form w = reverse(w) over {a,b}.',
    initialTape:function(){var opts=['','a','b','aa','ab','ba','bb','aba','abba','abab','abcba'];return opts[rnd(0,opts.length-1)];},
    startState:'q0',
    haltStates:['accept','reject'],
    transitions:[
      {state:'q0',read:'_',write:'_',move:'R',next:'accept'},
      {state:'q0',read:'a',write:'_',move:'R',next:'qa'},
      {state:'q0',read:'b',write:'_',move:'R',next:'qb'},

      {state:'qa',read:'a',write:'a',move:'R',next:'qa'},
      {state:'qa',read:'b',write:'b',move:'R',next:'qa'},
      {state:'qa',read:'_',write:'_',move:'L',next:'qa_end'},

      {state:'qa_end',read:'_',write:'_',move:'R',next:'accept'},
      {state:'qa_end',read:'b',write:'b',move:'L',next:'reject'},
      /* qb: match rightmost 'b' */
      {state:'qb',read:'a',write:'a',move:'R',next:'qb'},
      {state:'qb',read:'b',write:'b',move:'R',next:'qb'},
      {state:'qb',read:'_',write:'_',move:'L',next:'qb_end'},

      {state:'qback',read:'a',write:'a',move:'L',next:'qback'},

registerModule('turing',{
  title:'Turing Machine',
  icon:'🎞',
  desc:'Interactive single-tape Turing machine. Watch the head move, states change, and rules fire step by step.',
  init:function(){
    var t=STATE.turing;
    if(!t.transitions||t.transitions.length===0){
      this.loadMachine('binary-increment');
    } else {
      this.reset();
    }
  },
  loadMachine:function(key){
    var t=STATE.turing;
    var p=TM_PRESETS[key];
    if(!p)return;
    t.machine=key;
    t.transitions=p.transitions.slice();
    t.haltStates=p.haltStates.slice();
    /* Collect all states */
    var ss=new Set();
    ss.add(p.startState);
    p.transitions.forEach(function(tr){ss.add(tr.state);ss.add(tr.next)});
    t.allStates=Array.from(ss);
    t._initial=p.initialTape();
    this.reset();
    logMsg('TM: loaded "'+p.name+'"','info');
  },
  reset:function(){
    var t=STATE.turing;
    var init=t._initial||'';
    t.tape={};
    for(var i=0;i<init.length;i++)t.tape[i]=init[i];
    t.headPos=0;
    t.state=TM_PRESETS[t.machine].startState;
    t.steps=0;
    t.halted=false;
    t.status='Running';
    t.history=[];
  },
  step:function(){
    var t=STATE.turing;
    if(t.halted)return;
    if(t.steps>=t.maxSteps){t.halted=true;t.status='Max steps reached';return;}
    var read=t.tape[t.headPos]||t.blank;
    var rule=t.transitions.find(function(r){return r.state===t.state&&r.read===read});
    if(!rule){
      t.halted=true;
      t.status='No transition for ('+t.state+','+read+') — rejected';
      return;
    }
    t.history.push({state:t.state,pos:t.headPos,read:read,rule:rule});
    t.tape[t.headPos]=rule.write;
    if(rule.move==='L')t.headPos--;
    else if(rule.move==='R')t.headPos++;
    t.state=rule.next;
    t.steps++;
    if(t.haltStates.indexOf(t.state)>=0){
      t.halted=true;
      t.status=t.state==='reject'?'REJECTED':(t.state==='accept'?'ACCEPTED':'HALTED');
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var t=STATE.turing;
    if(!STATE.playing||t.halted)return;
    if(!this._acc)this._acc=0;

    while(this._acc>=1&&!t.halted){

      this._acc-=1;

/* ================================================================
   MODULE 6: LAMBDA CALCULUS
   ================================================================ */
/* Term representation:
   {v:'x'}              -- variable
   {app:[M,N]}          -- application
   {lam:'x',body:M}     -- lambda abstraction
*/
function lambdaParse(src){
  var pos=0;
  function peek(){return pos<src.length?src[pos]:null}
  function skipWS(){while(pos<src.length&&/\s/.test(src[pos]))pos++}
  function parseTerm(){
    skipWS();
    if(peek()==='\\'||peek()==='λ'){
      pos++;
      skipWS();
      var name='';
      while(pos<src.length&&/[a-zA-Z0-9_]/.test(src[pos])){name+=src[pos];pos++;}
      if(!name)throw new Error('Missing variable after \\');
      skipWS();
      if(peek()!=='.')throw new Error('Expected "." after \\'+name);
      pos++;
      var body=parseTerm();
      return {lam:name,body:body};
    }
    /* Application: parse atoms until we hit ) or end */
    var atoms=[];
    while(true){
      skipWS();
      if(pos>=src.length||peek()===')')break;
      atoms.push(parseAtom());
    }
    if(atoms.length===0)throw new Error('Unexpected end of input');
    if(atoms.length===1)return atoms[0];
    var result=atoms[0];
    for(var i=1;i<atoms.length;i++)result={app:[result,atoms[i]]};
    return result;
  }
  function parseAtom(){
    skipWS();
    var c=peek();
    if(c==='('){
      pos++;
      var inner=parseTerm();
      skipWS();
      if(peek()!==')')throw new Error('Unmatched (');
      pos++;
      return inner;
    }
    if(/[a-zA-Z_]/.test(c||'')){
      var name='';
      while(pos<src.length&&/[a-zA-Z0-9_]/.test(src[pos])){name+=src[pos];pos++;}
      return {v:name};
    }
    throw new Error('Unexpected character "'+c+'" at position '+pos);
  }
  var term=parseTerm();
  skipWS();
  if(pos<src.length)throw new Error('Trailing input at position '+pos);
  return term;
}

function termToString(t,paren){
  if(!t)return '?';
  if(t.v)return t.v;
  if(t.app){
    var left=termToString(t.app[0],true);
    var right=termToString(t.app[1],true);
    var s=left+' '+right;
    return paren?'('+s+')':s;
  }
  if(t.lam){
    var s='\\'+t.lam+'.'+termToString(t.body,false);
    return paren?'('+s+')':s;
  }
  return '?';
}

function freeVars(t){
  var s=new Set();
  (function walk(t){
    if(!t)return;
    if(t.v){s.add(t.v);return;}
    if(t.app){walk(t.app[0]);walk(t.app[1]);return;}
    if(t.lam){
      var saved=Array.from(s);
      walk(t.body);
      /* Remove bound var */
      s.delete(t.lam);
    }
  })(t);
  return s;
}

function substitute(term,varName,replacement){
  /* Substitute varName with replacement, avoiding capture */
  function walk(t,blocked){
    if(!t)return t;
    if(t.v){
      if(t.v===varName&&blocked.indexOf(varName)<0)return replacement;
      return t;
    }
    if(t.app){
      return {app:[walk(t.app[0],blocked),walk(t.app[1],blocked)]};
    }
    if(t.lam){
      if(t.lam===varName)return t; /* shadowed */
      var fv=freeVars(replacement);
      if(fv.has(t.lam)){
        /* Rename bound var to avoid capture */
        var fresh=t.lam;
        var i=0;
        while(fv.has(fresh)||fresh===varName){fresh=t.lam+i;i++;}
        var renamedBody=rename(t.body,t.lam,fresh);
        return {lam:fresh,body:walk(renamedBody,blocked.concat(fresh))};
      }
      return {lam:t.lam,body:walk(t.body,blocked)};
    }
    return t;
  }
  function rename(t,from,to){
    if(!t)return t;
    if(t.v)return t.v===from?{v:to}:t;
    if(t.app)return {app:[rename(t.app[0],from,to),rename(t.app[1],from,to)]};
    if(t.lam){
      if(t.lam===from)return t;
      return {lam:t.lam,body:rename(t.body,from,to)};
    }
    return t;
  }
  return walk(term,[]);
}

/* Single step of normal-order reduction (leftmost-outermost) */
function betaStep(t){
  if(!t)return null;
  if(t.app){
    var M=t.app[0],N=t.app[1];
    /* If M is a lambda, do β-reduction */
    if(M&&M.lam){
      var sub=substitute(M.body,M.lam,N);
      return {term:sub,redex:'(\\'+M.lam+'.'+termToString(M.body)+') '+termToString(N)};
    }
    /* Otherwise recurse into M first (normal order: reduce leftmost-outermost) */
    var reducedM=betaStep(M);
    if(reducedM)return {term:{app:[reducedM.term,N]},redex:reducedM.redex};
    var reducedN=betaStep(N);
    if(reducedN)return {term:{app:[M,reducedN.term]},redex:reducedN.redex};
    return null;
  }
  if(t.lam){
    var reducedBody=betaStep(t.body);
    if(reducedBody)return {term:{lam:t.lam,body:reducedBody.term},redex:reducedBody.redex};
    return null;
  }
  return null;
}

/* Full normal form with max steps */
function betaNormalize(t,maxSteps){
  var steps=[{term:t,redex:null}];
  var cur=t;
  var n=0;
  while(n<maxSteps){
    var r=betaStep(cur);
    if(!r)break;
    cur=r.term;
    steps.push({term:cur,redex:r.redex});
    n++;
  }
  return steps;
}

registerModule('lambda',{
  title:'Lambda Calculus',
  icon:'λ',
  desc:'β-reduction with normal-order strategy. Capture-avoiding substitution, church numerals, and step-by-step reduction.',
  init:function(){ this.reduce(); },
  reduce:function(){
    var l=STATE.lambda;
    l.error=null;l.term=null;l.steps=[];l.stepIdx=0;
    try{
      l.term=lambdaParse(l.source);
      l.steps=betaNormalize(l.term,200);
      logMsg('λ: '+l.steps.length+' reduction steps','success');
    }catch(e){
      l.error=e.message;
      logMsg('λ error: '+e.message,'error');
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var l=STATE.lambda;
    if(STATE.playing&&l.steps.length>0&&l.stepIdx<l.steps.length-1){
      if(!this._acc)this._acc=0;
      this._acc+=dt*1.5;
      while(this._acc>=1&&l.stepIdx<l.steps.length-1){
        l.stepIdx++;
        this._acc-=1;
      }
    }
  },
  step:function(){var l=STATE.lambda;if(l.stepIdx<l.steps.length-1)l.stepIdx++;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;

    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('λ-TERM',44,42);
    ctx.fillStyle='#e0e0e6';
    ctx.font='bold 18px monospace';

      ctx.font='bold 12px monospace';
      ctx.fillText('✕ '+l.error,44,114);
      updateBadge('λ · error');
      return;
    }
    if(!l.steps.length)return;
    /* Reduction chain */
    var stepY=120;
    var lineH=52;
    var maxVisible=Math.floor((H-200)/lineH);
    var startIdx=Math.max(0,l.stepIdx-maxVisible+1);
    var endIdx=Math.min(l.steps.length,l.stepIdx+1);
    var curIdx=l.stepIdx;
    /* If current is far from top, offset */
    if(curIdx-startIdx>maxVisible){
      startIdx=curIdx-maxVisible+1;
      endIdx=startIdx+maxVisible;
    } else {
      startIdx=Math.max(0,endIdx-maxVisible);
    }
    for(var i=startIdx;i<endIdx;i++){
      var st=l.steps[i];
      var y=stepY+(i-startIdx)*lineH;
      var isCur=i===curIdx;

      ctx.fillStyle=isCur?'rgba(198,120,221,.15)':'rgba(26,26,34,.4)';
      if(isCur){
        ctx.strokeStyle='#c678dd';
        ctx.lineWidth=2;
      } else {
        ctx.strokeStyle='rgba(37,37,50,.8)';

      }

        ctx.font='10px monospace';
        ctx.textAlign='right';
        ctx.fillText('initial term',W-44,y+38);

    }

    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    ctx.fillText(isNF?'✓ NORMAL FORM':'β-reducing…',W-150,H-38);

    ctx.fillStyle='rgba(224,224,230,.7)';

      '<div>Steps: '+l.steps.length+'</div>'+
      '<div>Current: '+curIdx+'</div>'+
      '<div>Free vars: '+Array.from(freeVars(l.steps[curIdx].term)).join(',')+'</div>'
    );
    updateBadge('λ · '+termToString(l.steps[curIdx].term,false).substring(0,40));
    $('sbMode').textContent='Lambda Calculus';
    $('sbSteps').textContent=curIdx;
  },
  onDown:function(p){},
  controls:function(){
    var l=STATE.lambda;
    var html='';
    html+='<div class="sec"><h4>λ-Term</h4>';

    html+='</div>';

    [
      ['Identity','(\\x.x) y'],
      ['K','(\\x.\\y.x) a b'],
      ['Church 2','(\\f.\\x.f (f x)) (\\y.y) z'],
      ['S K K','((\\x.\\y.\\z.x z (y z)) (\\x.\\y.x)) (\\x.\\y.x) w'],

    ].forEach(function(p){
      html+='<div class="chip" onclick="STATE.lambda.source='+JSON.stringify(p[1])+';MODULES.lambda.reduce();renderLeftPanel()">'+p[0]+'</div>';
    });

      '</div></div>'+
      '<div class="sec"><h4>α and η</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">α-conversion:</b> λx.M ≡ λy.M[x:=y] (y not free in M)<br><br>'+
      '<b class="text-c1">η-conversion:</b> λx.(M x) ≡ M (x not free in M)'+

      '<div class="sec"><h4>Evaluation strategy</h4>'+

registerModule('bigo',{
  title:'Big-O Comparator',
  icon:'📈',
  desc:'Plot growth curves side by side. Convert abstract complexity into real wall-clock times on a hypothetical 1e8 ops/sec machine.',
  init:function(){},
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#08080c';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bigo;
    var padX=70,padY=60;
    var plotW=W-padX-40;
    var plotH=H-padY-90;
    var n=b.n;
    /* Compute values */
    var values={};
    var maxVal=0;
    var minVal=Infinity;
    b.functions.forEach(function(f){
      if(!b.visible[f.key])return;
      var v=f.fn(n);
      values[f.key]=v;
      if(v>maxVal)maxVal=v;
      if(v<minVal)minVal=v;
    });
    var useLog=b.logScale;
    var maxLog=Math.log10(Math.max(maxVal,1))+0.01;
    /* Grid */
    ctx.strokeStyle='rgba(97,175,239,.1)';
    for(var i=0;i<=10;i++){
      var y=padY+plotH*(i/10);
      ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(padX+plotW,y);ctx.stroke();
      /* Y label */
      ctx.fillStyle='rgba(160,160,176,.6)';
      ctx.font='10px monospace';
      ctx.textAlign='right';
      if(useLog){
        var exp=maxLog*(1-i/10);
        ctx.fillText('10^'+fmt(exp,1),padX-6,y+3);
      } else {
        var val=maxVal*(1-i/10);
        ctx.fillText(fmt(val,0),padX-6,y+3);
      }
    }
    /* X axis n from 1 to b.n */
    ctx.fillStyle='rgba(160,160,176,.6)';
    ctx.textAlign='center';
    for(var xi=0;xi<=10;xi++){
      var x=padX+plotW*(xi/10);
      ctx.fillText(String(Math.round(1+xi*(n-1)/10)),x,padY+plotH+16);
    }
    ctx.fillStyle='#61afef';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';
    ctx.fillText('n (input size)',padX+plotW/2,padY+plotH+34);
    ctx.save();
    ctx.translate(18,padY+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('operations',0,0);
    ctx.restore();
    /* Draw curves */
    b.functions.forEach(function(f){
      if(!b.visible[f.key])return;
      ctx.strokeStyle=f.color;
      ctx.lineWidth=2.5;
      ctx.beginPath();
      var first=true;
      for(var xi=0;xi<=120;xi++){
        var xx=xi/120;
        var nval=1+xx*(n-1);
        var yv=f.fn(nval);
        var x=padX+xx*plotW;
        var y;
        if(useLog){
          var ly=Math.log10(Math.max(yv,1e-9));
          y=padY+plotH*(1-ly/maxLog);
        } else {
          y=padY+plotH*(1-yv/maxVal);
        }
        y=clamp(y,padY,padY+plotH);
        if(first){ctx.moveTo(x,y);first=false;}
        else ctx.lineTo(x,y);
      }
      ctx.stroke();
    });
    /* Legend */
    var legendX=padX+plotW-220;
    var legendY=padY+10;
    ctx.fillStyle='rgba(19,19,24,.9)';
    ctx.strokeStyle='rgba(97,175,239,.3)';
    ctx.beginPath();ctx.roundRect(legendX-10,legendY-8,220,b.functions.filter(function(f){return b.visible[f.key]}).length*20+16,6);ctx.fill();ctx.stroke();
    var li=0;
    b.functions.forEach(function(f){
      if(!b.visible[f.key])return;
      var ly2=legendY+8+li*20;
      ctx.fillStyle=f.color;
      ctx.fillRect(legendX,ly2-6,16,3);
      ctx.fillStyle='#e0e0e6';
      ctx.font='11px monospace';
      ctx.textAlign='left';
      ctx.fillText(f.name,legendX+22,ly2);
      /* Value at n */
      var ops=f.fn(n);
      var time=ops/b.opsPerSec;
      var timeStr;
      if(time<1e-6)timeStr=fmt(time*1e9,2)+' ns';
      else if(time<1e-3)timeStr=fmt(time*1e6,2)+' µs';
      else if(time<1)timeStr=fmt(time*1e3,2)+' ms';
      else if(time<60)timeStr=fmt(time,2)+' s';
      else if(time<3600)timeStr=fmt(time/60,2)+' min';
      else if(time<86400)timeStr=fmt(time/3600,2)+' h';
      else if(time<31536000)timeStr=fmt(time/86400,2)+' days';
      else timeStr=fmt(time/31536000,1)+' years';
      ctx.fillStyle=f.color;
      ctx.textAlign='right';
      ctx.fillText(timeStr,legendX+200,ly2);
      li++;
    });
    setStatsHTML(
      '<div>n = '+n+'</div>'+
      '<div>Machine: '+fmt(b.opsPerSec/1e9,1)+'e9 ops/s</div>'+
      '<div>Scale: '+(useLog?'log10':'linear')+'</div>'
    );
    updateBadge('📈 Big-O Comparator · n='+n);
    $('sbMode').textContent='Big-O';
    $('sbOps').textContent=fmt(b.opsPerSec/1e9,1)+'e9/s';
  },
  onDown:function(p){},
  controls:function(){
    var b=STATE.bigo;
    var html='';
    html+='<div class="sec"><h4>Input size (n)</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>n</span><span>'+b.n+'</span></div>';
    html+='<input type="range" min="2" max="200" step="1" value="'+b.n+'" oninput="STATE.bigo.n=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="chip-row">';
    [10,32,64,128,200].forEach(function(n){
      html+='<div class="chip '+(b.n===n?'active':'')+'" onclick="STATE.bigo.n='+n+';renderLeftPanel()">n='+n+'</div>';
    });
    html+='</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Machine speed</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>ops/sec</span><span>'+b.opsPerSec.toExponential(1)+'</span></div>';
    html+='<input type="range" min="6" max="12" step="0.5" value="'+Math.log10(b.opsPerSec)+'" oninput="STATE.bigo.opsPerSec=Math.pow(10,parseFloat(this.value));renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Functions</h4>';
    b.functions.forEach(function(f){
      html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
        '<span style="font-size:.66rem;color:'+f.color+';font-family:var(--mono)">'+f.name+'</span>'+
        '<div class="chip '+(b.visible[f.key]?'active':'')+'" onclick="STATE.bigo.visible[\''+f.key+'\']=!STATE.bigo.visible[\''+f.key+'\'];renderLeftPanel()">'+(b.visible[f.key]?'ON':'OFF')+'</div>'+
        '</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Scale</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(b.logScale?'':'active')+'" onclick="STATE.bigo.logScale=false;renderLeftPanel()">Linear</div>';
    html+='<div class="chip '+(b.logScale?'active':'')+'" onclick="STATE.bigo.logScale=true;renderLeftPanel()">Log Y</div>';
    html+='</div></div>';
    /* Summary table */
    html+='<div class="sec"><h4>At n='+b.n+'</h4>';
    html+='<div class="kv">';
    b.functions.forEach(function(f){
      if(!b.visible[f.key])return;
      var ops=f.fn(b.n);
      var time=ops/b.opsPerSec;
      var ts;
      if(time<1e-6)ts=fmt(time*1e9,1)+' ns';
      else if(time<1e-3)ts=fmt(time*1e6,1)+' µs';
      else if(time<1)ts=fmt(time*1e3,1)+' ms';
      else if(time<60)ts=fmt(time,1)+' s';
      else if(time<86400)ts=fmt(time/3600,1)+' h';
      else ts=fmt(time/31536000,1)+' y';
      html+='<div class="row"><span class="k" style="color:'+f.color+'">'+f.name+'</span><span class="v">'+ops.toExponential(2)+' · '+ts+'</span></div>';
    });
    html+='</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Asymptotic notation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">O(f)</b>: upper bound — T(n) ≤ c·f(n) for n ≥ n₀<br>'+
      '<b class="text-c1">Ω(f)</b>: lower bound — T(n) ≥ c·f(n)<br>'+
      '<b class="text-c1">Θ(f)</b>: tight bound — both O and Ω<br>'+
      '<b class="text-c1">o(f)</b>: strictly less (f grows faster)<br>'+
      '<b class="text-c1">ω(f)</b>: strictly greater'+
      '</div></div>'+
      '<div class="sec"><h4>Growth hierarchy</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'O(1) ⊂ O(log n) ⊂ O(√n) ⊂ O(n) ⊂ O(n log n) ⊂ O(n²) ⊂ O(n³) ⊂ O(2ⁿ) ⊂ O(n!)'+
      '</div></div>'+
      '<div class="sec"><h4>Master theorem</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'For T(n) = a·T(n/b) + f(n):<br><br>'+
      'Compare f(n) with n<sup>log_b a</sup>:<br>'+
      '1. f(n) smaller → T(n) = Θ(n<sup>log_b a</sup>)<br>'+
      '2. equal → T(n) = Θ(n<sup>log_b a</sup> · log n)<br>'+
      '3. f(n) larger → T(n) = Θ(f(n))'+
      '</div></div>'+
      '<div class="sec"><h4>P vs NP</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b>P:</b> solvable in polynomial time<br>'+
      '<b>NP:</b> verifiable in polynomial time<br>'+
      '<b>NP-complete:</b> in NP and NP-hard<br>'+
      '<b>NP-hard:</b> at least as hard as any in NP<br><br>'+
      'P = NP? — the biggest open question in CS.'+
      '</div></div>';
  }
});

<script>

function buildTabs(){

function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active')});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active')});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');if(!body)return;
  var m=MODULES[STATE.currentTab];if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.7rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4><div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No theory panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div style="font-size:.6rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b style="color:var(--c1)">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.6rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c2)':l.type==='warn'?'var(--c5)':'var(--c3)';
    html+='<div style="padding:3px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Playing':'Paused','info',900);
}
function stepOnce(){
  var m=MODULES[STATE.currentTab];
  if(m&&m.step)m.step();
  else toast('No step in this module','info',900);
}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
    toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['monokai','light','solarized'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function showHelp(){

    '<b style="color:var(--c1)">Space</b> — Play/pause<br>'+
    '<b style="color:var(--c1)">→</b> — Single step<br>'+

    '<b style="color:var(--c1)">T</b> — Cycle theme<br>'+
    '<b style="color:var(--c1)">?</b> — This help'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='7'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

var BOOT_STEPS=[
  'Compiling regex tables for lexer...',
  'Building recursive-descent parser skeleton...',
  'Constructing Thompson NFA closures...',
  'Seeding sorting algorithm generators...',
  'Wiring Turing machine transition tables...',
  'Instantiating λ-calculus normalizer...',
  'Precomputing Big-O growth curves...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('SYNTAX ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('SYNTAX initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});
