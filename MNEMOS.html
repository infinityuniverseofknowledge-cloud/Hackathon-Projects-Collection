<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<title>MNEMOS — Second Brain OS</title>
<style>
/* ================================================================
   MNEMOS — Design System
   Scholar-inspired · high-contrast · distraction-free
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#fff}

:root{
  --bg:#0a0d14;--bg2:#0e1219;--bg3:#131822;--bg4:#1a2230;
  --panel:#0f141c;--panel2:#161d28;--panel3:#1e2736;--panel4:#26334a;
  --bd:#1c2431;--bd2:#2a3646;--bd3:#3d4d63;
  --tx:#e8eef5;--tx2:#96a4b8;--tx3:#667588;--mu:#465060;
  --c1:#7c5cff;--c1h:#9d7fff;--c1l:#5a3ecc;
  --c2:#f43f5e;--c2h:#fb7185;--c2l:#e11d48;
  --c3:#3b82f6;--c3h:#60a5fa;--c3l:#2563eb;
  --c4:#f59e0b;--c4h:#fbbf24;--c4l:#d97706;
  --c5:#8b5cf6;--c5h:#a78bfa;--c5l:#7c3aed;
  --c6:#06b6d4;--c6h:#22d3ee;--c6l:#0891b2;
  --c7:#ec4899;--c7h:#f472b6;--c7l:#db2777;
  --c8:#84cc16;--c8h:#a3e635;--c8l:#65a30d;
  --c9:#10b981;--c9h:#34d399;--c9l:#059669;
  --c10:#6366f1;--c10h:#818cf8;--c10l:#4338ca;
  --c11:#0ea5e9;--c11h:#38bdf8;--c11l:#0284c7;
  --c12:#a855f7;--c12h:#c084fc;--c12l:#9333ea;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;--info:#3b82f6;
  --critical:#ef4444;--urgent:#f97316;--attention:#f59e0b;--safe:#10b981;
  --g1:linear-gradient(135deg,#7c5cff,#06b6d4);
  --g2:linear-gradient(135deg,#f43f5e,#ec4899);
  --g3:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --g4:linear-gradient(135deg,#f59e0b,#f43f5e);
  --g5:linear-gradient(135deg,#10b981,#84cc16);
  --g6:linear-gradient(135deg,#8b5cf6,#ec4899);
  --gHolo:linear-gradient(120deg,#7c5cff,#f43f5e,#06b6d4,#10b981,#f59e0b,#7c5cff);
  --r:12px;--rs:8px;--rxs:6px;--rxxs:4px;--rf:9999px;
  --sh1:0 1px 3px rgba(0,0,0,.4);
  --sh2:0 4px 12px rgba(0,0,0,.5);
  --sh3:0 8px 32px rgba(0,0,0,.7);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --serif:'Georgia','Times New Roman',serif;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f5f7fa;--bg2:#eef1f6;--bg3:#e4e9f0;--bg4:#d6dde8;
  --panel:#ffffff;--panel2:#f8fafc;--panel3:#eef2f7;--panel4:#dde4ee;
  --bd:#dde4ee;--bd2:#b8c2d0;--bd3:#94a3b8;
  --tx:#0f172a;--tx2:#475569;--tx3:#64748b;--mu:#94a3b8;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
  --shIn:inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="sepia"]{
  --bg:#1e1812;--bg2:#28211a;--bg3:#332c22;--bg4:#443a2e;
  --panel:#241d16;--panel2:#2e2620;--panel3:#3c332a;--panel4:#4c4034;
  --bd:#3c332a;--bd2:#584a3c;--bd3:#786450;
  --tx:#f5e8d5;--tx2:#c0a890;--tx3:#887058;--mu:#5c4a3a;
  --c1:#d4a574;--c1h:#e0c0a0;--c1l:#a88050;
}
[data-theme="nord"]{
  --bg:#2e3440;--bg2:#3b4252;--bg3:#434c5e;--bg4:#4c566a;
  --panel:#3b4252;--panel2:#434c5e;--panel3:#4c566a;--panel4:#5b667a;
  --bd:#4c566a;--bd2:#5b667a;--bd3:#7b8ba0;
  --tx:#eceff4;--tx2:#d8dee9;--tx3:#b0b8c8;--mu:#7b8ba0;
  --c1:#88c0d0;--c1h:#9fd0df;--c1l:#5e81ac;
}
[data-theme="solarized"]{
  --bg:#002b36;--bg2:#073642;--bg3:#0d4351;--bg4:#175263;
  --panel:#073642;--panel2:#0d4351;--panel3:#175263;--panel4:#226078;
  --bd:#175263;--bd2:#226078;--bd3:#3a7890;
  --tx:#fdf6e3;--tx2:#eee8d5;--tx3:#93a1a1;--mu:#657b83;
  --c1:#268bd2;--c1h:#4a9fd8;--c1l:#1a6ea0;
  --c4:#b58900;--c4h:#cb9a10;--c4l:#8a6800;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

/* ================================================================
   LAYOUT
   ================================================================ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--g1);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(124,92,255,.5);
}
.sb-title{font-weight:800;font-size:1rem;letter-spacing:1px;line-height:1;font-family:var(--serif)}
.sb-sub{font-size:.56rem;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px;font-weight:600}
.sb-stats{
  padding:8px 16px;background:var(--bg2);
  border-bottom:1px solid var(--bd);
  display:flex;gap:10px;font-size:.6rem;flex-shrink:0;
  font-family:var(--mono);
}
.sb-stats .si{display:flex;flex-direction:column;gap:2px;flex:1}
.sb-stats .si .v{color:var(--c1);font-weight:800;font-size:.85rem}
.sb-stats .si .l{color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-size:.5rem}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.56rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.4px;text-transform:uppercase;
  padding:12px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(124,92,255,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.58rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#fff;
  min-width:18px;text-align:center;
}
.nav-item.active .ni-badge{background:rgba(255,255,255,.25)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:56px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.15rem;align-items:center;justify-content:center;
}
.tb-menu:hover{background:var(--panel2);color:var(--tx)}
.tb-title{font-weight:700;font-size:1rem;flex-shrink:0;font-family:var(--serif);letter-spacing:.3px}
.tb-sub{font-size:.65rem;color:var(--tx3);margin-left:6px;font-weight:500}
.tb-search{flex:1;max-width:420px;position:relative;margin-left:auto}
.tb-search input{
  width:100%;padding:9px 14px 9px 40px;
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:var(--rxs);color:var(--tx);
  font-size:.78rem;transition:var(--t);
}
.tb-search input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.tb-search .icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--tx3);font-size:.85rem;pointer-events:none;
}
.tb-search .kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:.6rem;color:var(--tx3);
  padding:2px 5px;background:var(--panel3);border-radius:3px;
}
.tb-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:5px;right:5px;
  min-width:17px;height:17px;padding:0 4px;
  background:var(--c2);color:#fff;
  border-radius:var(--rf);
  font-size:.58rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:22px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.4rem;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;font-family:var(--serif)}
.page-desc{font-size:.75rem;color:var(--tx3);margin-top:4px}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);
  color:var(--tx);font-size:.76rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--bd2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,92,255,.35)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(124,92,255,.5)}
.btn.pink{background:var(--g2);color:#fff;border-color:transparent}
.btn.blue{background:var(--g3);color:#fff;border-color:transparent}
.btn.warn{background:var(--g4);color:#fff;border-color:transparent}
.btn.success{background:var(--g5);color:#fff;border-color:transparent}
.btn.danger{background:var(--c2);color:#fff;border-color:transparent}
.btn.danger:hover{background:var(--c2h)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.7rem}
.btn.xs{padding:3px 8px;font-size:.65rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:24px}
.card.pad-sm{padding:12px}
.card-accent{border-left:4px solid var(--c1);background:linear-gradient(135deg,var(--panel),rgba(124,92,255,.06))}
.card-pink{border-left:4px solid var(--c2);background:linear-gradient(135deg,var(--panel),rgba(244,63,94,.06))}
.card-blue{border-left:4px solid var(--c3);background:linear-gradient(135deg,var(--panel),rgba(59,130,246,.06))}
.card-warn{border-left:4px solid var(--c4);background:linear-gradient(135deg,var(--panel),rgba(245,158,11,.06))}
.card-green{border-left:4px solid var(--c9);background:linear-gradient(135deg,var(--panel),rgba(16,185,129,.06))}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;margin-bottom:20px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  position:relative;overflow:hidden;
  transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.pink::before{background:var(--g2)}
.kpi.blue::before{background:var(--g3)}
.kpi.warn::before{background:var(--g4)}
.kpi.green::before{background:var(--g5)}
.kpi.purple::before{background:var(--g6)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:8px;
}
.kpi-value{
  font-size:1.6rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;
  color:var(--tx);
}
.kpi-unit{font-size:.68rem;font-weight:600;color:var(--tx3);margin-left:3px}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:8px;line-height:1.4}
.kpi-delta{
  font-size:.66rem;font-weight:600;margin-top:6px;
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:var(--rf);
}
.kpi-delta.up{background:rgba(16,185,129,.15);color:var(--ok)}
.kpi-delta.down{background:rgba(239,68,68,.15);color:var(--err)}
.kpi-delta.neutral{background:var(--panel3);color:var(--tx3)}

/* ================================================================
   TABLES
   ================================================================ */
.table-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700;font-family:var(--serif)}
.table-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:10px 14px;text-align:left;
  font-size:.6rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.7px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{padding:11px 14px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

tr.p-critical td:first-child{border-left:4px solid var(--critical)}
tr.p-urgent td:first-child{border-left:4px solid var(--urgent)}
tr.p-attention td:first-child{border-left:4px solid var(--attention)}
tr.p-safe td:first-child{border-left:4px solid var(--safe)}
tr.p-info td:first-child{border-left:4px solid var(--info)}

/* ================================================================
   BADGES
   ================================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;
  white-space:nowrap;
}
.badge.critical{background:rgba(239,68,68,.18);color:var(--critical);border:1px solid rgba(239,68,68,.35)}
.badge.urgent{background:rgba(249,115,22,.18);color:var(--urgent);border:1px solid rgba(249,115,22,.35)}
.badge.attention{background:rgba(245,158,11,.18);color:var(--attention);border:1px solid rgba(245,158,11,.35)}
.badge.safe{background:rgba(16,185,129,.18);color:var(--safe);border:1px solid rgba(16,185,129,.35)}
.badge.info{background:rgba(59,130,246,.18);color:var(--info);border:1px solid rgba(59,130,246,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}
.badge.purple{background:rgba(124,92,255,.18);color:var(--c1);border:1px solid rgba(124,92,255,.35)}

.tag{
  display:inline-block;padding:2px 7px;background:var(--panel3);
  border-radius:100px;font-size:.58rem;color:var(--tx2);
  margin:2px;font-weight:600;transition:var(--t);cursor:pointer;
}
.tag:hover{background:var(--c1);color:#fff}

/* ================================================================
   FORMS
   ================================================================ */
.form{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-size:.66rem;font-weight:700;
  color:var(--tx2);text-transform:uppercase;
  letter-spacing:.55px;
}
.field label .req{color:var(--c2);margin-left:3px}
.field label .hint{color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0;font-size:.65rem;margin-left:6px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.78rem;transition:var(--t);
  font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(124,92,255,.15);
}
.field textarea{resize:vertical;min-height:80px;line-height:1.55;font-family:var(--mono)}
.field small{font-size:.63rem;color:var(--tx3)}

/* ================================================================
   MODAL
   ================================================================ */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.modal-head h2{font-size:1rem;font-weight:700;font-family:var(--serif)}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;
  flex-wrap:wrap;
}

/* ================================================================
   TOASTS
   ================================================================ */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd);
  border-left:3px solid var(--info);
  box-shadow:var(--sh3);
  font-size:.75rem;font-weight:500;
  max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--safe)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast.purple{border-left-color:var(--c1)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* ================================================================
   CHARTS
   ================================================================ */
.chart-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px;font-family:var(--serif)}
.chart-canvas{width:100%;height:220px;display:block}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;
  font-size:.68rem;color:var(--tx2);
}
.chart-legend .li{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:10px;height:10px;border-radius:2px}

/* ================================================================
   MISC
   ================================================================ */
.empty{
  text-align:center;padding:48px 20px;color:var(--tx3);
  font-size:.8rem;
}
.empty .icon{font-size:2.6rem;margin-bottom:12px;opacity:.4;display:block}
.empty h4{font-size:.9rem;color:var(--tx2);margin-bottom:6px;font-weight:600;font-family:var(--serif)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 11px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.68rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#fff;border-color:var(--c1)}

.divider{height:1px;background:var(--bd);margin:16px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--bd);
  font-size:.76rem;gap:12px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}
.stat-line .sl-value.pos{color:var(--ok)}
.stat-line .sl-value.neg{color:var(--err)}

.spinner{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--bd);border-top-color:var(--c1);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Board grid */
.board-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
.board-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  transition:var(--t);cursor:pointer;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.board-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.board-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;bottom:0;
  background:var(--c1);
}
.board-card.pink::before{background:var(--c2)}
.board-card.blue::before{background:var(--c3)}
.board-card.warn::before{background:var(--c4)}
.board-card.purple::before{background:var(--c5)}
.board-card.green::before{background:var(--c9)}
.bc-head{
  display:flex;justify-content:space-between;align-items:start;gap:10px;
  margin-bottom:10px;
}
.bc-title{font-weight:700;font-size:.88rem;line-height:1.3;color:var(--tx);font-family:var(--serif)}
.bc-meta{font-size:.66rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.bc-desc{
  font-size:.74rem;color:var(--tx2);line-height:1.55;
  margin-bottom:12px;flex:1;
}
.bc-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--bd);
  font-size:.66rem;color:var(--tx3);
  gap:8px;flex-wrap:wrap;
}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* Note editor */
.note-editor{
  display:flex;flex-direction:column;height:100%;
  background:var(--bg2);
}
.note-editor .ne-head{
  padding:12px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:10px;
  background:var(--panel);flex-shrink:0;flex-wrap:wrap;
}
.note-editor .ne-title{
  flex:1;background:transparent;border:none;
  color:var(--tx);font-size:1.1rem;font-weight:700;
  font-family:var(--serif);min-width:200px;
}
.note-editor .ne-body{
  flex:1;overflow-y:auto;padding:20px;
}
.note-editor textarea.ne-text{
  width:100%;min-height:400px;background:transparent;
  border:none;color:var(--tx);font-size:.85rem;
  line-height:1.8;resize:none;font-family:var(--serif);
  padding:0;
}
.note-editor .ne-meta{
  padding:8px 16px;background:var(--panel);
  border-top:1px solid var(--bd);
  display:flex;gap:14px;align-items:center;
  font-size:.65rem;color:var(--tx3);
  font-family:var(--mono);flex-shrink:0;flex-wrap:wrap;
}

/* Wiki links */
.wikilink{
  color:var(--c1);font-weight:600;
  cursor:pointer;text-decoration:none;
  border-bottom:1px dotted var(--c1);
  padding:0 2px;
}
.wikilink:hover{background:rgba(124,92,255,.15);border-radius:3px}
.wikilink.missing{color:var(--c4);border-bottom-color:var(--c4)}

/* Knowledge graph */
.graph-wrap{
  position:relative;background:var(--bg2);
  border:1px solid var(--bd);border-radius:var(--r);
  overflow:hidden;height:560px;
}
.graph-canvas{display:block;width:100%;height:100%;cursor:grab}
.graph-canvas:active{cursor:grabbing}
.graph-hud{
  position:absolute;top:12px;left:12px;
  background:rgba(15,20,28,.9);backdrop-filter:blur(8px);
  border:1px solid var(--bd);border-radius:var(--rxs);
  padding:10px 12px;font-size:.66rem;
  pointer-events:none;
}
.graph-hud .hud-row{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.graph-hud .hud-row .k{color:var(--tx3)}
.graph-hud .hud-row .v{color:var(--c1);font-family:var(--mono);font-weight:700}

/* Flashcard */
.flashcard{
  perspective:1200px;
  max-width:640px;margin:0 auto;
  height:400px;
  cursor:pointer;
}
.flashcard-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .6s;
}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:32px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  text-align:center;overflow-y:auto;
  box-shadow:var(--sh2);
}
.flashcard-back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--panel),rgba(124,92,255,.08))}
.flashcard-face .fc-label{
  position:absolute;top:14px;left:20px;
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:1.5px;
}
.flashcard-face .fc-content{
  font-size:1.2rem;line-height:1.6;font-family:var(--serif);
  color:var(--tx);max-width:90%;
}
.flashcard-face .fc-hint{
  position:absolute;bottom:14px;
  font-size:.62rem;color:var(--tx3);font-family:var(--mono);
}
.srs-buttons{
  display:flex;gap:8px;justify-content:center;
  margin-top:20px;flex-wrap:wrap;
}
.srs-btn{
  display:flex;flex-direction:column;align-items:center;
  padding:10px 20px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);
  cursor:pointer;transition:var(--t);min-width:100px;
}
.srs-btn:hover{transform:translateY(-2px);border-color:var(--c1)}
.srs-btn .sb-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.srs-btn .sb-time{font-size:.6rem;color:var(--tx3);font-family:var(--mono);margin-top:3px}
.srs-btn.again{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.35);color:var(--c2)}
.srs-btn.hard{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.35);color:var(--c4)}
.srs-btn.good{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.35);color:var(--c3)}
.srs-btn.easy{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.35);color:var(--c9)}

/* Pomodoro */
.pomo-timer{
  text-align:center;
  padding:40px 20px;
}
.pomo-timer .pt-display{
  font-family:var(--mono);font-size:5rem;font-weight:200;
  letter-spacing:6px;line-height:1;
  color:var(--c1);
  margin-bottom:10px;
}
.pomo-timer .pt-mode{
  font-size:.8rem;font-weight:700;
  text-transform:uppercase;letter-spacing:3px;
  color:var(--tx3);margin-bottom:24px;
}
.pomo-timer .pt-controls{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
.pomo-timer .pt-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.pomo-timer .pt-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--panel3);border:2px solid var(--bd2);
}
.pomo-timer .pt-dot.done{background:var(--c9);border-color:var(--c9)}

/* Reading item */
.reading-item{
  display:flex;gap:12px;padding:12px;
  background:var(--panel2);border-radius:var(--rxs);
  border-left:4px solid var(--bd2);
  transition:var(--t);margin-bottom:8px;
}
.reading-item:hover{border-left-color:var(--c1);background:var(--panel3)}
.reading-item.status-reading{border-left-color:var(--c4)}
.reading-item.status-finished{border-left-color:var(--c9)}
.reading-item .ri-cover{
  width:50px;height:70px;border-radius:4px;flex-shrink:0;
  background:var(--panel3);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;
}
.reading-item .ri-body{flex:1;min-width:0}
.reading-item .ri-title{font-weight:700;font-size:.82rem;font-family:var(--serif)}
.reading-item .ri-author{font-size:.68rem;color:var(--tx3);margin-top:2px}
.reading-item .ri-progress{margin-top:6px;height:4px;background:var(--panel3);border-radius:2px;overflow:hidden}
.reading-item .ri-progress-fill{height:100%;background:var(--g1);border-radius:2px}

/* Calendar heatmap */
.heatmap{
  display:grid;
  grid-template-columns:repeat(53,1fr);
  gap:2px;overflow-x:auto;padding:6px 0;
}
.heatmap-cell{
  aspect-ratio:1;border-radius:2px;
  background:var(--panel3);cursor:pointer;
  transition:var(--t);min-width:10px;
}
.heatmap-cell:hover{transform:scale(1.5);z-index:2;box-shadow:0 0 10px var(--c1)}

/* Rich text editor toolbar */
.rt-toolbar{
  display:flex;gap:2px;padding:4px;
  background:var(--panel2);border-radius:var(--rxs);
  margin-bottom:8px;flex-wrap:wrap;
}
.rt-btn{
  width:28px;height:28px;border-radius:var(--rxxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);
}
.rt-btn:hover{background:var(--panel3);color:var(--tx)}
.rt-btn.active{background:var(--c1);color:#fff}

/* Timer bar */
.timer-bar{
  position:fixed;bottom:20px;left:20px;z-index:900;
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:10px 16px;
  box-shadow:var(--sh2);
  display:none;align-items:center;gap:12px;
  animation:toastIn .3s;
}
.timer-bar.active{display:flex}
.timer-bar .tb-time{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--c1)}
.timer-bar .tb-label{font-size:.7rem;color:var(--tx2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Search palette */
.search-palette{
  position:fixed;top:15vh;left:50%;transform:translateX(-50%);
  z-index:1500;width:min(680px,94vw);
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh3);
  display:none;flex-direction:column;overflow:hidden;
  max-height:70vh;
}
.search-palette.open{display:flex;animation:toastIn .2s}
.sp-input-wrap{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sp-input{flex:1;background:transparent;border:none;color:var(--tx);font-size:1rem}
.sp-input::placeholder{color:var(--tx3)}
.sp-tabs{display:flex;padding:4px 8px;border-bottom:1px solid var(--bd);overflow-x:auto;gap:2px}
.sp-tab{
  padding:5px 10px;border-radius:var(--rxxs);
  font-size:.68rem;color:var(--tx3);cursor:pointer;
  white-space:nowrap;transition:var(--t);
}
.sp-tab:hover{background:var(--panel2);color:var(--tx)}
.sp-tab.active{background:var(--c1);color:#fff}
.sp-results{max-height:400px;overflow-y:auto}
.sp-result{
  padding:10px 20px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-size:.78rem;transition:var(--t);
  border-left:3px solid transparent;
}
.sp-result:hover,.sp-result.active{background:var(--panel2);border-left-color:var(--c1)}
.sp-result .sp-icon{font-size:1.2rem;width:28px;text-align:center}
.sp-result .sp-main{flex:1;min-width:0}
.sp-result .sp-title{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-result .sp-sub{font-size:.65rem;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-result .sp-cat{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700}

/* Print */
@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .page{padding:0;background:#fff;color:#000}
  body{overflow:visible;height:auto;background:#fff;color:#000}
  .modal{position:static;background:none;display:block!important}
  .modal-box{max-width:none;box-shadow:none;border:none;background:#fff;color:#000}
  .modal-head,.modal-foot{display:none}
  .modal-body{padding:0;overflow:visible}
}

@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh3)}
  .tb-menu{display:flex}
  .form-row,.form-row.three{grid-template-columns:1fr}
  .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}
  .page{padding:14px}
  .page-title{font-size:1.15rem}
  .kpi-value{font-size:1.3rem}
  .tb-search{display:none}
  .board-grid{grid-template-columns:1fr}
  .heatmap{grid-template-columns:repeat(26,1fr)}
}
@media (min-width:901px){.sidebar{transform:none!important}}

.text-critical{color:var(--critical)}
.text-urgent{color:var(--urgent)}
.text-attention{color:var(--attention)}
.text-safe{color:var(--safe)}
.text-info{color:var(--info)}
.text-mu{color:var(--tx3)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">🧠</div>
      <div style="flex:1;min-width:0">
        <div class="sb-title">MNEMOS</div>
        <div class="sb-sub">Second Brain OS</div>
      </div>
      <button class="icon-btn" onclick="closeSidebar()" id="sbClose">✕</button>
    </div>
    <div class="sb-stats" id="sbStats"></div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="tb-menu" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="tb-title" id="tbTitle">Dashboard</div>
        <div class="tb-sub" id="tbSub">Your knowledge at a glance</div>
      </div>
      <div class="tb-search" onclick="showSearchPalette()">
        <span class="icon">🔍</span>
        <input type="text" id="globalSearch" placeholder="Search notes, cards, sources..." readonly>
        <span class="kbd">Ctrl+K</span>
      </div>
      <div class="tb-actions">
        <button class="icon-btn" onclick="startQuickCapture()" title="Quick capture">⚡</button>
        <button class="icon-btn" onclick="startFocusSession()" title="Focus session" id="focusBtn">⏱️</button>
        <button class="icon-btn" onclick="showAlerts()" title="Alerts">
          🔔<span class="badge" id="alertBadge" style="display:none">0</span>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌓</button>
        <button class="icon-btn" onclick="openHelp()" title="Help">❓</button>
      </div>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox">
    <div class="modal-head">
      <h2 id="modalTitle">Modal</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="search-palette" id="searchPalette">
  <div class="sp-input-wrap">
    <span style="font-size:1rem;color:var(--tx3)">🔍</span>
    <input type="text" class="sp-input" id="spInput" placeholder="Search everything..." autocomplete="off">
    <span style="font-family:var(--mono);font-size:.6rem;color:var(--tx3)">Esc</span>
  </div>
  <div class="sp-tabs" id="spTabs"></div>
  <div class="sp-results" id="spResults"></div>
</div>

<div class="timer-bar" id="timerBar">
  <span style="font-size:1.2rem">⏱️</span>
  <div>
    <div class="tb-time" id="timerDisplay">25:00</div>
    <div class="tb-label" id="timerLabel">Focus</div>
  </div>
  <button class="icon-btn" onclick="toggleTimer()" id="timerToggle">⏸</button>
  <button class="icon-btn" onclick="stopTimer()">✕</button>
</div>
<script>
"use strict";
/* ================================================================
   MNEMOS — Core Runtime
   ================================================================ */

function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k==='text')e.textContent=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0)e[k]=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  if(children){
    if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    else e.appendChild(children);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  var s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return fmtDateShort(iso);
}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function addDays(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function lastNDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function startOfWeek(iso){
  var d=iso?new Date(iso):new Date();
  var day=d.getDay();
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function parseNum(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function safeFloat(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}
function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function truncate(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function uniq(arr){var s={};return arr.filter(function(x){if(s[x])return false;s[x]=1;return true})}
function bytes(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function uuid4(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}
function hashStr(s){
  var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
  return Math.abs(h).toString(36);
}

var Crypto={
  async deriveKey(passphrase,salt){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(passphrase),{name:'PBKDF2'},false,['deriveKey']);
    return await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
    );
  },
  async encrypt(pt,pass){
    if(!window.crypto||!window.crypto.subtle)throw new Error('Web Crypto unavailable');
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await this.deriveKey(pass,salt);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(pt));
    var combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
    combined.set(salt,0);combined.set(iv,salt.length);combined.set(new Uint8Array(ct),salt.length+iv.length);
    return this.b64(combined);
  },
  async decrypt(b64,pass){
    var data=this.unb64(b64);
    var salt=data.slice(0,16),iv=data.slice(16,28),ct=data.slice(28);
    var key=await this.deriveKey(pass,salt);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  },
  b64(buf){
    var bin='',b=new Uint8Array(buf);
    for(var i=0;i<b.byteLength;i++)bin+=String.fromCharCode(b[i]);
    return btoa(bin);
  },
  unb64(str){
    var bin=atob(str),b=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
    return b;
  }
};

function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*((max-min)/4))).toFixed(range<10?1:0),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    ctx.fillText(d.x,padL+(i/(len-1||1))*cW,H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#7c5cff','#f43f5e','#3b82f6','#f59e0b','#8b5cf6'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}
      else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);ctx.lineTo(padL,padT+cH);
      ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    }
    ctx.beginPath();
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      ctx.moveTo(x,y);ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=color;ctx.fill();
  });
}

function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=42,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*(max/4))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7;
  var gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    ctx.fillStyle=d.color||opts.color||'#7c5cff';
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);
    ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);ctx.lineTo(x,padT+cH);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>8)label=label.slice(0,7)+'…';
    ctx.fillText(label,x+bw/2,H-10);
  });
}

function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-24;
  var inner=r*0.6;
  var start=-Math.PI/2;
  var colors=['#7c5cff','#f43f5e','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#84cc16','#06b6d4'];
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||colors[i%colors.length];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.label||'Total',cx,cy+18);
}

function calcStreak(){
  var streak=0;
  var d=today();
  while(true){
    var n=State.notes.filter(function(x){return (x.createdAt||'').slice(0,10)===d}).length;
    var s=State.cardReviewsToday(d);
    var h=State.habitLogs.filter(function(x){return x.date===d}).length;
    if(n+s+h>0){streak++;d=addDays(d,-1)}
    else break;
    if(streak>365)break;
  }
  return streak;
}
State.cardReviewsToday=function(d){
  return State.cards.filter(function(c){return c.lastReview&&c.lastReview.slice(0,10)===d}).length;
};

function quickLogHabit(id){
  var existing=State.habitLogs.find(function(h){return h.habitId===id&&h.date===today()});
  if(existing){
    State.habitLogs=State.habitLogs.filter(function(h){return !(h.habitId===id&&h.date===today())});
    toast('Habit unmarked','info');
  }else{
    var hab=State.habits.find(function(h){return h.id===id});
    State.habitLogs.push({
      id:uid('hlog'),
      habitId:id,
      date:today(),
      value:hab?hab.target:1,
      completed:true,
      createdAt:nowISO()
    });
    toast('Habit logged ✓','success');
  }
  saveState();renderPage();
}

    body+='<div style="font-size:.7rem;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">← Backlinks ('+backlinks.length+')</div>';

    });

  }
  body+='</div>';
  body+='<div class="ne-meta" id="neMeta">';
  body+='<span>'+((n.body||'').split(/\s+/).filter(Boolean).length)+' words</span>';
  body+='<span id="neTagsDisplay">'+(n.tags||[]).map(function(t){return '#'+t}).join(' ')+'</span>';

  openModal({
    title:'Edit Note',
    wide:true,
    body:body,
    foot:'<span style="flex:1"></span>',
    onOpen:function(){
      var ta=$('neBody');
      var ti=$('neTitle');
      $('neSave').onclick=saveNoteFromEditor;
      ti.onkeydown=function(e){if(e.key==='Tab'){e.preventDefault();ta.focus()}};
      ta.addEventListener('input',updateNoteMeta);
      ta.addEventListener('keydown',function(e){
        if(e.key==='Tab'){e.preventDefault();var s=this.selectionStart;this.value=this.value.substr(0,s)+'  '+this.value.substr(this.selectionEnd);this.selectionStart=this.selectionEnd=s+2}
        if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveNoteFromEditor()}
      });
      ti.focus();
    }

function updateNoteMeta(){
  var ta=$('neBody');
  if(!ta)return;
  var meta=$('neMeta');
  if(!meta)return;
  var words=ta.value.split(/\s+/).filter(Boolean).length;
  var chars=ta.value.length;
  var links=(ta.value.match(/\[\[([^\]]+)\]\]/g)||[]).length;
  meta.querySelector('span').textContent=words+' words · '+chars+' chars · '+links+' links';
}

function saveNoteFromEditor(){
  var n=State.notes.find(function(x){return x.id===window._editNoteId});
  if(!n)return;
  var title=$('neTitle').value.trim()||'Untitled';
  var bodyText=$('neBody').value;
  n.title=title;
  n.body=bodyText;
  n.wordCount=bodyText.split(/\s+/).filter(Boolean).length;
  n.updatedAt=nowISO();
  // Auto-extract tags from body
  var hashTags=(bodyText.match(/#(\w+)/g)||[]).map(function(t){return t.substring(1)});
  var existing=n.tags||[];
  var combined=uniq(existing.concat(hashTags));
  n.tags=combined;
  combined.forEach(function(t){
    if(!State.tags.find(function(x){return x.name===t})){
      State.tags.push({id:uid('tag'),name:t,createdAt:nowISO()});
    }
  });
  // Auto-extract wikilinks and create stub notes if missing
  var wikilinks=(bodyText.match(/\[\[([^\]]+)\]\]/g)||[]).map(function(m){return m.slice(2,-2)});
  wikilinks.forEach(function(wl){
    wl=wl.trim();
    if(!wl)return;
    var exists=State.notes.some(function(x){return x.title.toLowerCase()===wl.toLowerCase()});
    if(!exists){
      State.notes.push({
        id:uid('note'),
        title:wl,
        body:'(stub — click to fill in)',
        tags:[],
        folder:'inbox',
        starred:false,
        archived:false,
        createdAt:nowISO(),
        updatedAt:nowISO(),
        wordCount:0
      });
      logActivity('note','Auto-created stub: '+wl);
    }
  });
  logActivity('note','Updated note: '+title);
  saveState();
  closeModal();
  renderPage();
  renderNav();
  toast('Note saved','success');
}

function toggleStarNote(id){
  var n=State.notes.find(function(x){return x.id===id});

  n.starred=!n.starred;

    // update button visual
    var btn=document.querySelector('.ne-head button[onclick*="toggleStarNote"]');

function findBacklinks(title){

  var re=new RegExp('\\[\\['+escRe(title)+'\\]\\]','i');
  return State.notes.filter(function(n){
    return n.body&&re.test(n.body);
  });
}

function after_daily(){
  var hm=$('dailyHeatmap');
  if(!hm)return;
  var weeks=12;
  var days=weeks*7;
  var total=days;
  var cells=[];
  var start=addDays(today(),-total+1);
  for(var i=0;i<total;i++){
    var d=addDays(start,i);
    var count=State.notes.filter(function(x){return (x.createdAt||'').slice(0,10)===d}).length+
              State.habitLogs.filter(function(x){return x.date===d}).length+
              State.cards.filter(function(x){return x.lastReview&&x.lastReview.slice(0,10)===d}).length;
    cells.push({date:d,count:count});
  }
  var html='';
  cells.forEach(function(c){
    var intensity=Math.min(1,c.count/5);
    var bg=intensity>0?'rgba(124,92,255,'+(0.3+intensity*0.7)+')':'var(--panel3)';
    html+='<div class="heatmap-cell" style="background:'+bg+'" title="'+fmtDate(c.date)+': '+c.count+' activities"></div>';
  });
  hm.innerHTML=html;
}

/* ================================================================

   ================================================================ */
function dueCards(){
  var t=today();
  return State.cards.filter(function(c){return !c.due||c.due<=t});
}

var ReviewState={queue:[],current:null,flipped:false,sessionCards:0,sessionCorrect:0,startedAt:null};

function render_flashcards(){
  var due=dueCards();
  var totalCards=State.cards.length;
  var reviewed7=State.cards.filter(function(c){return c.lastReview&&daysBetween(c.lastReview.slice(0,10),today())<=7}).length;
  var streak=0;
  var d=today();
  while(true){
    var n=State.cards.filter(function(c){return c.lastReview&&c.lastReview.slice(0,10)===d}).length;
    if(n>0){streak++;d=addDays(d,-1)}else break;
    if(streak>365)break;
  }

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">🎴 Flashcards</div>';
  html+='<div class="page-desc">Spaced repetition review</div></div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html+='<button class="btn" onclick="navigate(\'decks\')">📚 Decks</button>';
  html+='<button class="btn primary" onclick="editCard(null)">➕ New Card</button>';
  html+='</div></div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi pink"><div class="kpi-label">Due now</div><div class="kpi-value">'+due.length+'</div><div class="kpi-hint">'+(due.length>0?'Ready to review':'✓ Caught up')+'</div></div>';
  html+='<div class="kpi purple"><div class="kpi-label">Total cards</div><div class="kpi-value">'+totalCards+'</div></div>';
  html+='<div class="kpi green"><div class="kpi-label">Reviews (7d)</div><div class="kpi-value">'+reviewed7+'</div></div>';
  html+='<div class="kpi warn"><div class="kpi-label">Streak</div><div class="kpi-value">'+streak+'<span class="kpi-unit">days</span></div></div>';
  html+='</div>';

  if(due.length===0){
    html+='<div class="empty"><span class="icon">✓</span><h4>All caught up!</h4><p>No cards due for review. Come back tomorrow.</p></div>';
    // Show stats
    html+='<div class="chart-box" style="margin-top:20px"><h3>Reviews over time (30 days)</h3><canvas class="chart-canvas" id="fcHistoryChart"></canvas></div>';
    return html;
  }

  html+='<div class="card" style="text-align:center;margin-bottom:16px;background:linear-gradient(135deg,var(--panel),rgba(244,63,94,.08))">';
  html+='<div style="font-size:.7rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Ready for review</div>';
  html+='<div style="font-size:2.4rem;font-weight:800;font-family:var(--mono);color:var(--c2);line-height:1">'+due.length+'</div>';
  html+='<button class="btn primary lg mt-16" onclick="startReview()">▶ Start Review Session</button>';
  html+='</div>';

  // Deck breakdown
  html+='<h3 style="font-size:.88rem;margin:20px 0 12px;font-family:var(--serif)">By deck</h3>';
  html+='<div class="board-grid">';
  State.cardDecks.forEach(function(deck){
    var deckCards=State.cards.filter(function(c){return c.deckId===deck.id});
    var deckDue=deckCards.filter(function(c){return !c.due||c.due<=today()}).length;
    html+='<div class="board-card" style="border-left-color:'+deck.color+'" onclick="startReview(\''+deck.id+'\')">';
    html+='<div class="bc-head">';
    html+='<div style="flex:1"><div class="bc-title">'+esc(deck.name)+'</div>';
    html+='<div class="bc-meta"><span>'+deckCards.length+' cards</span></div></div>';
    if(deckDue>0)html+='<span class="badge urgent">'+deckDue+' due</span>';
    else html+='<span class="badge safe">✓</span>';
    html+='</div>';
    html+='<div class="bc-desc">'+esc(deck.description||'')+'</div>';
    html+='</div>';
  });
  html+='</div>';

  return html;
}

function after_flashcards(){
  var c=$('fcHistoryChart');
  if(!c)return;
  var days=lastNDays(30);
  var data=days.map(function(d){
    var n=State.cards.filter(function(c2){return c2.lastReview&&c2.lastReview.slice(0,10)===d}).length;
    return {x:d.slice(5),y:n};
  });
  drawBarChart(c,data,{color:'#f43f5e'});
}

function startReview(deckId){
  var queue;
  if(deckId){
    queue=State.cards.filter(function(c){return c.deckId===deckId&&(!c.due||c.due<=today())});
  }else{
    queue=dueCards().slice();
  }
  if(!queue.length){toast('No cards to review','info');return}
  // Sort by due date (oldest first)
  queue.sort(function(a,b){return (a.due||'').localeCompare(b.due||'')});
  ReviewState.queue=queue;
  ReviewState.sessionCards=0;
  ReviewState.sessionCorrect=0;
  ReviewState.startedAt=Date.now();
  nextCard();
}

function nextCard(){
  if(ReviewState.queue.length===0){
    endReviewSession();
    return;
  }
  ReviewState.current=ReviewState.queue.shift();
  ReviewState.flipped=false;
  renderReview();
}

function renderReview(){
  var c=ReviewState.current;
  if(!c){endReviewSession();return}
  var deck=State.cardDecks.find(function(d){return d.id===c.deckId});
  var body='';
  body+='<div class="flashcard" onclick="flipCard()" id="flashcardEl">';
  body+='<div class="flashcard-inner">';
  body+='<div class="flashcard-face">';
  body+='<div class="fc-label">Question</div>';
  body+='<div class="fc-content">'+esc(c.front)+'</div>';
  body+='<div class="fc-hint">Click to flip · Space to reveal</div>';
  body+='</div>';
  body+='<div class="flashcard-face flashcard-back">';
  body+='<div class="fc-label">Answer</div>';
  body+='<div class="fc-content">'+renderMultiline(c.back)+'</div>';
  body+='<div class="fc-hint">Rate your recall below</div>';
  body+='</div>';
  body+='</div></div>';
  body+='<div style="text-align:center;margin-top:14px;font-size:.7rem;color:var(--tx3)">'+ReviewState.queue.length+' remaining'+(deck?' · '+esc(deck.name):'')+' · card '+(ReviewState.sessionCards+1)+'</div>';
  body+='<div class="srs-buttons" id="srsButtons" style="display:none">';
  body+='<button class="srs-btn again" onclick="rateCard(0)"><span class="sb-label">Again</span><span class="sb-time">+1 min</span></button>';
  body+='<button class="srs-btn hard" onclick="rateCard(1)"><span class="sb-label">Hard</span><span class="sb-time">+10 min</span></button>';
  body+='<button class="srs-btn good" onclick="rateCard(2)"><span class="sb-label">Good</span><span class="sb-time">'+nextIntervalText(c)+'</span></button>';
  body+='<button class="srs-btn easy" onclick="rateCard(3)"><span class="sb-label">Easy</span><span class="sb-time">+'+(c.interval>0?Math.round(c.interval*c.ease*1.3):3)+' days</span></button>';
  body+='</div>';
  openModal({
    title:'Review Session',
    wide:true,
    body:body,
    foot:'<button class="btn ghost" onclick="closeModal();endReviewSession()">End session</button>',
    onOpen:function(){
      document.addEventListener('keydown',reviewKeyHandler);
    }
  });
}

function renderMultiline(text){
  return esc(text).split('\n').map(function(l){
    if(l.trim().startsWith('- '))return '• '+l.substring(2);
    return l;
  }).join('<br>');
}

function nextIntervalText(c){
  if(c.interval===0)return '1 day';
  if(c.interval===1)return '3 days';
  return Math.round(c.interval*c.ease)+' days';
}

function flipCard(){
  var el=$('flashcardEl');
  if(!el)return;
  ReviewState.flipped=!ReviewState.flipped;
  el.classList.toggle('flipped',ReviewState.flipped);
  if(ReviewState.flipped){
    $('srsButtons').style.display='flex';
  }
}

function rateCard(rating){
  var c=ReviewState.current;
  if(!c)return;
  c.reps++;
  ReviewState.sessionCards++;
  if(rating>=2)ReviewState.sessionCorrect++;
  var now=nowISO();
  c.lastReview=now;
  var easiness=0.1;
  if(rating===0){
    c.lapses++;
    c.ease=Math.max(1.3,c.ease-easiness);
    c.interval=0;
    c.due=today();
  }else if(rating===1){
    c.ease=Math.max(1.3,c.ease-easiness);
    if(c.interval===0)c.interval=1;
    else c.interval=Math.max(1,Math.round(c.interval*1.2));
    c.due=addDays(today(),c.interval);
  }else if(rating===2){
    if(c.interval===0)c.interval=1;
    else if(c.interval===1)c.interval=3;
    else c.interval=Math.round(c.interval*c.ease);
    c.due=addDays(today(),c.interval);
  }else{
    c.ease=c.ease+0.15;
    if(c.interval===0)c.interval=3;
    else c.interval=Math.round(c.interval*c.ease*1.3);
    c.due=addDays(today(),c.interval);
  }
  saveState();
  document.removeEventListener('keydown',reviewKeyHandler);
  nextCard();
}

function reviewKeyHandler(e){
  if(e.key===' '){e.preventDefault();flipCard()}
  else if(e.key>='0'&&e.key<='3'&&ReviewState.flipped)rateCard(parseInt(e.key));
  else if(e.key==='Escape'){document.removeEventListener('keydown',reviewKeyHandler)}
}

function endReviewSession(){
  document.removeEventListener('keydown',reviewKeyHandler);
  if(ReviewState.sessionCards===0){
    closeModal();
    return;
  }
  var time=Math.round((Date.now()-ReviewState.startedAt)/1000);
  var acc=ReviewState.sessionCorrect/ReviewState.sessionCards*100;
  logActivity('card','Reviewed '+ReviewState.sessionCards+' cards');
  var body='';
  body+='<div class="center"><div style="font-size:3rem;margin-bottom:14px">🎉</div>';
  body+='<h3 style="font-size:1.1rem;font-family:var(--serif);margin-bottom:20px">Session complete!</h3></div>';
  body+='<div class="kpi-grid" style="margin-bottom:0">';
  body+='<div class="kpi purple"><div class="kpi-label">Cards reviewed</div><div class="kpi-value">'+ReviewState.sessionCards+'</div></div>';
  body+='<div class="kpi green"><div class="kpi-label">Accuracy</div><div class="kpi-value">'+acc.toFixed(0)+'%</div></div>';
  body+='<div class="kpi warn"><div class="kpi-label">Time</div><div class="kpi-value">'+Math.floor(time/60)+':'+String(time%60).padStart(2,'0')+'</div></div>';
  body+='</div>';
  openModal({
    title:'Session Summary',
    body:body,
    foot:'<button class="btn primary" onclick="closeModal();renderPage();renderNav()">Done</button>'
  });
}

function exportBibliography(){
  var lines=State.citations.map(function(c){
    var key=slug((c.author||'').split(',')[0]||'ref')+(c.year||'');
    var type=c.type==='article'?'article':c.type==='book'?'book':c.type==='chapter'?'incollection':'misc';
    var s='@'+type+'{'+key+',\n';
    s+='  author = {'+c.author+'},\n';
    s+='  title = {'+c.title+'},\n';
    if(c.year)s+='  year = {'+c.year+'},\n';
    if(c.publisher)s+='  publisher = {'+c.publisher+'},\n';
    if(c.journal)s+='  journal = {'+c.journal+'},\n';
    if(c.volume)s+='  volume = {'+c.volume+'},\n';
    if(c.pages)s+='  pages = {'+c.pages+'},\n';
    if(c.url)s+='  url = {'+c.url+'},\n';
    if(c.doi)s+='  doi = {'+c.doi+'},\n';
    s+='}\n';
    return s;
  }).join('\n');
  var blob=new Blob([lines],{type:'text/plain'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='mnemos-bibliography.bib';
  a.click();
  toast('Bibliography exported','success');
}

/* ================================================================

   ================================================================ */
var TimerState={
  running:false,
  mode:'work',
  duration:25*60,
  elapsed:0,
  startedAt:null,
  timerId:null,
  cycles:0,
  taskId:null,
  label:''
};

function render_focus(){
  var stats={
    today:State.timeEntries.filter(function(t){return t.date===today()}).reduce(function(s,t){return s+t.minutes},0),
    week:State.timeEntries.filter(function(t){return t.date>=startOfWeek(today())}).reduce(function(s,t){return s+t.minutes},0),
    total:State.timeEntries.reduce(function(s,t){return s+t.minutes},0)
  };
  var todayPomos=State.sessions.filter(function(s){return s.date===today()}).length;

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">⏱️ Focus Session</div>';
  html+='<div class="page-desc">Pomodoro timer for deep work</div></div>';
  html+='</div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi purple"><div class="kpi-label">Today</div><div class="kpi-value">'+Math.floor(stats.today/60)+'<span class="kpi-unit">h '+String(stats.today%60).padStart(2,'0')+'m</span></div></div>';
  html+='<div class="kpi pink"><div class="kpi-label">This week</div><div class="kpi-value">'+Math.floor(stats.week/60)+'<span class="kpi-unit">h</span></div></div>';
  html+='<div class="kpi green"><div class="kpi-label">Pomodoros today</div><div class="kpi-value">'+todayPomos+'</div></div>';
  html+='<div class="kpi blue"><div class="kpi-label">All-time</div><div class="kpi-value">'+Math.floor(stats.total/60)+'<span class="kpi-unit">h</span></div></div>';
  html+='</div>';

  html+='<div class="card pad-lg">';
  html+='<div class="pomo-timer">';
  html+='<div class="pt-mode" id="pomoMode">FOCUS SESSION</div>';
  html+='<div class="pt-display" id="pomoDisplay">'+formatTime(TimerState.duration)+'</div>';
  html+='<div class="pt-dots" id="pomoDots"></div>';
  html+='<div class="pt-controls">';
  html+='<button class="btn primary lg" onclick="togglePomodoro()" id="pomoToggle">▶ Start</button>';
  html+='<button class="btn" onclick="resetPomodoro()">🔄 Reset</button>';
  html+='<button class="btn" onclick="skipPhase()">⏭ Skip</button>';
  html+='</div>';
  html+='<div style="font-size:.72rem;color:var(--tx3);margin-top:14px">Session '+Math.floor(TimerState.elapsed/60)+'min of '+Math.floor(TimerState.duration/60)+'min</div>';
  html+='</div>';
  html+='</div>';

  html+='<div class="card pad-lg mt-16">';
  html+='<h3 style="font-size:.88rem;margin-bottom:12px;font-family:var(--serif)">⚙️ Pomodoro Settings</h3>';
  html+='<div class="form-row three">';
  html+='<div class="field"><label>Work (min)</label><input type="number" id="pfWork" value="'+State.settings.pomodoroWork+'" min="1" max="90"></div>';
  html+='<div class="field"><label>Short break (min)</label><input type="number" id="pfBreak" value="'+State.settings.pomodoroBreak+'" min="1" max="30"></div>';
  html+='<div class="field"><label>Long break (min)</label><input type="number" id="pfLong" value="'+State.settings.pomodoroLongBreak+'" min="5" max="60"></div>';
  html+='</div>';
  html+='<button class="btn primary mt-8" onclick="savePomodoroSettings()">Save Settings</button>';
  html+='</div>';

  // Recent sessions
  html+='<div class="table-wrap mt-16"><div class="table-head"><h3>Recent focus sessions</h3></div>';
  var recent=State.sessions.slice().sort(function(a,b){return (b.startedAt||'').localeCompare(a.startedAt||'')}).slice(0,20);
  if(!recent.length){
    html+='<div class="empty" style="padding:20px"><span class="icon">⏱️</span><p>No sessions yet</p></div>';
  }else{

    recent.forEach(function(s){

function after_focus(){
  renderPomodoroDots();
}

function renderPomodoroDots(){
  var d=$('pomoDots');
  if(!d)return;
  var html='';
  for(var i=0;i<State.settings.pomodoroCycles;i++){
    var done=i<(TimerState.cycles%State.settings.pomodoroCycles);
    html+='<div class="pt-dot'+(done?' done':'')+'"></div>';
  }
  d.innerHTML=html;
}

function formatTime(sec){
  var m=Math.floor(sec/60);
  var s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function togglePomodoro(){
  if(TimerState.running){
    pausePomodoro();
  }else{
    startPomodoro();
  }
}

function startPomodoro(){
  TimerState.running=true;
  TimerState.startedAt=TimerState.startedAt||Date.now();
  TimerState.timerId=setInterval(tickPomodoro,1000);
  updatePomodoroUI();
  toast('Focus session started','success');
}

function pausePomodoro(){
  TimerState.running=false;
  clearInterval(TimerState.timerId);
  updatePomodoroUI();
  toast('Paused','info');
}

function tickPomodoro(){
  TimerState.elapsed++;
  if(TimerState.elapsed>=TimerState.duration){
    completePhase();
    return;
  }
  updatePomodoroUI();
}

function completePhase(){
  clearInterval(TimerState.timerId);
  TimerState.running=false;
  var minutes=Math.floor(TimerState.duration/60);
  // Log session
  State.sessions.push({
    id:uid('sess'),
    type:TimerState.mode,
    minutes:minutes,
    startedAt:new Date(Date.now()-TimerState.duration*1000).toISOString(),
    date:today(),
    label:TimerState.label||'',
    createdAt:nowISO()
  });
  logActivity('session',TimerState.mode+' session: '+minutes+'min');
  if(TimerState.mode==='work'){
    TimerState.cycles++;
    // Add time entry
    State.timeEntries.push({
      id:uid('time'),
      taskId:TimerState.taskId,
      description:TimerState.label||'Focus session',
      minutes:minutes,
      date:today(),
      startedAt:new Date(Date.now()-TimerState.duration*1000).toISOString(),
      billable:false,
      tags:[],
      createdAt:nowISO()
    });
    // Auto switch to break
    var isLong=TimerState.cycles%State.settings.pomodoroCycles===0;
    TimerState.mode=isLong?'longBreak':'break';
    TimerState.duration=(isLong?State.settings.pomodoroLongBreak:State.settings.pomodoroBreak)*60;
    toast('Focus complete! Take a '+(isLong?'long':'short')+' break','success');
  }else{
    TimerState.mode='work';
    TimerState.duration=State.settings.pomodoroWork*60;
    toast('Break over. Ready for next focus?','info');
  }
  TimerState.elapsed=0;
  TimerState.startedAt=null;
  TimerState.taskId=null;
  TimerState.label='';
  saveState();
  updatePomodoroUI();
  renderPomodoroDots();
  if(CurrentRoute==='focus')renderPage();
}

function resetPomodoro(){
  clearInterval(TimerState.timerId);
  TimerState.running=false;
  TimerState.elapsed=0;
  TimerState.startedAt=null;
  updatePomodoroUI();
}

function skipPhase(){
  completePhase();
}

function savePomodoroSettings(){
  State.settings.pomodoroWork=safeInt($('pfWork').value,25);
  State.settings.pomodoroBreak=safeInt($('pfBreak').value,5);
  State.settings.pomodoroLongBreak=safeInt($('pfLong').value,15);
  if(!TimerState.running&&TimerState.mode==='work'){
    TimerState.duration=State.settings.pomodoroWork*60;
  }
  saveState();
  updatePomodoroUI();
  renderPomodoroDots();
  toast('Settings saved','success');
}

function updatePomodoroUI(){
  var display=$('pomoDisplay');
  var mode=$('pomoMode');
  var toggle=$('pomoToggle');
  if(display){
    var remaining=TimerState.duration-TimerState.elapsed;
    display.textContent=formatTime(Math.max(0,remaining));
  }
  if(mode){
    var labels={work:'FOCUS SESSION',break:'SHORT BREAK',longBreak:'LONG BREAK'};
    mode.textContent=labels[TimerState.mode]||'FOCUS';
  }
  if(toggle)toggle.textContent=TimerState.running?'⏸ Pause':'▶ Start';
  // Update float timer bar too
  if($('timerBar').classList.contains('active'))updateTimerUI();
}

function startFocusSession(){
  TimerState.mode='work';
  TimerState.duration=State.settings.pomodoroWork*60;
  TimerState.elapsed=0;
  TimerState.running=true;
  TimerState.startedAt=Date.now();
  if(TimerState.timerId)clearInterval(TimerState.timerId);
  TimerState.timerId=setInterval(function(){
    TimerState.elapsed++;
    if(TimerState.elapsed>=TimerState.duration){completePhase();return}
    updateTimerUI();
  },1000);
  $('timerBar').classList.add('active');
  updateTimerUI();
  toast('Focus session started','success');
}

function updateTimerUI(){
  var display=$('timerDisplay');
  var label=$('timerLabel');
  var toggle=$('timerToggle');
  if(display){
    if(TimerState.mode==='stopwatch'){
      var el=Math.floor((Date.now()-TimerState.startedAt)/1000);
      display.textContent=formatTime(el);
    }else{
      var remaining=TimerState.duration-TimerState.elapsed;
      display.textContent=formatTime(Math.max(0,remaining));
    }
  }
  if(label)label.textContent=TimerState.label||(TimerState.mode==='work'?'Focus':TimerState.mode);
  if(toggle)toggle.textContent=TimerState.running?'⏸':'▶';
}

function toggleTimer(){
  if(TimerState.mode==='stopwatch'){
    if(TimerState.running){
      TimerState.running=false;
      TimerState.elapsed=Math.floor((Date.now()-TimerState.startedAt)/1000);
      clearInterval(TimerState.timerId);
    }else{
      TimerState.running=true;
      TimerState.startedAt=Date.now()-TimerState.elapsed*1000;
      TimerState.timerId=setInterval(updateTimerUI,1000);
    }
  }else{
    togglePomodoro();
  }
  updateTimerUI();
}

function stopTimer(){
  if(TimerState.mode==='stopwatch'&&TimerState.elapsed>30){
    var task=TimerState.taskId?State.tasks.find(function(x){return x.id===TimerState.taskId}):null;
    if(task){
      task.timeSpent=(task.timeSpent||0)+Math.floor(TimerState.elapsed/60);
    }
    State.timeEntries.push({
      id:uid('time'),
      taskId:TimerState.taskId,
      description:TimerState.label||'Timer session',
      minutes:Math.floor(TimerState.elapsed/60),
      date:today(),
      startedAt:new Date(Date.now()-TimerState.elapsed*1000).toISOString(),
      billable:false,
      tags:[],
      createdAt:nowISO()
    });
    logActivity('time','Logged '+Math.floor(TimerState.elapsed/60)+' minutes');
    saveState();
    toast('Time logged: '+Math.floor(TimerState.elapsed/60)+'min','success');
  }
  if(TimerState.timerId)clearInterval(TimerState.timerId);
  TimerState.running=false;
  TimerState.elapsed=0;
  TimerState.taskId=null;
  TimerState.label='';
  $('timerBar').classList.remove('active');
}

function deleteSession(id){
  State.sessions=State.sessions.filter(function(x){return x.id!==id});
  saveState();renderPage();
  toast('Deleted','info');
}

function render_habits(){
  var todayLogs=State.habitLogs.filter(function(h){return h.date===today()});

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">🌱 Habits</div>';
  html+='<div class="page-desc">'+State.habits.length+' habits · '+todayLogs.length+' done today</div></div>';
  html+='<button class="btn primary" onclick="editHabit(null)">➕ New Habit</button>';
  html+='</div>';

  if(!State.habits.length){
    html+='<div class="empty"><span class="icon">🌱</span><h4>No habits yet</h4></div>';
    return html;
  }

  // Today's habits
  html+='<div class="card pad-lg" style="margin-bottom:16px">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">Today\'s habits</h3>';
  State.habits.forEach(function(h){
    var done=todayLogs.some(function(l){return l.habitId===h.id});
    var streak=calcHabitStreak(h.id);
    html+='<div class="stat-line" style="padding:10px 0">';
    html+='<div class="habit-check'+(done?' done':'')+'" onclick="toggleHabit(\''+h.id+'\')">'+(done?'✓':'')+'</div>';
    html+='<div style="flex:1;min-width:0;margin-left:12px">';
    html+='<div style="font-size:.82rem;font-weight:600">'+(h.icon||'🌱')+' '+esc(h.name)+'</div>';
    if(h.description)html+='<div style="font-size:.68rem;color:var(--tx3);margin-top:2px">'+esc(h.description)+'</div>';
    html+='</div>';
    if(streak>0)html+='<div style="font-size:.7rem;color:var(--c4);font-weight:700;font-family:var(--mono)">🔥 '+streak+'d</div>';
    html+='<button class="btn ghost xs" onclick="editHabit(\''+h.id+'\')" style="margin-left:8px">✏️</button>';
    html+='</div>';
  });
  html+='</div>';

  // Heatmap per habit
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">Streaks & heatmaps</h3>';
  State.habits.forEach(function(h){
    html+='<div style="margin-bottom:20px">';
    html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
    html+='<div style="font-size:.75rem;font-weight:600">'+(h.icon||'🌱')+' '+esc(h.name)+'</div>';
    html+='<div style="font-size:.7rem;color:var(--c4);font-weight:700">🔥 '+calcHabitStreak(h.id)+' days</div>';
    html+='</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(30,1fr);gap:2px">';
    var days=lastNDays(30);
    days.forEach(function(d){
      var done=State.habitLogs.some(function(l){return l.habitId===h.id&&l.date===d});
      html+='<div style="aspect-ratio:1;border-radius:2px;background:'+(done?h.color:'var(--panel3)')+';min-width:8px" title="'+d+'"></div>';
    });
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function calcHabitStreak(id){
  var streak=0;
  var d=today();
  while(true){
    if(State.habitLogs.some(function(h){return h.habitId===id&&h.date===d})){streak++;d=addDays(d,-1)}
    else break;
    if(streak>365)break;
  }
  return streak;
}

function toggleHabit(id){
  var existing=State.habitLogs.find(function(h){return h.habitId===id&&h.date===today()});
  if(existing){
    State.habitLogs=State.habitLogs.filter(function(h){return !(h.habitId===id&&h.date===today())});
    toast('Unmarked','info');
  }else{
    State.habitLogs.push({id:uid('hlog'),habitId:id,date:today(),value:1,completed:true,createdAt:nowISO()});
    toast('Habit logged ✓','success');
  }
  saveState();renderPage();
}
