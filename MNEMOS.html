var GraphState={nodes:[],edges:[],running:false,frame:0,camera:{x:0,y:0,zoom:1}};

function render_graph(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">🕸️ Knowledge Graph</div>';
  html+='<div class="page-desc">Force-directed visualization of your notes</div></div>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html+='<button class="btn" onclick="refreshGraph()">🔄 Refresh</button>';
  html+='<button class="btn" onclick="GraphState.camera.zoom=1;GraphState.camera.x=0;GraphState.camera.y=0">🎯 Reset</button>';
  html+='<button class="btn" onclick="toggleGraphSim()" id="graphToggle">⏸ Pause</button>';
  html+='</div></div>';

  html+='<div class="graph-wrap">';
  html+='<canvas class="graph-canvas" id="graphCanvas"></canvas>';
  html+='<div class="graph-hud">';
  html+='<div class="hud-row"><span class="k">Notes</span><span class="v" id="hudNotes">0</span></div>';
  html+='<div class="hud-row"><span class="k">Links</span><span class="v" id="hudLinks">0</span></div>';
  html+='<div class="hud-row"><span class="k">Isolated</span><span class="v" id="hudIsolated">0</span></div>';
  html+='</div>';
  html+='</div>';

  html+='<div class="card pad-lg mt-16">';
  html+='<h3 style="font-size:.88rem;margin-bottom:10px;font-family:var(--serif)">💡 How to read the graph</h3>';
  html+='<p style="font-size:.72rem;color:var(--tx2);line-height:1.7">Each node is a note. Lines connect notes that link to each other via <span style="font-family:var(--mono)">[[WikiLinks]]</span>. Larger nodes have more connections. Drag nodes to reposition. Scroll to zoom. Click a node to open the note.</p>';
  html+='</div>';
  return html;
}

function after_graph(){
  refreshGraph();
  startGraphSim();
}

function buildGraph(){
  var nodes=State.notes.filter(function(n){return !n.archived}).map(function(n){
    return {id:n.id,title:n.title,x:0,y:0,vx:0,vy:0,r:8+Math.sqrt((n.wordCount||0)/50),note:n,connections:0};
  });
  var nodeMap={};
  nodes.forEach(function(n){nodeMap[n.note.title.toLowerCase()]=n});
  var edges=[];
  State.notes.forEach(function(n){
    if(!n.body)return;
    var links=n.body.match(/\[\[([^\]]+)\]\]/g)||[];
    links.forEach(function(l){
      var target=l.slice(2,-2).trim().toLowerCase();
      var sourceNode=nodeMap[n.title.toLowerCase()];
      var targetNode=nodeMap[target];
      if(sourceNode&&targetNode&&sourceNode.id!==targetNode.id){
        edges.push({source:sourceNode.id,target:targetNode.id});
        sourceNode.connections++;
        targetNode.connections++;
      }
    });
  });
  return {nodes:nodes,edges:edges};
}

function refreshGraph(){
  var g=buildGraph();
  GraphState.nodes=g.nodes;
  GraphState.edges=g.edges;
  // Position nodes in a circle initially
  var n=GraphState.nodes.length;
  GraphState.nodes.forEach(function(node,i){
    var angle=(i/n)*Math.PI*2;
    node.x=Math.cos(angle)*250+Math.random()*30;
    node.y=Math.sin(angle)*250+Math.random()*30;
  });
  var isolated=GraphState.nodes.filter(function(n){return n.connections===0}).length;
  $('hudNotes').textContent=GraphState.nodes.length;
  $('hudLinks').textContent=GraphState.edges.length;
  $('hudIsolated').textContent=isolated;
}

function startGraphSim(){
  GraphState.running=true;
  if(GraphState.frame)cancelAnimationFrame(GraphState.frame);
  var step=function(){
    if(!GraphState.running)return;
    simulateGraph();
    drawGraph();
    GraphState.frame=requestAnimationFrame(step);
  };
  step();
}

function toggleGraphSim(){
  GraphState.running=!GraphState.running;
  var btn=$('graphToggle');
  if(btn)btn.textContent=GraphState.running?'⏸ Pause':'▶ Play';
  if(GraphState.running)startGraphSim();
}

function simulateGraph(){
  var nodes=GraphState.nodes,edges=GraphState.edges;
  // Repulsion
  for(var i=0;i<nodes.length;i++){
    for(var j=i+1;j<nodes.length;j++){
      var dx=nodes[j].x-nodes[i].x;
      var dy=nodes[j].y-nodes[i].y;
      var d2=dx*dx+dy*dy+0.01;
      var d=Math.sqrt(d2);
      var force=1500/d2;
      var fx=(dx/d)*force;
      var fy=(dy/d)*force;
      nodes[i].vx-=fx;nodes[i].vy-=fy;
      nodes[j].vx+=fx;nodes[j].vy+=fy;
    }
  }
  // Attraction along edges
  edges.forEach(function(e){
    var s=nodes.find(function(n){return n.id===e.source});
    var t=nodes.find(function(n){return n.id===e.target});
    if(!s||!t)return;
    var dx=t.x-s.x,dy=t.y-s.y;
    var d=Math.sqrt(dx*dx+dy*dy)+0.01;
    var force=(d-120)*0.008;
    var fx=(dx/d)*force;
    var fy=(dy/d)*force;
    s.vx+=fx;s.vy+=fy;
    t.vx-=fx;t.vy-=fy;
  });
  // Center gravity
  nodes.forEach(function(n){
    n.vx-=n.x*0.002;
    n.vy-=n.y*0.002;
    n.x+=n.vx;
    n.y+=n.vy;
    n.vx*=0.85;
    n.vy*=0.85;
  });
}

function drawGraph(){
  var c=$('graphCanvas');
  if(!c)return;
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  if(c.width!==rect.width*dpr||c.height!==rect.height*dpr){
    c.width=rect.width*dpr;
    c.height=rect.height*dpr;
  }
  var ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+GraphState.camera.x,H/2+GraphState.camera.y);
  ctx.scale(GraphState.camera.zoom,GraphState.camera.zoom);
  // Edges
  ctx.strokeStyle='rgba(124,92,255,.35)';
  ctx.lineWidth=1.5;
  GraphState.edges.forEach(function(e){
    var s=GraphState.nodes.find(function(n){return n.id===e.source});
    var t=GraphState.nodes.find(function(n){return n.id===e.target});
    if(!s||!t)return;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(t.x,t.y);
    ctx.stroke();
  });
  // Nodes
  GraphState.nodes.forEach(function(n){
    var radius=n.r;
    var color=n.connections>0?'#7c5cff':'#4a5f7c';
    ctx.beginPath();
    ctx.arc(n.x,n.y,radius+3,0,Math.PI*2);
    ctx.fillStyle=color+'22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(n.x,n.y,radius,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.strokeStyle='#000';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });
  ctx.restore();
  // Labels (rendered last, on top, without zoom transform for readability)
  ctx.save();
  ctx.translate(W/2+GraphState.camera.x,H/2+GraphState.camera.y);
  ctx.scale(GraphState.camera.zoom,GraphState.camera.zoom);
  ctx.font='11px -apple-system, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='top';
  GraphState.nodes.forEach(function(n){
    if(n.r>10||GraphState.camera.zoom>1.2){
      ctx.fillStyle='#e8eef5';
      ctx.strokeStyle='rgba(0,0,0,.8)';
      ctx.lineWidth=3;
      var label=truncate(n.title,22);
      ctx.strokeText(label,n.x,n.y+n.r+4);
      ctx.fillText(label,n.x,n.y+n.r+4);
    }
  });
  ctx.restore();
}

/* Graph interactions */
document.addEventListener('DOMContentLoaded',function(){
  var c=$('graphCanvas');
  if(!c)return;
  var dragging=false,lastX=0,lastY=0,nodeDrag=null;
  var wasMoved=false;

  c.addEventListener('mousedown',function(e){
    wasMoved=false;
    var rect=c.getBoundingClientRect();
    var mx=e.clientX-rect.left-rect.width/2-GraphState.camera.x;
    var my=e.clientY-rect.top-rect.height/2-GraphState.camera.y;
    var wx=mx/GraphState.camera.zoom, wy=my/GraphState.camera.zoom;
    // Check for node hit
    for(var i=GraphState.nodes.length-1;i>=0;i--){
      var n=GraphState.nodes[i];
      var d=Math.sqrt((wx-n.x)*(wx-n.x)+(wy-n.y)*(wy-n.y));
      if(d<n.r+4){nodeDrag=n;dragging=true;lastX=e.clientX;lastY=e.clientY;return}
    }
    dragging=true;lastX=e.clientX;lastY=e.clientY;
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    wasMoved=true;
    var dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    if(nodeDrag){
      nodeDrag.x+=dx/GraphState.camera.zoom;
      nodeDrag.y+=dy/GraphState.camera.zoom;
      nodeDrag.vx=0;nodeDrag.vy=0;
    }else{
      GraphState.camera.x+=dx;
      GraphState.camera.y+=dy;
    }
  });
  document.addEventListener('mouseup',function(e){
    if(nodeDrag&&!wasMoved){
      // Click on node
      var note=nodeDrag.note;
      if(note)setTimeout(function(){openNote(note.id)},10);
    }else if(!wasMoved&&!nodeDrag&&CurrentRoute==='graph'){
      // Empty click — ignore
    }
    dragging=false;
    nodeDrag=null;
  });
  c.addEventListener('wheel',function(e){
    if(CurrentRoute!=='graph')return;
    e.preventDefault();
    var factor=e.deltaY<0?1.1:0.9;
    GraphState.camera.zoom=clamp(GraphState.camera.zoom*factor,0.3,3);
  },{passive:false});
});

    addResults(r.filter(function(x){return (x.title||'').toLowerCase().indexOf(q)>-1||(x.author||'').toLowerCase().indexOf(q)>-1}),'readings','📖',function(x){return x.title},function(x){return x.author},function(x){hideSearchPalette();editReading(x.id)});
    addResults(j.filter(function(x){return (x.title||'').toLowerCase().indexOf(q)>-1||(x.text||'').toLowerCase().indexOf(q)>-1}),'journal','📔',function(x){return x.title},function(x){return truncate(x.text,60)},function(x){hideSearchPalette();editJournalEntry(x.id)});
    addResults(i.filter(function(x){return (x.text||'').toLowerCase().indexOf(q)>-1}),'ideas','💡',function(x){return truncate(x.text,60)},null,function(x){hideSearchPalette();navigate('inbox')});
    addResults(cit.filter(function(x){return (x.title||'').toLowerCase().indexOf(q)>-1||(x.author||'').toLowerCase().indexOf(q)>-1}),'citations','📎',function(x){return x.title},function(x){return x.author},function(x){hideSearchPalette();editCitation(x.id)});

  });
}

document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='k'){e.preventDefault();showSearchPalette();return}
  if(e.key==='Escape'&&SearchPaletteState.open){hideSearchPalette();return}
  if(!SearchPaletteState.open)return;
  if(e.key==='Enter'){
    var active=document.querySelector('.sp-result.active');
    if(active)active.click();
  }else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    var results=$$('.sp-result');
    if(!results.length)return;
    var idx=Array.prototype.indexOf.call(results,document.querySelector('.sp-result.active'));
    idx=e.key==='ArrowDown'?(idx+1)%results.length:(idx-1+results.length)%results.length;
    results.forEach(function(r){r.classList.remove('active')});
    results[idx].classList.add('active');
    results[idx].scrollIntoView({block:'nearest'});
  }
});

  var topTags=Object.keys(tagCounts).sort(function(a,b){return tagCounts[b]-tagCounts[a]});
  if(topTags.length)insights.push({icon:'🏷️',text:'Top tag: #'+topTags[0]+' ('+tagCounts[topTags[0]]+' notes)'});
  insights.push({icon:'🎴',text:State.cards.length+' total cards, '+dueCards().length+' due now'});
  insights.push({icon:'🕸️',text:'Knowledge graph density: '+((State.cards.length>0?1:0))+' connections built'});
  insights.push({icon:'✅',text:State.tasks.filter(function(t){return t.status==='open'}).length+' tasks still open'});

  insights.forEach(function(ins){
    html+='<div class="stat-line" style="padding:8px 0"><span style="font-size:1rem;margin-right:10px">'+ins.icon+'</span><span style="font-size:.76rem">'+esc(ins.text)+'</span></div>';
  });
  html+='</div>';

  // System stats
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">📊 System stats</h3>';
  var totalWords=State.notes.reduce(function(s,n){return s+(n.wordCount||0)},0);
  var stats=[
    ['Total notes',State.notes.length],
    ['Total words',totalWords.toLocaleString()],
    ['Total cards',State.cards.length],
    ['Total tasks',State.tasks.length],
    ['Time tracked',Math.round(State.timeEntries.reduce(function(s,t){return s+t.minutes},0)/60)+'h'],
    ['Habit logs',State.habitLogs.length],
    ['Journal entries',State.journal.length],
    ['Citations',State.citations.length]
  ];
  stats.forEach(function(s){
    html+='<div class="stat-line"><span class="sl-label">'+s[0]+'</span><span class="sl-value">'+s[1]+'</span></div>';
  });
  html+='</div>';
  html+='</div>';

  return html;
}

function dayOfWeekPeak(items,dateField){
  var counts=[0,0,0,0,0,0,0];
  var names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  items.forEach(function(i){
    var d=i[dateField]||i.createdAt;
    if(!d)return;
    var day=new Date(d).getDay();
    counts[day]++;
  });
  var maxI=0;
  for(var i=1;i<7;i++)if(counts[i]>counts[maxI])maxI=i;
  return names[maxI];
}

function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,.txt,.mnemos';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var txt=r.result;
      if(txt.indexOf('MNEMOS-ENCRYPTED:')===0){
        var pass=prompt('Encrypted backup. Enter passphrase:');
        if(!pass)return;
        Crypto.decrypt(txt.substring('MNEMOS-ENCRYPTED:'.length),pass).then(function(dec){
          applyImport(JSON.parse(dec));
        }).catch(function(){toast('Decryption failed','error')});
      }else{
        try{applyImport(JSON.parse(txt))}catch(e){toast('Invalid backup file','error')}
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function applyImport(data){
  if(!data.notes||!Array.isArray(data.notes)){toast('Not a MNEMOS backup','error');return}
  confirmDialog('Import Backup','This will REPLACE all current data. Continue?',function(){
    Object.keys(State).forEach(function(k){
      if(data[k]!==undefined)State[k]=data[k];
    });
    saveState();
    renderNav();renderPage();
    toast('Backup restored','success');
  },true);
}

function exportEncrypted(){
  var pass=prompt('Passphrase (min 6 chars):');
  if(!pass)return;
  if(pass.length<6){toast('Passphrase too short','error');return}
  Crypto.encrypt(JSON.stringify(State),pass).then(function(enc){
    var blob=new Blob(['MNEMOS-ENCRYPTED:'+enc],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='mnemos-encrypted-'+today()+'.mnemos';
    a.click();
    State.settings.lastBackup=nowISO();
    saveState();
    toast('Encrypted backup downloaded','success');
  }).catch(function(e){toast('Encryption failed: '+e.message,'error')});
}

  html+='<div class="card"><div style="font-size:2.2rem;margin-bottom:8px">🎯</div><h3 style="font-size:.9rem;margin-bottom:6px;font-family:var(--serif)">Goals & habits</h3><p style="font-size:.74rem;color:var(--tx2);line-height:1.6">Long-term goals with progress bars. Daily habits with streaks and heatmaps.</p></div>';

/* ================================================================
   START
   ================================================================ */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){closeModal();hideSearchPalette();return}
  if(e.ctrlKey&&e.key==='k'){e.preventDefault();showSearchPalette();return}
  if(e.key==='?')openHelp();
  if(e.key==='g'){
    window._gMode=true;
    setTimeout(function(){window._gMode=false},1000);
    return;
  }
  if(window._gMode){
    var map={
      'd':'dashboard','s':'search','i':'inbox','n':'notes','y':'daily','t':'tags',
      'g':'graph','c':'flashcards','k':'decks','r':'readings','e':'citations',
      'a':'tasks','p':'projects','f':'focus','m':'time','o':'goals','h':'habits',
      'j':'journal','w':'reviews','x':'analytics','.':'settings','?':'about'
    };
    if(map[e.key]){navigate(map[e.key]);e.preventDefault()}
  }
});

function initApp(){
  var loaded=loadState();
  if(!loaded||!State.notes.length){
    seedDemoData();
    saveState();
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'obsidian');
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='dashboard')after_dashboard();
    if(CurrentRoute==='analytics')after_analytics();
    if(CurrentRoute==='time')after_time();
  });
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  renderNav();
  renderPage();
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  window.addEventListener('beforeunload',saveState);
  setTimeout(function(){toast('Welcome to MNEMOS','purple')},300);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
