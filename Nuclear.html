R.controlRods=function(dt){
  clear();
  headline('Control Rods','reactivity worth');
  var cx=S.W/2,cy=S.H/2;
  /* Core with rods at various insertion depths */
  var coreW=200,coreH=300;
  S.ctx.fillStyle='rgba(0,255,102,.08)';
  S.ctx.fillRect(cx-coreW/2,cy-coreH/2,coreW,coreH);
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2;
  S.ctx.strokeRect(cx-coreW/2,cy-coreH/2,coreW,coreH);
  /* Control rods */
  var insertion=[0.2,0.5,0.8,1.0,0.6,0.3];
  insertion.forEach(function(ins,i){
    var rx=cx-coreW/2+30+i*30;
    var topY=cy-coreH/2;
    var bottomY=topY+ins*coreH;
    S.ctx.strokeStyle='#ffd500';
    S.ctx.lineWidth=6;
    S.ctx.beginPath();
    S.ctx.moveTo(rx,topY);
    S.ctx.lineTo(rx,bottomY);
    S.ctx.stroke();
    /* Tip */
    S.ctx.fillStyle='#ff8833';
    S.ctx.beginPath();
    S.ctx.moveTo(rx-6,bottomY);
    S.ctx.lineTo(rx+6,bottomY);
    S.ctx.lineTo(rx,bottomY+10);
    S.ctx.closePath();
    S.ctx.fill();
  });
  /* Rod worth curve */
  var padL=S.W-260,padT=140;
  var plotW=200,plotH=200;
  S.ctx.strokeStyle='#88a090';
  S.ctx.lineWidth=1;
  S.ctx.strokeRect(padL,padT,plotW,plotH);
  /* S-curve (integral worth) */
  S.ctx.strokeStyle='#ffd500';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var x=i/100;
    /* S-curve: 1/(1+exp(-k(x-0.5))) */
    var worth=1/(1+Math.exp(-10*(x-0.5)));
    var px=padL+(i/100)*plotW;
    var py=padT+plotH-worth*plotH;
    if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
  }
  S.ctx.stroke();
  /* Labels */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 11px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ROD WORTH',padL,padT-10);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText('Insertion (%)',padL+70,padT+plotH+20);
  S.ctx.save();
  S.ctx.translate(padL-15,padT+plotH/2);
  S.ctx.rotate(-Math.PI/2);
  S.ctx.fillText('Δρ (pcm)',0,0);
  S.ctx.restore();
  /* Info */
  S.ctx.fillStyle='#c8d8c8';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Materials:',60,S.H-120);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  CONTROL_MATERIALS.forEach(function(m,i){
    S.ctx.fillText('▸ '+m.name+' ('+m.sigma_a+' barns)',60,S.H-95+i*18);
  });
};

<script>
/* ══════════════ Point Kinetics ══════════════ */

/* ══════════════ Prompt Jump ══════════════ */
R.promptJump=function(dt){
  clear();
  headline('Prompt Jump','step reactivity');
  /* Simulate point kinetics with 6 groups (simplified) */
  if(!S.sim.pj){
    S.sim.pj={history:[],n:1,t:0};
    S.sim.pj.history.push({t:0,n:1});
  }
  var p=S.sim.pj;
  if(p.t<10){
    /* Simple analytic for small step */
    p.t+=0.05;
    var rho=100e-5;
    var beta=NU.beta_eff;
    var lambda=NU.lambda_eff;
    /* Amplitude increase */
    var omega=rho/(beta-rho)*lambda;
    p.n=Math.exp(omega*p.t);
    p.history.push({t:p.t,n:p.n});
    if(p.history.length>500)p.history.shift();
  }
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (s)','n/n₀');
  var maxN=max(p.history.map(function(h){return h.n}));
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  p.history.forEach(function(h,i){
    var x=padL+(h.t/10)*plotW;
    var y=padT+plotH-(h.n/maxN)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ρ = +100 pcm',60,S.H-100);
  S.ctx.fillText('β = '+NU.beta_eff,60,S.H-75);
  var omega=100e-5/(NU.beta_eff-100e-5)*NU.lambda_eff;
  S.ctx.fillText('ω = '+fmt(omega,6)+' s⁻¹',60,S.H-50);
  S.ctx.fillText('T = '+fmt(1/omega,2)+' s',60,S.H-25);
  /* Note */
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Prompt jump: fast transient, then delayed-controlled',400,S.H-50);
};

/* ══════════════ In-Hour Eq ══════════════ */
R.inHour=function(dt){
  clear();
  headline('In-Hour Equation','reactor period vs reactivity');
  if(!S.sim.ih){S.sim.ih={rho:200}}
  var rho=S.sim.ih.rho/1e5;
  var beta=NU.beta_eff;
  var lambda=NU.lambda_eff;
  /* Period */
  var period=(beta/rho-1)/lambda;
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'reactivity (pcm)','reactor period (s)');
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var rpcm=10+i*640/100;
    var r=rpcm/1e5;
    var T=(beta/r-1)/lambda;
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-clamp(T/200,0,1)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Current marker */
  var xc=padL+((S.sim.ih.rho-10)/640)*plotW;
  var yc=padT+plotH-clamp(period/200,0,1)*plotH;
  S.ctx.fillStyle='#ffd500';
  S.ctx.beginPath();S.ctx.arc(xc,yc,7,0,Math.PI*2);S.ctx.fill();
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ρ = '+S.sim.ih.rho+' pcm',60,S.H-120);
  S.ctx.fillText('Period T = '+fmt(period,2)+' s',60,S.H-95);
  S.ctx.fillText('Doubling time = '+fmt(period*Math.LN2,2)+' s',60,S.H-70);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('In-hour: ρ = β·T/(T+1/λ)',60,S.H-45);
};

/* ══════════════ Xenon Poisoning ══════════════ */
R.xenon=function(dt){
  clear();
  headline('Xenon-135 Poisoning','I-135 → Xe-135');
  /* Simulate xenon dynamics after shutdown */
  if(!S.sim.xe){
    S.sim.xe={history:[],t:0};
    /* Flux history: full power for 40h then shutdown */
    S.sim.xe.flux_history=[];
    for(var i=0;i<60;i++)S.sim.xe.flux_history.push(i<40?3e13:0);
  }
  var p=S.sim.xe;
  if(p.t<60){
    p.t+=0.2;
    var phi=p.flux_history[Math.floor(p.t)]||0;
    var params=XENON;
    /* Equilibria */
    var I_eq=params.Y_I*0.1*phi/params.lambda_I;
    var Xe_eq=(params.Y_I+params.Y_Xe)*0.1*phi/(params.lambda_Xe+params.sigma_Xe*phi*1e6);
    /* Simplified: return current values */
    var Xe_now=p.t<40?Xe_eq*Math.min(1,p.t/10):Xe_eq*3*Math.exp(-(p.t-40)/30);
    p.history.push({t:p.t,Xe:Xe_now,phi:phi});
    if(p.history.length>400)p.history.shift();
  }
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (h)','Xe-135 concentration');
  var maxXe=max(p.history.map(function(h){return h.Xe}));
  S.ctx.strokeStyle='#ff8833';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  p.history.forEach(function(h,i){
    var x=padL+(h.t/60)*plotW;
    var y=padT+plotH-(h.Xe/maxXe)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Shutdown line */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  var xs=padL+(40/60)*plotW;
  S.ctx.moveTo(xs,padT);
  S.ctx.lineTo(xs,padT+plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  S.ctx.fillStyle='#ff7088';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('shutdown',xs+5,padT+15);
  /* Values */
  S.ctx.fillStyle='#ffaa66';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Xenon-135 σ_a = 2.65×10⁶ barns',60,S.H-120);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('I-135 half-life: 6.57 h',60,S.H-95);
  S.ctx.fillText('Xe-135 half-life: 9.14 h',60,S.H-70);
  S.ctx.fillStyle='#ffd500';
  S.ctx.fillText('Post-shutdown xenon peak: ~11 hours',60,S.H-45);
};

/* ══════════════ Samarium ══════════════ */
R.samarium=function(dt){
  clear();
  headline('Samarium-149 Poison','stable fission product');
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (days)','Sm-149 concentration');
  /* Samarium buildup */
  S.ctx.strokeStyle='#a855f7';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i*3;
    /* Sm accumulates linearly then saturates */
    var Sm=0.5*(1-Math.exp(-t/30))*Math.min(1,t/5);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-Sm*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Info */

/* ══════════════ Bateman Eq ══════════════ */
R.bateman=function(dt){
  clear();
  headline('Bateman Equations','decay chain solution');
  if(!S.sim.bat){
    S.sim.bat={chain:[
      {name:'A',hl:10,color:'#00ff66'},
      {name:'B',hl:5,color:'#5cff99'},
      {name:'C',hl:2,color:'#ffd500'},
      {name:'D',hl:'stable',color:'#88a090'}
    ]};
  }
  var chain=S.sim.bat.chain;
  /* Compute via RK4 over time */
  var lambdas=chain.slice(0,-1).map(function(c){return decayConstant(c.hl)});
  var N=[100,0,0,0];
  var history=[{t:0,N:N.slice()}];
  var tEnd=30;
  var steps=300;
  var dt2=tEnd/steps;
  for(var s=0;s<steps;s++){
    var dN=[];
    dN[0]=-lambdas[0]*N[0];
    dN[1]=lambdas[0]*N[0]-lambdas[1]*N[1];
    dN[2]=lambdas[1]*N[1]-lambdas[2]*N[2];
    dN[3]=lambdas[2]*N[2];
    for(var i=0;i<4;i++)N[i]+=dN[i]*dt2;
    history.push({t:(s+1)*dt2,N:N.slice()});
  }
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (units)','concentration');
  chain.forEach(function(c,i){
    S.ctx.strokeStyle=c.color;
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    history.forEach(function(h,j){
      var x=padL+(h.t/tEnd)*plotW;
      var y=padT+plotH-(h.N[i]/100)*plotH;
      if(j===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
    });
    S.ctx.stroke();
  });
  /* Legend */
  chain.forEach(function(c,i){
    S.ctx.fillStyle=c.color;
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('■ '+c.name+' (t½='+c.hl+')',padL+10+i*150,padT+20);
  });
};

/* ══════════════ Dosimetry ══════════════ */
R.dosimetry=function(dt){
  clear();
  headline('Dosimetry','internal + external');
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (days)','activity in body');
  /* Biological + physical decay */
  var T_phys=30;
  var T_bio=110;
  var T_eff=1/(1/T_phys+1/T_bio);
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i/100*200;
    var A=Math.exp(-Math.LN2*t/T_eff);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-A*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Individual curves */
  S.ctx.strokeStyle='#5cc5ff';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i/100*200;
    var A=Math.exp(-Math.LN2*t/T_phys);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-A*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  S.ctx.strokeStyle='#ffd500';
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i/100*200;
    var A=Math.exp(-Math.LN2*t/T_bio);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-A*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Legend */
  S.ctx.fillStyle='#00ff66';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('■ Effective (T_eff)',padL+10,padT+20);
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.fillText('■ Physical',padL+180,padT+20);
  S.ctx.fillStyle='#ffd500';
  S.ctx.fillText('■ Biological',padL+320,padT+20);
  /* Info */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.fillText('1/T_eff = 1/T_phys + 1/T_bio',60,S.H-70);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Biological half-life (Cs-137): 110 days',60,S.H-45);
  S.ctx.fillText('Physical half-life: 30 years',60,S.H-20);
};

/* ══════════════ Enrichment ══════════════ */
R.enrichment=function(dt){
  clear();
  headline('Uranium Enrichment','gas centrifuge cascade');
  if(!S.sim.enr){S.sim.enr={feed:0.71,product:4.5,tails:0.25}}
  var p=S.sim.enr;
  /* Mass balance: F·xf = P·xp + W·xw */
  /* Solve for F/P and W/P */
  var xf=p.feed/100,xp=p.product/100,xw=p.tails/100;
  var F_over_P=(xp-xw)/(xf-xw);
  var W_over_P=(xp-xf)/(xf-xw);
  var SWU=(F_over_P*(2*xf-1)*Math.log(xf/(1-xf))-W_over_P*(2*xw-1)*Math.log(xw/(1-xw))-(2*xp-1)*Math.log(xp/(1-xp)));
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Feed: '+p.feed+'% U-235',60,140);
  S.ctx.fillText('Product: '+p.product+'% U-235',60,175);
  S.ctx.fillText('Tails: '+p.tails+'% U-235',60,210);
  S.ctx.fillStyle='#ffd500';
  S.ctx.fillText('Feed/Product ratio: '+fmt(F_over_P,3),60,260);
  S.ctx.fillText('Tails/Product ratio: '+fmt(W_over_P,3),60,295);
  S.ctx.fillText('SWU/kg product: '+fmt(Math.abs(SWU),3),60,330);
  /* Diagram */

/* ══════════════ D-T Fusion ══════════════ */
R.fusionDT=function(dt){
  clear();
  headline('D-T Fusion','Lawson criterion');
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'T (keV)','<σv> (m³/s)');
  /* D-T reactivity */
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var T=1+i*40/100;
    var sv=1e-22*Math.exp(-20/Math.sqrt(T))*Math.pow(T,-2/3)*Math.exp(-Math.pow(T-15,2)/100);
    sv=Math.max(sv,1e-30);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-(Math.log10(sv/1e-26)/3)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Ignition condition */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  S.ctx.moveTo(padL+((15-1)/40)*plotW,padT);
  S.ctx.lineTo(padL+((15-1)/40)*plotW,padT+plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  S.ctx.fillStyle='#ff7088';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('optimal 15 keV',padL+((15-1)/40)*plotW+5,padT+15);
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('D + T → ⁴He + n',60,S.H-140);
  S.ctx.fillText('Q = 17.6 MeV',60,S.H-115);
  S.ctx.fillText('Peak σ = 5 barns at 64 keV',60,S.H-90);
  S.ctx.fillStyle='#ffd500';
  S.ctx.fillText('Lawson criterion:',60,S.H-60);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('n·T·τ_E ≥ 3×10²¹ keV·s/m³',60,S.H-35);
};

    S.ctx.beginPath();
    S.ctx.moveTo(x3,y3);
    S.ctx.lineTo(x2,y2);
    S.ctx.stroke();
  }
  /* Plasma ring */
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=3;

  S.ctx.font='11px "JetBrains Mono",monospace';

/* ══════════════ Plasma Beta ══════════════ */
R.plasmaBeta=function(dt){
  clear();
  headline('Plasma Beta','MHD stability');
  if(!S.sim.pb){S.sim.pb={n:1e20,T:15,B:5}}
  var p=S.sim.pb;
  var beta=2*NU.mu0*p.n*p.T*1e3*NU.e/(p.B*p.B);
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'B (T)','β (%)');
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var B=1+i*10/100;
    var beta2=2*NU.mu0*p.n*p.T*1e3*NU.e/(B*B);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-clamp(beta2*100/30,0,1)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Current marker */
  var xc=padL+((p.B-1)/10)*plotW;
  var yc=padT+plotH-clamp(beta*100/30,0,1)*plotH;
  S.ctx.fillStyle='#ffd500';
  S.ctx.beginPath();S.ctx.arc(xc,yc,7,0,Math.PI*2);S.ctx.fill();
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('β = '+fmt(beta*100,3)+'%',60,S.H-120);
  S.ctx.fillText('n = '+expo(p.n,2)+' m⁻³',60,S.H-95);
  S.ctx.fillText('T = '+p.T+' keV',60,S.H-70);
  S.ctx.fillText('B = '+p.B+' T',60,S.H-45);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Troyon limit: β_N < 3.5',60,S.H-20);
};

/* ══════════════ Interactions ══════════════ */
function bindInteractions(){
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#050807';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff2d55';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'loading nuclear data (ENDF)…',pct:8},
    {msg:'initializing neutron cross sections…',pct:20},
    {msg:'building decay chains…',pct:32},
    {msg:'compiling multigroup solver…',pct:46},
    {msg:'calibrating thermal hydraulics…',pct:60},
    {msg:'connecting to reactor control…',pct:74},
    {msg:'ready for criticality',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,150);
  }
  setTimeout(next,150);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
