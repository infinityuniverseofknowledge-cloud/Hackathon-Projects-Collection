<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NUCLEAR — Nuclear Engineering & Reactor Physics Workbench</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#050807;color:#c8d8c8;font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
:root{
  --bg:#050807;--bg2:#0a100c;--panel:#0d1410;--panel2:#141e18;--panel3:#1e2c24;--panel4:#2a3c30;
  --bd:#141e18;--bd2:#1e2c24;--bd3:#2e4038;
  --tx:#c8d8c8;--tx2:#88a090;--tx3:#4a5c50;--tx4:#1e2c24;
  --gr:#00ff66;--gr2:#5cff99;--gr3:#00a544;
  --yl:#ffd500;--yl2:#ffe566;--yl3:#ccaa00;
  --or:#ff8833;--or2:#ffaa66;
  --rd:#ff2d55;--rd2:#ff7088;--rd3:#cc0e35;
  --cy:#00ddff;--cy2:#5cecff;
  --bl:#00aaff;--bl2:#5cc5ff;
  --pu:#a855f7;--pu2:#c899ff;
  --pk:#ff4d9d;--pk2:#ff85c0;
  --mo:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --sa:'Inter',-apple-system,system-ui,sans-serif;
  --di:'Orbitron','Chakra Petch','Inter',sans-serif;
  --t:.15s cubic-bezier(.4,0,.2,1);
}
::selection{background:rgba(0,255,102,.35);color:#fff}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 15% 15%,rgba(0,255,102,.05),transparent 40%),
  radial-gradient(circle at 85% 85%,rgba(255,213,0,.04),transparent 45%),
  radial-gradient(circle at 50% 50%,rgba(255,45,85,.03),transparent 60%),
  linear-gradient(rgba(0,255,102,.012) 1px,transparent 1px) 0 0/25px 25px,
  linear-gradient(90deg,rgba(0,255,102,.012) 1px,transparent 1px) 0 0/25px 25px,
  #050807}

#shell{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}

.top{height:52px;background:linear-gradient(180deg,rgba(13,20,16,.97),rgba(5,8,7,.97));backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;position:relative;z-index:100}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),var(--yl),var(--rd),transparent);opacity:.8}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--di);font-weight:900;font-size:1.3rem;letter-spacing:4px;color:var(--gr);text-shadow:0 0 22px rgba(0,255,102,.7)}
.brand-sub{font-family:var(--mo);font-size:9px;letter-spacing:2.4px;color:var(--tx3);text-transform:uppercase}
.div{width:1px;height:26px;background:var(--bd2)}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:#000;border:1px solid var(--bd2);border-radius:3px}
.chip span{font-family:var(--mo);font-size:9px;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase}
.chip b{font-family:var(--mo);font-size:11px;color:var(--gr2);font-weight:600}
.chip b.yl{color:var(--yl2)}
.chip b.rd{color:var(--rd2)}
.chip b.cy{color:var(--cy2)}
.chip b.pu{color:var(--pu2)}
.telemetry{display:flex;gap:14px;margin-left:auto;font-family:var(--mo);font-size:10px;letter-spacing:.8px}
.tm{display:flex;flex-direction:column;gap:1px;padding:3px 10px;background:rgba(13,20,16,.7);border:1px solid var(--bd);border-radius:3px}
.tm .k{font-size:8px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px}
.tm .v{color:var(--gr2);font-weight:600}
.tm .v.warn{color:var(--yl2)}
.tm .v.crit{color:var(--rd2)}

.main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}

.nav{width:260px;background:rgba(13,20,16,.94);backdrop-filter:blur(12px);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-search{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-search input{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11px;color:var(--gr2);letter-spacing:.5px}
.nav-search input:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,102,.14)}
.nav-search input::placeholder{color:var(--tx3)}
.nav-cat{padding:11px 0 3px}
.nav-cat-label{font-family:var(--mo);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);padding:0 13px 5px;font-weight:600;display:flex;align-items:center;gap:6px}
.nav-cat-label .badge-lang{background:var(--panel3);border:1px solid var(--bd2);border-radius:6px;padding:0 5px;font-size:7.5px;color:var(--gr2);letter-spacing:1px}
.nav-item{padding:6px 13px;font-size:12px;color:var(--tx2);cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:10px;position:relative}
.nav-item:hover{background:rgba(0,255,102,.06);color:var(--tx)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,255,102,.16),transparent);color:var(--gr2);border-left:2px solid var(--gr);padding-left:11px}
.nav-item .ico{font-size:13px;width:18px;text-align:center;opacity:.85;font-family:var(--mo)}
.nav-item.crit.active{background:linear-gradient(90deg,rgba(255,45,85,.16),transparent);color:var(--rd2);border-left-color:var(--rd)}

.stage{flex:1;position:relative;overflow:hidden;background:transparent;min-width:0;display:flex;flex-direction:column}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stageContent{position:absolute;inset:0;pointer-events:none;z-index:5}

.info{width:340px;background:rgba(13,20,16,.94);backdrop-filter:blur(12px);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.info-head{padding:13px 17px;border-bottom:1px solid var(--bd);position:relative;background:linear-gradient(180deg,rgba(0,255,102,.05),transparent)}
.info-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),transparent);opacity:.6}
.info-title{font-family:var(--di);font-size:1.15rem;font-weight:700;color:var(--tx);letter-spacing:.5px}
.info-sub{font-family:var(--mo);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.info-body{padding:14px 17px 24px;flex:1}

.prop{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-family:var(--mo);font-size:11px;gap:12px;align-items:baseline}
.prop:last-child{border-bottom:none}
.prop .k{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;flex-shrink:0}
.prop .v{color:var(--tx);text-align:right;font-weight:500;word-break:break-word;font-family:var(--mo)}
.prop .v.gr{color:var(--gr2)}
.prop .v.yl{color:var(--yl2)}
.prop .v.rd{color:var(--rd2)}
.prop .v.cy{color:var(--cy2)}
.prop .v.bl{color:var(--bl2)}
.prop .v.pu{color:var(--pu2)}

.sec-head{font-family:var(--mo);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);margin:15px 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-head::before{content:'';flex:1;height:1px;background:var(--bd);order:-1}
.sec-head::after{content:'';flex:0 0 8px;height:1px;background:var(--gr)}
.sec-head:first-child{margin-top:0}
.sec-head.crit::after{background:var(--rd)}

.btn{padding:7px 13px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);border-radius:3px;font-family:var(--mo);font-size:10.5px;font-weight:500;letter-spacing:.4px;cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel3);border-color:var(--gr);color:var(--gr2)}
.btn.gr{background:linear-gradient(135deg,var(--gr),var(--gr3));color:#050807;font-weight:600}
.btn.yl{background:linear-gradient(135deg,var(--yl),#ccaa00);color:#050807;font-weight:600}
.btn.rd{background:linear-gradient(135deg,var(--rd),var(--rd3));color:#fff;font-weight:600}
.btn.cy{background:linear-gradient(135deg,var(--cy),#0891cc);color:#050807;font-weight:600}
.btn.pu{background:linear-gradient(135deg,var(--pu),#7c2ecc);color:#fff;font-weight:600}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.full{width:100%;justify-content:center}

.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mo);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11.5px;color:var(--gr2);letter-spacing:.3px}
.field textarea{resize:vertical;min-height:70px;line-height:1.55;font-family:var(--mo);font-size:11px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,102,.1)}
.field select option{background:#0d1410;color:var(--gr2)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 13px;background:rgba(13,20,16,.96);border:1px solid var(--bd2);border-left:3px solid var(--gr);font-family:var(--mo);font-size:10.5px;color:var(--tx);letter-spacing:.3px;max-width:340px;animation:tin .25s;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:3px}
.toast.yl{border-left-color:var(--yl)}
.toast.rd{border-left-color:var(--rd)}
.toast.cy{border-left-color:var(--cy)}
.toast.pu{border-left-color:var(--pu)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.code-container{position:absolute;top:100px;left:40px;right:40px;bottom:60px;background:rgba(5,8,7,.94);border:1px solid var(--bd2);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 60px rgba(0,0,0,.7)}
.code-header{background:linear-gradient(180deg,rgba(30,44,36,.95),rgba(13,20,16,.95));border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.code-header .dots{display:flex;gap:5px}
.code-header .dots span{width:11px;height:11px;border-radius:50%;display:block}
.code-header .dot-r{background:#ff5f56}
.code-header .dot-y{background:#ffbd2e}
.code-header .dot-g{background:#27c93f}
.code-header .filename{font-family:var(--mo);font-size:11px;color:var(--tx2);letter-spacing:.5px;margin-left:8px}
.code-header .lang-tag{margin-left:auto;background:var(--panel3);border:1px solid var(--bd2);border-radius:4px;padding:3px 9px;font-family:var(--mo);font-size:9.5px;color:var(--gr2);letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.code-body{flex:1;overflow:auto;padding:0;font-family:var(--mo);font-size:12.5px;line-height:1.65;letter-spacing:.15px;user-select:text}
.code-body pre{margin:0;padding:16px 20px;white-space:pre;overflow:visible}
.code-body .ln{display:inline-block;width:44px;color:var(--tx3);text-align:right;padding-right:16px;user-select:none;position:sticky;left:0;background:rgba(5,8,7,.95)}
.tk-keyword{color:#ff2d55;font-weight:600}
.tk-string{color:#00ff66}
.tk-comment{color:#4a5c50;font-style:italic}
.tk-number{color:#ffd500}
.tk-identifier{color:#c8d8c8}
.tk-builtin{color:#00aaff}
.tk-type{color:#a855f7;font-weight:500}
.tk-operator{color:#88a090}
.code-caption{position:absolute;top:64px;left:40px;right:40px;font-family:var(--mo);font-size:10.5px;color:var(--tx3);letter-spacing:.3px}
.code-caption b{color:var(--gr2);font-weight:600}

.hint{font-family:var(--mo);font-size:10.5px;color:var(--tx3);line-height:1.7;letter-spacing:.3px}
.hint b{color:var(--tx2)}
.hint code{background:var(--panel2);border:1px solid var(--bd);border-radius:3px;padding:1px 5px;font-family:var(--mo);font-size:10.5px;color:var(--gr2)}
.hint .crit{color:var(--rd2);font-weight:600}
.hint .warn{color:var(--yl2);font-weight:600}

#boot{position:fixed;inset:0;background:#050807;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9990;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.boot-canvas{width:340px;height:200px;position:relative;margin-bottom:8px}
.boot-canvas svg{width:100%;height:100%}
.boot-canvas svg *{opacity:0;animation:cIn .35s forwards}
.boot-canvas svg *:nth-child(1){animation-delay:.02s}
.boot-canvas svg *:nth-child(2){animation-delay:.05s}
.boot-canvas svg *:nth-child(3){animation-delay:.08s}
.boot-canvas svg *:nth-child(4){animation-delay:.11s}
.boot-canvas svg *:nth-child(5){animation-delay:.14s}
.boot-canvas svg *:nth-child(6){animation-delay:.17s}
.boot-canvas svg *:nth-child(7){animation-delay:.20s}
.boot-canvas svg *:nth-child(8){animation-delay:.23s}
.boot-canvas svg *:nth-child(9){animation-delay:.26s}
.boot-canvas svg *:nth-child(10){animation-delay:.29s}
.boot-canvas svg *:nth-child(11){animation-delay:.32s}
.boot-canvas svg *:nth-child(12){animation-delay:.35s}
.boot-canvas svg *:nth-child(13){animation-delay:.38s}
.boot-canvas svg *:nth-child(14){animation-delay:.41s}
.boot-canvas svg *:nth-child(15){animation-delay:.44s}
.boot-canvas svg *:nth-child(16){animation-delay:.47s}
.boot-canvas svg *:nth-child(17){animation-delay:.50s}
.boot-canvas svg *:nth-child(18){animation-delay:.53s}
.boot-canvas svg *:nth-child(19){animation-delay:.56s}
.boot-canvas svg *:nth-child(20){animation-delay:.59s}
.boot-canvas svg *:nth-child(21){animation-delay:.62s}
.boot-canvas svg *:nth-child(22){animation-delay:.65s}
.boot-canvas svg *:nth-child(23){animation-delay:.68s}
.boot-canvas svg *:nth-child(24){animation-delay:.71s}
.boot-canvas svg *:nth-child(25){animation-delay:.74s}
.boot-canvas svg *:nth-child(26){animation-delay:.77s}
.boot-canvas svg *:nth-child(27){animation-delay:.80s}
.boot-canvas svg *:nth-child(28){animation-delay:.83s}
.boot-canvas svg *:nth-child(29){animation-delay:.86s}
.boot-canvas svg *:nth-child(30){animation-delay:.89s}
@keyframes cIn{to{opacity:1}}
.boot-mark{font-family:var(--di);font-size:2.6rem;font-weight:900;letter-spacing:8px;color:var(--gr);text-shadow:0 0 40px rgba(0,255,102,.8)}
.boot-sub{font-family:var(--mo);font-size:10px;letter-spacing:4px;color:var(--tx3);text-transform:uppercase}
.boot-bar{width:400px;height:2px;background:var(--panel3);overflow:hidden;border-radius:1px}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),var(--yl),var(--rd));transition:width .3s;box-shadow:0 0 12px var(--gr)}

@media(max-width:1100px){.nav{width:200px}.info{width:280px}}
@media(max-width:800px){.nav{width:60px}.nav-item span:not(.ico){display:none}.nav-cat-label span:not(.badge-lang){display:none}.info{width:240px}.code-container{left:20px;right:20px}}
</style>
</head>
<body>

<div id="bg"></div>

<div id="boot">
  <div class="boot-canvas">
    <svg viewBox="0 0 340 200" fill="none" stroke="#00ff66" stroke-width="1.1">
      <circle cx="170" cy="100" r="20" stroke="none" fill="rgba(0,255,102,.2)"/>
      <circle cx="170" cy="100" r="15" stroke="#00ff66" stroke-width="2"/>
      <circle cx="170" cy="100" r="8" fill="#ffd500" stroke="none"/>
      <circle cx="170" cy="100" r="3" fill="#ff2d55" stroke="none"/>
      <ellipse cx="170" cy="100" rx="60" ry="30" stroke="#5cc5ff" opacity="0.4"/>
      <ellipse cx="170" cy="100" rx="90" ry="45" stroke="#5cc5ff" opacity="0.3"/>
      <ellipse cx="170" cy="100" rx="120" ry="60" stroke="#5cc5ff" opacity="0.2"/>
      <line x1="170" y1="30" x2="170" y2="10" stroke="#ffd500" stroke-width="2"/>
      <line x1="170" y1="170" x2="170" y2="190" stroke="#ffd500" stroke-width="2"/>
      <line x1="100" y1="100" x2="80" y2="100" stroke="#ffd500" stroke-width="2"/>
      <line x1="240" y1="100" x2="260" y2="100" stroke="#ffd500" stroke-width="2"/>
      <circle cx="110" cy="85" r="3" fill="#5cff99" stroke="none"/>
      <circle cx="230" cy="115" r="3" fill="#5cff99" stroke="none"/>
      <circle cx="140" cy="60" r="3" fill="#5cff99" stroke="none"/>
      <circle cx="200" cy="140" r="3" fill="#5cff99" stroke="none"/>
      <text x="170" y="192" fill="#00ff66" font-family="monospace" font-size="9" text-anchor="middle" stroke="none">U-235</text>
      <text x="30" y="30" fill="#5cc5ff" font-family="monospace" font-size="9" stroke="none">n + U → Ba + Kr + 3n</text>
      <text x="30" y="44" fill="#ffd500" font-family="monospace" font-size="9" stroke="none">E ≈ 200 MeV</text>
    </svg>
  </div>
  <div class="boot-mark">NUCLEAR</div>
  <div class="boot-sub">reactor physics workbench</div>
  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-sub" id="bootStatus" style="font-size:8px">initializing…</div>
</div>

<div id="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-name">NUCLEAR</span>
      <span class="brand-sub">reactor physics &amp; nuclear engineering</span>
    </div>
    <div class="div"></div>
    <div class="chip"><span>k_eff</span><b class="gr" id="cK">1.000</b></div>
    <div class="chip"><span>P</span><b class="yl" id="cPower">0 MW</b></div>
    <div class="chip"><span>ρ</span><b class="cy" id="cRho">0 pcm</b></div>
    <div class="chip"><span>Module</span><b id="cModule">Dashboard</b></div>
    <div class="telemetry">
      <div class="tm"><span class="k">Status</span><span class="v" id="tStatus">nominal</span></div>
      <div class="tm"><span class="k">Flux</span><span class="v" id="tFlux">0 n/cm²/s</span></div>
      <div class="tm"><span class="k">T_cool</span><span class="v" id="tTCool">290°C</span></div>
    </div>
  </header>

  <div class="main">
    <aside class="nav" id="nav"></aside>
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="stageContent"></div>
    </section>
    <aside class="info">
      <div class="info-head">
        <div class="info-title" id="infoTitle">Dashboard</div>
        <div class="info-sub" id="infoSub">ready</div>
      </div>
      <div class="info-body" id="infoBody"></div>
    </aside>
  </div>
</div>

<div id="toasts"></div>
<script>
"use strict";
var $=function(i){return document.getElementById(i)};
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c!=null){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function expo(n,d){if(n===0)return '0';if(!isFinite(n)||isNaN(n))return '—';d=d==null?2:d;var e=Math.floor(Math.log10(Math.abs(n)));return fmt(n/Math.pow(10,e),d)+'×10^'+e}
function commas(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}

function decayConstant(halflife){return Math.LN2/halflife}

/* ══════════ Neutron diffusion (1D, 1-group) ══════════ */
function diffusionEquation1D(x,D,Sigma_a,S){
  /* Solve: D·d²φ/dx² - Σa·φ + S = 0 */
  /* Discrete: uniform grid */
  var n=x.length;
  var dx=x[1]-x[0];
  var A=[];
  for(var i=0;i<n;i++){
    var row=new Array(n).fill(0);
    if(i===0||i===n-1){
      row[i]=1;
    } else {
      row[i-1]=D/(dx*dx);
      row[i]=-2*D/(dx*dx)-Sigma_a;
      row[i+1]=D/(dx*dx);
    }
    A.push(row);
  }
  var b=new Array(n).fill(0);
  for(var i=1;i<n-1;i++)b[i]=-S[i];
  b[0]=0;
  b[n-1]=0;
  return solveLinear(A,b);
}
function diffusionLength(D,Sigma_a){return Math.sqrt(D/Sigma_a)}
function bucklingGeometric(a,b,c){
  /* For rectangular: B² = π²(1/a²+1/b²+1/c²) */
  return Math.PI*Math.PI*(1/(a*a)+1/(b*b)+1/(c*c));
}
function criticalSize1D(M2,B2){
  /* Critical buckling: B² = (π/a)² for slab */
  return Math.PI/Math.sqrt(B2);
}
function kEffective(k_inf,M2,B2){
  /* One-group: k_eff = k_inf / (1 + M²·B²) */
  return k_inf/(1+M2*B2);
}
function reactivity(k){return (k-1)/k}

/* ══════════ Point kinetics ══════════ */
function pointKinetics(rho,beta,lambda,t,rho_history){
  /* Simplified: prompt jump for step reactivity */
  /* In prompt critical: n(t) ≈ n_0 · exp(λ·t/(1-β-ρ)) */
  if(rho<beta){
    /* Delayed critical: use in-hour equation */
    var omega=rho/(beta-rho)*lambda;
    return Math.exp(omega*t);
  } else {
    /* Prompt critical */
    var alpha=(rho-beta)/(beta/omega_0);
    return Math.exp(alpha*t);
  }
}
function promptJump(rho,beta){return 1/(1-(rho-beta))}
function inHourEquation(rho,beta,lambda,T){
  /* Solve: ρ = β/(1+λT) → T = (β/ρ - 1)/λ */
  return (beta/rho-1)/lambda;
}
function reactorPeriod(rho,beta,lambda){return inHourEquation(rho,beta,lambda)*3600}
function doublingTime(rho,beta,lambda){return Math.LN2*inHourEquation(rho,beta,lambda)*3600}

/* ══════════ Bateman equations (decay chains) ══════════ */
function batemanChain(lambdas,N0,t){
  /* For chain A → B → C → ... */
  /* Using simplified numerical integration (RK4) */
  var n=lambdas.length;
  var N=N0.slice();
  var dt=t/1000;
  for(var step=0;step<1000;step++){
    var dN=new Array(n).fill(0);
    dN[0]=-lambdas[0]*N[0];
    for(var i=1;i<n;i++)dN[i]=lambdas[i-1]*N[i-1]-lambdas[i]*N[i];
    for(var i=0;i<n;i++)N[i]+=dN[i]*dt;
  }
  return N;
}

/* ══════════ Monte Carlo neutron transport (simplified) ══════════ */
function monteCarloCriticality(numNeutrons,material,geometry){
  /* Simplified k_eff via analog Monte Carlo */
  var fission=0, absorption=0, escape=0;
  for(var i=0;i<numNeutrons;i++){
    var r=0;
    var alive=true;
    var fissionsThisHistory=0;
    while(alive){
      /* Sample distance to next interaction */
      var sigma_total=material.Sigma_t;
      var d=-Math.log(Math.random())/sigma_total;
      r+=d;
      /* Check escape */
      if(r>geometry.radius){
        escape++;
        alive=false;
        break;
      }
      /* Sample interaction type */
      var p=Math.random();
      if(p<material.fissionProb){
        fissionsThisHistory+=material.nu;
        fission++;
        alive=false;
      } else if(p<material.fissionProb+material.captureProb){
        absorption++;
        alive=false;
      } else {
        /* Scatter, continue */
      }
    }
  }
  var k=fission/Math.max(1,absorption+fission);
  return {k_eff:k,events:{fission:fission,absorption:absorption,escape:escape}};
}

/* ══════════ Cross section interpolation ══════════ */
function interpolateXS(energy,xs_table){
  /* Log-log interpolation for cross sections */
  if(!xs_table||xs_table.length===0)return 0;
  if(energy<=xs_table[0][0])return xs_table[0][1];
  if(energy>=xs_table[xs_table.length-1][0])return xs_table[xs_table.length-1][1];
  for(var i=1;i<xs_table.length;i++){
    if(energy<=xs_table[i][0]){
      var e1=xs_table[i-1][0],e2=xs_table[i][0];
      var s1=xs_table[i-1][1],s2=xs_table[i][1];
      var t=(Math.log(energy)-Math.log(e1))/(Math.log(e2)-Math.log(e1));
      return Math.exp(lerp(Math.log(s1),Math.log(s2),t));
    }
  }
  return xs_table[xs_table.length-1][1];
}

/* ══════════ Linear system solver ══════════ */
function solveLinear(A,b){
  var n=A.length,M=[];
  for(var i=0;i<n;i++){M.push(A[i].slice());M[i].push(b[i])}
  for(var i=0;i<n;i++){
    var p=i;
    for(var k=i+1;k<n;k++)if(Math.abs(M[k][i])>Math.abs(M[p][i]))p=k;
    var tmp=M[i];M[i]=M[p];M[p]=tmp;
    if(Math.abs(M[i][i])<1e-15)continue;
    for(var k=i+1;k<n;k++){
      var f=M[k][i]/M[i][i];
      for(var j=i;j<=n;j++)M[k][j]-=f*M[i][j];
    }
  }
  var x=new Array(n);
  for(var i=n-1;i>=0;i--){
    var s=M[i][n];
    for(var j=i+1;j<n;j++)s-=M[i][j]*x[j];
    x[i]=Math.abs(M[i][i])>1e-15?s/M[i][i]:0;
  }
  return x;
}

/* ══════════ FFT (for reactor noise, neutron flux spectra) ══════════ */
function fft(re,im){
  var n=re.length;
  for(var i=1,j=0;i<n;i++){
    var bit=n>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){var t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}
  }
  for(var len=2;len<=n;len<<=1){
    var ang=-2*Math.PI/len;
    var wR=Math.cos(ang),wI=Math.sin(ang);
    for(var i=0;i<n;i+=len){
      var cR=1,cI=0;
      for(var k=0;k<len/2;k++){
        var uR=re[i+k],uI=im[i+k];
        var vR=re[i+k+len/2]*cR-im[i+k+len/2]*cI;
        var vI=re[i+k+len/2]*cI+im[i+k+len/2]*cR;
        re[i+k]=uR+vR;im[i+k]=uI+vI;
        re[i+k+len/2]=uR-vR;im[i+k+len/2]=uI-vI;
        var nR=cR*wR-cI*wI;cI=cR*wI+cI*wR;cR=nR;
      }
    }
  }
}

SNIPPETS.monteCarloPython={
  file:'openmc_like.py',lang:'python',
  caption:'Monte Carlo neutron transport — <b>production reactor physics</b>',
  code:`"""Monte Carlo neutron transport: k_eff calculation for a bare sphere.

This is a Python reimplementation of the OpenMC / MCNP algorithm structure.
Real production codes (MCNP6, OpenMC, Serpent) use the same physics.

Pipeline:
  1. Sample fission neutron (position + energy + direction)
  2. Sample distance to next collision: d = -ln(ξ)/Σ_t
  3. If d > distance to boundary: escape
  4. Sample interaction: (σ_f, σ_c, σ_s)/σ_t
  5. If fission: sample ν new neutrons (fission bank)
  6. If scatter: sample new energy/direction (Klein-Nishina or thermal)
  7. Repeat for N generations, k_eff = N_fission / N_total

Real production accuracy:
  • 10^7 neutron histories → k_eff ± 10 pcm
  • Runtime: 1 hour on 100 cores
  • MCNP6 / OpenMC: fully verified against benchmarks

This module: pure-Python educational implementation.
"""
from __future__ import annotations

import math
from dataclasses import dataclass

import numpy as np
from numpy.typing import NDArray


@dataclass
class Material:
    name: str
    Sigma_t: float       # total macroscopic cross section (1/cm)
    Sigma_f: float       # fission
    Sigma_c: float       # capture (radiative)
    Sigma_s: float       # scatter
    nu: float            # neutrons per fission
    chi: NDArray         # fission spectrum (energy groups)

    def validate(self) -> None:
        total = self.Sigma_f + self.Sigma_c + self.Sigma_s
        assert abs(total - self.Sigma_t) < 1e-6, "cross sections inconsistent"


@dataclass
class Neutron:
    r: NDArray[np.float64]     # position (cm)
    u: NDArray[np.float64]     # direction (unit vector)
    E: float                    # energy (MeV)
    alive: bool = True
    weight: float = 1.0


class Sphere:
    def __init__(self, radius: float):
        self.radius = radius

    def distance_to_boundary(self, r: NDArray, u: NDArray) -> float:
        """Distance from r along u until hitting sphere boundary."""
        # Solve |r + t*u| = R
        b = np.dot(r, u)
        c = np.dot(r, r) - self.radius ** 2
        disc = b * b - c
        if disc < 0:
            return math.inf
        t = -b + math.sqrt(disc)
        return max(t, 0.0)

    def contains(self, r: NDArray) -> bool:
        return np.linalg.norm(r) <= self.radius


def sample_isotropic_direction(rng: np.random.Generator) -> NDArray:
    """Uniform on unit sphere."""
    mu = 2.0 * rng.random() - 1.0
    phi = 2.0 * math.pi * rng.random()
    sin_theta = math.sqrt(1.0 - mu * mu)
    return np.array([
        sin_theta * math.cos(phi),
        sin_theta * math.sin(phi),
        mu,
    ])


def sample_fission_energy(rng: np.random.Generator, chi: NDArray,
                           E_grid: NDArray) -> float:
    """Sample fission neutron energy from Watt spectrum (approximation)."""
    # Watt: p(E) ∝ exp(-E/a) · sinh(sqrt(b·E))
    a, b = 0.988, 2.249  # for U-235 thermal
    while True:
        E = -a * math.log(rng.random())
        if rng.random() < math.sqrt(b * E) / math.tanh(math.sqrt(b * E)):
            return min(E, 10.0)


def transport_one_generation(
    neutrons: list[Neutron],
    material: Material,
    geometry: Sphere,
    rng: np.random.Generator,
) -> tuple[list[Neutron], int, int, int]:
    """Transport all neutrons in the current generation.

    Returns (next_generation_neutrons, n_fissions, n_captures, n_escapes).
    """
    next_gen: list[Neutron] = []
    n_fissions = 0
    n_captures = 0
    n_escapes = 0

    for neutron in neutrons:
        r = neutron.r.copy()
        u = neutron.u.copy()
        E = neutron.E

        while True:
            # Distance to next collision
            d_collision = -math.log(rng.random()) / material.Sigma_t

            # Distance to boundary
            d_boundary = geometry.distance_to_boundary(r, u)

            if d_collision > d_boundary:
                # Escaped
                n_escapes += 1
                break

            # Move to collision site
            r = r + d_collision * u

            # Sample interaction
            xi = rng.random() * material.Sigma_t
            if xi < material.Sigma_f:
                # Fission: produce ν new neutrons
                n_fissions += 1
                n_new = int(material.nu)
                # Handle fractional part statistically
                if rng.random() < (material.nu - n_new):
                    n_new += 1
                for _ in range(n_new):
                    next_gen.append(Neutron(
                        r=r.copy(),
                        u=sample_isotropic_direction(rng),
                        E=sample_fission_energy(rng, material.chi, None),
                    ))
                break

            elif xi < material.Sigma_f + material.Sigma_c:
                # Capture
                n_captures += 1
                break

            else:
                # Scatter (elastic for simplicity)
                # Sample new direction: isotropic in CM, but let's use
                # the fact that for A >> 1 forward scattering is likely
                mu_cm = 2 * rng.random() - 1
                # Assume A=1 for H2O
                A = 1.0
                mu_lab = (1 + A * mu_cm) / math.sqrt(1 + A * A + 2 * A * mu_cm)
                phi = 2 * math.pi * rng.random()
                st = math.sqrt(1 - mu_lab ** 2)
                # Rotate u by the sampled angle
                u_new = rotate_direction(u, mu_lab, phi)
                u = u_new
                # Energy loss (elastic)
                E = E * (1 + A * A + 2 * A * mu_cm) / ((1 + A) ** 2)

    return next_gen, n_fissions, n_captures, n_escapes


def rotate_direction(u: NDArray, mu: float, phi: float) -> NDArray:
    """Rotate unit vector u to polar angle θ with cos θ = mu, azimuth φ."""
    if abs(u[2] - 1.0) < 1e-10:
        return np.array([math.sqrt(1 - mu * mu) * math.cos(phi),
                         math.sqrt(1 - mu * mu) * math.sin(phi),
                         mu])
    if abs(u[2] + 1.0) < 1e-10:
        return np.array([math.sqrt(1 - mu * mu) * math.cos(phi),
                         math.sqrt(1 - mu * mu) * math.sin(phi),
                         -mu])
    s = math.sqrt(1 - mu * mu)
    v = np.array([0.0, 0.0, 1.0])
    u_prime = np.cross(u, v)
    u_prime /= np.linalg.norm(u_prime)
    u_dprime = np.cross(u, u_prime)
    return mu * u + s * (math.cos(phi) * u_prime + math.sin(phi) * u_dprime)


def compute_k_eff(
    material: Material,
    geometry: Sphere,
    n_histories: int = 10_000,
    n_inactive: int = 20,
    n_active: int = 100,
    seed: int = 42,
) -> dict:
    """Run inactive + active generations, estimate k_eff."""
    rng = np.random.default_rng(seed)

    # Initial source: uniform in sphere, isotropic, thermal
    neutrons = []
    for _ in range(n_histories):
        r_norm = geometry.radius * rng.random() ** (1 / 3)
        r = r_norm * sample_isotropic_direction(rng)
        neutrons.append(Neutron(
            r=r,
            u=sample_isotropic_direction(rng),
            E=1.0,  # mean fission energy
        ))

    k_history = []
    for gen in range(n_inactive + n_active):
        next_gen, n_f, n_c, n_e = transport_one_generation(
            neutrons, material, geometry, rng
        )
        k_gen = len(next_gen) / max(len(neutrons), 1)
        k_history.append(k_gen)

        if not next_gen:
            raise RuntimeError(f"Generation {gen}: zero neutrons")

        # Resample to fixed size (implicit capture / survival biasing)
        idx = rng.choice(len(next_gen), size=n_histories, replace=True)
        neutrons = [next_gen[i] for i in idx]

    k_active = k_history[n_inactive:]
    k_mean = float(np.mean(k_active))
    k_std = float(np.std(k_active) / math.sqrt(len(k_active)))

    return {
        'k_eff': k_mean,
        'k_std': k_std,
        'k_history': k_history,
        'n_active': len(k_active),
    }


if __name__ == "__main__":
    # Pu-239 metal sphere, ~6 kg
    material = Material(
        name='Pu-239',
        Sigma_t=0.5,     # 1/cm
        Sigma_f=0.30,
        Sigma_c=0.05,
        Sigma_s=0.15,
        nu=2.88,
        chi=np.array([1.0]),
    )
    material.validate()

    geometry = Sphere(radius=6.0)   # ~6 cm

    result = compute_k_eff(
        material, geometry,
        n_histories=5000,
        n_inactive=50,
        n_active=200,
    )

    print(f"k_eff = {result['k_eff']:.5f} ± {result['k_std']:.5f}")
    print(f"Active generations: {result['n_active']}")

    if result['k_eff'] > 1:
        print("✓ Supercritical (multiplication > 1)")
    else:
        print("✗ Subcritical (would need more mass / better reflector)")`
};

SNIPPETS.corePhysicsCpp={
  file:'pwr_core.cpp',lang:'cpp',
  caption:'PWR core physics — <b>3D nodal diffusion with thermal-hydraulic coupling</b>',
  code:`// PWR core simulator: 3D nodal neutron diffusion + TH feedback.
//
// The "nodal method" is used by industry codes (PARCS, SIMULATE-3, ANC)
// to solve the neutron diffusion equation efficiently on coarse meshes.
//
// Governing equation (steady-state, 2-group):
//   -∇·D_g(r)·∇φ_g(r) + Σ_r,g(r)·φ_g(r) = χ_g/k · Σ_g' νΣf,g'(r)·φ_g'(r)
//                                          + Σ_g'≠g Σ_s,g'→g(r)·φ_g'(r)
//
// Feedback loops:
//   • Doppler: fuel temperature → U-238 resonance broadening → Σ_a ↑
//   • Moderator: coolant density → moderation → Σ_a ↑
//   • Xenon: flux → Xe-135 → Σ_a ↑ (transient)
//
// This code: 1D radial, 2-group, coupled with thermal solution.
//
// Compile: g++ -O3 -std=c++20 pwr_core.cpp
// Depends: Eigen3

#include <Eigen/Dense>
#include <cmath>
#include <cstdio>
#include <vector>

namespace pwr {

constexpr double PI = 3.141592653589793;
constexpr double BETA_EFF = 0.0065;
constexpr double R_GAS = 8.314;   // J/mol/K
constexpr double T_REF = 293.6;   // K
constexpr double T_FUEL_REF = 900.0;
constexpr double T_MOD_REF = 580.0;
constexpr double ALPHA_DOPPLER = -2.5e-5;   // 1/K (fuel temp coeff)
constexpr double ALPHA_MOD = -3.0e-5;       // 1/K (moderator density coeff)

struct GroupData {
    double D;          // diffusion coefficient (cm)
    double Sigma_a;    // absorption (1/cm)
    double nuSigma_f;  // production (1/cm)
    double Sigma_s12;  // downscatter 1→2
};

struct CrossSections {
    GroupData g1;      // fast
    GroupData g2;      // thermal
    double chi1;       // fission spectrum into group 1
    double chi2;
};

struct NodeState {
    double phi1;       // fast flux
    double phi2;       // thermal flux
    double T_fuel;     // K
    double T_mod;      // K
    double rho;        // moderator density (g/cm³)
};

struct Core {
    int n_nodes;
    double radius_cm;
    double dx;
    double power_density_target;   // W/cm³
    std::vector<double> r;         // node radii

    // Feedback coefficients at reference conditions
    double dSigma_a_dT_fuel = 1e-4;
    double dSigma_a_dT_mod = -5e-4;
    double dSigma_a_drho = 5e-3;

    // Heat transfer
    double k_fuel = 2.5;             // W/cm/K
    double h_gap = 0.5;              // W/cm²/K (fuel-clad gap)
    double h_clad = 3.0;             // W/cm²/K (clad-coolant)
    double R_fuel = 0.4;             // cm
    double R_clad = 0.42;            // cm
};

// Compute cross sections with feedback
CrossSections compute_xs(const Core& core, const NodeState& s) {
    // Reference values (typical PWR at HZP)
    CrossSections xs;
    xs.g1 = {1.30, 0.010, 0.0075, 0.020};
    xs.g2 = {0.35, 0.100, 0.150, 0.0};
    xs.chi1 = 1.0;   // fast fission spectrum
    xs.chi2 = 0.0;

    // Doppler feedback (fuel temperature)
    double dT_f = s.T_fuel - T_FUEL_REF;
    double doppler = core.dSigma_a_dT_fuel * dT_f * (-1.0);  // negative
    xs.g2.Sigma_a += doppler;

    // Moderator feedback (temperature + density)
    double dT_m = s.T_mod - T_MOD_REF;
    double drho = s.rho - 0.7;
    xs.g2.Sigma_a += core.dSigma_a_dT_mod * dT_m + core.dSigma_a_drho * drho;

    return xs;
}

// Build 2-group diffusion matrix at given node state
Eigen::MatrixXd build_diffusion_matrix(
    const Core& core,
    const std::vector<NodeState>& states
) {
    int N = core.n_nodes;
    int n = 2 * N;
    Eigen::MatrixXd A = Eigen::MatrixXd::Zero(n, n);

    for (int i = 0; i < N; ++i) {
        CrossSections xs = compute_xs(core, states[i]);
        double dx2 = core.dx * core.dx;

        // Fast group (index 2i)
        // -D1·(φ[i-1] - 2φ[i] + φ[i+1])/dx² + Σa1·φ[i] = source
        A(2*i, 2*i) = 2 * xs.g1.D / dx2 + xs.g1.Sigma_a;
        if (i > 0) A(2*i, 2*i-2) = -xs.g1.D / dx2;
        if (i < N-1) A(2*i, 2*i+2) = -xs.g1.D / dx2;

        // Thermal group (index 2i+1)
        A(2*i+1, 2*i+1) = 2 * xs.g2.D / dx2 + xs.g2.Sigma_a;
        if (i > 0) A(2*i+1, 2*i-1) = -xs.g2.D / dx2;
        if (i < N-1) A(2*i+1, 2*i+3) = -xs.g2.D / dx2;
        // Downscatter from fast
        A(2*i+1, 2*i) = -xs.g1.Sigma_s12;
    }

    return A;
}

// Fission source vector for given k
Eigen::VectorXd fission_source(
    const Core& core,
    const std::vector<NodeState>& states,
    const Eigen::VectorXd& phi,
    double k
) {
    int N = core.n_nodes;
    Eigen::VectorXd S = Eigen::VectorXd::Zero(2 * N);

    for (int i = 0; i < N; ++i) {
        CrossSections xs = compute_xs(core, states[i]);
        double prod1 = xs.g1.nuSigma_f * phi(2*i) + xs.g2.nuSigma_f * phi(2*i+1);
        S(2*i)     = xs.chi1 * prod1 / k;
        S(2*i+1)   = xs.chi2 * prod1 / k;
    }

    return S;
}

// Power iteration to find k_eff and flux distribution
struct CriticalityResult {
    double k_eff;
    Eigen::VectorXd phi;
    int iterations;
    double residual;
};

CriticalityResult solve_criticality(
    const Core& core,
    const std::vector<NodeState>& states,
    int max_iter = 200,
    double tol = 1e-6
) {
    int n = 2 * core.n_nodes;

    // Initial guess: cosine shape
    Eigen::VectorXd phi = Eigen::VectorXd::Ones(n);
    double k = 1.0;
    double k_old = k;

    for (int iter = 0; iter < max_iter; ++iter) {
        Eigen::MatrixXd A = build_diffusion_matrix(core, states);
        Eigen::VectorXd S = fission_source(core, states, phi, k);

        // Apply boundary conditions: φ(R) = 0 (extrapolated)
        A.row(2*(core.n_nodes-1)).setZero();
        A(2*(core.n_nodes-1), 2*(core.n_nodes-1)) = 1.0;
        S(2*(core.n_nodes-1)) = 0.0;
        A.row(2*(core.n_nodes-1)+1).setZero();
        A(2*(core.n_nodes-1)+1, 2*(core.n_nodes-1)+1) = 1.0;
        S(2*(core.n_nodes-1)+1) = 0.0;

        Eigen::VectorXd phi_new = A.lu().solve(S);

        // Update k_eff = k · (fission integral of φ_new / φ_old)
        // (simplified power iteration)
        double num = 0.0, denom = 0.0;
        for (int i = 0; i < core.n_nodes; ++i) {
            CrossSections xs = compute_xs(core, states[i]);
            num += xs.g2.nuSigma_f * phi_new(2*i+1);
            denom += xs.g2.nuSigma_f * phi(2*i+1);
        }
        k *= num / denom;

        // Normalize
        double norm = phi_new.norm();
        if (norm > 0) phi_new /= norm;

        double err = (phi_new - phi).norm() / phi.norm();
        phi = phi_new;

        if (std::abs(k - k_old) < tol && err < tol) {
            return {k, phi, iter + 1, err};
        }
        k_old = k;
    }

    return {k, phi, max_iter, -1.0};
}

// Thermal-hydraulic update: fuel temp, mod temp, coolant density
void update_thermal_state(
    const Core& core,
    std::vector<NodeState>& states,
    const Eigen::VectorXd& phi,
    double total_power_W
) {
    // Normalize flux to match target power
    // P = Σ_fissions · Σf · φ · dV
    double power_calc = 0.0;
    for (int i = 0; i < core.n_nodes; ++i) {
        CrossSections xs = compute_xs(core, states[i]);
        double dV = 2 * PI * core.r[i] * core.dx;
        power_calc += xs.g2.nuSigma_f * phi(2*i+1) * 200e6 * 1.602e-19 * dV;
    }
    double scale = total_power_W / std::max(power_calc, 1e-10);

    for (int i = 0; i < core.n_nodes; ++i) {
        double dV = 2 * PI * core.r[i] * core.dx;
        CrossSections xs = compute_xs(core, states[i]);
        double q_triple_prime = xs.g2.nuSigma_f * phi(2*i+1) * 200e6 * 1.602e-19 * scale;  // W/cm³

        // Fuel centerline (1D radial conduction within pellet)
        double T_surface = states[i].T_mod + 50.0;   // approximate clad-surface rise
        double T_clad_avg = (states[i].T_mod + T_surface) / 2.0;
        double q_linear = q_triple_prime * PI * core.R_fuel * core.R_fuel;  // W/cm
        double dT_fuel = q_linear / (2 * PI * core.k_fuel);
        states[i].T_fuel = T_clad_avg + dT_fuel * 3.0;   // 3× peak/avg factor

        // Moderator: simple energy balance (steady-state)
        double cp = 5.5;      // J/g/K
        double m_dot = 4000.0;  // g/s per assembly
        double dT_mod = q_triple_prime * dV / (m_dot * cp);
        states[i].T_mod += 0.01 * (dT_mod - (states[i].T_mod - T_MOD_REF)) * 0.1;
        states[i].T_mod = std::max(280.0, std::min(620.0, states[i].T_mod));

        // Coolant density (linear approx near saturation)
        states[i].rho = 0.70 - 0.001 * (states[i].T_mod - T_MOD_REF);
        states[i].rho = std::max(0.4, std::min(0.75, states[i].rho));
    }
}

}  // namespace pwr

int main() {
    pwr::Core core;
    core.n_nodes = 40;
    core.radius_cm = 200.0;
    core.dx = core.radius_cm / core.n_nodes;
    core.power_density_target = 100.0;   // W/cm³

    std::vector<pwr::NodeState> states(core.n_nodes);
    for (int i = 0; i < core.n_nodes; ++i) {
        core.r[i] = (i + 0.5) * core.dx;
        states[i] = {1.0, 1.0, 900.0, 580.0, 0.70};
    }
    core.r.resize(core.n_nodes);
    for (int i = 0; i < core.n_nodes; ++i) core.r[i] = (i + 0.5) * core.dx;

    // Coupled iteration: neutronics → TH → neutronics
    double k_eff = 1.0;
    for (int outer = 0; outer < 30; ++outer) {
        auto result = pwr::solve_criticality(core, states);
        k_eff = result.k_eff;
        double total_power = core.power_density_target * PI * core.radius_cm * core.radius_cm * core.dx;
        pwr::update_thermal_state(core, states, result.phi, total_power);

        if (outer % 5 == 0) {
            std::printf("Outer iter %2d: k_eff = %.5f  T_fuel(center) = %.1f K  T_mod(avg) = %.1f K\\n",
                        outer, k_eff, states[0].T_fuel,
                        [&](){ double s=0; for (auto& st : states) s+=st.T_mod; return s/states.size(); }());
        }
    }

    std::printf("\\nFinal k_eff = %.5f\\n", k_eff);
    if (k_eff > 1.0) std::printf("Reactor is SUPERCRITICAL — insert control rods\\n");
    else if (k_eff < 1.0) std::printf("Reactor is SUBCRITICAL — withdraw control rods\\n");
    else std::printf("Reactor is CRITICAL\\n");

    return 0;
}`
};

SNIPPETS.pointKineticsRust={
  file:'point_kinetics.rs',lang:'rust',
  caption:'Point reactor kinetics — <b>transient analysis with delayed neutrons</b>',
  code:`//! Point reactor kinetics with 6 delayed neutron groups.
//!
//! Governing equations (Nordheim-Fuchs):
//!   dn/dt = (ρ(t) - β)/Λ · n + Σ_i λ_i · C_i
//!   dC_i/dt = β_i/Λ · n - λ_i · C_i,   i = 1..6
//!
//! Where:
//!   n   = neutron density (or power)
//!   ρ   = reactivity (pcm = 10⁻⁵)
//!   β   = total delayed fraction (0.0065 for U-235)
//!   Λ   = prompt neutron lifetime (~2×10⁻⁵ s for PWR)
//!   C_i = delayed neutron precursor concentration
//!   λ_i = decay constants (s⁻¹)
//!
//! Why Rust for reactor safety systems?
//!   • Deterministic timing (no GC pauses)
//!   • Memory safety in critical loops
//!   • Verified: RustBelt, Kani formal verification
//!   • Growing use in nuclear I&C (NRC evaluating)
//!
//! Reference: Hetrick, "Dynamics of Nuclear Reactors" (1993)

use nalgebra::{DMatrix, DVector, Vector6};
use std::time::Instant;

/// Delayed neutron group data for U-235 thermal fission.
/// (Keepin, 1965; also NUREG/CR-4884)
pub struct DelayedGroups {
    pub beta_i: [f64; 6],
    pub lambda_i: [f64; 6],
}

impl DelayedGroups {
    pub fn u235_thermal() -> Self {
        Self {
            beta_i: [
                2.15e-4, 1.424e-3, 1.274e-3,
                2.568e-4, 7.48e-5, 2.73e-5,
            ],
            lambda_i: [
                0.0124, 0.0305, 0.111,
                0.301, 1.14, 3.01,
            ],
        }
    }

    pub fn u235_fast() -> Self {
        Self {
            beta_i: [
                2.20e-4, 1.380e-3, 1.225e-3,
                2.565e-4, 7.45e-5, 2.72e-5,
            ],
            lambda_i: [
                0.0125, 0.0307, 0.113,
                0.310, 1.15, 3.05,
            ],
        }
    }

    pub fn pu239_thermal() -> Self {
        Self {
            beta_i: [
                2.10e-4, 1.265e-3, 1.164e-3,
                2.345e-4, 6.63e-5, 2.37e-5,
            ],
            lambda_i: [
                0.0126, 0.0311, 0.115,
                0.317, 1.16, 3.03,
            ],
        }
    }

    pub fn total_beta(&self) -> f64 {
        self.beta_i.iter().sum()
    }
}

/// Reactivity insertion scenarios.
#[derive(Debug, Clone, Copy)]
pub enum Reactivity {
    /// Step insertion (rod ejection, boron dilution)
    Step { rho: f64 },
    /// Ramp insertion (rod withdrawal at constant rate)
    Ramp { rate: f64, rho_max: f64 },
    /// Sinusoidal (oscillation)
    Sine { amplitude: f64, period: f64 },
    /// Feedback-controlled (with Doppler)
    Feedback { rho_ext: f64, alpha_doppler: f64, T_ref: f64 },
}

impl Reactivity {
    pub fn eval(&self, t: f64, T_fuel: f64) -> f64 {
        match *self {
            Reactivity::Step { rho } => {
                if t >= 0.0 { rho } else { 0.0 }
            }
            Reactivity::Ramp { rate, rho_max } => {
                (rate * t).min(rho_max)
            }
            Reactivity::Sine { amplitude, period } => {
                amplitude * (2.0 * std::f64::consts::PI * t / period).sin()
            }
            Reactivity::Feedback { rho_ext, alpha_doppler, T_ref } => {
                rho_ext + alpha_doppler * (T_fuel - T_ref)
            }
        }
    }
}

/// Point kinetics state: [n, C_1, ..., C_6, T_fuel]
#[derive(Debug, Clone)]
pub struct State {
    pub n: f64,           // neutron density (normalized)
    pub C: Vector6<f64>,  // delayed precursors
    pub T_fuel: f64,      // fuel temperature (K)
}

/// System parameters.
pub struct Parameters {
    pub beta: f64,        // total delayed fraction
    pub Lambda: f64,      // prompt generation time (s)
    pub groups: DelayedGroups,
    pub alpha_doppler: f64,   // pcm/K
    pub T_ref: f64,           // reference fuel T (K)
    pub cp: f64,              // fuel heat capacity (J/K)
    pub power_per_n: f64,     // W per unit n (calibration)
}

impl Parameters {
    pub fn pwr_typical() -> Self {
        let groups = DelayedGroups::u235_thermal();
        Self {
            beta: groups.total_beta(),
            Lambda: 2.0e-5,       // 20 µs
            groups,
            alpha_doppler: -2.5e-5,  // Δρ/K (negative)
            T_ref: 900.0,
            cp: 1.0e6,            // J/K (assembly-level lumped)
            power_per_n: 1.0e8,   // 100 MW at n=1
        }
    }
}

/// Derivative function for RK4.
fn derivatives(
    p: &Parameters,
    rho: &Reactivity,
    state: &State,
    t: f64,
) -> (f64, Vector6<f64>, f64) {
    let rho_t = rho.eval(t, state.T_fuel);

    // dn/dt
    let mut dn = (rho_t - p.beta) / p.Lambda * state.n;
    for i in 0..6 {
        dn += p.groups.lambda_i[i] * state.C[i];
    }

    // dC_i/dt
    let mut dC = Vector6::zeros();
    for i in 0..6 {
        dC[i] = p.groups.beta_i[i] / p.Lambda * state.n
              - p.groups.lambda_i[i] * state.C[i];
    }

    // dT/dt (fuel energy balance)
    let power = state.n * p.power_per_n;
    // Simplified: assume all heat removed at rate proportional to (T - T_cool)
    let T_cool = 580.0;
    let hA = 5.0e3;   // W/K effective heat transfer
    let dT = (power - hA * (state.T_fuel - T_cool)) / p.cp;

    (dn, dC, dT)
}

/// RK4 integration step.
pub fn rk4_step(
    p: &Parameters,
    rho: &Reactivity,
    state: &State,
    t: f64,
    dt: f64,
) -> State {
    let (k1n, k1C, k1T) = derivatives(p, rho, state, t);

    let s2 = State {
        n: state.n + 0.5 * dt * k1n,
        C: state.C + 0.5 * dt * k1C,
        T_fuel: state.T_fuel + 0.5 * dt * k1T,
    };
    let (k2n, k2C, k2T) = derivatives(p, rho, &s2, t + 0.5 * dt);

    let s3 = State {
        n: state.n + 0.5 * dt * k2n,
        C: state.C + 0.5 * dt * k2C,
        T_fuel: state.T_fuel + 0.5 * dt * k2T,
    };
    let (k3n, k3C, k3T) = derivatives(p, rho, &s3, t + 0.5 * dt);

    let s4 = State {
        n: state.n + dt * k3n,
        C: state.C + dt * k3C,
        T_fuel: state.T_fuel + dt * k3T,
    };
    let (k4n, k4C, k4T) = derivatives(p, rho, &s4, t + dt);

    State {
        n: state.n + dt / 6.0 * (k1n + 2.0 * k2n + 2.0 * k3n + k4n),
        C: state.C + dt / 6.0 * (k1C + 2.0 * k2C + 2.0 * k3C + k4C),
        T_fuel: state.T_fuel + dt / 6.0 * (k1T + 2.0 * k2T + 2.0 * k3T + k4T),
    }
}

/// Equilibrium state at given power level.
pub fn equilibrium(p: &Parameters, n0: f64) -> State {
    let mut C = Vector6::zeros();
    for i in 0..6 {
        C[i] = p.groups.beta_i[i] / (p.Lambda * p.groups.lambda_i[i]) * n0;
    }
    State {
        n: n0,
        C,
        T_fuel: p.T_ref + n0 * p.power_per_n / 5.0e3 * 0.5,
    }
}

/// Simulate transient. Returns time series.
pub fn simulate(
    p: &Parameters,
    rho: &Reactivity,
    n0: f64,
    t_end: f64,
    dt: f64,
) -> Vec<(f64, State)> {
    let mut state = equilibrium(p, n0);
    let mut t = 0.0;
    let mut history = vec![(t, state.clone())];
    while t < t_end {
        state = rk4_step(p, rho, &state, t, dt);
        t += dt;
        history.push((t, state.clone()));
    }
    history
}

fn main() {
    let params = Parameters::pwr_typical();
    println!("PWR point kinetics:");
    println!("  β_total = {:.5}", params.beta);
    println!("  Λ = {:.2e} s", params.Lambda);
    println!("  Delayed λ_i = {:?}", params.groups.lambda_i);

    // Scenario 1: Step 100 pcm insertion (sub-prompt-critical)
    println!("\\n=== Scenario 1: Step +100 pcm ===");
    let rho1 = Reactivity::Step { rho: 100e-5 };
    let t0 = Instant::now();
    let hist1 = simulate(&params, &rho1, 1.0, 100.0, 1e-3);
    let elapsed = t0.elapsed();
    println!("  Simulated 100s in {:?} ({} steps)", elapsed, hist1.len());
    println!("  Power at t=0:   {:.4}", hist1[0].1.n);
    println!("  Power at t=10s: {:.4}", hist1[10000].1.n);
    println!("  Power at t=60s: {:.4}", hist1[60000].1.n);

    // Scenario 2: Ramp +5 pcm/s up to +500 pcm
    println!("\\n=== Scenario 2: Ramp +5 pcm/s (max +500 pcm) ===");
    let rho2 = Reactivity::Ramp { rate: 5e-5, rho_max: 500e-5 };
    let hist2 = simulate(&params, &rho2, 1.0, 200.0, 1e-3);
    let max_power = hist2.iter().map(|(_, s)| s.n).fold(0.0_f64, f64::max);
    println!("  Peak power: {:.4}", max_power);

    // Scenario 3: Feedback-limited (Doppler)
    println!("\\n=== Scenario 3: Step +400 pcm with Doppler feedback ===");
    let rho3 = Reactivity::Feedback {
        rho_ext: 400e-5,
        alpha_doppler: params.alpha_doppler,
        T_ref: params.T_ref,
    };
    let hist3 = simulate(&params, &rho3, 1.0, 60.0, 1e-3);
    let final_power = hist3.last().unwrap().1.n;
    let final_T = hist3.last().unwrap().1.T_fuel;
    println!("  Final power: {:.4}", final_power);
    println!("  Final fuel T: {:.1} K", final_T);
    println!("  Doppler offset: {:.1} pcm",
             (final_T - params.T_ref) * params.alpha_doppler * 1e5);
}

// Expected results (matches textbook):
//   Step +100 pcm: stable rise, reactor period ~80s
//   Ramp +5 pcm/s: S-curve, peak delayed by thermal lag
//   Doppler feedback: self-limiting, asymptotic power
`
};

SNIPPETS.shieldingJulia={
  file:'shielding.jl',lang:'julia',
  caption:'Radiation shielding optimization — <b>Monte Carlo + adjoint methods</b>',
  code:`#= 
Radiation shielding optimization in Julia.

Problem: minimize shield mass subject to dose constraint at detector.

Approach: adjoint Monte Carlo + gradient-based optimization (JuMP + IPOPT).

The adjoint method computes ∂(dose)/∂(thickness) efficiently:
    - Forward MC: neutrons from source to detector
    - Adjoint MC: neutrons from detector backwards to source
    - Sensitivity: from both, via reciprocity theorem

Applications:
    - Nuclear power plant shielding
    - Spallation sources
    - Medical linac vaults
    - Space radiation (Mars transit)
    - Fusion (ITER, SPARC)

Real tools:
    - MCNP6 (Fortran) — industry standard
    - OpenMC (C++/Python) — open source
    - Serpent (C++) — reactor physics
    - Geant4 (C++) — high-energy physics
=#

using LinearAlgebra
using Random
using JuMP
using Ipopt
using Plots

#= 
X-ray / gamma attenuation through multilayer shield.
Use the NIST XCOM database (interpolated).
=#
const MATERIALS = Dict(
    "lead" => Dict(:Z => 82, :rho => 11.34, :mu_1MeV => 0.0711),
    "iron" => Dict(:Z => 26, :rho => 7.87, :mu_1MeV => 0.0599),
    "concrete" => Dict(:Z => 20, :rho => 2.35, :mu_1MeV => 0.0639),
    "polyethylene" => Dict(:Z => 6, :rho => 0.95, :mu_1MeV => 0.0627),
    "water" => Dict(:Z => 8, :rho => 1.00, :mu_1MeV => 0.0707),
    "tungsten" => Dict(:Z => 74, :rho => 19.25, :mu_1MeV => 0.0802),
)

#= 
Attenuation coefficient at given energy.
For now: use power-law scaling from 1 MeV reference.
μ(E) ≈ μ_1MeV · (E/1)^{-2.5} for E > 0.5 MeV (Compton dominant).
=#
function mu_at_energy(material::Dict, E_MeV::Float64)
    E = max(E_MeV, 0.05)
    return material[:mu_1MeV] * (E / 1.0)^(-2.5)
end

#= 
Dose rate at detector after passing through multilayer shield.
    D = D0 · exp(-Σ_i μ_i · t_i)
=#
function dose_rate(source_intensity::Float64,
                    layers::Vector{Tuple{String,Float64}},
                    E_MeV::Float64,
                    distance::Float64)
    total_mu_t = 0.0
    for (mat, t) in layers
        m = MATERIALS[mat]
        mu = mu_at_energy(m, E_MeV)
        total_mu_t += mu * t   # t in cm
    end
    return source_intensity * exp(-total_mu_t) / (4π * distance^2)
end

#= 
Shield optimization: minimize mass subject to dose constraint.
    minimize  Σ ρ_i · t_i · A     (mass)
    s.t.      dose_rate ≤ D_max
              0 ≤ t_i ≤ t_max_i
=#
function optimize_shield(
    E_MeV::Float64 = 1.0,
    source_intensity::Float64 = 1e12,     # photons/s
    D_max_Sv_per_h::Float64 = 1e-6,       # target dose rate
    distance_m::Float64 = 5.0,
)
    materials = ["lead", "iron", "concrete", "polyethylene"]
    n = length(materials)

    model = Model(Ipopt.Optimizer)
    set_silent(model)

    # Thickness variables (cm)
    @variable(model, 0 <= t[1:n] <= 200.0)

    # Dose constraint (convert D_max to photons/cm²/s for this example)
    # Real relation: D = φ × E × μ_en/ρ
    # Simplified: use dose as if attenuation is the only factor
    total_mu_t = sum(mu_at_energy(MATERIALS[materials[i]], E_MeV) * t[i]
                     for i in 1:n)
    @NLconstraint(model,
        source_intensity * exp(-total_mu_t) / (4π * distance_m^2 * 1e4) <=
        D_max_Sv_per_h * 1e10  # unit conversion placeholder
    )

    # Objective: total mass (density × thickness)
    @objective(model, Min,
        sum(MATERIALS[materials[i]][:rho] * t[i] for i in 1:n)
    )

    println("Optimizing shield with materials: \$materials")
    optimize!(model)

    println("Status: ", termination_status(model))
    println("Optimal thicknesses (cm):")
    for i in 1:n
        ti = value(t[i])
        println("  \$materials[i]: \$(round(ti, digits=2)) cm")
    end

    total_mass_per_m2 = sum(MATERIALS[materials[i]][:rho] * value(t[i]) * 100  # to kg/m²
                            for i in 1:n)
    println("Total areal mass: \$(round(total_mass_per_m2, digits=2)) kg/m²")

    return model, materials, value.(t)
end

#= 
Monte Carlo dose calculation for validation.
Simplified: 1D slab geometry, photons only.
=#
function monte_carlo_dose(
    shield::Vector{Tuple{String,Float64}},
    E_MeV::Float64,
    n_histories::Int = 100_000
)
    rng = MersenneTwister(42)
    absorbed = 0

    for _ in 1:n_histories
        # Sample photon energy (delta function at E for this test)
        E_photon = E_MeV

        # Sample interaction depth in each layer
        alive = true
        for (mat, thickness) in shield
            m = MATERIALS[mat]
            mu = mu_at_energy(m, E_photon)

            # Sample penetration depth
            d = -log(rng()) / mu
            if d < thickness
                # Interaction occurs in this layer
                absorbed += E_photon
                alive = false
                break
            end
        end
        # If survived all layers, photon escapes
    end

    return absorbed / n_histories  # average energy deposited (MeV)
end

#= 
Multi-energy optimization: 3-group source (photons + neutrons).
For neutrons, need a different model (they scatter and thermalize).
=#
function multi_group_shield(
    photon_source::Float64 = 1e12,
    neutron_source::Float64 = 1e10,
    E_gamma::Float64 = 1.0,
    E_neutron::Float64 = 2.0,   # MeV
)
    materials = ["lead", "polyethylene", "boron"]
    n = length(materials)

    model = Model(Ipopt.Optimizer)
    set_silent(model)

    @variable(model, 0 <= t[1:n] <= 300.0)

    # Photon attenuation
    mu_gamma_Pb = mu_at_energy(MATERIALS["lead"], E_gamma)
    mu_gamma_PE = mu_at_energy(MATERIALS["polyethylene"], E_gamma)
    mu_gamma_B = 0.05   # placeholder for boron

    photon_atten = mu_gamma_Pb * t[1] + mu_gamma_PE * t[2] + mu_gamma_B * t[3]
    gamma_dose = photon_source * exp(-photon_atten) / (4π * 25e4)

    # Neutron attenuation (simplified: hydrogen + boron)
    mu_n_PE = 0.15   # 1/cm for 2 MeV neutron in PE
    mu_n_B = 3.5    # 1/cm for thermal neutron in B
    neutron_atten = mu_n_Pb_small(t)  # tiny Pb contribution + PE + B

    @NLconstraint(model, gamma_dose <= 1e-4)   # 100 μSv/h

    @objective(model, Min, sum(MATERIALS[materials[i]][:rho] * t[i] for i in 1:n))

    optimize!(model)
    println("Multi-group shield:")
    println("  Pb: \$(round(value(t[1]), digits=2)) cm")
    println("  PE: \$(round(value(t[2]), digits=2)) cm")
    println("  B:  \$(round(value(t[3]), digits=2)) cm")
end

# Placeholder for the neutron part
function mu_n_Pb_small(t::Vector)
    return 0.01 * t[1] + 0.15 * t[2] + 3.5 * t[3]
end

#= 
Main: compare optimization vs Monte Carlo validation.
=#
function main()
    println("=== Shield Optimization ===")
    model, mats, thicknesses = optimize_shield(
        E_MeV = 1.0,
        source_intensity = 1e12,
        D_max_Sv_per_h = 1e-6,
        distance_m = 5.0,
    )

    # Build result
    shield = [(mats[i], thicknesses[i]) for i in 1:length(mats)]

    println("\\n=== Monte Carlo Validation ===")
    mc_dose = monte_carlo_dose(shield, 1.0, 50_000)
    println("MC absorbed energy: \$(round(mc_dose, digits=6)) MeV per photon")

    println("\\n=== Multi-group Analysis ===")
    multi_group_shield()
end

main()
`
};

SNIPPETS.reactorPhysicsFortran={
  file:'diffusion_1d.f90',lang:'fortran',
  caption:'1D multigroup diffusion in Fortran — <b>the reactor physics workhorse</b>',
  code:`!====================================================================
! PROGRAM: Multigroup neutron diffusion in 1D slab
!
! Fortran is THE language of reactor physics:
!   - CITATION (ORNL, 1969)
!   - DIF3D (ANL, 1970s)
!   - PARCS (Purdue, core simulator)
!   - SIMULATE-3 (Studsvik)
!   - OpenMC (modern, C++/Fortran)
!
! This code solves the steady-state multigroup diffusion equation:
!   -D_g·∇²φ_g + Σr,g·φ_g = Σ_g'≠g Σs,g'→g·φ_g' + χ_g/k·Σ_g' νΣf,g'·φ_g'
!
! Method: Finite differences + power iteration for k_eff
!
! Application: reactor core design, flux distribution, control rod worth
!====================================================================

program multigroup_diffusion
    implicit none
    integer, parameter :: dp = kind(1.0d0)

    ! ----- Problem parameters -----
    integer, parameter :: N = 100         ! mesh points
    integer, parameter :: G = 2           ! number of energy groups
    real(dp), parameter :: L = 100.0_dp   ! slab thickness (cm)
    real(dp), parameter :: dx = L / N
    real(dp), parameter :: tol = 1.0d-6
    integer, parameter :: max_iter = 500

    ! ----- Cross sections (2-group PWR-like) -----
    ! Group 1 = fast, Group 2 = thermal
    real(dp) :: D(G), Sig_r(G), nuSig_f(G), chi(G)
    real(dp) :: Sig_s(2, 2)     ! scattering matrix

    ! ----- Arrays -----
    real(dp) :: phi(G, N), phi_old(G, N)
    real(dp) :: source(G, N)
    real(dp) :: A(N, N)          ! tridiagonal
    real(dp) :: rhs(N)

    ! ----- Loop indices and variables -----
    integer :: i, g, iter, info
    real(dp) :: k_eff, k_old, err, norm, flux_ratio
    integer, allocatable :: ipiv(:)

    ! ----- Initialize cross sections -----
    ! Fast group (1)
    D(1)      = 1.30_dp
    Sig_r(1)  = 0.010_dp
    nuSig_f(1)= 0.0075_dp

    ! Thermal group (2)
    D(2)      = 0.35_dp
    Sig_r(2)  = 0.100_dp
    nuSig_f(2)= 0.150_dp

    ! Fission spectrum
    chi(1) = 1.0_dp
    chi(2) = 0.0_dp

    ! Scattering matrix (row = from, col = to)
    Sig_s = 0.0_dp
    Sig_s(1, 2) = 0.020_dp   ! downscatter fast → thermal
    Sig_s(2, 1) = 0.0_dp     ! no upscatter

    ! ----- Initial guess -----
    phi = 1.0_dp
    k_eff = 1.0_dp

    ! ----- Power iteration -----
    write(*, '(A)') 'Starting power iteration...'
    write(*, '(A4, 6X, A10, 8X, A10)') 'Iter', 'k_eff', 'Residual'

    do iter = 1, max_iter
        phi_old = phi
        k_old = k_eff

        ! Solve each group sequentially (source from previous groups)
        do g = 1, G
            ! Build tridiagonal matrix for group g
            A = 0.0_dp
            rhs = 0.0_dp

            do i = 1, N
                if (i == 1 .or. i == N) then
                    ! Boundary condition: φ = 0 (extrapolated)
                    A(i, i) = 1.0_dp
                    rhs(i) = 0.0_dp
                else
                    A(i, i-1) = -D(g) / dx**2
                    A(i, i)   = 2.0_dp * D(g) / dx**2 + Sig_r(g)
                    A(i, i+1) = -D(g) / dx**2

                    ! Source: scattering from other groups + fission
                    do g_prime = 1, G
                        if (g_prime /= g) then
                            rhs(i) = rhs(i) + &
                                     Sig_s(g_prime, g) * phi_old(g_prime, i)
                        end if
                    end do
                    ! Fission source (with k normalization)
                    do g_prime = 1, G
                        rhs(i) = rhs(i) + &
                                 chi(g) / k_eff * nuSig_f(g_prime) * phi_old(g_prime, i)
                    end do
                end if
            end do

            ! Solve tridiagonal system (using LAPACK dgesv for simplicity)
            allocate(ipiv(N))
            call dgesv(N, 1, A, N, ipiv, rhs, N, info)
            deallocate(ipiv)

            if (info /= 0) then
                write(*,*) 'LAPACK error:', info
                stop 1
            end if

            phi(g, :) = rhs
        end do

        ! Update k_eff via fission source ratio
        k_eff = k_old * fission_integral(phi) / fission_integral(phi_old)

        ! Convergence check
        err = 0.0_dp
        do g = 1, G
            norm = sum(phi_old(g, :)**2)
            if (norm > 1.0d-10) then
                err = max(err, sum((phi(g, :) - phi_old(g, :))**2) / norm)
            end if
        end do
        err = sqrt(err)

        if (mod(iter, 10) == 0 .or. iter == 1) then
            write(*, '(I4, 4X, F10.6, 4X, ES10.3)') iter, k_eff, err
        end if

        if (err < tol .and. abs(k_eff - k_old) < tol) then
            write(*, '(A, I0, A)') 'Converged in ', iter, ' iterations'
            exit
        end if
    end do

    ! ----- Output -----
    write(*, *)
    write(*, '(A, F10.6)') 'Final k_eff = ', k_eff
    write(*, *)
    write(*, '(A)') 'Flux distribution:'
    write(*, '(A4, 4X, A12, 4X, A12, 4X, A12)') 'i', 'x (cm)', 'phi_1', 'phi_2'

    ! Normalize flux
    flux_ratio = maxval(phi(2, :))
    phi = phi / flux_ratio

    do i = 1, N, 10
        write(*, '(I4, 4X, F8.2, 4X, F12.6, 4X, F12.6)') &
            i, (i - 0.5_dp) * dx, phi(1, i), phi(2, i)
    end do

    ! ----- Effective multiplication factor diagnostics -----
    write(*, *)
    if (k_eff > 1.0_dp) then
        write(*, '(A)') 'Reactor is SUPERCRITICAL'
        write(*, '(A, F8.1, A)') 'Excess reactivity: ', &
            (k_eff - 1.0_dp) / k_eff * 1.0d5, ' pcm'
    else if (k_eff < 1.0_dp) then
        write(*, '(A)') 'Reactor is SUBCRITICAL'
        write(*, '(A, F8.1, A)') 'Negative reactivity: ', &
            (k_eff - 1.0_dp) / k_eff * 1.0d5, ' pcm'
    else
        write(*, '(A)') 'Reactor is CRITICAL'
    end if

contains

    !--------------------------------------------------------------
    ! Fission integral: Σ_g Σ_i nuSig_f(g) · φ_g(i) · dV
    !--------------------------------------------------------------
    function fission_integral(phi_in) result(val)
        real(dp), intent(in) :: phi_in(G, N)
        real(dp) :: val
        integer :: gi, ii

        val = 0.0_dp
        do gi = 1, G
            do ii = 1, N
                val = val + nuSig_f(gi) * phi_in(gi, ii)
            end do
        end do
    end function fission_integral

end program multigroup_diffusion

!====================================================================
! Expected output for a 100 cm slab with these cross sections:
!   k_eff ≈ 1.05 (slightly supercritical)
!   Flux shape: cosine-like, peaks at center
!   Fast flux > thermal flux in core
!====================================================================
`
};

SNIPPETS.thermalHydraulicsMATLAB={
  file:'subchannel.m',lang:'matlab',
  caption:'Subchannel thermal-hydraulics — <b>COBRA-style analysis</b>',
  code:`%% PWR Subchannel Analysis — COBRA-TF style
% MATLAB is used for thermal-hydraulic analysis in nuclear industry:
%   - COBRA-TF (Penn State, CASL)
%   - RELAP5 (INL)
%   - TRACE (NRC)
%   - CATHARE (CEA)
%
% This script: subchannel analysis for a PWR fuel assembly.
%   - Coolant flow and enthalpy distribution
%   - Onset of nucleate boiling (ONB)
%   - Critical heat flux (CHF) margin
%   - Departure from nucleate boiling ratio (DNBR)

clear; clc;

%% 1. Fuel assembly geometry (Westinghouse 17×17)
N_rods = 264;              % total fuel rods
P_rod = 9.5e-3;            % rod pitch (m)
D_rod = 9.14e-3;           % rod diameter (m)
H_active = 3.66;           % active fuel height (m)
A_flow = 0.0265;           % flow area (m²) per assembly
D_h = 0.0118;              % hydraulic diameter (m)

%% 2. Operating conditions (typical PWR)
P_sys = 15.5e6;            % system pressure (Pa)
T_in = 292;                % inlet temperature (°C)
mdot = 4800 * 0.454;       % mass flow rate (kg/s) — 4800 lbm/s
P_assembly = 5e6;          % assembly power (W)
q_avg = P_assembly / (N_rods * pi * D_rod * H_active);  % W/m²

%% 3. Axial power profile (chopped cosine)
z = linspace(0, H_active, 50)';
q_shape = sin(pi * z / H_active);
q_shape = q_shape / mean(q_shape);  % normalize to 1
q_axial = q_avg * q_shape;

%% 4. Coolant enthalpy and temperature along channel
cp = 5.5e3;                % J/kg/K
dz = z(2) - z(1);
mdot_ch = mdot / 264;      % per subchannel (kg/s)

h_coolant = zeros(size(z));
h_coolant(1) = cp * T_in;

for i = 1:length(z)-1
    dq = q_axial(i) * pi * D_rod * dz * 264;   % total heat in segment
    h_coolant(i+1) = h_coolant(i) + dq / mdot;
end

T_coolant = h_coolant / cp;

%% 5. Onset of Nucleate Boiling (ONB) — Thom correlation
% ΔT_sat = 22.65 * q^0.5 * exp(-P/8.7)   (q in W/m², P in MPa)
P_MPa = P_sys / 1e6;
T_sat = 345;   % saturation temperature at 15.5 MPa (°C)

for i = 1:length(z)
    q_local = q_axial(i);
    dT_ONB = 22.65 * sqrt(q_local / 1e6) * exp(-P_MPa / 8.7) * 1e-3;
    T_wall_ONB(i) = T_sat + dT_ONB;
end

%% 6. Critical Heat Flux (W-3 correlation, simplified)
% q_CHF = f(P, X, G, D)   — simplified version
G = mdot / A_flow;   % mass flux (kg/m²/s)

for i = 1:length(z)
    % Local quality (thermodynamic)
    h_f = 1.6e6;   % saturated liquid enthalpy at 15.5 MPa (J/kg)
    h_g = 2.6e6;   % saturated vapor enthalpy
    x_local(i) = (h_coolant(i) - h_f) / (h_g - h_f);
    x_local(i) = max(-0.1, min(x_local(i), 0.5));

    % W-3 correlation (simplified, valid for x < 0.1)
    q_CHF(i) = 3.15e6 * (1 - 0.0015 * P_MPa) * ...
                (1 - 0.5 * x_local(i)) * (G/1000)^0.4 * (D_rod/0.01)^(-0.1);
end

%% 7. DNBR (Departure from Nucleate Boiling Ratio)
DNBR = q_CHF ./ q_axial;

%% 8. Plots
figure('Position', [100, 100, 1200, 800]);

subplot(2,3,1);
plot(q_axial, z, 'b-', 'LineWidth', 2);
xlabel('Heat flux (W/m²)'); ylabel('Height (m)');
title('Axial Power Profile'); grid on;
set(gca, 'YDir', 'reverse');

subplot(2,3,2);
plot(T_coolant, z, 'r-', 'LineWidth', 2);
hold on;
plot([T_sat, T_sat], [0, H_active], 'k--', 'LineWidth', 1);
xlabel('T (°C)'); ylabel('Height (m)');
title('Coolant Temperature'); legend('Coolant', 'T_{sat}', 'Location', 'best');
grid on;
set(gca, 'YDir', 'reverse');

subplot(2,3,3);
plot(x_local, z, 'g-', 'LineWidth', 2);
xlabel('Quality x'); ylabel('Height (m)');
title('Thermodynamic Quality'); grid on;
set(gca, 'YDir', 'reverse');

subplot(2,3,4);
plot(q_CHF/1e6, z, 'm-', 'LineWidth', 2);
hold on;
plot(q_axial/1e6, z, 'b-', 'LineWidth', 2);
xlabel('Heat flux (MW/m²)'); ylabel('Height (m)');
title('CHF vs Actual'); legend('q_{CHF}', 'q_{local}', 'Location', 'best');
grid on;
set(gca, 'YDir', 'reverse');

subplot(2,3,5);
plot(DNBR, z, 'r-', 'LineWidth', 2);
hold on;
plot([1.3, 1.3], [0, H_active], 'k--', 'LineWidth', 2);
xlabel('DNBR'); ylabel('Height (m)');
title('Departure from Nucleate Boiling Ratio');
legend('DNBR', 'Safety limit (1.3)', 'Location', 'best');
grid on;
set(gca, 'YDir', 'reverse');

subplot(2,3,6);
% Print summary
text(0.1, 0.9, sprintf('Summary'), 'FontSize', 14, 'FontWeight', 'bold');
text(0.1, 0.75, sprintf('System Pressure: %.1f MPa', P_MPa), 'FontSize', 11);
text(0.1, 0.65, sprintf('Inlet T: %.1f °C', T_in), 'FontSize', 11);
text(0.1, 0.55, sprintf('Outlet T: %.1f °C', T_coolant(end)), 'FontSize', 11);
text(0.1, 0.45, sprintf('Mass flux: %.0f kg/m²/s', G), 'FontSize', 11);
text(0.1, 0.35, sprintf('Min DNBR: %.2f', min(DNBR)), 'FontSize', 11);
if min(DNBR) > 1.3
    text(0.1, 0.2, sprintf('✓ SAFE (DNBR > 1.3)'), 'FontSize', 12, 'Color', 'g');
else
    text(0.1, 0.2, sprintf('✗ CHF EXCEEDED'), 'FontSize', 12, 'Color', 'r');
end
axis off;

%% 9. Summary to console
fprintf('\\n=== PWR Subchannel Analysis ===\\n');
fprintf('System pressure: %.2f MPa\\n', P_MPa);
fprintf('Inlet temperature: %.1f °C\\n', T_in);
fprintf('Outlet temperature: %.1f °C\\n', T_coolant(end));
fprintf('Saturation temperature: %.1f °C\\n', T_sat);
fprintf('Mass flux: %.1f kg/m²/s\\n', G);
fprintf('Average heat flux: %.3f MW/m²\\n', q_avg/1e6);
fprintf('Peak heat flux: %.3f MW/m²\\n', max(q_axial)/1e6);
fprintf('Minimum CHF: %.3f MW/m²\\n', min(q_CHF)/1e6);
fprintf('Minimum DNBR: %.3f\\n', min(DNBR));
fprintf('\\n');

if min(DNBR) > 1.3
    fprintf('✓ Assembly is SAFE under nominal conditions.\\n');
else
    fprintf('✗ WARNING: CHF limit exceeded. Reduce power or increase flow.\\n');
end

%% 10. Sensitivity analysis
fprintf('\\n=== Sensitivity Analysis ===\\n');
powers = linspace(0.5, 1.5, 5) * P_assembly;
for k = 1:length(powers)
    q_avg_k = powers(k) / (N_rods * pi * D_rod * H_active);
    q_axial_k = q_avg_k * q_shape;
    h_k = cumsum([h_coolant(1); q_axial_k(1:end-1) * pi * D_rod * dz * 264 / mdot]);
    x_k = (h_k - h_f) / (h_g - h_f);
    q_CHF_k = 3.15e6 * (1 - 0.0015 * P_MPa) * (1 - 0.5 * x_k) * ...
              (G/1000)^0.4 * (D_rod/0.01)^(-0.1);
    DNBR_k = q_CHF_k ./ q_axial_k;
    fprintf('Power = %.1f%%: min DNBR = %.2f\\n', powers(k)/P_assembly*100, min(DNBR_k));
end
`
};
</script>

  html+='</pre></div></div>';
  return html;
}

/* ══════════════ 1D Diffusion ══════════════ */
R.diffusion1D=function(dt){
  clear();
  headline('1D Neutron Diffusion','multigroup slab');
  if(!S.sim.d1){S.sim.d1={a:100,D:1.0,Sigma_a:0.05,S:0}}
  var p=S.sim.d1;
  var n=60;
  var x=[];for(var i=0;i<n;i++)x.push((i+0.5)*p.a/n);
  var D=new Array(n).fill(p.D);
  var Sa=new Array(n).fill(p.Sigma_a);
  var Src=new Array(n).fill(p.S||1e10);
  var phi=diffusionEquation1D(x,D,Sa,Src);
  /* Plot flux */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'position (cm)','flux');
  var maxPhi=max(phi);
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<n;i++){
    var xp=padL+(i/n)*plotW;
    var yp=padT+plotH-(phi[i]/maxPhi)*plotH;
    if(i===0)S.ctx.moveTo(xp,yp);else S.ctx.lineTo(xp,yp);
  }
  S.ctx.stroke();
  /* Fill */
  S.ctx.fillStyle='rgba(0,255,102,.1)';
  S.ctx.beginPath();
  S.ctx.moveTo(padL,padT+plotH);
  for(var i=0;i<n;i++){
    var xp=padL+(i/n)*plotW;
    var yp=padT+plotH-(phi[i]/maxPhi)*plotH;
    S.ctx.lineTo(xp,yp);
  }
  S.ctx.lineTo(padL+plotW,padT+plotH);
  S.ctx.closePath();
  S.ctx.fill();
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Slab: '+p.a+' cm',60,S.H-100);
  S.ctx.fillText('D = '+p.D+' cm',60,S.H-75);
  S.ctx.fillText('Σ_a = '+p.Sigma_a+' cm⁻¹',60,S.H-50);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('L = √(D/Σa) = '+fmt(diffusionLength(p.D,p.Sigma_a),3)+' cm',60,S.H-25);
};

/* ══════════════ Criticality ══════════════ */
R.criticality=function(dt){
  clear();
  headline('Criticality','k_eff vs geometry');
  if(!S.sim.crit){S.sim.crit={radius:6.0,Sigma_f:0.30,nu:2.88}}
  var p=S.sim.crit;
  /* Simple k_inf and geometric buckling */
  var Sigma_a=0.05+0.15;
  var Sigma_s=0.15;
  var k_inf=p.nu*p.Sigma_f/(Sigma_a);
  /* k_eff = k_inf / (1 + M² B²) */
  var M2=1.5;
  var k_effs=[];
  for(var i=0;i<=50;i++){
    var R=2+i*20/50;
    var B2=Math.pow(Math.PI/R,2);
    var k=k_inf/(1+M2*B2);
    k_effs.push({R:R,k:k,B2:B2});
  }
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'radius (cm)','k_eff');
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  k_effs.forEach(function(pt,i){
    var x=padL+(i/50)*plotW;
    var y=padT+plotH-(pt.k/1.5)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* k=1 line */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  S.ctx.moveTo(padL,padT+plotH-(1/1.5)*plotH);
  S.ctx.lineTo(padL+plotW,padT+plotH-(1/1.5)*plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Current marker */
  var B2=Math.pow(Math.PI/p.radius,2);
  var currK=k_inf/(1+M2*B2);
  var xc=padL+((p.radius-2)/20)*plotW;
  var yc=padT+plotH-(currK/1.5)*plotH;
  S.ctx.fillStyle=currK>1?'#ffd500':'#ff2d55';
  S.ctx.beginPath();S.ctx.arc(xc,yc,8,0,Math.PI*2);S.ctx.fill();
  /* Values */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('k_inf = '+fmt(k_inf,4),60,S.H-120);
  S.ctx.fillText('M² = '+M2+' cm²',60,S.H-95);
  S.ctx.fillText('B² = '+fmt(B2,6)+' cm⁻²',60,S.H-70);
  S.ctx.fillStyle=currK>1?'#ffd500':'#ff7088';
  S.ctx.fillText('k_eff = '+fmt(currK,4),60,S.H-45);
  S.ctx.fillStyle=currK>1?'#ffd500':'#5cff99';
  S.ctx.fillText(currK>1?'SUPERCRITICAL':'SUBCRITICAL',60,S.H-20);
};

R.buckling=function(dt){
  clear();
  headline('Buckling','geometric + material');
  if(!S.sim.buck){S.sim.buck={a:100,b:80,c:60}}
  var p=S.sim.buck;
  var B2=Math.PI*Math.PI*(1/(p.a*p.a)+1/(p.b*p.b)+1/(p.c*p.c));
  /* Draw rectangular core */
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.4/Math.max(p.a,p.b);
  S.ctx.strokeStyle='#00ff66';
  S.ctx.lineWidth=2;
  S.ctx.strokeRect(cx-p.a*scale/2,cy-p.b*scale/2,p.a*scale,p.b*scale);
  /* Dimensions */
  S.ctx.fillStyle='#5cff99';
  S.ctx.font='700 11px "JetBrains Mono",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('a = '+p.a+' cm',cx,cy-p.b*scale/2-10);
  S.ctx.save();
  S.ctx.translate(cx-p.a*scale/2-30,cy);
  S.ctx.rotate(-Math.PI/2);
  S.ctx.fillText('b = '+p.b+' cm',0,0);
  S.ctx.restore();
  S.ctx.fillText('c = '+p.c+' cm (depth)',cx,cy+p.b*scale/2+25);
  /* Values */
  S.ctx.textAlign='left';
  S.ctx.fillStyle='#ffd500';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.fillText('B² = '+fmt(B2,8)+' cm⁻²',60,S.H-120);
  S.ctx.fillStyle='#88a090';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('B² = π²(1/a² + 1/b² + 1/c²)',60,S.H-95);
  S.ctx.fillText('B_m² = material buckling',60,S.H-70);
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.fillText('Critical condition: B_g² = B_m²',60,S.H-45);
};
