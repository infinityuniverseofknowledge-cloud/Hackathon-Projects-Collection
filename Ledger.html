<!DOCTYPE html>
<html lang="en" data-theme="ledger">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0808">
<title>LEDGER — Blockchain Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#0a0808;--bg2:#0e0c0c;--bg3:#181414;--bg4:#221c1c;
  --panel:#100e0e;--panel2:#181414;--panel3:#221e1e;--panel4:#2e2828;
  --bd:#282020;--bd2:#403030;--bd3:#584040;
  --tx:#f4e8e8;--tx2:#c0a8a8;--tx3:#806868;--mu:#504040;
  --c1:#ffa040;--c1h:#ffc880;--c1l:#c06000;
  --c2:#c06040;--c2h:#e09070;--c2l:#a04020;
  --c3:#ffd040;--c3h:#ffe890;--c3l:#c09000;
  --c4:#40d0ff;--c4h:#80e0ff;--c4l:#20a0d0;
  --c5:#40e888;--c5h:#80ffc0;--c5l:#20a860;
  --c6:#b060ff;--c6h:#d0a0ff;--c6l:#7030c0;
  --c7:#ff4080;--c7h:#ff90b0;--c7l:#c02060;
  --c8:#40e0d0;--c8h:#80f0e8;--c8l:#20a0a0;
  --ok:#40e888;--warn:#ffd040;--err:#ff4080;--info:#40d0ff;
  --btc:#f7931a;--eth:#627eea;--usd:#40e888;
  --g1:linear-gradient(135deg,#ffa040,#ffd040);
  --g2:linear-gradient(135deg,#c06040,#ffa040);
  --g3:linear-gradient(135deg,#40e888,#40d0ff);
  --gHolo:linear-gradient(120deg,#ffa040,#ffd040,#ff4080,#b060ff,#40d0ff,#ffa040);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --sh2:0 16px 48px rgba(0,0,0,.9);
  --mono:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="blue"]{--bg:#08101a;--bg2:#0c1828;--bg3:#102038;--panel:#0c1828;--panel2:#102038;
  --bd:#204060;--bd2:#2c5078;--tx:#d0e8ff;--tx2:#90b8d8;--tx3:#6088a8;
  --c1:#40c8ff;--c2:#4080ff;--c3:#80e0ff;--c4:#4080ff;
  --g1:linear-gradient(135deg,#40c8ff,#4080ff)}
[data-theme="matrix"]{--bg:#000a00;--bg2:#001400;--bg3:#001e00;--panel:#001800;--panel2:#002800;
  --bd:#006400;--bd2:#009000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#00ffd0;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}
[data-theme="paper"]{--bg:#f2efe8;--bg2:#e8e4d8;--bg3:#dcd8c8;--panel:#fff;--panel2:#f8f5ec;--panel3:#ece8d8;--panel4:#dcd8c4;
  --bd:#c8c4b0;--bd2:#a8a498;--tx:#0e1210;--tx2:#3a443c;--tx3:#687870;
  --c1:#c06800;--c2:#a04828;--c3:#b08000;--c4:#0060c0;
  --g1:linear-gradient(135deg,#c06800,#b08000)}
[data-theme="purple"]{--bg:#100818;--bg2:#180c28;--bg3:#20143c;--panel:#180c28;--panel2:#20143c;
  --bd:#402860;--bd2:#583890;--tx:#e8d8ff;--tx2:#b8a0d8;--tx3:#8070a8;
  --c1:#c060ff;--c2:#a040e0;--c3:#e0a0ff;--c4:#8060ff;
  --g1:linear-gradient(135deg,#c060ff,#8060ff)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#0a0808;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-chain{position:relative;width:220px;height:70px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.boot-block{width:50px;height:50px;border:2px solid #ffa040;border-radius:6px;position:relative;animation:blockPulse 2s ease-in-out infinite}
.boot-block::before{content:'';position:absolute;inset:6px;border:1px solid rgba(255,160,64,.4);border-radius:3px}
.boot-block::after{content:'⬢';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffa040;font-size:1.2rem}
.boot-block:nth-child(2){animation-delay:.3s;border-color:#ffd040}
.boot-block:nth-child(2)::after{color:#ffd040}
.boot-block:nth-child(3){animation-delay:.6s;border-color:#ff4080}
.boot-block:nth-child(3)::after{color:#ff4080}
.boot-link{width:20px;height:2px;background:rgba(255,160,64,.4);position:relative}
.boot-link::after{content:'';position:absolute;top:-3px;left:0;right:0;height:8px;background:linear-gradient(90deg,transparent,rgba(255,208,64,.8),transparent);animation:linkGlow 1.5s linear infinite}
@keyframes blockPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1;box-shadow:0 0 20px currentColor}}
@keyframes linkGlow{0%{transform:translateX(-20px);opacity:0}50%{opacity:1}100%{transform:translateX(20px);opacity:0}}
.boot-logo{font-family:var(--disp);font-size:3rem;font-weight:900;letter-spacing:12px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.68rem;color:#ffa040;letter-spacing:8px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#181414;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ffa040}
.boot-pct{font-size:.68rem;color:#ffa040;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#806868;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40e888}.boot-log .warn{color:#ffd040}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.95rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0808;box-shadow:0 0 14px rgba(255,160,64,.35)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#0a0808;border-color:transparent}
.tb-btn.mining{background:var(--err);color:#fff;animation:pulseBtn .8s infinite}
@keyframes pulseBtn{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
.tb-stat{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;display:flex;gap:10px;max-width:340px;overflow:hidden}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:270px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#contentArea{flex:1;overflow:auto;padding:0;position:relative;background:var(--bg2)}

#rightPanel{width:300px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

/* ============ STATUS BAR ============ */
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#0a0808;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,160,64,.15)}
.ctrl textarea{resize:vertical;min-height:70px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#0a0808;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,160,64,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:rgba(255,64,128,.1)}
.btn.success{color:var(--c5);border-color:var(--c5)}
.btn.success:hover{background:rgba(64,232,136,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle{position:relative;width:36px;height:20px;background:var(--panel4);border-radius:var(--rf);cursor:pointer;transition:var(--t2);flex-shrink:0;display:inline-block}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--t2)}
.toggle.on::after{left:18px}

/* ============ LISTS ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:6px 9px;border-radius:var(--rxs);cursor:pointer;font-size:.66rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(255,160,64,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:7px}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.58rem;color:var(--tx3)}

/* ============ CHAIN VIEW ============ */
.chain-canvas{width:100%;height:100%;background:var(--bg);display:block}
.block-card{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--r);padding:10px;cursor:pointer;transition:var(--t1);font-family:var(--mono);font-size:.6rem;position:relative}
.block-card:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.block-card.current{border-color:var(--c5);background:rgba(64,232,136,.08)}
.block-card .bc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.block-card .bc-height{color:var(--c1);font-weight:700;font-size:.75rem}
.block-card .bc-hash{color:var(--tx3);font-size:.55rem;word-break:break-all;line-height:1.3}
.block-card .bc-row{display:flex;justify-content:space-between;padding:2px 0}
.block-card .bc-k{color:var(--tx3)}
.block-card .bc-v{color:var(--c3);font-weight:600}

/* ============ MERKLE TREE ============ */
.merkle-view{padding:14px;font-family:var(--mono);font-size:.62rem}
.merkle-level{display:flex;justify-content:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.merkle-node{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:4px 8px;font-size:.55rem;color:var(--c4);word-break:break-all;max-width:100px;text-align:center;transition:var(--t1)}
.merkle-node:hover{border-color:var(--c4);background:rgba(64,208,255,.1)}
.merkle-node.leaf{color:var(--c5);border-color:var(--c5)}
.merkle-node.root{color:var(--c1);border-color:var(--c1);font-weight:700;background:rgba(255,160,64,.1)}

/* ============ MINING ============ */
.mine-canvas-wrap{position:relative;background:#000;border-radius:var(--rs);overflow:hidden;height:180px;margin-bottom:12px}
.mine-canvas{width:100%;height:100%;display:block}
.mine-info{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:.62rem;color:var(--c5);text-shadow:0 0 8px var(--c5);line-height:1.5}
.mine-nonce{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:.7rem;color:var(--c1);font-weight:700}
.hash-stream{background:#000;border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;font-family:var(--mono);font-size:.58rem;line-height:1.4;max-height:200px;overflow-y:auto;color:var(--tx3)}
.hash-stream .hs-line{padding:1px 0;word-break:break-all}
.hash-stream .hs-line.valid{color:var(--c5);font-weight:700}
.hash-stream .hs-line.winning{color:var(--c1);background:rgba(255,160,64,.1);padding:2px 4px;border-radius:2px;font-weight:700}

/* ============ TABLES ============ */
.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:6px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0}
.data-table td{padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table tbody tr{cursor:pointer;transition:var(--t1)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.hi{color:var(--c1);font-weight:600}
.data-table td.hi2{color:var(--c5);font-weight:600}
.data-table td.hi3{color:var(--c3);font-weight:600}
.data-table td.mono{font-size:.58rem;word-break:break-all}

/* ============ HELPERS ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.62rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}.text-c5{color:var(--c5)}.text-c7{color:var(--c7)}
.kv{font-family:var(--mono);font-size:.65rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.62rem}
.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:10px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:1.05rem;font-weight:800;color:var(--c1);line-height:1.1;word-break:break-all}
.stat .sl{font-size:.52rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:3px}
.stat.c2 .sv{color:var(--c2)}
.stat.c3 .sv{color:var(--c3)}
.stat.c4 .sv{color:var(--c4)}
.stat.c5 .sv{color:var(--c5)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

"use strict";

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function shortHash(h,len){len=len||10;return h?h.substr(0,len)+'…'+h.substr(-4):'';}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   SHA-256 — Full implementation from FIPS 180-4
   ================================================================ */
var SHA256_K=[
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function rotr(x,n){return ((x>>>n)|(x<<(32-n)))>>>0;}
function rotl(x,n){return ((x<<n)|(x>>>(32-n)))>>>0;}

function sha256(message){
  /* Convert input to byte array (UTF-8) */
  var bytes=[];
  if(typeof message==='string'){
    for(var i=0;i<message.length;i++){
      var c=message.charCodeAt(i);
      if(c<128)bytes.push(c);
      else if(c<2048){
        bytes.push(192|(c>>6));
        bytes.push(128|(c&63));
      } else if(c<55296||c>=57344){
        bytes.push(224|(c>>12));
        bytes.push(128|((c>>6)&63));
        bytes.push(128|(c&63));
      } else {
        /* Surrogate pair */
        var c2=message.charCodeAt(++i);
        c=65536+(((c&0x3FF)<<10)|(c2&0x3FF));
        bytes.push(240|(c>>18));
        bytes.push(128|((c>>12)&63));
        bytes.push(128|((c>>6)&63));
        bytes.push(128|(c&63));
      }
    }
  } else if(message instanceof Uint8Array){
    for(var j=0;j<message.length;j++)bytes.push(message[j]);
  } else {
    for(var k=0;k<message.length;k++)bytes.push(message[k]&0xFF);
  }
  /* Padding */
  var bitLen=bytes.length*8;
  bytes.push(0x80);
  while((bytes.length%64)!==56)bytes.push(0);
  /* Length as 64-bit big-endian */
  var hi=Math.floor(bitLen/0x100000000);
  var lo=bitLen>>>0;
  bytes.push((hi>>>24)&0xFF,((hi>>>16)&0xFF),((hi>>>8)&0xFF),hi&0xFF);
  bytes.push((lo>>>24)&0xFF,((lo>>>16)&0xFF),((lo>>>8)&0xFF),lo&0xFF);
  /* Initialize hash values */
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w=new Array(64);
  /* Process each 512-bit chunk */
  for(var off=0;off<bytes.length;off+=64){
    /* First 16 words */
    for(var t=0;t<16;t++){
      w[t]=(bytes[off+t*4]<<24)|(bytes[off+t*4+1]<<16)|(bytes[off+t*4+2]<<8)|bytes[off+t*4+3];
    }
    /* Extend to 64 words */
    for(var t2=16;t2<64;t2++){
      var s0=rotr(w[t2-15],7)^rotr(w[t2-15],18)^(w[t2-15]>>>3);
      var s1=rotr(w[t2-2],17)^rotr(w[t2-2],19)^(w[t2-2]>>>10);
      w[t2]=(w[t2-16]+s0+w[t2-7]+s1)|0;
    }
    /* Compression */
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var t3=0;t3<64;t3++){
      var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      var ch=(e&f)^((~e)&g);
      var temp1=(h+S1+ch+SHA256_K[t3]+w[t3])|0;
      var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      var maj=(a&b)^(a&c)^(b&c);
      var temp2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+temp1)|0;
      d=c;c=b;b=a;a=(temp1+temp2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;
    H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;
    H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  /* Produce hex string */
  var hex='';
  for(var i2=0;i2<8;i2++){
    hex+=(H[i2]>>>0).toString(16).padStart(8,'0');
  }
  return hex;
}
/* Double-SHA256 (Bitcoin-style) */
function sha256d(msg){return sha256(sha256(msg));}

/* ================================================================
   MERKLE TREE
   ================================================================ */
function merkleRoot(hashes){
  if(hashes.length===0)return sha256('');
  var level=hashes.slice();
  var levels=[level.slice()];
  while(level.length>1){
    var next=[];
    for(var i=0;i<level.length;i+=2){
      var left=level[i];
      var right=i+1<level.length?level[i+1]:left;
      next.push(sha256(left+right));
    }
    level=next;
    levels.push(level.slice());
  }
  return {root:level[0],levels:levels};
}

/* ================================================================
   CRYPTO — Simplified key pair (using Web Crypto)
   We use a real EC key pair via Web Crypto for authenticity.
   ================================================================ */
async function generateKeyPair(){
  try{
    var keyPair=await crypto.subtle.generateKey(
      {name:'ECDSA',namedCurve:'P-256'},
      true,
      ['sign','verify']
    );
    var pubKey=await crypto.subtle.exportKey('raw',keyPair.publicKey);
    var pubBytes=new Uint8Array(pubKey);
    /* Generate address: last 20 bytes of double-SHA256 of public key */
    var hashHex=sha256d(Array.from(pubBytes));
    var address='0x'+hashHex.substr(24,40); /* 20 bytes = 40 hex chars */
    /* Private key: we keep it as the JWK for signing */
    var privKey=await crypto.subtle.exportKey('jwk',keyPair.privateKey);
    return {
      address:address,
      publicKey:pubBytes,
      keyPair:keyPair,
      privateJwk:privKey
    };
  }catch(e){
    /* Fallback: pseudo-random address if Web Crypto unavailable */
    var rnd_hex='';
    for(var i=0;i<40;i++)rnd_hex+='0123456789abcdef'[rnd(0,15)];
    return {address:'0x'+rnd_hex,publicKey:null,keyPair:null};
  }
}
async function signMessage(keyPair,message){
  if(!keyPair)return 'sig_'+Math.random().toString(36).substr(2,40);
  try{
    var enc=new TextEncoder();
    var sig=await crypto.subtle.sign(
      {name:'ECDSA',hash:'SHA-256'},
      keyPair.privateKey,
      enc.encode(message)
    );
    var sigBytes=new Uint8Array(sig);
    var hex='';
    for(var i=0;i<sigBytes.length;i++)hex+=sigBytes[i].toString(16).padStart(2,'0');
    return hex;
  }catch(e){
    return 'sig_'+Math.random().toString(36).substr(2,40);
  }
}
function randomAddress(){
  var hex='';
  for(var i=0;i<40;i++)hex+='0123456789abcdef'[rnd(0,15)];
  return '0x'+hex;
}

/* ================================================================
   BLOCK & TRANSACTION STRUCTURES
   ================================================================ */
var BLOCK_REWARD=50;              /* Initial block reward */
var HALVING_INTERVAL=210;         /* Blocks per halving */
var INITIAL_DIFFICULTY=3;         /* Leading zeros required */
var DIFFICULTY_TARGET_TIME=60000; /* 60s per block */
var DIFFICULTY_WINDOW=10;         /* Blocks for adjustment */

function Transaction(opts){
  this.from=opts.from||'coinbase';
  this.to=opts.to;
  this.amount=opts.amount;
  this.fee=opts.fee||0.001;
  this.timestamp=opts.timestamp||Date.now();
  this.signature=opts.signature||'';
  this.data=opts.data||'';
  this.hash=this.computeHash();
  this.confirmed=false;
  this.blockHeight=-1;
}
Transaction.prototype.computeHash=function(){
  return sha256d(this.from+'|'+this.to+'|'+this.amount+'|'+this.fee+'|'+this.timestamp+'|'+this.signature+'|'+this.data);
};
Transaction.prototype.toStr=function(){
  return JSON.stringify({
    from:this.from,to:this.to,amount:this.amount,fee:this.fee,
    timestamp:this.timestamp,signature:this.signature,data:this.data
  });
};

function Block(opts){
  this.height=opts.height;
  this.previousHash=opts.previousHash||'0'.repeat(64);
  this.transactions=opts.transactions||[];
  this.timestamp=opts.timestamp||Date.now();
  this.nonce=opts.nonce||0;
  this.difficulty=opts.difficulty||INITIAL_DIFFICULTY;
  this.miner=opts.miner||'unknown';
  this.merkleRoot=this.computeMerkleRoot();
  this.hash=this.computeHash();
}
Block.prototype.computeMerkleRoot=function(){
  if(this.transactions.length===0){
    return sha256('empty');
  }
  var hashes=this.transactions.map(function(tx){return tx.hash;});
  return merkleRoot(hashes).root;
};
Block.prototype.computeHash=function(){
  /* Bitcoin-style block header hashing */
  var header=this.height+'|'+this.previousHash+'|'+this.merkleRoot+'|'+this.timestamp+'|'+this.difficulty+'|'+this.nonce;
  return sha256d(header);
};
Block.prototype.meetsTarget=function(){
  return this.hash.startsWith('0'.repeat(this.difficulty));
};
Block.prototype.recompute=function(){
  /* Update merkle root if transactions changed */
  this.merkleRoot=this.computeMerkleRoot();
  this.hash=this.computeHash();
};
</script>
<script>
/* ================================================================
   BLOCKCHAIN
   ================================================================ */
function Blockchain(){
  this.chain=[];
  this.mempool=[];
  this.balances={};
  this.utxos={};      /* Unspent transaction outputs (simplified) */
  this.difficulty=INITIAL_DIFFICULTY;
  this.totalMined=0;
  this.nodes=[];
  this.hashRate=0;
  this.state='idle';
  this.genesisMiner='0x'+'0'.repeat(40);
  this.lastBlockTime=Date.now();
  this.blockTimes=[]; /* Timestamps of last N blocks */
  this.initialize();
}
Blockchain.prototype.initialize=function(){
  /* Create genesis block */
  var genesisTx=new Transaction({
    from:'coinbase',
    to:this.genesisMiner,
    amount:BLOCK_REWARD,
    fee:0,
    timestamp:0,
    data:'Genesis'
  });
  var genesis=new Block({
    height:0,
    previousHash:'0'.repeat(64),
    transactions:[genesisTx],
    timestamp:Date.now(),
    difficulty:INITIAL_DIFFICULTY,
    miner:'genesis'
  });
  /* Mine genesis (just add leading zeros virtually) */
  genesis.nonce=0;
  genesis.hash=genesis.computeHash();
  this.chain.push(genesis);
  genesisTx.confirmed=true;
  genesisTx.blockHeight=0;
  this.balances[this.genesisMiner]=(this.balances[this.genesisMiner]||0)+BLOCK_REWARD;
  this.totalMined=BLOCK_REWARD;
  this.lastBlockTime=Date.now();
};
Blockchain.prototype.getHeight=function(){return this.chain.length-1;};
Blockchain.prototype.getLatestBlock=function(){return this.chain[this.chain.length-1];};
Blockchain.prototype.getReward=function(height){
  var halvings=Math.floor(height/HALVING_INTERVAL);
  return BLOCK_REWARD/Math.pow(2,halvings);
};
Blockchain.prototype.getBalance=function(addr){
  return this.balances[addr]||0;
};
Blockchain.prototype.getTotalSupply=function(){
  return Object.keys(this.balances).reduce(function(sum,k){return sum+this.balances[k];},0,this);
};
/* Simplified: we don't do UTXO diffing here, just track balances.
   In a real chain we'd track unspent outputs and validate every coin's history. */
Blockchain.prototype.addTransaction=function(tx){
  /* Basic validation */
  if(!tx.to||tx.amount<=0)return {ok:false,error:'Invalid transaction'};
  /* Check sender has funds (skip for coinbase) */
  if(tx.from!=='coinbase'){
    var bal=this.getBalance(tx.from);
    if(bal<tx.amount+tx.fee){
      return {ok:false,error:'Insufficient balance'};
    }
  }
  this.mempool.push(tx);
  return {ok:true,tx:tx};
};
Blockchain.prototype.createTransaction=async function(from,fromKeyPair,to,amount,fee){
  var tx=new Transaction({
    from:from,
    to:to,
    amount:amount,
    fee:fee||0.001,
    timestamp:Date.now()
  });
  /* Sign it */
  var sig=await signMessage(fromKeyPair,tx.toStr());
  tx.signature=sig;
  tx.hash=tx.computeHash();
  return this.addTransaction(tx);
};
Blockchain.prototype.selectTransactions=function(maxCount){
  /* Sort by fee (highest first) */
  var sorted=this.mempool.slice().sort(function(a,b){return b.fee-a.fee;});
  return sorted.slice(0,maxCount||10);
};
Blockchain.prototype.mineBlock=function(minerAddress,onProgress){
  var selected=this.selectTransactions(10);
  var reward=this.getReward(this.chain.length);
  /* Coinbase transaction */
  var coinbase=new Transaction({
    from:'coinbase',
    to:minerAddress,
    amount:reward,
    fee:0,
    timestamp:Date.now(),
    data:'Block reward #'+this.chain.length
  });
  /* Collect fees */
  var totalFees=selected.reduce(function(s,tx){return s+tx.fee;},0);
  var feeTx=new Transaction({
    from:'coinbase',
    to:minerAddress,
    amount:totalFees,
    fee:0,
    timestamp:Date.now(),
    data:'Fees for block #'+this.chain.length
  });
  var txs=[coinbase].concat(selected);
  if(totalFees>0)txs.push(feeTx);
  /* Build block */
  var prev=this.getLatestBlock();
  var block=new Block({
    height:this.chain.length,
    previousHash:prev.hash,
    transactions:txs,
    timestamp:Date.now(),
    difficulty:this.difficulty,
    miner:minerAddress
  });
  /* Mine: find nonce */
  var target='0'.repeat(block.difficulty);
  var maxNonce=10000000;
  var startTime=Date.now();
  var found=false;
  var hashesTried=0;
  for(var nonce=0;nonce<maxNonce;nonce++){
    block.nonce=nonce;
    block.hash=block.computeHash();
    hashesTried++;
    if(block.hash.startsWith(target)){
      found=true;
      break;
    }
    if(nonce%5000===0&&onProgress){
      var elapsed=Date.now()-startTime;
      onProgress({nonce:nonce,hash:block.hash,tried:hashesTried,elapsed:elapsed});
      /* Yield to UI */
      if(elapsed>1500)break;
    }
  }
  if(!found){
    return {ok:false,error:'Mining timeout — try again'};
  }
  block.nonce=nonce;
  block.hash=block.computeHash();
  /* Apply transactions to state */
  var self=this;
  txs.forEach(function(tx){
    if(tx.from!=='coinbase'){
      self.balances[tx.from]=(self.balances[tx.from]||0)-tx.amount-tx.fee;
    }
    self.balances[tx.to]=(self.balances[tx.to]||0)+tx.amount;
    tx.confirmed=true;
    tx.blockHeight=block.height;
  });
  /* Remove mined txs from mempool */
  var minedHashes={};
  txs.forEach(function(tx){if(tx.from!=='coinbase')minedHashes[tx.hash]=true;});
  this.mempool=this.mempool.filter(function(tx){return !minedHashes[tx.hash];});
  /* Add block to chain */
  this.chain.push(block);
  this.totalMined+=reward+totalFees;
  this.blockTimes.push(Date.now());
  if(this.blockTimes.length>DIFFICULTY_WINDOW)this.blockTimes.shift();
  /* Adjust difficulty */
  this.adjustDifficulty();
  this.lastBlockTime=Date.now();
  return {ok:true,block:block,hashesTried:hashesTried,elapsed:Date.now()-startTime};
};
Blockchain.prototype.adjustDifficulty=function(){
  if(this.blockTimes.length<DIFFICULTY_WINDOW)return;
  var span=this.blockTimes[this.blockTimes.length-1]-this.blockTimes[0];
  var avgTime=span/(this.blockTimes.length-1);
  if(avgTime<DIFFICULTY_TARGET_TIME*0.5&&this.difficulty<8){
    this.difficulty++;
  } else if(avgTime>DIFFICULTY_TARGET_TIME*1.5&&this.difficulty>1){
    this.difficulty--;
  }
};
Blockchain.prototype.validateChain=function(){
  for(var i=1;i<this.chain.length;i++){
    var b=this.chain[i];
    var prev=this.chain[i-1];
    if(b.previousHash!==prev.hash)return {valid:false,error:'Invalid prev hash at '+i};
    if(!b.meetsTarget())return {valid:false,error:'Block '+i+' does not meet target'};
    if(b.computeHash()!==b.hash)return {valid:false,error:'Block '+i+' hash mismatch'};
  }
  return {valid:true};
};
Blockchain.prototype.getTransaction=function(hash){
  for(var i=0;i<this.chain.length;i++){
    for(var j=0;j<this.chain[i].transactions.length;j++){
      var tx=this.chain[i].transactions[j];
      if(tx.hash===hash)return {tx:tx,block:this.chain[i]};
    }
  }
  for(var k=0;k<this.mempool.length;k++){
    if(this.mempool[k].hash===hash)return {tx:this.mempool[k],block:null};
  }
  return null;
};
Blockchain.prototype.getTransactionsFor=function(addr){
  var result=[];
  for(var i=0;i<this.chain.length;i++){
    for(var j=0;j<this.chain[i].transactions.length;j++){
      var tx=this.chain[i].transactions[j];
      if(tx.from===addr||tx.to===addr){
        result.push({tx:tx,block:this.chain[i]});
      }
    }
  }
  for(var k=0;k<this.mempool.length;k++){
    var mtx=this.mempool[k];
    if(mtx.from===addr||mtx.to===addr){
      result.push({tx:mtx,block:null});
    }
  }
  return result;
};

function NetworkNode(name,hashRate){
  this.name=name;
  this.hashRate=hashRate;  /* Hashes per second */
  this.blocksMined=0;
  this.coins=0;
  this.peers=[];
  this.online=true;
}
function createNetwork(n){
  var nodes=[];
  var names=['Alpha','Beta','Gamma','Delta','Epsilon','Zeta','Eta','Theta','Iota','Kappa','Lambda','Mu'];
  for(var i=0;i<n;i++){
    nodes.push(new NetworkNode(names[i%names.length]+'-'+(i+1),rnd(1000,50000)));
  }
  return nodes;
}

var MINE_CANVAS=null;
function initMineCanvas(){
  MINE_CANVAS=$('mineCanvas');
  if(!MINE_CANVAS)return;
  resizeMineCanvas();
  window.addEventListener('resize',resizeMineCanvas);
  animateMineCanvas();
}
function resizeMineCanvas(){
  if(!MINE_CANVAS)return;
  var wrap=MINE_CANVAS.parentElement;
  var dpr=window.devicePixelRatio||1;
  MINE_CANVAS.width=wrap.clientWidth*dpr;
  MINE_CANVAS.height=wrap.clientHeight*dpr;
  MINE_CANVAS.style.width=wrap.clientWidth+'px';
  MINE_CANVAS.style.height=wrap.clientHeight+'px';
  MINE_CANVAS.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}
function animateMineCanvas(){
  if(!MINE_CANVAS)return;
  var ctx=MINE_CANVAS.getContext('2d');
  var W=MINE_CANVAS.clientWidth,H=MINE_CANVAS.clientHeight;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  /* Waveform effect */
  var t=performance.now()/1000;
  var speed=STATE.mining?3:0.5;
  var amp=STATE.mining?30:8;
  var intensity=STATE.mining?1:0.3;
  for(var layer=0;layer<3;layer++){
    ctx.strokeStyle=layer===0?'rgba(255,160,64,'+intensity+')':layer===1?'rgba(255,208,64,'+(intensity*0.7)+')':'rgba(64,232,136,'+(intensity*0.5)+')';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(var x=0;x<=W;x+=4){
      var ph=x*0.02+t*speed+layer*0.5;
      var y=H/2+Math.sin(ph)*amp+Math.sin(ph*2.3)*amp*0.4+Math.sin(ph*5.1)*amp*0.15;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  /* Grid overlay */
  ctx.strokeStyle='rgba(255,208,64,.05)';
  for(var gy=0;gy<H;gy+=20){
    ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
  }
  /* Mining indicator */
  if(STATE.mining){
    var txt='MINING BLOCK #'+STATE.chain.chain.length+' · DIFFICULTY '+STATE.chain.difficulty+' · TARGET '+('0'.repeat(STATE.chain.difficulty))+'...';

  }

}

<script>
/* ================================================================
   CONSENSUS VIEW — 51% attack simulation
   ================================================================ */
function renderConsensusView(c){
  var html='<div style="padding:20px;max-width:1000px;margin:0 auto">';
  html+='<h2 style="font-size:1.3rem;font-weight:800;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-family:var(--disp);letter-spacing:2px;margin-bottom:6px">CONSENSUS</h2>';
  html+='<p style="font-size:.72rem;color:var(--tx3);font-family:var(--mono);margin-bottom:20px">Simulate a 51% attack against the network</p>';
  html+='<div class="sec"><h4>How it works</h4>';
  html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    'A 51% attack occurs when a single entity controls more than half of the total hashing power. '+
    'Because the longest chain wins, the attacker can mine blocks faster than the honest network and '+
    'eventually replace the honest chain with their own, double-spending coins.<br><br>'+
    'Below 50%, the honest chain grows faster on average, and the attack fails.<br>'+
    'Above 50%, the attacker\'s chain grows faster, and the attack succeeds given enough time.</div>';
  html+='</div>';
  html+='<div class="sec"><h4>Attack Parameters</h4>';
  html+='<div class="ctrl"><div class="lbl"><span>Attacker hashrate</span><span id="attackPctLabel">'+STATE.attackPower+'%</span></div>';
  html+='<input type="range" id="attackRange" min="10" max="90" step="1" value="'+STATE.attackPower+'" oninput="STATE.attackPower=parseInt(this.value);document.getElementById(\'attackPctLabel\').textContent=this.value+\'%\'"></div>';
  html+='<button class="btn primary full" onclick="runAttackSimulation()">⚔️ Run Simulation</button>';
  html+='</div>';
  html+='<div id="attackResult"></div>';
  html+='</div>';
  c.innerHTML=html;
}
function runAttackSimulation(){
  var attackPct=STATE.attackPower/100;
  var honestPct=1-attackPct;
  /* Simulate: starting from same point, honest and attacker race */
  /* Each "round" produces a block on whichever chain is faster */
  var honest=0;
  var attacker=0;
  var rounds=200;
  var history=[];
  for(var i=0;i<rounds;i++){
    var roll=Math.random();
    if(roll<honestPct)honest++;
    else attacker++;
    history.push({honest:honest,attacker:attacker});
  }
  /* Find first point where attacker >= honest */
  var caughtAt=-1;
  for(var j=0;j<history.length;j++){
    if(history[j].attacker>=history[j].honest){
      caughtAt=j;
      break;
    }
  }
  var success=caughtAt>=0;
  var html='<div class="sec"><h4>Simulation Result</h4>';
  html+='<div class="stats-grid">';
  html+='<div class="stat c4"><div class="sv">'+STATE.attackPower+'%</div><div class="sl">Attacker hashrate</div></div>';
  html+='<div class="stat c5"><div class="sv">'+history[history.length-1].honest+'</div><div class="sl">Honest blocks</div></div>';
  html+='<div class="stat c7"><div class="sv">'+history[history.length-1].attacker+'</div><div class="sl">Attacker blocks</div></div>';
  html+='<div class="stat '+(success?'c7':'c5')+'"><div class="sv">'+(success?'SUCCESS':'FAILED')+'</div><div class="sl">Attack result</div></div>';
  html+='</div>';
  html+='<div class="chart-label" style="margin-top:14px">Chain Race (200 block slots)</div>';
  html+='<canvas id="attackCanvas" class="chart-canvas" style="height:200px"></canvas>';
  html+='<div style="margin-top:14px;padding:12px;background:var(--panel3);border-radius:var(--rxs);font-size:.7rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">';
  if(success){
    html+='<b style="color:var(--c7)">⚠ ATTACK SUCCEEDED</b><br>At '+STATE.attackPower+'% hashrate, the attacker overtook the honest chain at slot '+(caughtAt+1)+' in this run. In practice, the honest chain continues to grow — this is why >51% is dangerous.';
  } else {
    html+='<b style="color:var(--c5)">✓ ATTACK FAILED</b><br>At '+STATE.attackPower+'% hashrate, the honest chain stayed ahead through all 200 slots. The attacker would need more hashrate to overcome the network.';
  }
  html+='</div>';
  html+='</div>';
  $('attackResult').innerHTML=html;
  setTimeout(function(){drawAttackChart(history);},50);
}
function drawAttackChart(history){
  var cv=$('attackCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth,H=200;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var padL=40,padR=20,padT=20,padB=30;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  /* Grid */
  ctx.strokeStyle='rgba(255,208,64,.1)';
  for(var gi=0;gi<=4;gi++){
    var y=padT+gi*plotH/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
  }
  var maxBlocks=Math.max(history[history.length-1].honest,history[history.length-1].attacker);
  /* Honest line */
  ctx.strokeStyle='#40e888';ctx.lineWidth=2.5;
  ctx.beginPath();
  history.forEach(function(h,i){
    var x=padL+i/history.length*plotW;
    var y=padT+(1-h.honest/maxBlocks)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Attacker line */
  ctx.strokeStyle='#ff4080';ctx.lineWidth=2.5;
  ctx.beginPath();
  history.forEach(function(h,i){
    var x=padL+i/history.length*plotW;
    var y=padT+(1-h.attacker/maxBlocks)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Labels */
  ctx.fillStyle='#40e888';ctx.font='bold 10px monospace';
  ctx.fillText('Honest chain',padL+4,padT+12);
  ctx.fillStyle='#ff4080';
  ctx.fillText('Attacker chain',padL+4,padT+26);
  ctx.fillStyle='#806868';ctx.font='10px monospace';
  ctx.fillText(maxBlocks,4,padT+10);
  ctx.textAlign='center';
  ctx.fillText('block slots →',padL+plotW/2,H-6);
  ctx.textAlign='left';
}

function drawMarketChart(){
  var cv=$('marketCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth,H=240;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(STATE.priceHistory.length<2){
    ctx.fillStyle='#806868';
    ctx.font='12px monospace';
    ctx.textAlign='center';
    ctx.fillText('Click "Simulate Next Day" to generate price data',W/2,H/2);
    return;
  }
  var padL=60,padR=20,padT=20,padB=30;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var minP=Math.min.apply(null,STATE.priceHistory);
  var maxP=Math.max.apply(null,STATE.priceHistory);
  var range=maxP-minP||1;
  minP-=range*0.05;maxP+=range*0.05;range=maxP-minP;
  /* Grid */
  ctx.strokeStyle='rgba(255,208,64,.08)';
  for(var gi=0;gi<=4;gi++){
    var y=padT+gi*plotH/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
    ctx.fillStyle='#806868';ctx.font='9px monospace';ctx.textAlign='right';
    ctx.fillText('$'+fmt(maxP-(maxP-minP)*gi/4,0),padL-4,y+3);
  }
  /* Price line */
  ctx.strokeStyle='#ffa040';ctx.lineWidth=2.5;
  ctx.beginPath();
  STATE.priceHistory.forEach(function(p,i){
    var x=padL+i/(STATE.priceHistory.length-1)*plotW;
    var y=padT+(1-(p-minP)/range)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Fill */
  var grad=ctx.createLinearGradient(0,padT,0,padT+plotH);
  grad.addColorStop(0,'rgba(255,160,64,.3)');
  grad.addColorStop(1,'rgba(255,160,64,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  STATE.priceHistory.forEach(function(p,i){
    var x=padL+i/(STATE.priceHistory.length-1)*plotW;
    var y=padT+(1-(p-minP)/range)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+plotW,padT+plotH);
  ctx.lineTo(padL,padT+plotH);
  ctx.closePath();
  ctx.fill();
  /* Axis labels */
  ctx.fillStyle='#806868';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText('30 days ago',padL+40,H-6);
  ctx.fillText('Today',padL+plotW-30,H-6);
}
function simulateMarketDay(){
  /* Random walk with drift */
  var drift=rndF(-0.03,0.04);
  var vol=rndF(0.02,0.08);
  var change=drift+ (Math.random()-0.5)*vol;
  STATE.currentPrice=Math.max(1,STATE.currentPrice*(1+change));
  STATE.priceHistory.push(STATE.currentPrice);
  if(STATE.priceHistory.length>30)STATE.priceHistory.shift();
  renderContent();
  toast('LDG price: $'+fmt(STATE.currentPrice,0)+' ('+(change>=0?'+':'')+fmt(change*100,2)+'%)',change>=0?'success':'warn');
}
function resetMarket(){
  STATE.currentPrice=45000;
  STATE.priceHistory=[];
  for(var i=0;i<30;i++){
    STATE.currentPrice*=1+rndF(-0.05,0.05);
    STATE.priceHistory.push(STATE.currentPrice);
  }
  STATE.currentPrice=45000;
  STATE.priceHistory.push(STATE.currentPrice);
  renderContent();
  toast('Market reset','success');
}

    '<b class="text-c1">generateKeyPair()</b> → ECDSA P-256 key pair (async)<br>'+
    '<b class="text-c1">signMessage(keyPair,msg)</b> → hex signature (async)'+
    '</div></div>';
  html+='<div class="sec"><h4>Try it now</h4>';

  html+='<div id="cryptoTest" style="margin-top:10px"></div>';
  html+='</div>';
  html+='</div>';
  c.innerHTML=html;
}
function testCrypto(){
  var msg='Hello, blockchain!';
  var hash=sha256(msg);
  var hash2=sha256d(msg);
  var test1=sha256('abc');
  var expected1='ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
  var match=test1===expected1;
  var html='<div style="background:var(--panel3);border-radius:var(--rxs);padding:12px;font-family:var(--mono);font-size:.65rem;line-height:1.6">';
  html+='<div><b class="text-c1">Input:</b> "'+esc(msg)+'"</div>';
  html+='<div style="margin-top:6px"><b class="text-c1">SHA-256:</b><br><span style="color:var(--c4);word-break:break-all">'+hash+'</span></div>';
  html+='<div style="margin-top:6px"><b class="text-c1">SHA-256d:</b><br><span style="color:var(--c4);word-break:break-all">'+hash2+'</span></div>';
  html+='<div style="margin-top:10px;padding:8px;background:'+(match?'rgba(64,232,136,.1)':'rgba(255,64,128,.1)')+';border-radius:4px"><b style="color:'+(match?'var(--c5)':'var(--c7)')+'">'+(match?'✓ FIPS 180-4 test vector PASSED':'✗ Test vector FAILED')+'</b><br>'+
    '<span style="font-size:.6rem">sha256("abc") = '+test1.substr(0,32)+'... (expected: '+expected1.substr(0,32)+'...)</span></div>';
  html+='</div>';
  $('cryptoTest').innerHTML=html;
}

/* ================================================================
   ACTIONS
   ================================================================ */
async function newWallet(){
  var kp=await generateKeyPair();
  STATE.wallet={
    address:kp.address,
    publicKey:kp.publicKey,
    keyPair:kp.keyPair,
    createdAt:Date.now()
  };
  /* Give new wallet some starting funds via a faucet */
  if(!STATE.chain.balances[kp.address]){
    STATE.chain.balances[kp.address]=0;
  }
  toast('Wallet generated: '+shortHash(kp.address,10),'success',3000);
  renderLeftPanel();
  renderContent();
  renderRightPanel();
}
function setWallet(addr){
  /* Select an existing address (limited to what we know) */
  if(STATE.wallet&&STATE.wallet.address===addr){
    toast('Already selected','info');
    return;
  }
  /* We can only really use our own wallet for signing; for others we just view */
  STATE.wallet={
    address:addr,
    publicKey:null,
    keyPair:null,
    createdAt:Date.now()
  };
  renderLeftPanel();
  renderContent();
  renderRightPanel();
}
async function sendTransaction(){
  if(!STATE.wallet){toast('No wallet','warn');return}
  var to=$('sendTo')?$('sendTo').value.trim():'';
  var amount=parseFloat($('sendAmount')?$('sendAmount').value:0);
  if(!to||!to.startsWith('0x')||to.length!==42){
    toast('Invalid recipient address','error');return;
  }
  if(!amount||amount<=0){toast('Invalid amount','error');return}
  if(amount>STATE.chain.getBalance(STATE.wallet.address)){
    toast('Insufficient balance','error');return;
  }
  var result=await STATE.chain.createTransaction(
    STATE.wallet.address,
    STATE.wallet.keyPair,
    to,
    amount,
    0.001
  );
  if(!result.ok){toast('Transaction failed: '+result.error,'error');return}
  toast('Transaction signed and broadcast','success',2500);
  renderContent();
  renderRightPanel();
}
function createRandomTransaction(){
  var addrs=Object.keys(STATE.chain.balances);
  if(addrs.length<2){
    /* Generate a random recipient */
    var newAddr=randomAddress();
    STATE.chain.balances[newAddr]=0;
    addrs.push(newAddr);
  }
  var from=pick(addrs.filter(function(a){return STATE.chain.balances[a]>1;}));
  if(!from){toast('No funded addresses','warn');return}
  var to=pick(addrs.filter(function(a){return a!==from;}));
  if(!to){toast('Need another address','warn');return}
  var amount=Math.min(STATE.chain.balances[from]*0.5,rndF(0.1,5));
  var tx=new Transaction({from:from,to:to,amount:amount,fee:0.001,timestamp:Date.now()});
  STATE.chain.addTransaction(tx);
  toast('New tx in mempool: '+shortHash(tx.hash,8),'success',1800);
  renderContent();
  renderRightPanel();
  updateTopbar();
  updateStatusBar();
}
function toggleMining(){
  STATE.mining=!STATE.mining;
  var btn=$('btnMine');
  if(STATE.mining){
    btn.classList.add('mining');
    $('sbState').textContent='Mining';
    toast('Mining started','success');
    startMiningLoop();
  } else {
    btn.classList.remove('mining');
    $('sbState').textContent='Idle';
    if(STATE.miningInterval)clearInterval(STATE.miningInterval);
    STATE.miningInterval=null;
    toast('Mining stopped','info');
  }
  renderLeftPanel();
  renderContent();
}
function startMiningLoop(){
  if(STATE.miningInterval)clearInterval(STATE.miningInterval);
  STATE.miningInterval=setInterval(function(){
    if(!STATE.mining){return}
    /* Try to mine one block; if fails within time, retry */
    var minerAddr=STATE.wallet?STATE.wallet.address:randomAddress();
    var result=STATE.chain.mineBlock(minerAddr,function(prog){
      updateMiningUI(prog);
    });
    if(result.ok){
      /* Log the win */
      appendHashStream('✓ FOUND nonce='+result.block.nonce+' hash='+result.block.hash.substr(0,32)+'…','winning');
      notifyMineWin(result);
      if(STATE.chain.chain.length>=100){
        STATE.mining=false;
        toggleMining();
        toast('Block limit reached — mining stopped','info',3000);
      }
    } else {
      appendHashStream('✗ timeout — retrying','dim');
    }
    renderLeftPanel();
    updateTopbar();
    updateStatusBar();
    if(STATE.currentTab==='chain')renderContent();
    if(STATE.currentTab==='wallet'&&STATE.wallet)renderContent();
  },400);
}
function updateMiningUI(prog){
  var nonceEl=$('mineNonce');
  if(nonceEl)nonceEl.textContent='nonce: '+prog.nonce;
  var infoEl=$('mineInfo');
  if(infoEl){
    var hashRate=Math.round(prog.tried/Math.max(prog.elapsed,1)*1000);
    infoEl.innerHTML='Hashes: '+prog.tried.toLocaleString()+
      '<br>Rate: '+hashRate.toLocaleString()+' H/s'+
      '<br>Latest: '+prog.hash.substr(0,32)+'…';
  }
  appendHashStream(prog.hash.substr(0,32)+'…  n='+prog.nonce,prog.hash.startsWith('0'.repeat(STATE.chain.difficulty))?'valid':'');
}
function appendHashStream(line,cls){
  var el2=$('hashStream');
  if(!el2)return;
  var row=el('div',{class:'hs-line '+(cls||'')},line);
  el2.appendChild(row);
  while(el2.children.length>50)el2.removeChild(el2.firstChild);
  el2.scrollTop=el2.scrollHeight;
}
function notifyMineWin(result){
  var minerAddr=result.block.miner;
  if(STATE.wallet&&STATE.wallet.address===minerAddr){
    toast('🎉 Block mined! +'+fmt(STATE.chain.getReward(result.block.height),2)+' LDG','success',3000);
  }
}
function mineOneBlock(){
  if(!STATE.wallet){toast('Generate a wallet first','warn');return}
  var btn=$('btnMine');
  toast('Mining block #'+STATE.chain.chain.length+'…','info',1500);
  setTimeout(function(){
    var result=STATE.chain.mineBlock(STATE.wallet.address,function(prog){
      updateMiningUI(prog);
    });
    if(result.ok){
      toast('✓ Block #'+result.block.height+' mined in '+result.elapsed+'ms ('+result.hashesTried.toLocaleString()+' hashes)','success',3500);
      renderContent();
      renderRightPanel();
      renderLeftPanel();
      updateTopbar();
      updateStatusBar();
    } else {
      toast('Mining failed: '+result.error,'error',3000);
    }
  },100);
}
function bumpDifficulty(){
  STATE.chain.difficulty=Math.min(8,STATE.chain.difficulty+1);
  toast('Difficulty: '+STATE.chain.difficulty,'warn',1800);
  renderContent();
  renderLeftPanel();
  updateTopbar();
}
function resetChain(){
  if(!confirm('Reset blockchain and start over?'))return;

function doSearch(){
  var q=$('searchInput').value.trim();
  var el2=$('searchResult');
  if(!q){el2.innerHTML='';return}
  /* Try block height */
  if(/^\d+$/.test(q)){
    var h=parseInt(q);
    if(h>=0&&h<STATE.chain.chain.length){
      var b=STATE.chain.chain[h];
      el2.innerHTML='<div class="sec"><h4>Found Block #'+h+'</h4><div class="kv">'+
        '<div class="row"><span class="k">Hash</span><span class="v" style="font-size:.55rem">'+esc(b.hash)+'</span></div>'+
        '<div class="row"><span class="k">Transactions</span><span class="v">'+b.transactions.length+'</span></div>'+
        '</div><button class="btn primary sm" style="margin-top:8px" onclick="showBlockDetail('+h+')">View Details</button></div>';
      return;
    }
  }
  /* Try transaction hash */
  var found=STATE.chain.getTransaction(q);
  if(found){
    el2.innerHTML='<div class="sec"><h4>Found Transaction</h4><div class="kv">'+
      '<div class="row"><span class="k">Hash</span><span class="v" style="font-size:.55rem">'+esc(found.tx.hash)+'</span></div>'+
      '<div class="row"><span class="k">Amount</span><span class="v">'+fmt(found.tx.amount,4)+'</span></div>'+
      '<div class="row"><span class="k">Status</span><span class="v">'+(found.block?'Confirmed':'Pending')+'</span></div>'+
      '</div><button class="btn primary sm" style="margin-top:8px" onclick="showTxDetail(\''+esc(q)+'\')">View Details</button></div>';
    return;
  }
  /* Try address */
  if(q.startsWith('0x')&&q.length>=40){
    var bal=STATE.chain.getBalance(q);
    var txs=STATE.chain.getTransactionsFor(q);
    el2.innerHTML='<div class="sec"><h4>Address '+shortHash(q,10)+'</h4><div class="kv">'+
      '<div class="row"><span class="k">Balance</span><span class="v" style="color:var(--c5)">'+fmt(bal,4)+' LDG</span></div>'+
      '<div class="row"><span class="k">Transactions</span><span class="v">'+txs.length+'</span></div>'+
      '</div></div>';
    return;
  }
  el2.innerHTML='<div class="empty" style="padding:20px;font-size:.65rem">No results for "'+esc(q)+'"</div>';
}
function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){toast('Copied','success',1200)});
  } else {
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied','success',1200)}catch(e){}
    ta.remove();
  }
}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='m'||e.key==='M')toggleMining();
  else if(e.key==='n'||e.key==='N')newWallet();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

function updateTopbar(){

function saveChain(){
  try{
    var data={
      version:'1.0',
      chain:STATE.chain.chain.map(function(b){
        return {
          height:b.height,previousHash:b.previousHash,
          timestamp:b.timestamp,nonce:b.nonce,
          difficulty:b.difficulty,miner:b.miner,
          merkleRoot:b.merkleRoot,hash:b.hash,
          transactions:b.transactions.map(function(tx){
            return {from:tx.from,to:tx.to,amount:tx.amount,fee:tx.fee,timestamp:tx.timestamp,signature:tx.signature,data:tx.data,hash:tx.hash};
          })
        };
      }),
      balances:STATE.chain.balances,
      difficulty:STATE.chain.difficulty,
      totalMined:STATE.chain.totalMined
    };
    localStorage.setItem('ledger-chain',JSON.stringify(data));
    toast('Chain saved ('+STATE.chain.chain.length+' blocks)','success');
  }catch(e){
    toast('Save failed: '+e.message,'error');
  }
}
function loadChain(){
  try{
    var raw=localStorage.getItem('ledger-chain');
    if(!raw){toast('No saved chain','warn');return}
    var data=JSON.parse(raw);
    var chain=new Blockchain();
    chain.chain=[];
    data.chain.forEach(function(bd){
      var b=new Block({
        height:bd.height,
        previousHash:bd.previousHash,
        timestamp:bd.timestamp,
        nonce:bd.nonce,
        difficulty:bd.difficulty,
        miner:bd.miner,
        transactions:[]
      });
      bd.transactions.forEach(function(txd){
        var tx=new Transaction(txd);
        tx.confirmed=true;
        tx.blockHeight=b.height;
        b.transactions.push(tx);
      });
      b.merkleRoot=bd.merkleRoot;
      b.hash=bd.hash;
      chain.chain.push(b);
    });
    chain.balances=data.balances||{};
    chain.difficulty=data.difficulty||INITIAL_DIFFICULTY;
    chain.totalMined=data.totalMined||0;
    STATE.chain=chain;
    renderLeftPanel();
    renderContent();
    renderRightPanel();
    updateTopbar();
    updateStatusBar();
    toast('Chain loaded ('+chain.chain.length+' blocks)','success');
  }catch(e){
    toast('Load failed: '+e.message,'error');
  }
}
function exportChain(){
  try{
    var data={
      version:'1.0',
      chain:STATE.chain.chain.map(function(b){
        return {
          height:b.height,hash:b.hash,previousHash:b.previousHash,
          merkleRoot:b.merkleRoot,nonce:b.nonce,difficulty:b.difficulty,
          timestamp:b.timestamp,miner:b.miner,
          transactions:b.transactions.map(function(tx){
            return {from:tx.from,to:tx.to,amount:tx.amount,fee:tx.fee,hash:tx.hash};
          })
        };
      }),
      balances:STATE.chain.balances
    };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='ledger-chain.json';a.click();
    setTimeout(function(){URL.revokeObjectURL(url)},500);
    toast('Exported','success');
  }catch(e){
    toast('Export failed','error');
  }
}

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('LEDGER ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}
