/* ================================================================
   CALENDAR
   ================================================================ */
var CalState={year:new Date().getFullYear(),month:new Date().getMonth()};

function render_calendar(){
  var y=CalState.year,m=CalState.month;
  var first=new Date(y,m,1);
  var startDay=first.getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var prevDays=new Date(y,m,0).getDate();

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">📅</span>Calendar</div>';
  html+='<div class="page-desc">'+first.toLocaleString('en-US',{month:'long',year:'numeric'})+'</div></div>';
  html+='<div style="display:flex;gap:8px">';
  html+='<button class="btn" onclick="CalState.month--;if(CalState.month<0){CalState.month=11;CalState.year--}renderPage()">←</button>';
  html+='<button class="btn primary" onclick="editEvent(null)">+ Event</button>';
  html+='<button class="btn" onclick="CalState.month++;if(CalState.month>11){CalState.month=0;CalState.year++}renderPage()">→</button>';
  html+='</div>';
  html+='</div>';

  var todayStr=today();
  html+='<div class="cal-head"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>';
  html+='<div class="calendar-grid">';
  var total=startDay+daysInMonth;
  var rows=Math.ceil(total/7);
  var cellCount=rows*7;
  for(var i=0;i<cellCount;i++){
    var dayNum;
    var isOther=false;
    if(i<startDay){dayNum=prevDays-startDay+i+1;isOther=true}
    else if(i>=startDay+daysInMonth){dayNum=i-(startDay+daysInMonth)+1;isOther=true}
    else dayNum=i-startDay+1;
    var cellDate=isOther?null:(y+'-'+String(m+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0'));
    var isToday=cellDate===todayStr;
    var events=cellDate?State.events.filter(function(e){return e.date===cellDate}):[];
    html+='<div class="cal-day'+(isOther?' other':'')+(isToday?' today':'')+'" '+(cellDate?'onclick="dayClick(\''+cellDate+'\')"':'')+'>';
    html+='<div class="cd-n">'+dayNum+'</div>';
    if(events.length){
      html+='<div class="cd-evt">';
      events.slice(0,3).forEach(function(e){
        html+='<div class="cd-evt-dot" style="background:'+(e.type==='exam'?'#f43f5e':e.type==='deadline'?'#fbbf24':'#3b82f6')+'"></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  }
  html+='</div>';

  // Upcoming events
  var upcoming=State.events.filter(function(e){return e.date>=today()}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,10);
  if(upcoming.length){
    html+='<h3 style="font-size:.9rem;margin:20px 0 12px;font-family:var(--serif)">Upcoming Events</h3>';
    upcoming.forEach(function(e){
      var c=findCourse(e.courseId);
      var d=daysBetween(today(),e.date);
      html+='<div class="stat-line" style="cursor:pointer;padding:10px 0" onclick="editEvent(\''+e.id+'\')">';
      html+='<div style="flex:1;min-width:0">';
      html+='<div style="font-size:.78rem;font-weight:600">'+esc(e.title)+'</div>';
      html+='<div style="font-size:.66rem;color:var(--tx3);margin-top:2px">'+fmtDate(e.date)+' · '+esc(e.time||'')+(c?' · '+esc(c.name):'')+'</div>';
      html+='</div>';
      html+='<span class="badge '+(e.type==='exam'?'err':e.type==='deadline'?'warn':'info')+'">'+(d===0?'Today':d===1?'Tomorrow':'in '+d+'d')+'</span>';
      html+='</div>';
    });
  }

  return html;
}
function dayClick(date){
  var events=State.events.filter(function(e){return e.date===date});
  var body='';
  body+='<div style="font-size:.8rem;color:var(--tx2);margin-bottom:12px">'+fmtDate(date)+'</div>';
  if(!events.length){
    body+='<div class="empty" style="padding:20px"><p>No events</p></div>';
  }else{
    events.forEach(function(e){
      body+='<div class="card pad-sm mb-8">';
      body+='<div style="font-weight:700;font-size:.82rem">'+esc(e.title)+'</div>';
      body+='<div style="font-size:.7rem;color:var(--tx3);margin-top:3px">'+esc(e.time||'')+' · '+esc(e.type||'event')+'</div>';
      if(e.notes)body+='<div style="font-size:.72rem;color:var(--tx2);margin-top:6px">'+esc(e.notes)+'</div>';
      body+='</div>';
    });
  }
  openModal({
    title:'Events for '+fmtDateShort(date),
    narrow:true,
    body:body,
    foot:'<button class="btn" onclick="closeModal()">Close</button>'+
         '<button class="btn primary" onclick="closeModal();editEventForDate(\''+date+'\')">+ Add Event</button>'
  });
}
function editEvent(id){
  var e=id?State.events.find(function(x){return x.id===id}):{title:'',date:today(),time:'09:00',courseId:'',type:'class',notes:''};
  if(id&&!e)return;
  showEventModal(e,id);
}
function editEventForDate(date){
  showEventModal({title:'',date:date,time:'09:00',courseId:'',type:'class',notes:''},null);
}
function showEventModal(e,id){
  var courseOpts='<option value="">— General —</option>';
  State.courses.forEach(function(c){courseOpts+='<option value="'+c.id+'"'+(e.courseId===c.id?' selected':'')+'>'+esc(c.name)+'</option>'});
  openModal({
    title:id?'Edit Event':'New Event',
    body:'<div class="field"><label>Title <span class="req">*</span></label><input id="eTitle" value="'+esc(e.title)+'"></div>'+
      '<div class="field-row">'+
      '<div class="field"><label>Date</label><input type="date" id="eDate" value="'+e.date+'"></div>'+
      '<div class="field"><label>Time</label><input type="time" id="eTime" value="'+e.time+'"></div>'+
      '</div>'+
      '<div class="field-row">'+
      '<div class="field"><label>Course</label><select id="eCourse">'+courseOpts+'</select></div>'+
      '<div class="field"><label>Type</label><select id="eType">'+['class','exam','deadline','meeting','other'].map(function(t){return '<option'+(e.type===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>'+
      '</div>'+
      '<div class="field"><label>Notes</label><textarea id="eNotes" rows="2">'+esc(e.notes||'')+'</textarea></div>',
    foot:(id?'<button class="btn danger" onclick="deleteEvent(\''+id+'\')">Delete</button>':'')+
         '<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveE">Save</button>',
    onOpen:function(){
      $('eTitle').focus();
      $('saveE').onclick=function(){
        var title=$('eTitle').value.trim();
        if(!title){toast('Title required','error');return}
        var data={
          title:title,
          date:$('eDate').value,
          time:$('eTime').value,
          courseId:$('eCourse').value||null,
          type:$('eType').value,
          notes:$('eNotes').value.trim()
        };
        if(id)Object.assign(e,data);
        else{data.id=uid('ev');State.events.push(data)}
        saveState();closeModal();renderPage();
        toast('Saved','success');
      };
    }
  });
}
function deleteEvent(id){
  State.events=State.events.filter(function(x){return x.id!==id});
  saveState();closeModal();renderPage();
  toast('Deleted','info');
}
</script>
<script>
"use strict";

/* ================================================================
   POMODORO
   ================================================================ */
var PomoState={
  mode:'work',
  workMin:25,
  breakMin:5,
  longBreakMin:15,
  cycles:4,
  running:false,
  secondsLeft:0,
  totalSeconds:0,
  cycleCount:0,
  timerId:null,
  task:''
};

function render_pomodoro(){
  if(PomoState.secondsLeft===0){
    PomoState.totalSeconds=PomoState.workMin*60;
    PomoState.secondsLeft=PomoState.totalSeconds;
  }
  var mm=Math.floor(PomoState.secondsLeft/60);
  var ss=PomoState.secondsLeft%60;
  var modeLabel=PomoState.mode==='work'?'Focus Session':'Break Time';
  var modeColor=PomoState.mode==='work'?'var(--c1)':'var(--c3)';
  var todaySessions=State.pomodoroSessions.filter(function(s){return s.date===today()});
  var todayMinutes=todaySessions.reduce(function(sum,s){return sum+s.minutes},0);

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">⏱️</span>Study Timer</div>';
  html+='<div class="page-desc">Pomodoro technique for focused study</div></div>';
  html+='</div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-label">Sessions today</div><div class="kpi-value">'+todaySessions.length+'</div></div>';
  html+='<div class="kpi green"><div class="kpi-label">Focus minutes</div><div class="kpi-value">'+todayMinutes+'</div></div>';
  html+='<div class="kpi blue"><div class="kpi-label">Total focus</div><div class="kpi-value">'+State.pomodoroSessions.reduce(function(s,x){return s+x.minutes},0)+'</div></div>';
  html+='</div>';

  html+='<div class="card pad-lg" style="text-align:center;padding:40px 20px">';
  html+='<div style="font-size:.72rem;color:'+modeColor+';text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-bottom:10px">'+modeLabel+'</div>';
  html+='<div style="font-size:5rem;font-weight:200;font-family:var(--mono);line-height:1;letter-spacing:4px;color:'+modeColor+';margin-bottom:20px">'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'</div>';
  html+='<div class="progress" style="height:10px;max-width:400px;margin:0 auto 20px">';
  var pct=PomoState.totalSeconds>0?((PomoState.totalSeconds-PomoState.secondsLeft)/PomoState.totalSeconds*100):0;
  html+='<div class="progress-fill" style="width:'+pct+'%;background:'+modeColor+'"></div>';
  html+='</div>';
  html+='<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">';
  if(!PomoState.running){
    html+='<button class="btn primary lg" onclick="pomoStart()">▶ Start</button>';
  }else{
    html+='<button class="btn lg" onclick="pomoPause()">⏸ Pause</button>';
  }
  html+='<button class="btn lg" onclick="pomoReset()">↻ Reset</button>';
  html+='<button class="btn lg" onclick="pomoSkip()">⏭ Skip</button>';
  html+='</div>';
  html+='<div style="font-size:.7rem;color:var(--tx3);margin-top:20px">Cycle '+(PomoState.cycleCount+1)+' of '+PomoState.cycles+'</div>';
  html+='</div>';

  html+='<div class="grid-2 mt-16">';
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.85rem;margin-bottom:12px;font-family:var(--serif)">⚙️ Settings</h3>';
  html+='<div class="field-row">';
  html+='<div class="field"><label>Work (min)</label><input type="number" id="pomoWork" value="'+PomoState.workMin+'" onchange="PomoState.workMin=parseInt(this.value);renderPage()"></div>';
  html+='<div class="field"><label>Short break (min)</label><input type="number" id="pomoBreak" value="'+PomoState.breakMin+'" onchange="PomoState.breakMin=parseInt(this.value);renderPage()"></div>';
  html+='</div>';
  html+='<div class="field-row">';
  html+='<div class="field"><label>Long break (min)</label><input type="number" id="pomoLong" value="'+PomoState.longBreakMin+'" onchange="PomoState.longBreakMin=parseInt(this.value);renderPage()"></div>';
  html+='<div class="field"><label>Cycles before long break</label><input type="number" id="pomoCycles" value="'+PomoState.cycles+'" onchange="PomoState.cycles=parseInt(this.value);renderPage()"></div>';
  html+='</div>';
  html+='</div>';

  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.85rem;margin-bottom:12px;font-family:var(--serif)">📊 Recent Sessions</h3>';
  if(!State.pomodoroSessions.length){
    html+='<div style="text-align:center;color:var(--tx3);padding:20px;font-size:.75rem">No sessions yet</div>';
  }else{
    State.pomodoroSessions.slice(0,8).forEach(function(s){
      html+='<div class="stat-line" style="padding:6px 0">';
      html+='<div style="font-size:.72rem;flex:1">'+esc(s.task||'Study session')+'</div>';
      html+='<div style="font-size:.68rem;color:var(--c1);font-family:var(--mono)">'+s.minutes+' min</div>';
      html+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono)">'+timeAgo(s.ts)+'</div>';
      html+='</div>';
    });
  }
  html+='</div>';
  html+='</div>';

  return html;
}

function pomoStart(){
  PomoState.running=true;
  PomoState.timerId=setInterval(function(){
    if(!PomoState.running)return;
    PomoState.secondsLeft--;
    if(PomoState.secondsLeft<=0){
      pomoComplete();
    }else{
      renderPage();
    }
  },1000);
  renderPage();
}
function pomoPause(){
  PomoState.running=false;
  clearInterval(PomoState.timerId);
  renderPage();
}
function pomoReset(){
  PomoState.running=false;
  clearInterval(PomoState.timerId);
  if(PomoState.mode==='work'){
    PomoState.totalSeconds=PomoState.workMin*60;
  }else if(PomoState.mode==='break'){
    PomoState.totalSeconds=PomoState.breakMin*60;
  }else{
    PomoState.totalSeconds=PomoState.longBreakMin*60;
  }
  PomoState.secondsLeft=PomoState.totalSeconds;
  renderPage();
}
function pomoSkip(){
  pomoComplete(true);
}
function pomoComplete(skipped){
  clearInterval(PomoState.timerId);
  PomoState.running=false;
  if(PomoState.mode==='work'){
    // Record session
    var minutes=skipped?Math.floor((PomoState.totalSeconds-PomoState.secondsLeft)/60):PomoState.workMin;
    if(minutes>0){
      State.pomodoroSessions.push({
        id:uid('ps'),
        minutes:minutes,
        task:PomoState.task||'Focus session',
        date:today(),
        ts:nowISO()
      });
      saveState();
      logActivity('pomodoro','Completed '+minutes+' min focus session');
      toast('Focus complete! '+minutes+' min','success');
    }
    PomoState.cycleCount++;
    if(PomoState.cycleCount%PomoState.cycles===0){
      PomoState.mode='longBreak';
      PomoState.totalSeconds=PomoState.longBreakMin*60;
    }else{
      PomoState.mode='break';
      PomoState.totalSeconds=PomoState.breakMin*60;
    }
  }else{
    PomoState.mode='work';
    PomoState.totalSeconds=PomoState.workMin*60;
    toast('Break over — time to focus!','info');
  }
  PomoState.secondsLeft=PomoState.totalSeconds;
  renderPage();
}

/* ================================================================
   ANALYTICS
   ================================================================ */
function render_analytics(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">📈</span>Analytics</div>';
  html+='<div class="page-desc">Performance insights across all courses</div></div>';
  html+='</div>';

  // Overall KPIs
  var totalScore=0,totalMax=0;
  State.grades.forEach(function(g){totalScore+=g.score;totalMax+=g.max});
  var overallAvg=totalMax>0?(totalScore/totalMax*100):0;
  var totalAttendance=State.attendance.length;
  var presentCount=State.attendance.filter(function(a){return a.status==='present'}).length;
  var attendancePct=totalAttendance>0?(presentCount/totalAttendance*100):0;
  var quizAvg=0;
  if(State.quizAttempts.length){
    quizAvg=State.quizAttempts.reduce(function(s,a){return s+a.score},0)/State.quizAttempts.length;
  }

  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-label">Overall Average</div><div class="kpi-value '+gradeClass(overallAvg)+'">'+overallAvg.toFixed(1)+'%</div><div class="kpi-hint">Grade '+grade(overallAvg)+'</div></div>';
  html+='<div class="kpi blue"><div class="kpi-label">Attendance</div><div class="kpi-value">'+attendancePct.toFixed(1)+'%</div></div>';
  html+='<div class="kpi green"><div class="kpi-label">Quiz Avg</div><div class="kpi-value '+gradeClass(quizAvg)+'">'+quizAvg.toFixed(1)+'%</div></div>';
  html+='<div class="kpi pink"><div class="kpi-label">Total Grades</div><div class="kpi-value">'+State.grades.length+'</div></div>';
  html+='</div>';

  // Charts
  html+='<div class="grid-2 mb-16">';
  html+='<div class="chart-box"><h3>📊 Average by Course</h3><canvas class="chart-canvas" id="anCourseChart"></canvas></div>';
  html+='<div class="chart-box"><h3>📈 Grade Distribution</h3><canvas class="chart-canvas" id="anGradeChart"></canvas></div>';
  html+='</div>';

  html+='<div class="grid-2 mb-16">';
  html+='<div class="chart-box"><h3>📉 Attendance Rate by Course</h3><canvas class="chart-canvas" id="anAttChart"></canvas></div>';
  html+='<div class="chart-box"><h3>🎯 Quiz Performance by Quiz</h3><canvas class="chart-canvas" id="anQuizChart"></canvas></div>';
  html+='</div>';

  // Top / Bottom students
  var studentPerf=State.students.map(function(s){
    var avg=studentAverage(s.id);
    return {student:s,avg:avg};
  }).sort(function(a,b){return b.avg-a.avg});

  html+='<div class="grid-2">';
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.85rem;margin-bottom:12px;font-family:var(--serif)">🏆 Top Performers</h3>';
  studentPerf.slice(0,5).forEach(function(sp,i){
    html+='<div class="stat-line" style="padding:8px 0">';
    html+='<div style="font-size:.72rem;font-weight:700;color:var(--c1);width:30px">#'+(i+1)+'</div>';
    html+='<div style="flex:1;font-size:.76rem">'+esc(sp.student.name)+'</div>';
    html+='<div class="'+gradeClass(sp.avg)+'">'+sp.avg.toFixed(1)+'%</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.85rem;margin-bottom:12px;font-family:var(--serif)">⚠️ Needs Support</h3>';
  studentPerf.slice(-5).reverse().forEach(function(sp){
    html+='<div class="stat-line" style="padding:8px 0">';
    html+='<div style="flex:1;font-size:.76rem">'+esc(sp.student.name)+'</div>';
    html+='<div class="'+gradeClass(sp.avg)+'">'+sp.avg.toFixed(1)+'%</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='</div>';

  return html;
}

function after_analytics(){
  var c1=$('anCourseChart');
  if(c1){
    var data=State.courses.map(function(c){return {x:c.code||c.name.slice(0,8),y:courseAverage(c.id),color:c.color}});
    drawBarChart(c1,data);
  }
  var c2=$('anGradeChart');
  if(c2){
    var buckets={'A':0,'B':0,'C':0,'D':0,'F':0};
    State.grades.forEach(function(g){
      var s=g.max>0?(g.score/g.max*100):0;
      buckets[grade(s)]++;
    });
    var arr=Object.keys(buckets).map(function(k,i){
      return {x:k,y:buckets[k],color:['#10b981','#06b6d4','#fbbf24','#fb923c','#f43f5e'][i]};
    });
    drawDonutChart(c2,arr,{label:String(State.grades.length),sub:'grades'});
  }
  var c3=$('anAttChart');
  if(c3){
    var data2=State.courses.map(function(c){
      return {x:c.code||c.name.slice(0,8),y:classAttendanceRate(c.id),color:c.color};
    });
    drawBarChart(c3,data2);
  }
  var c4=$('anQuizChart');
  if(c4){
    var data3=State.quizzes.map(function(q){
      var attempts=State.quizAttempts.filter(function(a){return a.quizId===q.id});
      var avg=0;
      if(attempts.length)avg=attempts.reduce(function(s,a){return s+a.score},0)/attempts.length;
      return {x:q.title.slice(0,10),y:avg};
    });
    drawBarChart(c4,data3,{color:'#a855f7'});
  }
}

/* ================================================================
   REPORTS (printable)
   ================================================================ */
function render_reports(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🖨</span>Reports</div>';
  html+='<div class="page-desc">Printable documents for parents and admin</div></div>';

function printWindow(html){
  var w=window.open('','_blank');
  if(!w){toast('Allow pop-ups to print','warn');return}
  w.document.write(html);
  w.document.close();
}
var PRINT_CSS='<style>body{font-family:Georgia,serif;padding:24px;color:#111;max-width:900px;margin:0 auto;font-size:12px}h1{font-size:22px;border-bottom:3px solid #333;padding-bottom:8px;margin-bottom:16px}h2{font-size:14px;margin:16px 0 8px;color:#333}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:11px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#f0f0f0;font-weight:700}.num{text-align:right;font-family:monospace}.hdr{display:flex;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #333}.footer{margin-top:24px;padding-top:12px;border-top:1px solid #ccc;text-align:center;font-size:9px;color:#666}.noprint{text-align:center;margin:20px 0}.noprint button{padding:10px 24px;font-size:14px;cursor:pointer;background:#333;color:#fff;border:none;border-radius:6px}@media print{.noprint{display:none}body{padding:12px}}</style>';

function printReportCards(){
  var html='<html><head><title>Report Cards</title>'+PRINT_CSS+'</head><body>';
  html+='<div class="noprint"><button onclick="window.print()">🖨 Print Report Cards</button></div>';
  State.students.forEach(function(s,idx){
    if(idx>0)html+='<div style="page-break-before:always"></div>';
    html+='<h1>Report Card — '+esc(s.name)+'</h1>';
    html+='<div style="font-size:11px;color:#666;margin-bottom:14px">'+esc(State.settings.schoolName)+' · '+esc(s.studentId)+' · Grade '+esc(s.grade)+'</div>';
    html+='<table><thead><tr><th>Course</th><th>Code</th><th class="num">Average</th><th class="num">Attendance</th><th>Grade</th></tr></thead><tbody>';
    (s.courses||[]).forEach(function(cid){
      var c=findCourse(cid);
      if(!c)return;
      var avg=studentAverage(s.id,cid);
      var att=attendanceRate(s.id,cid);
      html+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.code)+'</td><td class="num">'+avg.toFixed(1)+'%</td><td class="num">'+att.toFixed(1)+'%</td><td><strong>'+grade(avg)+'</strong></td></tr>';
    });
    html+='</tbody></table>';
    var overall=studentAverage(s.id);
    html+='<p style="margin-top:16px;font-size:13px"><strong>Overall GPA:</strong> '+overall.toFixed(1)+'% ('+grade(overall)+')</p>';
  });
  html+='<div class="footer">Generated by EduForge · '+new Date().toLocaleDateString()+'</div>';
  html+='</body></html>';
  printWindow(html);
}

function printClassRoster(){
  var html='<html><head><title>Class Roster</title>'+PRINT_CSS+'</head><body>';
  html+='<div class="noprint"><button onclick="window.print()">🖨 Print Roster</button></div>';

function printGradeSheet(){
  var course=findCourse(GradebookFilter.course)||State.courses[0];
  if(!course){toast('No course','warn');return}
  var students=studentsInCourse(course.id);
  var html='<html><head><title>Grade Sheet</title>'+PRINT_CSS+'</head><body>';
  html+='<div class="noprint"><button onclick="window.print()">🖨 Print Grade Sheet</button></div>';
  html+='<h1>Grade Sheet — '+esc(course.name)+'</h1>';
  html+='<div style="font-size:11px;color:#666;margin-bottom:10px">'+esc(course.code)+'</div>';
  html+='<table><thead><tr><th>Student</th><th class="num">Quiz</th><th class="num">HW</th><th class="num">Test</th><th class="num">Project</th><th class="num">Overall</th><th>Grade</th></tr></thead><tbody>';
  students.forEach(function(s){
    var cats={Quiz:[],Homework:[],Test:[],Project:[]};
    State.grades.filter(function(g){return g.studentId===s.id&&g.courseId===course.id}).forEach(function(g){
      if(cats[g.category])cats[g.category].push(g);
    });
    function ca(name){
      var list=cats[name];
      if(!list.length)return '—';
      var t=0,m=0;
      list.forEach(function(g){t+=g.score;m+=g.max});
      return m>0?(t/m*100).toFixed(1)+'%':'—';
    }
    var overall=studentAverage(s.id,course.id);
    html+='<tr><td>'+esc(s.name)+'</td><td class="num">'+ca('Quiz')+'</td><td class="num">'+ca('Homework')+'</td><td class="num">'+ca('Test')+'</td><td class="num">'+ca('Project')+'</td><td class="num"><strong>'+overall.toFixed(1)+'%</strong></td><td><strong>'+grade(overall)+'</strong></td></tr>';
  });
  html+='</tbody></table>';
  html+='<div class="footer">Generated by EduForge</div>';
  html+='</body></html>';
  printWindow(html);
}

function setThemeOption(t){
  State.settings.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  saveState();renderPage();
}
function saveSettings(){
  State.settings.schoolName=$('setSchool').value.trim();
  State.settings.teacherName=$('setTeacher').value.trim();
  State.settings.period=safeInt($('setYear').value,2024);
  saveState();
  renderUserBadge();
  toast('Settings saved','success');
  renderPage();
}
function exportData(){
  var json=JSON.stringify(State,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='eduforge-backup-'+today()+'.json';
  a.click();
  toast('Exported ('+(json.length/1024).toFixed(1)+' KB)','success');
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!confirm('Replace all current data?'))return;
        Object.keys(State).forEach(function(k){
          if(data[k]!==undefined)State[k]=data[k];
        });
        saveState();renderNav();renderPage();
        toast('Imported successfully','success');
      }catch(e){toast('Import failed: '+e.message,'error')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm('Delete ALL data? This cannot be undone.'))return;
  if(!confirm('Are you absolutely sure?'))return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function showAlerts(){
  var alerts=[];
  var overdueAssignments=State.assignments.filter(function(a){return daysBetween(today(),a.dueDate)<0});

  var dueCards=State.flashcards.filter(function(c){return !c.due||c.due<=today()});
  if(dueCards.length>0)alerts.push({icon:'🎴',title:dueCards.length+' flashcards due for review',route:'flashcards'});
  var lowPerf=State.students.filter(function(s){return studentAverage(s.id)>0&&studentAverage(s.id)<60});
  if(lowPerf.length)alerts.push({icon:'⚠️',title:lowPerf.length+' students need support (below 60%)',route:'analytics'});
  var lowAtt=State.students.filter(function(s){return attendanceRate(s.id)<80});
  if(lowAtt.length)alerts.push({icon:'📅',title:lowAtt.length+' students with low attendance',route:'attendance'});
  var upcoming=State.events.filter(function(e){return e.date===today()});
  if(upcoming.length)alerts.push({icon:'📅',title:upcoming.length+' events today',route:'calendar'});

  var body='';
  if(!alerts.length){
    body='<div class="empty"><span class="icon">✓</span><h4>All clear</h4><p>No pending alerts.</p></div>';
  }else{
    alerts.forEach(function(a){
      body+='<div class="stat-line" style="cursor:pointer;padding:12px 0" onclick="closeModal();navigate(\''+a.route+'\')">';

    var c=$('sbClose');

  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.key==='?'){
      e.preventDefault();
      openHelp();
    }
  });
  renderNav();
  renderPage();
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  window.addEventListener('beforeunload',saveState);
  setTimeout(function(){toast('📚 EduForge ready','success')},400);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
</body>
</html>
