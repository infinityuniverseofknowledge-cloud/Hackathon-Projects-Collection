<!DOCTYPE html>
<html lang="en" data-theme="academic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0a14">
<title>EDUFORGE — Learning Management System</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#0d0a14;--bg2:#120e1c;--bg3:#1a1428;--bg4:#241c3c;
  --panel:#110d1c;--panel2:#19132a;--panel3:#241b3e;--panel4:#322654;
  --bd:#251b40;--bd2:#382a58;--bd3:#4c3d78;
  --tx:#f0e8ff;--tx2:#a89bd4;--tx3:#7060a0;--mu:#4a3c7c;
  --c1:#fbbf24;--c1h:#ffd770;--c1l:#c89000;
  --c2:#3b82f6;--c2h:#70a8ff;--c2l:#1e56c0;
  --c3:#10b981;--c3h:#60e0a8;--c3l:#008050;
  --c4:#f43f5e;--c4h:#ff80a0;--c4l:#c01840;
  --c5:#a855f7;--c5h:#d0a0ff;--c5l:#7c3aed;
  --c6:#06b6d4;--c6h:#60d8ec;--c6l:#008098;
  --c7:#ec4899;--c7h:#ff80b8;--c7l:#b82070;
  --c8:#84cc16;--c8h:#b0e050;--c8l:#5c8000;
  --ok:#10b981;--warn:#fbbf24;--err:#f43f5e;--info:#3b82f6;
  --g1:linear-gradient(135deg,#fbbf24,#ec4899);
  --g2:linear-gradient(135deg,#3b82f6,#a855f7);
  --g3:linear-gradient(135deg,#10b981,#06b6d4);
  --g4:linear-gradient(135deg,#f43f5e,#fbbf24);
  --gHolo:linear-gradient(120deg,#fbbf24,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.6);
  --sh2:0 4px 16px rgba(0,0,0,.75);
  --sh3:0 8px 32px rgba(0,0,0,.85);
  --shGlow:0 0 24px rgba(251,191,36,.35);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --serif:'Georgia','Times New Roman',serif;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f8f6fb;--bg2:#f0ecf6;--bg3:#e6e0ee;--bg4:#d6cde2;
  --panel:#ffffff;--panel2:#f8f6fb;--panel3:#f0ecf6;--panel4:#e0d8ec;
  --bd:#e0d8ec;--bd2:#b8a8d0;--bd3:#9078b0;
  --tx:#1a0e2c;--tx2:#403060;--tx3:#605088;--mu:#9080b8;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
}
[data-theme="paper"]{
  --bg:#f5f1e4;--bg2:#ede6d0;--bg3:#e0d6ba;--bg4:#c8bda0;
  --panel:#faf7ec;--panel2:#f5f1e4;--panel3:#ede6d0;--panel4:#d8ceb4;
  --bd:#d8ceb4;--bd2:#b8ae90;--bd3:#908868;
  --tx:#2a2010;--tx2:#544838;--tx3:#786850;--mu:#a89880;
  --c1:#b45309;--c1h:#d97706;--c1l:#78350f;
  --c2:#1e40af;--c5:#7c3aed;
}
[data-theme="night"]{
  --bg:#0a0e1a;--bg2:#0e1426;--bg3:#141c34;--bg4:#1c2648;
  --panel:#0c1222;--panel2:#141c34;--panel3:#1c2648;--panel4:#28365c;
  --bd:#1c2648;--bd2:#28365c;--bd3:#3c4e80;
  --tx:#e0e8ff;--tx2:#a0b0d8;--tx3:#6070a0;--mu:#384878;
  --c1:#60a5fa;--c1h:#93c5fd;--c1l:#2563eb;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--gHolo);background-size:300% auto;
  animation:holoShift 5s linear infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;box-shadow:var(--shGlow);
}
@keyframes holoShift{0%{background-position:0% center}100%{background-position:300% center}}
.sb-title{
  font-weight:800;font-size:.98rem;letter-spacing:1.5px;line-height:1;
  background:var(--gHolo);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:holoShift 6s linear infinite;
}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-user{
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);
  display:flex;gap:10px;align-items:center;cursor:pointer;transition:var(--t);
}
.sb-user:hover{background:var(--bg3)}
.sb-user .avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--g2);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;flex-shrink:0;
}
.sb-user .info{flex:1;min-width:0}
.sb-user .name{font-size:.76rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .role{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(251,191,36,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c4);color:#fff;
  min-width:16px;text-align:center;font-family:var(--mono);
}
.nav-item.active .ni-badge{background:rgba(0,0,0,.3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.98rem;flex-shrink:0;font-family:var(--serif);letter-spacing:.3px}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:8px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:4px;right:4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--c4);color:#fff;border-radius:var(--rf);
  font-size:.55rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;font-family:var(--serif)}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g1);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(251,191,36,.35);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(251,191,36,.4)}
.btn.blue{background:var(--g2);color:#fff;border-color:transparent}
.btn.green{background:var(--g3);color:#fff;border-color:transparent}
.btn.danger{background:var(--c4);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:11px}
.card.glow{border-color:var(--c1);box-shadow:var(--shGlow),var(--sh1)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:18px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.blue::before{background:var(--g2)}
.kpi.green::before{background:var(--g3)}
.kpi.pink::before{background:var(--g4)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;
}
.kpi-value{
  font-size:1.5rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;color:var(--tx);
}
.kpi-value.warn{color:var(--c1)}
.kpi-value.good{color:var(--c3)}
.kpi-value.bad{color:var(--c4)}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:6px;line-height:1.4}

.table-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700;font-family:var(--serif)}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:10px 14px;text-align:left;
  font-size:.6rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.7px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{padding:11px 14px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;white-space:nowrap;
}
.badge.ok{background:rgba(16,185,129,.18);color:var(--c3);border:1px solid rgba(16,185,129,.35)}
.badge.warn{background:rgba(251,191,36,.18);color:var(--c1);border:1px solid rgba(251,191,36,.35)}
.badge.err{background:rgba(244,63,94,.18);color:var(--c4);border:1px solid rgba(244,63,94,.35)}
.badge.info{background:rgba(59,130,246,.18);color:var(--c2);border:1px solid rgba(59,130,246,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}
.badge.purple{background:rgba(168,85,247,.18);color:var(--c5);border:1px solid rgba(168,85,247,.35)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field label .req{color:var(--c4);margin-left:3px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(251,191,36,.15);
}
.field textarea{resize:vertical;min-height:70px;font-family:inherit;line-height:1.5}
.field small{font-size:.63rem;color:var(--tx3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row.three{grid-template-columns:1fr 1fr 1fr;gap:12px}

.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.8);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700;font-family:var(--serif)}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--c3)}
.toast.error{border-left-color:var(--c4)}
.toast.warn{border-left-color:var(--c1)}
.toast.info{border-left-color:var(--c2)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

.chart-box{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px;font-family:var(--serif)}
.chart-canvas{width:100%;height:220px;display:block}

.empty{
  text-align:center;padding:44px 20px;color:var(--tx3);font-size:.78rem;
}
.empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:5px;font-weight:600;font-family:var(--serif)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.66rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}

.divider{height:1px;background:var(--bd);margin:14px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.74rem;gap:10px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.entity-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  cursor:pointer;transition:var(--t);
  position:relative;overflow:hidden;
}
.entity-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.entity-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;bottom:0;
  background:var(--c1);
}
.entity-card.course::before{background:var(--c2)}
.entity-card.student::before{background:var(--c3)}
.entity-card.quiz::before{background:var(--c5)}
.entity-card.pink::before{background:var(--c7)}
.ec-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.ec-title{font-weight:700;font-size:.9rem;line-height:1.3;color:var(--tx);font-family:var(--serif)}
.ec-meta{font-size:.66rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.ec-desc{font-size:.74rem;color:var(--tx2);line-height:1.55;margin-bottom:12px;flex:1}
.ec-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--bd);
  font-size:.66rem;color:var(--tx3);gap:8px;flex-wrap:wrap;
}

.progress{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--g1);transition:width .5s;border-radius:4px}

.mono{font-family:var(--mono)}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}

/* Quiz-specific */
.quiz-question{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
.quiz-question .qq-num{

<script>
"use strict";

function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function today(){return new Date().toISOString().slice(0,10)}
function nowISO(){return new Date().toISOString()}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function addDays(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function lastNDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function safeFloat(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}
function uniq(a){var s={};return a.filter(function(x){if(s[x])return false;s[x]=1;return true})}
function pct(v,total){return total>0?(v/total*100):0}
function grade(score){
  if(score>=90)return 'A';
  if(score>=80)return 'B';
  if(score>=70)return 'C';
  if(score>=60)return 'D';
  return 'F';
}
function gradeClass(score){
  var g=grade(score);
  return 'grade-'+g;
}
function fmtScore(n){return (Number(n)||0).toFixed(1)+'%'}

function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ'};
  var t=document.createElement('div');
  t.className='toast '+type;
  t.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t);
  setTimeout(function(){
    t.classList.add('leaving');
    setTimeout(function(){t.remove()},320);
  },2800);
}

function openModal(o){
  o=o||{};

  box.className='modal-box'+(o.wide?' wide':'')+(o.narrow?' narrow':'');

  $('modalFoot').innerHTML=o.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(o.onOpen)setTimeout(o.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}

    var raw=localStorage.getItem(STORAGE_KEY);

    var d=JSON.parse(raw);
    Object.keys(State).forEach(function(k){if(d[k]!==undefined)State[k]=d[k]});
    return true;
  }catch(e){return false}
}

/* ================================================================
   HELPERS
   ================================================================ */
function findCourse(id){return State.courses.find(function(c){return c.id===id})}
function findStudent(id){return State.students.find(function(s){return s.id===id})}
function findQuiz(id){return State.quizzes.find(function(q){return q.id===id})}
function findAssignment(id){return State.assignments.find(function(a){return a.id===id})}

function studentsInCourse(courseId){
  return State.students.filter(function(s){return (s.courses||[]).indexOf(courseId)!==-1});
}
function studentAverage(studentId,courseId){
  var grades=State.grades.filter(function(g){
    if(g.studentId!==studentId)return false;
    if(courseId&&g.courseId!==courseId)return false;
    return true;
  });
  if(!grades.length)return 0;
  var total=0,max=0;
  grades.forEach(function(g){total+=g.score;max+=g.max});
  return max>0?(total/max*100):0;
}
function courseAverage(courseId){
  var students=studentsInCourse(courseId);
  if(!students.length)return 0;
  var sum=0,count=0;
  students.forEach(function(s){
    var avg=studentAverage(s.id,courseId);
    if(avg>0){sum+=avg;count++}
  });
  return count>0?(sum/count):0;
}
function attendanceRate(studentId,courseId){
  var records=State.attendance.filter(function(a){
    if(a.studentId!==studentId)return false;
    if(courseId&&a.courseId!==courseId)return false;
    return true;
  });
  if(!records.length)return 100;
  var present=records.filter(function(r){return r.status==='present'}).length;
  var late=records.filter(function(r){return r.status==='late'}).length;
  return ((present+late*0.5)/records.length)*100;
}
function classAttendanceRate(courseId){
  var students=studentsInCourse(courseId);
  if(!students.length)return 100;
  var sum=0;
  students.forEach(function(s){sum+=attendanceRate(s.id,courseId)});
  return sum/students.length;
}

function dueCards(){
  var t=today();
  return State.flashcards.filter(function(c){return !c.due||c.due<=t});
}
function reviewCard(id,rating){
  var c=State.flashcards.find(function(x){return x.id===id});
  if(!c)return;
  c.reps=(c.reps||0)+1;
  c.lastReview=nowISO();
  // Rating: 0=again, 1=hard, 2=good, 3=easy
  if(rating===0){
    c.lapses=(c.lapses||0)+1;
    c.ease=Math.max(1.3,(c.ease||2.5)-0.2);
    c.interval=0;
    c.due=today();
  }else if(rating===1){
    c.ease=Math.max(1.3,(c.ease||2.5)-0.15);
    c.interval=c.interval===0?1:Math.max(1,c.interval*1.2);
    c.due=addDays(today(),Math.round(c.interval));
  }else if(rating===2){
    if(!c.interval||c.interval<1)c.interval=1;
    else if(c.interval===1)c.interval=3;
    else c.interval=Math.round(c.interval*(c.ease||2.5));
    c.due=addDays(today(),c.interval);
  }else{
    c.ease=(c.ease||2.5)+0.15;
    c.interval=c.interval===0?3:Math.round(c.interval*c.ease*1.3);
    c.due=addDays(today(),c.interval);
  }
  saveState();
}

function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=42,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.max(max,1);
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*(max/4))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7,gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    var color=d.color||opts.color||'#fbbf24';
    var grad=ctx.createLinearGradient(x,y,x,padT+cH);
    grad.addColorStop(0,color);
    grad.addColorStop(1,color+'40');
    ctx.fillStyle=grad;
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);ctx.lineTo(x,padT+cH);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>8)label=label.slice(0,7)+'…';
    ctx.fillText(label,x+bw/2,H-10);
  });
}

function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*((max-min)/4))),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    ctx.fillText(d.x,padL+(i/(len-1||1))*cW,H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#fbbf24','#3b82f6','#10b981','#a855f7','#f43f5e'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);ctx.lineTo(padL,padT+cH);
      ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    }
    ctx.beginPath();
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      ctx.moveTo(x,y);ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=color;ctx.fill();
  });
}

function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-24;
  var inner=r*0.6;
  var start=-Math.PI/2;
  var colors=['#fbbf24','#3b82f6','#10b981','#a855f7','#f43f5e','#06b6d4','#ec4899','#84cc16'];
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||colors[i%colors.length];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(opts.label||String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.sub||'',cx,cy+18);
}

function after_dashboard(){
  var c1=$('dashCourseChart');
  if(c1){
    var data=State.courses.map(function(c){
      return {x:c.code||c.name.slice(0,8),y:courseAverage(c.id),color:c.color};
    });
    drawBarChart(c1,data);
  }
  var c2=$('dashGradeChart');
  if(c2){
    var buckets={'A (90+)':0,'B (80-89)':0,'C (70-79)':0,'D (60-69)':0,'F (<60)':0};
    State.grades.forEach(function(g){
      var score=g.max>0?(g.score/g.max*100):0;
      if(score>=90)buckets['A (90+)']++;
      else if(score>=80)buckets['B (80-89)']++;
      else if(score>=70)buckets['C (70-79)']++;
      else if(score>=60)buckets['D (60-69)']++;
      else buckets['F (<60)']++;
    });
    var arr=Object.keys(buckets).map(function(k,i){
      return {x:k,y:buckets[k],color:['#10b981','#06b6d4','#fbbf24','#fb923c','#f43f5e'][i]};
    });
    drawDonutChart(c2,arr,{label:String(State.grades.length),sub:'grades'});
  }
}

<script>
"use strict";

var GradebookFilter={course:''};

function render_gradebook(){
  if(!GradebookFilter.course&&State.courses.length){
    GradebookFilter.course=State.courses[0].id;
  }
  var course=findCourse(GradebookFilter.course);
  var students=course?studentsInCourse(course.id):[];

  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">📊</span>Gradebook</div>';
  html+='<div class="page-desc">Weighted grade calculations</div></div>';
  html+='<button class="btn primary" onclick="addGrade()">+ Add Grade</button>';
  html+='</div>';

  html+='<div class="card pad-sm mb-16">';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';

  State.courses.forEach(function(c){
    html+='<option value="'+c.id+'"'+(GradebookFilter.course===c.id?' selected':'')+'>'+esc(c.name)+' ('+esc(c.code)+')</option>';
  });

    var avg=courseAverage(course.id);
    html+='<span style="font-size:.72rem;color:var(--tx2)">Class Avg: <strong class="'+gradeClass(avg)+'">'+avg.toFixed(1)+'%</strong></span>';
  }
  html+='</div></div>';

  if(!students.length){
    html+='<div class="empty"><span class="icon">📊</span><h4>No students in this course</h4></div>';
    return html;
  }

  // Grade distribution chart
  html+='<div class="grid-2 mb-16">';
  html+='<div class="chart-box"><h3>Grade Distribution</h3><canvas class="chart-canvas" id="gbDistChart"></canvas></div>';
  html+='<div class="chart-box"><h3>Grade Categories</h3><canvas class="chart-canvas" id="gbCatChart"></canvas></div>';
  html+='</div>';

  // Table
  html+='<div class="table-wrap"><div class="table-head"><h3>'+esc(course.name)+' — Gradebook</h3>';
  html+='<button class="btn ghost sm" onclick="exportGradesCSV()">📥 CSV</button></div>';
  html+='<div class="table-scroll"><table>';
  html+='<thead><tr><th>Student</th><th class="num">Quiz Avg</th><th class="num">Homework Avg</th><th class="num">Test Avg</th><th class="num">Overall</th><th>Grade</th><th class="num">Attendance</th><th></th></tr></thead><tbody>';
  students.forEach(function(s){
    var cats={Quiz:[],Homework:[],Test:[],Project:[],Participation:[],Lab:[],Essay:[]};
    State.grades.filter(function(g){return g.studentId===s.id&&g.courseId===course.id}).forEach(function(g){
      if(!cats[g.category])cats[g.category]=[];
      cats[g.category].push(g);
    });
    function catAvg(name){
      var list=cats[name]||[];
      if(!list.length)return null;
      var t=0,m=0;
      list.forEach(function(g){t+=g.score;m+=g.max});
      return m>0?(t/m*100):0;
    }
    var quizAvg=catAvg('Quiz');
    var hwAvg=catAvg('Homework');
    var testAvg=catAvg('Test');
    var overall=studentAverage(s.id,course.id);
    var att=attendanceRate(s.id,course.id);
    html+='<tr onclick="viewStudentGrades(\''+s.id+'\',\''+course.id+'\')" style="cursor:pointer">';
    html+='<td><strong>'+esc(s.name)+'</strong></td>';
    html+='<td class="num '+(quizAvg!==null?gradeClass(quizAvg):'')+'">'+(quizAvg!==null?quizAvg.toFixed(1)+'%':'—')+'</td>';
    html+='<td class="num '+(hwAvg!==null?gradeClass(hwAvg):'')+'">'+(hwAvg!==null?hwAvg.toFixed(1)+'%':'—')+'</td>';
    html+='<td class="num '+(testAvg!==null?gradeClass(testAvg):'')+'">'+(testAvg!==null?testAvg.toFixed(1)+'%':'—')+'</td>';
    html+='<td class="num '+gradeClass(overall)+'"><strong>'+overall.toFixed(1)+'%</strong></td>';
    html+='<td><span class="badge '+(overall>=70?'ok':overall>=60?'warn':'err')+'">'+grade(overall)+'</span></td>';
    html+='<td class="num">'+att.toFixed(1)+'%</td>';
    html+='<td class="actions"><button class="btn ghost xs" onclick="event.stopPropagation();addGradeFor(\''+s.id+'\',\''+course.id+'\')">+</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';

  return html;
}

function after_gradebook(){
  var course=findCourse(GradebookFilter.course);
  if(!course)return;
  var students=studentsInCourse(course.id);
  var c1=$('gbDistChart');
  if(c1){
    var buckets={'A':0,'B':0,'C':0,'D':0,'F':0};
    students.forEach(function(s){
      var avg=studentAverage(s.id,course.id);
      var g=grade(avg);
      buckets[g]++;
    });
    var arr=Object.keys(buckets).map(function(k,i){
      return {x:k,y:buckets[k],color:['#10b981','#06b6d4','#fbbf24','#fb923c','#f43f5e'][i]};
    });
    drawBarChart(c1,arr);
  }
  var c2=$('gbCatChart');
  if(c2){
    var catTotals={};
    State.grades.filter(function(g){return g.courseId===course.id}).forEach(function(g){
      if(!catTotals[g.category])catTotals[g.category]={t:0,m:0};
      catTotals[g.category].t+=g.score;
      catTotals[g.category].m+=g.max;
    });
    var arr2=Object.keys(catTotals).map(function(k,i){
      return {x:k,y:catTotals[k].m>0?(catTotals[k].t/catTotals[k].m*100):0};
    }).sort(function(a,b){return b.y-a.y});
    var colors=['#fbbf24','#3b82f6','#10b981','#a855f7','#f43f5e','#06b6d4','#ec4899'];
    arr2.forEach(function(d,i){d.color=colors[i%colors.length]});
    drawBarChart(c2,arr2);
  }
}

function addGrade(){
  if(!GradebookFilter.course){toast('Select a course first','warn');return}
  addGradeFor(null,GradebookFilter.course);
}
function addGradeFor(studentId,courseId){
  var students=studentIdsInCourse(courseId);
  if(!students.length){toast('No students in course','warn');return}
  var studentOpts=students.map(function(s){
    return '<option value="'+s.id+'"'+(s.id===studentId?' selected':'')+'>'+esc(s.name)+'</option>';
  }).join('');
  var cats=['Quiz','Homework','Test','Project','Participation','Lab','Essay'];
  openModal({
    title:'Add Grade',
    body:'<div class="field"><label>Student</label><select id="gStudent">'+studentOpts+'</select></div>'+
      '<div class="field-row">'+
      '<div class="field"><label>Category</label><select id="gCat">'+cats.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label>Name</label><input id="gName" placeholder="e.g. Chapter 3 Quiz"></div>'+
      '</div>'+
      '<div class="field-row">'+
      '<div class="field"><label>Score</label><input type="number" id="gScore" value="85" step="0.1"></div>'+
      '<div class="field"><label>Out of</label><input type="number" id="gMax" value="100" step="0.1"></div>'+
      '</div>'+
      '<div class="field"><label>Date</label><input type="date" id="gDate" value="'+today()+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveG">Save</button>',
    onOpen:function(){
      $('gScore').focus();$('gScore').select();
      $('saveG').onclick=function(){
        var score=parseFloat($('gScore').value);
        var max=parseFloat($('gMax').value);
        if(isNaN(score)||isNaN(max)||max<=0){toast('Invalid scores','error');return}
        var cat=$('gCat').value;
        var name=$('gName').value.trim()||(cat+' assignment');
        State.grades.push({
          id:uid('g'),
          studentId:$('gStudent').value,
          courseId:courseId,
          category:cat,
          name:name,
          score:score,
          max:max,
          date:$('gDate').value,
          createdAt:nowISO()
        });
        logActivity('grade','Added '+cat+': '+name);
        saveState();closeModal();renderPage();
        toast('Grade added','success');
      };
    }
  });
}
function studentIdsInCourse(courseId){
  return State.students.filter(function(s){return (s.courses||[]).indexOf(courseId)!==-1});
}

function viewStudentGrades(studentId,courseId){
  var s=findStudent(studentId);
  var c=findCourse(courseId);
  if(!s||!c)return;
  var grades=State.grades.filter(function(g){return g.studentId===studentId&&g.courseId===courseId});
  var avg=studentAverage(studentId,courseId);
  var body='<div class="kpi-grid" style="margin-bottom:16px">';
  body+='<div class="kpi"><div class="kpi-label">Overall</div><div class="kpi-value '+gradeClass(avg)+'">'+avg.toFixed(1)+'%</div><div class="kpi-hint">Grade '+grade(avg)+'</div></div>';
  body+='<div class="kpi blue"><div class="kpi-label">Grades</div><div class="kpi-value">'+grades.length+'</div></div>';
  body+='</div>';
  if(grades.length){
    body+='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Name</th><th class="num">Score</th><th class="num">%</th><th></th></tr></thead><tbody>';
    grades.sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(g){
      var pct=g.max>0?(g.score/g.max*100):0;
      body+='<tr><td>'+fmtDateShort(g.date)+'</td><td><span class="badge neutral">'+esc(g.category)+'</span></td>';
      body+='<td>'+esc(g.name)+'</td>';
      body+='<td class="num">'+g.score+' / '+g.max+'</td>';
      body+='<td class="num '+gradeClass(pct)+'">'+pct.toFixed(1)+'%</td>';
      body+='<td class="actions"><button class="btn ghost xs" onclick="deleteGrade(\''+g.id+'\')" style="color:var(--c4)">🗑</button></td></tr>';
    });
    body+='</tbody></table></div>';
  }else{
    body+='<div class="empty"><p>No grades recorded yet.</p></div>';
  }
  openModal({
    title:s.name+' — '+c.name,
    wide:true,
    body:body,
    foot:'<button class="btn" onclick="closeModal()">Close</button>'+
         '<button class="btn primary" onclick="closeModal();addGradeFor(\''+studentId+'\',\''+courseId+'\')">+ Add Grade</button>'
  });
}
function deleteGrade(id){
  State.grades=State.grades.filter(function(x){return x.id!==id});
  saveState();closeModal();renderPage();
  toast('Grade removed','info');
}
function exportGradesCSV(){
  var course=findCourse(GradebookFilter.course);
  if(!course)return;
  var students=studentsInCourse(course.id);
  var rows=[['Student ID','Name','Quiz Avg','HW Avg','Test Avg','Overall','Grade','Attendance']];
  students.forEach(function(s){
    var cats={Quiz:[],Homework:[],Test:[]};
    State.grades.filter(function(g){return g.studentId===s.id&&g.courseId===course.id}).forEach(function(g){
      if(cats[g.category])cats[g.category].push(g);
    });
    function ca(name){
      var list=cats[name];
      if(!list.length)return '';
      var t=0,m=0;
      list.forEach(function(g){t+=g.score;m+=g.max});
      return m>0?(t/m*100).toFixed(1):'';
    }
    var overall=studentAverage(s.id,course.id);
    rows.push([s.studentId,s.name,ca('Quiz'),ca('Homework'),ca('Test'),overall.toFixed(1),grade(overall),attendanceRate(s.id,course.id).toFixed(1)]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='grades-'+course.code+'-'+today()+'.csv';

function setAttendance(studentId,courseId,date,status){
  var record=State.attendance.find(function(a){return a.studentId===studentId&&a.courseId===courseId&&a.date===date});
  if(record){
    record.status=status;
  }else{
    State.attendance.push({
      id:uid('att'),
      studentId:studentId,
      courseId:courseId,
      date:date,
      status:status,
      notes:''
    });
  }
  saveState();
  renderPage();
}
function setAttendanceNote(studentId,courseId,date,note){
  var record=State.attendance.find(function(a){return a.studentId===studentId&&a.courseId===courseId&&a.date===date});
  if(record){
    record.notes=note;
  }else{
    State.attendance.push({
      id:uid('att'),
      studentId:studentId,
      courseId:courseId,
      date:date,
      status:'present',
      notes:note
    });
  }
  saveState();
}
function markAllPresent(){
  var course=findCourse(AttendanceFilter.course);
  if(!course)return;
  var date=AttendanceFilter.date;
  var students=studentsInCourse(course.id);
  students.forEach(function(s){
    var record=State.attendance.find(function(a){return a.studentId===s.id&&a.courseId===course.id&&a.date===date});
    if(record)record.status='present';
    else State.attendance.push({id:uid('att'),studentId:s.id,courseId:course.id,date:date,status:'present',notes:''});
  });
  logActivity('attendance','Marked all present: '+course.name);
  saveState();renderPage();
  toast('All marked present','success');
}
function exportAttendanceCSV(){
  var course=findCourse(AttendanceFilter.course);
  if(!course)return;
  var students=studentsInCourse(course.id);
  var rows=[['Student ID','Name','Present','Late','Absent','Excused','Attendance %']];
  students.forEach(function(s){
    var records=State.attendance.filter(function(a){return a.studentId===s.id&&a.courseId===course.id});
    var present=records.filter(function(r){return r.status==='present'}).length;
    var late=records.filter(function(r){return r.status==='late'}).length;
    var absent=records.filter(function(r){return r.status==='absent'}).length;
    var excused=records.filter(function(r){return r.status==='excused'}).length;
    rows.push([s.studentId,s.name,present,late,absent,excused,attendanceRate(s.id,course.id).toFixed(1)]);
  });
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='attendance-'+course.code+'-'+today()+'.csv';
  a.click();
  toast('CSV exported','success');
}

    foot:(id?'<button class="btn danger" onclick="deleteAssignment(\''+id+'\')">Delete</button>':'')+
         '<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveA">Save</button>',
    onOpen:function(){
      $('aTitle').focus();
      $('saveA').onclick=function(){
        var title=$('aTitle').value.trim();
        if(!title){toast('Title required','error');return}
        var data={
          title:title,
          courseId:$('aCourse').value,
          description:$('aDesc').value.trim(),
          dueDate:$('aDue').value,
          points:safeInt($('aPoints').value,100),
          category:$('aCat').value
        };
        if(id)Object.assign(a,data);
        else{data.id=uid('asg');data.createdAt=nowISO();State.assignments.push(data)}
        logActivity('assignment',(id?'Updated':'Created')+' assignment: '+title);
        saveState();closeModal();renderNav();renderPage();
        toast('Saved','success');
      };
    }
  });
}
function viewAssignment(id){
  var a=findAssignment(id);
  if(!a)return;
  var c=findCourse(a.courseId);
  var d=daysBetween(today(),a.dueDate);
  var body='<div class="card pad-lg mb-16">';
  body+='<div style="font-family:var(--serif);font-size:1.05rem;font-weight:700;margin-bottom:8px">'+esc(a.title)+'</div>';
  body+='<div style="font-size:.75rem;color:var(--tx2);line-height:1.7;margin-bottom:12px">'+esc(a.description||'No description.')+'</div>';
  body+='<div class="stat-line"><span class="sl-label">Course</span><span class="sl-value" style="font-family:inherit;font-weight:600">'+(c?esc(c.name):'—')+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Due</span><span class="sl-value">'+fmtDate(a.dueDate)+' ('+(d<0?Math.abs(d)+'d overdue':d===0?'today':'in '+d+'d')+')</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Points</span><span class="sl-value">'+a.points+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Category</span><span class="sl-value">'+esc(a.category)+'</span></div>';
  body+='</div>';
  openModal({
    title:'Assignment Details',
    wide:true,
    body:body,
    foot:'<button class="btn" onclick="closeModal()">Close</button>'+
         '<button class="btn primary" onclick="closeModal();editAssignment(\''+id+'\')">✏️ Edit</button>'
  });
}
function deleteAssignment(id){
  State.assignments=State.assignments.filter(function(a){return a.id!==id});
  saveState();closeModal();renderNav();renderPage();
  toast('Assignment deleted','info');
}
</script>
<script>
"use strict";

/* ================================================================
   QUIZZES
   ================================================================ */
function render_quizzes(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🎯</span>Quizzes</div>';
  html+='<div class="page-desc">'+State.quizzes.length+' quizzes ready to take</div></div>';
  html+='<button class="btn primary" onclick="editQuiz(null)">+ New Quiz</button>';
  html+='</div>';

  if(!State.quizzes.length){
    html+='<div class="empty"><span class="icon">🎯</span><h4>No quizzes yet</h4></div>';
    return html;
  }

  html+='<div class="card-grid">';
  State.quizzes.forEach(function(q){
    var c=findCourse(q.courseId);
    var totalPoints=q.questions.reduce(function(s,qq){return s+(qq.points||1)},0);
    var attempts=State.quizAttempts.filter(function(a){return a.quizId===q.id});
    var avg=0;
    if(attempts.length){
      var sum=0;
      attempts.forEach(function(a){sum+=a.score});
      avg=sum/attempts.length;
    }
    html+='<div class="entity-card quiz" style="border-left-color:'+(c?c.color:'#a855f7')+'">';
    html+='<div class="ec-head">';
    html+='<div style="flex:1"><div class="ec-title">'+esc(q.title)+'</div>';
    html+='<div class="ec-meta"><span>'+(c?esc(c.name):'—')+'</span></div></div>';
    html+='</div>';
    html+='<div class="ec-desc">'+esc(q.description||'')+'</div>';
    html+='<div style="font-size:.68rem;color:var(--tx3);line-height:1.8">';
    html+='📝 '+q.questions.length+' questions · '+totalPoints+' pts · ⏱ '+q.timeLimit+' min';
    if(attempts.length)html+='<br>📊 '+attempts.length+' attempts · Avg: '+avg.toFixed(1)+'%';
    html+='</div>';
    html+='<div class="ec-foot">';
    html+='<button class="btn primary sm" onclick="event.stopPropagation();startQuiz(\''+q.id+'\')">▶ Take Quiz</button>';
    html+='<button class="btn sm" onclick="event.stopPropagation();editQuiz(\''+q.id+'\')">✏️ Edit</button>';
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function editQuiz(id){
  if(id){
    var q=findQuiz(id);
    if(!q)return;
    quizBuilderState.editing=q;
  }else{
    quizBuilderState.editing={
      id:uid('qz'),
      courseId:State.courses[0]?State.courses[0].id:'',
      title:'',
      description:'',
      timeLimit:30,
      questions:[],
      createdAt:nowISO(),
      createdBy:State.settings.teacherName
    };
  }
  navigate('quizBuilder');
}

var quizBuilderState={
  editing:null,
  currentQuestion:null
};

function render_quizBuilder(){
  if(!quizBuilderState.editing){
    quizBuilderState.editing={
      id:uid('qz'),
      courseId:State.courses[0]?State.courses[0].id:'',
      title:'',
      description:'',
      timeLimit:30,
      questions:[],
      createdAt:nowISO(),
      createdBy:State.settings.teacherName
    };
  }
  var q=quizBuilderState.editing;
  var courseOpts=State.courses.map(function(c){return '<option value="'+c.id+'"'+(q.courseId===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🔨</span>Quiz Builder</div>';
  html+='<div class="page-desc">Create and manage quiz questions</div></div>';
  html+='<button class="btn" onclick="navigate(\'quizzes\')">← Back</button>';
  html+='</div>';

  html+='<div class="grid-2-1" style="display:grid;grid-template-columns:2fr 1fr;gap:14px">';

  // Left: quiz info + questions
  html+='<div>';
  html+='<div class="card pad-lg mb-16">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">Quiz Info</h3>';
  html+='<div class="field-row">';
  html+='<div class="field"><label>Title</label><input id="qbTitle" value="'+esc(q.title)+'" placeholder="e.g. Chapter 5 Quiz"></div>';
  html+='<div class="field"><label>Course</label><select id="qbCourse">'+courseOpts+'</select></div>';
  html+='</div>';
  html+='<div class="field"><label>Description</label><textarea id="qbDesc" rows="2">'+esc(q.description||'')+'</textarea></div>';
  html+='<div class="field" style="max-width:200px"><label>Time limit (minutes)</label><input type="number" id="qbTime" value="'+q.timeLimit+'"></div>';
  html+='</div>';

  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">Questions ('+q.questions.length+')</h3>';
  if(!q.questions.length){
    html+='<div class="empty" style="padding:30px"><p>No questions yet. Click "Add Question" below.</p></div>';
  }else{
    q.questions.forEach(function(question,i){
      html+='<div class="quiz-question">';
      html+='<div class="qq-num">Question '+(i+1)+' · '+(question.points||1)+' pt'+(question.points>1?'s':'')+' · '+question.type+'</div>';
      html+='<div class="qq-text">'+esc(question.text)+'</div>';
      question.options.forEach(function(opt,j){
        var isCorrect=j===question.correct;
        html+='<div style="padding:5px 0;font-size:.72rem;color:'+(isCorrect?'var(--c3)':'var(--tx2)')+'">'+(isCorrect?'✓ ':'  ')+String.fromCharCode(65+j)+'. '+esc(opt)+'</div>';
      });
      html+='<div style="margin-top:8px;display:flex;gap:6px">';
      html+='<button class="btn ghost xs" onclick="editQuestion('+i+')">✏️ Edit</button>';
      html+='<button class="btn ghost xs" onclick="removeQuestion('+i+')" style="color:var(--c4)">🗑 Delete</button>';
      html+='</div>';
      html+='</div>';
    });
  }
  html+='<button class="btn primary block mt-12" onclick="addQuestion()">+ Add Question</button>';
  html+='</div>';
  html+='</div>';

  // Right: actions
  html+='<div>';
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px;font-family:var(--serif)">Actions</h3>';
  html+='<button class="btn primary block mb-8" onclick="saveQuiz()">💾 Save Quiz</button>';
  html+='<button class="btn blue block mb-8" onclick="previewQuiz()">👁 Preview</button>';
  html+='<button class="btn green block mb-8" onclick="startQuizFromBuilder()">▶ Take Quiz</button>';
  html+='<button class="btn block" onclick="clearQuiz()">🗑 Clear All</button>';
  html+='</div>';

  html+='<div class="card pad-lg mt-12">';
  html+='<h3 style="font-size:.9rem;margin-bottom:10px;font-family:var(--serif)">Quiz Bank</h3>';
  html+='<p style="font-size:.68rem;color:var(--tx3);margin-bottom:8px">Other quizzes you can clone:</p>';
  State.quizzes.filter(function(q2){return q2.id!==q.id}).forEach(function(q2){
    html+='<div class="stat-line" style="cursor:pointer;padding:6px 0" onclick="cloneQuiz(\''+q2.id+'\')">';
    html+='<span style="font-size:.72rem;flex:1">'+esc(q2.title)+'</div>';
    html+='<span class="badge neutral">'+q2.questions.length+' q</span>';
    html+='</div>';
  });
  html+='</div>';
  html+='</div>';

  html+='</div>';
  return html;
}

function after_quizBuilder(){}

function addQuestion(idx){
  var editing=idx!==undefined?quizBuilderState.editing.questions[idx]:null;
  var q=editing||{
    id:uid('q'),
    text:'',
    type:'multiple',
    options:['','','',''],
    correct:0,
    points:1
  };
  openModal({
    title:idx!==undefined?'Edit Question':'New Question',
    wide:true,
    body:'<div class="field"><label>Question text <span class="req">*</span></label><textarea id="qText" rows="2">'+esc(q.text)+'</textarea></div>'+
      '<div class="field-row">'+
      '<div class="field"><label>Type</label><select id="qType" onchange="updateQuestionFields()">'+
      [['multiple','Multiple Choice'],['truefalse','True/False']].map(function(t){
        return '<option value="'+t[0]+'"'+(q.type===t[0]?' selected':'')+'>'+t[1]+'</option>';
      }).join('')+
      '</select></div>'+
      '<div class="field"><label>Points</label><input type="number" id="qPoints" value="'+(q.points||1)+'" min="1" max="10"></div>'+
      '</div>'+
      '<div id="qOptionsArea"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveQ">Save Question</button>',
    onOpen:function(){
      $('qText').focus();
      renderQuestionOptions(q);
      $('qType').onchange=function(){renderQuestionOptions(q)};
      $('saveQ').onclick=function(){
        var text=$('qText').value.trim();
        if(!text){toast('Question text required','error');return}
        var type=$('qType').value;
        var opts=[];
        if(type==='truefalse'){
          opts=['True','False'];
        }else{
          var inputs=$$('#qOptionsArea input.opt-input');
          inputs.forEach(function(inp){opts.push(inp.value)});
          opts=opts.filter(function(o){return o.trim()});
          if(opts.length<2){toast('At least 2 options required','error');return}
        }
        var correctIdx=0;
        var radios=$$('#qOptionsArea input.opt-radio');
        radios.forEach(function(r){if(r.checked)correctIdx=parseInt(r.value)});
        var newQ={
          id:q.id,
          text:text,
          type:type,
          options:opts,
          correct:correctIdx,
          points:safeInt($('qPoints').value,1)
        };
        if(idx!==undefined){
          quizBuilderState.editing.questions[idx]=newQ;
        }else{
          quizBuilderState.editing.questions.push(newQ);
        }
        closeModal();renderPage();
        toast('Question saved','success');
      };
    }
  });
}

function renderQuestionOptions(q){
  var type=$('qType').value;
  var area=$('qOptionsArea');
  if(type==='truefalse'){
    var options=['True','False'];
    var html='<div class="field"><label>Correct Answer</label>';
    options.forEach(function(o,i){
      html+='<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.8rem;cursor:pointer">';
      html+='<input type="radio" name="correct" class="opt-radio" value="'+i+'" '+(q.correct===i?'checked':'')+'>';
      html+=esc(o)+'</label>';
    });
    html+='</div>';
    area.innerHTML=html;
  }else{
    var options=q.options&&q.options.length?q.options:['','','',''];
    var html='<label style="font-size:.64rem;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:block">Options</label>';
    options.forEach(function(opt,i){
      html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">';
      html+='<input type="radio" name="correct" class="opt-radio" value="'+i+'" '+(q.correct===i?'checked':'')+'>';
      html+='<input type="text" class="opt-input" value="'+esc(opt)+'" placeholder="Option '+String.fromCharCode(65+i)+'">';
      html+='</div>';
    });
    html+='<button type="button" class="btn sm" onclick="addOptionField()">+ Add Option</button>';
    html+='<p style="font-size:.62rem;color:var(--tx3);margin-top:8px">Select the radio button next to the correct answer.</p>';
    area.innerHTML=html;
  }
}
function addOptionField(){
  var area=$('qOptionsArea');
  var inputs=area.querySelectorAll('.opt-input');
  var i=inputs.length;
  if(i>=6){toast('Maximum 6 options','warn');return}
  var div=document.createElement('div');
  div.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:6px';
  div.innerHTML='<input type="radio" name="correct" class="opt-radio" value="'+i+'">'+
    '<input type="text" class="opt-input" placeholder="Option '+String.fromCharCode(65+i)+'">';
  var btn=area.querySelector('button');
  area.insertBefore(div,btn);
}
function updateQuestionFields(){
  renderQuestionOptions({options:['','','',''],correct:0});
}
function editQuestion(idx){addQuestion(idx)}
function removeQuestion(idx){
  quizBuilderState.editing.questions.splice(idx,1);
  renderPage();
  toast('Question removed','info');
}
function saveQuiz(){
  var q=quizBuilderState.editing;
  q.title=$('qbTitle').value.trim();
  q.courseId=$('qbCourse').value;
  q.description=$('qbDesc').value.trim();
  q.timeLimit=safeInt($('qbTime').value,30);
  if(!q.title){toast('Title required','error');return}
  if(!q.questions.length){toast('Add at least one question','error');return}
  var existingIdx=State.quizzes.findIndex(function(x){return x.id===q.id});
  if(existingIdx>-1){
    State.quizzes[existingIdx]=deepClone(q);
  }else{
    State.quizzes.push(deepClone(q));
  }
  logActivity('quiz','Saved quiz: '+q.title);
  saveState();
  navigate('quizzes');
  toast('Quiz saved','success');
}
function clearQuiz(){
  confirmDialog('Clear Quiz','Remove all questions?',function(){
    quizBuilderState.editing.questions=[];
    renderPage();
  },true);
}
function previewQuiz(){
  var q=quizBuilderState.editing;
  if(!q.questions.length){toast('No questions','warn');return}
  var body='';
  q.questions.forEach(function(question,i){
    body+='<div class="quiz-question">';
    body+='<div class="qq-num">Question '+(i+1)+'</div>';
    body+='<div class="qq-text">'+esc(question.text)+'</div>';
    question.options.forEach(function(opt,j){
      var isCorrect=j===question.correct;
      body+='<div style="padding:5px 0;font-size:.76rem;color:'+(isCorrect?'var(--c3)':'var(--tx2)')+'">'+(isCorrect?'✓ ':'○ ')+esc(opt)+'</div>';
    });
    body+='</div>';
  });
  openModal({title:'Preview: '+esc(q.title),wide:true,body:body});
}
function startQuizFromBuilder(){
  var q=quizBuilderState.editing;
  if(!q.questions.length){toast('No questions','warn');return}
  var existingIdx=State.quizzes.findIndex(function(x){return x.id===q.id});
  if(existingIdx>-1){
    State.quizzes[existingIdx]=deepClone(q);
  }else{
    State.quizzes.push(deepClone(q));
  }
  saveState();
  startQuiz(q.id);
}
function cloneQuiz(id){
  var q=findQuiz(id);
  if(!q)return;
  var cloned=deepClone(q);
  cloned.id=uid('qz');
  cloned.title=q.title+' (copy)';
  quizBuilderState.editing=cloned;
  renderPage();
  toast('Quiz cloned','success');
}

/* ================================================================
   QUIZ TAKER
   ================================================================ */
var quizSession={
  quiz:null,
  answers:{},
  startTime:null,
  timerId:null
};

function startQuiz(id){
  var q=findQuiz(id);
  if(!q){toast('Quiz not found','error');return}
  quizSession.quiz=q;
  quizSession.answers={};
  quizSession.startTime=Date.now();
  showQuizQuestion(0);
}

function showQuizQuestion(idx){
  var q=quizSession.quiz;
  if(!q)return;
  if(idx>=q.questions.length){
    finishQuiz();
    return;
  }
  var question=q.questions[idx];
  var answer=quizSession.answers[idx];
  var html='';
  html+='<div class="quiz-question">';
  html+='<div class="qq-num">Question '+(idx+1)+' of '+q.questions.length+' · '+(question.points||1)+' pt</div>';
  html+='<div class="qq-text">'+esc(question.text)+'</div>';
  question.options.forEach(function(opt,j){
    var cls='quiz-option';
    if(answer!==undefined&&answer===j)cls+=' selected';
    html+='<div class="'+cls+'" data-idx="'+j+'" data-qidx="'+idx+'">';
    html+='<div class="qo-marker">'+String.fromCharCode(65+j)+'</div>';
    html+='<div class="qo-text">'+esc(opt)+'</div>';
    html+='</div>';
  });
  html+='</div>';
  html+='<div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px">';
  if(idx>0)html+='<button class="btn" onclick="showQuizQuestion('+(idx-1)+')">← Previous</button>';
  else html+='<div></div>';
  if(idx<q.questions.length-1){
    html+='<button class="btn primary" onclick="showQuizQuestion('+(idx+1)+')">Next →</button>';
  }else{
    html+='<button class="btn green" onclick="finishQuiz()">Finish ✓</button>';
  }
  html+='</div>';

  openModal({
    title:q.title+' — Q'+(idx+1),
    wide:true,
    body:html,
    foot:'<span style="font-size:.68rem;color:var(--tx3)">Progress: '+(Object.keys(quizSession.answers).length)+' / '+q.questions.length+' answered</span>'+
         '<button class="btn danger" onclick="abortQuiz()">✕ Abort</button>',
    onOpen:function(){
      $$('#modalBody .quiz-option').forEach(function(el){
        el.onclick=function(){
          var qidx=parseInt(el.getAttribute('data-qidx'));
          var aidx=parseInt(el.getAttribute('data-idx'));
          quizSession.answers[qidx]=aidx;
          // Auto-advance
          if(qidx<q.questions.length-1){
            showQuizQuestion(qidx+1);
          }else{
            closeModal();
            renderPage();
            showQuizQuestion(qidx);
          }
        };
      });
    }
  });
}

function finishQuiz(){
  var q=quizSession.quiz;
  if(!q)return;
  var totalPoints=0,earned=0;
  var results=[];
  q.questions.forEach(function(question,i){
    var pts=question.points||1;
    totalPoints+=pts;
    var answer=quizSession.answers[i];
    var correct=answer===question.correct;
    if(correct)earned+=pts;
    results.push({
      question:question,
      answer:answer,
      correct:correct
    });
  });
  var pct=totalPoints>0?(earned/totalPoints*100):0;
  var timeSpent=Math.round((Date.now()-quizSession.startTime)/1000);
  var attempt={
    id:uid('att'),
    quizId:q.id,
    score:pct,
    pointsEarned:earned,
    pointsTotal:totalPoints,
    timeSpent:timeSpent,
    completedAt:nowISO(),
    answers:quizSession.answers
  };
  State.quizAttempts.push(attempt);
  logActivity('quiz','Completed quiz: '+q.title+' ('+pct.toFixed(1)+'%)');
  saveState();

  // Show results
  var body='<div style="text-align:center;padding:20px 0">';
  var gCls=gradeClass(pct);
  body+='<div style="font-size:3rem;margin-bottom:14px">'+(pct>=90?'🎉':pct>=70?'😊':pct>=60?'🙂':'😔')+'</div>';
  body+='<div style="font-size:2.4rem;font-weight:800" class="'+gCls+'">'+pct.toFixed(1)+'%</div>';
  body+='<div style="font-size:.85rem;color:var(--tx2);margin-top:8px">Grade: <span class="'+gCls+'">'+grade(pct)+'</span></div>';
  body+='<div style="font-size:.75rem;color:var(--tx3);margin-top:6px">'+earned+' / '+totalPoints+' points · '+timeSpent+'s</div>';
  body+='</div>';

  body+='<div class="divider"></div>';
  body+='<h3 style="font-size:.85rem;margin-bottom:10px;font-family:var(--serif)">Question Breakdown</h3>';
  results.forEach(function(r,i){
    body+='<div class="quiz-question" style="border-left:4px solid '+(r.correct?'var(--c3)':'var(--c4)')+'">';
    body+='<div class="qq-num">Q'+(i+1)+' '+(r.correct?'✓ Correct':'✕ Incorrect')+'</div>';
    body+='<div class="qq-text" style="font-size:.8rem">'+esc(r.question.text)+'</div>';
    if(r.answer!==undefined){
      var ansText=r.question.options[r.answer];
      body+='<div style="font-size:.72rem;color:'+(r.correct?'var(--c3)':'var(--c4)')+'">Your answer: '+esc(ansText||'(no answer)')+'</div>';
    }else{
      body+='<div style="font-size:.72rem;color:var(--tx3)">Not answered</div>';
    }
    if(!r.correct){
      body+='<div style="font-size:.72rem;color:var(--c3);margin-top:4px">Correct answer: '+esc(r.question.options[r.question.correct])+'</div>';
    }
    body+='</div>';
  });

  openModal({
    title:'Quiz Results',
    wide:true,
    body:body,
    foot:'<button class="btn" onclick="closeModal();navigate(\'quizzes\')">Back to Quizzes</button>'+
         '<button class="btn primary" onclick="closeModal();startQuiz(\''+q.id+'\')">Retake</button>'
  });

/* ================================================================
   FLASHCARDS
   ================================================================ */
var FlashState={current:null,revealed:false,reviewed:0,started:0};

function render_flashcards(){
  var decks={};
  State.flashcards.forEach(function(c){
    decks[c.deck]=(decks[c.deck]||0)+1;
  });
  var due=dueCards();

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🎴</span>Flashcards</div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-label">Total cards</div><div class="kpi-value">'+State.flashcards.length+'</div></div>';
  html+='<div class="kpi '+(due.length>0?'':'"')+'pink"><div class="kpi-label">Due now</div><div class="kpi-value '+(due.length>10?'bad':due.length>0?'warn':'good')+'">'+due.length+'</div></div>';
  html+='<div class="kpi blue"><div class="kpi-label">Decks</div><div class="kpi-value">'+Object.keys(decks).length+'</div></div>';
  html+='<div class="kpi green"><div class="kpi-label">Reviewed today</div><div class="kpi-value">'+State.flashcardReviews.filter(function(r){return r.date===today()}).length+'</div></div>';

  if(due.length>0){
    html+='<div class="card pad-lg glow mb-16" style="text-align:center">';
    html+='<div style="font-size:.72rem;color:var(--c1);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:8px">Ready to study</div>';
    html+='<div style="font-size:2rem;font-weight:800;font-family:var(--mono);color:var(--c1);margin-bottom:14px">'+due.length+'</div>';
    html+='<button class="btn primary lg" onclick="startReviewSession()">▶ Start Review Session</button>';
    html+='</div>';
  }

  html+='<h3 style="font-size:.9rem;margin:16px 0 12px;font-family:var(--serif)">Decks</h3>';
  html+='<div class="card-grid">';
  Object.keys(decks).forEach(function(deckName){
    var deckCards=State.flashcards.filter(function(c){return c.deck===deckName});
    var deckDue=deckCards.filter(function(c){return !c.due||c.due<=today()}).length;
    html+='<div class="entity-card" onclick="reviewDeck(\''+esc(deckName).replace(/'/g,"\\'")+'\')">';
    html+='<div class="ec-head">';
    html+='<div style="flex:1"><div class="ec-title">'+esc(deckName)+'</div>';
    html+='<div class="ec-meta"><span>'+deckCards.length+' cards</span></div></div>';

    else html+='<span class="badge ok">✓ Caught up</span>';
    html+='</div>';
    html+='<div class="ec-foot">';
    html+='<button class="btn primary sm" onclick="event.stopPropagation();reviewDeck(\''+esc(deckName).replace(/'/g,"\\'")+'\')" '+(deckDue>0?'':'disabled')+'>'+(deckDue>0?'▶ Review':'✓')+'</button>';
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';

  return html;
}

function startReviewSession(){
  var due=dueCards();
  if(!due.length){toast('No cards due','info');return}
  FlashState.current=due[0];
  FlashState.revealed=false;
  FlashState.reviewed=0;
  FlashState.started=Date.now();
  showFlashcard();
}
function reviewDeck(deckName){
  var due=State.flashcards.filter(function(c){return c.deck===deckName&&(!c.due||c.due<=today())});
  if(!due.length){toast('No cards due in this deck','info');return}
  FlashState.current=due[0];
  FlashState.revealed=false;
  FlashState.reviewed=0;
  FlashState.started=Date.now();
  showFlashcard();
}
function showFlashcard(){
  var c=FlashState.current;
  if(!c){
    finishReviewSession();
    return;
  }
  var total=dueCards().length;
  var body='';
  body+='<div class="flashcard-stage'+(FlashState.revealed?' flipped':'')+'" onclick="toggleFlashReveal()">';
  body+='<div style="font-size:.62rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px">'+esc(c.deck)+' · Card '+(FlashState.reviewed+1)+' of '+total+'</div>';
  body+='<div class="flashcard-q">'+esc(c.front)+'</div>';
  if(FlashState.revealed){
    body+='<div class="flashcard-a">'+esc(c.back)+'</div>';
  }else{
    body+='<div style="font-size:.68rem;color:var(--tx3);margin-top:20px">👆 Tap to reveal answer</div>';
  }
  body+='</div>';
  if(FlashState.revealed){
    body+='<div class="srs-buttons">';
    body+='<button class="srs-btn again" onclick="rateFlash(0)">Again</button>';
    body+='<button class="srs-btn hard" onclick="rateFlash(1)">Hard</button>';
    body+='<button class="srs-btn good" onclick="rateFlash(2)">Good</button>';
    body+='<button class="srs-btn easy" onclick="rateFlash(3)">Easy</button>';
    body+='</div>';
  }
  openModal({
    title:'Flashcard Review',
    wide:true,
    body:body,
    foot:'<button class="btn danger" onclick="closeModal();flashEnd()">End Session</button>',
    onOpen:function(){}
  });
}
function toggleFlashReveal(){
  FlashState.revealed=!FlashState.revealed;
  showFlashcard();
}
function rateFlash(rating){
  var c=FlashState.current;
  if(!c)return;
  reviewCard(c.id,rating);
  State.flashcardReviews.push({
    id:uid('fr'),
    cardId:c.id,
    rating:rating,
    date:today(),
    ts:nowISO()
  });
  FlashState.reviewed++;
  // Find next due card
  var due=dueCards().filter(function(x){return x.id!==c.id});
  if(due.length){
    FlashState.current=due[0];
    FlashState.revealed=false;
    showFlashcard();
  }else{
    finishReviewSession();
  }
}
function finishReviewSession(){
  closeModal();
  var time=Math.round((Date.now()-FlashState.started)/1000);
  var body='<div style="text-align:center;padding:20px">';
  body+='<div style="font-size:3rem;margin-bottom:14px">🎉</div>';
  body+='<h3 style="font-family:var(--serif);font-size:1.1rem;margin-bottom:16px">Session Complete!</h3>';
  body+='<div class="kpi-grid" style="margin-bottom:0">';
  body+='<div class="kpi"><div class="kpi-label">Cards reviewed</div><div class="kpi-value">'+FlashState.reviewed+'</div></div>';
  body+='<div class="kpi green"><div class="kpi-label">Time</div><div class="kpi-value">'+time+'<span style="font-size:.8rem">s</span></div></div>';
  body+='</div>';
  body+='</div>';
  openModal({
    title:'Session Summary',
    narrow:true,
    body:body,
    foot:'<button class="btn primary" onclick="closeModal();renderPage()">Done</button>'
  });
  FlashState.current=null;
}
function flashEnd(){FlashState.current=null;renderPage()}
