[package]
name = "torque-rs"
version = "0.1.0"
edition = "2021"
description = "Distributed Task Orchestration Laboratory"
authors = ["Torque Team"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "torque"
path = "src/main.rs"
