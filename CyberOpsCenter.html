<!DOCTYPE html>
<html lang="en" data-theme="ops">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#06080c">
<title>CYBER OPS CENTER — Threat Detection & Response</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#06080c;--bg2:#0a0e16;--bg3:#12182a;--bg4:#1a2140;
  --panel:#080d18;--panel2:#0e1524;--panel3:#161e34;--panel4:#1e2848;
  --bd:#1a2440;--bd2:#28355a;--bd3:#3a4c7a;
  --tx:#d8e4f0;--tx2:#a0b4cc;--tx3:#607090;--mu:#3a4a6a;
  --c1:#ff3b4e;--c1h:#ff8090;--c1l:#c01828;--c1d:#801018;
  --c2:#00e0ff;--c2h:#80f0ff;--c2l:#00a0c0;
  --c3:#ffc400;--c3h:#ffe080;--c3l:#c09000;
  --c4:#b060ff;--c4h:#d0a0ff;--c4l:#7030c0;
  --c5:#00ff88;--c5h:#80ffc0;--c5l:#00c060;
  --c6:#ff7020;--c6h:#ffb080;--c6l:#c04800;
  --c7:#40d0d0;--c7h:#80e8e8;--c7l:#20a0a0;
  --c8:#ff4080;--c8h:#ff90b0;--c8l:#c02050;
  --ok:#00ff88;--warn:#ffc400;--err:#ff3b4e;--info:#00e0ff;--crit:#ff0044;
  --g1:linear-gradient(135deg,#ff3b4e,#ff7020);
  --g2:linear-gradient(135deg,#00e0ff,#00ff88);
  --g3:linear-gradient(135deg,#ffc400,#ff7020);
  --g4:linear-gradient(135deg,#b060ff,#ff3b4e);
  --gOps:linear-gradient(120deg,#ff3b4e,#ffc400,#00e0ff,#00ff88,#b060ff,#ff3b4e);
  --r:8px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --sh2:0 16px 48px rgba(0,0,0,.9);
  --mono:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="matrix"]{--bg:#000600;--bg2:#001200;--bg3:#001e00;--panel:#001800;--panel2:#002800;--panel3:#003800;
  --bd:#006400;--bd2:#009000;--bd3:#00c000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#00ffd0;--c5:#00ffa0;--c6:#80ff00;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}
[data-theme="soc-light"]{--bg:#eef2f8;--bg2:#e0e8f4;--bg3:#d0dcec;--panel:#fff;--panel2:#f5f8fc;--panel3:#e8eef8;
  --bd:#c8d4e8;--bd2:#a8b8d4;--tx:#0a1028;--tx2:#3a4870;--tx3:#6878a0;--mu:#a0a8c0;
  --c1:#d02030;--c2:#0080c0;--c3:#c09000;--c4:#6030a0;--c5:#00a050;
  --g1:linear-gradient(135deg,#d02030,#0080c0)}
[data-theme="amber"]{--bg:#1a0e00;--bg2:#281800;--bg3:#382200;--panel:#281800;--panel2:#382200;
  --bd:#684400;--bd2:#906000;--tx:#ffe8c0;--tx2:#d8b880;--tx3:#a08848;
  --c1:#ffb800;--c2:#ff6b00;--c3:#ffe040;--c4:#ff3b00;
  --g1:linear-gradient(135deg,#ffb800,#ff6b00)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#06080c;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-size:2.8rem;font-weight:900;letter-spacing:10px;color:var(--c1);text-shadow:0 0 40px var(--c1),0 0 80px var(--c1);margin-bottom:6px;font-family:var(--mono)}
.boot-sub{font-size:.7rem;color:var(--c2);letter-spacing:8px;margin-bottom:36px;opacity:.7}
.boot-bar{width:340px;max-width:80vw;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .15s;box-shadow:0 0 12px var(--c1)}
.boot-pct{font-size:.7rem;color:var(--c1);margin-bottom:16px}
.boot-log{font-size:.62rem;color:var(--c2);text-align:left;width:min(420px,90vw);height:140px;overflow:hidden;line-height:1.7;background:rgba(0,0,0,.5);padding:10px;border:1px solid var(--bd);border-radius:var(--rxs)}
.boot-log .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boot-log .ok{color:var(--c5)}.boot-log .warn{color:var(--c3)}.boot-log .err{color:var(--c1)}.boot-log .info{color:var(--c2)}

/* ============ TOP BAR ============ */
#topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.tb-logo{font-family:var(--mono);font-weight:900;letter-spacing:3px;font-size:.9rem;color:var(--c1);text-shadow:0 0 10px var(--c1);padding-right:10px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tb-logo::before{content:'';width:8px;height:8px;background:var(--c1);border-radius:50%;box-shadow:0 0 10px var(--c1);animation:pulseRed 1.5s infinite}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.3}}
.threat-gauge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);font-family:var(--mono);font-size:.65rem}
.threat-gauge .tg-label{color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.threat-gauge .tg-value{color:var(--c1);font-weight:700;text-shadow:0 0 8px var(--c1)}
.threat-gauge .tg-bar{width:60px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;position:relative}
.threat-gauge .tg-bar-fill{height:100%;background:var(--g1);transition:width .3s;border-radius:3px}
.threat-gauge.level-low .tg-value{color:var(--c5);text-shadow:0 0 8px var(--c5)}
.threat-gauge.level-low .tg-bar-fill{background:var(--c5)}
.threat-gauge.level-med .tg-value{color:var(--c3);text-shadow:0 0 8px var(--c3)}
.threat-gauge.level-med .tg-bar-fill{background:var(--c3)}
.threat-gauge.level-high .tg-value{color:var(--c6);text-shadow:0 0 8px var(--c6)}
.threat-gauge.level-high .tg-bar-fill{background:var(--c6)}
.threat-gauge.level-crit .tg-value{color:var(--c1);text-shadow:0 0 8px var(--c1);animation:pulseRed 1s infinite}
.threat-gauge.level-crit .tg-bar-fill{background:var(--c1)}

.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.7rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#fff;box-shadow:0 0 14px rgba(255,59,78,.35)}
.tb-tab .tab-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--c1);color:#fff;border-color:transparent}

/* ============ ALERT TICKER ============ */
#ticker{height:26px;background:#000;border-bottom:1px solid var(--bd);display:flex;align-items:center;overflow:hidden;flex-shrink:0;position:relative}
#ticker::before{content:'⚠ LIVE';position:absolute;left:0;top:0;bottom:0;background:var(--c1);color:#fff;padding:0 12px;display:flex;align-items:center;font-family:var(--mono);font-size:.6rem;font-weight:900;letter-spacing:1px;z-index:2;box-shadow:4px 0 12px rgba(0,0,0,.9);animation:pulseRed 2s infinite}
.ticker-content{padding-left:80px;white-space:nowrap;font-family:var(--mono);font-size:.68rem;color:var(--c3);animation:scrollTicker 90s linear infinite;display:inline-block}
@keyframes scrollTicker{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.ticker-item{display:inline-block;margin-right:40px}
.ticker-item .tt-sev{color:var(--c1);font-weight:700}
.ticker-item .tt-time{color:var(--tx3)}

/* ============ MAIN LAYOUT ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:220px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--panel3)}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:8px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#contentArea{flex:1;overflow:auto;padding:14px;position:relative}
#contentArea.nopad{padding:0}
#rightPanel{width:300px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}

/* ============ STATUS BAR ============ */
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:16px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c2)}
#statusbar .sb-val.red{color:var(--c1)}
#statusbar .sb-val.green{color:var(--c5)}
#statusbar .sb-val.yellow{color:var(--c3)}
#statusbar .sb-dot{width:6px;height:6px;border-radius:50%;background:var(--c5);box-shadow:0 0 6px var(--c5)}
#statusbar .sb-dot.red{background:var(--c1);box-shadow:0 0 6px var(--c1);animation:pulseRed 1s infinite}
#statusbar .sb-dot.yellow{background:var(--c3);box-shadow:0 0 6px var(--c3)}

/* ============ CARDS ============ */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.card h3{font-size:.75rem;font-weight:700;color:var(--tx);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.card h3 .badge{background:var(--c1);color:#fff;font-size:.55rem;padding:2px 8px;border-radius:10px;font-family:var(--mono);letter-spacing:0}
.card h3 .badge.info{background:var(--c2)}
.card h3 .badge.ok{background:var(--c5);color:#000}
.card h3 .badge.warn{background:var(--c3);color:#000}
.card .sub{font-size:.68rem;color:var(--tx3);line-height:1.6;margin-bottom:10px}

/* ============ METRIC TILES ============ */
.grid{display:grid;gap:10px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.c5{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.metric{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--g1);opacity:.8}
.metric.c2::before{background:var(--c2)}.metric.c3::before{background:var(--c3)}
.metric.c4::before{background:var(--c4)}.metric.c5::before{background:var(--c5)}
.metric .m-label{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;font-family:var(--mono);margin-bottom:4px}
.metric .m-value{font-size:1.4rem;font-weight:800;font-family:var(--mono);color:var(--tx);line-height:1.1}
.metric .m-value.red{color:var(--c1);text-shadow:0 0 12px rgba(255,59,78,.5)}
.metric .m-value.cyan{color:var(--c2);text-shadow:0 0 12px rgba(0,224,255,.5)}
.metric .m-value.yellow{color:var(--c3)}
.metric .m-value.green{color:var(--c5)}
.metric .m-delta{font-size:.62rem;color:var(--tx3);font-family:var(--mono);margin-top:4px}
.metric .m-delta.up{color:var(--c1)}.metric .m-delta.down{color:var(--c5)}
.metric .m-spark{margin-top:6px;height:24px}

/* ============ DATA TABLE ============ */
.data-table{width:100%;font-family:var(--mono);font-size:.68rem;border-collapse:collapse}
.data-table th{text-align:left;padding:8px 10px;background:var(--panel3);font-size:.58rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0;cursor:pointer;user-select:none}
.data-table th:hover{color:var(--c2)}
.data-table td{padding:6px 10px;border-bottom:1px solid var(--bd);color:var(--tx2);vertical-align:middle}
.data-table tbody tr{transition:var(--t1)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.hi{color:var(--c1);font-weight:600}
.data-table td.cyan{color:var(--c2)}
.data-table td.green{color:var(--c5)}
.data-table td.yellow{color:var(--c3)}
.data-table td.dim{color:var(--tx3)}
.sev{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.55rem;font-weight:900;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
.sev.critical{background:var(--c1);color:#fff;box-shadow:0 0 8px var(--c1)}
.sev.high{background:var(--c6);color:#fff}
.sev.medium{background:var(--c3);color:#000}
.sev.low{background:var(--c2);color:#000}
.sev.info{background:var(--panel4);color:var(--tx3)}

/* ============ INPUTS / BUTTONS ============ */
.inp,.sel,.txa{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rxs);padding:7px 10px;color:var(--tx);font-size:.7rem;width:100%;transition:var(--t1);font-family:var(--mono)}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,59,78,.12);outline:none}
.txa{resize:vertical;min-height:100px;line-height:1.55}
.lbl{font-size:.6rem;color:var(--tx3);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font-size:.68rem;font-weight:600;transition:var(--t1);white-space:nowrap;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,59,78,.5)}
.btn.ghost{background:transparent;border-color:var(--bd);color:var(--tx2)}
.btn.ghost:hover{background:var(--panel3);border-color:var(--c2);color:var(--c2)}
.btn.danger{color:var(--c1);border-color:var(--c1)}
.btn.danger:hover{background:rgba(255,59,78,.1)}
.btn.ok{color:var(--c5);border-color:var(--c5)}
.btn.ok:hover{background:rgba(0,255,136,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 9px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ============ LIST ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:7px 10px;border-radius:var(--rxs);cursor:pointer;font-size:.68rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(255,59,78,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:8px}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.58rem;color:var(--tx3)}

/* ============ SEVERITY BAR ============ */
.sev-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;display:flex}
.sev-bar .sb-fill{height:100%;transition:width .3s}
.sev-bar .sb-critical{background:var(--c1)}.sev-bar .sb-high{background:var(--c6)}
.sev-bar .sb-medium{background:var(--c3)}.sev-bar .sb-low{background:var(--c2)}
.sev-bar .sb-info{background:var(--panel4)}

/* ============ TERMINAL ============ */
.terminal{background:#000;border:1px solid var(--bd);border-radius:var(--rs);font-family:var(--mono);font-size:.68rem;color:var(--c5);padding:0;display:flex;flex-direction:column;height:400px;overflow:hidden}
.terminal-out{flex:1;overflow-y:auto;padding:10px 14px;line-height:1.6}
.terminal-line{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.terminal-line.err{color:var(--c1)}
.terminal-line.warn{color:var(--c3)}
.terminal-line.info{color:var(--c2)}
.terminal-line.dim{color:var(--tx3)}
.terminal-line.hi{color:var(--c4);font-weight:700}
.terminal-prompt{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#050505;border-top:1px solid var(--bd)}
.terminal-prompt .tp-sym{color:var(--c1);font-weight:700}
.terminal-prompt .tp-path{color:var(--c2)}
.terminal-prompt input{flex:1;background:transparent;color:var(--c5);font-family:var(--mono);font-size:.68rem;caret-color:var(--c5)}

/* ============ CODE / MONO ============ */
.mono-block{background:#000;border:1px solid var(--bd);border-radius:var(--rs);padding:12px 14px;font-family:var(--mono);font-size:.65rem;line-height:1.6;color:var(--c5);overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all;user-select:text}
.mono-block .err{color:var(--c1)}.mono-block .warn{color:var(--c3)}
.mono-block .info{color:var(--c2)}.mono-block .hi{color:var(--c4)}
.mono-block .dim{color:var(--tx3)}.mono-block .key{color:var(--c2);font-weight:700}

/* ============ MITRE MATRIX ============ */
.mitre-wrap{display:flex;gap:8px;overflow-x:auto;padding:4px;align-items:flex-start;min-height:100%}
.mitre-col{min-width:180px;max-width:200px;flex-shrink:0}
.mitre-col-head{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center;font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--c2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;position:sticky;top:0}
.mitre-tech{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 8px;font-family:var(--mono);font-size:.6rem;color:var(--tx2);margin-bottom:3px;cursor:pointer;transition:var(--t1);border-left:2px solid var(--bd2)}
.mitre-tech:hover{background:var(--panel3);border-color:var(--c1);border-left-color:var(--c1);color:var(--tx);transform:translateX(2px)}
.mitre-tech.detected{border-left-color:var(--c3);background:rgba(255,196,0,.08)}
.mitre-tech.blocked{border-left-color:var(--c5);background:rgba(0,255,136,.08)}
.mitre-tech.critical{border-left-color:var(--c1);background:rgba(255,59,78,.12)}
.mitre-tech .mt-id{color:var(--tx3);font-size:.55rem;display:block;margin-bottom:2px}
.mitre-tech .mt-name{font-weight:600}

/* ============ THREAT MAP ============ */
.threat-map-wrap{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at center,#001a30,#000508);overflow:hidden;border-radius:var(--r)}
#threatMapCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.threat-overlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.threat-stats{background:rgba(8,13,24,.85);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px 12px;font-family:var(--mono);font-size:.62rem;color:var(--c2);pointer-events:auto;min-width:200px}
.threat-stats .ts-row{display:flex;justify-content:space-between;padding:2px 0}
.threat-stats .ts-val{color:var(--c1);font-weight:700}
.threat-stats .ts-val.cyan{color:var(--c2)}
.threat-stats .ts-val.green{color:var(--c5)}

/* ============ KILL CHAIN ============ */
.kill-chain{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:14px 0}
.kc-stage{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);padding:10px 14px;text-align:center;position:relative;min-width:110px;transition:var(--t2);cursor:pointer}
.kc-stage:hover{transform:translateY(-3px);border-color:var(--c1)}
.kc-stage.active{border-color:var(--c3);box-shadow:0 0 20px rgba(255,196,0,.3);background:rgba(255,196,0,.08)}
.kc-stage.compromised{border-color:var(--c1);background:rgba(255,59,78,.12);box-shadow:0 0 20px rgba(255,59,78,.3)}
.kc-stage.defended{border-color:var(--c5);background:rgba(0,255,136,.08)}
.kc-stage .kc-num{font-family:var(--mono);font-size:.55rem;color:var(--tx3);margin-bottom:3px}
.kc-stage .kc-name{font-size:.65rem;font-weight:700;color:var(--tx);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.kc-stage .kc-icon{font-size:1.4rem;margin-bottom:4px}
.kc-arrow{color:var(--tx3);font-size:1.4rem;font-family:var(--mono)}

/* ============ PROGRESS RING ============ */
.ring{position:relative;width:80px;height:80px}
.ring svg{transform:rotate(-90deg)}
.ring .r-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:1.1rem;font-weight:800;color:var(--c2)}

/* ============ SPARKLINE / CHART ============ */
.chart{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rs);padding:10px;position:relative}
.chart-canvas{width:100%;height:auto;display:block}
.chart-label{font-family:var(--mono);font-size:.6rem;color:var(--tx3);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-weight:700}

/* ============ HASH CRACKER ============ */
.crack-progress{background:var(--bg3);border-radius:3px;height:8px;overflow:hidden;margin:8px 0}
.crack-progress-fill{height:100%;background:var(--g1);transition:width .3s;box-shadow:0 0 8px var(--c1)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:760px;width:100%;max-height:90vh;display:flex;flex-direction:column;animation:modalIn .25s cubic-bezier(.34,1.56,.64,1)}
.modal.lg{max-width:1000px}
.modal.xl{max-width:1200px}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--panel3)}
.modal-head h2{font-size:.85rem;font-weight:700;color:var(--c1);text-transform:uppercase;letter-spacing:1.2px;font-family:var(--mono)}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--panel3)}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--c1)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:48px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c2);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:360px;min-width:200px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c5)}
.toast.warn{border-left-color:var(--c3)}
.toast.error{border-left-color:var(--c1)}
.toast.info{border-left-color:var(--c2)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ============ PROGRESS BAR (generic) ============ */
.progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--g2);transition:width .3s;border-radius:3px}
.progress-fill.red{background:var(--g1)}
.progress-fill.warn{background:var(--g3)}

/* ============ TABS INSIDE CONTENT ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;cursor:pointer;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);border-bottom:2px solid transparent;transition:var(--t1);white-space:nowrap;font-family:var(--mono)}
.tab:hover{color:var(--tx);background:var(--panel2)}
.tab.active{color:var(--c1);border-bottom-color:var(--c1)}

/* ============ HELPERS ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}

.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c5{color:var(--c5)}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.65rem}.text-sm{font-size:.72rem}
.text-dim{color:var(--tx3)}

.empty-state .es-icon{font-size:3rem;opacity:.3;margin-bottom:14px}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function randHex(n){var s='';for(var i=0;i<n;i++)s+='0123456789abcdef'[rnd(0,15)];return s}
function randMAC(){var s=[];for(var i=0;i<6;i++)s.push(randHex(2));return s.join(':')}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',function(e){

/* ============ LIVE METRIC TICK ============ */
function tickMetrics(){
  if(!OPS.live)return;
  OPS.cpu=clamp(OPS.cpu+rndF(-8,8),5,95);
  OPS.net=clamp(OPS.net+rndF(-10,10),10,99);
  OPS.eventsPerSec=Math.floor(rndF(120,950));
  $('sbCpu').textContent=Math.round(OPS.cpu)+'%';
  $('sbNet').textContent=Math.round(OPS.net)+'%';
  $('sbEvents').textContent=OPS.eventsPerSec;
  // Random alert generation
  if(Math.random()<0.25){
    var alert=genAlert();
    OPS.alertsList.unshift(alert);
    if(OPS.alertsList.length>200)OPS.alertsList.pop();
    OPS.alerts++;
    $('sbAlerts').textContent=OPS.alerts;
    if(alert.sev==='critical'||alert.sev==='high'){
      // Add arc to threat map
      OPS.attackArcs.push({
        src:alert.srcCity,
        dst:alert.dstCity,
        sev:alert.sev,
        t:0,
        dur:2.5,
        type:alert.type,
        icon:alert.icon
      });
      if(OPS.attackArcs.length>30)OPS.attackArcs.shift();
    }
    if(alert.sev==='critical'){
      toast('CRITICAL: '+alert.type+' from '+alert.srcCity.name,'error',4000);
    }
    updateThreatLevel();
  }
  // Random blocked events
  if(Math.random()<0.4){
    OPS.blocked+=rnd(1,15);
    $('sbBlocked').textContent=OPS.blocked;
  }
  // Generate log events
  for(var i=0;i<3;i++){
    OPS.eventsList.unshift(genEvent());
    if(OPS.eventsList.length>500)OPS.eventsList.pop();
  }
}

function updateThreatLevel(){
  var recent=OPS.alertsList.slice(0,50);
  var score=0;
  recent.forEach(function(a){
    if(a.sev==='critical')score+=5;
    else if(a.sev==='high')score+=3;
    else if(a.sev==='medium')score+=1;
  });
  score=clamp(score,0,100);
  OPS.threatScore=score;
  var level='low';
  if(score>75)level='crit';
  else if(score>50)level='high';
  else if(score>25)level='med';
  OPS.threatLevel=level;
  var g=$('threatGauge');
  g.className='threat-gauge level-'+level;
  $('threatValue').textContent=level.toUpperCase();
  $('threatFill').style.width=score+'%';
  var dot=$('sbDot');
  if(level==='crit'||level==='high')dot.classList.add('red');
  else if(level==='med'){dot.classList.remove('red');dot.classList.add('yellow')}
  else{dot.classList.remove('red');dot.classList.remove('yellow')}
}

function drawSparklines(){
  $$('[data-spark]').forEach(function(cv){
    var ctx=cv.getContext('2d');
    var W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    var pts=[];
    for(var i=0;i<30;i++)pts.push(rndF(0.2,0.9));
    ctx.strokeStyle='rgba(0,224,255,.7)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    pts.forEach(function(v,i){
      var x=i/(pts.length-1)*W;
      var y=H-v*H*0.9-H*0.05;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
    // Fill
    ctx.fillStyle='rgba(0,224,255,.1)';
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  });
}
function drawMiniMap(){

    var dy=(90-arc.dst.lat)/180*H;

    grad.addColorStop(1,'rgba(255,59,78,0.05)');
    ctx.strokeStyle=grad;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    var mx=(sx+dx)/2,my=(sy+dy)/2-Math.hypot(dx-sx,dy-sy)*0.2;

function initThreatMap(){

function resizeThreatMap(){
  if(!TMAP.canvas)return;

  TMAP.W=wrap.clientWidth;

var tmapLast=0;
function threatMapLoop(now){
  if(OPS.selectedTab!=='threatmap'){return}
  var dt=Math.min((now-tmapLast)/1000,0.1);
  tmapLast=now;
  drawThreatMap(dt);
  requestAnimationFrame(threatMapLoop);
}
function drawThreatMap(dt){
  var ctx=TMAP.ctx;
  var W=TMAP.W,H=TMAP.H;
  if(!ctx||!W)return;
  ctx.fillStyle='#000508';
  ctx.fillRect(0,0,W,H);
  // Radial vignette
  var grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,'rgba(0,30,60,0.4)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  drawWorldGrid(ctx,W,H);
  // Update arcs
  OPS.attackArcs.forEach(function(arc){arc.t=(arc.t||0)+dt});
  OPS.attackArcs=OPS.attackArcs.filter(function(a){return a.t<a.dur});
  // Draw arcs (in reverse order so newest on top)
  OPS.attackArcs.forEach(function(arc){
    var p=arc.t/arc.dur;
    drawAttackArc(ctx,W,H,arc,p);
  });
  // Draw cities
  drawCityDots(ctx,W,H,false);
  // Update overlay stats
  var el1=$('tmActive');
  if(el1)el1.textContent=OPS.attackArcs.length;
  var el2=$('tmBlocked');
  if(el2)el2.textContent=OPS.blocked;
  var el3=$('tmLevel');
  if(el3){el3.textContent=OPS.threatLevel.toUpperCase();el3.style.color=OPS.threatLevel==='crit'?'var(--c1)':OPS.threatLevel==='high'?'var(--c6)':OPS.threatLevel==='med'?'var(--c3)':'var(--c5)'}
  var el4=$('tmTop');
  if(el4){
    var counts={};
    OPS.attackArcs.forEach(function(a){counts[a.src.country]=(counts[a.src.country]||0)+1});
    var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]})[0];
    var c=COUNTRIES.find(function(x){return x.code===top});
    if(c)el4.textContent=c.flag+' '+c.code;
  }
}
function drawWorldGrid(ctx,W,H){
  // Simplified world map — draw dots along lat/lon grid to look like a world map
  // Land masses approximated by a hand-crafted function
  function isLand(lon,lat){
    // Very simplified continents
    // North America
    if(lon>-165&&lon<-55&&lat>15&&lat<72)return true;
    // South America
    if(lon>-85&&lon<-35&&lat>-56&&lat<15)return true;
    // Europe
    if(lon>-12&&lon<45&&lat>35&&lat<72)return true;
    // Africa
    if(lon>-20&&lon<52&&lat>-36&&lat<38)return true;
    // Asia
    if(lon>40&&lon<180&&lat>5&&lat<75)return true;
    // Australia
    if(lon>112&&lon<155&&lat>-45&&lat<-10)return true;
    // Greenland
    if(lon>-60&&lon<-20&&lat>60&&lat<85)return true;
    return false;
  }
  var cellW=W/120;
  var cellH=H/60;
  ctx.fillStyle='rgba(0,120,180,.35)';
  for(var lon=-180;lon<180;lon+=3){
    for(var lat=-90;lat<90;lat+=3){
      if(isLand(lon,lat)){
        var x=(lon+180)/360*W;
        var y=(90-lat)/180*H;
        ctx.fillRect(x,y,cellW*1.4,cellH*1.4);
      }
    }
  }
  // Lat/Lon grid lines
  ctx.strokeStyle='rgba(0,224,255,0.05)';
  ctx.lineWidth=0.5;
  for(var lat2=-60;lat2<=60;lat2+=30){
    var y2=(90-lat2)/180*H;
    ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(W,y2);ctx.stroke();
  }
  for(var lon2=-150;lon2<=150;lon2+=30){
    var x2=(lon2+180)/360*W;
    ctx.beginPath();ctx.moveTo(x2,0);ctx.lineTo(x2,H);ctx.stroke();
  }
}
function drawCityDots(ctx,W,H,mini){
  CITIES.forEach(function(city){
    var x=(city.lon+180)/360*W;
    var y=(90-city.lat)/180*H;
    ctx.fillStyle='rgba(0,224,255,0.5)';
    ctx.beginPath();
    ctx.arc(x,y,mini?1:1.8,0,Math.PI*2);
    ctx.fill();
    if(!mini&&OPS.threatLevel==='crit'){
      ctx.fillStyle='rgba(0,224,255,0.1)';
      ctx.beginPath();
      ctx.arc(x,y,4+Math.sin(Date.now()/300)*2,0,Math.PI*2);
      ctx.fill();
    }
  });
}
function drawAttackArc(ctx,W,H,arc,p){
  var sx=(arc.src.lon+180)/360*W;
  var sy=(90-arc.src.lat)/180*H;
  var dx=(arc.dst.lon+180)/360*W;
  var dy=(90-arc.dst.lat)/180*H;
  var dist=Math.hypot(dx-sx,dy-sy);
  var mx=(sx+dx)/2;
  var my=(sy+dy)/2-dist*0.25;
  var color=arc.sev==='critical'?'255,59,78':arc.sev==='high'?'255,112,32':arc.sev==='medium'?'255,196,0':'0,224,255';
  // Fade curve
  var alpha=p<0.15?p/0.15:(p>0.85?(1-p)/0.15:1);
  ctx.strokeStyle='rgba('+color+','+(alpha*0.8)+')';
  ctx.lineWidth=arc.sev==='critical'?2:1.5;
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.quadraticCurveTo(mx,my,dx,dy);
  ctx.stroke();
  // Origin glow
  var g=ctx.createRadialGradient(sx,sy,0,sx,sy,10);
  g.addColorStop(0,'rgba('+color+','+(alpha*0.6)+')');
  g.addColorStop(1,'rgba('+color+',0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill();
  // Target burst when arc completes
  if(p>0.85){
    var pulseT=(p-0.85)/0.15;
    var gr=ctx.createRadialGradient(dx,dy,0,dx,dy,30*pulseT);
    gr.addColorStop(0,'rgba('+color+','+(alpha*0.7)+')');
    gr.addColorStop(1,'rgba('+color+',0)');
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(dx,dy,30*pulseT,0,Math.PI*2);ctx.fill();
  }
  // Moving dot along arc
  var t=p;
  var px=(1-t)*(1-t)*sx+2*(1-t)*t*mx+t*t*dx;
  var py=(1-t)*(1-t)*sy+2*(1-t)*t*my+t*t*dy;
  ctx.fillStyle='rgba('+color+',1)';
  ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
  // Trail
  ctx.fillStyle='rgba('+color+',0.4)';
  for(var i=1;i<=5;i++){
    var tt=Math.max(0,p-i*0.03);
    var tx=(1-tt)*(1-tt)*sx+2*(1-tt)*tt*mx+tt*tt*dx;
    var ty=(1-tt)*(1-tt)*sy+2*(1-tt)*tt*my+tt*tt*dy;
    ctx.beginPath();ctx.arc(tx,ty,2-i*0.3,0,Math.PI*2);ctx.fill();
  }
  // Label at target
  if(p>0.5&&!arc.simulated){
    ctx.fillStyle='rgba('+color+',0.9)';
    ctx.font='10px monospace';
    ctx.fillText(arc.icon||'⚡',dx+5,dy-5);
  }
}

<script>
/* ================================================================
   SIEM QUERY ENGINE
   ================================================================ */
var SIEM_HISTORY=[];
function renderSIEM(c){
  c.classList.remove('nopad');
  var html='<div class="card"><h3>🔎 SIEM Query Console</h3>'+
    '<div class="sub">Syntax: <code>source=firewall action=deny severity>=high src_ip=10.0.0.1</code> · Operators: <code>=</code> <code>!=</code> <code>~</code> (contains) <code>&gt;=</code> <code>&lt;=</code> · Boolean: <code>AND</code> <code>OR</code></div>'+
    '<textarea class="txa" id="siemQuery" rows="3" placeholder="Enter query...">severity >= high AND src_country = CN</textarea>'+
    '<div class="btn-row mt-8">'+

    '<button class="btn" onclick="loadQueryExample()">📋 Example</button>'+
    '<button class="btn" onclick="clearSIEM()">🗑 Clear</button>'+
    '<span class="text-xs text-dim" style="align-self:center">Runs against '+OPS.alertsList.length+' alerts and '+OPS.eventsList.length+' events</span>'+
    '</div>'+
    '<div class="btn-row mt-12">';
  var samples=[
    'severity >= high',
    'source = firewall AND action = deny',
    'type ~ SQL',
    'src_country = RU AND severity = critical',
    'host = web-01 OR host = db-primary',
    'port = 445 OR port = 3389',
    'user = admin OR user = root',
    'mitre ~ T1'
  ];
  samples.forEach(function(q){
    html+='<button class="btn sm ghost" onclick="document.getElementById(\'siemQuery\').value=\''+esc(q).replace(/'/g,"\\'")+'\';runSIEMQuery()">'+esc(q)+'</button>';
  });
  html+='</div></div>';
  html+='<div id="siemResults"></div>';
  html+='<div id="siemHistory"></div>';
  c.innerHTML=html;
  renderSIEMHistory();

function loadQueryExample(){
  $('siemQuery').value='severity >= high AND src_country = CN';
  runSIEMQuery();
}
function clearSIEM(){
  $('siemQuery').value='';
  $('siemResults').innerHTML='';
}
function parseQuery(q){
  // Very simple query parser: tokenize into predicates separated by AND/OR
  var tokens=[];
  var re=/([\w_]+)\s*(>=|<=|!=|=|~)\s*("[^"]*"|\S+)|AND|OR/gi;
  var m;
  var lastOp='AND';
  while((m=re.exec(q))!==null){
    if(m[0].toUpperCase()==='AND'){lastOp='AND';continue}
    if(m[0].toUpperCase()==='OR'){lastOp='OR';continue}
    tokens.push({field:m[1].toLowerCase(),op:m[2],value:m[3].replace(/^"|"$/g,'').toLowerCase(),join:lastOp});
    lastOp='AND';
  }
  return tokens;
}
function evalPredicate(item,pred){
  var map={};
  if(item.sev)map.severity=item.sev;
  if(item.sev)map.sev=item.sev;
  if(item.type)map.type=item.type.toLowerCase();
  if(item.srcIP){map.src_ip=item.srcIP;map.srcip=item.srcIP;map.src=item.srcIP}
  if(item.dstIP){map.dst_ip=item.dstIP;map.dstip=item.dstIP;map.dst=item.dstIP}
  if(item.host)map.host=item.host;
  if(item.user)map.user=item.user;
  if(item.port!=null)map.port=String(item.port);
  if(item.mitre)map.mitre=item.mitre.toLowerCase();
  if(item.source)map.source=item.source;
  if(item.action)map.action=item.action;
  if(item.proto)map.proto=item.proto;
  if(item.srcCity){map.src_country=item.srcCity.country.toLowerCase();map.src_country_name=item.srcCity.country;map.src_city=item.srcCity.name.toLowerCase()}
  if(item.dstCity){map.dst_country=item.dstCity.country.toLowerCase();map.dst_city=item.dstCity.name.toLowerCase()}
  var val=map[pred.field];
  if(val===undefined)return false;
  var v=String(val).toLowerCase();
  var target=pred.value;
  // Severity ordering
  var sevOrder={critical:4,high:3,medium:2,low:1,info:0};
  if(pred.field==='severity'||pred.field==='sev'){
    var a=sevOrder[v]||0;
    var b=sevOrder[target]||0;
    if(pred.op==='=')return a===b;
    if(pred.op==='!=')return a!==b;
    if(pred.op==='>=')return a>=b;
    if(pred.op==='<=')return a<=b;
  }
  if(pred.op==='=')return v===target;
  if(pred.op==='!=')return v!==target;
  if(pred.op==='~')return v.indexOf(target)>-1;
  if(pred.op==='>='){var x=parseFloat(v),y=parseFloat(target);return !isNaN(x)&&!isNaN(y)&&x>=y}
  if(pred.op==='<='){var x2=parseFloat(v),y2=parseFloat(target);return !isNaN(x2)&&!isNaN(y2)&&x2<=y2}
  return false;
}
function runSIEMQuery(){
  var q=$('siemQuery').value.trim();
  if(!q){$('siemResults').innerHTML='<div class="card"><div class="text-dim">Empty query</div></div>';return}
  var t0=performance.now();
  var preds=parseQuery(q);
  // Evaluate against alerts
  var alertResults=OPS.alertsList.filter(function(a){
    if(!preds.length)return true;
    var result=null;
    preds.forEach(function(p){
      var ok=evalPredicate(a,p);
      if(result===null)result=ok;
      else if(p.joiin==='OR')result=result||ok;
      else result=result&&ok;
    });
    return result===null?true:result;
  });
  // Also against events
  var eventResults=OPS.eventsList.filter(function(e){
    if(!preds.length)return false;
    var result=null;
    preds.forEach(function(p){
      // events have different fields
      var ev={source:e.source,action:e.action,host:e.host,user:e.user,port:e.port,proto:e.proto,src_ip:e.srcIP,dst_ip:e.dstIP};
      var ok=evalPredicate(ev,p);
      if(result===null)result=ok;
      else if(p.join==='OR')result=result||ok;
      else result=result&&ok;
    });
    return result===null?false:result;
  });
  var t1=performance.now();
  var elapsed=(t1-t0).toFixed(2);
  var html='';
  html+='<div class="card"><h3>Query Results <span class="badge info">'+elapsed+'ms</span></h3>'+
    '<div class="btn-row mb-12">'+
    '<span class="text-xs" style="color:var(--tx3);align-self:center">'+alertResults.length+' alerts · '+eventResults.length+' events match</span>'+
    '</div>';
  if(alertResults.length){
    html+='<table class="data-table"><thead><tr><th>Time</th><th>Sev</th><th>Type</th><th>Source</th><th>Target</th><th>MITRE</th></tr></thead><tbody>';
    alertResults.slice(0,50).forEach(function(a){
      html+='<tr style="cursor:pointer" onclick="showAlertDetail('+OPS.alertsList.indexOf(a)+')">'+
        '<td class="dim">'+new Date(a.time).toTimeString().slice(0,8)+'</td>'+
        '<td><span class="sev '+a.sev+'">'+a.sev.slice(0,4)+'</span></td>'+
        '<td>'+a.icon+' '+esc(a.type)+'</td>'+
        '<td class="cyan">'+esc(a.srcCity.name)+'</td>'+
        '<td>'+esc(a.dstCity.name)+'</td>'+
        '<td class="yellow">'+a.mitre+'</td></tr>';
    });
    html+='</tbody></table>';
    if(alertResults.length>50)html+='<div class="text-xs text-dim mt-8">Showing first 50 of '+alertResults.length+'</div>';
  }else{
    html+='<div class="text-dim text-xs" style="padding:16px 0">No alerts match.</div>';
  }
  html+='</div>';
  $('siemResults').innerHTML=html;
  // History
  SIEM_HISTORY.unshift({q:q,time:Date.now(),hits:alertResults.length+eventResults.length});
  if(SIEM_HISTORY.length>10)SIEM_HISTORY.pop();
  renderSIEMHistory();
}
function renderSIEMHistory(){
  var el=$('siemHistory');
  if(!el)return;
  if(!SIEM_HISTORY.length){el.innerHTML='';return}
  var html='<div class="card"><h3>Query History</h3><div class="list">';

function drawNetworkTopology(){
  var cv=$('netTopoCanvas');
  if(!cv)return;
  var W=cv.clientWidth;
  var H=400;
  cv.width=W*2;cv.height=H*2;
  cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(2,0,0,2,0,0);
  ctx.fillStyle='#000510';
  ctx.fillRect(0,0,W,H);
  // Gateway in center-top
  var gw={x:W/2,y:40,label:'vpn-gw'};
  // Hosts in circle
  var hosts=[];
  for(var i=0;i<12;i++){
    var angle=(i/12)*Math.PI*2-Math.PI/2;
    var r=Math.min(W,H)/2-60;
    hosts.push({
      x:W/2+Math.cos(angle)*r,
      y:H/2+Math.sin(angle)*r,
      label:HOSTS[i%HOSTS.length],
      ip:'10.0.'+Math.floor(i/3)+'.'+(20+i*7),
      risk:rnd(1,10)
    });
  }
  // Draw connections
  hosts.forEach(function(h){
    ctx.strokeStyle='rgba(0,224,255,0.15)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(gw.x,gw.y);ctx.lineTo(h.x,h.y);ctx.stroke();
  });
  // Draw cross-connections
  for(var i=0;i<hosts.length;i++){
    for(var j=i+1;j<hosts.length;j++){
      if(Math.random()<0.15){
        ctx.strokeStyle='rgba(255,196,0,0.1)';
        ctx.beginPath();ctx.moveTo(hosts[i].x,hosts[i].y);ctx.lineTo(hosts[j].x,hosts[j].y);ctx.stroke();
      }
    }
  }
  // Draw gateway
  ctx.fillStyle='#00e0ff';
  ctx.beginPath();ctx.arc(gw.x,gw.y,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(0,224,255,0.3)';
  ctx.beginPath();ctx.arc(gw.x,gw.y,22+Math.sin(Date.now()/500)*3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('GW',gw.x,gw.y);
  // Draw hosts
  hosts.forEach(function(h){
    var color=h.risk>7?'255,59,78':h.risk>5?'255,112,32':h.risk>3?'255,196,0':'0,255,136';
    // Glow
    var grad=ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,24);
    grad.addColorStop(0,'rgba('+color+',0.3)');
    grad.addColorStop(1,'rgba('+color+',0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(h.x,h.y,24,0,Math.PI*2);ctx.fill();
    // Circle
    ctx.fillStyle='rgb('+color+')';
    ctx.beginPath();ctx.arc(h.x,h.y,8,0,Math.PI*2);ctx.fill();
    // Label
    ctx.fillStyle='#d8e4f0';
    ctx.font='9px monospace';
    ctx.fillText(h.label,h.x,h.y+20);
    ctx.fillStyle='#607090';
    ctx.font='8px monospace';
    ctx.fillText(h.ip,h.x,h.y+30);
  });
  ctx.textBaseline='alphabetic';
}

async function cryptoEncryptAES(){
  try{
    var plain=$('cryptoPlain').value;
    var pass=$('cryptoPass').value;
    var enc=new TextEncoder();
    var keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveKey']);
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
      keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(plain));
    var combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
    combined.set(salt,0);
    combined.set(iv,salt.length);
    combined.set(new Uint8Array(ct),salt.length+iv.length);
    var b64=btoa(String.fromCharCode.apply(null,combined));
    $('cryptoOut').textContent=b64;
    $('cryptoOut').setAttribute('data-encrypted','1');
    toast('Encrypted ('+combined.length+' bytes)','success');
  }catch(e){
    $('cryptoOut').innerHTML='<span class="err">Error: '+esc(e.message)+'</span>';
  }
}
async function cryptoDecryptAES(){
  try{
    var b64=$('cryptoOut').textContent.trim();
    var raw=atob(b64);
    var bytes=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    var salt=bytes.slice(0,16);

    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);

function md5simple(str){
  // Very simplified — not a real MD5, just for demonstration
  var h=0;
  for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}
  var s=Math.abs(h).toString(16).padStart(8,'0');
  while(s.length<32)s=s+s;
  return s.slice(0,32);
}

function encodeAs(type){
  var input=$('encInput').value;
  var out='';
  try{
    if(type==='base64')out=btoa(unescape(encodeURIComponent(input)));
    else if(type==='base64d')out=decodeURIComponent(escape(atob(input)));
    else if(type==='hex')out=Array.from(new TextEncoder().encode(input)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
    else if(type==='hexd'){
      out=input.replace(/[^0-9a-f]/gi,'');
      var bytes=[];
      for(var i=0;i<out.length;i+=2)bytes.push(parseInt(out.substr(i,2),16));
      out=new TextDecoder().decode(new Uint8Array(bytes));
    }
    else if(type==='url')out=encodeURIComponent(input);
    else if(type==='urld')out=decodeURIComponent(input);
    else if(type==='rot13')out=input.replace(/[a-zA-Z]/g,function(c){return String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26)});
    else if(type==='binary')out=Array.from(new TextEncoder().encode(input)).map(function(b){return b.toString(2).padStart(8,'0')}).join(' ');
    $('encOutput').textContent=out;
  }catch(e){
    $('encOutput').innerHTML='<span class="err">Error: '+esc(e.message)+'</span>';
  }
}

function applyCipher(type){
  var input=$('cipherInput').value;
  var key=$('cipherKey').value||'SECRET';
  var out='';
  if(type==='vigenere'||type==='vigenere-d'){
    out='';
    var k=0;
    for(var i=0;i<input.length;i++){
      var c=input[i];
      if(/[a-z]/i.test(c)){
        var shift=key[k%key.length].toUpperCase().charCodeAt(0)-65;
        if(type==='vigenere-d')shift=-shift;
        var base=c===c.toUpperCase()?65:97;
        out+=String.fromCharCode(((c.charCodeAt(0)-base+shift+26*10)%26)+base);
        k++;
      }else out+=c;
    }
  }else if(type==='xor'){
    out='';
    for(var j=0;j<input.length;j++){
      out+=String.fromCharCode(input.charCodeAt(j)^key.charCodeAt(j%key.length));
    }
    // Show as hex
    out=Array.from(out).map(function(c){return c.charCodeAt(0).toString(16).padStart(2,'0')}).join(' ');
  }else if(type==='caesar'){
    out=input.replace(/[a-zA-Z]/g,function(c){return String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+3)?c:c-26)});
  }else if(type==='atbash'){
    out=input.replace(/[a-zA-Z]/g,function(c){
      var base=c===c.toUpperCase()?65:97;
      return String.fromCharCode(base+25-(c.charCodeAt(0)-base));
    });
  }else if(type==='railfence'){
    // 2-rail fence
    var first='',second='';
    for(var k2=0;k2<input.length;k2++){
      if(k2%2===0)first+=input[k2];else second+=input[k2];
    }
    out=first+second;
  }
  $('cipherOutput').textContent=out;
}

function analyzePassword(){
  var pw=$('pwAnalyze').value;
  var len=pw.length;
  var hasUpper=/[A-Z]/.test(pw);
  var hasLower=/[a-z]/.test(pw);
  var hasDigit=/[0-9]/.test(pw);
  var hasSymbol=/[^a-zA-Z0-9]/.test(pw);
  var classes=(hasUpper?1:0)+(hasLower?1:0)+(hasDigit?1:0)+(hasSymbol?1:0);
  var charsetSize=(hasUpper?26:0)+(hasLower?26:0)+(hasDigit?10:0)+(hasSymbol?33:0);
  var entropy=len*Math.log2(charsetSize||1);
  // Pattern penalties
  var penalties=[];
  if(COMMON_PASSWORDS.indexOf(pw.toLowerCase())>-1)penalties.push('Found in common password list (-30 bits)');
  if(/(.)\1{2,}/.test(pw))penalties.push('Contains repeated characters (-10 bits)');
  if(/qwerty|asdf|zxcv|1234|abcd/i.test(pw))penalties.push('Contains keyboard walk (-15 bits)');
  if(/^[a-z]+$/i.test(pw)&&len<10)penalties.push('Only letters (-5 bits)');
  var penaltyBits=0;
  if(COMMON_PASSWORDS.indexOf(pw.toLowerCase())>-1)penaltyBits+=30;
  if(/(.)\1{2,}/.test(pw))penaltyBits+=10;
  if(/qwerty|asdf|zxcv|1234|abcd/i.test(pw))penaltyBits+=15;
  var effectiveEntropy=Math.max(0,entropy-penaltyBits);
  // Crack time estimate (10B guesses/sec)
  var guesses=Math.pow(2,effectiveEntropy);
  var seconds=guesses/1e10;
  var crackTime=formatTime(seconds);

  var score=clamp(Math.floor(effectiveEntropy/1.3),0,100);
  var strengthLabel=score<20?'CRITICAL':score<40?'WEAK':score<60?'FAIR':score<80?'STRONG':'EXCELLENT';

  var checks=[['Length ≥ 12',len>=12],['Uppercase',hasUpper],['Lowercase',hasLower],['Digit',hasDigit],['Symbol',hasSymbol],['Not common',COMMON_PASSWORDS.indexOf(pw.toLowerCase())===-1],['No repeats',!/(.)\1{2,}/.test(pw)],['No keyboard walk',!/qwerty|asdf|1234/i.test(pw)]];
  html+='<div class="mt-16"><h3 style="font-size:.65rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;color:var(--tx3)">Policy Compliance</h3>';

      '<span class="text-dim">'+ch[0]+'</span>'+
      '<span class="'+(ch[1]?'text-c5':'text-c1')+'">'+(ch[1]?'✓ PASS':'✗ FAIL')+'</span></div>';
  });
  html+='</div>';
  if(penalties.length){
    html+='<div class="mt-12" style="background:rgba(255,59,78,.08);border-left:3px solid var(--c1);padding:8px 12px;border-radius:var(--rxs)">'+
      '<div class="text-xs text-c1" style="font-weight:700;margin-bottom:4px">⚠ WEAKNESSES DETECTED</div>';
    penalties.forEach(function(p){html+='<div class="text-xs text-dim">• '+esc(p)+'</div>'});
    html+='</div>';
  }
  $('pwAnalysis').innerHTML=html;
  // Policy panel
  var pol='<div class="list" style="font-family:var(--mono);font-size:.68rem">';
  [['Minimum 12 characters',len>=12],['Contains uppercase',hasUpper],['Contains lowercase',hasLower],['Contains digit',hasDigit],['Contains symbol',hasSymbol],['Not in breach list',COMMON_PASSWORDS.indexOf(pw.toLowerCase())===-1]].forEach(function(p){
    pol+='<div class="flex-between" style="padding:5px 0"><span>'+p[0]+'</span><span class="'+(p[1]?'text-c5':'text-c1')+'">'+(p[1]?'✓':'✗')+'</span></div>';
  });

function formatTime(s){
  if(s<1)return '< 1 second';
  if(s<60)return Math.floor(s)+' seconds';
  if(s<3600)return Math.floor(s/60)+' minutes';
  if(s<86400)return Math.floor(s/3600)+' hours';
  if(s<31536000)return Math.floor(s/86400)+' days';
  if(s<31536000*1000)return Math.floor(s/31536000)+' years';
  if(s<31536000*1e6)return Math.floor(s/31536000/1000)+' thousand years';
  if(s<31536000*1e9)return Math.floor(s/31536000/1e6)+' million years';
  return '> billion years';
}
function generateSecurePassword(len){
  var chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}';
  var out='';
  var arr=new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(var i=0;i<len;i++)out+=chars[arr[i]%chars.length];
  return out;
}

      log.innerHTML='<span class="dim">[*] Attempts: </span><span class="hi">'+attempts.toLocaleString()+'</span><span class="dim"> · '+rnd(80,200)+'K hashes/sec</span>';
      if(attempts>5e8&&Math.random()<0.02){
        clearInterval(iv);
        CRACK_STATE.running=false;
        if(known){
          var elapsed2=((Date.now()-startTime)/1000).toFixed(2);
          log.innerHTML+='<span class="err" style="font-weight:700">[+] CRACKED! Password: '+esc(known)+'</span>\n';
          log.innerHTML+='<span class="info">[+] Time: '+elapsed2+'s · Attempts: '+attempts.toLocaleString()+'</span>';
          updateCrackStatus('CRACKED',known,attempts,elapsed2);
          toast('Brute force succeeded: '+known,'success',5000);
        }
      }
      if(attempts>5e9){
        clearInterval(iv);
        CRACK_STATE.running=false;
        log.innerHTML+='<span class="warn">[-] Brute force limit reached (5 billion attempts).</span>';
        updateCrackStatus('TIMEOUT',null,attempts,((Date.now()-startTime)/1000).toFixed(2));
      }
    }
  },mode==='dictionary'?200:150);
}
function stopCrack(){
  CRACK_STATE.running=false;

}
function updateCrackStatus(status,pw,attempts,time){
  var el=$('crackStatus');

    '<div class="m-delta">Attempts: '+attempts.toLocaleString()+'</div>'+
    '<div class="m-delta">Time: '+time+'s</div>'+
    '</div>';
}

function convertSigma(target,id){
  var examples={
    'rule-001':{
      splunk:'index=windows EventCode=4688 CommandLine=*EncodedCommand* | stats count by ComputerName, User',
      elastic:'{\n  "query": {\n    "bool": {\n      "must": [\n        {"term": {"event.code": "4688"}},\n        {"wildcard": {"process.command_line": "*EncodedCommand*"}}\n      ]\n    }\n  }\n}'
    },
    'rule-002':{
      splunk:'index=windows TargetObject=*Windows Defender\\\\DisableAntiSpyware* Details=*DWORD* | stats count by ComputerName',
      elastic:'{"query":{"wildcard":{"registry.path":"*Windows Defender\\\\\\\\DisableAntiSpyware*"}}}'
    },
    'rule-003':{
      splunk:'index=windows TargetImage=*lsass.exe | stats count by ComputerName, SourceImage',
      elastic:'{"query":{"bool":{"must":[{"wildcard":{"process.target.path":"*lsass.exe"}}]}}}'
    },
    'rule-004':{
      splunk:'index=windows EventCode=4698 TaskName=* | stats count by ComputerName, TaskName',
      elastic:'{"query":{"term":{"event.code":"4698"}}}'
    },
    'rule-005':{
      splunk:'index=windows EventCode=4625 | stats count by Source_Network_Address | where count > 5',
      elastic:'{"query":{"term":{"event.code":"4625"}},"aggs":{"by_source":{"terms":{"field":"source.ip"}}}}'
    }
  };
  var e=examples[id];
  if(!e)return;
  openModal('Converted to '+target.toUpperCase()+' — '+id,
    '<div class="card"><h3>Target Format</h3><div class="mono-block">'+esc(e[target]||e.splunk)+'</div></div>'+
    '<div class="card"><h3>Deployment Notes</h3><div class="text-xs text-dim" style="line-height:1.8">Deploy in your SIEM. Test with a known-bad sample first. Tune thresholds to reduce false positives. Update on a schedule as attacker TTPs evolve.</div></div>',
    '<button class="btn primary" onclick="copyToClipboard(\''+esc(e[target]||e.splunk).replace(/'/g,"\\'")+'\');closeModal()">📋 Copy Rule</button>'+
    '<button class="btn" onclick="closeModal()">Close</button>',
    {size:'lg'});
}
function testRule(id){
  toast('Testing '+id+' against 24h log stream...','info');

}

var BOOT_STEPS=[
  'Initializing SOC kernel...',
  'Loading threat intelligence feeds...',
  'Mounting detection engine...',
  'Warming up SIEM query parser...',
  'Preparing MITRE ATT&CK matrix...',
  'Loading cryptographic primitives...',
  'Establishing encrypted channels...',
  'Syncing global threat map...',
  'Deploying '+rnd(40,80)+' sensors to edge...',
  'Loading '+rnd(500,900)+' detection signatures...',
  'System online. Awaiting orders.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(4,12);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'line'});
      var cls=idx<3?'info':idx<6?'ok':'warn';
      l.innerHTML='<span class="'+cls+'">[ OK ]</span> '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CYBER OPS CENTER · ONLINE','success',3500);
        // Seed initial alerts
        for(var i=0;i<8;i++)OPS.alertsList.push(genAlert());
        updateThreatLevel();
        renderRightPanel();
      },500);
    }
  },150);
}
