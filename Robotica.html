registerModule('rover',{
  title:'Differential Drive',
  icon:'🛞',
  desc:'Two-wheeled robot with path following',
  init:function(){
    var r=STATE.rover;
    r.robot=new DiffDriveRobot(CANV.W*0.2,CANV.H*0.5,0,30);
    r.path=generateRoverPath(CANV.W,CANV.H);
    r.pathIndex=0;
  },
  tick:function(dt){
    var r=STATE.rover;
    if(!r.robot)this.init();
    if(r.autoDrive&&r.path.length){
      var ctrl=purePursuit(r.robot,r.path.slice(r.pathIndex),r.lookahead,15);
      if(ctrl.reached){
        /* Advance path */
        r.pathIndex++;
        if(r.pathIndex>=r.path.length){
          r.pathIndex=0;
          r.robot.trail=[];
        }
        r.robot.vL=0;r.robot.vR=0;
      } else {
        r.robot.vL=ctrl.vL;
        r.robot.vR=ctrl.vR;
        /* Advance path index if we passed the current waypoint */
        while(r.pathIndex<r.path.length&&
              dist(r.robot.x,r.robot.y,r.path[r.pathIndex][0],r.path[r.pathIndex][1])<r.lookahead*0.8){
          r.pathIndex++;
        }
      }
    }
    r.robot.update(dt);
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    drawGrid(ctx,W,H,40,'rgba(255,176,32,.05)');
    var r=STATE.rover;
    if(!r.robot)return;
    /* Path */
    if(r.path.length){
      ctx.strokeStyle='rgba(64,208,255,.4)';
      ctx.lineWidth=2;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      r.path.forEach(function(p,i){
        if(i===0)ctx.moveTo(p[0],p[1]);
        else ctx.lineTo(p[0],p[1]);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      /* Waypoints */
      r.path.forEach(function(p,i){
        var isNext=i===r.pathIndex;
        ctx.fillStyle=isNext?'#40d0ff':'rgba(64,208,255,.4)';
        ctx.beginPath();
        ctx.arc(p[0],p[1],isNext?6:4,0,Math.PI*2);
        ctx.fill();
      });
    }
    /* Trail */
    if(r.showTrail){
      ctx.strokeStyle='rgba(255,80,96,.4)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      r.robot.trail.forEach(function(p,i){
        if(i===0)ctx.moveTo(p[0],p[1]);
        else ctx.lineTo(p[0],p[1]);
      });
      ctx.stroke();
    }
    /* Robot */
    drawRover(ctx,r.robot.x,r.robot.y,r.robot.theta,25);
    /* Lookahead circle */
    var ctrl=purePursuit(r.robot,r.path.slice(r.pathIndex),r.lookahead,15);
    if(ctrl.target&&!ctrl.reached){
      ctx.strokeStyle='rgba(255,208,64,.4)';
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      ctx.arc(r.robot.x,r.robot.y,r.lookahead,0,Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ffd040';
      ctx.beginPath();
      ctx.arc(ctrl.target[0],ctrl.target[1],5,0,Math.PI*2);
      ctx.fill();
    }
    setStatsHTML(
      '<div>Pos: ('+fmt(r.robot.x,0)+', '+fmt(r.robot.y,0)+')</div>'+
      '<div>θ: '+fmt(deg(r.robot.theta),1)+'°</div>'+
      '<div>v: '+fmt(r.robot.v,1)+' px/s</div>'+
      '<div>ω: '+fmt(deg(r.robot.omega),1)+' °/s</div>'+
      '<div>WP: '+(r.pathIndex+1)+'/'+r.path.length+'</div>'
    );
    updateBadge('🛞 Differential Drive Rover');
  },
  controls:function(){
    var r=STATE.rover;
    var html='';
    html+='<div class="sec"><h4>Auto Drive</h4>';
    html+=toggleRow('Auto drive','STATE.rover.autoDrive');
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Wheelbase</span><span>'+r.wheelBase+'</span></div>';
    html+='<input type="range" min="10" max="60" step="1" value="'+r.wheelBase+'" oninput="STATE.rover.wheelBase=parseInt(this.value);if(STATE.rover.robot)STATE.rover.robot.wheelBase=parseInt(this.value)"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Lookahead</span><span>'+r.lookahead+'</span></div>';
    html+='<input type="range" min="15" max="100" step="5" value="'+r.lookahead+'" oninput="STATE.rover.lookahead=parseInt(this.value)"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+=toggleRow('Show trail','STATE.rover.showTrail');
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="newRoverPath()">🔄 New Path</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="resetRover()">↺ Reset Position</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Manual Control</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Left Wheel</span><span id="lwLabel">'+fmt(r.robot?r.robot.vL:0,0)+'</span></div>';
    html+='<input type="range" min="-100" max="100" step="1" value="'+(r.robot?r.robot.vL:0)+'" oninput="if(STATE.rover.robot)STATE.rover.robot.vL=parseFloat(this.value);document.getElementById(\'lwLabel\').textContent=this.value"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Right Wheel</span><span id="rwLabel">'+fmt(r.robot?r.robot.vR:0,0)+'</span></div>';
    html+='<input type="range" min="-100" max="100" step="1" value="'+(r.robot?r.robot.vR:0)+'" oninput="if(STATE.rover.robot)STATE.rover.robot.vR=parseFloat(this.value);document.getElementById(\'rwLabel\').textContent=this.value"></div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:6px">Disable auto drive to control manually.</div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var r=STATE.rover;
    if(!r.robot)return '<div class="empty">Loading...</div>';
    var html='<div class="sec"><h4>Robot State</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">x</span><span class="v">'+fmt(r.robot.x,2)+'</span></div>';
    html+='<div class="row"><span class="k">y</span><span class="v">'+fmt(r.robot.y,2)+'</span></div>';
    html+='<div class="row"><span class="k">θ</span><span class="v">'+fmt(r.robot.theta,4)+' rad</span></div>';
    html+='<div class="row"><span class="k">v</span><span class="v">'+fmt(r.robot.v,2)+'</span></div>';
    html+='<div class="row"><span class="k">ω</span><span class="v">'+fmt(r.robot.omega,4)+' rad/s</span></div>';
    html+='<div class="row"><span class="k">vL / vR</span><span class="v">'+fmt(r.robot.vL,1)+' / '+fmt(r.robot.vR,1)+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Kinematics Model</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'v = (v<sub>R</sub> + v<sub>L</sub>) / 2<br>'+
      'ω = (v<sub>R</sub> − v<sub>L</sub>) / b<br>'+
      'ẋ = v · cos(θ)<br>'+
      'ẏ = v · sin(θ)<br>'+
      'θ̇ = ω'+
      '</div></div>';
    return html;
  }
});
function generateRoverPath(W,H){
  /* Generate a smooth curvy path */
  var path=[];
  var numWP=12;
  for(var i=0;i<numWP;i++){
    var t=i/(numWP-1);
    var x=100+t*(W-200);
    var y=H/2+Math.sin(t*Math.PI*2)*H*0.25+Math.cos(t*Math.PI*3)*H*0.1;
    path.push([x,y]);
  }
  return path;
}
function newRoverPath(){STATE.rover.path=generateRoverPath(CANV.W,CANV.H);STATE.rover.pathIndex=0;STATE.rover.robot.trail=[];}
function resetRover(){if(STATE.rover.robot){STATE.rover.robot.x=CANV.W*0.2;STATE.rover.robot.y=CANV.H*0.5;STATE.rover.robot.theta=0;STATE.rover.robot.trail=[];STATE.rover.pathIndex=0;}}
function drawRover(ctx,x,y,theta,r){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(theta);
  /* Body */
  ctx.fillStyle='#222';
  ctx.strokeStyle='#40d0ff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.roundRect(-r*0.5,-r*0.8,r,r*1.6,6);
  ctx.fill();
  ctx.stroke();
  /* Top plate */
  ctx.fillStyle='#ffb020';
  ctx.beginPath();
  ctx.arc(0,0,r*0.4,0,Math.PI*2);
  ctx.fill();
  /* Wheels */
  ctx.fillStyle='#333';
  ctx.fillRect(-r*0.7,-r*0.9,6,r*0.4);
  ctx.fillRect(-r*0.7,r*0.5,6,r*0.4);
  /* Direction arrow */
  ctx.strokeStyle='#ff5060';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(r*0.9,0);
  ctx.stroke();
  ctx.restore();
}

/* ================================================================
   MODULE: A* PATH PLANNING
   ================================================================ */
registerModule('astar',{
  title:'A* Path Planner',
  icon:'🗺️',
  desc:'Grid-based A* path planning with diagonal movement',
  init:function(){
    var a=STATE.astar;
    a.grid=new OccupancyGrid(a.cols,a.rows,a.cellSize);
    a.grid.fillRandom(a.obstacleDensity);
    /* Clear start and goal areas */
    clearArea(a.grid,a.start[0],a.start[1],2);
    clearArea(a.grid,a.goal[0],a.goal[1],2);
    a.path=null;
    a.visited=[];
    a.animIdx=0;
    /* Run immediately */
    this.plan();
  },
  plan:function(){
    var a=STATE.astar;
    var result=astar(a.grid,a.start,a.goal,a.useDiagonal);
    a.path=result.path;
    a.visited=result.visited;
    a.iterations=result.iterations;
    a.error=result.error;
    a.animIdx=0;
    STATE.iterations=result.iterations;
    logMsg('A*: '+(result.path?result.path.length+' waypoints':'no path')+' in '+result.iterations+' iterations',result.path?'success':'error');
  },
  tick:function(dt){
    var a=STATE.astar;
    a.animIdx=Math.min(a.animIdx+3,a.visited.length);
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    var a=STATE.astar;
    if(!a.grid)return;
    /* Center grid in canvas */
    var gw=a.cols*a.cellSize;
    var gh=a.rows*a.cellSize;
    var ox=(W-gw)/2;
    var oy=(H-gh)/2;
    ctx.save();
    ctx.translate(ox,oy);
    /* Draw cells */
    for(var y=0;y<a.rows;y++){
      for(var x=0;x<a.cols;x++){
        var px=x*a.cellSize;
        var py=y*a.cellSize;
        if(a.grid.data[a.grid.idx(x,y)]){
          ctx.fillStyle='#303030';
          ctx.fillRect(px,py,a.cellSize-1,a.cellSize-1);
          /* Subtle highlight */
          ctx.fillStyle='rgba(255,176,32,.1)';
          ctx.fillRect(px+1,py+1,a.cellSize-3,a.cellSize-3);
        } else {
          ctx.fillStyle='rgba(64,208,255,.02)';
          ctx.fillRect(px,py,a.cellSize-1,a.cellSize-1);
        }
      }
    }
    /* Visited cells */
    ctx.fillStyle='rgba(64,208,255,.15)';
    for(var i=0;i<a.animIdx;i++){
      var v=a.visited[i];
      ctx.fillRect(v[0]*a.cellSize,v[1]*a.cellSize,a.cellSize-1,a.cellSize-1);
    }
    /* Path */
    if(a.path){
      ctx.strokeStyle='#40ff90';
      ctx.lineWidth=3;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      a.path.forEach(function(p,i){
        var px=p[0]*a.cellSize+a.cellSize/2;
        var py=p[1]*a.cellSize+a.cellSize/2;
        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      });
      ctx.stroke();
      /* Path nodes */
      a.path.forEach(function(p){
        ctx.fillStyle='#40ff90';
        ctx.beginPath();
        ctx.arc(p[0]*a.cellSize+a.cellSize/2,p[1]*a.cellSize+a.cellSize/2,2,0,Math.PI*2);
        ctx.fill();
      });
    }
    /* Start and goal */
    drawMarker(ctx,a.start[0]*a.cellSize+a.cellSize/2,a.start[1]*a.cellSize+a.cellSize/2,'#40d0ff','S');
    drawMarker(ctx,a.goal[0]*a.cellSize+a.cellSize/2,a.goal[1]*a.cellSize+a.cellSize/2,'#ff5060','G');
    ctx.restore();
    setStatsHTML(
      '<div>Path: '+(a.path?a.path.length+' nodes':'—')+'</div>'+
      '<div>Visited: '+a.visited.length+'</div>'+
      '<div>Iterations: '+a.iterations+'</div>'+
      '<div>Grid: '+a.cols+'×'+a.rows+'</div>'
    );
    updateBadge('🗺️ A* Path Planner · '+(a.useDiagonal?'8':'4')+'-connected');
  },
  onDown:function(p){
    var a=STATE.astar;
    var W=CANV.W,H=CANV.H;
    var gw=a.cols*a.cellSize,gh=a.rows*a.cellSize;
    var ox=(W-gw)/2,oy=(H-gh)/2;
    var cx=Math.floor((p.x-ox)/a.cellSize);
    var cy=Math.floor((p.y-oy)/a.cellSize);
    if(cx<0||cx>=a.cols||cy<0||cy>=a.rows)return;
    if(a.grid.isFree(cx,cy)){
      a.grid.setObstacle(cx,cy,1);
      this.plan();
    }
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var a=STATE.astar;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full sm" onclick="STATE.astar_plan()||MODULES.astar.plan()">🔍 Replan</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="regenAStarGrid()">🎲 New Map</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="clearAStarGrid()">🗑 Clear Obstacles</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Obstacle density</span><span>'+fmt(a.obstacleDensity*100,0)+'%</span></div>';
    html+='<input type="range" min="0" max="0.4" step="0.02" value="'+a.obstacleDensity+'" oninput="STATE.astar.obstacleDensity=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Movement</h4>';
    html+=toggleRow('Diagonal (8-connected)','STATE.astar.useDiagonal',function(){MODULES.astar.plan()});
    html+='</div>';
    html+='<div class="sec"><h4>Start / Goal</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Start</span><span class="v">('+a.start.join(',')+')</span></div>';
    html+='<div class="row"><span class="k">Goal</span><span class="v">('+a.goal.join(',')+')</span></div>';
    html+='</div>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="randomizeStartGoal()">🎲 Random start/goal</button>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="margin-top:8px;font-family:var(--mono);line-height:1.5">Click on free cells to add obstacles. Right-click to replan.</div>';
    return html;
  },
  mathPanel:function(){
    var a=STATE.astar;
    var html='<div class="sec"><h4>Search Statistics</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Path length</span><span class="v">'+(a.path?a.path.length:'—')+'</span></div>';
    html+='<div class="row"><span class="k">Nodes visited</span><span class="v">'+a.visited.length+'</span></div>';
    html+='<div class="row"><span class="k">Iterations</span><span class="v">'+a.iterations+'</span></div>';
    html+='<div class="row"><span class="k">Error</span><span class="v">'+(a.error||'none')+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Algorithm</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'f(n) = g(n) + h(n)<br>'+
      'g(n) = path cost so far<br>'+
      'h(n) = heuristic to goal<br><br>'+
      'Diagonal: <b>octile</b> heuristic<br>'+
      'h = max(Δx,Δy) + (√2−1)·min(Δx,Δy)'+
      '</div></div>';
    return html;
  }
});
function clearArea(grid,cx,cy,radius){
  for(var x=cx-radius;x<=cx+radius;x++){
    for(var y=cy-radius;y<=cy+radius;y++){
      grid.setObstacle(x,y,0);
    }
  }
}
function regenAStarGrid(){
  var a=STATE.astar;
  a.grid=new OccupancyGrid(a.cols,a.rows,a.cellSize);
  a.grid.fillRandom(a.obstacleDensity);
  clearArea(a.grid,a.start[0],a.start[1],2);
  clearArea(a.grid,a.goal[0],a.goal[1],2);
  MODULES.astar.plan();
}
function clearAStarGrid(){
  STATE.astar.grid.clear();
  MODULES.astar.plan();
}
function randomizeStartGoal(){
  var a=STATE.astar;
  var s=a.grid.randomFreeCell();
  var g=a.grid.randomFreeCell();
  while(g[0]===s[0]&&g[1]===s[1])g=a.grid.randomFreeCell();
  a.start=s;a.goal=g;
  MODULES.astar.plan();
  renderLeftPanel();
}
function drawMarker(ctx,x,y,color,label){
  ctx.fillStyle=color;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y,10,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle='#000';
  ctx.font='bold 12px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(label,x,y+1);
  ctx.textBaseline='alphabetic';
}
</script>
<script>
/* ================================================================
   MODULE: RRT
   ================================================================ */
registerModule('rrt',{
  title:'RRT Path Planner',
  icon:'🌳',
  desc:'Rapidly-exploring Random Tree',
  init:function(){
    var r=STATE.rrt;
    r.grid=new OccupancyGrid(r.cols,r.rows,r.cellSize);
    r.grid.fillRandom(0.15);
    var s=r.grid.randomFreeCell();
    var g=r.grid.randomFreeCell();
    r.start=[s[0]*r.cellSize+r.cellSize/2,s[1]*r.cellSize+r.cellSize/2];
    r.goal=[g[0]*r.cellSize+r.cellSize/2,g[1]*r.cellSize+r.cellSize/2];
    clearArea(r.grid,Math.floor(r.start[0]/r.cellSize),Math.floor(r.start[1]/r.cellSize),2);
    clearArea(r.grid,Math.floor(r.goal[0]/r.cellSize),Math.floor(r.goal[1]/r.cellSize),2);
    this.build();
  },
  build:function(){
    var r=STATE.rrt;
    var result=rrt(r.grid,r.start,r.goal,r.stepSize,r.maxIter,r.goalBias);
    r.tree=result;
    r.animIdx=0;
    logMsg('RRT: '+result.nodes.length+' nodes, path '+(result.path?result.path.length+' waypoints':'none'),result.path?'success':'error');
  },
  tick:function(dt){
    var r=STATE.rrt;
    if(!r.tree)return;
    r.animIdx=Math.min(r.animIdx+5,r.tree.nodes.length);
    STATE.time+=dt;
    STATE.iterations=r.tree.nodes.length;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    var r=STATE.rrt;
    if(!r.grid)return;
    var gw=r.cols*r.cellSize,gh=r.rows*r.cellSize;
    var ox=(W-gw)/2,oy=(H-gh)/2;
    ctx.save();
    ctx.translate(ox,oy);
    /* Obstacles */
    for(var y=0;y<r.rows;y++){
      for(var x=0;x<r.cols;x++){
        if(r.grid.data[r.grid.idx(x,y)]){
          ctx.fillStyle='#303030';
          ctx.fillRect(x*r.cellSize,y*r.cellSize,r.cellSize-1,r.cellSize-1);
        }
      }
    }
    /* Tree */
    if(r.tree){
      /* Edges */
      ctx.strokeStyle='rgba(64,208,255,.4)';
      ctx.lineWidth=1;
      for(var i=0;i<r.tree.edges.length&&i<r.animIdx;i++){
        var e=r.tree.edges[i];
        var a=r.tree.nodes[e[0]],b=r.tree.nodes[e[1]];
        if(!a||!b)continue;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
      }
      /* Nodes */
      ctx.fillStyle='#40d0ff';
      for(var j=0;j<r.tree.nodes.length&&j<r.animIdx;j++){
        var n=r.tree.nodes[j];
        ctx.beginPath();
        ctx.arc(n.x,n.y,2,0,Math.PI*2);
        ctx.fill();
      }
      /* Path */
      if(r.tree.path){
        ctx.strokeStyle='#40ff90';
        ctx.lineWidth=3;
        ctx.lineCap='round';
        ctx.beginPath();
        r.tree.path.forEach(function(p,i){
          if(i===0)ctx.moveTo(p[0],p[1]);
          else ctx.lineTo(p[0],p[1]);
        });
        ctx.stroke();
      }
    }
    /* Start / goal */
    drawMarker(ctx,r.start[0],r.start[1],'#40d0ff','S');
    drawMarker(ctx,r.goal[0],r.goal[1],'#ff5060','G');
    ctx.restore();
    setStatsHTML(
      '<div>Nodes: '+(r.tree?r.tree.nodes.length:0)+'</div>'+
      '<div>Path: '+(r.tree&&r.tree.path?r.tree.path.length:'—')+'</div>'+
      '<div>Step size: '+r.stepSize+'</div>'+
      '<div>Goal bias: '+fmt(r.goalBias*100,0)+'%</div>'
    );
    updateBadge('🌳 RRT Path Planner');
  },
  onDown:function(){},
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var r=STATE.rrt;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full sm" onclick="MODULES.rrt.build()">🌳 Rebuild Tree</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="regenRRTMap()">🎲 New Map</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Step size</span><span>'+r.stepSize+'</span></div>';
    html+='<input type="range" min="10" max="60" step="2" value="'+r.stepSize+'" oninput="STATE.rrt.stepSize=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Max iterations</span><span>'+r.maxIter+'</span></div>';
    html+='<input type="range" min="500" max="8000" step="100" value="'+r.maxIter+'" oninput="STATE.rrt.maxIter=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Goal bias</span><span>'+fmt(r.goalBias*100,0)+'%</span></div>';
    html+='<input type="range" min="0" max="0.5" step="0.02" value="'+r.goalBias+'" oninput="STATE.rrt.goalBias=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>RRT Algorithm</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">Repeat until goal reached:</b><br>'+
      '1. Sample random point q<sub>rand</sub><br>'+
      '2. Find nearest node q<sub>near</sub> in tree<br>'+
      '3. Extend toward q<sub>rand</sub> by step size<br>'+
      '4. Check collision along segment<br>'+
      '5. If free, add new node to tree<br><br>'+
      'With probability p<sub>bias</sub>, sample goal directly instead of random. This speeds up convergence without biasing the tree.<br><br>'+
      'RRT is probabilistically complete: given infinite time, it finds a path if one exists.'
      +'</div></div>';
  }
});
function regenRRTMap(){
  STATE.rrt.grid=new OccupancyGrid(STATE.rrt.cols,STATE.rrt.rows,STATE.rrt.cellSize);
  STATE.rrt.grid.fillRandom(0.15);
  MODULES.rrt.init();
}

/* ================================================================
   MODULE: LIDAR
   ================================================================ */
registerModule('lidar',{
  title:'LIDAR Sensor',
  icon:'📡',
  desc:'Ray-casting LIDAR simulation on occupancy grid',
  init:function(){
    var l=STATE.lidar;
    l.grid=new OccupancyGrid(l.cols,l.rows,l.cellSize);
    l.grid.fillRandom(l.obstacleDensity);
    l.hits=lidarScan(l.grid,l.robotX,l.robotY,l.numRays,l.maxRange);
  },
  tick:function(dt){
    var l=STATE.lidar;
    if(l.spin){
      l.robotTheta+=l.spinSpeed*dt;
      l.robotTheta=norm2pi(l.robotTheta);
    }
    /* Move robot in a small circle */
    var t=STATE.time*0.3;
    l.robotX=300+Math.cos(t)*80;
    l.robotY=220+Math.sin(t*1.3)*60;
    l.hits=lidarScan(l.grid,l.robotX,l.robotY,l.numRays,l.maxRange);
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    var l=STATE.lidar;
    if(!l.grid)return;
    var gw=l.cols*l.cellSize,gh=l.rows*l.cellSize;
    var ox=(W-gw)/2,oy=(H-gh)/2;
    ctx.save();
    ctx.translate(ox,oy);
    /* Obstacles */
    for(var y=0;y<l.rows;y++){
      for(var x=0;x<l.cols;x++){
        if(l.grid.data[l.grid.idx(x,y)]){
          ctx.fillStyle='#303030';
          ctx.fillRect(x*l.cellSize,y*l.cellSize,l.cellSize-1,l.cellSize-1);
        }
      }
    }
    /* Robot */
    ctx.fillStyle='#ffb020';
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(l.robotX,l.robotY,8,0,Math.PI*2);
    ctx.fill();ctx.stroke();
    /* Sensor direction */
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(l.robotX,l.robotY);
    ctx.lineTo(l.robotX+Math.cos(l.robotTheta)*20,l.robotY+Math.sin(l.robotTheta)*20);
    ctx.stroke();
    /* LIDAR rays */
    if(l.showRays){
      l.hits.forEach(function(h){
        var alpha=0.3+0.7*(1-h.distance/l.maxRange);
        ctx.strokeStyle='rgba(64,255,144,'+alpha*0.5+')';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(l.robotX,l.robotY);
        ctx.lineTo(h.x,h.y);
        ctx.stroke();
        /* Hit point */
        if(h.hit){
          ctx.fillStyle='rgba(255,80,96,.8)';
          ctx.beginPath();
          ctx.arc(h.x,h.y,2,0,Math.PI*2);
          ctx.fill();
        }
      });
    }
    ctx.restore();
    setStatsHTML(
      '<div>Rays: '+l.numRays+'</div>'+
      '<div>Range: '+l.maxRange+'</div>'+
      '<div>Hits: '+l.hits.filter(function(h){return h.hit;}).length+'</div>'+
      '<div>θ: '+fmt(deg(l.robotTheta),0)+'°</div>'
    );
    updateBadge('📡 LIDAR Sensor · '+l.numRays+' rays');
  },
  onDown:function(){},
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var l=STATE.lidar;
    var html='';
    html+='<div class="sec"><h4>Sensor</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Ray count</span><span>'+l.numRays+'</span></div>';
    html+='<input type="range" min="36" max="360" step="6" value="'+l.numRays+'" oninput="STATE.lidar.numRays=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Max range</span><span>'+l.maxRange+'</span></div>';
    html+='<input type="range" min="50" max="500" step="10" value="'+l.maxRange+'" oninput="STATE.lidar.maxRange=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Spin speed</span><span>'+fmt(l.spinSpeed,1)+' rad/s</span></div>';
    html+='<input type="range" min="-3" max="3" step="0.1" value="'+l.spinSpeed+'" oninput="STATE.lidar.spinSpeed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+=toggleRow('Spin sensor','STATE.lidar.spin');
    html+=toggleRow('Show rays','STATE.lidar.showRays');
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="regenLidarMap()">🎲 New Map</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var l=STATE.lidar;
    if(!l.hits.length)return '<div class="empty">No scan data</div>';
    var minD=Infinity,maxD=-Infinity,avgD=0,n=0;
    l.hits.forEach(function(h){
      if(h.hit){if(h.distance<minD)minD=h.distance;if(h.distance>maxD)maxD=h.distance;avgD+=h.distance;n++;}
    });
    avgD=n>0?avgD/n:0;
    var html='<div class="sec"><h4>Scan Statistics</h4>';
    html+='<div class="kv">';

registerModule('pid',{
  title:'PID Controller',
  icon:'⚙️',
  desc:'Tune a PID controller on a spring-mass-damper plant',
  init:function(){
    var p=STATE.pid;
    p.controller=new PID(p.kp,p.ki,p.kd,{min:-500,max:500});
    p.plant={y:0,vy:0,setpoint:150};
    p.history=[];
    p.t=0;
  },
  tick:function(dt){
    var p=STATE.pid;
    if(!p.controller)this.init();
    /* Plant: mass-spring-damper driven by control force
       m·ÿ = F - k·y - c·ẏ
       with m=1, k=2, c=0.5 */
    var m=1,k=2,c=0.5;
    var err=p.plant.setpoint-p.plant.y;
    var ctrl=p.controller.update(p.plant.setpoint,p.plant.y);
    var F=ctrl.output;
    /* Random disturbance */
    if(Math.random()<0.01)F+=rndF(-20,20);
    var acc=(F-k*p.plant.y-c*p.plant.vy)/m;
    p.plant.vy+=acc*dt;
    p.plant.y+=p.plant.vy*dt;
    /* Record history */
    p.history.push({
      t:p.t,
      y:p.plant.y,
      setpoint:p.plant.setpoint,
      control:F,
      error:err
    });
    if(p.history.length>1000)p.history.shift();
    p.t+=dt;
    STATE.time+=dt;
    STATE.error=Math.abs(err);
    $('sbError').textContent=fmt(Math.abs(err),3);
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    var p=STATE.pid;
    if(!p.plant)return;
    /* Draw plant visualization on left */
    var visW=W*0.35;
    /* Rail */
    var cx=visW/2;
    ctx.strokeStyle='rgba(255,176,32,.2)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(20,H/2+100);
    ctx.lineTo(visW-20,H/2+100);
    ctx.stroke();
    /* Mass */
    var massX=clamp(cx+p.plant.y*1.2,30,visW-30);
    var massY=H/2+100;
    ctx.fillStyle='#ffb020';
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(massX-25,massY-25,50,50,6);
    ctx.fill();ctx.stroke();
    /* Spring */
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.beginPath();
    var springX=cx-80;
    ctx.moveTo(springX,massY);
    for(var i=0;i<10;i++){
      var x=springX+(massX-25-springX)*(i+0.5)/10;
      var y=massY+((i%2)?-6:6);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(massX-25,massY);
    ctx.stroke();
    /* Anchor */
    ctx.fillStyle='#5c4c46';
    ctx.fillRect(springX-8,massY-30,8,60);
    /* Setpoint marker */
    var spX=clamp(cx+p.plant.setpoint*1.2,30,visW-30);
    ctx.strokeStyle='#40ff90';
    ctx.lineWidth=2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(spX,massY-50);
    ctx.lineTo(spX,massY+50);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Text */
    ctx.fillStyle='#40ff90';
    ctx.font='bold 11px monospace';
    ctx.fillText('SP',spX-8,massY-55);
    ctx.fillStyle='#ffb020';
    ctx.fillText('PV',massX-8,massY+65);
    /* Plot on right */
    var plotX=visW+10;
    var plotW=W-plotX-20;
    var plotH=H-40;
    var plotY=20;
    ctx.fillStyle='#050505';
    ctx.fillRect(plotX,plotY,plotW,plotH);
    /* Grid */
    ctx.strokeStyle='rgba(255,176,32,.06)';
    for(var gi=0;gi<=4;gi++){
      var gy=plotY+gi*plotH/4;
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    /* History plot */
    if(p.history.length>1){
      var minY=Math.min(0,p.plant.setpoint*2);
      var maxY=Math.max(p.plant.setpoint*2,100);
      /* Setpoint line */
      ctx.strokeStyle='rgba(64,255,144,.6)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([4,4]);
      ctx.beginPath();
      var sy=plotY+plotH-(p.plant.setpoint/maxY)*plotH;
      ctx.moveTo(plotX,sy);
      ctx.lineTo(plotX+plotW,sy);
      ctx.stroke();
      ctx.setLineDash([]);
      /* PV line */
      ctx.strokeStyle='#ffb020';
      ctx.lineWidth=2;
      ctx.beginPath();
      var N=p.history.length;
      for(var i=0;i<N;i++){
        var h=p.history[i];
        var px=plotX+(i/(N-1))*plotW;
        var py=plotY+plotH-clamp(h.y/maxY,0,1)*plotH;
        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
      }
      ctx.stroke();
      /* Control output */
      ctx.strokeStyle='rgba(64,208,255,.5)';
      ctx.lineWidth=1;
      ctx.beginPath();
      for(var i2=0;i2<N;i2++){
        var h2=p.history[i2];
        var px2=plotX+(i2/(N-1))*plotW;
        var py2=plotY+plotH-clamp(h2.control/500+0.5,0,1)*plotH;
        if(i2===0)ctx.moveTo(px2,py2);
        else ctx.lineTo(px2,py2);
      }
      ctx.stroke();
    }
    /* Labels */
    ctx.fillStyle='#806860';
    ctx.font='10px monospace';
    ctx.textAlign='left';
    ctx.fillText('Position',plotX+8,plotY+12);
    ctx.fillStyle='#40ff90';
    ctx.fillText('Setpoint',plotX+8,plotY+26);
    ctx.fillStyle='#40d0ff';
    ctx.fillText('Control',plotX+8,plotY+40);
    ctx.textAlign='left';
    setStatsHTML(
      '<div>Setpoint: '+fmt(p.plant.setpoint,1)+'</div>'+
      '<div>Position: '+fmt(p.plant.y,1)+'</div>'+
      '<div>Error: '+fmt(p.plant.setpoint-p.plant.y,2)+'</div>'+
      '<div>Velocity: '+fmt(p.plant.vy,1)+'</div>'+
      '<div>Kp/Ki/Kd: '+fmt(p.kp,2)+' / '+fmt(p.ki,2)+' / '+fmt(p.kd,3)+'</div>'
    );
    updateBadge('⚙️ PID Controller');
  },
  onDown:function(p){
    /* Set new setpoint based on click on rail */
    var visW=CANV.W*0.35;
    var cx=visW/2;
    var relX=p.x-cx;
    STATE.pid.plant.setpoint=clamp(relX/1.2,-100,100);
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var p=STATE.pid;
    var html='';
    html+='<div class="sec"><h4>PID Gains</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Kp</span><span>'+fmt(p.kp,2)+'</span></div>';
    html+='<input type="range" min="0" max="5" step="0.05" value="'+p.kp+'" oninput="STATE.pid.kp=parseFloat(this.value);if(STATE.pid.controller)STATE.pid.controller.kp=parseFloat(this.value);renderLeftPanel()"></div>';

function pidPreset(name){
  var p=STATE.pid;
  if(name==='underdamped'){p.kp=1.0;p.ki=0.1;p.kd=0.05;}
  else if(name==='critical'){p.kp=2.5;p.ki=0.5;p.kd=0.6;}
  else if(name==='overdamped'){p.kp=1.5;p.ki=0.8;p.kd=1.5;}
  else if(name==='oscillating'){p.kp=4.5;p.ki=1.5;p.kd=0.02;}
  if(p.controller){
    p.controller.kp=p.kp;p.controller.ki=p.ki;p.controller.kd=p.kd;
  }
  renderLeftPanel();
}
function resetPid(){
  var p=STATE.pid;
  p.controller=new PID(p.kp,p.ki,p.kd,{min:-500,max:500});
  p.plant={y:0,vy:0,setpoint:150};
  p.history=[];
  p.t=0;
}

registerModule('swarm',{
  title:'Swarm Robotics',
  icon:'🛸',
  desc:'Formation and flocking behaviors',
  init:function(){
    var s=STATE.swarm;
    s.agents=[];
    for(var i=0;i<s.numAgents;i++){
      var a=new SwarmAgent(CANV.W/2+rndF(-100,100),CANV.H/2+rndF(-100,100),i);
      s.agents.push(a);
    }
  },
  tick:function(dt){
    var s=STATE.swarm;
    if(!s.agents.length)this.init();
    if(s.autoRotate)s.rotation+=dt*0.5;
    swarmStep(s.agents,dt,{
      mode:s.mode,
      centerX:s.centerX,
      centerY:s.centerY,
      radius:s.radius,
      sepRadius:s.sepRadius,
      neighborhood:s.neighborhood,
      speed:s.speed,
      rotation:s.rotation
    });
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,W,H);
    drawGrid(ctx,W,H,40,'rgba(255,176,32,.04)');
    var s=STATE.swarm;
    /* Formation targets */
    if(s.mode==='formation'){
      ctx.strokeStyle='rgba(64,208,255,.2)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.arc(s.centerX,s.centerY,s.radius,0,Math.PI*2);
      ctx.stroke();
      s.agents.forEach(function(a){
        ctx.fillStyle='rgba(64,208,255,.3)';
        ctx.beginPath();
        ctx.arc(a.targetX,a.targetY,3,0,Math.PI*2);
        ctx.fill();
      });
    }
    /* Trails */
    s.agents.forEach(function(a){
      if(a.trail.length>1){
        ctx.strokeStyle='rgba(255,176,32,.15)';
        ctx.lineWidth=1;
        ctx.beginPath();
        a.trail.forEach(function(p,i){
          if(i===0)ctx.moveTo(p[0],p[1]);
          else ctx.lineTo(p[0],p[1]);
        });
        ctx.stroke();
      }
    });
    /* Agents */
    s.agents.forEach(function(a){
      var speed=Math.hypot(a.vx,a.vy);
      var ang=Math.atan2(a.vy,a.vx);
      ctx.fillStyle='#ffb020';
      ctx.strokeStyle='#fff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(a.x,a.y,6,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
      /* Direction indicator */
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(a.x+Math.cos(ang)*10,a.y+Math.sin(ang)*10);
      ctx.stroke();
    });
    /* Center marker */
    ctx.strokeStyle='rgba(255,80,96,.5)';
    ctx.lineWidth=2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(s.centerX-15,s.centerY);
    ctx.lineTo(s.centerX+15,s.centerY);
    ctx.moveTo(s.centerX,s.centerY-15);
    ctx.lineTo(s.centerX,s.centerY+15);
    ctx.stroke();
    ctx.setLineDash([]);
    setStatsHTML(
      '<div>Agents: '+s.agents.length+'</div>'+
      '<div>Mode: '+s.mode+'</div>'+
      '<div>Radius: '+s.radius+'</div>'+
      '<div>Speed: '+s.speed+'</div>'
    );
    updateBadge('🛸 Swarm · '+s.agents.length+' agents · '+s.mode);
  },
  onDown:function(p){
    STATE.swarm.centerX=p.x;
    STATE.swarm.centerY=p.y;
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var s=STATE.swarm;
    var html='';
    html+='<div class="sec"><h4>Behavior</h4>';
    html+='<button class="btn full sm '+(s.mode==='formation'?'primary':'')+'" onclick="STATE.swarm.mode=\'formation\';renderLeftPanel()">Formation</button>';

    html+='<div class="ctrl"><div class="lbl"><span>Radius</span><span>'+s.radius+'</span></div>';

    html+='<div class="ctrl"><div class="lbl"><span>Speed</span><span>'+s.speed+'</span></div>';

function drawGrid(ctx,W,H,size,color){
  ctx.strokeStyle=color;
  ctx.lineWidth=1;
  for(var x=0;x<=W;x+=size){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(var y=0;y<=H;y+=size){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
}
function setStatsHTML(html){
  var e=$('coStats');
  if(e)e.innerHTML=html;
}
function updateBadge(text){
  var e=$('coBadge');
  if(e)e.textContent=text;
}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length){
    html+='<div class="empty" style="padding:20px;font-size:.62rem">No events yet</div>';
  } else {
    LOG.slice().reverse().forEach(function(l){
      var color=l.type==='error'?'var(--c4)':l.type==='success'?'var(--c3)':l.type==='warn'?'var(--c5)':'var(--c2)';
      html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
        '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
        '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
    });
  }
  html+='</div>';
  p.innerHTML=html;
}

/* ================================================================

   ================================================================ */
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Playing':'Paused','info',1000);
}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
    toast('Reset','success',1000);
  }
}
function stepModule(){
  var dt=1/60;
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].tick){
    MODULES[STATE.currentTab].tick(dt);
  }
  STATE.steps++;
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
function toggleRow(label,path,onChange){
  var val=eval(path);
  var onclick="eval('"+path+"=!'+path+"');this.classList.toggle('on');"+(onChange?"("+onChange.toString()+")();":"")+"renderLeftPanel();";
  return '<div class="ctrl flex-between"><span style="font-size:.68rem;color:var(--tx2)">'+label+'</span><div class="toggle'+(val?' on':'')+'" onclick="'+onclick+'"></div></div>';
}

var THEMES=['industry','neon','medical','matrix'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function saveState(){
  try{
    var data={
      version:'1.0',
      arm2d:STATE.arm2d,
      arm3d:STATE.arm3d,
      swarm:{numAgents:STATE.swarm.numAgents,mode:STATE.swarm.mode,radius:STATE.swarm.radius,speed:STATE.swarm.speed},
      pid:{kp:STATE.pid.kp,ki:STATE.pid.ki,kd:STATE.pid.kd}
    };
    localStorage.setItem('robotica-state',JSON.stringify(data));
    toast('State saved','success');
  }catch(e){toast('Save failed','error')}
}
function loadState(){
  try{
    var raw=localStorage.getItem('robotica-state');
    if(!raw){toast('No saved state','warn');return}
    var data=JSON.parse(raw);
    if(data.arm2d)Object.assign(STATE.arm2d,data.arm2d);
    if(data.arm3d)Object.assign(STATE.arm3d,data.arm3d);
    if(data.swarm)Object.assign(STATE.swarm,data.swarm);
    if(data.pid){STATE.pid.kp=data.pid.kp;STATE.pid.ki=data.pid.ki;STATE.pid.kd=data.pid.kd;if(STATE.pid.controller)resetPid();}
    renderLeftPanel();
    toast('State loaded','success');
  }catch(e){toast('Load failed','error')}
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    arm2d:STATE.arm2d,
    arm3d:STATE.arm3d,
    swarm:{numAgents:STATE.swarm.numAgents,mode:STATE.swarm.mode},
    pid:{kp:STATE.pid.kp,ki:STATE.pid.ki,kd:STATE.pid.kd}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='robotica-state.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Exported','success');
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0,fpsDisplay=60;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    fpsDisplay=fpsFrames/fpsAccum;
    fpsAccum=0;fpsFrames=0;
    $('sbFps').textContent=Math.round(fpsDisplay);
  }
  /* Tick */
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){
      try{m.tick(dt);}catch(e){console.error(e);}
    }
    STATE.steps++;
  }
  /* Draw */
  var m2=MODULES[STATE.currentTab];
  if(m2&&m2.draw){
    try{m2.draw(CANV.ctx);}catch(e){console.error(e);}
  }
  /* Update status bar */
  $('sbTime').textContent=fmt(STATE.time,2)+'s';
  $('sbSteps').textContent=STATE.steps;
  $('sbIter').textContent=STATE.iterations;
  requestAnimationFrame(mainLoop);
}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='.')stepModule();
  else if(e.key>='1'&&e.key<='8'){
    var idx=parseInt(e.key)-1;
    if(TABS[idx])switchTab(TABS[idx].key);
  }
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

var BOOT_STEPS=[
  'Initializing kinematics engine...',
  'Loading DH parameter transforms...',
  'Compiling CCD solver...',
  'Preparing Jacobian calculator...',
  'Warming up A* and RRT planners...',
  'Initializing LIDAR ray caster...',
  'Loading PID controller...',
  'Starting swarm agents...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('ROBOTICA ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

});
