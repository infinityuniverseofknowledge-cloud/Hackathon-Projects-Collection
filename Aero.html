/* ══════════════ Dashboard ══════════════ */
R.dashboard=function(dt){
  clear();
  headline('Aero','aerospace & spacecraft engineering · '+MODULES.length+' modules');
  /* Animated rocket ascent trajectory */
  if(!S.sim.dash){S.sim.dash={t:0};}
  S.sim.dash.t+=dt;
  var cx=S.W/2,cy=S.H/2;
  /* Ground */
  S.ctx.fillStyle='rgba(0,170,255,.05)';
  S.ctx.fillRect(cx-300,cy+180,600,60);
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=1;
  S.ctx.beginPath();S.ctx.moveTo(cx-300,cy+180);S.ctx.lineTo(cx+300,cy+180);S.ctx.stroke();
  /* Rocket */
  var rocketX=cx-200+(S.sim.dash.t*40)%400;
  var rocketY=cy+150;
  var pitch=Math.min(S.sim.dash.t*0.05,0.5);
  S.ctx.save();
  S.ctx.translate(rocketX,rocketY);
  S.ctx.rotate(-pitch);
  /* Rocket body */
  S.ctx.fillStyle='#00aaff';
  S.ctx.fillRect(-8,-30,16,50);
  /* Nose */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.beginPath();
  S.ctx.moveTo(-8,-30);S.ctx.lineTo(0,-45);S.ctx.lineTo(8,-30);S.ctx.closePath();
  S.ctx.fill();
  /* Fins */
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();
  S.ctx.moveTo(-8,10);S.ctx.lineTo(-14,20);S.ctx.lineTo(-8,20);S.ctx.closePath();S.ctx.fill();
  S.ctx.beginPath();
  S.ctx.moveTo(8,10);S.ctx.lineTo(14,20);S.ctx.lineTo(8,20);S.ctx.closePath();S.ctx.fill();
  /* Flame */
  var flame=30+Math.random()*10;
  S.ctx.fillStyle='#ffb800';
  S.ctx.beginPath();
  S.ctx.moveTo(-5,20);S.ctx.lineTo(0,20+flame);S.ctx.lineTo(5,20);S.ctx.closePath();
  S.ctx.fill();
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();
  S.ctx.moveTo(-2,20);S.ctx.lineTo(0,20+flame*0.6);S.ctx.lineTo(2,20);S.ctx.closePath();
  S.ctx.fill();
  S.ctx.restore();
  /* Trajectory */
  S.ctx.strokeStyle='rgba(0,221,204,.5)';
  S.ctx.lineWidth=2;
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  for(var i=0;i<=20;i++){
    var tx=cx-200+i*20;
    var ty=cy+180-Math.pow(i/20,2)*300;
    if(i===0)S.ctx.moveTo(tx,ty);else S.ctx.lineTo(tx,ty);
  }
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Labels */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('TRAJECTORY',cx+200,cy-80);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Δv: 9.4 km/s',cx+200,cy-55);
  S.ctx.fillText('Apogee: 400 km',cx+200,cy-35);
  S.ctx.fillText('Payload: 22,800 kg',cx+200,cy-15);
  /* Cards */
  var cards=[
    {x:30,y:80,l:'Modules',v:MODULES.length,c:'#00aaff'},
    {x:S.W-220,y:80,l:'Engines',v:ENGINES.length,c:'#ff2d55'},
    {x:30,y:S.H-90,l:'Launch vehicles',v:LAUNCH_VEHICLES.length,c:'#ffb800'},
    {x:S.W-220,y:S.H-90,l:'Airfoils',v:AIRFOILS.length,c:'#00ddcc'}
  ];
  cards.forEach(function(c){
    S.ctx.fillStyle='rgba(13,18,28,.9)';
    S.ctx.fillRect(c.x,c.y-25,180,55);
    S.ctx.strokeStyle=c.c;
    S.ctx.globalAlpha=.5;
    S.ctx.strokeRect(c.x+.5,c.y-24.5,179,54);
    S.ctx.globalAlpha=1;
    S.ctx.fillStyle='#4a5460';
    S.ctx.font='500 8.5px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(c.l.toUpperCase(),c.x+12,c.y-9);
    S.ctx.fillStyle=c.c;
    S.ctx.font='700 18px "Orbitron",monospace';
    S.ctx.fillText(String(c.v),c.x+12,c.y+16);
  });
};

/* ══════════════ ISA Atmosphere ══════════════ */
R.isa=function(dt){
  clear();
  headline('Standard Atmosphere','ISA model to 86 km');
  if(!S.sim.isa){S.sim.isa={alt:10000}}
  var p=S.sim.isa;
  var atm=isaAtmosphere(p.alt);
  /* Plot T, P, rho vs altitude */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=(S.W-padL-padR)/3-20,plotH=S.H-padT-padB;
  var colors=['#ff2d55','#00aaff','#00d97d'];
  var fields=[
    {name:'Temperature',unit:'K',key:'T',max:300,color:colors[0]},
    {name:'Pressure',unit:'Pa',key:'P',max:101325,color:colors[1],log:true},
    {name:'Density',unit:'kg/m³',key:'rho',max:1.225,color:colors[2],log:true}
  ];
  fields.forEach(function(f,fi){
    var px=padL+fi*(plotW+40);
    axes(px,padT,plotW,plotH,'altitude (km)',f.name);
    S.ctx.strokeStyle=f.color;
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    for(var i=0;i<=100;i++){
      var h=i*86000/100;
      var a=isaAtmosphere(h);
      var v=a[f.key];
      var norm=f.log?Math.log10(v/1e-6+1)/Math.log10(f.max/1e-6+1):v/f.max;
      var x=px+(i/100)*plotW;
      var y=padT+plotH-norm*plotH;
      if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    /* Current marker */
    var ax=px+(p.alt/86000)*plotW;
    var cur=atm[f.key];
    var curNorm=f.log?Math.log10(cur/1e-6+1)/Math.log10(f.max/1e-6+1):cur/f.max;
    var ay=padT+plotH-curNorm*plotH;
    S.ctx.fillStyle=f.color;
    S.ctx.beginPath();S.ctx.arc(ax,ay,6,0,Math.PI*2);S.ctx.fill();
  });
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Altitude: '+commas(p.alt)+' m',padL,S.H-70);
  S.ctx.fillStyle='#ff7088';S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.fillText('T = '+fmt(atm.T,2)+' K',padL,S.H-45);
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.fillText('P = '+expo(atm.P,3)+' Pa',padL+200,S.H-45);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.fillText('ρ = '+expo(atm.rho,3)+' kg/m³',padL+400,S.H-45);
  S.ctx.fillStyle='#ffd060';
  S.ctx.fillText('a = '+fmt(atm.a,2)+' m/s (Mach 1)',padL+600,S.H-45);
};

/* ══════════════ Airfoil Viewer ══════════════ */
R.airfoil=function(dt){
  clear();
  headline('Airfoil Viewer','NACA 4-digit coordinates');
  if(!S.sim.af){S.sim.af={thickness:12,camber:2,p:0.4,alpha:5}}
  var p=S.sim.af;
  var af=naca4(p.thickness,p.camber/100,p.p,80);
  /* Draw airfoil */
  var cx=S.W/2,cy=S.H/2-40;
  var chord=Math.min(S.W*0.7,600);
  var scaleY=chord*3;
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2;
  /* Upper surface */
  S.ctx.beginPath();
  af.upper.forEach(function(pt,i){
    var x=cx-chord/2+pt.x*chord;
    var y=cy-pt.y*scaleY;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Lower surface */
  S.ctx.beginPath();
  af.lower.forEach(function(pt,i){
    var x=cx-chord/2+pt.x*chord;
    var y=cy-pt.y*scaleY;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Chord line */
  S.ctx.strokeStyle='rgba(136,144,160,.4)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  S.ctx.moveTo(cx-chord/2,cy);
  S.ctx.lineTo(cx+chord/2,cy);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Angle of attack */
  var alphaRad=p.alpha*Math.PI/180;
  S.ctx.strokeStyle='#ff2d55';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  S.ctx.moveTo(cx-chord/2-40,cy);
  S.ctx.lineTo(cx-chord/2-40-Math.cos(alphaRad)*80,cy+Math.sin(alphaRad)*80);
  S.ctx.stroke();
  S.ctx.fillStyle='#ff2d55';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('α = '+p.alpha+'°',cx-chord/2-40,cy+30);
  /* Legend */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('NACA '+p.camber+p.thickness+(p.p*10),padL=40,cy+180);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Chord: 1.0',40,cy+205);
  S.ctx.fillText('Thickness: '+p.thickness+'%',40,cy+225);
  S.ctx.fillText('Camber: '+p.camber+'%',40,cy+245);
  S.ctx.fillText('Position: '+(p.p*100)+'%',40,cy+265);
  /* Info */
  var AR=7;
  var slope=2*Math.PI*AR/(2+Math.sqrt(4+AR*AR*0.85*0.85));
  var CL=liftCoefficient(alphaRad,0,slope);
  S.ctx.fillStyle='#00d97d';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.fillText('AR='+AR+' CL='+fmt(CL,3),S.W-300,cy+180);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Lift slope: '+fmt(slope,3)+' /rad',S.W-300,cy+205);
  S.ctx.fillText('CD_induced: '+fmt(inducedDrag(CL,AR),5),S.W-300,cy+225);
  S.ctx.fillText('L/D: '+fmt(CL/(0.02+inducedDrag(CL,AR)),2),S.W-300,cy+245);
};

/* ══════════════ Lift & Drag ══════════════ */
R.liftDrag=function(dt){
  clear();
  headline('Lift & Drag Curves','aerodynamic performance');
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=(S.W-padL-padR)/2-20,plotH=S.H-padT-padB;
  /* CL vs alpha */
  var px1=padL;
  axes(px1,padT,plotW,plotH,'alpha (deg)','CL');
  var AR=7,slope=2*Math.PI*AR/(2+Math.sqrt(4+AR*AR*0.7));
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=60;i++){
    var a=-5+i*30/60;
    var aRad=a*Math.PI/180;
    var cl=Math.min(slope*aRad,1.4);
    if(a>15)cl=1.4-Math.pow((a-15)/5,2)*0.2;
    var x=px1+((a+5)/30)*plotW;
    var y=padT+plotH-(cl/1.6)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* CLmax marker */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  S.ctx.moveTo(px1,padT+plotH-(1.4/1.6)*plotH);
  S.ctx.lineTo(px1+plotW,padT+plotH-(1.4/1.6)*plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  S.ctx.fillStyle='#ff2d55';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CLmax = 1.4',px1+5,padT+plotH-(1.4/1.6)*plotH-5);
  /* CL vs CD polar */
  var px2=padL+plotW+40;
  axes(px2,padT,plotW,plotH,'CD','CL');
  S.ctx.strokeStyle='#00d97d';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var cl=-0.3+i*1.7/100;
    var cd=0.02+cl*cl/(Math.PI*AR*0.85);
    var x=px2+(cd/0.3)*plotW;
    var y=padT+plotH-((cl+0.3)/1.6)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Best L/D point */
  var bestLD=0,bestCL=0;
  for(var i=0;i<=100;i++){
    var cl=-0.3+i*1.7/100;
    var cd=0.02+cl*cl/(Math.PI*AR*0.85);
    if(cd>0&&cl>0){
      var ld=cl/cd;
      if(ld>bestLD){bestLD=ld;bestCL=cl}
    }
  }
  var bestCD=0.02+bestCL*bestCL/(Math.PI*AR*0.85);
  S.ctx.fillStyle='#ffb800';
  S.ctx.beginPath();
  S.ctx.arc(px2+(bestCD/0.3)*plotW,padT+plotH-((bestCL+0.3)/1.6)*plotH,8,0,Math.PI*2);
  S.ctx.fill();
  S.ctx.fillStyle='#ffb800';
  S.ctx.font='700 11px "JetBrains Mono",monospace';
  S.ctx.fillText('Best L/D: '+fmt(bestLD,1),px2+5,padT+20);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText('at CL = '+fmt(bestCL,3),px2+5,padT+40);
};

};

/* ══════════════ Prandtl-Meyer ══════════════ */
R.prandtlMeyer=function(dt){
  clear();
  headline('Prandtl-Meyer Expansion','supersonic flow turning');
  if(!S.sim.pm){S.sim.pm={M1:2.0,theta:15}}
  var p=S.sim.pm;
  var nu1=prandtlMeyer(p.M1);
  var nu2=nu1+p.theta*Math.PI/180;
  var M2=inversePrandtlMeyer(nu2);
  /* Plot ν vs M */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'Mach','ν (deg)');
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var m=1+i*9/100;
    var nu=prandtlMeyer(m)*180/Math.PI;
    var x=padL+((m-1)/9)*plotW;
    var y=padT+plotH-(nu/80)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Markers */
  var x1=padL+((p.M1-1)/9)*plotW;
  var y1=padT+plotH-(nu1*180/Math.PI/80)*plotH;
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();S.ctx.arc(x1,y1,6,0,Math.PI*2);S.ctx.fill();
  var x2=padL+((M2-1)/9)*plotW;
  var y2=padT+plotH-(nu2*180/Math.PI/80)*plotH;
  S.ctx.fillStyle='#00d97d';
  S.ctx.beginPath();S.ctx.arc(x2,y2,6,0,Math.PI*2);S.ctx.fill();
  /* Values */
  S.ctx.fillStyle='#ff7088';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('M₁ = '+fmt(p.M1,3)+'  ν₁ = '+fmt(nu1*180/Math.PI,2)+'°',padL,S.H-70);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.fillText('M₂ = '+fmt(M2,3)+'  ν₂ = '+fmt(nu2*180/Math.PI,2)+'°',padL,S.H-45);
  S.ctx.fillStyle='#8890a0';
  S.ctx.fillText('Turning angle: '+p.theta+'°',padL+400,S.H-45);
};

<script>
/* ══════════════ Rocket Equation ══════════════ */

  headline('Rocket Equation','Tsiolkovsky · ideal rocket');
  if(!S.sim.re){S.sim.re={isp:350,m0:500000,mf:50000}}

  var ve=exhaustVelocity(p.isp);

  for(var i=0;i<=100;i++){
    var ratio=1+i*19/100;

    var y=padT+plotH-(dvi/15)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Current marker */

  var yc=padT+plotH-(dv/1000/15)*plotH;
  S.ctx.fillStyle='#00d97d';
  S.ctx.beginPath();S.ctx.arc(xc,yc,8,0,Math.PI*2);S.ctx.fill();
  /* Values */

  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';

  S.ctx.fillText('Isp = '+p.isp+' s',padL,S.H-65);

/* ══════════════ Staging ══════════════ */
R.staging=function(dt){
  clear();
  headline('Multi-Stage Rocket','staging optimization');
  if(!S.sim.stg){S.sim.stg={payload:1000,isp:340,eps:0.08,totalDv:9400,stages:2}}
  var p=S.sim.stg;
  /* Ideal staging: for each stage, allocate dv */
  var results=[];
  var remainingDv=p.totalDv;
  var payload=p.payload;
  var currentPayload=payload;
  for(var i=0;i<p.stages;i++){
    var dvStage=p.totalDv/p.stages;
    var mr=massRatio(dvStage,p.isp);
    /* m0/mf = mr; mf includes structure + payload. Solve: m_prop + m_struct + m_payload = m0 */
    /* mr = m0/mf; mf = m_struct + m_payload; m_struct = eps*m0 */
    /* (m_prop+eps*m0+mp)/mf = mr -> solve */
    /* Simpler: m_stage_dry = eps * m0; mf = mp + eps*m0 */
    /* m0 = mf*mr; m0 = (mp + eps*m0)*mr; m0(1-eps*mr)=mp*mr */
    var m0=currentPayload*mr/(1-p.eps*mr);
    var mf=currentPayload+p.eps*m0;
    var prop=m0-mf;
    results.push({stage:i+1,dv:dvStage,m0:m0,mf:mf,prop:prop,mr:mr});
    currentPayload=m0;
  }
  /* Draw stage stack */
  var cx=S.W/2-200;
  var cy=S.H/2;
  var totalHeight=400;
  var maxWidth=100;
  var yOff=cy-totalHeight/2;
  var totalMass=results[results.length-1].m0;
  results.slice().reverse().forEach(function(r,i){
    var h=totalHeight/results.length;
    var w=maxWidth*Math.sqrt(r.m0/totalMass);
    var color=['#ff2d55','#00aaff','#00d97d','#ffb800'][i%4];
    S.ctx.fillStyle=color+'40';
    S.ctx.fillRect(cx-w/2,yOff,w,h-2);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(cx-w/2,yOff,w,h-2);
    S.ctx.fillStyle=color;
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('S'+(results.length-i),cx,yOff+h/2);
    yOff+=h;
  });
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('STAGES',cx+120,140);
  results.forEach(function(r,i){
    var y=170+i*80;
    S.ctx.fillStyle='#8890a0';
    S.ctx.font='10.5px "JetBrains Mono",monospace';
    S.ctx.fillText('Stage '+(i+1),cx+120,y);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.fillText('Δv: '+fmt(r.dv,1)+' m/s',cx+120,y+18);
    S.ctx.fillText('m0: '+commas(Math.round(r.m0))+' kg',cx+120,y+36);
    S.ctx.fillText('prop: '+commas(Math.round(r.prop))+' kg',cx+120,y+54);
  });
  /* Summary */
  S.ctx.fillStyle='#ffb800';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.fillText('Total Δv: '+commas(p.totalDv)+' m/s',cx+120,y);
  S.ctx.fillText('Payload: '+commas(p.payload)+' kg',cx+120,y+25);
  S.ctx.fillText('Gross: '+commas(Math.round(results[results.length-1].m0))+' kg',cx+120,y+50);
};

/* ══════════════ Nozzle Design ══════════════ */
R.nozzle=function(dt){
  clear();
  headline('De Laval Nozzle','converging-diverging');
  if(!S.sim.nz){S.sim.nz={At:0.1,Ae:1.0,pc:70e5,Tc:3500,gamma:1.2}}
  var p=S.sim.nz;
  var AR=p.Ae/p.At;
  /* Find exit Mach from area ratio */
  var Me=2.0;
  for(var i=0;i<50;i++){
    var f=nozzleAreaRatio(Me,p.gamma)-AR;
    var dM=0.001;
    var df=(nozzleAreaRatio(Me+dM,p.gamma)-nozzleAreaRatio(Me-dM,p.gamma))/(2*dM);
    Me-=f/df;
    if(Me<1.01)Me=1.01;
  }
  var cstar=characteristicVelocity(p.gamma,287,p.Tc,70e5,101325);
  var ve=Me*Math.sqrt(p.gamma*287*p.Tc/(1+(p.gamma-1)/2*Me*Me));
  /* Draw nozzle */
  var cx=S.W/2,cy=S.H/2-40;
  var chord=Math.min(S.W*0.6,600);
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  var halfAt=Math.sqrt(p.At/Math.PI);
  var halfAe=Math.sqrt(p.Ae/Math.PI);
  var scale=chord/2*0.8;
  /* Converging */
  S.ctx.beginPath();
  S.ctx.moveTo(cx-chord/2,cy-halfAt*scale*4);
  for(var i=0;i<=30;i++){
    var t=i/30;
    var x=cx-chord/2+t*chord*0.3;
    var r=halfAt*4*(1-t)+halfAt*t;
    S.ctx.lineTo(x,cy-r*scale);
  }
  /* Diverging */
  for(var i=0;i<=30;i++){
    var t=i/30;
    var x=cx-chord*0.2+t*chord*0.7;
    var r=halfAt*(1-t)+halfAe*t;
    S.ctx.lineTo(x,cy-r*scale);
  }
  S.ctx.stroke();
  /* Lower curve */
  S.ctx.beginPath();
  S.ctx.moveTo(cx-chord/2,cy+halfAt*scale*4);
  for(var i=0;i<=30;i++){
    var t=i/30;
    var x=cx-chord/2+t*chord*0.3;
    var r=halfAt*4*(1-t)+halfAt*t;
    S.ctx.lineTo(x,cy+r*scale);
  }
  for(var i=0;i<=30;i++){
    var t=i/30;
    var x=cx-chord*0.2+t*chord*0.7;
    var r=halfAt*(1-t)+halfAe*t;
    S.ctx.lineTo(x,cy+r*scale);
  }
  S.ctx.stroke();
  /* Throat marker */
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();
  S.ctx.arc(cx-chord*0.2,cy,6,0,Math.PI*2);
  S.ctx.fill();
  S.ctx.fillStyle='#ff7088';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('Throat M=1',cx-chord*0.2,cy-30);

/* ══════════════ Kepler Orbits ══════════════ */
R.orbits=function(dt){
  clear();
  headline('Kepler Orbits','two-body propagation');
  if(!S.sim.orb){S.sim.orb={a:7000000,e:0.3,M:0}}
  var p=S.sim.orb;
  p.M+=dt*0.3;
  var E=keplerEquation(p.M,p.e);
  var r=p.a*(1-p.e*Math.cos(E));
  var nu=2*Math.atan2(Math.sqrt(1+p.e)*Math.sin(E/2),Math.sqrt(1-p.e)*Math.cos(E/2));
  var x=r*Math.cos(nu);
  var y=r*Math.sin(nu);
  /* Draw orbit */
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.4/(p.a*(1+p.e));
  S.ctx.strokeStyle='rgba(0,170,255,.5)';
  S.ctx.lineWidth=1.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var Mi=i/100*2*Math.PI;
    var Ei=keplerEquation(Mi,p.e);
    var ri=p.a*(1-p.e*Math.cos(Ei));
    var nui=2*Math.atan2(Math.sqrt(1+p.e)*Math.sin(Ei/2),Math.sqrt(1-p.e)*Math.cos(Ei/2));
    var xi=ri*Math.cos(nui);
    var yi=ri*Math.sin(nui);
    var px=cx+xi*scale;
    var py=cy-yi*scale;
    if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
  }
  S.ctx.stroke();
  /* Central body */
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx,cy,15,0,Math.PI*2);S.ctx.fill();
  /* Satellite */
  S.ctx.fillStyle='#ffb800';
  S.ctx.beginPath();S.ctx.arc(cx+x*scale,cy-y*scale,8,0,Math.PI*2);S.ctx.fill();
  /* Values */
  var v=visViva(r,p.a);
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('a = '+commas(p.a/1000)+' km',60,S.H-100);
  S.ctx.fillText('e = '+p.e,60,S.H-75);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('r = '+commas(Math.round(r/1000))+' km',60,S.H-50);
  S.ctx.fillText('v = '+fmt(v/1000,3)+' km/s',60,S.H-25);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.fillText('Period: '+fmt(orbitPeriod(p.a)/60,2)+' min',400,S.H-50);
  S.ctx.fillText('Altitude: '+commas(Math.round((r-CONST.RE)/1000))+' km',400,S.H-25);
};

/* ══════════════ Hohmann Transfer ══════════════ */
R.hohmann=function(dt){
  clear();
  headline('Hohmann Transfer','optimal two-burn transfer');
  if(!S.sim.hoh){S.sim.hoh={r1:6678,r2:42164}}
  var p=S.sim.hoh;
  var r1=p.r1*1000;
  var r2=p.r2*1000;
  var result=hohmannTransfer(r1,r2);
  /* Draw orbits */
  var cx=S.W/2,cy=S.H/2;
  var maxR=r2;
  var scale=Math.min(S.W,S.H)*0.4/maxR;
  [r1,r2].forEach(function(r,i){
    S.ctx.strokeStyle=i===0?'#5cc5ff':'#ff8833';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();S.ctx.arc(cx,cy,r*scale,0,Math.PI*2);S.ctx.stroke();
  });
  /* Transfer ellipse */
  var aT=result.aT;
  var eT=(r2-r1)/(r2+r1);
  S.ctx.strokeStyle='rgba(255,184,0,.6)';
  S.ctx.setLineDash([6,4]);
  S.ctx.lineWidth=1.5;
  S.ctx.beginPath();
  S.ctx.ellipse(cx-aT*eT*scale,cy,aT*scale,aT*scale*Math.sqrt(1-eT*eT),0,0,Math.PI*2);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Earth */
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx,cy,10,0,Math.PI*2);S.ctx.fill();
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Δv₁ = '+fmt(result.dv1,1)+' m/s',60,S.H-130);
  S.ctx.fillText('Δv₂ = '+fmt(result.dv2,1)+' m/s',60,S.H-105);
  S.ctx.fillStyle='#00d97d';
  S.ctx.fillText('Δv total = '+fmt(result.dvTotal,1)+' m/s',60,S.H-80);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Transfer time: '+fmt(result.tTransfer/3600,2)+' hours',60,S.H-50);
  S.ctx.fillText('Semi-major transfer: '+commas(Math.round(aT/1000))+' km',60,S.H-25);
};

/* ══════════════ Lambert Solver ══════════════ */
R.lambert=function(dt){
  clear();
  headline('Lambert Problem','boundary value solver');
  if(!S.sim.lam){S.sim.lam={r1:7000,r2:10000,dnu:120,dt:3600}}
  var p=S.sim.lam;
  var r1=V(p.r1*1000,0,0);
  var dnu=p.dnu*Math.PI/180;
  var r2=V(p.r2*1000*Math.cos(dnu),p.r2*1000*Math.sin(dnu),0);
  var result=lambertSolver(r1,r2,p.dt,CONST.muE,true);
  /* Draw */
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.4/Math.max(p.r1,p.r2)/1000;
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx,cy,10,0,Math.PI*2);S.ctx.fill();
  /* r1, r2 markers */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.beginPath();S.ctx.arc(cx+p.r1*scale,cy,p.r1*scale*0,6,0,Math.PI*2);S.ctx.fill();
  S.ctx.beginPath();S.ctx.arc(cx+p.r1*scale,cy,6,0,Math.PI*2);S.ctx.fill();
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();S.ctx.arc(cx+r2.x/1000*scale,cy-r2.y/1000*scale,6,0,Math.PI*2);S.ctx.fill();
  /* Transfer arc (visual approximation) */
  S.ctx.strokeStyle='#ffb800';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<=50;i++){
    var t=i/50;
    var ang=t*dnu;
    var r=p.r1+(p.r2-p.r1)*Math.sin(t*Math.PI)/2+p.r2*t*0.5;
    var px=cx+r*scale*Math.cos(ang);
    var py=cy-r*scale*Math.sin(ang);
    if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
  }
  S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Δν = '+p.dnu+'°',60,S.H-100);
  S.ctx.fillText('Δt = '+p.dt+' s',60,S.H-75);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('v₁ = '+fmt(vLen(result.v1)/1000,4)+' km/s',60,S.H-50);
  S.ctx.fillText('v₂ = '+fmt(vLen(result.v2)/1000,4)+' km/s',60,S.H-25);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('z = '+fmt(result.z,3),400,S.H-50);
};

/* ══════════════ J2 Perturbations ══════════════ */
R.j2=function(dt){
  clear();
  headline('J2 Perturbations','Earth oblateness effects');
  if(!S.sim.j2){S.sim.j2={a:7000,e:0.01,i:51.6}}
  var p=S.sim.j2;
  var rates=j2Rates(p.a*1000,p.e,p.i*Math.PI/180);
  /* Draw orbit precession over time */
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.35/(p.a*1000);
  var t=0;
  for(var k=0;k<8;k++){
    var raan=(t*rates.raan+p.i)*180/Math.PI;
    S.ctx.strokeStyle='hsla('+(k*40)+',70%,60%,0.5)';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    for(var i=0;i<=50;i++){
      var ang=i/50*Math.PI*2;
      var x=Math.cos(ang)*p.a*1000;
      var y=Math.sin(ang)*p.a*1000*Math.cos(p.i*Math.PI/180);
      var z=Math.sin(ang)*p.a*1000*Math.sin(p.i*Math.PI/180);
      /* Rotate by RAAN */
      var xr=x*Math.cos(raan)-y*Math.sin(raan);
      var yr=x*Math.sin(raan)+y*Math.cos(raan);
      var px=cx+xr*scale;
      var py=cy-z*scale;
      if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
    }
    S.ctx.stroke();
    t+=3600*24;
  }
  /* Earth */
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx,cy,15,0,Math.PI*2);S.ctx.fill();
  /* Rates */
  var raanDegDay=rates.raan*180/Math.PI*86400;
  var argpDegDay=rates.argp*180/Math.PI*86400;
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('dΩ/dt: '+fmt(raanDegDay,3)+' °/day',60,S.H-100);
  S.ctx.fillText('dω/dt: '+fmt(argpDegDay,3)+' °/day',60,S.H-75);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('a = '+p.a+' km',60,S.H-50);
  S.ctx.fillText('i = '+p.i+'°',60,S.H-25);
};

/* ══════════════ Lagrange Points ══════════════ */
R.lagrange=function(dt){
  clear();
  headline('Lagrange Points','restricted three-body');
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W*0.4,S.H*0.4)/2;
  /* Sun */
  S.ctx.fillStyle='#ffb800';
  S.ctx.beginPath();S.ctx.arc(cx-scale,cy,20,0,Math.PI*2);S.ctx.fill();
  /* Earth */
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx+scale,cy,10,0,Math.PI*2);S.ctx.fill();
  /* L1, L2 between */
  var mu=3e-6;
  var gamma=Math.cbrt(mu/3);
  var L1x=cx+scale-gamma*scale;
  var L2x=cx+scale+gamma*scale;
  var L3x=cx-scale-gamma*scale;
  /* L4, L5 */
  var L4x=cx+scale*Math.cos(Math.PI/3)-scale*Math.cos(Math.PI/3)*0.5;
  var L5x=cx+scale*Math.cos(-Math.PI/3)-scale*Math.cos(-Math.PI/3)*0.5;
  var L4y=cy-scale*Math.sin(Math.PI/3);
  var L5y=cy+scale*Math.sin(Math.PI/3);
  S.ctx.fillStyle='#00d97d';
  [[cx+scale-gamma*scale,cy,'L1'],[cx+scale+gamma*scale,cy,'L2'],[cx-scale-gamma*scale,cy,'L3'],[cx+scale*0.5,cy-scale*0.866,'L4'],[cx+scale*0.5,cy+scale*0.866,'L5']].forEach(function(pt){
    S.ctx.beginPath();S.ctx.arc(pt[0],pt[1],6,0,Math.PI*2);S.ctx.fill();
    S.ctx.fillStyle='#5cc5ff';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(pt[2],pt[0]+8,pt[1]+4);
    S.ctx.fillStyle='#00d97d';
  });
  /* Labels */
  S.ctx.fillStyle='#ffb800';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('Sun',cx-scale,cy+40);
  S.ctx.fillStyle='#00aaff';
  S.ctx.fillText('Earth',cx+scale,cy+30);
  /* Info */
  S.ctx.fillStyle='#c8d0d8';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Mission examples',60,S.H-160);
  var missions=[
    'L1: SOHO, DSCOVR, Aditya-L1 (solar observation)',
    'L2: JWST, Gaia, Euclid, Planck (deep space)',
    'L3: no missions (hidden behind Sun)',
    'L4/L5: proposed for space colonies (O\'Neill)'
  ];
  missions.forEach(function(m,i){
    S.ctx.fillStyle='#8890a0';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.fillText('▸ '+m,60,S.H-135+i*20);
  });
};

/* ══════════════ Ground Track ══════════════ */
R.groundTrack=function(dt){
  clear();
  headline('Ground Track','subsatellite point');
  if(!S.sim.gt){S.sim.gt={alt:700,inc:98.2,period:5700}}
  var p=S.sim.gt;
  /* Draw Earth map (simplified) */
  var padL=60,padT=140;
  var mapW=S.W-padL*2,mapH=S.H-padT-100;
  S.ctx.fillStyle='rgba(0,170,255,.1)';
  S.ctx.fillRect(padL,padT,mapW,mapH);
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=1;
  S.ctx.strokeRect(padL+.5,padT+.5,mapW-1,mapH-1);
  /* Grid */
  for(var lat=-90;lat<=90;lat+=30){
    var y=padT+(90-lat)/180*mapH;
    S.ctx.beginPath();S.ctx.moveTo(padL,y);S.ctx.lineTo(padL+mapW,y);S.ctx.stroke();
  }
  for(var lon=-180;lon<=180;lon+=60){
    var x=padL+(lon+180)/360*mapW;
    S.ctx.beginPath();S.ctx.moveTo(x,padT);S.ctx.lineTo(x,padT+mapH);S.ctx.stroke();
  }
  /* Equator */
  S.ctx.strokeStyle='rgba(255,45,85,.3)';
  S.ctx.beginPath();S.ctx.moveTo(padL,padT+mapH/2);S.ctx.lineTo(padL+mapW,padT+mapH/2);S.ctx.stroke();
  /* Ground track */
  S.ctx.strokeStyle='#00d97d';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  for(var i=0;i<=200;i++){
    var t=i/200*p.period*3;
    var gt=groundTrack(0,0,p.alt*1000,p.inc*Math.PI/180,p.period,t);
    var x=padL+(gt.lon/Math.PI/2+0.5)*mapW;
    var y=padT+(0.5-gt.lat/Math.PI)*mapH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Altitude: '+p.alt+' km',60,S.H-70);
  S.ctx.fillText('Inclination: '+p.inc+'°',60,S.H-45);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Period: '+fmt(p.period/60,2)+' min',60,S.H-20);
};

/* ══════════════ Rendezvous ══════════════ */
R.rendezvous=function(dt){
  clear();
  headline('Orbital Rendezvous','Clohessy-Wiltshire equations');
  if(!S.sim.rdv){S.sim.rdv={n:0.0011,x:0,y:0,z:0,t:0,maneuver:false}}
  var p=S.sim.rdv;
  if(p.maneuver){
    p.t+=dt;
    /* CW dynamics for a single impulse */
    var n=p.n,t=p.t;
    var vx0=-1;var vy0=-0.5;
    p.x=(4-3*Math.cos(n*t))*0+ (Math.sin(n*t)/n)*vx0*0 + 1;
    p.x=4*(1-Math.cos(n*t))*0+Math.sin(n*t)/n*vx0+0;
    p.y=(2/n)*(1-Math.cos(n*t))*vy0-Math.sin(n*t)/n*vx0*0;
    p.z=0;
  }
  /* Draw trajectory */
  var cx=S.W/2,cy=S.H/2;
  var scale=Math.min(S.W,S.H)*0.3;
  /* Target */
  S.ctx.fillStyle='#00aaff';
  S.ctx.beginPath();S.ctx.arc(cx,cy,15,0,Math.PI*2);S.ctx.fill();
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Target (ISS)',cx+20,cy);
  /* Chaser */
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();S.ctx.arc(cx+p.x*scale,cy-p.y*scale,10,0,Math.PI*2);S.ctx.fill();
  /* Trajectory */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.lineWidth=1.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var ti=i/100*3600;
    var vx0=-1,vy0=-0.5;
    var n=p.n;
    var xi=(Math.sin(n*ti)/n)*vx0+0;
    var yi=4*(1-Math.cos(n*ti))*vx0*-1/n - 3*ti*vx0 + (Math.sin(n*ti)/n)*vy0*0 + 0;
    yi=(Math.sin(n*ti)/n)*vx0*0 + 4*(1-Math.cos(n*ti))*(vy0/n)-3*ti*vy0;
    var px=cx+xi*scale;
    var py=cy-yi*scale;
    if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
  }
  S.ctx.stroke();
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CW equations (linearized)',60,S.H-130);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('ẍ - 3n²x - 2nẏ = 0',60,S.H-105);
  S.ctx.fillText('ÿ + 2nẋ = 0',60,S.H-80);
  S.ctx.fillText('z̈ + n²z = 0',60,S.H-55);
  S.ctx.fillText('Used for: proximity operations, ISS docking',60,S.H-25);
};

<script>
/* ══════════════ Beam Bending ══════════════ */
R.beam=function(dt){
  clear();
  headline('Beam Bending','Euler-Bernoulli theory');
  if(!S.sim.beam){S.sim.beam={L:2,w:1000,E:70e9,I:1e-6}}
  var p=S.sim.beam;
  var result=beamBending(p.w,p.L,p.E,p.I);
  /* Draw deflected beam */
  var padL=80,padT=140;
  var beamW=S.W-padL*2;
  var beamY=padT+150;
  /* Undeflected */
  S.ctx.strokeStyle='rgba(136,144,160,.3)';
  S.ctx.setLineDash([5,5]);
  S.ctx.lineWidth=1;
  S.ctx.beginPath();S.ctx.moveTo(padL,beamY);S.ctx.lineTo(padL+beamW,beamY);S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Deflected */
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=3;
  S.ctx.beginPath();
  for(var i=0;i<=50;i++){
    var x=i/50*p.L;
    var defl=p.w*Math.pow(x,2)*(6*p.L*p.L-4*p.L*x+x*x)/(24*p.E*p.I);
    var px=padL+(i/50)*beamW;
    var py=beamY+defl*1e6;
    if(i===0)S.ctx.moveTo(px,py);else S.ctx.lineTo(px,py);
  }
  S.ctx.stroke();
  /* Support */
  S.ctx.fillStyle='#00d97d';
  S.ctx.fillRect(padL-10,beamY-5,10,20);
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Max deflection: '+fmt(result.deflection*1000,4)+' mm',60,S.H-120);
  S.ctx.fillText('Max moment: '+commas(Math.round(result.moment))+' N·m',60,S.H-95);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('L = '+p.L+' m',60,S.H-70);
  S.ctx.fillText('w = '+p.w+' N/m',60,S.H-45);
  S.ctx.fillText('EI = '+expo(p.E*p.I,3)+' N·m²',60,S.H-20);
};

/* ══════════════ Buckling ══════════════ */
R.buckling=function(dt){
  clear();
  headline('Euler Buckling','column stability');
  if(!S.sim.bk){S.sim.bk={E:70e9,I:1e-6,L:3,K:1}}
  var p=S.sim.bk;
  var Pcr=eulerBuckling(p.E,p.I,p.L,p.K);
  /* Draw buckling modes */
  var cx=S.W/2-100,cy=S.H/2;
  var columnH=300;
  var modes=[
    {K:1,name:'Pinned-Pinned',n:1,color:'#00aaff'},
    {K:0.5,name:'Fixed-Free',n:0.5,color:'#00d97d'},
    {K:0.7,name:'Fixed-Pinned',n:0.7,color:'#ffb800'},
    {K:2,name:'Fixed-Fixed',n:2,color:'#ff2d55'}
  ];
  modes.forEach(function(m,i){
    var x=cx-200+i*150;
    S.ctx.strokeStyle=m.color;
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    for(var j=0;j<=50;j++){
      var t=j/50;
      var y=cy+columnH/2-t*columnH;
      var amp=30*Math.sin(t*Math.PI*m.n)*m.n;
      if(j===0)S.ctx.moveTo(x+amp,y);else S.ctx.lineTo(x+amp,y);
    }
    S.ctx.stroke();
    S.ctx.fillStyle=m.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(m.name,x,cy-columnH/2-20);
    S.ctx.fillText('K='+m.K,x,cy+columnH/2+20);
  });
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('P_cr = '+commas(Math.round(Pcr))+' N',60,S.H-100);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('E = '+expo(p.E,3)+' Pa',60,S.H-75);
  S.ctx.fillText('I = '+expo(p.I,3)+' m⁴',60,S.H-50);
  S.ctx.fillText('L = '+p.L+' m  ·  K = '+p.K,60,S.H-25);
};

/* ══════════════ Von Mises ══════════════ */
R.vonMises=function(dt){
  clear();
  headline('Von Mises Yield','stress criterion');
  if(!S.sim.vm){S.sim.vm={sx:100,sy:50,txy:30}}
  var p=S.sim.vm;
  var vm=vonMises(p.sx,p.sy,p.txy);
  /* Draw Mohr's circle */
  var cx=S.W/2,cy=S.H/2;
  var scale=2;
  var center=(p.sx+p.sy)/2;
  var radius=Math.sqrt(Math.pow((p.sx-p.sy)/2,2)+p.txy*p.txy);
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2;
  S.ctx.beginPath();
  S.ctx.arc(cx+center*scale,cy,radius*scale,0,Math.PI*2);
  S.ctx.stroke();
  /* Points */
  S.ctx.fillStyle='#ff2d55';
  S.ctx.beginPath();
  S.ctx.arc(cx+(center+radius)*scale,cy,5,0,Math.PI*2);S.ctx.fill();
  S.ctx.fillStyle='#00d97d';
  S.ctx.beginPath();
  S.ctx.arc(cx+(center-radius)*scale,cy,5,0,Math.PI*2);S.ctx.fill();
  /* Axes */
  S.ctx.strokeStyle='rgba(136,144,160,.4)';
  S.ctx.lineWidth=1;
  S.ctx.beginPath();S.ctx.moveTo(60,cy);S.ctx.lineTo(S.W-60,cy);S.ctx.stroke();
  S.ctx.beginPath();S.ctx.moveTo(cx+center*scale,cy-200);S.ctx.lineTo(cx+center*scale,cy+200);S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('σ_vm = '+fmt(vm,1)+' MPa',60,S.H-100);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('σx = '+p.sx+' MPa',60,S.H-75);
  S.ctx.fillText('σy = '+p.sy+' MPa',60,S.H-50);
  S.ctx.fillText('τxy = '+p.txy+' MPa',60,S.H-25);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('σ1 = '+fmt(center+radius,1)+' MPa',400,S.H-75);
  S.ctx.fillText('σ2 = '+fmt(center-radius,1)+' MPa',400,S.H-50);
  S.ctx.fillText('τmax = '+fmt(radius,1)+' MPa',400,S.H-25);
};

/* ══════════════ Fatigue ══════════════ */
R.fatigue=function(dt){
  clear();
  headline('Fatigue Analysis','S-N curves');
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'cycles (log)','stress amplitude (MPa)');
  var materials=[
    {name:'Steel 4340',sigF:1000,color:'#00aaff'},
    {name:'Al 7075-T6',sigF:500,color:'#00d97d'},
    {name:'Ti-6Al-4V',sigF:700,color:'#ffb800'},
    {name:'CFRP laminate',sigF:400,color:'#ff2d55'}
  ];
  materials.forEach(function(m){
    S.ctx.strokeStyle=m.color;
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    for(var i=0;i<=100;i++){
      var N=Math.pow(10,2+i*8/100);
      var sigma=m.sigF*Math.pow(N,-0.1);
      var x=padL+(i/100)*plotW;
      var y=padT+plotH-(sigma/1200)*plotH;
      if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    /* Fatigue limit */
    var endurance=m.sigF*0.4;
    var yEnd=padT+plotH-(endurance/1200)*plotH;
    S.ctx.strokeStyle=m.color;
    S.ctx.globalAlpha=.3;
    S.ctx.setLineDash([3,3]);
    S.ctx.beginPath();
    S.ctx.moveTo(padL,yEnd);
    S.ctx.lineTo(padL+plotW,yEnd);
    S.ctx.stroke();
    S.ctx.setLineDash([]);
    S.ctx.globalAlpha=1;
  });
  /* Legend */
  materials.forEach(function(m,i){
    S.ctx.fillStyle=m.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('■ '+m.name,padL+10+i*180,padT+20);
  });
};

/* ══════════════ Composites ══════════════ */
R.composites=function(dt){
  clear();
  headline('Composite Laminate','classical laminate theory');
  if(!S.sim.comp2){S.sim.comp2={E1:140e9,E2:10e9,G12:5e9,nu12:0.3,theta:0}}
  var p=S.sim.comp2;
  var Q=plyProperties(p.E1,p.E2,p.G12,p.nu12,p.theta*Math.PI/180);
  /* Draw ply at angle */
  var cx=S.W/2,cy=S.H/2-40;
  var plyW=300,plyH=40;
  S.ctx.save();
  S.ctx.translate(cx,cy);

R.modal=function(dt){

/* ══════════════ FEM 1D ══════════════ */
R.fem=function(dt){
  clear();
  headline('1D FEM','finite element analysis');
  if(!S.sim.fem){S.sim.fem={n:8,L:1,E:70e9,A:1e-4,P:1e5}}
  var p=S.sim.fem;
  /* Build stiffness matrix for bar */
  var n=p.n,nNodes=n+1;
  var K=[];
  for(var i=0;i<nNodes;i++){K.push(new Array(nNodes).fill(0))}
  var Le=p.L/n;
  for(var e=0;e<n;e++){
    var k=p.E*p.A/Le;
    K[e][e]+=k;
    K[e][e+1]-=k;
    K[e+1][e]-=k;
    K[e+1][e+1]+=k;
  }
  /* Apply BC: u_0 = 0, force P at end */
  var F=new Array(nNodes).fill(0);
  F[nNodes-1]=p.P;
  /* Solve reduced system */
  var Kred=[];
  for(var i=1;i<nNodes;i++){
    var row=[];
    for(var j=1;j<nNodes;j++)row.push(K[i][j]);
    Kred.push(row);
  }
  var Fred=F.slice(1);
  var u=solveLinear(Kred,Fred);
  var uAll=[0].concat(u);
  /* Draw */
  var cx=S.W/2;
  var cy=S.H/2;
  var beamW=S.W-160;
  /* Original */
  S.ctx.strokeStyle='rgba(136,144,160,.3)';
  S.ctx.setLineDash([5,5]);
  S.ctx.lineWidth=1;
  S.ctx.beginPath();S.ctx.moveTo(80,cy);S.ctx.lineTo(80+beamW,cy);S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Deformed */
  var maxU=Math.max.apply(null,uAll.map(Math.abs));
  var dispScale=maxU>0?80/maxU:0;
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=3;
  S.ctx.beginPath();
  for(var i=0;i<nNodes;i++){
    var x=80+i*beamW/n;
    var y=cy-uAll[i]*dispScale;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Nodes */
  for(var i=0;i<nNodes;i++){
    var x=80+i*beamW/n;
    S.ctx.fillStyle='#ffb800';
    S.ctx.beginPath();S.ctx.arc(x,cy,4,0,Math.PI*2);S.ctx.fill();
  }
  /* Info */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Elements: '+p.n,60,S.H-100);
  S.ctx.fillText('Tip displacement: '+fmt(u[nNodes-2]*1000,4)+' mm',60,S.H-75);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Analytical: '+fmt(p.P*p.L/(p.E*p.A)*1000,4)+' mm',60,S.H-50);
  S.ctx.fillText('Error: '+fmt(Math.abs(u[nNodes-2]-p.P*p.L/(p.E*p.A))/p.P/p.L*p.E*p.A*100,4)+'%',60,S.H-25);
};

function solveLinear(A,b){
  var n=A.length,M=[];
  for(var i=0;i<n;i++){M.push(A[i].slice());M[i].push(b[i])}
  for(var i=0;i<n;i++){
    var p=i;
    for(var k=i+1;k<n;k++)if(Math.abs(M[k][i])>Math.abs(M[p][i]))p=k;
    var tmp=M[i];M[i]=M[p];M[p]=tmp;
    for(var k=i+1;k<n;k++){
      var f=M[k][i]/M[i][i];
      for(var j=i;j<=n;j++)M[k][j]-=f*M[i][j];
    }
  }
  var x=new Array(n);
  for(var i=n-1;i>=0;i--){
    var s=M[i][n];
    for(var j=i+1;j<n;j++)s-=M[i][j]*x[j];
    x[i]=s/M[i][i];
  }
  return x;
}

/* ══════════════ Heat Transfer ══════════════ */
R.heatTransfer=function(dt){
  clear();
  headline('Heat Transfer','conduction · convection · radiation');
  if(!S.sim.ht){S.sim.ht={T1:300,T2:400,L:0.1,k:200,h:50,Tinf:300}}
  var p=S.sim.ht;
  /* 1D steady state conduction */
  var qCond=p.k*(p.T2-p.T1)/p.L;
  /* Convection */
  var qConv=p.h*(p.T2-p.Tinf);
  /* Draw slab with T profile */
  var cx=S.W/2;

  var slabX=cx-slabW/2,slabY=S.H/2-slabH/2;
  /* Slab */

  S.ctx.fillStyle=grad;
  S.ctx.fillRect(slabX,slabY,slabW,slabH);

/* ══════════════ Re-entry ══════════════ */
R.reentry=function(dt){
  clear();
  headline('Re-entry','Allen-Eggers ballistic');
  if(!S.sim.re2){S.sim.re2={V0:7800,gamma:-6.5,beta:1000}}
  var p=S.sim.re2;
  var result=allenEggers(1,1.2,1,p.beta,p.gamma,p.V0,1.225,7000);
  /* Simulate trajectory */
  var history=[];
  var V=p.V0;
  var gamma=p.gamma*Math.PI/180;
  var h=100000;
  var dt2=0.1;
  var t=0;
  while(h>0&&t<3000){
    var atm=isaAtmosphere(Math.max(h,0));
    var rho=atm.rho;
    var D=0.5*rho*V*V*1/(p.beta);
    var g=CONST.muE/(CONST.RE+h)/(CONST.RE+h);
    var dV=-D-g*Math.sin(gamma);
    var dgamma=(g/V-V/(CONST.RE+h))*Math.cos(gamma);
    V+=dV*dt2;
    gamma+=dgamma*dt2;
    h-=V*Math.sin(-gamma)*dt2;
    t+=dt2;
    if(t%1<dt2)history.push({t:t,h:h,V:V,q:0.5*rho*V*V*V*1e-6});
  }
  /* Plot trajectory */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (s)','altitude (km)');
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  history.forEach(function(h,i){
    var x=padL+(h.t/300)*plotW;
    var y=padT+plotH-(h.h/100000)*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('V0 = '+p.V0+' m/s',60,S.H-100);
  S.ctx.fillText('γ = '+p.gamma+'°',60,S.H-75);
  S.ctx.fillText('β = '+p.beta+' kg/m²',60,S.H-50);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Peak decel: '+fmt(result.a_max/CONST.g0,2)+' g',400,S.H-75);
  S.ctx.fillText('Peak altitude: '+fmt(result.h_peak/1000,2)+' km',400,S.H-50);
};

/* ══════════════ Quaternion ══════════════ */
R.quaternion=function(dt){
  clear();
  headline('Quaternion','attitude representation');
  if(!S.sim.quat){S.sim.quat={roll:0.3,pitch:0.2,yaw:0.4}}
  var p=S.sim.quat;
  var q=qFromEuler(p.roll,p.pitch,p.yaw);
  /* Draw body axes */
  var cx=S.W/2,cy=S.H/2;
  var R=150;
  /* Inertial axes */
  S.ctx.strokeStyle='rgba(136,144,160,.4)';
  S.ctx.lineWidth=1.5;
  S.ctx.beginPath();S.ctx.moveTo(cx-R,cy);S.ctx.lineTo(cx+R,cy);S.ctx.stroke();
  S.ctx.beginPath();S.ctx.moveTo(cx,cy-R);S.ctx.lineTo(cx,cy+R);S.ctx.stroke();
  /* Body axes */
  var ax=qRotate(q,V(1,0,0));
  var ay=qRotate(q,V(0,1,0));
  var az=qRotate(q,V(0,0,1));
  function drawAxis(v,color,label){
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=3;
    S.ctx.beginPath();
    S.ctx.moveTo(cx,cy);
    S.ctx.lineTo(cx+v.x*R,cy-v.y*R);
    S.ctx.stroke();
    S.ctx.fillStyle=color;
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(label,cx+v.x*R*1.1,cy-v.y*R*1.1);
  }
  drawAxis(ax,'#ff2d55','x');
  drawAxis(ay,'#00d97d','y');
  drawAxis(az,'#00aaff','z');
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('q = [w, x, y, z]',60,S.H-130);

/* ══════════════ PID Autopilot ══════════════ */
R.pid=function(dt){
  clear();
  headline('PID Autopilot','pitch control loop');
  if(!S.sim.pid){S.sim.pid={Kp:2,Ki:0.5,Kd:0.8,theta:0,setpoint:0.1,integral:0,prevErr:0,history:[]}}
  var p=S.sim.pid;
  /* Simulate 2nd order plant: θ̈ = -a·θ̇ + b·u */
  var a=1,b=1,dt2=0.02;
  var step=pidStep(p.theta,p.setpoint,{Kp:p.Kp,Ki:p.Ki,Kd:p.Kd},dt2,p.integral,p.prevErr);
  p.integral=step.integral;
  p.prevErr=step.error;
  var thetaDot=0;
  var thetaDot2=-a*thetaDot+b*step.output;
  thetaDot+=thetaDot2*dt2;
  p.theta+=thetaDot*dt2;
  p.history.push({t:S.t,theta:p.theta,cmd:step.output});
  if(p.history.length>300)p.history.shift();
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (s)','angle (rad)');
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  p.history.forEach(function(h,i){
    var x=padL+(i/p.history.length)*plotW;
    var y=padT+plotH/2-h.theta*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Setpoint */
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();
  S.ctx.moveTo(padL,padT+plotH/2-p.setpoint*plotH);
  S.ctx.lineTo(padL+plotW,padT+plotH/2-p.setpoint*plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('θ = '+fmt(p.theta,4)+' rad',60,S.H-100);
  S.ctx.fillText('Setpoint = '+p.setpoint,60,S.H-75);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Kp='+p.Kp+' Ki='+p.Ki+' Kd='+p.Kd,60,S.H-50);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('Error: '+fmt(step.error,5)+' rad',60,S.H-25);
};

/* ══════════════ Kalman Filter ══════════════ */
R.kalman=function(dt){
  clear();
  headline('Kalman Filter','1D position tracking');
  if(!S.sim.kf){
    S.sim.kf={x:[0,1],P:[[1,0],[0,1]],history:[],meas:[]};
    /* True state: position 0, velocity 1 */
  }
  var kf=S.sim.kf;
  var dt2=0.1;
  /* Predict */
  var F=[[1,dt2],[0,1]];
  var Q=[[0.01,0],[0,0.01]];
  var pred=kalmanPredict(kf.x,kf.P,F,Q);
  kf.x=pred.x;
  kf.P=pred.P;
  /* Update with noisy measurement */
  var truePos=kf.x[0]+0.3*kf.x[1]*dt2+gauss()*0.05;
  var z=[truePos];
  var H=[[1,0]];
  var R=[[0.25]];
  var upd=kalmanUpdate(kf.x,kf.P,z,H,R);
  kf.x=upd.x;
  kf.P=upd.P;
  kf.history.push({t:S.t,x:kf.x[0],v:kf.x[1]});
  kf.meas.push({t:S.t,z:z[0]});
  if(kf.history.length>300){kf.history.shift();kf.meas.shift()}
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (s)','position');
  /* Measurements */
  kf.meas.forEach(function(m,i){
    var x=padL+(i/kf.meas.length)*plotW;
    var y=padT+plotH/2-m.z*20;
    S.ctx.fillStyle='rgba(136,144,160,.6)';
    S.ctx.beginPath();S.ctx.arc(x,y,2,0,Math.PI*2);S.ctx.fill();
  });
  /* Filtered */
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  kf.history.forEach(function(h,i){
    var x=padL+(i/kf.history.length)*plotW;
    var y=padT+plotH/2-h.x*20;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Position: '+fmt(kf.x[0],4),60,S.H-90);
  S.ctx.fillText('Velocity: '+fmt(kf.x[1],4),60,S.H-65);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('P11 = '+fmt(kf.P[0][0],4),60,S.H-40);
  S.ctx.fillText('P22 = '+fmt(kf.P[1][1],4),60,S.H-15);
};

R.porkchop=function(dt){
  clear();

  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  var gridSize=40;
  /* Simulate Δv as function of departure/arrival dates */
  for(var i=0;i<gridSize;i++){
    for(var j=0;j<gridSize;j++){
      var dep=i/gridSize*365;
      var arr=j/gridSize*365;
      /* Simplified: low dv at optimal windows */
      var tOpt1=180;var aOpt1=320;
      var d1=Math.abs(dep-tOpt1);
      var d2=Math.abs(arr-aOpt1);
      var dv=5000+Math.sqrt(d1*d1+d2*d2)*20+500*Math.sin(i*0.5)*Math.cos(j*0.3);
      /* Color map */
      var t=(dv-5000)/2000;
      t=clamp(t,0,1);
      var r=Math.round(255*t);
      var b=Math.round(255*(1-t));
      S.ctx.fillStyle='rgba('+r+',100,'+b+',0.7)';
      S.ctx.fillRect(padL+i*plotW/gridSize,padT+j*plotH/gridSize,plotW/gridSize+1,plotH/gridSize+1);

  S.ctx.strokeStyle='#00aaff';

/* ══════════════ Launch Profile ══════════════ */
R.launch=function(dt){
  clear();
  headline('Launch Profile','gravity turn');
  if(!S.sim.lp){S.sim.lp={t:0}}
  S.sim.lp.t+=dt;
  var t=S.sim.lp.t%200;
  /* Simulate ascent */
  var alt=0,V=0,pitch=90,downrange=0;
  for(var i=0;i<t;i+=0.5){
    var atm=isaAtmosphere(alt);
    var T=8000000; /* 8 MN thrust */
    var m=500000-2000*i;
    var g=9.81*Math.pow(CONST.RE/(CONST.RE+alt),2);
    var drag=0.5*atm.rho*V*V*0.5*10;
    var a=T/m-g*Math.sin(pitch*Math.PI/180)-drag/m;
    V+=a*0.5;
    alt+=V*Math.sin(pitch*Math.PI/180)*0.5;
    downrange+=V*Math.cos(pitch*Math.PI/180)*0.5;
    /* Gravity turn: pitch decreases */
    pitch=Math.max(0,90-alt/1000*10);
  }
  /* Draw trajectory */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'downrange (km)','altitude (km)');
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=3;
  S.ctx.beginPath();
  var alt2=0,V2=0,pitch2=90,dr2=0;
  for(var i=0;i<=400;i++){
    var ti=i*0.5;
    var atm2=isaAtmosphere(alt2);
    var T2=8000000;
    var m2=500000-2000*ti;
    var g2=9.81*Math.pow(CONST.RE/(CONST.RE+alt2),2);
    var drag2=0.5*atm2.rho*V2*V2*0.5*10;
    var a2=T2/m2-g2*Math.sin(pitch2*Math.PI/180)-drag2/m2;
    V2+=a2*0.5;
    alt2+=V2*Math.sin(pitch2*Math.PI/180)*0.5;
    dr2+=V2*Math.cos(pitch2*Math.PI/180)*0.5;
    pitch2=Math.max(0,90-alt2/1000*10);
    var x=padL+(dr2/1000000)*plotW*3;
    var y=padT+plotH-(alt2/400000)*plotH;

/* ══════════════ Reliability ══════════════ */
R.reliability=function(dt){
  clear();
  headline('Reliability Analysis','MTBF, series/parallel');
  if(!S.sim.rel){S.sim.rel={lambda:1e-6,t:10000}}
  var p=S.sim.rel;
  /* R(t) = exp(-λt) */
  var R=Math.exp(-p.lambda*p.t);
  var mtbf=1/p.lambda;
  /* Plot */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (hours)','reliability R(t)');
  S.ctx.strokeStyle='#00aaff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i/100*5*mtbf;
    var r=Math.exp(-t/mtbf);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-r*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Markers */
  var xm=padL+(p.t/(5*mtbf))*plotW;
  var ym=padT+plotH-R*plotH;
  S.ctx.fillStyle='#ffb800';
  S.ctx.beginPath();S.ctx.arc(xm,ym,7,0,Math.PI*2);S.ctx.fill();
  /* Series/parallel */
  S.ctx.strokeStyle='rgba(0,217,125,.5)';
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=i/100*5*mtbf;
    /* Series: 3 components */
    var r=Math.pow(Math.exp(-t/mtbf),3);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-r*plotH;
    if(i===0)S.ctx.moveTo(x,y);else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('R(t) = '+fmt(R,4),60,S.H-130);
  S.ctx.fillText('MTBF = '+commas(Math.round(mtbf))+' h',60,S.H-105);
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('λ = '+expo(p.lambda,3)+' /h',60,S.H-80);
  S.ctx.fillText('t = '+commas(p.t)+' h',60,S.H-55);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('Series (3×): R = '+fmt(Math.pow(R,3),4),400,S.H-105);
  S.ctx.fillText('Parallel (3×): R = '+fmt(1-Math.pow(1-R,3),4),400,S.H-80);
};

/* ══════════════ Monte Carlo ══════════════ */
R.monteCarlo=function(dt){
  clear();
  headline('Monte Carlo','dispersion analysis');
  if(!S.sim.mc2){S.sim.mc2={samples:[]};for(var i=0;i<1000;i++)S.sim.mc2.samples.push(100+gauss()*5)}
  var samples=S.sim.mc2.samples;
  var m=mean(samples);
  var s=stdev(samples);
  var p50=percentile(samples,50);
  var p95=percentile(samples,95);
  var p99=percentile(samples,99);
  /* Histogram */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'value','frequency');
  var minV=min(samples),maxV=max(samples);
  var bins=40;
  var counts=new Array(bins).fill(0);
  samples.forEach(function(v){
    var idx=Math.floor((v-minV)/(maxV-minV)*bins);
    if(idx>=bins)idx=bins-1;
    counts[idx]++;
  });
  var maxC=max(counts);
  counts.forEach(function(c,i){
    var x=padL+(i/bins)*plotW;
    var h=(c/maxC)*plotH;
    S.ctx.fillStyle='#00aaff';
    S.ctx.globalAlpha=0.7;
    S.ctx.fillRect(x,padT+plotH-h,plotW/bins-1,h);
    S.ctx.globalAlpha=1;
  });
  /* Percentiles */
  [50,95,99].forEach(function(p){
    var val=percentile(samples,p);
    var x=padL+((val-minV)/(maxV-minV))*plotW;
    S.ctx.strokeStyle=p===95?'#ffb800':(p===99?'#ff2d55':'#00d97d');
    S.ctx.setLineDash([5,5]);
    S.ctx.beginPath();S.ctx.moveTo(x,padT);S.ctx.lineTo(x,padT+plotH);S.ctx.stroke();
    S.ctx.setLineDash([]);
  });
  /* Values */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('N = '+commas(samples.length),60,S.H-120);
  S.ctx.fillText('Mean = '+fmt(m,4),60,S.H-95);
  S.ctx.fillText('σ = '+fmt(s,4),60,S.H-70);
  S.ctx.fillStyle='#00d97d';
  S.ctx.fillText('P50 = '+fmt(p50,4),400,S.H-95);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('P95 = '+fmt(p95,4),400,S.H-70);
  S.ctx.fillStyle='#ff2d55';
  S.ctx.fillText('P99 = '+fmt(p99,4),400,S.H-45);
};

/* ══════════════ Trade Study ══════════════ */
R.tradeStudy=function(dt){
  clear();
  headline('Trade Study','multi-criteria decision');
  var criteria=[
    {name:'Performance',weight:0.3},
    {name:'Cost',weight:0.25},
    {name:'Schedule',weight:0.15},
    {name:'Risk',weight:0.2},
    {name:'Heritage',weight:0.1}
  ];
  var options=[
    {name:'Option A',scores:[8,6,7,7,8]},
    {name:'Option B',scores:[7,8,6,8,6]},
    {name:'Option C',scores:[9,5,8,5,7]},
    {name:'Option D',scores:[6,9,7,6,8]}
  ];
  /* Compute weighted scores */
  options.forEach(function(o){
    o.total=0;
    for(var i=0;i<o.scores.length;i++)o.total+=o.scores[i]*criteria[i].weight;
  });
  options.sort(function(a,b){return b.total-a.total});
  /* Draw */
  var y=140;
  S.ctx.fillStyle='#8890a0';
  S.ctx.font='700 10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CRITERIA',60,y-10);
  criteria.forEach(function(c,i){
    S.ctx.fillText(c.name+' ('+c.weight+')',60+i*140,y+20);
  });
  y=180;
  options.forEach(function(o,i){
    S.ctx.fillStyle='rgba(13,18,28,.7)';
    S.ctx.fillRect(60,y+i*50,S.W-120,44);
    S.ctx.strokeStyle=i===0?'#00d97d':'#00aaff';
    S.ctx.lineWidth=i===0?2:1;
    S.ctx.strokeRect(60.5,y+i*50+.5,S.W-121,43);
    S.ctx.fillStyle=i===0?'#5cffb0':'#c8d0d8';
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(o.name,80,y+i*50+28);
    S.ctx.font='11px "JetBrains Mono",monospace';
    o.scores.forEach(function(s,j){
      S.ctx.fillStyle=s>=7?'#00d97d':'#8890a0';
      S.ctx.fillText(s,100+j*140,y+i*50+28);
    });
    S.ctx.fillStyle=i===0?'#00d97d':'#ffb800';
    S.ctx.font='900 18px "Orbitron",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(fmt(o.total,3),S.W-80,y+i*50+28);
  });
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Winner: '+options[0].name,60,S.H-50);
};

/* ══════════════ Cost Models ══════════════ */
R.cost=function(dt){
  clear();
  headline('Cost Models','NASA/AF parametric');
  if(!S.sim.cost){S.sim.cost={dryMass:500,duty:0.5}}
  var p=S.sim.cost;
  /* NASA Small Satellite Cost Model (SSCM) simplified */
  var cost=1000*Math.pow(p.dryMass/100,0.6);
  /* Launch cost */
  var launchCost=2000*Math.pow(p.dryMass,0.5);
  /* Ground segment */
  var groundCost=cost*0.3;
  /* Operations */
  var opsCost=cost*0.15*p.duty*10;
  var total=cost+launchCost+groundCost+opsCost;
  /* Breakdown */
  var items=[
    {name:'Spacecraft',cost:cost,color:'#00aaff'},
    {name:'Launch',cost:launchCost,color:'#ff2d55'},
    {name:'Ground',cost:groundCost,color:'#00d97d'},
    {name:'Operations',cost:opsCost,color:'#ffb800'}
  ];
  /* Draw pie chart */
  var cx=S.W/2-200,cy=S.H/2;
  var R=150;
  var angle=0;
  items.forEach(function(it){
    var arc=it.cost/total*Math.PI*2;
    S.ctx.fillStyle=it.color+'80';
    S.ctx.beginPath();
    S.ctx.moveTo(cx,cy);
    S.ctx.arc(cx,cy,R,angle,angle+arc);
    S.ctx.closePath();
    S.ctx.fill();
    S.ctx.strokeStyle=it.color;
    S.ctx.lineWidth=2;
    S.ctx.stroke();
    angle+=arc;
  });
  /* Legend */
  var y=140;
  items.forEach(function(it,i){
    S.ctx.fillStyle=it.color;
    S.ctx.fillRect(cx+R+30,y+i*30,15,15);
    S.ctx.fillStyle='#c8d0d8';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(it.name,cx+R+55,y+i*30+12);
    S.ctx.fillStyle='#8890a0';
    S.ctx.fillText('$'+commas(Math.round(it.cost))+'M',cx+R+200,y+i*30+12);
    S.ctx.fillStyle='#5cc5ff';
    S.ctx.fillText(fmt(it.cost/total*100,1)+'%',cx+R+300,y+i*30+12);
  });
  /* Total */
  S.ctx.fillStyle='#00d97d';
  S.ctx.font='900 28px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Total: $'+commas(Math.round(total))+'M',cx+R+30,y+items.length*30+20);
};

/* ══════════════ Interactions ══════════════ */
function bindInteractions(){
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#05070d';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff2d55';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'loading ISA atmosphere…',pct:10},
    {msg:'compiling aerodynamics…',pct:22},
    {msg:'initializing orbital dynamics…',pct:34},
    {msg:'calibrating propulsion models…',pct:48},
    {msg:'loading GNC algorithms…',pct:62},
    {msg:'connecting to mission control…',pct:78},
    {msg:'ready for launch',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,150);
  }
  setTimeout(next,150);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  boot();
  requestAnimationFrame(loop);
  console.log('%c AERO ','background:linear-gradient(90deg,#00aaff,#00ddcc,#ff2d55);color:#05070d;padding:10px 22px;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('Aerospace & Spacecraft Engineering Workbench · '+MODULES.length+' modules');
  console.log('Real algorithms: ISA · NACA · Kepler · Lambert · Roe flux · Kalman · LQR');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
