<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#08060f">
<title>RESONANCE — Music Production Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#08060f;--bg2:#0e0a1a;--bg3:#161028;--bg4:#201838;
  --panel:#0c0818;--panel2:#141022;--panel3:#1c1630;--panel4:#26203e;
  --bd:#241c40;--bd2:#382c58;--bd3:#50407a;
  --tx:#e8e0ff;--tx2:#b0a0d0;--tx3:#7060a0;--mu:#504880;
  --c1:#ff3ea5;--c1h:#ff80c0;--c1l:#c02070;--c1d:#801050;
  --c2:#3ee0ff;--c2h:#80f0ff;--c2l:#20a0d0;
  --c3:#ffd040;--c3h:#ffe880;--c3l:#c09000;
  --c4:#a060ff;--c4h:#c090ff;--c4l:#6040c0;
  --c5:#40ff90;--c5h:#80ffb8;--c5l:#20c060;
  --c6:#ff6040;--c6h:#ffa080;--c6l:#c04020;
  --c7:#40d0d0;--c7h:#80e8e8;--c7l:#20a0a0;
  --c8:#ff8040;--c8h:#ffb080;--c8l:#c05020;
  --ok:#40ff90;--warn:#ffd040;--err:#ff3ea5;--info:#3ee0ff;
  --g1:linear-gradient(135deg,#ff3ea5,#a060ff);
  --g2:linear-gradient(135deg,#3ee0ff,#40ff90);
  --g3:linear-gradient(135deg,#ffd040,#ff8040);
  --gHolo:linear-gradient(120deg,#ff3ea5,#a060ff,#3ee0ff,#40ff90,#ffd040,#ff3ea5);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.6);
  --sh2:0 16px 48px rgba(0,0,0,.85);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="studio"]{--bg:#0d0d0d;--bg2:#151515;--bg3:#1e1e1e;--panel:#121212;--panel2:#1a1a1a;--panel3:#242424;--panel4:#2e2e2e;
  --bd:#2a2a2a;--bd2:#3c3c3c;--tx:#e0e0e0;--tx2:#a0a0a0;--tx3:#707070;
  --c1:#e0a020;--c2:#40b0e0;--c3:#e0d040;--c4:#a060c0;--c5:#40c080;
  --g1:linear-gradient(135deg,#e0a020,#40b0e0)}
[data-theme="sunset"]{--bg:#1a0a10;--bg2:#2a1420;--bg3:#3a1c2e;--panel:#2a1420;--panel2:#3a1c2e;
  --bd:#5a2c48;--bd2:#7c3a60;--tx:#ffe0f0;--tx2:#ffb0d0;--tx3:#d080a8;
  --c1:#ff4a80;--c2:#ff9040;--c3:#ffd060;--c4:#c060ff;--c5:#ff60a0;
  --g1:linear-gradient(135deg,#ff4a80,#ff9040)}
[data-theme="ocean"]{--bg:#001028;--bg2:#002038;--bg3:#003050;--panel:#002038;--panel2:#003050;
  --bd:#005880;--bd2:#0080a8;--tx:#d0f0ff;--tx2:#90d0f0;--tx3:#50a0c0;
  --c1:#00c0ff;--c2:#00ffd0;--c3:#40d0ff;--c4:#6080ff;--c5:#40ffa0;
  --g1:linear-gradient(135deg,#00c0ff,#00ffd0)}
[data-theme="paper"]{--bg:#f0ede8;--bg2:#e4e0d8;--bg3:#d8d4cc;--panel:#fff;--panel2:#f5f3ee;
  --bd:#c8c4bc;--bd2:#a8a4a0;--tx:#0e0e14;--tx2:#40404c;--tx3:#808088;
  --c1:#d04070;--c2:#2080c0;--c3:#b09020;--c4:#7040b0;--c5:#20a060;
  --g1:linear-gradient(135deg,#d04070,#7040b0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#08060f;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono)}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:12px;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px;filter:drop-shadow(0 0 30px rgba(255,62,165,.6))}
.boot-sub{font-size:.7rem;color:#ff3ea5;letter-spacing:10px;margin-bottom:36px;opacity:.7}
.boot-bar{width:320px;height:3px;background:#161028;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 16px var(--c1)}
.boot-pct{font-size:.7rem;color:#ff3ea5;margin-bottom:20px}
.boot-log{font-size:.62rem;color:#7060a0;text-align:left;width:380px;height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}.boot-log .warn{color:#ffd040}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:1rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.transport{display:flex;gap:3px;align-items:center;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);padding:3px}
.tp-btn{width:34px;height:30px;border-radius:var(--rxxs);background:transparent;color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tp-btn:hover{background:var(--panel3);color:var(--tx)}
.tp-btn.active{background:var(--g1);color:#fff;box-shadow:0 0 10px rgba(255,62,165,.4)}
.tp-btn.rec{color:var(--err)}
.tp-btn.rec.active{background:var(--err);color:#fff;animation:pulseRec 1s infinite}
@keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.6}}
.tempo-box{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);padding:4px 10px;display:flex;flex-direction:column;align-items:center;min-width:70px}
.tempo-box .tb-lbl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.tempo-box .tb-val{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--c1);line-height:1}
.tempo-box input{width:52px;background:transparent;text-align:center;font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--c1)}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.72rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:34px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#fff;box-shadow:0 0 14px rgba(255,62,165,.3)}
.tb-tab .tab-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.playing{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(255,62,165,.4)}

/* ============ MAIN LAYOUT ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:220px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.lp-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.lp-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700}
.lp-body{flex:1;overflow-y:auto;padding:8px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg2)}
#contentArea{flex:1;overflow:auto;padding:0;position:relative}
#rightPanel{width:280px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}
.rp-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.rp-body{flex:1;overflow-y:auto;padding:12px}

/* ============ STATUS BAR ============ */
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-meter{width:120px;height:6px;background:var(--panel3);border-radius:3px;overflow:hidden;position:relative}
#statusbar .sb-meter-fill{height:100%;background:var(--g2);transition:width .05s;border-radius:3px}
#statusbar .sb-meter-peak{position:absolute;top:0;width:2px;height:100%;background:var(--c3);opacity:.8;left:0}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#fff;font-size:.55rem;padding:1px 6px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.62rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.72rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,62,165,.15)}
.ctrl-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font-size:.7rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,62,165,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err);background:rgba(255,62,165,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.65rem}
.toggle{position:relative;width:36px;height:20px;background:var(--panel4);border-radius:var(--rf);cursor:pointer;transition:var(--t2);flex-shrink:0;display:inline-block}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--t2)}
.toggle.on::after{left:18px}

/* ============ PIANO ROLL ============ */
.pr-wrap{position:relative;width:100%;height:100%;overflow:auto;background:var(--bg)}
.pr-keys{position:sticky;left:0;top:0;width:60px;background:var(--panel);z-index:3;float:left}
.pr-key{height:20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 6px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);cursor:pointer}
.pr-key.white{background:var(--panel);color:var(--tx2)}
.pr-key.black{background:#000;color:var(--tx3)}
.pr-key:hover{background:var(--panel3)}
.pr-key.active{background:var(--c1);color:#fff}
.pr-canvas-wrap{position:relative;min-height:100%;margin-left:60px}
.pr-canvas{display:block;background:var(--bg)}

/* ============ STEP SEQUENCER ============ */
.step-wrap{padding:14px;overflow:auto;height:100%}
.track-lane{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:6px 8px}
.track-lane.selected{border-color:var(--c1);box-shadow:0 0 0 2px rgba(255,62,165,.2)}
.lane-label{width:120px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:.68rem;color:var(--tx2);font-weight:600}
.lane-color{width:5px;height:26px;border-radius:3px}
.lane-icon{font-size:.95rem}
.lane-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-steps{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;flex:1;min-width:0}
.step{aspect-ratio:1;background:var(--panel3);border-radius:3px;cursor:pointer;transition:var(--t1);position:relative;border:1px solid transparent}
.step:hover{background:var(--panel4)}
.step.beat{background:var(--panel4)}
.step.on{background:var(--lane-color,var(--c1));box-shadow:inset 0 0 12px rgba(255,255,255,.3);border-color:rgba(255,255,255,.2)}
.step.playing{outline:2px solid var(--c1);outline-offset:1px}
.step .step-num{position:absolute;top:2px;left:3px;font-family:var(--mono);font-size:.5rem;color:var(--tx3);opacity:.6}
.step.on .step-num{color:rgba(0,0,0,.6);opacity:1}
.step .vel-bar{position:absolute;bottom:1px;left:1px;right:1px;height:3px;background:var(--c3);opacity:0;border-radius:1px}
.step.on .vel-bar{opacity:1}

/* step playhead */
.playhead{position:absolute;width:2px;background:var(--c1);pointer-events:none;opacity:.6}

/* ============ MIXER ============ */
.mixer{padding:14px;display:flex;gap:8px;overflow-x:auto;height:100%}
.strip{width:92px;flex-shrink:0;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:8px;display:flex;flex-direction:column;gap:5px;position:relative}
.strip.selected{border-color:var(--c1);box-shadow:0 0 0 2px rgba(255,62,165,.2)}
.strip-master{background:var(--panel3);border-color:var(--c3)}
.strip-color{height:5px;border-radius:3px;margin-bottom:2px}
.strip-name{font-size:.62rem;font-weight:700;color:var(--tx);text-align:center;text-transform:uppercase;letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-icon{font-size:1.1rem;text-align:center}
.strip-fader{height:150px;position:relative;background:var(--bg);border-radius:3px;overflow:hidden;margin:4px 0;display:flex;align-items:flex-end;justify-content:center}
.strip-fader-track{position:absolute;inset:0;background:linear-gradient(to top,rgba(255,62,165,.15),transparent)}
.strip-fader-fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--c1),var(--c2));transition:height .05s}
.strip-fader-thumb{width:100%;height:12px;background:linear-gradient(to bottom,#fff,#c0c0d0);border-radius:3px;position:absolute;cursor:ns-resize;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:2;border:1px solid rgba(0,0,0,.3)}
.strip-fader-thumb:hover{background:linear-gradient(to bottom,#fff,var(--c1))}
.strip-meter{height:80px;position:relative;background:#000;border-radius:3px;overflow:hidden}
.strip-meter-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#40ff90,#ffd040 70%,#ff3ea5);transition:height .03s}
.strip-pan{height:18px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.strip-pan-thumb{position:absolute;top:1px;bottom:1px;width:6px;background:var(--c3);border-radius:2px;cursor:ew-resize;box-shadow:0 0 4px var(--c3)}
.strip-buttons{display:flex;gap:3px}
.strip-buttons button{flex:1;padding:4px 0;border-radius:3px;background:var(--panel4);color:var(--tx3);font-size:.55rem;font-weight:700;cursor:pointer;transition:var(--t1);border:1px solid transparent}
.strip-buttons button:hover{background:var(--panel3);color:var(--tx)}
.strip-buttons button.active{background:var(--c6);color:#fff;border-color:transparent}
.strip-buttons button.solo.active{background:var(--c3);color:#000}
.strip-buttons button.mute.active{background:var(--c8);color:#000}
.strip-vol-num{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--c1)}

/* ============ SYNTH EDITOR ============ */
.synth-editor{padding:16px;overflow:auto;height:100%}
.synth-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.synth-module{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:12px;position:relative}
.synth-module h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--c1);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.synth-module h3 span{color:var(--tx3);font-weight:400;text-transform:none;letter-spacing:0;font-size:.62rem}
.knob-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-around}
.knob{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px}
.knob-dial{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--panel4),var(--bg));border:2px solid var(--bd2);position:relative;cursor:grab;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.knob-dial:active{cursor:grabbing}
.knob-dial::after{content:'';position:absolute;top:4px;left:50%;width:2px;height:14px;background:var(--c1);transform:translateX(-50%);transform-origin:bottom center;border-radius:1px;box-shadow:0 0 6px var(--c1)}
.knob-label{font-size:.55rem;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:700}
.knob-value{font-size:.6rem;color:var(--c1);font-family:var(--mono)}
.wave-select{display:flex;gap:3px;justify-content:center}
.wave-btn{width:32px;height:32px;border-radius:var(--rxxs);background:var(--panel3);border:1px solid var(--bd);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.wave-btn:hover{border-color:var(--c1);color:var(--tx)}
.wave-btn.active{background:var(--g1);color:#fff;border-color:transparent}
.wave-btn svg{width:20px;height:20px}
.adsr-view{height:60px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden;margin-bottom:6px}
.adsr-view svg{width:100%;height:100%}

/* ============ SONG / PATTERNS ============ */
.song-view{padding:14px;overflow:auto;height:100%}
.pattern-bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.pattern-card{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px;cursor:pointer;transition:var(--t1)}
.pattern-card:hover{border-color:var(--c1);transform:translateY(-2px)}
.pattern-card.active{background:var(--panel3);border-color:var(--c1);box-shadow:0 0 0 2px rgba(255,62,165,.2)}
.pattern-card .pc-title{font-size:.75rem;font-weight:700;color:var(--tx);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.pattern-card .pc-count{font-size:.6rem;color:var(--c1);font-family:var(--mono)}
.pattern-card .pc-preview{font-family:var(--mono);font-size:.55rem;color:var(--tx3);line-height:1.2;word-break:break-all;height:32px;overflow:hidden}
.arrangement{display:flex;flex-direction:column;gap:2px}
.arrange-row{display:flex;gap:2px;align-items:center;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:4px}
.arrange-cell{min-width:60px;height:40px;background:var(--panel3);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.62rem;color:var(--tx3);transition:var(--t1);position:relative}
.arrange-cell:hover{background:var(--panel4)}
.arrange-cell.filled{background:var(--g1);color:#fff;font-weight:700}
.arrange-cell.playing{outline:2px solid var(--c3);outline-offset:2px}

/* ============ EFFECTS ============ */
.fx-rack{padding:14px;overflow:auto;height:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start}
.fx-unit{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rs);padding:12px;position:relative}
.fx-unit.disabled{opacity:.45}
.fx-unit h3{font-size:.72rem;font-weight:700;color:var(--c2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.fx-unit h3 .toggle{transform:scale(0.9)}
.fx-body{display:flex;flex-direction:column;gap:8px}

/* ============ WAVEFORM / ANALYZER ============ */
.visualizer{width:100%;height:80px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.visualizer canvas{width:100%;height:100%;display:block}

/* ============ LIST HELPERS ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:6px 8px;border-radius:var(--rxxs);cursor:pointer;font-size:.7rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(255,62,165,.15);color:var(--c1)}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.6rem;color:var(--tx3);font-family:var(--mono)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:900px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1)}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:48px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.72rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px)}
.toast.success{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ============ KEYBOARD INFO ============ */
.kbd-hint{display:flex;flex-wrap:wrap;gap:6px;font-size:.6rem;color:var(--tx3);padding:4px 0}
.kbd{background:var(--panel3);border:1px solid var(--bd2);border-radius:3px;padding:1px 6px;font-family:var(--mono);font-size:.6rem;color:var(--c1)}

/* ============ PIANO KEYBOARD ============ */
.kb-view{background:var(--panel2);border-top:1px solid var(--bd);padding:8px;display:flex;gap:3px;justify-content:center;flex-shrink:0;height:70px}
.pkey{position:relative;background:#fff;border-radius:0 0 4px 4px;cursor:pointer;transition:var(--t1);color:#222;user-select:none;font-size:.55rem;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.pkey:hover{background:#e8e0ff}
.pkey.pressed{background:var(--c1);color:#fff}
.pkey.black{background:#1a1a2e;color:#8080a0;z-index:2;margin:0 -8px;height:65%}
.pkey.black:hover{background:#2a2a4e}
.pkey.black.pressed{background:var(--c1);color:#fff}
.pkey.white{width:34px;height:100%}

@media(max-width:900px){#leftPanel{width:180px}#rightPanel{width:220px}}
@media(max-width:640px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.lane-label{width:80px}}

<script>
"use strict";

/* ============ UTILS ============ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;return Number(n).toFixed(d)}
function dbToGain(db){return Math.pow(10,db/20)}
function gainToDb(g){return 20*Math.log10(Math.max(0.0001,g))}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ============================================================
   AUDIO ENGINE — Web Audio API
   ============================================================ */
var AUDIO={
  ctx:null,
  master:null,
  masterComp:null,
  masterAnalyser:null,
  masterMeterData:null,
  reverb:null,
  reverbGain:null,
  delay:null,
  delayGain:null,
  delayFeedback:null,
  reverbIR:null,
  initialized:false,
  voices:0,
  peakLeft:0,
  peakRight:0,
  totalVoices:0,

  init:function(){
    if(this.initialized)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      // Master chain: gain -> comp -> analyser -> splitter -> destination
      this.master=this.ctx.createGain();
      this.master.gain.value=0.75;
      this.masterComp=this.ctx.createDynamicsCompressor();
      this.masterComp.threshold.value=-12;
      this.masterComp.knee.value=8;
      this.masterComp.ratio.value=4;
      this.masterComp.attack.value=0.003;
      this.masterComp.release.value=0.25;
      this.masterAnalyser=this.ctx.createAnalyser();
      this.masterAnalyser.fftSize=2048;
      this.masterAnalyser.smoothingTimeConstant=0.75;
      this.master.connect(this.masterComp);
      this.masterComp.connect(this.masterAnalyser);
      this.masterAnalyser.connect(this.ctx.destination);
      // Reverb
      this.reverbIR=this.generateReverbIR(2.2,2.0);
      this.reverb=this.ctx.createConvolver();
      this.reverb.buffer=this.reverbIR;
      this.reverbGain=this.ctx.createGain();
      this.reverbGain.gain.value=0.35;
      this.reverb.connect(this.reverbGain);
      this.reverbGain.connect(this.master);
      // Delay
      this.delay=this.ctx.createDelay(2.0);
      this.delay.delayTime.value=0.35;
      this.delayGain=this.ctx.createGain();
      this.delayGain.gain.value=0.3;
      this.delayFeedback=this.ctx.createGain();
      this.delayFeedback.gain.value=0.4;
      this.delay.connect(this.delayFeedback);
      this.delayFeedback.connect(this.delay);
      this.delay.connect(this.delayGain);
      this.delayGain.connect(this.master);
      this.initialized=true;
      logMsg('AudioContext ready @ '+this.ctx.sampleRate+' Hz','ok');
    }catch(e){
      console.error(e);
      toast('Audio init failed: '+e.message,'error',5000);
    }
  },

  resume:function(){
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  },

  generateReverbIR:function(duration,decay){
    var rate=this.ctx.sampleRate;
    var len=Math.floor(rate*duration);
    var buf=this.ctx.createBuffer(2,len,rate);
    for(var ch=0;ch<2;ch++){
      var d=buf.getChannelData(ch);
      for(var i=0;i<len;i++){
        d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
      }
    }
    return buf;
  },

  now:function(){return this.ctx?this.ctx.currentTime:0},
  scheduleTime:function(t){return Math.max(t,this.now()+0.005)}
};

function logMsg(m,cls){
  var body=$('logBody');
  if(!body)return;
  var line=el('div',{class:'log-line '+(cls||'')});
  line.innerHTML='<span class="ts">'+new Date().toTimeString().slice(0,8)+'</span> '+esc(m);
  body.appendChild(line);
  body.scrollTop=body.scrollHeight;
}

/* ============================================================
   SYNTH ENGINE — Subtractive synthesis voice
   ============================================================ */
function SynthVoice(ctx,params,freq,velocity,startTime){
  this.ctx=ctx;
  this.params=params;
  this.freq=freq;
  this.velocity=velocity||1;
  this.startTime=startTime;
  this.osc1=null;
  this.osc2=null;
  this.sub=null;
  this.filter=null;
  this.ampGain=null;
  this.filterEnvAmount=params.filterEnvAmount||0;
  this.start();
}

SynthVoice.prototype.start=function(){
  var p=this.params;
  var ctx=this.ctx;
  var t=this.startTime;
  var freq=this.freq;
  var vel=this.velocity;

  // Amp envelope
  this.ampGain=ctx.createGain();
  this.ampGain.gain.setValueAtTime(0, t);
  var peak=p.amp*vel;
  this.ampGain.gain.linearRampToValueAtTime(peak, t+p.attack);
  this.ampGain.gain.linearRampToValueAtTime(peak*p.sustain, t+p.attack+p.decay);

  // Filter
  this.filter=ctx.createBiquadFilter();
  this.filter.type=p.filterType||'lowpass';
  var baseCutoff=p.cutoff;
  var envCutoff=baseCutoff+this.filterEnvAmount*p.envAmount*(p.cutoffMax||18000);
  this.filter.frequency.setValueAtTime(baseCutoff,t);
  this.filter.frequency.linearRampToValueAtTime(Math.min(18000,envCutoff),t+p.attack);
  this.filter.frequency.linearRampToValueAtTime(Math.min(18000,baseCutoff+envCutoff*0.4),t+p.attack+p.decay);
  this.filter.Q.value=p.resonance||1;

  // Oscillators
  var osc1Gain=ctx.createGain();
  osc1Gain.gain.value=p.osc1Level!=null?p.osc1Level:0.7;
  this.osc1=ctx.createOscillator();
  this.osc1.type=p.osc1Type||'sawtooth';
  this.osc1.frequency.setValueAtTime(freq,t);
  this.osc1.connect(osc1Gain);

  var osc2Gain=ctx.createGain();
  osc2Gain.gain.value=p.osc2Level!=null?p.osc2Level:0.5;
  this.osc2=ctx.createOscillator();
  this.osc2.type=p.osc2Type||'square';
  var detune=p.detune||0;
  this.osc2.frequency.setValueAtTime(freq*(1+detune/1200),t);
  this.osc2.connect(osc2Gain);

  var subGain=ctx.createGain();
  subGain.gain.value=p.subLevel!=null?p.subLevel:0;
  this.sub=ctx.createOscillator();
  this.sub.type='sine';
  this.sub.frequency.setValueAtTime(freq/2,t);
  this.sub.connect(subGain);

  // Mix to filter
  var mixGain=ctx.createGain();
  mixGain.gain.value=1;
  osc1Gain.connect(mixGain);
  osc2Gain.connect(mixGain);
  subGain.connect(mixGain);
  mixGain.connect(this.filter);
  this.filter.connect(this.ampGain);
  // Note: caller connects ampGain to destination

  // Schedule stop
  var totalDur=p.attack+p.decay+p.release+0.1;
  this.stopTime=t+totalDur;
  this.osc1.start(t);
  this.osc2.start(t);
  this.sub.start(t);
  this.osc1.stop(this.stopTime);
  this.osc2.stop(this.stopTime);
  this.sub.stop(this.stopTime);
  var self=this;
  this.ampGain.gain.setValueAtTime(peak*p.sustain, t+p.attack+p.decay);
  this.ampGain.gain.linearRampToValueAtTime(0.0001, t+p.attack+p.decay+p.release);
};

SynthVoice.prototype.release=function(){
  // Early release
  if(!this.ampGain||!this.ctx)return;
  var now=this.ctx.currentTime;
  var p=this.params;
  try{
    this.ampGain.gain.cancelScheduledValues(now);
    this.ampGain.gain.setValueAtTime(this.ampGain.gain.value,now);
    this.ampGain.gain.linearRampToValueAtTime(0.0001,now+p.release);
    var stopAt=now+p.release+0.02;
    if(this.osc1)this.osc1.stop(stopAt);
    if(this.osc2)this.osc2.stop(stopAt);
    if(this.sub)this.sub.stop(stopAt);
  }catch(e){}
};

/* ============================================================
   DRUM SYNTHS — Procedural
   ============================================================ */
var DRUMS={
  kick:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:1.0;
    var pitch=params.pitch||1.0;
    var decay=params.decay||0.4;
    var osc=ctx.createOscillator();
    var g=ctx.createGain();
    osc.frequency.setValueAtTime(150*pitch,time);
    osc.frequency.exponentialRampToValueAtTime(40*pitch,time+0.05);
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    osc.connect(g);
    g.connect(dest);
    osc.start(time);
    osc.stop(time+decay+0.05);
    // Click transient
    var click=ctx.createOscillator();
    var clickG=ctx.createGain();
    click.frequency.value=1200;
    clickG.gain.setValueAtTime(gain*0.3,time);
    clickG.gain.exponentialRampToValueAtTime(0.0001,time+0.02);
    click.connect(clickG);
    clickG.connect(dest);
    click.start(time);
    click.stop(time+0.03);
  },
  snare:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.8;
    var decay=params.decay||0.2;
    // Tuned noise
    var osc=ctx.createOscillator();
    osc.frequency.value=180;
    var og=ctx.createGain();
    og.gain.setValueAtTime(gain*0.7,time);
    og.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    osc.connect(og);
    og.connect(dest);
    osc.start(time);
    osc.stop(time+decay+0.05);
    // Noise
    var noise=ctx.createBufferSource();
    noise.buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.3),ctx.sampleRate);
    var nd=noise.buffer.getChannelData(0);
    for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var nf=ctx.createBiquadFilter();
    nf.type='highpass';
    nf.frequency.value=1000;
    var ng=ctx.createGain();
    ng.gain.setValueAtTime(gain,time);
    ng.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    noise.connect(nf);
    nf.connect(ng);
    ng.connect(dest);
    noise.start(time);
    noise.stop(time+decay+0.05);
  },
  hihat:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.5;
    var decay=params.decay||0.05;
    var noise=ctx.createBufferSource();
    noise.buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.15),ctx.sampleRate);
    var nd=noise.buffer.getChannelData(0);
    for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var nf=ctx.createBiquadFilter();
    nf.type='highpass';
    nf.frequency.value=7000;
    var ng=ctx.createGain();
    ng.gain.setValueAtTime(gain,time);
    ng.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    noise.connect(nf);
    nf.connect(ng);
    ng.connect(dest);
    noise.start(time);
    noise.stop(time+decay+0.05);
  },
  openhat:function(ctx,time,dest,params){
    DRUMS.hihat(ctx,time,dest,Object.assign({},params,{decay:0.35,gain:(params&&params.gain)||0.4}));
  },
  clap:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.7;
    // 3 quick bursts
    for(var b=0;b<3;b++){
      var t=time+b*0.008;
      var noise=ctx.createBufferSource();
      noise.buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.04),ctx.sampleRate);
      var nd=noise.buffer.getChannelData(0);
      for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      var nf=ctx.createBiquadFilter();
      nf.type='bandpass';
      nf.frequency.value=1400;
      nf.Q.value=0.8;
      var ng=ctx.createGain();
      ng.gain.setValueAtTime(gain*(b===2?1:0.6),t);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+(b===2?0.15:0.03));
      noise.connect(nf);
      nf.connect(ng);
      ng.connect(dest);
      noise.start(t);
      noise.stop(t+0.2);
    }
  },
  tom:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.7;
    var decay=params.decay||0.3;
    var base=params.pitch||200;
    var osc=ctx.createOscillator();
    osc.frequency.setValueAtTime(base,time);
    osc.frequency.exponentialRampToValueAtTime(base*0.4,time+0.15);
    var g=ctx.createGain();
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    osc.connect(g);
    g.connect(dest);
    osc.start(time);
    osc.stop(time+decay+0.05);
  },
  rim:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.6;
    var osc=ctx.createOscillator();
    osc.type='square';
    osc.frequency.value=1800;
    var g=ctx.createGain();
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.025);
    osc.connect(g);
    g.connect(dest);
    osc.start(time);
    osc.stop(time+0.05);
    var noise=ctx.createBufferSource();
    noise.buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.02),ctx.sampleRate);
    var nd=noise.buffer.getChannelData(0);
    for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var ng=ctx.createGain();
    ng.gain.setValueAtTime(gain*0.5,time);
    ng.gain.exponentialRampToValueAtTime(0.0001,time+0.02);
    noise.connect(ng);
    ng.connect(dest);
    noise.start(time);
    noise.stop(time+0.03);
  },
  cowbell:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.5;
    var osc1=ctx.createOscillator();
    osc1.type='square';
    osc1.frequency.value=540;
    var osc2=ctx.createOscillator();
    osc2.type='square';
    osc2.frequency.value=800;
    var g=ctx.createGain();
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.3);
    var bp=ctx.createBiquadFilter();
    bp.type='bandpass';
    bp.frequency.value=2640;
    bp.Q.value=1;
    osc1.connect(bp);
    osc2.connect(bp);
    bp.connect(g);
    g.connect(dest);
    osc1.start(time);
    osc2.start(time);
    osc1.stop(time+0.35);
    osc2.stop(time+0.35);
  },
  zap:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.6;
    var osc=ctx.createOscillator();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(2000,time);
    osc.frequency.exponentialRampToValueAtTime(50,time+0.15);
    var g=ctx.createGain();
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.15);
    osc.connect(g);
    g.connect(dest);
    osc.start(time);
    osc.stop(time+0.2);
  },
  noise:function(ctx,time,dest,params){
    params=params||{};
    var gain=params.gain!=null?params.gain:0.5;
    var decay=params.decay||0.2;
    var noise=ctx.createBufferSource();
    noise.buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*decay),ctx.sampleRate);
    var nd=noise.buffer.getChannelData(0);
    for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var g=ctx.createGain();
    g.gain.setValueAtTime(gain,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+decay);
    noise.connect(g);
    g.connect(dest);
    noise.start(time);
    noise.stop(time+decay+0.05);
  }
};

/* ============================================================
   FX ENGINE — Effects nodes
   ============================================================ */
var FX={
  createDistortion:function(ctx,amount){
    var ws=ctx.createWaveShaper();
    var n=1024,curve=new Float32Array(n);
    for(var i=0;i<n;i++){
      var x=i*2/n-1;
      curve[i]=(1+amount)*x/(1+amount*Math.abs(x));
    }
    ws.curve=curve;
    ws.oversample='4x';
    return ws;
  },
  createBitcrusher:function(ctx,bits){
    // Use ScriptProcessorNode — deprecated but works
    var n=bits||8;
    var step=Math.pow(0.5,n);
    var node=ctx.createScriptProcessor(4096,1,1);
    node.onaudioprocess=function(e){
      var inp=e.inputBuffer.getChannelData(0);
      var out=e.outputBuffer.getChannelData(0);
      for(var i=0;i<inp.length;i++){
        out[i]=step*Math.floor(inp[i]/step);
      }
    };
    return node;
  },
  createChorus:function(ctx,rate,depth,delay){
    var input=ctx.createGain();
    var output=ctx.createGain();
    var dl=ctx.createDelay(0.1);
    dl.delayTime.value=delay||0.02;
    var lfo=ctx.createOscillator();
    lfo.frequency.value=rate||1.5;
    var lfoGain=ctx.createGain();
    lfoGain.gain.value=depth||0.005;
    lfo.connect(lfoGain);
    lfoGain.connect(dl.delayTime);
    input.connect(dl);
    dl.connect(output);
    input.connect(output);
    lfo.start();
    return {input:input,output:output,node:null};
  }
};

/* ============================================================
   WAV EXPORT — OfflineAudioContext rendering
   ============================================================ */
function renderToWAV(song,duration,onProgress){
  var sampleRate=44100;
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  var ctx=new OAC(2,Math.floor(sampleRate*duration),sampleRate);
  // Recreate master chain
  var master=ctx.createGain();
  master.gain.value=0.75;
  var comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-12;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.25;
  master.connect(comp);
  comp.connect(ctx.destination);
  // Reverb IR
  var irLen=Math.floor(sampleRate*2.2);
  var ir=ctx.createBuffer(2,irLen,sampleRate);
  for(var ch=0;ch<2;ch++){
    var d=ir.getChannelData(ch);
    for(var i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2.0);
  }
  var reverb=ctx.createConvolver();
  reverb.buffer=ir;
  var reverbGain=ctx.createGain();
  reverbGain.gain.value=0.35;
  reverb.connect(reverbGain);
  reverbGain.connect(master);
  // Delay
  var delay=ctx.createDelay(2.0);
  delay.delayTime.value=0.35;
  var delayGain=ctx.createGain();
  delayGain.gain.value=0.3;
  var delayFB=ctx.createGain();
  delayFB.gain.value=0.4;
  delay.connect(delayFB);
  delayFB.connect(delay);
  delay.connect(delayGain);
  delayGain.connect(master);
  // Track routing
  var trackNodes=song.tracks.map(function(t){
    var g=ctx.createGain();
    var pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    g.gain.value=t.mute?0:t.volume;
    if(pan){pan.pan.value=t.pan||0;g.connect(pan);pan.connect(master);if(t.reverbSend)pan.connect(reverb);if(t.delaySend)pan.connect(delay);}
    else{g.connect(master);if(t.reverbSend)g.connect(reverb);if(t.delaySend)g.connect(delay);}
    return {node:g,pan:pan,track:t};
  });
  // Schedule all notes
  var stepDur=60/song.bpm/4;
  var totalSteps=0;
  song.arrangement.forEach(function(patIdx){
    if(patIdx<0)return;
    totalSteps=Math.max(totalSteps,0);
  });
  // Render each pattern's steps
  var stepCount=song.arrangement.length*16;
  for(var s=0;s<stepCount;s++){
    var stepTime=s*stepDur;
    var patIdx=Math.floor(s/16);
    var stepIdx=s%16;
    var pattern=song.arrangement[patIdx];
    if(pattern<0)continue;
    var pat=song.patterns[pattern];
    if(!pat)continue;
    song.tracks.forEach(function(track,i){
      var cell=pat.tracks[i]&&pat.tracks[i][stepIdx];
      if(!cell||!cell.on)return;
      var dest=trackNodes[i].node;
      var time=stepTime;
      if(track.type==='drum'&&DRUMS[track.drumType]){
        DRUMS[track.drumType](ctx,time,dest,{gain:cell.vel||1,pitch:track.pitch||1});
      }else if(track.type==='synth'&&track.params){
        var freq=440*Math.pow(2,(cell.note-69)/12);
        var v=new SynthVoice(ctx,track.params,freq,cell.vel||1,time);
        v.ampGain.connect(dest);
      }
    });
  }
  // Render
  return ctx.startRendering().then(function(buffer){
    return encodeWAV(buffer);
  });
}

function encodeWAV(buffer){
  var numCh=buffer.numberOfChannels;
  var len=buffer.length;
  var sampleRate=buffer.sampleRate;
  var bytesPerSample=2;
  var blockAlign=numCh*bytesPerSample;
  var byteRate=sampleRate*blockAlign;
  var dataSize=len*blockAlign;
  var bufferArr=new ArrayBuffer(44+dataSize);
  var view=new DataView(bufferArr);
  function writeString(off,s){for(var i=0;i<s.length;i++)view.setUint8(off+i,s.charCodeAt(i))}
  writeString(0,'RIFF');
  view.setUint32(4,36+dataSize,true);
  writeString(8,'WAVE');
  writeString(12,'fmt ');
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,numCh,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28,byteRate,true);
  view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true);
  writeString(36,'data');
  view.setUint32(40,dataSize,true);
  var channels=[];
  for(var ch=0;ch<numCh;ch++)channels.push(buffer.getChannelData(ch));
  var off=44;
  for(var i=0;i<len;i++){
    for(var ch2=0;ch2<numCh;ch2++){
      var s=Math.max(-1,Math.min(1,channels[ch2][i]));
      view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);
      off+=2;
    }
  }
  return new Blob([bufferArr],{type:'audio/wav'});
}

function initSong(){

/* ============================================================
   TRANSPORT / SCHEDULER
   ============================================================ */
var TRANSPORT={
  nextStepTime:0,
  stepCounter:0,
  schedulerId:null,
  currentTime:0,

  start:function(){
    AUDIO.init();
    AUDIO.resume();
    if(!AUDIO.ctx)return;
    this.nextStepTime=AUDIO.ctx.currentTime+0.05;
    this.stepCounter=0;
    SONG.playing=true;
    SONG.currentStep=0;
    $('btnPlay').classList.add('playing');
    $('btnPlay').textContent='⏸';
    $('sbStatus').textContent='Playing';
    this.scheduler();
    this.schedulerId=setInterval(this.scheduler.bind(this),25);
  },

  stop:function(){
    SONG.playing=false;
    SONG.currentStep=0;
    if(this.schedulerId){clearInterval(this.schedulerId);this.schedulerId=null;}
    $('btnPlay').classList.remove('playing');
    $('btnPlay').textContent='▶';
    $('sbStatus').textContent='Ready';
    renderContent();
  },

  scheduler:function(){
    if(!SONG.playing||!AUDIO.ctx)return;
    var stepDur=60/SONG.bpm/4;
    var scheduleAhead=0.1;
    while(this.nextStepTime<AUDIO.ctx.currentTime+scheduleAhead){
      this.scheduleStep(this.stepCounter,this.nextStepTime);
      this.nextStepTime+=stepDur;
      this.stepCounter++;
      // Handle pattern progression
      var stepsPerPattern=16;
      var totalStepsPerLoop=SONG.arrangement.length*stepsPerPattern;
      if(this.stepCounter>=totalStepsPerLoop){
        if(SONG.looping){this.stepCounter=0;}
        else{this.stop();return;}
      }
    }
  },

  scheduleStep:function(globalStep,time){
    var patIdx=Math.floor(globalStep/16);
    var stepIdx=globalStep%16;
    var patternNum=SONG.arrangement[patIdx];
    if(patternNum<0)return;
    var pattern=SONG.patterns[patternNum];
    if(!pattern)return;
    var pat=pattern;
    // For live viewing/UI updates
    var self=this;
    var delayMs=(time-AUDIO.ctx.currentTime)*1000;
    setTimeout(function(){
      SONG.currentStep=stepIdx;
      SONG.currentArrangementStep=patIdx;
      if(SONG.currentTab==='sequencer')updatePlayhead(stepIdx,patIdx);
      $('sbPos').textContent=(patIdx+1)+':'+Math.floor(stepIdx/4+1)+':'+String(stepIdx%4*100).padStart(3,'0');
      $('sbPattern').textContent=patternNum+1;
    },Math.max(0,delayMs));
    // Schedule each track's step
    SONG.tracks.forEach(function(track,i){
      var cell=pat.tracks[i]&&pat.tracks[i][stepIdx];
      if(!cell||!cell.on)return;
      if(track.mute)return;
      var anySolo=SONG.tracks.some(function(t){return t.solo});
      if(anySolo&&!track.solo)return;
      var gainNode=TRACK_NODES[i];
      if(!gainNode)return;
      var dest=gainNode.node;
      var cellVel=cell.vel!=null?cell.vel:1;
      if(track.type==='drum'){
        var fn=DRUMS[track.drumType]||DRUMS.kick;
        fn(AUDIO.ctx,time,dest,{gain:cellVel*track.volume,pitch:track.pitch||1});
      }else if(track.type==='synth'){
        var freq=440*Math.pow(2,((cell.note!=null?cell.note:60)-69)/12);
        var v=new SynthVoice(AUDIO.ctx,track.params,freq,cellVel*track.volume,time);
        v.ampGain.connect(dest);
      }
      // Trigger VU meter animation via scheduled callback
      setTimeout(function(){triggerTrackMeter(i,cellVel)},Math.max(0,delayMs));
    });
  }
};

/* ============================================================
   TRACK AUDIO NODES
   ============================================================ */
var TRACK_NODES=[];

function buildTrackNodes(){
  if(!AUDIO.ctx)return;
  TRACK_NODES=[];
  SONG.tracks.forEach(function(track,i){
    var g=AUDIO.ctx.createGain();
    g.gain.value=track.mute?0:track.volume;
    var pan=AUDIO.ctx.createStereoPanner?AUDIO.ctx.createStereoPanner():null;
    if(pan){
      pan.pan.value=track.pan||0;
      g.connect(pan);
      pan.connect(AUDIO.master);
      if(track.reverbSend>0){
        var rs=AUDIO.ctx.createGain();
        rs.gain.value=track.reverbSend;
        pan.connect(rs);
        rs.connect(AUDIO.reverb);
      }
      if(track.delaySend>0){
        var ds=AUDIO.ctx.createGain();
        ds.gain.value=track.delaySend;
        pan.connect(ds);
        ds.connect(AUDIO.delay);
      }
    }else{
      g.connect(AUDIO.master);
      if(track.reverbSend>0){
        var rs2=AUDIO.ctx.createGain();
        rs2.gain.value=track.reverbSend;
        g.connect(rs2);
        rs2.connect(AUDIO.reverb);
      }
      if(track.delaySend>0){
        var ds2=AUDIO.ctx.createGain();
        ds2.gain.value=track.delaySend;
        g.connect(ds2);
        ds2.connect(AUDIO.delay);
      }
    }
    TRACK_NODES.push({node:g,pan:pan,track:track});
  });
}

function rebuildTrackNodes(){
  if(!AUDIO.ctx)return;
  // Disconnect old
  TRACK_NODES.forEach(function(n){
    try{n.node.disconnect();}catch(e){}
    try{if(n.pan)n.pan.disconnect();}catch(e){}
  });
  buildTrackNodes();
}

function updateTrackNode(i){
  var node=TRACK_NODES[i];
  if(!node)return;
  var track=SONG.tracks[i];
  var anySolo=SONG.tracks.some(function(t){return t.solo});
  var mute=track.mute||(anySolo&&!track.solo);
  node.node.gain.value=mute?0:track.volume;
  if(node.pan)node.pan.pan.value=track.pan||0;
}

/* ============================================================
   VU METERS
   ============================================================ */
var TRACK_METERS=[];

function triggerTrackMeter(i,velocity){
  if(!TRACK_METERS[i])TRACK_METERS[i]={level:0,peak:0};
  TRACK_METERS[i].level=Math.min(1,TRACK_METERS[i].level+velocity*0.8);
  TRACK_METERS[i].peak=Math.max(TRACK_METERS[i].peak,TRACK_METERS[i].level);
}

function tickMeters(dt){
  for(var i=0;i<TRACK_COUNT;i++){
    if(!TRACK_METERS[i])TRACK_METERS[i]={level:0,peak:0};
    TRACK_METERS[i].level*=Math.pow(0.0001,dt*3);
    TRACK_METERS[i].peak*=Math.pow(0.0005,dt);
    if(TRACK_METERS[i].peak<0.001)TRACK_METERS[i].peak=0;
  }
  // Master meter
  if(AUDIO.masterAnalyser){
    var data=new Uint8Array(AUDIO.masterAnalyser.fftSize);
    AUDIO.masterAnalyser.getByteTimeDomainData(data);
    var peak=0;
    for(var k=0;k<data.length;k++){
      var v=Math.abs(data[k]-128)/128;
      if(v>peak)peak=v;
    }
    AUDIO.peakLeft=Math.max(AUDIO.peakLeft*0.92,peak);
    var pct=Math.min(100,AUDIO.peakLeft*130);
    var fill=$('sbMeterFill');
    var pk=$('sbMeterPeak');
    if(fill)fill.style.width=pct+'%';
    if(pk)pk.style.left=pct+'%';
  }
}

function updatePlayhead(step,patIdx){
  $$('.step').forEach(function(el){
    el.classList.remove('playing');
    if(parseInt(el.getAttribute('data-step'))===step&&parseInt(el.getAttribute('data-pat'))===SONG.arrangement[patIdx]){
      el.classList.add('playing');
    }
  });
  $$('.arrange-cell').forEach(function(el){
    el.classList.toggle('playing',parseInt(el.getAttribute('data-idx'))===patIdx&&el.classList.contains('filled'));
  });
}

function saveSong(){

    toast('Song saved','success');
  }catch(e){toast('Save failed: '+e.message,'error')}
}
function loadSong(){
  try{
    var raw=localStorage.getItem('resonance-song');
    if(!raw){toast('No saved song found','warn');return}
    var data=JSON.parse(raw);
    Object.assign(SONG,data);
    rebuildTrackNodes();
    refreshAll();
    toast('Song loaded','success');
  }catch(e){toast('Load failed: '+e.message,'error')}
}
function downloadBlob(blob,name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
}
function exportWAV(){
  if(!SONG.playing){
    // Silent render
    toast('Rendering song to WAV...','info',2000);
    var stepDur=60/SONG.bpm/4;
    var duration=SONG.arrangement.length*16*stepDur+3;
    renderToWAV(SONG,duration,function(p){}).then(function(blob){
      downloadBlob(blob,'resonance-song.wav');
      toast('WAV exported ('+fmt(duration,1)+'s)','success');
    }).catch(function(e){
      toast('Render failed: '+e.message,'error',5000);
    });
  }else{
    toast('Stop transport before exporting','warn');
  }
}

function setPattern(i){SONG.currentPattern=i;renderContent();}
function duplicatePattern(){
  var src=SONG.patterns[SONG.currentPattern];
  var copy=JSON.parse(JSON.stringify(src));
  // Find an empty pattern to overwrite
  var emptyIdx=SONG.currentPattern+1;
  if(emptyIdx>=SONG.patternCount)emptyIdx=0;
  SONG.patterns[emptyIdx]=copy;
  SONG.currentPattern=emptyIdx;
  renderContent();
  toast('Duplicated to pattern '+(emptyIdx+1),'success');
}
function clearPattern(){
  SONG.patterns[SONG.currentPattern]=makeEmptyPattern();
  renderContent();
  toast('Pattern cleared','info');
}
function randomizePattern(){
  var pat=SONG.patterns[SONG.currentPattern];
  // Kick
  [0,4,8,12].forEach(function(s){if(Math.random()<0.85)pat.tracks[0][s]={on:true,vel:rndF(0.8,1),note:60}});
  if(Math.random()<0.5){[6,14].forEach(function(s){pat.tracks[0][s]={on:true,vel:rndF(0.5,0.9),note:60}})}
  // Snare
  [4,12].forEach(function(s){pat.tracks[1][s]={on:true,vel:rndF(0.7,0.95),note:60}});
  // HiHat
  for(var s=0;s<16;s++){if(Math.random()<0.5)pat.tracks[2][s]={on:true,vel:rndF(0.3,0.7),note:60}}
  // Clap sometimes
  if(Math.random()<0.4)pat.tracks[4][12]={on:true,vel:0.8,note:60};
  // Bass line
  var scale=[36,38,41,43,46,48];
  for(var s2=0;s2<16;s2++){if(Math.random()<0.3)pat.tracks[5][s2]={on:true,vel:rndF(0.6,0.9),note:pick(scale)}}
  // Lead
  var leadScale=[60,62,64,65,67,69,72];
  for(var s3=0;s3<16;s3++){if(Math.random()<0.35)pat.tracks[6][s3]={on:true,vel:rndF(0.5,0.8),note:pick(leadScale)}}
  renderContent();
  toast('Randomized pattern','success');
}
function toggleStep(ti,s){
  var pat=SONG.patterns[SONG.currentPattern];
  var cell=pat.tracks[ti][s];
  cell.on=!cell.on;
  renderContent();
  if(cell.on){
    // Preview note
    if(AUDIO.ctx){
      AUDIO.resume();
      var track=SONG.tracks[ti];
      var node=TRACK_NODES[ti];
      if(node){
        var t=AUDIO.ctx.currentTime+0.01;
        if(track.type==='drum'){DRUMS[track.drumType](AUDIO.ctx,t,node.node,{gain:cell.vel*track.volume});}
        else if(track.type==='synth'){var v=new SynthVoice(AUDIO.ctx,track.params,440*Math.pow(2,(cell.note-69)/12),cell.vel*track.volume,t);v.ampGain.connect(node.node);}
        triggerTrackMeter(ti,cell.vel);
      }
    }
  }
}
function setVelocity(ti,s){
  var pat=SONG.patterns[SONG.currentPattern];
  var cell=pat.tracks[ti][s];
  if(!cell.on)return;
  var v=prompt('Velocity (0-1):',cell.vel);

function selectTrack(i){SONG.selectedTrack=i;renderContent()}
function renderPianoKeyboard(){
  var k=$('pianoKeyboard');
  if(!k)return;
  k.innerHTML='';
  // Two octaves starting at C4
  var octaves=[4,5];
  var whiteNotes=['C','D','E','F','G','A','B'];
  var blackNotes={C:'C#',D:'D#',F:'F#',G:'G#',A:'A#'};
  var noteNum={C:60,D:62,E:64,F:65,G:67,A:69,B:71};
  octaves.forEach(function(oct,oi){
    whiteNotes.forEach(function(n,wi){
      var baseNum=noteNum[n]+oi*12;
      var pk=el('div',{class:'pkey white'},n+oct);
      pk.onmousedown=function(){playNote(baseNum,true)};
      pk.onmouseup=function(){playNote(baseNum,false)};
      pk.onmouseleave=function(){pk.classList.remove('pressed')};
      k.appendChild(pk);
      if(blackNotes[n]&&!(oi===1&&n==='B')){
        var bpk=el('div',{class:'pkey black'},blackNotes[n]);
        var blackNum=baseNum+1;
        bpk.onmousedown=function(e){e.stopPropagation();playNote(blackNum,true)};
        bpk.onmouseup=function(){playNote(blackNum,false)};
        bpk.onmouseleave=function(){bpk.classList.remove('pressed')};
        k.appendChild(bpk);
      }
    });
  });
}
var activeVoices=[];
function playNote(num,on){
  AUDIO.init();AUDIO.resume();
  var track=SONG.tracks[SONG.selectedTrack];
  var node=TRACK_NODES[SONG.selectedTrack];
  if(!node||!track)return;
  if(on){
    var t=AUDIO.ctx.currentTime+0.005;
    if(track.type==='synth'){
      var freq=440*Math.pow(2,(num-69)/12);
      var v=new SynthVoice(AUDIO.ctx,track.params,freq,0.8,t);
      v.ampGain.connect(node.node);
      activeVoices[num]=v;
      triggerTrackMeter(SONG.selectedTrack,0.8);
    }else if(track.type==='drum'){
      DRUMS[track.drumType](AUDIO.ctx,t,node.node,{gain:0.9});
      triggerTrackMeter(SONG.selectedTrack,0.9);
    }
    $$('.pkey').forEach(function(pk){
      var pn=pk.textContent.replace(/[^A-Za-z0-9#]/g,'');
      if(pn===noteLabel(num))pk.classList.add('pressed');
    });
  }else{
    if(activeVoices[num]){activeVoices[num].release();delete activeVoices[num];}
    $$('.pkey').forEach(function(pk){pk.classList.remove('pressed')});
  }
}
function noteLabel(num){
  var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[num%12];
}

function setupMixerInteractions(){
  // Faders
  $$('[data-track-fader]').forEach(function(f){
    var i=parseInt(f.getAttribute('data-track-fader'));
    var thumb=f.querySelector('.strip-fader-thumb');
    var fill=f.querySelector('.strip-fader-fill');
    var dragging=false;
    function update(e){
      var r=f.getBoundingClientRect();
      var y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      var v=clamp(1-y/r.height,0,1);
      SONG.tracks[i].volume=v;
      fill.style.height=(v*100)+'%';
      thumb.style.bottom='calc('+(v*100)+'% - 6px)';
      f.parentElement.querySelector('.strip-vol-num').textContent=Math.round(v*100);
      updateTrackNode(i);
    }
    f.onmousedown=function(e){dragging=true;update(e);document.addEventListener('mousemove',onm);document.addEventListener('mouseup',onup);e.preventDefault()};
    function onm(e){if(dragging)update(e)}
    function onup(){dragging=false;document.removeEventListener('mousemove',onm);document.removeEventListener('mouseup',onup)}
    f.ontouchstart=function(e){dragging=true;update(e);e.preventDefault()};
    f.ontouchmove=function(e){if(dragging){update(e);e.preventDefault()}};
    f.ontouchend=function(){dragging=false};
  });
  // Master fader
  var mf=$('[data-master]');
  if(mf){
    var mThumb=mf.querySelector('.strip-fader-thumb');
    var mFill=mf.querySelector('.strip-fader-fill');
    var mDrag=false;
    function mUpd(e){
      var r=mf.getBoundingClientRect();
      var y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      var v=clamp(1-y/r.height,0,1);
      SONG.masterVolume=v;
      AUDIO.master.gain.value=v;
      mFill.style.height=(v*100)+'%';
      mThumb.style.bottom='calc('+(v*100)+'% - 6px)';
      mf.parentElement.querySelector('.strip-vol-num').textContent=Math.round(v*100);
    }
    mf.onmousedown=function(e){mDrag=true;mUpd(e);document.addEventListener('mousemove',onMm);document.addEventListener('mouseup',onMu);e.preventDefault()};
    function onMm(e){if(mDrag)mUpd(e)}
    function onMu(){mDrag=false;document.removeEventListener('mousemove',onMm);document.removeEventListener('mouseup',onMu)}
  }
  // Pan
  $$('[data-track-pan]').forEach(function(f){
    var i=parseInt(f.getAttribute('data-track-pan'));
    var thumb=f.querySelector('.strip-pan-thumb');
    var dragging=false;
    function update(e){
      var r=f.getBoundingClientRect();
      var x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width;
      var v=clamp(x*2-1,-1,1);
      SONG.tracks[i].pan=v;
      thumb.style.left='calc('+((v+1)/2*100)+'% - 3px)';
      updateTrackNode(i);
    }
    f.onmousedown=function(e){dragging=true;update(e);e.preventDefault()};
    f.onmousemove=function(e){if(dragging)update(e)};
    f.onmouseup=function(){dragging=false};
    f.onmouseleave=function(){dragging=false};
  });
  // Meter RAF
  updateMeterDisplays();
}
function updateMeterDisplays(){
  $$('[data-meter]').forEach(function(el){
    var i=parseInt(el.getAttribute('data-meter'));
    var m=TRACK_METERS[i]||{level:0};
    var pct=Math.min(100,m.level*130);
    el.style.height=pct+'%';
  });
  if(SONG.currentTab==='mixer')requestAnimationFrame(updateMeterDisplays);
}
function toggleMute(i){

function toggleSolo(i){

  AUDIO.init();AUDIO.resume();

  var t=AUDIO.ctx.currentTime+0.01;
  if(track.type==='drum'){DRUMS[track.drumType](AUDIO.ctx,t,node.node,{gain:0.9});}
  else{var v=new SynthVoice(AUDIO.ctx,track.params,440,0.8,t);v.ampGain.connect(node.node);}
  triggerTrackMeter(i,0.9);
}

function renderSynthEditor(c){

function waveIcon(w){
  var paths={
    sine:'<path d="M2 10 Q8 2 14 10 T26 10" stroke="currentColor" stroke-width="1.5" fill="none"/>',
    triangle:'<path d="M2 10 L8 4 L14 10 L20 4 L26 10" stroke="currentColor" stroke-width="1.5" fill="none"/>',
    sawtooth:'<path d="M2 10 L14 4 L2 4 M14 10 L26 4 L14 4" stroke="currentColor" stroke-width="1.5" fill="none"/>',
    square:'<path d="M2 10 L2 4 L14 4 L14 10 L26 10 L26 4" stroke="currentColor" stroke-width="1.5" fill="none"/>'
  };
  return '<svg viewBox="0 0 28 14">'+paths[w]+'</svg>';
}
function adsrSVG(a,d,s,r){
  var total=a+d+r+0.5;
  var w=100;
  var scaleX=w/total;
  var h=60;
  var x1=a*scaleX,x2=(a+d)*scaleX,x3=(a+d+0.5)*scaleX,x4=(a+d+0.5+r)*scaleX;
  var y1=4,y2=4+s*(h-8),y3=4+s*(h-8),y4=4+s*(h-8);
  return '<svg viewBox="0 0 100 60" preserveAspectRatio="none">'+
    '<polyline points="0,60 '+x1+','+y1+' '+x2+','+y2+' '+x3+','+y3+' '+x4+',60" stroke="#ff3ea5" stroke-width="1.5" fill="rgba(255,62,165,.15)"/>'+
    '</svg>';
}
function knob(key,label,value,min,max,fn,unit,altKey){
  var id='knob_'+key+'_'+Math.random().toString(36).substr(2,5);
  var display=unit==='hz'?(value<1000?Math.round(value)+'Hz':(value/1000).toFixed(1)+'k'):(max>10?value.toFixed(0):value.toFixed(2));
  return '<div class="knob" data-knob="'+id+'" data-key="'+key+'" data-fn="'+fn+'" data-alt-key="'+(altKey||'')+'" data-min="'+min+'" data-max="'+max+'" data-value="'+value+'">'+
    '<div class="knob-dial"></div>'+
    '<div class="knob-label">'+label+'</div>'+
    '<div class="knob-value">'+display+'</div>'+
    '</div>';
}
function setupKnobInteractions(){
  $$('[data-knob]').forEach(function(k){
    var key=k.getAttribute('data-key');
    var fn=k.getAttribute('data-fn');
    var altKey=k.getAttribute('data-alt-key');
    var min=parseFloat(k.getAttribute('data-min'));
    var max=parseFloat(k.getAttribute('data-max'));
    var val=parseFloat(k.getAttribute('data-value'));
    var dial=k.querySelector('.knob-dial');
    var valEl=k.querySelector('.knob-value');
    function upd(){
      if(fn==='setSynthParam'){setSynthParam(key,val);}
      else if(fn==='setTrackSend'){SONG.tracks[SONG.selectedTrack][altKey||key]=val;}
      var display=max>10?Math.round(val):val.toFixed(2);
      if(key==='cutoff')display=val<1000?Math.round(val)+'Hz':(val/1000).toFixed(1)+'k';
      valEl.textContent=display;
      var rot=(val-min)/(max-min)*270-135;
      dial.style.transform='rotate(0deg)';
      dial.style.setProperty('--rot',rot+'deg');
      var after=dial;
      after.style.background='radial-gradient(circle at 35% 35%,var(--panel4),var(--bg))';
      var indicator=after.querySelector('::after');
      // Instead of pseudo, use transform on dial + rotate indicator via inline style
      dial.style.transform='rotate('+rot+'deg)';
    }
    var dragging=false,startY,startVal;
    dial.onmousedown=function(e){
      dragging=true;startY=e.clientY;startVal=val;
      document.addEventListener('mousemove',onm);
      document.addEventListener('mouseup',onup);
      e.preventDefault();
    };
    function onm(e){
      if(!dragging)return;
      var dy=startY-e.clientY;
      var delta=(max-min)*dy/200;
      var nv=clamp(startVal+delta,min,max);
      if(max<=1)nv=Math.round(nv*100)/100;
      else nv=Math.round(nv);
      val=nv;
      upd();
    }
    function onup(){dragging=false;document.removeEventListener('mousemove',onm);document.removeEventListener('mouseup',onup);}
    dial.onwheel=function(e){
      e.preventDefault();
      var delta=(max-min)*0.03*(e.deltaY<0?1:-1);
      val=clamp(val+delta,min,max);
      if(max<=1)val=Math.round(val*100)/100;
      else val=Math.round(val);
      upd();
    };
    upd();
  });
}
function setSynthParam(k,v){
  var track=SONG.tracks[SONG.selectedTrack];
  if(!track.params)return;
  track.params[k]=typeof v==='number'?v:parseFloat(v);
}
function setTrackSend(k,v){
  SONG.tracks[SONG.selectedTrack][k]=parseFloat(v);

}
function applySynthPreset(k){
  var p=SYNTH_PRESETS[k];
  if(!p)return;
  SONG.tracks[SONG.selectedTrack].params=JSON.parse(JSON.stringify(p));
  SONG.tracks[SONG.selectedTrack].preset=k;
  renderSynthEditor($('contentArea'));
  toast('Applied preset: '+p.name,'success');
}

var visualizerAnim=null;
function startVisualizers(){
  function draw(){
    if(SONG.currentTab!=='effects'){visualizerAnim=null;return;}
    // Spectrum
    var specC=$('fxSpectrum');
    if(specC&&AUDIO.masterAnalyser){
      if(!specC._ctx){
        specC.width=specC.clientWidth*2;
        specC.height=specC.clientHeight*2;
        specC._ctx=specC.getContext('2d');
      }
      var ctx=specC._ctx;
      var W=specC.width,H=specC.height;
      ctx.fillStyle='#08060f';ctx.fillRect(0,0,W,H);
      var data=new Uint8Array(AUDIO.masterAnalyser.frequencyBinCount);
      AUDIO.masterAnalyser.getByteFrequencyData(data);
      var bars=64;
      var bw=W/bars;
      for(var i=0;i<bars;i++){
        var v=data[Math.floor(i/bars*data.length/2)]/255;
        var h=v*H;
        var grad=ctx.createLinearGradient(0,H-h,0,H);
        grad.addColorStop(0,'#ff3ea5');
        grad.addColorStop(0.5,'#a060ff');
        grad.addColorStop(1,'#3ee0ff');
        ctx.fillStyle=grad;
        ctx.fillRect(i*bw,H-h,bw-1,h);
      }
    }
    // Oscilloscope
    var oscC=$('fxOscillo');
    if(oscC&&AUDIO.masterAnalyser){
      if(!oscC._ctx){
        oscC.width=oscC.clientWidth*2;
        oscC.height=oscC.clientHeight*2;
        oscC._ctx=oscC.getContext('2d');
      }
      var ctx2=oscC._ctx;
      var W2=oscC.width,H2=oscC.height;
      ctx2.fillStyle='#08060f';ctx2.fillRect(0,0,W2,H2);
      var td=new Uint8Array(AUDIO.masterAnalyser.fftSize);
      AUDIO.masterAnalyser.getByteTimeDomainData(td);
      ctx2.strokeStyle='#40ff90';
      ctx2.lineWidth=2;
      ctx2.beginPath();
      for(var i2=0;i2<td.length;i2++){
        var x=i2/td.length*W2;
        var y=(td[i2]/128)*H2/2;
        if(i2===0)ctx2.moveTo(x,y);else ctx2.lineTo(x,y);
      }
      ctx2.stroke();
    }
    visualizerAnim=requestAnimationFrame(draw);
  }
  if(!visualizerAnim)draw();
}
function toggleFx(which,el2){
  el2.classList.toggle('on');
  var on=el2.classList.contains('on');
  if(which==='reverb'&&AUDIO.reverbGain)AUDIO.reverbGain.gain.value=on?SONG.reverb:0;
  else if(which==='delay'&&AUDIO.delayGain)AUDIO.delayGain.gain.value=on?SONG.delay:0;
}

    html+='<div class="sec"><h4>Drum Type</h4>';
    var sel=el('select',{});
    DRUM_TYPES.forEach(function(dt){
      var o=el('option',{value:dt},dt);
      if(dt===track.drumType)o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=function(){
      track.drumType=this.value;
      track.color=DRUM_COLORS[this.value];
      track.icon=DRUM_ICONS[this.value];
      renderContent();
    };
    html+='<div class="ctrl"></div>';
    p.innerHTML=html;
    p.querySelector('.ctrl').appendChild(sel);
    html='';
    html+='<div class="sec"><h4>Drum Pitch</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Pitch</span><span id="pitchVal">'+fmt(track.pitch||1,2)+'</span></div>';
    html+='<input type="range" min="0.5" max="2" step="0.01" value="'+(track.pitch||1)+'" oninput="SONG.tracks['+ti+'].pitch=parseFloat(this.value);document.getElementById(\'pitchVal\').textContent=Number(this.value).toFixed(2)"></div>';
    html+='</div>';
  }else{
    html+='<div class="sec"><h4>Synth Preset</h4>';
    Object.keys(SYNTH_PRESETS).forEach(function(k){
      html+='<button class="btn full" style="margin-bottom:4px" onclick="applySynthPreset(\''+k+'\')">'+SYNTH_PRESETS[k].name+'</button>';
    });
    html+='</div>';
  }
  html+='<div class="sec"><h4>Mix</h4>';
  html+='<div class="ctrl"><div class="lbl"><span>Volume</span><span id="volV">'+Math.round(track.volume*100)+'</span></div>';
  html+='<input type="range" min="0" max="1" step="0.01" value="'+track.volume+'" oninput="SONG.tracks['+ti+'].volume=parseFloat(this.value);updateTrackNode('+ti+');document.getElementById(\'volV\').textContent=Math.round(this.value*100)"></div>';
  html+='<div class="ctrl"><div class="lbl"><span>Pan</span><span id="panV">'+fmt(track.pan,2)+'</span></div>';
  html+='<input type="range" min="-1" max="1" step="0.01" value="'+track.pan+'" oninput="SONG.tracks['+ti+'].pan=parseFloat(this.value);updateTrackNode('+ti+');document.getElementById(\'panV\').textContent=Number(this.value).toFixed(2)"></div>';
  html+='<div class="ctrl"><div class="lbl"><span>Reverb Send</span><span>'+fmt(track.reverbSend,2)+'</span></div>';
  html+='<input type="range" min="0" max="1" step="0.01" value="'+track.reverbSend+'" oninput="SONG.tracks['+ti+'].reverbSend=parseFloat(this.value);rebuildTrackNodes()"></div>';
  html+='<div class="ctrl"><div class="lbl"><span>Delay Send</span><span>'+fmt(track.delaySend,2)+'</span></div>';
  html+='<input type="range" min="0" max="1" step="0.01" value="'+track.delaySend+'" oninput="SONG.tracks['+ti+'].delaySend=parseFloat(this.value);rebuildTrackNodes()"></div>';
  html+='</div>';
  html+='<div class="sec"><h4>Global</h4>';
  html+='<div class="ctrl"><div class="lbl"><span>Tempo</span><span id="bpmV">'+SONG.bpm+'</span></div>';
  html+='<input type="range" min="40" max="300" step="1" value="'+SONG.bpm+'" oninput="SONG.bpm=parseInt(this.value);document.getElementById(\'tempoInput\').value=this.value;document.getElementById(\'bpmV\').textContent=this.value"></div>';
  html+='</div>';
  p.innerHTML=html;
}
</script>
<script>
/* ============================================================
   TRANSPORT UI
   ============================================================ */
function togglePlay(){
  if(SONG.playing)stopTransport();
  else TRANSPORT.start();
}
function stopTransport(){
  TRANSPORT.stop();
}
function toggleLoop(){
  SONG.looping=!SONG.looping;
  $('btnLoop').classList.toggle('active',SONG.looping);
  toast('Loop '+(SONG.looping?'ON':'OFF'),'info');
}
function toggleRecord(){
  SONG.recording=!SONG.recording;
  $('btnRec').classList.toggle('active',SONG.recording);
  toast('Record '+(SONG.recording?'ARMED':'OFF'),'info');
}

/* ============================================================
   THEME
   ============================================================ */
function toggleTheme(){
  var themes=['neon','studio','sunset','ocean','paper'];
  var cur=document.documentElement.getAttribute('data-theme');
  var i=themes.indexOf(cur);
  document.documentElement.setAttribute('data-theme',themes[(i+1)%themes.length]);
  toast('Theme: '+themes[(i+1)%themes.length],'success');
}

/* ============================================================
   PANEL TOGGLES
   ============================================================ */
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='Escape'){stopTransport();}
  else if(e.key==='l'||e.key==='L'){toggleLoop();}
  else if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveSong();}
  else if(e.ctrlKey&&e.key==='o'){e.preventDefault();loadSong();}
  else if(e.key==='ArrowRight'){
    e.preventDefault();
    SONG.currentPattern=(SONG.currentPattern+1)%SONG.patternCount;
    setPattern(SONG.currentPattern);
  }
  else if(e.key==='ArrowLeft'){
    e.preventDefault();
    SONG.currentPattern=(SONG.currentPattern-1+SONG.patternCount)%SONG.patternCount;
    setPattern(SONG.currentPattern);
  }
  else if(e.key==='ArrowUp'){
    e.preventDefault();
    SONG.bpm=Math.min(300,SONG.bpm+1);
    $('tempoInput').value=SONG.bpm;
    toast('Tempo: '+SONG.bpm+' BPM','info',800);
  }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    SONG.bpm=Math.max(40,SONG.bpm-1);
    $('tempoInput').value=SONG.bpm;
    toast('Tempo: '+SONG.bpm+' BPM','info',800);
  }
  else if(e.key==='?'||(e.shiftKey&&e.key==='/')){showHelp();}
});

/* ============================================================
   HELP MODAL
   ============================================================ */
function showHelp(){
  switchTab('help');
}

/* ============================================================
   TEMPO INPUT
   ============================================================ */
document.addEventListener('DOMContentLoaded',function(){
  var ti=$('tempoInput');
  if(ti){
    ti.addEventListener('input',function(){
      var v=parseInt(this.value);
      if(!isNaN(v)&&v>=40&&v<=300){SONG.bpm=v}
    });
    ti.addEventListener('change',function(){
      var v=clamp(parseInt(this.value)||120,40,300);
      SONG.bpm=v;this.value=v;
    });
  }
});

/* ============================================================
   METER RAF LOOP
   ============================================================ */
var lastMeterTime=performance.now();
function meterLoop(now){
  var dt=Math.min((now-lastMeterTime)/1000,0.1);
  lastMeterTime=now;
  tickMeters(dt);
  requestAnimationFrame(meterLoop);
}

/* ============================================================
   BOOT
   ============================================================ */
var BOOT=[
  'Initializing Web Audio engine...',
  'Loading 8 synthesizer voices...',
  'Preparing 10 drum generators...',
  'Loading synth presets...',
  'Warming up master compressor...',
  'Building reverb impulse response...',
  'Preparing delay line...',
  'Rendering default demo beat...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(5,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){$('boot').classList.add('hidden');toast('RESONANCE ready · press Space to play','success',3500)},400);
    }
  },140);
}

window.addEventListener('DOMContentLoaded',function(){
  initSong();
  buildTabs();
  switchTab('sequencer');
  // Setup audio on first interaction
  var initOnce=function(){
    if(!AUDIO.initialized){
      AUDIO.init();
      if(AUDIO.ctx){
        buildTrackNodes();
        // Apply saved master values
        AUDIO.master.gain.value=SONG.masterVolume;
        if(AUDIO.reverbGain)AUDIO.reverbGain.gain.value=SONG.reverb;
        if(AUDIO.delayGain)AUDIO.delayGain.gain.value=SONG.delay;
        if(AUDIO.delayFeedback)AUDIO.delayFeedback.gain.value=SONG.delayFeedback;
      }
    }else if(AUDIO.ctx&&AUDIO.ctx.state==='suspended'){
      AUDIO.ctx.resume();
    }
    document.removeEventListener('mousedown',initOnce);
    document.removeEventListener('touchstart',initOnce);
    document.removeEventListener('keydown',initOnce);
  };
  document.addEventListener('mousedown',initOnce);
  document.addEventListener('touchstart',initOnce);
  document.addEventListener('keydown',initOnce);
  // Song auto-save
  setInterval(function(){
    try{localStorage.setItem('resonance-song-autosave',JSON.stringify(SONG))}catch(e){}
  },15000);
  // Try to restore autosave
  try{
    var auto=localStorage.getItem('resonance-song-autosave');
    if(auto){
      var data=JSON.parse(auto);
      Object.assign(SONG,data);
      logMsg('Restored autosave','info');
    }
  }catch(e){}
  // Keyboard meter loop
  requestAnimationFrame(meterLoop);
  bootSequence();
});

console.log('%cRESONANCE','background:linear-gradient(90deg,#ff3ea5,#a060ff,#3ee0ff);color:#fff;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('%cMusic Production Studio · Web Audio API','color:#ff3ea5;font-weight:600');
console.log('%c8 tracks · 10 drum synths · 3 oscillator synths · 8 presets · WAV export','color:#3ee0ff');
console.log('%cPress SPACE to play. Click anywhere first to enable audio.','color:#b0a0d0');
</script>
