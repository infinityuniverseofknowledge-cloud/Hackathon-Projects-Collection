   ================================================================ */
registerModule('spectroscopy',{
  title:'Spectroscopy',
  icon:'🌈',
  desc:'IR absorption peaks for organic molecules, UV-Vis absorbance, and blackbody emission spectra.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var s=STATE.spectroscopy;
    if(s.mode==='ir'){
      s.peaks=[];
      /* Molecule-specific IR peaks */
      var mol=s.molecule;
      if(mol==='ethanol'){
        s.peaks=[
          {label:"O-H (alcohol)",range:[3200,3600],intensity:0.9},
          {label:"C-H (alkane)",range:[2900,2960],intensity:0.7},
          {label:"C-O (alcohol)",range:[1050,1120],intensity:0.8}
        ];
      } else if(mol==='acetone'){
        s.peaks=[
          {label:"C=O (ketone)",range:[1710,1725],intensity:1.0},
          {label:"C-H",range:[2900,2960],intensity:0.6}
        ];
      } else if(mol==='acetic'){
        s.peaks=[
          {label:"O-H (acid, broad)",range:[2500,3300],intensity:0.9},
          {label:"C=O (acid)",range:[1705,1720],intensity:1.0},
          {label:"C-O",range:[1210,1320],intensity:0.8}
        ];
      } else if(mol==='benzene'){
        s.peaks=[
          {label:"aromatic C-H",range:[3000,3100],intensity:0.5},
          {label:"C=C aromatic",range:[1450,1600],intensity:0.7},
          {label:"C-H bend",range:[700,900],intensity:0.9}
        ];
      } else if(mol==='amine'){
        s.peaks=[
          {label:"N-H stretch",range:[3300,3500],intensity:0.7},
          {label:"C-H",range:[2850,2960],intensity:0.6},
          {label:"C-N",range:[1020,1250],intensity:0.7}
        ];
      } else if(mol==='nitrile'){
        s.peaks=[
          {label:"C≡N",range:[2210,2260],intensity:0.6},
          {label:"C-H",range:[2850,2960],intensity:0.5}
        ];
      }
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var s=STATE.spectroscopy;
    var pad=60;
    var gx=pad,gy=pad;
    var gW=W-pad*2,gH=H-pad*2-60;
    if(s.mode==='ir'){
      /* IR spectrum: wavenumber 4000 → 400 cm⁻¹ (reversed) */
      var wmin=400,wmax=4000;
      /* Grid */
      ctx.strokeStyle='rgba(64,208,255,.08)';
      ctx.lineWidth=1;
      for(var i=0;i<=10;i++){
        var gy2=gy+i*gH/10;
        ctx.beginPath();ctx.moveTo(gx,gy2);ctx.lineTo(gx+gW,gy2);ctx.stroke();
      }
      for(var j=0;j<=12;j++){
        var gx2=gx+j*gW/12;
        ctx.beginPath();ctx.moveTo(gx2,gy);ctx.lineTo(gx2,gy+gH);ctx.stroke();
      }
      /* Axis labels */
      ctx.fillStyle='#98a8d8';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      for(var k=0;k<=6;k++){
        var wv=wmax-k*(wmax-wmin)/6;
        ctx.fillText(wv.toFixed(0),gx+(k/6)*gW,gy+gH+16);
      }
      ctx.fillStyle='#40d0ff';
      ctx.font='bold 11px monospace';
      ctx.fillText('Wavenumber (cm⁻¹)',gx+gW/2,gy+gH+36);
      /* Transmittance baseline */
      ctx.strokeStyle='rgba(64,255,144,.3)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(gx,gy+gH*0.1);ctx.lineTo(gx+gW,gy+gH*0.1);ctx.stroke();
      /* Absorption peaks */
      var wnToX=function(wn){return gx+(wmax-wn)/(wmax-wmin)*gW};
      s.peaks.forEach(function(peak){
        var x1=wnToX(peak.range[1]);
        var x2=wnToX(peak.range[0]);
        var depth=peak.intensity*0.85*gH;
        /* Draw peak as Gaussian curve */
        ctx.strokeStyle=peak.label.indexOf('O-H (acid')>=0?'#a060ff':
                          peak.label.indexOf('O-H')>=0?'#40d0ff':
                          peak.label.indexOf('N-H')>=0?'#40ff90':
                          peak.label.indexOf('C=O')>=0?'#ff5080':
                          peak.label.indexOf('C≡N')>=0?'#c060ff':
                          peak.label.indexOf('C=C')>=0?'#a060ff':
                          '#ffe040';
        ctx.lineWidth=2;
        ctx.fillStyle=peak.label.indexOf('O-H (acid')>=0?'rgba(160,96,255,.2)':'rgba(64,208,255,.15)';
        ctx.beginPath();
        var centerWn=(peak.range[0]+peak.range[1])/2;
        var width=(peak.range[1]-peak.range[0])/2;
        var started=false;
        for(var wn=peak.range[0]-200;wn<=peak.range[1]+200;wn+=5){
          var dn=wn-centerWn;
          var amp=Math.exp(-(dn*dn)/(width*width*0.5));
          if(amp<0.01)continue;
          var px=wnToX(wn);
          var py=gy+gH*0.1+amp*depth;
          if(!started){ctx.moveTo(px,py);started=true;}
          else ctx.lineTo(px,py);
        }
        if(started){
          ctx.lineTo(wnToX(peak.range[1]+200),gy+gH*0.1);
          ctx.lineTo(wnToX(peak.range[0]-200),gy+gH*0.1);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        /* Label */
        ctx.fillStyle=ctx.strokeStyle;
        ctx.font='9px monospace';
        ctx.textAlign='center';
        ctx.fillText(peak.label,wnToX(centerWn),gy+gH*0.1+depth*0.5);
      });
      /* Y axis: transmittance */
      ctx.save();
      ctx.translate(16,gy+gH/2);
      ctx.rotate(-Math.PI/2);
      ctx.fillStyle='#98a8d8';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText('Transmittance (%)',0,0);
      ctx.restore();
    } else if(s.mode==='visible'){
      /* Visible spectrum with absorbance */
      var rainbow=ctx.createLinearGradient(gx,0,gx+gW,0);
      rainbow.addColorStop(0,'rgba(128,0,255,.6)');
      rainbow.addColorStop(0.15,'rgba(64,64,255,.6)');
      rainbow.addColorStop(0.3,'rgba(0,192,255,.6)');
      rainbow.addColorStop(0.45,'rgba(0,255,128,.6)');
      rainbow.addColorStop(0.6,'rgba(255,255,0,.6)');
      rainbow.addColorStop(0.8,'rgba(255,128,0,.6)');
      rainbow.addColorStop(1,'rgba(255,0,0,.6)');
      ctx.fillStyle=rainbow;
      ctx.fillRect(gx,gy,gW,gH);
      /* Grid */
      ctx.strokeStyle='rgba(255,255,255,.1)';
      for(var ii=0;ii<=6;ii++){
        var ix=gx+ii*gW/6;
        ctx.beginPath();ctx.moveTo(ix,gy);ctx.lineTo(ix,gy+gH);ctx.stroke();
      }
      /* Wavelength labels */
      ctx.fillStyle='#e0e8ff';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      for(var wi=0;wi<=6;wi++){
        var wv2=380+wi*(750-380)/6;
        ctx.fillText(wv2.toFixed(0)+'nm',gx+(wi/6)*gW,gy+gH+16);
      }
      ctx.fillStyle='#40d0ff';
      ctx.font='bold 11px monospace';
      ctx.fillText('Wavelength (nm) — visible spectrum',gx+gW/2,gy+gH+36);
      /* Sample indicator */
      var sampleX=gx+(s.wavelength-380)/(750-380)*gW;
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(sampleX,gy);ctx.lineTo(sampleX,gy+gH);ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.font='bold 10px monospace';
      ctx.fillText(fmt(s.wavelength,0)+'nm',sampleX,gy-6);
    } else if(s.mode==='emission'){
      /* Blackbody emission */
      var t=s.temperature;
      /* Planck's law plot over 200-2000nm */
      ctx.strokeStyle='#40ff90';
      ctx.lineWidth=2;
      ctx.beginPath();
      var lambdas=[];
      for(var lam=200;lam<=2000;lam+=10){
        lambdas.push({lam:lam,val:planck2(lam,t)});
      }
      var maxVal=Math.max.apply(null,lambdas.map(function(l){return l.val}));
      lambdas.forEach(function(L,i){
        var px=gx+(L.lam-200)/1800*gW;
        var py=gy+gH-(L.val/maxVal)*gH*0.9;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      });
      ctx.stroke();
      /* Wien peak */
      var wien=2.898e6/t; /* nm */
      if(wien>=200&&wien<=2000){
        var wx=gx+(wien-200)/1800*gW;
        ctx.strokeStyle='#ffe040';
        ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(wx,gy);ctx.lineTo(wx,gy+gH);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#ffe040';
        ctx.font='bold 10px monospace';
        ctx.textAlign='center';
        ctx.fillText('Wien: '+fmt(wien,0)+'nm',wx,gy-6);
      }
    }
    /* Info box */
    ctx.fillStyle='rgba(10,16,32,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText(s.mode.toUpperCase()+' SPECTROSCOPY',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    if(s.mode==='ir'){
      ctx.fillText('Molecule: '+s.molecule,W-248,64);
      ctx.fillText('Peaks: '+s.peaks.length,W-248,84);
    } else if(s.mode==='visible'){
      ctx.fillText('λ = '+fmt(s.wavelength,0)+' nm',W-248,64);
      ctx.fillText('Energy: '+fmt(1240/s.wavelength,2)+' eV',W-248,84);
      ctx.fillText('Frequency: '+fmt(3e8/(s.wavelength*1e-9)/1e14,2)+'×10¹⁴ Hz',W-248,104);
    } else {
      ctx.fillText('T = '+s.temperature+' K',W-248,64);
      ctx.fillText('Wien λ: '+fmt(2.898e6/s.temperature,0)+' nm',W-248,84);
    }
    setStatsHTML(
      '<div>Mode: '+s.mode.toUpperCase()+'</div>'+
      (s.mode==='ir'?'<div>Peaks: '+s.peaks.length+'</div>':'')+
      (s.mode==='visible'?'<div>λ: '+fmt(s.wavelength,0)+' nm</div>':'')+
      (s.mode==='emission'?'<div>T: '+s.temperature+' K</div>':'')
    );
    updateBadge('🌈 Spectroscopy · '+s.mode.toUpperCase());
    $('sbMode').textContent='Spectroscopy';
    $('sbVal').textContent=s.mode.toUpperCase();
  },
  onDown:function(p){
    var s=STATE.spectroscopy;
    if(s.mode==='visible'){
      var pad=60;
      var gx=pad;
      var gW=CANV.W-pad*2;
      if(p.x<gx||p.x>gx+gW)return;
      s.wavelength=380+(p.x-gx)/gW*(750-380);
      renderLeftPanel();
    }
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  controls:function(){
    var s=STATE.spectroscopy;
    var html='';
    html+='<div class="sec"><h4>Spectroscopy mode</h4>';
    html+='<div class="chip-row">';
    [['ir','IR'],['visible','UV-Vis'],['emission','Emission']].forEach(function(m){
      html+='<div class="chip '+(s.mode===m[0]?'active':'')+'" onclick="STATE.spectroscopy.mode=\''+m[0]+'\';MODULES.spectroscopy.compute();renderLeftPanel()">'+m[1]+'</div>';
    });
    html+='</div></div>';
    if(s.mode==='ir'){
      html+='<div class="sec"><h4>Molecule</h4>';
      html+='<div class="chip-row">';
      [['ethanol','Ethanol'],['acetone','Acetone'],['acetic','Acetic acid'],['benzene','Benzene'],['amine','Amine'],['nitrile','Nitrile']].forEach(function(m){
        html+='<div class="chip '+(s.molecule===m[0]?'active':'')+'" onclick="STATE.spectroscopy.molecule=\''+m[0]+'\';MODULES.spectroscopy.compute();renderLeftPanel()">'+m[1]+'</div>';
      });
      html+='</div></div>';
      html+='<div class="sec"><h4>Peaks</h4>';
      s.peaks.forEach(function(p){
        html+='<div style="padding:5px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.6rem">';
        html+='<div style="color:var(--c1);font-weight:600">'+p.label+'</div>';
        html+='<div style="color:var(--tx3)">'+p.range[0]+' – '+p.range[1]+' cm⁻¹</div>';
        html+='</div>';
      });
      html+='</div>';
    } else if(s.mode==='visible'){
      html+='<div class="sec"><h4>Wavelength</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>λ</span><span>'+fmt(s.wavelength,0)+' nm</span></div>';
      html+='<input type="range" min="380" max="750" step="1" value="'+s.wavelength+'" oninput="STATE.spectroscopy.wavelength=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='</div>';
      html+='<div class="sec"><h4>Quick colors</h4>';
      html+='<div class="chip-row">';
      [['Violet',400],['Blue',470],['Green',530],['Yellow',580],['Orange',610],['Red',680]].forEach(function(c){
        html+='<div class="chip" onclick="STATE.spectroscopy.wavelength='+c[1]+';renderLeftPanel()">'+c[0]+'</div>';
      });
      html+='</div></div>';
    } else {
      html+='<div class="sec"><h4>Blackbody temperature</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>T</span><span>'+s.temperature+' K</span></div>';
      html+='<input type="range" min="1000" max="30000" step="100" value="'+s.temperature+'" oninput="STATE.spectroscopy.temperature=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='</div>';
      html+='<div class="sec"><h4>Reference sources</h4>';
      html+='<div class="chip-row">';
      [['Candle',1800],['Incandescent',2800],['Sun',5778],['A star',9000],['B star',20000]].forEach(function(s2){
        html+='<div class="chip" onclick="STATE.spectroscopy.temperature='+s2[1]+';renderLeftPanel()">'+s2[0]+'</div>';
      });
      html+='</div></div>';
    }
    return html;
  },
  mathPanel:function(){
    var s=STATE.spectroscopy;
    return '<div class="sec"><h4>Spectroscopy techniques</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">IR:</b> measures vibrational modes. Functional groups have signature wavenumbers.<br><br>'+
      '<b class="text-c1">UV-Vis:</b> electronic transitions. Beer-Lambert law: A = εcb<br><br>'+
      '<b class="text-c1">Emission:</b> blackbody radiation. Wien\'s law: λ_max = b/T'+
      '</div></div>'+
      '<div class="sec"><h4>Photon energy</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'E = h·ν = hc/λ<br><br>'+
      'IR photons: 0.01–1 eV (vibrations)<br>'+
      'Visible: 1.7–3.3 eV<br>'+
      'UV: 3.3–100 eV (electronic)<br>'+
      'X-ray: >100 eV'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Mode</span><span class="v">'+s.mode.toUpperCase()+'</span></div>'+
      (s.mode==='visible'?'<div class="row"><span class="k">λ</span><span class="v">'+fmt(s.wavelength,0)+' nm</span></div><div class="row"><span class="k">Energy</span><span class="v">'+fmt(1240/s.wavelength,2)+' eV</span></div>':'')+
      (s.mode==='emission'?'<div class="row"><span class="k">T</span><span class="v">'+s.temperature+' K</span></div><div class="row"><span class="k">λ_max</span><span class="v">'+fmt(2.898e6/s.temperature,0)+' nm</span></div>':'')+
      '</div></div>';
  }
});
function planck2(lambdaNm,T){
  var h=6.626e-34,c=3e8,k=1.381e-23;
  var lambda=lambdaNm*1e-9;
  return (2*h*c*c)/(Math.pow(lambda,5)*(Math.exp(h*c/(lambda*k*T))-1));
}

<script>
/* ================================================================
   MODULE: NUCLEAR CHEMISTRY
   ================================================================ */
registerModule('nuclear',{
  title:'Nuclear Chemistry',
  icon:'☢',
  desc:'Radioactive decay simulation with half-life curves. U-238, C-14, I-131 and more.',
  init:function(){
    var n=STATE.nuclear;
    n.time=0;
    n.decayed=0;
    n.history=[];
    n.particles=[];
    /* Create initial atoms as dots */
    for(var i=0;i<200;i++){
      n.particles.push({
        x:rndF(40,CANV.W-40),
        y:rndF(100,CANV.H-100),
        vx:rndF(-20,20),
        vy:rndF(-20,20),
        decayed:false
      });
    }
    logMsg('Nuclear: '+n.isotope+' loaded (t½ = '+fmt(n.halfLifeLabel,2)+')','info');
  },
  tick:function(dt){
    var n=STATE.nuclear;
    if(!STATE.playing)return;
    n.time+=dt*n.speed;
    /* For visualization, scale time to reasonable number of "generations" */
    var tau=n.halfLifeSim;
    var fraction=Math.exp(-Math.log(2)*n.time/tau);
    var expectedDecayed=(1-fraction)*n.particles.length;
    /* Update particles */
    var currentDecayed=n.particles.filter(function(p){return p.decayed}).length;
    if(currentDecayed<expectedDecayed){
      /* Decay more particles */
      var toDecay=Math.min(Math.ceil(expectedDecayed-currentDecayed),n.particles.length);
      for(var d=0;d<toDecay;d++){
        var idx=rnd(0,n.particles.length-1);
        if(!n.particles[idx].decayed)n.particles[idx].decayed=true;
      }
    }
    /* Move particles */
    n.particles.forEach(function(p){
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      if(p.x<20||p.x>CANV.W-20)p.vx=-p.vx;
      if(p.y<80||p.y>CANV.H-40)p.vy=-p.vy;
    });
    n.history.push({t:n.time,fraction:fraction});
    if(n.history.length>2000)n.history.shift();
    STATE.time+=dt;
  },
  loadIsotope:function(name){
    var n=STATE.nuclear;
    n.isotope=name;
    var t12,label;
    if(name==='U-238'){t12=4.468e9;label=4.468e9;}
    else if(name==='C-14'){t12=5730;label=5730;}
    else if(name==='K-40'){t12=1.25e9;label=1.25e9;}
    else if(name==='I-131'){t12=8.02;label=8.02;}
    else if(name==='Tc-99m'){t12=6.006;label=6.006;}
    else if(name==='Rn-222'){t12=3.8235;label=3.8235;}
    else if(name==='Cs-137'){t12=30.17;label=30.17;}
    else if(name==='Sr-90'){t12=28.79;label=28.79;}
    else {t12=1;label=1;}
    n.halfLifeReal=t12;
    n.halfLifeLabel=label;
    /* For visual, compress to 10 seconds */
    n.halfLifeSim=10;
    this.init();
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var n=STATE.nuclear;
    /* Draw particles */
    n.particles.forEach(function(p){
      if(p.decayed){
        ctx.fillStyle='rgba(255,80,128,.3)';
        ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
      } else {
        ctx.fillStyle='#40ff90';
        ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(64,255,144,.4)';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.stroke();
      }
    });
    /* Header */
    ctx.fillStyle='#ffa040';
    ctx.font='bold 16px monospace';
    ctx.textAlign='left';
    ctx.fillText('☢ NUCLEAR DECAY · '+n.isotope,20,30);
    ctx.fillStyle='#98a8d8';
    ctx.font='11px monospace';
    ctx.fillText('Half-life: '+n.halfLifeLabel+' years  ·  t = '+fmt(n.time,2)+' yr (sim)',20,50);
    /* Decay curve */
    var pad=60;
    var gx=pad,gy=80;
    var gW=W-pad*2,gH=140;
    ctx.fillStyle='rgba(10,16,32,.6)';
    ctx.strokeStyle='rgba(255,160,64,.4)';
    ctx.beginPath();ctx.roundRect(gx,gy,gW,gH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(64,208,255,.1)';
    for(var gi=0;gi<=4;gi++){
      var gy2=gy+gi*gH/4;
      ctx.beginPath();ctx.moveTo(gx,gy2);ctx.lineTo(gx+gW,gy2);ctx.stroke();
    }
    /* Decay curve */
    if(n.history.length>1){
      ctx.strokeStyle='#40ff90';
      ctx.lineWidth=2;
      ctx.beginPath();
      n.history.forEach(function(h,i){
        var px=gx+(h.t/(n.halfLifeSim*5))*gW;
        var py=gy+gH-(h.fraction)*gH;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      });
      ctx.stroke();
      /* Half-life marks */
      ctx.strokeStyle='rgba(255,224,64,.5)';
      ctx.setLineDash([4,3]);
      for(var k=1;k<=3;k++){
        var hx=gx+(k*n.halfLifeSim/(n.halfLifeSim*5))*gW;
        ctx.beginPath();ctx.moveTo(hx,gy);ctx.lineTo(hx,gy+gH);ctx.stroke();
        ctx.fillStyle='#ffe040';
        ctx.font='9px monospace';
        ctx.textAlign='center';
        ctx.fillText('t½×'+k,hx,gy-4);
      }
      ctx.setLineDash([]);
    }
    /* Current fraction */
    var fraction=Math.exp(-Math.log(2)*n.time/n.halfLifeSim);
    ctx.fillStyle='#40ff90';
    ctx.font='bold 14px monospace';
    ctx.textAlign='right';
    ctx.fillText((fraction*100).toFixed(1)+'% remaining',gx+gW-8,gy+20);
    setStatsHTML(
      '<div>'+n.isotope+'</div>'+
      '<div>t = '+fmt(n.time,2)+' yr</div>'+
      '<div>Remaining: '+(fraction*100).toFixed(1)+'%</div>'+
      '<div>t½ = '+n.halfLifeLabel+' yr</div>'
    );
    updateBadge('☢ '+n.isotope+' · '+(fraction*100).toFixed(1)+'% remaining');
    $('sbMode').textContent='Nuclear';
    $('sbVal').textContent=n.isotope;
  },
  onDown:function(){},
  controls:function(){
    var n=STATE.nuclear;
    var html='';
    html+='<div class="sec"><h4>Isotope</h4>';
    html+='<div class="chip-row">';
    [
      ['C-14','C-14',5730],
      ['U-238','U-238',4.468e9],
      ['K-40','K-40',1.25e9],
      ['I-131','I-131',8.02],
      ['Tc-99m','Tc-99m',6.006],
      ['Rn-222','Rn-222',3.8235],
      ['Cs-137','Cs-137',30.17],
      ['Sr-90','Sr-90',28.79]
    ].forEach(function(is){
      html+='<div class="chip '+(n.isotope===is[1]?'active':'')+'" onclick="MODULES.nuclear.loadIsotope(\''+is[1]+'\')">'+is[0]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.nuclear.init();renderLeftPanel()">↺ Reset</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.nuclear.time=0;MODULES.nuclear.init();renderLeftPanel()">Restart from t=0</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Simulation speed</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Speed</span><span>'+n.speed+' yr/s</span></div>';
    html+='<input type="range" min="0.5" max="20" step="0.5" value="'+n.speed+'" oninput="STATE.nuclear.speed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Current state</h4>';
    var fraction=Math.exp(-Math.log(2)*n.time/n.halfLifeSim);
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Isotope</span><span class="v">'+n.isotope+'</span></div>';
    html+='<div class="row"><span class="k">Real t½</span><span class="v">'+n.halfLifeLabel+' yr</span></div>';
    html+='<div class="row"><span class="k">Sim t</span><span class="v">'+fmt(n.time,2)+' yr</span></div>';
    html+='<div class="row"><span class="k">Remaining</span><span class="v">'+(fraction*100).toFixed(2)+'%</span></div>';
    html+='<div class="row"><span class="k">Decayed</span><span class="v">'+((1-fraction)*100).toFixed(2)+'%</span></div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Half-life facts</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
      '<b class="text-c1">C-14:</b> radiocarbon dating (~50,000 yr range)<br>'+
      '<b class="text-c1">U-238:</b> age of Earth (~4.5 Gyr)<br>'+
      '<b class="text-c1">I-131:</b> thyroid imaging (8 days)<br>'+
      '<b class="text-c1">Tc-99m:</b> medical imaging (6 hours)'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){
    var n=STATE.nuclear;
    var fraction=Math.exp(-Math.log(2)*n.time/n.halfLifeSim);
    var lambda=Math.log(2)/n.halfLifeLabel;
    return '<div class="sec"><h4>Radioactive decay</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'N(t) = N₀ · e^(−λt)<br><br>'+
      'Decay constant λ = ln(2)/t½<br><br>'+
      'Half-life t½: time for half the nuclei to decay. Independent of N₀.'+
      '</div></div>'+
      '<div class="sec"><h4>Decay types</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">α (alpha):</b> emit ⁴He nucleus, Z−2, A−4<br>'+
      '<b class="text-c1">β⁻ (beta-):</b> neutron→proton, Z+1<br>'+
      '<b class="text-c1">β⁺ (beta+):</b> positron, Z−1<br>'+
      '<b class="text-c1">γ (gamma):</b> photon emission'+
      '</div></div>'+
      '<div class="sec"><h4>Current isotope</h4><div class="kv">'+
      '<div class="row"><span class="k">Isotope</span><span class="v">'+n.isotope+'</span></div>'+
      '<div class="row"><span class="k">t½</span><span class="v">'+n.halfLifeLabel+' yr</span></div>'+
      '<div class="row"><span class="k">λ</span><span class="v">'+lambda.toExponential(3)+' /yr</span></div>'+
      '<div class="row"><span class="k">Remaining</span><span class="v">'+(fraction*100).toFixed(3)+'%</span></div>'+
      '<div class="row"><span class="k">τ (mean life)</span><span class="v">'+(n.halfLifeLabel/Math.log(2)).toExponential(3)+' yr</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE: ORGANIC MOLECULE BUILDER
   ================================================================ */
registerModule('organic',{
  title:'Organic Builder',
  icon:'⬡',
  desc:'Build simple organic molecules by placing atoms and bonds. See molecular formulas and identify functional groups.',
  init:function(){
    var o=STATE.organic;
    o.atoms=[];
    o.bonds=[];
    o.nextId=0;
    /* Start with a simple methane example */
    this.addAtom(CANV.W/2,CANV.H/2,'C');
    for(var i=0;i<4;i++){
      var a=i/4*Math.PI*2-Math.PI/2;
      var x=CANV.W/2+Math.cos(a)*80;
      var y=CANV.H/2+Math.sin(a)*80;
      this.addAtom(x,y,'H');
    }
    logMsg('Organic builder ready','info');
  },
  addAtom:function(x,y,type){
    var o=STATE.organic;
    o.atoms.push({id:o.nextId++,x:x,y:y,type:type||o.atomType});
  },
  addBond:function(a,b,type){
    var o=STATE.organic;
    /* Check no duplicate */
    for(var i=0;i<o.bonds.length;i++){
      if((o.bonds[i].a===a&&o.bonds[i].b===b)||(o.bonds[i].a===b&&o.bonds[i].b===a))return;
    }
    o.bonds.push({a:a,b:b,type:type||o.bondType||'single'});
  },
  computeFormula:function(){
    var o=STATE.organic;
    var counts={};
    o.atoms.forEach(function(a){counts[a.type]=(counts[a.type]||0)+1});
    /* Hill notation: C, H, then others alphabetical */
    var formula='';
    if(counts.C){formula+='C'+(counts.C>1?counts.C:'');delete counts.C;}
    if(counts.H){formula+='H'+(counts.H>1?counts.H:'');delete counts.H;}
    Object.keys(counts).sort().forEach(function(el){
      formula+=el+(counts[el]>1?counts[el]:'');
    });
    return formula;
  },
  computeMW:function(){
    var o=STATE.organic;
    var mw=0;
    o.atoms.forEach(function(a){
      var el=findElementBySymbol(a.type);
      if(el)mw+=el[3];
    });
    return mw;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var o=STATE.organic;
    /* Grid */
    ctx.strokeStyle='rgba(64,208,255,.05)';
    ctx.lineWidth=1;
    for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    /* Bonds */
    o.bonds.forEach(function(b){
      var A=o.atoms.find(function(a){return a.id===b.a});
      var B=o.atoms.find(function(a){return a.id===b.b});
      if(!A||!B)return;
      /* Draw multiple lines for double/triple bonds */
      var dx=B.x-A.x,dy=B.y-A.y;
      var len=Math.hypot(dx,dy);
      var nx=-dy/len,ny=dx/len;
      var count=b.type==='single'?1:(b.type==='double'?2:3);
      var offset=count===1?0:(count===2?3:4);
      for(var i=0;i<count;i++){
        var off=(i-(count-1)/2)*offset*2;
        ctx.strokeStyle=b.type==='single'?'rgba(200,208,224,.6)':
                        b.type==='double'?'#40d0ff':'#40ff90';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(A.x+nx*off,A.y+ny*off);
        ctx.lineTo(B.x+nx*off,B.y+ny*off);
        ctx.stroke();
      }
    });
    /* Atoms */
    var elementColors={
      H:'#e0e8ff',C:'#404858',N:'#40d0ff',O:'#ff5060',
      F:'#40ff90',Cl:'#80ff60',Br:'#c06040',I:'#a060ff',
      S:'#ffe040',P:'#ff8040',B:'#ffa060'
    };
    o.atoms.forEach(function(a){
      var r=a.type==='H'?14:20;
      /* Glow */
      var color=elementColors[a.type]||'#98a8d8';
      var grad=ctx.createRadialGradient(a.x-r*0.3,a.y-r*0.3,0,a.x,a.y,r);
      grad.addColorStop(0,'#fff');
      grad.addColorStop(0.5,color);
      grad.addColorStop(1,color+'80');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=a.id===o.selectedAtom?'#ffe040':'rgba(0,0,0,.5)';
      ctx.lineWidth=a.id===o.selectedAtom?3:1;
      ctx.stroke();
      /* Label */
      ctx.fillStyle=a.type==='C'?'#fff':'#050810';
      ctx.font='bold '+Math.floor(r*0.9)+'px sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(a.type,a.x,a.y+1);
      ctx.textBaseline='alphabetic';
    });
    /* Info */
    ctx.fillStyle='#a060ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('⬡ ORGANIC MOLECULE BUILDER',20,30);
    ctx.fillStyle='#98a8d8';
    ctx.font='11px monospace';
    ctx.fillText('Formula: '+this.computeFormula()+'  ·  MW: '+fmt(this.computeMW(),2)+' g/mol',20,50);
    /* Legend */
    ctx.fillStyle='rgba(10,16,32,.85)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,140,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('ATOMS: '+o.atoms.length,W-248,42);
    ctx.fillText('BONDS: '+o.bonds.length,W-248,60);
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.fillText('Formula: '+this.computeFormula(),W-248,84);
    ctx.fillText('MW: '+fmt(this.computeMW(),2),W-248,102);
    ctx.fillText('Current tool: '+o.atomType,W-248,120);
    ctx.fillText('Bond type: '+o.bondType,W-248,138);
    setStatsHTML(
      '<div>Atoms: '+o.atoms.length+'</div>'+
      '<div>Bonds: '+o.bonds.length+'</div>'+
      '<div>Formula: '+this.computeFormula()+'</div>'+
      '<div>MW: '+fmt(this.computeMW(),1)+'</div>'
    );
    updateBadge('⬡ Organic · '+this.computeFormula());
    $('sbMode').textContent='Organic Builder';
    $('sbCount').textContent=o.atoms.length;
    $('sbVal').textContent=this.computeFormula();
  },
  onDown:function(p){
    var o=STATE.organic;
    /* Find nearest atom */
    var best=null,bestD=25;
    o.atoms.forEach(function(a){
      var d=Math.hypot(a.x-p.x,a.y-p.y);
      if(d<bestD){bestD=d;best=a;}
    });
    if(best){
      /* Clicked on atom */
      if(o.selectedAtom===null){
        o.selectedAtom=best.id;
      } else if(o.selectedAtom===best.id){
        o.selectedAtom=null;
      } else {
        /* Create bond */
        this.addBond(o.selectedAtom,best.id,o.bondType);
        o.selectedAtom=null;
      }
    } else {
      /* Empty space: add new atom */
      this.addAtom(p.x,p.y,o.atomType);
    }
  },
  onMove:function(p){
    var o=STATE.organic;
    if(INPUT.down&&o.dragging!=null){
      var a=o.atoms.find(function(a2){return a2.id===o.dragging});
      if(a){a.x=p.x;a.y=p.y;}
    }
  },
  onUp:function(){STATE.organic.dragging=null;},
  controls:function(){
    var o=STATE.organic;
    var html='';
    html+='<div class="sec"><h4>Atom type</h4>';
    html+='<div class="chip-row">';
    ['C','H','O','N','S','P','F','Cl','Br','I'].forEach(function(a){
      html+='<div class="chip '+(o.atomType===a?'active':'')+'" onclick="STATE.organic.atomType=\''+a+'\';renderLeftPanel()">'+a+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Bond type</h4>';
    html+='<div class="chip-row">';
    [['single','Single'],['double','Double'],['triple','Triple']].forEach(function(b){
      html+='<div class="chip '+(o.bondType===b[0]?'active':'')+'" onclick="STATE.organic.bondType=\''+b[0]+'\';renderLeftPanel()">'+b[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.organic.init();renderLeftPanel()">↺ Reset (methane)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.organic.atoms=[];STATE.organic.bonds=[];STATE.organic.selectedAtom=null;renderLeftPanel()">🗑 Clear all</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="loadOrganicPreset(\'ethanol\')">Ethanol</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="loadOrganicPreset(\'benzene\')">Benzene</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="loadOrganicPreset(\'acetone\')">Acetone</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="loadOrganicPreset(\'acetic\')">Acetic acid</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Current molecule</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Formula</span><span class="v">'+this.computeFormula()+'</span></div>';
    html+='<div class="row"><span class="k">MW</span><span class="v">'+fmt(this.computeMW(),2)+' g/mol</span></div>';
    html+='<div class="row"><span class="k">Atoms</span><span class="v">'+o.atoms.length+'</span></div>';
    html+='<div class="row"><span class="k">Bonds</span><span class="v">'+o.bonds.length+'</span></div>';

    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click empty space to add an atom. Click two atoms to bond them.</div>';
    return html;
  },
  mathPanel:function(){
    var o=STATE.organic;
    return '<div class="sec"><h4>Functional groups</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      Object.keys(FUNCTIONAL_GROUPS).map(function(k){
        var g=FUNCTIONAL_GROUPS[k];
        return '<b style="color:'+g.color+'">'+g.name+':</b> '+g.formula+' — '+g.desc;
      }).join('<br>')+
      '</div></div>'+
      '<div class="sec"><h4>Valence rules</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b>C:</b> 4 bonds<br>'+
      '<b>N:</b> 3 bonds<br>'+
      '<b>O:</b> 2 bonds<br>'+
      '<b>H:</b> 1 bond<br>'+
      '<b>Halogens:</b> 1 bond<br>'+
      '<b>S:</b> 2, 4, or 6 bonds'+
      '</div></div>'+
      '<div class="sec"><h4>Current molecule</h4><div class="kv">'+
      '<div class="row"><span class="k">Formula</span><span class="v">'+this.computeFormula()+'</span></div>'+
      '<div class="row"><span class="k">MW</span><span class="v">'+fmt(this.computeMW(),2)+'</span></div>'+
      '<div class="row"><span class="k">Atoms</span><span class="v">'+o.atoms.length+'</span></div>'+
      '</div></div>';
  }
});
function loadOrganicPreset(name){
  var o=STATE.organic;
  o.atoms=[];
  o.bonds=[];
  o.nextId=0;
  o.selectedAtom=null;
  var cx=CANV.W/2,cy=CANV.H/2;
  if(name==='ethanol'){
    /* CH3-CH2-OH */
    var c1={x:cx-80,y:cy,type:'C',id:0};
    var c2={x:cx+20,y:cy,type:'C',id:1};
    var ox={x:cx+100,y:cy,type:'O',id:2};
    var hx={x:cx+180,y:cy,type:'H',id:3};
    o.atoms.push(c1,c2,ox,hx);
    o.nextId=4;
    o.bonds.push({a:0,b:1,type:'single'});
    o.bonds.push({a:1,b:2,type:'single'});
    o.bonds.push({a:2,b:3,type:'single'});
    /* H on carbons */
    for(var i=0;i<3;i++){
      var angle=-Math.PI/2+i*(2*Math.PI/3);
      o.atoms.push({x:c1.x+Math.cos(angle)*60,y:c1.y+Math.sin(angle)*60,type:'H',id:o.nextId});
      o.bonds.push({a:c1.id,b:o.nextId,type:'single'});
      o.nextId++;
    }
    for(var j=0;j<2;j++){
      var angle2=-Math.PI/2+j*Math.PI;
      o.atoms.push({x:c2.x+Math.cos(angle2)*50,y:c2.y+Math.sin(angle2)*50,type:'H',id:o.nextId});
      o.bonds.push({a:c2.id,b:o.nextId,type:'single'});
      o.nextId++;
    }
  } else if(name==='benzene'){
    for(var i=0;i<6;i++){
      var angle=i/6*Math.PI*2;
      o.atoms.push({x:cx+Math.cos(angle)*80,y:cy+Math.sin(angle)*80,type:'C',id:o.nextId++});
    }
    for(var b=0;b<6;b++){
      o.bonds.push({a:b,b:(b+1)%6,type:(b%2===0)?'double':'single'});
    }
  } else if(name==='acetone'){
    /* CH3-CO-CH3 */
    var c1b={x:cx-80,y:cy,type:'C',id:0};
    var c2b={x:cx,y:cy,type:'C',id:1};
    var c3b={x:cx+80,y:cy,type:'C',id:2};
    var ox2={x:cx,y:cy-80,type:'O',id:3};
    o.atoms.push(c1b,c2b,c3b,ox2);
    o.nextId=4;
    o.bonds.push({a:0,b:1,type:'single'});
    o.bonds.push({a:1,b:2,type:'single'});
    o.bonds.push({a:1,b:3,type:'double'});
  } else if(name==='acetic'){
    /* CH3-COOH */
    var c1c={x:cx-80,y:cy,type:'C',id:0};
    var c2c={x:cx,y:cy,type:'C',id:1};
    var ox3={x:cx+50,y:cy-70,type:'O',id:2};
    var ox4={x:cx+80,y:cy+50,type:'O',id:3};
    var hx2={x:cx+160,y:cy+80,type:'H',id:4};
    o.atoms.push(c1c,c2c,ox3,ox4,hx2);
    o.nextId=5;
    o.bonds.push({a:0,b:1,type:'single'});
    o.bonds.push({a:1,b:2,type:'double'});
    o.bonds.push({a:1,b:3,type:'single'});
    o.bonds.push({a:3,b:4,type:'single'});
  }
  toast('Loaded '+name,'success');
  renderLeftPanel();
}

function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});

  if(pane)pane.classList.add('active');

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='8'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

  'Preparing IR/UV-Vis spectral database...',

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CHEMISTRY ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

});
