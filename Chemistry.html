<!DOCTYPE html>
<html lang="en" data-theme="lab">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CHEMISTRY — Chemistry Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#050810;--bg2:#0a1020;--bg3:#101a34;--bg4:#1a2850;
  --panel:#0a1020;--panel2:#101a34;--panel3:#1a2850;--panel4:#283a70;
  --bd:#202c54;--bd2:#303e78;--bd3:#5060b0;
  --tx:#e0e8ff;--tx2:#98a8d8;--tx3:#586898;--mu:#384878;
  --c1:#40d0ff;--c1h:#80e0ff;--c1l:#2090c0;
  --c2:#ff5080;--c2h:#ff90a8;--c2l:#c03060;
  --c3:#ffe040;--c3h:#fff080;--c3l:#c0a020;
  --c4:#40ff90;--c4h:#80ffc0;--c4l:#20c060;
  --c5:#a060ff;--c5h:#c090ff;--c5l:#7030c0;
  --c6:#ffa040;--c6h:#ffc080;--c6l:#c07020;
  --c7:#40ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff40c0;--c8h:#ff80d8;--c8l:#c02090;
  --ok:#40ff90;--warn:#ffe040;--err:#ff5080;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40d0ff,#a060ff);
  --g2:linear-gradient(135deg,#ffe040,#ff5080);
  --gHolo:linear-gradient(120deg,#40d0ff,#a060ff,#40ff90,#ffe040,#ff5080,#40d0ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.8);
  --sh2:0 16px 48px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="darklab"]{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--panel:#141414;--panel2:#1e1e1e;
  --bd:#2c2c2c;--bd2:#444;--tx:#f0f0f0;--tx2:#b8b8b8;
  --c1:#40e0ff;--c2:#ff4080;--c3:#ffe040;--c4:#40ff90;--c5:#c060ff;
  --g1:linear-gradient(135deg,#40e0ff,#c060ff)}
[data-theme="paper"]{--bg:#f8f5ec;--bg2:#f0ead8;--bg3:#e0d8c0;--panel:#fff;--panel2:#f8f5ec;--panel3:#f0ead8;--panel4:#e0d8c0;
  --bd:#c8bca0;--bd2:#a09080;--tx:#0a1420;--tx2:#405068;--tx3:#708090;
  --c1:#0060c0;--c2:#c00040;--c3:#c08000;--c4:#008040;--c5:#6020c0;
  --g1:linear-gradient(135deg,#0060c0,#6020c0)}
[data-theme="vapor"]{--bg:#100518;--bg2:#1e0a2c;--bg3:#2c1040;--panel:#1e0a2c;--panel2:#2c1040;
  --bd:#4a1e6c;--bd2:#6c2e98;--tx:#f0d8ff;--tx2:#c090d8;
  --c1:#40ffc0;--c2:#ff40a0;--c3:#ffe040;--c4:#40ffff;--c5:#c060ff;
  --g1:linear-gradient(135deg,#40ffc0,#ff40a0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#050810;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-atom{width:200px;height:200px;margin-bottom:20px;position:relative;animation:spin 12s linear infinite}
.boot-atom svg{width:100%;height:100%}
.boot-atom circle.nucleus{fill:url(#nucleusGrad);filter:drop-shadow(0 0 20px #ff5080)}
.boot-atom ellipse{fill:none;stroke:#40d0ff;stroke-width:1.5;opacity:.6}
.boot-atom circle.electron{fill:#40d0ff;filter:drop-shadow(0 0 8px #40d0ff)}
.boot-atom circle.electron:nth-child(5){animation:orbit1 3s linear infinite}
.boot-atom circle.electron:nth-child(6){animation:orbit2 4s linear infinite}
.boot-atom circle.electron:nth-child(7){animation:orbit3 5s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbit1{0%{transform:rotate(0deg) translateX(70px) rotate(0)}100%{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
@keyframes orbit2{0%{transform:rotate(60deg) translateX(85px) rotate(-60deg)}100%{transform:rotate(420deg) translateX(85px) rotate(-420deg)}}
@keyframes orbit3{0%{transform:rotate(120deg) translateX(60px) rotate(-120deg)}100%{transform:rotate(480deg) translateX(60px) rotate(-480deg)}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#40d0ff;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#1a2850;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40d0ff}
.boot-pct{font-size:.7rem;color:#40d0ff;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#586898;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.65rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#050810;box-shadow:0 0 14px rgba(64,208,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#1a2850;transition:var(--t1)}
.tb-status .dot.on{background:var(--c4);box-shadow:0 0 10px var(--c4);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:300px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#02040a;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(10,16,32,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:360px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,208,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#050810;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(64,208,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#050810;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.formula{font-family:var(--mono);font-size:.72rem;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:10px;color:var(--c1);line-height:1.7;word-break:break-all;user-select:text}
.formula .sub{font-size:.7em;vertical-align:sub}
.formula .sup{font-size:.7em;vertical-align:super}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c4)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:260px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-atom">
    <svg viewBox="-100 -100 200 200">
      <defs>
        <radialGradient id="nucleusGrad">
          <stop offset="0" stop-color="#fff"/>
          <stop offset="0.5" stop-color="#ff5080"/>
          <stop offset="1" stop-color="#a060ff"/>
        </radialGradient>
      </defs>
      <ellipse cx="0" cy="0" rx="70" ry="26" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="85" ry="30" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="60" ry="22" transform="rotate(-60)"/>
      <circle class="nucleus" cx="0" cy="0" r="14"/>
      <circle class="electron" cx="0" cy="0" r="5"/>
      <circle class="electron" cx="0" cy="0" r="5"/>
      <circle class="electron" cx="0" cy="0" r="5"/>
    </svg>
  </div>
  <div class="boot-logo">CHEMISTRY</div>
  <div class="boot-sub">CHEMISTRY STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('elements')">CHEMISTRY</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Element</span><span class="sb-val c2" id="sbEl">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Value</span><span class="sb-val c3" id="sbVal">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Count</span><span class="sb-val c4" id="sbCount">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Time</span><span class="sb-val c5" id="sbTime">0ms</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Elements</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}

function findElement(z){return ELEMENTS[z-1]}
function findElementBySymbol(sym){
  for(var i=0;i<ELEMENTS.length;i++)if(ELEMENTS[i][1]===sym)return ELEMENTS[i];

}
/* Acid-base equilibria */
function pHfromHA(Ka,c){
  /* Solve quadratic: [H+]² + Ka[H+] - Ka·c = 0 */
  var a=1,b=Ka,c2=-Ka*c;
  var disc=b*b-4*a*c2;
  return (-b+Math.sqrt(disc))/(2*a);
}
function pHStrongAcid(c){return -Math.log10(c)}
function pHBuffer(Ka,ca,cb){
  /* Henderson-Hasselbalch */
  return -Math.log10(Ka)+Math.log10(cb/ca);
}
/* Kinetics */
function firstOrder(c0,k,t){return c0*Math.exp(-k*t)}
function secondOrder(c0,k,t){return c0/(1+k*c0*t)}
function zeroOrder(c0,k,t){return Math.max(0,c0-k*t)}
function arrheniusRate(A,Ea,T){return A*Math.exp(-Ea/(CONSTANTS.R*T))}
/* Nernst equation */
function nernst(E0,n,Q,T){
  T=T||298.15;
  return E0-(CONSTANTS.R*T/(n*CONSTANTS.F))*Math.log(Q);
}
/* Gibbs free energy */
function gibbsFreeEnergy(dH,dS,T){
  return dH-T*dS;
}
/* Radioactive decay */
function decay(N0,lambda,t){return N0*Math.exp(-lambda*t)}
function halfLifeToLambda(t12){return Math.log(2)/t12}
/* Quantum orbital functions (radial nodes etc) */
function numRadialNodes(n,l){return n-l-1}

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('wheel',onWheel,{passive:false});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={down:false,x:0,y:0,lastX:0,lastY:0};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onWheel(e){e.preventDefault();var m=MODULES[STATE.currentTab];if(m&&m.onWheel)m.onWheel(e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def;}
function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

/* ================================================================
   MODULE: PERIODIC TABLE
   ================================================================ */
registerModule('elements',{
  title:'Periodic Table',
  icon:'⚛',
  desc:'All 118 elements with full properties. Click any cell for detailed information, filter by category, or highlight periodic trends.',
  init:function(){},
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var e=STATE.elements;
    /* Layout: 18 columns, 7 rows + lanthanide/actinide below */
    var cols=18;
    var rows=9;
    var margin=40;
    var availW=W-margin*2;
    var availH=H-margin*2;
    var cellW=availW/cols;
    var cellH=Math.min(cellW,availH/rows);
    var gridW=cellW*cols;
    var gridH=cellH*rows;
    var ox=(W-gridW)/2;
    var oy=(H-gridH)/2;
    var filter=e.filter;
    /* Draw all 118 elements */
    ELEMENTS.forEach(function(el){
      var z=el[0],sym=el[1],name=el[2],mass=el[3],cat=el[4],grp=el[5],per=el[6];
      var px,py;
      /* Lanthanides (57-71) go in row 8.5, actinides (89-103) in row 9.5 */
      if(z>=57&&z<=71){
        px=ox+(z-57+2)*cellW;
        py=oy+7.7*cellH;
      } else if(z>=89&&z<=103){
        px=ox+(z-89+2)*cellW;
        py=oy+8.5*cellH;
      } else {
        if(grp===null)return;
        px=ox+(grp-1)*cellW;
        py=oy+(per-1)*cellH;
      }
      /* Filter out */
      var dim=filter!=='all'&&cat!==filter;
      /* Highlight trends */
      var trendAlpha=1;
      if(e.highlight!=='none'){
        var match=false;
        if(e.highlight==='metals'&&(cat==='alkali'||cat==='alkaline'||cat==='transition'||cat==='post-transition'||cat==='lanthanide'||cat==='actinide'))match=true;
        else if(e.highlight==='nonmetals'&&(cat==='nonmetal'||cat==='halogen'||cat==='noble'))match=true;
        else if(e.highlight==='metalloids'&&cat==='metalloid')match=true;
        if(!match)trendAlpha=0.15;
      }
      var baseColor=CATEGORY_COLORS[cat]||'#808080';
      /* Cell background */
      var grad=ctx.createLinearGradient(px,py,px+cellW,py+cellH);
      if(dim){
        grad.addColorStop(0,'rgba(40,50,80,.3)');
        grad.addColorStop(1,'rgba(20,30,60,.3)');
      } else {
        grad.addColorStop(0,baseColor+'50');
        grad.addColorStop(1,baseColor+'20');
      }
      ctx.fillStyle=grad;
      ctx.globalAlpha=trendAlpha;
      ctx.beginPath();ctx.roundRect(px+2,py+2,cellW-4,cellH-4,4);ctx.fill();
      ctx.strokeStyle=dim?'rgba(80,100,140,.3)':baseColor;
      ctx.lineWidth=z===e.selected?3:1.5;
      ctx.stroke();
      ctx.globalAlpha=1;
      /* Element content */
      ctx.textAlign='center';
      /* Atomic number top-left */
      ctx.font='bold '+Math.floor(cellH*0.14)+'px monospace';
      ctx.fillStyle=dim?'rgba(200,208,216,.4)':baseColor;
      ctx.textAlign='left';
      ctx.fillText(z.toString(),px+cellW*0.1,py+cellH*0.22);
      /* Symbol center */
      ctx.font='bold '+Math.floor(cellH*0.36)+'px sans-serif';
      ctx.fillStyle=dim?'rgba(180,190,220,.4)':(e.showLabels?'#ffffff':'#e0e8ff');
      ctx.textAlign='center';
      ctx.fillText(sym,px+cellW/2,py+cellH*0.62);
      /* Name below (small) */
      if(e.showLabels&&cellW>32){
        ctx.font=Math.floor(cellH*0.11)+'px sans-serif';
        ctx.fillStyle=dim?'rgba(150,160,190,.4)':'rgba(230,240,255,.75)';
        ctx.fillText(name.substring(0,Math.floor(cellW/5)),px+cellW/2,py+cellH*0.85);
      }
      /* Mass */
      if(e.showMass&&cellW>40){
        ctx.font=Math.floor(cellH*0.1)+'px monospace';
        ctx.fillStyle=dim?'rgba(150,160,190,.3)':'rgba(180,200,240,.6)';
        ctx.fillText(mass.toFixed(1),px+cellW/2,py+cellH*0.98);
      }
    });
    /* Row/column labels */
    ctx.fillStyle='rgba(88,104,152,.9)';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    for(var g=1;g<=18;g++){
      ctx.fillText(g.toString(),ox+(g-0.5)*cellW,oy+cellH*0.5-2);
    }
    ctx.textAlign='right';
    for(var p=1;p<=7;p++){
      ctx.fillText(p.toString(),ox-cellW*0.1,oy+(p-0.5)*cellH+3);
    }
    /* Lanthanide/Actinide labels */
    ctx.textAlign='center';
    ctx.fillStyle='rgba(88,104,152,.6)';
    ctx.font='9px monospace';
    ctx.fillText('57-71',ox+cellW*0.8,oy+8.2*cellH);
    ctx.fillText('89-103',ox+cellW*0.8,oy+9*cellH);
    /* Currently selected element info */
    var sel=findElement(e.selected);
    if(sel){
      var iw=260,ih=140;
      var ix=W-iw-20,iy=20;
      ctx.fillStyle='rgba(10,16,32,.92)';
      ctx.strokeStyle=CATEGORY_COLORS[sel[4]]||'#40d0ff';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(ix,iy,iw,ih,8);ctx.fill();ctx.stroke();
      ctx.textAlign='left';
      ctx.font='bold 28px sans-serif';
      ctx.fillStyle=CATEGORY_COLORS[sel[4]]||'#40d0ff';
      ctx.fillText(sel[1],ix+16,iy+38);
      ctx.font='bold 14px monospace';
      ctx.fillStyle='#e0e8ff';
      ctx.fillText(sel[2],ix+72,iy+30);
      ctx.font='11px monospace';
      ctx.fillStyle='#98a8d8';
      ctx.fillText('Z = '+sel[0],ix+16,iy+58);
      ctx.fillText('Mass = '+sel[3]+' u',ix+16,iy+74);
      ctx.fillText('Category: '+sel[4],ix+16,iy+90);
      ctx.fillText('Group: '+sel[5]+', Period: '+sel[6],ix+16,iy+106);
      ctx.fillText('Config: '+sel[7],ix+16,iy+122);
    }
    setStatsHTML(
      '<div>Elements: 118</div>'+
      '<div>Selected: '+sel[1]+'</div>'+
      '<div>Filter: '+e.filter+'</div>'+
      '<div>Highlight: '+e.highlight+'</div>'
    );
    updateBadge('⚛ Periodic Table · '+sel[1]+' ('+sel[2]+')');
    $('sbMode').textContent='Periodic Table';
    $('sbEl').textContent=sel[1]+' (Z='+sel[0]+')';
  },
  onDown:function(p){
    var e=STATE.elements;
    var W=CANV.W,H=CANV.H;
    var cols=18,rows=9;
    var margin=40;
    var availW=W-margin*2,availH=H-margin*2;
    var cellW=availW/cols;
    var cellH=Math.min(cellW,availH/rows);
    var gridW=cellW*cols,gridH=cellH*rows;
    var ox=(W-gridW)/2,oy=(H-gridH)/2;
    /* Find which cell */
    var gx=Math.floor((p.x-ox)/cellW);
    var gy=Math.floor((p.y-oy)/cellH);
    if(gx<0||gx>17||gy<0||gy>8)return;
    /* Map to element */
    var found=null;
    ELEMENTS.forEach(function(el){
      var z=el[0],grp=el[5],per=el[6];
      var px,py;
      if(z>=57&&z<=71){px=z-57+2;py=7.7;}
      else if(z>=89&&z<=103){px=z-89+2;py=8.5;}
      else if(grp===null)return;
      else {px=grp-1;py=per-1;}
      if(px===gx&&Math.abs(py-gy)<1)found=el;
    });
    if(found){
      e.selected=found[0];
      this.showElementInfo(found);
    }
  },
  showElementInfo:function(el){
    var z=el[0],sym=el[1],name=el[2],mass=el[3],cat=el[4],grp=el[5],per=el[6],config=el[7],en=el[8],melt=el[9],boil=el[10],dens=el[11],disc=el[12],block=el[13];
    var html='<div style="display:flex;gap:20px;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:240px">'+
      '<div style="font-size:5rem;font-weight:900;font-family:sans-serif;color:'+(CATEGORY_COLORS[cat]||'#40d0ff')+';line-height:1">'+sym+'</div>'+
      '<div style="font-size:1.4rem;font-weight:600;margin-top:4px">'+name+'</div>'+
      '<div style="color:var(--tx3);font-family:var(--mono);font-size:.72rem;margin-top:4px">Z = '+z+' · '+cat+' · '+block+'-block</div>'+
      '</div>'+
      '<div style="flex:2;min-width:280px" class="kv">'+
      '<div class="row"><span class="k">Atomic mass</span><span class="v">'+mass+' u</span></div>'+
      '<div class="row"><span class="k">Group, Period</span><span class="v">'+(grp===null?'—':grp)+', '+per+'</span></div>'+
      '<div class="row"><span class="k">Electron config</span><span class="v">'+config+'</span></div>'+
      '<div class="row"><span class="k">Electronegativity</span><span class="v">'+(en||'—')+'</span></div>'+
      '<div class="row"><span class="k">Melting point</span><span class="v">'+(melt?melt+' K ('+(melt-273.15).toFixed(1)+'°C)':'—')+'</span></div>'+
      '<div class="row"><span class="k">Boiling point</span><span class="v">'+(boil?boil+' K':'—')+'</span></div>'+
      '<div class="row"><span class="k">Density</span><span class="v">'+(dens?dens+' g/cm³':'—')+'</span></div>'+
      '<div class="row"><span class="k">Discovered</span><span class="v">'+(disc===0?'Ancient':disc)+'</span></div>'+
      '</div>'+
      '</div>';
    openModal('⚛ '+name,shtml(html),'<button class="btn primary" onclick="closeModal()">Close</button>',{size:'lg'});
  },
  controls:function(){
    var e=STATE.elements;
    var html='';
    html+='<div class="sec"><h4>Filter by category</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(e.filter==='all'?'active':'')+'" onclick="STATE.elements.filter=\'all\';renderLeftPanel()">All</div>';
    Object.keys(CATEGORY_COLORS).forEach(function(c){
      html+='<div class="chip '+(e.filter===c?'active':'')+'" onclick="STATE.elements.filter=\''+c+'\';renderLeftPanel()">'+c+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Highlight trend</h4>';
    html+='<div class="chip-row">';
    [['none','None'],['metals','Metals'],['nonmetals','Nonmetals'],['metalloids','Metalloids']].forEach(function(h){
      html+='<div class="chip '+(e.highlight===h[0]?'active':'')+'" onclick="STATE.elements.highlight=\''+h[0]+'\';renderLeftPanel()">'+h[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Element names</span><div class="chip '+(e.showLabels?'active':'')+'" onclick="STATE.elements.showLabels=!STATE.elements.showLabels;renderLeftPanel()">'+(e.showLabels?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Atomic masses</span><div class="chip '+(e.showMass?'active':'')+'" onclick="STATE.elements.showMass=!STATE.elements.showMass;renderLeftPanel()">'+(e.showMass?'ON':'OFF')+'</div></div>';
    html+='</div>';
    /* Quick access to selected */
    var sel=findElement(e.selected);
    html+='<div class="sec"><h4>Selected: '+sel[1]+'</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Name</span><span class="v">'+sel[2]+'</span></div>';
    html+='<div class="row"><span class="k">Z</span><span class="v">'+sel[0]+'</span></div>';
    html+='<div class="row"><span class="k">Mass</span><span class="v">'+sel[3]+' u</span></div>';
    html+='<div class="row"><span class="k">Category</span><span class="v">'+sel[4]+'</span></div>';
    html+='</div>';
    html+='<button class="btn full sm" style="margin-top:8px" onclick="MODULES.elements.showElementInfo(findElement(STATE.elements.selected))">📖 Full details</button>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click any cell to see the element details.</div>';
    return html;
  },
  mathPanel:function(){
    var e=STATE.elements;
    var sel=findElement(e.selected);
    return '<div class="sec"><h4>Periodic trends</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Atomic radius:</b> increases down, decreases across<br>'+
      '<b class="text-c1">Ionization energy:</b> increases across, decreases down<br>'+
      '<b class="text-c1">Electronegativity:</b> increases toward F (top-right)<br>'+
      '<b class="text-c1">Metallic character:</b> increases down-left<br>'+
      '<b class="text-c1">Electron affinity:</b> highest for halogens'+
      '</div></div>'+
      '<div class="sec"><h4>Groups</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '<b>1:</b> Alkali metals — highly reactive<br>'+
      '<b>2:</b> Alkaline earth — reactive divalents<br>'+
      '<b>17:</b> Halogens — diatomic, very reactive<br>'+
      '<b>18:</b> Noble gases — inert full shells'+
      '</div></div>'+
      '<div class="sec"><h4>Selected element</h4><div class="kv">'+
      '<div class="row"><span class="k">Symbol</span><span class="v">'+sel[1]+'</span></div>'+
      '<div class="row"><span class="k">Config</span><span class="v">'+sel[7]+'</span></div>'+
      '<div class="row"><span class="k">EN</span><span class="v">'+(sel[8]||'—')+'</span></div>'+
      '<div class="row"><span class="k">Melting</span><span class="v">'+(sel[9]||'—')+' K</span></div>'+
      '<div class="row"><span class="k">Boiling</span><span class="v">'+(sel[10]||'—')+' K</span></div>'+
      '<div class="row"><span class="k">Density</span><span class="v">'+(sel[11]||'—')+' g/cm³</span></div>'+
      '</div></div>';
  }
});
function shtml(h){return h}

registerModule('orbitals',{
  title:'Atomic Orbitals',
  icon:'🌐',
  desc:'Visualize electron probability distributions for hydrogen-like atoms. Choose quantum numbers (n, l, m) and see the orbital shape.',
  init:function(){},
  tick:function(dt){
    var o=STATE.orbitals;
    if(o.autoRotate)o.rotation+=dt*0.5;

    /* Render orbital as 2D cross-section (density plot) */
    var size=Math.min(W-300,H-140);

    /* Draw orbital using pixels for speed */
    var imgCanvas=this._imgCanvas;

      this._imgCanvas.width=res;

    var imgData=this._imgCtx.createImageData(res,res);
    var data=imgData.data;

    for(var py=0;py<res;py++){

        var y=(py/res-0.5)*2;

        var cosR=Math.cos(o.rotation),sinR=Math.sin(o.rotation);

        var theta=Math.atan2(yr,xr);
        var psi=hydrogenWavefunction(o.n,o.l,o.m,r,theta,0);

        var density=psi*psi;
        /* Normalize visually */
        var v=clamp(Math.pow(density,0.5)*15,0,1);

          data[(py*res+px)*4]=Math.floor(255*v);

          data[(py*res+px)*4+3]=Math.floor(v*255);
        }
      }

    this._imgCtx.putImageData(imgData,0,0);

    /* Draw axes crosshair */

    ctx.setLineDash([4,4]);

/* Simplified hydrogen wavefunction for 2D visualization */
function hydrogenWavefunction(n,l,m,r,theta,phi){
  /* Use associated Laguerre and spherical harmonics approximations */
  /* Radial part: R_nl(r) ~ r^l · e^(-r/n) · L_nl(2r/n) */
  var rho=2*r/n;
  var radial=Math.pow(rho,l)*Math.exp(-rho/2)*laguerre(n-l-1,2*l+1,rho);
  /* Angular part */
  var angular;
  if(l===0)angular=1;
  else if(l===1)angular=Math.cos(theta);
  else if(l===2)angular=Math.cos(2*theta);
  else angular=Math.cos(3*theta);
  return radial*angular*0.5;
}
function laguerre(k,alpha,x){
  /* Simplified Associated Laguerre polynomial L_k^alpha */
  if(k===0)return 1;
  if(k===1)return 1+alpha-x;
  if(k===2)return 1+(alpha+1)*(2+alpha-x)+(x*x)/2-(alpha+2)*x;
  /* Approximate for higher k */
  return Math.cos(x-k*Math.PI/4);
}

registerModule('molecular',{
  title:'Molecular Geometry',
  icon:'🔷',
  desc:'VSEPR theory predicts 3D molecular shapes from electron pair repulsion. Select ligands and lone pairs to see the geometry.',
  init:function(){
    this.updateGeometry();
  },
  updateGeometry:function(){
    var m=STATE.molecular;
    var key=m.ligands+'-'+m.lonePairs;
    var geo=VSEPR[key];
    if(geo){
      m.selectedGeom=key;
      m.geometry=geo;
    }
  },
  tick:function(dt){
    var m=STATE.molecular;
    if(m.autoRotate)m.rotationY+=dt*0.5;
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var m=STATE.molecular;
    var geo=m.geometry||VSEPR['4-0'];
    /* Header */
    ctx.fillStyle='#a060ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('🔷 VSEPR MOLECULAR GEOMETRY',20,26);
    ctx.fillStyle='#98a8d8';
    ctx.font='11px monospace';
    ctx.fillText('Formula: '+geo.shape+'  ·  Shape: '+geo.name+'  ·  Angle: '+geo.angle+'°',20,44);
    /* 3D projection */
    var cx=W/2,cy=H/2-20;
    var scale=Math.min(W,H)*0.25;
    var pos=this.getPositions(m.ligands,m.lonePairs);
    /* Project and draw bonds */
    var projected=pos.map(function(p){
      return this.project3D(p,cx,cy,scale);
    },this);
    /* Draw bonds first */
    projected.forEach(function(p,i){
      if(p.lone)return;
      ctx.strokeStyle='rgba(160,96,255,.7)';
      ctx.lineWidth=Math.max(2,6*p.scale);
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    });
    /* Central atom */
    var cg=ctx.createRadialGradient(cx,cy,0,cx,cy,20);
    cg.addColorStop(0,'#fff');
    cg.addColorStop(0.5,'#a060ff');
    cg.addColorStop(1,'#6020c0');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 16px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(m.central,cx,cy+1);
    ctx.textBaseline='alphabetic';
    /* Draw ligands */
    var sortedProj=projected.slice().sort(function(a,b){return a.z-b.z});
    sortedProj.forEach(function(p){
      if(p.lone){
        /* Draw lone pair as electron dots */
        ctx.fillStyle='rgba(255,224,64,.9)';
        ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,224,64,.5)';
        ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(p.x+3,p.y+3,3,0,Math.PI*2);ctx.fill();
      } else {
        var lg=ctx.createRadialGradient(p.x-5,p.y-5,0,p.x,p.y,15*p.scale);
        lg.addColorStop(0,'#fff');
        lg.addColorStop(0.5,'#40d0ff');
        lg.addColorStop(1,'#2090c0');
        ctx.fillStyle=lg;
        ctx.beginPath();ctx.arc(p.x,p.y,14*p.scale,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#050810';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText('X',p.x,p.y+1);
        ctx.textBaseline='alphabetic';
      }
    });
    /* Bond angles */
    if(m.showAngles&&m.ligands>=2){

      ctx.arc(cx,cy,scale*0.4,-Math.PI/3,Math.PI/3);

      ctx.setLineDash([]);

      ctx.textAlign='center';

  },
  project3D:function(p,cx,cy,scale){
    var m=STATE.molecular;
    /* Rotate around Y and X */
    var cosY=Math.cos(m.rotationY),sinY=Math.sin(m.rotationY);
    var cosX=Math.cos(m.rotationX),sinX=Math.sin(m.rotationX);
    var x=p.x*cosY-p.z*sinY;
    var z=p.x*sinY+p.z*cosY;
    var y=p.y*cosX-z*sinX;
    var z2=p.y*sinX+z*cosX;
    /* Simple perspective */
    var perspective=1/(1+z2*0.3);
    return {
      x:cx+x*scale*perspective,
      y:cy-y*scale*perspective,
      z:z2,
      scale:perspective,
      lone:p.lone
    };
  },
  getPositions:function(ligands,lonePairs){
    var total=ligands+lonePairs;
    var pts=[];
    /* Ideal 3D positions based on total electron pairs */
    if(total===2){
      pts=[{x:1,y:0,z:0},{x:-1,y:0,z:0}];
    } else if(total===3){
      pts=[{x:0,y:1,z:0},{x:0.866,y:-0.5,z:0},{x:-0.866,y:-0.5,z:0}];
    } else if(total===4){
      pts=[{x:1,y:1,z:1},{x:-1,y:-1,z:1},{x:-1,y:1,z:-1},{x:1,y:-1,z:-1}];
    } else if(total===5){
      pts=[
        {x:0,y:1,z:0},{x:0,y:-1,z:0},
        {x:1,y:0,z:0},{x:-1,y:0,z:0},
        {x:0,y:0,z:1},{x:0,y:0,z:-1}
      ];
    } else if(total===6){
      pts=[
        {x:1,y:0,z:0},{x:-1,y:0,z:0},
        {x:0,y:1,z:0},{x:0,y:-1,z:0},
        {x:0,y:0,z:1},{x:0,y:0,z:-1}
      ];
    }
    /* Mark lone pairs first (they go in specific positions) */
    var result=[];
    for(var i=0;i<ligands;i++)result.push(pts[i]);
    for(var j=0;j<lonePairs;j++)result.push(Object.assign({},pts[ligands+j],{lone:true}));
    return result;
  },

    html+='<button class="btn full sm" style="margin-top:8px" onclick="STATE.molecular.rotationX=0;STATE.molecular.rotationY=0;renderLeftPanel()">↺ Reset rotation</button>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Drag on canvas to rotate the molecule.</div>';
    return html;
  },
  mathPanel:function(){
    var m=STATE.molecular;
    var geo=m.geometry||VSEPR['4-0'];
    return '<div class="sec"><h4>VSEPR Theory</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Valence Shell Electron Pair Repulsion:<br>'+
      '• Electron pairs repel each other<br>'+
      '• Arrange to be as far apart as possible<br>'+
      '• Lone pairs repel more than bonds'+
      '</div></div>'+
      '<div class="sec"><h4>Geometry notes</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '<b class="text-c1">AX4 tetrahedral:</b> 109.5° — CH₄, NH₄⁺<br>'+
      '<b class="text-c1">AX3E:</b> ~107° — NH₃ (lone pair compression)<br>'+
      '<b class="text-c1">AX2E2:</b> ~104.5° — H₂O (2 lone pairs)<br>'+
      '<b class="text-c1">AX5:</b> 90/120° — PCl₅<br>'+
      '<b class="text-c1">AX6:</b> 90° — SF₆'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Formula</span><span class="v">'+geo.shape+'</span></div>'+
      '<div class="row"><span class="k">Shape</span><span class="v">'+geo.name+'</span></div>'+
      '<div class="row"><span class="k">Angle</span><span class="v">'+geo.angle+'°</span></div>'+
      '<div class="row"><span class="k">Ligands</span><span class="v">'+m.ligands+'</span></div>'+
      '<div class="row"><span class="k">Lone pairs</span><span class="v">'+m.lonePairs+'</span></div>'+
      '<div class="row"><span class="k">Hybridization</span><span class="v">'+(m.ligands+m.lonePairs<=2?'sp':(m.ligands+m.lonePairs===3?'sp²':(m.ligands+m.lonePairs===4?'sp³':(m.ligands+m.lonePairs===5?'sp³d':'sp³d²'))))+'</span></div>'+
      '</div></div>';
  }
});
function setVSEPR(ligands,lonePairs){
  STATE.molecular.ligands=ligands;
  STATE.molecular.lonePairs=lonePairs;
  MODULES.molecular.updateGeometry();
}

<script>
/* ================================================================
   MODULE: ACID-BASE TITRATION
   ================================================================ */
registerModule('titration',{
  title:'Titration Curve',
  icon:'💧',
  desc:'Simulate acid-base titration with real Henderson-Hasselbalch calculations. Watch the equivalence point form.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var t=STATE.titration;
    t.points=[];
    var maxVol=t.acidVol*3;
    for(var v=0;v<=maxVol;v+=0.1){
      var pH=this.pHAt(v);
      t.points.push({v:v,pH:pH});
    }
    logMsg('Titration curve computed: '+(t.acidType==='strong'?'strong':'weak')+' acid','info');
  },
  pHAt:function(Vbase){
    var t=STATE.titration;
    var nAcid=t.acidConc*t.acidVol/1000; /* moles */
    var nBase=t.baseConc*Vbase/1000;
    var Vtotal=(t.acidVol+Vbase)/1000;
    if(t.acidType==='strong'){
      /* Strong acid: complete dissociation */
      if(nBase<nAcid)return -Math.log10((nAcid-nBase)/Vtotal);
      if(Math.abs(nBase-nAcid)<1e-9)return 7;
      /* Excess strong base */
      return 14+Math.log10((nBase-nAcid)/Vtotal);
    } else {
      /* Weak acid HA ⇌ H+ + A- */
      var Ka=t.Ka;
      if(nBase===0){
        /* Pure weak acid */
        return -Math.log10(pHfromHA(Ka,t.acidConc));
      }
      if(nBase<nAcid*0.999){
        /* Buffer region: Henderson-Hasselbalch */
        var ratio=nBase/(nAcid-nBase);
        return -Math.log10(Ka)+Math.log10(ratio);
      }
      if(Math.abs(nBase-nAcid)<1e-9){
        /* Equivalence: hydrolysis of A- */
        var cA=nAcid/Vtotal;
        var Kb=1e-14/Ka;
        var OH=Math.sqrt(Kb*cA);
        return 14+Math.log10(OH);
      }
      /* Excess base */
      return 14+Math.log10((nBase-nAcid)/Vtotal);
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var t=STATE.titration;
    /* Chart area */
    var pad=60;
    var gx=pad,gy=pad;
    var gW=W-pad*2,gH=H-pad*2-100;
    /* Grid */
    ctx.strokeStyle='rgba(64,208,255,.1)';
    ctx.lineWidth=1;
    for(var i=0;i<=10;i++){
      var gy2=gy+(i/10)*gH;
      ctx.beginPath();ctx.moveTo(gx,gy2);ctx.lineTo(gx+gW,gy2);ctx.stroke();
    }
    for(var j=0;j<=12;j++){
      var gx2=gx+(j/12)*gW;
      ctx.beginPath();ctx.moveTo(gx2,gy);ctx.lineTo(gx2,gy+gH);ctx.stroke();
    }
    /* pH axis labels */
    ctx.fillStyle='#98a8d8';
    ctx.font='10px monospace';
    ctx.textAlign='right';
    for(var p=0;p<=14;p+=2){
      var py=gy+gH-(p/14)*gH;
      ctx.fillText(p.toString(),gx-6,py+4);
    }
    ctx.textAlign='center';
    var maxV=t.acidVol*3;
    for(var v=0;v<=maxV;v+=maxV/6){
      var vx=gx+(v/maxV)*gW;
      ctx.fillText(v.toFixed(0),vx,gy+gH+16);
    }
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.fillText('Volume of base (mL)',gx+gW/2,gy+gH+36);
    ctx.save();
    ctx.translate(16,gy+gH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('pH',0,0);
    ctx.restore();
    /* Theoretical pH range background */
    ctx.fillStyle='rgba(64,208,255,.03)';
    ctx.fillRect(gx,gy,gW,gH);
    /* Equivalence line */
    var equivV=0;
    if(t.acidType==='strong')equivV=t.acidConc*t.acidVol/t.baseConc;
    else equivV=t.acidConc*t.acidVol/t.baseConc;
    var eqX=gx+(equivV/maxV)*gW;
    if(t.showEquiv){
      ctx.strokeStyle='rgba(255,224,64,.4)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(eqX,gy);ctx.lineTo(eqX,gy+gH);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ffe040';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.fillText('Equivalence',eqX,gy-6);
      ctx.fillText(eqV.toFixed(1)+' mL',eqX,gy+12);
    }
    /* Buffer region */
    if(t.showBuffer&&t.acidType==='weak'){
      var bufferStartX=gx+(0.1*equivV/maxV)*gW;
      var bufferEndX=gx+(0.9*equivV/maxV)*gW;
      ctx.fillStyle='rgba(160,96,255,.1)';
      ctx.fillRect(bufferStartX,gy,bufferEndX-bufferStartX,gH);
      ctx.fillStyle='#a060ff';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText('buffer region',(bufferStartX+bufferEndX)/2,gy+12);
    }
    /* pH curve */
    ctx.strokeStyle='#40ff90';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    t.points.forEach(function(p,i){
      var px=gx+(p.v/maxV)*gW;
      var py=gy+gH-(p.pH/14)*gH;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.stroke();
    /* Current volume indicator */
    var currX=gx+(t.currentVol/maxV)*gW;
    var currPH=this.pHAt(t.currentVol);
    var currY=gy+gH-(currPH/14)*gH;
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(currX,currY,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Legend */
    ctx.fillStyle='rgba(10,16,32,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('TITRATION',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Acid: '+(t.acidType==='strong'?'strong (HCl)':'weak')+' '+t.acidConc+' M',W-248,64);
    if(t.acidType==='weak'){
      ctx.fillText('Ka = '+t.Ka.toExponential(2),W-248,82);
      ctx.fillText('pKa = '+fmt(-Math.log10(t.Ka),2),W-248,100);
    }
    ctx.fillText('Base: NaOH '+t.baseConc+' M',W-248,118);
    ctx.fillText('Current pH: '+fmt(currPH,2),W-248,136);
    setStatsHTML(
      '<div>pH: '+fmt(currPH,2)+'</div>'+
      '<div>V: '+fmt(t.currentVol,1)+' mL</div>'+
      '<div>'+(t.acidType==='strong'?'Strong':'Weak')+' acid</div>'+
      '<div>Equiv. at '+fmt(equivV,1)+' mL</div>'
    );
    updateBadge('💧 Titration · pH='+fmt(currPH,2)+' at '+fmt(t.currentVol,1)+' mL');
    $('sbMode').textContent='Titration';
    $('sbVal').textContent='pH='+fmt(currPH,2);
  },
  onDown:function(p){
    var t=STATE.titration;
    var pad=60;
    var gx=pad,gy=pad;
    var gW=CANV.W-pad*2;
    var maxV=t.acidVol*3;
    if(p.x<gx||p.x>gx+gW)return;
    t.currentVol=clamp((p.x-gx)/gW*maxV,0,maxV);
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  controls:function(){
    var t=STATE.titration;
    var html='';
    html+='<div class="sec"><h4>Acid type</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(t.acidType==='strong'?'active':'')+'" onclick="STATE.titration.acidType=\'strong\';MODULES.titration.compute();renderLeftPanel()">Strong (HCl)</div>';
    html+='<div class="chip '+(t.acidType==='weak'?'active':'')+'" onclick="STATE.titration.acidType=\'weak\';MODULES.titration.compute();renderLeftPanel()">Weak (HA)</div>';
    html+='</div></div>';
    if(t.acidType==='weak'){
      html+='<div class="sec"><h4>Ka (acid dissociation)</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>Ka</span><span>'+t.Ka.toExponential(2)+'</span></div>';
      html+='<input type="range" min="-6" max="-1" step="0.1" value="'+Math.log10(t.Ka)+'" oninput="STATE.titration.Ka=Math.pow(10,parseFloat(this.value));MODULES.titration.compute();renderLeftPanel()"></div>';
      html+='<div class="ctrl"><div class="lbl"><span>pKa</span><span>'+fmt(-Math.log10(t.Ka),2)+'</span></div></div>';
      html+='<div class="chip-row">';
      [
        ['Acetic acid',1.8e-5],
        ['Formic acid',1.8e-4],
        ['Benzoic acid',6.3e-5],
        ['Carbonic acid',4.3e-7],
        ['HCN',6.2e-10],
        ['HF',6.8e-4]
      ].forEach(function(a){
        html+='<div class="chip" onclick="STATE.titration.Ka='+a[1]+';MODULES.titration.compute();renderLeftPanel()">'+a[0]+'</div>';
      });
      html+='</div>';
      html+='</div>';
    }
    html+='<div class="sec"><h4>Concentrations</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Acid concentration</span><span>'+fmt(t.acidConc,3)+' M</span></div>';
    html+='<input type="range" min="0.01" max="1" step="0.01" value="'+t.acidConc+'" oninput="STATE.titration.acidConc=parseFloat(this.value);MODULES.titration.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Base concentration</span><span>'+fmt(t.baseConc,3)+' M</span></div>';
    html+='<input type="range" min="0.01" max="1" step="0.01" value="'+t.baseConc+'" oninput="STATE.titration.baseConc=parseFloat(this.value);MODULES.titration.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Acid volume</span><span>'+t.acidVol+' mL</span></div>';
    html+='<input type="range" min="10" max="50" step="5" value="'+t.acidVol+'" oninput="STATE.titration.acidVol=parseFloat(this.value);MODULES.titration.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Equivalence marker</span><div class="chip '+(t.showEquiv?'active':'')+'" onclick="STATE.titration.showEquiv=!STATE.titration.showEquiv;renderLeftPanel()">'+(t.showEquiv?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Buffer region</span><div class="chip '+(t.showBuffer?'active':'')+'" onclick="STATE.titration.showBuffer=!STATE.titration.showBuffer;renderLeftPanel()">'+(t.showBuffer?'ON':'OFF')+'</div></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click on the chart to move along the titration.</div>';
    return html;
  },
  mathPanel:function(){
    var t=STATE.titration;
    var currPH=this.pHAt(t.currentVol);
    var pKa=t.acidType==='weak'?-Math.log10(t.Ka):null;
    return '<div class="sec"><h4>Henderson-Hasselbalch</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'pH = pKa + log([A⁻]/[HA])<br><br>'+
      'Valid in the <b>buffer region</b>, where the ratio of conjugate base to acid is between 0.1 and 10.<br><br>'+
      'Half-equivalence: [A⁻] = [HA], so pH = pKa.'+
      '</div></div>'+
      '<div class="sec"><h4>Special points</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">Start:</b> weak acid, pH = ½(pKa − log c)<br>'+
      '<b class="text-c1">Half-equivalence:</b> pH = pKa<br>'+
      '<b class="text-c1">Equivalence:</b> basic (A⁻ hydrolysis)<br>'+
      '<b class="text-c1">Past equivalence:</b> strong base dominates'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Volume</span><span class="v">'+fmt(t.currentVol,1)+' mL</span></div>'+
      '<div class="row"><span class="k">pH</span><span class="v">'+fmt(currPH,3)+'</span></div>'+
      (pKa?'<div class="row"><span class="k">pKa</span><span class="v">'+fmt(pKa,3)+'</span></div>':'')+
      (pKa?'<div class="row"><span class="k">[A⁻]/[HA]</span><span class="v">'+fmt(Math.pow(10,currPH-pKa),3)+'</span></div>':'')+
      '<div class="row"><span class="k">[H⁺]</span><span class="v">'+Math.pow(10,-currPH).toExponential(2)+' M</span></div>'+
      '<div class="row"><span class="k">[OH⁻]</span><span class="v">'+Math.pow(10,currPH-14).toExponential(2)+' M</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE: REACTION KINETICS
   ================================================================ */
registerModule('kinetics',{
  title:'Reaction Kinetics',
  icon:'⚗',
  desc:'Simulate zero, first and second order kinetics. See concentration decay, half-life, and Arrhenius temperature dependence.',
  init:function(){
    this.reset();
  },
  reset:function(){
    var k=STATE.kinetics;
    k.time=0;
    k.conc=k.c0;
    k.history=[{t:0,c:k.c0}];
    k.running=false;
  },
  tick:function(dt){
    var k=STATE.kinetics;
    if(!k.running)return;
    var steps=Math.max(1,Math.round(k.speed*dt*20));
    for(var i=0;i<steps;i++){
      var dtSim=0.01;
      k.time+=dtSim;
      if(k.order===0)k.conc=zeroOrder(k.c0,k.k,k.time);
      else if(k.order===1)k.conc=firstOrder(k.c0,k.k,k.time);
      else k.conc=secondOrder(k.c0,k.k,k.time);
      k.history.push({t:k.time,c:k.conc});
      if(k.history.length>2000)k.history.shift();
      if(k.conc<1e-4)break;
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var k=STATE.kinetics;
    /* Chart */
    var pad=60;
    var gx=pad,gy=pad;
    var gW=W-pad*2,gH=H-pad*2-100;
    ctx.strokeStyle='rgba(64,208,255,.1)';
    ctx.lineWidth=1;
    for(var i=0;i<=10;i++){
      var gy2=gy+(i/10)*gH;
      ctx.beginPath();ctx.moveTo(gx,gy2);ctx.lineTo(gx+gW,gy2);ctx.stroke();
    }
    for(var j=0;j<=10;j++){
      var gx2=gx+(j/10)*gW;
      ctx.beginPath();ctx.moveTo(gx2,gy);ctx.lineTo(gx2,gy+gH);ctx.stroke();
    }
    /* Axis labels */
    ctx.fillStyle='#98a8d8';
    ctx.font='10px monospace';
    ctx.textAlign='right';
    for(var ci=0;ci<=5;ci++){
      var cyv=k.c0*ci/5;
      ctx.fillText(cyv.toFixed(2),gx-6,gy+gH-(ci/5)*gH+4);
    }
    ctx.textAlign='center';
    var maxT=Math.max(10,Math.floor(k.time*1.2));
    for(var ti=0;ti<=5;ti++){
      var tv=maxT*ti/5;
      ctx.fillText(tv.toFixed(0),gx+(ti/5)*gW,gy+gH+16);
    }
    ctx.fillStyle='#40ff90';
    ctx.font='bold 11px monospace';
    ctx.fillText('Time (s)',gx+gW/2,gy+gH+36);
    ctx.save();
    ctx.translate(16,gy+gH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Concentration (M)',0,0);
    ctx.restore();
    /* Theoretical curve */
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    for(var t=0;t<=maxT;t+=0.05){
      var c;
      if(k.order===0)c=zeroOrder(k.c0,k.k,t);
      else if(k.order===1)c=firstOrder(k.c0,k.k,t);
      else c=secondOrder(k.c0,k.k,t);
      var px=gx+(t/maxT)*gW;
      var py=gy+gH-(c/k.c0)*gH;
      if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    /* Actual curve */
    ctx.strokeStyle='#40ff90';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    k.history.forEach(function(h,i){
      var px=gx+(h.t/maxT)*gW;
      var py=gy+gH-(h.c/k.c0)*gH;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.stroke();
    /* Half-life marker */
    if(k.order===1){
      var t12=Math.log(2)/k.k;
      if(t12<maxT){
        var hx=gx+(t12/maxT)*gW;
        var hy=gy+gH/2;
        ctx.strokeStyle='rgba(255,224,64,.5)';
        ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.moveTo(hx,gy);ctx.lineTo(hx,gy+gH);ctx.stroke();
        ctx.beginPath();ctx.moveTo(gx,hy);ctx.lineTo(hx,hy);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#ffe040';
        ctx.beginPath();ctx.arc(hx,hy,5,0,Math.PI*2);ctx.fill();
        ctx.font='bold 10px monospace';
        ctx.textAlign='left';
        ctx.fillText('t½ = '+fmt(t12,2)+'s',hx+8,hy-8);
      }
    }
    /* Current point */
    var curY=gy+gH-(k.conc/k.c0)*gH;
    var curX=gx+(k.time/maxT)*gW;
    ctx.fillStyle='#40d0ff';
    ctx.beginPath();ctx.arc(curX,curY,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Info box */
    ctx.fillStyle='rgba(10,16,32,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,160,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('KINETICS',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Order: '+k.order,W-248,64);
    ctx.fillText('k = '+fmt(k.k,4)+' M'+(k.order===1?'/s':'⁻¹/s'),W-248,82);
    ctx.fillText('[A]₀ = '+fmt(k.c0,2)+' M',W-248,100);
    ctx.fillText('[A] = '+fmt(k.conc,4)+' M',W-248,118);
    var halflife;
    if(k.order===0)halflife=k.c0/(2*k.k);
    else if(k.order===1)halflife=Math.log(2)/k.k;
    else halflife=1/(k.k*k.c0);
    ctx.fillText('t½ = '+fmt(halflife,3)+' s',W-248,136);
    ctx.fillText('Rate = '+fmt(this.rate(),4)+' M/s',W-248,154);
    /* Arrhenius info */
    ctx.fillText('T = '+k.temperature+' K',W-248,172);
    setStatsHTML(
      '<div>Order: '+k.order+'</div>'+
      '<div>[A] = '+fmt(k.conc,4)+' M</div>'+
      '<div>t = '+fmt(k.time,2)+' s</div>'+
      '<div>Rate = '+fmt(this.rate(),5)+' M/s</div>'
    );
    updateBadge('⚗ Kinetics · order '+k.order+' · [A]='+fmt(k.conc,3)+' M');
    $('sbMode').textContent='Kinetics';
    $('sbVal').textContent='[A]='+fmt(k.conc,3);
  },
  rate:function(){
    var k=STATE.kinetics;
    if(k.order===0)return k.k;
    if(k.order===1)return k.k*k.conc;
    return k.k*k.conc*k.conc;
  },
  onDown:function(p){},
  controls:function(){
    var k=STATE.kinetics;
    var html='';
    html+='<div class="sec"><h4>Controls</h4>';
    html+='<button class="btn primary full" onclick="STATE.kinetics.running=!STATE.kinetics.running;renderLeftPanel()">'+(k.running?'⏸ Pause':'▶ Start')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.kinetics.reset();renderLeftPanel()">↺ Reset</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Reaction order</h4>';
    html+='<div class="chip-row">';
    [0,1,2].forEach(function(o){
      html+='<div class="chip '+(k.order===o?'active':'')+'" onclick="STATE.kinetics.order='+o+';MODULES.kinetics.reset();renderLeftPanel()">Order '+o+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Rate constant</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>k</span><span>'+fmt(k.k,4)+'</span></div>';
    html+='<input type="range" min="0.001" max="1" step="0.001" value="'+k.k+'" oninput="STATE.kinetics.k=parseFloat(this.value);MODULES.kinetics.reset();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Initial concentration</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>[A]₀</span><span>'+fmt(k.c0,2)+' M</span></div>';
    html+='<input type="range" min="0.1" max="2" step="0.1" value="'+k.c0+'" oninput="STATE.kinetics.c0=parseFloat(this.value);MODULES.kinetics.reset();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Arrhenius temperature</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>T</span><span>'+k.temperature+' K</span></div>';
    html+='<input type="range" min="250" max="500" step="5" value="'+k.temperature+'" oninput="STATE.kinetics.temperature=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Ea (kJ/mol)</span><span>'+fmt(k.Ea/1000,0)+'</span></div>';
    html+='<input type="range" min="10000" max="150000" step="1000" value="'+k.Ea+'" oninput="STATE.kinetics.Ea=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Simulation speed</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Speed</span><span>'+k.speed+'×</span></div>';
    html+='<input type="range" min="0.1" max="5" step="0.1" value="'+k.speed+'" oninput="STATE.kinetics.speed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var k=STATE.kinetics;
    var arrhenius=arrheniusRate(k.A,k.Ea,k.temperature);
    return '<div class="sec"><h4>Rate laws</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Zero order:</b> rate = k<br>'+
      '&nbsp;&nbsp;[A] = [A]₀ − kt<br>'+
      '&nbsp;&nbsp;t½ = [A]₀/(2k)<br><br>'+
      '<b class="text-c1">First order:</b> rate = k[A]<br>'+
      '&nbsp;&nbsp;[A] = [A]₀·e^(−kt)<br>'+
      '&nbsp;&nbsp;t½ = ln(2)/k<br><br>'+
      '<b class="text-c1">Second order:</b> rate = k[A]²<br>'+
      '&nbsp;&nbsp;1/[A] = 1/[A]₀ + kt<br>'+
      '&nbsp;&nbsp;t½ = 1/(k[A]₀)'+
      '</div></div>'+
      '<div class="sec"><h4>Arrhenius equation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'k = A·e^(−Ea/RT)<br><br>'+
      'ln(k₂/k₁) = −Ea/R·(1/T₂ − 1/T₁)<br><br>'+
      'A = frequency factor<br>'+
      'Ea = activation energy<br>'+
      'R = 8.314 J/(mol·K)'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Order</span><span class="v">'+k.order+'</span></div>'+
      '<div class="row"><span class="k">k</span><span class="v">'+fmt(k.k,4)+'</span></div>'+
      '<div class="row"><span class="k">Rate</span><span class="v">'+fmt(this.rate(),5)+' M/s</span></div>'+
      '<div class="row"><span class="k">Ea</span><span class="v">'+fmt(k.Ea/1000,0)+' kJ/mol</span></div>'+
      '<div class="row"><span class="k">A</span><span class="v">'+k.A.toExponential(1)+'</span></div>'+
      '<div class="row"><span class="k">k_arrhenius</span><span class="v">'+arrhenius.toExponential(2)+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
