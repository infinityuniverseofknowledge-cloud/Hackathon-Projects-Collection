<!DOCTYPE html>
<html lang="en" data-theme="cosmos">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ASTRA — Astronomy Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#02040a;--bg2:#060a18;--bg3:#0a1428;--bg4:#141e3c;
  --panel:#060a18;--panel2:#0a1428;--panel3:#141e3c;--panel4:#1e2c58;
  --bd:#1a2450;--bd2:#2c3c78;--bd3:#4858a8;
  --tx:#e0e8ff;--tx2:#98a8d8;--tx3:#586890;--mu:#384870;
  --c1:#ffc040;--c1h:#ffd880;--c1l:#c09020;
  --c2:#40c0ff;--c2h:#80d8ff;--c2l:#2090c0;
  --c3:#ff60a0;--c3h:#ff90c0;--c3l:#c03080;
  --c4:#40ff90;--c4h:#80ffc0;--c4l:#20c060;
  --c5:#ffe060;--c5h:#fff0a0;--c5l:#c0a040;
  --c6:#a060ff;--c6h:#c090ff;--c6l:#7030c0;
  --c7:#40ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff8040;--c8h:#ffb080;--c8l:#c05020;
  --ok:#40ff90;--warn:#ffe060;--err:#ff5060;--info:#40c0ff;
  --g1:linear-gradient(135deg,#ffc040,#ff60a0);
  --g2:linear-gradient(135deg,#40c0ff,#a060ff);
  --gHolo:linear-gradient(120deg,#ffc040,#ff60a0,#a060ff,#40c0ff,#40ff90,#ffc040);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.85);
  --sh2:0 16px 48px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="observatory"]{--bg:#0a0505;--bg2:#180808;--bg3:#281010;--panel:#180808;--panel2:#281010;
  --bd:#482020;--bd2:#703838;--tx:#f0e0d8;--tx2:#c0a090;--tx3:#806858;
  --c1:#ff8040;--c2:#40c0ff;--c3:#ff4060;--c6:#c060ff;
  --g1:linear-gradient(135deg,#ff8040,#ff4060)}
[data-theme="paper"]{--bg:#f8f4e8;--bg2:#f0ead8;--bg3:#e0d8c0;--panel:#fff;--panel2:#f8f4e8;--panel3:#f0ead8;--panel4:#e0d8c0;
  --bd:#c8bca0;--bd2:#a09080;--tx:#0a1020;--tx2:#405070;--tx3:#708090;
  --c1:#c06000;--c2:#0060c0;--c3:#c00040;--c6:#6020c0;
  --g1:linear-gradient(135deg,#c06000,#c00040)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#02040a;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-sky{position:absolute;inset:0;overflow:hidden}
.boot-star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.boot-sun{width:180px;height:180px;margin-bottom:20px;position:relative;z-index:2;animation:pulsesun 3s ease-in-out infinite}
.boot-sun svg{width:100%;height:100%}
.boot-sun circle.core{fill:#ffc040;filter:drop-shadow(0 0 30px #ffc040)}
.boot-sun circle.corona{fill:none;stroke:#ffc040;stroke-width:2;opacity:.4;animation:expand 3s ease-in-out infinite}
.boot-sun ellipse.orbit{fill:none;stroke:#40c0ff;stroke-width:1.5;opacity:.6}
.boot-sun circle.planet{fill:#40c0ff;filter:drop-shadow(0 0 6px #40c0ff);animation:orbit 4s linear infinite}
@keyframes pulsesun{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes expand{0%,100%{r:80;opacity:.4}50%{r:95;opacity:.15}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:16px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px;z-index:2}
.boot-sub{font-size:.7rem;color:#ffc040;letter-spacing:10px;margin-bottom:32px;opacity:.75;z-index:2}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#141e3c;border-radius:2px;overflow:hidden;margin-bottom:12px;z-index:2}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ffc040}
.boot-pct{font-size:.7rem;color:#ffc040;margin-bottom:16px;z-index:2}
.boot-log{font-size:.6rem;color:#586890;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7;z-index:2}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes orbit{from{transform:rotate(0) translateX(70px) rotate(0)}to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#02040a;box-shadow:0 0 14px rgba(255,192,64,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#141e3c;transition:var(--t1)}
.tb-status .dot.on{background:var(--c4);box-shadow:0 0 10px var(--c4);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#000205;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(6,10,24,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,192,64,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#02040a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,192,64,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#02040a;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c4)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-sky" id="bootSky"></div>
  <div class="boot-sun">
    <svg viewBox="0 0 180 180">
      <circle class="corona" cx="90" cy="90" r="75"/>
      <circle class="core" cx="90" cy="90" r="40"/>
      <ellipse class="orbit" cx="90" cy="90" rx="75" ry="30"/>
      <ellipse class="orbit" cx="90" cy="90" rx="75" ry="30" transform="rotate(60 90 90)"/>
      <circle class="planet" cx="90" cy="90" r="4"/>
    </svg>
  </div>
  <div class="boot-logo">ASTRA</div>
  <div class="boot-sub">ASTRONOMY STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('solar')">ASTRA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Time</span><span class="sb-val c2" id="sbTime">0.00d</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Objects</span><span class="sb-val c3" id="sbObjs">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Zoom</span><span class="sb-val c4" id="sbZoom">1.0×</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Value</span><span class="sb-val c5" id="sbVal">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Solar</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function rndN(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

var PARSEC=3.0856775814913673e16;   /* meters */

var SOLAR_MASS=1.98892e30;          /* kg */

var SOLAR_RAD=6.957e8;              /* m */

var EARTH_RAD=6.371e6;              /* m */
var GRAV_G=6.67430e-11;             /* m³/(kg·s²) */
var BOLTZMANN=1.380649e-23;         /* J/K */
var PLANCK_H=6.62607015e-34;        /* J·s */
var LIGHT_C=2.99792458e8;           /* m/s */
var STEFAN_BOLTZMANN=5.670374419e-8;/* W/(m²·K⁴) */
var WIEN_B=2.897771955e-3;          /* m·K */
var DEG2RAD=Math.PI/180;
var RAD2DEG=180/Math.PI;

/* ================================================================
   KEPLER ORBITAL MECHANICS
   ================================================================ */
function solveKepler(M,e){
  /* Solve M = E - e·sin(E) for eccentric anomaly E via Newton-Raphson */
  M=normAngle(M);
  var E=M;
  for(var i=0;i<20;i++){
    var f=E-e*Math.sin(E)-M;
    var fp=1-e*Math.cos(E);
    var dE=f/fp;
    E-=dE;
    if(Math.abs(dE)<1e-10)break;
  }
  return E;
}
function normAngle(a){
  a=a%(Math.PI*2);
  if(a<0)a+=Math.PI*2;
  return a;
}
function orbitalPosition(a,e,M0,t,P){
  /* Given semi-major axis, eccentricity, mean anomaly at t=0, current time, period */
  var M=M0+2*Math.PI*t/P;
  var E=solveKepler(M,e);
  /* True anomaly */
  var nu=2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
  /* Distance */
  var r=a*(1-e*Math.cos(E));
  return {E:E,nu:nu,r:r,x:r*Math.cos(nu),y:r*Math.sin(nu)};
}
function orbitalPeriod(a,M){
  /* a in AU, M in solar masses → period in years (Kepler's 3rd law) */
  return Math.sqrt(a*a*a/M);
}

/* ================================================================
   BLACKBODY RADIATION (Planck's law)
   ================================================================ */
function planck(wavelengthNm,T){
  /* Spectral radiance B_λ(T) in W·m⁻²·sr⁻¹·m⁻¹ */
  var lambda=wavelengthNm*1e-9; /* to meters */
  var c1=2*PLANCK_H*LIGHT_C*LIGHT_C;
  var c2=PLANCK_H*LIGHT_C/(lambda*BOLTZMANN*T);
  var lambda5=lambda*lambda*lambda*lambda*lambda;
  return c1/(lambda5*(Math.exp(c2)-1));
}
function wienPeak(T){
  /* Wien's displacement law: λ_max = b/T, in nm */
  return WIEN_B/T*1e9;
}
function totalRadiance(T){
  /* Stefan-Boltzmann: integrated flux per m² */
  return STEFAN_BOLTZMANN*T*T*T*T;
}
function blackbodyRGB(T){
  /* Approximate RGB of a blackbody at temperature T */
  T=clamp(T,1000,40000);
  var r,g,b;
  /* Red */
  if(T<=6600)r=255;
  else r=329.698727446*Math.pow((T-6000)/100,-0.1332047592);
  /* Green */
  if(T<=6600)g=99.4708025861*Math.log(T/100)-161.1195681661;
  else g=288.1221695283*Math.pow((T-6000)/100,-0.0755148492);
  /* Blue */
  if(T>=6600)b=255;
  else if(T<=1900)b=0;
  else b=138.5177312231*Math.log((T-1000)/100)-305.0447927307;
  return 'rgb('+Math.round(clamp(r,0,255))+','+Math.round(clamp(g,0,255))+','+Math.round(clamp(b,0,255))+')';
}

/* ================================================================
   REDSHIFT / DOPPLER
   ================================================================ */
function dopplerShift(lambda0,v){
  /* Relativistic Doppler: λ_obs = λ₀ · sqrt((1+β)/(1-β)) */
  var beta=v/LIGHT_C; /* v in m/s */
  if(Math.abs(beta)>=1)return NaN;
  var z=Math.sqrt((1+beta)/(1-beta))-1;
  return {z:z,lambda_obs:lambda0*(1+z)};
}
function redshiftToVelocity(z){
  /* Relativistic: v = c·((1+z)²-1)/((1+z)²+1) */
  var num=(1+z)*(1+z)-1;
  var den=(1+z)*(1+z)+1;
  return LIGHT_C*num/den;
}
function hubbleDistance(z,H0){
  /* Very simple linear Hubble law: d = c·z/H0, H0 in km/s/Mpc */
  H0=H0||70;
  return LIGHT_C*z/(H0*1e3/3.0857e22); /* meters */
}

/* ================================================================
   GRAVITATIONAL LENSING
   ================================================================ */
function deflectionAngle(M,b){
  /* Einstein deflection: α = 4GM/(c²b) */
  return 4*GRAV_G*M/(LIGHT_C*LIGHT_C*b);
}
function einsteinRadius(M,Dl,Ds,Dls){
  /* θ_E = sqrt(4GM/c² · Dls/(Dl·Ds)) */
  return Math.sqrt(4*GRAV_G*M/LIGHT_C/LIGHT_C*Dls/(Dl*Ds));
}

/* ================================================================
   HR DIAGRAM STAR DATA (100 stars, approximate)
   ================================================================ */
function generateHRStars(){
  var stars=[];
  /* Main sequence */
  for(var i=0;i<60;i++){
    var T=rndF(2500,30000);
    /* Luminosity from mass-luminosity + temperature */
    var L=Math.pow(T/5778,4)*rndF(0.5,3);
    stars.push({T:T,L:L,type:'MS'});
  }
  /* Giants */
  for(var i2=0;i2<20;i2++){
    var T2=rndF(3500,5000);
    var L2=rndF(50,500);
    stars.push({T:T2,L:L2,type:'Giant'});
  }
  /* Supergiants */
  for(var i3=0;i3<10;i3++){
    var T3=rndF(3000,10000);
    var L3=rndF(1e4,1e6);
    stars.push({T:T3,L:L3,type:'Supergiant'});
  }
  /* White dwarfs */
  for(var i4=0;i4<10;i4++){
    var T4=rndF(5000,30000);
    var L4=rndF(1e-4,1e-2);
    stars.push({T:T4,L:L4,type:'WD'});
  }
  return stars;
}

    s.planets.forEach(function(p){
      var pos=orbitalPosition(p.a,p.e,p.M0,s.timeYears,p.P);
      var r=this.orbitScale(p.a);
      var px=r*pos.r/p.a*Math.cos(pos.nu);
      var py=r*pos.r/p.a*Math.sin(pos.nu);

        var r=this.orbitScale(p.a)*zoom;

        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.stroke();

        ctx.strokeStyle=p.color+'60';

          var ty=cy+t[1]*zoom;

      grad.addColorStop(0,'#ffffff');
      grad.addColorStop(0.4,p.color);
      grad.addColorStop(1,'rgba(0,0,0,0.6)');

      var pos=orbitalPosition(pl.a,pl.e,pl.M0,s.timeYears,pl.P);

      var px=cx+r*pos.r/pl.a*Math.cos(pos.nu);

      if(d<bestDist){bestDist=d;best=i;}
    },this);
    s.selected=best;
    INPUT.dragStart={x:p.x,y:p.y,px:s.panX,py:s.panY};

      '<b class="text-c1">2nd law:</b> Equal areas in equal times (dA/dt = const).<br><br>'+
      '<b class="text-c1">3rd law:</b> T² = a³/M (T in years, a in AU, M in M☉)'+
      '</div></div>';
    html+='<div class="sec"><h4>Kepler\'s Equation</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'M = E − e·sin(E)<br><br>'+

      'E = eccentric anomaly<br>'+
      'e = eccentricity<br><br>'+
      'Solved iteratively via Newton-Raphson:<br>'+
      'E_{n+1} = E_n − (E_n − e·sin E_n − M)/(1 − e·cos E_n)<br><br>'+
      'Then convert to true anomaly ν:<br>'+
      'tan(ν/2) = √((1+e)/(1−e))·tan(E/2)<br>'+
      'r = a(1 − e·cos E)'+

    }

});

registerModule('hr',{
  title:'H-R Diagram',
  icon:'⭐',
  desc:'Hertzsprung-Russell diagram: luminosity vs. temperature. Main sequence, giants, supergiants and white dwarfs.',
  init:function(){
    STATE.hr.stars=generateHRStars();
    logMsg('HR diagram: '+STATE.hr.stars.length+' stars','info');
  },
  tick:function(dt){STATE.time+=dt;},
  tempToColor:function(T){
    return blackbodyRGB(T);
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var h=STATE.hr;
    /* Plot area */
    var pad=60;
    var plotX=pad,plotY=pad;
    var plotW=W-pad*2,plotH=H-pad*2;
    /* Grid and axes: 
       X = temperature (reversed, log scale from 40000K to 2500K)
       Y = luminosity (log scale from 1e-5 to 1e6)
    */
    var Tmin=2500,Tmax=50000;
    var Lmin=-5,Lmax=6;
    /* Draw grid */
    ctx.strokeStyle='rgba(64,192,255,.1)';
    ctx.lineWidth=1;
    for(var lv=Lmin;lv<=Lmax;lv++){
      var y=plotY+plotH-((lv-Lmin)/(Lmax-Lmin))*plotH;
      ctx.beginPath();ctx.moveTo(plotX,y);ctx.lineTo(plotX+plotW,y);ctx.stroke();
    }
    var tempSteps=[2500,3000,4000,5000,7000,10000,15000,20000,30000,50000];
    tempSteps.forEach(function(T){
      var x=plotX+(1-(Math.log(T)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
      ctx.beginPath();ctx.moveTo(x,plotY);ctx.lineTo(x,plotY+plotH);ctx.stroke();
    });
    /* Labels */
    ctx.fillStyle='rgba(152,168,216,.7)';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    tempSteps.forEach(function(T){
      var x=plotX+(1-(Math.log(T)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
      var label=T>=1000?(T/1000).toFixed(0)+'k':T.toString();
      ctx.fillText(label,x,plotY+plotH+16);
    });
    ctx.fillText('Temperature (K)',plotX+plotW/2,plotY+plotH+32);
    ctx.textAlign='right';
    for(var lv2=Lmin;lv2<=Lmax;lv2++){
      if(lv2%1!==0)continue;
      var y2=plotY+plotH-((lv2-Lmin)/(Lmax-Lmin))*plotH;
      ctx.fillText('10'+superScript(lv2),plotX-8,y2+4);
    }
    ctx.save();
    ctx.translate(16,plotY+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign='center';
    ctx.fillText('Luminosity (L☉)',0,0);
    ctx.restore();
    /* Spectral class bands */
    var spectralBands=[
      {type:'O',Tmin:30000,Tmax:50000,c:'rgba(64,128,255,.08)'},
      {type:'B',Tmin:10000,Tmax:30000,c:'rgba(128,160,255,.08)'},
      {type:'A',Tmin:7500,Tmax:10000,c:'rgba(200,200,255,.08)'},
      {type:'F',Tmin:6000,Tmax:7500,c:'rgba(255,255,200,.08)'},
      {type:'G',Tmin:5200,Tmax:6000,c:'rgba(255,224,128,.08)'},
      {type:'K',Tmin:3700,Tmax:5200,c:'rgba(255,180,128,.08)'},
      {type:'M',Tmin:2500,Tmax:3700,c:'rgba(255,128,128,.08)'}
    ];
    spectralBands.forEach(function(b){
      var x1=plotX+(1-(Math.log(b.Tmax)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
      var x2=plotX+(1-(Math.log(b.Tmin)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
      ctx.fillStyle=b.c;
      ctx.fillRect(x1,plotY,x2-x1,plotH);
      ctx.fillStyle='rgba(152,168,216,.5)';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText(b.type,(x1+x2)/2,plotY+20);
    });
    /* Filter by highlight */
    var filter=h.highlight;
    function drawStar(s,size,alpha){
      if(filter!=='all'&&filter!==s.type)return;
      var x=plotX+(1-(Math.log(s.T)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
      var y=plotY+plotH-((Math.log10(s.L)-Lmin)/(Lmax-Lmin))*plotH;
      if(x<plotX-5||x>plotX+plotW+5||y<plotY-5||y>plotY+plotH+5)return;
      var color=blackbodyRGB(s.T);
      ctx.fillStyle=color;
      ctx.globalAlpha=alpha;
      ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=alpha*0.4;
      ctx.strokeStyle=color;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,size+2,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }
    h.stars.forEach(function(s){
      drawStar(s,3,0.85);
    });
    /* Reference lines */
    ctx.strokeStyle='rgba(255,192,64,.3)';
    ctx.setLineDash([4,4]);
    /* Sun position: T=5778K, L=1 */
    var sunX=plotX+(1-(Math.log(5778)-Math.log(Tmin))/(Math.log(Tmax)-Math.log(Tmin)))*plotW;
    var sunY=plotY+plotH-((0-Lmin)/(Lmax-Lmin))*plotH;
    ctx.beginPath();
    ctx.arc(sunX,sunY,8,0,Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ffc040';
    ctx.font='bold 10px monospace';
    ctx.textAlign='left';
    ctx.fillText('Sun',sunX+10,sunY+4);
    /* Legend */
    ctx.fillStyle='rgba(6,10,24,.85)';
    ctx.strokeStyle='rgba(255,192,64,.3)';
    ctx.beginPath();ctx.roundRect(W-200,20,180,120,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffc040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('STELLAR TYPES',W-190,38);
    ctx.font='10px monospace';
    var types=[
      {name:'Main sequence',c:'#ffc040'},
      {name:'Giants',c:'#ff8040'},
      {name:'Supergiants',c:'#ff4060'},
      {name:'White dwarfs',c:'#40c0ff'}
    ];
    types.forEach(function(t,i){
      ctx.fillStyle=t.c;
      ctx.beginPath();ctx.arc(W-180,56+i*18,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e0e8ff';
      ctx.fillText(t.name,W-170,60+i*18);
    });
    setStatsHTML(
      '<div>Stars: '+h.stars.length+'</div>'+
      '<div>Highlight: '+h.highlight+'</div>'
    );
    updateBadge('⭐ H-R Diagram · '+h.stars.length+' stars');
    $('sbMode').textContent='H-R Diagram';
    $('sbObjs').textContent=h.stars.length;
  },
  onDown:function(){},
  controls:function(){
    var h=STATE.hr;
    var html='';
    html+='<div class="sec"><h4>Highlight</h4>';
    html+='<div class="chip-row">';
    [['all','All'],['MS','Main Seq'],['Giant','Giants'],['Supergiant','Supergiants'],['WD','White Dwarfs']].forEach(function(c){
      html+='<div class="chip '+(h.highlight===c[0]?'active':'')+'" onclick="STATE.hr.highlight=\''+c[0]+'\';renderLeftPanel()">'+c[1]+'</div>';

function superScript(n){
  var sup={'-':'\u207B','0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
  return String(n).split('').map(function(c){return sup[c]||c}).join('');
}

registerModule('transit',{
  title:'Exoplanet Transit',
  icon:'🌑',
  desc:'Simulate a transiting exoplanet and its light curve. Measures period, depth, duration.',
  init:function(){
    var t=STATE.transit;
    t.timeDays=0;
    t.lightCurve=[];
  },
  tick:function(dt){
    var t=STATE.transit;
    if(!STATE.playing)return;
    t.timeDays+=dt*t.speed;
    /* Modulo period for planet phase */
    var phase=(t.timeDays%t.period)/t.period;
    /* Check if in transit */
    /* Duration of transit ≈ P/π · asin((Rs+Rp)/a) — approximately */
    /* For visualization, use simple geometric model */
    var depth=Math.pow(t.planetRadius/t.starRadius,2);
    var transitDuration=0.08*t.period; /* rough approximation */
    var transitCenter=0.5*t.period;
    var distFromCenter=Math.abs((t.timeDays%t.period)-transitCenter);
    var flux=1;
    if(distFromCenter<transitDuration/2){
      /* Simulate limb darkening + ingress/egress */
      var impactFactor=Math.abs(t.impactParam);
      var progress=distFromCenter/(transitDuration/2);
      /* Approximate shape */
      var attenuation;
      if(progress>0.85){
        /* Ingress or egress */
        var edgeProgress=(progress-0.85)/0.15;
        attenuation=depth*(1-edgeProgress);
      } else {
        attenuation=depth;
      }
      /* Impact parameter reduces depth */
      attenuation*=Math.max(0.3,1-impactFactor*0.7);
      flux=1-attenuation;
    }
    /* Add noise */
    var noise=(Math.random()-0.5)*0.0003;
    t.lightCurve.push({t:t.timeDays,flux:flux+noise});
    if(t.lightCurve.length>2000)t.lightCurve.shift();
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#000205';
    ctx.fillRect(0,0,W,H);
    drawStarfield(ctx,W,H,777);
    var t=STATE.transit;
    /* Star + planet visualization on top */
    var cx=W/2,cy=H*0.3;
    var starR=100;
    /* Star with limb darkening */
    var phase=(t.timeDays%t.period)/t.period;
    var starGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,starR);
    var starColor=blackbodyRGB(t.starTemp);
    starGrad.addColorStop(0,'#fff8d0');
    starGrad.addColorStop(0.6,starColor);
    starGrad.addColorStop(1,'rgba(255,192,64,0)');
    ctx.fillStyle=starGrad;
    ctx.beginPath();ctx.arc(cx,cy,starR,0,Math.PI*2);ctx.fill();
    /* Planet */
    var transitDuration=0.08*t.period;
    var transitCenter=0.5*t.period;
    var elapsedSinceCenter=t.timeDays%t.period-transitCenter;
    var progress=elapsedSinceCenter/transitDuration;
    var px=cx+progress*starR*2*1.1;
    var py=cy+t.impactParam*starR*0.7;
    var planetR=starR*t.planetRadius/t.starRadius;
    /* Only draw if in front */
    var inFront=Math.abs(px-cx)<starR+planetR&&Math.abs(elapsedSinceCenter)<transitDuration/2;
    /* Orbit path indicator */
    ctx.strokeStyle='rgba(64,192,255,.2)';
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(cx-starR*1.5,py);ctx.lineTo(cx+starR*1.5,py);ctx.stroke();
    ctx.setLineDash([]);
    /* Planet disk */
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(px,py,planetR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,192,64,.5)';
    ctx.lineWidth=2;
    ctx.stroke();
    /* Light curve below */
    var lcY=H*0.55;
    var lcH=H*0.4;
    var lcX=40,lcW=W-80;
    ctx.fillStyle='rgba(6,10,24,.7)';
    ctx.strokeStyle='rgba(64,192,255,.3)';
    ctx.beginPath();ctx.roundRect(lcX,lcY,lcW,lcH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(64,192,255,.08)';
    for(var i=0;i<=4;i++){
      var y=lcY+i*lcH/4;
      ctx.beginPath();ctx.moveTo(lcX,y);ctx.lineTo(lcX+lcW,y);ctx.stroke();
    }
    /* Light curve plot */
    if(t.lightCurve.length>1){
      var tMin=t.lightCurve[0].t;
      var tMax=t.lightCurve[t.lightCurve.length-1].t;
      var tRange=tMax-tMin||1;
      ctx.strokeStyle='#40c0ff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      t.lightCurve.forEach(function(pt,i){
        var x=lcX+((pt.t-tMin)/tRange)*lcW;
        var y=lcY+lcH-(pt.flux-0.94)/0.06*lcH;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();
    }
    /* Current time marker */
    var phaseX=lcX+(t.timeDays%t.period)/t.period*lcW;
    ctx.strokeStyle='rgba(255,192,64,.6)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(phaseX,lcY);ctx.lineTo(phaseX,lcY+lcH);ctx.stroke();
    /* Labels */
    ctx.fillStyle='#40c0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('LIGHT CURVE',lcX+8,lcY+16);
    ctx.font='10px monospace';
    ctx.fillStyle='#98a8d8';
    ctx.fillText('Relative flux vs. time (days)',lcX+8,lcY+32);
    /* Depth annotation */
    var depth=Math.pow(t.planetRadius/t.starRadius,2);
    ctx.fillStyle='#ffc040';
    ctx.font='10px monospace';
    ctx.textAlign='right';
    ctx.fillText('Depth: '+fmt(depth*100,3)+'%',lcX+lcW-8,lcY+lcH-8);
    setStatsHTML(
      '<div>Star T: '+fmt(t.starTemp,0)+' K</div>'+
      '<div>Planet Rp/Rs: '+fmt(t.planetRadius/t.starRadius,3)+'</div>'+
      '<div>Depth: '+fmt(depth*100,3)+'%</div>'+
      '<div>Period: '+fmt(t.period,2)+' d</div>'+
      '<div>Sim time: '+fmt(t.timeDays,2)+' d</div>'
    );
    updateBadge('🌑 Exoplanet Transit · depth '+fmt(depth*100,3)+'%');
    $('sbMode').textContent='Transit';
    $('sbTime').textContent=fmt(t.timeDays,2)+'d';
    $('sbVal').textContent=fmt(depth*100,3)+'%';
  },
  onDown:function(p){
    /* Click on star to place planet impact parameter */
    var cx=CANV.W/2,cy=CANV.H*0.3;
    var dy=(p.y-cy)/80;
    if(Math.abs(dy)<1.5)STATE.transit.impactParam=clamp(dy,-1,1);
  },
  controls:function(){
    var t=STATE.transit;
    var html='';
    html+='<div class="sec"><h4>Star</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Temperature</span><span>'+fmt(t.starTemp,0)+' K</span></div>';
    html+='<input type="range" min="3000" max="12000" step="100" value="'+t.starTemp+'" oninput="STATE.transit.starTemp=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Radius (R☉)</span><span>'+fmt(t.starRadius,2)+'</span></div>';
    html+='<input type="range" min="0.3" max="3" step="0.1" value="'+t.starRadius+'" oninput="STATE.transit.starRadius=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Planet</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Radius (Rstar)</span><span>'+fmt(t.planetRadius,3)+'</span></div>';
    html+='<input type="range" min="0.02" max="0.3" step="0.005" value="'+t.planetRadius+'" oninput="STATE.transit.planetRadius=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Orbital period (days)</span><span>'+fmt(t.period,1)+'</span></div>';
    html+='<input type="range" min="3" max="100" step="1" value="'+t.period+'" oninput="STATE.transit.period=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Impact parameter b</span><span>'+fmt(t.impactParam,2)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.05" value="'+t.impactParam+'" oninput="STATE.transit.impactParam=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Speed</span><span>'+fmt(t.speed,2)+' d/s</span></div>';
    html+='<input type="range" min="0.1" max="5" step="0.1" value="'+t.speed+'" oninput="STATE.transit.speed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<button class="btn full sm" onclick="STATE.transit.lightCurve=[];STATE.transit.timeDays=0;renderLeftPanel()">↺ Reset light curve</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="transitPreset(\'hotjupiter\')">Hot Jupiter (HD 209458b)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="transitPreset(\'earth\')">Earth-like</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="transitPreset(\'superearth\')">Super-Earth</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="transitPreset(\'reddwarf\')">Around red dwarf</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var t=STATE.transit;
    var depth=Math.pow(t.planetRadius/t.starRadius,2);
    return '<div class="sec"><h4>Transit Depth</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'δ = (Rp/R★)²<br><br>'+
      'Current: δ = '+fmt(depth*100,4)+'%<br><br>'+
      'Earth transiting Sun: δ ≈ 0.0084%<br>'+
      'HD 209458b: δ ≈ 1.5%<br><br>'+
      'This is why Earth-sized planets are extremely hard to detect.'+
      '</div></div>'+
      '<div class="sec"><h4>Transit Duration</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'T ≈ (P/π)·arcsin((R★ + Rp)/a)<br><br>'+
      'a = orbital semi-major axis (from P via Kepler\'s 3rd law)<br>'+
      'For a transiting geometry, impact parameter b < 1'+
      '</div></div>'+
      '<div class="sec"><h4>What we learn</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '• Period P — from repeated transits<br>'+
      '• Radius ratio Rp/R★ — from transit depth<br>'+
      '• Orbital distance — from Kepler\'s 3rd law<br>'+
      '• Atmosphere — from transmission spectroscopy during transit<br>'+
      '• TTV (timing variations) — from additional planets'+
      '</div></div>'+
      '<div class="sec"><h4>Current parameters</h4><div class="kv">'+
      '<div class="row"><span class="k">Depth δ</span><span class="v">'+fmt(depth*100,4)+'%</span></div>'+
      '<div class="row"><span class="k">Period</span><span class="v">'+fmt(t.period,2)+' d</span></div>'+
      '<div class="row"><span class="k">Impact parameter</span><span class="v">'+fmt(t.impactParam,2)+'</span></div>'+
      '<div class="row"><span class="k">Rp/R★</span><span class="v">'+fmt(t.planetRadius/t.starRadius,4)+'</span></div>'+
      '</div></div>';
  }
});
function transitPreset(name){
  var t=STATE.transit;
  if(name==='hotjupiter'){t.starTemp=6000;t.starRadius=1.2;t.planetRadius=0.13;t.period=3.5;t.impactParam=0.0;}
  else if(name==='earth'){t.starTemp=5778;t.starRadius=1.0;t.planetRadius=0.009;t.period=365;t.impactParam=0.2;}
  else if(name==='superearth'){t.starTemp=5500;t.starRadius=0.9;t.planetRadius=0.02;t.period=20;t.impactParam=0.1;}
  else if(name==='reddwarf'){t.starTemp=3200;t.starRadius=0.3;t.planetRadius=0.08;t.period=8;t.impactParam=0.0;}
  t.lightCurve=[];t.timeDays=0;
  renderLeftPanel();
}
</script>
<script>
/* ================================================================
   MODULE: PLANCK BLACKBODY
   ================================================================ */
registerModule('planck',{
  title:'Blackbody Spectrum',
  icon:'🌡️',
  desc:'Planck\'s law of blackbody radiation. Temperature sets the spectrum — Wien peak, Stefan-Boltzmann total power.',
  init:function(){
    STATE.planck.snapshots=[];
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var p=STATE.planck;
    /* Plot area */
    var pad=60;
    var plotX=pad,plotY=pad;
    var plotW=W-pad*2,plotH=H-pad*2;
    /* Compute Planck spectrum */
    var numPts=400;
    var lambdaMin=p.lambdaMin,lambdaMax=p.lambdaMax;
    var values=[];
    var minV=Infinity,maxV=-Infinity;
    for(var i=0;i<=numPts;i++){
      var lam=lambdaMin+(lambdaMax-lambdaMin)*i/numPts;
      var B=planck(lam,p.temp);
      values.push({lam:lam,B:B});
      if(p.logScale){
        var logB=B>0?Math.log10(B):-30;
        if(logB<minV)minV=logB;if(logB>maxV)maxV=logB;
      } else {
        if(B<minV)minV=B;if(B>maxV)maxV=B;
      }
    }
    /* Store compare if enabled */
    var compareValues=null;
    if(p.showCompare){
      compareValues=[];
      for(var j=0;j<=numPts;j++){
        var lam2=lambdaMin+(lambdaMax-lambdaMin)*j/numPts;
        compareValues.push(planck(lam2,p.compareTemp));
      }
    }
    /* Grid */
    ctx.strokeStyle='rgba(64,192,255,.1)';
    ctx.lineWidth=1;
    for(var gi=0;gi<=4;gi++){
      var gy=plotY+gi*plotH/4;
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    for(var gi2=0;gi2<=5;gi2++){
      var gx=plotX+gi2*plotW/5;
      ctx.beginPath();ctx.moveTo(gx,plotY);ctx.lineTo(gx,plotY+plotH);ctx.stroke();
    }
    /* Visible light band */
    if(p.showVisibleBand){
      var vX1=plotX+(380-lambdaMin)/(lambdaMax-lambdaMin)*plotW;
      var vX2=plotX+(750-lambdaMin)/(lambdaMax-lambdaMin)*plotW;
      /* Rainbow gradient */
      var vGrad=ctx.createLinearGradient(vX1,0,vX2,0);
      vGrad.addColorStop(0,'rgba(128,0,255,.15)');
      vGrad.addColorStop(0.2,'rgba(64,64,255,.15)');
      vGrad.addColorStop(0.35,'rgba(0,192,255,.15)');
      vGrad.addColorStop(0.5,'rgba(0,255,128,.15)');
      vGrad.addColorStop(0.65,'rgba(255,255,0,.15)');
      vGrad.addColorStop(0.85,'rgba(255,128,0,.15)');
      vGrad.addColorStop(1,'rgba(255,0,0,.15)');
      if(vX1<plotX+plotW&&vX2>plotX){
        ctx.fillStyle=vGrad;
        ctx.fillRect(Math.max(plotX,vX1),plotY,Math.min(plotX+plotW,vX2)-Math.max(plotX,vX1),plotH);
        ctx.fillStyle='rgba(224,232,255,.6)';
        ctx.font='9px monospace';
        ctx.textAlign='center';
        ctx.fillText('visible',(vX1+vX2)/2,plotY-6);
      }
    }
    /* Wien peak */
    if(p.showWien){
      var wienLam=wienPeak(p.temp);
      if(wienLam>=lambdaMin&&wienLam<=lambdaMax){
        var wx=plotX+(wienLam-lambdaMin)/(lambdaMax-lambdaMin)*plotW;
        ctx.strokeStyle='#ffc040';
        ctx.setLineDash([4,4]);
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(wx,plotY);
        ctx.lineTo(wx,plotY+plotH);
        ctx.stroke();
        ctx.setLineDash([]);
        /* Peak marker */
        var wienB=planck(wienLam,p.temp);
        var wienY;
        if(p.logScale){
          wienY=plotY+plotH-((Math.log10(wienB)-minV)/(maxV-minV))*plotH;
        } else {
          wienY=plotY+plotH-(wienB/maxV)*plotH;
        }
        ctx.fillStyle='#ffc040';
        ctx.beginPath();ctx.arc(wx,wienY,5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffc040';
        ctx.font='bold 10px monospace';
        ctx.textAlign='left';
        ctx.fillText('Wien peak '+fmt(wienLam,0)+'nm',wx+8,wienY-6);
      }
    }
    /* Compare spectrum */
    if(compareValues){
      ctx.strokeStyle='rgba(152,168,216,.4)';
      ctx.lineWidth=1.5;
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      for(var ci=0;ci<=numPts;ci++){
        var cx=plotX+(ci/numPts)*plotW;
        var cv=compareValues[ci];
        var cy;
        if(p.logScale){
          var cl=cv>0?Math.log10(cv):-30;
          cy=plotY+plotH-((cl-minV)/(maxV-minV))*plotH;
        } else {
          cy=plotY+plotH-(cv/maxV)*plotH;
        }
        if(ci===0)ctx.moveTo(cx,cy);else ctx.lineTo(cx,cy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    /* Main spectrum */
    ctx.lineWidth=2.5;
    ctx.strokeStyle=blackbodyRGB(p.temp);
    ctx.beginPath();
    for(var k=0;k<=numPts;k++){
      var x=plotX+(k/numPts)*plotW;
      var v=values[k].B;
      var y;
      if(p.logScale){
        var lv=v>0?Math.log10(v):-30;
        y=plotY+plotH-((lv-minV)/(maxV-minV))*plotH;
      } else {
        y=plotY+plotH-(v/maxV)*plotH;
      }
      if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    /* Fill under curve */
    ctx.fillStyle=blackbodyRGB(p.temp)+'20';
    ctx.beginPath();
    ctx.moveTo(plotX,plotY+plotH);
    for(var k2=0;k2<=numPts;k2++){
      var x2=plotX+(k2/numPts)*plotW;
      var v2=values[k2].B;
      var y2;
      if(p.logScale){
        var lv2=v2>0?Math.log10(v2):-30;
        y2=plotY+plotH-((lv2-minV)/(maxV-minV))*plotH;
      } else {
        y2=plotY+plotH-(v2/maxV)*plotH;
      }
      ctx.lineTo(x2,y2);
    }
    ctx.lineTo(plotX+plotW,plotY+plotH);
    ctx.closePath();
    ctx.fill();
    /* Axis labels */
    ctx.fillStyle='rgba(152,168,216,.7)';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    for(var li=0;li<=5;li++){
      var lamLabel=lambdaMin+(lambdaMax-lambdaMin)*li/5;
      ctx.fillText(fmt(lamLabel,0),plotX+li*plotW/5,plotY+plotH+18);
    }
    ctx.fillText('Wavelength λ (nm)',plotX+plotW/2,plotY+plotH+36);
    ctx.save();
    ctx.translate(16,plotY+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign='center';
    ctx.fillText(p.logScale?'log B_λ':'B_λ (W/m²/sr/m)',0,0);
    ctx.restore();
    /* Info box */
    ctx.fillStyle='rgba(6,10,24,.85)';
    ctx.strokeStyle='rgba(255,192,64,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffc040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('BLACKBODY',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Temperature: '+fmt(p.temp,0)+' K',W-248,64);
    ctx.fillText('Wien peak: '+fmt(wienPeak(p.temp),0)+' nm',W-248,82);
    ctx.fillText('Total flux: '+fmt(totalRadiance(p.temp)/1e6,2)+' MW/m²',W-248,100);
    /* Color swatch */
    ctx.fillStyle=blackbodyRGB(p.temp);
    ctx.fillRect(W-248,116,224,16);
    ctx.strokeStyle='rgba(255,255,255,.3)';
    ctx.strokeRect(W-248,116,224,16);
    setStatsHTML(
      '<div>T = '+fmt(p.temp,0)+' K</div>'+
      '<div>Wien λ_max = '+fmt(wienPeak(p.temp),0)+' nm</div>'+
      '<div>Flux = '+fmt(totalRadiance(p.temp),2)+' W/m²</div>'
    );
    updateBadge('🌡️ Planck · T='+fmt(p.temp,0)+' K · λ_peak='+fmt(wienPeak(p.temp),0)+' nm');
    $('sbMode').textContent='Planck';
    $('sbVal').textContent=fmt(p.temp,0)+' K';
  },
  onDown:function(p){
    /* Click on spectrum to set temperature? No — click on color swatch area to sample */
    var W=CANV.W;
    if(p.x>W-248&&p.x<W-24&&p.y>116&&p.y<132){
      var frac=(p.x-(W-248))/224;
      STATE.planck.temp=clamp(1000+frac*(40000-1000),1000,40000);
      renderLeftPanel();
    }
  },
  controls:function(){
    var p=STATE.planck;
    var html='';
    html+='<div class="sec"><h4>Temperature</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Temperature</span><span>'+fmt(p.temp,0)+' K</span></div>';
    html+='<input type="range" min="1000" max="40000" step="100" value="'+p.temp+'" oninput="STATE.planck.temp=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="chip-row">';
    [['3000','Red dwarf'],['4000','K star'],['5778','Sun'],['7500','A star'],['15000','B star'],['30000','O star']].forEach(function(t){
      html+='<div class="chip '+(Math.abs(p.temp-parseFloat(t[0]))<200?'active':'')+'" onclick="STATE.planck.temp='+t[0]+';renderLeftPanel()">'+t[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Wavelength range</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Min λ</span><span>'+p.lambdaMin+' nm</span></div>';
    html+='<input type="range" min="50" max="1000" step="10" value="'+p.lambdaMin+'" oninput="STATE.planck.lambdaMin=parseInt(this.value);if(STATE.planck.lambdaMin>=STATE.planck.lambdaMax)STATE.planck.lambdaMax=STATE.planck.lambdaMin+100;renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Max λ</span><span>'+p.lambdaMax+' nm</span></div>';
    html+='<input type="range" min="500" max="20000" step="100" value="'+p.lambdaMax+'" oninput="STATE.planck.lambdaMax=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Log scale</span><div class="chip '+(p.logScale?'active':'')+'" onclick="STATE.planck.logScale=!STATE.planck.logScale;renderLeftPanel()">'+(p.logScale?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Wien peak</span><div class="chip '+(p.showWien?'active':'')+'" onclick="STATE.planck.showWien=!STATE.planck.showWien;renderLeftPanel()">'+(p.showWien?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Visible band</span><div class="chip '+(p.showVisibleBand?'active':'')+'" onclick="STATE.planck.showVisibleBand=!STATE.planck.showVisibleBand;renderLeftPanel()">'+(p.showVisibleBand?'ON':'OFF')+'</div></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Compare temperature</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Show compare</span><div class="chip '+(p.showCompare?'active':'')+'" onclick="STATE.planck.showCompare=!STATE.planck.showCompare;renderLeftPanel()">'+(p.showCompare?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Compare T</span><span>'+fmt(p.compareTemp,0)+' K</span></div>';
    html+='<input type="range" min="1000" max="40000" step="100" value="'+p.compareTemp+'" oninput="STATE.planck.compareTemp=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var p=STATE.planck;
    return '<div class="sec"><h4>Planck\'s Law</h4>'+

   ================================================================ */
registerModule('redshift',{
  title:'Redshift & Doppler',
  icon:'🔴',
  desc:'Relativistic Doppler shift. Watch spectral lines shift as an object moves or recedes.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var r=STATE.redshift;
    var v=r.velocity*1000; /* km/s to m/s */
    var result=dopplerShift(r.lambda0,v);
    r.z=result.z;
    r.lambdaObs=result.lambda_obs;
  },
  tick:function(dt){
    STATE.time+=dt;
    /* Animate velocity towards zero for a decay effect? Optional */
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var r=STATE.redshift;
    /* Header */
    ctx.fillStyle='#ffc040';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('🔴 REDSHIFT & DOPPLER',20,32);
    ctx.fillStyle='#586890';
    ctx.font='11px monospace';
    ctx.fillText('Rest wavelength λ₀ = '+fmt(r.lambda0,1)+' nm ('+lineName(r.lambda0)+')',20,52);
    /* Velocity visualization */
    var velY=100;
    var cx=W/2;
    /* Velocity vector */
    var vMax=1e5; /* m/s */
    var vFrac=clamp(r.velocity*1000/vMax,-1,1);
    ctx.fillStyle='rgba(6,10,24,.6)';
    ctx.strokeStyle='rgba(255,192,64,.3)';
    ctx.beginPath();ctx.roundRect(60,velY,W-120,60,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Observer',80,velY+34);
    ctx.fillText('Source',W-80,velY+34);
    /* Object */
    var objX=cx+vFrac*(W/2-120);
    ctx.fillStyle='#ffc040';
    ctx.beginPath();ctx.arc(objX,velY+30,15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Motion arrow */
    if(Math.abs(r.velocity)>1){
      var arrDir=r.velocity>0?1:-1;
      ctx.strokeStyle='#40ff90';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(objX,velY+30);
      ctx.lineTo(objX+arrDir*60*Math.abs(vFrac),velY+30);
      ctx.stroke();
    }
    /* Spectrum visualization */
    var specY=210;
    var specH=80;
    var specX=80;
    var specW=W-160;
    /* Rainbow background representing spectrum range 400-700nm */
    var rainbow=ctx.createLinearGradient(specX,0,specX+specW,0);
    rainbow.addColorStop(0,'rgba(128,0,255,.4)');
    rainbow.addColorStop(0.15,'rgba(64,64,255,.4)');
    rainbow.addColorStop(0.3,'rgba(0,192,255,.4)');
    rainbow.addColorStop(0.45,'rgba(0,255,128,.4)');
    rainbow.addColorStop(0.6,'rgba(255,255,0,.4)');
    rainbow.addColorStop(0.8,'rgba(255,128,0,.4)');
    rainbow.addColorStop(1,'rgba(255,0,0,.4)');
    ctx.fillStyle=rainbow;
    ctx.fillRect(specX,specY,specW,specH);
    /* Rest line position (655 nm in 400-700 range) */
    function lambdaToX(lam){
      return specX+clamp((lam-400)/300,0,1)*specW;
    }
    /* Rest position */
    var restX=lambdaToX(r.lambda0);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(restX,specY);
    ctx.lineTo(restX,specY+specH);
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 10px monospace';
    ctx.textAlign='center';
    ctx.fillText('REST',restX,specY-8);
    /* Observed position */
    var obsX=lambdaToX(r.lambdaObs);
    if(obsX>=specX&&obsX<=specX+specW){
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=3;
      ctx.setLineDash([6,4]);
      ctx.beginPath();
      ctx.moveTo(obsX,specY-15);
      ctx.lineTo(obsX,specY+specH+15);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ffe040';
      ctx.fillText('OBSERVED',obsX,specY+specH+28);
    }
    /* Axis labels */
    ctx.fillStyle='rgba(152,168,216,.7)';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    for(var li=0;li<=6;li++){
      var lam=400+li*50;
      ctx.fillText(lam+'nm',specX+(li/6)*specW,specY+specH+16);
    }
    /* Info box */
    var infoY=specY+specH+50;
    ctx.fillStyle='rgba(6,10,24,.85)';
    ctx.strokeStyle='rgba(255,192,64,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,140,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffc040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('REDSHIFT PARAMETERS',52,infoY+22);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Velocity:',52,infoY+48);
    var velColor=r.velocity>0?'#ff5060':r.velocity<0?'#40c0ff':'#e0e8ff';
    ctx.fillStyle=velColor;
    ctx.font='bold 13px monospace';
    ctx.fillText(fmt(r.velocity,1)+' km/s',150,infoY+48);
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.fillText('Direction:',52,infoY+70);
    ctx.fillStyle=r.velocity>0?'#ff5060':r.velocity<0?'#40c0ff':'#e0e8ff';
    ctx.fillText(r.velocity>0?'→ Receding (redshift)':r.velocity<0?'← Approaching (blueshift)':'— Stationary',150,infoY+70);
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Redshift z:',52,infoY+92);
    ctx.fillStyle='#ffe040';
    ctx.font='bold 13px monospace';
    ctx.fillText(fmt(r.z,6),150,infoY+92);
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.fillText('λ observed:',52,infoY+114);
    ctx.fillStyle='#40ff90';
    ctx.font='bold 13px monospace';
    ctx.fillText(fmt(r.lambdaObs,2)+' nm',150,infoY+114);
    /* Distance estimate */
    var dist=hubbleDistance(r.z,r.hubbleConst);
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.fillText('Hubble distance:',380,infoY+48);
    ctx.fillStyle='#40c0ff';
    ctx.font='bold 13px monospace';
    ctx.fillText(fmt(dist/PARSEC/1e6,2)+' Mpc',560,infoY+48);
    ctx.fillStyle='#e0e8ff';
    ctx.font='11px monospace';
    ctx.fillText('Light travel time:',380,infoY+70);
    ctx.fillStyle='#40c0ff';
    ctx.fillText(fmt(dist/LIGHT_YEAR/1e6,2)+' Myr',560,infoY+70);
    setStatsHTML(
      '<div>λ₀ = '+fmt(r.lambda0,1)+' nm</div>'+
      '<div>λ_obs = '+fmt(r.lambdaObs,2)+' nm</div>'+
      '<div>z = '+fmt(r.z,5)+'</div>'+
      '<div>v = '+fmt(r.velocity,1)+' km/s</div>'
    );
    updateBadge('🔴 Redshift · z='+fmt(r.z,4)+' · '+(r.velocity>0?'receding':'approaching'));
    $('sbMode').textContent='Redshift';
    $('sbVal').textContent='z='+fmt(r.z,4);
  },
  onDown:function(p){
    /* Click on the spectrum to set line position? No — click on object to grab */
  },
  controls:function(){
    var r=STATE.redshift;
    var html='';
    html+='<div class="sec"><h4>Spectral Line</h4>';
    html+='<div class="chip-row">';
    [['Ly-α',121.6],['H-β',486.1],['H-α',656.3],['Na-D',589.3],['Ca-K',393.4]].forEach(function(l){
      html+='<div class="chip '+(Math.abs(r.lambda0-l[1])<1?'active':'')+'" onclick="STATE.redshift.lambda0='+l[1]+';MODULES.redshift.compute();renderLeftPanel()">'+l[0]+'</div>';
    });
    html+='</div>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Rest wavelength</span><span>'+fmt(r.lambda0,2)+' nm</span></div>';
    html+='<input type="range" min="100" max="800" step="0.5" value="'+r.lambda0+'" oninput="STATE.redshift.lambda0=parseFloat(this.value);MODULES.redshift.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Velocity</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Radial velocity</span><span>'+fmt(r.velocity,1)+' km/s</span></div>';
    html+='<input type="range" min="-100000" max="100000" step="100" value="'+r.velocity+'" oninput="STATE.redshift.velocity=parseFloat(this.value);MODULES.redshift.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="STATE.redshift.velocity=0;MODULES.redshift.compute();renderLeftPanel()">Stationary</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.redshift.velocity=30;MODULES.redshift.compute();renderLeftPanel()">Galaxy +30 km/s</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.redshift.velocity=1000;MODULES.redshift.compute();renderLeftPanel()">Distant galaxy 1000 km/s</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.redshift.velocity=30000;MODULES.redshift.compute();renderLeftPanel()">Quasar 10% c</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.redshift.velocity=-30;MODULES.redshift.compute();renderLeftPanel()">Blueshift -30 km/s</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Hubble constant</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>H₀</span><span>'+r.hubbleConst+' km/s/Mpc</span></div>';
    html+='<input type="range" min="50" max="100" step="1" value="'+r.hubbleConst+'" oninput="STATE.redshift.hubbleConst=parseFloat(this.value);renderLeftPanel()"></div>';
