    return html;
  },
  mathPanel:function(){
    var r=STATE.redshift;
    return '<div class="sec"><h4>Doppler Shift</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Classical (v << c):</b><br>'+
      'λ_obs = λ₀·(1 + v/c)<br>'+
      'z = Δλ/λ₀ = v/c<br><br>'+
      '<b class="text-c1">Relativistic:</b><br>'+
      '1 + z = √((1+β)/(1−β))<br>'+
      'β = v/c<br><br>'+
      'z > 0 → redshift (receding)<br>'+
      'z < 0 → blueshift (approaching)'+
      '</div></div>'+
      '<div class="sec"><h4>Cosmological Redshift</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'For distant galaxies, z is due to expansion of space, not motion through space.<br><br>'+
      'Hubble-Lemaître law:<br>'+
      'v = H₀·d<br><br>'+
      'H₀ ≈ 70 km/s/Mpc<br><br>'+
      'For z > 0.1, use relativistic + cosmological formulas.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">λ₀</span><span class="v">'+fmt(r.lambda0,2)+' nm</span></div>'+
      '<div class="row"><span class="k">λ_obs</span><span class="v">'+fmt(r.lambdaObs,2)+' nm</span></div>'+
      '<div class="row"><span class="k">z</span><span class="v">'+fmt(r.z,6)+'</span></div>'+
      '<div class="row"><span class="k">v</span><span class="v">'+fmt(r.velocity,1)+' km/s</span></div>'+
      '<div class="row"><span class="k">d (Hubble)</span><span class="v">'+fmt(hubbleDistance(r.z,r.hubbleConst)/PARSEC/1e6,2)+' Mpc</span></div>'+
      '</div></div>';
  }
});
function lineName(lam){
  if(Math.abs(lam-656.3)<2)return 'H-α';
  if(Math.abs(lam-486.1)<2)return 'H-β';
  if(Math.abs(lam-434.0)<2)return 'H-γ';
  if(Math.abs(lam-121.6)<2)return 'Lyman-α';
  if(Math.abs(lam-589.3)<2)return 'Na D';
  if(Math.abs(lam-393.4)<2)return 'Ca K';
  return 'custom';
}

/* ================================================================
   MODULE: GRAVITATIONAL LENSING
   ================================================================ */
registerModule('lensing',{
  title:'Gravitational Lensing',
  icon:'🔵',
  desc:'General relativity bends light. A massive foreground object creates multiple images and an Einstein ring.',
  init:function(){
    STATE.lensing.sourceX=0.4;
    STATE.lensing.sourceY=0.2;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#000205';
    ctx.fillRect(0,0,W,H);
    var l=STATE.lensing;
    /* Background starfield */
    drawStarfield(ctx,W,H,555);
    /* Observation grid overlay */
    if(l.showGrid){
      ctx.strokeStyle='rgba(64,192,255,.08)';
      ctx.lineWidth=1;
      var gridSpacing=40;
      for(var x=gridSpacing/2;x<W;x+=gridSpacing){
        ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
      }
      for(var y=gridSpacing/2;y<H;y+=gridSpacing){
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      }
    }
    var cx=W/2,cy=H/2;
    /* Einstein radius (scaled) */
    var thetaE=Math.sqrt(l.mass)*0.3; /* normalized */
    var Re=thetaE*Math.min(W,H);
    /* Lensing visualization: for each pixel we compute the deflection */
    /* For performance, we draw source points shifted by deflection */
    var numSources=6;
    for(var i=0;i<numSources;i++){
      var angle=(i/numSources)*Math.PI*2+l.sourceAngle||0;
      /* Source positions (in source plane) */
      var srcX=l.sourceX+Math.cos(angle)*0.1;
      var srcY=l.sourceY+Math.sin(angle)*0.1;
      /* For lensing: we image the source through the lens */
      /* Lens equation: β = θ - α(θ) = θ - θE²/θ */
      /* Solve for θ given β: quadratic */
      var betaX=srcX,betaY=srcY;
      var betaMag=Math.hypot(betaX,betaY);
      if(betaMag<thetaE){
        /* Two images — ring forms */
        var thetaPlus=(betaMag+Math.sqrt(betaMag*betaMag+4*thetaE*thetaE))/2;
        var thetaMinus=(betaMag-Math.sqrt(betaMag*betaMag+4*thetaE*thetaE))/2;
        var dirX=betaMag>1e-6?betaX/betaMag:1;
        var dirY=betaMag>1e-6?betaY/betaMag:0;
        /* Image positions */
        drawSource(ctx,cx+dirX*thetaPlus*W*0.4,cy+dirY*thetaPlus*H*0.4,'#40c0ff',thetaPlus*Re*0.2);
        drawSource(ctx,cx+dirX*Math.abs(thetaMinus)*W*0.4,cy+dirY*Math.abs(thetaMinus)*H*0.4,'#40c0ff',thetaMinus*Re*0.2);
      } else {
        /* Single image */
        var theta=betaMag+thetaE*thetaE/betaMag;
        var dirX2=betaX/betaMag,dirY2=betaY/betaMag;
        drawSource(ctx,cx+dirX2*theta*W*0.4,cy+dirY2*theta*H*0.4,'#40c0ff',theta*Re*0.15);
      }
    }
    /* Alternative: draw a single strong lens system with visible Einstein ring */
    /* Source at position */
    var sx=cx+l.sourceX*W*0.4;
    var sy=cy+l.sourceY*H*0.4;
    var sBeta=Math.hypot(l.sourceX,l.sourceY);
    if(sBeta<thetaE){
      /* Draw Einstein ring */
      ctx.strokeStyle='#40c0ff';
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.arc(cx,cy,thetaE*W*0.4,0,Math.PI*2);
      ctx.stroke();
      /* Ring glow */
      ctx.strokeStyle='rgba(64,192,255,.3)';
      ctx.lineWidth=12;
      ctx.beginPath();
      ctx.arc(cx,cy,thetaE*W*0.4,0,Math.PI*2);
      ctx.stroke();
    }
    /* Two arcs (double image) */
    if(sBeta<thetaE*0.9&&sBeta>0.05){
      var dirX3=l.sourceX/sBeta,dirY3=l.sourceY/sBeta;
      var thetaP=(sBeta+Math.sqrt(sBeta*sBeta+4*thetaE*thetaE))/2;
      var thetaM=(sBeta-Math.sqrt(sBeta*sBeta+4*thetaE*thetaE))/2;
      /* Image 1 */
      ctx.fillStyle='#ffe040';
      ctx.beginPath();
      ctx.arc(cx+dirX3*thetaP*W*0.4,cy+dirY3*thetaP*H*0.4,10,0,Math.PI*2);
      ctx.fill();
      /* Image 2 (opposite side) */
      ctx.fillStyle='#ffe040';
      ctx.beginPath();
      ctx.arc(cx-dirX3*Math.abs(thetaM)*W*0.4,cy-dirY3*Math.abs(thetaM)*H*0.4,8,0,Math.PI*2);
      ctx.fill();
    }
    /* Lens (foreground galaxy/cluster) */
    var lensGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,40);
    lensGrad.addColorStop(0,'#ffe060');
    lensGrad.addColorStop(0.3,'#ffc04080');
    lensGrad.addColorStop(1,'rgba(255,192,64,0)');
    ctx.fillStyle=lensGrad;
    ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fill();
    /* Center marker */
    ctx.strokeStyle='rgba(255,192,64,.6)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.stroke();
    /* Background source (unlensed position) */
    if(l.sourceX!==0||l.sourceY!==0){
      ctx.fillStyle='rgba(64,192,255,.6)';
      ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#40c0ff';
      ctx.lineWidth=1.5;
      ctx.stroke();
      ctx.fillStyle='rgba(64,192,255,.7)';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText('source',sx,sy-10);
    }
    /* Info */
    ctx.fillStyle='rgba(6,10,24,.85)';
    ctx.strokeStyle='rgba(255,192,64,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,140,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffc040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('GRAVITATIONAL LENS',32,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Lens mass: '+fmt(l.mass,2)+' × 10¹² M☉',32,66);
    ctx.fillText('Source offset: '+fmt(Math.hypot(l.sourceX,l.sourceY),2),32,86);
    ctx.fillText('θ_E: '+fmt(thetaE*57.3,3)+'°',32,106);
    ctx.fillStyle=thetaE>Math.hypot(l.sourceX,l.sourceY)?'#40ff90':'#586890';
    ctx.fillText(thetaE>Math.hypot(l.sourceX,l.sourceY)?'✓ Ring visible':'○ No ring',32,126);
    ctx.fillStyle='#98a8d8';
    ctx.font='10px monospace';
    ctx.fillText('Drag source • click to move lens',32,150);
    setStatsHTML(
      '<div>Mass: '+fmt(l.mass,2)+'×10¹² M☉</div>'+
      '<div>Source offset: '+fmt(Math.hypot(l.sourceX,l.sourceY),2)+'</div>'+
      '<div>θ_E: '+fmt(thetaE,3)+'</div>'
    );
    updateBadge('🔵 Gravitational Lensing · M='+fmt(l.mass,2)+'×10¹² M☉');
    $('sbMode').textContent='Lensing';
    $('sbVal').textContent='θ_E='+fmt(thetaE,3);
  },
  onDown:function(p){
    var l=STATE.lensing;
    var cx=CANV.W/2,cy=CANV.H/2;
    /* Check if click near source */
    var sx=cx+l.sourceX*CANV.W*0.4;
    var sy=cy+l.sourceY*CANV.H*0.4;
    if(Math.hypot(p.x-sx,p.y-sy)<20){
      l.drag='source';
    } else {
      /* Move lens */
      l.drag='lens';
    }
  },
  onMove:function(p){
    var l=STATE.lensing;
    if(!INPUT.down||!l.drag)return;
    var cx=CANV.W/2,cy=CANV.H/2;
    if(l.drag==='source'){
      l.sourceX=clamp((p.x-cx)/(CANV.W*0.4),-1,1);
      l.sourceY=clamp((p.y-cy)/(CANV.H*0.4),-1,1);
    }
  },
  onUp:function(){STATE.lensing.drag=null;},
  controls:function(){
    var l=STATE.lensing;
    var html='';
    html+='<div class="sec"><h4>Lens mass</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Mass (×10¹² M☉)</span><span>'+fmt(l.mass,2)+'</span></div>';
    html+='<input type="range" min="0.1" max="10" step="0.1" value="'+l.mass+'" oninput="STATE.lensing.mass=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Source position</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>X offset</span><span>'+fmt(l.sourceX,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.02" value="'+l.sourceX+'" oninput="STATE.lensing.sourceX=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Y offset</span><span>'+fmt(l.sourceY,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.02" value="'+l.sourceY+'" oninput="STATE.lensing.sourceY=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Einstein ring</span><div class="chip '+(l.showEinsteinRing?'active':'')+'" onclick="STATE.lensing.showEinsteinRing=!STATE.lensing.showEinsteinRing;renderLeftPanel()">'+(l.showEinsteinRing?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Grid</span><div class="chip '+(l.showGrid?'active':'')+'" onclick="STATE.lensing.showGrid=!STATE.lensing.showGrid;renderLeftPanel()">'+(l.showGrid?'ON':'OFF')+'</div></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="STATE.lensing.sourceX=0;STATE.lensing.sourceY=0;STATE.lensing.mass=1;renderLeftPanel()">Perfect Einstein ring</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.lensing.sourceX=0.3;STATE.lensing.sourceY=0.15;STATE.lensing.mass=2;renderLeftPanel()">Double image</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.lensing.sourceX=0.7;STATE.lensing.sourceY=0.3;STATE.lensing.mass=1.5;renderLeftPanel()">Single image</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.lensing.sourceX=0.05;STATE.lensing.sourceY=0;STATE.lensing.mass=5;renderLeftPanel()">Strong lens</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var l=STATE.lensing;
    var thetaE=Math.sqrt(l.mass)*0.3;
    return '<div class="sec"><h4>Lens Equation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'β = θ − α(θ)<br><br>'+
      'β = source position (angular)<br>'+
      'θ = image position<br>'+
      'α(θ) = deflection angle<br><br>'+
      'For a point mass: α(θ) = θE²/θ<br><br>'+
      'Substituting gives quadratic:<br>'+
      'θ² − βθ − θE² = 0<br><br>'+
      'θ± = (β ± √(β² + 4θE²))/2'+
      '</div></div>'+
      '<div class="sec"><h4>Einstein Radius</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'θE = √(4GM/c² · Dls/(Dl·Ds))<br><br>'+
      'M = lens mass<br>'+
      'Dl, Ds, Dls = angular diameter distances<br><br>'+
      'When source is directly behind lens (β=0), the source appears as a perfect ring. This is Einstein\'s prediction, confirmed by observation.'+
      '</div></div>'+
      '<div class="sec"><h4>Applications</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '• <b>Weighing galaxies</b> — including dark matter<br>'+
      '• <b>Magnification</b> — observing distant galaxies<br>'+
      '• <b>Cosmology</b> — measuring H₀<br>'+
      '• <b>Exoplanets</b> — microlensing events<br>'+
      '• <b>Tests of GR</b> — light bending at the Sun<br><br>'+
      'Current θE ≈ '+fmt(thetaE,4)+' (normalized)'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Mass</span><span class="v">'+fmt(l.mass,3)+'×10¹² M☉</span></div>'+
      '<div class="row"><span class="k">Source β</span><span class="v">'+fmt(Math.hypot(l.sourceX,l.sourceY),3)+'</span></div>'+
      '<div class="row"><span class="k">Ring?</span><span class="v">'+(thetaE>Math.hypot(l.sourceX,l.sourceY)?'yes':'no')+'</span></div>'+
      '</div></div>';
  }
});
function drawSource(ctx,x,y,color,r){
  r=Math.max(6,r);
  var g=ctx.createRadialGradient(x,y,0,x,y,r*2);
  g.addColorStop(0,color);
  g.addColorStop(0.3,color+'80');
  g.addColorStop(1,color+'00');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,r*2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
</script>
<script>
/* ================================================================
   MODULE: SKY MAP / CONSTELLATIONS
   ================================================================ */
registerModule('sky',{
  title:'Sky Map',
  icon:'✨',
  desc:'Real bright stars plotted on an equatorial projection. Filter by magnitude, spectral class or constellation region.',
  init:function(){
    /* Nothing to init — STARS is a constant */
  },
  tick:function(dt){STATE.time+=dt;},
  raToX:function(ra,W){
    /* RA in degrees, convert to x on plot (0h at left) */
    return (ra/360)*W;
  },
  decToY:function(dec,H){
    /* Dec in degrees, +90 at top, -90 at bottom */
    return (90-dec)/180*H;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#000205';
    ctx.fillRect(0,0,W,H);
    var pad=50;
    var plotX=pad,plotY=pad;
    var plotW=W-pad*2,plotH=H-pad*2;
    /* Starfield noise */
    drawStarfield(ctx,W,H,999);
    /* Background grid */
    ctx.strokeStyle='rgba(64,192,255,.1)';
    ctx.lineWidth=1;
    for(var ra=0;ra<360;ra+=30){
      var x=plotX+this.raToX(ra,plotW);
      ctx.beginPath();ctx.moveTo(x,plotY);ctx.lineTo(x,plotY+plotH);ctx.stroke();
    }
    for(var dec=-60;dec<=60;dec+=30){
      var y=plotY+this.decToY(dec,plotH);
      ctx.beginPath();ctx.moveTo(plotX,y);ctx.lineTo(plotX+plotW,y);ctx.stroke();
    }
    /* Milky Way band (approximate) */
    ctx.strokeStyle='rgba(128,96,192,.15)';
    ctx.lineWidth=20;
    ctx.beginPath();
    for(var i=0;i<=100;i++){
      var raW=i/100*360;
      var decW=Math.sin(raW*Math.PI/180)*20;
      var xw=plotX+this.raToX(raW,plotW);
      var yw=plotY+this.decToY(decW,plotH);
      if(i===0)ctx.moveTo(xw,yw);else ctx.lineTo(xw,yw);
    }
    ctx.stroke();
    /* Axes labels */
    ctx.fillStyle='rgba(152,168,216,.7)';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    for(var raL=0;raL<=360;raL+=60){
      var xL=plotX+this.raToX(raL,plotW);
      ctx.fillText((raL/15)+'h',xL,plotY+plotH+16);
    }
    ctx.textAlign='right';
    for(var decL=-60;decL<=60;decL+=30){
      var yL=plotY+this.decToY(decL,plotH);
      ctx.fillText(decL+'°',plotX-8,yL+4);
    }
    ctx.fillStyle='rgba(152,168,216,.9)';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Right Ascension',plotX+plotW/2,plotY+plotH+34);
    ctx.save();
    ctx.translate(18,plotY+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Declination',0,0);
    ctx.restore();
    /* Equator line */
    var eqY=plotY+this.decToY(0,plotH);
    ctx.strokeStyle='rgba(255,192,64,.4)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(plotX,eqY);ctx.lineTo(plotX+plotW,eqY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ffc040';
    ctx.font='10px monospace';
    ctx.textAlign='left';
    ctx.fillText('Celestial equator',plotX+8,eqY-6);
    /* Draw stars */
    STARS.forEach(function(star){
      var x=plotX+this.raToX(star.ra,plotW);
      var y=plotY+this.decToY(star.dec,plotH);
      if(x<plotX||x>plotX+plotW||y<plotY||y>plotY+plotH)return;
      /* Star size from magnitude */
      var size=Math.max(2,6-star.mag*1.2);
      /* Color from spectral type */
      var color=this.spectralColor(star.spectral);
      /* Glow */
      var g=ctx.createRadialGradient(x,y,0,x,y,size*3);
      g.addColorStop(0,color);
      g.addColorStop(0.3,color+'80');
      g.addColorStop(1,color+'00');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,size*3,0,Math.PI*2);ctx.fill();
      /* Core */
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.5)';
      ctx.lineWidth=0.5;
      ctx.stroke();
      /* Label for bright stars */
      if(star.mag<1.5){
        ctx.fillStyle='rgba(224,232,255,.85)';
        ctx.font='9px monospace';
        ctx.textAlign='left';
        ctx.fillText(star.name,x+size+2,y+3);
      }
    },this);
    /* Info box */
    ctx.fillStyle='rgba(6,10,24,.85)';
    ctx.strokeStyle='rgba(255,192,64,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffc040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('SKY MAP',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e8ff';
    ctx.fillText('Stars: '+STARS.length,W-248,64);
    ctx.fillText('Brightest: Sirius (-1.46)',W-248,84);
    ctx.fillText('Spectral: OBAFGKM',W-248,104);
    /* Spectral legend */
    var spectralColors=['#9bb0ff','#aabfff','#cad7ff','#f8f7ff','#fff4ea','#ffd2a1','#ffcc6f'];
    var spectralLabels=['O','B','A','F','G','K','M'];
    for(var si=0;si<7;si++){
      ctx.fillStyle=spectralColors[si];
      ctx.beginPath();ctx.arc(W-248+si*32,116,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e0e8ff';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(spectralLabels[si],W-248+si*32,132);
    }
    setStatsHTML(
      '<div>Stars: '+STARS.length+'</div>'+
      '<div>Range: all sky</div>'+
      '<div>Brightest: Sirius</div>'
    );
    updateBadge('✨ Sky Map · '+STARS.length+' bright stars');
    $('sbMode').textContent='Sky Map';
    $('sbObjs').textContent=STARS.length;
  },
  spectralColor:function(spectral){
    var c=spectral.charAt(0);
    if(c==='O')return '#9bb0ff';
    if(c==='B')return '#aabfff';
    if(c==='A')return '#cad7ff';
    if(c==='F')return '#f8f7ff';
    if(c==='G')return '#fff4ea';
    if(c==='K')return '#ffd2a1';
    if(c==='M')return '#ffcc6f';
    return '#ffffff';
  },
  onDown:function(p){
    /* Find nearest star and show details */
    var pad=50;
    var plotX=pad,plotY=pad;
    var plotW=CANV.W-pad*2,plotH=CANV.H-pad*2;
    var best=null,bestDist=20;
    STARS.forEach(function(star){
      var x=plotX+this.raToX(star.ra,plotW);
      var y=plotY+this.decToY(star.dec,plotH);
      var d=Math.hypot(x-p.x,y-p.y);
      if(d<bestDist){bestDist=d;best=star;}
    },this);
    if(best){
      openModal('⭐ '+best.name,
        '<div style="text-align:center;padding:20px">'+
        '<div style="font-size:4rem;color:'+this.spectralColor(best.spectral)+';filter:drop-shadow(0 0 20px '+this.spectralColor(best.spectral)+')">★</div>'+
        '<h3 style="color:var(--c1);margin:16px 0;font-family:var(--disp);letter-spacing:2px">'+best.name.toUpperCase()+'</h3>'+
        '<div class="kv" style="max-width:400px;margin:0 auto;text-align:left">'+
        '<div class="row"><span class="k">RA</span><span class="v">'+fmt(best.ra/15,3)+' h</span></div>'+
        '<div class="row"><span class="k">Dec</span><span class="v">'+fmt(best.dec,3)+'°</span></div>'+
        '<div class="row"><span class="k">Magnitude</span><span class="v">'+fmt(best.mag,2)+'</span></div>'+
        '<div class="row"><span class="k">Spectral type</span><span class="v">'+best.spectral+'</span></div>'+
        '<div class="row"><span class="k">Distance</span><span class="v">'+fmt(best.dist,1)+' ly</span></div>'+
        '<div class="row"><span class="k">Absolute mag</span><span class="v">'+fmt(best.mag-5*Math.log10(best.dist/10),2)+'</span></div>'+
        '</div>'+
        '</div>',
        '<button class="btn primary" onclick="closeModal()">Close</button>');
    }
  },
  controls:function(){
    var html='';
    html+='<div class="sec"><h4>Information</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
    'Brightest stars from the Hipparcos catalog. Click any star for details.<br><br>'+
    '<b class="text-c1">Right Ascension:</b> celestial longitude (0-24h)<br>'+
    '<b class="text-c1">Declination:</b> celestial latitude (-90° to +90°)<br>'+
    '<b class="text-c1">Magnitude:</b> apparent brightness (lower = brighter)<br>'+
    '<b class="text-c1">Spectral type:</b> O-B-A-F-G-K-M'+
    '</div></div>';
    html+='<div class="sec"><h4>Top 5 brightest</h4>';
    var sorted=STARS.slice().sort(function(a,b){return a.mag-b.mag}).slice(0,5);
    sorted.forEach(function(s){
      html+='<div style="padding:4px 6px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.6rem;display:flex;justify-content:space-between">'+
      '<span style="color:var(--c1)">'+s.name+'</span>'+
      '<span style="color:var(--c3)">mag '+s.mag.toFixed(2)+'</span>'+
      '</div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Celestial Coordinates</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Like latitude/longitude on Earth, but projected onto the sky:<br><br>'+
      '<b class="text-c1">RA (Right Ascension):</b><br>'+
      'Angle from vernal equinox along celestial equator<br>'+
      'Measured in hours (0-24h), where 1h = 15°<br><br>'+
      '<b class="text-c1">Dec (Declination):</b><br>'+
      'Angle from celestial equator<br>'+
      '+90° = North Celestial Pole<br>'+
      '-90° = South Celestial Pole'+
      '</div></div>'+
      '<div class="sec"><h4>Magnitude Scale</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Apparent magnitude m:<br>'+
      'm₁ − m₂ = −2.5·log₁₀(F₁/F₂)<br><br>'+
      'Difference of 5 magnitudes = 100× brightness<br>'+
      'Each magnitude = 2.512×<br><br>'+
      'Sirius: −1.46 (brightest)<br>'+
      'Vega: 0.03 (reference)<br>'+
      'Naked eye limit: ~6.5<br>'+
      'Hubble limit: ~30<br><br>'+
      'Distance modulus:<br>'+
      'm − M = 5·log₁₀(d/10pc)'+
      '</div></div>'+
      '<div class="sec"><h4>Spectral Classification</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<span style="color:#9bb0ff">O — 30,000+ K, blue, ionized He</span><br>'+
      '<span style="color:#aabfff">B — 10,000–30,000 K, blue-white, He</span><br>'+
      '<span style="color:#cad7ff">A — 7,500–10,000 K, white, H lines</span><br>'+
      '<span style="color:#f8f7ff">F — 6,000–7,500 K, yellow-white, metals</span><br>'+
      '<span style="color:#fff4ea">G — 5,200–6,000 K, yellow, Sun-like</span><br>'+
      '<span style="color:#ffd2a1">K — 3,700–5,200 K, orange, Ca lines</span><br>'+
      '<span style="color:#ffcc6f">M — 2,500–3,700 K, red, TiO bands</span>'+
      '</div></div>';
  }
});

/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'solar',icon:'🪐',label:'Solar'},
  {key:'hr',icon:'⭐',label:'HR'},
  {key:'transit',icon:'🌑',label:'Transit'},
  {key:'planck',icon:'🌡️',label:'Planck'},
  {key:'redshift',icon:'🔴',label:'Redshift'},
  {key:'lensing',icon:'🔵',label:'Lensing'},
  {key:'sky',icon:'✨',label:'Sky'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>'+
      '<div class="sec"><h4>Physical constants</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">G</span><span class="v">6.674×10⁻¹¹</span></div>'+
      '<div class="row"><span class="k">c</span><span class="v">299792458 m/s</span></div>'+
      '<div class="row"><span class="k">h</span><span class="v">6.626×10⁻³⁴ J·s</span></div>'+
      '<div class="row"><span class="k">k_B</span><span class="v">1.381×10⁻²³ J/K</span></div>'+
      '<div class="row"><span class="k">σ</span><span class="v">5.670×10⁻⁸</span></div>'+
      '<div class="row"><span class="k">AU</span><span class="v">1.496×10¹¹ m</span></div>'+
      '<div class="row"><span class="k">pc</span><span class="v">3.086×10¹⁶ m</span></div>'+
      '<div class="row"><span class="k">M☉</span><span class="v">1.989×10³⁰ kg</span></div>'+
      '<div class="row"><span class="k">L☉</span><span class="v">3.828×10²⁶ W</span></div>'+
      '<div class="row"><span class="k">R☉</span><span class="v">6.957×10⁸ m</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c4)':'var(--c2)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Playing':'Paused','info',1000);
}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
    toast('Reset','success',1000);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['cosmos','observatory','paper'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    solar:{timeYears:STATE.solar.timeYears,scale:STATE.solar.scale,zoom:STATE.solar.zoom},
    hr:{highlight:STATE.hr.highlight,stars:STATE.hr.stars.length},
    transit:{starTemp:STATE.transit.starTemp,planetRadius:STATE.transit.planetRadius,period:STATE.transit.period},
    planck:{temp:STATE.planck.temp},
    redshift:{velocity:STATE.redshift.velocity,lambda0:STATE.redshift.lambda0},
    lensing:{mass:STATE.lensing.mass}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='astra-config.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Config exported','success');
}

    '<b class="text-c1">⭐ HR Diagram</b> — luminosity vs temperature, spectral classes<br>'+
    '<b class="text-c1">🌑 Transit</b> — exoplanet light curves and depth<br>'+

    '<b class="text-c1">✨ Sky Map</b> — bright stars, RA/Dec, spectral types'+

    '<div class="sec"><h4>⌨️ Shortcuts</h4><div class="text-xs" style="font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='7'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Loading Kepler orbital solver...',
  'Compiling Planck radiation function...',
  'Initializing relativistic Doppler engine...',
  'Preparing gravitational lensing equations...',
  'Populating star catalog...',
  'Computing Wien peak constants...',
  'Calibrating stellar color temperature...',
  'Ready.'
];
function bootSequence(){
  /* Create random stars */
  var sky=$('bootSky');
  for(var i=0;i<80;i++){
    var star=document.createElement('div');
    star.className='boot-star';
    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';
    var size=Math.random()*2+1;
    star.style.width=size+'px';
    star.style.height=size+'px';
    star.style.animationDelay=Math.random()*3+'s';
    sky.appendChild(star);
  }
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('ASTRA ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('ASTRA initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
