<!DOCTYPE html>
<html lang="en" data-theme="forge">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0818">
<title>NEURAL FORGE — Deep Learning Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#0a0818;--bg2:#100c24;--bg3:#181234;--bg4:#201848;
  --panel:#0c0a20;--panel2:#141028;--panel3:#1c1838;--panel4:#262050;
  --bd:#1e1a40;--bd2:#302a60;--bd3:#483c88;
  --tx:#e8e4ff;--tx2:#b0a8e0;--tx3:#7068a8;--mu:#484878;
  --c1:#00d0ff;--c1h:#80e4ff;--c1l:#00a0c8;
  --c2:#b060ff;--c2h:#d0a0ff;--c2l:#7030c0;
  --c3:#40ff90;--c3h:#80ffc0;--c3l:#20c060;
  --c4:#ff3b8c;--c4h:#ff90b8;--c4l:#c01860;
  --c5:#ffd040;--c5h:#ffe890;--c5l:#c09000;
  --c6:#ff7020;--c6h:#ffb080;--c6l:#c04800;
  --c7:#40d0d0;--c7h:#80e8e8;--c7l:#20a0a0;
  --c8:#ff40b0;--c8h:#ff80d0;--c8l:#c02080;
  --ok:#40ff90;--warn:#ffd040;--err:#ff3b8c;--info:#00d0ff;
  --g1:linear-gradient(135deg,#00d0ff,#b060ff);
  --g2:linear-gradient(135deg,#40ff90,#00d0ff);
  --g3:linear-gradient(135deg,#ff3b8c,#ffd040);
  --gHolo:linear-gradient(120deg,#00d0ff,#b060ff,#ff40b0,#40ff90,#ffd040,#00d0ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --sh2:0 16px 48px rgba(0,0,0,.9);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="midnight"]{--bg:#000;--bg2:#080810;--bg3:#101020;--panel:#080810;--panel2:#101020;--panel3:#181828;
  --bd:#202030;--bd2:#303048;--tx:#e0e0f0;--tx2:#a0a0c0;--tx3:#606078;
  --c1:#40a0ff;--c2:#a060ff;--c3:#40d080;--c4:#ff4080;
  --g1:linear-gradient(135deg,#40a0ff,#a060ff)}
[data-theme="paper"]{--bg:#f5f0e8;--bg2:#e8e2d4;--bg3:#dcd4c4;--panel:#fff;--panel2:#f8f4ea;--panel3:#ece4d4;--panel4:#dcd0b8;
  --bd:#c8c0a8;--bd2:#a89880;--tx:#1a1420;--tx2:#4a4050;--tx3:#8a8090;
  --c1:#0080d0;--c2:#7030c0;--c3:#00a050;--c4:#c01848;
  --g1:linear-gradient(135deg,#0080d0,#7030c0)}
[data-theme="matrix"]{--bg:#000600;--bg2:#001200;--bg3:#001e00;--panel:#001800;--panel2:#002800;
  --bd:#006400;--bd2:#009000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#40ffc0;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#0a0818;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-net{position:relative;width:200px;height:120px;margin-bottom:20px}
.boot-net svg{width:100%;height:100%}
.boot-net .node{fill:#00d0ff;opacity:0}
.boot-net .edge{stroke:#b060ff;stroke-width:0.5;opacity:0;stroke-dasharray:2,3}
.boot-net .n0{animation:nodeIn .8s ease-out 0.0s forwards}
.boot-net .n1{animation:nodeIn .8s ease-out 0.15s forwards}
.boot-net .n2{animation:nodeIn .8s ease-out 0.3s forwards}
.boot-net .n3{animation:nodeIn .8s ease-out 0.45s forwards}
.boot-net .e0{animation:edgeIn 1s ease-out 0.6s forwards}
.boot-net .e1{animation:edgeIn 1s ease-out 0.8s forwards}
.boot-net .e2{animation:edgeIn 1s ease-out 1s forwards}
@keyframes nodeIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes edgeIn{from{opacity:0}to{opacity:0.6}}
.boot-logo{font-family:var(--disp);font-size:2.6rem;font-weight:900;letter-spacing:10px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.68rem;color:#00d0ff;letter-spacing:8px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#181234;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #00d0ff}
.boot-pct{font-size:.68rem;color:#00d0ff;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#7068a8;text-align:left;width:min(420px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}.boot-log .warn{color:#ffd040}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.95rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.7rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0818;box-shadow:0 0 14px rgba(0,208,255,.35)}
.tb-tab .tab-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g2);color:#0a0818;border-color:transparent}
.tb-status{font-family:var(--mono);font-size:.65rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:700}
.tb-status.training{border-color:var(--c3);color:var(--c3);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:270px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#vizGrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--bd);overflow:hidden}
.viz-cell{position:relative;background:var(--bg2);overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0}
.viz-head{padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;font-size:.6rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.viz-head .badge{background:var(--panel3);padding:1px 8px;border-radius:8px;font-size:.55rem;color:var(--c1)}
.viz-body{flex:1;position:relative;overflow:hidden;background:#02020a}
.viz-canvas{position:absolute;inset:0;width:100%;height:100%}

#rightPanel{width:270px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}

/* ============ STATUS BAR ============ */
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:16px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#0a0818;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.62rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.7rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,208,255,.15)}
.ctrl textarea{resize:vertical;min-height:80px;line-height:1.5;font-size:.62rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.7rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#0a0818;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(0,208,255,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:rgba(255,59,140,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.62rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ============ LAYER EDITOR ============ */
.layer-row{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);margin-bottom:4px;transition:var(--t1)}
.layer-row:hover{border-color:var(--c1)}
.layer-row .lr-idx{font-family:var(--mono);font-size:.6rem;color:var(--tx3);min-width:16px;font-weight:700}
.layer-row .lr-icon{font-size:.9rem}
.layer-row .lr-info{flex:1;font-family:var(--mono);font-size:.65rem}
.layer-row .lr-info .lr-name{color:var(--c1);font-weight:700}
.layer-row .lr-info .lr-det{color:var(--tx3);font-size:.58rem}
.layer-row .lr-btn{width:18px;height:18px;border-radius:3px;background:transparent;color:var(--tx3);cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.layer-row .lr-btn:hover{background:var(--panel4);color:var(--err)}
.add-layer-row{display:flex;gap:4px;margin-top:8px;align-items:stretch}
.add-layer-row select{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 8px;color:var(--tx);font-size:.65rem;font-family:var(--mono)}
.add-layer-row input{width:60px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 8px;color:var(--tx);font-size:.65rem;font-family:var(--mono);text-align:center}

/* ============ DATA TABLE ============ */
.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* ============ HELPERS ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;justify-content:center;align-items:center}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.62rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}
.kv{font-family:var(--mono);font-size:.65rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}
.kv .v{color:var(--c1)}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1000px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ============ STAT TILES ============ */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:1rem;font-weight:800;color:var(--c1);line-height:1.1}
.stat .sl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:3px}

@media(max-width:900px){#leftPanel{width:220px}#rightPanel{width:230px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}#vizGrid{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-net">
    <svg viewBox="0 0 200 120">
      <g>
        <line class="edge e0" x1="30" y1="60" x2="80" y2="30"/>
        <line class="edge e0" x1="30" y1="60" x2="80" y2="60"/>
        <line class="edge e0" x1="30" y1="60" x2="80" y2="90"/>
        <line class="edge e1" x1="80" y1="30" x2="130" y2="45"/>
        <line class="edge e1" x1="80" y1="30" x2="130" y2="75"/>
        <line class="edge e1" x1="80" y1="60" x2="130" y2="45"/>
        <line class="edge e1" x1="80" y1="60" x2="130" y2="75"/>
        <line class="edge e1" x1="80" y1="90" x2="130" y2="45"/>
        <line class="edge e1" x1="80" y1="90" x2="130" y2="75"/>
        <line class="edge e2" x1="130" y1="45" x2="180" y2="60"/>
        <line class="edge e2" x1="130" y1="75" x2="180" y2="60"/>
      </g>
      <circle class="node n0" cx="30" cy="60" r="6"/>
      <circle class="node n1" cx="80" cy="30" r="6"/>
      <circle class="node n1" cx="80" cy="60" r="6"/>
      <circle class="node n1" cx="80" cy="90" r="6"/>
      <circle class="node n2" cx="130" cy="45" r="6"/>
      <circle class="node n2" cx="130" cy="75" r="6"/>
      <circle class="node n3" cx="180" cy="60" r="6"/>
    </svg>
  </div>
  <div class="boot-logo">NEURAL</div>
  <div class="boot-sub">DEEP LEARNING STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('arch')">NEURAL FORGE</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">READY</div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnTrain" onclick="toggleTraining()" title="Train (Space)">▶</button>
      <button class="tb-btn" onclick="resetNetwork()" title="Reset weights">↺</button>
      <button class="tb-btn" onclick="stepEpoch()" title="Train 1 epoch">⏭</button>
      <button class="tb-btn" onclick="saveModel()" title="Save model">💾</button>
      <button class="tb-btn" onclick="loadModel()" title="Load model">📂</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left panel">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right panel">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?3:d;return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})
function gauss(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ================================================================
   MATRIX OPERATIONS (flat Float32Array)
   ================================================================ */
function matRandom(rows,cols,scale){
  scale=scale||0.1;
  var m=new Float32Array(rows*cols);
  var xavier=Math.sqrt(1/Math.max(1,rows+cols));
  for(var i=0;i<m.length;i++)m[i]=gauss()*xavier*2;
  return m;
}
function matZeros(rows,cols){return new Float32Array(rows*cols)}
function matVecMul(M,v,rows,cols,out){
  out=out||new Float32Array(rows);
  for(var i=0;i<rows;i++){
    var sum=0;
    var base=i*cols;
    for(var j=0;j<cols;j++)sum+=M[base+j]*v[j];
    out[i]=sum;
  }
  return out;
}
function matMul(A,B,ar,ac,bc){
  /* A is ar×ac, B is ac×bc, result ar×bc */
  var C=new Float32Array(ar*bc);
  for(var i=0;i<ar;i++){
    for(var k=0;k<ac;k++){
      var aik=A[i*ac+k];
      var bBase=k*bc;
      var cBase=i*bc;
      for(var j=0;j<bc;j++)C[cBase+j]+=aik*B[bBase+j];
    }
  }
  return C;
}
function matTranspose(A,rows,cols){
  var T=new Float32Array(rows*cols);
  for(var i=0;i<rows;i++)for(var j=0;j<cols;j++)T[j*rows+i]=A[i*cols+j];
  return T;
}
function vecAdd(a,b,out){
  out=out||new Float32Array(a.length);
  for(var i=0;i<a.length;i++)out[i]=a[i]+b[i];
  return out;
}

/* ================================================================
   ACTIVATION FUNCTIONS
   ================================================================ */
var ACT={
  relu:{name:'ReLU',icon:'⚡',
    f:function(x){return x>0?x:0},
    fp:function(x){return x>0?1:0}},
  leakyrelu:{name:'LeakyReLU',icon:'↗',
    f:function(x){return x>0?x:0.01*x},
    fp:function(x){return x>0?1:0.01}},
  sigmoid:{name:'Sigmoid',icon:'∿',
    f:function(x){return 1/(1+Math.exp(-clamp(x,-30,30)))},
    fp:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return s*(1-s)}},
  tanh:{name:'Tanh',icon:'∼',
    f:function(x){return Math.tanh(x)},
    fp:function(x){var t=Math.tanh(x);return 1-t*t}},
  elu:{name:'ELU',icon:'⋀',
    f:function(x){return x>0?x:Math.exp(clamp(x,-30,0))-1},
    fp:function(x){return x>0?1:Math.exp(clamp(x,-30,0))}},
  linear:{name:'Linear',icon:'╱',
    f:function(x){return x},
    fp:function(x){return 1}},
  softmax:{name:'Softmax',icon:'◇',
    f:function(x){return x}, /* handled at layer level */
    fp:function(x){return 1}}
};

/* ================================================================
   LOSS FUNCTIONS
   ================================================================ */
var LOSS={
  mse:{name:'MSE',
    /* y: target, p: prediction; returns loss and gradient */
    loss:function(y,p){var s=0;for(var i=0;i<y.length;i++){var d=y[i]-p[i];s+=d*d;}return s/y.length},
    grad:function(y,p){var g=new Float32Array(y.length);for(var i=0;i<y.length;i++)g[i]=2*(p[i]-y[i])/y.length;return g}},
  crossentropy:{name:'Cross-Entropy',
    loss:function(y,p){var l=0;for(var i=0;i<y.length;i++){if(y[i]>0)l-=y[i]*Math.log(Math.max(p[i],1e-12));}return l},
    grad:function(y,p){var g=new Float32Array(y.length);for(var i=0;i<y.length;i++)g[i]=p[i]-y[i];return g}},
  bce:{name:'Binary CE',
    loss:function(y,p){var l=0;for(var i=0;i<y.length;i++){l-=y[i]*Math.log(Math.max(p[i],1e-12))+(1-y[i])*Math.log(Math.max(1-p[i],1e-12));}return l/y.length},
    grad:function(y,p){var g=new Float32Array(y.length);for(var i=0;i<y.length;i++)g[i]=(p[i]-y[i])/Math.max(p[i]*(1-p[i]),1e-12)/y.length;return g}}
};

/* ================================================================
   OPTIMIZERS
   ================================================================ */
function makeOptimizer(type,params,lr){
  var state={type:type,lr:lr,t:0,m:{},v:{}};
  /* params: array of {key, mat} references so we can track per-parameter state */
  params.forEach(function(p){
    state.m[p.key]=new Float32Array(p.mat.length);
    state.v[p.key]=new Float32Array(p.mat.length);
  });
  return state;
}
function optimizerStep(opt,params,grads){
  opt.t++;
  if(opt.type==='sgd'){
    params.forEach(function(p){
      var g=grads[p.key];
      for(var i=0;i<p.mat.length;i++)p.mat[i]-=opt.lr*g[i];
    });
  } else if(opt.type==='momentum'){
    var beta=0.9;
    params.forEach(function(p){
      var g=grads[p.key];
      var m=opt.m[p.key];
      for(var i=0;i<p.mat.length;i++){
        m[i]=beta*m[i]+(1-beta)*g[i];
        p.mat[i]-=opt.lr*m[i];
      }
    });
  } else if(opt.type==='rmsprop'){
    var beta2=0.999,eps=1e-8;
    params.forEach(function(p){
      var g=grads[p.key];
      var v=opt.v[p.key];
      for(var i=0;i<p.mat.length;i++){
        v[i]=beta2*v[i]+(1-beta2)*g[i]*g[i];
        p.mat[i]-=opt.lr*g[i]/(Math.sqrt(v[i])+eps);
      }
    });
  } else if(opt.type==='adam'){
    var b1=0.9,b2=0.999,eps2=1e-8;
    params.forEach(function(p){
      var g=grads[p.key];
      var m=opt.m[p.key],v=opt.v[p.key];
      for(var i=0;i<p.mat.length;i++){
        m[i]=b1*m[i]+(1-b1)*g[i];
        v[i]=b2*v[i]+(1-b2)*g[i]*g[i];
        var mh=m[i]/(1-Math.pow(b1,opt.t));
        var vh=v[i]/(1-Math.pow(b2,opt.t));
        p.mat[i]-=opt.lr*mh/(Math.sqrt(vh)+eps2);
      }
    });
  }
}

/* ================================================================
   NEURAL NETWORK
   ================================================================ */
function NeuralNet(){
  this.layers=[]; /* [{type, inSize, outSize, W, b, act, cache}] */
  this.loss='crossentropy';
  this.optimizer='adam';
  this.lr=0.01;
  this.optState=null;
  this.epoch=0;
  this.lossHistory=[];
  this.accHistory=[];
}

NeuralNet.prototype.addDense=function(inSize,outSize,activation){
  var W=matRandom(outSize,inSize);
  var b=new Float32Array(outSize);
  this.layers.push({
    type:'dense',
    inSize:inSize,
    outSize:outSize,
    W:W,
    b:b,
    act:activation||'relu',
    /* cache for backprop */
    zCache:null,
    aCache:null
  });
  this.optState=null;
};

NeuralNet.prototype.buildParams=function(){
  var params=[];
  this.layers.forEach(function(l,i){
    params.push({key:'W'+i,mat:l.W,shape:[l.outSize,l.inSize]});
    params.push({key:'b'+i,mat:l.b,shape:[l.outSize]});
  });
  return params;
};

NeuralNet.prototype.paramCount=function(){
  var n=0;
  this.layers.forEach(function(l){n+=l.W.length+l.b.length;});
  return n;
};

NeuralNet.prototype.forward=function(x,inference){
  var a=x;
  var isOutput=false;
  for(var li=0;li<this.layers.length;li++){
    var l=this.layers[li];
    var z=matVecMul(l.W,a,l.outSize,l.inSize);
    for(var i=0;i<z.length;i++)z[i]+=l.b[i];
    var act=ACT[l.act]||ACT.relu;
    var aNext;
    var softmaxApplied=false;
    if(l.act==='softmax'){
      /* Softmax with numerical stability */
      var maxZ=-Infinity;
      for(var i2=0;i2<z.length;i2++)if(z[i2]>maxZ)maxZ=z[i2];
      var expSum=0;
      aNext=new Float32Array(z.length);
      for(var i3=0;i3<z.length;i3++){
        var e=Math.exp(z[i3]-maxZ);
        aNext[i3]=e;expSum+=e;
      }
      for(var i4=0;i4<z.length;i4++)aNext[i4]/=expSum;
      softmaxApplied=true;
    } else {
      aNext=new Float32Array(z.length);
      for(var i5=0;i5<z.length;i5++)aNext[i5]=act.f(z[i5]);
    }
    if(!inference){
      l.zCache=z;
      l.aCache=a;
    }
    a=aNext;
  }
  return a;
};

NeuralNet.prototype.backward=function(x,y){
  var L=this.layers.length;
  /* Forward to get caches */
  var pred=this.forward(x,false);
  /* Compute output gradient */
  var lossFn=LOSS[this.loss]||LOSS.crossentropy;
  var lossVal=lossFn.loss(y,pred);
  var delta=lossFn.grad(y,pred); /* ∂L/∂a_out */
  /* If softmax output, combined gradient is already p-y (handled by CE) */
  var grads={};
  /* Walk backward */
  for(var li=L-1;li>=0;li--){
    var l=this.layers[li];
    var aPrev=l.aCache;
    /* Gradient w.r.t. W = delta ⊗ aPrev */
    var gW=new Float32Array(l.outSize*l.inSize);
    for(var oi=0;oi<l.outSize;oi++){
      var d=delta[oi];
      if(d===0)continue;
      var base=oi*l.inSize;
      for(var ii=0;ii<l.inSize;ii++)gW[base+ii]=d*aPrev[ii];
    }
    grads['W'+li]=gW;
    grads['b'+li]=delta.slice();
    /* Gradient w.r.t. input for previous layer */
    if(li>0){
      var prevDelta=new Float32Array(l.inSize);
      /* δ_prev = W^T · δ ⊙ σ'(z_prev) */
      for(var ii2=0;ii2<l.inSize;ii2++){
        var sum=0;
        for(var oi2=0;oi2<l.outSize;oi2++)sum+=l.W[oi2*l.inSize+ii2]*delta[oi2];
        prevDelta[ii2]=sum;
      }
      var prevLayer=this.layers[li-1];
      var prevAct=ACT[prevLayer.act]||ACT.relu;
      if(prevLayer.act!=='softmax'){
        for(var ii3=0;ii3<l.inSize;ii3++){
          prevDelta[ii3]*=prevAct.fp(prevLayer.zCache[ii3]);
        }
      }
      delta=prevDelta;
    }
  }
  return {loss:lossVal,pred:pred,grads:grads};
};

NeuralNet.prototype.initOptimizer=function(){
  if(!this.optState||this.optState.type!==this.optimizer||this.optState.lr!==this.lr){
    this.optState=makeOptimizer(this.optimizer,this.buildParams(),this.lr);
  }
};

NeuralNet.prototype.trainStep=function(x,y){
  this.initOptimizer();
  var r=this.backward(x,y);
  optimizerStep(this.optState,this.buildParams(),r.grads);
  return r.loss;
};

NeuralNet.prototype.trainEpoch=function(data){
  var totalLoss=0;
  var correct=0;
  for(var i=0;i<data.length;i++){
    var loss=this.trainStep(data[i].x,data[i].y);
    totalLoss+=loss;
    /* Accuracy: argmax */
    var pred=this.forward(data[i].x,true);
    var predArg=0,trueArg=0;
    for(var j=1;j<pred.length;j++)if(pred[j]>pred[predArg])predArg=j;
    for(var j2=1;j2<data[i].y.length;j2++)if(data[i].y[j2]>data[i].y[trueArg])trueArg=j2;
    if(predArg===trueArg)correct++;
  }
  var avgLoss=totalLoss/data.length;
  var acc=correct/data.length;
  this.epoch++;
  this.lossHistory.push(avgLoss);
  this.accHistory.push(acc);
  if(this.lossHistory.length>500){this.lossHistory.shift();this.accHistory.shift();}
  return {loss:avgLoss,acc:acc};
};

NeuralNet.prototype.predict=function(x){
  return this.forward(x,true);
};

/* ================================================================
   DATASETS
   ================================================================ */
var DATASETS={
  xor:{
    name:'XOR',
    icon:'⊕',
    desc:'4 points — classic non-linearly-separable problem',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||4;

    }
  },
  circle:{

      for(var i=0;i<n;i++){
        var r=Math.random()<0.5?rndF(0,0.4):rndF(0.65,1.0);

        var x=r*Math.cos(theta);
        var y=r*Math.sin(theta);
        var cls=r<0.5?0:1;
        var yv=[0,0];yv[cls]=1;
        data.push({x:[x,y],y:yv});
      }
      return data;
    }
  },
  spiral:{
    name:'Spiral',
    icon:'🌀',
    desc:'Two intertwined spirals',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||400;
      var data=[];
      for(var i=0;i<n/2;i++){
        var t=i/(n/2)*4*Math.PI;
        var r=t/(4*Math.PI);
        var x1=r*Math.cos(t)+gauss()*0.03;
        var y1=r*Math.sin(t)+gauss()*0.03;
        data.push({x:[x1,y1],y:[1,0]});
        var t2=(i+0.5)/(n/2)*4*Math.PI;
        var r2=t2/(4*Math.PI);

        var y2=-r2*Math.sin(t2)+gauss()*0.03;
        data.push({x:[x2,y2],y:[0,1]});
      }
      return data;
    }
  },
  moons:{
    name:'Two Moons',
    icon:'🌙',
    desc:'Interleaving half circles',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||400;
      var data=[];
      for(var i=0;i<n/2;i++){
        var t=Math.PI*i/(n/2);
        var x=Math.cos(t)+gauss()*0.08;
        var y=Math.sin(t)+gauss()*0.08;
        data.push({x:[x,y],y:[1,0]});
        var x2=1-Math.cos(t)+gauss()*0.08;
        var y2=1-Math.sin(t)-0.5+gauss()*0.08;
        data.push({x:[x2,y2],y:[0,1]});
      }
      return data;
    }
  },
  blobs:{
    name:'Gaussian Blobs',
    icon:'⊙',
    desc:'Overlapping clusters',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||400;
      var data=[];
      var centers=[[-0.6,-0.4],[0.6,0.5]];
      for(var i=0;i<n;i++){
        var cls=Math.random()<0.5?0:1;
        var c=centers[cls];
        var x=c[0]+gauss()*0.35;
        var y=c[1]+gauss()*0.35;
        var yv=[0,0];yv[cls]=1;
        data.push({x:[x,y],y:yv});
      }
      return data;
    }
  },
  checker:{
    name:'Checkerboard',
    icon:'⊞',
    desc:'Complex 4x4 grid pattern',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||600;
      var data=[];
      for(var i=0;i<n;i++){
        var x=rndF(-1,1);
        var y=rndF(-1,1);
        var cellX=Math.floor((x+1)*2);
        var cellY=Math.floor((y+1)*2);
        var cls=(cellX+cellY)%2;
        var yv=[0,0];yv[cls]=1;
        data.push({x:[x,y],y:yv});
      }
      return data;
    }
  },
  gaussian:{
    name:'Random Gaussian',
    icon:'🔔',
    desc:'Pure noise — baseline test',
    classes:2,
    inputDim:2,
    generate:function(n){
      n=n||400;
      var data=[];
      for(var i=0;i<n;i++){
        var cls=Math.random()<0.5?0:1;
        var x=gauss()*0.6;
        var y=gauss()*0.6;
        var yv=[0,0];yv[cls]=1;
        data.push({x:[x,y],y:yv});
      }
      return data;
    }
  }
};
</script>
<script>
/* ================================================================
   GLOBAL STATE
   ================================================================ */
var STATE={
  net:null,
  dataset:'xor',
  data:[],
  testData:[],
  training:false,
  epochsPerFrame:1,
  batchSize:32,
  animFrameId:null,
  startTime:0,
  trainingStarted:false,
  finalAcc:0,
  finalLoss:0,
  lastEpochTime:0,
  learningRate:0.01,
  optimizer:'adam',
  loss:'crossentropy',
  currentTab:'arch',
  pendingAddType:'dense',
  pendingAddSize:8,
  hiddenActivation:'relu'
};

/* ================================================================
   NETWORK BUILDER
   ================================================================ */
function buildNetwork(){
  var net=new NeuralNet();
  net.lr=STATE.learningRate;
  net.optimizer=STATE.optimizer;
  net.loss=STATE.loss;
  var arch=STATE.architecture||[];
  var inputDim=DATASETS[STATE.dataset].inputDim;
  var prev=inputDim;
  for(var i=0;i<arch.length;i++){
    var l=arch[i];
    net.addDense(prev,l.size,l.activation);
    prev=l.size;
  }
  /* Ensure output layer has 2 units with softmax */
  if(arch.length===0||arch[arch.length-1].size!==2){
    net.addDense(prev,2,'softmax');
  } else {
    arch[arch.length-1].activation='softmax';
  }
  STATE.net=net;
  return net;
}

function defaultArchitecture(){
  return [
    {size:8,activation:'relu'},
    {size:8,activation:'relu'},
    {size:2,activation:'softmax'}
  ];
}

function resetArchitecture(){
  STATE.architecture=defaultArchitecture();
  buildNetwork();
}

/* ================================================================
   DATA GENERATION
   ================================================================ */
function generateData(){
  var gen=DATASETS[STATE.dataset].generate;
  STATE.data=gen(400);
  STATE.testData=gen(200);
}

function sampleBatch(){
  var data=STATE.data;
  var batch=[];
  var size=STATE.batchSize;
  for(var i=0;i<size;i++){
    batch.push(data[rnd(0,data.length-1)]);
  }
  return batch;
}

/* ================================================================
   TRAINING LOOP
   ================================================================ */
function toggleTraining(){
  if(!STATE.net)buildNetwork();
  STATE.training=!STATE.training;
  if(STATE.training){
    STATE.startTime=performance.now();
    $('btnTrain').textContent='⏸';
    $('tbStatus').textContent='TRAINING';
    $('tbStatus').className='tb-status training';
    if(!STATE.animFrameId)trainingLoop();
  } else {
    $('btnTrain').textContent='▶';
    $('tbStatus').textContent='PAUSED';
    $('tbStatus').className='tb-status';
  }
}

function stepEpoch(){
  if(!STATE.net)buildNetwork();
  var t0=performance.now();
  var result=STATE.net.trainEpoch(STATE.data);
  STATE.lastEpochTime=performance.now()-t0;
  STATE.finalAcc=result.acc;
  STATE.finalLoss=result.loss;
  updateStatsUI();
  drawAll();
}

function trainingLoop(){
  STATE.animFrameId=requestAnimationFrame(trainingLoop);
  if(!STATE.training)return;
  var t0=performance.now();
  /* Cap the loop at 30ms per frame to keep UI responsive */
  var budget=30;
  var epochCount=0;
  while(performance.now()-t0<budget&&epochCount<1000){
    var result=STATE.net.trainEpoch(STATE.data);
    STATE.finalAcc=result.acc;
    STATE.finalLoss=result.loss;
    epochCount++;
  }
  STATE.lastEpochTime=performance.now()-t0;
  updateStatsUI();
  drawAll();
}

function updateStatsUI(){
  $('sbEpoch').textContent=STATE.net?STATE.net.epoch:0;
  $('sbLoss').textContent=STATE.net?fmt(STATE.finalLoss,4):'—';
  $('sbAcc').textContent=STATE.net?(STATE.finalAcc*100).toFixed(1)+'%':'—';
  $('sbParams').textContent=STATE.net?STATE.net.paramCount():0;
  $('sbSamples').textContent=STATE.data.length;
  $('sbTime').textContent=((performance.now()-STATE.startTime)/1000).toFixed(1)+'s';
  $('lossBadge').textContent='loss '+(STATE.net?fmt(STATE.finalLoss,4):'—');
  $('dbBadge').textContent=STATE.net?(STATE.finalAcc*100).toFixed(1)+'%':'—';
  $('netBadge').textContent=STATE.net?(STATE.net.layers.length+' layers'):'—';
}

/* ================================================================
   VISUALIZATION: Decision Boundary
   ================================================================ */
var DB_CANVAS=null,DB_CTX=null;
function initDB(){
  DB_CANVAS=$('dbCanvas');
  DB_CTX=DB_CANVAS.getContext('2d');
  resizeDB();
  window.addEventListener('resize',function(){resizeDB();drawAll();});
}
function resizeDB(){
  if(!DB_CANVAS)return;
  var wrap=DB_CANVAS.parentElement;
  var dpr=window.devicePixelRatio||1;
  DB_CANVAS.width=wrap.clientWidth*dpr;
  DB_CANVAS.height=wrap.clientHeight*dpr;
  DB_CANVAS.style.width=wrap.clientWidth+'px';
  DB_CANVAS.style.height=wrap.clientHeight+'px';
  DB_CTX.setTransform(dpr,0,0,dpr,0,0);
}
function drawDecisionBoundary(){
  if(!DB_CTX||!STATE.net)return;
  var wrap=DB_CANVAS.parentElement;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  if(W<10||H<10)return;
  /* Render decision boundary as pixel grid */
  var res=Math.floor(Math.min(W,H)/70);
  var cols=Math.floor(W/res),rows=Math.floor(H/res);
  var imgData=DB_CTX.createImageData(cols,rows);
  var d=imgData.data;
  for(var j=0;j<rows;j++){
    for(var i=0;i<cols;i++){
      /* Map pixel to [-1.2,1.2] */
      var x=(i/cols)*2.4-1.2;
      var y=(j/rows)*2.4-1.2;
      var pred=STATE.net.predict([x,y]);
      /* Blend class 0 (cyan) vs class 1 (magenta) */
      var p1=pred[1];
      var r=Math.round(80+p1*120);
      var g=Math.round(80+(1-p1)*60);
      var b=Math.round(140-p1*60);
      var idx=(j*cols+i)*4;
      d[idx]=r;d[idx+1]=g;d[idx+2]=b;d[idx+3]=220;
    }
  }
  /* Upscale to canvas */
  var tmp=document.createElement('canvas');
  tmp.width=cols;tmp.height=rows;
  tmp.getContext('2d').putImageData(imgData,0,0);
  DB_CTX.imageSmoothingEnabled=true;
  DB_CTX.drawImage(tmp,0,0,W,H);
  /* Draw data points */
  DB_CTX.save();
  for(var k=0;k<STATE.data.length;k++){
    var pt=STATE.data[k];
    var xw=(pt.x[0]+1.2)/2.4*W;
    var yw=(pt.x[1]+1.2)/2.4*H;
    var isClass1=pt.y[1]>0.5;
    DB_CTX.beginPath();
    DB_CTX.arc(xw,yw,3,0,Math.PI*2);
    DB_CTX.fillStyle=isClass1?'#ff40b0':'#40d0ff';
    DB_CTX.fill();
    DB_CTX.strokeStyle='rgba(255,255,255,.5)';
    DB_CTX.lineWidth=0.8;
    DB_CTX.stroke();
  }
  DB_CTX.restore();
  /* Grid overlay */
  DB_CTX.strokeStyle='rgba(255,255,255,.06)';
  DB_CTX.lineWidth=1;
  for(var gi=0;gi<=5;gi++){
    DB_CTX.beginPath();
    DB_CTX.moveTo(gi*W/5,0);DB_CTX.lineTo(gi*W/5,H);
    DB_CTX.stroke();
    DB_CTX.beginPath();
    DB_CTX.moveTo(0,gi*H/5);DB_CTX.lineTo(W,gi*H/5);
    DB_CTX.stroke();
  }
}

/* ================================================================
   VISUALIZATION: Loss/Accuracy Chart
   ================================================================ */
var LOSS_CANVAS=null,LOSS_CTX=null;
function initLoss(){
  LOSS_CANVAS=$('lossCanvas');
  LOSS_CTX=LOSS_CANVAS.getContext('2d');
  resizeLoss();
  window.addEventListener('resize',function(){resizeLoss();drawAll();});
}
function resizeLoss(){
  if(!LOSS_CANVAS)return;
  var wrap=LOSS_CANVAS.parentElement;
  var dpr=window.devicePixelRatio||1;
  LOSS_CANVAS.width=wrap.clientWidth*dpr;
  LOSS_CANVAS.height=wrap.clientHeight*dpr;
  LOSS_CANVAS.style.width=wrap.clientWidth+'px';
  LOSS_CANVAS.style.height=wrap.clientHeight+'px';
  LOSS_CTX.setTransform(dpr,0,0,dpr,0,0);
}
function drawLoss(){
  if(!LOSS_CTX||!STATE.net)return;
  var wrap=LOSS_CANVAS.parentElement;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  if(W<10||H<10)return;
  LOSS_CTX.fillStyle='#02020a';
  LOSS_CTX.fillRect(0,0,W,H);
  var lossH=STATE.net.lossHistory;
  var accH=STATE.net.accHistory;
  if(!lossH.length){
    LOSS_CTX.fillStyle='#606878';
    LOSS_CTX.font='11px monospace';
    LOSS_CTX.textAlign='center';
    LOSS_CTX.fillText('Press play to train',W/2,H/2);
    return;
  }
  var padL=40,padR=40,padT=16,padB=24;
  var cw=W-padL-padR,ch=H-padT-padB;
  /* Find ranges */
  var minLoss=Infinity,maxLoss=-Infinity;
  lossH.forEach(function(v){if(v<minLoss)minLoss=v;if(v>maxLoss)maxLoss=v;});
  if(minLoss===maxLoss){maxLoss+=0.1;minLoss-=0.1;}
  if(maxLoss>2)maxLoss=Math.min(maxLoss,4);
  var lossRange=maxLoss-Math.max(0,minLoss);
  /* Draw grid */
  LOSS_CTX.strokeStyle='rgba(255,255,255,.06)';
  LOSS_CTX.lineWidth=1;
  for(var gi=0;gi<=4;gi++){
    var y=padT+gi*ch/4;
    LOSS_CTX.beginPath();LOSS_CTX.moveTo(padL,y);LOSS_CTX.lineTo(padL+cw,y);LOSS_CTX.stroke();
  }
  /* Loss line (magenta) */
  LOSS_CTX.strokeStyle='#ff40b0';
  LOSS_CTX.lineWidth=2;
  LOSS_CTX.beginPath();
  var N=lossH.length;
  for(var i=0;i<N;i++){
    var x=padL+(i/(N-1||1))*cw;
    var y=padT+ch-(lossH[i]-Math.max(0,minLoss))/lossRange*ch;
    if(i===0)LOSS_CTX.moveTo(x,y);else LOSS_CTX.lineTo(x,y);
  }
  LOSS_CTX.stroke();
  /* Accuracy line (cyan) */
  LOSS_CTX.strokeStyle='#00d0ff';
  LOSS_CTX.lineWidth=2;
  LOSS_CTX.beginPath();
  for(var i2=0;i2<accH.length;i2++){
    var x2=padL+(i2/(accH.length-1||1))*cw;
    var y2=padT+ch-accH[i2]*ch;
    if(i2===0)LOSS_CTX.moveTo(x2,y2);else LOSS_CTX.lineTo(x2,y2);
  }
  LOSS_CTX.stroke();
  /* Labels */
  LOSS_CTX.fillStyle='#ff40b0';
  LOSS_CTX.font='10px monospace';
  LOSS_CTX.textAlign='left';
  LOSS_CTX.fillText('loss',padL,padT-3);
  LOSS_CTX.fillStyle='#00d0ff';
  LOSS_CTX.fillText('accuracy',padL+40,padT-3);
  LOSS_CTX.fillStyle='#606878';
  LOSS_CTX.textAlign='right';
  LOSS_CTX.fillText(fmt(maxLoss,2),padL-4,padT+10);
  LOSS_CTX.fillText(fmt(Math.max(0,minLoss),2),padL-4,padT+ch-2);
  LOSS_CTX.textAlign='right';
  LOSS_CTX.fillText('epochs: '+STATE.net.epoch,W-4,H-6);
  /* Current stats */
  LOSS_CTX.textAlign='left';
  LOSS_CTX.fillStyle='#ff40b0';
  LOSS_CTX.fillText(fmt(lossH[lossH.length-1],4),padL+85,padT-3);
  LOSS_CTX.fillStyle='#00d0ff';
  LOSS_CTX.fillText((accH[accH.length-1]*100).toFixed(1)+'%',padL+170,padT-3);
}

/* ================================================================
   VISUALIZATION: Network Architecture
   ================================================================ */
var NET_CANVAS=null,NET_CTX=null;
function initNet(){
  NET_CANVAS=$('netCanvas');
  NET_CTX=NET_CANVAS.getContext('2d');
  resizeNet();
  window.addEventListener('resize',function(){resizeNet();drawAll();});
}
function resizeNet(){
  if(!NET_CANVAS)return;
  var wrap=NET_CANVAS.parentElement;
  var dpr=window.devicePixelRatio||1;
  NET_CANVAS.width=wrap.clientWidth*dpr;
  NET_CANVAS.height=wrap.clientHeight*dpr;
  NET_CANVAS.style.width=wrap.clientWidth+'px';
  NET_CANVAS.style.height=wrap.clientHeight+'px';
  NET_CTX.setTransform(dpr,0,0,dpr,0,0);
}
function drawNet(){
  if(!NET_CTX||!STATE.net)return;
  var wrap=NET_CANVAS.parentElement;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  if(W<10||H<10)return;
  NET_CTX.fillStyle='#02020a';
  NET_CTX.fillRect(0,0,W,H);
  var net=STATE.net;
  var layerSizes=[net.layers[0].inSize];
  net.layers.forEach(function(l){layerSizes.push(l.outSize);});
  var numLayers=layerSizes.length;
  var padX=30,padY=20;
  var availW=W-padX*2;
  var layerX=[];
  for(var i=0;i<numLayers;i++){
    layerX.push(padX+(i/(numLayers-1||1))*availW);
  }
  var maxSize=Math.max.apply(null,layerSizes);
  /* Draw connections first */
  for(var li=0;li<net.layers.length;li++){
    var l=net.layers[li];
    var x1=layerX[li],x2=layerX[li+1];
    var y1s=[],y2s=[];
    var n1=layerSizes[li],n2=layerSizes[li+1];
    for(var i1=0;i1<n1;i1++){
      y1s.push(padY+((i1+0.5)/n1)*(H-padY*2));
    }
    for(var i2=0;i2<n2;i2++){
      y2s.push(padY+((i2+0.5)/n2)*(H-padY*2));
    }
    for(var i3=0;i3<n1;i3++){
      for(var i4=0;i4<n2;i4++){
        var w=l.W[i4*n1+i3];
        /* Color by weight sign, alpha by magnitude */
        var a=Math.min(0.5,Math.abs(w)*1.5);
        if(a<0.03)continue;
        NET_CTX.strokeStyle=w>0?'rgba(64,255,144,'+a+')':'rgba(255,64,176,'+a+')';
        NET_CTX.lineWidth=0.6;
        NET_CTX.beginPath();
        NET_CTX.moveTo(x1,y1s[i3]);
        NET_CTX.lineTo(x2,y2s[i4]);
        NET_CTX.stroke();
      }
    }
  }
  /* Draw nodes */
  for(var li2=0;li2<numLayers;li2++){
    var x=layerX[li2];
    var n=layerSizes[li2];
    for(var ii=0;ii<n;ii++){
      var y=padY+((ii+0.5)/n)*(H-padY*2);
      NET_CTX.beginPath();
      NET_CTX.arc(x,y,5,0,Math.PI*2);
      var isInput=li2===0;
      var isOutput=li2===numLayers-1;
      var color=isInput?'#40d0ff':isOutput?'#ff40b0':'#b060ff';
      NET_CTX.fillStyle=color;
      NET_CTX.fill();
      NET_CTX.strokeStyle='#fff';
      NET_CTX.lineWidth=1;
      NET_CTX.stroke();
    }
  }
  /* Layer labels */
  NET_CTX.fillStyle='#8090a8';
  NET_CTX.font='9px monospace';
  NET_CTX.textAlign='center';
  for(var li3=0;li3<numLayers;li3++){
    NET_CTX.fillText(layerSizes[li3],layerX[li3],H-4);
  }
  NET_CTX.textAlign='left';
  NET_CTX.fillText('input',padX-15,12);
  NET_CTX.textAlign='right';
  NET_CTX.fillText('output',W-6,12);
}

/* ================================================================
   VISUALIZATION: Weight Heatmap
   ================================================================ */
var W_CANVAS=null,W_CTX=null;
var W_LAYER_IDX=0;
function initW(){
  W_CANVAS=$('wCanvas');
  W_CTX=W_CANVAS.getContext('2d');
  resizeW();
  window.addEventListener('resize',function(){resizeW();drawAll();});
}
function resizeW(){
  if(!W_CANVAS)return;
  var wrap=W_CANVAS.parentElement;
  var dpr=window.devicePixelRatio||1;
  W_CANVAS.width=wrap.clientWidth*dpr;
  W_CANVAS.height=wrap.clientHeight*dpr;
  W_CANVAS.style.width=wrap.clientWidth+'px';
  W_CANVAS.style.height=wrap.clientHeight+'px';
  W_CTX.setTransform(dpr,0,0,dpr,0,0);
}
function drawWeights(){
  if(!W_CTX||!STATE.net)return;
  var wrap=W_CANVAS.parentElement;
  var W=wrap.clientWidth,H=wrap.clientHeight;
  if(W<10||H<10)return;
  W_CTX.fillStyle='#02020a';
  W_CTX.fillRect(0,0,W,H);
  if(!STATE.net.layers.length)return;
  W_LAYER_IDX=clamp(W_LAYER_IDX,0,STATE.net.layers.length-1);
  var l=STATE.net.layers[W_LAYER_IDX];
  var rows=l.outSize,cols=l.inSize;
  /* Find weight range */
  var minW=Infinity,maxW=-Infinity;
  for(var i=0;i<l.W.length;i++){if(l.W[i]<minW)minW=l.W[i];if(l.W[i]>maxW)maxW=l.W[i];}
  var absMax=Math.max(Math.abs(minW),Math.abs(maxW),0.01);
  var padX=40,padY=20;
  var cellW=Math.min(40,(W-padX-20)/cols);
  var cellH=Math.min(40,(H-padY-40)/rows);
  var gridW=cellW*cols;
  var gridH=cellH*rows;
  var ox=(W-gridW)/2,oy=padY+5;
  /* Draw cells */
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var w=l.W[r*cols+c];
      var t=w/absMax;
      var color;
      if(t>0){
        var g=Math.round(t*200);
        color='rgb(20,'+g+',80)';
      } else {
        var m=Math.round(-t*200);
        color='rgb('+m+',20,120)';
      }
      W_CTX.fillStyle=color;
      W_CTX.fillRect(ox+c*cellW,oy+r*cellH,cellW-0.5,cellH-0.5);
    }
  }
  W_CTX.strokeStyle='rgba(255,255,255,.15)';
  W_CTX.lineWidth=1;
  W_CTX.strokeRect(ox,oy,gridW,gridH);
  /* Labels */
  W_CTX.fillStyle='#8090a8';
  W_CTX.font='10px monospace';
  W_CTX.textAlign='left';
  W_CTX.fillText('Layer '+(W_LAYER_IDX+1)+' of '+STATE.net.layers.length,8,12);
  W_CTX.textAlign='right';
  W_CTX.fillText(rows+'×'+cols, W-8, 12);
  W_CTX.textAlign='center';
  W_CTX.fillText('input →',ox+gridW/2,H-20);
  W_CTX.textAlign='left';
  W_CTX.fillText('output ↓',4,oy+gridH/2);
  /* Weight range colorbar */
  W_CTX.fillStyle='#8090a8';
  W_CTX.font='9px monospace';
  W_CTX.textAlign='center';
  var barW=100,barH=6,barX=(W-barW)/2,barY=H-14;
  var grad=W_CTX.createLinearGradient(barX,0,barX+barW,0);
  grad.addColorStop(0,'rgb(200,20,120)');
  grad.addColorStop(0.5,'rgb(20,20,20)');
  grad.addColorStop(1,'rgb(20,200,80)');
  W_CTX.fillStyle=grad;
  W_CTX.fillRect(barX,barY,barW,barH);
  W_CTX.fillStyle='#8090a8';
  W_CTX.fillText(fmt(-absMax,2),barX-2,barY-1);
  W_CTX.fillText(fmt(absMax,2),barX+barW+2,barY-1);
  $('wBadge').textContent='layer '+(W_LAYER_IDX+1)+'/'+STATE.net.layers.length;
}

/* ================================================================
   DRAW ALL
   ================================================================ */
function drawAll(){
  drawDecisionBoundary();
  drawLoss();
  drawNet();
  drawWeights();
}
</script>
<script>
/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'arch',icon:'🧠',label:'Architecture'},
  {key:'data',icon:'📊',label:'Dataset'},
  {key:'train',icon:'🏋️',label:'Training'},
  {key:'weights',icon:'⚙️',label:'Weights'},
  {key:'about',icon:'ℹ️',label:'About'}
];
var ACTIVE_TAB='arch';

function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===ACTIVE_TAB?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  ACTIVE_TAB=key;
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-tab')===key)});
  $('sbMode').textContent=key.charAt(0).toUpperCase()+key.slice(1);
  renderLeftPanel();
  renderRightPanel();
}

/* ================================================================
   LEFT PANEL
   ================================================================ */
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var html='';
  if(ACTIVE_TAB==='arch'){
    html+='<div class="sec"><h4>Network Architecture <span class="badge" id="archCount">'+(STATE.architecture?STATE.architecture.length:0)+'</span></h4>';
    html+='<div id="archList"></div>';
    html+='<div class="add-layer-row">';
    html+='<select id="addLayerType">';
    html+='<option value="dense">Dense</option>';
    html+='</select>';
    html+='<input type="number" id="addLayerSize" value="'+STATE.pendingAddSize+'" min="1" max="128">';
    html+='<button class="btn primary sm" onclick="addLayer()">+ Add</button>';
    html+='</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Default Activation</h4>';
    html+='<div class="ctrl">';
    html+='<select id="defaultAct" onchange="STATE.hiddenActivation=this.value">';
    ['relu','leakyrelu','sigmoid','tanh','elu'].forEach(function(a){
      html+='<option value="'+a+'"'+(STATE.hiddenActivation===a?' selected':'')+'>'+ACT[a].name+'</option>';
    });
    html+='</select></div>';
    html+='<button class="btn full primary" onclick="applyArchitecture()">🔧 Rebuild Network</button>';
    html+='<button class="btn full" style="margin-top:6px" onclick="resetArchitecture();applyArchitecture()">↺ Reset to Default</button>';
    html+='</div>';
  }
  else if(ACTIVE_TAB==='data'){
    html+='<div class="sec"><h4>Dataset</h4>';
    html+='<div class="ctrl"><select onchange="setDataset(this.value)">';
    Object.keys(DATASETS).forEach(function(k){
      html+='<option value="'+k+'"'+(STATE.dataset===k?' selected':'')+'>'+DATASETS[k].icon+' '+DATASETS[k].name+'</option>';
    });
    html+='</select></div>';
    html+='<div class="text-xs text-dim" style="line-height:1.6;font-family:var(--mono)">'+esc(DATASETS[STATE.dataset].desc)+'</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Generation</h4>';

function renderArchList(){
  var list=$('archList');
  if(!list)return;
  list.innerHTML='';
  var inputDim=DATASETS[STATE.dataset].inputDim;
  /* Input row */
  var inRow=el('div',{class:'layer-row'});
  inRow.innerHTML='<span class="lr-idx">in</span><span class="lr-icon">📍</span>'+
    '<span class="lr-info"><div class="lr-name">Input</div><div class="lr-det">'+inputDim+' features</div></span>';
  list.appendChild(inRow);
  STATE.architecture.forEach(function(l,i){
    var row=el('div',{class:'layer-row'});
    var act=ACT[l.activation]||ACT.relu;
    row.innerHTML='<span class="lr-idx">'+(i+1)+'</span><span class="lr-icon">◆</span>'+
      '<span class="lr-info"><div class="lr-name">Dense('+l.size+')</div>'+
      '<div class="lr-det">'+act.icon+' '+act.name+'</div></span>';
    var delBtn=el('button',{class:'lr-btn'},'✕');
    delBtn.onclick=function(){STATE.architecture.splice(i,1);renderArchList();};
    row.appendChild(delBtn);
    /* Activation switch */
    var actSel=el('select',{style:'width:auto;padding:2px 4px;font-size:.6rem;background:var(--panel4);border:1px solid var(--bd);border-radius:3px;color:var(--tx)'});
    ['relu','leakyrelu','sigmoid','tanh','elu','linear'].forEach(function(a){
      var o=el('option',{value:a},ACT[a].icon+' '+ACT[a].name);
      if(a===l.activation)o.selected=true;
      actSel.appendChild(o);
    });
    actSel.onchange=function(){
      STATE.architecture[i].activation=this.value;
      renderArchList();
    };
    row.appendChild(actSel);
    list.appendChild(row);
  });
  /* Output row */
  var outRow=el('div',{class:'layer-row'});
  outRow.innerHTML='<span class="lr-idx">out</span><span class="lr-icon">🎯</span>'+
    '<span class="lr-info"><div class="lr-name">Output</div><div class="lr-det">◇ Softmax (2 classes)</div></span>';
  list.appendChild(outRow);
}

function addLayer(){
  var size=parseInt($('addLayerSize').value)||8;
  size=clamp(size,1,128);
  STATE.pendingAddSize=size;
  var act=$('defaultAct')?$('defaultAct').value:STATE.hiddenActivation;
  STATE.architecture.push({size:size,activation:act});
  renderArchList();
}

function applyArchitecture(){
  buildNetwork();

}

function renderLayerStats(){
  var el2=$('layerStats');
  if(!el2||!STATE.net)return;
  var l=STATE.net.layers[W_LAYER_IDX];
  if(!l){el2.innerHTML='<div class="text-xs text-dim">No layer selected</div>';return}
  var minW=Infinity,maxW=-Infinity;
  var sumAbs=0,sumSq=0;
  for(var i=0;i<l.W.length;i++){
    if(l.W[i]<minW)minW=l.W[i];
    if(l.W[i]>maxW)maxW=l.W[i];
    sumAbs+=Math.abs(l.W[i]);
    sumSq+=l.W[i]*l.W[i];
  }
  var meanAbs=sumAbs/l.W.length;
  var rms=Math.sqrt(sumSq/l.W.length);
  el2.innerHTML=
    '<div class="row"><span class="k">Shape</span><span class="v">'+l.outSize+'×'+l.inSize+'</span></div>'+
    '<div class="row"><span class="k">Activation</span><span class="v">'+ACT[l.act].name+'</span></div>'+
    '<div class="row"><span class="k">Weights</span><span class="v">'+l.W.length+'</span></div>'+
    '<div class="row"><span class="k">Min</span><span class="v">'+fmt(minW,4)+'</span></div>'+
    '<div class="row"><span class="k">Max</span><span class="v">'+fmt(maxW,4)+'</span></div>'+
    '<div class="row"><span class="k">Mean |W|</span><span class="v">'+fmt(meanAbs,4)+'</span></div>'+
    '<div class="row"><span class="k">RMS</span><span class="v">'+fmt(rms,4)+'</span></div>';
}

function showLayerDetails(){
  if(!STATE.net)return;
  var l=STATE.net.layers[W_LAYER_IDX];
  if(!l)return;
  /* Show first 5x5 block of weights as a grid */
  var html='<div class="sec"><h4>Layer '+(W_LAYER_IDX+1)+' — '+l.outSize+'×'+l.inSize+'</h4>';
  html+='<table class="data-table"><thead><tr><th>W row→ col↓</th>';
  for(var c=0;c<Math.min(l.inSize,10);c++)html+='<th>in'+c+'</th>';
  html+='</tr></thead><tbody>';
  for(var r=0;r<Math.min(l.outSize,10);r++){
    html+='<tr><td class="c1">out'+r+'</td>';
    for(var c2=0;c2<Math.min(l.inSize,10);c2++){
      var v=l.W[r*l.inSize+c2];
      var cls=v>0?'c3':'c4';
      html+='<td class="'+cls+'">'+fmt(v,3)+'</td>';
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  /* Biases */
  html+='<h4 style="margin-top:16px">Biases</h4>';
  html+='<div class="text-xs text-mono" style="line-height:1.8">';
  for(var i=0;i<Math.min(l.b.length,20);i++){
    html+='<span style="color:'+(l.b[i]>0?'var(--c3)':'var(--c4)')+'">'+fmt(l.b[i],3)+'</span>';
    if(i<l.b.length-1)html+=' · ';
  }
  html+='</div></div>';
  openModal('🔍 Layer Details',html,'<button class="btn" onclick="closeModal()">Close</button>',{size:'lg'});
}

function saveModel(){
  if(!STATE.net)return;
  var data={
    version:'1.0',
    architecture:STATE.architecture,
    dataset:STATE.dataset,
    optimizer:STATE.optimizer,
    lr:STATE.learningRate,
    loss:STATE.loss,
    epoch:STATE.net.epoch,
    layers:STATE.net.layers.map(function(l){
      return {
        W:Array.from(l.W),
        b:Array.from(l.b),
        inSize:l.inSize,
        outSize:l.outSize,
        act:l.act
      };
    })
  };
  try{
    localStorage.setItem('neuralforge-model',JSON.stringify(data));
    toast('Model saved ('+STATE.net.paramCount()+' params)','success');
  }catch(e){
    toast('Save failed: '+e.message,'error');
  }
}

function loadModel(){
  try{
    var raw=localStorage.getItem('neuralforge-model');
    if(!raw){toast('No saved model','warn');return}
    var data=JSON.parse(raw);
    STATE.architecture=data.architecture;
    STATE.dataset=data.dataset;
    STATE.optimizer=data.optimizer;
    STATE.learningRate=data.lr;
    STATE.loss=data.loss;
    /* Rebuild */
    STATE.net=new NeuralNet();
    STATE.net.optimizer=STATE.optimizer;
    STATE.net.lr=STATE.learningRate;
    STATE.net.loss=STATE.loss;
    data.layers.forEach(function(ld){
      STATE.net.layers.push({
        type:'dense',
        inSize:ld.inSize,
        outSize:ld.outSize,
        W:new Float32Array(ld.W),
        b:new Float32Array(ld.b),
        act:ld.act,
        zCache:null,
        aCache:null
      });
    });
    STATE.net.epoch=data.epoch||0;
    generateData();
    renderLeftPanel();
    renderRightPanel();
    drawAll();
    updateStatsUI();
    toast('Model loaded','success');
  }catch(e){
    toast('Load failed: '+e.message,'error');
  }
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggleTraining();}
  else if(e.key==='t'||e.key==='T'){toggleTheme();}
  else if(e.key==='?'||(e.shiftKey&&e.key==='/')){showHelp();}

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('NEURAL FORGE ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}
