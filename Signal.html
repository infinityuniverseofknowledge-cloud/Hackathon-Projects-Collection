/* ================================================================
   MODULE: POLE-ZERO
   ================================================================ */
registerModule('polezero',{
  title:'Pole-Zero Plot',
  icon:'⊙',
  desc:'Place poles and zeros on the z-plane. Drag them around and see the frequency response and stability change live.',
  init:function(){this.compute()},
  compute:function(){
    var pz=STATE.polezero;
    /* Compute frequency response from poles and zeros */
    var numPts=256;
    var resp=new Float64Array(numPts);
    for(var i=0;i<numPts;i++){
      var w=Math.PI*i/(numPts-1);
      var cw=Math.cos(w),sw=Math.sin(w);
      /* H(e^jw) = K · Π(e^jw - zᵢ) / Π(e^jw - pᵢ) */
      var numRe=pz.gain,numIm=0;
      pz.zeros.forEach(function(z){
        var dr=cw-z.re,di=sw-z.im;
        var nr=numRe*dr-numIm*di;
        numIm=numRe*di+numIm*dr;
        numRe=nr;
      });
      var denRe=1,denIm=0;
      pz.poles.forEach(function(p){
        var dr2=cw-p.re,di2=sw-p.im;
        var nr2=denRe*dr2-denIm*di2;
        denIm=denRe*di2+denIm*dr2;
        denRe=nr2;
      });
      var den2=denRe*denRe+denIm*denIm;
      var re=(numRe*denRe+numIm*denIm)/den2;
      var im=(numIm*denRe-numRe*denIm)/den2;
      var mag=Math.sqrt(re*re+im*im);
      resp[i]=20*Math.log10(Math.max(mag,1e-10));
    }
    pz.response=resp;
    /* Stability */
    var stable=true;
    pz.poles.forEach(function(p){
      var m=Math.sqrt(p.re*p.re+p.im*p.im);
      if(m>=1)stable=false;
    });
    pz.stable=stable;
  },
  tick:function(dt){STATE.time+=dt},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020806';
    ctx.fillRect(0,0,W,H);
    var pz=STATE.polezero;
    /* Left half: z-plane */
    var planeW=Math.min(W*0.5,H-40);
    var cx=40+planeW/2;
    var cy=H/2;
    var R=planeW/2-20;
    /* Background */
    ctx.fillStyle='rgba(8,24,15,.5)';
    ctx.beginPath();ctx.arc(cx,cy,R+10,0,Math.PI*2);ctx.fill();
    /* Unit circle */
    ctx.strokeStyle='rgba(64,255,128,.5)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    /* Axes */
    ctx.strokeStyle='rgba(80,120,96,.5)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-R-10,cy);ctx.lineTo(cx+R+10,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-R-10);ctx.lineTo(cx,cy+R+10);ctx.stroke();
    /* Angle markers */
    ctx.fillStyle='rgba(80,120,96,.7)';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    ctx.fillText('Re',cx+R+2,cy+14);
    ctx.fillText('Im',cx+10,cy-R-2);
    ctx.fillText('(1,0)',cx+R,cy+14);
    ctx.fillText('(-1,0)',cx-R,cy+14);
    /* Stability region shading */
    ctx.fillStyle='rgba(64,255,128,.05)';
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    /* Grid lines */
    ctx.strokeStyle='rgba(80,120,96,.15)';
    for(var gi=-2;gi<=2;gi++){
      ctx.beginPath();ctx.moveTo(cx+gi*R/2,cy-R);ctx.lineTo(cx+gi*R/2,cy+R);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-R,cy+gi*R/2);ctx.lineTo(cx+R,cy+gi*R/2);ctx.stroke();
    }
    /* Poles */
    pz.poles.forEach(function(p,i){
      var px=cx+p.re*R,py=cy-p.im*R;
      var mag=Math.sqrt(p.re*p.re+p.im*p.im);
      var color=mag>=1?'#ff5060':'#40ff80';
      ctx.strokeStyle=color;
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(px-7,py-7);ctx.lineTo(px+7,py+7);
      ctx.moveTo(px-7,py+7);ctx.lineTo(px+7,py-7);
      ctx.stroke();
      if(i===pz.drag&&pz.dragType==='pole'){
        ctx.strokeStyle='#ffe040';
        ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.stroke();
      }
    });
    /* Zeros */
    pz.zeros.forEach(function(z,i){
      var zx=cx+z.re*R,zy=cy-z.im*R;
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(zx,zy,7,0,Math.PI*2);ctx.stroke();
      if(i===pz.drag&&pz.dragType==='zero'){
        ctx.strokeStyle='#ffe040';
        ctx.beginPath();ctx.arc(zx,zy,12,0,Math.PI*2);ctx.stroke();
      }
    });
    /* Label */
    ctx.fillStyle='#40ff80';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('Z-PLANE — '+(pz.stable?'STABLE':'UNSTABLE')+(pz.stable?'':' (pole outside unit circle)'),40,30);
    /* Right half: frequency response */
    var plotX=cx+R+40;
    var plotY=40;
    var plotW=W-plotX-40;
    var plotH=H-80;
    ctx.fillStyle='rgba(8,24,15,.5)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(80,120,96,.1)';
    for(var gi2=0;gi2<=8;gi2++){ctx.beginPath();ctx.moveTo(plotX+gi2*plotW/8,plotY);ctx.lineTo(plotX+gi2*plotW/8,plotY+plotH);ctx.stroke();}
    for(var gj=0;gj<=4;gj++){ctx.beginPath();ctx.moveTo(plotX,plotY+gj*plotH/4);ctx.lineTo(plotX+plotW,plotY+gj*plotH/4);ctx.stroke();}
    /* Response */
    if(pz.response){
      var minDB=-60,maxDB=20;
      ctx.strokeStyle='#40ff80';
      ctx.lineWidth=2;
      ctx.fillStyle='rgba(64,255,128,.1)';
      ctx.beginPath();
      ctx.moveTo(plotX,plotY+plotH);
      for(var k=0;k<pz.response.length;k++){
        var px2=plotX+(k/(pz.response.length-1))*plotW;
        var py2=plotY+plotH-clamp((pz.response[k]-minDB)/(maxDB-minDB),0,1)*plotH;
        ctx.lineTo(px2,py2);
      }
      ctx.lineTo(plotX+plotW,plotY+plotH);
      ctx.closePath();ctx.fill();
      ctx.beginPath();
      for(var k2=0;k2<pz.response.length;k2++){
        var px3=plotX+(k2/(pz.response.length-1))*plotW;
        var py3=plotY+plotH-clamp((pz.response[k2]-minDB)/(maxDB-minDB),0,1)*plotH;
        if(k2===0)ctx.moveTo(px3,py3);else ctx.lineTo(px3,py3);
      }
      ctx.stroke();
    }
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('|H(e^jω)| in dB',plotX+8,plotY+14);
    ctx.fillStyle='#507860';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    for(var fr=0;fr<=4;fr++){
      ctx.fillText(fr===4?'π':'π·'+(fr/4).toFixed(2),plotX+fr*plotW/4,plotY+plotH+14);
    }
    setStatsHTML(
      '<div>Poles: '+pz.poles.length+'</div>'+
      '<div>Zeros: '+pz.zeros.length+'</div>'+
      '<div>Status: '+(pz.stable?'STABLE':'UNSTABLE')+'</div>'
    );
    updateBadge('⊙ Pole-Zero Plot · '+(pz.stable?'stable':'unstable'));
    $('sbMode').textContent='Pole-Zero';
  },
  onDown:function(p){
    var pz=STATE.polezero;
    var planeW=Math.min(CANV.W*0.5,CANV.H-40);
    var cx=40+planeW/2;
    var cy=CANV.H/2;
    var R=planeW/2-20;
    var wx=(p.x-cx)/R;
    var wy=-(p.y-cy)/R;
    /* Find nearest pole/zero */
    var bestDist=0.2,bestIdx=-1,bestType=null;
    pz.poles.forEach(function(pole,i){
      var d=Math.hypot(pole.re-wx,pole.im-wy);
      if(d<bestDist){bestDist=d;bestIdx=i;bestType='pole';}
    });
    pz.zeros.forEach(function(z,i){
      var d=Math.hypot(z.re-wx,z.im-wy);
      if(d<bestDist){bestDist=d;bestIdx=i;bestType='zero';}
    });
    if(bestIdx>=0){
      pz.drag=bestIdx;
      pz.dragType=bestType;
    } else {
      /* Add new pole/zero at cursor position */
      if(Math.abs(wx)<1.5&&Math.abs(wy)<1.5){
        if(INPUT.mouseX&&p.y<CANV.H/2){/* not used */}
        /* Left click adds pole, shift adds zero (use Ctrl on desktop) */
        pz.poles.push({re:wx,im:wy});
        this.compute();
      }
    }
  },
  onMove:function(p){
    if(!INPUT.down)return;
    var pz=STATE.polezero;
    if(pz.drag==null)return;
    var planeW=Math.min(CANV.W*0.5,CANV.H-40);
    var cx=40+planeW/2;
    var cy=CANV.H/2;
    var R=planeW/2-20;
    var wx=(p.x-cx)/R;
    var wy=-(p.y-cy)/R;
    if(pz.dragType==='pole')pz.poles[pz.drag]={re:wx,im:wy};
    else pz.zeros[pz.drag]={re:wx,im:wy};
    this.compute();
  },
  onUp:function(){STATE.polezero.drag=null},
  controls:function(){
    var pz=STATE.polezero;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="STATE.polezero.poles.push({re:0.5,im:0});STATE.polezero.zeros.push({re:-1,im:0});MODULES.polezero.compute();renderLeftPanel()">+ Add pole & zero</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="if(STATE.polezero.poles.length>1)STATE.polezero.poles.pop();MODULES.polezero.compute();renderLeftPanel()">− Remove pole</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="if(STATE.polezero.zeros.length>0)STATE.polezero.zeros.pop();MODULES.polezero.compute();renderLeftPanel()">− Remove zero</button>';
    html+='<button class="btn full sm danger" style="margin-top:4px" onclick="STATE.polezero.poles=[];STATE.polezero.zeros=[];MODULES.polezero.compute();renderLeftPanel()">Clear all</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="pzPreset(\'lowpass\')">Lowpass (pole near +1)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="pzPreset(\'highpass\')">Highpass (pole near −1)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="pzPreset(\'notch\')">Notch (zeros on circle)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="pzPreset(\'allpass\')">Allpass</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="pzPreset(\'unstable\')">Unstable (pole outside)</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Gain</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>K</span><span>'+fmt(pz.gain,3)+'</span></div>';
    html+='<input type="range" min="0.1" max="3" step="0.05" value="'+pz.gain+'" oninput="STATE.polezero.gain=parseFloat(this.value);MODULES.polezero.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Current poles</h4>';
    html+='<div class="kv">';
    pz.poles.forEach(function(p,i){
      var m=Math.sqrt(p.re*p.re+p.im*p.im);
      html+='<div class="row"><span class="k">p'+i+'</span><span class="v">'+fmt(p.re,3)+' + j'+fmt(p.im,3)+'  |·|='+fmt(m,3)+'</span></div>';
    });
    html+='</div></div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:8px">Click empty space to add a pole. Drag poles and zeros to move them.</div>';
    return html;
  },
  mathPanel:function(){
    var pz=STATE.polezero;
    var html='<div class="sec"><h4>Transfer function</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'H(z) = K · Π(z − z<sub>i</sub>) / Π(z − p<sub>i</sub>)<br><br>'+
      'K = '+fmt(pz.gain,3)+'<br>'+
      'Poles: '+pz.poles.length+'<br>'+
      'Zeros: '+pz.zeros.length+
      '</div></div>';
    html+='<div class="sec"><h4>Stability</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:'+(pz.stable?'var(--c1)':'var(--c4)')+'">'+
      (pz.stable?'✓ BIBO stable — all poles inside |z|<1':'✗ Unstable — at least one pole has |z|≥1')+
      '</div></div>';
    html+='<div class="sec"><h4>Frequency interpretation</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'The frequency response is the value of H(z) evaluated along the unit circle (z = e^jω). '+
      'Peaks occur when the path passes near a pole. Dips (nulls) occur when it passes near a zero.'+
      '</div></div>';
    return html;
  }
});
function pzPreset(name){
  var pz=STATE.polezero;
  if(name==='lowpass'){
    pz.poles=[{re:0.9,im:0}];
    pz.zeros=[{re:-1,im:0}];
  } else if(name==='highpass'){
    pz.poles=[{re:-0.9,im:0}];
    pz.zeros=[{re:1,im:0}];
  } else if(name==='notch'){
    var f=0.3;
    pz.poles=[{re:0.9*Math.cos(2*Math.PI*f),im:0.9*Math.sin(2*Math.PI*f)},
              {re:0.9*Math.cos(2*Math.PI*f),im:-0.9*Math.sin(2*Math.PI*f)}];
    pz.zeros=[{re:Math.cos(2*Math.PI*f),im:Math.sin(2*Math.PI*f)},
              {re:Math.cos(2*Math.PI*f),im:-Math.sin(2*Math.PI*f)}];
  } else if(name==='allpass'){
    pz.poles=[{re:0.6,im:0}];
    pz.zeros=[{re:1/0.6,im:0}];
  } else if(name==='unstable'){
    pz.poles=[{re:1.1,im:0},{re:0.5,im:0.5}];
    pz.zeros=[{re:-1,im:0}];
  }
  MODULES.polezero.compute();
  renderLeftPanel();
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='7'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('SIGNAL initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
