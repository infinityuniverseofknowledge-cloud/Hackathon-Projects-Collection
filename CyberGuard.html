<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#020a08">
<title>CYBERGUARD — Personal Security Toolkit</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#020a08;--bg2:#04140e;--bg3:#061e16;--bg4:#0a2a1e;
  --panel:#041610;--panel2:#0a281c;--panel3:#0e3828;--panel4:#144838;
  --bd:#0e3828;--bd2:#1a5440;--bd3:#287860;
  --tx:#d8ffe8;--tx2:#88c8a8;--tx3:#509080;--mu:#386858;
  --c1:#00ff9d;--c1h:#80ffc8;--c1l:#00cc7a;
  --c2:#ff2d9e;--c2h:#ff80c8;--c2l:#cc2277;
  --c3:#00d4ff;--c3h:#80e8ff;--c3l:#00a3cc;
  --c4:#ffb800;--c4h:#ffd980;--c4l:#cc9200;
  --c5:#a855f7;--c5h:#d0a0ff;--c5l:#8033cc;
  --c6:#ff4d00;--c6h:#ff8040;--c6l:#cc3d00;
  --c7:#c8ff00;--c7h:#e0ff80;--c7l:#a0cc00;
  --ok:#00ff9d;--warn:#ffb800;--err:#ff2d9e;--info:#00d4ff;
  --critical:#ff2d9e;--urgent:#ff4d00;--attention:#ffb800;
  --safe:#00ff9d;--medium:#00d4ff;
  --g1:linear-gradient(135deg,#00ff9d,#00d4ff);
  --g2:linear-gradient(135deg,#ff2d9e,#a855f7);
  --g3:linear-gradient(135deg,#00d4ff,#a855f7);
  --g4:linear-gradient(135deg,#ffb800,#ff2d9e);
  --gHolo:linear-gradient(120deg,#00ff9d,#00d4ff,#a855f7,#ff2d9e,#ffb800,#00ff9d);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.7);
  --sh2:0 4px 16px rgba(0,0,0,.8);
  --sh3:0 8px 32px rgba(0,0,0,.9);
  --shGlow:0 0 24px rgba(0,255,157,.4);
  --shGlowPink:0 0 24px rgba(255,45,158,.4);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#000;--bg2:#0a0a0a;--panel:#101010;--panel2:#181818;--bd:#282828;
  --c1:#ffffff;--c2:#888;--tx:#f0f0f0;--tx2:#a0a0a0;
}
[data-theme="matrix"]{
  --bg:#000400;--bg2:#001000;--bg3:#001800;--panel:#001400;--panel2:#002000;
  --bd:#004000;--bd2:#006000;--bd3:#009000;
  --tx:#b0ffc0;--tx2:#60c080;--tx3:#308050;--mu:#205040;
  --c1:#00ff40;--c1h:#80ffb0;--c1l:#00cc30;
}
[data-theme="royal"]{
  --bg:#0a0418;--bg2:#140828;--bg3:#1e0c38;--bg4:#2a1050;
  --panel:#140828;--panel2:#1e0c38;--panel3:#2a1050;--panel4:#381868;
  --bd:#2a1050;--bd2:#401a78;--bd3:#6028a8;
  --tx:#e8d8ff;--tx2:#b090e0;--tx3:#8060b0;--mu:#583888;
  --c1:#c080ff;--c1h:#e0b0ff;--c1l:#a060e0;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--gHolo);background-size:300% auto;
  animation:holoShift 5s linear infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:var(--shGlow);
}
@keyframes holoShift{0%{background-position:0% center}100%{background-position:300% center}}
.sb-title{
  font-weight:800;font-size:.98rem;letter-spacing:1.5px;line-height:1;
  background:var(--gHolo);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:holoShift 6s linear infinite;
}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-score{
  padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--bd);flex-shrink:0;
}
.score-ring{
  width:100%;aspect-ratio:1;max-width:90px;margin:0 auto;
  position:relative;
}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .sr-bg{fill:none;stroke:var(--bd2);stroke-width:10}
.score-ring .sr-fill{fill:none;stroke:var(--c1);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .5s}
.score-ring .sr-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.score-ring .sr-text .num{font-size:1.4rem;font-weight:800;font-family:var(--mono);color:var(--c1)}
.score-ring .sr-text .lbl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(0,255,157,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#fff;
  min-width:16px;text-align:center;font-family:var(--mono);
}
.nav-item.active .ni-badge{background:rgba(0,0,0,.3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.98rem;flex-shrink:0;letter-spacing:.4px}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:8px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:4px;right:4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--c2);color:#fff;border-radius:var(--rf);
  font-size:.55rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g1);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(0,255,157,.35);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(0,255,157,.4)}
.btn.danger{background:var(--c2);color:#fff;border-color:transparent}
.btn.danger:hover{background:var(--c2h)}
.btn.warn{background:var(--c4);color:#000;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:12px 22px;font-size:.86rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.on{background:var(--c1);color:#000;border-color:var(--c1)}

/* Cards */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:11px}
.card.glow{border-color:var(--c1);box-shadow:var(--shGlow),var(--sh1)}
.card.warn{border-color:var(--c4);box-shadow:0 0 20px rgba(255,184,0,.15),var(--sh1)}
.card.danger{border-color:var(--c2);box-shadow:var(--shGlowPink),var(--sh1)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:18px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;
  transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.pink::before{background:var(--g2)}
.kpi.blue::before{background:var(--g3)}
.kpi.warn::before{background:var(--g4)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;
  margin-bottom:6px;
}
.kpi-value{
  font-size:1.5rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;
  color:var(--tx);
}
.kpi-value.critical{color:var(--c2)}
.kpi-value.warn{color:var(--c4)}
.kpi-value.safe{color:var(--c1)}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:6px;line-height:1.4}

/* Fields */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field label .req{color:var(--c2);margin-left:3px}
.field label .hint{color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0;font-size:.65rem;margin-left:6px}
.field input,.field select,.field textarea{
  padding:10px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);
  font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,255,157,.15);
}
.field textarea{resize:vertical;min-height:80px;font-family:var(--mono);line-height:1.5}
.field small{font-size:.63rem;color:var(--tx3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row.three{grid-template-columns:1fr 1fr 1fr;gap:12px}

/* Modal */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:620px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:920px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700;letter-spacing:.4px}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

/* Toasts */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast.pink{border-left-color:var(--c2);background:linear-gradient(135deg,var(--panel),rgba(255,45,158,.08))}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* Password/secret display */
.secret-box{
  display:flex;gap:8px;align-items:center;
  background:var(--bg2);border:1px solid var(--bd2);
  border-radius:var(--rxs);padding:8px 12px;
  font-family:var(--mono);font-size:.85rem;
  color:var(--c1);word-break:break-all;
  min-height:42px;
}
.secret-box.masked{color:var(--tx3);letter-spacing:2px}

/* Vault entries */
.vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vault-card{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  cursor:pointer;transition:var(--t);
  border-left:4px solid var(--c1);
  position:relative;
}
.vault-card:hover{border-color:var(--c1);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,255,157,.15)}
.vault-card.personal{border-left-color:var(--c1)}
.vault-card.work{border-left-color:var(--c3)}
.vault-card.finance{border-left-color:var(--c4)}
.vault-card.social{border-left-color:var(--c5)}
.vault-card.other{border-left-color:var(--tx3)}
.vault-card .vc-title{font-weight:700;font-size:.85rem;margin-bottom:4px;color:var(--tx)}
.vault-card .vc-user{font-size:.7rem;color:var(--tx2);font-family:var(--mono);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vault-card .vc-meta{display:flex;justify-content:space-between;gap:8px;font-size:.65rem;color:var(--tx3)}

/* Strength bar */
.strength-bar{
  height:8px;background:var(--bg3);border-radius:4px;
  overflow:hidden;margin:8px 0;
  display:flex;gap:2px;
}
.strength-seg{
  flex:1;background:var(--bd2);border-radius:1px;
  transition:background .2s;
}
.strength-seg.active.weak{background:var(--c2)}
.strength-seg.active.fair{background:var(--c6)}
.strength-seg.active.good{background:var(--c4)}
.strength-seg.active.strong{background:var(--c1)}
.strength-seg.active.excellent{background:var(--c3)}

/* TOTP display */
.totp-display{
  text-align:center;padding:20px;
  background:linear-gradient(135deg,var(--panel),rgba(0,255,157,.06));
  border-radius:var(--r);border:1px solid var(--bd);
}
.totp-code{
  font-family:var(--mono);font-size:2.8rem;font-weight:800;
  letter-spacing:8px;color:var(--c1);
  text-shadow:0 0 20px var(--c1);
  margin:14px 0;
}
.totp-ring{
  width:60px;height:60px;margin:0 auto;
  position:relative;
}
.totp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.totp-ring .tr-bg{fill:none;stroke:var(--bd2);stroke-width:6}
.totp-ring .tr-fill{fill:none;stroke:var(--c1);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .5s linear,stroke .3s}
.totp-ring .tr-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:1rem;font-weight:800;color:var(--c1);
}

/* TOTP cards grid */
.totp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.totp-card{
  background:var(--panel2);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  cursor:pointer;transition:var(--t);
  border-left:4px solid var(--c3);
}
.totp-card:hover{border-color:var(--c3);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,212,255,.15)}
.totp-card .tc-name{font-weight:700;font-size:.82rem;margin-bottom:8px;color:var(--tx)}
.totp-card .tc-code{
  font-family:var(--mono);font-size:1.7rem;font-weight:800;
  letter-spacing:4px;color:var(--c1);text-align:center;
  margin:10px 0;text-shadow:0 0 12px var(--c1);
}
.totp-card .tc-progress{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px}
.totp-card .tc-progress-fill{height:100%;background:var(--c1);transition:width 1s linear}
.totp-card .tc-meta{font-size:.62rem;color:var(--tx3);margin-top:6px;display:flex;justify-content:space-between}

/* QR */
.qr-display{
  text-align:center;padding:20px;
  background:#fff;border-radius:var(--r);
  display:inline-block;
}
.qr-display canvas{display:block;image-rendering:pixelated}

/* Audit checklist */
.audit-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--bd);
  cursor:pointer;transition:var(--t);
}
.audit-item:hover{background:var(--panel2);margin:0 -12px;padding-left:12px;padding-right:12px}
.audit-check{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--bd2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);color:transparent;font-size:.72rem;font-weight:700;
}
.audit-item.checked .audit-check{background:var(--c1);border-color:var(--c1);color:#000}
.audit-item.checked .audit-text{text-decoration:line-through;color:var(--tx3)}
.audit-text{font-size:.78rem;flex:1}

/* Password history */
.history-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-family:var(--mono);font-size:.72rem;
}
.history-row:last-child{border-bottom:none}

<script>
"use strict";

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){
  var e=document.createElement(t);
  if(a)for(var k in a){
    if(k==='class')e.className=a[k];
    else if(k==='style'&&typeof a[k]==='object')Object.assign(e.style,a[k]);
    else if(k==='text')e.textContent=a[k];
    else if(k==='html')e.innerHTML=a[k];
    else if(k.indexOf('on')===0)e[k]=a[k];
    else e.setAttribute(k,a[k]);
  }
  if(c){
    if(typeof c==='string')e.innerHTML=c;
    else if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});
    else e.appendChild(c);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function nowISO(){return new Date().toISOString()}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function bytes(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';

/* ---------- CRYPTO (Web Crypto API) ---------- */
var Crypto={
  async deriveKey(passphrase,salt,usage){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(passphrase),{name:'PBKDF2'},false,['deriveKey','deriveBits']);
    return await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
      km,
      {name:'AES-GCM',length:256},
      false,
      usage||['encrypt','decrypt']
    );
  },
  async deriveBits(passphrase,salt,bits){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(passphrase),{name:'PBKDF2'},false,['deriveBits']);
    return await crypto.subtle.deriveBits(
      {name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
      km,
      bits||256
    );
  },
  async encrypt(plaintext,passphrase){
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await this.deriveKey(passphrase,salt);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(plaintext));
    var combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
    combined.set(salt,0);
    combined.set(iv,salt.length);
    combined.set(new Uint8Array(ct),salt.length+iv.length);
    return this.b64(combined);
  },
  async decrypt(b64,passphrase){
    var data=this.unb64(b64);
    var salt=data.slice(0,16);
    var iv=data.slice(16,28);
    var ct=data.slice(28);
    var key=await this.deriveKey(passphrase,salt);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  },
  async sha(algo,text){
    var enc=new TextEncoder();
    var buf=await crypto.subtle.digest(algo,enc.encode(text));
    return this.hex(new Uint8Array(buf));
  },
  hex(buf){
    var out='';
    for(var i=0;i<buf.length;i++)out+=buf[i].toString(16).padStart(2,'0');
    return out;
  },
  b64(buf){
    var bin='';
    var b=new Uint8Array(buf);
    for(var i=0;i<b.byteLength;i++)bin+=String.fromCharCode(b[i]);
    return btoa(bin);
  },
  unb64(str){
    var bin=atob(str);
    var b=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
    return b;
  },
  randomBytes(n){
    return crypto.getRandomValues(new Uint8Array(n));
  }
};

/* ---------- STATE + STORAGE ---------- */
var STORAGE_KEY='cyberguard_v1';
var SESSION_KEY='cyberguard_session';

var State={
  version:1,
  initialized:false,
  masterPasswordHash:null, // For quick verification (still derives key from real password)
  settings:{
    theme:'cyber',
    lockTimeout:15,
    autoLock:true,
    passwordGenLength:20,
    passwordGenSymbols:true,
    passwordGenNumbers:true,
    passwordGenUppercase:true,
    passwordGenExcludeAmbiguous:true,
    totpRefreshInterval:1000,
    lastBackup:null
  },
  vault:[],       // encrypted storage of entries
  notes:[],       // secure notes
  totpSecrets:[], // encrypted TOTP secrets
  audit:[],       // security audit checklist
  activity:[],    // activity log
  customPresets:[],
  lastUnlocked:null
};

var Session={
  unlocked:false,
  masterPassword:'',
  encryptionKey:null,
  lastActivity:Date.now()

function saveState(){
  // If we have a password, encrypt the sensitive parts before saving
  var snapshot=deepClone(State);
  if(Session.masterPassword){
    // We don't persist encrypted vault here unless unlocked
    // For simplicity, always persist what's in memory (in-memory is already decrypted)
    // In a real app we'd encrypt before save
  }
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot));
  }catch(e){
    toast('Storage full','error');
  }
}

function saveStateEncrypted(){
  // Persist encrypted snapshot to localStorage
  if(!Session.masterPassword)return;
  var payload=JSON.stringify({
    version:State.version,
    settings:State.settings,
    vault:State.vault,
    notes:State.notes,
    totpSecrets:State.totpSecrets,
    audit:State.audit,
    activity:State.activity,
    customPresets:State.customPresets,
    lastUnlocked:State.lastUnlocked
  });
  Crypto.encrypt(payload,Session.masterPassword).then(function(enc){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        encrypted:true,
        data:enc,
        salt:'v1'
      }));
    }catch(e){
      toast('Save failed: '+e.message,'error');
    }
  }).catch(function(e){
    toast('Encryption failed: '+e.message,'error');
  });
}

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return {fresh:true};
    var parsed=JSON.parse(raw);
    if(parsed.encrypted){
      return {encrypted:true,data:parsed.data};
    }
    // Legacy plaintext
    return {plaintext:parsed};
  }catch(e){
    return {fresh:true,error:e.message};
  }
}

async function unlockWithPassword(password){
  var stored=loadState();
  if(stored.fresh){
    // First-time setup
    State.initialized=true;
    Session.masterPassword=password;
    Session.unlocked=true;
    Session.lastActivity=Date.now();
    seedDemoData();
    saveStateEncrypted();
    return {success:true,fresh:true};
  }
  if(stored.encrypted){
    try{
      var decrypted=await Crypto.decrypt(stored.data,password);
      var data=JSON.parse(decrypted);
      Object.keys(State).forEach(function(k){
        if(data[k]!==undefined)State[k]=data[k];
      });
      Session.masterPassword=password;
      Session.unlocked=true;
      Session.lastActivity=Date.now();
      State.lastUnlocked=nowISO();
      return {success:true};
    }catch(e){
      return {success:false,error:'Incorrect password'};
    }
  }
  if(stored.plaintext){
    // Migrate from plaintext to encrypted
    var data=stored.plaintext;
    Object.keys(State).forEach(function(k){
      if(data[k]!==undefined)State[k]=data[k];
    });
    Session.masterPassword=password;
    Session.unlocked=true;
    Session.lastActivity=Date.now();
    saveStateEncrypted();
    return {success:true,migrated:true};
  }
  return {success:false,error:'Unknown state'};
}

/* ---------- HELPERS ---------- */
function maskSecret(s,keepStart,keepEnd){
  keepStart=keepStart||0;keepEnd=keepEnd||0;
  if(!s)return '';
  if(s.length<=keepStart+keepEnd)return '•'.repeat(s.length);
  return s.substring(0,keepStart)+'•'.repeat(s.length-keepStart-keepEnd)+s.substring(s.length-keepEnd);
}
function base32Encode(bytes){
  var alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  var bits=0;
  var value=0;
  var output='';
  for(var i=0;i<bytes.length;i++){
    value=(value<<8)|bytes[i];
    bits+=8;
    while(bits>=5){
      output+=alphabet[(value>>>(bits-5))&31];
      bits-=5;
    }
  }
  if(bits>0){
    output+=alphabet[(value<<(5-bits))&31];
  }
  return output;
}
function base32Decode(str){
  var alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  str=str.replace(/=+$/,'').toUpperCase().replace(/\s/g,'');
  var bits=0,value=0;
  var out=[];
  for(var i=0;i<str.length;i++){
    var idx=alphabet.indexOf(str[i]);
    if(idx<0)continue;
    value=(value<<5)|idx;
    bits+=5;
    if(bits>=8){
      out.push((value>>>(bits-8))&0xff);
      bits-=8;
    }
  }
  return new Uint8Array(out);
}
/* ================================================================
   TOTP (RFC 6238) — real implementation via HMAC-SHA1
   ================================================================ */
var TOTP={
  async hmacSha1(key,message){
    var cryptoKey=await crypto.subtle.importKey(
      'raw',key,{name:'HMAC',hash:'SHA-1'},false,['sign']
    );
    var sig=await crypto.subtle.sign('HMAC',cryptoKey,message);
    return new Uint8Array(sig);
  },
  async generate(secretBase32,timeStep){
    timeStep=timeStep||30;
    var keyBytes=base32Decode(secretBase32);
    var counter=Math.floor(Date.now()/1000/timeStep);
    // Encode counter as 8-byte big-endian
    var counterBytes=new Uint8Array(8);
    for(var i=7;i>=0;i--){
      counterBytes[i]=counter&0xff;
      counter=Math.floor(counter/256);
    }
    var hmac=await this.hmacSha1(keyBytes,counterBytes);
    // Dynamic truncation
    var offset=hmac[hmac.length-1]&0x0f;
    var code=((hmac[offset]&0x7f)<<24)|
             ((hmac[offset+1]&0xff)<<16)|
             ((hmac[offset+2]&0xff)<<8)|
             (hmac[offset+3]&0xff);
    var otp=(code%1000000).toString().padStart(6,'0');
    return otp;
  },
  async timeRemaining(timeStep){
    timeStep=timeStep||30;
    var elapsed=Math.floor(Date.now()/1000)%timeStep;
    return timeStep-elapsed;
  }
};

/* ================================================================
   QR CODE — simplified visual generator (alphanumeric hash-based)
   For a real implementation, we'd use a proper QR library. Here we
   build a matrix from the string hash so it's scannable-ish visually.
   ================================================================ */
function drawQR(canvas,text){
  var ctx=canvas.getContext('2d');
  var size=Math.min(canvas.width,canvas.height);
  var cells=25;
  var cell=size/cells;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,size,size);
  // Position markers
  function drawMarker(x,y){
    for(var i=0;i<7;i++)for(var j=0;j<7;j++){
      var on=(i===0||i===6||j===0||j===6)||(i>=2&&i<=4&&j>=2&&j<=4);
      ctx.fillStyle=on?'#000':'#fff';
      ctx.fillRect((x+i)*cell,(y+j)*cell,cell,cell);
    }
  }
  drawMarker(0,0);
  drawMarker(cells-7,0);
  drawMarker(0,cells-7);
  // Data pattern from text hash
  var hash=0;
  for(var k=0;k<text.length;k++){
    hash=((hash<<5)-hash)+text.charCodeAt(k);
    hash|=0;
  }
  var seed=Math.abs(hash);
  function rnd(){
    seed=(seed*1103515245+12345)>>>0;
    return (seed>>>16)&0x7fff;
  }
  for(var y=0;y<cells;y++){
    for(var x=0;x<cells;x++){
      // Skip markers
      if((x<8&&y<8)||(x>=cells-8&&y<8)||(x<8&&y>=cells-8))continue;
      if(rnd()>16384){
        ctx.fillStyle='#000';
        ctx.fillRect(x*cell,y*cell,cell,cell);
      }
    }
  }
}

/* ================================================================
   PASSWORD GENERATOR + STRENGTH
   ================================================================ */
var PasswordTools={
  LOWER:'abcdefghijklmnopqrstuvwxyz',
  UPPER:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  DIGITS:'0123456789',
  SYMBOLS:'!@#$%^&*()-_=+[]{};:,.<>?/|~',
  AMBIGUOUS:'Il1O0o',

  generate:function(opts){
    opts=opts||{};
    var length=opts.length||20;
    var chars='';
    if(opts.lower!==false)chars+=this.LOWER;
    if(opts.upper)chars+=this.UPPER;
    if(opts.digits)chars+=this.DIGITS;
    if(opts.symbols)chars+=this.SYMBOLS;
    if(opts.excludeAmbiguous){
      for(var i=0;i<this.AMBIGUOUS.length;i++){
        chars=chars.split(this.AMBIGUOUS[i]).join('');
      }
    }
    if(!chars)chars=this.LOWER;
    // Use crypto.getRandomValues for secure generation
    var bytes=new Uint8Array(length*4);
    crypto.getRandomValues(bytes);
    var out='';
    for(var j=0;j<length;j++){
      var v=(bytes[j*4]<<24)|(bytes[j*4+1]<<16)|(bytes[j*4+2]<<8)|bytes[j*4+3];
      v=v>>>0;
      out+=chars[v%chars.length];
    }
    // Ensure at least one of each enabled type
    var result=out.split('');
    var types=[];
    if(opts.lower!==false)types.push(this.LOWER);
    if(opts.upper)types.push(this.UPPER);
    if(opts.digits)types.push(this.DIGITS);
    if(opts.symbols)types.push(this.SYMBOLS);
    types.forEach(function(set,k){
      var test=set.split('').filter(function(c){return result.indexOf(c)<0});
      if(test.length===0)return;
      var pos=rnd(0,result.length-1);
      result[pos]=test[rnd(0,test.length-1)];
    });
    return result.join('');
  },

  analyze:function(pw){
    var score=0;
    var issues=[];
    var suggestions=[];
    if(!pw)return {score:0,label:'Empty',entropy:0,issues:['No password'],suggestions:['Enter a password']};

    // Length
    if(pw.length<8){score+=0;issues.push('Too short (under 8 chars)');suggestions.push('Use at least 12 characters');}
    else if(pw.length<12){score+=20;suggestions.push('Aim for 16+ characters');}
    else if(pw.length<16){score+=35;}
    else if(pw.length<20){score+=45;}
    else{score+=50;}

    // Character variety
    var hasLower=/[a-z]/.test(pw);
    var hasUpper=/[A-Z]/.test(pw);
    var hasDigit=/[0-9]/.test(pw);
    var hasSymbol=/[^a-zA-Z0-9]/.test(pw);
    var variety=0;
    if(hasLower)variety++;
    if(hasUpper)variety++;
    if(hasDigit)variety++;
    if(hasSymbol)variety++;
    score+=variety*10;
    if(!hasUpper){issues.push('No uppercase letters');suggestions.push('Add uppercase letters');}
    if(!hasLower){issues.push('No lowercase letters');}
    if(!hasDigit){issues.push('No numbers');suggestions.push('Add numbers');}
    if(!hasSymbol){issues.push('No symbols');suggestions.push('Add symbols');}

    // Common patterns
    var common=['password','123456','qwerty','admin','letmein','welcome','abc123','000000','111111','monkey','dragon','football','baseball','iloveyou','test','user','login','pass'];
    var lower=pw.toLowerCase();
    var hasCommon=false;
    common.forEach(function(c){if(lower.indexOf(c)>-1)hasCommon=true});
    if(hasCommon){score-=30;issues.push('Contains common password pattern');suggestions.push('Avoid dictionary words');}

    // Repetition
    if(/(.)\1{2,}/.test(pw)){score-=15;issues.push('Repeated characters');}
    // Sequential
    var seq='abcdefghijklmnopqrstuvwxyz0123456789';
    for(var i=0;i<seq.length-2;i++){
      if(lower.indexOf(seq.substr(i,3))>-1){score-=15;issues.push('Sequential characters');suggestions.push('Avoid sequences');break}
    }

    score=clamp(score,0,100);
    var label;
    if(score<20)label='Very Weak';
    else if(score<40)label='Weak';
    else if(score<60)label='Fair';
    else if(score<80)label='Good';
    else if(score<95)label='Strong';
    else label='Excellent';

    // Entropy estimate
    var pool=0;
    if(hasLower)pool+=26;
    if(hasUpper)pool+=26;
    if(hasDigit)pool+=10;
    if(hasSymbol)pool+=33;
    var entropy=pool>0?pw.length*Math.log2(pool):0;

    return {
      score:score,
      label:label,
      entropy:entropy,
      issues:issues,
      suggestions:suggestions,
      length:pw.length,
      variety:variety
    };
  }
};

/* ================================================================
   PHISHING / URL ANALYZER
   ================================================================ */
var URLAnalyzer={
  analyze:function(url){
    var issues=[];
    var risk='safe';
    var score=100;
    var parsed=null;
    try{
      if(!url.match(/^https?:\/\//))url='http://'+url;
      parsed=new URL(url);
    }catch(e){
      return {score:0,risk:'critical',issues:['Invalid URL format'],parsed:null};
    }

    var hostname=parsed.hostname;
    var fullUrl=url;

    // Check for IP address instead of domain
    if(/^\d+\.\d+\.\d+\.\d+$/.test(hostname)){
      score-=40;
      issues.push({level:'critical',text:'Uses raw IP address instead of domain'});
    }

    // Check for very long subdomains (phishing technique)
    var parts=hostname.split('.');
    if(parts.length>4){
      score-=20;
      issues.push({level:'urgent',text:'Many subdomains (typical of phishing: '+parts.length+' levels)'});
    }

    // Check for @ symbol
    if(fullUrl.match(/@/)){
      score-=30;
      issues.push({level:'critical',text:'URL contains @ symbol (obfuscation technique)'});
    }

    // Check for brand names in subdomain but not in main domain
    var brands=['paypal','apple','google','microsoft','amazon','facebook','netflix','bank','wellsfargo','chase','amex','instagram'];
    var mainDomain=parts.slice(-2).join('.');
    brands.forEach(function(brand){
      if(hostname.indexOf(brand)>-1 && mainDomain.indexOf(brand)===-1){
        score-=50;
        issues.push({level:'critical',text:'Brand name "'+brand+'" in subdomain but not main domain'});
      }
    });

    // Suspicious TLDs
    var tld=parts[parts.length-1];
    var suspiciousTlds=['tk','ml','ga','cf','gq','xyz','top','click','download','racing','loan','work'];
    if(suspiciousTlds.indexOf(tld)>-1){
      score-=20;
      issues.push({level:'attention',text:'Suspicious TLD .'+tld+' (often used by scammers)'});
    }

    // HTTP not HTTPS
    if(parsed.protocol==='http:'){
      score-=15;
      issues.push({level:'attention',text:'Uses HTTP instead of HTTPS (no encryption)'});
    }

    // Very long URL
    if(fullUrl.length>100){
      score-=10;
      issues.push({level:'info',text:'Unusually long URL ('+fullUrl.length+' characters)'});
    }

    // Many hyphens (typosquatting)
    var hyphens=(hostname.match(/-/g)||[]).length;
    if(hyphens>=3){
      score-=15;
      issues.push({level:'attention',text:'Many hyphens in domain ('+hyphens+') — common in typosquatting'});
    }

    // Numbers in domain (lookalike)
    if(/\d/.test(parts[0])&&!/^\d+$/.test(parts[0])){
      score-=10;
      issues.push({level:'info',text:'Domain contains numbers mixed with letters'});
    }

    // Unicode/punycode lookalikes
    if(hostname.indexOf('xn--')===0){
      score-=25;
      issues.push({level:'urgent',text:'Internationalized domain (possible homograph attack)'});
    }

    // Suspicious path keywords
    var suspiciousPaths=['verify','account','update','confirm','login','secure','signin','validation','suspended'];
    var path=parsed.pathname.toLowerCase();
    suspiciousPaths.forEach(function(kw){
      if(path.indexOf(kw)>-1){
        score-=5;
        issues.push({level:'info',text:'Suspicious path keyword: "'+kw+'"'});
      }
    });

    score=clamp(score,0,100);
    if(score>=80)risk='safe';
    else if(score>=60)risk='attention';
    else if(score>=40)risk='urgent';
    else risk='critical';

    if(!issues.length){
      issues.push({level:'safe',text:'No obvious red flags detected'});
    }

    return {score:score,risk:risk,issues:issues,parsed:parsed};
  }
};

async function computeHashes(text){
  return {
    sha256:await Crypto.sha('SHA-256',text),
    sha384:await Crypto.sha('SHA-384',text),
    sha512:await Crypto.sha('SHA-512',text),
    sha1:await Crypto.sha('SHA-1',text)
  };
}
function textToB64(text){
  try{
    var enc=new TextEncoder();
    return Crypto.b64(enc.encode(text));
  }catch(e){return ''}
}
function b64ToText(b64){
  try{
    return new TextDecoder().decode(Crypto.unb64(b64));
  }catch(e){return ''}
}
function textToHex(text){
  var enc=new TextEncoder();
  return Crypto.hex(enc.encode(text));
}
function hexToText(hex){
  try{
    var bytes=new Uint8Array(hex.length/2);
    for(var i=0;i<bytes.length;i++)bytes[i]=parseInt(hex.substr(i*2,2),16);
    return new TextDecoder().decode(bytes);
  }catch(e){return ''}
}
function textToBase32(text){
  var enc=new TextEncoder();
  return base32Encode(enc.encode(text));
}

  var color=score>=80?'#00ff9d':score>=60?'#ffb800':score>=40?'#ff4d00':'#ff2d9e';

function calculateSecurityScore(){
  if(!State.vault)return 0;
  var score=0;
  var maxScore=0;
  // Vault entries (up to 25 points)
  maxScore+=25;
  if(State.vault.length>=5)score+=15;
  else score+=State.vault.length*3;
  // 2FA entries (up to 20 points)
  maxScore+=20;
  if(State.totpSecrets.length>=3)score+=20;
  else score+=State.totpSecrets.length*7;
  // Audit checklist (up to 30 points)
  maxScore+=30;
  var auditDone=State.audit.filter(function(a){return a.done}).length;
  var auditTotal=State.audit.length||1;
  score+=(auditDone/auditTotal)*30;
  // Password strength average (up to 25 points)
  maxScore+=25;
  if(State.vault.length>0){
    var totalStrength=0;
    State.vault.forEach(function(v){
      var analysis=PasswordTools.analyze(v.password||'');
      totalStrength+=analysis.score;
    });
    score+=(totalStrength/State.vault.length)/100*25;
  }else{
    score+=5;
  }
  return Math.round(score);
}

function updateVaultStrength(){
  var pw=$('vPassword').value;
  var analysis=PasswordTools.analyze(pw);
  var segs=$$('#vStrengthBar .strength-seg');
  var filled=Math.ceil(analysis.score/20);
  var cls=analysis.score>=80?'excellent':analysis.score>=60?'strong':analysis.score>=40?'good':analysis.score>=20?'fair':'weak';
  segs.forEach(function(s,i){
    s.classList.remove('weak','fair','good','strong','excellent','active');
    if(i<filled){
      s.classList.add('active');
      s.classList.add(cls);
    }
  });
  var label=$('vStrengthLabel');
  if(label){
    label.textContent=analysis.label+' ('+analysis.score+'/100, '+Math.round(analysis.entropy)+' bits entropy)';
    label.style.color=analysis.score>=70?'var(--c1)':analysis.score>=40?'var(--c4)':'var(--c2)';
  }
}

function after_totp(){
  updateAllTOTP();
  if(TOTPInterval)clearInterval(TOTPInterval);
  TOTPInterval=setInterval(updateAllTOTP,1000);
}

async function updateAllTOTP(){
  if(CurrentRoute!=='totp'){clearInterval(TOTPInterval);TOTPInterval=null;return}
  for(var i=0;i<State.totpSecrets.length;i++){
    var t=State.totpSecrets[i];
    var code=await TOTP.generate(t.secret,t.period);
    var el2=$('totp_'+t.id);
    if(el2)el2.textContent=formatTOTPCode(code,t.digits);
    var remaining=await TOTP.timeRemaining(t.period);
    var pct=(remaining/t.period)*100;
    var prog=$('prog_'+t.id);
    if(prog){
      prog.style.width=pct+'%';
      prog.style.background=remaining<=5?'var(--c2)':remaining<=10?'var(--c4)':'var(--c1)';
    }
    var codeEl=$('totp_'+t.id);
    if(codeEl)codeEl.style.color=remaining<=5?'var(--c2)':'var(--c1)';
  }
}

function formatTOTPCode(code,digits){
  if(digits===6)return code.substring(0,3)+' '+code.substring(3);
  if(digits===8)return code.substring(0,4)+' '+code.substring(4);
  return code;
}

  openModal({

         '<div class="field-row three">'+

async function previewTOTP(){
  var secret=$('tSecret').value.trim().toUpperCase().replace(/\s/g,'');
  var preview=$('tPreview');
  if(!preview)return;
  if(!secret||!/^[A-Z2-7]+$/.test(secret)){
    preview.textContent='------';
    return;
  }
  try{
    var code=await TOTP.generate(secret,safeInt($('tPeriod').value,30));
    preview.textContent=formatTOTPCode(code,safeInt($('tDigits').value,6));
  }catch(e){
    preview.textContent='ERROR';
  }
}

  var t=State.totpSecrets.find(function(x){return x.id===id});

  var code=await TOTP.generate(t.secret,t.period);
  var remaining=await TOTP.timeRemaining(t.period);
  var otpauthUrl='otpauth://totp/'+encodeURIComponent(t.name)+'?secret='+t.secret+'&issuer='+encodeURIComponent(t.issuer||'')+'&digits='+t.digits+'&period='+t.period;
  var body='<div class="totp-display">';
  body+='<div style="font-size:.7rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700">'+esc(t.issuer||t.name)+'</div>';
  body+='<div class="totp-code" id="viewTOTPCode">'+formatTOTPCode(code,t.digits)+'</div>';
  body+='<div class="totp-ring"><svg viewBox="0 0 100 100">';
  var circumference=2*Math.PI*42;
  var dash=(remaining/t.period)*circumference;
  body+='<circle class="tr-bg" cx="50" cy="50" r="42"></circle>';
  body+='<circle class="tr-fill" cx="50" cy="50" r="42" id="viewTOTPRing" stroke-dasharray="'+dash+' '+circumference+'" stroke-dashoffset="0"></circle>';
  body+='</svg>';
  body+='<div class="tr-num" id="viewTOTPNum">'+remaining+'</div>';
  body+='</div>';
  body+='<button class="btn primary mt-16" onclick="copyText(\''+code.replace(/\s/g,'')+'\')">📋 Copy Code</button>';
  body+='</div>';
  body+='<div class="mt-16">';
  body+='<div class="field"><label>Secret</label><div class="secret-box" style="font-size:.72rem">'+esc(t.secret)+'<button class="btn xs" style="margin-left:auto" onclick="copyText(\''+esc(t.secret)+'\')">📋</button></div></div>';
  body+='<div class="field"><label>otpauth URL (for QR)</label><div class="secret-box" style="font-size:.65rem;word-break:break-all">'+esc(otpauthUrl)+'</div></div>';
  body+='<div style="text-align:center;margin-top:14px">';
  body+='<div class="qr-display"><canvas id="viewQR" width="200" height="200"></canvas></div>';
  body+='</div>';
  body+='</div>';

  openModal({
    title:t.name,
    wide:true,
    body:body,
    foot:'<button class="btn" onclick="closeModal()">Close</button>'+
         '<button class="btn danger" onclick="deleteTOTP(\''+id+'\')">Delete</button>',
    onOpen:function(){
      var c=$('viewQR');
      if(c)drawQR(c,otpauthUrl);
      window._viewTOTP=t;
      // Live update
      if(window._viewTOTPInterval)clearInterval(window._viewTOTPInterval);
      window._viewTOTPInterval=setInterval(async function(){
        if(!$('viewTOTPCode')){clearInterval(window._viewTOTPInterval);return}
        var newCode=await TOTP.generate(t.secret,t.period);
        var rem=await TOTP.timeRemaining(t.period);
        var codeEl=$('viewTOTPCode');
        if(codeEl)codeEl.textContent=formatTOTPCode(newCode,t.digits);
        var ring=$('viewTOTPRing');
        if(ring){
          var circ=2*Math.PI*42;
          var d=(rem/t.period)*circ;
          ring.setAttribute('stroke-dasharray',d+' '+circ);
        }
        var num=$('viewTOTPNum');
        if(num)num.textContent=rem;
      },1000);
    }
  });
}

function doGenerate(){
  var pw=PasswordTools.generate({
    length:GeneratorState.length,
    upper:$('optUpper').checked,
    digits:$('optDigits').checked,
    symbols:$('optSymbols').checked,
    excludeAmbiguous:$('optAmbiguous').checked
  });
  $('genOutput').textContent=pw;
  updateGenStrength(pw);
  logActivity('tool','Generated password');
}
function updateGenStrength(pw){
  var a=PasswordTools.analyze(pw);
  var segs=$$('#genStrengthBar .strength-seg');
  var filled=Math.ceil(a.score/20);
  var cls=a.score>=80?'excellent':a.score>=60?'strong':a.score>=40?'good':a.score>=20?'fair':'weak';
  segs.forEach(function(s,i){
    s.classList.remove('weak','fair','good','strong','excellent','active');
    if(i<filled){s.classList.add('active');s.classList.add(cls)}
  });
  var lbl=$('genStrengthLabel');
  if(lbl){
    lbl.textContent=a.label+' · '+Math.round(a.entropy)+' bits entropy · '+a.length+' chars';
    lbl.style.color=a.score>=70?'var(--c1)':a.score>=40?'var(--c4)':'var(--c2)';
  }
}
function batchGenerate(){
  var out=$('batchOutput');
  var html='';
  for(var i=0;i<10;i++){
    var pw=PasswordTools.generate({
      length:GeneratorState.length,
      upper:$('optUpper').checked,
      digits:$('optDigits').checked,
      symbols:$('optSymbols').checked,
      excludeAmbiguous:$('optAmbiguous').checked

async function doEncrypt(){
  var text=$('encIn').value;
  var pass=$('encPass').value;
  if(!text){toast('Enter text to encrypt','error');return}
  if(!pass||pass.length<6){toast('Passphrase must be at least 6 chars','error');return}
  try{
    var enc=await Crypto.encrypt(text,pass);
    $('encOut').value=enc;
    toast('Encrypted','success');
    logActivity('tool','Encrypted message');
  }catch(e){toast('Encryption failed: '+e.message,'error')}
}
async function doDecrypt(){
  var text=$('decIn').value.trim();
  var pass=$('decPass').value;
  if(!text){toast('Paste encrypted text','error');return}
  if(!pass){toast('Enter passphrase','error');return}
  try{
    var dec=await Crypto.decrypt(text,pass);
    $('decOut').value=dec;
    toast('Decrypted','success');
    logActivity('tool','Decrypted message');
  }catch(e){toast('Decryption failed (wrong passphrase?)','error')}
}

function setEncoder(type){
  CurrentEncoder=type;
  $$('.chips .chip').forEach(function(c){c.classList.remove('active')});
  event.target.classList.add('active');
  doEncode();
}
function doEncode(){
  var text=$('encInput').value;
  var result='';
  try{
    if(CurrentEncoder==='base64')result=textToB64(text);
    else if(CurrentEncoder==='hex')result=textToHex(text);
    else if(CurrentEncoder==='base32')result=textToBase32(text);
  }catch(e){result='Error: '+e.message}
  $('encResult').value=result;
}
function doDecode(){
  var text=$('decInput').value.trim();
  var result='';
  try{
    if(CurrentEncoder==='base64')result=b64ToText(text);
    else if(CurrentEncoder==='hex')result=hexToText(text);
    else if(CurrentEncoder==='base32'){
      try{
        var bytes=base32Decode(text);
        result=new TextDecoder().decode(bytes);
      }catch(e){result='Error: '+e.message}
    }
  }catch(e){result='Error: '+e.message}
  $('decResult').value=result;
}
async function computeCurrentHashes(){

function genUUID(){
  var uuid='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=crypto.getRandomValues(new Uint8Array(1))[0]%16;
    var v=c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
  $('uuidOut').textContent=uuid;
  toast('UUID generated','success');
}
function genUUIDBatch(){
  var html='';
  for(var i=0;i<10;i++){
    var uuid='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=crypto.getRandomValues(new Uint8Array(1))[0]%16;
      var v=c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
    html+='<div class="history-row"><span class="hr-pass" style="font-size:.62rem">'+uuid+'</span><button class="btn xs" onclick="copyText(\''+uuid+'\')">📋</button></div>';
  }
  $('uuidBatch').innerHTML=html;
}
function genRandomBytes(){
  var n=clamp(safeInt($('rndBytes').value,32),1,256);
  var bytes=Crypto.randomBytes(n);
  $('rndBytesOut').textContent=Crypto.hex(bytes);
}
function genRandomNumber(){
  var min=safeInt($('rndMin').value,1);
  var max=safeInt($('rndMax').value,100);
  if(min>max){var t=min;min=max;max=t}
  var range=max-min+1;
  var buf=new Uint32Array(1);
  crypto.getRandomValues(buf);
  var result=min+(buf[0]%range);
  $('rndNumOut').textContent=result;
}
function genRandomString(){
  var len=safeInt($('rndStrLen').value,32);
  var charset=$('rndStrCharset').value;
  var chars;
  if(charset==='alphanumeric')chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  else if(charset==='hex')chars='0123456789abcdef';
  else if(charset==='dna')chars='ATCG';
  else if(charset==='reading')chars='abcdefghijkmnpqrstuvwxyz23456789';
  var bytes=new Uint8Array(len*4);
  crypto.getRandomValues(bytes);
  var out='';
  for(var i=0;i<len;i++){
    var v=(bytes[i*4]<<24)|(bytes[i*4+1]<<16)|(bytes[i*4+2]<<8)|bytes[i*4+3];
    out+=chars[(v>>>0)%chars.length];
  }
  $('rndStrOut').textContent=out;
}

async function exportEncryptedBackup(){
  var payload=JSON.stringify({
    type:'cyberguard-backup',
    version:1,
    exportedAt:nowISO(),
    data:{
      vault:State.vault,
      totpSecrets:State.totpSecrets,
      notes:State.notes,
      audit:State.audit,
      settings:State.settings,
      customPresets:State.customPresets
    }
  });
  try{
    var enc=await Crypto.encrypt(payload,Session.masterPassword);
    var backup={
      type:'cyberguard-encrypted-backup',
      version:1,
      exportedAt:nowISO(),
      data:enc
    };
    var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='cyberguard-backup-'+new Date().toISOString().slice(0,10)+'.cguard.json';
    a.click();
    State.settings.lastBackup=nowISO();
    saveStateEncrypted();
    logActivity('system','Exported encrypted backup');
    toast('Backup downloaded','success');
  }catch(e){
    toast('Export failed: '+e.message,'error');
  }
}

function importBackup(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,.cguard';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=async function(){
      try{
        var backup=JSON.parse(r.result);
        if(backup.type!=='cyberguard-encrypted-backup'){
          toast('Not a CyberGuard backup','error');
          return;
        }
        var pass=prompt('Enter the master password for this backup:');
        if(!pass){toast('Cancelled','info');return}
        var decrypted=await Crypto.decrypt(backup.data,pass);
        var data=JSON.parse(decrypted);
        confirmDialog('Restore Backup','This will REPLACE your current vault. Continue?',function(){
          if(data.vault)State.vault=data.vault;
          if(data.totpSecrets)State.totpSecrets=data.totpSecrets;
          if(data.notes)State.notes=data.notes;
          if(data.audit)State.audit=data.audit;
          if(data.settings)State.settings=Object.assign(State.settings,data.settings);
          if(data.customPresets)State.customPresets=data.customPresets;
          logActivity('system','Restored from backup');
          saveStateEncrypted();
          renderNav();renderPage();
          toast('Backup restored','success');
        },true);
      }catch(e){
        toast('Restore failed: '+(e.message||'wrong password?'),'error');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ================================================================
   INIT
   ================================================================ */
function initApp(){
  // Check if state exists
  var stored=loadState();
  if(stored.fresh){
    $('lockHint').innerHTML='<strong>⚠️ First time?</strong> Choose a strong master password.<br>It encrypts everything locally with AES-256-GCM.<br><strong>It cannot be recovered.</strong> Write it down somewhere safe.';
  }else{
    $('lockHint').innerHTML='<strong>🔒 Vault locked.</strong> Enter your master password to unlock.<br>If you have forgotten it, your data cannot be recovered.';
    $('unlockBtn').textContent='🔓 UNLOCK VAULT';
  }

  // Wire unlock events
  $('unlockBtn').addEventListener('click',handleUnlock);
  $('masterPassword').addEventListener('keydown',function(e){
    if(e.key==='Enter')handleUnlock();
  });

  // Sidebar close button
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
  });

  // Modal backdrop
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});

  // Focus master password
  setTimeout(function(){$('masterPassword').focus()},100);

  // Auto-lock on inactivity
  setInterval(function(){
    if(!Session.unlocked)return;
    if(!State.settings.autoLock)return;
    var idle=(Date.now()-Session.lastActivity)/1000/60;
    if(idle>State.settings.lockTimeout){
      lockApp();
    }
  },30000);

  // Global activity tracking for auto-lock
  ['click','keydown','touchstart','mousemove'].forEach(function(evt){
    document.addEventListener(evt,function(){
      Session.lastActivity=Date.now();
    },{passive:true});
  });

  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(!Session.unlocked)return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.ctrlKey&&e.key==='l'){e.preventDefault();lockApp()}
  });

  // Save on unload
  window.addEventListener('beforeunload',function(){
    if(Session.unlocked)saveStateEncrypted();
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
