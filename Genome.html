function drawGrid(ctx,x,y,w,h,rows,cols){ctx.strokeStyle='rgba(64,255,144,.06)';ctx.lineWidth=1;for(var i=0;i<=rows;i++){var yy=y+i*h/rows;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}for(var j=0;j<=cols;j++){var xx=x+j*w/cols;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}}
function drawAxes(ctx,x,y,w,h,xL,yL){ctx.strokeStyle='rgba(64,255,144,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();ctx.fillStyle='#407860';ctx.font='9px monospace';if(xL)ctx.fillText(xL,x+w/2-20,y+h+18);if(yL){ctx.save();ctx.translate(x-16,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(yL,0,0);ctx.restore()}}
function drawArrow(ctx,x1,y1,x2,y2,color,lw){color=color||'#40ff90';lw=lw||2;ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();var ang=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(ang-0.4),y2-9*Math.sin(ang-0.4));ctx.lineTo(x2-9*Math.cos(ang+0.4),y2-9*Math.sin(ang+0.4));ctx.closePath();ctx.fill()}
function ntColor(c){return c==='A'?'#40ff90':c==='T'?'#ff4080':c==='G'?'#ffb000':c==='C'?'#00e0ff':c==='U'?'#a060ff':'#808080'}
function aaColor(c){var h=AA_HYD[c]||0;if(h>2)return '#ff4080';if(h>0)return '#ffb000';if(h>-2)return '#c0c0c0';return '#00e0ff'}
function drawSeq(ctx,x,y,seq,cellW,cellH,useNt){cellW=cellW||14;cellH=cellH||22;for(var i=0;i<seq.length;i++){var c=seq[i];var col=useNt?ntColor(c):aaColor(c);ctx.fillStyle=col;ctx.fillRect(x+i*cellW,y,cellW-1,cellH);ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(c,x+i*cellW+cellW/2,y+cellH/2+3);ctx.textAlign='left'}}
</script>

'+fmt(d.gc*100,1)+'%</div>');badge('🧬 DNA · '+d.length+' bp · GC '+fmt(d.gc*100,1)+'%');SV('sbN',d.length);SV('sbE',fmt(d.gc*100,1)+'%');SV('sbS',fmt(d.tm,0)+'°C');SV('sbQ','—')},controls:function(){var d=STATE.dna;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><textarea rows="3" oninput="STATE.dna.seq=this.value.toUpperCase().replace(/[^ATGC]/g,\'\');MODULES.dna.compute()">'+d.seq+'</textarea></div><div class="chip-row"><div class="chip" onclick="STATE.dna.seq=randomDNA(60);MODULES.dna.compute();renderLeftPanel()">🎲 Random 60bp</div><div class="chip" onclick="STATE.dna.seq=randomDNA(200);MODULES.dna.compute();renderLeftPanel()">🎲 Random 200bp</div></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.dna.seq=\'ATGGCTAGCTAGCTAGCTAA\';MODULES.dna.compute();renderLeftPanel()">Short</div><div class="chip" onclick="STATE.dna.seq=randomDNA(100);MODULES.dna.compute();renderLeftPanel()">100bp</div><div class="chip" onclick="STATE.dna.seq=\'GCGCGCGCGCGCGCGCGCGC\';MODULES.dna.compute();renderLeftPanel()">GC-rich</div><div class="chip" onclick="STATE.dna.seq=\'ATATATATATATATATATAT\';MODULES.dna.compute();renderLeftPanel()">AT-rich</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>DNA Properties</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Structure:</b> 5\'-phosphate, sugar (deoxyribose), base (A/T/G/C), 3\'-OH. Double helix B-DNA: 10.5 bp/turn, 3.4 Å/bp, 20 Å diameter.<br><br><b>Base pairing:</b> A=T (2 H-bonds), G≡C (3 H-bonds).<br><br><b>GC content:</b> (G+C)/(A+T+G+C). Human avg ~41%, coding ~50%, thermal stability ∝ GC.<br><br><b>Tm Wallace:</b> Tm = 64.9 + 41(N_GC - 16.4)/N_total<br><br><b>Tm nearest-neighbor:</b> Tm = ΔH/(ΔS+R·ln(C/4)) - 273.15, mais preciso (SantaLucia 1998).<br><br><b>Chargaff:</b> A=T e G=C em dsDNA.<br><br><b>Tipos de DNA:</b> A-DNA (11 bp/turn, RNA-like), B-DNA (10.5), Z-DNA (left-handed, 12 bp/turn, high salt).</div></div>'}});

registerModule('rna',{title:'Transcription',icon:'📜',desc:'DNA to RNA, codons.',init:function(){this.compute()},compute:function(){var r=STATE.rna;r.rna=r.dna.replace(/T/g,'U');r.codons=[];for(var i=0;i+2<r.rna.length;i+=3){r.codons.push({codon:r.rna.substr(i,3),aa:CODONS[r.dna.substr(i,3)]||'X'})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var r=STATE.rna;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('TRANSCRIPTION — DNA → mRNA → Protein',20,25);var cellW=Math.min(16,(W-60)/r.dna.length);ctx.fillStyle='#80c0a0';ctx.font='bold 10px monospace';ctx.fillText('DNA (coding):',20,55);drawSeq(ctx,20,62,r.dna,cellW,24,true);ctx.fillText('mRNA:',20,105);for(var i=0;i<r.rna.length;i++){var c=r.rna[i];var col=c==='U'?'#a060ff':ntColor(c);ctx.fillStyle=col;ctx.fillRect(20+i*cellW,112,cellW-1,24);ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(c,20+i*cellW+cellW/2,127);ctx.textAlign='left'}ctx.fillStyle='#80c0a0';ctx.fillText('Protein:',20,160);var y=167;var x=20;r.codons.forEach(function(cd){ctx.fillStyle='rgba(64,255,144,.2)';ctx.fillRect(x,y,cellW*3-1,30);ctx.strokeStyle='#40ff90';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW*3-1,30);ctx.fillStyle='#00e0ff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(cd.codon,x+cellW*1.5,y+12);ctx.fillStyle=cd.aa==='*'?'#ff4080':'#ffb000';ctx.font='bold 12px monospace';ctx.fillText(cd.aa,x+cellW*1.5,y+26);ctx.textAlign='left';x+=cellW*3+2});setStats('<div>RNA: '+r.rna.length+'</div><div>Codons: '+r.codons.length+'</div>');badge('📜 RNA · '+r.codons.length+' codons');SV('sbN',r.dna.length);SV('sbE',r.codons.length);SV('sbS','—');SV('sbQ','—')},controls:function(){var r=STATE.rna;return '<div class="sec"><h4>DNA input</h4><div class="ctrl"><textarea rows="3" oninput="STATE.rna.dna=this.value.toUpperCase().replace(/[^ATGC]/g,\'\');MODULES.rna.compute()">'+r.dna+'</textarea></div></div><button class="btn primary full" onclick="STATE.rna.dna=randomDNA(60);MODULES.rna.compute();renderLeftPanel()">🎲 Random 60bp</button>'},mathPanel:function(){return '<div class="sec"><h4>Transcription</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Central dogma:</b> DNA → RNA → Protein (Crick 1958).<br><br><b>Transcription:</b> RNA polymerase II (mRNA), I (rRNA), III (tRNA). Template strand read 3\'→5\', mRNA synthesized 5\'→3\'. T→U substitution.<br><br><b>Splicing:</b> Introns removed (spliceosome), exons joined. Alternative splicing: 95% human genes.<br><br><b>5\' cap:</b> 7-methylguanosine. <b>3\' poly-A:</b> 200-250 adenines.<br><br><b>Codon table:</b> 64 codons, 20 aa + stop (UAA/UAG/UGA). Degenerate: 61 sense codons.<br><br><b>Wobble:</b> 3rd position often silent. 32 tRNA genes enough for 61 codons.</div></div>'}});
registerModule('protein',{title:'Protein',icon:'🧪',desc:'Translation, MW, pI.',init:function(){this.compute()},compute:function(){var p=STATE.protein;p.name=p.seq.split('').map(function(c){return AA_NAME[c]||'?'}).join('-');p.mw=peptideMass(p.seq);p.pI=pI(p.seq);p.hydro=kyteDoolittle(p.seq,9)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var p=STATE.protein;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('PROTEIN — '+p.seq.length+' aa · MW '+fmt(p.mw,2)+' Da · pI '+fmt(p.pI,2),20,25);var cellW=Math.min(20,(W-60)/p.seq.length);ctx.fillStyle='#80c0a0';ctx.font='bold 10px monospace';ctx.fillText('Sequence:',20,55);drawSeq(ctx,20,62,p.seq,cellW,28,false);ctx.fillText('3-letter codes:',20,110);for(var i=0;i<p.seq.length;i++){var c=p.seq[i];ctx.fillStyle='#80c0a0';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(AA_NAME[c]||'?',20+i*cellW+cellW/2,125);ctx.textAlign='left'}var hy=160;ctx.fillStyle='#80c0a0';ctx.font='bold 10px monospace';ctx.fillText('Hydrophobicity (Kyte-Doolittle, window 9):',20,hy);var pw=W-40,ph=80;drawAxes(ctx,20,hy+10,pw,ph,'','hyd');ctx.strokeStyle='#00e0ff';ctx.lineWidth=1.5;ctx.beginPath();p.hydro.forEach(function(v,i){var x=20+i/Math.max(p.hydro.length-1,1)*pw;var y=hy+10+ph/2-v*ph/8;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(128,192,160,.3)';ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(20,hy+10+ph/2);ctx.lineTo(20+pw,hy+10+ph/2);ctx.stroke();ctx.setLineDash([]);setStats('<div>Length: '+p.seq.length+'</div><div>MW: '+fmt(p.mw,1)+'</div><div>pI: '+fmt(p.pI,2)+'</div>');badge('🧪 Protein · '+p.seq.length+' aa');SV('sbN',p.seq.length);SV('sbE',fmt(p.mw,0));SV('sbS',fmt(p.pI,2));SV('sbQ','—')},controls:function(){var p=STATE.protein;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><textarea rows="3" oninput="STATE.protein.seq=this.value.toUpperCase().replace(/[^ARNDCQEGHILKMFPSTWYV]/g,\'\');MODULES.protein.compute()">'+p.seq+'</textarea></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.protein.seq=\'MKTAYIAKQRQISFVKSHFSRQ\';MODULES.protein.compute();renderLeftPanel()">Insulin</div><div class="chip" onclick="STATE.protein.seq=\'MAGKVILYKAEGERPL\';MODULES.protein.compute();renderLeftPanel()">Sample</div><div class="chip" onclick="STATE.protein.seq=\'M\';MODULES.protein.compute();renderLeftPanel()">Met only</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Proteins</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>20 amino acids</b> with side chains: aliphatic (G,A,V,L,I), aromatic (F,Y,W), polar (S,T,N,Q,C), charged (K,R,H/D,E), special (P).<br><br><b>Peptide bond:</b> -CO-NH-, planar, partial double bond. N-terminus → C-terminus.<br><br><b>Mass:</b> sum AA masses + H2O (18.011 Da). Average aa ~110 Da.<br><br><b>pI:</b> isoelectric point, no net charge. Determined by pKa of side chains + termini.<br><br><b>Structure levels:</b> 1° sequence, 2° α-helix/β-sheet, 3° 3D fold, 4° quaternary.<br><br><b>Kyte-Doolittle:</b> hydropathy scale 20 aa (-4.5 R to +4.5 I). Window ~9 aa.<br><br><b>AlphaFold2:</b> deep learning, CASP14 (2020) atomic accuracy. ~200M proteins predicted.</div></div>'}});

registerModule('phylogeny',{title:'Phylogenetic Tree',icon:'🌳',desc:'UPGMA clustering.',init:function(){this.reset()},reset:function(){var p=STATE.phylogeny;var n=5;p.labels=['A','B','C','D','E'];p.dist=[];for(var i=0;i<n;i++){p.dist.push([]);for(var j=0;j<n;j++){if(i===j)p.dist[i].push(0);else if(j<i)p.dist[i].push(p.dist[j][i]);else p.dist[i].push(rnd(1,20)/10)}}p.tree=upgma(p.labels,p.dist)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var p=STATE.phylogeny;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('PHYLOGENETIC TREE (UPGMA)',20,25);var cx=W/2,cy=H-40;var scale=Math.min(W/2,H-100)/6;var nodeY=[];var leafCount=0;p.labels.forEach(function(l,i){nodeY.push({x:40+leafCount*60,y:cy,label:l});leafCount++});var events=p.tree.tree;var clusterY=p.labels.map(function(l,i){return{label:l,x:40+i*((W-80)/(p.labels.length-1)),y:cy}});events.forEach(function(ev){var a=ev.a,b=ev.b;var ya=clusterY.find(function(c){return c.label===a.label})||{x:40+Math.random()*300,y:cy-100};var yb=clusterY.find(function(c){return c.label===b.label})||{x:40+Math.random()*300,y:cy-100};var hy=cy-ev.height*scale*3;ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ya.x,ya.y);ctx.lineTo(ya.x,hy);ctx.moveTo(yb.x,yb.y);ctx.lineTo(yb.x,hy);ctx.moveTo(ya.x,hy);ctx.lineTo(yb.x,hy);ctx.stroke();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc((ya.x+yb.x)/2,hy,3,0,Math.PI*2);ctx.fill();clusterY=clusterY.filter(function(c){return c.label!==a.label&&c.label!==b.label});clusterY.push({label:'('+a.label+','+b.label+')',x:(ya.x+yb.x)/2,y:hy})});ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';p.labels.forEach(function(l,i){ctx.fillStyle='#ffb000';ctx.fillText(l,40+i*((W-80)/(p.labels.length-1))-4,cy+18)});setStats('<div>Leaves: '+p.labels.length+'</div><div>Depth: '+p.tree.tree.length+'</div>');badge('🌳 UPGMA · '+p.labels.length+' leaves');SV('sbN',p.labels.length);SV('sbE',p.tree.tree.len registerModule('amino',{title:'Amino Acids',icon:'🔤',desc:'20 standard amino acid properties.',init:function(){this.compute()},compute:function(){var a=STATE.amino;var aa=a.aa;a.props={name:AA_NAME[aa],mw:AA_MW[aa],hydro:AA_HYD[aa],charge:AA_CHARGE[aa],volume:AA_VOL[aa],polar:AA_POLAR[aa]}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var a=STATE.amino;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('AMINO ACIDS — '+a.aa+' ('+a.props.name+')',20,25);var cx=W/2,cy=H/2-20;ctx.fillStyle=aaColor(a.aa);ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#000';ctx.font='bold 36px monospace';ctx.textAlign='center';ctx.fillText(a.aa,cx,cy+12);ctx.textAlign='left';var props=[['Name',a.props.name],['3-letter',AA_NAME[a.aa]],['MW (Da)',fmt(a.props.mw,2)],['Hydropathy',fmt(a.props.hydro,2)],['Charge',fmt(a.props.charge,2)],['Volume (Å³)',fmt(a.props.volume,1)],['Polar',a.props.polar?'Yes':'No']];ctx.fillStyle='rgba(6,20,16,.9)';ctx.fillRect(30,H-180,W-60,160);ctx.strokeStyle='#40ff90';ctx.lineWidth=1.2;ctx.strokeRect(30,H-180,W-60,160);ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('PROPERTIES',45,H-155);props.forEach(function(p,i){ctx.fillStyle='#80c0a0';ctx.font='10px monospace';ctx.fillText(p[0]+':',45,H-130+i*18);ctx.fillStyle='#40ff90';ctx.fillText(p[1],200,H-130+i*18)});setStats('<div>AA: '+a.aa+'</div><div>MW: '+fmt(a.props.mw,1)+'</div>');badge('🔤 '+a.aa+' — '+a.props.name);SV('sbN',a.aa);SV('sbE',fmt(a.props.mw,0));SV('sbS',fmt(a.props.hydro,1));SV('sbQ',fmt(a.props.charge,1))},controls:function(){var a=STATE.amino;var h='<div class="sec"><h4>Select AA</h4><div class="chip-row">';for(var i=0;i<20;i++){var aa=AA_ORDER[i];h+='<div class="chip '+(a.aa===aa?'active':'')+'" onclick="STATE.amino.aa=\''+aa+'\';MODULES.amino.compute();renderLeftPanel()">'+aa+'</div>'}h+='</div></div>';return h},mathPanel:function(){return '<div class="sec"><h4>Amino Acids</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>20 standard</b> + selenocysteine (U) + pyrrolysine (O).<br><br><b>Categorias:</b><br>• Aliphatic: G, A, V, L, I<br>• Aromatic: F, Y, W<br>• Sulfur: C, M<br>• Hydroxyl: S, T<br>• Basic: K, R, H<br>• Acidic: D, E<br>• Amide: N, Q<br>• Imino: P<br><br><b>Essential (human):</b> H, I, L, K, M, F, T, W, V (9).<br><br><b>Código genético:</b> 64 códons, 20 aa, 3 stops, 1 start (AUG).<br><br><b>Propriedades físico-químicas:</b><br>• MW: 75-204 Da<br>• Hydropathy (Kyte-Doolittle): -4.5 to +4.5<br>• Volume: 60-228 Å³<br>• pKa side chains: 3.9 (D) a 12.5 (R)</div></div>'}});
registerModule('ramachandran',{title:'Ramachandran Plot',icon:'◆',desc:'φ/ψ dihedral angles of protein backbone.',init:function(){this.compute()},compute:function(){var r=STATE.ramachandran;var dat=ramachandran(r.seq);r.points=[];for(var i=0;i<dat.phi.length;i++)r.points.push({phi:dat.phi[i],psi:dat.psi[i]})},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var r=STATE.ramachandran;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('RAMACHANDRAN PLOT — '+r.points.length+' residues',20,25);var cx=W/2,cy=H/2+20,rw=Math.min(W-100,H-100)/2;ctx.fillStyle='rgba(6,20,16,.6)';ctx.fillRect(cx-rw,cy-rw,rw*2,rw*2);ctx.strokeStyle='rgba(64,255,144,.5)';ctx.lineWidth=1.5;ctx.strokeRect(cx-rw,cy-rw,rw*2,rw*2);ctx.strokeStyle='rgba(128,192,160,.3)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(cx,cy-rw);ctx.lineTo(cx,cy+rw);ctx.moveTo(cx-rw,cy);ctx.lineTo(cx+rw,cy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(64,255,144,.15)';ctx.beginPath();ctx.ellipse(cx-rw*0.35,cy-rw*0.25,rw*0.35,rw*0.28,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(0,224,255,.15)';ctx.beginPath();ctx.ellipse(cx-rw*0.85,cy+rw*0.65,rw*0.3,rw*0.15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#80c0a0';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('α-helix',cx-rw*0.35,cy-rw*0.6);ctx.fillText('β-sheet',cx-rw*0.85,cy+rw*0.9);ctx.fillText('φ',cx+rw+15,cy+4);ctx.fillText('ψ',cx,cy-rw-10);ctx.textAlign='left';r.points.forEach(function(p){var x=cx+p.phi/180*rw;var y=cy-p.psi/180*rw;ctx.fillStyle='#ffb000';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#40ff90';ctx.lineWidth=1;ctx.stroke()});setStats('<div>Residues: '+r.points.length+'</div><div>Range: -180 to 180</div>');badge('◆ Ramachandran · '+r.points.length+' pts');SV('sbN',r.points.length);SV('sbE','-180..180');SV('sbS','—');SV('sbQ','—')},controls:function(){var r=STATE.ramachandran;return '<div class="sec"><h4>Sequence</h4> registerModule('secondary',{title:'Secondary Structure',icon:'∿',desc:'Chou-Fasman prediction.',init:function(){this.compute()},compute:function(){var s=STATE.secondary;s.pred=chouFasman(s.seq);s.helices=0;s.sheets=0;for(var i=0;i<s.pred.smoothed.length;i++){if(s.pred.smoothed[i]==='H')s.helices++;else if(s.pred.smoothed[i]==='E')s.sheets++}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var s=STATE.secondary;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('SECONDARY STRUCTURE (Chou-Fasman)',20,25);var cellW=Math.min(20,(W-60)/s.seq.length);ctx.fillStyle='#80c0a0';ctx.font='bold 10px monospace';ctx.fillText('Sequence:',20,55);drawSeq(ctx,20,62,s.seq,cellW,24,false);ctx.fillText('Raw prediction:',20,105);for(var i=0;i<s.pred.raw.length;i++){var ss=s.pred.raw[i];ctx.fillStyle=ss==='H'?'#ff4080':ss==='E'?'#00e0ff':ss==='T'?'#ffb000':'#404040';ctx.fillRect(20+i*cellW,112,cellW-1,20)}ctx.fillText('Smoothed:',20,155);for(var i2=0;i2<s.pred.smoothed.length;i2++){var ss2=s.pred.smoothed[i2];ctx.fillStyle=ss2==='H'?'#ff4080':ss2==='E'?'#00e0ff':ss2==='T'?'#ffb000':'#404040';ctx.fillRect(20+i2*cellW,162,cellW-1,20)}ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';var legend=[['H (helix)','#ff4080'],['E (sheet)','#00e0ff'],['T (turn)','#ffb000'],['- (coil)','#404040']];legend.forEach(function(l,i){ctx.fillStyle=l[1];ctx.fillRect(20+i*140,H-50,15,15);ctx.fillStyle='#80c0a0';ctx.font='10px monospace';ctx.fillText(l[0],40+i*140,H-38)});setStats('<div>Helix: '+s.helices+'</div><div>Sheet: '+s.sheets+'</div>');badge('∿ 2nd struct · H'+s.helices+' E'+s.sheets);SV('sbN',s.seq.length);SV('sbE',s.helices);SV('sbS',s.sheets);SV('sbQ','—')},controls:function(){var s=STATE.secondary;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><input type="text" value="'+s.seq+'" oninput="STATE.secondary.seq=this.value.toUpperCase();MODULES.secondary.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Chou-Fasman</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Método:</b> estatístico, baseado em propensities de 20 aa.<br><br><b>Propensity:</b> P(aa, structure) = freq em estrutura / freq global.<br><br><b>Regras:</b><br>• Helix: nucleação (4/6), extensão (P&gt;1.0)<br>• Sheet: similar<br>• Turn: 4-residue motifs<br><br><b>Precisão:</b> ~60-65% (vs DSSP real).<br><br><b>Alternativas:</b><br>• PHD (Rost 1994): ~72%<br>• PSIPRED (Jones 1999): ~80%<br>• Deep learning (SPOT-1D): ~85%<br>• AlphaFold2: end-to-end<br><br><b>Output:</b> 3-state: H (helix), E (sheet), C (coil)<br><br><b>DSSP (Kabsch-Sander 1983):</b> ground truth, baseado em H-bonds.</div></div>'}});
registerModule('hydrophobicity',{title:'Hydropathy Plot',icon:'💧',desc:'Kyte-Doolittle sliding window.',init:function(){this.compute()},compute:function(){var h=STATE.hydrophobicity;h.profile=kyteDoolittle(h.seq,h.window)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var h=STATE.hydrophobicity;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('HYDROPATHY — Kyte-Doolittle window '+h.window,20,25);var cellW=Math.min(18,(W-60)/h.seq.length);drawSeq(ctx,20,50,h.seq,cellW,22,false);var pw=W-40,ph=H-160,px=20,py=100;drawAxes(ctx,px,py,pw,ph,'','hydropathy');ctx.strokeStyle='rgba(128,192,160,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,py+ph/2);ctx.lineTo(px+pw,py+ph/2);ctx.stroke();var maxAbs=Math.max.apply(null,h.profile.map(Math.abs));var scaleY=ph/2/Math.max(maxAbs,1);ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;ctx.beginPath();h.profile.forEach(function(v,i){var x=px+i/Math.max(h.profile.length-1,1)*pw;var y=py+ph/2-v*scaleY;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var tmY=py+ph/2-1.6*scaleY;ctx.strokeStyle='rgba(255,64,128,.4)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px,tmY);ctx.lineTo(px+pw,tmY);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('TM threshold 1.6',px+5,tmY-3);setStats('<div>Len: '+h.seq.length+'</div><div>Max: '+fmt(maxAbs,2)+'</div>');badge('💧 Hydropathy · window '+h.window);SV('sbN',h.seq.length);SV('sbE',fmt(maxAbs,2));SV('sbS',h.window);SV('sbQ','—')},controls:function(){var h=STATE.hydrophobicity;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><input type="text" value="'+h.seq+'" oninput="STATE.hydrophobicity.seq=this.value.toUpperCase();MODULES.hydrophobicity.compute()"></div></div><div class="sec"><h4>Window size</h4><div class="ctrl"><div class="lbl"><span>aa</span><span>'+h.window+'</span></div><input type="range" min="3" max="21" step="2" value="'+h.window+'" oninput="STATE.hydrophobicity.window=parseInt(this.value);MODULES.hydrophobicity.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Kyte-Doolittle</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Escala:</b> Kyte & Doolittle 1982. 20 aa com valores -4.5 (R) a +4.5 (I).<br><br><b>Cálculo:</b> média em janela de N aa (default 9).<br><br><b>Interpretação:</b><br>• Pico &gt; 1.6: TM domain (transmembrane)<br>• Pico &gt; 2.0: forte hidrofóbico<br>• Vale &lt; -1: hidrofílico (solvent exposed)<br><br><b>Predição TM:</b><br>~20 aa stretch com hydropathy &gt; 1.6<br>~19 aa α-helix para atravessar membrana<br><br><b>Outras escalas:</b><br>• Hopp-Woods (hidrofílico)<br>• Eisenberg (consensus)<br>• Janin (surface)<br>• Wimley-White<br><br><b>Ferramentas:</b> TMHMM, TMpred, Phobius, DeepTMHMM.</div></div>'}});
registerModule('isoelectric',{title:'Isoelectric Point',icon:'⚖',desc:'Charge vs pH, pI prediction.',init:function(){this.compute()},compute:function(){var i=STATE.isoelectric;i.pI=pI(i.seq);i.curve=[];for(var pH=0;pH<=14;pH+=0.1){var q=0;var pKa={D:3.65,E:4.25,C:8.18,Y:10.07,H:6.00,K:10.53,R:12.48};for(var j=0;j<i.seq.length;j++){var a=i.seq[j];if(pKa[a]!==undefined)q+=(a==='D'||a==='E'||a==='C'||a==='Y')?-1/(1+Math.pow(10,pKa[a]-pH)):1/(1+Math.pow(10,pH-pKa[a]))}q+=1/(1+Math.pow(10,pH-9.69));q-=1/(1+Math.pow(10,2.34-pH));i.curve.push({pH:pH,q:q})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var i=STATE.isoelectric;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('ISOELECTRIC POINT — pI = '+fmt(i.pI,2),20,25);var px=60,py=60,pw=W-120,ph=H-120;drawAxes(ctx,px,py,pw,ph,'pH','net charge');ctx.strokeStyle='rgba(128,192,160,.3)';ctx.lineWidth=1;var zeroY=py+ph/2;ctx.beginPath();ctx.moveTo(px,zeroY);ctx.lineTo(px+pw,zeroY);ctx.stroke();ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;ctx.beginPath();i.curve.forEach(function(p,idx){var x=px+p.pH/14*pw;var y=zeroY-p.q*ph/20;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var piX=px+i.pI/14*pw;ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(piX,py);ctx.lineTo(piX,py+ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='bold 11px monospace';ctx.fillText('pI',piX+5,py+15);setStats('<div>pI: '+fmt(i.pI,2)+'</div><div>Length: '+i.seq.length+'</div>');badge('⚖ pI = '+fmt(i.pI,2));SV('sbN',i.seq.length);SV('sbE',fmt(i.pI,2));SV('sbS','—');SV('sbQ','—')},controls:function(){var i=STATE.isoelectric;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><input type="text" value="'+i.seq+'" oninput="STATE.isoelectric.seq=this.value.toUpperCase();MODULES.isoelectric.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Isoelectric Point</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Definição:</b> pH onde carga líquida = 0.<br><br><b>pKa side chains:</b><br>D=3.65, E=4.25 (acidic)<br>C=8.18, Y=10.07 (thiol, phenol)<br>H=6.00 (imidazole)<br>K=10.53, R=12.48 (basic)<br>N-term=9.69, C-term=2.34<br><br><b>Cálculo:</b><br>q(pH) = Σ (+1)/(1+10^(pH-pKa)) - Σ 1/(1+10^(pKa-pH))<br>Bisection em pH onde q=0.<br><br><b>Aplicações:</b><br>• IEF (isoelectric focusing)<br>• 2D-PAGE (1ª dim)<br>• Purificação (ion exchange)<br>• Cristalização<br><br><b>Valores típicos:</b><br>pI ~ 4-6 (acidic proteins)<br>pI ~ 8-10 (basic proteins)</div></div>'}});

registerModule('mc',{title:'Monte Carlo',icon:'🎲',desc:'Metropolis sampling of LJ cluster.',init:function(){this.reset()},reset:function(){var m=STATE.mc;m.pos=[];for(var i=0;i<m.n;i++){m.pos.push((Math.random()-0.5)*5);m.pos.push((Math.random()-0.5)*5)}m.accepts=0;m.attempts=0;m.history=[]},energy:function(pos){var n=pos.length/2;var e=0;for(var i=0;i<n;i++){for(var j=i+1;j<n;j++){var dx=pos[2*i]-pos[2*j];var dy=pos[2*i+1]-pos[2*j+1];var r=Math.sqrt(dx*dx+dy*dy);if(r<3)e+=lennardJones(Math.max(r,0.5),1,1)}}return e},step:function(){var m=STATE.mc;var n=m.pos.length;var i=rnd(0,n/2-1);var oldPos=m.pos.slice();var dx=(Math.random()-0.5)*0.5,dy=(Math.random()-0.5)*0.5;m.pos[2*i]+=dx;m.pos[2*i+1]+=dy;var eOld=this.energy(oldPos);var eNew=this.energy(m.pos);var dE=eNew-eOld;if(metropolis(dE,m.T)){m.accepts++;m.history.push({t:m.attempts,e:eNew})}else{m.pos=oldPos}m.attempts++;if(m.history.length>500)m.history.shift()},tick:function(dt){STATE.time+=dt;var m=STATE.mc;if(!STATE.playing)return;for(var i=0;i<5;i++)this.step()},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var m=STATE.mc;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('MONTE CARLO — T='+m.T+' · accept rate '+fmt(m.accepts/Math.max(m.attempts,1)*100,1)+'%',20,25);var cx=W*0.4,cy=H/2,r=Math.min(W*0.3,H*0.4);ctx.strokeStyle='rgba(64,255,144,.3)';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();for(var i=0;i<m.n;i++){var x=cx+m.pos[2*i]/5*r;var y=cy+m.pos[2*i+1]/5*r;ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#40ff90';ctx.stroke()}var px=W*0.65,py=60,pw=W*0.3,ph=H*0.4;ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('Energy vs moves:',px,py-5);drawGrid(ctx,px,py,pw,ph,3,6);if(m.history.length>1){var es=m.history.map(function(h){return h.e});var minE=Math.min.apply(null,es),maxE=Math.max.apply(null,es);ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;ctx.beginPath();m.history.forEach registerModule('min',{title:'Energy Minimization',icon:'↓',desc:'Steepest descent on 2D potential.',init:function(){this.reset()},reset:function(){var m=STATE.min;m.x=3;m.y=3;m.path=[{x:m.x,y:m.y}]},f:function(x,y){return 4*(x*x-1)*(x*x-1)+2*y*y+0.5*x*y+Math.sin(x*3)*0.5},grad:function(x,y){var h=0.001;return[(this.f(x+h,y)-this.f(x-h,y))/(2*h),(this.f(x,y+h)-this.f(x,y-h))/(2*h)]},step:function(){var m=STATE.min;var g=this.grad(m.x,m.y);var lr=0.1;m.x-=lr*g[0];m.y-=lr*g[1];m.x=clamp(m.x,-3,3);m.y=clamp(m.y,-3,3);m.path.push({x:m.x,y:m.y});if(m.path.length>500)m.path.shift()},tick:function(dt){STATE.time+=dt;var m=STATE.min;if(!STATE.playing)return;this.step()},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var m=STATE.min;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('MINIMIZATION — (x,y)=('+fmt(m.x,3)+','+fmt(m.y,3)+') · E='+fmt(this.f(m.x,m.y),4),20,25);var cx=W/2,cy=H/2,r=Math.min(W,H)*0.4;var gridN=40;var cellW=r*2/gridN,cellH=r*2/gridN;var minE=Infinity,maxE=-Infinity;var vals=[];for(var i=0;i<gridN;i++){vals.push([]);for(var j=0;j<gridN;j++){var x=(i/gridN-0.5)*6,y=(j/gridN-0.5)*6;var v=this.f(x,y);vals[i].push(v);if(v<minE)minE=v;if(v>maxE)maxE=v}}for(var i2=0;i2<gridN;i2++){for(var j2=0;j2<gridN;j2++){var v2=vals[i2][j2];var norm=(v2-minE)/(maxE-minE+1e-9);var col=Math.floor((1-norm)*255);ctx.fillStyle='rgb('+col+','+Math.floor(norm*100)+','+Math.floor(norm*200)+')';ctx.fillRect(cx-r+i2*cellW,cy-r+j2*cellH,cellW+1,cellH+1)}}ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.strokeRect(cx-r,cy-r,r*2,r*2);ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;ctx.beginPath();m.path.forEach(function(p,i){var x=cx+p.x/6*r*2;var y=cy+p.y/6*r*2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var pxx=cx+m.x/6*r*2;var pyy=cy+m.y/6*r*2;ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(pxx,pyy,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();setStats('<div>E: '+fmt(this.f(m.x,m.y),4)+'</div><div>Steps: '+m.path.length+'</div>');badge('↓ Min · E='+fmt(this.f(m.x,m.y),3));SV('sbN',fmt(m.x,2));SV('sbE',fmt(m.y,2));SV('sbS',fmt(this.f(m.x,m.y),3));SV('sbQ',m.path.length)},controls:function(){var m=STATE.min;return '<div class="sec"><h4>Optimization</h4><div class="kv"><div class="row"><span class="k">x</span><span class="v">'+fmt(m.x,3)+'</span></div><div class="row"><span class="k">y</span><span class="v">'+fmt(m.y,3)+'</span></div><div class="row"><span class="k">E</span><span class="v">'+fmt(this.f(m.x,m.y),4)+'</span></div></div></div><button class="btn primary full" onclick="MODULES.min.reset();toast(\'Reset\',\'success\')">↺ Random start</button>'},mathPanel:function(){return '<div class="sec"><h4>Minimization</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Steepest descent:</b><br>x_{k+1} = x_k - α ∇f(x_k)<br><br><b>Conjugate gradient:</b><br>p_k = -∇f + β p_{k-1}<br>Mais rápido em vales alongados.<br><br><b>Newton-Raphson:</b><br>x_{k+1} = x_k - H⁻¹ ∇f<br>Convergência quadrática, H caro.<br><br><b>BFGS:</b> aproxima H iterativamente (quasi-Newton).<br><br><b>Aplicações:</b><br>• Protein energy minimization<br>• Drug docking refinement<br>• Force field optimization<br>• QM/MM<br><br><b>Ferramentas:</b> L-BFGS, Conjugate Gradient, Fire.</div></div>'}});
registerModule('hpfold',{title:'HP Folding',icon:'🧩',desc:'Hydrophobic-polar lattice model.',init:function(){this.reset()},reset:function(){var h=STATE.hpfold;var dat=hpFolding(h.seq);h.pos=dat.pos;h.energy=dat.energy;h.iterations=0},step:function(){var h=STATE.hpfold;var best=null,bestE=0;for(var it=0;it<50;it++){var dat=hpFolding(h.seq);if(dat.energy<bestE||!best){best=dat;bestE=dat.energy}}if(best&&bestE<=h.energy){h.pos=best.pos;h.energy=best.energy}h.iterations++},tick:function(dt){STATE.time+=dt;var h=STATE.hpfold;if(!STATE.playing)return;if(h.iterations<200)this.step()},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var h=STATE.hpfold;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('HP FOLDING — energy '+h.energy+' · iter '+h.iterations,20,25);var cx=W/2,cy=H/2,cellSize=Math.min(40,(W-100)/15);var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;h.pos.forEach(function(p){if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y});var offX=cx-(minX+maxX)/2*cellSize;var offY=cy-(minY+maxY)/2*cellSize;for(var i=0;i<h.pos.length-1;i++){var p1=h.pos[i],p2=h.pos[i+1];ctx.strokeStyle='#80c0a0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(offX+p1.x*cellSize,offY+p1.y*cellSize);ctx.lineTo(offX+p2.x*cellSize,offY+p2.y*cellSize);ctx.stroke()}h.pos.forEach(function(p,i){var x=offX+p.x*cellSize;var y=offY+p.y*cellSize;var col=h.seq[i]==='H'?'#ff4080':h.seq[i]==='P'?'#00e0ff':'#808080';ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,cellSize*0.35,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke()});setStats('<div>Energy: '+h.energy+'</div><div>Len: '+h.seq.length+'</div>');badge('🧩 HP · E='+h.energy);SV('sbN',h.seq.length);SV('sbE',h.energy);SV('sbS',h.iterations);SV('sbQ','—')},controls:function(){var h=STATE.hpfold;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><input type="text" value="'+h.seq+'" oninput="STATE.hpfold.seq=this.value.toUpperCas registerModule('contactmap',{title:'Contact Map',icon:'🔗',desc:'Protein 3D contacts matrix.',init:function(){this.reset()},reset:function(){var c=STATE.contactmap;c.coords=[];var cx=0,cy=0,cz=0;for(var i=0;i<c.n;i++){var phi=i/c.n*Math.PI*4;var theta=Math.random()*Math.PI;var r=10+Math.sin(phi*2)*3;c.coords.push({x:r*Math.sin(theta)*Math.cos(phi),y:r*Math.sin(theta)*Math.sin(phi),z:r*Math.cos(theta)})}c.cm=contactMap(c.coords,c.cutoff)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var c=STATE.contactmap;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('CONTACT MAP — '+c.n+' residues · cutoff '+c.cutoff+' Å',20,25);var size=Math.min(W,H)-100;var ox=(W-size)/2,oy=(H-size)/2+10;var cellSize=size/c.n;for(var i=0;i<c.n;i++){for(var j=0;j<c.n;j++){if(c.cm[i][j]){ctx.fillStyle='#40ff90';ctx.fillRect(ox+i*cellSize,oy+j*cellSize,cellSize-0.5,cellSize-0.5)}}}ctx.strokeStyle='rgba(64,255,144,.3)';ctx.lineWidth=1;ctx.strokeRect(ox,oy,size,size);ctx.strokeStyle='rgba(128,192,160,.5)';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+size,oy+size);ctx.stroke();setStats('<div>N: '+c.n+'</div><div>Cutoff: '+c.cutoff+'</div>');badge('🔗 Contacts · '+c.n+'×'+c.n);SV('sbN',c.n);SV('sbE',c.cutoff);SV('sbS','—');SV('sbQ','—')},controls:function(){var c=STATE.contactmap;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>N residues</span><span>'+c.n+'</span></div><input type="range" min="10" max="80" step="2" value="'+c.n+'" oninput="STATE.contactmap.n=parseInt(this.value);MODULES.contactmap.reset()"></div><div class="ctrl"><div class="lbl"><span>Cutoff (Å)</span><span>'+c.cutoff+'</span></div><input type="range" min="4" max="15" step="0.5" value="'+c.cutoff+'" oninput="STATE.contactmap.cutoff=parseFloat(this.value);MODULES.contactmap.reset()"></div></div><button class="btn primary full" onclick="MODULES.contactmap.reset();toast(\'New structure\',\'success\')">🎲 Ne registerModule('qsar',{title:'QSAR Regression',icon:'📈',desc:'Quantitative structure-activity relationship.',init:function(){this.reset()},reset:function(){var q=STATE.qsar;q.compounds=[];var n=15;for(var i=0;i<n;i++){var x=Math.random()*10;var y=2*x+3+rndn()*2;q.compounds.push({x:x,y:y})}var sx=0,sy=0,sxy=0,sxx=0;q.compounds.forEach(function(c){sx+=c.x;sy+=c.y;sxy+=c.x*c.y;sxx+=c.x*c.x});var nn=q.compounds.length;q.slope=(nn*sxy-sx*sy)/(nn*sxx-sx*sx);q.intercept=(sy-q.slope*sx)/nn;var ssTot=0,ssRes=0;var my=sy/nn;q.compounds.forEach(function(c){ssTot+=Math.pow(c.y-my,2);ssRes+=Math.pow(c.y-(q.slope*c.x+q.intercept),2)});q.r2=1-ssRes/Math.max(ssTot,1e-9)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var q=STATE.qsar;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('QSAR — y = '+fmt(q.slope,3)+'x + '+fmt(q.intercept,3)+' · R²='+fmt(q.r2,4),20,25);var px=80,py=60,pw=W-160,ph=H-140;drawAxes(ctx,px,py,pw,ph,'descriptor','activity');q.compounds.forEach(function(c){var x=px+c.x/10*pw;var y=py+ph-c.y/25*ph;ctx.fillStyle='#00e0ff';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();var y1=q.slope*0+q.intercept;var y2=q.slope*10+q.intercept;ctx.moveTo(px,py+ph-y1/25*ph);ctx.lineTo(px+pw,py+ph-y2/25*ph);ctx.stroke();setStats('<div>Slope: '+fmt(q.slope,3)+'</div><div>R²: '+fmt(q.r2,4)+'</div>');badge('📈 QSAR · R²='+fmt(q.r2,3));SV('sbN',q.compounds.length);SV('sbE',fmt(q.slope,2));SV('sbS',fmt(q.intercept,2));SV('sbQ',fmt(q.r2,3))},controls:function(){var q=STATE.qsar;return '<div class="sec"><h4>Model</h4><div class="kv"><div class="row"><span class="k">Slope</span><span class="v">'+fmt(q.slope,4)+'</span></div><div class="row"><span class="k">Intercept</span><span class="v">'+fmt(q.intercept,4)+'</span></div><div class="row"><span class="k">R²</span><span class="v">'+fmt(q.r2,4)+'</span></div></div></div><button class="b registerModule('cai',{title:'Codon Optimization',icon:'📉',desc:'Codon Adaptation Index.',init:function(){this.compute()},compute:function(){var c=STATE.cai;var weights={ATG:1,TGG:1,CTG:0.8,GTG:0.6,CTG_alt:0.8,TTT:0.5,TTC:1.0,GAA:0.7,GAG:1.0,AAA:0.8,AAG:1.0,CTG:0.8,CTA:0.5,CTC:0.8,CTT:0.5,TTG:0.5};c.cai=cai(c.seq,weights)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var c=STATE.cai;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('CODON OPT — CAI = '+fmt(c.cai,4),20,25);var cellW=Math.min(16,(W-60)/c.seq.length);for(var i=0;i+2<c.seq.length;i+=3){var codon=c.seq.substr(i,3);var aa=CODONS[codon]||'?';var x=20+i*cellW;var y=60;ctx.fillStyle='rgba(64,255,144,.2)';ctx.fillRect(x,y,cellW*3-1,40);ctx.strokeStyle='#40ff90';ctx.lineWidth=1;ctx.strokeRect(x,y,cellW*3-1,40);ctx.fillStyle='#00e0ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(codon,x+cellW*1.5,y+14);ctx.fillStyle=aaColor(aa);ctx.font='bold 14px monospace';ctx.fillText(aa,x+cellW*1.5,y+32);ctx.textAlign='left'}ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('CAI = '+fmt(c.cai,4)+' (higher = better)',20,H-60);setStats('<div>CAI: '+fmt(c.cai,3)+'</div><div>Codons: '+Math.floor(c.seq.length/3)+'</div>');badge('📉 CAI = '+fmt(c.cai,3));SV('sbN',Math.floor(c.seq.length/3));SV('sbE',fmt(c.cai,3));SV('sbS','—');SV('sbQ','—')},controls:function(){var c=STATE.cai;return '<div class="sec"><h4>Sequence</h4><div class="ctrl"><textarea rows="2" oninput="STATE.cai.seq=this.value.toUpperCase().replace(/[^ATGC]/g,\'\');MODULES.cai.compute()">'+c.seq+'</textarea></div></div><button class="btn primary full" onclick="STATE.cai.seq=optimizeCodon(STATE.protein.seq);MODULES.cai.compute();toast(\'Optimized for E. coli\',\'success\')">🔧 Optimize (E. coli)</button>'},mathPanel:function(){return '<div class="sec"><h4>CAI</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>CAI:</b> Codon Adaptation Index (Sharp & Li 1987).<br><br><b>Fórmula:</b> CAI = (Πᵢ wᵢ)^(1/L) = exp((1/L)Σ ln wᵢ)<br><br><b>w:</b> relative adaptiveness (freq do códon / freq códon mais usado para aquele aa).<br><br><b>Interpretação:</b><br>• CAI = 1: codons ótimos<br>• CAI &gt; 0.8: alta expressão<br>• CAI &lt; 0.5: baixa<br><br><b>Uso:</b><br>• Recombinant protein expression<br>• Codon optimization for E. coli, yeast, human<br>• mRNA vaccine design (Pfizer/BioNTech)<br>• Gene synthesis<br><br><b>Ferramentas:</b> GenScript, IDT, Twist, ATUM.</div></div>'}});
function optimizeCodon(seq){var table={A:'GCT',R:'CGT',N:'AAT',D:'GAT',C:'TGT',Q:'CAA',E:'GAA',G:'GGT',H:'CAT',I:'ATT',L:'CTG',K:'AAA',M:'ATG',F:'TTT',P:'CCT',S:'TCT',T:'ACT',W:'TGG',Y:'TAT',V:'GTT'};return seq.split('').map(function(c){return table[c]||'NNN'}).join('')}
registerModule('grn',{title:'Gene Regulatory Network',icon:'🕸',desc:'ODE dynamics of gene network.',init:function(){this.reset()},reset:function(){var g=STATE.grn;g.W=[];for(var i=0;i<g.n;i++){g.W.push([]);for(var j=0;j<g.n;j++){g.W[i].push(i===j?0:rndn()*1.5)}}g.state=[];for(var k=0;k<g.n;k++)g.state.push(Math.random());g.t=0;g.history=[]},step:function(dt){var g=STATE.grn;var newS=[];for(var i=0;i<g.n;i++){var sum=0;for(var j=0;j<g.n;j++)sum+=g.W[i][j]*g.state[j];var ds=(1/(1+Math.exp(-sum))-g.state[i])*2;newS.push(clamp(g.state[i]+ds*dt,0,1))}g.state=newS;g.t+=dt;g.history.push({t:g.t,state:newS.slice()});if(g.history.length>500)g.history.shift()},tick:function(dt){STATE.time+=dt;var g=STATE.grn;if(!STATE.playing)return;for(var i=0;i<3;i++)this.step(0.02)},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010805';ctx.fillRect(0,0,W,H);var g=STATE.grn;ctx.fillStyle='#40ff90';ctx.font='bold 13px monospace';ctx.fillText('GRN — N='+g.n+' genes · t='+fmt(g.t,2),20,25);var cx=W*0.4,cy=H/2,r=Math.min(W,H)*0.3;var pos=[];for(var i=0;i<g.n;i++){var a=i/g.n*Math.PI*2;pos.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r})}for(var i=0;i<g.n;i++){for(var j=0;j<g.n;j++){if(Math.abs(g.W[i][j])>0.5){ctx.strokeStyle=g.W[i][j]>0?'rgba(64,255,144,.3)':'rgba(255,64,128,.3)';ctx.lineWidth=Math.abs(g.W[i][j])*2;ctx.beginPath();ctx.moveTo(pos[i].x,pos[i].y);ctx.lineTo(pos[j].x,pos[j].y);ctx.stroke()}}}pos.forEach(function(p,i){var size=6+g.state[i]*14;ctx.fillStyle='hsl('+(g.state[i]*180)+',70%,60%)';ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('G'+i,p.x,p.y+4);ctx.textAlign='left'});var px=W*0.7,py=60,pw=W*0.25,ph=H*0.4;ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('Expression vs time:',px,py-5);drawGrid(ctx,px,py,pw,ph,3,6);var colors=['#40ff90','#00e0ff','#ff4080','#ffb000','#a060ff','#ff8040'];for(var gi=0;gi<Math.min(g.n,6);gi++){ctx.strokeStyle=colors[gi];ctx.lineWidth=1.5;ctx.beginPath();g.history.forEach(function(h,idx){var x=px+idx/g.history.length*pw;var y=py+ph-h.state[gi]*ph;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}setStats('<div>N genes: '+g.n+'</div><div>t: '+fmt(g.t,2)+'</div>');badge('🕸 GRN · '+g.n+' genes');SV('sbN',g.n);SV('sbE',fmt(g.t,2));SV('sbS','—');SV('sbQ','—')},controls:function(){var g=STATE.grn;return '<div class="sec"><h4>Network</h4><div class="ctrl"><div class="lbl"><span>N genes</span><span>'+g.n+'</span></div><input type="range" min="3" max="20" step="1" value="'+g.n+'" oninput="STATE.grn.n=parseInt(this.value);MODULES.grn.reset()"></div></div><button class="btn primary full" onclick="MODULES.grn.reset();toast(\'New network\',\'success\')">🎲 New network</button>'},mathPanel:function(){return '<div class="sec"><h4>Gene Regulatory Network</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Modelo:</b><br>dxᵢ/dt = f(Σⱼ Wᵢⱼ xⱼ) - γ xᵢ<br>f = sigmoid (Hill-like)<br><br><b>W matriz:</b><br>• W_ij &gt; 0: ativação<br>• W_ij &lt; 0: repressão<br>• W_ij = 0: sem interação<br><br><b>Comportamentos:</b><br>• Multi-estabilidade (atratores)<br>• Oscilações (repressilator)<br>• Homeostase<br>• Diferenciação<br><br><b>Redes famosas:</b><br>• Repressilator (Elowitz 2000)<br>• Toggle switch (Gardner 2000)<br>• Cell cycle (Tyson)<br>• p53-MDM2<br>• NF-κB<br><br><b>Ferramentas:</b> BioModels, COPASI, CellDesigner, Tellurium.</div></div>'}});
</script>
<script>
function buildTabs(){var t=$('tbTabs');t.innerHTML='';TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';i.onclick=function(){switchTab(x.key)};t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});var m=MODULES[k];SV('sbMode',(m&&m.title)||k);try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;$$('.rp-tab').forEach(function(t){t.classList.remove('active')});e.classList.add('active');$$('.rp-pane').forEach(function(p){p.classList.remove('active')});var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));if(p)p.classList.add('active');renderRightPanel()}
function renderLeftPanel(){var b=$('lpBody');if(!b)return;var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}var h='<div class="sec" style="margin-bottom:5px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.65rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.58rem;color:var(--tx3);font-family:var(--mono);line-height:1.4;margin-top:3px">'+esc(m.desc||'')+'</div></div>';try{if(m.controls)h+=m.controls()}catch(e){h+='<div class="sec"><div class="empty">error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}b.innerHTML=h}
function renderRightPanel(){var m=MODULES[STATE.currentTab];var s=$('rpState');if(s){var st='<div class="sec"><h4>Live State</h4><div class="kv">';st+='<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>';st+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>';st+='<div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div>';st+='</div></div>';s.innerHTML=st}var mp=$('rpMath');if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}if(STATE.currentRp==='logs')renderLogs()}
function renderLogs(){var p=$('rpLogs');if(!p)return;var h='<div class="sec"><h4>Log</h4>';if(!LOG.length)h+='<div class="empty">No events</div>';else LOG.slice().reverse().forEach(function(l){var c=l.type==='error'?'var(--p5)':l.type==='success'?'var(--p1)':'var(--p1)';h+='<div style="padding:2px 5px;border-left:2px solid '+c+';margin-bottom:2px;font-family:var(--mono);font-size:.55rem;color:'+c+'">'+esc(l.msg)+'</div>'});h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',800)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',800)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',800)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['bio','paper','dna','dark','sun'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){var blob='$';openModal('GENOME — Bioinformatics, Genomics & Drug Discovery','
<div class="sec" style="border-left:3px solid #40ff90;padding-left:10px;background:rgba(64,255,144,.1);padding:8px;border-radius:3px"><div style="font-size:.65rem;color:#40ff90;font-weight:700;margin-bottom:5px">🧬 MERCADO DE '+blob+'300B (drug discovery + genomics + bio)</div><div style="font-family:var(--mono);font-size:.58rem;line-height:1.6;color:var(--tx2)">Illumina, Thermo Fisher, BGI, 10x Genomics, Recursion, Insitro, DeepMind, Moderna. Bio + IA = próxima década.</div></div>
<div class="sec"><h4>🧬 28 Módulos</h4><div style="font-size:.58rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">SEQUÊNCIA</b><br>DNA · RNA · Protein · ORF · BLOSUM<br><br><b style="color:var(--p1)">ALINHAMENTO</b><br>Needleman-Wunsch · Smith-Waterman<br><br><b style="color:var(--p1)">FILOGENIA</b><br>UPGMA tree<br><br><b style="color:var(--p1)">PROTEÍNA</b><br>Amino Acids · Ramachandran · 2nd struct · Hydropathy · pI<br><br><b style="color:var(--p1)">SIMULAÇÃO</b><br>MD (LJ) · Monte Carlo · Minimization · HP Fold · Contact Map<br><br><b style="color:var(--p1)">DRUG DISCOVERY</b><br>Docking · QSAR · ADMET · Descriptors<br><br><b style="color:var(--p1)">GENOMICS</b><br>CRISPR · PCR · RNA Fold · Codon Opt · GRN</div></div>
<div class="sec"><h4>🧮 Algoritmos REAIS</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">• Needleman-Wunsch (1970) DP global<br>• Smith-Waterman (1981) DP local<br>• BLOSUM62 real matrix (Henikoff 1992)<br>• UPGMA clustering (Sokal 1958)<br>• Chou-Fasman (1974) secondary struct<br>• Kyte-Doolittle (1982) hydropathy<br>• pI bisection from pKa<br>• Peptide monoisotopic mass<br>• Lennard-Jones + Verlet MD<br>• Metropolis-Hastings MC (1953)<br>• Steepest descent<br>• HP lattice model (Dill 1985)<br>• Docking grid scoring<br>• Multiple linear regression (QSAR)<br>• Lipinski rule of 5 (1997)<br>• CRISPR PAM search<br>• Wallace Tm + nearest-neighbor<br>• Nussinov RNA folding DP (1978)<br>• CAI codon optimization (Sharp 1987)<br>• GRN ODE system<br>• Genetic code 64 codons<br>• 20 amino acid properties</div></div>
<div class="sec"><h4>💼 Mercado</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Illumina ('+blob+'30B) · Thermo Fisher ('+blob+'200B)<br>10x Genomics · BGI · Oxford Nanopore<br>Moderna ('+blob+'40B) · BioNTech<br>Recursion · Insitro · Relay<br>DeepMind AlphaFold · Isomorphic Labs<br>CRISPR Therapeutics · Intellia · Editas<br>Genentech · Amgen · Regeneron<br><br><b style="color:var(--p1)">Mercado global:</b> '+blob+'300B+ (bio + drug discovery + genomics)</div></div>
<div class="sec"><h4>🎯 Uso</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">• Ensino de bioinformática<br>• Análise de sequências DNA/RNA<br>• Drug discovery virtual screening<br>• Simulação molecular<br>• CRISPR design<br>• Codon optimization para expressão<br>• GRN modeling</div></div>','<button class="btn primary" onclick="closeModal()">Entendido</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}else if(e.key==='r'||e.key==='R')resetModule();else if(e.key==='t'||e.key==='T')toggleTheme();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();else if(e.key==='Escape')closeModal()});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){var dt=Math.min((now-lastT)/1000,0.05);lastT=now;fAcc+=dt;fFr++;if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}var m=MODULES[STATE.currentTab];if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){logMsg('draw('+m.key+') error: '+e.message,'error');try{CANV.ctx.fillStyle='#010805';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#40ff90';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}}}requestAnimationFrame(loop)}
window.addEventListener('DOMContentLoaded',function(){logMsg('DOMContentLoaded','success');try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}logMsg('GENOME ready','success');requestAnimationFrame(loop);$('tbDot').classList.add('on');$('tbText').textContent='running';toast('GENOME ready — 28 módulos bio','success',3000)});
console.log('%c GENOME ','background:linear-gradient(90deg,#40ff90,#00e0ff,#a060ff,#ff4080,#ffb000);color:#030a06;padding:6px 16px;border-radius:3px;font-weight:900;font-size:14px;letter-spacing:3px');
console.log('DNA · RNA · Protein · NW · SW · BLOSUM · UPGMA · AA · Ramachandran · 2nd · Hydro · pI · Mass · MD · MC · Min · HP · Contacts · Docking · QSAR · ADMET · Descriptors · CRISPR · PCR · Nussinov · CAI · GRN');
