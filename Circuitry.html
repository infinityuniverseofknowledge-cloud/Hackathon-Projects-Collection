<!DOCTYPE html>
<html lang="en" data-theme="workbench">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#14110a">
<title>CIRCUITRY — Electronics Workbench</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#14110a;--bg2:#1c1810;--bg3:#26201a;--bg4:#342c22;
  --panel:#181410;--panel2:#221c16;--panel3:#2c241c;--panel4:#3a3024;
  --bd:#3a2c20;--bd2:#5c4430;--bd3:#806040;
  --tx:#f0e4cc;--tx2:#c0a880;--tx3:#807060;--mu:#504438;
  --c1:#ffaa33;--c1h:#ffc880;--c1l:#c07810;
  --c2:#40d0ff;--c2h:#80e4ff;--c2l:#20a0d0;
  --c3:#40ff90;--c3h:#80ffc0;--c3l:#20c060;
  --c4:#ff3060;--c4h:#ff90a8;--c4l:#c01040;
  --c5:#b060ff;--c5h:#d0a0ff;--c5l:#7030c0;
  --c6:#40e0d0;--c6h:#80f0e8;--c6l:#20a098;
  --c7:#ffc400;--c7h:#ffe080;--c7l:#c09000;
  --c8:#ff7020;--c8h:#ffb080;--c8l:#c04800;
  --ok:#40ff90;--warn:#ffc400;--err:#ff3060;--info:#40d0ff;
  --g1:linear-gradient(135deg,#ffaa33,#ff7020);
  --g2:linear-gradient(135deg,#40d0ff,#40ff90);
  --g3:linear-gradient(135deg,#b060ff,#ff3060);
  --gHolo:linear-gradient(120deg,#ffaa33,#ff7020,#ffc400,#40ff90,#40d0ff,#ffaa33);
  --wire:#ffaa33;--wire-active:#40d0ff;--trace:#2c241c;--copper:#c07810;--board:#1a1814;
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.6);
  --sh2:0 16px 48px rgba(0,0,0,.85);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="greenboard"]{--bg:#0a1a08;--bg2:#102810;--bg3:#183818;--panel:#102810;--panel2:#183818;--panel3:#204c20;--panel4:#2c6428;
  --bd:#285028;--bd2:#3c7838;--tx:#d0ffc0;--tx2:#a0d890;--tx3:#608850;
  --c1:#40ffa0;--wire:#40ffa0;--wire-active:#ffd040;--copper:#40ffa0;--board:#0a1808;
  --g1:linear-gradient(135deg,#40ffa0,#ffd040)}
[data-theme="blueschematic"]{--bg:#0a1020;--bg2:#101a30;--bg3:#182548;--panel:#0e1830;--panel2:#141f3a;--panel3:#1c2b50;--panel4:#283a68;
  --bd:#243c68;--bd2:#385a98;--tx:#d0e0ff;--tx2:#a0b8d8;--tx3:#6080a8;
  --c1:#4a8cff;--wire:#4a8cff;--wire-active:#ffc400;--copper:#ffc400;--board:#05081a;
  --g1:linear-gradient(135deg,#4a8cff,#ffc400)}
[data-theme="paper"]{--bg:#f0ead8;--bg2:#e8e0c8;--bg3:#dcd0b4;--panel:#fff;--panel2:#f5eedd;--panel3:#e8ddc5;--panel4:#d8c9a8;
  --bd:#c0b090;--bd2:#a09070;--tx:#1c1408;--tx2:#504028;--tx3:#908060;
  --c1:#c07800;--wire:#c07800;--wire-active:#0060c0;--board:#f5eedd;--copper:#c07800;
  --g1:linear-gradient(135deg,#c07800,#0060c0)}
[data-theme="darkboard"]{--bg:#000;--bg2:#050508;--bg3:#0a0a10;--panel:#080810;--panel2:#101018;--panel3:#181820;
  --bd:#202028;--bd2:#303038;--tx:#d8d8e0;--tx2:#909098;--tx3:#585860;
  --c1:#00d0ff;--wire:#00d0ff;--wire-active:#ff0090;--copper:#00d0ff;--board:#030306;
  --g1:linear-gradient(135deg,#00d0ff,#ff0090)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#14110a;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3rem;font-weight:900;letter-spacing:10px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.68rem;color:#ffaa33;letter-spacing:8px;margin-bottom:32px;opacity:.75}
.boot-bar{width:300px;max-width:80vw;height:3px;background:#2c241c;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ffaa33}
.boot-pct{font-size:.68rem;color:#ffaa33;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#807060;text-align:left;width:min(420px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}.boot-log .warn{color:#ffc400}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.95rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.7rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#14110a;box-shadow:0 0 14px rgba(255,170,51,.35)}
.tb-tab .tab-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#14110a;border-color:transparent}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:230px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#canvasArea{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#schematicWrap{flex:1;position:relative;background:var(--board);overflow:hidden;min-height:0}
#schematicCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#scopeWrap{height:180px;background:var(--panel);border-top:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
.scope-head{padding:6px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.scope-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.scope-body{flex:1;position:relative;overflow:hidden;background:#000}
#scopeCanvas{position:absolute;inset:0;width:100%;height:100%}
#rightPanel{width:260px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}

/* ============ STATUS BAR ============ */
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:16px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}

/* ============ COMPONENT PALETTE ============ */
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.pal-item{aspect-ratio:1;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);cursor:grab;transition:var(--t1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;user-select:none}
.pal-item:hover{border-color:var(--c1);background:var(--panel4);transform:translateY(-2px)}
.pal-item.active{background:var(--g1);border-color:transparent;color:#14110a}
.pal-item:active{cursor:grabbing}
.pal-item svg{width:32px;height:32px}
.pal-item .p-name{font-size:.5rem;color:var(--tx3);margin-top:2px;font-family:var(--mono);text-align:center;line-height:1.1}
.pal-item.active .p-name{color:rgba(20,17,10,.75)}

/* ============ COMPONENT LIBRARY ============ */
.lib-cat{margin-bottom:12px}
.lib-cat h5{font-size:.58rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin-bottom:6px;font-weight:700;font-family:var(--mono);border-bottom:1px solid var(--bd);padding-bottom:3px}
.lib-item{padding:6px 10px;border-radius:var(--rxs);cursor:pointer;font-size:.68rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono);margin-bottom:2px}
.lib-item:hover{background:var(--panel3);color:var(--tx)}
.lib-item.active{background:rgba(255,170,51,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:8px}
.lib-item .li-icon{font-size:.95rem}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#14110a;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.62rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.72rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,170,51,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font-size:.7rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#14110a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,170,51,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:rgba(255,48,96,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.65rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1000px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.72rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c1)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ============ HELPERS ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.65rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}
.kv{font-family:var(--mono);font-size:.68rem;line-height:1.8}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}
.kv .v{color:var(--c1)}
.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.72rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

/* multimeter readout */
.meter-val{font-family:var(--mono);font-size:1.15rem;font-weight:800;color:var(--c1);text-align:center;padding:6px 0;text-shadow:0 0 12px rgba(255,170,51,.4)}

/* preset buttons */
.preset-btn{padding:8px 10px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);cursor:pointer;font-size:.65rem;color:var(--tx2);font-family:var(--mono);text-align:left;transition:var(--t1);margin-bottom:4px;display:block;width:100%}
.preset-btn:hover{border-color:var(--c1);color:var(--c1);background:var(--panel4)}

@media(max-width:1000px){#leftPanel{width:200px}#rightPanel{width:230px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">CIRCUITRY</div>
  <div class="boot-sub">ELECTRONICS WORKBENCH</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('build')">CIRCUITRY</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnRun" onclick="toggleSim()" title="Run/Pause (Space)">▶</button>
      <button class="tb-btn" onclick="resetSim()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="newCircuit()" title="New Circuit">📄</button>
      <button class="tb-btn" onclick="saveCircuit()" title="Save (Ctrl+S)">💾</button>
      <button class="tb-btn" onclick="loadCircuit()" title="Load (Ctrl+O)">📂</button>
      <button class="tb-btn" onclick="exportJSON()" title="Export JSON">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left panel">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right panel">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Components</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="canvasArea">
      <div id="schematicWrap">
        <canvas id="schematicCanvas"></canvas>
      </div>
      <div id="scopeWrap">
        <div class="scope-head">
          <span class="scope-title">🔬 Oscilloscope</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="text-xs text-dim" id="scopeTraceCount">0 traces</span>
            <button class="btn sm" onclick="clearScope()">Clear</button>
          </div>
        </div>
        <div class="scope-body"><canvas id="scopeCanvas"></canvas></div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="panel-head"><span class="panel-title">Inspector</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleRightPanel()">⇥</button></div>
      <div class="panel-body" id="rpBody"></div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">Mode</span><span class="sb-val" id="sbMode">DC</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Components</span><span class="sb-val" id="sbComps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Wires</span><span class="sb-val c2" id="sbWires">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Nodes</span><span class="sb-val c3" id="sbNodes">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Status</span><span class="sb-val c3" id="sbStatus">READY</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Time</span><span class="sb-val" id="sbTime">0.000s</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}

/* ================================================================
   MATRIX MATH — LU decomposition solver for Ax = b
   ================================================================ */
function solveLinear(A,b){
  var n=b.length;
  /* Copy */
  var M=[];
  for(var i=0;i<n;i++)M.push(A[i].slice());
  var x=b.slice();
  /* LU with partial pivoting */
  for(var k=0;k<n;k++){
    /* Find pivot */
    var max=Math.abs(M[k][k]);
    var piv=k;
    for(var i2=k+1;i2<n;i2++){
      if(Math.abs(M[i2][k])>max){max=Math.abs(M[i2][k]);piv=i2;}
    }
    if(max<1e-12){return null;} /* singular */
    if(piv!==k){
      var tmp=M[k];M[k]=M[piv];M[piv]=tmp;
      var t2=x[k];x[k]=x[piv];x[piv]=t2;
    }
    /* Eliminate */
    for(var i3=k+1;i3<n;i3++){
      var factor=M[i3][k]/M[k][k];
      M[i3][k]=factor;
      for(var j=k+1;j<n;j++)M[i3][j]-=factor*M[k][j];
      x[i3]-=factor*x[k];
    }
  }
  /* Back substitution */
  for(var i4=n-1;i4>=0;i4--){
    var sum=x[i4];
    for(var j2=i4+1;j2<n;j2++)sum-=M[i4][j2]*x[j2];
    if(Math.abs(M[i4][i4])<1e-12)return null;
    x[i4]=sum/M[i4][i4];
  }
  return x;
}

/* ================================================================
   MODIFIED NODAL ANALYSIS (MNA)
   Solve resistive + source networks at DC
   ================================================================ */
/*
  For each node k (except ground=0): sum of currents = 0
  For resistors: G·v = I
  For voltage sources: introduce extra unknown (current through source)

  Matrix structure:
    [ G   B ] [v]   [i_src]
    [ C   0 ] [j] = [v_src]

  G: n×n conductance (n = number of non-ground nodes)
  B: n×m where m = number of voltage sources (+1 column each, coefficients ±1)
  C: m×n
  Unknowns: node voltages (n) + source currents (m)
*/

function buildMNA(netlist){
  /* netlist: {comps: [{type, nodes:[...], value, ...}], nodeCount} */
  var nodeMap={};
  var nextNode=1; /* 0 = ground */
  netlist.comps.forEach(function(c){
    c.nodes.forEach(function(n){
      if(n==null)return;
      if(n==='gnd'||n===0)return;
      if(nodeMap[n]===undefined)nodeMap[n]=nextNode++;
    });
  });
  /* Count voltage sources and other special */
  var vSources=[];
  var currentSources=[];
  var conductors=[];
  var capacitors=[];
  var inductors=[];
  var diodes=[];
  var switches=[];
  var vsMeters=[]; /* voltmeters -> infinite R -> treated as no current */
  var amMeters=[]; /* ammeters -> 0 R -> treated as voltage source 0 V */

  netlist.comps.forEach(function(c){
    var n1=nodeNum(c.nodes[0],nodeMap);
    var n2=nodeNum(c.nodes[1],nodeMap);
    if(c.type==='resistor')conductors.push({n1:n1,n2:n2,G:1/c.value});
    else if(c.type==='battery')vSources.push({n1:n1,n2:n2,V:c.value,id:c.id});
    else if(c.type==='acsource')vSources.push({n1:n1,n2:n2,V:0,id:c.id,ac:c});
    else if(c.type==='capacitor')capacitors.push({n1:n1,n2:n2,C:c.value,id:c.id});
    else if(c.type==='inductor')inductors.push({n1:n1,n2:n2,L:c.value,id:c.id});
    else if(c.type==='diode'||c.type==='led')diodes.push({n1:n1,n2:n2,Vf:(c.type==='led'?c.value:0.7),id:c.id,type:c.type});
    else if(c.type==='switch')switches.push({n1:n1,n2:n2,on:c.on!==false});
    else if(c.type==='voltmeter')vsMeters.push({n1:n1,n2:n2,id:c.id});
    else if(c.type==='ammeter')vSources.push({n1:n1,n2:n2,V:0,id:c.id,meter:'I'});
    else if(c.type==='lamp')conductors.push({n1:n1,n2:n2,G:1/(c.value||100)});
  });
  /* Ground node */
  if(nodeMap.gnd===undefined)nodeMap.gnd=0;
  var n=nextNode-1;
  /* Count unknowns: n node voltages + number of voltage sources */
  var numVS=0;
  vSources.forEach(function(vs){if(vs.ac===undefined||vs.ac.mode==='dc')numVS++;else numVS++;});
  /* Actually all voltage sources count as unknowns */
  vSources.forEach(function(){});
  var m=vSources.length;
  var size=n+m;
  if(size===0)return null;
  /* Build matrix */
  var A=[];
  for(var i=0;i<size;i++){A.push(new Array(size).fill(0));}
  var b=new Array(size).fill(0);

  /* Resistors */
  conductors.forEach(function(r){
    var a=r.n1-1,bv=r.n2-1; /* -1 because ground=0 has no row */
    if(a>=0){A[a][a]+=r.G;}
    if(bv>=0){A[bv][bv]+=r.G;}
    if(a>=0&&bv>=0){A[a][bv]-=r.G;A[bv][a]-=r.G;}
  });
  /* Capacitors — open at DC steady state */
  capacitors.forEach(function(c){
    if(c.id===undefined)return;
    /* DC: open */
  });
  /* Inductors — short at DC steady state */
  inductors.forEach(function(c){
    var a=c.n1-1,bv=c.n2-1;
    if(a<0&&bv<0)return;
    /* Treat as 0V source -> add as extra unknown for current */
    var col=n+(vSources.length++ - vSources.length);
    /* Not clean — better: treat as voltage source 0V */
    /* We'll add them to vSources below */
  });
  /* Handle inductors as 0V sources for DC */
  var extraVS=[];
  inductors.forEach(function(c){
    var a=c.n1-1,bv=c.n2-1;
    extraVS.push({n1:c.n1,n2:c.n2,V:0,id:c.id,inductor:true});
  });
  /* Meters as 0V sources */
  amMeters=vSources.filter(function(v){return v.meter==='I'});
  /* Now count all voltage sources (real + inductor shorts + ammeter shorts) */
  var allVS=vSources.concat(extraVS);
  var m2=allVS.length;
  var size2=n+m2;
  if(size2===0)return {A:null,b:null,nodeMap:nodeMap,V:[],I:{}};
  A=[];
  for(var i2=0;i2<size2;i2++)A.push(new Array(size2).fill(0));
  b=new Array(size2).fill(0);
  /* Conductors */
  conductors.forEach(function(r){
    var a=r.n1-1,bv=r.n2-1;
    if(a>=0)A[a][a]+=r.G;
    if(bv>=0)A[bv][bv]+=r.G;
    if(a>=0&&bv>=0){A[a][bv]-=r.G;A[bv][a]-=r.G;}
  });
  /* Voltage sources */
  allVS.forEach(function(vs,vsIdx){
    var a=vs.n1-1,bv=vs.n2-1;
    var col=n+vsIdx;
    /* v(n1) - v(n2) = V */
    if(a>=0){A[a][col]+=1;A[col][a]+=1;}
    if(bv>=0){A[bv][col]-=1;A[col][bv]-=1;}
    b[col]=vs.V;
  });
  return {A:A,b:b,nodeMap:nodeMap,size:size2,nodeCount:n,numVS:m2,conductors:conductors,vSources:allVS,capacitors:capacitors,inductors:inductors,diodes:diodes};
}

function nodeNum(name,nodeMap){
  if(name==='gnd'||name===0||name===null||name===undefined)return 0;
  if(nodeMap[name]===undefined)return 0;
  return nodeMap[name];
}

function solveDC(built){
  if(!built||!built.A)return {V:{},I:{},ok:false};
  var x=solveLinear(built.A,built.b);
  if(!x)return {V:{},I:{},ok:false};
  var V={};
  var nodeMap=built.nodeMap;
  /* nodeMap: name -> index (1..n). index 0 is ground with V=0 */
  for(var name in nodeMap){
    var idx=nodeMap[name];
    if(idx===0){V[name]=0;V.gnd=0;continue;}
    V[name]=x[idx-1];
  }
  /* Currents through voltage sources */
  var I={};
  built.vSources.forEach(function(vs,vsIdx){
    I[vs.id]=x[built.nodeCount+vsIdx];
  });
  /* Currents through resistors */
  var currents={};
  built.conductors.forEach(function(r,i){});
  return {V:V,I:I,x:x,ok:true,built:built};
}

/* ================================================================
   TRANSIENT ANALYSIS — Backward Euler companion models
   ================================================================ */
function buildMNATransient(netlist,dt,state){
  /* state: {vC: {id: v}, iL: {id: i}} from previous step */
  var nodeMap={};
  var nextNode=1;
  netlist.comps.forEach(function(c){
    c.nodes.forEach(function(n){
      if(n==null)return;
      if(n==='gnd'||n===0)return;
      if(nodeMap[n]===undefined)nodeMap[n]=nextNode++;
    });
  });
  var n=nextNode-1;
  var comps=netlist.comps;
  /* Count extra variables: real VS + inductors as VS */
  var allVS=[];
  comps.forEach(function(c){
    if(c.type==='battery')allVS.push({n1:c.nodes[0],n2:c.nodes[1],V:c.value,id:c.id});
    else if(c.type==='acsource'){
      var t=state?state.t:0;
      var v=c.value*Math.sin(2*Math.PI*c.freq*t+((c.phase||0)*Math.PI/180));
      allVS.push({n1:c.nodes[0],n2:c.nodes[1],V:v,id:c.id});
    }
    else if(c.type==='inductor')allVS.push({n1:c.nodes[0],n2:c.nodes[1],V:0,id:c.id,inductor:true,L:c.value});
    else if(c.type==='ammeter')allVS.push({n1:c.nodes[0],n2:c.nodes[1],V:0,id:c.id,meter:'I'});
  });
  var size=n+allVS.length;
  if(size===0)return null;
  var A=[];
  for(var i=0;i<size;i++)A.push(new Array(size).fill(0));
  var b=new Array(size).fill(0);
  /* Resistors */
  comps.forEach(function(c){
    if(c.type==='resistor'){
      var a=nodeMap[c.nodes[0]]||0,bv=nodeMap[c.nodes[1]]||0;
      var G=1/c.value;
      if(a>0)A[a-1][a-1]+=G;
      if(bv>0)A[bv-1][bv-1]+=G;
      if(a>0&&bv>0){A[a-1][bv-1]-=G;A[bv-1][a-1]-=G;}
    }
    else if(c.type==='lamp'){
      var a2=nodeMap[c.nodes[0]]||0,bv2=nodeMap[c.nodes[1]]||0;
      var G2=1/(c.value||100);
      if(a2>0)A[a2-1][a2-1]+=G2;
      if(bv2>0)A[bv2-1][bv2-1]+=G2;
      if(a2>0&&bv2>0){A[a2-1][bv2-1]-=G2;A[bv2-1][a2-1]-=G2;}
    }
    else if(c.type==='capacitor'){
      /* Backward Euler: G = C/dt, current source I = C/dt * v_prev */
      var G3=c.value/dt;
      var vPrev=(state&&state.vC&&state.vC[c.id])||0;
      var a3=nodeMap[c.nodes[0]]||0,bv3=nodeMap[c.nodes[1]]||0;
      if(a3>0){A[a3-1][a3-1]+=G3;b[a3-1]+=G3*vPrev;}
      if(bv3>0){A[bv3-1][bv3-1]+=G3;b[bv3-1]-=G3*vPrev;}
      if(a3>0&&bv3>0){A[a3-1][bv3-1]-=G3;A[bv3-1][a3-1]-=G3;}
    }
    else if(c.type==='switch'){
      if(c.on!==false){
        var G4=1e6;
        var a4=nodeMap[c.nodes[0]]||0,bv4=nodeMap[c.nodes[1]]||0;
        if(a4>0)A[a4-1][a4-1]+=G4;
        if(bv4>0)A[bv4-1][bv4-1]+=G4;
        if(a4>0&&bv4>0){A[a4-1][bv4-1]-=G4;A[bv4-1][a4-1]-=G4;}
      }else{
        var G4b=1e-9;
        var a4b=nodeMap[c.nodes[0]]||0,bv4b=nodeMap[c.nodes[1]]||0;
        if(a4b>0)A[a4b-1][a4b-1]+=G4b;
        if(bv4b>0)A[bv4b-1][bv4b-1]+=G4b;
        if(a4b>0&&bv4b>0){A[a4b-1][bv4b-1]-=G4b;A[bv4b-1][a4b-1]-=G4b;}
      }
    }
    else if(c.type==='diode'||c.type==='led'){
      var Vf=c.type==='led'?c.value:0.7;
      var G5=0.05; /* on */
      var G5off=1e-6; /* off */
      var vPrevD=(state&&state.vD&&state.vD[c.id])||0;
      var G5use=vPrevD>Vf*0.5?G5:G5off;
      var a5=nodeMap[c.nodes[0]]||0,bv5=nodeMap[c.nodes[1]]||0;
      if(a5>0)A[a5-1][a5-1]+=G5use;
      if(bv5>0)A[bv5-1][bv5-1]+=G5use;
      if(a5>0&&bv5>0){A[a5-1][bv5-1]-=G5use;A[bv5-1][a5-1]-=G5use;}
      /* Current source for on state */
      if(vPrevD>Vf*0.5){
        if(a5>0)b[a5-1]+=G5use*Vf;
        if(bv5>0)b[bv5-1]-=G5use*Vf;
      }
    }
  });
  /* Voltage sources */
  allVS.forEach(function(vs,vsIdx){
    var a=nodeMap[vs.n1]||0,bv=nodeMap[vs.n2]||0;
    var col=n+vsIdx;
    var V=vs.V;
    /* Inductor: V = L * di/dt ≈ L*(i - i_prev)/dt → i = i_prev + (dt/L)*V */
    /* So V = (L/dt)*(i - i_prev), which becomes: V_node - (L/dt)*i = -(L/dt)*i_prev */
    if(vs.inductor){
      var iprev=(state&&state.iL&&state.iL[vs.id])||0;
      /* v(n1)-v(n2) - (L/dt)*i = -(L/dt)*i_prev */
      if(a>0){A[a-1][col]+=1;A[col][a]+=1;}
      if(bv>0){A[bv-1][col]-=1;A[col][bv]-=1;}
      A[col][col]=-vs.L/dt;
      b[col]=-(vs.L/dt)*iprev;
    } else {
      if(a>0){A[a-1][col]+=1;A[col][a]+=1;}
      if(bv>0){A[bv-1][col]-=1;A[col][bv]-=1;}
      b[col]=V;
    }
  });
  return {A:A,b:b,nodeMap:nodeMap,size:size,nodeCount:n,allVS:allVS};
}

function solveTransient(netlist,dt,t,state){
  var built=buildMNATransient(netlist,dt,state);
  if(!built||!built.A)return {V:{},I:{},state:{},ok:false};
  var x=solveLinear(built.A,built.b);
  if(!x)return {V:{},I:{},state:state||{},ok:false};
  var V={gnd:0};
  for(var name in built.nodeMap){
    var idx=built.nodeMap[name];
    if(idx===0){V[name]=0;continue;}
    V[name]=x[idx-1];
  }
  var I={};
  var newState={vC:{},iL:{},vD:{},t:t};
  built.allVS.forEach(function(vs,vsIdx){
    I[vs.id]=x[built.nodeCount+vsIdx];
    if(vs.inductor)newState.iL[vs.id]=I[vs.id];
  });
  /* Update capacitor voltages */
  netlist.comps.forEach(function(c){
    if(c.type==='capacitor'){
      var a=built.nodeMap[c.nodes[0]]||0;
      var bv=built.nodeMap[c.nodes[1]]||0;
      var v1=a>0?x[a-1]:0;
      var v2=bv>0?x[bv-1]:0;
      newState.vC[c.id]=v1-v2;
    }
    if(c.type==='diode'||c.type==='led'){
      var a2=built.nodeMap[c.nodes[0]]||0;
      var bv2=built.nodeMap[c.nodes[1]]||0;
      var v12=a2>0?x[a2-1]:0;
      var v22=bv2>0?x[bv2-1]:0;
      newState.vD[c.id]=v12-v22;
    }
  });
  return {V:V,I:I,state:newState,ok:true};
}

/* ================================================================
   CIRCUIT MODEL
   ================================================================ */
var CIRCUIT={
  components:[],  /* {id, type, x, y, rot, value, ...extra, nodeName} */
  wires:[],       /* {from:{compId,pin}, to:{compId,pin}} */
  nextId:1,
  selected:null,
  selectedWire:-1,
  draggedComp:null,
  dragOff:{x:0,y:0},
  hoverPin:null,
  pendingWire:null,
  grid:20,
  snap:true
};

function addComponent(type,x,y){
  var def=COMPONENTS[type];
  if(!def)return;
  var c={
    id:'C'+(CIRCUIT.nextId++),
    type:type,
    x:x,
    y:y,
    rot:0,
    value:def.default.value,
    unit:def.default.unit
  };
  /* Copy default extra fields */
  Object.keys(def.default).forEach(function(k){
    if(c[k]===undefined)c[k]=def.default[k];
  });
  CIRCUIT.components.push(c);
  return c;
}

function removeComponent(id){
  CIRCUIT.components=CIRCUIT.components.filter(function(c){return c.id!==id});
  CIRCUIT.wires=CIRCUIT.wires.filter(function(w){
    return w.from.compId!==id&&w.to.compId!==id;
  });
  if(CIRCUIT.selected&&CIRCUIT.selected.id===id)CIRCUIT.selected=null;
}

function getComponentPins(c){
  var def=COMPONENTS[c.type];
  if(!def)return [];
  var n=def.pins.length;
  /* Pin positions: spread along the length; for 1-pin (ground) -> center-bottom */
  var positions=[];
  if(n===1){positions.push({x:c.x,y:c.y+18,label:def.pins[0]});}
  else if(n===2){positions.push({x:c.x-28,y:c.y,label:def.pins[0]});positions.push({x:c.x+28,y:c.y,label:def.pins[1]});}
  else{for(var i=0;i<n;i++){positions.push({x:c.x-28+i*56/(n-1),y:c.y,label:def.pins[i]});}}
  return positions;
}

function findPinAt(x,y){
  for(var i=0;i<CIRCUIT.components.length;i++){
    var c=CIRCUIT.components[i];
    var pins=getComponentPins(c);
    for(var p=0;p<pins.length;p++){
      if(Math.abs(pins[p].x-x)<10&&Math.abs(pins[p].y-y)<10){
        return {compId:c.id,pin:p,label:pins[p].label,x:pins[p].x,y:pins[p].y};
      }
    }
  }
  return null;
}

function findComponentAt(x,y){
  for(var i=CIRCUIT.components.length-1;i>=0;i--){
    var c=CIRCUIT.components[i];
    if(Math.abs(x-c.x)<30&&Math.abs(y-c.y)<25)return c;
  }
  return null;
}

/* ================================================================
   NETLIST BUILDING
   Union-find to assign node names
   ================================================================ */
function buildNetlist(){
  /* Union-find over pins */
  var parent={};
  function find(k){while(parent[k]!==k){parent[k]=parent[parent[k]];k=parent[k];}return k;}
  function union(a,b){var ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb;}
  /* Initialize */
  CIRCUIT.components.forEach(function(c){
    var def=COMPONENTS[c.type];
    if(!def)return;
    def.pins.forEach(function(p,i){parent[c.id+':'+i]=c.id+':'+i;});
  });
  CIRCUIT.wires.forEach(function(w){
    var a=w.from.compId+':'+w.from.pin;
    var b=w.to.compId+':'+w.to.pin;
    if(parent[a]!==undefined&&parent[b]!==undefined)union(a,b);
  });
  /* Assign node names */
  var nodeNames={};
  var nextNode=1;
  var gndNode=null;
  /* Ground is special */
  CIRCUIT.components.forEach(function(c){
    if(c.type==='ground'){
      var g=find(c.id+':0');
      gndNode=g;
    }
  });
  var nets={};
  CIRCUIT.components.forEach(function(c){
    var def=COMPONENTS[c.type];
    if(!def)return;
    def.pins.forEach(function(p,i){
      var r=find(c.id+':'+i);
      if(!nets[r])nets[r]='n'+(nextNode++);
    });
  });
  /* Ground = 0 */
  if(gndNode){
    nets[gndNode]='gnd';
    /* Merge all "gnd" already assigned to 0 */
  }
  /* Build comp list */
  var netlistComps=[];
  CIRCUIT.components.forEach(function(c){
    var def=COMPONENTS[c.type];
    if(!def)return;
    var nodes=def.pins.map(function(p,i){
      var r=find(c.id+':'+i);
      return nets[r];
    });
    if(c.type==='ground')return; /* skip ground component */
    netlistComps.push({
      id:c.id,
      type:c.type,
      nodes:nodes,
      value:c.value,
      freq:c.freq||60,
      phase:c.phase||0,
      on:c.on
    });
  });
  return {comps:netlistComps,nodeMap:nets};
}

/* ================================================================
   RENDERING
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};

function initCanvas(){
  CANV.canvas=$('schematicCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onMouseDown);
  CANV.canvas.addEventListener('mousemove',onMouseMove);
  CANV.canvas.addEventListener('mouseup',onMouseUp);
  CANV.canvas.addEventListener('mouseleave',onMouseUp);
  CANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault();onRightClick(e);});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
  CANV.canvas.addEventListener('dblclick',onDoubleClick);
}

function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;
  CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}

function draw(){
  var ctx=CANV.ctx;
  ctx.fillStyle='#1a1814';
  ctx.fillRect(0,0,CANV.W,CANV.H);
  /* Grid */
  drawGrid(ctx);
  /* Wires */
  CIRCUIT.wires.forEach(function(w,i){
    var a=findComponentById(w.from.compId);
    var b=findComponentById(w.to.compId);
    if(!a||!b)return;
    var pa=getComponentPins(a)[w.from.pin];
    var pb=getComponentPins(b)[w.to.pin];
    if(!pa||!pb)return;
    ctx.strokeStyle=i===CIRCUIT.selectedWire?'#40d0ff':'#ffaa33';
    ctx.lineWidth=i===CIRCUIT.selectedWire?3:2;
    ctx.beginPath();
    /* Manhattan route with two segments */
    ctx.moveTo(pa.x,pa.y);
    /* Route horizontally then vertically */
    var midX=(pa.x+pb.x)/2;
    ctx.lineTo(midX,pa.y);
    ctx.lineTo(midX,pb.y);
    ctx.lineTo(pb.x,pb.y);
    ctx.stroke();
    /* Junction dots */
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath();ctx.arc(midX,pa.y,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(midX,pb.y,3,0,Math.PI*2);ctx.fill();
  });
  /* Pending wire */
  if(CIRCUIT.pendingWire){
    var c0=findComponentById(CIRCUIT.pendingWire.compId);
    if(c0){
      var p0=getComponentPins(c0)[CIRCUIT.pendingWire.pin];
      if(p0){
        ctx.strokeStyle='#40d0ff';
        ctx.lineWidth=2;
        ctx.setLineDash([6,4]);
        ctx.beginPath();
        ctx.moveTo(p0.x,p0.y);
        ctx.lineTo(CIRCUIT.mouseX||0,CIRCUIT.mouseY||0);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  /* Components */
  CIRCUIT.components.forEach(function(c){
    drawComponent(ctx,c);
  });
  /* Hover pin */
  if(CIRCUIT.hoverPin){
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(CIRCUIT.hoverPin.x,CIRCUIT.hoverPin.y,7,0,Math.PI*2);
    ctx.stroke();
  }
  /* Selected outline */
  if(CIRCUIT.selected){
    var c2=CIRCUIT.selected;
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.setLineDash([5,3]);
    ctx.strokeRect(c2.x-32,c2.y-24,64,48);
    ctx.setLineDash([]);
  }
  /* Grid coords */
  ctx.fillStyle='#504438';
  ctx.font='10px monospace';
  ctx.textAlign='left';
  ctx.fillText(CANV.W+' × '+CANV.H,8,CANV.H-8);
}

function drawGrid(ctx){
  ctx.strokeStyle='rgba(255,170,51,.06)';
  ctx.lineWidth=1;
  var g=CIRCUIT.grid;
  for(var x=0;x<CANV.W;x+=g){
    ctx.beginPath();ctx.moveTo(x+0.5,0);ctx.lineTo(x+0.5,CANV.H);ctx.stroke();
  }
  for(var y=0;y<CANV.H;y+=g){
    ctx.beginPath();ctx.moveTo(0,y+0.5);ctx.lineTo(CANV.W,y+0.5);ctx.stroke();
  }
}

function drawComponent(ctx,c){
  var def=COMPONENTS[c.type];
  if(!def)return;
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(c.rot*Math.PI/180);
  ctx.translate(-c.x,-c.y);
  /* Draw body */
  def.draw(ctx,c.x,c.y,64,32,'#ffaa33',c);
  /* Pins */
  var pins=getComponentPins(c);
  ctx.fillStyle='#806040';
  pins.forEach(function(p){
    ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();
  });
  /* Label */
  var label=def.label?def.label(c):c.type;
  ctx.fillStyle='#c0a880';
  ctx.font='9px monospace';
  ctx.textAlign='center';
  ctx.fillText(label,c.x,c.y+26);
  ctx.restore();
}

function findComponentById(id){
  return CIRCUIT.components.find(function(c){return c.id===id});
}

/* ================================================================
   MOUSE INTERACTION
   ================================================================ */
function canvasPos(e){
  var r=CANV.canvas.getBoundingClientRect();
  var x=e.clientX-r.left;
  var y=e.clientY-r.top;
  return {x:x,y:y};
}
function snap(v){
  if(!CIRCUIT.snap)return v;
  return Math.round(v/CIRCUIT.grid)*CIRCUIT.grid;
}

function onMouseDown(e){
  var p=canvasPos(e);
  CIRCUIT.mouseX=p.x;CIRCUIT.mouseY=p.y;
  var pin=findPinAt(p.x,p.y);
  if(pin){
    /* Start or finish wire */
    if(!CIRCUIT.pendingWire){
      CIRCUIT.pendingWire=pin;
    } else {
      /* Finish wire */
      var from=CIRCUIT.pendingWire;
      if(from.compId!==pin.compId||from.pin!==pin.pin){
        CIRCUIT.wires.push({from:{compId:from.compId,pin:from.pin},to:{compId:pin.compId,pin:pin.pin}});
        runSimulationNow();
      }
      CIRCUIT.pendingWire=null;
    }
    draw();
    return;
  }
  var comp=findComponentAt(p.x,p.y);
  if(comp){
    CIRCUIT.selected=comp;
    CIRCUIT.draggedComp=comp;
    CIRCUIT.dragOff={x:p.x-comp.x,y:p.y-comp.y};
    renderRightPanel();
    draw();
    return;
  }
  /* Check wire click */
  CIRCUIT.selected=null;
  renderRightPanel();
  draw();
}
function onMouseMove(e){
  var p=canvasPos(e);
  CIRCUIT.mouseX=p.x;CIRCUIT.mouseY=p.y;
  if(CIRCUIT.draggedComp){
    CIRCUIT.draggedComp.x=snap(p.x-CIRCUIT.dragOff.x);
    CIRCUIT.draggedComp.y=snap(p.y-CIRCUIT.dragOff.y);
    draw();
    return;
  }
  var pin=findPinAt(p.x,p.y);
  CIRCUIT.hoverPin=pin;
  if(CIRCUIT.pendingWire)draw();
  else if(pin!==undefined)draw();
}
function onMouseUp(){
  if(CIRCUIT.draggedComp){
    CIRCUIT.draggedComp=null;
    runSimulationNow();
  }
}
function onRightClick(e){
  var p=canvasPos(e);
  var comp=findComponentAt(p.x,p.y);
  if(comp){
    removeComponent(comp.id);
    draw();
    runSimulationNow();
    return;
  }
  /* Check wire */
  for(var i=CIRCUIT.wires.length-1;i>=0;i--){
    var w=CIRCUIT.wires[i];
    var a=findComponentById(w.from.compId);
    var b=findComponentById(w.to.compId);
    if(!a||!b)continue;
    var pa=getComponentPins(a)[w.from.pin];
    var pb=getComponentPins(b)[w.to.pin];
    if(!pa||!pb)continue;
    /* Distance to horizontal segment */
    var midX=(pa.x+pb.x)/2;
    if(Math.abs(p.x-midX)<8){
      var minY=Math.min(pa.y,pb.y),maxY=Math.max(pa.y,pb.y);
      if(p.y>=minY-8&&p.y<=maxY+8){
        CIRCUIT.wires.splice(i,1);
        draw();
        runSimulationNow();
        return;
      }
    }
    if(Math.abs(p.y-pa.y)<8&&p.x>=Math.min(pa.x,midX)&&p.x<=Math.max(pa.x,midX)){
      CIRCUIT.wires.splice(i,1);
      draw();
      runSimulationNow();
      return;
    }
    if(Math.abs(p.y-pb.y)<8&&p.x>=Math.min(pb.x,midX)&&p.x<=Math.max(pb.x,midX)){
      CIRCUIT.wires.splice(i,1);
      draw();
      runSimulationNow();
      return;
    }
  }
}
function onDoubleClick(e){
  var p=canvasPos(e);
  var comp=findComponentAt(p.x,p.y);
  if(comp&&comp.type==='switch'){
    comp.on=comp.on===false?true:false;
    runSimulationNow();
    draw();
    return;
  }
}
function onTouchStart(e){
  if(e.touches.length===1){
    var r=CANV.canvas.getBoundingClientRect();
    onMouseDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});
  }
  e.preventDefault();
}
function onTouchMove(e){
  if(e.touches.length===1){
    onMouseMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});
  }
  e.preventDefault();
}
function onTouchEnd(e){
  onMouseUp();
  e.preventDefault();
}
</script>
<script>
/* ================================================================
   SIMULATION LOOP
   ================================================================ */
function runSimulationNow(){
  if(SIM.mode==='dc'){
    runDCSim();
  } else {
    /* Transient — reset and run for display */
    resetTransient();
  }
}
function toggleSim(){
  if(SIM.mode==='dc'){
    SIM.running=true;
    runDCSim();
    setTimeout(function(){SIM.running=false;},50);
  } else {
    SIM.running=!SIM.running;
    $('btnRun').textContent=SIM.running?'⏸':'▶';
    if(SIM.running&&!SIM.state)resetTransient();
  }
}
function resetSim(){
  if(SIM.mode==='dc'){
    SIM.voltages={};SIM.currents={};
    runDCSim();
  } else {
    resetTransient();
  }
}
function resetTransient(){
  SIM.state={vC:{},iL:{},vD:{},t:0};
  SIM.t=0;
  SIM.traces={};
  CIRCUIT.components.forEach(function(c){
    SIM.traces[c.id]={color:getTraceColor(c.id),points:[]};
  });
  clearScope();
}
function getTraceColor(id){
  var colors=['#40d0ff','#ffaa33','#40ff90','#ff3060','#b060ff','#ffc400','#40e0d0','#ff7020'];
  var h=0;
  for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;
  return colors[Math.abs(h)%colors.length];
}
function stepAndRecord(){
  var netlist=buildNetlist();
  var dt=SIM.dt;
  var r=solveTransient(netlist,dt,SIM.t,SIM.state);
  if(!r.ok){SIM.running=false;return false;}
  SIM.state=r.state;
  SIM.voltages=r.V;
  SIM.currents=r.I;
  SIM.t+=dt;
  /* Record traces */
  netlist.comps.forEach(function(nc){
    if(!SIM.traces[nc.id])SIM.traces[nc.id]={color:getTraceColor(nc.id),points:[]};
    var v1=(nc.nodes[0]==='gnd'||nc.nodes[0]===0)?0:(r.V[nc.nodes[0]]||0);
    var v2=(nc.nodes[1]==='gnd'||nc.nodes[1]===0)?0:(r.V[nc.nodes[1]]||0);
    var v=v1-v2;
    var iv=r.I[nc.id]||0;
    var val=(nc.type==='resistor'||nc.type==='lamp'||nc.type==='diode'||nc.type==='led')?v*1000:iv*1000;
    /* Let's record V across for most comps, I through meters */
    var traceVal;
    if(nc.type==='ammeter')traceVal=r.I[nc.id]*1000;
    else traceVal=(v1-v2)*1000;
    SIM.traces[nc.id].points.push({t:SIM.t,v:traceVal});
    if(SIM.traces[nc.id].points.length>2000)SIM.traces[nc.id].points.shift();
  });
  if(SIM.t>SIM.maxT){
    SIM.running=false;
    $('btnRun').textContent='▶';
  }
  return true;
}

setInterval(function(){
  if(SIM.mode!=='transient')return;
  if(!SIM.running)return;
  var steps=SIM.speed*10;
  for(var i=0;i<steps;i++){
    if(!stepAndRecord())break;
  }
  drawScope();
  draw();
  updateMeterReadings();
  $('sbTime').textContent=fmt(SIM.t,4)+'s';
},16);

/* ================================================================
   OSCILLOSCOPE
   ================================================================ */
var SCOPE={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initScope(){
  SCOPE.canvas=$('scopeCanvas');
  SCOPE.ctx=SCOPE.canvas.getContext('2d');
  resizeScope();
  window.addEventListener('resize',resizeScope);
}
function resizeScope(){
  var wrap=SCOPE.canvas.parentElement;
  SCOPE.dpr=window.devicePixelRatio||1;
  SCOPE.W=wrap.clientWidth;
  SCOPE.H=wrap.clientHeight;
  SCOPE.canvas.width=SCOPE.W*SCOPE.dpr;
  SCOPE.canvas.height=SCOPE.H*SCOPE.dpr;
  SCOPE.canvas.style.width=SCOPE.W+'px';
  SCOPE.canvas.style.height=SCOPE.H+'px';
  SCOPE.ctx.setTransform(SCOPE.dpr,0,0,SCOPE.dpr,0,0);
  drawScope();
}
function clearScope(){
  Object.keys(SIM.traces||{}).forEach(function(k){SIM.traces[k].points=[];});
  drawScope();
}
function drawScope(){
  var ctx=SCOPE.ctx;
  if(!ctx)return;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,SCOPE.W,SCOPE.H);
  /* Grid */
  ctx.strokeStyle='rgba(0,255,80,.08)';
  ctx.lineWidth=1;
  var gx=SCOPE.W/10,gy=SCOPE.H/8;
  for(var x=0;x<=SCOPE.W;x+=gx){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,SCOPE.H);ctx.stroke();}
  for(var y=0;y<=SCOPE.H;y+=gy){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(SCOPE.W,y+.5);ctx.stroke();}
  /* Center line */
  ctx.strokeStyle='rgba(0,255,80,.25)';
  ctx.beginPath();ctx.moveTo(0,SCOPE.H/2);ctx.lineTo(SCOPE.W,SCOPE.H/2);ctx.stroke();
  /* Traces */
  var traces=SIM.traces||{};
  var keys=Object.keys(traces);
  if(!keys.length){
    ctx.fillStyle='#1a3a1a';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Switch to Transient mode to see waveforms',SCOPE.W/2,SCOPE.H/2-8);
    return;
  }
  /* Auto-scale */
  var minV=Infinity,maxV=-Infinity;
  keys.forEach(function(k){
    var t=traces[k];
    t.points.forEach(function(p){
      if(p.v<minV)minV=p.v;
      if(p.v>maxV)maxV=p.v;
    });
  });
  if(!isFinite(minV)){minV=-1;maxV=1;}
  if(Math.abs(maxV-minV)<0.01){maxV+=0.5;minV-=0.5;}
  var range=maxV-minV;
  minV-=range*0.1;maxV+=range*0.1;
  var tMin=Infinity,tMax=-Infinity;
  keys.forEach(function(k){
    var pts=traces[k].points;
    if(pts.length){
      if(pts[0].t<tMin)tMin=pts[0].t;
      if(pts[pts.length-1].t>tMax)tMax=pts[pts.length-1].t;
    }
  });
  if(!isFinite(tMin)){tMin=0;tMax=SIM.maxT;}
  var tRange=tMax-tMin;
  if(tRange<1e-9)tRange=1e-3;
  /* Draw each trace */
  keys.forEach(function(k){
    var trace=traces[k];
    if(!trace.points.length)return;
    ctx.strokeStyle=trace.color;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    trace.points.forEach(function(p,i){
      var x=(p.t-tMin)/tRange*SCOPE.W;
      var y=SCOPE.H-(p.v-minV)/(maxV-minV)*SCOPE.H;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
  /* Legend */
  $('scopeTraceCount').textContent=keys.length+' traces';
  /* Y axis labels */
  ctx.fillStyle='#40ff90';
  ctx.font='9px monospace';
  ctx.textAlign='left';
  ctx.fillText(fmt(maxV,1)+'mV',4,12);
  ctx.fillText(fmt(minV,1)+'mV',4,SCOPE.H-4);
  /* Time axis */
  ctx.textAlign='right';
  ctx.fillText(fmt(tMax*1000,1)+'ms',SCOPE.W-4,SCOPE.H-4);
}

/* ================================================================
   METER READINGS
   ================================================================ */
function updateMeterReadings(){
  var netlist=buildNetlist();
  /* Update voltmeter/ammeter readings */
  CIRCUIT.components.forEach(function(c){
    if(c.type==='voltmeter'){
      var def=COMPONENTS.voltmeter;
      var pins=getComponentPins(c);
      /* Find node names for this component's pins */
      var comp=netlist.comps.find(function(nc){return nc.id===c.id});
      if(comp){
        var v1=(comp.nodes[0]==='gnd'||comp.nodes[0]===0)?0:(SIM.voltages[comp.nodes[0]]||0);
        var v2=(comp.nodes[1]==='gnd'||comp.nodes[1]===0)?0:(SIM.voltages[comp.nodes[1]]||0);
        c.reading=v1-v2;
      }
    } else if(c.type==='ammeter'){
      c.reading=SIM.currents[c.id]||0;
    } else if(c.type==='led'||c.type==='lamp'){
      var comp2=netlist.comps.find(function(nc){return nc.id===c.id});
      if(comp2){
        var n1=comp2.nodes[0],n2=comp2.nodes[1];
        var va=(n1==='gnd'||n1===0)?0:(SIM.voltages[n1]||0);
        var vb=(n2==='gnd'||n2===0)?0:(SIM.voltages[n2]||0);
        var vAB=va-vb;
        var R=c.type==='lamp'?(c.value||100):(c.value>0?c.value/0.02:100);
        c.current=Math.max(0,vAB)/1000;
      }
    }
  });
  renderRightPanel();
  draw();
}

function loadPreset(idx){
  var p=PRESETS[idx];
  if(!p)return;
  p.setup();
  /* Position components that don't have a set position */
  CIRCUIT.selected=null;
  runSimulationNow();
  draw();
  renderRightPanel();
  toast('Loaded: '+p.name,'success');
}

/* ================================================================
   SAVE / LOAD / EXPORT
   ================================================================ */
function newCircuit(){
  CIRCUIT.components=[];CIRCUIT.wires=[];CIRCUIT.nextId=1;CIRCUIT.selected=null;
  SIM.voltages={};SIM.currents={};SIM.traces={};
  runSimulationNow();draw();renderRightPanel();
  toast('New circuit','success');
}
function saveCircuit(){
  try{
    localStorage.setItem('circuitry-save',JSON.stringify({
      components:CIRCUIT.components,
      wires:CIRCUIT.wires,
      nextId:CIRCUIT.nextId
    }));
    toast('Saved','success');
  }catch(e){toast('Save failed','error')}
}
function loadCircuit(){
  try{
    var data=localStorage.getItem('circuitry-save');
    if(!data){toast('No saved circuit','warn');return}
    var obj=JSON.parse(data);
    CIRCUIT.components=obj.components||[];
    CIRCUIT.wires=obj.wires||[];
    CIRCUIT.nextId=obj.nextId||1;
    CIRCUIT.selected=null;
    runSimulationNow();draw();renderRightPanel();
    toast('Loaded','success');
  }catch(e){toast('Load failed','error')}
}
function exportJSON(){
  var json=JSON.stringify({
    version:'1.0',
    components:CIRCUIT.components,
    wires:CIRCUIT.wires
  },null,2);
  openModal('📋 Circuit JSON',
    '<div class="sec"><div style="max-height:400px;overflow:auto"><textarea style="width:100%;min-height:300px;background:var(--bg);border:1px solid var(--bd);color:var(--c1);font-family:var(--mono);font-size:.68rem;padding:12px;border-radius:var(--rxs)">'+esc(json)+'</textarea></div></div>',
    '<button class="btn primary" onclick="navigator.clipboard.writeText(document.querySelector(\'#modalBody textarea\').value);toast(\'Copied\',\'success\')">📋 Copy</button>'+
    '<button class="btn" onclick="closeModal()">Close</button>',
    {size:'lg'});
}

  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);

}

/* ================================================================
   KEYBOARD
   ================================================================ */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggleSim();}
  else if(e.key==='r'||e.key==='R'){resetSim();}
  else if(e.key==='t'||e.key==='T'){toggleTheme();}
  else if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveCircuit();}
  else if((e.ctrlKey||e.metaKey)&&e.key==='o'){e.preventDefault();loadCircuit();}
  else if(e.key==='?'||(e.shiftKey&&e.key==='/')){showHelp();}
  else if(e.key==='Escape'){closeModal();CIRCUIT.pendingWire=null;draw();}
  else if(e.key==='Delete'||e.key==='Backspace'){if(CIRCUIT.selected){deleteSelected();e.preventDefault();}}
});

var BOOT_STEPS=[
  'Initializing MNA solver...',
  'Loading LU decomposition...',
  'Registering '+Object.keys(COMPONENTS).length+' component types...',
  'Preparing backward-Euler integrators...',
  'Loading '+PRESETS.length+' preset circuits...',
  'Initializing oscilloscope...',
  'Warming up schematic renderer...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CIRCUITRY ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}
