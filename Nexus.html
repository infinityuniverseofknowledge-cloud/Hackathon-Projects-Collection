<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEXUS — Innovation Showcase</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(160,96,255,.3);border-radius:5px}

:root{
  --bg:#050308;--tx:#f0e8ff;--tx2:#b8a8e0;--tx3:#7860a8;
  --c1:#ff40a0;--c2:#40d0ff;--c3:#ffe040;--c4:#40ff90;--c5:#a060ff;--c6:#ff8040;
  --g1:linear-gradient(135deg,#ff40a0,#a060ff,#40d0ff);
  --gHolo:linear-gradient(120deg,#ff40a0,#a060ff,#40d0ff,#40ff90,#ffe040,#ff8040,#ff40a0);
  --mono:'JetBrains Mono','Fira Code',Menlo,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
}

#boot{position:fixed;inset:0;background:#050308;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s;padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-hex{width:180px;height:180px;margin-bottom:24px;animation:hexspin 20s linear infinite}
.boot-hex svg{width:100%;height:100%}
.boot-hex .hex{fill:none;stroke:#a060ff;stroke-width:1.5;opacity:.4}
.boot-hex .hex.hot{stroke:#ff40a0;opacity:1;filter:drop-shadow(0 0 8px #ff40a0)}
.boot-hex .core{fill:#ffe040;filter:drop-shadow(0 0 20px #ffe040)}
@keyframes hexspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.boot-logo{font-family:var(--disp);font-size:3.6rem;font-weight:900;letter-spacing:16px;background:var(--gHolo);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#a060ff;letter-spacing:10px;margin-bottom:36px;opacity:.8;font-family:var(--mono)}
.boot-bar{width:min(560px,86vw);height:3px;background:rgba(160,96,255,.15);border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .4s;box-shadow:0 0 16px #a060ff}
.boot-pct{font-family:var(--mono);font-size:.72rem;color:#a060ff;text-align:center;margin-bottom:20px}
.boot-status{font-family:var(--mono);font-size:.68rem;color:#7860a8;text-align:center;min-height:22px;letter-spacing:1px;max-width:560px}
.boot-libs{margin-top:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;width:86vw;font-family:var(--mono);font-size:.6rem}
.boot-lib{padding:8px;border:1px solid rgba(160,96,255,.2);border-radius:6px;color:#7860a8;transition:all .3s;text-align:center}
.boot-lib.loading{color:#ffe040;border-color:rgba(255,224,64,.5);animation:libpulse 1s ease-in-out infinite}
.boot-lib.ready{color:#40ff90;border-color:rgba(64,255,144,.5)}
@keyframes libpulse{0%,100%{background:rgba(255,224,64,.05)}50%{background:rgba(255,224,64,.15)}}
.boot-err{margin-top:24px;padding:16px;border:1px solid rgba(255,64,128,.5);border-radius:8px;background:rgba(255,64,128,.08);color:#ff90a8;font-family:var(--mono);font-size:.68rem;max-width:560px;width:86vw;line-height:1.5;white-space:pre-wrap;word-break:break-word;display:none}
.boot-retry{margin-top:16px;padding:10px 24px;background:linear-gradient(135deg,#ff40a0,#a060ff);border:none;color:#050308;font-weight:700;border-radius:6px;cursor:pointer;font-size:.8rem;letter-spacing:2px;display:none}
@keyframes holo{0%{background-position:0% center}100%{background-position:400% center}}

#root{height:100vh;width:100vw;overflow:hidden;position:relative}

.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:#050308;position:relative}
.app-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.app-bg canvas{width:100%!important;height:100%!important;position:absolute;inset:0;opacity:.5}

.topbar{height:64px;background:rgba(10,6,18,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(120,80,200,.25);display:flex;align-items:center;padding:0 24px;gap:20px;flex-shrink:0;z-index:100;position:relative}
.logo{font-family:var(--disp);font-weight:900;letter-spacing:8px;font-size:1.05rem;background:var(--gHolo);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;cursor:pointer}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;align-items:center;height:100%}
.nav::-webkit-scrollbar{display:none}
.nav-item{padding:8px 14px;border-radius:6px;cursor:pointer;transition:all .2s;font-size:.72rem;font-weight:600;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.nav-item:hover{background:rgba(20,10,36,.7);color:var(--tx);border-color:rgba(120,80,200,.25)}
.nav-item.active{background:var(--g1);color:#050308;border-color:transparent;box-shadow:0 0 20px rgba(255,64,160,.35)}
.top-actions{display:flex;gap:8px;align-items:center}
.py-status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);padding:4px 10px;border-radius:999px;background:rgba(5,3,8,.6);border:1px solid rgba(120,80,200,.25)}
.py-status.ready{color:#40ff90;border-color:rgba(64,255,144,.3)}
.py-status.loading{color:#ffe040;border-color:rgba(255,224,64,.3)}
.status-pill{padding:6px 12px;border-radius:999px;background:rgba(20,10,36,.7);border:1px solid rgba(120,80,200,.25);font-family:var(--mono);font-size:.62rem;color:var(--c2);display:flex;gap:8px;align-items:center}
.status-pill .pulse{width:6px;height:6px;border-radius:50%;background:#40ff90;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(64,255,144,.7)}50%{opacity:.6;box-shadow:0 0 0 8px rgba(64,255,144,0)}}

.content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1}

.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 40px;position:relative;text-align:center}
.hero-inner{max-width:1000px;width:100%}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;background:rgba(20,10,36,.7);border:1px solid rgba(120,80,200,.25);font-family:var(--mono);font-size:.68rem;color:var(--c3);letter-spacing:2px;margin-bottom:28px}
.hero-tag .dot{width:6px;height:6px;border-radius:50%;background:#ff40a0;animation:pulse 2s infinite}
.hero h1{font-family:var(--disp);font-size:clamp(2.2rem,5.5vw,4.5rem);font-weight:900;letter-spacing:4px;line-height:1.1;margin-bottom:24px;background:var(--gHolo);background-size:400% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 6s linear infinite}
.hero p{font-size:1.05rem;color:var(--tx2);max-width:640px;margin:0 auto 40px;line-height:1.7}
.hero-cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9px;background:rgba(40,20,72,.8);border:1px solid rgba(160,120,240,.4);color:var(--tx);cursor:pointer;transition:all .2s;font-size:.85rem;font-weight:600}
.btn:hover{background:rgba(30,16,56,.7);border-color:#ff40a0;color:#ff40a0;transform:translateY(-2px)}
.btn.primary{background:var(--g1);color:#050308;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 8px 30px rgba(255,64,160,.4);transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.hero-3d{width:100%;max-width:900px;height:400px;margin:40px auto 0;border-radius:14px;overflow:hidden;border:1px solid rgba(120,80,200,.25);background:radial-gradient(circle at center,rgba(160,96,255,.1),transparent 70%);position:relative}
.hero-3d canvas{width:100%!important;height:100%!important;display:block}
.hero-3d-label{position:absolute;bottom:16px;left:16px;font-family:var(--mono);font-size:.65rem;color:var(--c2);background:rgba(10,6,18,.85);padding:6px 12px;border-radius:6px;border:1px solid rgba(120,80,200,.25);letter-spacing:1px}

.section{padding:80px 40px;max-width:1400px;margin:0 auto;width:100%}
.section-title{font-family:var(--disp);font-size:1.6rem;font-weight:800;letter-spacing:6px;color:var(--tx);margin-bottom:12px;text-transform:uppercase}
.section-sub{color:var(--tx2);font-size:.95rem;margin-bottom:48px;max-width:640px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:rgba(20,10,36,.7);backdrop-filter:blur(20px);border:1px solid rgba(120,80,200,.25);border-radius:14px;padding:28px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:rgba(160,120,240,.4);transform:translateY(-6px);box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 40px rgba(160,96,255,.35)}
.card-icon{width:56px;height:56px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:20px;border:1px solid;position:relative}
.card-cat{font-family:var(--mono);font-size:.62rem;letter-spacing:2px;color:var(--tx3);margin-bottom:8px;text-transform:uppercase}
.card h3{font-family:var(--disp);font-size:1.15rem;font-weight:800;letter-spacing:2px;color:var(--tx);margin-bottom:10px}
.card p{color:var(--tx2);font-size:.85rem;line-height:1.6;flex:1}
.card-footer{margin-top:20px;padding-top:16px;border-top:1px solid rgba(120,80,200,.25);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.65rem;color:var(--tx3)}
.card-tag{padding:3px 10px;border-radius:999px;background:rgba(160,96,255,.15);color:var(--c5);border:1px solid rgba(160,96,255,.3);font-size:.55rem;letter-spacing:1px}
.card-arrow{color:var(--c2);font-size:1rem;transition:transform .3s}
.card:hover .card-arrow{transform:translateX(4px)}

.product{min-height:calc(100vh - 64px);padding:60px 40px;max-width:1400px;margin:0 auto}
.product-head{display:flex;align-items:flex-start;gap:40px;flex-wrap:wrap;margin-bottom:60px}
.product-info{flex:1;min-width:280px}
.product-cat{font-family:var(--mono);font-size:.7rem;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.product-cat::before{content:'';width:24px;height:1px;background:#ff40a0}
.product h1{font-family:var(--disp);font-size:clamp(2rem,4vw,3.5rem);font-weight:900;letter-spacing:4px;line-height:1.1;margin-bottom:20px}
.product-tagline{font-size:1.15rem;color:var(--tx2);margin-bottom:28px;line-height:1.6;max-width:600px}
.product-3d{flex:1;min-width:340px;height:440px;border-radius:14px;border:1px solid rgba(120,80,200,.25);overflow:hidden;position:relative;background:radial-gradient(circle at center,rgba(160,96,255,.08),transparent 70%)}
.product-3d canvas{width:100%!important;height:100%!important;display:block}
.product-3d-controls{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.ctrl-pill{background:rgba(10,6,18,.85);border:1px solid rgba(120,80,200,.25);padding:6px 12px;border-radius:999px;font-family:var(--mono);font-size:.6rem;color:var(--c2);letter-spacing:1px}
.product-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:60px}
.feature{padding:24px;background:rgba(20,10,36,.7);border:1px solid rgba(120,80,200,.25);border-radius:9px;transition:all .2s}
.feature:hover{border-color:rgba(160,120,240,.4);background:rgba(30,16,56,.7)}
.feature-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(40,20,72,.8);border:1px solid rgba(160,120,240,.4);color:#ff40a0;font-size:1rem;margin-bottom:14px}
.feature h4{font-family:var(--mono);font-size:.72rem;letter-spacing:1.5px;color:var(--tx);margin-bottom:8px;text-transform:uppercase}
.feature p{color:var(--tx2);font-size:.82rem;line-height:1.6}

.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:60px}
@media(max-width:900px){.demo-grid{grid-template-columns:1fr}}
.demo-panel{background:rgba(20,10,36,.7);border:1px solid rgba(120,80,200,.25);border-radius:14px;padding:24px;display:flex;flex-direction:column}
.demo-panel h3{font-family:var(--mono);font-size:.72rem;letter-spacing:2px;color:var(--c2);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.demo-panel h3::before{content:'';width:8px;height:8px;border-radius:2px;background:#ff40a0}
.demo-output{flex:1;min-height:180px;background:rgba(5,3,8,.6);border:1px solid rgba(120,80,200,.25);border-radius:6px;padding:16px;font-family:var(--mono);font-size:.72rem;color:var(--tx2);overflow-y:auto;line-height:1.7;user-select:text}
.demo-output .line{padding:2px 0;border-bottom:1px dashed rgba(160,96,255,.1)}
.demo-output .line:last-child{border-bottom:none}
.demo-output .k{color:#40d0ff}
.demo-output .v{color:#40ff90;font-weight:600}
.demo-output .warn{color:#ffe040}
.demo-output .err{color:#ff4080}
.demo-output .ok{color:#40ff90}
.demo-sliders{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.slider-row{display:flex;flex-direction:column;gap:6px}
.slider-row label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}
.slider-row label span:last-child{color:#ff40a0;font-weight:700}
.slider-row input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(160,96,255,.2);border-radius:2px;outline:none;cursor:pointer}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ff40a0;border-radius:50%;cursor:pointer;box-shadow:0 0 12px #ff40a0}

.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:40px}
.spec{padding:16px 20px;background:rgba(20,10,36,.7);border:1px solid rgba(120,80,200,.25);border-radius:9px}
.spec-k{font-family:var(--mono);font-size:.6rem;letter-spacing:1.5px;color:var(--tx3);text-transform:uppercase;margin-bottom:6px}
.spec-v{font-family:var(--disp);font-size:1rem;font-weight:700;color:#40d0ff;letter-spacing:1px}

.spinner{width:16px;height:16px;border:2px solid rgba(160,96,255,.2);border-top-color:#ff40a0;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{padding:60px 40px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:.72rem;letter-spacing:2px;border-top:1px solid rgba(120,80,200,.25)}
.footer a{color:#40d0ff;text-decoration:none;margin:0 8px;cursor:pointer}
.footer a:hover{color:#ff40a0}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-hex">
    <svg viewBox="-110 -110 220 220">
      <polygon class="hex hot" points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"/>
      <polygon class="hex" points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"/>
      <polygon class="hex" points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20"/>
      <circle class="core" cx="0" cy="0" r="12"/>
    </svg>
  </div>
  <div class="boot-logo">NEXUS</div>
  <div class="boot-sub">INNOVATION SHOWCASE</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-status" id="bootStatus">initializing...</div>
  <div class="boot-libs" id="bootLibs">
    <div class="boot-lib" data-lib="react">React</div>
    <div class="boot-lib" data-lib="three">Three.js</div>
    <div class="boot-lib" data-lib="babel">Babel</div>
    <div class="boot-lib" data-lib="pyodide">Pyodide</div>
  </div>
  <div class="boot-err" id="bootErr"></div>
  <button class="boot-retry" id="bootRetry" onclick="location.reload()">↺ RETRY</button>
</div>
<div id="root"></div>

<script>
/* ================================================================
   GLOBAL ERROR HANDLER — show errors instead of black screen
   ================================================================ */
window.__showError=function(msg){
  var el=document.getElementById('bootErr');
  if(el){
    el.style.display='block';
    el.textContent='⚠ '+msg;
  }
  var retry=document.getElementById('bootRetry');
  if(retry)retry.style.display='inline-block';
  var boot=document.getElementById('boot');
  if(boot)boot.classList.remove('hidden');
};

window.addEventListener('error',function(e){
  console.error('GLOBAL ERROR:',e.message,'at',e.filename+':'+e.lineno);
  if(e.message&&e.message!=='Script error.'){
    window.__showError(e.message+'\n'+e.filename+':'+e.lineno);
  }
});

window.addEventListener('unhandledrejection',function(e){
  console.error('UNHANDLED PROMISE:',e.reason);
  window.__showError('Promise rejected: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason)));
});

/* ================================================================
   BOOT LOADER — polls for libs, transforms Babel, boots Pyodide
   ================================================================ */
window.__NEXUS={
  react:false,
  three:false,
  babel:false,
  pyodide:false,
  babelDone:false,
  launchReady:false,
  pyodideInstance:null,
  pyReady:false
};

(function(){
  var fill=document.getElementById('bootFill');
  var pctEl=document.getElementById('bootPct');
  var statusEl=document.getElementById('bootStatus');

  function setLib(name,state){
    var el=document.querySelector('.boot-lib[data-lib="'+name+'"]');
    if(el){el.classList.remove('loading','ready');el.classList.add(state);}
  }
  function setStatus(s){statusEl.textContent=s;}
  function setProgress(p){fill.style.width=p+'%';pctEl.textContent=p+'%';}

  /* Check for each library */
  function checkLibs(){
    var ok=true;
    if(!window.__NEXUS.react){
      if(typeof React!=='undefined'&&typeof ReactDOM!=='undefined'){
        window.__NEXUS.react=true;setLib('react','ready');
      } else {ok=false;setStatus('loading React...');}
    }
    if(!window.__NEXUS.three){
      if(typeof THREE!=='undefined'){
        window.__NEXUS.three=true;setLib('three','ready');
      } else {ok=false;setStatus('loading Three.js...');}
    }
    if(!window.__NEXUS.babel){
      if(typeof Babel!=='undefined'){
        window.__NEXUS.babel=true;setLib('babel','ready');
      } else {ok=false;setStatus('loading Babel...');}
    }
    if(!window.__NEXUS.pyodide){
      if(typeof loadPyodide!=='undefined'){
        window.__NEXUS.pyodide=true;setLib('pyodide','ready');
      } else {ok=false;setStatus('loading Pyodide...');}
    }
    return ok;
  }

  /* Transform all Babel scripts into runnable JS */
  function transformBabel(){
    if(window.__NEXUS.babelDone)return;
    try{
      Babel.transformScriptTags();
      window.__NEXUS.babelDone=true;
      setStatus('Babel transformed JSX');
    }catch(err){
      console.error('Babel transform failed:',err);
      window.__showError('Babel transform failed: '+err.message);
    }
  }

  /* Wait for __launchNexus to be defined */
  function waitForLaunch(cb){
    var tries=0;
    var iv=setInterval(function(){
      tries++;
      if(window.__launchNexus){
        clearInterval(iv);
        window.__NEXUS.launchReady=true;
        cb(true);
      } else if(tries>80){ /* 8 seconds */
        clearInterval(iv);
        /* Try transforming again just in case */
        try{Babel.transformScriptTags();}catch(e){}
        setTimeout(function(){
          if(window.__launchNexus){cb(true);}
          else{
            cb(false);
            window.__showError('React application failed to initialize.\nOpen browser console for details.');
          }
        },1000);
      }
    },100);
  }

  /* Main boot sequence */
  var iv=setInterval(function(){
    var libsOk=checkLibs();
    /* Progress: 25% per lib */
    var libProgress=(+window.__NEXUS.react + +window.__NEXUS.three + +window.__NEXUS.babel + +window.__NEXUS.pyodide)*22;
    setProgress(Math.min(libProgress,88));

    if(libsOk){
      clearInterval(iv);
      setStatus('transforming JSX with Babel...');
      setProgress(90);
      /* Transform babel scripts (this makes __launchNexus available) */
      setTimeout(function(){
        transformBabel();
        waitForLaunch(function(success){
          if(!success)return;
          setStatus('booting Python environment...');
          setProgress(94);
          /* Boot Pyodide */
          loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/'})
            .then(function(py){
              window.__NEXUS.pyodideInstance=py;
              window.__NEXUS.pyReady=true;
              setStatus('Python ready · launching NEXUS...');
              setProgress(100);
              setTimeout(function(){
                document.getElementById('boot').classList.add('hidden');

                }catch(err){

  setTimeout(function(){

    }

})();

/* ================================================================
   PYODIDE WRAPPER — safer conversion
   ================================================================ */
async function runPython(code){
  if(!window.__NEXUS.pyReady||!window.__NEXUS.pyodideInstance){
    return {error:'Python not ready yet'};
  }
  const py=window.__NEXUS.pyodideInstance;
  try{
    const result=await py.runPythonAsync(code);
    if(result===undefined||result===null)return {error:'Python returned null'};
    let obj;
    if(result&&typeof result.toJs==='function'){
      obj=result.toJs({dict_converter:Object.fromEntries});
    } else {
      obj=result;
    }
    if(result&&typeof result.destroy==='function')result.destroy();
    return obj||{};
  }catch(err){
    console.error('Python error:',err);
    return {error:String(err.message||err)};
  }
}

/* ================================================================
   THREE.JS SCENE BUILDER
   ================================================================ */
function buildScene(type,container,color,accent){
  if(!container||!window.THREE)return null;
  const W=Math.max(container.clientWidth,300);
  const H=Math.max(container.clientHeight,300);
  while(container.firstChild)container.removeChild(container.firstChild);

  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(45,W/H,0.1,100);
  camera.position.set(0,0,6);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(W,H);
  renderer.setClearColor(0x000000,0);
  container.appendChild(renderer.domElement);

  const objects=[];
  const clock=new THREE.Clock();

  if(type==='brain'){
    const group=new THREE.Group();
    const nodeCount=120;
    const sphereGeo=new THREE.SphereGeometry(2.2,16,16);
    const wireframe=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.15,wireframe:true}));
    group.add(wireframe);
    const neuronGeo=new THREE.SphereGeometry(0.08,8,8);
    for(let i=0;i<nodeCount;i++){
      const phi=Math.acos(1-2*(i+0.5)/nodeCount);
      const theta=Math.PI*(1+Math.sqrt(5))*i;
      const x=2.2*Math.sin(phi)*Math.cos(theta);
      const y=2.2*Math.sin(phi)*Math.sin(theta);
      const z=2.2*Math.cos(phi);
      const mat=new THREE.MeshBasicMaterial({color:Math.random()<0.3?accent:color});
      const node=new THREE.Mesh(neuronGeo,mat);
      node.position.set(x,y,z);
      node.userData={base:{x,y,z},phase:Math.random()*Math.PI*2};
      group.add(node);
      objects.push(node);
    }
    scene.add(group);
  }
  else if(type==='qubit'){
    const N=4;
    for(let i=0;i<N;i++){
      for(let j=0;j<N;j++){
        const geo=new THREE.OctahedronGeometry(0.15);
        const mat=new THREE.MeshBasicMaterial({color:Math.random()<0.5?color:accent,wireframe:Math.random()<0.3});
        const m=new THREE.Mesh(geo,mat);
        m.position.set(i-N/2+0.5,j-N/2+0.5,0);
        m.userData={base:m.position.clone(),phase:Math.random()*Math.PI*2};
        scene.add(m);
        objects.push(m);
        if(i<N-1){
          const pts=[new THREE.Vector3(i-N/2+0.5,j-N/2+0.5,0),new THREE.Vector3(i+1-N/2+0.5,j-N/2+0.5,0)];
          scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:color,transparent:true,opacity:0.25})));
        }
        if(j<N-1){
          const pts=[new THREE.Vector3(i-N/2+0.5,j-N/2+0.5,0),new THREE.Vector3(i-N/2+0.5,j+1-N/2+0.5,0)];
          scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:color,transparent:true,opacity:0.25})));
        }
      }
    }
  }
  else if(type==='timeline'){
    const points=[];
    for(let i=0;i<=100;i++){
      const t=i/100;
      points.push(new THREE.Vector3(t*6-3,Math.sin(t*Math.PI*4)*0.6,Math.cos(t*Math.PI*2)*0.3));
    }
    const curve=new THREE.CatmullRomCurve3(points);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,120,0.08,8,false),new THREE.MeshBasicMaterial({color:color})));
    for(let k=0;k<6;k++){
      const t=k/5;
      const p=curve.getPointAt(t);
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,12),new THREE.MeshBasicMaterial({color:accent}));
      m.position.copy(p);
      m.userData={base:p.clone(),phase:Math.random()*Math.PI*2};
      scene.add(m);
      objects.push(m);
    }
  }
  else if(type==='lattice'){
    const rows=6,cols=6;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const hex=new THREE.Mesh(
          new THREE.CylinderGeometry(0.25,0.25,0.15,6),
          new THREE.MeshBasicMaterial({color:Math.random()<0.5?color:accent,wireframe:Math.random()<0.3})
        );
        hex.position.set((c+(r%2)*0.5-cols/2)*0.6,(r-rows/2)*0.55,0);
        hex.rotation.x=Math.PI/2;
        hex.userData={base:hex.position.clone(),phase:Math.random()*Math.PI*2};
        scene.add(hex);
        objects.push(hex);
      }
    }
  }
  else if(type==='cloud'){
    const particles=600;
    const geo=new THREE.BufferGeometry();
    const positions=new Float32Array(particles*3);
    const colors=new Float32Array(particles*3);
    const c1=new THREE.Color(color);
    const c2=new THREE.Color(accent);
    for(let i=0;i<particles;i++){
      positions[i*3]=Math.random()*4-2;
      positions[i*3+1]=Math.random()*3-1.5;
      positions[i*3+2]=Math.random()*4-2;
      const mix=c1.clone().lerp(c2,Math.random());
      colors[i*3]=mix.r;colors[i*3+1]=mix.g;colors[i*3+2]=mix.b;
    }
    geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
    scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.9})));
  }
  else if(type==='fluid'){
    const N=400;
    const geo=new THREE.BufferGeometry();
    const positions=new Float32Array(N*3);
    const colors=new Float32Array(N*3);
    const c1=new THREE.Color(color);
    const c2=new THREE.Color(accent);
    for(let i=0;i<N;i++){
      const r=Math.random()*2.5;
      const theta=Math.random()*Math.PI*2;
      positions[i*3]=Math.cos(theta)*r;
      positions[i*3+1]=Math.sin(theta)*r*0.6;
      positions[i*3+2]=(Math.random()-0.5)*0.5;
      const mix=c1.clone().lerp(c2,Math.random());
      colors[i*3]=mix.r;colors[i*3+1]=mix.g;colors[i*3+2]=mix.b;
    }
    geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
    scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:0.12,vertexColors:true,transparent:true,opacity:0.85})));
  }
  else {
    scene.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1.4,0.4,128,24),new THREE.MeshBasicMaterial({color:color,wireframe:true})));
  }

  let mx=0,my=0;
  function onMove(e){
    const r=container.getBoundingClientRect();
    const cx=(e.clientX||(e.touches&&e.touches[0].clientX))-r.left;
    const cy=(e.clientY||(e.touches&&e.touches[0].clientY))-r.top;
    mx=(cx/r.width-0.5)*0.8;
    my=(cy/r.height-0.5)*0.8;
  }
  container.addEventListener('mousemove',onMove);
  container.addEventListener('touchmove',onMove,{passive:true});

  let rafId;
  function animate(){
    rafId=requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    objects.forEach(o=>{
      if(o.userData&&o.userData.base&&o.userData.phase!==undefined){
        const {base,phase}=o.userData;
        const wave=Math.sin(t*1.5+phase)*0.15;
        o.position.set(base.x+wave,base.y+wave*0.5,base.z+wave*0.3);
      }
    });
    scene.rotation.y=t*0.2+mx;
    scene.rotation.x=my*0.5;
    renderer.render(scene,camera);
  }
  animate();

  return {
    dispose:function(){
      cancelAnimationFrame(rafId);
      container.removeEventListener('mousemove',onMove);
      container.removeEventListener('touchmove',onMove);
      renderer.dispose();
    }
  };
}

      rafId=requestAnimationFrame(animate);
      t+=0.016;
      ctx.clearRect(0,0,W,H);
      stars.forEach(s=>{
        s.x+=s.vx;s.y+=s.vy;
        if(s.x<0)s.x=W;if(s.x>W)s.x=0;
        if(s.y<0)s.y=H;if(s.y>H)s.y=0;
        const alpha=0.3+Math.sin(t+s.phase)*0.3;
        ctx.fillStyle='hsla('+s.hue+',80%,70%,'+alpha+')';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
      });
    }
    animate();
    return ()=>{cancelAnimationFrame(rafId);window.removeEventListener('resize',resize);};
  },[]);
  return React.createElement('div',{className:'app-bg'},React.createElement('canvas',{ref:ref}));
}

/* ================================================================
   ERROR BOUNDARY
   ================================================================ */
class ErrorBoundary extends React.Component{
  constructor(props){
    super(props);
    this.state={hasError:false,error:null};
  }
  static getDerivedStateFromError(error){
    return {hasError:true,error:error};
  }
  componentDidCatch(error,errorInfo){
    console.error('React Error Boundary:',error,errorInfo);
  }
  render(){
    if(this.state.hasError){
      return React.createElement('div',{
        style:{padding:'40px',color:'#ff90a8',fontFamily:'monospace',background:'#050308',minHeight:'100vh'}
      },
        React.createElement('h1',{style:{fontSize:'1.5rem',marginBottom:'20px',color:'#ff40a0'}},'⚠ Runtime Error'),
        React.createElement('pre',{style:{whiteSpace:'pre-wrap',fontSize:'0.8rem',lineHeight:'1.6'}},
          String(this.state.error&&this.state.error.stack||this.state.error)
        ),
        React.createElement('button',{
          onClick:()=>window.location.reload(),
          style:{marginTop:'24px',padding:'12px 24px',background:'#ff40a0',border:'none',color:'#050308',fontWeight:'700',borderRadius:'6px',cursor:'pointer'}
        },'↺ Reload')
      );
    }
    return this.props.children;
  }
}

/* ================================================================
   LAUNCH FUNCTION
   ================================================================ */
window.__launchNexus=function(){
  const rootEl=document.getElementById('root');
  if(!rootEl){console.error('No #root element');return;}
  const root=ReactDOM.createRoot(rootEl);
  root.render(
    React.createElement(ErrorBoundary,null,

    )
  );
};
