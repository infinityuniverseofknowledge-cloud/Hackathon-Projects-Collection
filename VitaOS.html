<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1420">
<title>VITAOS — Personal Health OS</title>
<style>
/* ================================================================
   VITAOS — Design System
   Calming medical palette · high contrast · touch-optimized
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#fff}

:root{
  --bg:#0a1420;--bg2:#0e1a28;--bg3:#152436;--bg4:#1e3048;
  --panel:#101d2e;--panel2:#182942;--panel3:#213554;--panel4:#2a4268;
  --bd:#1f3450;--bd2:#2d4a6e;--bd3:#3d6088;
  --tx:#eef4ff;--tx2:#9eb4d0;--tx3:#6a82a2;--mu:#4a5f7c;
  --c1:#14b8a6;--c1h:#2dd4bf;--c1l:#0d9488;
  --c2:#f43f5e;--c2h:#fb7185;--c2l:#e11d48;
  --c3:#3b82f6;--c3h:#60a5fa;--c3l:#2563eb;
  --c4:#f59e0b;--c4h:#fbbf24;--c4l:#d97706;
  --c5:#8b5cf6;--c5h:#a78bfa;--c5l:#7c3aed;
  --c6:#06b6d4;--c6h:#22d3ee;--c6l:#0891b2;
  --c7:#ec4899;--c7h:#f472b6;--c7l:#db2777;
  --c8:#84cc16;--c8h:#a3e635;--c8l:#65a30d;
  --c9:#10b981;--c9h:#34d399;--c9l:#059669;
  --c10:#6366f1;--c10h:#818cf8;--c10l:#4338ca;
  --c11:#0ea5e9;--c11h:#38bdf8;--c11l:#0284c7;
  --c12:#a855f7;--c12h:#c084fc;--c12l:#9333ea;
  /* Semantic */
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;--info:#3b82f6;
  --critical:#ef4444;--urgent:#f97316;--attention:#f59e0b;
  --safe:#10b981;
  /* Gradients */
  --g1:linear-gradient(135deg,#14b8a6,#06b6d4);
  --g2:linear-gradient(135deg,#f43f5e,#ec4899);
  --g3:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --g4:linear-gradient(135deg,#f59e0b,#f43f5e);
  --g5:linear-gradient(135deg,#10b981,#84cc16);
  --g6:linear-gradient(135deg,#8b5cf6,#ec4899);
  --gHeart:linear-gradient(135deg,#e11d48,#f43f5e,#fb7185);
  --gCalm:linear-gradient(135deg,#06b6d4,#14b8a6,#10b981);
  --r:12px;--rs:8px;--rxs:6px;--rxxs:4px;--rf:9999px;
  --sh1:0 1px 3px rgba(0,0,0,.4);
  --sh2:0 4px 12px rgba(0,0,0,.5);
  --sh3:0 8px 32px rgba(0,0,0,.7);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f4f8;--bg2:#e8eef5;--bg3:#dde7f0;--bg4:#cbd8e5;
  --panel:#ffffff;--panel2:#f5f9fc;--panel3:#e8f0f7;--panel4:#d0dde8;
  --bd:#d0dde8;--bd2:#a8bdd0;--bd3:#88a0b8;
  --tx:#0f2030;--tx2:#3a5570;--tx3:#6a86a0;--mu:#94a8bc;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
  --shIn:inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="calm"]{
  --bg:#1a2028;--bg2:#222a34;--bg3:#2a3440;--bg4:#354350;
  --panel:#1e2732;--panel2:#28323e;--panel3:#334252;--panel4:#40506080;
  --bd:#334252;--bd2:#4a5d75;--bd3:#6080a0;
  --tx:#e8eef5;--tx2:#a0b0c5;--tx3:#7086a0;--mu:#506880;
  --c1:#4dd0e1;--c1h:#80deea;--c1l:#26c6da;
}
[data-theme="warm"]{
  --bg:#1e1816;--bg2:#28221e;--bg3:#342c26;--bg4:#443a30;
  --panel:#241d1a;--panel2:#2e2622;--panel3:#3c332c;--panel4:#4c4038;
  --bd:#3c332c;--bd2:#584a40;--bd3:#786050;
  --tx:#f5e8e0;--tx2:#c0a898;--tx3:#887058;--mu:#5c4a3a;
}
[data-theme="mono"]{
  --bg:#0a0a0a;--bg2:#121212;--bg3:#1a1a1a;--bg4:#242424;
  --panel:#0e0e0e;--panel2:#161616;--panel3:#1e1e1e;--panel4:#282828;
  --bd:#282828;--bd2:#3a3a3a;--bd3:#505050;
  --tx:#f5f5f5;--tx2:#c0c0c0;--tx3:#888;--mu:#606060;
  --c1:#f5f5f5;--c2:#c0c0c0;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

/* ================================================================
   LAYOUT
   ================================================================ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:250px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--gCalm);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(20,184,166,.5);
}
.sb-title{font-weight:800;font-size:1rem;letter-spacing:.5px;line-height:1}
.sb-sub{font-size:.56rem;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px;font-weight:600}
.sb-profile{
  margin:8px;padding:10px;background:var(--panel2);border-radius:var(--rxs);
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:var(--t);
  border:1px solid var(--bd);
}
.sb-profile:hover{background:var(--panel3);border-color:var(--c1)}
.sb-profile .avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--g1);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85rem;flex-shrink:0;
}
.sb-profile .info{flex:1;min-width:0}
.sb-profile .pname{font-size:.78rem;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-profile .pmeta{font-size:.62rem;color:var(--tx3);margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.56rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.4px;text-transform:uppercase;
  padding:12px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.78rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(20,184,166,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.58rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#fff;
  min-width:18px;text-align:center;
}
.nav-item.active .ni-badge{background:rgba(255,255,255,.25)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:56px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.15rem;align-items:center;justify-content:center;
}
.tb-menu:hover{background:var(--panel2);color:var(--tx)}
.tb-title{font-weight:700;font-size:1rem;flex-shrink:0}
.tb-sub{font-size:.65rem;color:var(--tx3);margin-left:6px;font-weight:500}
.tb-search{flex:1;max-width:380px;position:relative;margin-left:auto}
.tb-search input{
  width:100%;padding:9px 14px 9px 38px;
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:var(--rxs);color:var(--tx);
  font-size:.78rem;transition:var(--t);
}
.tb-search input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.tb-search .icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--tx3);font-size:.85rem;pointer-events:none;
}
.tb-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:5px;right:5px;
  min-width:17px;height:17px;padding:0 4px;
  background:var(--c2);color:#fff;
  border-radius:var(--rf);
  font-size:.58rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:22px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.4rem;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.page-desc{font-size:.75rem;color:var(--tx3);margin-top:4px}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);
  color:var(--tx);font-size:.76rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--bd2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(20,184,166,.35)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(20,184,166,.5)}
.btn.heart{background:var(--gHeart);color:#fff;border-color:transparent}
.btn.purple{background:var(--g3);color:#fff;border-color:transparent}
.btn.warn{background:var(--g4);color:#fff;border-color:transparent}
.btn.danger{background:var(--c2);color:#fff;border-color:transparent}
.btn.danger:hover{background:var(--c2h)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.7rem}
.btn.xs{padding:3px 8px;font-size:.65rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:24px}
.card.pad-sm{padding:12px}
.card-heart{border-left:4px solid var(--c2);background:linear-gradient(135deg,var(--panel),rgba(244,63,94,.06))}
.card-calm{border-left:4px solid var(--c1);background:linear-gradient(135deg,var(--panel),rgba(20,184,166,.06))}
.card-warm{border-left:4px solid var(--c4);background:linear-gradient(135deg,var(--panel),rgba(245,158,11,.06))}
.card-purple{border-left:4px solid var(--c5);background:linear-gradient(135deg,var(--panel),rgba(139,92,246,.06))}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:20px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  position:relative;overflow:hidden;
  transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.heart::before{background:var(--gHeart)}
.kpi.calm::before{background:var(--gCalm)}
.kpi.warm::before{background:var(--g4)}
.kpi.purple::before{background:var(--g3)}
.kpi.safe::before{background:var(--g5)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.62rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:8px;
}
.kpi-value{
  font-size:1.6rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;
  color:var(--tx);
}
.kpi-unit{font-size:.7rem;font-weight:600;color:var(--tx3);margin-left:3px}
.kpi-hint{
  font-size:.68rem;color:var(--tx3);
  margin-top:8px;line-height:1.4;
}
.kpi-delta{
  font-size:.68rem;font-weight:600;
  margin-top:6px;display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:var(--rf);
}
.kpi-delta.up{background:rgba(16,185,129,.15);color:var(--ok)}
.kpi-delta.down{background:rgba(239,68,68,.15);color:var(--err)}
.kpi-delta.neutral{background:var(--panel3);color:var(--tx3)}

/* ================================================================
   TABLES
   ================================================================ */
.table-wrap{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;
}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700}
.table-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:10px 14px;text-align:left;
  font-size:.62rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.6px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{
  padding:11px 14px;border-bottom:1px solid var(--bd);
  color:var(--tx);vertical-align:middle;
}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

/* Priority color strip on rows */
tr.p-critical td:first-child{border-left:4px solid var(--critical)}
tr.p-urgent td:first-child{border-left:4px solid var(--urgent)}
tr.p-attention td:first-child{border-left:4px solid var(--attention)}
tr.p-safe td:first-child{border-left:4px solid var(--safe)}
tr.p-info td:first-child{border-left:4px solid var(--info)}

/* ================================================================
   BADGES
   ================================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;
  white-space:nowrap;
}
.badge.critical{background:rgba(239,68,68,.18);color:var(--critical);border:1px solid rgba(239,68,68,.35)}
.badge.urgent{background:rgba(249,115,22,.18);color:var(--urgent);border:1px solid rgba(249,115,22,.35)}
.badge.attention{background:rgba(245,158,11,.18);color:var(--attention);border:1px solid rgba(245,158,11,.35)}
.badge.safe{background:rgba(16,185,129,.18);color:var(--safe);border:1px solid rgba(16,185,129,.35)}
.badge.info{background:rgba(59,130,246,.18);color:var(--info);border:1px solid rgba(59,130,246,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}
.badge.active{background:rgba(20,184,166,.18);color:var(--c1);border:1px solid rgba(20,184,166,.35)}
.badge.completed{background:rgba(16,185,129,.18);color:var(--safe)}

/* ================================================================
   FORMS
   ================================================================ */
.form{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-size:.68rem;font-weight:700;
  color:var(--tx2);text-transform:uppercase;
  letter-spacing:.55px;
}
.field label .req{color:var(--c2);margin-left:3px}
.field label .hint{color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0;font-size:.66rem;margin-left:6px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.78rem;transition:var(--t);
  font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(20,184,166,.15);
}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field small{font-size:.64rem;color:var(--tx3)}
.field-error{color:var(--c2);font-size:.66rem;margin-top:2px}

/* ================================================================
   MODAL
   ================================================================ */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.modal-head h2{font-size:1rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;
  flex-wrap:wrap;
}

/* ================================================================
   TOASTS
   ================================================================ */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd);
  border-left:3px solid var(--info);
  box-shadow:var(--sh3);
  font-size:.75rem;font-weight:500;
  max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--safe)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast.heart{border-left-color:var(--c2);background:linear-gradient(135deg,var(--panel),rgba(244,63,94,.08))}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* ================================================================
   CHARTS
   ================================================================ */
.chart-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}

}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#fff;border-color:var(--c1)}

.divider{height:1px;background:var(--bd);margin:16px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--bd);
  font-size:.76rem;
  gap:12px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}
.stat-line .sl-value.pos{color:var(--ok)}
.stat-line .sl-value.neg{color:var(--err)}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.spinner{

/* Board grid */
.board-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
.board-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  transition:var(--t);cursor:pointer;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.board-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.board-card::before{

  background:var(--c1);
}
.board-card.heart::before{background:var(--c2)}
.board-card.calm::before{background:var(--c1)}
.board-card.warm::before{background:var(--c4)}
.board-card.purple::before{background:var(--c5)}
.board-card.safe::before{background:var(--c9)}
.bc-head{
  display:flex;justify-content:space-between;align-items:start;gap:10px;
  margin-bottom:10px;
}
.bc-title{font-weight:700;font-size:.88rem;line-height:1.3;color:var(--tx)}
.bc-meta{font-size:.68rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.bc-desc{
  font-size:.74rem;color:var(--tx2);line-height:1.55;

}
.bc-foot{

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* Vitals display (big numbers) */
.vital-display{
  text-align:center;
  padding:18px 12px;
  background:var(--panel2);
  border-radius:var(--rxs);
  border:1px solid var(--bd);
}
.vital-display .vlabel{
  font-size:.6rem;color:var(--tx3);
  text-transform:uppercase;letter-spacing:1px;font-weight:700;
  margin-bottom:6px;
}
.vital-display .vval{
  font-size:2rem;font-weight:800;
  font-family:var(--mono);line-height:1;
  color:var(--tx);
}
.vital-display .vunit{
  font-size:.7rem;color:var(--tx3);
  margin-left:3px;font-weight:600;
}
.vital-display .vhint{

}
.vital-display.ok .vval{color:var(--ok)}

/* Mood emoji picker */
.mood-picker{
  display:flex;gap:6px;justify-content:center;
  flex-wrap:wrap;
  padding:10px 0;
}
.mood-btn{
  width:48px;height:48px;border-radius:50%;

.mood-btn.selected{background:var(--g1);border-color:transparent;box-shadow:0 0 20px rgba(20,184,166,.5)}

}

.med-pill.upcoming{background:rgba(59,130,246,.15);color:var(--info);border-color:rgba(59,130,246,.35)}

/* Sleep bar */
.sleep-bar{
  height:22px;border-radius:11px;
  background:var(--panel3);position:relative;overflow:hidden;
  display:flex;
}
.sleep-seg{height:100%;transition:var(--t)}
.sleep-seg.deep{background:#1e3a8a}
.sleep-seg.light{background:#3b82f6}
.sleep-seg.rem{background:#8b5cf6}
.sleep-seg.awake{background:#f59e0b}

/* Water glasses */
.water-tracker{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;

}
.water-glass{
  width:34px;height:48px;border-radius:4px 4px 12px 12px;

}

  content:'💧';position:absolute;inset:0;

/* Habit checklist */
.habit-row{
  display:flex;align-items:center;gap:12px;

.habit-check{

.habit-info{flex:1;min-width:0}
.habit-name{font-size:.78rem;font-weight:600;color:var(--tx)}

}

}

<script>
"use strict";
/* ================================================================
   VITAOS — Core Runtime
   ================================================================ */

/* ---------- DOM utils ---------- */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k==='text')e.textContent=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0)e[k]=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  if(children){
    if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    else e.appendChild(children);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function nowLocal(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  var s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function ageFromDOB(dob){
  if(!dob)return 0;
  var d=new Date(dob);
  var diff=Date.now()-d.getTime();
  return Math.floor(diff/(365.25*24*3600*1000));
}
function parseNum(v){
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function addDays(iso,n){
  var d=new Date(iso);d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function lastNDays(n){
  var arr=[];
  for(var i=n-1;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    arr.push(d.toISOString().slice(0,10));
  }
  return arr;
}
function startOfWeek(){
  var d=new Date();var day=d.getDay();
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function startOfMonth(){
  var d=new Date();
  return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);
}
function safeInt(v,def){var n=parseInt(v);return isNaN(n)?(def||0):n}
function safeFloat(v,def){var n=parseFloat(v);return isNaN(n)?(def||0):n}

/* ---------- Toast ---------- */
function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ',heart:'💚'};
  var t2=el('div',{class:'toast '+type});
  t2.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t2);
  setTimeout(function(){
    t2.classList.add('leaving');
    setTimeout(function(){t2.remove()},320);
  },3200);
}

/* ---------- Modal ---------- */
function openModal(opts){
  opts=opts||{};
  var box=$('modalBox');
  box.className='modal-box'+(opts.wide?' wide':'')+(opts.narrow?' narrow':'');
  $('modalTitle').textContent=opts.title||'';
  $('modalBody').innerHTML=opts.body||'';
  $('modalFoot').innerHTML=opts.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(opts.onOpen)setTimeout(opts.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,message,onConfirm,danger){
  openModal({
    title:title,
    narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.65;font-size:.85rem">'+esc(message)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">Confirm</button>',
    onOpen:function(){
      $('confirmYes').onclick=function(){closeModal();onConfirm()};
    }
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal({
    title:title,
    narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');
      inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

/* ================================================================
   CRYPTO — AES-GCM for encrypted backups
   ================================================================ */
var Crypto={
  async deriveKey(passphrase,salt){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(passphrase),{name:'PBKDF2'},false,['deriveKey']);
    return await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
      km,
      {name:'AES-GCM',length:256},
      false,
      ['encrypt','decrypt']
    );
  },
  async encrypt(plaintext,passphrase){
    if(!window.crypto||!window.crypto.subtle)throw new Error('Web Crypto not available');
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await this.deriveKey(passphrase,salt);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(plaintext));
    var combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
    combined.set(salt,0);
    combined.set(iv,salt.length);
    combined.set(new Uint8Array(ct),salt.length+iv.length);
    return this.b64(combined);
  },
  async decrypt(b64,passphrase){
    var data=this.unb64(b64);
    var salt=data.slice(0,16);
    var iv=data.slice(16,28);
    var ct=data.slice(28);
    var key=await this.deriveKey(passphrase,salt);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  },
  b64(buf){
    var bin='';
    var bytes=new Uint8Array(buf);
    for(var i=0;i<bytes.byteLength;i++)bin+=String.fromCharCode(bytes[i]);
    return btoa(bin);
  },
  unb64(str){
    var bin=atob(str);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return bytes;
  }
};

function getActiveProfile(){
  return State.profiles.find(function(p){return p.id===State.activeProfileId})||State.profiles[0];
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(State));
  }catch(e){
    console.error('Save failed',e);
    toast('Storage full or unavailable','error');
  }
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var data=JSON.parse(raw);
    State.version=data.version||1;
    State.activeProfileId=data.activeProfileId||'default';
    State.profiles=data.profiles||[];
    Object.assign(State.settings,data.settings||{});
    return true;
  }catch(e){return false}
}

function initApp(){
  var loaded=loadState();
  if(!loaded||!State.profiles.length){
    seedDemoData();
    saveState();
  }
  if(!State.profiles.length)State.profiles=[newProfile('Me')];
  if(!State.profiles.find(function(p){return p.id===State.activeProfileId})){
    State.activeProfileId=State.profiles[0].id;
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'dark');
  updateProfileBadges();
  renderNav();
  renderPage();
  updateAlerts();
  setInterval(updateAlerts,60000);
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  window.addEventListener('beforeunload',saveState);

  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='dashboard')after_dashboard();
    if(CurrentRoute==='reports')after_reports();
  });

  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='Escape')closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var s=$('globalSearch');if(s)s.focus()}
    if(e.key==='?')openHelp();
    if(e.key==='g'){
      window._gk=true;setTimeout(function(){window._gk=false},1000);return;
    }
    if(window._gk){
      var map={'d':'dashboard','v':'vitals','m':'medications','y':'symptoms','o':'mood','s':'sleep','f':'food','e':'exercise','w':'water','j':'journal','a':'appointments','x':'vaccines','i':'allergies','c':'conditions','l':'labs','p':'cycle','r':'reports','t':'print','g':'settings'};
      if(map[e.key])navigate(map[e.key]);
    }
  });

  var search=$('globalSearch');
  if(search){
    search.onkeydown=function(e){
      if(e.key==='Enter'){
        var q=this.value.trim();
        if(!q)return;
        globalSearchAction(q);
      }
    };
  }

  setTimeout(function(){toast('Welcome to VITAOS','success')},300);
}

var CurrentRoute='dashboard';

function navigate(route){
  if(!ROUTES[route])route='dashboard';
  CurrentRoute=route;
  $('tbTitle').textContent=ROUTES[route].title;
  $('tbSub').textContent=ROUTES[route].sub;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var nav=$('sbNav');
  if(!nav)return;
  var profile=getActiveProfile();
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var order=['Overview','Track','Medical','Special','Emergency','Analysis','System'];
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      var r=item.route;
      var badge='';
      if(r==='alerts'){
        var cnt=getAlertCount();
        if(cnt>0)badge='<span class="ni-badge">'+cnt+'</span>';
      }else if(r==='medications'&&profile){
        var due=profile.medications.filter(function(m){return m.active&&m.refillDate&&daysBetween(today(),m.refillDate)<=7&&daysBetween(today(),m.refillDate)>=0}).length;
        if(due>0)badge='<span class="ni-badge">'+due+'</span>';
      }else if(r==='appointments'&&profile){
        var upcoming=profile.appointments.filter(function(a){return a.status==='upcoming'&&daysBetween(today(),a.date)>=0&&daysBetween(today(),a.date)<=7}).length;
        if(upcoming>0)badge='<span class="ni-badge">'+upcoming+'</span>';

function bpCategory(sys,dia){
  if(sys>=180||dia>=120)return {level:'critical',label:'Hypertensive crisis',cls:'err'};
  if(sys>=140||dia>=90)return {level:'high',label:'Stage 2 hypertension',cls:'err'};
  if(sys>=130||dia>=80)return {level:'elevated',label:'Stage 1 hypertension',cls:'warn'};
  if(sys>=120)return {level:'elevated',label:'Elevated',cls:'warn'};
  if(sys<90||dia<60)return {level:'low',label:'Low',cls:'warn'};
  return {level:'normal',label:'Normal',cls:'ok'};
}
function bmiCategory(bmi){
  if(bmi<18.5)return {label:'Underweight',cls:'warn'};
  if(bmi<25)return {label:'Normal',cls:'ok'};
  if(bmi<30)return {label:'Overweight',cls:'warn'};
  return {label:'Obese',cls:'err'};
}
function tempCategory(t){
  if(t<35)return {label:'Hypothermia',cls:'err'};
  if(t<36)return {label:'Low',cls:'warn'};
  if(t<=37.5)return {label:'Normal',cls:'ok'};
  if(t<=38.5)return {label:'Fever',cls:'warn'};
  return {label:'High fever',cls:'err'};
}
function spo2Category(v){
  if(v>=95)return {label:'Normal',cls:'ok'};
  if(v>=90)return {label:'Low',cls:'warn'};
  return {label:'Critical',cls:'err'};
}
function hrCategory(v){
  if(v<50)return {label:'Bradycardia',cls:'warn'};
  if(v<=100)return {label:'Normal',cls:'ok'};
  if(v<=120)return {label:'Tachycardia',cls:'warn'};
  return {label:'High',cls:'err'};
}
function glucoseCategory(v){
  if(v<70)return {label:'Hypoglycemia',cls:'err'};
  if(v<100)return {label:'Normal',cls:'ok'};
  if(v<126)return {label:'Prediabetes',cls:'warn'};
  return {label:'High',cls:'err'};
}
function severityLabel(n){
  return ['','Minimal','Mild','Moderate','Severe','Extreme'][n]||'—';
}
function severityBadge(n){
  var cls=n>=4?'err':n>=3?'warn':n>=2?'attention':'safe';
  return '<span class="badge '+cls+'">'+severityLabel(n)+' ('+n+'/5)</span>';
}

/* ================================================================
   ALERTS
   ================================================================ */
function getAlerts(){
  var p=getActiveProfile();
  if(!p)return [];
  var alerts=[];
  // Overdue med refills
  p.medications.filter(function(m){return m.active&&m.refillDate}).forEach(function(m){
    var d=daysBetween(today(),m.refillDate);
    if(d<0)alerts.push({type:'critical',icon:'💊',title:'Refill overdue',msg:m.name+' refill was due '+Math.abs(d)+' days ago',route:'medications'});
    else if(d<=3)alerts.push({type:'urgent',icon:'💊',title:'Refill soon',msg:m.name+' refill in '+d+' days',route:'medications'});
  });
  // Low pill count
  p.medications.filter(function(m){return m.active&&m.pillsLeft!=null&&m.pillsLeft<7}).forEach(function(m){
    alerts.push({type:'urgent',icon:'💊',title:'Low pill count',msg:m.name+' — only '+m.pillsLeft+' left',route:'medications'});
  });
  // Upcoming appointments
  p.appointments.filter(function(a){return a.status==='upcoming'}).forEach(function(a){
    var d=daysBetween(today(),a.date);
    if(d===0)alerts.push({type:'urgent',icon:'📅',title:'Appointment today',msg:a.title+' at '+a.time,route:'appointments'});
    else if(d===1)alerts.push({type:'attention',icon:'📅',title:'Appointment tomorrow',msg:a.title+' at '+a.time,route:'appointments'});
  });
  // Recent high BP
  var recentVitals=p.vitals.filter(function(v){return v.systolic&&daysBetween(v.date,today())<=3});
  recentVitals.forEach(function(v){
    var cat=bpCategory(v.systolic,v.diastolic);
    if(cat.level==='critical'||cat.level==='high'){
      alerts.push({type:'critical',icon:'💓',title:'High blood pressure reading',msg:v.systolic+'/'+v.diastolic+' on '+fmtDate(v.date),route:'vitals'});
    }
  });
  // Very low SpO2
  p.vitals.filter(function(v){return v.spo2&&v.spo2<92&&daysBetween(v.date,today())<=7}).forEach(function(v){
    alerts.push({type:'urgent',icon:'🫁',title:'Low oxygen saturation',msg:'SpO2 '+v.spo2+'% on '+fmtDate(v.date),route:'vitals'});
  });
  // Fever
  p.vitals.filter(function(v){return v.temperature&&v.temperature>=38.5&&daysBetween(v.date,today())<=3}).forEach(function(v){
    alerts.push({type:'urgent',icon:'🌡️',title:'Fever recorded',msg:v.temperature.toFixed(1)+'°C on '+fmtDate(v.date),route:'vitals'});
  });
  // Severe symptoms
  p.symptoms.filter(function(s){return s.severity>=4&&daysBetween(s.date,today())<=7}).forEach(function(s){
    alerts.push({type:'attention',icon:'⚠️',title:'Severe symptom logged',msg:(s.symptoms||[]).join(', ')+' on '+fmtDate(s.date),route:'symptoms'});
  });
  // Low mood streak
  var recentMoods=p.moods.filter(function(m){return daysBetween(m.date,today())<=7}).sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,5);
  if(recentMoods.length>=3&&recentMoods.every(function(m){return m.score<=3})){
    alerts.push({type:'attention',icon:'🧠',title:'Low mood trend',msg:'Mood has been low for several days',route:'mood'});
  }
  return alerts;
}
function getAlertCount(){return getAlerts().length}

  var cnt=getAlertCount();

  if(badge){

  }
}

function globalSearchAction(q){
  q=q.toLowerCase();
  var p=getActiveProfile();
  if(!p)return;
  // Meds
  var med=p.medications.find(function(m){return m.name.toLowerCase().indexOf(q)>-1});
  if(med){navigate('medications');setTimeout(function(){editMedication(med.id)},100);return}
  // Symptoms
  var sym=p.symptoms.find(function(s){return (s.symptoms||[]).join(',').toLowerCase().indexOf(q)>-1});
  if(sym){navigate('symptoms');return}
  // Journal
  var jn=p.journal.find(function(j){return (j.title+' '+j.text).toLowerCase().indexOf(q)>-1});
  if(jn){navigate('journal');setTimeout(function(){viewJournalEntry(jn.id)},100);return}
  // Conditions
  var cond=p.conditions.find(function(c){return c.name.toLowerCase().indexOf(q)>-1});
  if(cond){navigate('conditions');return}
  // Allergies
  var alg=p.allergies.find(function(a){return a.substance.toLowerCase().indexOf(q)>-1});
  if(alg){navigate('allergies');return}
  toast('No matches for "'+q+'"','warn');
}

function copySOS(){

function sendSOS(){
  var to=$('sosTo').value.trim();

/* ================================================================

   ================================================================ */
function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;
  min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.lineWidth=1;
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  var steps=4;
  for(var i=0;i<=steps;i++){
    var y=padT+i*(cH/steps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    var val=max-(i*((max-min)/steps));
    ctx.fillText(val.toFixed(range<10?1:0),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    var x=padL+(i/(len-1||1))*cW;
    ctx.fillText(d.x, x, H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#14b8a6','#f43f5e','#3b82f6','#f59e0b','#8b5cf6'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');
    grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}
      else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;
    ctx.lineWidth=2;
    ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);
      ctx.lineTo(padL,padT+cH);
      ctx.closePath();
      ctx.fillStyle=grad;
      ctx.fill();
    }
    ctx.beginPath();
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      ctx.moveTo(x,y);
      ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=color;
    ctx.fill();
  });
}

function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=42,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*(max/4))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7;
  var gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    ctx.fillStyle=d.color||opts.color||'#14b8a6';
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);
    ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);
    ctx.lineTo(x,padT+cH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>8)label=label.slice(0,7)+'…';
    ctx.fillText(label, x+bw/2, H-10);
  });
}

function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-24;
  var inner=r*0.6;
  var start=-Math.PI/2;
  var colors=['#14b8a6','#f43f5e','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#84cc16','#06b6d4'];
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||colors[i%colors.length];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.label||'Total',cx,cy+18);
}

var MedsFilter='all';

function render_medications(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var list=p.medications.slice();
  if(MedsFilter==='active')list=list.filter(function(m){return m.active});
  else if(MedsFilter==='inactive')list=list.filter(function(m){return !m.active});
  list.sort(function(a,b){
    if(a.active!==b.active)return a.active?-1:1;
    return a.name.localeCompare(b.name);
  });

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">💊 Medications</div>';
  html+='<div class="page-desc">'+p.medications.filter(function(m){return m.active}).length+' active · '+p.medications.length+' total</div></div>';
  html+='<button class="btn primary" onclick="editMedication(null)">➕ Add Medication</button>';
  html+='</div>';

  html+='<div class="card pad-sm" style="margin-bottom:14px">';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  html+='<div class="chips">';
  [['all','All'],['active','Active'],['inactive','Discontinued']].forEach(function(f){
    html+='<span class="chip'+(MedsFilter===f[0]?' active':'')+'" onclick="MedsFilter=\''+f[0]+'\';renderPage()">'+f[1]+'</span>';
  });
  html+='</div>';
  html+='</div></div>';

  if(list.length===0){
    html+='<div class="empty"><span class="icon">💊</span><h4>No medications</h4><p>Add your current prescriptions and supplements.</p></div>';
    return html;
  }

  html+='<div class="board-grid">';
  list.forEach(function(m){
    var freqLabel={once_daily:'Once daily',twice_daily:'Twice daily',three_daily:'3× daily',four_daily:'4× daily',weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',as_needed:'As needed'}[m.frequency]||m.frequency;
    var refillInfo='';
    if(m.refillDate){
      var d=daysBetween(today(),m.refillDate);
      if(d<0)refillInfo='<span class="badge critical">Refill overdue</span>';
      else if(d<=3)refillInfo='<span class="badge urgent">Refill in '+d+'d</span>';
      else if(d<=7)refillInfo='<span class="badge attention">Refill in '+d+'d</span>';
      else refillInfo='<span class="badge safe">Refill in '+d+'d</span>';
    }
    var pillInfo=m.pillsLeft!=null?'<span class="badge '+(m.pillsLeft<7?'urgent':'neutral')+'">'+m.pillsLeft+' pills left</span>':'';
    html+='<div class="board-card '+(m.active?'calm':'')+'" onclick="editMedication(\''+m.id+'\')">';
    html+='<div class="bc-head">';
    html+='<div style="flex:1">';
    html+='<div class="bc-title">'+esc(m.name)+'</div>';
    html+='<div class="bc-meta"><span>'+esc(m.dose||'')+'</span>'+(m.form?'<span>·</span><span>'+esc(m.form)+'</span>':'')+'</div>';
    html+='</div>';
    html+=m.active?'<span class="badge active">Active</span>':'<span class="badge neutral">Stopped</span>';
    html+='</div>';
    html+='<div style="font-size:.72rem;color:var(--tx2);margin-bottom:8px">⏰ '+freqLabel+(m.times&&m.times.length?' at '+m.times.join(', '):'')+'</div>';
    if(m.reason)html+='<div style="font-size:.7rem;color:var(--tx3);margin-bottom:6px">📋 '+esc(m.reason)+'</div>';
    if(m.notes)html+='<div class="bc-desc">'+esc(m.notes)+'</div>';
    html+='<div class="bc-foot">';
    html+=refillInfo;
    html+=pillInfo;
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

function render_water(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var todayEntry=p.water.find(function(w){return w.date===today()});
  var todayGlasses=todayEntry?todayEntry.glasses:0;
  var goal=todayEntry?todayEntry.goal:8;
  var days=lastNDays(14);

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">💧 Hydration</div>';
  html+='<div class="page-desc">'+todayGlasses+' of '+goal+' glasses today</div></div>';
  html+='</div>';

  html+='<div class="card card-calm" style="margin-bottom:16px;text-align:center">';
  html+='<div style="font-size:2.6rem;font-weight:800;font-family:var(--mono);color:var(--c3)">'+todayGlasses+'</div>';
  html+='<div style="font-size:.7rem;color:var(--tx3);text-transform:uppercase;font-weight:700;letter-spacing:1px;margin-top:4px">Glasses today · Goal '+goal+'</div>';
  html+='<div style="height:8px;background:var(--panel3);border-radius:4px;overflow:hidden;margin:14px auto;max-width:400px">';
  html+='<div style="height:100%;width:'+Math.min(100,todayGlasses/goal*100)+'%;background:linear-gradient(90deg,#3b82f6,#06b6d4);transition:width .3s"></div>';
  html+='</div>';
  html+='<div class="water-tracker" id="waterTracker">';
  for(var i=1;i<=12;i++){
    html+='<div class="water-glass'+(i<=todayGlasses?' filled':'')+'" onclick="setWater('+i+')"></div>';
  }
  html+='</div>';
  html+='<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">';
  html+='<button class="btn primary" onclick="setWater('+(todayGlasses+1)+')">+ Add glass</button>';
  html+='<button class="btn" onclick="setWater(0)">Reset</button>';
  html+='</div>';
  html+='</div>';

  html+='<div class="chart-box" style="margin-bottom:16px"><h3>Last 14 days</h3><canvas class="chart-canvas" id="waterChartFull"></canvas></div>';

  html+='<div class="table-wrap"><div class="table-head"><h3>Recent history</h3></div><div class="table-scroll"><table><thead><tr><th>Date</th><th class="num">Glasses</th><th class="num">Goal</th><th>Progress</th></tr></thead><tbody>';
  for(var i=days.length-1;i>=0;i--){
    var d=days[i];
    var e=p.water.find(function(w){return w.date===d});
    if(!e)continue;
    var pct=e.goal>0?Math.min(100,e.glasses/e.goal*100):0;
    html+='<tr><td>'+fmtDate(d)+(d===today()?' <span class="badge active">Today</span>':'')+'</td><td class="num">'+e.glasses+'</td><td class="num">'+e.goal+'</td>';
    html+='<td><div style="height:6px;background:var(--panel3);border-radius:3px;overflow:hidden;max-width:120px"><div style="height:100%;width:'+pct+'%;background:var(--g1)"></div></div></td></tr>';
  }
  html+='</tbody></table></div></div>';
  return html;
}

function after_water(){
  var p=getActiveProfile();
  if(!p)return;
  var days=lastNDays(14);
  var c=$('waterChartFull');
  if(c){
    var data=days.map(function(d){
      var w=p.water.find(function(x){return x.date===d});
      return {x:d.slice(5),y:w?w.glasses:0};
    });
    drawBarChart(c,data,{color:'#3b82f6'});

function setWater(n){
  var p=getActiveProfile();
  n=clamp(n,0,20);
  var e=p.water.find(function(w){return w.date===today()});
  if(!e){
    e={id:uid('water'),date:today(),glasses:n,goal:8,notes:''};
    p.water.push(e);
  }else{
    e.glasses=n;
  }
  saveState();renderPage();
  if(n>=8)toast('✓ Hydration goal reached','success');
}

  p._habitChecks[today()][id]=!p._habitChecks[today()][id];
  saveState();renderPage();
}

function render_appointments(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var list=p.appointments.slice().sort(function(a,b){
    if(a.status!==b.status)return a.status==='upcoming'?-1:1;
    return a.date.localeCompare(b.date);
  });
  var upcoming=list.filter(function(a){return a.status==='upcoming'});

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">📅 Appointments</div>';
  html+='<div class="page-desc">'+upcoming.length+' upcoming · '+list.length+' total</div></div>';
  html+='<button class="btn primary" onclick="editAppointment(null)">➕ New Appointment</button>';
  html+='</div>';

  if(!list.length){
    html+='<div class="empty"><span class="icon">📅</span><h4>No appointments</h4></div>';
    return html;
  }

  html+='<div class="board-grid">';
  list.forEach(function(a){
    var d=daysBetween(today(),a.date);
    var whenCls=a.status!=='upcoming'?'neutral':d<0?'critical':d===0?'urgent':d<=3?'attention':'info';
    var whenLabel=a.status!=='upcoming'?'Completed':d<0?Math.abs(d)+'d overdue':d===0?'Today':d===1?'Tomorrow':'in '+d+' days';
    html+='<div class="board-card '+(whenCls==='critical'||whenCls==='urgent'?'heart':whenCls==='attention'?'warm':'calm')+'" onclick="editAppointment(\''+a.id+'\')">';
    html+='<div class="bc-head">';
    html+='<div style="flex:1">';
    html+='<div class="bc-title">'+esc(a.title)+'</div>';
    html+='<div class="bc-meta"><span>📅 '+fmtDate(a.date)+'</span><span>·</span><span>🕐 '+esc(a.time||'')+'</span></div>';
    html+='</div>';
    html+='<span class="badge '+whenCls+'">'+whenLabel+'</span>';
    html+='</div>';
    if(a.doctor)html+='<div style="font-size:.72rem;color:var(--tx2);margin-top:6px">👨‍⚕️ '+esc(a.doctor)+(a.specialty?' · '+esc(a.specialty):'')+'</div>';
    if(a.location)html+='<div style="font-size:.68rem;color:var(--tx3);margin-top:3px">📍 '+esc(a.location)+'</div>';
    if(a.reason)html+='<div class="bc-desc">📋 '+esc(a.reason)+'</div>';
    if(a.notes)html+='<div style="font-size:.68rem;color:var(--tx3);margin-top:6px">📝 '+esc(a.notes)+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

/* ================================================================
   CYCLE
   ================================================================ */
function render_cycle(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var list=p.menstrual.slice().sort(function(a,b){return (b.startDate||'').localeCompare(a.startDate||'')});

  // Calculate average cycle length
  var avgLen=28;
  if(list.length>=2){
    var lengths=[];
    for(var i=0;i<list.length-1;i++){
      var diff=daysBetween(list[i+1].startDate,list[i].startDate);
      if(diff>15&&diff<60)lengths.push(diff);
    }
    if(lengths.length)avgLen=Math.round(lengths.reduce(function(a,b){return a+b},0)/lengths.length);
  }
  var lastPeriod=list[0];
  var daysSince=lastPeriod?daysBetween(lastPeriod.startDate,today()):0;
  var nextPeriodIn=lastPeriod?avgLen-daysSince:null;

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">🌸 Cycle Tracking</div>';
  html+='<div class="page-desc">'+list.length+' recorded cycles · avg '+avgLen+' days</div></div>';
  html+='<button class="btn primary" onclick="editCycle(null)">➕ Log Period</button>';
  html+='</div>';

  html+='<div class="kpi-grid">';
  html+='<div class="kpi heart"><div class="kpi-label">Last period</div><div class="kpi-value" style="font-size:1.1rem">'+(lastPeriod?fmtDateShort(lastPeriod.startDate):'—')+'</div><div class="kpi-hint">'+(lastPeriod?daysSince+' days ago':'Not recorded')+'</div></div>';
  html+='<div class="kpi purple"><div class="kpi-label">Avg cycle length</div><div class="kpi-value">'+avgLen+'<span class="kpi-unit">days</span></div></div>';
  html+='<div class="kpi calm"><div class="kpi-label">Next expected</div><div class="kpi-value" style="font-size:1.1rem">'+(nextPeriodIn!==null&&lastPeriod?fmtDateShort(addDays(lastPeriod.startDate,avgLen)):'—')+'</div><div class="kpi-hint">'+(nextPeriodIn!==null?(nextPeriodIn>0?'in '+nextPeriodIn+' days':nextPeriodIn===0?'Today':Math.abs(nextPeriodIn)+' days late'):'')+'</div></div>';
  html+='</div>';

  if(!list.length){
    html+='<div class="empty"><span class="icon">🌸</span><h4>No period data</h4></div>';
    return html;
  }

  html+='<div class="table-wrap"><div class="table-head"><h3>Recent cycles</h3></div><div class="table-scroll"><table>';
  html+='<thead><tr><th>Start date</th><th>End date</th><th class="num">Duration</th><th>Flow</th><th>Symptoms</th><th></th></tr></thead><tbody>';
  list.forEach(function(m){
    var dur=m.endDate?daysBetween(m.startDate,m.endDate)+1:'—';
    html+='<tr>';
    html+='<td>'+fmtDate(m.startDate)+'</td>';
    html+='<td>'+(m.endDate?fmtDate(m.endDate):'—')+'</td>';
    html+='<td class="num">'+dur+'</td>';
    html+='<td><span class="badge '+(m.flow==='heavy'?'urgent':m.flow==='medium'?'attention':'safe')+'">'+esc(m.flow||'—')+'</span></td>';
    html+='<td style="font-size:.7rem;color:var(--tx3)">'+esc((m.symptoms||[]).join(', ')||'—')+'</td>';
    html+='<td class="actions"><button class="btn ghost xs" onclick="editCycle(\''+m.id+'\')">✏️</button><button class="btn ghost xs" onclick="deleteCycle(\''+m.id+'\')" style="color:var(--c2)">🗑</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

  var p=getActiveProfile();

function render_pregnancy(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var preg=p.pregnancy||[];

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">🤰 Pregnancy</div>';
  html+='<div class="page-desc">Prenatal tracking</div></div>';
  html+='<button class="btn primary" onclick="editPregnancy(null)">➕ Add Pregnancy</button>';
  html+='</div>';

  if(!preg.length){
    html+='<div class="empty"><span class="icon">🤰</span><h4>No pregnancy record</h4><p>Track pregnancy progress week by week.</p></div>';
    return html;
  }

  preg.forEach(function(pg){
    var weeks=0;
    if(pg.lmp){
      var days=daysBetween(pg.lmp,today());
      weeks=Math.floor(days/7);
    }
    var dueDate=pg.dueDate||(pg.lmp?addDays(pg.lmp,280):'');
    var daysToDue=dueDate?daysBetween(today(),dueDate):null;
    html+='<div class="card card-heart" style="margin-bottom:14px">';
    html+='<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:10px">';
    html+='<div>';
    html+='<div style="font-weight:700;font-size:.95rem">'+(pg.active?'Active pregnancy':'Past pregnancy')+'</div>';
    html+='<div style="font-size:.72rem;color:var(--tx2);margin-top:4px">LMP: '+fmtDate(pg.lmp)+' · Due: '+(dueDate?fmtDate(dueDate):'—')+'</div>';
    html+='</div>';
    html+='<div style="display:flex;gap:6px"><button class="btn ghost sm" onclick="editPregnancy(\''+pg.id+'\')">✏️</button><button class="btn ghost sm" onclick="deletePregnancy(\''+pg.id+'\')" style="color:var(--c2)">🗑</button></div>';
    html+='</div>';
    if(pg.active&&weeks){
      html+='<div style="margin-top:14px">';
      html+='<div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--tx3);margin-bottom:6px"><span>Week '+weeks+'</span><span>'+(40-weeks)+' weeks to go</span></div>';
      html+='<div style="height:10px;background:var(--panel3);border-radius:5px;overflow:hidden">';
      html+='<div style="height:100%;width:'+Math.min(100,weeks/40*100)+'%;background:var(--gHeart)"></div>';
      html+='</div>';
      if(daysToDue!==null){
        html+='<div style="text-align:center;font-size:.78rem;color:var(--tx2);margin-top:10px">'+(daysToDue>0?daysToDue+' days until due date':daysToDue===0?'🎉 Due today!':Math.abs(daysToDue)+' days past due')+'</div>';
      }
      html+='</div>';
    }
    if(pg.notes)html+='<div style="font-size:.72rem;color:var(--tx2);margin-top:10px;font-style:italic">'+esc(pg.notes)+'</div>';
    html+='</div>';
  });
  return html;
}

function editContact(id){
  var p=getActiveProfile();
  if(!p.emergencyContacts)p.emergencyContacts=[];
  var c=id?p.emergencyContacts.find(function(x){return x.id===id}):
    {name:'',relation:'',phone:'',email:'',primary:false};
  if(id&&!c)return;
  var body='<div class="form">';
  body+='<div class="form-row">';
  body+='<div class="field"><label>Name <span class="req">*</span></label><input type="text" id="ecName" value="'+esc(c.name)+'"></div>';
  body+='<div class="field"><label>Relationship</label><input type="text" id="ecRel" value="'+esc(c.relation||'')+'" placeholder="e.g. Spouse, Doctor"></div>';
  body+='</div>';
  body+='<div class="form-row">';
  body+='<div class="field"><label>Phone</label><input type="tel" id="ecPhone" value="'+esc(c.phone||'')+'"></div>';
  body+='<div class="field"><label>Email</label><input type="email" id="ecEmail" value="'+esc(c.email||'')+'"></div>';
  body+='</div>';
  body+='<div class="field"><label><input type="checkbox" id="ecPrimary" '+(c.primary?'checked':'')+'> Mark as primary emergency contact</label></div>';
  body+='</div>';
  openModal({
    title:id?'Edit Contact':'Add Contact',
    body:body,
    foot:(id?'<button class="btn danger" onclick="deleteContact(\''+id+'\')">Delete</button>':'')+
         '<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="saveEc">Save</button>',
    onOpen:function(){
      $('ecName').focus();
      $('saveEc').onclick=function(){
        var name=$('ecName').value.trim();
        if(!name){toast('Name required','error');return}
        var data={name:name,relation:$('ecRel').value.trim(),phone:$('ecPhone').value.trim(),email:$('ecEmail').value.trim(),primary:$('ecPrimary').checked};
        // Ensure only one primary
        if(data.primary){
          p.emergencyContacts.forEach(function(x){x.primary=false});
        }
        if(id)Object.assign(c,data);
        else{data.id=uid('ec');p.emergencyContacts.push(data)}
        saveState();closeModal();renderPage();
        toast('Saved','success');
      };
    }
  });
}
function deleteContact(id){
  var p=getActiveProfile();
  p.emergencyContacts=p.emergencyContacts.filter(function(x){return x.id!==id});
  saveState();closeModal();renderPage();
  toast('Deleted','info');
}

var ReportRange=90;

function render_reports(){
  var p=getActiveProfile();
  if(!p)return '<div class="empty">No profile</div>';
  var days=lastNDays(ReportRange);

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">📈 Health Reports</div>';
  html+='<div class="page-desc">Trends and summaries</div></div>';
  html+='<div class="chips">';
  [30,90,180,365].forEach(function(n){
    html+='<span class="chip'+(ReportRange===n?' active':'')+'" onclick="ReportRange='+n+';renderPage()">'+(n===365?'1y':n+'d')+'</span>';
  });
  html+='</div></div>';

  // Summary KPIs
  var vitalsIn=p.vitals.filter(function(v){return v.date>=days[0]});
  var moodsIn=p.moods.filter(function(m){return m.date>=days[0]});
  var sleepIn=p.sleep.filter(function(s){return s.date>=days[0]});
  var exerciseIn=p.exercise.filter(function(e){return e.date>=days[0]});
  var foodIn=p.food.filter(function(f){return f.date>=days[0]});

  var avgSys=vitalsIn.filter(function(v){return v.systolic}).length?Math.round(vitalsIn.filter(function(v){return v.systolic}).reduce(function(s,v){return s+v.systolic},0)/vitalsIn.filter(function(v){return v.systolic}).length):0;
  var avgDia=vitalsIn.filter(function(v){return v.diastolic}).length?Math.round(vitalsIn.filter(function(v){return v.diastolic}).reduce(function(s,v){return s+v.diastolic},0)/vitalsIn.filter(function(v){return v.diastolic}).length):0;
  var avgHr=vitalsIn.filter(function(v){return v.heartRate}).length?Math.round(vitalsIn.filter(function(v){return v.heartRate}).reduce(function(s,v){return s+v.heartRate},0)/vitalsIn.filter(function(v){return v.heartRate}).length):0;
  var avgMood=moodsIn.length?(moodsIn.reduce(function(s,m){return s+m.score},0)/moodsIn.length).toFixed(1):0;
  var avgSleep=sleepIn.length?(sleepIn.reduce(function(s,x){return s+x.totalHours},0)/sleepIn.length).toFixed(1):0;
  var totalEx=exerciseIn.reduce(function(s,e){return s+e.duration},0);
  var totalCal=foodIn.reduce(function(s,f){return s+(f.calories||0)},0);
  var avgCal=foodIn.length?Math.round(totalCal/ReportRange):0;

  html+='<div class="kpi-grid">';
  html+='<div class="kpi heart"><div class="kpi-label">Avg BP</div><div class="kpi-value">'+avgSys+'/'+avgDia+'</div></div>';
  html+='<div class="kpi calm"><div class="kpi-label">Avg HR</div><div class="kpi-value">'+avgHr+'<span class="kpi-unit">bpm</span></div></div>';
  html+='<div class="kpi purple"><div class="kpi-label">Avg mood</div><div class="kpi-value">'+avgMood+'<span class="kpi-unit">/8</span></div></div>';
  html+='<div class="kpi safe"><div class="kpi-label">Avg sleep</div><div class="kpi-value">'+avgSleep+'<span class="kpi-unit">h</span></div></div>';
  html+='<div class="kpi warm"><div class="kpi-label">Exercise total</div><div class="kpi-value">'+totalEx+'<span class="kpi-unit">min</span></div></div>';
  html+='<div class="kpi"><div class="kpi-label">Avg calories</div><div class="kpi-value">'+avgCal+'<span class="kpi-unit">/day</span></div></div>';
  html+='</div>';

  // Charts
  html+='<div class="grid-2" style="margin-bottom:16px">';
  html+='<div class="chart-box"><h3>Blood pressure trend</h3><canvas class="chart-canvas" id="repBPChart"></canvas></div>';
  html+='<div class="chart-box"><h3>Weight trend</h3><canvas class="chart-canvas" id="repWeightChart"></canvas></div>';
  html+='</div>';
  html+='<div class="grid-2" style="margin-bottom:16px">';
  html+='<div class="chart-box"><h3>Mood & sleep</h3><canvas class="chart-canvas" id="repMoodSleepChart"></canvas></div>';
  html+='<div class="chart-box"><h3>Exercise minutes</h3><canvas class="chart-canvas" id="repExerciseChart"></canvas></div>';
  html+='</div>';

  // Symptom frequency
  var symptomsIn=p.symptoms.filter(function(s){return s.date>=days[0]});
  var symFreq={};
  symptomsIn.forEach(function(s){(s.symptoms||[]).forEach(function(x){symFreq[x]=(symFreq[x]||0)+1})});
  var topSym=Object.keys(symFreq).sort(function(a,b){return symFreq[b]-symFreq[a]}).slice(0,10);

  if(topSym.length){
    html+='<div class="card pad-lg" style="margin-bottom:16px">';
    html+='<h3 style="font-size:.9rem;margin-bottom:12px">Most frequent symptoms</h3>';
    topSym.forEach(function(sym){
      var pct=symFreq[sym]/symptomsIn.length*100;
      html+='<div style="margin-bottom:8px">';
      html+='<div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:3px"><span>'+esc(sym)+'</span><span class="mono">'+symFreq[sym]+' occurrences</span></div>';
      html+='<div style="height:5px;background:var(--panel3);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--g2)"></div></div>';
      html+='</div>';
    });
    html+='</div>';
  }

  // Medication adherence estimate
  html+='<div class="card pad-lg" style="margin-bottom:16px">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px">Active medications</h3>';
  var activeMeds=p.medications.filter(function(m){return m.active});
  if(activeMeds.length){
    activeMeds.forEach(function(m){
      html+='<div class="stat-line"><div><div style="font-size:.78rem;font-weight:600">'+esc(m.name)+'</div><div style="font-size:.66rem;color:var(--tx3);margin-top:2px">'+esc(m.dose||'')+' · '+(m.frequency||'').replace('_',' ')+'</div></div>';
      if(m.pillsLeft!=null){
        var pct=Math.min(100,m.pillsLeft/90*100);
        html+='<div style="font-size:.68rem;color:'+(m.pillsLeft<7?'var(--err)':'var(--tx3)')+'">'+m.pillsLeft+' pills left</div>';
      }
      html+='</div>';
    });
  }else{
    html+='<div style="font-size:.75rem;color:var(--tx3);text-align:center;padding:14px">No active medications</div>';
  }
  html+='</div>';

  // Data completeness
  html+='<div class="card pad-lg">';
  html+='<h3 style="font-size:.9rem;margin-bottom:12px">📊 Data completeness</h3>';
  var completeness=[
    {label:'Vitals',count:vitalsIn.length,total:ReportRange},
    {label:'Mood',count:moodsIn.length,total:ReportRange},
    {label:'Sleep',count:sleepIn.length,total:ReportRange},
    {label:'Exercise',count:exerciseIn.length,total:ReportRange},
    {label:'Food',count:new Set(foodIn.map(function(f){return f.date})).size,total:ReportRange}
  ];
  completeness.forEach(function(c){
    var pct=Math.round(c.count/c.total*100);
    html+='<div style="margin-bottom:10px">';
    html+='<div style="display:flex;justify-content:space-between;font-size:.74rem;margin-bottom:3px"><span>'+esc(c.label)+'</span><span class="mono">'+pct+'% ('+c.count+'/'+c.total+' days)</span></div>';
    html+='<div style="height:6px;background:var(--panel3);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>=70?'var(--g5)':pct>=40?'var(--g4)':'var(--g2)')+'"></div></div>';
    html+='</div>';
  });
  html+='</div>';

  return html;
}

function after_reports(){
  var p=getActiveProfile();
  if(!p)return;
  var days=lastNDays(ReportRange);
  var c1=$('repBPChart');
  if(c1){
    var sys=days.map(function(d){var v=p.vitals.find(function(x){return x.date===d&&x.systolic});return {x:d.slice(5),y:v?v.systolic:null}});
    var dia=days.map(function(d){var v=p.vitals.find(function(x){return x.date===d&&x.systolic});return {x:d.slice(5),y:v?v.diastolic:null}});
    drawLineChart(c1,[{data:sys,color:'#f43f5e'},{data:dia,color:'#3b82f6'}],{fill:false});
  }
  var c2=$('repWeightChart');
  if(c2){
    var w=days.map(function(d){var v=p.vitals.find(function(x){return x.date===d&&x.weight});return {x:d.slice(5),y:v?v.weight:null}});
    drawLineChart(c2,[{data:w,color:'#8b5cf6'}]);
  }
  var c3=$('repMoodSleepChart');
  if(c3){
    var mo=days.map(function(d){var m=p.moods.find(function(x){return x.date===d});return {x:d.slice(5),y:m?m.score:null}});
    var sl=days.map(function(d){var s=p.sleep.find(function(x){return x.date===d});return {x:d.slice(5),y:s?s.totalHours:null}});
    drawLineChart(c3,[{data:mo,color:'#8b5cf6'},{data:sl,color:'#14b8a6'}],{fill:false});
  }
  var c4=$('repExerciseChart');
  if(c4){
    var ex=days.map(function(d){var m=p.exercise.filter(function(x){return x.date===d}).reduce(function(s,x){return s+x.duration},0);return {x:d.slice(5),y:m}});
    drawBarChart(c4,ex,{color:'#10b981'});
  }
}

  if(!p)return;
  p.name=$('setName').value.trim()||p.name;
  p.avatar=$('setAvatar').value||'🙂';
  p.dob=$('setDob').value;
  p.sex=$('setSex').value;
  p.bloodType=$('setBlood').value;
  p.height=safeFloat($('setHeight').value,0);
  p.weight=safeFloat($('setWeight').value,0);
  State.settings.autoSave=$('setAutoSave').checked;
  saveState();
  updateProfileBadges();
  renderPage();
  toast('Profile saved','success');
}

function removeProfile(id){
  if(State.profiles.length<=1){toast('Cannot remove last profile','error');return}
  var p=State.profiles.find(function(x){return x.id===id});
  if(!p)return;
  confirmDialog('Delete Profile','Delete profile "'+p.name+'" and ALL their health records? This cannot be undone.',function(){
    State.profiles=State.profiles.filter(function(x){return x.id!==id});
    if(State.activeProfileId===id)State.activeProfileId=State.profiles[0].id;
    saveState();
    updateProfileBadges();
    renderNav();renderPage();
    toast('Profile deleted','info');
  },true);
}

function exportData(){
  var json=JSON.stringify(State,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='vitaos-backup-'+today()+'.json';
  a.click();
  State.settings.lastBackup=nowISO();
  saveState();
  toast('Backup downloaded ('+(json.length/1024).toFixed(1)+' KB)','success');
}

function importData(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json,.txt,.vita';
  input.onchange=function(){
    var file=input.files[0];
    if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      var txt=r.result;
      if(txt.indexOf('VITAOS-ENCRYPTED:')===0){
        var pass=prompt('Encrypted backup. Enter passphrase:');
        if(!pass)return;
        Crypto.decrypt(txt.substring('VITAOS-ENCRYPTED:'.length),pass).then(function(dec){
          applyImport(JSON.parse(dec));
        }).catch(function(){toast('Decryption failed','error')});
      }else{
        try{applyImport(JSON.parse(txt))}catch(e){toast('Invalid backup file','error')}
      }
    };
    r.readAsText(file);
  };
  input.click();
}

function applyImport(data){
  if(!data.profiles||!Array.isArray(data.profiles)){toast('Not a VITAOS backup','error');return}
  confirmDialog('Import Backup','This will REPLACE all current data with the backup. Continue?',function(){
    State.profiles=data.profiles;
    State.activeProfileId=data.activeProfileId||data.profiles[0].id;
    if(data.settings)Object.assign(State.settings,data.settings);
    saveState();
    updateProfileBadges();
    renderNav();renderPage();
    toast('Backup restored','success');
  },true);
}

function exportEncrypted(){
  var pass=prompt('Create a passphrase (min 6 chars) for encryption:');
  if(!pass)return;
  if(pass.length<6){toast('Passphrase too short','error');return}
  Crypto.encrypt(JSON.stringify(State),pass).then(function(enc){
    var blob=new Blob(['VITAOS-ENCRYPTED:'+enc],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='vitaos-encrypted-'+today()+'.vita';
    a.click();
    State.settings.lastBackup=nowISO();
    saveState();
    toast('Encrypted backup downloaded','success');
  }).catch(function(e){toast('Encryption failed: '+e.message,'error')});
}

function resetAll(){
  confirmDialog('Erase All Data','This will permanently delete ALL profiles and health records. This cannot be undone. Continue?',function(){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  },true);
}
