<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#04101c">
<title>AURORA — Weather & Climate Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#04101c;--bg2:#08182a;--bg3:#0c2038;--bg4:#102848;
  --panel:#061524;--panel2:#0a1c30;--panel3:#102640;--panel4:#183054;
  --bd:#14304e;--bd2:#1e4470;--bd3:#2a5c94;
  --tx:#e0f0ff;--tx2:#a0c0e0;--tx3:#6088b0;--mu:#3a5878;
  --c1:#40d0ff;--c1h:#80e4ff;--c1l:#20a0d0;
  --c2:#40ffa0;--c2h:#80ffc0;--c2l:#20c070;
  --c3:#ffd040;--c3h:#ffe890;--c3l:#c09000;
  --c4:#ff6080;--c4h:#ff90a8;--c4l:#c02050;
  --c5:#b060ff;--c5h:#d0a0ff;--c5l:#7030c0;
  --c6:#ff9040;--c6h:#ffb080;--c6l:#c04800;
  --c7:#40d0d0;--c7h:#80e8e8;--c7l:#20a0a0;
  --ok:#40ffa0;--warn:#ffd040;--err:#ff6080;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40d0ff,#40ffa0);
  --g2:linear-gradient(135deg,#ffd040,#ff9040);
  --g3:linear-gradient(135deg,#ff6080,#b060ff);
  --gAur:linear-gradient(120deg,#40d0ff,#40ffa0,#ffd040,#ff6080,#b060ff,#40d0ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.6);
  --sh2:0 16px 48px rgba(0,0,0,.85);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="daylight"]{--bg:#f0f4fa;--bg2:#e0e8f4;--bg3:#d0dcec;--panel:#fff;--panel2:#f5f8fc;--panel3:#e8eef8;
  --bd:#c8d4e8;--bd2:#a8b8d4;--tx:#0a1028;--tx2:#3a4870;--tx3:#6878a0;--mu:#a0a8c0;
  --c1:#0080c0;--c2:#009050;--c3:#b07000;--c4:#c02040;--c5:#6030a0;
  --g1:linear-gradient(135deg,#0080c0,#009050)}
[data-theme="sunset"]{--bg:#1a0820;--bg2:#281028;--bg3:#3a1834;--panel:#281028;--panel2:#3a1834;
  --bd:#5c2044;--bd2:#80305c;--tx:#ffe0f0;--tx2:#ffb0d0;--tx3:#d080a8;
  --c1:#ff6080;--c2:#ffa040;--c3:#ffe040;--c4:#c060ff;
  --g1:linear-gradient(135deg,#ff6080,#ffa040)}
[data-theme="storm"]{--bg:#0a0a10;--bg2:#141420;--bg3:#1c1c30;--panel:#141420;--panel2:#1c1c30;
  --bd:#282840;--bd2:#3c3c58;--tx:#d0d0e0;--tx2:#9090a8;--tx3:#585870;
  --c1:#8090ff;--c2:#80ffc0;--c3:#ffd080;--c4:#ff6080;
  --g1:linear-gradient(135deg,#8090ff,#80ffc0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#04101c;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3rem;font-weight:900;letter-spacing:12px;
  background:var(--gAur);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px;
  filter:drop-shadow(0 0 30px rgba(64,208,255,.5))}
.boot-sub{font-size:.7rem;color:#40d0ff;letter-spacing:10px;margin-bottom:36px;opacity:.7}
.boot-bar{width:320px;max-width:80vw;height:3px;background:#102640;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 16px #40d0ff}
.boot-pct{font-size:.7rem;color:#40d0ff;margin-bottom:20px}
.boot-log{font-size:.62rem;color:#6088b0;text-align:left;width:min(400px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ffa0}.boot-log .warn{color:#ffd040}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:1rem;
  background:var(--gAur);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.7rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#04101c;box-shadow:0 0 14px rgba(64,208,255,.35)}
.tb-tab .tab-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#04101c;border-color:transparent}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:250px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#canvasArea{flex:1;position:relative;background:#020810;overflow:hidden;min-width:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(6,21,36,.85);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 12px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:260px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right}
#rightPanel{width:280px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}

/* ============ STATUS BAR ============ */
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:16px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#04101c;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.62rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.72rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,208,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font-size:.7rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#04101c;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(64,208,255,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--c4);border-color:var(--c4)}
.btn.danger:hover{background:rgba(255,96,128,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.65rem}
.btn.active{background:var(--g1);color:#04101c;border-color:transparent}
.toggle{position:relative;width:36px;height:20px;background:var(--panel4);border-radius:var(--rf);cursor:pointer;transition:var(--t2);flex-shrink:0;display:inline-block}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--t2)}
.toggle.on::after{left:18px}

/* ============ LIST ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:7px 10px;border-radius:var(--rxs);cursor:pointer;font-size:.7rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(64,208,255,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:8px}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.6rem;color:var(--tx3)}

/* ============ CARDS / GRIDS ============ */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{font-size:.75rem;font-weight:700;margin-bottom:8px;color:var(--tx);display:flex;justify-content:space-between;align-items:center}
.card .sub{font-size:.68rem;color:var(--tx3);line-height:1.6}
.kv{font-family:var(--mono);font-size:.7rem;line-height:1.8}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}
.kv .v{color:var(--c1)}
.grid{display:grid;gap:10px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rs);padding:10px;text-align:center}
.stat .sv{font-size:1.3rem;font-weight:800;font-family:var(--mono);color:var(--c1);line-height:1.1}
.stat .sl{font-size:.55rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:700}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:720px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:940px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1)}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.72rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c2)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

.text-mono{font-family:var(--mono)}
.text-xs{font-size:.65rem}.text-sm{font-size:.72rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}
.empty{text-align:center;padding:60px 20px;color:var(--tx3);font-size:.72rem;font-family:var(--mono)}
.empty .e-icon{font-size:3rem;opacity:.3;margin-bottom:14px}
.flex-between{display:flex;justify-content:space-between;align-items:center}

/* ============ TIMELINE SCRUBBER ============ */
#timeline{height:38px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
#timeline input[type=range]{-webkit-appearance:none;flex:1;height:6px;background:linear-gradient(to right,#40d0ff,#40ffa0,#ffd040,#ff6080);border-radius:3px;outline:none;cursor:pointer}
#timeline input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#fff;border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1);border:2px solid var(--c1)}
#timeline .tl-label{font-family:var(--mono);font-size:.68rem;color:var(--c1);font-weight:700;min-width:80px}
#timeline .tl-hours{font-family:var(--mono);font-size:.62rem;color:var(--tx3);min-width:60px;text-align:right}

@media(max-width:900px){#leftPanel{width:200px}#rightPanel{width:220px}}
@media(max-width:640px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">AURORA</div>
  <div class="boot-sub">WEATHER & CLIMATE STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('wind')">AURORA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="toggleSim()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetSim()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left panel">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right panel">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="canvasArea">
      <canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay">
        <div class="co-badge" id="coBadge">Ready</div>
        <div class="co-badge stats" id="coStats"></div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="panel-head"><span class="panel-title">Info</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleRightPanel()">⇥</button></div>
      <div class="panel-body" id="rpBody"></div>
    </div>
  </div>

  <div id="timeline">
    <span class="tl-label" id="tlDay">DAY 1</span>
    <input type="range" id="tlRange" min="0" max="100" value="50">
    <span class="tl-hours" id="tlHours">12:00</span>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Grid</span><span class="sb-val" id="sbGrid">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Wind</span><span class="sb-val c2" id="sbWind">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Temp</span><span class="sb-val c3" id="sbTemp">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Mode</span><span class="sb-val" id="sbMode">Wind</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Time</span><span class="sb-val" id="sbTime">--:--</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILS
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ================================================================
   FLUID SOLVER (Stam's "Stable Fluids" simplified)
   Grid is 200x100 covering a fictional world map
   ================================================================ */
function FluidSolver(W,H){
  this.W=W;this.H=H;
  var n=W*H;
  this.u=new Float32Array(n);     // x velocity
  this.v=new Float32Array(n);     // y velocity
  this.u0=new Float32Array(n);
  this.v0=new Float32Array(n);
  this.temp=new Float32Array(n);  // temperature anomaly
  this.temp0=new Float32Array(n);
  this.humid=new Float32Array(n); // humidity
  this.humid0=new Float32Array(n);
  this.pres=new Float32Array(n);  // pressure field
  this.div=new Float32Array(n);
  this.age=0;
}

FluidSolver.prototype.IX=function(x,y){
  if(x<0)x=0;if(x>=this.W)x=this.W-1;
  if(y<0)y=0;if(y>=this.H)y=this.H-1;
  return x+y*this.W;
};

FluidSolver.prototype.setBnd=function(f){
  var W=this.W,H=this.H;
  for(var i=0;i<W;i++){
    f[i]=f[i+W];
    f[(H-1)*W+i]=f[(H-2)*W+i];
  }
  for(var j=0;j<H;j++){
    f[j*W]=f[j*W+1];
    f[j*W+W-1]=f[j*W+W-2];
  }
};

FluidSolver.prototype.advect=function(dst,src,u,v,dt){
  var W=this.W,H=this.H;
  var dtx=dt*(W-2);
  var dty=dt*(H-2);
  for(var j=1;j<H-1;j++){
    for(var i=1;i<W-1;i++){
      var idx=i+j*W;
      var x=i-dtx*u[idx];
      var y=j-dty*v[idx];
      if(x<0.5)x=0.5;
      if(x>W-1.5)x=W-1.5;
      if(y<0.5)y=0.5;
      if(y>H-1.5)y=H-1.5;
      var i0=Math.floor(x),i1=i0+1;
      var j0=Math.floor(y),j1=j0+1;
      var s1=x-i0,s0=1-s1;
      var t1=y-j0,t0=1-t1;
      dst[idx]=s0*(t0*src[i0+j0*W]+t1*src[i0+j1*W])+s1*(t0*src[i1+j0*W]+t1*src[i1+j1*W]);
    }
  }
  this.setBnd(dst);
};

FluidSolver.prototype.project=function(){
  var W=this.W,H=this.H;
  var u=this.u,v=this.v,p=this.pres,div=this.div;
  var h=1.0/Math.max(W,H);
  for(var j=1;j<H-1;j++){
    for(var i=1;i<W-1;i++){
      var idx=i+j*W;
      div[idx]=-0.5*h*(u[idx+1]-u[idx-1]+v[idx+W]-v[idx-W]);
      p[idx]=0;
    }
  }
  this.setBnd(div);this.setBnd(p);
  for(var k=0;k<25;k++){
    for(var j2=1;j2<H-1;j2++){
      for(var i2=1;i2<W-1;i2++){
        var idx2=i2+j2*W;
        p[idx2]=(div[idx2]+p[idx2-1]+p[idx2+1]+p[idx2-W]+p[idx2+W])/4;
      }
    }
    this.setBnd(p);
  }
  for(var j3=1;j3<H-1;j3++){
    for(var i3=1;i3<W-1;i3++){
      var idx3=i3+j3*W;
      u[idx3]-=0.5*(p[idx3+1]-p[idx3-1])/h;
      v[idx3]-=0.5*(p[idx3+W]-p[idx3-W])/h;
    }
  }
  this.setBnd(u);this.setBnd(v);
};

FluidSolver.prototype.step=function(dt,opts){
  opts=opts||{};
  var W=this.W,H=this.H;
  // Advect velocity
  this.advect(this.u0,this.u,this.u,this.v,dt);
  this.advect(this.v0,this.v,this.u,this.v,dt);
  var tu=this.u;this.u=this.u0;this.u0=tu;
  var tv=this.v;this.v=this.v0;this.v0=tv;
  // Advect temperature
  this.advect(this.temp0,this.temp,this.u,this.v,dt);
  var tt=this.temp;this.temp=this.temp0;this.temp0=tt;
  // Advect humidity
  this.advect(this.humid0,this.humid,this.u,this.v,dt);
  var th=this.humid;this.humid=this.humid0;this.humid0=th;
  // Apply Coriolis (deflection by lat)
  if(opts.coriolis!==false){
    var f=opts.coriolisStrength||0.04;
    for(var j=0;j<H;j++){
      var lat=(j/(H-1))*2-1;
      var cor=f*lat;
      for(var i=0;i<W;i++){
        var idx=i+j*W;
        var du=-cor*this.v[idx];
        var dv=cor*this.u[idx];
        this.u[idx]+=du*dt*60;
        this.v[idx]+=dv*dt*60;
      }
    }
  }
  // Solar heating — day/night based on longitude
  if(opts.solar!==false){
    var sunLon=(opts.sunPhase||0)*W;
    for(var j4=0;j4<H;j4++){
      var lat2=(j4/(H-1))*2-1;
      var latCool=1-Math.abs(lat2)*0.7;
      for(var i4=0;i4<W;i4++){
        var idx4=i4+j4*W;
        var lonDelta=(i4-sunLon)/W*Math.PI;
        var solar=Math.cos(lonDelta)*latCool;
        this.temp[idx4]+=solar*0.15*dt*60;
      }
    }
  }
  // Damping / relaxation toward equilibrium
  var relax=opts.relax!=null?opts.relax:0.003;
  for(var k=0;k<W*H;k++){
    this.temp[k]*=(1-relax);
    this.humid[k]*=(1-relax*0.7);
    this.u[k]*=(1-relax*0.5);
    this.v[k]*=(1-relax*0.5);
  }
  // Project to divergence-free
  this.project();
  // Compute pressure from velocity (Bernoulli-like)
  for(var k2=0;k2<W*H;k2++){
    var speed2=this.u[k2]*this.u[k2]+this.v[k2]*this.v[k2];
    this.pres[k2]=1013-speed2*8+this.temp[k2]*2;
  }
  this.age+=dt;
};

FluidSolver.prototype.addForce=function(cx,cy,fx,fy,radius){
  var W=this.W,H=this.H;
  radius=radius||4;
  for(var j=-radius;j<=radius;j++){
    for(var i=-radius;i<=radius;i++){
      var x=cx+i,y=cy+j;
      if(x<0||x>=W||y<0||y>=H)continue;
      var d2=i*i+j*j;
      if(d2>radius*radius)continue;
      var fall=1-d2/(radius*radius);
      var idx=y*W+x;
      this.u[idx]+=fx*fall;
      this.v[idx]+=fy*fall;
    }
  }
};

FluidSolver.prototype.addHeat=function(cx,cy,amount,radius){
  var W=this.W,H=this.H;
  radius=radius||6;
  for(var j=-radius;j<=radius;j++){
    for(var i=-radius;i<=radius;i++){
      var x=cx+i,y=cy+j;
      if(x<0||x>=W||y<0||y>=H)continue;
      var d2=i*i+j*j;
      if(d2>radius*radius)continue;
      var fall=1-d2/(radius*radius);
      var idx=y*W+x;
      this.temp[idx]+=amount*fall;
    }
  }
};

FluidSolver.prototype.addHumidity=function(cx,cy,amount,radius){
  var W=this.W,H=this.H;
  radius=radius||8;
  for(var j=-radius;j<=radius;j++){
    for(var i=-radius;i<=radius;i++){
      var x=cx+i,y=cy+j;
      if(x<0||x>=W||y<0||y>=H)continue;
      var d2=i*i+j*j;
      if(d2>radius*radius)continue;
      var fall=1-d2/(radius*radius);
      var idx=y*W+x;
      this.humid[idx]+=amount*fall;
    }
  }
};

/* ================================================================
   MARCHING SQUARES (for isobars and coastlines)
   ================================================================ */
function marchingSquares(field,W,H,threshold){
  var contours=[];
  var val=function(i,j){
    if(i<0)i=0;if(i>=W)i=W-1;
    if(j<0)j=0;if(j>=H)j=H-1;
    return field[j*W+i];
  };
  var interp=function(x1,y1,v1,x2,y2,v2){
    var t=(threshold-v1)/(v2-v1);
    return [x1+t*(x2-x1),y1+t*(y2-y1)];
  };
  for(var j=0;j<H-1;j++){
    for(var i=0;i<W-1;i++){
      var tl=val(i,j),tr=val(i+1,j),br=val(i+1,j+1),bl=val(i,j+1);
      var idx=0;
      if(tl>threshold)idx|=8;
      if(tr>threshold)idx|=4;
      if(br>threshold)idx|=2;
      if(bl>threshold)idx|=1;
      if(idx===0||idx===15)continue;
      var eTop=function(){return interp(i,j,tl,i+1,j,tr)};
      var eRight=function(){return interp(i+1,j,tr,i+1,j+1,br)};
      var eBottom=function(){return interp(i,j+1,bl,i+1,j+1,br)};
      var eLeft=function(){return interp(i,j,tl,i,j+1,bl)};
      var segs=[];
      switch(idx){
        case 1: case 14: segs.push([eLeft(),eBottom()]);break;
        case 2: case 13: segs.push([eBottom(),eRight()]);break;
        case 3: case 12: segs.push([eLeft(),eRight()]);break;
        case 4: case 11: segs.push([eTop(),eRight()]);break;
        case 6: case 9: segs.push([eTop(),eBottom()]);break;
        case 7: case 8: segs.push([eLeft(),eTop()]);break;
        case 5:
          segs.push([eLeft(),eTop()]);
          segs.push([eBottom(),eRight()]);
          break;
        case 10:
          segs.push([eTop(),eRight()]);
          segs.push([eLeft(),eBottom()]);
          break;
      }
      segs.forEach(function(s){contours.push(s)});
    }
  }
  return contours;
}

/* ================================================================
   ASTRONOMY (Sun position, twilight, moon phase)
   ================================================================ */
var ASTRO={
  D2R:Math.PI/180,R2D:180/Math.PI,
  sunPosition:function(date){
    var d=date.getTime()/86400000+2440587.5-2451545;
    var M=(357.5291+0.98560028*d)%360;
    var C=1.9148*Math.sin(M*this.D2R)+0.0200*Math.sin(2*M*this.D2R)+0.0003*Math.sin(3*M*this.D2R);
    var L=(M+C+180+102.9372)%360;
    var e=23.4393-0.00000036*d;
    var ra=Math.atan2(Math.cos(e*this.D2R)*Math.sin(L*this.D2R),Math.cos(L*this.D2R))*this.R2D/15;
    var dec=Math.asin(Math.sin(e*this.D2R)*Math.sin(L*this.D2R))*this.R2D;
    return {ra:(ra+24)%24,dec:dec,L:L};
  },
  equationOfTime:function(date){
    var d=Math.floor((date.getTime()/86400000)+2440587.5-2451545);
    var g=(357.529+0.98560028*(d-0.5))%360;
    var q=(280.459+0.98564736*(d-0.5))%360;
    var L=(q+1.915*Math.sin(g*this.D2R)+0.020*Math.sin(2*g*this.D2R))%360;
    var e=23.439-0.00000036*(d-0.5);
    var RA=(Math.atan2(Math.cos(e*this.D2R)*Math.sin(L*this.D2R),Math.cos(L*this.D2R))*this.R2D/15)%24;
    var eqt=(q/15-RA);
    if(eqt>12)eqt-=24;
    if(eqt<-12)eqt+=24;
    return eqt;
  },
  sunriseSunset:function(date,lat,lon){
    var eqt=this.equationOfTime(date);
    var sun=this.sunPosition(date);
    var dec=sun.dec;
    var cosH=(Math.sin(-0.833*this.D2R)-Math.sin(lat*this.D2R)*Math.sin(dec*this.D2R))/(Math.cos(lat*this.D2R)*Math.cos(dec*this.D2R));
    if(cosH>1)return {polar:'night'};
    if(cosH<-1)return {polar:'day'};
    var H=Math.acos(cosH)*this.R2D/15;
    var noon=12-eqt-lon/15;
    var rise=(noon-H+24)%24;
    var set=(noon+H)%24;
    return {rise:rise,set:set,noon:noon,dayLen:H*2};
  },
  moonPhase:function(date){
    var d=(date.getTime()/86400000+2440587.5-2451550.1);
    var phase=(d/29.530588853)%1;
    if(phase<0)phase+=1;
    return phase;
  },
  moonIllumination:function(phase){return (1-Math.cos(phase*Math.PI*2))/2},
  solarNoonElevation:function(date,lat){
    var sun=this.sunPosition(date);
    return 90-Math.abs(lat-sun.dec);
  },
  twilight:function(date,lat,lon){
    var sun=this.sunPosition(date);
    var eqt=this.equationOfTime(date);
    var lst=(date.getUTCHours()+date.getUTCMinutes()/60+lon/15+eqt);
    lst=(lst%24+24)%24;
    var H=(lst-sun.ra)*15;
    var sinAlt=Math.sin(lat*this.D2R)*Math.sin(sun.dec*this.D2R)+Math.cos(lat*this.D2R)*Math.cos(sun.dec*this.D2R)*Math.cos(H*this.D2R);
    var alt=Math.asin(sinAlt)*this.R2D;
    var phase='night';
    if(alt>0)phase='day';
    else if(alt>-6)phase='civil';
    else if(alt>-12)phase='nautical';
    else if(alt>-18)phase='astronomical';
    return {altitude:alt,phase:phase};
  }
};

/* ================================================================
   GLOBAL STATE
   ================================================================ */
var SIM={
  fluid:null,
  W:200,H:100,
  running:true,
  mode:'wind',
  time:12,          // 0-24 hours
  day:1,
  sunPhase:0.5,
  coriolis:0.04,
  solar:true,
  showParticles:true,
  showGrid:false,
  showIsobars:true,
  showVectors:false,
  temperature:15,   // global base temp °C
  co2:420,          // ppm
  chaos:false,
  storms:[],
  particles:[],
  particleCount:6000,
  particleSpeed:1.0,
  frame:0,
  paused:false
};

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1,imageData:null};

function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onCanvasMouse);
  CANV.canvas.addEventListener('mousemove',onCanvasMove);
  CANV.canvas.addEventListener('mouseup',onCanvasUp);
  CANV.canvas.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      var r=CANV.canvas.getBoundingClientRect();
      onCanvasMouse({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,button:0});
    }
    e.preventDefault();
  },{passive:false});
  CANV.canvas.addEventListener('touchmove',function(e){
    if(e.touches.length===1){
      var r=CANV.canvas.getBoundingClientRect();
      onCanvasMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});
    }
    e.preventDefault();
  },{passive:false});
  CANV.canvas.addEventListener('touchend',function(e){onCanvasUp();e.preventDefault()},{passive:false});
  initParticles();
}

function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;
  CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
  CANV.imageData=CANV.ctx.createImageData(SIM.W,SIM.H);
}

function initParticles(){
  SIM.particles=[];
  for(var i=0;i<SIM.particleCount;i++){
    SIM.particles.push({
      x:Math.random()*SIM.W,
      y:Math.random()*SIM.H,
      age:rnd(0,200),
      maxAge:rnd(80,300)
    });
  }
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastTime=performance.now();
var fpsAccum=0,fpsFrames=0,fpsDisplay=60;

function mainLoop(now){
  var dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){fpsDisplay=fpsFrames/fpsAccum;fpsAccum=0;fpsFrames=0;$('sbFps').textContent=Math.round(fpsDisplay);}
  if(!SIM.paused){
    updateSim(dt);
  }
  render(dt);
  SIM.frame++;
  requestAnimationFrame(mainLoop);
}

function updateSim(dt){
  if(!SIM.fluid)return;
  // Advance time of day
  SIM.time+=dt*0.3;
  if(SIM.time>=24){SIM.time-=24;SIM.day++;}
  SIM.sunPhase=(SIM.time-6)/24;
  // Advance fluid
  var steps=1;
  for(var s=0;s<steps;s++){
    SIM.fluid.step(dt*0.35,{
      coriolis:true,
      coriolisStrength:SIM.coriolis,
      solar:SIM.solar,
      sunPhase:SIM.sunPhase,
      relax:0.004
    });
  }
  // Age particles + advect
  var W=SIM.fluid.W,H=SIM.fluid.H;
  for(var i=0;i<SIM.particles.length;i++){
    var p=SIM.particles[i];
    p.age++;
    if(p.age>p.maxAge){
      p.x=Math.random()*W;p.y=Math.random()*H;p.age=0;
    }
    var xi=clamp(Math.floor(p.x),0,W-1);
    var yi=clamp(Math.floor(p.y),0,H-1);
    var idx=yi*W+xi;
    var vx=SIM.fluid.u[idx];
    var vy=SIM.fluid.v[idx];
    p.x+=vx*dt*SIM.particleSpeed*30;
    p.y+=vy*dt*SIM.particleSpeed*30;
    if(p.x<0)p.x+=W;if(p.x>=W)p.x-=W;
    if(p.y<0)p.y+=H;if(p.y>=H)p.y-=H;
  }
  // Advance storms
  for(var s2=SIM.storms.length-1;s2>=0;s2--){
    var storm=SIM.storms[s2];
    storm.life-=dt;
    storm.x+=storm.vx*dt;
    storm.y+=storm.vy*dt;
    storm.intensity=clamp(storm.intensity+dt*0.05,0,1);
    if(storm.x<-20||storm.x>W+20||storm.y<0||storm.y>H||storm.life<=0){
      SIM.storms.splice(s2,1);
      continue;
    }
    // Add rotational flow around storm
    var R=8+storm.intensity*8;
    for(var j=-R;j<=R;j++){
      for(var ii=-R;ii<=R;ii++){
        var x=Math.floor(storm.x+ii),y=Math.floor(storm.y+j);
        if(x<0||x>=W||y<0||y>=H)continue;
        var d2=ii*ii+j*j;
        if(d2>R*R)continue;
        var fall=1-Math.sqrt(d2)/R;
        var idx2=y*W+x;
        var rot=storm.rotDir;
        var fx=-j/R*fall*storm.intensity*10*rot;
        var fy=ii/R*fall*storm.intensity*10*rot;
        SIM.fluid.u[idx2]+=fx*dt;
        SIM.fluid.v[idx2]+=fy*dt;
        // Add heat/humidity
        SIM.fluid.humid[idx2]+=fall*0.02*dt;
      }
    }
  }
}

/* ================================================================
   RENDER
   ================================================================ */
function render(dt){
  if(!SIM.fluid)return;
  var ctx=CANV.ctx;
  var cw=CANV.W,ch=CANV.H;
  if(SIM.mode==='wind')renderWind(ctx,cw,ch,dt);
  else if(SIM.mode==='radar')renderRadar(ctx,cw,ch,dt);
  else if(SIM.mode==='temp')renderTemp(ctx,cw,ch,dt);
  else if(SIM.mode==='pressure')renderPressure(ctx,cw,ch,dt);
  else if(SIM.mode==='storm')renderStorm(ctx,cw,ch,dt);
  else if(SIM.mode==='climate')renderClimate(ctx,cw,ch,dt);
  else if(SIM.mode==='almanac')renderAlmanac(ctx,cw,ch,dt);
  else if(SIM.mode==='data')renderData(ctx,cw,ch,dt);
  else if(SIM.mode==='about')renderAboutCanvas(ctx,cw,ch,dt);
}

function worldToScreen(wx,wy){
  return {x:wx/SIM.W*CANV.W,y:wy/SIM.H*CANV.H};
}

function drawCoastline(ctx,color,alpha){
  ctx.save();
  ctx.strokeStyle=color;
  ctx.globalAlpha=alpha||0.6;
  ctx.lineWidth=1;
  // Simplified landmass outlines in world coordinates
  var lands=[
    // North America
    [[20,30],[35,20],[55,25],[60,40],[50,55],[35,55],[20,45],[20,30]],
    // South America
    [[45,55],[60,55],[65,70],[55,90],[45,90],[40,75],[45,55]],
    // Europe
    [[95,28],[110,25],[118,35],[115,50],[105,55],[95,50],[95,28]],
    // Africa
    [[100,55],[118,55],[125,75],[120,88],[105,90],[95,80],[95,55]],
    // Asia
    [[115,25],[155,20],[170,35],[165,60],[140,70],[120,60],[115,25]],
    // Australia
    [[150,72],[170,72],[175,85],[155,88],[148,80],[150,72]]
  ];
  lands.forEach(function(poly){
    ctx.beginPath();
    for(var i=0;i<poly.length;i++){
      var p=worldToScreen(poly[i][0],poly[i][1]);
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  });
  ctx.restore();
}

function colorTemp(t,minT,maxT,alpha){
  var p=clamp((t-minT)/(maxT-minT),0,1);
  // Blue → cyan → yellow → orange → red → magenta
  var r,g,b;
  if(p<0.2){var s=p/0.2;r=lerp(20,40,s);g=lerp(30,180,s);b=lerp(180,255,s);}
  else if(p<0.4){var s2=(p-0.2)/0.2;r=lerp(40,120,s2);g=lerp(180,220,s2);b=lerp(255,120,s2);}
  else if(p<0.6){var s3=(p-0.4)/0.2;r=lerp(120,255,s3);g=lerp(220,210,s3);b=lerp(120,40,s3);}
  else if(p<0.8){var s4=(p-0.6)/0.2;r=lerp(255,255,s4);g=lerp(210,90,s4);b=lerp(40,30,s4);}
  else{var s5=(p-0.8)/0.2;r=lerp(255,255,s5);g=lerp(90,20,s5);b=lerp(30,120,s5);}
  return [Math.round(r),Math.round(g),Math.round(b),alpha||255];
}

function buildImageData(colorFn){
  var data=CANV.imageData.data;
  var W=SIM.W,H=SIM.H;
  for(var j=0;j<H;j++){
    for(var i=0;i<W;i++){
      var idx=(j*W+i)*4;
      var rgba=colorFn(i,j);
      data[idx]=rgba[0];
      data[idx+1]=rgba[1];
      data[idx+2]=rgba[2];
      data[idx+3]=rgba[3]!=null?rgba[3]:255;
    }
  }
}

function blitImageData(ctx,cw,ch){
  var tmp=document.createElement('canvas');
  tmp.width=SIM.W;tmp.height=SIM.H;
  tmp.getContext('2d').putImageData(CANV.imageData,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(tmp,0,0,cw,ch);
}

   MODE: WIND
   ================================================================ */
function renderWind(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  // Temperature background
  buildImageData(function(i,j){
    var t=SIM.fluid.temp[j*SIM.W+i]*30+15;
    var hue=clamp((t+30)/80,0,1);
    return colorTemp(t,-20,50,40);
  });
  blitImageData(ctx,cw,ch);
  drawCoastline(ctx,'rgba(80,200,255,0.15)',0.3);
  // Draw particles
  if(SIM.showParticles){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<SIM.particles.length;i++){
      var p=SIM.particles[i];
      var s=worldToScreen(p.x,p.y);
      var speed=Math.hypot(SIM.fluid.u[Math.floor(p.y)*SIM.W+Math.floor(p.x)],SIM.fluid.v[Math.floor(p.y)*SIM.W+Math.floor(p.x)]);
      var a=clamp(speed*5,0.1,0.85);
      var life=1-p.age/p.maxAge;
      ctx.fillStyle='rgba(100,220,255,'+(a*life*0.7)+')';
      ctx.fillRect(s.x,s.y,1.5,1.5);
    }
    ctx.restore();
  }
  // Vector field
  if(SIM.showVectors){
    ctx.strokeStyle='rgba(64,208,255,0.3)';
    ctx.lineWidth=0.8;
    var step=8;
    for(var j=0;j<SIM.H;j+=step){
      for(var i=0;i<SIM.W;i+=step){
        var idx=j*SIM.W+i;
        var u=SIM.fluid.u[idx],v=SIM.fluid.v[idx];
        var s1=worldToScreen(i,j);
        var s2=worldToScreen(i+u*8,j+v*8);
        ctx.beginPath();ctx.moveTo(s1.x,s1.y);ctx.lineTo(s2.x,s2.y);ctx.stroke();
      }
    }
  }
  // Grid
  if(SIM.showGrid){
    ctx.strokeStyle='rgba(64,208,255,0.1)';
    ctx.lineWidth=0.5;
    for(var gi=0;gi<=SIM.W;gi+=10){
      var p=worldToScreen(gi,0);
      ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,ch);ctx.stroke();
    }
    for(var gj=0;gj<=SIM.H;gj+=10){
      var p2=worldToScreen(0,gj);
      ctx.beginPath();ctx.moveTo(0,p2.y);ctx.lineTo(cw,p2.y);ctx.stroke();
    }
  }
  updateStats();
}

var RADAR={sweep:0};
function renderRadar(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  buildImageData(function(i,j){
    var hum=SIM.fluid.humid[j*SIM.W+i];
    var p=clamp(hum*8,0,1);
    if(p<0.05)return [0,0,0,50];
    var r,g,b;
    if(p<0.3){r=0;g=lerp(80,200,p/0.3);b=lerp(80,60,p/0.3);}
    else if(p<0.6){var s=(p-0.3)/0.3;r=lerp(0,180,s);g=lerp(200,220,s);b=lerp(60,0,s);}
    else{var s2=(p-0.6)/0.4;r=lerp(180,255,s2);g=lerp(220,60,s2);b=lerp(0,40,s2);}
    return [Math.round(r),Math.round(g),Math.round(b),Math.round(100+p*155)];
  });
  blitImageData(ctx,cw,ch);
  drawCoastline(ctx,'rgba(64,208,255,0.35)',0.5);
  // Radar sweep line
  RADAR.sweep=(RADAR.sweep+dt*60)%360;
  var cx=cw/2,cy=ch/2;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(RADAR.sweep*Math.PI/180);
  var grad=ctx.createLinearGradient(0,0,ch*0.7,0);
  grad.addColorStop(0,'rgba(64,255,160,0)');
  grad.addColorStop(1,'rgba(64,255,160,0.3)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,ch*0.7,-0.3,0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // Storm cells
  SIM.storms.forEach(function(storm){
    var s=worldToScreen(storm.x,storm.y);
    var radius=(30+storm.intensity*60)*CANV.W/SIM.W;
    var grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,radius);
    grad.addColorStop(0,'rgba(255,96,128,'+(storm.intensity*0.5)+')');
    grad.addColorStop(0.5,'rgba(255,208,64,'+(storm.intensity*0.3)+')');
    grad.addColorStop(1,'rgba(64,255,160,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(s.x,s.y,radius,0,Math.PI*2);ctx.fill();
  });
  updateStats();
}

function renderPressure(ctx,cw,ch,dt){
  ctx.fillStyle='#04101c';

  buildImageData(function(i,j){
    var p=SIM.fluid.pres[j*SIM.W+i];
    var base=p*0.002;
    return [Math.round(base*200),Math.round(base*180),Math.round(base*120),255];
  });
  blitImageData(ctx,cw,ch);
  // Isobars — draw at multiple levels
  if(SIM.showIsobars){
    var pressures=[1.6,1.8,2.0,2.2,2.4,2.6];
    pressures.forEach(function(level){
      var isobarValue=(level-1.8)*0.8;
      var contours=marchingSquares(SIM.fluid.pres,SIM.W,SIM.H,isobarValue*100+1013);
      ctx.strokeStyle='rgba(255,255,255,0.35)';
      ctx.lineWidth=1.2;
      contours.forEach(function(seg){
        var p1=worldToScreen(seg[0][0],seg[0][1]);
        var p2=worldToScreen(seg[1][0],seg[1][1]);
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      });
    });
  }
  drawCoastline(ctx,'rgba(64,208,255,0.4)',0.6);
  // Draw H/L markers at pressure extremes
  var minP=Infinity,maxP=-Infinity;
  var minIdx=0,maxIdx=0;
  for(var k=0;k<SIM.W*SIM.H;k++){
    if(SIM.fluid.pres[k]<minP){minP=SIM.fluid.pres[k];minIdx=k;}
    if(SIM.fluid.pres[k]>maxP){maxP=SIM.fluid.pres[k];maxIdx=k;}
  }
  var lows={x:minIdx%SIM.W,y:Math.floor(minIdx/SIM.W)};
  var highs={x:maxIdx%SIM.W,y:Math.floor(maxIdx/SIM.W)};
  var spL=worldToScreen(lows.x,lows.y);
  var spH=worldToScreen(highs.x,highs.y);
  ctx.fillStyle='#ff6080';
  ctx.font='bold 24px monospace';
  ctx.textAlign='center';
  ctx.fillText('L',spL.x,spL.y+8);
  ctx.fillStyle='#40d0ff';
  ctx.fillText('H',spH.x,spH.y+8);
  updateStats();
}

   MODE: STORM
   ================================================================ */
function renderStorm(ctx,cw,ch,dt){
  ctx.fillStyle='#000208';
  ctx.fillRect(0,0,cw,ch);
  buildImageData(function(i,j){
    var u=SIM.fluid.u[j*SIM.W+i],v=SIM.fluid.v[j*SIM.W+i];
    var speed=Math.hypot(u,v);
    var p=clamp(speed*3,0,1);
    return [Math.round(p*40),Math.round(p*160),Math.round(p*255),255];
  });
  blitImageData(ctx,cw,ch);
  drawCoastline(ctx,'rgba(64,208,255,0.25)',0.4);
  // Draw storms with detailed structure
  SIM.storms.forEach(function(storm){
    var s=worldToScreen(storm.x,storm.y);
    var baseR=(40+storm.intensity*80)*CANV.W/SIM.W;
    // Eye wall
    var grad=ctx.createRadialGradient(s.x,s.y,baseR*0.1,s.x,s.y,baseR);
    grad.addColorStop(0,'rgba(255,255,255,0.9)');
    grad.addColorStop(0.2,'rgba(64,208,255,0.5)');
    grad.addColorStop(0.5,'rgba(255,96,128,0.4)');
    grad.addColorStop(1,'rgba(255,208,64,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(s.x,s.y,baseR,0,Math.PI*2);ctx.fill();
    // Spiral bands
    ctx.strokeStyle='rgba(255,255,255,'+storm.intensity*0.4+')';
    ctx.lineWidth=2;
    for(var b=0;b<5;b++){
      ctx.beginPath();
      for(var a=0;a<Math.PI*4;a+=0.1){
        var r=baseR*0.15+a/(Math.PI*4)*baseR*0.85;
        var ang=a+b*Math.PI*0.4+SIM.frame*0.02*storm.rotDir;
        var px=s.x+Math.cos(ang)*r;
        var py=s.y+Math.sin(ang)*r;
        if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    // Label
    ctx.fillStyle='#fff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText(storm.name,s.x+baseR+4,s.y);
  });
  updateStats();
}

function spawnStorm(cx,cy){
  if(cx==null){cx=SIM.W*0.75;cy=SIM.H*0.5;}
  var names=['ALPHA','BRAVO','CHARLIE','DELTA','ECHO','FOXTROT','GOLF','HOTEL'];
  var storm={
    x:cx,y:cy,
    vx:(Math.random()<0.5?-1:1)*rndF(0.3,0.8),

    life:60,
    name:pick(names)+'-'+rnd(1,20),
    rotDir:Math.random()<0.5?1:-1
  };
  SIM.storms.push(storm);
  toast('Storm spawned: '+storm.name,'warn');
}

var CLIMATE={
  year:2024,
  co2:420,
  tempAnomaly:1.1,
  seaLevel:0,
  arcticIce:100,
  emHistory:[],
  preIndustrialCO2:280
};

function renderClimate(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  // Draw global temperature warming map
  buildImageData(function(i,j){
    // Latitude matters more; poles warm more
    var lat=(j/SIM.H)*2-1;
    var polarAmp=1+Math.abs(lat)*2;
    var anomaly=CLIMATE.tempAnomaly*polarAmp;
    var baseT=30-Math.abs(lat)*50+CLIMATE.tempAnomaly*10;
    var t=baseT+anomaly*5;
    return colorTemp(t,-40,60,255);
  });
  blitImageData(ctx,cw,ch);
  drawCoastline(ctx,'rgba(255,255,255,0.3)',0.5);
  // Draw warming chart overlay in bottom
  var chartH=Math.floor(ch*0.35);
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(0,ch-chartH,cw,chartH);
  ctx.strokeStyle='rgba(64,208,255,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(40,ch-chartH+10);ctx.lineTo(40,ch-10);
  ctx.moveTo(40,ch-10);ctx.lineTo(cw-10,ch-10);
  ctx.stroke();
  // CO2 curve
  ctx.strokeStyle='#ffd040';
  ctx.lineWidth=2;
  ctx.beginPath();
  var startYear=1850,endYear=2100;
  for(var i2=0;i2<250;i2++){
    var yr=lerp(startYear,endYear,i2/249);
    var co2=280;
    if(yr>1850)co2=280+(yr-1850)*2.5+(yr-1950>0?(yr-1950)*(yr-1950)*0.002:0);
    if(yr>2024)co2=CLIMATE.co2+(yr-2024)*2.5;
    var x=lerp(40,cw-10,(yr-startYear)/(endYear-startYear));
    var y=ch-10-(co2-280)/600*(chartH-20);
    if(i2===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // Temperature curve
  ctx.strokeStyle='#ff6080';
  ctx.beginPath();
  for(var i3=0;i3<250;i3++){
    var yr2=lerp(startYear,endYear,i3/249);
    var tempAnom=0;
    if(yr2>1850)tempAnom=(yr2-1850)*0.008+(yr2-1950>0?(yr2-1950)*(yr2-1950)*0.0001:0);
    if(yr2>2024)tempAnom=CLIMATE.tempAnomaly+(yr2-2024)*0.03;
    var x2=lerp(40,cw-10,(yr2-startYear)/(endYear-startYear));
    var y2=ch-10-tempAnom/6*(chartH-20);
    if(i3===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);
  }
  ctx.stroke();
  // Labels
  ctx.fillStyle='#ffd040';
  ctx.font='11px monospace';
  ctx.textAlign='left';
  ctx.fillText('CO₂ (ppm)',50,ch-chartH+20);
  ctx.fillStyle='#ff6080';
  ctx.fillText('ΔT (°C)',50,ch-chartH+35);
  ctx.fillStyle='#a0c0e0';
  ctx.font='10px monospace';
  ctx.fillText('1850',40,ch-2);
  ctx.fillText('2100',cw-30,ch-2);
  updateStats();
}

function renderAlmanac(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  // Compute sun/moon
  var now=new Date();
  now.setHours(Math.floor(SIM.time),Math.floor((SIM.time%1)*60),0,0);
  var sun=ASTRO.sunPosition(now);
  var rise=ASTRO.sunriseSunset(now,ALMANAC.lat,ALMANAC.lon);
  var moonPhase=ASTRO.moonPhase(now);
  var moonIllum=ASTRO.moonIllumination(moonPhase);
  var twilight=ASTRO.twilight(now,ALMANAC.lat,ALMANAC.lon);
  var noonElev=ASTRO.solarNoonElevation(now,ALMANAC.lat);
  // Draw sun position
  var sunScreen=worldToScreen(((sun.ra/24)*SIM.W+SIM.W)%SIM.W,(90-sun.dec)/180*SIM.H);
  // Background: sky gradient based on twilight
  var skyColors={
    'day':['#4090ff','#a0d0ff'],
    'civil':['#d06030','#ffb080'],
    'nautical':['#401060','#c05080'],
    'astronomical':['#080818','#201840'],
    'night':['#020810','#0a1428']
  };
  var sc=skyColors[twilight.phase]||skyColors.night;
  var grad=ctx.createLinearGradient(0,0,0,ch);
  grad.addColorStop(0,sc[0]);grad.addColorStop(1,sc[1]);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,cw,ch);
  // Stars if night
  if(twilight.altitude<-6){
    ctx.fillStyle='rgba(255,255,255,0.6)';
    for(var i=0;i<150;i++){
      var sx=(i*137.5)%cw;
      var sy=(i*73.7)%(ch*0.7);
      var size=(i%4)===0?1.5:1;
      var alpha=0.3+((i*7)%10)/10*0.5;
      ctx.globalAlpha=alpha;
      ctx.fillRect(sx,sy,size,size);
    }
    ctx.globalAlpha=1;
  }
  // Sun
  if(twilight.altitude>-18){
    var sunX=cw/2;
    var sunY=ch*0.4-twilight.altitude*ch*0.005;
    var sunGrad=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,120);
    sunGrad.addColorStop(0,'rgba(255,240,180,1)');
    sunGrad.addColorStop(0.3,'rgba(255,208,64,0.6)');
    sunGrad.addColorStop(1,'rgba(255,150,64,0)');
    ctx.fillStyle=sunGrad;
    ctx.beginPath();ctx.arc(sunX,sunY,120,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sunX,sunY,20,0,Math.PI*2);ctx.fill();
  }
  // Moon
  var moonX=cw*0.75;
  var moonY=ch*0.25;
  ctx.save();
  ctx.translate(moonX,moonY);
  ctx.fillStyle='rgba(220,220,240,0.9)';
  ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();
  // Shadow for phase
  ctx.fillStyle=sc[0];
  ctx.globalAlpha=0.9;
  ctx.beginPath();
  var phaseAngle=moonPhase*Math.PI*2;
  ctx.arc(0,0,25,-Math.PI/2+phaseAngle/2,Math.PI/2+phaseAngle/2,false);
  ctx.ellipse(0,0,25*Math.abs(Math.cos(phaseAngle)),25,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
  // Data panel
  var panelW=Math.min(400,cw*0.5);
  ctx.fillStyle='rgba(6,21,36,0.85)';
  ctx.fillRect(20,20,panelW,ch-40);
  ctx.strokeStyle='rgba(64,208,255,0.3)';
  ctx.lineWidth=1;
  ctx.strokeRect(20,20,panelW,ch-40);
  ctx.fillStyle='#40d0ff';
  ctx.font='bold 14px monospace';
  ctx.textAlign='left';
  ctx.fillText('☀ ALMANAC — '+ALMANAC.city,35,45);
  ctx.font='11px monospace';
  ctx.fillStyle='#a0c0e0';
  var lines=[
    ['Latitude','',ALMANAC.lat.toFixed(4)+'°'],
    ['Longitude','',ALMANAC.lon.toFixed(4)+'°'],
    ['','',''],
    ['Sunrise',(rise.rise!=null?formatHour(rise.rise):rise.polar||'—')],
    ['Sunset',(rise.set!=null?formatHour(rise.set):rise.polar||'—')],
    ['Day length',rise.dayLen!=null?fmt(rise.dayLen,2)+'h':(rise.polar||'—')],
    ['Sun altitude',fmt(twilight.altitude,1)+'°'],
    ['Twilight phase',twilight.phase.toUpperCase()],
    ['Solar noon elevation',fmt(noonElev,1)+'°'],
    ['','',''],
    ['Moon phase',fmt(moonPhase*100,0)+'%'],
    ['Moon illumination',fmt(moonIllum*100,0)+'%'],
    ['Phase name',moonPhaseName(moonPhase)],
    ['','',''],
    ['Local time',formatHour(SIM.time)],
    ['UTC',new Date().toISOString().slice(11,19)]
  ];
  lines.forEach(function(line,i){
    if(!line[0]&&!line[2])return;
    var y=70+i*20;
    if(line.length===3){
      ctx.fillStyle='#6088b0';
      ctx.fillText(line[0],35,y);
      ctx.fillStyle='#40d0ff';
      ctx.fillText(line[2],panelW-20,y);
    } else {
      ctx.fillStyle='#6088b0';
      ctx.fillText(line[0],35,y);
      ctx.fillStyle='#40d0ff';
      ctx.fillText(line[1],panelW-20,y);
    }
  });
  updateStats();
}

function formatHour(h){
  var hh=Math.floor(h)%24;
  var mm=Math.floor((h-Math.floor(h))*60);
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

function moonPhaseName(p){
  if(p<0.03||p>0.97)return 'New Moon';
  if(p<0.22)return 'Waxing Crescent';
  if(p<0.28)return 'First Quarter';
  if(p<0.47)return 'Waxing Gibbous';
  if(p<0.53)return 'Full Moon';
  if(p<0.72)return 'Waning Gibbous';
  if(p<0.78)return 'Last Quarter';
  return 'Waning Crescent';
}

   MODE: DATA (historical climate charts)
   ================================================================ */
var CLIMATE_DATA={
  temperature:[],
  co2:[],
  seaLevel:[],
  ice:[],
  years:[]
};
function buildClimateData(){
  CLIMATE_DATA.years=[];
  CLIMATE_DATA.temperature=[];
  CLIMATE_DATA.co2=[];
  CLIMATE_DATA.seaLevel=[];
  CLIMATE_DATA.ice=[];
  for(var y=1880;y<=2024;y++){
    CLIMATE_DATA.years.push(y);
    var t=(y-1880)*0.009+Math.sin((y-1880)*0.3)*0.15+rndF(-0.08,0.08);
    if(y>1950)t+=(y-1950)*0.008;
    CLIMATE_DATA.temperature.push(t);
    var c=280+(y-1880)*0.4;
    if(y>1950)c+=(y-1950)*2.5;
    CLIMATE_DATA.co2.push(c);
    CLIMATE_DATA.seaLevel.push((y-1880)*0.03+(y>1990?(y-1990)*0.05:0));
    CLIMATE_DATA.ice.push(100-(y-1880)*0.15);
  }
}

function renderData(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  if(!CLIMATE_DATA.years.length)buildClimateData();
  var pad=60;
  var chartW=cw-pad*2;
  var chartH=(ch-pad*2)/3-20;
  // Chart 1: Temperature anomaly
  drawChart(ctx,pad,pad+20,chartW,chartH,CLIMATE_DATA.years,CLIMATE_DATA.temperature,'Temperature Anomaly (°C)','#ff6080');
  // Chart 2: CO2
  drawChart(ctx,pad,pad+chartH+40+20,chartW,chartH,CLIMATE_DATA.years,CLIMATE_DATA.co2,'Atmospheric CO₂ (ppm)','#ffd040');
  // Chart 3: Sea level
  drawChart(ctx,pad,pad+(chartH+40)*2+20,chartW,chartH,CLIMATE_DATA.years,CLIMATE_DATA.seaLevel,'Sea Level Rise (cm)','#40d0ff');
  updateStats();
}

function drawChart(ctx,x,y,w,h,xs,ys,title,color){
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(64,208,255,0.3)';
  ctx.lineWidth=1;
  ctx.strokeRect(x,y,w,h);
  var minY=Math.min.apply(null,ys);
  var maxY=Math.max.apply(null,ys);
  var pad=0.1*(maxY-minY);
  minY-=pad;maxY+=pad;
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<xs.length;i++){
    var px=x+(xs[i]-xs[0])/(xs[xs.length-1]-xs[0])*w;
    var py=y+h-(ys[i]-minY)/(maxY-minY)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
  // Gradient fill
  ctx.lineTo(x+w,y+h);
  ctx.lineTo(x,y+h);
  ctx.closePath();
  var grad=ctx.createLinearGradient(0,y,0,y+h);
  grad.addColorStop(0,color.replace('rgb','rgba').replace(')',',0.3)').replace('#','rgba(').length<15?'rgba(255,255,255,0.2)':color+'55');
  ctx.fillStyle=color+'44';
  ctx.fill();
  // Title
  ctx.fillStyle='#a0c0e0';
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.fillText(title,x+8,y+18);
  // Y axis labels
  ctx.font='10px monospace';
  ctx.fillStyle='#6088b0';
  ctx.textAlign='right';
  ctx.fillText(fmt(maxY,1),x-5,y+12);
  ctx.fillText(fmt(minY,1),x-5,y+h);
  // X axis labels
  ctx.textAlign='center';
  ctx.fillText(xs[0],x,y+h+15);
  ctx.fillText(xs[xs.length-1],x+w,y+h+15);
}

function renderAboutCanvas(ctx,cw,ch,dt){
  ctx.fillStyle='#020810';
  ctx.fillRect(0,0,cw,ch);
  // Animated aurora effect
  var time=SIM.frame*0.01;
  for(var i=0;i<3;i++){
    var grad=ctx.createLinearGradient(0,0,cw,ch);
    var offset=Math.sin(time+i*2)*0.3+0.5;
    grad.addColorStop(0,'rgba(64,208,255,0)');
    grad.addColorStop(offset-0.2,'rgba(64,255,160,0.15)');
    grad.addColorStop(offset,'rgba(64,208,255,0.3)');
    grad.addColorStop(offset+0.2,'rgba(176,96,255,0.15)');
    grad.addColorStop(1,'rgba(64,208,255,0)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,cw,ch);
  }
  // Center text
  ctx.fillStyle='#fff';
  ctx.textAlign='center';
  ctx.font='bold 42px monospace';
  ctx.fillText('AURORA',cw/2,ch/2-40);
  ctx.font='14px monospace';
  ctx.fillStyle='#40d0ff';
  ctx.fillText('WEATHER & CLIMATE SIMULATION STUDIO',cw/2,ch/2);

   ================================================================ */
function updateStats(){
  var fluid=SIM.fluid;
  if(!fluid)return;
  // Grid info
  $('sbGrid').textContent=SIM.W+'×'+SIM.H;
  // Wind speed
  var maxSpeed=0,sumSpeed=0,count=0;
  for(var k=0;k<SIM.W*SIM.H;k+=7){
    var s=Math.hypot(fluid.u[k],fluid.v[k]);
    if(s>maxSpeed)maxSpeed=s;
    sumSpeed+=s;count++;
  }
  var avgSpeed=sumSpeed/Math.max(1,count);
  $('sbWind').textContent=fmt(avgSpeed*60,1)+' m/s';
  $('sbTemp').textContent=fmt(SIM.temperature+avgSpeed*2,1)+'°C';
  $('sbTime').textContent=formatHour(SIM.time);
  // Overlay badges
  $('coBadge').innerHTML='<span style="font-size:1rem">'+modeIcon(SIM.mode)+'</span> '+modeLabel(SIM.mode);
  var stats='';
  stats+='<div>Wind: '+fmt(avgSpeed*60,1)+' m/s</div>';
  stats+='<div>Max: '+fmt(maxSpeed*60,1)+' m/s</div>';
  stats+='<div>Day '+SIM.day+' · '+formatHour(SIM.time)+'</div>';
  stats+='<div>Storms: '+SIM.storms.length+'</div>';
  $('coStats').innerHTML=stats;
  $('sbMode').textContent=modeLabel(SIM.mode);
  // Timeline
  $('tlDay').textContent='DAY '+SIM.day;
  $('tlHours').textContent=formatHour(SIM.time);
  var tlRange=$('tlRange');
  if(tlRange&&!tlRange._dragging){tlRange.value=(SIM.time/24)*100;}
}

function canvasCoords(e){
  var r=CANV.canvas.getBoundingClientRect();
  var x=e.clientX-r.left;
  var y=e.clientY-r.top;
  return {
    x:x/SIM.W*1, // raw px
    worldX:x/CANV.W*SIM.W,
    worldY:y/CANV.H*SIM.H,
    px:x,py:y
  };
}
var _mouseDown=false;
function onCanvasMouse(e){
  _mouseDown=true;
  var c=canvasCoords(e);
  if(SIM.mode==='wind'||SIM.mode==='radar'){
    // Add heat/humidity
    SIM.fluid.addHeat(c.worldX,c.worldY,2,8);
    SIM.fluid.addHumidity(c.worldX,c.worldY,0.5,10);
  } else if(SIM.mode==='storm'){
    spawnStorm(c.worldX,c.worldY);
  }
}
function onCanvasMove(e){
  if(!_mouseDown)return;
  var c=canvasCoords(e);
  if(SIM.mode==='wind'||SIM.mode==='radar'){
    SIM.fluid.addHeat(c.worldX,c.worldY,1,6);
  }
}
function onCanvasUp(){_mouseDown=false;}

function setClimateCO2(v){
  CLIMATE.co2=v;
  updateClimateModel();
  renderLeftPanel();
}
function updateClimateModel(){
  var co2=CLIMATE.co2;
  // Simplified logarithmic forcing (real formula: 5.35 * ln(C/C0))
  var forcing=5.35*Math.log(co2/280);
  var sensitivity=0.8; // °C per W/m²
  CLIMATE.tempAnomaly=forcing*sensitivity;
  // Sea level: ~3.3mm/yr per °C above pre-industrial
  CLIMATE.seaLevel=CLIMATE.tempAnomaly*30;
  // Arctic ice loss
  CLIMATE.arcticIce=clamp(100-CLIMATE.tempAnomaly*25,0,100);
  var ta=$('taVal');if(ta)ta.textContent='+'+(CLIMATE.tempAnomaly>0?'':'-')+fmt(Math.abs(CLIMATE.tempAnomaly),2)+'°C';
  var sl=$('slVal');if(sl)sl.textContent='+'+fmt(CLIMATE.seaLevel,0)+' cm';
  var ai=$('aiVal');if(ai)ai.textContent=fmt(CLIMATE.arcticIce,0)+'%';
}

    html+='</div></div>';
  } else if(SIM.mode==='climate'){
    html+='<div class="sec"><h4>Radiative Forcing</h4>';

    html+='<div class="kv">';

    html+='<div class="row"><span class="k">ΔT (equilib.)</span><span class="v">+'+fmt(CLIMATE.tempAnomaly,2)+'°C</span></div>';
    html+='<div class="row"><span class="k">Sea level</span><span class="v">+'+fmt(CLIMATE.seaLevel,1)+' cm</span></div>';
    html+='<div class="row"><span class="k">Arctic ice</span><span class="v">'+fmt(CLIMATE.arcticIce,0)+'%</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Context</h4>';
    html+='<div class="sub" style="font-size:.65rem;line-height:1.7;color:var(--tx2)">'+
      'Pre-industrial CO₂ was ~280 ppm. Current levels are ~420 ppm. '+
      'Doubling CO₂ causes ~3-4°C warming (climate sensitivity). '+
      'The 2015 Paris Agreement targets 1.5-2°C warming above pre-industrial.';
    html+='</div></div>';
  } else if(SIM.mode==='almanac'){
    var now=new Date();
    now.setHours(Math.floor(SIM.time),Math.floor((SIM.time%1)*60),0,0);
    var tw=ASTRO.twilight(now,ALMANAC.lat,ALMANAC.lon);
    html+='<div class="sec"><h4>Sky State</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Sun altitude</span><span class="v">'+fmt(tw.altitude,1)+'°</span></div>';
    html+='<div class="row"><span class="k">Twilight</span><span class="v">'+tw.phase.toUpperCase()+'</span></div>';
    html+='</div></div>';
  } else if(SIM.mode==='data'){
    html+='<div class="sec"><h4>Dataset Info</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Years</span><span class="v">1880-2024</span></div>';
    html+='<div class="row"><span class="k">Data points</span><span class="v">'+CLIMATE_DATA.years.length+'</span></div>';
    html+='<div class="row"><span class="k">Temperature</span><span class="v">+'+fmt(CLIMATE_DATA.temperature[CLIMATE_DATA.temperature.length-1]-CLIMATE_DATA.temperature[0],2)+'°C</span></div>';
    html+='<div class="row"><span class="k">CO₂ rise</span><span class="v">+'+fmt(CLIMATE_DATA.co2[CLIMATE_DATA.co2.length-1]-CLIMATE_DATA.co2[0],0)+' ppm</span></div>';
    html+='<div class="row"><span class="k">Sea level</span><span class="v">+'+fmt(CLIMATE_DATA.seaLevel[CLIMATE_DATA.seaLevel.length-1],1)+' cm</span></div>';
    html+='</div></div>';
  } else {
    html+='<div class="sec"><h4>About</h4><div class="sub" style="font-size:.7rem;line-height:1.7;color:var(--tx2)">'+aboutTextFor(SIM.mode)+'</div></div>';
  }
  body.innerHTML=html;
}

function beaufort(ms){
  var scales=[0.3,1.5,3.3,5.5,7.9,10.7,13.8,17.1,20.7,24.4,28.4,32.6];
  var names=['Calm','Light air','Light breeze','Gentle','Moderate','Fresh','Strong','Near gale','Gale','Severe','Storm','Violent'];
  for(var i=0;i<scales.length;i++)if(ms<scales[i])return i+' ('+names[i]+')';
  return '12 (Hurricane)';
}
function aboutTextFor(m){
  var t={
    wind:'Live fluid simulation using Stam\'s stable fluids. Particles trace velocity field. Click to add heat sources.',
    radar:'Precipitation intensity map derived from humidity field. Storm cells shown as radial gradients with animated sweep.',
    temp:'Global temperature heatmap. Isotherms via marching squares. Day/night heating from solar position.',
    pressure:'Pressure field visualization with isobar rendering. H/L markers show extremes. Based on Bernoulli principle from velocity.',
    storm:'Spawn rotating low-pressure systems. Coriolis deflection, spiral rain bands, eye wall structure.',
    climate:'Interactive radiative forcing model. Adjust CO₂ to see temperature, sea level, and ice response.',
    almanac:'Precise sun/moon calculations. Sunrise/sunset via solar declination, moon phase via synodic month, twilight by solar altitude.',
    data:'Century-scale climate records. Temperature anomaly (HadCRUT-like), CO₂ concentration, sea level.'
  };
  return t[m]||'';
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggleSim();}
  else if(e.key==='r'||e.key==='R'){resetSim();}
  else if(e.key==='t'||e.key==='T'){toggleTheme();}
  else if(e.key==='?'||(e.shiftKey&&e.key==='/')){showHelp();}
  else if(e.key==='Escape')closeModal();
});

/* Timeline scrubber */
setTimeout(function(){
  var tr=$('tlRange');
  if(tr){
    tr.addEventListener('input',function(){this._dragging=true;SIM.time=parseFloat(this.value)/100*24;$('tlHours').textContent=formatHour(SIM.time);});
    tr.addEventListener('change',function(){this._dragging=false;});
    tr.addEventListener('mouseup',function(){this._dragging=false;});
    tr.addEventListener('touchend',function(){this._dragging=false;});
  }
},100);

var BOOT=[
  'Initializing fluid solver...',
  'Allocating 200×100 velocity grid...',
  'Warming up Gauss-Seidel pressure projection...',
  'Loading atmospheric constants...',
  'Preparing marching squares isobars...',
  'Compiling solar position algorithms...',
  'Initializing '+SIM.particleCount+' particles...',
  'Loading 34 climate model parameters...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('AURORA ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  initCanvas();
  SIM.fluid=new FluidSolver(SIM.W,SIM.H);
  // Seed initial temperature gradient (warm at equator, cold at poles)
  for(var j=0;j<SIM.H;j++){
    var lat=(j/SIM.H)*2-1;
    for(var i=0;i<SIM.W;i++){
      var idx=j*SIM.W+i;
      SIM.fluid.temp[idx]=-lat*lat*0.8;
    }
  }
  buildTabs();
  renderLeftPanel();
  renderRightPanel();
  updateClimateModel();
  updateStats();
  bootSequence();
  requestAnimationFrame(mainLoop);
});
