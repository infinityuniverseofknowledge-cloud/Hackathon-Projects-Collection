LAB.register('lsystem',{
  title:'L-System Garden',icon:'🌿',category:'Fractals',
  desc:'Lindenmayer systems: parallel string rewriting that generates plants, snowflakes, and space-filling curves.',
  clearColor:'#0a0a12',
  init:function(){
    this.preset=(this._state&&this._state.preset)||'plant';
    this.iterations=(this._state&&this._state.iterations)||5;
    this.angleDeg=(this._state&&this._state.angleDeg)||25;
    this.stepLen=(this._state&&this._state.stepLen)||4;
    this.branchAngle=(this._state&&this._state.branchAngle)||null;
    this.color1=(this._state&&this._state.color1)||'#00ff88';
    this.color2=(this._state&&this._state.color2)||'#ff2e88';
    this.lineWidth=(this._state&&this._state.lineWidth)||1.2;
    this.generation=0;
    this.camera={x:CV.W/2,y:CV.H-30,zoom:1};
    this.build();
    this.tick=this.tick; // ensure tick exists
  },
  build:function(){
    var p=LSYSTEMS[this.preset];
    var rules={};
    p.rules.split(',').forEach(function(r){
      var parts=r.split('→');
      if(parts.length===2)rules[parts[0].trim()]=parts[1].trim();
    });
    var s=p.axiom;
    for(var i=0;i<this.iterations;i++){
      var next='';
      for(var j=0;j<s.length;j++){
        var c=s[j];
        next+=rules[c]!=null?rules[c]:c;
      }
      s=next;
    }
    this.string=s;
    this.pString=p;
  },
  computeLines:function(){
    var p=this.pString;
    var ang=p.initAngle*Math.PI/180;
    var turn=p.angle*Math.PI/180;
    var x=0,y=0;
    var stack=[];
    var minX=0,maxX=0,minY=0,maxY=0;
    var lines=[];
    var currentColor=0;
    var len=this.stepLen;
    var depth=0;
    var maxDepth=0;
    for(var i=0;i<this.string.length;i++){
      var c=this.string[i];
      if(c==='F'||c==='G'){
        var nx=x+Math.cos(ang)*len;
        var ny=y+Math.sin(ang)*len;
        lines.push({x1:x,y1:y,x2:nx,y2:ny,c:currentColor,d:depth});
        x=nx;y=ny;
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }else if(c==='f'){
        x+=Math.cos(ang)*len;y+=Math.sin(ang)*len;
      }else if(c==='+'){
        ang+=turn;
      }else if(c==='-'){
        ang-=turn;
      }else if(c==='['){
        stack.push({x:x,y:y,ang:ang,c:currentColor,d:depth});
        depth++;
        if(depth>maxDepth)maxDepth=depth;
        currentColor=(currentColor+1)%2;
      }else if(c===']'){
        var s=stack.pop();
        if(s){x=s.x;y=s.y;ang=s.ang;currentColor=s.c;depth=s.d;}
      }
    }
    this.bounds={minX:minX,maxX:maxX,minY:minY,maxY:maxY};
    this.maxDepth=maxDepth||1;
    return lines;
  },
  tick:function(dt){},
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var lines=this.computeLines();
    // Auto-fit
    var b=this.bounds;
    var w=b.maxX-b.minX||1;
    var h=b.maxY-b.minY||1;
    var scale=Math.min((CV.W-40)/w,(CV.H-40)/h);
    if(this.preset==='plant'||this.preset==='fern'||this.preset==='tree'||this.preset==='bush'){
      scale=Math.min((CV.W-40)/w,(CV.H-40)/h)*0.95;
    }
    ctx.save();
    ctx.translate(CV.W/2,CV.H/2);
    ctx.scale(scale,scale);
    ctx.translate(-(b.minX+b.maxX)/2,-(b.minY+b.maxY)/2);
    ctx.lineWidth=this.lineWidth/scale;
    ctx.lineCap='round';
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      var t=l.d/this.maxDepth;
      var color;
      if(l.c===0){
        // Interpolate color1→color2 by depth
        color=this.color1;
      }else{
        color=this.color2;
      }
      // Fade with depth
      var alpha=1-t*0.5;
      ctx.strokeStyle=color;
      ctx.globalAlpha=alpha;
      ctx.beginPath();
      ctx.moveTo(l.x1,l.y1);
      ctx.lineTo(l.x2,l.y2);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.restore();
    setStats('<div>Preset: <b style="color:var(--c1)">'+this.pString.name+'</b></div>'+
      '<div>Length: '+this.string.length.toLocaleString()+'</div>'+
      '<div>Segments: '+lines.length.toLocaleString()+'</div>'+
      '<div>Depth: '+this.maxDepth+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Preset</h4>';
    var sel=el('select',{});
    Object.keys(LSYSTEMS).forEach(function(k){
      var o=el('option',{value:k},LSYSTEMS[k].name);
      if(this.preset===k)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.preset=this.value;LAB.current.build();}};
    s1.appendChild(sel);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Parameters</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Iterations</span><span id="lsI">'+this.iterations+'</span></div>';
    var r=el('input',{type:'range',min:1,max:12,value:this.iterations});
    r.oninput=function(){$('lsI').textContent=this.value;if(LAB.current){LAB.current.iterations=parseInt(this.value);LAB.current.build();}};
    c.appendChild(r);s2.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Step length</span><span id="lsS">'+this.stepLen+'</span></div>';
    var r2=el('input',{type:'range',min:1,max:10,step:0.5,value:this.stepLen});
    r2.oninput=function(){$('lsS').textContent=this.value;if(LAB.current)LAB.current.stepLen=parseFloat(this.value);};
    c2.appendChild(r2);s2.appendChild(c2);
    var c3=el('div',{class:'ctrl'});
    c3.innerHTML='<div class="ctrl-label"><span>Line width</span><span id="lsW">'+this.lineWidth+'</span></div>';
    var r3=el('input',{type:'range',min:0.5,max:4,step:0.1,value:this.lineWidth});
    r3.oninput=function(){$('lsW').textContent=this.value;if(LAB.current)LAB.current.lineWidth=parseFloat(this.value);};
    c3.appendChild(r3);s2.appendChild(c3);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Angle (°)</h4>';
    var c4=el('div',{class:'ctrl'});
    c4.innerHTML='<div class="ctrl-label"><span>Angle</span><span id="lsA">'+this.pString.angle+'</span></div>';
    var r4=el('input',{type:'range',min:5,max:180,value:this.pString.angle});
    r4.oninput=function(){
      var v=parseFloat(this.value);
      $('lsA').textContent=v;
      if(LAB.current){LAB.current.pString={...LAB.current.pString,angle:v};}
    };
    c4.appendChild(r4);s3.appendChild(c4);
    panel.appendChild(s3);
  }
});
/* ---------- MANDELBROT ---------- */
LAB.register('mandelbrot',{
  title:'Mandelbrot & Julia',icon:'🌀',category:'Fractals',
  desc:'Explore the Mandelbrot set and Julia sets. Click to zoom. Toggle between Mandelbrot and Julia modes.',
  clearColor:'#0a0a12',
  init:function(){
    this.mode=(this._state&&this._state.mode)||'mandelbrot';
    this.centerX=(this._state&&this._state.centerX)||-0.5;
    this.centerY=(this._state&&this._state.centerY)||0;
    this.zoom=(this._state&&this._state.zoom)||1;
    this.maxIter=(this._state&&this._state.maxIter)||200;
    this.juliaR=(this._state&&this._state.juliaR)||-0.7;
    this.juliaI=(this._state&&this._state.juliaI)||0.27;
    this.palette=(this._state&&this._state.palette)||'aurora';
    this.autoZoom=(this._state&&this._state.autoZoom)||false;
    this.needsRedraw=true;
    this.imageData=null;
    this.renderQuality=(this._state&&this._state.renderQuality)||2; // step size
  },
  palette:function(t){
    var p=this.palette;
    if(p==='aurora'){
      var r=Math.floor(9*(1-t)*t*t*t*255);
      var g=Math.floor(15*(1-t)*(1-t)*t*t*255);
      var b=Math.floor(8.5*(1-t)*(1-t)*(1-t)*t*255);
      return [r,g,b];
    }
    if(p==='fire'){
      return [Math.floor(255*Math.min(1,t*3)),Math.floor(255*Math.max(0,(t-0.3)*2)),Math.floor(255*Math.max(0,(t-0.7)*3))];
    }
    if(p==='ocean'){
      return [Math.floor(255*Math.max(0,t-0.5)*2),Math.floor(255*(1-Math.abs(t-0.5)*2)),Math.floor(255*Math.min(1,t*1.5))];
    }
    if(p==='grayscale'){
      var v=Math.floor(255*t);return [v,v,v];
    }
    if(p==='neon'){
      return [Math.floor(127+128*Math.sin(t*6.28)),Math.floor(127+128*Math.sin(t*6.28+2.1)),Math.floor(127+128*Math.sin(t*6.28+4.2))];
    }
    return [0,0,0];
  },
  pixel:function(px,py){
    var xmin=this.centerX-2/this.zoom;
    var ymin=this.centerY-2/this.zoom;
    var scale=4/(this.zoom*Math.min(CV.W,CV.H));
    var cx=xmin+(px-0)*scale;
    var cy=ymin+(py-0)*scale;
    if(this.mode==='julia'){
      var zx=cx,zy=cy;
      var jr=this.juliaR,ji=this.juliaI;
      for(var i=0;i<this.maxIter;i++){
        var zx2=zx*zx-zy*zy+jr;
        var zy2=2*zx*zy+ji;
        zx=zx2;zy=zy2;
        if(zx*zx+zy*zy>4)return this.palette(1-i/this.maxIter);
      }
      return [0,0,0];
    }else{
      var zx3=0,zy3=0;
      var i2;
      for(i2=0;i2<this.maxIter;i2++){
        var zx2_2=zx3*zx3-zy3*zy3+cx;
        var zy2_2=2*zx3*zy3+cy;
        zx3=zx2_2;zy3=zy2_2;
        if(zx3*zx3+zy3*zy3>4)return this.palette(1-i2/this.maxIter);
      }
      return [0,0,0];
    }
  },
  render:function(){
    var w=CV.W,h=CV.H;
    var img=this.ctx.createImageData(Math.floor(w/this.renderQuality),Math.floor(h/this.renderQuality));
    var data=img.data;
    var q=this.renderQuality;
    for(var py=0;py<h/q;py++){
      for(var px=0;px<w/q;px++){
        var col=this.pixel(px*q,py*q);
        var idx=(py*Math.floor(w/q)+px)*4;
        data[idx]=col[0];
        data[idx+1]=col[1];
        data[idx+2]=col[2];
        data[idx+3]=255;
      }
    }
    this.imageData=img;
    this.needsRedraw=false;
  },
  tick:function(dt){
    if(this.autoZoom){this.zoom*=1.005;}
  },
  draw:function(ctx){
    this.ctx=ctx;
    if(this.needsRedraw){
      ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
      ctx.fillStyle='#686888';
      ctx.font='12px monospace';
      ctx.fillText('Rendering…',20,25);
      // Do it in chunks - schedule next frame
      var self=this;
      setTimeout(function(){self.render();},10);
      // Fallback for small screens: draw at low res immediately
      this.renderQuality=Math.max(2,this.renderQuality);
      return;
    }
    if(this.imageData){
      // Upscale via temp canvas
      var tmp=document.createElement('canvas');
      tmp.width=this.imageData.width;
      tmp.height=this.imageData.height;
      tmp.getContext('2d').putImageData(this.imageData,0,0);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(tmp,0,0,CV.W,CV.H);
    }
    setStats('<div>Mode: <b style="color:var(--c1)">'+this.mode+'</b></div>'+
      '<div>Zoom: '+fmt(this.zoom,2)+'×</div>'+
      '<div>Center: '+fmt(this.centerX,4)+', '+fmt(this.centerY,4)+'</div>'+
      '<div>Iter: '+this.maxIter+'</div>');
  },
  onEvent:function(type,d){
    if(type==='down'){
      var scale=4/(this.zoom*Math.min(CV.W,CV.H));
      var xmin=this.centerX-2/this.zoom;
      var ymin=this.centerY-2/this.zoom;
      var cx=xmin+d.x*scale;
      var cy=ymin+d.y*scale;
      if(this.mode==='mandelbrot'){this.centerX=cx;this.centerY=cy;}
      else{this.juliaR=cx;this.juliaI=cy;}
      this.zoom*=2;
      this.needsRedraw=true;
    }
    if(type==='rightclick'){this.zoom=Math.max(0.1,this.zoom/2);this.needsRedraw=true;}
    if(type==='wheel'){this.zoom*=d.delta<0?1.3:1/1.3;this.needsRedraw=true;}
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Mode</h4>';
    var sel=el('select',{});
    ['mandelbrot','julia'].forEach(function(v){
      var o=el('option',{value:v},v.charAt(0).toUpperCase()+v.slice(1));
      if(this.mode===v)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.mode=this.value;LAB.current.needsRedraw=true;}};
    s1.appendChild(sel);panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Render</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Max iterations</span><span id="mbI">'+this.maxIter+'</span></div>';
    var r=el('input',{type:'range',min:20,max:2000,step:10,value:this.maxIter});
    r.oninput=function(){$('mbI').textContent=this.value;if(LAB.current){LAB.current.maxIter=parseInt(this.value);LAB.current.needsRedraw=true;}};
    c.appendChild(r);s2.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Quality (1=best)</span><span id="mbQ">'+this.renderQuality+'</span></div>';
    var r2=el('input',{type:'range',min:1,max:5,value:this.renderQuality});
    r2.oninput=function(){$('mbQ').textContent=this.value;if(LAB.current){LAB.current.renderQuality=parseInt(this.value);LAB.current.needsRedraw=true;}};
    c2.appendChild(r2);s2.appendChild(c2);
    var c3=el('div',{class:'ctrl'});
    c3.innerHTML='<div class="ctrl-label">Palette</div>';
    var psel=el('select',{});
    ['aurora','fire','ocean','neon','grayscale'].forEach(function(p){
      var o=el('option',{value:p},p);
      if(this.palette===p)o.selected=true;
      psel.appendChild(o);
    }.bind(this));
    psel.onchange=function(){if(LAB.current){LAB.current.palette=this.value;LAB.current.needsRedraw=true;}};
    c3.appendChild(psel);s2.appendChild(c3);
    panel.appendChild(s2);

    if(this.mode==='julia'){
      var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Julia c</h4>';
      var c4=el('div',{class:'ctrl'});
      c4.innerHTML='<div class="ctrl-label"><span>Real</span><span id="mbJR">'+this.juliaR.toFixed(3)+'</span></div>';
      var r4=el('input',{type:'range',min:-2,max:2,step:0.001,value:this.juliaR});
      r4.oninput=function(){$('mbJR').textContent=parseFloat(this.value).toFixed(3);if(LAB.current){LAB.current.juliaR=parseFloat(this.value);LAB.current.needsRedraw=true;}};
      c4.appendChild(r4);s3.appendChild(c4);
      var c5=el('div',{class:'ctrl'});
      c5.innerHTML='<div class="ctrl-label"><span>Imaginary</span><span id="mbJI">'+this.juliaI.toFixed(3)+'</span></div>';
      var r5=el('input',{type:'range',min:-2,max:2,step:0.001,value:this.juliaI});
      r5.oninput=function(){$('mbJI').textContent=parseFloat(this.value).toFixed(3);if(LAB.current){LAB.current.juliaI=parseFloat(this.value);LAB.current.needsRedraw=true;}};
      c5.appendChild(r5);s3.appendChild(c5);
      panel.appendChild(s3);
    }

    var s4=el('div',{class:'sp-section'});s4.innerHTML='<h4>Actions</h4>';
    var bz=el('button',{class:'btn full'},'🔍+ Zoom in');
    bz.onclick=function(){if(LAB.current){LAB.current.zoom*=2;LAB.current.needsRedraw=true;}};
    s4.appendChild(bz);
    var bz2=el('button',{class:'btn full',style:'margin-top:6px'},'🔍− Zoom out');
    bz2.onclick=function(){if(LAB.current){LAB.current.zoom=Math.max(0.1,LAB.current.zoom/2);LAB.current.needsRedraw=true;}};
    s4.appendChild(bz2);
    var bz3=el('button',{class:'btn primary full',style:'margin-top:6px'},'↺ Reset view');
    bz3.onclick=function(){if(LAB.current){LAB.current.centerX=-0.5;LAB.current.centerY=0;LAB.current.zoom=1;LAB.current.needsRedraw=true;}};
    s4.appendChild(bz3);
    panel.appendChild(s4);
  }
});
</script>
<script>

/* ---------- PRIMES SIEVE ---------- */
LAB.register('primes',{
  title:'Prime Sieve',icon:'🔢',category:'Algorithms',
  desc:'Sieve of Eratosthenes visualization. See primes and composites revealed as the sieve marks them off.',
  clearColor:'#0a0a12',
  init:function(){
    this.N=(this._state&&this._state.N)||1000;
    this.grid=[];
    this.cols=Math.floor(Math.sqrt(this.N*1.4));
    this.rows=Math.ceil(this.N/this.cols);
    this.cellSize=Math.min(CV.W/this.cols,CV.H/this.rows);
    this.cols=Math.floor(CV.W/this.cellSize);
    this.rows=Math.ceil(this.N/this.cols);
    this.marks=new Uint8Array(this.N+1); // 0=unknown,1=composite,2=prime
    this.marks[0]=1;this.marks[1]=1;
    this.p=2;
    this.running=false;
    this.done=false;
    this.primesFound=0;
  },
  step:function(){
    if(this.done)return;
    if(this.p*this.p>this.N){this.done=true;this.running=false;
      for(var i=2;i<=this.N;i++)if(this.marks[i]===0)this.marks[i]=2;
      for(var i2=2;i2<=this.N;i2++)if(this.marks[i2]===2)this.primesFound++;
      return;
    }
    if(this.marks[this.p]===0){
      this.marks[this.p]=2;
      for(var m=this.p*this.p;m<=this.N;m+=this.p)this.marks[m]=1;
    }
    this.p++;
    while(this.p<=this.N&&this.marks[this.p]!==0)this.p++;
  },
  tick:function(dt){
    if(!this.running||this.done)return;
    this.step();
    if(Math.random()<0.3)this.step();
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var cs=this.cellSize;
    for(var i=2;i<=this.N;i++){
      var idx=i-2;
      var col=idx%this.cols;
      var row=Math.floor(idx/this.cols);
      var px=col*cs,py=row*cs+30;
      var m=this.marks[i];
      var color;
      if(m===2)color='#00ff88';
      else if(m===1)color='#2a2a3c';
      else color='#4a4a70';
      if(i===this.p)color='#ff2e88';
      ctx.fillStyle=color;
      ctx.fillRect(px,py,cs-1,cs-1);
    }
    var primes=0;
    for(var k=2;k<=this.N;k++)if(this.marks[k]===2)primes++;
    setStats('<div>N: <b style="color:var(--c1)">'+this.N+'</b></div>'+
      '<div>Current p: '+this.p+'</div>'+
      '<div>Primes: '+primes+'</div>'+
      '<div>'+(this.done?'✅ Done':'▶ Sieving')+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Size</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>N (max number)</span><span id="prN">'+this.N+'</span></div>';
    var r=el('input',{type:'range',min:100,max:5000,step:100,value:this.N});
    r.oninput=function(){$('prN').textContent=this.value;if(LAB.current){LAB.current.N=parseInt(this.value);LAB.current.init();}};
    c.appendChild(r);s1.appendChild(c);
    panel.appendChild(s1);
    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Actions</h4>';
    var b=el('button',{class:'btn primary full'},'▶ Run to completion');
    b.onclick=function(){
      if(LAB.current){
        while(!LAB.current.done)LAB.current.step();
      }
    };
    s2.appendChild(b);
    var br=el('button',{class:'btn full',style:'margin-top:6px'},'↺ Reset');
    br.onclick=function(){if(LAB.current)LAB.current.init();};
    s2.appendChild(br);
    panel.appendChild(s2);
  }
});

/* ---------- COLLATZ CONJECTURE ---------- */
LAB.register('collatz',{
  title:'Collatz Explorer',icon:'🌀',category:'Algorithms',
  desc:'Explore the Collatz conjecture: visualize hailstone sequences for many starting values.',
  clearColor:'#0a0a12',
  init:function(){
    this.maxN=(this._state&&this._state.maxN)||500;
    this.highlight=(this._state&&this._state.highlight)||27;
    this.draw();
  },
  seq:function(n){
    var s=[n];
    var steps=0;
    while(n!==1&&steps<10000){
      if(n%2===0)n/=2;
      else n=3*n+1;
      s.push(n);
      steps++;
    }
    return s;
  },
  drawLines:function(){
    this.data=[];
    for(var n=1;n<=this.maxN;n++){
      var seq=this.seq(n);
      this.data.push({n:n,steps:seq.length,max:Math.max.apply(null,seq.slice(0,100))});
    }
  },
  draw:function(){this.drawLines();},
  tick:function(){},
  draw:function(ctx){
    if(!this.data)this.drawLines();
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var maxSteps=Math.max.apply(null,this.data.map(function(d){return d.steps;}));
    var barW=CV.W/this.maxN;
    for(var i=0;i<this.data.length;i++){
      var d=this.data[i];
      var h=(d.steps/maxSteps)*(CV.H-60);
      var x=i*barW;
      var y=CV.H-30-h;
      var hue=(d.steps/maxSteps)*270;
      var color='hsl('+hue+',70%,55%)';
      if(d.n===this.highlight)color='#ff2e88';
      ctx.fillStyle=color;
      ctx.fillRect(x,y,Math.max(1,barW-0.5),h);
    }
    // Highlight sequence path
    if(this.highlight){
      var seq=this.seq(this.highlight);
      ctx.strokeStyle='rgba(255,46,136,.6)';
      ctx.lineWidth=2;
      ctx.beginPath();
      var maxV=Math.max.apply(null,seq);
      for(var j=0;j<seq.length;j++){
        var px=(j/seq.length)*CV.W;
        var py=CV.H-30-(seq[j]/maxV)*(CV.H-60);
        if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    // Labels
    ctx.fillStyle='#00e5ff';ctx.font='12px monospace';
    ctx.fillText('Max steps: '+maxSteps,20,25);
    if(this.highlight){
      var seqH=this.seq(this.highlight);
      setStats('<div>Highlight n: <b style="color:var(--c1)">'+this.highlight+'</b></div>'+
        '<div>Steps to 1: '+seqH.length+'</div>'+
        '<div>Peak: '+Math.max.apply(null,seqH).toLocaleString()+'</div>'+
        '<div>Max N: '+this.maxN+'</div>');
    }
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Parameters</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Max N</span><span id="coN">'+this.maxN+'</span></div>';
    var r=el('input',{type:'range',min:50,max:2000,step:50,value:this.maxN});
    r.oninput=function(){$('coN').textContent=this.value;if(LAB.current){LAB.current.maxN=parseInt(this.value);LAB.current.draw();}};
    c.appendChild(r);s1.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Highlight n</span><span id="coH">'+this.highlight+'</span></div>';
    var r2=el('input',{type:'range',min:1,max:500,value:this.highlight});
    r2.oninput=function(){$('coH').textContent=this.value;if(LAB.current)LAB.current.highlight=parseInt(this.value);};
    c2.appendChild(r2);s1.appendChild(c2);
    panel.appendChild(s1);
    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Actions</h4>';
    var b=el('button',{class:'btn full'},'🎲 Random highlight');
    b.onclick=function(){if(LAB.current){LAB.current.highlight=rnd(1,LAB.current.maxN);}};
    s2.appendChild(b);panel.appendChild(s2);
  }
});

/* ---------- XOR CIPHER ---------- */
LAB.register('xor',{
  title:'XOR Cipher',icon:'🔐',category:'Computation',
  desc:'One-time pad demo. XOR-encrypt text with a key and visualize the byte-level transformation.',
  clearColor:'#0a0a12',
  init:function(){
    this.text=(this._state&&this._state.text)||'Hello, NEXUS LAB!';
    this.key=(this._state&&this._state.key)||'SECRET';
    this.mode=(this._state&&this._state.mode)||'encrypt';
    this.process();
  },
  process:function(){
    this.out='';
    this.bytes=[];
    var t=this.text;
    var k=this.key||'k';
    for(var i=0;i<t.length;i++){
      var c=t.charCodeAt(i)^k.charCodeAt(i%k.length);
      this.out+=String.fromCharCode(c);
      this.bytes.push({in:t.charCodeAt(i),key:k.charCodeAt(i%k.length),out:c});
    }
  },
  tick:function(){},
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    this.process();
    ctx.font='bold 14px monospace';
    ctx.fillStyle='#00e5ff';
    ctx.fillText('INPUT',20,30);
    ctx.font='13px monospace';
    ctx.fillStyle='#a8a8c0';
    ctx.fillText(this.text.substr(0,80),20,52);

    ctx.font='bold 14px monospace';
    ctx.fillStyle='#ffc400';
    ctx.fillText('KEY',20,90);
    ctx.fillStyle='#a8a8c0';
    ctx.font='13px monospace';
    ctx.fillText(this.key.substr(0,80),20,112);

    ctx.font='bold 14px monospace';
    ctx.fillStyle='#ff2e88';
    ctx.fillText('OUTPUT (XOR)',20,150);
    ctx.font='14px monospace';
    ctx.fillStyle='#00ff88';
    var display=this.out.split('').map(function(c){
      var code=c.charCodeAt(0);
      if(code>=32&&code<127)return c;
      return '·';
    }).join('');
    ctx.fillText(display.substr(0,80),20,172);

    // Byte visualization
    var startY=210;
    ctx.fillStyle='#00e5ff';
    ctx.font='bold 12px monospace';
    ctx.fillText('BYTES',20,startY);
    var cellW=64,cellH=32;
    var visible=Math.min(this.bytes.length,Math.floor((CV.W-40)/cellW),Math.floor((CV.H-startY-60)/cellH));
    for(var i=0;i<visible;i++){
      var b=this.bytes[i];
      var x=20+(i%Math.floor((CV.W-40)/cellW))*cellW;
      var y=startY+20+Math.floor(i/Math.floor((CV.W-40)/cellW))*(cellH+8);
      ctx.fillStyle='rgba(0,229,255,.08)';
      ctx.fillRect(x,y,cellW-6,cellH);
      ctx.strokeStyle='#2a2a3c';
      ctx.lineWidth=1;
      ctx.strokeRect(x,y,cellW-6,cellH);
      ctx.font='10px monospace';
      ctx.fillStyle='#686888';
      ctx.fillText('i='+i,x+4,y+11);
      ctx.fillStyle='#a8a8c0';
      ctx.fillText('in:'+b.in,x+4,y+21);
      ctx.fillStyle='#ffc400';
      ctx.fillText('^'+b.key,x+4,y+31);
    }
    setStats('<div>Length: <b style="color:var(--c1)">'+this.text.length+'</b></div>'+
      '<div>Key length: '+this.key.length+'</div>'+
      '<div>Reversible: ✓ (XOR is its own inverse)</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Input</h4>';
    var ta=el('textarea',{rows:3});
    ta.value=this.text;
    ta.oninput=function(){if(LAB.current)LAB.current.text=this.value;};
    s1.appendChild(ta);
    var k=el('input',{type:'text',value:this.key,placeholder:'Key'});
    k.style.marginTop='6px';
    k.oninput=function(){if(LAB.current)LAB.current.key=this.value;};
    s1.appendChild(k);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Actions</h4>';
    var be=el('button',{class:'btn primary full'},'🔒 Encrypt → Output');
    be.onclick=function(){
      if(LAB.current){
        LAB.current.text=LAB.current.out;
        toast('Text replaced with ciphertext','success');
      }
    };
    s2.appendChild(be);
    var bd=el('button',{class:'btn full',style:'margin-top:6px'},'🔓 Decrypt → Input');
    bd.onclick=function(){
      if(LAB.current){
        LAB.current.text=LAB.current.out;
        toast('Text replaced with plaintext','success');
      }
    };
    s2.appendChild(bd);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Presets</h4>';
    [['Hello, NEXUS LAB!','SECRET'],['Meet me at midnight','KEY'],['The eagle flies at dawn','PASSWORD123']].forEach(function(p){
      var b=el('button',{class:'btn sm full',style:'margin-bottom:4px;text-align:left;justify-content:flex-start'},p[0]+' / '+p[1]);
      b.onclick=function(){if(LAB.current){LAB.current.text=p[0];LAB.current.key=p[1];}};
      s3.appendChild(b);
    });
    panel.appendChild(s3);
  }
});

/* ================================================================
   BOOT SEQUENCE + INIT
   ================================================================ */
var BOOT_STEPS=[
  'Loading NEXUS kernel...',
  'Initializing canvas manager...',
  'Registering '+LAB.order.length+' modules...',
  'Warming up cellular automata...',
  'Spawning particles...',
  'Loading 12 sorting algorithms...',
  'Preparing maze generators...',
  'Booting interpreters (BF, VM, Regex, λ)...',
  'Fractal renderer ready...',
  'System ready.'
];

function bootSequence(){
  var pct=0;var idx=0;
  var fill=$('bootFill');var log=$('bootLog');var pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(4,12);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'line'});
      var cls=idx<3?'warn':'ok';
      l.innerHTML='<span class="'+cls+'">[ OK ]</span> '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        logMsg('NEXUS LAB initialized with '+LAB.order.length+' modules','ok');
        toast('NEXUS LAB ready','success');
      },500);
    }
  },140);
}

window.addEventListener('DOMContentLoaded',function(){
  loadSettings();
  CV.init();
  renderTopCategories();
  renderModulePills();
  // Mount default module
  LAB.mount('life');
  // Open log panel
  $('logPanel').classList.add('open');
  // Auto-save
  setInterval(function(){saveSettings();},10000);
  // Boot
  bootSequence();
});

window.addEventListener('beforeunload',function(){saveSettings();});
