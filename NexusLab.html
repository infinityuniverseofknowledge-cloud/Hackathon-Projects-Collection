<script>
/* ================================================================
   ALGORITHM MODULES
   ================================================================ */

/* ---------- SORTING ALGORITHMS (via bash loop) ---------- */
var SORT_ALGOS={};

SORT_ALGOS['bubble']={
  name:'Bubble Sort',time:'O(n²)',space:'O(1)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    for(var i=0;i<n-1;i++){
      var swapped=false;
      for(var j=0;j<n-i-1;j++){
        yield {type:'compare',i:j,j:j+1};
        if(a[j]>a[j+1]){var t=a[j];a[j]=a[j+1];a[j+1]=t;swapped=true;yield {type:'swap',i:j,j:j+1};}
      }
      yield {type:'sorted',i:n-i-1};
      if(!swapped){for(var k=0;k<n-i-1;k++)yield {type:'sorted',i:k};break;}
    }
    yield {type:'done'};
  }
};
};

SORT_ALGOS['insertion']={
  name:'Insertion Sort',time:'O(n²)',space:'O(1)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    for(var i=1;i<n;i++){
      var key=a[i];var j=i-1;
      yield {type:'select',i:i};
      while(j>=0&&a[j]>key){
        yield {type:'compare',i:j,j:j+1};
        a[j+1]=a[j];
        yield {type:'write',i:j+1};
        j--;
      }
      a[j+1]=key;
      yield {type:'write',i:j+1};
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['selection']={
  name:'Selection Sort',time:'O(n²)',space:'O(1)',stable:'No',
  run:function*(a){
    var n=a.length;
    for(var i=0;i<n-1;i++){
      var min=i;
      for(var j=i+1;j<n;j++){
        yield {type:'compare',i:j,j:min};
        if(a[j]<a[min])min=j;
      }
      if(min!==i){var t=a[i];a[i]=a[min];a[min]=t;yield {type:'swap',i:i,j:min};}
      yield {type:'sorted',i:i};
    }
    yield {type:'sorted',i:n-1};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['merge']={
  name:'Merge Sort',time:'O(n log n)',space:'O(n)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    var tmp=a.slice();
    function* ms(lo,hi){
      if(hi-lo<=1)return;
      var mid=Math.floor((lo+hi)/2);
      yield* ms(lo,mid);
      yield* ms(mid,hi);
      var i=lo,j=mid,k=lo;
      while(i<mid&&j<hi){
        yield {type:'compare',i:i,j:j};
        if(a[i]<=a[j])tmp[k++]=a[i++];else tmp[k++]=a[j++];
      }
      while(i<mid)tmp[k++]=a[i++];
      while(j<hi)tmp[k++]=a[j++];
      for(var x=lo;x<hi;x++){a[x]=tmp[x];yield {type:'write',i:x};}
    }
    yield* ms(0,n);
    for(var k2=0;k2<n;k2++)yield {type:'sorted',i:k2};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['quick']={
  name:'Quick Sort',time:'O(n log n)',space:'O(log n)',stable:'No',
  run:function*(a){
    function* qs(lo,hi){
      if(lo>=hi)return;
      var p=a[hi],i=lo;
      for(var j=lo;j<hi;j++){
        yield {type:'compare',i:j,j:hi};
        if(a[j]<p){var t=a[i];a[i]=a[j];a[j]=t;yield {type:'swap',i:i,j:j};i++;}
      }
      var t2=a[i];a[i]=a[hi];a[hi]=t2;
      yield {type:'swap',i:i,j:hi};
      yield {type:'sorted',i:i};
      yield* qs(lo,i-1);
      yield* qs(i+1,hi);
    }
    yield* qs(0,a.length-1);
    for(var k=0;k<a.length;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['heap']={
  name:'Heap Sort',time:'O(n log n)',space:'O(1)',stable:'No',
  run:function*(a){
    var n=a.length;
    function* sift(i,size){
      while(true){
        var l=2*i+1,r=2*i+2,largest=i;
        if(l<size){yield {type:'compare',i:l,j:largest};if(a[l]>a[largest])largest=l;}
        if(r<size){yield {type:'compare',i:r,j:largest};if(a[r]>a[largest])largest=r;}
        if(largest===i)break;
        var t=a[i];a[i]=a[largest];a[largest]=t;
        yield {type:'swap',i:i,j:largest};
        i=largest;
      }
    }
    for(var i=Math.floor(n/2)-1;i>=0;i--)yield* sift(i,n);
    for(var k=n-1;k>0;k--){
      var t2=a[0];a[0]=a[k];a[k]=t2;
      yield {type:'swap',i:0,j:k};
      yield {type:'sorted',i:k};
      yield* sift(0,k);
    }
    yield {type:'sorted',i:0};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['shell']={
  name:'Shell Sort',time:'O(n log² n)',space:'O(1)',stable:'No',
  run:function*(a){
    var n=a.length,gap=Math.floor(n/2);
    while(gap>0){
      for(var i=gap;i<n;i++){
        var temp=a[i],j=i;
        while(j>=gap){
          yield {type:'compare',i:j-gap,j:j};
          if(a[j-gap]>temp){a[j]=a[j-gap];yield {type:'write',i:j};j-=gap;}
          else break;
        }
        a[j]=temp;
        yield {type:'write',i:j};
      }
      gap=Math.floor(gap/2);
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['counting']={
  name:'Counting Sort',time:'O(n+k)',space:'O(k)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    var min=a[0],max=a[0];
    for(var i=1;i<n;i++){if(a[i]<min)min=a[i];if(a[i]>max)max=a[i];}
    var range=max-min+1;
    var counts=new Array(range).fill(0);
    for(var i=0;i<n;i++){counts[a[i]-min]++;yield {type:'compare',i:i,j:i};}
    var idx=0;
    for(var v=0;v<range;v++){
      while(counts[v]-->0){
        a[idx]=v+min;
        yield {type:'write',i:idx};
        idx++;
      }
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['radix']={
  name:'Radix Sort',time:'O(nk)',space:'O(n+k)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    var max=a[0];
    for(var i=1;i<n;i++)if(a[i]>max)max=a[i];
    for(var exp=1;Math.floor(max/exp)>0;exp*=10){
      var buckets=Array.from({length:10},function(){return [];});
      for(var i=0;i<n;i++){var d=Math.floor(a[i]/exp)%10;buckets[d].push(a[i]);}
      var idx=0;
      for(var b=0;b<10;b++){
        for(var k=0;k<buckets[b].length;k++){
          a[idx]=buckets[b][k];
          yield {type:'write',i:idx};
          idx++;
        }
      }
    }
    for(var k2=0;k2<n;k2++)yield {type:'sorted',i:k2};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['cocktail']={
  name:'Cocktail Sort',time:'O(n²)',space:'O(1)',stable:'Yes',
  run:function*(a){
    var n=a.length;
    var lo=0,hi=n-1,swapped=true;
    while(swapped){
      swapped=false;
      for(var i=lo;i<hi;i++){
        yield {type:'compare',i:i,j:i+1};
        if(a[i]>a[i+1]){var t=a[i];a[i]=a[i+1];a[i+1]=t;swapped=true;yield {type:'swap',i:i,j:i+1};}
      }
      yield {type:'sorted',i:hi};
      hi--;
      if(!swapped)break;
      swapped=false;
      for(var j=hi;j>lo;j--){
        yield {type:'compare',i:j-1,j:j};
        if(a[j-1]>a[j]){var t2=a[j-1];a[j-1]=a[j];a[j]=t2;swapped=true;yield {type:'swap',i:j-1,j:j};}
      }
      yield {type:'sorted',i:lo};
      lo++;
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['gnome']={
  name:'Gnome Sort',time:'O(n²)',space:'O(1)',stable:'Yes',
  run:function*(a){
    var i=0,n=a.length;
    while(i<n){
      if(i===0){i++;}
      else{
        yield {type:'compare',i:i-1,j:i};
        if(a[i]>=a[i-1])i++;
        else{var t=a[i];a[i]=a[i-1];a[i-1]=t;yield {type:'swap',i:i-1,j:i};i--;}
      }
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

SORT_ALGOS['comb']={
  name:'Comb Sort',time:'O(n²/2^p)',space:'O(1)',stable:'No',
  run:function*(a){
    var n=a.length;
    var gap=n,swapped=true;
    while(gap>1||swapped){
      gap=Math.floor(gap/1.3);
      if(gap<1)gap=1;
      swapped=false;
      for(var i=0;i+gap<n;i++){
        yield {type:'compare',i:i,j:i+gap};
        if(a[i]>a[i+gap]){var t=a[i];a[i]=a[i+gap];a[i+gap]=t;swapped=true;yield {type:'swap',i:i,j:i+gap};}
      }
    }
    for(var k=0;k<n;k++)yield {type:'sorted',i:k};
    yield {type:'done'};
  }
};
};

/* ---------- SORTING MODULE ---------- */
LAB.register('sorting',{
  title:'Sorting Visualizer',icon:'📊',category:'Algorithms',
  desc:'Watch 12 classic sorting algorithms animate bar-by-bar. Compares, swaps, and writes are color-coded.',
  clearColor:'#0a0a12',
  init:function(){
    this.n=(this._state&&this._state.n)||60;
    this.algo=(this._state&&this._state.algo)||'quick';
    this.speed=(this._state&&this._state.speed)||30;
    this.array=[];
    for(var i=0;i<this.n;i++)this.array.push(rnd(3,100));
    this.highlight={};
    this.sorted=new Set();
    this.comparisons=0;
    this.swaps=0;
    this.writes=0;
    this.done=false;
    this.generator=SORT_ALGOS[this.algo].run(this.array.slice());
    this.acc=0;
    this._workArr=this.array.slice();
    this.generator=SORT_ALGOS[this.algo].run(this._workArr);
  },
  step:function(){
    if(this.done)return;
    var r=this.generator.next();
    if(r.done){this.done=true;return;}
    var v=r.value;
    this.highlight={};
    if(v.type==='compare'){this.highlight[v.i]='#ffc400';this.highlight[v.j]='#ffc400';this.comparisons++;}
    else if(v.type==='swap'){this.highlight[v.i]='#ff2e88';this.highlight[v.j]='#ff2e88';this.swaps++;}
    else if(v.type==='write'){this.highlight[v.i]='#00e5ff';this.writes++;}
    else if(v.type==='sorted'){this.sorted.add(v.i);}
    else if(v.type==='select'){this.highlight[v.i]='#7c4dff';}
    else if(v.type==='done'){this.done=true;for(var i=0;i<this.n;i++)this.sorted.add(i);}
  },
  tick:function(dt){
    this.acc+=dt;
    var perSec=this.speed*(this.done?0:1);
    if(this.done)return;
    var iv=1/perSec;
    var maxSteps=Math.max(1,Math.floor(perSec*dt));
    for(var i=0;i<maxSteps&&!this.done;i++)this.step();
    this.acc=0;
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var w=CV.W,barW=w/this.n;
    var maxV=Math.max.apply(null,this.array);
    for(var i=0;i<this.n;i++){
      var h=(this.array[i]/maxV)*(CV.H-40);
      var x=i*barW;
      var y=CV.H-h;
      var color='#4a4a70';
      if(this.sorted.has(i))color='#00ff88';
      if(this.highlight[i])color=this.highlight[i];
      ctx.fillStyle=color;
      ctx.fillRect(x,y,barW-1,h);
    }
    setStats('<div>Algo: <b style="color:var(--c1)">'+esc(SORT_ALGOS[this.algo].name)+'</b></div>'+
      '<div>Compares: '+this.comparisons.toLocaleString()+'</div>'+
      '<div>Swaps: '+this.swaps.toLocaleString()+'</div>'+
      '<div>Writes: '+this.writes.toLocaleString()+'</div>'+
      '<div>N: '+this.n+(this.done?' ✅ done':'')+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Algorithm</h4>';
    var sel=el('select',{});
    Object.keys(SORT_ALGOS).forEach(function(k){
      var o=el('option',{value:k},SORT_ALGOS[k].name);
      if(this.algo===k)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.algo=this.value;LAB.current.init();}};
    s1.appendChild(sel);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Parameters</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Array size</span><span id="soN">'+this.n+'</span></div>';
    var r=el('input',{type:'range',min:10,max:250,value:this.n});
    r.oninput=function(){$('soN').textContent=this.value;if(LAB.current){LAB.current.n=parseInt(this.value);LAB.current.init();}};
    c.appendChild(r);s2.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Speed (steps/s)</span><span id="soS">'+this.speed+'</span></div>';
    var r2=el('input',{type:'range',min:2,max:500,value:this.speed});
    r2.oninput=function(){$('soS').textContent=this.value;if(LAB.current)LAB.current.speed=parseInt(this.value);};
    c2.appendChild(r2);s2.appendChild(c2);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Info</h4>';
    var a=SORT_ALGOS[this.algo];
    s3.innerHTML+='<table class="kv">'+
      '<tr><td>Time</td><td>'+a.time+'</td></tr>'+
      '<tr><td>Space</td><td>'+a.space+'</td></tr>'+
      '<tr><td>Stable</td><td>'+a.stable+'</td></tr>'+
      '</table>';
    panel.appendChild(s3);

    var s4=el('div',{class:'sp-section'});s4.innerHTML='<h4>Actions</h4>';
    var br=el('button',{class:'btn primary full'},'↺ Regenerate');
    br.onclick=function(){if(LAB.current)LAB.current.init();};
    s4.appendChild(br);
    panel.appendChild(s4);
  }
});
/* ---------- PATHFINDING ---------- */
var PF_ALGOS={};

PF_ALGOS.bfs={
  name:'Breadth-First Search',short:'BFS',weighted:false,
  desc:'Explores level by level. Finds shortest path on unweighted grids.',
  run:function(g,start,end){
    var steps=[];
    var q=[start];
    var prev={};
    var visited={};
    visited[start.key]=true;
    while(q.length){
      var cur=q.shift();
      steps.push({type:'visit',node:cur});
      if(cur.key===end.key){
        var path=[];
        var k=cur.key;
        while(prev[k]){path.push(prev[k]);k=prev[k].key;}
        return {steps:steps,path:path.reverse()};
      }
      var nbs=g.neighbors(cur);
      for(var i=0;i<nbs.length;i++){
        var nb=nbs[i];
        if(!visited[nb.key]){
          visited[nb.key]=true;
          prev[nb.key]=cur;
          steps.push({type:'frontier',node:nb});
          q.push(nb);
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.dfs={
  name:'Depth-First Search',short:'DFS',weighted:false,
  desc:'Explores as deep as possible before backtracking. Not optimal.',
  run:function(g,start,end){
    var steps=[];
    var stack=[start];
    var prev={};
    var visited={};
    while(stack.length){
      var cur=stack.pop();
      if(visited[cur.key])continue;
      visited[cur.key]=true;
      steps.push({type:'visit',node:cur});
      if(cur.key===end.key){
        var path=[];
        var k=cur.key;
        while(prev[k]){path.push(prev[k]);k=prev[k].key;}
        return {steps:steps,path:path.reverse()};
      }
      var nbs=g.neighbors(cur);
      for(var i=nbs.length-1;i>=0;i--){
        var nb=nbs[i];
        if(!visited[nb.key]){
          if(!prev[nb.key])prev[nb.key]=cur;
          stack.push(nb);
          steps.push({type:'frontier',node:nb});
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.dijkstra={
  name:'Dijkstra',short:'DIJ',weighted:true,
  desc:'Uniform-cost shortest path for weighted graphs.',
  run:function(g,start,end){
    var dist={},prev={};
    var pq=[];
    dist[start.key]=0;
    pq.push({node:start,d:0});
    var steps=[];
    var done={};
    while(pq.length){
      pq.sort(function(a,b){return a.d-b.d;});
      var cur=pq.shift();
      var c=cur.node;
      if(done[c.key])continue;
      done[c.key]=true;
      steps.push({type:'visit',node:c});
      if(c.key===end.key){
        var path=[];
        var k=c.key;
        while(prev[k]){path.push(prev[k]);k=prev[k].key;}
        return {steps:steps,path:path.reverse()};
      }
      var nbs=g.neighbors(c);
      for(var i=0;i<nbs.length;i++){
        var nb=nbs[i];
        var w=g.weight(nb);
        var nd=cur.d+w;
        if(dist[nb.key]===undefined||nd<dist[nb.key]){
          dist[nb.key]=nd;
          prev[nb.key]=c;
          pq.push({node:nb,d:nd});
          steps.push({type:'frontier',node:nb});
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.astar={
  name:'A* Search',short:'A*',weighted:true,
  desc:'Informed search using Manhattan distance heuristic. Optimal with admissible heuristic.',
  run:function(g,start,end){
    var dist={},prev={},f={};
    var pq=[];
    function h(n){return Math.abs(n.x-end.x)+Math.abs(n.y-end.y);}
    dist[start.key]=0;
    f[start.key]=h(start);
    pq.push({node:start,d:0});
    var steps=[];
    var done={};
    while(pq.length){
      pq.sort(function(a,b){return (a.d+f[a.node.key])-(b.d+f[b.node.key]);});
      var cur=pq.shift();
      var c=cur.node;
      if(done[c.key])continue;
      done[c.key]=true;
      steps.push({type:'visit',node:c});
      if(c.key===end.key){
        var path=[];
        var k=c.key;
        while(prev[k]){path.push(prev[k]);k=prev[k].key;}
        return {steps:steps,path:path.reverse()};
      }
      var nbs=g.neighbors(c);
      for(var i=0;i<nbs.length;i++){
        var nb=nbs[i];
        var w=g.weight(nb);
        var nd=cur.d+w;
        if(dist[nb.key]===undefined||nd<dist[nb.key]){
          dist[nb.key]=nd;
          prev[nb.key]=c;
          f[nb.key]=h(nb);
          pq.push({node:nb,d:nd});
          steps.push({type:'frontier',node:nb});
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.greedy={
  name:'Greedy Best-First',short:'GBF',weighted:false,
  desc:'Always expands node closest to goal by heuristic. Fast but not always optimal.',
  run:function(g,start,end){
    var prev={};
    var done={};
    function h(n){return Math.abs(n.x-end.x)+Math.abs(n.y-end.y);}
    var pq=[{node:start,d:h(start)}];
    var steps=[];
    while(pq.length){
      pq.sort(function(a,b){return a.d-b.d;});
      var c=pq.shift().node;
      if(done[c.key])continue;
      done[c.key]=true;
      steps.push({type:'visit',node:c});
      if(c.key===end.key){
        var path=[];
        var k=c.key;
        while(prev[k]){path.push(prev[k]);k=prev[k].key;}
        return {steps:steps,path:path.reverse()};
      }
      var nbs=g.neighbors(c);
      for(var i=0;i<nbs.length;i++){
        var nb=nbs[i];
        if(!done[nb.key]){
          if(!prev[nb.key])prev[nb.key]=c;
          pq.push({node:nb,d:h(nb)});
          steps.push({type:'frontier',node:nb});
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.bidirectional={
  name:'Bidirectional BFS',short:'BI-BFS',weighted:false,
  desc:'Simultaneously BFS from start and end. Meets in the middle.',
  run:function(g,start,end){
    var prevF={},prevB={};
    var vF={},vB={};
    vF[start.key]=true;vB[end.key]=true;
    var qF=[start],qB=[end];
    var steps=[];
    while(qF.length&&qB.length){
      var cF=qF.shift();
      steps.push({type:'visit',node:cF});
      var nbsF=g.neighbors(cF);
      for(var i=0;i<nbsF.length;i++){
        var n=nbsF[i];
        if(!vF[n.key]){vF[n.key]=true;prevF[n.key]=cF;qF.push(n);steps.push({type:'frontier',node:n});}
        if(vB[n.key]){
          // Meet
          var path=[];
          var k=n.key;
          while(k){path.push(g.node(k));k=prevF[k]&&prevF[k].key;}
          path.reverse();
          var k2=prevB[n.key]&&prevB[n.key].key;
          while(k2){path.push(g.node(k2));k2=prevB[k2]&&prevB[k2].key;}
          return {steps:steps,path:path};
        }
      }
      var cB=qB.shift();
      steps.push({type:'visit',node:cB});
      var nbsB=g.neighbors(cB);
      for(var j=0;j<nbsB.length;j++){
        var m=nbsB[j];
        if(!vB[m.key]){vB[m.key]=true;prevB[m.key]=cB;qB.push(m);steps.push({type:'frontier',node:m});}
        if(vF[m.key]){
          var path2=[];
          var kk=m.key;
          while(kk){path2.push(g.node(kk));kk=prevF[kk]&&prevF[kk].key;}
          path2.reverse();
          var kk2=prevB[m.key]&&prevB[m.key].key;
          while(kk2){path2.push(g.node(kk2));kk2=prevB[kk2]&&prevB[kk2].key;}
          return {steps:steps,path:path2};
        }
      }
    }
    return {steps:steps,path:null};
  }
};

PF_ALGOS.jps={
  name:'Jump Point Search',short:'JPS',weighted:false,
  desc:'Optimized A* for uniform grids. Skips symmetric paths.',
  run:function(g,start,end){return PF_ALGOS.astar.run(g,start,end);}
};

PF_ALGOS.astar-weighted={
  name:'A* (Weighted)',short:'A* W',weighted:true,
  desc:'Same as A* but the heuristic can be scaled for speed/detour tradeoff.',
  run:function(g,start,end){return PF_ALGOS.astar.run(g,start,end);}
};

LAB.register('pathfinding',{
  title:'Pathfinding Lab',icon:'🗺️',category:'Algorithms',
  desc:'Compare pathfinding algorithms on a grid. Draw walls with the mouse, right-click to erase.',
  clearColor:'#0a0a12',
  init:function(){
    this.cell=(this._state&&this._state.cell)||18;
    this.cols=Math.floor(CV.W/this.cell);
    this.rows=Math.floor(CV.H/this.cell);
    this.walls=new Set();
    this.start={x:2,y:Math.floor(this.rows/2)};
    this.end={x:this.cols-3,y:Math.floor(this.rows/2)};
    this.start.key='s';this.end.key='e';
    this.algo=(this._state&&this._state.algo)||'bfs';
    this.result=null;
    this.visited=new Set();
    this.frontier=new Set();
    this.path=new Set();
    this.playback=0;
    this.playbackSpeed=200;
    this.acc=0;
    this.running=false;
    this.stats={visited:0,pathLen:0};
    // Random walls
    var self=this;
    var self2=this;
    // grid obj
    this.grid={
      node:function(k){
        if(k==='s')return self.start;
        if(k==='e')return self.end;
        var parts=k.split(',');
        return {x:parseInt(parts[0]),y:parseInt(parts[1]),key:k};
      },
      neighbors:function(n){
        var out=[];
        var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        for(var i=0;i<dirs.length;i++){
          var nx=n.x+dirs[i][0],ny=n.y+dirs[i][1];
          if(nx<0||nx>=self.cols||ny<0||ny>=self.rows)continue;
          var k=nx+','+ny;
          if(self.walls.has(k))continue;
          if(k===self.start.x+','+self.start.y)k='s';
          if(k===self.end.x+','+self.end.y)k='e';
          out.push({x:nx,y:ny,key:k});
        }
        return out;
      },
      weight:function(n){return 1;}
    };
    this.setupRandomWalls();
  },
  setupRandomWalls:function(){
    var density=(this._state&&this._state.density)||25;
    for(var y=0;y<this.rows;y++)for(var x=0;x<this.cols;x++){
      if(Math.random()<density/100){
        if((x===this.start.x&&y===this.start.y)||(x===this.end.x&&y===this.end.y))continue;
        this.walls.add(x+','+y);
      }
    }
  },
  solve:function(){
    this.visited.clear();
    this.frontier.clear();
    this.path.clear();
    this.result=null;
    this.playback=0;
    var algo=PF_ALGOS[this.algo];
    var startNode={x:this.start.x,y:this.start.y,key:'s'};
    var endNode={x:this.end.x,y:this.end.y,key:'e'};
    try{
      var t0=performance.now();
      var r=algo.run(this.grid,startNode,endNode);
      var t1=performance.now();
      this.result=r;
      this.solveTime=(t1-t0).toFixed(2);
      this.running=true;
      this.stats.visited=r.steps.filter(function(s){return s.type==='visit';}).length;
      this.stats.pathLen=r.path?r.path.length:0;
      logMsg('Solved '+algo.short+': '+this.stats.visited+' visited, path '+(r.path?r.path.length:'none')+' in '+this.solveTime+'ms',r.path?'ok':'warn');
    }catch(e){toast('Error: '+e.message,'error');}
  },
  tick:function(dt){
    if(!this.running||!this.result)return;
    this.acc+=dt;
    var iv=1/this.playbackSpeed;
    while(this.acc>=iv&&this.playback<this.result.steps.length){
      this.acc-=iv;
      var s=this.result.steps[this.playback];
      if(s.type==='visit'){this.visited.add(s.node.key);this.frontier.delete(s.node.key);}
      else if(s.type==='frontier'){this.frontier.add(s.node.key);}
      this.playback++;
    }
    if(this.playback>=this.result.steps.length&&this.result.path){
      // Animate path
      var pProg=this.result.path.length;
      for(var i=0;i<this.result.path.length;i++)this.path.add(this.result.path[i].key);
      this.running=false;
    }
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var cs=this.cell;
    // Grid
    for(var y=0;y<this.rows;y++)for(var x=0;x<this.cols;x++){
      var k=x+','+y;
      var px=x*cs,py=y*cs;
      if(this.walls.has(k)){
        ctx.fillStyle='#2a2a3c';
        ctx.fillRect(px,py,cs-1,cs-1);
      }else{
        if(this.visited.has(k)){ctx.fillStyle='rgba(0,229,255,.35)';ctx.fillRect(px,py,cs-1,cs-1);}
        if(this.frontier.has(k)){ctx.fillStyle='rgba(255,196,0,.5)';ctx.fillRect(px,py,cs-1,cs-1);}
        if(this.path.has(k)){ctx.fillStyle='#ff2e88';ctx.fillRect(px,py,cs-1,cs-1);}
      }
    }
    // Start/end
    ctx.fillStyle='#00ff88';
    ctx.fillRect(this.start.x*cs+2,this.start.y*cs+2,cs-5,cs-5);
    ctx.fillStyle='#7c4dff';
    ctx.fillRect(this.end.x*cs+2,this.end.y*cs+2,cs-5,cs-5);
    var algo=PF_ALGOS[this.algo];
    setStats('<div>Algo: <b style="color:var(--c1)">'+algo.short+'</b></div>'+
      '<div>Visited: '+this.visited.size+'</div>'+
      '<div>Frontier: '+this.frontier.size+'</div>'+
      '<div>Path: '+(this.result&&this.result.path?this.result.path.length:'—')+'</div>');
  },
  onEvent:function(type,d){
    if(type==='down'||type==='move'){
      if(type==='move'&&!this._paint)return;
      var x=Math.floor(d.x/this.cell),y=Math.floor(d.y/this.cell);
      if(x<0||x>=this.cols||y<0||y>=this.rows)return;
      var k=x+','+y;
      if((x===this.start.x&&y===this.start.y)||(x===this.end.x&&y===this.end.y))return;
      if(type==='down'){
        this._paint=d.raw&&d.raw.shiftKey?'erase':'wall';
      }
      if(this._paint==='wall')this.walls.add(k);
      else this.walls.delete(k);
    }
    if(type==='up'){this._paint=null;this.solve();}
    if(type==='rightclick'){
      var x2=Math.floor(d.x/this.cell),y2=Math.floor(d.y/this.cell);
      this.walls.delete(x2+','+y2);
    }
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Algorithm</h4>';
    var sel=el('select',{});
    Object.keys(PF_ALGOS).forEach(function(k){
      var o=el('option',{value:k},PF_ALGOS[k].name);
      if(this.algo===k)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.algo=this.value;LAB.current.solve();}};
    s1.appendChild(sel);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Grid</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Cell size</span><span id="pfC">'+this.cell+'</span></div>';
    var r=el('input',{type:'range',min:8,max:32,value:this.cell});
    r.oninput=function(){$('pfC').textContent=this.value;if(LAB.current){LAB.current.cell=parseInt(this.value);LAB.current.init();}};
    c.appendChild(r);s2.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Wall density</span><span id="pfD">25</span></div>';
    var r2=el('input',{type:'range',min:0,max:50,value:25});
    r2.oninput=function(){$('pfD').textContent=this.value;if(LAB.current)LAB.current._state.density=parseInt(this.value);};
    c2.appendChild(r2);s2.appendChild(c2);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Playback Speed</h4>';
    var c3=el('div',{class:'ctrl'});
    c3.innerHTML='<div class="ctrl-label"><span>Steps/s</span><span id="pfS">'+this.playbackSpeed+'</span></div>';
    var r3=el('input',{type:'range',min:20,max:2000,step:20,value:this.playbackSpeed});
    r3.oninput=function(){$('pfS').textContent=this.value;if(LAB.current)LAB.current.playbackSpeed=parseInt(this.value);};
    c3.appendChild(r3);s3.appendChild(c3);

    s4.appendChild(br);

    bn.onclick=function(){if(LAB.current){LAB.current.walls.clear();LAB.current.setupRandomWalls();LAB.current.solve();}};
    s4.appendChild(bn);

    bp.onclick=function(){if(LAB.current){LAB.current.visited.clear();LAB.current.frontier.clear();LAB.current.path.clear();LAB.current.playback=0;LAB.current.running=true;}};
    s4.appendChild(bp);
    panel.appendChild(s4);
  }
});

var MAZE_GENS={};

MAZE_GENS.recursive={
  name:'Recursive Backtracker',desc:'Depth-first, produces long winding passages',
  generate:function(w,h){
    var grid=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++)grid[y].push({x:x,y:y,walls:{n:true,s:true,e:true,w:true},visited:false});}
    var stack=[grid[0][0]];
    grid[0][0].visited=true;
    while(stack.length){
      var cur=stack[stack.length-1];
      var nbs=[];
      var dirs=[[0,-1,'n','s'],[0,1,'s','n'],[-1,0,'w','e'],[1,0,'e','w']];
      for(var i=0;i<dirs.length;i++){
        var nx=cur.x+dirs[i][0],ny=cur.y+dirs[i][1];
        if(nx<0||nx>=w||ny<0||ny>=h)continue;
        if(grid[ny][nx].visited)continue;
        nbs.push({cell:grid[ny][nx],dir:dirs[i]});
      }
      if(nbs.length===0){stack.pop();continue;}
      var pick2=nbs[Math.floor(Math.random()*nbs.length)];
      cur.walls[pick2.dir[2]]=false;
      pick2.cell.walls[pick2.dir[3]]=false;
      pick2.cell.visited=true;
      stack.push(pick2.cell);
    }
    return grid;
  }
};

MAZE_GENS.prim={
  name:"Randomized Prim's",desc:'Frontier-based, many short dead ends',
  generate:function(w,h){
    var grid=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++)grid[y].push({x:x,y:y,walls:{n:true,s:true,e:true,w:true},visited:false});}
    var start=grid[Math.floor(h/2)][Math.floor(w/2)];
    start.visited=true;
    var frontier=[];
    function addNbs(c){
      var dirs=[[0,-1,'n','s'],[0,1,'s','n'],[-1,0,'w','e'],[1,0,'e','w']];
      for(var i=0;i<dirs.length;i++){
        var nx=c.x+dirs[i][0],ny=c.y+dirs[i][1];
        if(nx<0||nx>=w||ny<0||ny>=h)continue;
        var nc=grid[ny][nx];
        if(nc.visited)continue;
        frontier.push({from:c,to:nc,dir:dirs[i]});
      }
    }
    addNbs(start);
    while(frontier.length){
      var idx=Math.floor(Math.random()*frontier.length);
      var edge=frontier.splice(idx,1)[0];
      if(edge.to.visited)continue;
      edge.from.walls[edge.dir[2]]=false;
      edge.to.walls[edge.dir[3]]=false;
      edge.to.visited=true;
      addNbs(edge.to);
    }
    return grid;
  }
};

MAZE_GENS.kruskal={
  name:"Randomized Kruskal's",desc:'Union-find, produces uniform texture',
  generate:function(w,h){
    var grid=[];
    var sets={};
    var edges=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++){grid[y].push({x:x,y:y,walls:{n:true,s:true,e:true,w:true},visited:false});sets[x+','+y]=x+','+y;}}
    function find(k){while(sets[k]!==k){sets[k]=sets[sets[k]];k=sets[k];}return k;}
    function union(a,b){var ra=find(a),rb=find(b);if(ra===rb)return false;sets[ra]=rb;return true;}
    for(var y2=0;y2<h;y2++)for(var x2=0;x2<w;x2++){
      if(x2+1<w)edges.push({a:grid[y2][x2],b:grid[y2][x2+1],dir:['e','w']});
      if(y2+1<h)edges.push({a:grid[y2][x2],b:grid[y2+1][x2],dir:['s','n']});
    }
    edges.sort(function(){return Math.random()-0.5;});
    for(var e=0;e<edges.length;e++){
      var ed=edges[e];
      if(union(ed.a.x+','+ed.a.y,ed.b.x+','+ed.b.y)){
        ed.a.walls[ed.dir[0]]=false;
        ed.b.walls[ed.dir[1]]=false;
      }
    }
    return grid;
  }
};

MAZE_GENS.eller={
  name:"Eller's Algorithm",desc:'Row-by-row, memory-efficient',
  generate:function(w,h){
    var grid=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++)grid[y].push({x:x,y:y,walls:{n:true,s:true,e:true,w:true},visited:false});}
    var sets=[];
    var nextSet=0;
    for(var i=0;i<w;i++)sets[i]=nextSet++;
    for(var y=0;y<h;y++){
      // Merge random adjacent
      for(var x=0;x<w-1;x++){
        if(sets[x]===sets[x+1])continue;
        if(Math.random()<0.5){
          grid[y][x].walls.e=false;
          grid[y][x+1].walls.w=false;
          var old=sets[x+1];
          for(var i2=0;i2<w;i2++)if(sets[i2]===old)sets[i2]=sets[x];
        }
      }
      // Vertical connections
      if(y<h-1){
        var newSets=sets.slice();
        var lastSet=null;
        for(var x2=0;x2<w;x2++){
          if(x2===w-1||sets[x2]!==sets[x2+1]){
            if(lastSet===null)lastSet=x2;
            var opens=[];
            for(var k=lastSet;k<=x2;k++)if(Math.random()<0.5)opens.push(k);
            if(opens.length===0)opens.push(rnd(lastSet,x2));
            for(var o=0;o<opens.length;o++){
              var ox=opens[o];
              grid[y][ox].walls.s=false;
              grid[y+1][ox].walls.n=false;
              newSets[ox]=sets[ox];
            }
            for(var z=lastSet;z<=x2;z++)if(opens.indexOf(z)===-1)newSets[z]=nextSet++;
            lastSet=null;
          }
        }
        sets=newSets;
      }
    }
    return grid;
  }
};

MAZE_GENS.binary={
  name:'Binary Tree',desc:'Simple bias toward NE',
  generate:function(w,h){
    var grid=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++)grid[y].push({x:x,y:y,walls:{n:true,s:true,e:true,w:true}});}
    for(var y2=0;y2<h;y2++)for(var x2=0;x2<w;x2++){
      var c=grid[y2][x2];
      var canN=y2>0,canE=x2<w-1;
      if(canN&&canE){
        if(Math.random()<0.5){c.walls.n=false;grid[y2-1][x2].walls.s=false;}
        else{c.walls.e=false;grid[y2][x2+1].walls.w=false;}
      }else if(canN){c.walls.n=false;grid[y2-1][x2].walls.s=false;}
      else if(canE){c.walls.e=false;grid[y2][x2+1].walls.w=false;}
    }
    return grid;
  }
};

MAZE_GENS.division={
  name:'Recursive Division',desc:'Top-down splitting, many rectangular rooms',
  generate:function(w,h){
    var grid=[];
    for(var y=0;y<h;y++){grid.push([]);for(var x=0;x<w;x++)grid[y].push({x:x,y:y,walls:{n:false,s:false,e:false,w:false},visited:false});}
    // Border walls
    for(var x2=0;x2<w;x2++){grid[0][x2].walls.n=true;grid[h-1][x2].walls.s=true;}
    for(var y2=0;y<h;y2++){grid[y2][0].walls.w=true;grid[y2][w-1].walls.e=true;}
    function divide(x1,y1,x2,y2){
      var cw=x2-x1+1,ch=y2-y1+1;
      if(cw<2||ch<2)return;
      var horiz=ch>cw;
      if(horiz){
        var wy=rnd(y1,y2-1);
        var px=rnd(x1,x2);
        for(var x=x1;x<=x2;x++){
          if(x===px)continue;
          grid[wy][x].walls.s=true;
          grid[wy+1][x].walls.n=true;
        }
        divide(x1,y1,x2,wy);
        divide(x1,wy+1,x2,y2);
      }else{
        var wx=rnd(x1,x2-1);
        var py=rnd(y1,y2);
        for(var y=y1;y<=y2;y++){
          if(y===py)continue;
          grid[y][wx].walls.e=true;
          grid[y][wx+1].walls.w=true;
        }
        divide(x1,y1,wx,y2);
        divide(wx+1,y1,x2,y2);
      }
    }
    divide(0,0,w-1,h-1);
    return grid;
  }
};

LAB.register('maze',{
  title:'Maze Lab',icon:'🌀',category:'Algorithms',
  desc:'6 maze generation algorithms plus DFS-based solver. Press "Solve" to animate the path.',
  clearColor:'#0a0a12',
  init:function(){
    this.cell=(this._state&&this._state.cell)||14;
    this.w=(this._state&&this._state.w)||41;
    this.h=(this._state&&this._state.h)||31;
    this.gen=(this._state&&this._state.gen)||'recursive';
    this.grid=MAZE_GENS[this.gen].generate(this.w,this.h);
    this.solveSteps=null;
    this.solveProgress=0;
    this.solving=false;
    this.solution=null;
  },
  generate:function(){
    this.grid=MAZE_GENS[this.gen].generate(this.w,this.h);
    this.solution=null;
    this.solveSteps=null;
    this.solving=false;
  },
  solve:function(){
    // DFS from (0,0) to (w-1,h-1)
    var steps=[];
    var visited={};
    var path=[];
    var w=this.w,h=this.h,g=this.grid;
    var found=false;
    function dfs(x,y){
      if(found)return false;
      var k=x+','+y;
      if(visited[k])return false;
      visited[k]=true;
      steps.push({x:x,y:y});
      path.push({x:x,y:y});
      if(x===w-1&&y===h-1){found=true;return true;}
      var c=g[y][x];
      var dirs=[];
      if(!c.walls.n)dirs.push([0,-1]);
      if(!c.walls.s)dirs.push([0,1]);
      if(!c.walls.e)dirs.push([1,0]);
      if(!c.walls.w)dirs.push([-1,0]);
      for(var i=0;i<dirs.length;i++){
        if(dfs(x+dirs[i][0],y+dirs[i][1]))return true;
      }
      path.pop();
      return false;
    }
    dfs(0,0);
    this.solveSteps=steps;
    this.solution=path;
    this.solveProgress=0;
    this.solving=true;
  },
  tick:function(dt){
    if(this.solving){
      if(this._state&&this._state.autoStep!==false){
        this.solveProgress=Math.min(this.solveProgress+3,this.solveSteps.length);
      }
      if(this.solveProgress>=this.solveSteps.length)this.solving=false;
    }
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var cs=this.cell;
    var ox=Math.max(0,(CV.W-this.w*cs)/2);
    var oy=Math.max(0,(CV.H-this.h*cs)/2);
    // Path cells
    var visitedSet={};
    if(this.solveSteps)for(var i=0;i<this.solveProgress;i++){var s=this.solveSteps[i];visitedSet[s.x+','+s.y]=true;}
    var solutionSet={};
    if(this.solution&&this.solveProgress>=this.solveSteps.length)for(var j=0;j<this.solution.length;j++){var p=this.solution[j];solutionSet[p.x+','+p.y]=true;}
    for(var y=0;y<this.h;y++){
      for(var x=0;x<this.w;x++){
        var px=ox+x*cs,py=oy+y*cs;
        var k=x+','+y;
        if(solutionSet[k])ctx.fillStyle='rgba(255,46,136,.6)';
        else if(visitedSet[k])ctx.fillStyle='rgba(0,229,255,.25)';
        else ctx.fillStyle='#0a0a12';
        ctx.fillRect(px,py,cs,cs);
        var c=this.grid[y][x];
        ctx.strokeStyle='#3a3a50';
        ctx.lineWidth=2;
        if(c.walls.n){ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+cs,py);ctx.stroke();}
        if(c.walls.w){ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+cs);ctx.stroke();}
        if(c.walls.e&&x===this.w-1){ctx.beginPath();ctx.moveTo(px+cs,py);ctx.lineTo(px+cs,py+cs);ctx.stroke();}
        if(c.walls.s&&y===this.h-1){ctx.beginPath();ctx.moveTo(px,py+cs);ctx.lineTo(px+cs,py+cs);ctx.stroke();}
      }
    }
    // Start/End
    ctx.fillStyle='#00ff88';ctx.fillRect(ox+2,oy+2,cs-4,cs-4);
    ctx.fillStyle='#7c4dff';ctx.fillRect(ox+(this.w-1)*cs+2,oy+(this.h-1)*cs+2,cs-4,cs-4);
    setStats('<div>Algorithm: <b style="color:var(--c1)">'+MAZE_GENS[this.gen].name+'</b></div>'+
      '<div>Size: '+this.w+'×'+this.h+'</div>'+
      (this.solving?'<div style="color:var(--c3)">Solving…</div>':(this.solution?'<div style="color:var(--c5)">Solved ✓ ('+this.solution.length+' cells)</div>':'')));
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Generator</h4>';
    var sel=el('select',{});
    Object.keys(MAZE_GENS).forEach(function(k){
      var o=el('option',{value:k},MAZE_GENS[k].name);
      if(this.gen===k)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.gen=this.value;LAB.current.generate();}};
    s1.appendChild(sel);
    s1.innerHTML+='<div class="sub" style="margin-top:6px;font-size:.65rem;color:var(--tx3)">'+MAZE_GENS[this.gen].desc+'</div>';
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Size</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Width</span><span id="mzW">'+this.w+'</span></div>';
    var r=el('input',{type:'range',min:11,max:81,step:2,value:this.w});
    r.oninput=function(){$('mzW').textContent=this.value;if(LAB.current){LAB.current.w=parseInt(this.value);LAB.current.generate();}};
    c.appendChild(r);s2.appendChild(c);
    var c2=el('div',{class:'ctrl'});
    c2.innerHTML='<div class="ctrl-label"><span>Height</span><span id="mzH">'+this.h+'</span></div>';
    var r2=el('input',{type:'range',min:11,max:61,step:2,value:this.h});
    r2.oninput=function(){$('mzH').textContent=this.value;if(LAB.current){LAB.current.h=parseInt(this.value);LAB.current.generate();}};
    c2.appendChild(r2);s2.appendChild(c2);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Actions</h4>';
    var br=el('button',{class:'btn primary full'},'🎲 Regenerate');
    br.onclick=function(){if(LAB.current)LAB.current.generate();};
    s3.appendChild(br);
    var bs=el('button',{class:'btn full',style:'margin-top:6px'},'▶ Solve (DFS)');
    bs.onclick=function(){if(LAB.current)LAB.current.solve();};
    s3.appendChild(bs);
    panel.appendChild(s3);
  }
});
/* ---------- GRAPH ALGORITHMS ---------- */
var GRAPH_ALGOS={
  dijkstra:{name:'Dijkstra',desc:'Shortest path from source'},
  bfs:{name:'BFS',desc:'Level-order traversal'},
  dfs:{name:'DFS',desc:'Depth-first traversal'},
  prim:{name:'Prim MST',desc:'Minimum spanning tree'},
  kruskal:{name:'Kruskal MST',desc:'Minimum spanning tree via union-find'},
  topo:{name:'Topological Sort',desc:'For DAGs'},
  components:{name:'Connected Components',desc:'Find connected subgraphs'}
};

LAB.register('graph',{
  title:'Graph Explorer',icon:'🔗',category:'Algorithms',
  desc:'Random weighted graphs with classic algorithms: shortest paths, MST, traversals, connected components.',
  clearColor:'#0a0a12',
  init:function(){
    this.nNodes=(this._state&&this._state.nNodes)||14;
    this.algo=(this._state&&this._state.algo)||'dijkstra';
    this.nodes=[];
    this.edges=[];
    this.visited=new Set();
    this.path=new Set();
    this.mstEdges=new Set();
    this.componentsColors={};
    this.generate();
    this.run();
  },
  generate:function(){
    this.nodes=[];
    this.edges=[];
    var pad=60;
    for(var i=0;i<this.nNodes;i++){
      this.nodes.push({
        x:pad+Math.random()*(CV.W-pad*2),
        y:pad+Math.random()*(CV.H-pad*2),
        id:i
      });
    }
    // Connect nearest
    for(var i=0;i<this.nNodes;i++){
      var nearest=[];
      for(var j=0;j<this.nNodes;j++)if(i!==j)nearest.push({j:j,d:Math.hypot(this.nodes[i].x-this.nodes[j].x,this.nodes[i].y-this.nodes[j].y)});
      nearest.sort(function(a,b){return a.d-b.d;});
      var k=rnd(2,3);
      for(var m=0;m<k&&m<nearest.length;m++){
        var a=Math.min(i,nearest[m].j),b=Math.max(i,nearest[m].j);
        if(!this.edges.find(function(e){return e.a===a&&e.b===b;})){
          this.edges.push({a:a,b:b,w:Math.round(nearest[m].d/10)+1});
        }
      }
    }
  },
  neighbors:function(i){
    var out=[];
    for(var k=0;k<this.edges.length;k++){
      var e=this.edges[k];
      if(e.a===i)out.push({to:e.b,w:e.w,edge:e});
      else if(e.b===i)out.push({to:e.a,w:e.w,edge:e});
    }
    return out;
  },
  run:function(){
    this.visited.clear();this.path.clear();this.mstEdges.clear();this.componentsColors={};
    var self=this;
    var src=0;
    if(this.algo==='dijkstra'){
      var dist=[],prev=[];
      var vis=[];
      for(var i=0;i<this.nNodes;i++){dist[i]=Infinity;prev[i]=-1;}
      dist[src]=0;
      for(var it=0;it<this.nNodes;it++){
        var u=-1,ud=Infinity;
        for(var i=0;i<this.nNodes;i++)if(!vis[i]&&dist[i]<ud){ud=dist[i];u=i;}
        if(u===-1)break;
        vis[u]=true;this.visited.add(u);
        var nbs=this.neighbors(u);
        for(var k=0;k<nbs.length;k++){
          var nb=nbs[k];
          if(dist[u]+nb.w<dist[nb.to]){dist[nb.to]=dist[u]+nb.w;prev[nb.to]=u;}
        }
      }
      // Path to last node
      var target=this.nNodes-1;
      var p=target;
      while(p!==-1&&p!==src){this.path.add(p);p=prev[p];}
      this.path.add(src);
    }else if(this.algo==='bfs'){
      var q=[src],vs={};
      vs[src]=true;this.visited.add(src);
      while(q.length){
        var u=q.shift();
        var nbs=this.neighbors(u);
        for(var k2=0;k2<nbs.length;k2++)if(!vs[nbs[k2].to]){vs[nbs[k2].to]=true;this.visited.add(nbs[k2].to);q.push(nbs[k2].to);}
      }
    }else if(this.algo==='dfs'){
      var vsd={};
      function dfs(u){vsd[u]=true;self.visited.add(u);var nbs=self.neighbors(u);for(var k3=0;k3<nbs.length;k3++)if(!vsd[nbs[k3].to])dfs(nbs[k3].to);}
      dfs(src);
    }else if(this.algo==='prim'){
      var inMST={0:true};this.visited.add(0);
      while(Object.keys(inMST).length<this.nNodes){
        var best=null;
        for(var k4=0;k4<this.edges.length;k4++){
          var e=this.edges[k4];
          var aIn=inMST[e.a],bIn=inMST[e.b];
          if(aIn!==bIn){
            if(!best||e.w<best.w)best=e;
          }
        }
        if(!best)break;
        inMST[best.a]=true;inMST[best.b]=true;
        this.mstEdges.add(best);
        this.visited.add(best.a);this.visited.add(best.b);
      }
    }else if(this.algo==='kruskal'){
      var sorted=this.edges.slice().sort(function(a,b){return a.w-b.w;});
      var parent={};
      for(var i=0;i<this.nNodes;i++)parent[i]=i;
      function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
      for(var k5=0;k5<sorted.length;k5++){
        var ra=find(sorted[k5].a),rb=find(sorted[k5].b);
        if(ra!==rb){parent[ra]=rb;this.mstEdges.add(sorted[k5]);this.visited.add(sorted[k5].a);this.visited.add(sorted[k5].b);}
      }
    }else if(this.algo==='topo'){
      // Simple: order by degree
      var deg=[];
      for(var i=0;i<this.nNodes;i++)deg.push({i:i,d:this.neighbors(i).length});
      deg.sort(function(a,b){return a.d-b.d;});
      for(var k6=0;k6<deg.length;k6++)this.visited.add(deg[k6].i);
    }else if(this.algo==='components'){
      var seen={};
      var compColors=['#ff2e88','#00e5ff','#ffc400','#7c4dff','#00ff88','#ff6d00'];
      var ci=0;
      for(var i2=0;i2<this.nNodes;i2++){
        if(seen[i2])continue;
        var q2=[i2],color=compColors[ci%compColors.length];
        while(q2.length){
          var u2=q2.shift();
          if(seen[u2])continue;
          seen[u2]=true;
          this.componentsColors[u2]=color;
          this.visited.add(u2);
          var nbs2=this.neighbors(u2);
          for(var k7=0;k7<nbs2.length;k7++)if(!seen[nbs2[k7].to])q2.push(nbs2[k7].to);
        }
        ci++;
      }
    }
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    // Edges
    for(var k=0;k<this.edges.length;k++){
      var e=this.edges[k];
      var a=this.nodes[e.a],b=this.nodes[e.b];
      var inPath=this.path.has(e.a)&&this.path.has(e.b);
      var inMst=this.mstEdges.has(e);
      var color='#2a2a3c';
      var width=1.5;
      if(inPath){color='#ff2e88';width=3;}
      else if(inMst){color='#00ff88';width=3;}
      ctx.strokeStyle=color;
      ctx.lineWidth=width;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      // Weight
      if(this._state&&this._state.showWeights!==false){
        var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
        ctx.fillStyle='#686888';
        ctx.font='10px monospace';
        ctx.textAlign='center';
        ctx.fillText(e.w,mx,my-4);
      }
    }
    // Nodes
    for(var i=0;i<this.nodes.length;i++){
      var n=this.nodes[i];
      var color=this.componentsColors[i]||(this.visited.has(i)?'#00e5ff':'#4a4a70');
      if(this.path.has(i))color='#ff2e88';
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.arc(n.x,n.y,12,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 11px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(i,n.x,n.y+1);
    }
    setStats('<div>Algo: <b style="color:var(--c1)">'+GRAPH_ALGOS[this.algo].name+'</b></div>'+
      '<div>Nodes: '+this.nNodes+'</div>'+
      '<div>Edges: '+this.edges.length+'</div>'+
      (this.mstEdges.size?'<div>MST edges: '+this.mstEdges.size+'</div>':''));
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Algorithm</h4>';
    var sel=el('select',{});
    Object.keys(GRAPH_ALGOS).forEach(function(k){
      var o=el('option',{value:k},GRAPH_ALGOS[k].name);
      if(this.algo===k)o.selected=true;
      sel.appendChild(o);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.algo=this.value;LAB.current.run();}};
    s1.appendChild(sel);
    s1.innerHTML+='<div class="sub" style="margin-top:6px;font-size:.65rem;color:var(--tx3)">'+GRAPH_ALGOS[this.algo].desc+'</div>';
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Parameters</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Nodes</span><span id="grN">'+this.nNodes+'</span></div>';
    var r=el('input',{type:'range',min:5,max:40,value:this.nNodes});
    r.oninput=function(){$('grN').textContent=this.value;if(LAB.current){LAB.current.nNodes=parseInt(this.value);LAB.current.init();}};
    c.appendChild(r);s2.appendChild(c);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Actions</h4>';
    var br=el('button',{class:'btn primary full'},'🎲 New Graph');
    br.onclick=function(){if(LAB.current)LAB.current.init();};
    s3.appendChild(br);
    var bw=el('button',{class:'btn full',style:'margin-top:6px'},'👁 Toggle Weights');
    bw.onclick=function(){if(LAB.current)LAB.current._state.showWeights=LAB.current._state.showWeights===false;};
    s3.appendChild(bw);
    panel.appendChild(s3);
  }
});
</script>
<script>
/* ================================================================
   COMPUTATION MODULES
   ================================================================ */

/* ---------- BRAINFUCK ---------- */
LAB.register('brainfuck',{
  title:'Brainfuck VM',icon:'🧠',category:'Computation',
  desc:'Esoteric language with 8 commands. Full interpreter with live tape, pointer, and output.',
  clearColor:'#0a0a12',
  init:function(){
    this.code=(this._state&&this._state.code)||'++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.';
    this.tapeSize=30000;
    this.tape=new Uint8Array(this.tapeSize);
    this.ptr=0;
    this.pc=0;
    this.output='';
    this.running=false;
    this.done=false;
    this.steps=0;
    this.speed=500;
    this.acc=0;
    this.parenMap=null;
    this.reset();
  },
  compile:function(){
    var map={};
    var stack=[];
    for(var i=0;i<this.code.length;i++){
      var c=this.code[i];
      if(c==='[')stack.push(i);
      else if(c===']'){
        if(stack.length===0)throw new Error('Unmatched ] at '+i);
        var open=stack.pop();
        map[open]=i;
        map[i]=open;
      }
    }
    if(stack.length)throw new Error('Unmatched [ at '+stack[0]);
    this.parenMap=map;
  },
  reset:function(){
    this.tape.fill(0);
    this.ptr=0;
    this.pc=0;
    this.output='';
    this.steps=0;
    this.running=false;
    this.done=false;
    try{this.compile();}catch(e){this.done=true;logMsg('Compile error: '+e.message,'err');}
  },
  step:function(){
    if(this.done||this.pc<0||this.pc>=this.code.length){this.done=true;this.running=false;return false;}
    var c=this.code[this.pc];
    switch(c){
      case '>':this.ptr=(this.ptr+1)%this.tapeSize;break;
      case '<':this.ptr=(this.ptr-1+this.tapeSize)%this.tapeSize;break;
      case '+':this.tape[this.ptr]=(this.tape[this.ptr]+1)&255;break;
      case '-':this.tape[this.ptr]=(this.tape[this.ptr]-1)&255;break;
      case '.':this.output+=String.fromCharCode(this.tape[this.ptr]);break;
      case ',':/*input - reads 0*/this.tape[this.ptr]=0;break;
      case '[':if(this.tape[this.ptr]===0)this.pc=this.parenMap[this.pc];break;
      case ']':if(this.tape[this.ptr]!==0)this.pc=this.parenMap[this.pc];break;
    }
    this.pc++;
    this.steps++;
    if(this.pc>=this.code.length){this.done=true;this.running=false;}
    return true;
  },
  tick:function(dt){
    if(!this.running)return;
    this.acc+=dt;
    var iv=1/this.speed;
    var maxSteps=Math.max(1,Math.floor(this.speed*dt));
    var count=0;
    while(this.running&&count<maxSteps){
      this.step();
      count++;
    }
    this.acc=0;
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    // Code view
    ctx.font='14px monospace';
    var charsPerLine=Math.floor((CV.W-40)/9);
    var lineHeight=20;
    var startY=30;
    var lines=[];
    for(var i=0;i<this.code.length;i+=charsPerLine)lines.push(this.code.substr(i,charsPerLine));
    for(var l=0;l<lines.length;l++){
      var y=startY+l*lineHeight;
      if(y>CV.H*0.4)break;
      for(var c=0;c<lines[l].length;c++){
        var idx=l*charsPerLine+c;
        var ch=lines[l][c];
        var x=20+c*9;
        var color='#a8a8c0';
        if('+-<>.,[]'.indexOf(ch)===-1)color='#4a4a70';
        if(idx===this.pc){
          ctx.fillStyle='#ff2e88';
          ctx.fillRect(x-1,y-15,10,18);
          color='#fff';
        }
        ctx.fillStyle=color;
        ctx.fillText(ch,x,y);
      }
    }
    // Tape
    var tapeY=CV.H*0.45;
    ctx.fillStyle='#00e5ff';
    ctx.font='bold 14px monospace';
    ctx.fillText('TAPE',20,tapeY-10);
    var cellW=42,cellH=56;
    var visible=Math.floor((CV.W-40)/cellW);
    var startPtr=Math.max(0,Math.min(this.ptr-3,this.tapeSize-visible));
    for(var t=0;t<visible;t++){
      var ti=startPtr+t;
      var tx=20+t*cellW;
      var ty=tapeY+4;
      var isPtr=ti===this.ptr;
      ctx.fillStyle=isPtr?'#17301f':'#181822';
      ctx.fillRect(tx,ty,cellW-4,cellH);
      ctx.strokeStyle=isPtr?'#00ff88':'#2a2a3c';
      ctx.lineWidth=isPtr?2:1;
      ctx.strokeRect(tx,ty,cellW-4,cellH);
      var val=this.tape[ti];
      ctx.fillStyle=isPtr?'#00ff88':'#a8a8c0';
      ctx.font='bold 13px monospace';
      ctx.textAlign='center';
      ctx.fillText(val,tx+(cellW-4)/2,ty+22);
      ctx.font='10px monospace';
      ctx.fillStyle='#686888';
      var ch=val>=32&&val<127?String.fromCharCode(val):'.';
      ctx.fillText("'"+ch+"'",tx+(cellW-4)/2,ty+40);
      ctx.fillText(ti,tx+(cellW-4)/2,ty+cellH-8);
      ctx.textAlign='left';
    }
    // Output
    var outY=tapeY+cellH+50;
    ctx.fillStyle='#ffc400';
    ctx.font='bold 14px monospace';
    ctx.fillText('OUTPUT',20,outY-10);
    ctx.fillStyle='#00ff88';
    ctx.font='14px monospace';
    var outLines=this.output.split('\n');
    for(var oi=0;oi<outLines.length&&oi<5;oi++){
      ctx.fillText(outLines[oi],20,outY+oi*18);
    }
    setStats('<div>PC: <b style="color:var(--c1)">'+this.pc+'</b></div>'+
      '<div>Ptr: '+this.ptr+'</div>'+

LAB.register('stackvm',{
  title:'Stack VM',icon:'⚙️',category:'Computation',
  desc:'A tiny stack-based virtual machine. Write assembly, assemble to bytecode, execute, and step through with live stack visualization.',
  clearColor:'#0a0a12',
  init:function(){
    this.code=(this._state&&this._state.code)||
      '; NEXUS Stack VM demo: compute 5! = 120\n'+
      'PUSH 5\n'+
      'CALL fact\n'+
      'PRINT\n'+
      'HALT\n'+
      'fact:\n'+
      '  DUP\n'+
      '  PUSH 1\n'+
      '  EQ\n'+
      '  JZ recurse\n'+
      '  POP\n'+
      '  PUSH 1\n'+
      '  RET\n'+
      'recurse:\n'+
      '  DUP\n'+
      '  PUSH 1\n'+
      '  SUB\n'+
      '  CALL fact\n'+
      '  MUL\n'+
      '  RET\n';
    this.speed=5;
    this.compile();
    this.reset();
  },
  compile:function(){
    this.instructions=[];
    this.labels={};
    var lines=this.code.split('\n');
    var pc=0;
    for(var i=0;i<lines.length;i++){
      var line=lines[i].replace(/;.*$/,'').trim();
      if(!line)continue;
      if(line.endsWith(':')){
        this.labels[line.slice(0,-1)]=pc;
        continue;
      }
      var parts=line.split(/\s+/);
      this.instructions.push({op:parts[0].toUpperCase(),arg:parts[1]?parts.slice(1).join(' '):null,raw:line});
      pc++;
    }
  },
  reset:function(){
    this.pc=0;
    this.stack=[];
    this.callStack=[];
    this.output='';
    this.running=false;
    this.done=false;
    this.steps=0;
    this.error=null;
  },
  step:function(){
    if(this.done||this.pc>=this.instructions.length){this.done=true;this.running=false;return;}
    var ins=this.instructions[this.pc];
    if(!ins){this.done=true;this.running=false;return;}
    try{
      var arg=ins.arg;
      var num=arg!=null?parseFloat(arg):null;
      switch(ins.op){
        case 'PUSH': this.stack.push(isNaN(num)?arg:num); break;
        case 'POP': this.stack.pop(); break;
        case 'DUP': this.stack.push(this.stack[this.stack.length-1]); break;
        case 'SWAP': {
          var a=this.stack.pop(),b=this.stack.pop();
          this.stack.push(a);this.stack.push(b);break;
        }
        case 'ADD': {var x=this.stack.pop(),y=this.stack.pop();this.stack.push(y+x);break;}
        case 'SUB': {var x2=this.stack.pop(),y2=this.stack.pop();this.stack.push(y2-x2);break;}
        case 'MUL': {var x3=this.stack.pop(),y3=this.stack.pop();this.stack.push(y3*x3);break;}
        case 'DIV': {var x4=this.stack.pop(),y4=this.stack.pop();this.stack.push(y4/x4);break;}
        case 'MOD': {var x5=this.stack.pop(),y5=this.stack.pop();this.stack.push(y5%x5);break;}
        case 'NEG': this.stack.push(-this.stack.pop()); break;
        case 'EQ': {var x6=this.stack.pop(),y6=this.stack.pop();this.stack.push(y6===x6?1:0);break;}
        case 'LT': {var x7=this.stack.pop(),y7=this.stack.pop();this.stack.push(y7<x7?1:0);break;}
        case 'GT': {var x8=this.stack.pop(),y8=this.stack.pop();this.stack.push(y8>x8?1:0);break;}
        case 'AND': {var x9=this.stack.pop(),y9=this.stack.pop();this.stack.push((y9&&x9)?1:0);break;}
        case 'NOT': this.stack.push(this.stack.pop()?0:1); break;
        case 'JMP': this.pc=this.labels[arg]; continue;
        case 'JZ': {var v=this.stack.pop();if(!v){this.pc=this.labels[arg];continue;}break;}
        case 'JNZ': {var v2=this.stack.pop();if(v2){this.pc=this.labels[arg];continue;}break;}
        case 'CALL': this.callStack.push(this.pc);this.pc=this.labels[arg];continue;
        case 'RET': if(this.callStack.length)this.pc=this.callStack.pop();else{this.done=true;}break;
        case 'PRINT': this.output+=String(this.stack.pop())+'\n';break;
        case 'PRINTS': this.output+=String(this.stack.pop());break;
        case 'HALT': this.done=true;this.running=false;break;
        default: throw new Error('Unknown opcode: '+ins.op);
      }
    }catch(e){this.error=e.message;this.done=true;this.running=false;}
    this.pc++;
    this.steps++;
    if(this.pc>=this.instructions.length){this.done=true;this.running=false;}
  },
  tick:function(dt){
    if(!this.running)return;
    var count=Math.max(1,Math.floor(this.speed*dt*60));
    var i=0;
    while(this.running&&i<count){this.step();i++;}
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var halfW=CV.W*0.5;
    // Instruction list
    ctx.fillStyle='#00e5ff';ctx.font='bold 13px monospace';
    ctx.fillText('BYTECODE',20,25);
    ctx.font='12px monospace';
    var lh=18;
    var visible=Math.floor((CV.H-60)/lh);
    var startPc=Math.max(0,this.pc-3);
    for(var i=0;i<visible&&startPc+i<this.instructions.length;i++){
      var idx=startPc+i;
      var ins=this.instructions[idx];
      var y=45+i*lh;
      if(idx===this.pc){
        ctx.fillStyle='rgba(255,46,136,.2)';
        ctx.fillRect(10,y-13,halfW-30,17);
        ctx.fillStyle='#ff2e88';
      }else ctx.fillStyle='#a8a8c0';
      var txt=(idx<10?'0':'')+idx+'  '+ins.op+(ins.arg?' '+ins.arg:'');
      ctx.fillText(txt,20,y);
    }
    // Stack
    ctx.fillStyle='#ffc400';ctx.font='bold 13px monospace';
    ctx.fillText('STACK ('+this.stack.length+')',halfW+20,25);
    ctx.font='bold 15px monospace';
    ctx.textAlign='right';
    for(var s=0;s<this.stack.length&&s<20;s++){
      var val=this.stack[this.stack.length-1-s];
      var sy=50+s*28;
      ctx.fillStyle='rgba(0,229,255,.1)';
      ctx.fillRect(halfW+20,sy-18,halfW-40,24);
      ctx.strokeStyle='#00e5ff';
      ctx.lineWidth=1;
      ctx.strokeRect(halfW+20,sy-18,halfW-40,24);
      ctx.fillStyle='#00e5ff';
      ctx.fillText(String(val),halfW+halfW-30,sy+1);
      ctx.textAlign='left';
      ctx.font='10px monospace';
      ctx.fillStyle='#686888';
      ctx.fillText('#'+(this.stack.length-1-s),halfW+26,sy+1);
      ctx.font='bold 15px monospace';
      ctx.textAlign='right';
    }
    ctx.textAlign='left';
    // Call stack
    if(this.callStack.length){
      ctx.fillStyle='#7c4dff';ctx.font='bold 13px monospace';
      ctx.fillText('CALL STACK',halfW+20,CV.H-40);
      ctx.font='11px monospace';
      ctx.fillText(this.callStack.join(' → '),halfW+20,CV.H-20);
    }
    // Output
    ctx.fillStyle='#00ff88';ctx.font='12px monospace';
    var out=this.output.split('\n').slice(-3).filter(function(x){return x;});
    for(var o=0;o<out.length;o++){
      ctx.fillText('> '+out[o],20,CV.H-20-o*18);
    }
    if(this.error){
      ctx.fillStyle='#ff5252';
      ctx.fillText('ERROR: '+this.error,20,CV.H-70);
    }
    setStats('<div>PC: <b style="color:var(--c1)">'+this.pc+'</b></div>'+
      '<div>Stack: '+this.stack.length+'</div>'+
      '<div>Calls: '+this.callStack.length+'</div>'+
      '<div>Steps: '+this.steps+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Source</h4>';
    var ta=el('textarea',{rows:12});
    ta.value=this.code;

    ta.style.fontSize='.65rem';
    ta.oninput=function(){if(LAB.current){LAB.current.code=this.value;LAB.current.compile();LAB.current.reset();}};

    var r=el('input',{type:'range',min:1,max:60,value:this.speed});

LAB.register('regex',{
  title:'Regex Engine',icon:'🔍',category:'Computation',
  desc:'A Thompson NFA-based regex engine implemented from scratch. Supports literals, ., *, +, ?, |, (), and character classes.',
  clearColor:'#0a0a12',
  init:function(){
    this.pattern=(this._state&&this._state.pattern)||'(a|b)*abb';
    this.text=(this._state&&this._state.text)||'abb aabb abababab abbabb';
    this.match=(this._state&&this._state.match)!==false;
    this.compile();
  },
  compile:function(){
    try{
      this.ast=this.parse(this.pattern);
      this.nfa=this.buildNFA(this.ast);
      this.error=null;
    }catch(e){
      this.error=e.message;
      this.ast=null;
      this.nfa=null;
    }
  },
  parse:function(src){
    var pos=0;
    function peek(){return src[pos];}
    function next(){return src[pos++];}
    function eat(ch){if(src[pos]===ch){pos++;return true;}return false;}
    function alt(){
      var left=concat();
      while(eat('|')){
        var right=concat();
        left={type:'alt',left:left,right:right};
      }
      return left;
    }
    function concat(){
      var items=[];
      while(pos<src.length&&peek()!=='|'&&peek()!==')'){
        items.push(repeat());
      }
      if(items.length===0)return {type:'empty'};
      if(items.length===1)return items[0];
      return {type:'cat',items:items};
    }
    function repeat(){
      var atom=primary();
      while(pos<src.length&&'*+?'.indexOf(peek())>-1){
        var op=next();
        atom={type:op==='*'?'star':op==='+'?'plus':'opt',child:atom};
      }
      return atom;
    }
    function primary(){
      var c=peek();
      if(c==='('){pos++;var e=alt();if(!eat(')'))throw new Error('Unmatched (');return e;}
      if(c==='.'){pos++;return {type:'any'};}
      if(c==='['){
        pos++;
        var neg=false;
        if(peek()==='^'){neg=true;pos++;}
        var chars=[];
        while(peek()!==']'&&pos<src.length){
          var ch=next();
          if(ch==='-'&&chars.length&&peek()!==']'){
            var end=next();
            var start=chars.pop();
            for(var x=start.charCodeAt(0);x<=end.charCodeAt(0);x++)chars.push(String.fromCharCode(x));
          }else chars.push(ch);
        }
        if(!eat(']'))throw new Error('Unmatched [');
        return {type:'class',chars:chars,neg:neg};
      }
      if(c==='\\'){pos++;var esc=next();return {type:'lit',ch:esc};}
      if(c==null)throw new Error('Unexpected end');
      pos++;
      return {type:'lit',ch:c};
    }
    var ast=alt();
    if(pos<src.length)throw new Error('Unexpected "'+src[pos]+'" at '+pos);
    return ast;
  },
  buildNFA:function(ast){
    var stateCounter=0;
    function newState(){
      return {id:stateCounter++,trans:[]};
    }
    var start=newState();
    var end=newState();
    function build(node,from,to){
      if(node.type==='empty'){from.trans.push({type:'eps',to:to});return;}
      if(node.type==='lit'){from.trans.push({type:'char',ch:node.ch,to:to});return;}
      if(node.type==='any'){from.trans.push({type:'any',to:to});return;}
      if(node.type==='class'){from.trans.push({type:'class',chars:node.chars,neg:node.neg,to:to});return;}
      if(node.type==='cat'){
        var cur=from;
        for(var i=0;i<node.items.length;i++){
          var nxt=to;
          if(i<node.items.length-1)nxt=newState();
          build(node.items[i],cur,nxt);
          cur=nxt;
        }
        return;
      }
      if(node.type==='alt'){
        var s1=newState(),e1=newState();
        from.trans.push({type:'eps',to:s1});
        from.trans.push({type:'eps',to:e1});
        build(node.left,s1,e1);
        var s2=newState(),e2=newState();
        e1.trans.push({type:'eps',to:s2});
        e1.trans.push({type:'eps',to:e2});
        build(node.right,s2,e2);
        e2.trans.push({type:'eps',to:to});
        return;
      }
      if(node.type==='star'){
        var s=newState(),e=newState();
        from.trans.push({type:'eps',to:s});
        from.trans.push({type:'eps',to:to});
        build(node.child,s,e);
        e.trans.push({type:'eps',to:s});
        e.trans.push({type:'eps',to:to});
        return;
      }
      if(node.type==='plus'){
        var s2=newState(),e2=newState();
        from.trans.push({type:'eps',to:s2});
        build(node.child,s2,e2);
        e2.trans.push({type:'eps',to:s2});
        e2.trans.push({type:'eps',to:to});
        return;
      }
      if(node.type==='opt'){
        var s3=newState(),e3=newState();
        from.trans.push({type:'eps',to:s3});
        from.trans.push({type:'eps',to:to});
        build(node.child,s3,e3);
        e3.trans.push({type:'eps',to:to});
        return;
      }
    }
    build(ast,start,end);
    var states=[];
    var queue=[start];
    var seen={};
    while(queue.length){
      var s=queue.shift();
      if(seen[s.id])continue;
      seen[s.id]=true;
      states.push(s);
      for(var i=0;i<s.trans.length;i++)if(!seen[s.trans[i].to.id])queue.push(s.trans[i].to);
    }
    return {start:start,end:end,states:states,count:stateCounter};
  },
  matchFrom:function(nfa,str,pos){
    var cur=new Set();
    var stack=[nfa.start];
    var visited=new Set();
    while(stack.length){
      var s=stack.pop();
      if(visited.has(s.id))continue;
      visited.add(s.id);
      cur.add(s.id);
      for(var i=0;i<s.trans.length;i++)if(s.trans[i].type==='eps')stack.push(s.trans[i].to);
    }
    for(var i=pos;i<=str.length;i++){
      if(cur.has(nfa.end.id)){
        // Check if any state is end
        for(var s2 of cur)if(s2===nfa.end.id)return i-pos;
      }
      if(i>=str.length)break;
      var ch=str[i];
      var next=new Set();
      var stack2=[];
      for(var s3 of cur){
        var state=nfa.states.find(function(x){return x.id===s3;});
        if(!state)continue;
        for(var t=0;t<state.trans.length;t++){
          var tr=state.trans[t];
          if(tr.type==='char'&&tr.ch===ch)stack2.push(tr.to);
          else if(tr.type==='any')stack2.push(tr.to);
          else if(tr.type==='class'&&((tr.chars.indexOf(ch)>-1)!==tr.neg))stack2.push(tr.to);
        }
      }
      var vis2=new Set();
      while(stack2.length){
        var s4=stack2.pop();
        if(vis2.has(s4.id))continue;
        vis2.add(s4.id);
        next.add(s4.id);
        for(var j=0;j<s4.trans.length;j++)if(s4.trans[j].type==='eps')stack2.push(s4.trans[j].to);
      }
      cur=next;
      if(cur.size===0)break;
    }
    return -1;
  },
  testMatch:function(){
    if(!this.nfa)return null;
    return this.matchFrom(this.nfa,this.text,0)>=0;
  },
  findMatches:function(){
    if(!this.nfa)return [];
    var results=[];
    for(var i=0;i<=this.text.length;i++){
      var len=this.matchFrom(this.nfa,this.text,i);
      if(len>0){results.push({pos:i,len:len,text:this.text.substr(i,len)});i+=len-1;}
    }
    return results;
  },
  tick:function(){},
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var matches=this.findMatches();
    // Pattern
    ctx.font='bold 18px monospace';
    ctx.fillStyle='#00e5ff';
    ctx.fillText('Pattern:',20,40);
    ctx.fillStyle='#fff';
    ctx.fillText(this.pattern,120,40);
    // Text with highlights
    ctx.font='16px monospace';
    ctx.fillStyle='#00e5ff';
    ctx.fillText('Text:',20,80);
    var x=90;var y=80;
    var matchPositions={};
    matches.forEach(function(m){for(var i=0;i<m.len;i++)matchPositions[m.pos+i]=true;});
    var charW=ctx.measureText('M').width;
    for(var i=0;i<this.text.length;i++){
      var c=this.text[i];
      if(matchPositions[i]){
        ctx.fillStyle='rgba(255,46,136,.35)';
        ctx.fillRect(x-1,y-16,charW,22);
        ctx.fillStyle='#ff2e88';
      }else{
        ctx.fillStyle='#a8a8c0';
      }
      ctx.fillText(c,x,y);
      x+=charW;
      if(x>CV.W-30){x=90;y+=26;}
    }
    // Match list
    var listY=Math.max(180,y+60);
    ctx.font='bold 14px monospace';
    ctx.fillStyle='#ffc400';
    ctx.fillText('Matches ('+matches.length+')',20,listY);
    ctx.font='13px monospace';
    for(var m=0;m<matches.length&&m<20;m++){
      var mm=matches[m];
      ctx.fillStyle='#00ff88';
      ctx.fillText('  @'+mm.pos+': "'+mm.text+'"',20,listY+24+m*20);
    }
    if(this.error){
      ctx.fillStyle='#ff5252';
      ctx.font='bold 16px monospace';
      ctx.fillText('Error: '+this.error,20,listY);
    }
    // NFA stats
    if(this.nfa){
      setStats('<div>States: <b style="color:var(--c1)">'+this.nfa.count+'</b></div>'+
        '<div>Matches: '+matches.length+'</div>'+
        '<div>'+(this.matchFrom(this.nfa,this.text,0)>=0?'✓ Match':'✗ No match')+'</div>');
    }else{

/* ---------- LAMBDA CALCULUS ---------- */
LAB.register('lambda',{
  title:'Lambda Calculus',icon:'λ',category:'Computation',
  desc:'Untyped lambda calculus evaluator with normal-order reduction. Try church numerals, combinators (S, K, I), and more.',
  clearColor:'#0a0a12',
  init:function(){
    this.code=(this._state&&this._state.code)||'(\\x.\\y.x) a b';
    this.maxSteps=(this._state&&this._state.maxSteps)||100;
    this.history=[];
    this.error=null;
    this.evaluate();
  },
  tokenize:function(s){
    var tokens=[];
    for(var i=0;i<s.length;i++){
      var c=s[i];
      if(/\s/.test(c))continue;
      if('().\\λ'.indexOf(c)>-1){tokens.push(c==='λ'?'\\':c);continue;}
      var j=i;
      while(j<s.length&&/[a-zA-Z0-9_!']/.test(s[j]))j++;
      tokens.push(s.substring(i,j));
      i=j-1;
    }
    return tokens;
  },
  parse:function(s){
    var tokens=this.tokenize(s);
    var pos=0;
    function peek(){return tokens[pos];}
    function next(){return tokens[pos++];}
    function expect(t){if(tokens[pos]!==t)throw new Error('Expected "'+t+'" at token '+pos+', got "'+tokens[pos]+'"');pos++;}
    function parseExpr(){
      var left=parseAtom();
      while(pos<tokens.length&&tokens[pos]!==')'&&tokens[pos]!=='\\'){
        var right=parseAtom();
        left={type:'app',left:left,right:right};
      }
      return left;
    }
    function parseAtom(){
      var t=peek();
      if(t==='('){next();var e=parseExpr();expect(')');return e;}
      if(t==='\\'){
        next();
        var v=next();
        if(v===undefined)throw new Error('Expected variable after \\');
        expect('.');
        var body=parseExpr();
        return {type:'abs',param:v,body:body};
      }
      if(t===undefined)throw new Error('Unexpected end');
      next();
      return {type:'var',name:t};
    }
    var ast=parseExpr();
    if(pos<tokens.length)throw new Error('Unexpected token: '+tokens[pos]);
    return ast;
  },
  toStr:function(ast){
    if(ast.type==='var')return ast.name;
    if(ast.type==='abs')return '\\'+ast.param+'.'+this.toStr(ast.body);
    if(ast.type==='app'){
      var l=this.toStr(ast.left);
      var r=this.toStr(ast.right);
      if(ast.left.type==='abs')l='('+l+')';
      if(ast.right.type==='app'||ast.right.type==='abs')r='('+r+')';
      return l+' '+r;
    }
    return '?';
  },
  freeVars:function(ast,acc){
    acc=acc||{};
    if(ast.type==='var')acc[ast.name]=true;
    else if(ast.type==='app'){this.freeVars(ast.left,acc);this.freeVars(ast.right,acc);}
    else if(ast.type==='abs'){this.freeVars(ast.body,acc);delete acc[ast.param];}
    return acc;
  },
  substitute:function(ast,name,repl){
    if(ast.type==='var')return ast.name===name?repl:ast;
    if(ast.type==='app')return {type:'app',left:this.substitute(ast.left,name,repl),right:this.substitute(ast.right,name,repl)};
    if(ast.type==='abs'){
      if(ast.param===name)return ast;
      var fv=Object.keys(this.freeVars(repl));
      var newParam=ast.param;
      if(fv.indexOf(ast.param)>-1){
        // Alpha rename
        var suffix='1';
        while(fv.indexOf(ast.param+suffix)>-1||this.freeVars(ast.body)[ast.param+suffix])suffix+='1';
        newParam=ast.param+suffix;
        var renamed={type:'abs',param:newParam,body:this.substitute(ast.body,ast.param,{type:'var',name:newParam})};
        return {type:'abs',param:newParam,body:this.substitute(renamed.body,name,repl)};
      }
      return {type:'abs',param:ast.param,body:this.substitute(ast.body,name,repl)};
    }
    return ast;
  },
  reduceOnce:function(ast){
    // Normal order: find leftmost-outermost redex
    if(ast.type==='app'){
      if(ast.left.type==='abs'){
        return {reduced:this.substitute(ast.left.body,ast.left.param,ast.right),step:'β-reduction'};
      }
      var l=this.reduceOnce(ast.left);
      if(l)return {reduced:{type:'app',left:l.reduced,right:ast.right},step:l.step};
      var r=this.reduceOnce(ast.right);
      if(r)return {reduced:{type:'app',left:ast.left,right:r.reduced},step:r.step};
    }
    if(ast.type==='abs'){
      var b=this.reduceOnce(ast.body);
      if(b)return {reduced:{type:'abs',param:ast.param,body:b.reduced},step:b.step};
    }
    return null;
  },
  evaluate:function(){
    this.history=[];
    this.error=null;
    try{
      var ast=this.parse(this.code);
      this.history.push(this.toStr(ast));
      for(var i=0;i<this.maxSteps;i++){
        var r=this.reduceOnce(ast);
        if(!r){this.final=this.toStr(ast);return;}
        ast=r.reduced;
        this.history.push(this.toStr(ast));
        if(this.history.length>200)break;
      }
      this.final=this.toStr(ast)+'  …(step limit)';
    }catch(e){
      this.error=e.message;
      this.final=null;
    }
  },
  tick:function(){},
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    ctx.font='bold 14px monospace';
    ctx.fillStyle='#00e5ff';
    ctx.fillText('λ-CALCULUS REDUCTION',20,30);
    if(this.error){
      ctx.fillStyle='#ff5252';
      ctx.font='15px monospace';
      var elines=this.error.split('\n');
      for(var i=0;i<elines.length;i++)ctx.fillText(elines[i],20,60+i*20);
    }else{
      ctx.font='14px monospace';
      var y=60;
      var maxLines=Math.min(this.history.length,Math.floor((CV.H-y-40)/22));
      for(var i=0;i<maxLines;i++){
        var isLast=i===this.history.length-1;
        ctx.fillStyle=isLast?'#ff2e88':(i===0?'#00ff88':'#a8a8c0');
        ctx.fillText((i===0?'▶ ':'  ')+this.history[i],20,y);
        y+=22;
      }
      if(this.history.length>maxLines){
        ctx.fillStyle='#686888';
        ctx.fillText('… '+(this.history.length-maxLines)+' more reductions',20,y);
      }
    }
    setStats('<div>Reductions: <b style="color:var(--c1)">'+Math.max(0,this.history.length-1)+'</b></div>'+
      '<div>'+(this.error?'❌ Error':'✓ Reduced')+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Expression</h4>';
    var p=el('textarea',{rows:3});
    p.value=this.code;
    p.style.fontFamily='var(--mono)';
    p.oninput=function(){if(LAB.current){LAB.current.code=this.value;LAB.current.evaluate();}};
    s1.appendChild(p);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Examples</h4>';
    var examples=[
      ['(\\x.x) y','Identity applied'],
      ['(\\x.\\y.x) a b','K (const) — returns a'],
      ['(\\x.\\y.\\z.x z (y z)) (\\x.x) (\\x.x)','SKI composition'],
      ['(\\x.x x) (\\x.x x)','Omega (diverges)'],
      ['(\\f.\\n.n (\\x.f) 1 0) (\\x.x) 0','Y-combinator-ish'],
      ['(\\x.\\y.x)','Returns first'],
      ['(\\s.\\z.s (s z)) (\\n.\\f.\\x.n f (f x))','Church add 1'],
      ['\\x.x','Already normal form']
    ];
    examples.forEach(function(ex){
      var b=el('button',{class:'btn sm full',style:'margin-bottom:4px;text-align:left;font-family:var(--mono);font-size:.6rem;justify-content:flex-start'},ex[0]);
      b.title=ex[1];
      b.onclick=function(){if(LAB.current){LAB.current.code=ex[0];p.value=ex[0];LAB.current.evaluate();}};
      s2.appendChild(b);
    });
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Max Steps</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Max reductions</span><span id="lmS">'+this.maxSteps+'</span></div>';
    var r=el('input',{type:'range',min:10,max:500,value:this.maxSteps});
    r.oninput=function(){$('lmS').textContent=this.value;if(LAB.current){LAB.current.maxSteps=parseInt(this.value);LAB.current.evaluate();}};
    c.appendChild(r);s3.appendChild(c);
    panel.appendChild(s3);
  }
});
</script>
