<!DOCTYPE html>
<html lang="en" data-theme="nexus">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08080f">
<title>NEXUS LAB — Interactive Computation Laboratory</title>
<style>
/* ================================================================
   NEXUS LAB — Design System
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;
  font-family:var(--sans);color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#08080f;--bg2:#0e0e1a;--bg3:#141422;--bg4:#1c1c30;
  --panel:#101018;--panel2:#181822;--panel3:#20202e;--panel4:#2a2a3c;
  --bd:#26263a;--bd2:#363650;--bd3:#4a4a70;
  --tx:#e8e8f0;--tx2:#a8a8c0;--tx3:#686888;--mu:#484860;
  --c1:#ff2e88;--c1h:#ff80b0;--c1l:#c01868;
  --c2:#00e5ff;--c2h:#80f0ff;--c2l:#00a8c0;
  --c3:#ffc400;--c3h:#ffe080;--c3l:#c09000;
  --c4:#7c4dff;--c4h:#b080ff;--c4l:#5a2dcc;
  --c5:#00ff88;--c5h:#80ffc0;--c5l:#00c060;
  --c6:#ff6d00;--c6h:#ffa060;--c6l:#c04800;
  --c7:#40e0d0;--c7h:#80f0e8;--c7l:#20a8a0;
  --c8:#ff5252;--c8h:#ff9090;--c8l:#c03030;
  --ok:#00ff88;--warn:#ffc400;--err:#ff2e88;--info:#00e5ff;
  --g1:linear-gradient(135deg,#ff2e88,#7c4dff);
  --g2:linear-gradient(135deg,#00e5ff,#7c4dff);
  --g3:linear-gradient(135deg,#00ff88,#00e5ff);
  --g4:linear-gradient(135deg,#ffc400,#ff6d00);
  --gHolo:linear-gradient(120deg,#ff2e88,#7c4dff,#00e5ff,#00ff88,#ffc400,#ff2e88);
  --gGlass:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.5);
  --sh2:0 12px 48px rgba(0,0,0,.7);
  --shGlow:0 0 24px rgba(255,46,136,.4);
  --mono:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide','Cinzel',sans-serif;
  --t1:all .15s cubic-bezier(.4,0,.2,1);
  --t2:all .25s cubic-bezier(.4,0,.2,1);
  --t3:all .4s cubic-bezier(.34,1.56,.64,1);
}
[data-theme="light"]{--bg:#eef0f8;--bg2:#e0e4f0;--bg3:#d0d4e4;--panel:#fff;--panel2:#f5f6fa;--panel3:#e8eaf0;--panel4:#d8dce8;
  --bd:#c8ccd8;--bd2:#a8aec0;--tx:#0a0a18;--tx2:#3a3a58;--tx3:#6a6a88;--mu:#9090a8}
[data-theme="matrix"]{--bg:#000600;--bg2:#001200;--bg3:#001e00;--panel:#001800;--panel2:#002800;--panel3:#003800;
  --bd:#006400;--bd2:#009000;--bd3:#00c000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#00ff80;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}
[data-theme="amber"]{--bg:#1a0e00;--bg2:#281800;--bg3:#382200;--panel:#281800;--panel2:#382200;
  --bd:#684400;--bd2:#906000;--tx:#ffe8c0;--tx2:#d8b880;--tx3:#a08848;
  --c1:#ffb800;--c2:#ff6b00;--c3:#ffe040;--c4:#ff3b00;
  --g1:linear-gradient(135deg,#ffb800,#ff6b00)}
[data-theme="ocean"]{--bg:#000820;--bg2:#001030;--bg3:#001848;--panel:#001028;--panel2:#001840;
  --bd:#003878;--bd2:#0050a8;--tx:#d0e8ff;--tx2:#90c0ff;--tx3:#6090d0;
  --c1:#00a0ff;--c2:#00ffd0;--c3:#40c0ff;--c4:#0080ff;
  --g1:linear-gradient(135deg,#00a0ff,#00ffd0)}
[data-theme="void"]{--bg:#050508;--bg2:#0a0a10;--bg3:#101018;--panel:#0a0a10;--panel2:#121218;
  --bd:#1a1a24;--bd2:#2a2a38;--tx:#e0e0e8;--tx2:#888898;--tx3:#505060;
  --c1:#ffffff;--c2:#a0a0b0;--c3:#c0c0d0;--c4:#808090;
  --g1:linear-gradient(135deg,#fff,#808090)}

/* ================================================================
   BOOT
   ================================================================ */
#boot{position:fixed;inset:0;background:#08080f;z-index:10000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s;font-family:var(--mono)}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3.6rem;font-weight:900;letter-spacing:12px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  animation:holo 3s linear infinite;margin-bottom:6px;
  filter:drop-shadow(0 0 30px rgba(255,46,136,.6))}
.boot-sub{font-size:.72rem;color:var(--c2);letter-spacing:8px;margin-bottom:36px;opacity:.7}
.boot-bar{width:320px;height:3px;background:#1a1a24;border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .2s;box-shadow:0 0 12px var(--c1)}
.boot-pct{font-size:.65rem;color:var(--c1);font-family:var(--mono);margin-bottom:20px}
.boot-log{font-size:.65rem;color:var(--c2);text-align:left;width:400px;height:130px;overflow:hidden;line-height:1.6;opacity:.85}
.boot-log .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boot-log .ok{color:var(--c5)}.boot-log .warn{color:var(--c3)}.boot-log .err{color:var(--c8)}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ================================================================
   APP SHELL
   ================================================================ */
#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* TOPBAR */
#topbar{height:46px;background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;
  padding-right:10px;cursor:pointer;user-select:none}
.tb-logo-sub{font-size:.55rem;color:var(--tx3);letter-spacing:3px;font-family:var(--mono);
  align-self:flex-end;padding-bottom:12px;margin-left:-6px}
.tb-cats{display:flex;gap:3px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-cat{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);
  cursor:pointer;transition:var(--t1);font-size:.72rem;font-weight:600;color:var(--tx2);
  white-space:nowrap;height:30px}
.tb-cat:hover{background:var(--panel2);color:var(--tx)}
.tb-cat.active{background:var(--g1);color:#fff;box-shadow:0 0 14px rgba(255,46,136,.35)}
.tb-cat .cat-icon{font-size:.9rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);
  border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);
  display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-fps{font-family:var(--mono);font-size:.62rem;color:var(--tx3);padding:0 6px;
  min-width:52px;text-align:right}

/* MODULE SELECTOR */
#moduleBar{height:0;background:var(--panel2);border-bottom:1px solid var(--bd);
  overflow:hidden;transition:height .25s;flex-shrink:0}
#moduleBar.open{height:auto;padding:8px}
.module-pills{display:flex;gap:6px;flex-wrap:wrap}
.module-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rf);
  background:var(--panel3);border:1px solid var(--bd);cursor:pointer;transition:var(--t1);
  font-size:.7rem;font-weight:600;color:var(--tx2);white-space:nowrap}
.module-pill:hover{border-color:var(--c1);color:var(--tx);transform:translateY(-1px)}
.module-pill.active{background:var(--g1);color:#fff;border-color:transparent;font-weight:700}
.module-pill .mp-icon{font-size:.9rem}
.module-group-label{font-size:.58rem;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;
  font-weight:700;padding:10px 4px 4px;width:100%}

/* MAIN LAYOUT */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#canvasWrap{flex:1;background:#0a0a12;position:relative;overflow:hidden;min-width:0;
  border-right:1px solid var(--bd)}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:space-between;padding:10px;gap:8px}
.co-badge{background:rgba(16,16,24,.85);backdrop-filter:blur(12px);
  border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 10px;
  font-family:var(--mono);font-size:.65rem;color:var(--c2);
  display:flex;align-items:center;gap:6px;pointer-events:auto;max-width:280px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-badge.stats{color:var(--c1);flex-direction:column;align-items:flex-start;gap:2px;
  max-width:240px;white-space:normal}

#sidePanel{width:290px;background:var(--panel2);flex-shrink:0;
  display:flex;flex-direction:column;transition:width .2s;overflow:hidden}
#sidePanel.collapsed{width:36px}
.sp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.sp-tab{flex:1;padding:6px;font-size:.65rem;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--tx3);cursor:pointer;transition:var(--t1);
  display:flex;align-items:center;justify-content:center;gap:5px;border-bottom:2px solid transparent}
.sp-tab:hover{color:var(--tx);background:var(--panel2)}
.sp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.sp-body{flex:1;overflow-y:auto;padding:12px}
.sp-pane{display:none}
.sp-pane.active{display:block}
.sp-section{margin-bottom:14px}
.sp-section h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.ctrl-label{font-size:.63rem;color:var(--tx3);display:flex;justify-content:space-between;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.ctrl-label span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type="range"]{-webkit-appearance:none;width:100%;height:4px;background:var(--panel4);
  border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 8px var(--c1)}
.ctrl input[type="range"]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);
  border-radius:50%;cursor:pointer;border:none}
.ctrl input[type="text"],.ctrl input[type="number"],.ctrl select,.ctrl textarea{
  width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rxs);
  padding:6px 9px;color:var(--tx);font-size:.72rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);
  box-shadow:0 0 0 3px rgba(255,46,136,.15)}
.ctrl textarea{resize:vertical;min-height:80px;line-height:1.5}
.ctrl-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);
  background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;
  font-size:.7rem;font-weight:600;transition:var(--t1);white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,46,136,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--c8)}
.btn.danger:hover{border-color:var(--c8);background:rgba(255,82,82,.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:.65rem}
.btn.full{width:100%;justify-content:center}

.toggle{position:relative;width:38px;height:20px;background:var(--panel4);border-radius:var(--rf);
  cursor:pointer;transition:var(--t2);flex-shrink:0}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:var(--t2);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.toggle.on::after{left:20px}

.swatch-row{display:flex;gap:4px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:var(--rxxs);cursor:pointer;
  border:2px solid transparent;transition:var(--t1)}
.swatch:hover{transform:scale(1.1)}
.swatch.active{border-color:#fff;box-shadow:0 0 8px currentColor}

/* LOG PANEL */
#logPanel{height:0;background:var(--bg2);border-top:1px solid var(--bd);
  display:flex;flex-direction:column;transition:height .2s;flex-shrink:0;overflow:hidden}
#logPanel.open{height:140px}
.log-head{height:26px;background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 10px;gap:10px;flex-shrink:0}
.log-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--tx3);font-weight:700}
.log-actions{margin-left:auto;display:flex;gap:4px}
.log-body{flex:1;overflow-y:auto;padding:8px 12px;
  font-family:var(--mono);font-size:.68rem;line-height:1.55;color:var(--tx2);
  user-select:text}
.log-line{white-space:pre-wrap;word-break:break-word}
.log-line.info{color:var(--c2)}
.log-line.ok{color:var(--c5)}
.log-line.warn{color:var(--c3)}
.log-line.err{color:var(--c8)}
.log-line.dim{color:var(--tx3)}
.log-line .ts{color:var(--tx3);font-size:.6rem}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:5000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh2);max-width:720px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;animation:modalIn .25s cubic-bezier(.34,1.56,.64,1)}
.modal.lg{max-width:900px}
.modal.xl{max-width:1100px}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;
  color:var(--tx3);cursor:pointer;font-size:1rem;transition:var(--t1);
  display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--panel2);color:var(--c8)}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;z-index:9000;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);
  border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);
  font-size:.72rem;font-weight:500;max-width:340px;min-width:180px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px)}
.toast.success{border-left-color:var(--c5)}
.toast.warn{border-left-color:var(--c3)}
.toast.error{border-left-color:var(--c8)}
.toast.info{border-left-color:var(--c2)}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* CONTENT HELPERS */
.card{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
.card h3{font-size:.85rem;font-weight:700;margin-bottom:8px}
.card .sub{font-size:.7rem;color:var(--tx3);line-height:1.5;margin-bottom:10px}
.code{background:#06060a;border:1px solid var(--bd);border-radius:var(--rs);
  padding:12px 14px;font-family:var(--mono);font-size:.68rem;line-height:1.55;
  color:var(--c2);overflow:auto;max-height:400px;white-space:pre;
  user-select:text;tab-size:2}
.code .k{color:var(--c1)}.code .n{color:var(--c3)}.code .s{color:var(--c5)}
.code .c{color:var(--tx3);font-style:italic}.code .v{color:var(--c2)}
.help-list{font-size:.72rem;line-height:1.9;color:var(--tx2)}
.help-list kbd{background:var(--panel3);border:1px solid var(--bd2);border-radius:3px;
  padding:1px 6px;font-family:var(--mono);font-size:.65rem;color:var(--c1)}
table.kv{width:100%;font-size:.72rem;border-collapse:collapse}
table.kv td{padding:5px 8px;border-bottom:1px solid var(--bd)}
table.kv td:first-child{color:var(--tx3);width:40%}
table.kv td:last-child{color:var(--tx);font-family:var(--mono);font-size:.7rem}

.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .e-icon{font-size:3.5rem;opacity:.35;margin-bottom:14px}

@media(max-width:820px){
  #sidePanel{width:250px}
  #logPanel.open{height:110px}
  .tb-logo-sub{display:none}
}
@media(max-width:620px){
  #sidePanel{width:210px}
  .tb-cat .cat-label{display:none}
  .tb-cat{padding:6px 8px}
}
</style>
</head>
<body>
<!-- ============================================================
     BOOT SCREEN
     ============================================================ -->
<div id="boot">
  <div class="boot-logo">NEXUS</div>
  <div class="boot-sub">COMPUTATION LABORATORY</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <div class="tb-logo" onclick="switchCategory('Automata')">NEXUS</div>
    <div class="tb-logo-sub">LAB</div>
    <div class="tb-cats" id="tbCats"></div>
    <div class="tb-actions">
      <div class="tb-fps" id="tbFps">-- FPS</div>
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetCurrent()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="stepCurrent()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="toggleModuleBar()" title="Modules (M)">☰</button>
      <button class="tb-btn" onclick="toggleLog()" title="Log (L)">📋</button>
      <button class="tb-btn" onclick="toggleSidePanel()" title="Panel (P)">⇥</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <!-- MODULE SELECTOR BAR -->
  <div id="moduleBar">
    <div class="module-pills" id="modulePills"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="canvasOverlay">
        <div class="co-badge" id="coBadge">
          <span id="coBadgeIcon">⚡</span>
          <span id="coBadgeText">Ready</span>

    <div id="sidePanel">

          <span>⚙️</span><span class="sp-tab-label">Controls</span>
        </div>
        <div class="sp-tab" data-sp="info" onclick="switchSpTab('info',this)">
          <span>ℹ️</span><span class="sp-tab-label">Info</span>
        </div>

      <div class="sp-body">
        <div class="sp-pane active" id="spControls"></div>

  <!-- LOG -->
  <div id="logPanel">

      <div class="log-actions">
        <button class="btn ghost sm" onclick="clearLog()">Clear</button>
        <button class="btn ghost sm" onclick="copyLog()">Copy</button>
        <button class="btn ghost sm" onclick="toggleLog()">─</button>

<div class="modal-bg" id="modalBg">

<!-- ============================================================
     TOASTS
     ============================================================ -->
<div id="toasts"></div>
<script>
"use strict";
/* ================================================================
   NEXUS LAB — Core Runtime
   ================================================================ */

/* ---------- UTILS ---------- */
function $(id){return document.getElementById(id);}
function $$(s){return document.querySelectorAll(s);}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];
    if(k==='class')e.className=v;
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='text')e.textContent=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;
    else e.setAttribute(k,v);}
  if(children){if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
    else e.appendChild(children);}
  return e;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rndF(a,b){return Math.random()*(b-a)+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function nowStr(){return new Date().toTimeString().split(' ')[0];}
function fmt(n,dec){dec=dec==null?0:dec;return Number(n).toFixed(dec).replace(/\.?0+$/,'');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ---------- TOAST ---------- */
function toast(msg,type,dur){
  type=type||'info';dur=dur||2400;
  var icons={success:'✅',warn:'⚠️',error:'❌',info:'ℹ️'};
  var t=el('div',{class:'toast '+type});
  t.innerHTML='<span style="font-size:1rem">'+(icons[type]||'ℹ️')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t);
  setTimeout(function(){
    t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all .3s';
    setTimeout(function(){t.remove();},300);},dur);
}

/* ---------- LOG ---------- */
var _logCount=0;
function logMsg(msg,cls){
  var body=$('logBody');if(!body)return;
  var line=el('div',{class:'log-line '+(cls||'')});
  line.innerHTML='<span class="ts">'+nowStr()+'</span> '+esc(msg);
  body.appendChild(line);
  _logCount++;
  if(_logCount>500){body.removeChild(body.firstChild);_logCount--;}
  body.scrollTop=body.scrollHeight;
  var lc=$('logCount');if(lc)lc.textContent=_logCount+' entries';
}
function logHTML(html,cls){
  var body=$('logBody');if(!body)return;
  var line=el('div',{class:'log-line '+(cls||'')});
  line.innerHTML='<span class="ts">'+nowStr()+'</span> '+html;
  body.appendChild(line);
  _logCount++;
  body.scrollTop=body.scrollHeight;
  var lc=$('logCount');if(lc)lc.textContent=_logCount+' entries';
}
function clearLog(){var b=$('logBody');if(b)b.innerHTML='';_logCount=0;var lc=$('logCount');if(lc)lc.textContent='0 entries';}
function copyLog(){var b=$('logBody');if(b)copyToClipboard(b.innerText);}

/* ---------- MODAL ---------- */
var _modalOnClose=null;
function openModal(title,body,footer,opts){
  opts=opts||{};
  $('modalTitle').innerHTML=title;
  if(typeof body==='string')$('modalBody').innerHTML=body;
  else if(body instanceof HTMLElement){$('modalBody').innerHTML='';$('modalBody').appendChild(body);}
  $('modalFoot').innerHTML=footer||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').className='modal'+(opts.size?' '+opts.size:'');
  $('modalBg').classList.add('show');
  _modalOnClose=opts.onClose||null;
}
function closeModal(){
  $('modalBg').classList.remove('show');
  if(_modalOnClose){try{_modalOnClose();}catch(e){}}_modalOnClose=null;
}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});

/* ---------- CLIPBOARD ---------- */
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copied','success');},function(){fbCopy(text);});
  }else fbCopy(text);
}
function fbCopy(text){
  var ta=document.createElement('textarea');ta.value=text;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('Copied','success');}catch(e){toast('Copy failed','error');}
  ta.remove();
}

/* ---------- THEME ---------- */
var THEMES=['nexus','light','matrix','amber','ocean','void'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  LAB.settings.theme=next;
  try{localStorage.setItem('nexus-theme',next);}catch(e){}
  toast('Theme: '+next,'success');
}

/* ================================================================
   CANVAS MANAGER
   ================================================================ */
var CV={
  canvas:null,ctx:null,W:0,H:0,dpr:1,
  init:function(){
    this.canvas=$('canvas');
    this.ctx=this.canvas.getContext('2d',{alpha:false});
    this.resize();
    window.addEventListener('resize',function(){CV.resize();});
    // Mouse events
    var self=this;
    function pos(e){
      var r=self.canvas.getBoundingClientRect();
      return {x:e.clientX-r.left,y:e.clientY-r.top};
    }
    this.canvas.addEventListener('mousedown',function(e){
      var p=pos(e);p.raw=e;self.dispatch('down',p);
    });
    this.canvas.addEventListener('mousemove',function(e){
      var p=pos(e);p.raw=e;self.dispatch('move',p);
    });
    this.canvas.addEventListener('mouseup',function(e){
      var p=pos(e);p.raw=e;self.dispatch('up',p);
    });
    this.canvas.addEventListener('mouseleave',function(e){
      var p=pos(e);p.raw=e;self.dispatch('leave',p);
    });
    this.canvas.addEventListener('wheel',function(e){
      var p=pos(e);p.delta=e.deltaY;p.raw=e;self.dispatch('wheel',p);
      e.preventDefault();
    },{passive:false});
    this.canvas.addEventListener('contextmenu',function(e){
      var p=pos(e);p.raw=e;self.dispatch('rightclick',p);
      e.preventDefault();
    });
    // Touch
    this.canvas.addEventListener('touchstart',function(e){
      if(e.touches.length===1){
        var t=e.touches[0];var r=self.canvas.getBoundingClientRect();
        self.dispatch('down',{x:t.clientX-r.left,y:t.clientY-r.top,raw:e});
      }
      e.preventDefault();
    },{passive:false});
    this.canvas.addEventListener('touchmove',function(e){
      if(e.touches.length===1){
        var t=e.touches[0];var r=self.canvas.getBoundingClientRect();
        self.dispatch('move',{x:t.clientX-r.left,y:t.clientY-r.top,raw:e});
      }
      e.preventDefault();
    },{passive:false});
    this.canvas.addEventListener('touchend',function(e){
      self.dispatch('up',{x:0,y:0,raw:e});
      e.preventDefault();
    },{passive:false});
  },
  resize:function(){
    var wrap=this.canvas.parentElement;
    this.dpr=window.devicePixelRatio||1;
    this.W=wrap.clientWidth;
    this.H=wrap.clientHeight;
    this.canvas.width=Math.floor(this.W*this.dpr);
    this.canvas.height=Math.floor(this.H*this.dpr);
    this.canvas.style.width=this.W+'px';
    this.canvas.style.height=this.H+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    var m=LAB.current;
    if(m&&m.onResize)try{m.onResize(this.W,this.H);}catch(e){}
  },
  clear:function(color){
    if(color){
      this.ctx.fillStyle=color;
      this.ctx.fillRect(0,0,this.W,this.H);
    }else{
      this.ctx.clearRect(0,0,this.W,this.H);
    }
  },
  dispatch:function(type,data){
    var m=LAB.current;
    if(m&&m.onEvent)try{m.onEvent(type,data);}catch(e){console.error(e);}
  }
};

/* ================================================================
   LAB — module registry & main loop
   ================================================================ */
var LAB={
  modules:{},
  order:[],
  categories:{},
  current:null,
  currentKey:null,
  running:true,
  lastTime:0,
  fps:0,
  _frameCount:0,
  _fpsAccum:0,
  _started:false,
  settings:{
    theme:'nexus',
    speed:1.0,
    logOpen:true
  },
  register:function(key,def){
    def.key=key;
    this.modules[key]=def;
    this.order.push(key);
    var cat=def.category||'Other';
    if(!this.categories[cat])this.categories[cat]=[];
    this.categories[cat].push(key);
  },
  mount:function(key){
    var m=this.modules[key];
    if(!m){toast('Module not found: '+key,'error');return;}
    if(this.current&&this.current.onUnmount)try{this.current.onUnmount();}catch(e){}
    // Clear canvas
    CV.clear('#0a0a12');
    this.current=m;
    this.currentKey=key;
    this.running=true;
    // Module state
    m._state=m._state||{};
    m._frame=0;
    m._time=0;
    // Setup UI
    renderModulePills();
    renderControls();
    renderInfo();
    updateBadge(m.title,m.icon);
    // Init module
    if(m.init)try{m.init(CV.canvas,CV.ctx);}catch(e){console.error(e);logMsg('Init error: '+e.message,'err');}
    // Start loop
    this.lastTime=performance.now();
    if(!this._started){
      this._started=true;
      requestAnimationFrame(this._loop);
    }
    updatePlayBtn();
    logMsg('Mounted module: '+m.title,'ok');
  },
  unmountCurrent:function(){
    if(this.current&&this.current.onUnmount)try{this.current.onUnmount();}catch(e){}
    this.current=null;
  },
  _loop:function(now){
    var dt=Math.min((now-LAB.lastTime)/1000,0.1);
    LAB.lastTime=now;
    LAB._frameCount++;
    LAB._fpsAccum+=dt;
    if(LAB._fpsAccum>=0.5){
      LAB.fps=LAB._frameCount/LAB._fpsAccum;
      LAB._frameCount=0;
      LAB._fpsAccum=0;
      var f=$('tbFps');if(f)f.textContent=Math.round(LAB.fps)+' FPS';
    }
    var m=LAB.current;
    if(m){
      m._frame++;
      m._time+=dt;
      if(LAB.running){
        if(m.tick)try{m.tick(dt*LAB.settings.speed);}catch(e){console.error(e);}
      }
      if(m.draw){
        try{
          CV.clear(m.clearColor||'#0a0a12');
          m.draw(CV.ctx,dt);
        }catch(e){console.error(e);}
      }
    }
    requestAnimationFrame(LAB._loop);
  }
};

function updatePlayBtn(){
  var b=$('btnPlay');
  if(b)b.textContent=LAB.running?'⏸':'▶';
}
function togglePlay(){
  LAB.running=!LAB.running;
  updatePlayBtn();
  toast(LAB.running?'Playing':'Paused','info',1000);
}
function resetCurrent(){
  if(LAB.current&&LAB.current.init){
    LAB.current.init(CV.canvas,CV.ctx);
    logMsg('Reset: '+LAB.current.title,'info');
  }
}
function stepCurrent(){
  if(LAB.current&&LAB.current.tick){
    try{LAB.current.tick(1/60);}catch(e){}
  }
}
function updateBadge(text,icon){
  var b=$('coBadgeText');if(b)b.textContent=text;
  var i=$('coBadgeIcon');if(i)i.textContent=icon||'⚡';
}
function setStats(html){
  var s=$('coStats');
  if(s)s.innerHTML=html;
}

/* ================================================================
   UI RENDERING
   ================================================================ */
function renderTopCategories(){
  var bar=$('tbCats');if(!bar)return;
  bar.innerHTML='';
  Object.keys(LAB.categories).forEach(function(cat){
    var first=LAB.categories[cat][0];
    var m=LAB.modules[first];
    var icon=m.icon||'⚡';
    var item=el('div',{class:'tb-cat'+(LAB.current&&LAB.current.category===cat?' active':''),'data-cat':cat});
    item.innerHTML='<span class="cat-icon">'+icon+'</span><span class="cat-label">'+esc(cat)+'</span>';
    item.onclick=function(){switchCategory(cat);};
    bar.appendChild(item);
  });
}
function switchCategory(cat){
  var keys=LAB.categories[cat];
  if(!keys||!keys.length)return;
  LAB.mount(keys[0]);
  var mb=$('moduleBar');
  if(!mb.classList.contains('open'))toggleModuleBar();
}
function renderModulePills(){
  var pills=$('modulePills');if(!pills)return;
  var html='';
  Object.keys(LAB.categories).forEach(function(cat){
    html+='<div class="module-group-label">'+esc(cat)+'</div>';
    LAB.categories[cat].forEach(function(k){
      var m=LAB.modules[k];
      html+='<div class="module-pill'+(LAB.currentKey===k?' active':'')+'" data-k="'+k+'" onclick="LAB.mount(\''+k+'\')">'+
        '<span class="mp-icon">'+m.icon+'</span><span>'+esc(m.title)+'</span></div>';
    });
  });
  pills.innerHTML=html;
}
function toggleModuleBar(){
  var mb=$('moduleBar');
  mb.classList.toggle('open');
}
function toggleLog(){
  var lp=$('logPanel');
  lp.classList.toggle('open');
}
function toggleSidePanel(){
  var sp=$('sidePanel');
  sp.classList.toggle('collapsed');
}
function switchSpTab(name,el){
  $$('.sp-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  $$('.sp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=document.getElementById('sp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
}

/* ---------- CONTROLS RENDERER ---------- */
function renderControls(){
  var panel=$('spControls');if(!panel)return;
  panel.innerHTML='';
  var m=LAB.current;if(!m)return;
  var controls=m.controls||[];
  // Backwards compat: allow function
  if(typeof controls==='function'){
    try{controls(panel,m);}catch(e){panel.innerHTML='<div style="color:var(--c8);font-size:.7rem">Controls error: '+esc(e.message)+'</div>';}
    return;
  }
  controls.forEach(function(c){renderControl(panel,c,m);});
}
function renderControl(panel,c,m){
  if(c.type==='section'){
    var s=el('div',{class:'sp-section'});
    s.innerHTML='<h4>'+esc(c.label)+'</h4>';
    panel.appendChild(s);
    if(c.children){
      var ctr=el('div',{class:'ctrl'});
      c.children.forEach(function(sc){renderControl(ctr,sc,m);});
      s.appendChild(ctr);
    }
    return;
  }
  var wrap=el('div',{class:'ctrl'});
  if(c.label&&c.type!=='button'&&c.type!=='buttons'&&c.type!=='html'){
    var lab=el('div',{class:'ctrl-label'});
    lab.innerHTML='<span>'+esc(c.label)+'</span>'+(c.showValue?'<span id="ctrlVal_'+c.key+'">'+esc(String(c.value!=null?c.value:''))+'</span>':'');
    wrap.appendChild(lab);
  }
  switch(c.type){
    case 'slider': {
      var inp=el('input',{type:'range',min:c.min||0,max:c.max||100,step:c.step||1,value:c.value!=null?c.value:50});
      inp.oninput=function(){
        var v=parseFloat(this.value);
        if(c.showValue){var l=$('ctrlVal_'+c.key);if(l)l.textContent=c.format?c.format(v):v;}
        if(c.onChange)try{c.onChange(v,m);}catch(e){console.error(e);}
        if(c.key)m._state[c.key]=v;
      };
      wrap.appendChild(inp);
      if(c.key&&c.value!=null)m._state[c.key]=c.value;
      break;
    }
    case 'number': {
      var nin=el('input',{type:'number',value:c.value!=null?c.value:0,min:c.min,max:c.max,step:c.step||1});
      if(c.placeholder)nin.placeholder=c.placeholder;
      nin.onchange=function(){
        var v=parseFloat(this.value);
        if(c.onChange)try{c.onChange(v,m);}catch(e){}
        if(c.key)m._state[c.key]=v;
      };
      if(c.onInput){nin.oninput=nin.onchange;}
      wrap.appendChild(nin);
      if(c.key&&c.value!=null)m._state[c.key]=c.value;
      break;
    }
    case 'text': {
      var tin=el('input',{type:'text',value:c.value||''});
      if(c.placeholder)tin.placeholder=c.placeholder;
      tin.oninput=function(){
        if(c.onChange)try{c.onChange(this.value,m);}catch(e){}
        if(c.key)m._state[c.key]=this.value;
      };
      wrap.appendChild(tin);
      if(c.key&&c.value!=null)m._state[c.key]=c.value;
      break;
    }
    case 'textarea': {
      var ta=el('textarea',{});
      ta.value=c.value||'';
      if(c.placeholder)ta.placeholder=c.placeholder;
      if(c.rows)ta.rows=c.rows;
      ta.oninput=function(){
        if(c.onChange)try{c.onChange(this.value,m);}catch(e){}
        if(c.key)m._state[c.key]=this.value;
      };
      wrap.appendChild(ta);
      if(c.key&&c.value!=null)m._state[c.key]=c.value;
      break;
    }
    case 'select': {
      var sel=el('select',{});
      (c.options||[]).forEach(function(o){
        var v=typeof o==='string'?o:o.value;
        var l=typeof o==='string'?o:o.label;
        var opt=el('option',{value:v},esc(l));
        if(v==c.value)opt.selected=true;
        sel.appendChild(opt);
      });
      sel.onchange=function(){
        if(c.onChange)try{c.onChange(this.value,m);}catch(e){}
        if(c.key)m._state[c.key]=this.value;
      };
      wrap.appendChild(sel);
      if(c.key&&c.value!=null)m._state[c.key]=c.value;
      break;
    }
    case 'toggle': {
      var tog=el('div',{class:'toggle'+(c.value?' on':'')});
      tog.onclick=function(){
        this.classList.toggle('on');
        var v=this.classList.contains('on');
        if(c.onChange)try{c.onChange(v,m);}catch(e){}
        if(c.key)m._state[c.key]=v;
      };
      wrap.appendChild(tog);
      if(c.key)m._state[c.key]=!!c.value;
      break;
    }
    case 'button': {
      var b=el('button',{class:'btn '+(c.kind||'')+(c.full?' full':'')},c.icon?'<span>'+c.icon+'</span><span>'+esc(c.label)+'</span>':esc(c.label));
      b.onclick=function(){
        if(c.action)try{c.action(m);}catch(e){toast('Error: '+e.message,'error');console.error(e);}
      };
      wrap.appendChild(b);
      break;
    }
    case 'buttons': {
      var row=el('div',{class:'ctrl-row'});
      (c.items||[]).forEach(function(item){
        var b2=el('button',{class:'btn '+(item.kind||'')+(c.full?' full':'')},item.icon?('<span>'+item.icon+'</span><span>'+esc(item.label)+'</span>'):esc(item.label));
        b2.onclick=function(){
          if(item.action)try{item.action(m);}catch(e){toast('Error: '+e.message,'error');}
        };
        row.appendChild(b2);
      });
      wrap.appendChild(row);
      break;
    }
    case 'swatches': {
      var sw=el('div',{class:'swatch-row'});
      (c.colors||[]).forEach(function(col){
        var s2=el('div',{class:'swatch'+(c.value===col?' active':'')});
        s2.style.background=col;
        s2.style.color=col;
        s2.onclick=function(){
          sw.querySelectorAll('.swatch').forEach(function(x){x.classList.remove('active');});
          this.classList.add('active');
          if(c.onChange)try{c.onChange(col,m);}catch(e){}
          if(c.key)m._state[c.key]=col;
        };
        sw.appendChild(s2);
      });
      wrap.appendChild(sw);
      if(c.key)m._state[c.key]=c.value||c.colors[0];
      break;
    }
    case 'html': {
      wrap.innerHTML=c.html||'';
      if(c.mount)c.mount(wrap,m);
      break;
    }
  }
  panel.appendChild(wrap);
}
function renderInfo(){
  var panel=$('spInfo');if(!panel)return;
  var m=LAB.current;if(!m){panel.innerHTML='';return;}
  var html='<div class="sp-section"><h4>'+esc(m.title)+'</h4>';
  html+='<div style="font-size:.72rem;color:var(--tx2);line-height:1.6">'+esc(m.desc||'')+'</div></div>';
  if(m.help){
    html+='<div class="sp-section"><h4>Help</h4><div style="font-size:.7rem;color:var(--tx2);line-height:1.7">'+m.help+'</div></div>';
  }
  if(m.category){
    html+='<div class="sp-section"><h4>Meta</h4><table class="kv">';

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R'){resetCurrent();}
  else if(e.key==='ArrowRight'){stepCurrent();}
  else if(e.key==='m'||e.key==='M'){toggleModuleBar();}
  else if(e.key==='l'||e.key==='L'){toggleLog();}
  else if(e.key==='p'||e.key==='P'){toggleSidePanel();}
  else if(e.key==='t'||e.key==='T'){toggleTheme();}
  else if(e.key==='?'){showHelp();}
  else if(e.key==='Escape'){closeModal();}
  else if(LAB.current&&LAB.current.onEvent){
    if(LAB.current.onEvent('key',{key:e.key,code:e.code,raw:e}))e.preventDefault();
  }
});

<script>

/* ---------- GAME OF LIFE ---------- */
LAB.register('life',{
  title:'Game of Life',icon:'🧬',category:'Automata',
  desc:'Conway\'s Game of Life. Click cells to toggle, drag to draw. A cell survives with 2-3 neighbors, is born with exactly 3.',
  clearColor:'#0a0a12',
  complexity:'O(n) per step',
  init:function(){
    this.cellSize=10;
    this.cols=Math.max(20,Math.floor(CV.W/this.cellSize));
    this.rows=Math.max(20,Math.floor(CV.H/this.cellSize));
    this.grid=new Uint8Array(this.cols*this.rows);
    this.next=new Uint8Array(this.cols*this.rows);
    this.gen=0;
    this.pop=0;
    this.wrap=(this._state&&this._state.wrap!==false);
    this.survive=[2,3];
    this.born=[3];
    this.acc=0;
    this.gps=(this._state&&this._state.gps)||15;
    this.rule='B3/S23';
    this.seed();
  },
  seed:function(){
    // Random seed with density
    var d=(this._state&&this._state.density)||25;
    for(var i=0;i<this.grid.length;i++)this.grid[i]=Math.random()<d/100?1:0;
    this.gen=0;
    this.pop=this.grid.reduce(function(a,b){return a+b;},0);
  },
  seedPattern:function(name){
    this.grid.fill(0);
    var cx=Math.floor(this.cols/2),cy=Math.floor(this.rows/2);
    if(name==='glider'){
      var p=[[1,0],[2,1],[0,2],[1,2],[2,2]];
      p.forEach(function(q){var i=(cy+q[0])*this.cols+(cx+q[1]);if(i>=0&&i<this.grid.length)this.grid[i]=1;},this);
    }else if(name==='gun'){
      var gun='24b2o$24b2o\$26b2o$26b2o\$15b2o\$14bo2bo\$13bo4bo\$12bo6bo$12bo6bo$12bo6bo$13bo4bo\$14bo2bo\$15b2o';
      // simplified glider gun - use two blocks + stream
      var pts=[[5,5],[5,6],[6,5],[6,6],[3,13],[3,14],[4,12],[4,16],[5,11],[5,17],[6,11],[6,17],[7,12],[7,16],[8,13],[8,14],[5,25],[6,25],[7,25],[4,26],[8,26],[3,27],[9,27],[3,28],[9,28],[6,29],[4,30],[8,30],[5,31],[6,31],[7,31],[6,33],[3,34],[4,34],[5,34],[3,35],[4,35],[5,35],[2,36],[6,36],[1,38],[2,38],[6,38],[7,38],[3,48],[4,48],[3,49],[4,49]];
      pts.forEach(function(q){var i=(cy+q[0])*this.cols+(cx+q[1]);if(i>=0&&i<this.grid.length)this.grid[i]=1;});
    }else if(name==='r-pentomino'){
      var p=[[1,0],[2,0],[0,1],[1,1],[1,2]];
      p.forEach(function(q){var i=(cy+q[0])*this.cols+(cx+q[1]);if(i>=0&&i<this.grid.length)this.grid[i]=1;});
    }else if(name==='acorn'){
      var p=[[0,1],[1,3],[2,0],[2,1],[2,4],[2,5],[2,6]];
      p.forEach(function(q){var i=(cy+q[0])*this.cols+(cx+q[1]);if(i>=0&&i<this.grid.length)this.grid[i]=1;});
    }
    this.gen=0;
    this.pop=this.grid.reduce(function(a,b){return a+b;},0);
  },
  step:function(){
    var w=this.cols,h=this.rows;
    for(var y=0;y<h;y++){
      for(var x=0;x<w;x++){
        var n=0;
        for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
          if(dx===0&&dy===0)continue;
          var nx=x+dx,ny=y+dy;
          if(this.wrap){nx=(nx+w)%w;ny=(ny+h)%h;}
          else if(nx<0||nx>=w||ny<0||ny>=h)continue;
          n+=this.grid[ny*w+nx];
        }
        var i=y*w+x;
        var alive=this.grid[i];
        var next=0;
        if(alive){if(this.survive.indexOf(n)>-1)next=1;}
        else{if(this.born.indexOf(n)>-1)next=1;}
        this.next[i]=next;
      }
    }
    var tmp=this.grid;this.grid=this.next;this.next=tmp;
    this.gen++;
    this.pop=0;for(var k=0;k<this.grid.length;k++)this.pop+=this.grid[k];
  },
  tick:function(dt){
    this.acc+=dt;
    var interval=1/Math.max(0.5,this.gps);
    while(this.acc>=interval){
      this.acc-=interval;
      this.step();
    }
  },
  draw:function(ctx){
    var cs=this.cellSize;
    ctx.fillStyle='#0a0a12';
    ctx.fillRect(0,0,CV.W,CV.H);
    for(var y=0;y<this.rows;y++){
      for(var x=0;x<this.cols;x++){
        if(this.grid[y*this.cols+x]){
          var age=this.grid[y*this.cols+x];
          var hue=270+Math.sin((x+y)*0.1)*30;
          ctx.fillStyle='hsl('+(280+((x*7+y*3)%40))%360+',80%,60%)';
          ctx.fillRect(x*cs,y*cs,cs-0.5,cs-0.5);
        }
      }
    }
    // Grid overlay
    if(this._state&&this._state.grid){
      ctx.strokeStyle='rgba(255,255,255,.04)';
      ctx.lineWidth=0.5;
      for(var gx=0;gx<=this.cols;gx++){ctx.beginPath();ctx.moveTo(gx*cs,0);ctx.lineTo(gx*cs,this.rows*cs);ctx.stroke();}
      for(var gy=0;gy<=this.rows;gy++){ctx.beginPath();ctx.moveTo(0,gy*cs);ctx.lineTo(this.cols*cs,gy*cs);ctx.stroke();}
    }
    setStats('<div>Gen: <b style="color:var(--c1)">'+this.gen+'</b></div><div>Alive: <b style="color:var(--c2)">'+this.pop+'</b></div><div>Cells: '+this.cols+'×'+this.rows+'</div>');
  },
  onEvent:function(type,d){
    if(type==='down'||type==='move'){
      if(type==='move'&&!this._painting)return;
      if(type==='down')this._painting=!d.raw.shiftKey?true:false;
      var x=Math.floor(d.x/this.cellSize);
      var y=Math.floor(d.y/this.cellSize);
      if(x>=0&&x<this.cols&&y>=0&&y<this.rows){
        var idx=y*this.cols+x;
        this.grid[idx]=this._painting?1:0;
        this.pop=this.grid.reduce(function(a,b){return a+b;},0);
      }
    }
    if(type==='up')this._painting=false;
  },
  controls:function(panel,m){
    var ctrl=el('div',{});
    ctrl.innerHTML='<div class="sp-section"><h4>Simulation</h4></div>';
    panel.appendChild(ctrl);
    var wrap=el('div',{class:'ctrl'});
    wrap.innerHTML='<div class="ctrl-label"><span>Speed (gen/s)</span><span id="lifeSpd">'+this.gps+'</span></div>';
    var spd=el('input',{type:'range',min:1,max:60,step:1,value:this.gps});
    spd.oninput=function(){var v=parseInt(this.value);$('lifeSpd').textContent=v;if(LAB.current)LAB.current.gps=v;};
    wrap.appendChild(spd);panel.appendChild(wrap);
    var wrapD=el('div',{class:'ctrl'});
    wrapD.innerHTML='<div class="ctrl-label"><span>Density (%)</span><span id="lifeDen">25</span></div>';
    var den=el('input',{type:'range',min:5,max:70,step:5,value:25});
    den.oninput=function(){var v=parseInt(this.value);$('lifeDen').textContent=v;if(LAB.current)LAB.current._state.density=v;};
    wrapD.appendChild(den);panel.appendChild(wrapD);

    var sec2=el('div',{class:'sp-section'});
    sec2.innerHTML='<h4>Presets</h4>';
    var row=el('div',{class:'ctrl-row'});
    ['glider','gun','r-pentomino','acorn'].forEach(function(n){
      var b=el('button',{class:'btn sm'},n);
      b.onclick=function(){if(LAB.current)LAB.current.seedPattern(n);};
      row.appendChild(b);
    });
    sec2.appendChild(row);
    panel.appendChild(sec2);

    var sec3=el('div',{class:'sp-section'});
    sec3.innerHTML='<h4>Actions</h4>';
    var row3=el('div',{class:'ctrl-row'});
    var br=el('button',{class:'btn primary full'},'🎲 Randomize');
    br.onclick=function(){if(LAB.current)LAB.current.seed();};
    row3.appendChild(br);
    var bc=el('button',{class:'btn full'},'✕ Clear');
    bc.onclick=function(){if(LAB.current){LAB.current.grid.fill(0);LAB.current.pop=0;LAB.current.gen=0;}};
    row3.appendChild(bc);
    var bo=el('button',{class:'btn full'},'🔲 Toggle Grid');
    bo.onclick=function(){if(LAB.current){LAB.current._state.grid=!LAB.current._state.grid;}};
    row3.appendChild(bo);
    sec3.appendChild(row3);
    panel.appendChild(sec3);

    var sec4=el('div',{class:'sp-section'});
    sec4.innerHTML='<h4>Rules (B/S notation)</h4>';
    var rin=el('input',{type:'text',value:this.rule});
    rin.oninput=function(){
      var v=this.value.match(/B(\d+)\/S(\d+)/i);
      if(v&&LAB.current){
        LAB.current.born=v[1].split('').map(Number);
        LAB.current.survive=v[2].split('').map(Number);
        LAB.current.rule='B'+v[1]+'/S'+v[2];
      }
    };
    sec4.appendChild(rin);
    var presetRow=el('div',{class:'ctrl-row',style:'margin-top:6px'});
    [['B3/S23','Life'],['B36/S23','HighLife'],['B2/S','Seeds'],['B34/S34','34 Life'],['B357/S1357','Replicator']].forEach(function(p){
      var b=el('button',{class:'btn sm'},p[1]);
      b.onclick=function(){
        if(LAB.current){
          var v=p[0].match(/B(\d*)\/S(\d*)/);
          LAB.current.born=v[1].split('').map(Number).filter(function(x){return !isNaN(x);});
          LAB.current.survive=v[2].split('').map(Number).filter(function(x){return !isNaN(x);});
          LAB.current.rule=p[0];
          rin.value=p[0];
        }
      };
      presetRow.appendChild(b);
    });
    sec4.appendChild(presetRow);
    panel.appendChild(sec4);
  }
});

/* ---------- ELEMENTARY CA ---------- */
LAB.register('eca',{
  title:'Elementary CA',icon:'⚡',category:'Automata',
  desc:'1-dimensional cellular automaton. A single row evolves downward according to an 8-bit rule number (0–255). Try Rule 30, 90, 110, 184.',
  clearColor:'#0a0a12',
  init:function(){
    this.cellSize=Math.max(2,Math.floor(CV.W/300));
    this.cols=Math.floor(CV.W/this.cellSize);
    this.rows=Math.floor(CV.H/this.cellSize);
    this.rule=(this._state&&this._state.rule)!=null?this._state.rule:30;
    this.grid=new Uint8Array(this.cols*this.rows);
    this.row=0;
    this.initial=(this._state&&this._state.initial)||'center';
    this.reset();
    this.acc=0;
    this.rowsPerSec=30;
  },
  reset:function(){
    this.grid.fill(0);
    this.row=0;
    if(this.initial==='center'){
      this.grid[Math.floor(this.cols/2)]=1;
    }else if(this.initial==='random'){
      for(var i=0;i<this.cols;i++)this.grid[i]=Math.random()<0.5?1:0;
    }else if(this.initial==='left'){
      this.grid[0]=1;
    }
  },
  applyRule:function(l,c,r){
    var idx=(l<<2)|(c<<1)|r;
    return (this.rule>>idx)&1;
  },
  step:function(){
    if(this.row>=this.rows-1){this.reset();return;}
    var base=this.row*this.cols;
    var nbase=(this.row+1)*this.cols;
    // Wrap edges
    var l=this.grid[base+this.cols-1];
    var c=this.grid[base];
    var r=this.grid[base+1];
    this.grid[nbase+0]=this.applyRule(l,c,r);
    for(var x=1;x<this.cols-1;x++){
      this.grid[nbase+x]=this.applyRule(this.grid[base+x-1],this.grid[base+x],this.grid[base+x+1]);
    }
    this.grid[nbase+this.cols-1]=this.applyRule(this.grid[base+this.cols-2],this.grid[base+this.cols-1],this.grid[base+0]);
    this.row++;
  },
  tick:function(dt){
    this.acc+=dt;
    var iv=1/this.rowsPerSec;
    while(this.acc>=iv){this.acc-=iv;this.step();}
  },
  draw:function(ctx){
    var cs=this.cellSize;
    ctx.fillStyle='#0a0a12';
    ctx.fillRect(0,0,CV.W,CV.H);
    for(var y=0;y<=this.row;y++){
      for(var x=0;x<this.cols;x++){
        if(this.grid[y*this.cols+x]){
          var t=y/Math.max(1,this.rows);
          var hue=(this.rule*7+x*2+y)%360;
          ctx.fillStyle='hsl('+hue+',80%,'+(50+Math.sin(t*6)*10)+'%)';
          ctx.fillRect(x*cs,y*cs,cs,cs);
        }
      }
    }
    // Current row indicator
    if(this.row<this.rows){
      ctx.strokeStyle='rgba(255,46,136,.5)';
      ctx.lineWidth=1;
      ctx.strokeRect(0,this.row*cs,this.cols*cs,cs);
    }
    setStats('<div>Rule: <b style="color:var(--c1)">'+this.rule+'</b></div><div>Row: '+this.row+'/'+this.rows+'</div><div>Cells: '+this.cols+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});
    s1.innerHTML='<h4>Rule</h4>';
    var rin=el('input',{type:'number',min:0,max:255,value:this.rule});
    rin.oninput=function(){var v=parseInt(this.value)||0;if(LAB.current){LAB.current.rule=clamp(v,0,255);LAB.current.reset();}};
    s1.appendChild(rin);
    var row=el('div',{class:'ctrl-row',style:'margin-top:8px'});
    ['30','90','110','184','150','73','105','22','182'].forEach(function(r){
      var b=el('button',{class:'btn sm'},'R'+r);
      b.onclick=function(){rin.value=r;if(LAB.current){LAB.current.rule=parseInt(r);LAB.current.reset();}};
      row.appendChild(b);
    });
    s1.appendChild(row);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});
    s2.innerHTML='<h4>Initial State</h4>';
    var sel=el('select',{});
    ['center','random','left'].forEach(function(o){
      var opt=el('option',{value:o},o);
      if(this.initial===o)opt.selected=true;
      sel.appendChild(opt);
    }.bind(this));
    sel.onchange=function(){if(LAB.current){LAB.current.initial=this.value;LAB.current.reset();}};
    s2.appendChild(sel);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});
    s3.innerHTML='<h4>Speed</h4>';
    var spd=el('input',{type:'range',min:5,max:120,step:5,value:this.rowsPerSec});
    spd.oninput=function(){if(LAB.current)LAB.current.rowsPerSec=parseInt(this.value);};
    s3.appendChild(spd);
    panel.appendChild(s3);

    var s4=el('div',{class:'sp-section'});
    s4.innerHTML='<h4>Rule Binary</h4>';
    var bin=(this.rule).toString(2).padStart(8,'0');
    var binHTML='<div style="font-family:var(--mono);font-size:.7rem;color:var(--c2);padding:6px 0">';
    for(var i=7;i>=0;i--){
      var l=(i>>2)&1,c2=(i>>1)&1,r=i&1;
      var out=bin[7-i];
      binHTML+='<div>'+l+c2+r+' → '+out+'</div>';
    }
    binHTML+='</div>';
    s4.innerHTML+='<div id="ecaBin">'+binHTML+'</div>';
    panel.appendChild(s4);
  },
  onEvent:function(type,d){
    if(type==='down'){
      var x=Math.floor(d.x/this.cellSize);
      if(x>=0&&x<this.cols){
        this.grid[x]=1-this.grid[x];
      }
    }
  }
});

/* ---------- LANGTON'S ANT ---------- */
LAB.register('langton',{
  title:"Langton's Ant",icon:'🐜',category:'Automata',
  desc:"A 2D Turing machine. The ant turns right on white cells (turning them black) and left on black cells (turning them white), then moves forward. After ~10,000 steps it builds a recurring 'highway'.",
  clearColor:'#0a0a12',
  init:function(){
    this.cellSize=(this._state&&this._state.cellSize)||4;
    this.cols=Math.floor(CV.W/this.cellSize);
    this.rows=Math.floor(CV.H/this.cellSize);
    this.grid=new Uint8Array(this.cols*this.rows);
    this.antX=Math.floor(this.cols/2);
    this.antY=Math.floor(this.rows/2);
    this.antDir=0; // 0=up,1=right,2=down,3=left
    this.steps=0;
    this.rulesRight=(this._state&&this._state.rulesRight)||'1';
    this.rulesLeft=(this._state&&this._state.rulesLeft)||'0';
    this.acc=0;
    this.sps=200;
    this.antColor=this._state&&this._state.color||'#ff2e88';
  },
  step:function(){
    var i=this.antY*this.cols+this.antX;
    if(i<0||i>=this.grid.length)return;
    var state=this.grid[i];
    // Turn: if cell state in rulesRight → turn right; if in rulesLeft → turn left
    if(this.rulesRight.indexOf(String(state))>-1){
      this.antDir=(this.antDir+1)%4;
    }else if(this.rulesLeft.indexOf(String(state))>-1){
      this.antDir=(this.antDir+3)%4;
    }
    // Flip
    this.grid[i]=(state+1)%2;
    // Move
    if(this.antDir===0)this.antY--;
    else if(this.antDir===1)this.antX++;
    else if(this.antDir===2)this.antY++;
    else this.antX--;
    // Wrap
    if(this.antX<0)this.antX=this.cols-1;
    if(this.antX>=this.cols)this.antX=0;
    if(this.antY<0)this.antY=this.rows-1;
    if(this.antY>=this.rows)this.antY=0;
    this.steps++;
  },
  tick:function(dt){
    this.acc+=dt;
    var iv=1/this.sps;
    var iterations=0;
    while(this.acc>=iv&&iterations<5000){this.acc-=iv;this.step();iterations++;}
  },
  draw:function(ctx){
    var cs=this.cellSize;
    ctx.fillStyle='#0a0a12';
    ctx.fillRect(0,0,CV.W,CV.H);
    for(var y=0;y<this.rows;y++){
      for(var x=0;x<this.cols;x++){
        var v=this.grid[y*this.cols+x];
        if(v){
          var hue=((x*3+y*5)%60)+270;
          ctx.fillStyle='hsl('+(hue%360)+',70%,55%)';
          ctx.fillRect(x*cs,y*cs,cs,cs);
        }
      }
    }
    // Ant
    ctx.fillStyle=this.antColor;
    ctx.beginPath();
    var px=this.antX*cs+cs/2,py=this.antY*cs+cs/2;
    var size=Math.max(3,cs);

LAB.register('brian',{

    this.rows=Math.floor(CV.H/this.cellSize);

    this.next=new Uint8Array(this.cols*this.rows);
    this.gen=0;
    this.acc=0;
    this.gps=(this._state&&this._state.gps)||15;

  step:function(){
    var w=this.cols,h=this.rows;
    for(var y=0;y<h;y++)for(var x=0;x<w;x++){
      var i=y*w+x;
      var s=this.grid[i];

      else if(s===2){this.next[i]=0;}
      else{

LAB.register('wolfram',{
  title:'Wolfram Explorer',icon:'🌈',category:'Automata',
  desc:'Automatically cycles through many elementary CA rules, or explore a single rule with a color-coded heatmap.',
  clearColor:'#0a0a12',
  init:function(){
    this.cellSize=2;
    this.cols=Math.floor(CV.W/this.cellSize);
    this.rows=Math.floor(CV.H/this.cellSize);
    this.rule=(this._state&&this._state.rule)!=null?this._state.rule:30;
    this.autoCycle=false;
    this.grid=new Uint8Array(this.cols*this.rows);
    this.row=0;
    this.acc=0;this.rps=60;
    this.reset();
  },
  reset:function(){
    this.grid.fill(0);
    this.row=0;
    this.grid[Math.floor(this.cols/2)]=1;
  },
  applyRule:function(l,c,r){return (this.rule>>((l<<2)|(c<<1)|r))&1;},
  step:function(){
    if(this.row>=this.rows-1){
      if(this.autoCycle){
        this.rule=(this.rule+1)%256;
        var rn=document.getElementById('wfRule');if(rn)rn.value=this.rule;
      }
      this.reset();return;
    }
    var base=this.row*this.cols,nbase=(this.row+1)*this.cols;
    for(var x=0;x<this.cols;x++){
      var l=this.grid[base+(x-1+this.cols)%this.cols];
      var c=this.grid[base+x];
      var r=this.grid[base+(x+1)%this.cols];
      this.grid[nbase+x]=this.applyRule(l,c,r);
    }
    this.row++;
  },
  tick:function(dt){this.acc+=dt;var iv=1/this.rps;while(this.acc>=iv){this.acc-=iv;this.step();}},
  draw:function(ctx){
    var cs=this.cellSize;
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    for(var y=0;y<=this.row;y++){
      for(var x=0;x<this.cols;x++){
        if(this.grid[y*this.cols+x]){
          var hue=((this.rule*3+y)%360);
          ctx.fillStyle='hsl('+hue+',80%,'+(55-y*0.02)+'%)';
          ctx.fillRect(x*cs,y*cs,cs,cs);
        }
      }
    }
    setStats('<div>Rule: <b style="color:var(--c1)">'+this.rule+'</b></div><div>Row: '+this.row+'</div><div>'+(this.autoCycle?'Auto-cycling':'Manual')+'</div>');

    rin.id='wfRule';
    rin.oninput=function(){var v=parseInt(this.value)||0;if(LAB.current){LAB.current.rule=clamp(v,0,255);LAB.current.reset();}};
    s1.appendChild(rin);panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Actions</h4>';
    var bac=el('button',{class:'btn full'},'🔁 Auto-cycle rules');
    bac.onclick=function(){if(LAB.current){LAB.current.autoCycle=!LAB.current.autoCycle;toast('Auto-cycle: '+LAB.current.autoCycle,'info');}};
    s2.appendChild(bac);
    var br=el('button',{class:'btn primary full',style:'margin-top:6px'},'↺ Reset');
    br.onclick=function(){if(LAB.current)LAB.current.reset();};
    s2.appendChild(br);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Speed</h4>';
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Rows/s</span><span id="wfSP">'+this.rps+'</span></div>';
    var r=el('input',{type:'range',min:5,max:200,value:this.rps});
    r.oninput=function(){var v=parseInt(this.value);$('wfSP').textContent=v;if(LAB.current)LAB.current.rps=v;};
    c.appendChild(r);s3.appendChild(c);panel.appendChild(s3);
  }
});

<script>
/* ================================================================
   PHYSICS SIMULATION MODULES
   ================================================================ */

/* ---------- PARTICLE LIFE ---------- */
LAB.register('particle-life',{
  title:'Particle Life',icon:'✨',category:'Physics',
  desc:'Multiple particle types attract and repel each other by simple rules. Complex emergent behavior from a tiny interaction matrix.',
  clearColor:'#0a0a12',
  init:function(){
    this.numTypes=(this._state&&this._state.numTypes)||5;
    this.numParticles=(this._state&&this._state.numParticles)||600;
    this.rMax=(this._state&&this._state.rMax)||70;
    this.beta=(this._state&&this._state.beta)||0.3;
    this.dt=0.012;
    this.forceFactor=6;
    this.frictionHalfLife=0.04;
    this.colors=['#ff2e88','#00e5ff','#ffc400','#7c4dff','#00ff88','#ff6d00','#40e0d0','#ff5252'];
    this.particles=[];
    this.matrix=[];
    for(var i=0;i<this.numTypes;i++){
      this.matrix.push([]);
      for(var j=0;j<this.numTypes;j++)this.matrix[i].push(rndF(-1,1));
    }
    for(var i=0;i<this.numParticles;i++){
      this.particles.push({
        x:Math.random()*CV.W,y:Math.random()*CV.H,
        vx:0,vy:0,t:rnd(0,this.numTypes-1)
      });
    }
  },
  tick:function(dt){
    var ps=this.particles,n=ps.length;
    var rMax=this.rMax,rMax2=rMax*rMax;
    var rMaxInv=1/rMax;
    var factor=this.forceFactor*rMax;
    // Force accumulation
    for(var i=0;i<n;i++){ps[i].fx=0;ps[i].fy=0;}
    var sqrtN=Math.floor(Math.sqrt(n));
    for(var i=0;i<n;i++){
      var a=ps[i];
      for(var j=i+1;j<n;j++){
        var b=ps[j];
        var dx=b.x-a.x,dy=b.y-a.y;
        var d2=dx*dx+dy*dy;
        if(d2>0&&d2<rMax2){
          var d=Math.sqrt(d2);
          var f=(d<rMax*this.beta)?d/rMax-1:(1-d/rMax)*this.matrix[a.t][b.t];
          var fx=f*dx/d,fy=f*dy/d;
          a.fx+=fx;a.fy+=fy;b.fx-=fx;b.fy-=fy;
        }
      }
    }
    var speedHalf=this.frictionHalfLife;
    var vf=Math.pow(0.5,this.dt/speedHalf);
    for(var i=0;i<n;i++){
      var p=ps[i];
      p.vx=p.vx*vf+p.fx*factor*this.dt;
      p.vy=p.vy*vf+p.fy*factor*this.dt;
      var sp=Math.hypot(p.vx,p.vy);
      if(sp>rMax*4){p.vx*=rMax*4/sp;p.vy*=rMax*4/sp;}
      p.x+=p.vx*this.dt;p.y+=p.vy*this.dt;
      if(p.x<0)p.x+=CV.W;if(p.x>=CV.W)p.x-=CV.W;
      if(p.y<0)p.y+=CV.H;if(p.y>=CV.H)p.y-=CV.H;
    }
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    for(var i=0;i<this.particles.length;i++){
      var p=this.particles[i];
      var c=this.colors[p.t%this.colors.length];
      ctx.fillStyle=c;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
      ctx.fill();
    }
    // Glow
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<this.particles.length;i++){
      var p=this.particles[i];
      ctx.fillStyle=this.colors[p.t%this.colors.length]+'22';
      ctx.beginPath();
      ctx.arc(p.x,p.y,7,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';

/* ---------- BOIDS ---------- */
LAB.register('boids',{
  title:'Boids Flocking',icon:'🐦',category:'Physics',
  desc:'Classic Reynolds boids simulation. Each bird steers by separation, alignment, and cohesion rules — producing lifelike flocking.',
  clearColor:'#0a0a12',
  init:function(){
    this.count=(this._state&&this._state.count)||150;
    this.perception=(this._state&&this._state.perception)||60;
    this.separationDist=(this._state&&this._state.separationDist)||24;
    this.maxSpeed=(this._state&&this._state.maxSpeed)||3;
    this.maxForce=(this._state&&this._state.maxForce)||0.15;
    this.wSep=(this._state&&this._state.wSep)||1.5;
    this.wAli=(this._state&&this._state.wAli)||1.0;
    this.wCoh=(this._state&&this._state.wCoh)||1.0;
    this.wander=0.3;
    this.trail=false;
    this.boids=[];
    for(var i=0;i<this.count;i++){
      this.boids.push({
        x:Math.random()*CV.W,y:Math.random()*CV.H,
        vx:rndF(-1,1),vy:rndF(-1,1)
      });
    }
    this._mouse={x:-999,y:-999};
  },
  tick:function(dt){
    var bs=this.boids,n=bs.length,perception=this.perception,perception2=perception*perception;
    var sepDist=this.separationDist,sepDist2=sepDist*sepDist;
    var maxSpeed=this.maxSpeed,maxForce=this.maxForce;
    for(var i=0;i<n;i++){
      var b=bs[i];
      var sepX=0,sepY=0,aliX=0,aliY=0,cohX=0,cohY=0;
      var sepN=0,aliN=0,cohN=0;
      for(var j=0;j<n;j++){
        if(i===j)continue;
        var o=bs[j];
        var dx=o.x-b.x,dy=o.y-b.y;
        var d2=dx*dx+dy*dy;
        if(d2<perception2&&d2>0){
          aliX+=o.vx;aliY+=o.vy;aliN++;
          cohX+=o.x;cohY+=o.y;cohN++;
          if(d2<sepDist2){
            var inv=1/Math.sqrt(d2);
            sepX-=dx*inv;sepY-=dy*inv;sepN++;
          }
        }
      }
      var ax=0,ay=0;
      // Separation
      if(sepN>0){
        sepX/=sepN;sepY/=sepN;
        var m1=Math.hypot(sepX,sepY);
        if(m1>0){sepX=sepX/m1*maxSpeed-b.vx;sepY=sepY/m1*maxSpeed-b.vy;}
        var mf1=Math.hypot(sepX,sepY);
        if(mf1>maxForce){sepX=sepX/mf1*maxForce;sepY=sepY/mf1*maxForce;}
        ax+=sepX*this.wSep;ay+=sepY*this.wSep;
      }
      // Alignment
      if(aliN>0){
        aliX/=aliN;aliY/=aliN;
        var m2=Math.hypot(aliX,aliY);
        if(m2>0){aliX=aliX/m2*maxSpeed-b.vx;aliY=aliY/m2*maxSpeed-b.vy;}
        var mf2=Math.hypot(aliX,aliY);
        if(mf2>maxForce){aliX=aliX/mf2*maxForce;aliY=aliY/mf2*maxForce;}
        ax+=aliX*this.wAli;ay+=aliY*this.wAli;
      }
      // Cohesion
      if(cohN>0){
        cohX/=cohN;cohY/=cohN;
        cohX-=b.x;cohY-=b.y;
        var m3=Math.hypot(cohX,cohY);
        if(m3>0){cohX=cohX/m3*maxSpeed-b.vx;cohY=cohY/m3*maxSpeed-b.vy;}
        var mf3=Math.hypot(cohX,cohY);
        if(mf3>maxForce){cohX=cohX/mf3*maxForce;cohY=cohY/mf3*maxForce;}
        ax+=cohX*this.wCoh;ay+=cohY*this.wCoh;
      }
      // Avoid mouse
      if(this._mouse.x>0){
        var mdx=b.x-this._mouse.x,mdy=b.y-this._mouse.y;
        var md2=mdx*mdx+mdy*mdy;
        if(md2<100*100){
          var md=Math.sqrt(md2)||1;
          ax+=(mdx/md)*maxForce*2;
          ay+=(mdy/md)*maxForce*2;
        }
      }
      b.vx+=ax;b.vy+=ay;
      var sp=Math.hypot(b.vx,b.vy);
      if(sp>maxSpeed){b.vx=b.vx/sp*maxSpeed;b.vy=b.vy/sp*maxSpeed;}
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<0)b.x+=CV.W;if(b.x>=CV.W)b.x-=CV.W;
      if(b.y<0)b.y+=CV.H;if(b.y>=CV.H)b.y-=CV.H;
    }
  },
  draw:function(ctx){
    if(this.trail){
      ctx.fillStyle='rgba(10,10,18,.08)';
      ctx.fillRect(0,0,CV.W,CV.H);
    }else{
      ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    }
    for(var i=0;i<this.boids.length;i++){
      var b=this.boids[i];
      var angle=Math.atan2(b.vy,b.vx);
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(angle);
      ctx.fillStyle='#00e5ff';
      ctx.beginPath();
      ctx.moveTo(6,0);
      ctx.lineTo(-4,-3);
      ctx.lineTo(-4,3);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    setStats('<div>Boids: <b style="color:var(--c1)">'+this.boids.length+'</b></div><div>Perception: '+this.perception+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Weights</h4>';
    var self=this;
    function sl(key,label,min,max,val){
      var c=el('div',{class:'ctrl'});
      c.innerHTML='<div class="ctrl-label"><span>'+label+'</span><span id="bo_'+key+'">'+val.toFixed(2)+'</span></div>';
      var r=el('input',{type:'range',min:min,max:max,step:0.1,value:val});
      r.oninput=function(){var v=parseFloat(this.value);$('bo_'+key).textContent=v.toFixed(2);if(LAB.current)LAB.current[key]=v;};
      c.appendChild(r);s1.appendChild(c);
    }
    sl('wSep','Separation',0,3,this.wSep);
    sl('wAli','Alignment',0,3,this.wAli);
    sl('wCoh','Cohesion',0,3,this.wCoh);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Physics</h4>';
    sl('perception','Perception',20,150,this.perception);
    sl('separationDist','Min Distance',10,60,this.separationDist);
    sl('maxSpeed','Max Speed',1,8,this.maxSpeed);
    sl('maxForce','Max Force',0.02,0.5,this.maxForce);
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Count</span><span id="bo_ct">'+this.count+'</span></div>';
    var r=el('input',{type:'range',min:10,max:500,value:this.count});
    r.oninput=function(){$('bo_ct').textContent=this.value;if(LAB.current){LAB.current.count=parseInt(this.value);LAB.current.init();}};
    c.appendChild(r);s2.appendChild(c);
    panel.appendChild(s2);

    var s3=el('div',{class:'sp-section'});s3.innerHTML='<h4>Actions</h4>';
    var bt=el('button',{class:'btn full'},'🎨 Toggle Trail');
    bt.onclick=function(){if(LAB.current){LAB.current.trail=!LAB.current.trail;toast('Trail: '+LAB.current.trail,'info');}};
    s3.appendChild(bt);
    var br=el('button',{class:'btn primary full',style:'margin-top:6px'},'↺ Reset');
    br.onclick=function(){if(LAB.current)LAB.current.init();};
    s3.appendChild(br);
    panel.appendChild(s3);
  },
  onEvent:function(type,d){
    if(type==='move'||type==='down'){this._mouse={x:d.x,y:d.y};}
    if(type==='leave'){this._mouse={x:-999,y:-999};}
  }
});

/* ---------- DOUBLE PENDULUM ---------- */
LAB.register('pendulum',{
  title:'Double Pendulum',icon:'⚙️',category:'Physics',
  desc:'Two coupled pendulums create a chaotic system highly sensitive to initial conditions. Trails show the second pendulum bob path.',
  clearColor:'#0a0a12',
  init:function(){
    this.g=(this._state&&this._state.g)||1.0;
    this.l1=1;this.l2=1;
    this.m1=1;this.m2=1;
    this.a1=Math.PI/2+rndF(-0.05,0.05);
    this.a2=Math.PI/2+rndF(-0.05,0.05);
    this.a1v=0;this.a2v=0;
    this.dt=0.002;
    this.scale=Math.min(CV.W,CV.H)*0.22;
    this.trail=[];
    this.maxTrail=(this._state&&this._state.maxTrail)||400;
    this.x0=CV.W/2;this.y0=CV.H/2-CV.H*0.1;
    this.stepsPerFrame=(this._state&&this._state.stepsPerFrame)||15;
  },
  acc:function(state){
    var a1=state[0],a2=state[1],v1=state[2],v2=state[3];
    var g=this.g,m1=this.m1,m2=this.m2,l1=this.l1,l2=this.l2;
    var num1=-g*(2*m1+m2)*Math.sin(a1)-m2*g*Math.sin(a1-2*a2)-2*Math.sin(a1-a2)*m2*(v2*v2*l2+v1*v1*l1*Math.cos(a1-a2));
    var den1=l1*(2*m1+m2-m2*Math.cos(2*a1-2*a2));
    var num2=2*Math.sin(a1-a2)*(v1*v1*l1*(m1+m2)+g*(m1+m2)*Math.cos(a1)+v2*v2*l2*m2*Math.cos(a1-a2));
    var den2=l2*(2*m1+m2-m2*Math.cos(2*a1-2*a2));
    return [v1,v2,num1/den1,num2/den2];
  },
  rk4:function(){
    var s=[this.a1,this.a2,this.a1v,this.a2v];
    var h=this.dt;
    var k1=this.acc(s);
    var s2=s.map(function(x,i){return x+k1[i]*h/2;});
    var k2=this.acc(s2);
    var s3=s.map(function(x,i){return x+k2[i]*h/2;});
    var k3=this.acc(s3);
    var s4=s.map(function(x,i){return x+k3[i]*h;});
    var k4=this.acc(s4);
    for(var i=0;i<4;i++)s[i]+=h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
    this.a1=s[0];this.a2=s[1];this.a1v=s[2];this.a2v=s[3];
  },
  tick:function(dt){
    for(var i=0;i<this.stepsPerFrame;i++)this.rk4();
    var x1=this.x0+this.scale*Math.sin(this.a1);
    var y1=this.y0+this.scale*Math.cos(this.a1);
    var x2=x1+this.scale*Math.sin(this.a2);
    var y2=y1+this.scale*Math.cos(this.a2);
    this.trail.push({x:x2,y:y2});
    if(this.trail.length>this.maxTrail)this.trail.shift();
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var x1=this.x0+this.scale*Math.sin(this.a1);
    var y1=this.y0+this.scale*Math.cos(this.a1);
    var x2=x1+this.scale*Math.sin(this.a2);
    var y2=y1+this.scale*Math.cos(this.a2);
    // Trail
    if(this.trail.length>1){
      ctx.strokeStyle='rgba(255,46,136,.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      for(var i=0;i<this.trail.length;i++){
        var p=this.trail[i];
        if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }
    // Rods
    ctx.strokeStyle='#a8a8c0';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(this.x0,this.y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.stroke();
    // Balls
    ctx.fillStyle='#00e5ff';
    ctx.beginPath();ctx.arc(x1,y1,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffc400';
    ctx.beginPath();ctx.arc(x2,y2,14,0,Math.PI*2);ctx.fill();
    // Pivot
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(this.x0,this.y0,5,0,Math.PI*2);ctx.fill();
    var energy=0.5*(this.m1+this.m2)*this.l1*this.l1*this.a1v*this.a1v+0.5*this.m2*this.l2*this.l2*this.a2v*this.a2v+0.5*this.m2*this.l1*this.l2*this.a1v*this.a2v*Math.cos(this.a1-this.a2)+(this.m1+this.m2)*this.g*this.l1*Math.cos(this.a1)+this.m2*this.g*this.l2*Math.cos(this.a2);
    setStats('<div>θ₁: <b style="color:var(--c1)">'+fmt(this.a1,2)+'</b></div><div>θ₂: <b style="color:var(--c2)">'+fmt(this.a2,2)+'</b></div><div>Energy: '+fmt(energy,2)+'</div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Parameters</h4>';
    function sl(key,label,min,max,val,step){
      var c=el('div',{class:'ctrl'});
      c.innerHTML='<div class="ctrl-label"><span>'+label+'</span><span id="pd_'+key+'">'+val.toFixed(2)+'</span></div>';
      var r=el('input',{type:'range',min:min,max:max,step:step||0.01,value:val});
      r.oninput=function(){var v=parseFloat(this.value);$('pd_'+key).textContent=v.toFixed(2);if(LAB.current)LAB.current[key]=v;};
      c.appendChild(r);s1.appendChild(c);
    }
    sl('g','Gravity',0.1,3,this.g,0.1);
    sl('m1','Mass 1',0.5,5,this.m1,0.1);
    sl('m2','Mass 2',0.5,5,this.m2,0.1);
    var c=el('div',{class:'ctrl'});
    c.innerHTML='<div class="ctrl-label"><span>Steps/Frame</span><span id="pd_sf">'+this.stepsPerFrame+'</span></div>';
    var r=el('input',{type:'range',min:1,max:80,value:this.stepsPerFrame});
    r.oninput=function(){$('pd_sf').textContent=this.value;if(LAB.current)LAB.current.stepsPerFrame=parseInt(this.value);};
    c.appendChild(r);s1.appendChild(c);
    panel.appendChild(s1);

    var s2=el('div',{class:'sp-section'});s2.innerHTML='<h4>Actions</h4>';
    var b1=el('button',{class:'btn full'},'🎲 Randomize');
    b1.onclick=function(){if(LAB.current){LAB.current.a1=Math.PI/2+rndF(-0.5,0.5);LAB.current.a2=Math.PI/2+rndF(-0.5,0.5);LAB.current.a1v=0;LAB.current.a2v=0;LAB.current.trail=[];}};
    s2.appendChild(b1);
    var b2=el('button',{class:'btn primary full',style:'margin-top:6px'},'↺ Reset');
    b2.onclick=function(){if(LAB.current){LAB.current.a1=Math.PI/2;LAB.current.a2=Math.PI/2;LAB.current.a1v=0;LAB.current.a2v=0;LAB.current.trail=[];}};
    s2.appendChild(b2);
    var b3=el('button',{class:'btn full',style:'margin-top:6px'},'🗑 Clear Trail');
    b3.onclick=function(){if(LAB.current)LAB.current.trail=[];};
    s2.appendChild(b3);
    panel.appendChild(s2);
  }
});

/* ---------- LORENZ ATTRACTOR ---------- */
LAB.register('lorenz',{
  title:'Lorenz Attractor',icon:'🌪️',category:'Physics',
  desc:'The famous strange attractor from chaos theory. 3D trajectories projected to 2D showing sensitive dependence on initial conditions.',
  clearColor:'#0a0a12',
  init:function(){
    this.sigma=(this._state&&this._state.sigma)||10;
    this.rho=(this._state&&this._state.rho)||28;
    this.beta=(this._state&&this._state.beta)||8/3;
    this.dt=0.005;
    this.scale=(this._state&&this._state.scale)||9;
    this.trailLen=(this._state&&this._state.trailLen)||2000;
    this.stepsPerFrame=(this._state&&this._state.stepsPerFrame)||4;
    this.project=(this._state&&this._state.project)||'xz';
    this.trails=[];
    this.nTrails=(this._state&&this._state.nTrails)||1;
    for(var i=0;i<this.nTrails;i++){
      this.trails.push({
        x:rndF(-1,1)+(i*0.001),y:rndF(-1,1),z:rndF(-1,1)+20,
        pts:[]
      });
    }
    this.colors=['#ff2e88','#00e5ff','#ffc400','#7c4dff','#00ff88'];
  },
  project3:function(p){
    if(this.project==='xy')return {x:p.x,y:p.y};
    if(this.project==='xz')return {x:p.x,y:p.z-25};
    if(this.project==='yz')return {x:p.y,y:p.z-25};
    return {x:p.x,y:p.z-25};
  },
  stepOne:function(t){
    var s=this.sigma,r=this.rho,b=this.beta,h=this.dt;
    var dx=s*(t.y-t.x);
    var dy=t.x*(r-t.z)-t.y;
    var dz=t.x*t.y-b*t.z;
    t.x+=dx*h;t.y+=dy*h;t.z+=dz*h;
  },
  tick:function(dt){
    for(var k=0;k<this.stepsPerFrame;k++){
      for(var i=0;i<this.trails.length;i++){
        var t=this.trails[i];
        this.stepOne(t);
        t.pts.push({x:t.x,y:t.y,z:t.z});
        if(t.pts.length>this.trailLen)t.pts.shift();
      }
    }
  },
  draw:function(ctx){
    ctx.fillStyle='#0a0a12';ctx.fillRect(0,0,CV.W,CV.H);
    var cx=CV.W/2,cy=CV.H/2;
    var sc=this.scale;
    for(var i=0;i<this.trails.length;i++){
      var t=this.trails[i];
      var color=this.colors[i%this.colors.length];
      ctx.strokeStyle=color;
      ctx.lineWidth=1.2;
      ctx.globalCompositeOperation='lighter';
      ctx.beginPath();
      var started=false;
      for(var k=0;k<t.pts.length;k++){
        var p=t.pts[k];
        var proj=this.project3(p);
        var x=cx+proj.x*sc,y=cy-proj.y*sc;
        if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.globalCompositeOperation='source-over';
      // Head dot
      if(t.pts.length){
        var head=t.pts[t.pts.length-1];
        var hp=this.project3(head);
        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.arc(cx+hp.x*sc,cy-hp.y*sc,3.5,0,Math.PI*2);
        ctx.fill();
      }
    }
    var t0=this.trails[0];
    setStats('<div>σ: '+this.sigma+' ρ: '+this.rho+' β: '+fmt(this.beta,2)+'</div>'+
      '<div>X: <b style="color:var(--c1)">'+fmt(t0.x,2)+'</b></div>'+
      '<div>Y: <b style="color:var(--c2)">'+fmt(t0.y,2)+'</b></div>'+
      '<div>Z: <b style="color:var(--c3)">'+fmt(t0.z,2)+'</b></div>');
  },
  controls:function(panel,m){
    var s1=el('div',{class:'sp-section'});s1.innerHTML='<h4>Chaos Params</h4>';
    function sl(key,label,min,max,val,step){
      var c=el('div',{class:'ctrl'});
      c.innerHTML='<div class="ctrl-label"><span>'+label+'</span><span id="lz_'+key+'">'+val.toFixed(2)+'</span></div>';
      var r=el('input',{type:'range',min:min,max:max,step:step||0.1,value:val});
      r.oninput=function(){var v=parseFloat(this.value);$('lz_'+key).textContent=v.toFixed(2);if(LAB.current)LAB.current[key]=v;};
      c.appendChild(r);s1.appendChild(c);
    }
    sl('sigma','σ Sigma',1,20,this.sigma,0.1);
