registerModule('teleport',{
  title:'Quantum Teleportation',
  icon:'🚀',
  desc:'Send an unknown qubit state using entanglement + 2 classical bits.',
  init:function(){
    var t=STATE.teleport;
    var alpha=new C(t.alphaRe,t.alphaIm);
    var beta=new C(t.betaRe,t.betaIm);
    var n=Math.sqrt(cAbs2(alpha)+cAbs2(beta));
    if(n>1e-9){alpha=cScale(alpha,1/n);beta=cScale(beta,1/n);}
    t.result=teleportationProtocol(alpha,beta);
    t.step=0;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var t=STATE.teleport;
    if(!t.result)return;
    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('QUANTUM TELEPORTATION', 20, 32);
    /* Three columns: Alice's data qubit, Bell pair, Bob's qubit */
    var cx1=W*0.2,cx2=W*0.5,cx3=W*0.8;
    var cy=H*0.4;
    /* Labels */
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillStyle='#ffe040';
    ctx.fillText('|ψ⟩ (data)',cx1,60);
    ctx.fillStyle='#40e0ff';
    ctx.fillText('Entangled Pair',cx2,60);
    ctx.fillStyle='#40ffa0';
    ctx.fillText('Bob',cx3,60);
    /* Qubit circles */
    function qcircle(x,y,color,label,amp){
      ctx.fillStyle=color;
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(x,y,26,0,Math.PI*2);
      ctx.fill();ctx.stroke();
      ctx.fillStyle='#040308';
      ctx.font='bold 11px monospace';
      ctx.textAlign='center';
      ctx.fillText(label,x,y+4);
    }
    /* Draw qubits */
    qcircle(cx1,cy,'#ffe040','q0','');
    qcircle(cx2-40,cy,'#40e0ff','q1','');
    qcircle(cx2+40,cy,'#40e0ff','q2','');
    qcircle(cx3,cy,'#40ffa0','q2','');
    /* Entanglement line */
    ctx.strokeStyle='#40e0ff';
    ctx.lineWidth=3;
    ctx.setLineDash([6,4]);
    ctx.beginPath();
    ctx.moveTo(cx2-40,cy);ctx.lineTo(cx2+40,cy);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Stages info */
    var stageNames=['Initial: |ψ⟩⊗|00⟩','After Bell pair on (1,2)','After CNOT(0,1) + H(0)'];
    var stageY=cy+120;
    stageNames.forEach(function(name,i){
      ctx.fillStyle=i===t.step?'#ffe040':'rgba(168,160,216,.5)';
      ctx.font=(i===t.step?'bold ':'')+'12px monospace';
      ctx.textAlign='left';
      ctx.fillText((i===t.step?'▶ ':'  ')+name, 20, stageY+i*20);
    });
    /* Classical bits */
    if(t.result.results.length){
      var resultsY=H-180;
      ctx.fillStyle='rgba(160,128,255,.9)';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('ALICE\'S MEASUREMENT OUTCOMES', 20, resultsY);
      t.result.results.forEach(function(r,i){
        var x=20+i*(W-40)/4;
        var y=resultsY+20;
        ctx.fillStyle='rgba(12,10,26,.6)';
        ctx.strokeStyle='rgba(160,128,255,.4)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.roundRect(x,y,(W-40)/4-10,90,6);
        ctx.fill();ctx.stroke();
        ctx.fillStyle='#40e0ff';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.fillText('m = '+(r.m1*2+r.m0).toString(2).padStart(2,'0'), x+(W-40)/8-5, y+18);
        ctx.fillStyle='#a8a0d8';
        ctx.font='10px monospace';
        ctx.fillText('P = '+fmt(r.prob,3), x+(W-40)/8-5, y+36);
        ctx.fillStyle='#40ffa0';
        ctx.fillText('Bob gets: |ψ⟩', x+(W-40)/8-5, y+58);
        ctx.fillStyle='#ffe040';
        ctx.font='9px monospace';
        ctx.fillText('correction: X^'+(r.m1?1:0)+' Z^'+(r.m0?1:0), x+(W-40)/8-5, y+78);
      });
    }
    setStatsHTML(
      '<div>α = '+t.result.initial.alpha.toString(3)+'</div>'+
      '<div>β = '+t.result.initial.beta.toString(3)+'</div>'+
      '<div>Fidelity: 100%</div>'+
      '<div>Resources: 2 bits + 1 ebit</div>'
    );
    updateBadge('🚀 Quantum Teleportation · no-cloning respected');
  },
  onDown:function(){},
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var t=STATE.teleport;
    var html='';
    html+='<div class="sec"><h4>State to Teleport</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>α (real)</span><span>'+fmt(t.alphaRe,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.05" value="'+t.alphaRe+'" oninput="STATE.teleport.alphaRe=parseFloat(this.value);MODULES.teleport.init()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>α (imag)</span><span>'+fmt(t.alphaIm,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.05" value="'+t.alphaIm+'" oninput="STATE.teleport.alphaIm=parseFloat(this.value);MODULES.teleport.init()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>β (real)</span><span>'+fmt(t.betaRe,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.05" value="'+t.betaRe+'" oninput="STATE.teleport.betaRe=parseFloat(this.value);MODULES.teleport.init()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>β (imag)</span><span>'+fmt(t.betaIm,3)+'</span></div>';
    html+='<input type="range" min="-1" max="1" step="0.05" value="'+t.betaIm+'" oninput="STATE.teleport.betaIm=parseFloat(this.value);MODULES.teleport.init()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="setTeleport(1,0,0,0)">|0⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setTeleport(0,0,1,0)">|1⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setTeleport(0.707,0,0.707,0)">|+⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setTeleport(0.6,0,0,0.8)">|+i·0.8⟩</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Protocol</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
    '<b class="text-c1">1.</b> Alice and Bob share Bell pair<br>'+
    '<b class="text-c1">2.</b> Alice: CNOT(data, her half)<br>'+
    '<b class="text-c1">3.</b> Alice: H(data)<br>'+
    '<b class="text-c1">4.</b> Alice measures, sends 2 bits<br>'+
    '<b class="text-c1">5.</b> Bob applies X<sup>m1</sup> Z<sup>m0</sup><br>'+
    'Result: Bob has |ψ⟩ exactly.'
    +'</div></div>';
    return html;
  },
  mathPanel:function(){
    var t=STATE.teleport;
    if(!t.result)return '';
    var alpha=t.result.initial.alpha,beta=t.result.initial.beta;
    var html='<div class="sec"><h4>Initial State</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">|ψ⟩</span><span class="v">'+alpha.toString(3)+'|0⟩ + '+beta.toString(3)+'|1⟩</span></div>';
    html+='<div class="row"><span class="k">|α|²+|β|²</span><span class="v">'+fmt(cAbs2(alpha)+cAbs2(beta),4)+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Bob\'s Received State (per outcome)</h4>';
    t.result.results.forEach(function(r){
      var bob=r.bobState;
      /* Bob's qubit 2's state: amplitudes at indexes with q0=q1=0 */
      var b0=bob.amp[0];  /* q2=0 */
      var b1=bob.amp[4];  /* q2=1 */
      html+='<div class="kv" style="margin-bottom:8px">';
      html+='<div class="row"><span class="k">m = '+(r.m1?1:0)+(r.m0?1:0)+'</span><span class="v">P='+fmt(r.prob,3)+'</span></div>';
      html+='<div class="row"><span class="k">&nbsp;→ Bob</span><span class="v">'+b0.toString(3)+'|0⟩ + '+b1.toString(3)+'|1⟩</span></div>';
      html+='</div>';
    });
    html+='<div class="sec"><h4>No-Cloning Theorem</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    'Teleportation moves the state, it does not copy it. The original is destroyed by Alice\'s measurement. '+
    'This is consistent with the no-cloning theorem.'+
    '</div></div>';
    return html;
  }
});
function setTeleport(ar,ai,br,bi){
  STATE.teleport.alphaRe=ar;STATE.teleport.alphaIm=ai;
  STATE.teleport.betaRe=br;STATE.teleport.betaIm=bi;
  MODULES.teleport.init();
  renderLeftPanel();
}

registerModule('bell',{
  title:'Bell States',
  icon:'🔗',
  desc:'Four maximally entangled two-qubit states. Sample measurements to see perfect correlation.',
  init:function(){
    var b=STATE.bell;
    b.state=bellState(b.type);
    b.counts=sampleMeasurement(b.state,b.shots);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bell;
    if(!b.state)return;
    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('BELL STATE: |'+b.type+'⟩', 20, 32);
    /* Draw two qubits with correlation */
    var cx1=W*0.3,cx2=W*0.7;
    var cy=H*0.35;
    function drawQ(x,y,color,label){
      ctx.fillStyle=color;
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,40,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#040308';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText(label,x,y+5);
    }
    drawQ(cx1,cy,'#40e0ff','q0');
    drawQ(cx2,cy,'#40ffa0','q1');
    /* Entanglement link */
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=3;
    ctx.setLineDash([8,4]);
    ctx.beginPath();
    ctx.moveTo(cx1+40,cy);ctx.lineTo(cx2-40,cy);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Wave visualization */
    ctx.strokeStyle='rgba(255,224,64,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(var x=cx1+40;x<cx2-40;x++){
      var t=(x-cx1-40)/(cx2-cx1-80);
      var y=cy+Math.sin(t*Math.PI*4+STATE.time*4)*15;
      if(x===cx1+40)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    /* Measurement histogram */
    var histY=H-260;
    var histH=140;

    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('MEASUREMENT — '+b.shots+' shots (click to sample)', 20, histY-10);

    var outcomes=['|00⟩','|01⟩','|10⟩','|11⟩'];
    var barW=(W-80)/4;
    for(var i=0;i<4;i++){
      var x=40+i*barW;
      var count=b.counts[i]||0;
      var frac=count/b.shots;
      var h=histH*frac;
      var grad=ctx.createLinearGradient(x,histY+histH,x,histY+histH-h);
      grad.addColorStop(0,'#a080ff');
      grad.addColorStop(1,'#40e0ff');
      ctx.fillStyle=grad;
      ctx.fillRect(x+10,histY+histH-h,barW-20,h);
      ctx.strokeStyle='rgba(160,128,255,.4)';
      ctx.lineWidth=1;
      ctx.strokeRect(x+10,histY+histH-h,barW-20,h);
      ctx.fillStyle='#e8e6ff';
      ctx.font='bold 12px monospace';
      ctx.textAlign='center';
      ctx.fillText(outcomes[i],x+barW/2,histY+histH+16);
      ctx.fillStyle='#40e0ff';
      ctx.font='11px monospace';
      ctx.fillText(fmt(frac*100,1)+'%',x+barW/2,histY+histH+32);
      ctx.fillStyle='#a8a0d8';
      ctx.font='10px monospace';
      ctx.fillText('P(ideal)='+fmt(p[i],2),x+barW/2,histY+histH+48);
    }
    /* Info */
    ctx.fillStyle='rgba(168,160,216,.7)';
    ctx.font='12px monospace';
    ctx.textAlign='left';
    var descs={
      'phi+':'(|00⟩ + |11⟩)/√2  ·  perfectly correlated',
      'phi-':'(|00⟩ − |11⟩)/√2  ·  correlated with phase',
      'psi+':'(|01⟩ + |10⟩)/√2  ·  perfectly anti-correlated',
      'psi-':'(|01⟩ − |10⟩)/√2  ·  anti-correlated with phase'
    };
    ctx.fillText(descs[b.type],40,histY+histH+80);
    setStatsHTML(
      '<div>Type: |'+b.type+'⟩</div>'+
      '<div>Entanglement: maximal</div>'+
      '<div>Concurrence: 1.000</div>'+
      '<div>Shots: '+b.shots+'</div>'
    );
    updateBadge('🔗 Bell State · |'+b.type+'⟩');
  },
  onDown:function(){
    /* Resample */
    var b=STATE.bell;
    b.counts=sampleMeasurement(b.state,b.shots);
    toast('Resampled '+b.shots+' shots','info',1200);
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var b=STATE.bell;
    var html='';
    html+='<div class="sec"><h4>Bell State</h4>';
    ['phi+','phi-','psi+','psi-'].forEach(function(t){
      html+='<button class="btn full sm '+(b.type===t?'primary':'')+'" style="margin-bottom:4px" onclick="STATE.bell.type=\''+t+'\';MODULES.bell.init();renderLeftPanel()">|'+t+'⟩</button>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Measurement</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Shots</span><span>'+b.shots+'</span></div>';
    html+='<input type="range" min="100" max="10000" step="100" value="'+b.shots+'" oninput="STATE.bell.shots=parseInt(this.value);MODULES.bell.init();renderLeftPanel()"></div>';
    html+='<button class="btn primary full sm" onclick="MODULES.bell.onDown()">📊 Resample</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Formulas</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.8;color:var(--tx2)">'+
    '|Φ⁺⟩ = (|00⟩+|11⟩)/√2<br>'+
    '|Φ⁻⟩ = (|00⟩−|11⟩)/√2<br>'+
    '|Ψ⁺⟩ = (|01⟩+|10⟩)/√2<br>'+
    '|Ψ⁻⟩ = (|01⟩−|10⟩)/√2<br><br>'+
    'These form an orthonormal basis (Bell basis) of ℂ⁴.'+
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.bell;
    if(!b.state)return '';
    var html='<div class="sec"><h4>Amplitudes</h4>';
    for(var i=0;i<4;i++){
      var amp=b.state.amp[i];
      if(cAbs2(amp)<1e-9)continue;
      var sign=amp.re>=0?'+':'−';
      var val=fmt(Math.abs(amp.re),3);
      html+='<div class="kv"><div class="row"><span class="k">'+b.state.ketLabel(i)+'</span><span class="v">'+sign+' '+val+'</span></div></div>';
    }
    html+='</div>';
    html+='<div class="sec"><h4>Correlations</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">⟨Z₀Z₁⟩</span><span class="v">'+fmt(b.state.expectZ(0)*b.state.expectZ(1)+2*(b.state.amp[0].re*b.state.amp[3].re+b.state.amp[0].im*b.state.amp[3].im)+2*(b.state.amp[1].re*b.state.amp[2].re+b.state.amp[1].im*b.state.amp[2].im),3)+'</span></div>';
    html+='<div class="row"><span class="k">⟨X₀X₁⟩</span><span class="v">'+fmt(b.state.expectX(0)*b.state.expectX(1),3)+'</span></div>';
    html+='<div class="row"><span class="k">⟨Z₀⟩</span><span class="v">'+fmt(b.state.expectZ(0),3)+'</span></div>';
    html+='<div class="row"><span class="k">⟨Z₁⟩</span><span class="v">'+fmt(b.state.expectZ(1),3)+'</span></div>';
    html+='</div></div>';
    return html;
  }
});
</script>
<script>
/* -----------------------------------------------
   MODULE: DEUTSCH-JOZSA

registerModule('dj',{
  title:'Deutsch-Jozsa',
  icon:'🎯',
  desc:'Decide if a function is constant or balanced with ONE quantum query.',
  init:function(){
    var d=STATE.dj;
    d.result=deutschJozsa(d.n,d.type);
    d.animating=false;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var d=STATE.dj;
    if(!d.result)return;
    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('DEUTSCH-JOZSA — n='+d.n,d, 20, 32);
    /* Circuit diagram */
    var cx=W/2, cy=H*0.35;
    ctx.fillStyle='rgba(168,160,216,.8)';
    ctx.font='12px monospace';
    ctx.fillText('Quantum circuit:', 20, cy-70);
    /* Draw n+1 wires */
    var wireStartY=cy-40;
    var wireSpacing=30;
    var wireStartX=100;
    var wireEndX=W-100;
    for(var q=0;q<=d.n;q++){
      var y=wireStartY+q*wireSpacing;
      ctx.strokeStyle='rgba(64,224,255,.5)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(wireStartX,y);ctx.lineTo(wireEndX,y);
      ctx.stroke();
      ctx.fillStyle=q<d.n?'#40e0ff':'#ffe040';
      ctx.font='bold 12px monospace';
      ctx.textAlign='right';
      ctx.fillText(q<d.n?('|0⟩ q'+q):('|−⟩ a'), wireStartX-8, y+4);
    }
    /* Gate boxes */
    function gateBox(x,y,label,color){
      ctx.fillStyle='rgba(20,18,48,.95)';
      ctx.strokeStyle=color;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.roundRect(x-14,y-14,28,28,4);
      ctx.fill();ctx.stroke();
      ctx.fillStyle=color;
      ctx.font='bold 12px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(label,x,y+1);
      ctx.textBaseline='alphabetic';
    }
    /* First H layer */
    for(var q2=0;q2<d.n;q2++){
      gateBox(wireStartX+40,wireStartY+q2*wireSpacing,'H','#a080ff');
    }
    gateBox(wireStartX+40,wireStartY+d.n*wireSpacing,'H','#a080ff');
    /* Oracle box */
    var oracleX=wireStartX+40+(wireEndX-wireStartX-80)*0.4;
    ctx.fillStyle='rgba(20,18,48,.95)';
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(oracleX-40,wireStartY-16,(wireEndX-wireStartX-80)*0.25,wireSpacing*d.n+32,6);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillText('U_f',oracleX+40,wireStartY+wireSpacing*d.n/2+4);
    /* Second H layer */
    for(var q3=0;q3<d.n;q3++){
      gateBox(wireEndX-40,wireStartY+q3*wireSpacing,'H','#a080ff');
    }
    /* Measurement */
    for(var q4=0;q4<d.n;q4++){
      gateBox(wireEndX-80,wireStartY+q4*wireSpacing,'M','#ffe040');
    }
    /* Input/output probabilities */
    var histY=cy+wireSpacing*(d.n+2);
    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('Input register measurement probabilities:', 20, histY);
    var N=1<<d.n;
    var barW=Math.min(60,(W-60)/N);
    var maxH=100;
    for(var i=0;i<N;i++){
      var x=40+i*barW;
      var p=d.result.inputProbs[i];
      var h=maxH*p;
      var grad=ctx.createLinearGradient(x,histY+20,x,histY+20-h);
      grad.addColorStop(0,'#40ffa0');
      grad.addColorStop(1,'#40e0ff');
      ctx.fillStyle=grad;
      ctx.fillRect(x+4,histY+20-h,barW-8,h);
      ctx.fillStyle='#a8a0d8';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText(state_label(i,d.n),x+barW/2,histY+20+14);
      if(p>0.01){
        ctx.fillStyle='#40ffa0';
        ctx.fillText(fmt(p,2),x+barW/2,histY+20+28);
      }
    }
    /* Verdict */
    var verdictY=histY+maxH+80;
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    if(d.result.probAllZero>0.99){
      ctx.fillStyle='#40ffa0';
      ctx.fillText('VERDICT: f is CONSTANT', W/2, verdictY);
    } else if(d.result.probAllZero<0.01){
      ctx.fillStyle='#ff4080';
      ctx.fillText('VERDICT: f is BALANCED', W/2, verdictY);
    } else {
      ctx.fillStyle='#ffe040';
      ctx.fillText('UNCERTAIN', W/2, verdictY);
    }
    ctx.font='12px monospace';
    ctx.fillStyle='rgba(168,160,216,.8)';
    ctx.fillText('P(|00...0⟩) = '+fmt(d.result.probAllZero,4)+'  ·  Classical worst-case: '+(1<<(d.n-1))+' queries, Quantum: 1 query', W/2, verdictY+24);
    setStatsHTML(
      '<div>n = '+d.n+'</div>'+
      '<div>Type: '+d.type+'</div>'+
      '<div>Verdict: '+d.result.verdict+'</div>'+
      '<div>P(all zero): '+fmt(d.result.probAllZero,4)+'</div>'
    );
    updateBadge('🎯 Deutsch-Jozsa · '+d.result.verdict);
  },
  onDown:function(){},
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var d=STATE.dj;
    var html='';
    html+='<div class="sec"><h4>Function Type</h4>';
    [['constant0','Constant 0'],['constant1','Constant 1'],['balanced-parity','Balanced (parity)'],['balanced-half','Balanced (half)']].forEach(function(t){
      html+='<button class="btn full sm '+(d.type===t[0]?'primary':'')+'" style="margin-bottom:4px" onclick="STATE.dj.type=\''+t[0]+'\';MODULES.dj.init();renderLeftPanel()">'+t[1]+'</button>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Input Size</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>n (bits)</span><span>'+d.n+'</span></div>';
    html+='<input type="range" min="1" max="5" step="1" value="'+d.n+'" oninput="STATE.dj.n=parseInt(this.value);MODULES.dj.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Classical vs Quantum</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Domain size</span><span class="v">'+(1<<d.n)+'</span></div>';
    html+='<div class="row"><span class="k">Classical queries (worst)</span><span class="v">'+(1<<(d.n-1))+'+1</span></div>';
    html+='<div class="row"><span class="k">Quantum queries</span><span class="v">1</span></div>';
    html+='<div class="row"><span class="k">Speedup</span><span class="v">exponential</span></div>';
    html+='</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Algorithm</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">1.</b> Input: |0⟩⊗n|1⟩<br>'+
      '<b class="text-c1">2.</b> H on all n+1 qubits<br>'+
      '&nbsp;&nbsp;&nbsp;→ (1/√2ⁿ) Σ|x⟩ ⊗ (|0⟩−|1⟩)/√2<br>'+
      '<b class="text-c1">3.</b> Apply U<sub>f</sub>:<br>'+
      '&nbsp;&nbsp;&nbsp;|x⟩|y⟩ → |x⟩|y⊕f(x)⟩<br>'+
      '&nbsp;&nbsp;&nbsp;→ (1/√2ⁿ) Σ(−1)<sup>f(x)</sup>|x⟩|−⟩<br>'+
      '<b class="text-c1">4.</b> H on input register<br>'+
      '<b class="text-c1">5.</b> Measure:<br>'+
      '&nbsp;&nbsp;&nbsp;• f constant → always |00...0⟩<br>'+
      '&nbsp;&nbsp;&nbsp;• f balanced → never |00...0⟩<br><br>'+
      'All other amplitudes interfere and cancel.'
      +'</div></div>';
  }
});

function setStatsHTML(html){

function updateBadge(text){
  var e=$('coBadge');

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

/* ================================================================

   ================================================================ */
var TABS=[
  {key:'bloch',icon:'🌐',label:'Bloch'},
  {key:'circuit',icon:'⚛️',label:'Circuit'},
  {key:'grover',icon:'🔍',label:'Grover'},
  {key:'teleport',icon:'🚀',label:'Teleport'},
  {key:'bell',icon:'🔗',label:'Bell'},
  {key:'dj',icon:'🎯',label:'Deutsch'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(el2){el2.classList.toggle('active',el2.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,el2){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  el2.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>System</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,2)+'s</span></div>'+
      '<div class="row"><span class="k">Steps</span><span class="v">'+STATE.steps+'</span></div>'+
      '<div class="row"><span class="k">Gates applied</span><span class="v">'+STATE.gates+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty"><div class="e-icon">∑</div>No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--c4)':l.type==='success'?'var(--c3)':l.type==='warn'?'var(--c5)':'var(--c2)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}

function togglePlay(){

function resetModule(){

  }

function stepModule(){

}

function toggleRow(label,path,onChange){
  var val;
  try{val=eval(path);}catch(e){val=false;}
  var onclick="try{eval('"+path+"=!'+path+"');}catch(e){}this.classList.toggle('on');"+(onChange?"try{("+onChange.toString()+")();}catch(e){}":"")+"renderLeftPanel();";

var THEMES=['quantum','cyber','light'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    circuit:{numQubits:STATE.circuit.numQubits,numCols:STATE.circuit.numCols,gates:STATE.circuit.gates},
    bloch:{theta:STATE.bloch.theta,phi:STATE.bloch.phi},
    grover:{n:STATE.grover.n,marked:STATE.grover.marked},
    bell:{type:STATE.bell.type}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);

  a.href=url;a.download='quanta-state.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);

}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='.')stepModule();
  else if(e.key>='1'&&e.key<='6'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape'){closeModal();STATE.circuit.pendingGate=null;STATE.circuit.controlQubit=null;renderLeftPanel();}
});

var BOOT_STEPS=[
  'Initializing complex number library...',
  'Loading quantum gate matrices...',
  'Compiling state-vector simulator...',
  'Preparing Bloch sphere projector...',
  'Warming up Grover search...',
  'Setting up teleportation protocol...',

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('QUANTA ready · Press ? for help','success',3500);
      },400);
    }
  },160);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    STATE.steps++;
  }
  var m2=MODULES[STATE.currentTab];
  if(m2&&m2.draw){try{m2.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}
