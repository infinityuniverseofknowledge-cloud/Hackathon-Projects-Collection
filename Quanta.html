<!DOCTYPE html>
<html lang="en" data-theme="quantum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>QUANTA — Quantum Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#06050f;--bg2:#0c0a1a;--bg3:#141230;--bg4:#1e1c40;
  --panel:#0c0a1a;--panel2:#12102a;--panel3:#1a1840;--panel4:#252260;
  --bd:#252260;--bd2:#3a3580;--bd3:#5850a0;
  --tx:#e8e6ff;--tx2:#a8a0d8;--tx3:#6a60a0;--mu:#403880;
  --c1:#a080ff;--c1h:#c8b0ff;--c1l:#6040c0;
  --c2:#40e0ff;--c2h:#80f0ff;--c2l:#20a0c0;
  --c3:#40ffa0;--c3h:#80ffc8;--c3l:#20c080;
  --c4:#ff4080;--c4h:#ff80b0;--c4l:#c02060;
  --c5:#ffe040;--c5h:#fff080;--c5l:#c0a020;
  --c6:#ff8040;--c6h:#ffb080;--c6l:#c06020;
  --c7:#40a0ff;--c7h:#80c0ff;--c7l:#2060c0;
  --c8:#ff40ff;--c8h:#ff80ff;--c8l:#c020c0;
  --ok:#40ffa0;--warn:#ffe040;--err:#ff4080;--info:#40e0ff;
  --g1:linear-gradient(135deg,#a080ff,#40e0ff);
  --g2:linear-gradient(135deg,#ff4080,#a080ff);
  --gHolo:linear-gradient(120deg,#a080ff,#40e0ff,#40ffa0,#ffe040,#ff4080,#a080ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.75);
  --sh2:0 16px 48px rgba(0,0,0,.95);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="cyber"]{--bg:#000a12;--bg2:#001824;--bg3:#00263c;--panel:#001824;--panel2:#00263c;
  --bd:#004060;--bd2:#006090;--tx:#c0f0ff;--tx2:#60c0e0;--tx3:#206080;
  --c1:#00d0ff;--c2:#ff0080;--c3:#00ff80;--c4:#ff0040;
  --g1:linear-gradient(135deg,#00d0ff,#ff0080)}
[data-theme="light"]{--bg:#f5f3ff;--bg2:#ede9ff;--bg3:#ddd5ff;--panel:#fff;--panel2:#f5f3ff;--panel3:#ede9ff;--panel4:#ddd5ff;
  --bd:#c5bce0;--bd2:#a090d0;--tx:#1a1030;--tx2:#504070;--tx3:#8070a0;
  --c1:#6030c0;--c2:#0090c0;--c3:#00a060;--c4:#c02060;
  --g1:linear-gradient(135deg,#6030c0,#0090c0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#06050f;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-bloch{width:140px;height:140px;margin-bottom:24px;position:relative;animation:spin 4s linear infinite}
.boot-bloch svg{width:100%;height:100%}
.boot-bloch circle{fill:none;stroke:#a080ff;stroke-width:1.5;opacity:.7}
.boot-bloch ellipse{fill:none;stroke:#40e0ff;stroke-width:1;opacity:.5}
.boot-bloch line{stroke:#40ffa0;stroke-width:2}
.boot-bloch .pt{fill:#ffe040;filter:drop-shadow(0 0 10px #ffe040)}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#a080ff;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#1a1840;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #a080ff}
.boot-pct{font-size:.7rem;color:#a080ff;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#6a60a0;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ffa0}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#06050f;box-shadow:0 0 14px rgba(160,128,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#06050f;border-color:transparent}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#252260;transition:var(--t1)}
.tb-status .dot.on{background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:280px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#040308;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(12,10,26,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:320px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

/* CONTROLS */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(160,128,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#06050f;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(160,128,255,.5)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.success{color:var(--c3);border-color:var(--c3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* GATE BUTTONS */
.gate-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.gate-btn{padding:8px 4px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);cursor:pointer;transition:var(--t1);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:.62rem}
.gate-btn:hover{background:var(--panel4);border-color:var(--c1);transform:translateY(-1px)}
.gate-btn .g-sym{font-weight:800;font-size:.85rem;color:var(--c1)}
.gate-btn .g-name{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.gate-btn.h .g-sym{color:var(--c5)}
.gate-btn.x .g-sym{color:var(--c4)}
.gate-btn.y .g-sym{color:var(--c3)}
.gate-btn.z .g-sym{color:var(--c2)}
.gate-btn.s .g-sym{color:var(--c6)}
.gate-btn.t .g-sym{color:var(--c7)}
.gate-btn.cnot .g-sym{color:var(--c8)}
.gate-btn.measure .g-sym{color:var(--warn)}

/* STATE VECTOR */
.sv-row{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.62rem}
.sv-row .sv-ket{color:var(--c2);min-width:52px;font-weight:700}
.sv-row .sv-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative}
.sv-row .sv-fill{height:100%;background:var(--g1);transition:width .3s}
.sv-row .sv-amp{color:var(--c1);min-width:60px;text-align:right;font-size:.6rem}
.sv-row .sv-phase{width:14px;height:14px;border-radius:50%;border:2px solid;flex-shrink:0}
.sv-row.dim{opacity:.35}

/* DATA TABLE */
.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* KV */
.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

/* BLOCH INFO */
.bloch-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.bi{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center;font-family:var(--mono)}
.bi .bv{font-size:.95rem;font-weight:800;color:var(--c1);line-height:1}
.bi .bl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.bi.x .bv{color:var(--c4)}.bi.y .bv{color:var(--c3)}.bi.z .bv{color:var(--c2)}

/* CIRCUIT GRID */
.circuit-scroll{overflow-x:auto;padding:6px 0}
.circuit-grid{display:inline-block;position:relative;font-family:var(--mono)}
.cq-row{display:flex;align-items:center;height:44px;position:relative}
.cq-label{width:40px;text-align:center;font-size:.7rem;font-weight:700;color:var(--c2);flex-shrink:0;font-family:var(--mono)}
.cq-wire{position:absolute;left:40px;right:0;height:2px;background:var(--bd2);top:50%;transform:translateY(-50%)}
.cq-cell{width:44px;height:44px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--rxs);transition:var(--t1);z-index:2}
.cq-cell:hover{background:rgba(160,128,255,.1)}
.cq-gate{width:34px;height:34px;border-radius:var(--rxs);background:var(--panel3);border:1.5px solid var(--c1);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:.75rem;color:var(--c1);transition:var(--t1)}
.cq-gate.h{background:rgba(255,224,64,.15);border-color:var(--c5);color:var(--c5)}
.cq-gate.x{background:rgba(255,64,128,.15);border-color:var(--c4);color:var(--c4)}
.cq-gate.y{background:rgba(64,255,160,.15);border-color:var(--c3);color:var(--c3)}
.cq-gate.z{background:rgba(64,224,255,.15);border-color:var(--c2);color:var(--c2)}
.cq-gate.s{background:rgba(255,128,64,.15);border-color:var(--c6);color:var(--c6)}
.cq-gate.t{background:rgba(64,160,255,.15);border-color:var(--c7);color:var(--c7)}
.cq-gate.cnot{background:rgba(255,64,255,.15);border-color:var(--c8);color:var(--c8);width:34px;height:34px}
.cq-gate.measure{background:rgba(255,224,64,.15);border-color:var(--warn);color:var(--warn);font-size:1rem}
.cq-ctrl{width:14px;height:14px;border-radius:50%;background:var(--c8);box-shadow:0 0 10px var(--c8)}
.cq-target{width:34px;height:34px;border-radius:50%;background:rgba(255,64,255,.15);border:1.5px solid var(--c8);display:flex;align-items:center;justify-content:center;position:relative}
.cq-target::before,.cq-target::after{content:'';position:absolute;background:var(--c8)}
.cq-target::before{width:2px;height:34px;top:0;left:50%;transform:translateX(-50%)}
.cq-target::after{width:34px;height:2px;left:0;top:50%;transform:translateY(-50%)}
.cq-line{position:absolute;width:2px;background:var(--c8);z-index:1;left:50%;transform:translateX(-50%)}

/* TABS */
.histogram{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.hist-bar{flex:1;min-width:14px;background:var(--g1);border-radius:2px 2px 0 0;position:relative;transition:height .3s;display:flex;flex-direction:column;justify-content:flex-end}
.hist-bar .hb-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.5rem;color:var(--tx3);white-space:nowrap}
.hist-bar .hb-val{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.55rem;color:var(--c1);white-space:nowrap}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* TOASTS */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* AMP GRID */
.amp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px;margin-bottom:10px}
.amp-cell{padding:6px;background:var(--panel3);border-radius:var(--rxs);text-align:center;font-family:var(--mono);font-size:.6rem;border:1px solid var(--bd)}

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?3:d;if(!isFinite(n))return '—';return Number(n).toFixed(d)}
function deg(r){return r*180/Math.PI}
function rad(d){return d*Math.PI/180}
function norm2pi(a){a=a%(Math.PI*2);if(a>Math.PI)a-=Math.PI*2;if(a<-Math.PI)a+=Math.PI*2;return a}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   COMPLEX NUMBERS
   ================================================================ */
function C(re,im){this.re=re;this.im=im||0;}
C.prototype.add=function(o){return new C(this.re+o.re,this.im+o.im);};
C.prototype.sub=function(o){return new C(this.re-o.re,this.im-o.im);};
C.prototype.mul=function(o){
  if(typeof o==='number')return new C(this.re*o,this.im*o);
  return new C(this.re*o.re-this.im*o.im,this.re*o.im+this.im*o.re);
};
C.prototype.div=function(o){
  var d=o.re*o.re+o.im*o.im;
  if(d<1e-12)return new C(0,0);
  return new C((this.re*o.re+this.im*o.im)/d,(this.im*o.re-this.re*o.im)/d);
};
C.prototype.abs2=function(){return this.re*this.re+this.im*this.im;};
C.prototype.abs=function(){return Math.sqrt(this.abs2());};
C.prototype.phase=function(){return Math.atan2(this.im,this.re);};
C.prototype.conj=function(){return new C(this.re,-this.im);};
C.prototype.neg=function(){return new C(-this.re,-this.im);};
C.prototype.clone=function(){return new C(this.re,this.im);};
C.prototype.toString=function(p){
  p=p==null?3:p;
  var r=this.re.toFixed(p);
  if(Math.abs(this.im)<1e-10)return r;
  var i=this.im.toFixed(p);
  var sign=this.im>=0?'+':'';
  return r+sign+i+'i';
};
function cAbs2(c){return c.re*c.re+c.im*c.im;}
function cAdd(a,b){return new C(a.re+b.re,a.im+b.im);}
function cSub(a,b){return new C(a.re-b.re,a.im-b.im);}
function cMul(a,b){return new C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);}
function cScale(a,s){return new C(a.re*s,a.im*s);}
function cExp(theta){return new C(Math.cos(theta),Math.sin(theta));}
function cAbs(c){return Math.sqrt(cAbs2(c));}
function cPhase(c){return Math.atan2(c.im,c.re);}
function cConj(c){return new C(c.re,-c.im);}
function cZero(){return new C(0,0);}
function cOne(){return new C(1,0);}

/* ================================================================
   QUANTUM STATE VECTOR (n qubits, 2^n amplitudes)
   ================================================================ */
function QState(nQubits){
  this.n=nQubits;
  this.dim=1<<nQubits;
  this.amp=[];
  for(var i=0;i<this.dim;i++)this.amp.push(cZero());
  this.amp[0]=cOne();  /* |00...0⟩ */
}
QState.prototype.clone=function(){
  var s=new QState(this.n);
  for(var i=0;i<this.dim;i++)s.amp[i]=this.amp[i].clone();
  return s;
};
QState.prototype.norm2=function(){
  var s=0;
  for(var i=0;i<this.dim;i++)s+=cAbs2(this.amp[i]);
  return s;
};
QState.prototype.normalize=function(){
  var n=Math.sqrt(this.norm2());
  if(n<1e-12)return;
  for(var i=0;i<this.dim;i++)this.amp[i]=cScale(this.amp[i],1/n);
};
QState.prototype.ketLabel=function(idx){
  var s='';
  for(var i=this.n-1;i>=0;i--)s+=((idx>>i)&1);
  return '|'+s+'⟩';
};
QState.prototype.probabilities=function(){
  var p=[];
  for(var i=0;i<this.dim;i++)p.push(cAbs2(this.amp[i]));
  return p;
};
QState.prototype.expectZ=function(qubit){
  /* ⟨ψ|Z_q|ψ⟩ */
  var s=0;
  for(var i=0;i<this.dim;i++){
    var bit=(i>>qubit)&1;
    s+=(bit===0?1:-1)*cAbs2(this.amp[i]);
  }
  return s;
};
QState.prototype.expectX=function(qubit){
  /* ⟨ψ|X_q|ψ⟩ — sum over pairs (i, i XOR 2^q) */
  var s=0;
  var mask=1<<qubit;
  for(var i=0;i<this.dim;i++){
    var j=i^mask;
    if(i<j){
      s+=2*(this.amp[i].re*this.amp[j].re+this.amp[i].im*this.amp[j].im);
    }
  }
  return s;
};
QState.prototype.expectY=function(qubit){
  /* ⟨ψ|Y_q|ψ⟩ */
  var s=0;
  var mask=1<<qubit;
  for(var i=0;i<this.dim;i++){
    var j=i^mask;
    if(i<j){
      /* Y = [[0,-i],[i,0]] */
      var ai=this.amp[i],aj=this.amp[j];
      /* ⟨i|Y|j⟩ = -i for i even, j=i+mask; ⟨j|Y|i⟩ = i */
      var prod=cMul(ai.conj(),new C(0,-1));
      prod=cMul(prod,aj);
      var prod2=cMul(aj.conj(),new C(0,1));
      prod2=cMul(prod2,ai);
      s+=prod.re+prod2.re;
    }
  }
  return s;
};
QState.prototype.bloch=function(qubit){
  return {
    x:this.expectX(qubit),
    y:this.expectY(qubit),
    z:this.expectZ(qubit)
  };
};
QState.prototype.purity=function(qubit){
  var b=this.bloch(qubit);
  return Math.sqrt(b.x*b.x+b.y*b.y+b.z*b.z);
};

/* ================================================================
   QUANTUM GATES (2×2 complex matrices for single qubit)
   ================================================================ */
var GATES={
  I:{name:'I',label:'I',matrix:[[new C(1),new C(0)],[new C(0),new C(1)]],color:'--c1'},
  H:{name:'Hadamard',label:'H',matrix:[[new C(1/Math.SQRT2),new C(1/Math.SQRT2)],[new C(1/Math.SQRT2),new C(-1/Math.SQRT2)]],color:'--c5'},
  X:{name:'Pauli-X',label:'X',matrix:[[new C(0),new C(1)],[new C(1),new C(0)]],color:'--c4'},
  Y:{name:'Pauli-Y',label:'Y',matrix:[[new C(0),new C(0,-1)],[new C(0,1),new C(0)]],color:'--c3'},
  Z:{name:'Pauli-Z',label:'Z',matrix:[[new C(1),new C(0)],[new C(0),new C(-1)]],color:'--c2'},
  S:{name:'Phase S',label:'S',matrix:[[new C(1),new C(0)],[new C(0),new C(0,1)]],color:'--c6'},
  T:{name:'T Gate',label:'T',matrix:[[new C(1),new C(0)],[new C(0),cExp(Math.PI/4)]],color:'--c7'}
};

function rxGate(theta){
  var c=Math.cos(theta/2),s=Math.sin(theta/2);
  return [[new C(c),new C(0,-s)],[new C(0,-s),new C(c)]];
}
function ryGate(theta){
  var c=Math.cos(theta/2),s=Math.sin(theta/2);
  return [[new C(c),new C(-s)],[new C(s),new C(c)]];
}
function rzGate(theta){
  var c=Math.cos(theta/2),s=Math.sin(theta/2);
  return [[cExp(-theta/2),new C(0)],[new C(0),cExp(theta/2)]];
}

/* Apply single-qubit gate to state */
function applySingleQubit(state,matrix,qubit){
  var n=state.n,dim=state.dim;
  var mask=1<<qubit;
  var newAmp=new Array(dim);
  for(var i=0;i<dim;i++){
    var bit=(i>>qubit)&1;
    if(bit===1)continue;
    var j=i|mask;
    var ai=state.amp[i],aj=state.amp[j];
    var n0=cAdd(cMul(matrix[0][0],ai),cMul(matrix[0][1],aj));
    var n1=cAdd(cMul(matrix[1][0],ai),cMul(matrix[1][1],aj));
    newAmp[i]=n0;
    newAmp[j]=n1;
  }
  for(var k=0;k<dim;k++){
    if(newAmp[k])state.amp[k]=newAmp[k];
  }
}

/* CNOT: control, target */
function applyCNOT(state,control,target){
  var dim=state.dim;
  var cMask=1<<control;
  var tMask=1<<target;
  var newAmp=new Array(dim);
  for(var i=0;i<dim;i++){
    var cBit=(i>>control)&1;
    var newIdx=cBit?i^tMask:i;
    if(newAmp[newIdx])continue;
    newAmp[newIdx]=state.amp[i];
  }
  for(var k=0;k<dim;k++){
    if(!newAmp[k])newAmp[k]=cZero();
    state.amp[k]=newAmp[k];
  }
}

/* CZ: controlled-Z */
function applyCZ(state,control,target){
  var dim=state.dim;
  var mask=(1<<control)|(1<<target);
  for(var i=0;i<dim;i++){
    if((i&mask)===mask){
      state.amp[i]=state.amp[i].neg();
    }
  }
}

/* SWAP */
function applySWAP(state,a,b){
  var dim=state.dim;
  for(var i=0;i<dim;i++){
    var aBit=(i>>a)&1;
    var bBit=(i>>b)&1;
    if(aBit===0&&bBit===1){
      var j=i^(1<<a)^(1<<b);
      var tmp=state.amp[i];
      state.amp[i]=state.amp[j];
      state.amp[j]=tmp;
    }
  }
}

/* ================================================================
   MEASUREMENT
   ================================================================ */
function measureAll(state){
  var p=state.probabilities();
  var r=Math.random();
  var acc=0;
  for(var i=0;i<p.length;i++){
    acc+=p[i];
    if(r<=acc){
      /* Collapse */
      var s=new QState(state.n);
      for(var j=0;j<s.dim;j++)s.amp[j]=cZero();
      s.amp[i]=cOne();
      return {outcome:i,binary:s.ketLabel(i),state:s};
    }
  }
  /* Fallback */
  return {outcome:p.length-1,binary:state.ketLabel(p.length-1),state:state};
}
function sampleMeasurement(state,shots){
  shots=shots||1000;
  var p=state.probabilities();
  var counts={};
  for(var i=0;i<shots;i++){
    var r=Math.random(),acc=0;
    for(var k=0;k<p.length;k++){
      acc+=p[k];
      if(r<=acc){
        counts[k]=(counts[k]||0)+1;
        break;
      }
    }
  }
  return counts;
}

/* ================================================================
   MATRIX OPERATIONS (for full gate matrices if needed)
   ================================================================ */
function matMul(A,B){
  var n=A.length,m=B[0].length,k=A[0].length;
  var C=[];
  for(var i=0;i<n;i++){
    C.push([]);
    for(var j=0;j<m;j++){
      var s=cZero();
      for(var l=0;l<k;l++)s=cAdd(s,cMul(A[i][l],B[l][j]));
      C[i].push(s);
    }
  }
  return C;
}
function tensorProduct(A,B){
  var n=A.length,m=A[0].length,p=B.length,q=B[0].length;
  var R=[];
  for(var i=0;i<n*p;i++){
    R.push([]);
    for(var j=0;j<m*q;j++){
      R[i].push(cMul(A[Math.floor(i/p)][Math.floor(j/q)],B[i%p][j%q]));
    }
  }
  return R;
}

<script>
/* ================================================================
   GROVER'S ALGORITHM
   Finds the marked item in an unstructured database of size N=2^n
   ================================================================ */
function groverSearch(n,markedIndex){
  var N=1<<n;
  var state=new QState(n);
  /* Step 1: Uniform superposition via H on all qubits */
  for(var q=0;q<n;q++)applySingleQubit(state,GATES.H.matrix,q);
  /* Optimal iterations: floor(π/4 · √N) */
  var iterations=Math.max(1,Math.floor(Math.PI/4*Math.sqrt(N)));
  var history=[];
  history.push({iter:0,state:state.clone(),marked:markedIndex});
  for(var it=0;it<iterations;it++){
    /* Oracle: flip sign of marked state */
    state.amp[markedIndex]=state.amp[markedIndex].neg();
    /* Diffusion operator: 2|s⟩⟨s| - I where |s⟩ is uniform superposition */
    /* Equivalent to: H^⊗n · (2|0⟩⟨0| - I) · H^⊗n */
    /* Step: H all */
    for(var q2=0;q2<n;q2++)applySingleQubit(state,GATES.H.matrix,q2);
    /* Flip sign of all states EXCEPT |00...0⟩ */
    for(var i=1;i<N;i++)state.amp[i]=state.amp[i].neg();
    /* H all */
    for(var q3=0;q3<n;q3++)applySingleQubit(state,GATES.H.matrix,q3);
    history.push({iter:it+1,state:state.clone(),marked:markedIndex});
  }
  return {
    finalState:state,
    iterations:iterations,
    history:history,
    marked:markedIndex,
    N:N,
    probMarked:cAbs2(state.amp[markedIndex])
  };
}

/* ================================================================
   QUANTUM TELEPORTATION
   ================================================================ */
function teleportationProtocol(alpha,beta){
  /* Alice has qubit 0 in state α|0⟩+β|1⟩
     Qubits 1,2 form Bell pair (|00⟩+|11⟩)/√2
     Alice measures 0,1; sends 2 classical bits to Bob
     Bob applies corrections to qubit 2 */
  var n=3;
  var state=new QState(n);
  /* Encode initial state on qubit 0 */
  /* |ψ⟩ = α|0⟩ + β|1⟩ on qubit 0, |00⟩ on others */
  var dim=8;
  /* Indices: q2 q1 q0  -> idx = q2*4 + q1*2 + q0 */
  /* |000⟩ has q0=0 => amp[0]=α, |001⟩ has q0=1 => amp[1]=β */
  for(var i=0;i<dim;i++)state.amp[i]=cZero();
  state.amp[0]=new C(alpha.re,alpha.im);
  state.amp[1]=new C(beta.re,beta.im);
  var stages=[];
  stages.push({name:'Initial: |ψ⟩⊗|00⟩',state:state.clone(),desc:'Qubit 0 has the state to teleport. Qubits 1,2 are |00⟩.'});
  /* Create Bell pair on qubits 1,2: H(1) then CNOT(1,2) */
  applySingleQubit(state,GATES.H.matrix,1);
  applyCNOT(state,1,2);
  stages.push({name:'After Bell pair on (1,2)',state:state.clone(),desc:'Qubits 1,2 are now entangled in (|00⟩+|11⟩)/√2.'});
  /* Alice: CNOT(0,1) then H(0) */
  applyCNOT(state,0,1);
  applySingleQubit(state,GATES.H.matrix,0);
  stages.push({name:'After Alice\'s CNOT(0,1) + H(0)',state:state.clone(),desc:'Now 4 outcomes (a,b) on qubits 0,1 are equally likely.'});
  /* Alice measures qubits 0,1 — project each outcome and apply corrections */
  var results=[];
  for(var m0=0;m0<2;m0++){
    for(var m1=0;m1<2;m1++){
      var ps=state.clone();
      /* Project qubits 0,1 onto |m1 m0⟩ */
      var newAmp=new Array(8);
      for(var i2=0;i2<8;i2++)newAmp[i2]=cZero();
      for(var i3=0;i3<8;i3++){
        var q0=(i3>>0)&1, q1=(i3>>1)&1;
        if(q0===m0&&q1===m1){
          /* Bob's qubit (q2) inherits */
          var bobBit=(i3>>2)&1;
          var newIdx=bobBit<<2; /* Keep Bob bit, zero others */
          newAmp[newIdx]=cAdd(newAmp[newIdx],state.amp[i3]);
        }
      }
      var projState=new QState(3);
      for(var i4=0;i4<8;i4++)projState.amp[i4]=newAmp[i4];
      projState.normalize();
      /* Bob applies X^(m1) Z^(m0) on qubit 2 */
      if(m0===1)applySingleQubit(projState,GATES.Z.matrix,2);
      if(m1===1)applySingleQubit(projState,GATES.X.matrix,2);
      results.push({
        m0:m0,m1:m1,
        prob:cAbs2(state.amp[(m1<<1)|m0]),
        bobState:projState
      });
    }
  }
  return {stages:stages,results:results,initial:{alpha:alpha,beta:beta}};
}

/* ================================================================
   BELL STATES
   ================================================================ */
function bellState(type){
  var s=new QState(2);
  /* Start |00⟩ */
  applySingleQubit(s,GATES.H.matrix,0);
  switch(type){
    case 'phi+':applyCNOT(s,0,1);break;           /* (|00⟩+|11⟩)/√2 */
    case 'phi-':
      applyCNOT(s,0,1);
      applySingleQubit(s,GATES.Z.matrix,0);
      break;
    case 'psi+':
      applySingleQubit(s,GATES.X.matrix,1);
      applyCNOT(s,0,1);
      break;
    case 'psi-':
      applySingleQubit(s,GATES.X.matrix,1);
      applyCNOT(s,0,1);
      applySingleQubit(s,GATES.Z.matrix,0);
      break;
  }
  return s;
}

/* ================================================================
   DEUTSCH-JOZSA ALGORITHM
   Determine if f:{0,1}^n → {0,1} is constant or balanced with one query
   ================================================================ */
function deutschJozsa(n,type){
  /* Build state with n input qubits + 1 ancilla, total n+1 qubits */
  var total=n+1;
  var state=new QState(total);
  /* Prepare ancilla in |−⟩ = (|0⟩−|1⟩)/√2 */
  applySingleQubit(state,GATES.X.matrix,n);
  applySingleQubit(state,GATES.H.matrix,n);
  /* Hadamard on all input qubits */
  for(var q=0;q<n;q++)applySingleQubit(state,GATES.H.matrix,q);
  /* Apply oracle U_f: |x⟩|y⟩ → |x⟩|y⊕f(x)⟩ */
  var dim=1<<total;
  for(var i=0;i<dim;i++){
    var x=i&((1<<n)-1);
    var y=(i>>n)&1;
    var fx;
    if(type==='constant0')fx=0;
    else if(type==='constant1')fx=1;
    else if(type==='balanced-parity'){
      /* f(x) = parity of x */
      var p=0,tmp=x;
      while(tmp){p^=tmp&1;tmp>>=1;}
      fx=p;
    } else if(type==='balanced-half'){
      /* f(x) = 1 if x < 2^(n-1) */
      fx=x<((1<<n)>>1)?1:0;
    }
    if(fx===1){
      /* XOR ancilla bit */
      var newIdx=i^(1<<n);
      var tmp2=state.amp[i];
      state.amp[i]=state.amp[newIdx];
      state.amp[newIdx]=tmp2;
    }
  }
  /* Hadamard on input qubits */
  for(var q2=0;q2<n;q2++)applySingleQubit(state,GATES.H.matrix,q2);
  /* Measure input register: if all zeros → constant, else balanced */
  var inputProbs=[];
  var p0=0;
  var inputDim=1<<n;
  for(var k=0;k<inputDim;k++){
    /* Sum over ancilla */
    var p=cAbs2(state.amp[k])+cAbs2(state.amp[k|(1<<n)]);
    inputProbs.push(p);
    if(k===0)p0=p;
  }
  return {
    n:n,
    type:type,
    state:state,
    inputProbs:inputProbs,
    probAllZero:p0,
    verdict:p0>0.99?'CONSTANT':(p0<0.01?'BALANCED':'UNDETERMINED')
  };
}

  LOG.push({t:Date.now(),msg:msg,type:type});

  if(STATE.currentRp==='logs')renderLogs();
}

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('wheel',onWheel,{passive:false});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;
  CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={mouseX:0,mouseY:0,down:false,downX:0,downY:0,lastX:0,lastY:0};
function canvasPos(e){
  var r=CANV.canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function onDown(e){
  var p=canvasPos(e);
  INPUT.down=true;INPUT.mouseX=p.x;INPUT.mouseY=p.y;INPUT.downX=p.x;INPUT.downY=p.y;INPUT.lastX=p.x;INPUT.lastY=p.y;
  var m=MODULES[STATE.currentTab];
  if(m&&m.onDown)m.onDown(p,e);
}
function onMove(e){
  var p=canvasPos(e);
  INPUT.mouseX=p.x;INPUT.mouseY=p.y;
  var m=MODULES[STATE.currentTab];
  if(m&&m.onMove)m.onMove(p,e);
}
function onUp(e){
  var p=canvasPos(e);
  INPUT.down=false;
  var m=MODULES[STATE.currentTab];
  if(m&&m.onUp)m.onUp(p,e);
}
function onWheel(e){
  e.preventDefault();
  var m=MODULES[STATE.currentTab];
  if(m&&m.onWheel)m.onWheel(e);
}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY,button:0});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

/* -----------------------------------------------
   MODULE: BLOCH SPHERE
   ----------------------------------------------- */
registerModule('bloch',{
  title:'Bloch Sphere',
  icon:'🌐',
  desc:'Single qubit state on the Bloch sphere. Drag to rotate the view or click to set the state vector.',
  init:function(){
    STATE.bloch.history=[];
    this.pushHistory('Initialize |0⟩');
  },
  pushHistory:function(label){
    STATE.bloch.history.push({label:label,t:Date.now(),theta:STATE.bloch.theta,phi:STATE.bloch.phi});
    if(STATE.bloch.history.length>20)STATE.bloch.history.shift();
  },
  tick:function(dt){
    var b=STATE.bloch;
    if(b.autoSpin){
      b.phi+=b.spinSpeed*dt;
      b.phi=norm2pi(b.phi);
      if(b.showTrail){
        b.trail.push([b.theta,b.phi]);
        if(b.trail.length>300)b.trail.shift();
      }
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bloch;
    var cx=W/2,cy=H/2;
    var R=Math.min(W,H)*0.32;
    /* Projection: rotate sphere by φview and θview (use theta,phi as view rotations) */
    var tv=0.6;   /* Camera tilt for 3D effect */
    function proj(p){
      /* Simple 3D → 2D orthographic */
      var x=p[0]*Math.cos(tv)-p[2]*Math.sin(tv);
      var y=p[1];
      return {x:cx+x*R, y:cy-y*R};
    }
    /* Draw outer sphere */
    ctx.strokeStyle='rgba(160,128,255,.4)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.stroke();
    /* Equator (xy plane) */
    ctx.strokeStyle='rgba(64,224,255,.3)';
    ctx.beginPath();
    ctx.ellipse(cx,cy,R,R*Math.abs(Math.sin(tv)),0,0,Math.PI*2);
    ctx.stroke();
    /* Meridians */
    for(var m=0;m<3;m++){
      ctx.beginPath();
      ctx.ellipse(cx,cy,R*Math.cos(m*Math.PI/3),R,0,0,Math.PI*2);
      ctx.stroke();
    }
    /* Axes */
    function drawAxis(a,b,color,label){
      var pa=proj(a),pb=proj(b);
      ctx.strokeStyle=color;
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
      ctx.stroke();
      ctx.fillStyle=color;
      ctx.font='bold 12px monospace';
      ctx.textAlign='center';
      ctx.fillText(label,pb.x+(pb.x-cx)*0.08,pb.y+(pb.y-cy)*0.08+4);
    }
    drawAxis([0,0,0],[0,0,1.15],'rgba(64,224,255,.6)','|0⟩');
    drawAxis([0,0,0],[0,0,-1.15],'rgba(64,224,255,.6)','|1⟩');
    drawAxis([0,0,0],[1.15,0,0],'rgba(255,64,128,.6)','X');
    drawAxis([0,0,0],[0,1.15,0],'rgba(64,255,160,.6)','Y');
    /* Compute point from (theta,phi) */
    var sx=Math.sin(b.theta)*Math.cos(b.phi);
    var sy=Math.sin(b.theta)*Math.sin(b.phi);
    var sz=Math.cos(b.theta);
    /* Trail */
    if(b.showTrail&&b.trail.length>1){
      ctx.strokeStyle='rgba(255,224,64,.4)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      var first=true;
      b.trail.forEach(function(t){
        var x=Math.sin(t[0])*Math.cos(t[1]);
        var y=Math.sin(t[0])*Math.sin(t[1]);
        var z=Math.cos(t[0]);
        var p=proj([x,y,z]);
        if(first){ctx.moveTo(p.x,p.y);first=false;}
        else ctx.lineTo(p.x,p.y);
      });
      ctx.stroke();
    }
    /* Projections to axes */
    if(b.showProjections){
      ctx.strokeStyle='rgba(255,224,64,.2)';
      ctx.setLineDash([3,3]);
      ctx.lineWidth=1;
      var pp=proj([sx,sy,sz]);
      var px=proj([sx,0,0]);
      var py=proj([0,sy,0]);
      var pz=proj([0,0,sz]);
      ctx.beginPath();ctx.moveTo(pp.x,pp.y);ctx.lineTo(px.x,px.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pp.x,pp.y);ctx.lineTo(py.x,py.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pp.x,pp.y);ctx.lineTo(pz.x,pz.y);ctx.stroke();
      ctx.setLineDash([]);
      /* Axis points */
      ctx.fillStyle='rgba(255,64,128,.7)';
      ctx.beginPath();ctx.arc(px.x,px.y,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(64,255,160,.7)';
      ctx.beginPath();ctx.arc(py.x,py.y,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(64,224,255,.7)';
      ctx.beginPath();ctx.arc(pz.x,pz.y,4,0,Math.PI*2);ctx.fill();
    }
    /* The point */
    var p0=proj([0,0,0]);
    var pp2=proj([sx,sy,sz]);
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(pp2.x,pp2.y);ctx.stroke();
    /* Glow */
    var grad=ctx.createRadialGradient(pp2.x,pp2.y,0,pp2.x,pp2.y,14);
    grad.addColorStop(0,'rgba(255,224,64,.8)');
    grad.addColorStop(1,'rgba(255,224,64,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(pp2.x,pp2.y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(pp2.x,pp2.y,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.stroke();
    /* State info */
    var alpha=new C(Math.cos(b.theta/2),0);
    var betaRe=Math.sin(b.theta/2)*Math.cos(b.phi);
    var betaIm=Math.sin(b.theta/2)*Math.sin(b.phi);
    var beta=new C(betaRe,betaIm);
    setStatsHTML(
      '<div>θ: '+fmt(deg(b.theta),1)+'° &nbsp; φ: '+fmt(deg(b.phi),1)+'°</div>'+
      '<div>|ψ⟩ = '+alpha.toString(2)+'|0⟩ + ('+beta.toString(2)+')|1⟩</div>'+
      '<div>P(|0⟩): '+fmt(cAbs2(alpha),3)+' &nbsp; P(|1⟩): '+fmt(cAbs2(beta),3)+'</div>'+
      '<div>⟨X⟩: '+fmt(sx,3)+' &nbsp; ⟨Y⟩: '+fmt(sy,3)+' &nbsp; ⟨Z⟩: '+fmt(sz,3)+'</div>'
    );
    updateBadge('🌐 Bloch Sphere — drag to rotate view, click near sphere to set');
    /* Status bar */
    $('sbZ').textContent=fmt(sz,3);
    $('sbNorm').textContent=fmt(1.0,3);
    $('sbQubits').textContent='1';
  },
  onDown:function(p){
    /* Map click to (theta,phi) based on screen position */
    var cx=CANV.W/2,cy=CANV.H/2;
    var R=Math.min(CANV.W,CANV.H)*0.32;
    var nx=(p.x-cx)/R;
    var ny=(cy-p.y)/R;
    var r=Math.hypot(nx,ny);
    if(r<0.2)return;
    /* Invert projection: we're using x' = x cos(tv) - z sin(tv), y'=y with tv=0.6 */
    /* Approximate: treat (nx,ny) as (sinθ cosφ, cosθ) */
    var theta=Math.acos(clamp(ny,-1,1));
    var phi=Math.atan2(0,nx);   /* Ambiguous but visually reasonable */
    /* Better: use 2D projection inversion */
    var tv=0.6;
    /* Assume point is on sphere: nx²+ny²+nz² = 1 in original coordinates isn't directly recoverable.
       Simpler: we just set theta from vertical, phi from horizontal */
    theta=clamp(theta,0,Math.PI);
    phi=Math.atan2(-ny*0.3,nx);
    STATE.bloch.theta=theta;
    STATE.bloch.phi=phi;
    this.pushHistory('Set state ('+fmt(deg(theta),0)+'°, '+fmt(deg(phi),0)+'°)');
  },
  onMove:function(p){
    if(!INPUT.down)return;
    var dx=p.x-INPUT.lastX;
    var dy=p.y-INPUT.lastY;
    INPUT.lastX=p.x;INPUT.lastY=p.y;
    STATE.bloch.phi+=dx*0.01;
    STATE.bloch.theta=clamp(STATE.bloch.theta-dy*0.01,0,Math.PI);
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var b=STATE.bloch;
    var html='';
    html+='<div class="sec"><h4>State Vector</h4>';

    html+='<input type="range" min="0" max="3.14159" step="0.01" value="'+b.theta+'" oninput="STATE.bloch.theta=parseFloat(this.value)"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>φ (azimuth)</span><span>'+fmt(deg(b.phi),1)+'°</span></div>';
    html+='<input type="range" min="-3.14159" max="3.14159" step="0.01" value="'+b.phi+'" oninput="STATE.bloch.phi=parseFloat(this.value)"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Apply Gate</h4>';
    html+='<div class="gate-palette">';
    ['H','X','Y','Z','S','T'].forEach(function(g){
      html+='<div class="gate-btn '+g.toLowerCase()+'" onclick="applyBlochGate(\''+g+'\')"><div class="g-sym">'+g+'</div><div class="g-name">'+GATES[g].name+'</div></div>';
    });
    html+='</div>';
    html+='<div class="ctrl"><div class="lbl"><span>Rx(θ)</span><span>'+fmt(deg(b.theta),0)+'°</span></div>';
    html+='<input type="range" min="0" max="6.28" step="0.05" value="'+(Math.PI/4)+'" onchange="applyBlochRotation(\'X\',parseFloat(this.value))"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Ry(θ)</span></div>';
    html+='<input type="range" min="0" max="6.28" step="0.05" value="'+(Math.PI/4)+'" onchange="applyBlochRotation(\'Y\',parseFloat(this.value))"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Rz(θ)</span></div>';
    html+='<input type="range" min="0" max="6.28" step="0.05" value="'+(Math.PI/4)+'" onchange="applyBlochRotation(\'Z\',parseFloat(this.value))"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="setBloch(0,0)">|0⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setBloch(Math.PI,0)">|1⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setBloch(Math.PI/2,0)">|+⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setBloch(Math.PI/2,Math.PI)">|−⟩</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="setBloch(Math.PI/2,Math.PI/2)">|+i⟩</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Animation</h4>';
    html+=toggleRow('Auto spin','STATE.bloch.autoSpin');
    html+=toggleRow('Show projections','STATE.bloch.showProjections');
    html+=toggleRow('Show trail','STATE.bloch.showTrail');
    if(b.showTrail){html+='<button class="btn full sm" style="margin-top:6px" onclick="STATE.bloch.trail=[]">Clear trail</button>';}
    html+='</div>';
    html+='<div class="sec"><h4>History</h4>';
    if(!b.history.length)html+='<div class="text-xs text-dim" style="font-family:var(--mono)">No operations yet.</div>';
    else b.history.slice().reverse().slice(0,8).forEach(function(h){
      html+='<div style="padding:3px 6px;font-family:var(--mono);font-size:.6rem;color:var(--tx2);border-left:2px solid var(--c1);background:var(--panel3);border-radius:2px;margin-bottom:2px">'+esc(h.label)+'</div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.bloch;
    var a=new C(Math.cos(b.theta/2),0);
    var beta=new C(Math.sin(b.theta/2)*Math.cos(b.phi),Math.sin(b.theta/2)*Math.sin(b.phi));
    var sx=Math.sin(b.theta)*Math.cos(b.phi);

    var html='<div class="sec"><h4>Amplitudes</h4>';

    html+='<div class="row"><span class="k">|β|²</span><span class="v">'+fmt(cAbs2(beta),4)+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Bloch Vector</h4>';
    html+='<div class="bloch-info">';
    html+='<div class="bi x"><div class="bv">'+fmt(sx,3)+'</div><div class="bl">⟨X⟩</div></div>';
    html+='<div class="bi y"><div class="bv">'+fmt(sy,3)+'</div><div class="bl">⟨Y⟩</div></div>';
    html+='<div class="bi z"><div class="bv">'+fmt(sz,3)+'</div><div class="bl">⟨Z⟩</div></div>';
    html+='</div></div>';

  }
});

}
function applyBlochGate(g){
  var b=STATE.bloch;
  var theta=b.theta,phi=b.phi;
  var sx=Math.sin(theta)*Math.cos(phi);
  var sy=Math.sin(theta)*Math.sin(phi);
  var sz=Math.cos(theta);
  /* Rotate the Bloch vector by the gate's action */
  var nx=sx,ny=sy,nz=sz;
  switch(g){
    case 'H':nx=sz;ny=-sy;nz=sx;break;
    case 'X':nx=sx;ny=-sy;nz=-sz;break;
    case 'Y':nx=-sx;ny=sy;nz=-sz;break;
    case 'Z':nx=-sx;ny=-sy;nz=sz;break;
    case 'S':nx=-sy;ny=sx;nz=sz;break;
    case 'T':
      var c=Math.cos(Math.PI/4),s=Math.sin(Math.PI/4);
      nx=sx*c-sy*s;ny=sx*s+sy*c;nz=sz;
      break;
  }
  var r=Math.sqrt(nx*nx+ny*ny+nz*nz);
  if(r>1e-9){nx/=r;ny/=r;nz/=r;}
  var newTheta=Math.acos(clamp(nz,-1,1));
  var newPhi=Math.atan2(ny,nx);
  b.theta=newTheta;b.phi=newPhi;
  MODULES.bloch.pushHistory('Applied '+g);
  toast('Applied '+g,'success',1200);
}
function applyBlochRotation(axis,angle){
  var b=STATE.bloch;
  var theta=b.theta,phi=b.phi;
  var sx=Math.sin(theta)*Math.cos(phi);
  var sy=Math.sin(theta)*Math.sin(phi);
  var sz=Math.cos(theta);
  var c=Math.cos(angle),s=Math.sin(angle);
  var nx=sx,ny=sy,nz=sz;
  if(axis==='X'){ny=sy*c-sz*s;nz=sy*s+sz*c;}
  else if(axis==='Y'){nx=sx*c+sz*s;nz=-sx*s+sz*c;}
  else if(axis==='Z'){nx=sx*c-sy*s;ny=sx*s+sy*c;}
  var r=Math.sqrt(nx*nx+ny*ny+nz*nz);
  if(r>1e-9){nx/=r;ny/=r;nz/=r;}
  b.theta=Math.acos(clamp(nz,-1,1));
  b.phi=Math.atan2(ny,nx);
  MODULES.bloch.pushHistory('R'+axis+'('+fmt(deg(angle),0)+'°)');
  toast('Applied R'+axis+'('+fmt(deg(angle),0)+'°)','success',1200);
}

registerModule('circuit',{
  title:'Circuit Builder',
  icon:'⚛️',
  desc:'Build a quantum circuit by clicking gates and cells. Runs a real state-vector simulation.',
  init:function(){
    var c=STATE.circuit;
    if(c.gates.length===0){
      /* Default Bell circuit */
      c.gates=[
        {col:0,qubit:0,type:'H'},
        {col:1,qubit:0,type:'CNOT',control:0,target:1}
      ];
    }
    this.run();
  },
  run:function(){
    var c=STATE.circuit;
    var state=new QState(c.numQubits);
    /* Sort gates by column */
    var sorted=c.gates.slice().sort(function(a,b){return a.col-b.col;});
    var steps=[state.clone()];
    sorted.forEach(function(g){
      if(g.type==='CNOT'){
        applyCNOT(state,g.control,g.target);
      } else if(g.type==='CZ'){
        applyCZ(state,g.control,g.target);
      } else if(g.type==='SWAP'){
        applySWAP(state,g.control,g.target);
      } else if(g.type==='measure'){
        /* Measurement — skip in state vector for now */
      } else if(GATES[g.type]){
        applySingleQubit(state,GATES[g.type].matrix,g.qubit);
      }
      steps.push(state.clone());
    });
    c.state=state;
    c.lastRun={steps:steps};
    /* Sample measurement */
    c.counts=sampleMeasurement(state,c.shots);
    STATE.gates=c.gates.length;
    logMsg('Circuit: '+c.gates.length+' gates on '+c.numQubits+' qubits','info');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var c=STATE.circuit;
    /* Draw header */
    ctx.fillStyle='rgba(160,128,255,.15)';
    ctx.font='bold 16px monospace';
    ctx.textAlign='left';
    ctx.fillText('QUANTUM CIRCUIT — '+c.numQubits+' qubits', 20, 30);
    /* Qubit wires */
    var startY=80;
    var rowH=Math.min(64,(H-startY-80)/c.numQubits);
    var startX=80;
    var cellW=52;
    for(var q=0;q<c.numQubits;q++){
      var y=startY+q*rowH+rowH/2;
      /* Label */
      ctx.fillStyle='#40e0ff';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText('q'+q, 40, y+5);
      /* Wire */
      ctx.strokeStyle='rgba(64,224,255,.4)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(startX-15,y);
      ctx.lineTo(startX+c.numCols*cellW,y);
      ctx.stroke();
      /* Column labels */
      if(q===0){
        for(var cc=0;cc<c.numCols;cc++){
          ctx.fillStyle='rgba(160,128,255,.3)';
          ctx.font='10px monospace';
          ctx.textAlign='center';
          ctx.fillText(cc, startX+cc*cellW+cellW/2, startY-12);
        }
      }
    }
    /* Draw gates */
    c.gates.forEach(function(g){
      var col=g.col;
      var x=startX+col*cellW+cellW/2;
      if(g.type==='CNOT'||g.type==='CZ'||g.type==='SWAP'){
        var cy=startY+g.control*rowH+rowH/2;
        var ty=startY+g.target*rowH+rowH/2;
        /* Vertical line */
        ctx.strokeStyle=g.type==='CZ'?'#40e0ff':(g.type==='SWAP'?'#40ffa0':'#ff40ff');
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,Math.min(cy,ty));
        ctx.lineTo(x,Math.max(cy,ty));
        ctx.stroke();
        /* Control dot */
        if(g.type==='CNOT'){
          ctx.fillStyle='#ff40ff';
          ctx.beginPath();
          ctx.arc(x,cy,6,0,Math.PI*2);
          ctx.fill();
          /* Target ⊕ */
          ctx.strokeStyle='#ff40ff';
          ctx.lineWidth=2;
          ctx.beginPath();
          ctx.arc(x,ty,12,0,Math.PI*2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x-12,ty);ctx.lineTo(x+12,ty);
          ctx.moveTo(x,ty-12);ctx.lineTo(x,ty+12);
          ctx.stroke();
        } else if(g.type==='CZ'){
          ctx.fillStyle='#40e0ff';
          ctx.beginPath();ctx.arc(x,cy,6,0,Math.PI*2);ctx.fill();
          ctx.beginPath();ctx.arc(x,ty,6,0,Math.PI*2);ctx.fill();
        } else if(g.type==='SWAP'){
          ctx.fillStyle='#40ffa0';
          [cy,ty].forEach(function(y){
            ctx.save();
            ctx.translate(x,y);
            ctx.beginPath();
            ctx.moveTo(-8,-8);ctx.lineTo(8,8);
            ctx.moveTo(-8,8);ctx.lineTo(8,-8);
            ctx.stroke();
            ctx.restore();
          });
        }
      } else {
        var y2=startY+g.qubit*rowH+rowH/2;
        var color=g.type==='H'?'#ffe040':g.type==='X'?'#ff4080':g.type==='Y'?'#40ffa0':g.type==='Z'?'#40e0ff':g.type==='S'?'#ff8040':g.type==='T'?'#40a0ff':'#a080ff';
        /* Box */
        ctx.fillStyle='rgba(20,18,48,.9)';
        ctx.strokeStyle=color;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.roundRect(x-14,y2-14,28,28,5);
        ctx.fill();
        ctx.stroke();
        /* Label */
        ctx.fillStyle=color;
        ctx.font='bold 14px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(g.type==='measure'?'M':g.type,x,y2+1);
        ctx.textBaseline='alphabetic';
      }
    });
    /* Pending gate indicator */
    if(c.pendingGate){
      ctx.fillStyle='rgba(255,224,64,.9)';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('▶ Placing: '+c.pendingGate+' — click a cell (Esc to cancel)', 20, H-30);
    }
    /* Histogram of measurement counts */
    if(c.counts){
      var histY=H-140;
      var histH=100;
      var histX=20;
      var histW=W-40;
      var keys=Object.keys(c.counts).map(Number).sort(function(a,b){return a-b;});
      var maxC=Math.max.apply(null,keys.map(function(k){return c.counts[k]}));
      ctx.fillStyle='rgba(12,10,26,.9)';
      ctx.strokeStyle='rgba(160,128,255,.3)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.roundRect(histX,histY,histW,histH,6);
      ctx.fill();ctx.stroke();
      if(keys.length){
        var barW=Math.min(40,(histW-20)/keys.length);
        var totalW=barW*keys.length;
        var offX=histX+(histW-totalW)/2;
        keys.forEach(function(k,i){
          var h=histH*0.85*(c.counts[k]/maxC);
          var x=offX+i*barW+barW*0.1;
          var bw=barW*0.8;
          var grad=ctx.createLinearGradient(x,histY+histH,x,histY+histH-h);
          grad.addColorStop(0,'#a080ff');
          grad.addColorStop(1,'#40e0ff');
          ctx.fillStyle=grad;
          ctx.fillRect(x,histY+histH-h,bw,h);
          /* Label */
          ctx.fillStyle='#a8a0d8';
          ctx.font='9px monospace';
          ctx.textAlign='center';
          var label=state_label(k,c.numQubits);
          ctx.fillText(label,x+bw/2,histY+histH-4);
        });
      }
      ctx.fillStyle='#a080ff';
      ctx.font='bold 11px monospace';
      ctx.textAlign='left';
      ctx.fillText('MEASUREMENT — '+c.shots+' shots',histX+10,histY+16);
    }
    setStatsHTML(
      '<div>Qubits: '+c.numQubits+'</div>'+
      '<div>Gates: '+c.gates.length+'</div>'+
      '<div>Cols: '+c.numCols+'</div>'+
      '<div>Shots: '+c.shots+'</div>'
    );
    updateBadge('⚛️ Circuit Builder · '+c.gates.length+' gates');
    /* Update status bar */
    if(c.state){
      $('sbQubits').textContent=c.numQubits;
      $('sbGates').textContent=c.gates.length;
      $('sbNorm').textContent=fmt(c.state.norm2(),3);
      $('sbZ').textContent=fmt(c.state.expectZ(0),3);
    }
  },
  onDown:function(p){
    var c=STATE.circuit;
    var startY=80;
    var rowH=Math.min(64,(CANV.H-startY-80)/c.numQubits);
    var startX=80;
    var cellW=52;
    var col=Math.floor((p.x-startX)/cellW);
    var q=Math.floor((p.y-startY)/rowH);
    if(col<0||col>=c.numCols||q<0||q>=c.numQubits)return;
    if(c.pendingGate){
      /* Place gate */
      if(c.pendingGate==='CNOT'){
        if(c.controlQubit==null){
          c.controlQubit=q;
          toast('CNOT: now click target qubit','info',1500);
          return;
        } else {
          c.gates.push({col:col,qubit:0,type:'CNOT',control:c.controlQubit,target:q});
          c.controlQubit=null;
        }
      } else if(c.pendingGate==='CZ'){
        if(c.controlQubit==null){
          c.controlQubit=q;
          toast('CZ: now click target qubit','info',1500);
          return;
        } else {
          c.gates.push({col:col,qubit:0,type:'CZ',control:c.controlQubit,target:q});
          c.controlQubit=null;
        }
      } else if(c.pendingGate==='SWAP'){
        if(c.controlQubit==null){
          c.controlQubit=q;
          toast('SWAP: now click second qubit','info',1500);
          return;
        } else {
          c.gates.push({col:col,qubit:0,type:'SWAP',control:c.controlQubit,target:q});
          c.controlQubit=null;
        }
      } else {
        c.gates.push({col:col,qubit:q,type:c.pendingGate});
      }
      c.pendingGate=null;
      this.run();
      renderLeftPanel();
    } else {
      /* Clicking an existing cell removes gates there */
      var removed=c.gates.filter(function(g){
        if(g.col!==col)return true;
        if(g.type==='CNOT'||g.type==='CZ'||g.type==='SWAP')return !(g.control===q||g.target===q);
        return g.qubit!==q;
      });
      if(removed.length!==c.gates.length){
        c.gates=removed;
        this.run();
        renderLeftPanel();
      }
    }
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var c=STATE.circuit;
    var html='';
    html+='<div class="sec"><h4>Gate Palette</h4>';

    });
    html+='<div class="gate-btn cnot" onclick="selectCircuitGate(\'CNOT\')"><div class="g-sym">⊕</div><div class="g-name">CNOT</div></div>';
    html+='<div class="gate-btn cnot" onclick="selectCircuitGate(\'CZ\')"><div class="g-sym">CZ</div><div class="g-name">Ctrl-Z</div></div>';
    html+='<div class="gate-btn cnot" onclick="selectCircuitGate(\'SWAP\')"><div class="g-sym">×</div><div class="g-name">SWAP</div></div>';
    html+='</div>';
    if(c.pendingGate){
      html+='<div class="text-xs" style="color:var(--warn);font-family:var(--mono);margin-bottom:6px">▶ Placing <b>'+c.pendingGate+'</b> — click a cell</div>';
      html+='<button class="btn full sm" onclick="STATE.circuit.pendingGate=null;renderLeftPanel()">Cancel</button>';
    }
    html+='</div>';
    html+='<div class="sec"><h4>Circuit</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Qubits</span><span>'+c.numQubits+'</span></div>';
    html+='<input type="range" min="1" max="6" step="1" value="'+c.numQubits+'" oninput="STATE.circuit.numQubits=parseInt(this.value);MODULES.circuit.run();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Columns</span><span>'+c.numCols+'</span></div>';
    html+='<input type="range" min="4" max="16" step="1" value="'+c.numCols+'" oninput="STATE.circuit.numCols=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Shots</span><span>'+c.shots+'</span></div>';
    html+='<input type="range" min="100" max="8192" step="100" value="'+c.shots+'" oninput="STATE.circuit.shots=parseInt(this.value);MODULES.circuit.run();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="circuitPreset(\'bell\')">Bell Pair</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="circuitPreset(\'ghz\')">GHZ State</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="circuitPreset(\'qft2\')">2-Qubit QFT</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="circuitPreset(\'super\')">Superposition</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="circuitPreset(\'empty\')">Empty</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.circuit;
    if(!c.state)return '<div class="empty">No state</div>';
    var html='<div class="sec"><h4>State Vector</h4>';
    var p=c.state.probabilities();
    var keys=[];
    for(var i=0;i<p.length;i++)if(p[i]>1e-6)keys.push(i);
    if(!keys.length)html+='<div class="empty">Zero state</div>';
    keys.forEach(function(k){
      var amp=c.state.amp[k];
      var phase=Math.atan2(amp.im,amp.re);
      var hue=((phase+Math.PI)/(Math.PI*2))*360;
      var barW=p[k]*100;
      html+='<div class="sv-row">'+
        '<span class="sv-ket">'+c.state.ketLabel(k)+'</span>'+
        '<div class="sv-bar"><div class="sv-fill" style="width:'+barW+'%"></div></div>'+
        '<span class="sv-amp">'+fmt(Math.sqrt(p[k]),3)+'</span>'+
        '<div class="sv-phase" style="background:hsl('+hue+',80%,60%);border-color:hsl('+hue+',80%,60%)"></div>'+
        '</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Summary</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Norm²</span><span class="v">'+fmt(c.state.norm2(),4)+'</span></div>';
    html+='<div class="row"><span class="k">Nonzero amps</span><span class="v">'+keys.length+' / '+(1<<c.numQubits)+'</span></div>';
    html+='<div class="row"><span class="k">Total gates</span><span class="v">'+c.gates.length+'</span></div>';
    html+='</div></div>';
    return html;
  }
});
function state_label(k,n){
  var s='';
  for(var i=n-1;i>=0;i--)s+=((k>>i)&1);
  return '|'+s+'⟩';
}
function selectCircuitGate(g){
  STATE.circuit.pendingGate=g;
  STATE.circuit.controlQubit=null;
  renderLeftPanel();
}
function circuitPreset(name){
  var c=STATE.circuit;
  c.gates=[];c.pendingGate=null;c.controlQubit=null;
  if(name==='bell'){
    c.numQubits=2;
    c.gates=[{col:0,qubit:0,type:'H'},{col:1,qubit:0,type:'CNOT',control:0,target:1}];
  } else if(name==='ghz'){
    c.numQubits=3;
    c.gates=[
      {col:0,qubit:0,type:'H'},
      {col:1,qubit:0,type:'CNOT',control:0,target:1},
      {col:2,qubit:1,type:'CNOT',control:1,target:2}
    ];
  } else if(name==='qft2'){
    c.numQubits=2;
    c.gates=[
      {col:0,qubit:0,type:'H'},
      {col:1,qubit:0,type:'S'},
      {col:1,qubit:1,type:'CNOT',control:0,target:1},
      {col:2,qubit:1,type:'H'}
    ];
  } else if(name==='super'){
    c.numQubits=3;
    c.gates=[
      {col:0,qubit:0,type:'H'},
      {col:0,qubit:1,type:'H'},
      {col:0,qubit:2,type:'H'}
    ];
  }
  MODULES.circuit.run();
  renderLeftPanel();
}

registerModule('grover',{
  title:'Grover Search',
  icon:'🔍',
  desc:'Quantum search algorithm: find marked item in O(√N) queries vs O(N) classical.',
  init:function(){
    var g=STATE.grover;
    g.result=groverSearch(g.n,g.marked);
    g.currentIter=0;
    g.iterations=g.result.iterations;
  },
  tick:function(dt){
    var g=STATE.grover;
    if(g.autoRun&&g.currentIter<g.iterations){
      g.currentIter+=dt*1.2;
      if(g.currentIter>g.iterations)g.currentIter=g.iterations;
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040308';
    ctx.fillRect(0,0,W,H);
    var g=STATE.grover;
    if(!g.result)return;
    /* Header */
    ctx.fillStyle='rgba(160,128,255,.9)';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('GROVER SEARCH — n='+g.n+' (N='+g.result.N+')', 20, 32);
    ctx.font='12px monospace';
    ctx.fillStyle='rgba(168,160,216,.8)';
    ctx.fillText('Marked item: '+g.marked+' ('+g.result.history[0].state.ketLabel(g.marked)+')', 20, 54);
    ctx.fillText('Optimal iterations: '+g.iterations+'  ·  Current: '+fmt(g.currentIter,1), 20, 72);
    /* Show current iteration's state */
    var iter=Math.min(Math.floor(g.currentIter),g.result.history.length-1);
    var st=g.result.history[iter].state;
    var p=st.probabilities();
    /* Bar chart of probabilities */
    var N=p.length;
    var barW=(W-80)/N;
    var baseY=H-120;
    var maxH=H*0.5;
    /* Reference: classical needs N/2 queries */
    var classical=N/2;
    ctx.fillStyle='rgba(12,10,26,.6)';
    ctx.fillRect(40,baseY-maxH-20,W-80,maxH+20);
    /* Bars */
    for(var i=0;i<N;i++){
      var x=40+i*barW;
      var h=maxH*p[i];
      var grad=ctx.createLinearGradient(x,baseY,x,baseY-h);
      if(i===g.marked){grad.addColorStop(0,'#ffe040');grad.addColorStop(1,'#ff4080');}
      else{grad.addColorStop(0,'#40e0ff');grad.addColorStop(1,'#a080ff');}
      ctx.fillStyle=grad;
      ctx.fillRect(x+1,baseY-h,barW-2,h);
    }
    /* Label marked */
    ctx.fillStyle='#ffe040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';
    var mx=40+g.marked*barW+barW/2;
    ctx.fillText('★',mx,baseY-maxH*p[g.marked]-8);
    /* Axis line */
    ctx.strokeStyle='rgba(160,128,255,.4)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(40,baseY);
    ctx.lineTo(W-40,baseY);
    ctx.stroke();
    /* Bottom labels for small N */
    if(N<=16){
      for(var k=0;k<N;k++){
        var x2=40+k*barW+barW/2;
        ctx.fillStyle='rgba(168,160,216,.7)';
        ctx.font='10px monospace';
        ctx.fillText(k,x2,baseY+14);
      }
    }
    /* Probability of marked */
    ctx.fillStyle='rgba(255,224,64,.9)';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('P(marked) = '+fmt(p[g.marked],4), 40, baseY+40);
    /* Chart of P(marked) over iterations */
    var chartX=40,chartY=H-80,chartW=W-80,chartH=50;
    ctx.strokeStyle='rgba(255,224,64,.6)';
    ctx.lineWidth=2;
    ctx.beginPath();
    g.result.history.forEach(function(h,i){
      var x=chartX+(i/(g.result.history.length-1))*chartW;
      var py=cAbs2(h.state.amp[h.marked]);
      var y=chartY+chartH-py*chartH;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
    /* Highlight current */
    var curP=cAbs2(st.amp[g.marked]);
    var curX=chartX+(iter/(g.result.history.length-1))*chartW;
    var curY=chartY+chartH-curP*chartH;
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(curX,curY,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(168,160,216,.7)';
    ctx.font='10px monospace';
    ctx.fillText('P(marked) over iterations →',chartX+4,chartY+12);
    /* Error line: classical expectation */
    ctx.strokeStyle='rgba(255,64,128,.3)';
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(chartX,chartY+chartH*(1-1/g.result.N));
    ctx.lineTo(chartX+chartW,chartY+chartH*(1-1/g.result.N));
    ctx.stroke();
    ctx.setLineDash([]);
    setStatsHTML(
      '<div>N = '+g.result.N+'</div>'+
      '<div>Iterations: '+g.iterations+'</div>'+
      '<div>P(marked): '+fmt(curP,4)+'</div>'+
      '<div>Speedup: √N ≈ '+fmt(Math.sqrt(g.result.N),1)+'</div>'
    );
    updateBadge('🔍 Grover Search · n='+g.n+' · '+g.iterations+' iterations');
  },
  onDown:function(p){
    /* Click a bar to set marked */
    var g=STATE.grover;
    var N=g.result.N;
    var barW=(CANV.W-80)/N;
    var idx=Math.floor((p.x-40)/barW);
    if(idx>=0&&idx<N){
      g.marked=idx;
      MODULES.grover.init();
      renderLeftPanel();
    }
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var g=STATE.grover;
    var html='';
    html+='<div class="sec"><h4>Search Space</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>n (qubits)</span><span>'+g.n+'</span></div>';
    html+='<input type="range" min="2" max="6" step="1" value="'+g.n+'" oninput="STATE.grover.n=parseInt(this.value);STATE.grover.marked=Math.min(STATE.grover.marked,(1<<parseInt(this.value))-1);MODULES.grover.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Marked index</span><span>'+g.marked+'</span></div>';
    html+='<input type="range" min="0" max="'+((1<<g.n)-1)+'" step="1" value="'+g.marked+'" oninput="STATE.grover.marked=parseInt(this.value);MODULES.grover.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Iteration Control</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Current</span><span>'+fmt(g.currentIter,1)+' / '+g.iterations+'</span></div>';
    html+='<input type="range" min="0" max="'+g.iterations+'" step="0.1" value="'+g.currentIter+'" oninput="STATE.grover.currentIter=parseFloat(this.value)"></div>';
    html+=toggleRow('Auto advance','STATE.grover.autoRun');
    html+='<button class="btn full sm" style="margin-top:6px" onclick="STATE.grover.currentIter=0;STATE.grover.autoRun=true">▶ Restart</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Statistics</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Classical queries</span><span class="v">≈ '+(g.result?g.result.N/2:0)+'</span></div>';
    html+='<div class="row"><span class="k">Quantum queries</span><span class="v">'+g.iterations+'</span></div>';
    html+='<div class="row"><span class="k">Speedup</span><span class="v">√N ≈ '+fmt(Math.sqrt(g.result?g.result.N:1),1)+'×</span></div>';
    html+='</div></div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click on a bar in the chart to change the marked item.</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Algorithm</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">1.</b> Prepare uniform superposition:<br>'+
      '&nbsp;&nbsp;&nbsp;|s⟩ = H⊗n |0⟩⊗n = (1/√N) Σ|x⟩<br><br>'+
      '<b class="text-c1">2.</b> Repeat k times:<br>'+
      '&nbsp;&nbsp;a) Oracle: |x⟩ → (−1)<sup>f(x)</sup>|x⟩<br>'+
      '&nbsp;&nbsp;b) Diffusion: 2|s⟩⟨s| − I<br><br>'+
      '<b class="text-c1">3.</b> Measure.<br><br>'+
      '<b>Optimal k</b> = ⌊(π/4)·√N⌋<br>'+

      'Grover gives <b>quadratic</b> speedup over classical search.'
      +'</div></div>';
  }
});
