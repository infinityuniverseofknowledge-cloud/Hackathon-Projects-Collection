<!DOCTYPE html>
<html lang="pt-BR" data-theme="hacker">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SYNTAX — Language & Algorithms Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
textarea{user-select:text}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
:root{
  --bg:#020705;--panel:#051009;--panel2:#08180e;--panel3:#0d2416;--panel4:#123020;
  --bd:#0e2818;--bd2:#1a4a2a;
  --tx:#c8ffd8;--tx2:#70b888;--tx3:#408060;
  --green:#40ff80;--greenh:#70ffa0;--amber:#ffb040;--cyan:#40e0ff;
  --red:#ff5060;--yellow:#ffe040;--magenta:#ff60c0;--violet:#a060ff;
  --g1:linear-gradient(135deg,#40ff80,#40e0ff);
  --gHolo:linear-gradient(120deg,#40ff80,#40e0ff,#ffb040,#ff60c0,#a060ff,#40ff80);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{--bg:#f8faf8;--panel:#fff;--panel2:#f8faf8;--panel3:#eef4ee;--panel4:#e0ece0;--bd:#d0e0d0;--bd2:#a0c0a0;--tx:#0a2010;--tx2:#406048;--tx3:#709080;--green:#008040;--cyan:#0060a0;--amber:#a06000;--red:#c02020;--yellow:#806000;--magenta:#a02060;--violet:#6020a0;--g1:linear-gradient(135deg,#008040,#0060a0)}
[data-theme="amber"]{--bg:#0a0600;--panel:#140c02;--panel2:#201406;--panel3:#2c1e0a;--panel4:#3a2810;--bd:#302010;--bd2:#5a3818;--tx:#ffd0a0;--tx2:#c09060;--tx3:#806040;--green:#ffa020;--cyan:#ff6020;--amber:#ffe040;--red:#ff4040;--yellow:#ffe040;--magenta:#ff80c0;--violet:#c060ff;--g1:linear-gradient(135deg,#ffa020,#ff6020)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--green);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.95rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.64rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#020705}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--green);color:var(--green)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--green);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#08180e}
.tb-status .dot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#010402;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(64,255,128,.025) 0,rgba(64,255,128,.025) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(5,16,9,.92);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--green);max-width:340px}
.co-badge.stats{color:var(--cyan);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--green);border-bottom-color:var(--green);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--green)}
#statusbar .sb-val.c2{color:var(--cyan)}.sb-val.c3{color:var(--amber)}.sb-val.c4{color:var(--magenta)}.sb-val.c5{color:var(--yellow)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--green);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--green);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--green)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:70px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(64,255,128,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--g1);color:#020705;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--g1);color:#020705;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--green);text-align:right;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--green);font-family:var(--disp)}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--green);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--green)}.toast.warn{border-left-color:var(--yellow)}.toast.error{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('lexer')">SYNTAX</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>
    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
      </div>
    </div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Theory</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Steps</span><span class="sb-val c2" id="sbSteps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Tokens</span><span class="sb-val c3" id="sbTokens">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Ops</span><span class="sb-val c4" id="sbOps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Result</span><span class="sb-val c5" id="sbResult">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Lexer</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ══════════════ CORE UTILITIES ══════════════ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attrSafe(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ══════════════ CANVAS ══════════════ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var w=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=w.clientWidth;CANV.H=w.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={down:false,x:0,y:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown error: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

/* ══════════════ MODULE REGISTRY ══════════════ */
var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def}
function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}
function statusVal(id,v){var e=$(id);if(e)e.textContent=v}

/* ══════════════ LOG ══════════════ */
var LOG=[];
function logMsg(msg,type){
  type=type||'info';
  LOG.push({t:Date.now(),msg:msg,type:type});
  if(LOG.length>200)LOG.shift();
  if(STATE.currentRp==='logs')renderLogs();
}
window.addEventListener('error',function(e){
  try{logMsg('JS ERROR: '+e.message,'error')}catch(_){}
});
</script>
<script>
/* ══════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════ */
var STATE={currentTab:'lexer',currentRp:'state',playing:true,time:0,
lexer:{source:'let x = 42 + 3.14 * (a - b); // compute\nfunction add(a, b) {\n  return a + b;\n}',tokens:[],error:null},
parser:{source:'2 + 3 * 4 - 5 ^ 2',ast:null,result:null,error:null},
nfa:{pattern:'(a|b)*abb',input:'aabb',ast:null,nfa:null,steps:[],stepIdx:0,matched:null,error:null},
dfa:{pattern:'(a|b)*abb',dfa:null,nfa:null,error:null},
bf:{source:'++++[>++++<-]>[>+>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.',tape:null,ptr:0,pc:0,output:'',halted:false,program:[],steps:0},
shunt:{expr:'3 + 4 * 2 / ( 1 - 5 ) ^ 2 ^ 3',tokens:[],rpn:[],result:null,error:null},
lambda:{source:'(\\x.\\y.x) a b',steps:[],stepIdx:0,error:null},
sort:{algorithm:'quick',n:40,array:[],steps:[],stepIdx:0,speed:8,acc:0,done:false},
search:{algorithm:'binary',n:50,array:[],target:0,history:[],found:null,comparisons:0},
graph:{nodes:[],edges:[],source:0,dist:[],visited:[],path:[],animStep:0,prev:null},
bigo:{n:64,visible:{'1':true,'logn':true,'n':true,'nlogn':true,'n2':true,'n3':false,'2n':false,'nfact':false}},
huff:{text:'abracadabra',tree:null,freq:{},codes:{},encoded:'',decoded:'',stats:{symbols:0,original:0,encoded:0,ratio:0}},

function tokenizeExpr(src){var toks=[];var pos=0;while(pos<src.length){var c=src[pos];if(/\s/.test(c)){pos++;continue}

if('(),'.indexOf(c)>=0){toks.push({type:'PUNCT',value:c,start:pos,end:pos+1});pos++;continue}
toks.push({type:'ERR',value:c,start:pos,end:pos+1});pos++}
toks.push({type:'EOF',value:null,start:pos,end:pos});return toks}
function parseExpr(src){var toks=tokenizeExpr(src);var pos=0;
function peek(){return toks[pos]}function next(){return toks[pos++]}
function expect(t,v){var tk=peek();if(tk.type!==t||(v!=null&&tk.value!==v))throw new Error('Expected '+(v||t)+' @ '+tk.start);return next()}
function expr(){var left=term();while(peek().type==='OP'&&(peek().value==='+'||peek().value==='-')){var op=next().value;left={type:'binop',op:op,left:left,right:term()}}return left}
function term(){var left=factor();while(peek().type==='OP'&&(peek().value==='*'||peek().value==='/'||peek().value==='%')){var op=next().value;left={type:'binop',op:op,left:left,right:factor()}}return left}
function factor(){var left=unary();if(peek().type==='OP'&&peek().value==='^'){next();return {type:'binop',op:'^',left:left,right:factor()}}return left}
function unary(){if(peek().type==='OP'&&(peek().value==='-'||peek().value==='+')){var op=next().value;return {type:'unop',op:op,arg:unary()}}return primary()}

function evalAST(n,env){if(!n)return 0;if(n.type==='num')return n.value;if(n.type==='ident')return env[n.name]!=null?env[n.name]:0;

/* ══════════════ REGEX → NFA ══════════════ */
function regexParse(src){var pos=0;
function peek(){return pos<src.length?src[pos]:null}
function eat(c){if(pos<src.length&&src[pos]===c){pos++;return true}return false}
function parseAlt(){var parts=[parseConcat()];while(eat('|'))parts.push(parseConcat());return parts.length===1?parts[0]:{type:'alt',parts:parts}}
function parseConcat(){var parts=[];while(pos<src.length&&src[pos]!=='|'&&src[pos]!==')')parts.push(parseRepeat());if(parts.length===0)return {type:'empty'};return parts.length===1?parts[0]:{type:'cat',parts:parts}}
function parseRepeat(){var a=parseAtom();while(true){if(eat('*'))a={type:'star',inner:a};else if(eat('+'))a={type:'plus',inner:a};else if(eat('?'))a={type:'opt',inner:a};else break}return a}
function parseAtom(){if(eat('(')){var inner=parseAlt();if(!eat(')'))throw new Error('Unmatched (');return inner}
var c=peek();if(c===null)throw new Error('Unexpected end');pos++;
if(c==='.')return {type:'any'};
if(c==='\\'){var n=peek();if(n===null)throw new Error('Trailing \\');pos++;return {type:'char',c:n}}

var ast=parseAlt();if(pos<src.length)throw new Error('Unexpected "'+src[pos]+'"');return ast}
function nfaFromAst(ast){var states=[];var trans=[];var idc=0;
function ns(){var id=idc++;states.push({id:id,accept:false});return id}
function at(f,sym,t){trans.push({from:f,sym:sym,to:t})}
function build(n){
if(n.type==='empty'){var s=ns(),e=ns();at(s,null,e);return {start:s,accept:e}}

if(n.type==='any'){var s3=ns(),e3=ns();at(s3,'.',e3);return {start:s3,accept:e3}}

if(n.type==='plus'){var sub2=build(n.inner);var s6=ns(),e6=ns();at(s6,null,sub2.start);at(sub2.accept,null,sub2.start);at(sub2.accept,null,e6);return {start:s6,accept:e6}}

function subsetConstruction(nfa){var start=epsClosure(nfa,[nfa.start]);var dfaStates=[];var dfaTrans=[];var queue=[{set:start,id:0}];var seen=new Map();seen.set(keySet(start),0);

var symbols=new Set();nfa.transitions.forEach(function(t){if(t.sym)symbols.add(t.sym)});
while(queue.length){var cur=queue.shift();
symbols.forEach(function(c){var nx=new Set();nfa.transitions.forEach(function(t){if(cur.set.has(t.from)&&(t.sym===c||t.sym==='.'))nx.add(t.to)});
var closed=epsClosure(nfa,nx);var k=keySet(closed);if(k==='')return;
var id;if(seen.has(k))id=seen.get(k);
else{id=dfaStates.length;seen.set(k,id);dfaStates.push({id:id,set:closed,accept:closed.has(nfa.accept)});queue.push({set:closed,id:id})}
if(!dfaTrans.some(function(t){return t.from===cur.id&&t.sym===c&&t.to===id}))dfaTrans.push({from:cur.id,sym:c,to:id})})}
return {states:dfaStates,transitions:dfaTrans,start:0}}

function shuntingYard(tokens){var output=[];var ops=[];var prec={'+':1,'-':1,'*':2,'/':2,'%':2,'^':3};var right={'^':true};

else if(t.value===')'){while(ops.length&&ops[ops.length-1].value!=='(')output.push(ops.pop());ops.pop()}});

function buildHuffman(text){var freq={};
for(var i=0;i<text.length;i++)freq[text[i]]=(freq[text[i]]||0)+1;

while(nodes.length>1){nodes.sort(function(a,b){return a.freq-b.freq});
var a=nodes.shift();var b=nodes.shift();
nodes.push({char:null,freq:a.freq+b.freq,left:a,right:b})}

function huffCodes(node,prefix,codes){codes=codes||{};prefix=prefix||'';
if(!node)return codes;
if(node.char!=null){codes[node.char]=prefix||'0';return codes}
huffCodes(node.left,prefix+'0',codes);
huffCodes(node.right,prefix+'1',codes);
return codes}

registerModule('rle',{title:'RLE / LZ77',icon:'📦',desc:'Run-Length Encoding + LZ77 window compression.',init:function(){this.run()},
run:function(){var r=STATE.rle;var t=r.text;var enc='';var i=0;
while(i<t.length){var c=t[i];var k=1;while(i+k<t.length&&t[i+k]===c)k++;enc+=c;if(k>1)enc+=k;i+=k}
r.encoded=enc;
var dec='';var j=0;
while(j<enc.length){var ch=enc[j++];var num='';while(j<enc.length&&/[0-9]/.test(enc[j]))num+=enc[j++];dec+=ch.repeat(num?parseInt(num):1)}

r.lz77=this.lz77(t)},
lz77:function(t){var win=10;var out=[];var i=0;
while(i<t.length){var best={len:0,dist:0};var start=Math.max(0,i-win);
for(var j=start;j<i;j++){var l=0;while(i+l<t.length&&t[j+l]===t[i+l]&&l<8)l++;if(l>best.len)best={len:l,dist:i-j}}
if(best.len>=2){out.push({type:'ref',len:best.len,dist:best.dist,literal:''});i+=best.len}
else{out.push({type:'lit',char:t[i],len:1,dist:0});i++}}
return out},

encode:function(){var b=STATE.b64;var input=b.input;var bytes=[];
for(var i=0;i<input.length;i++){var c=input.charCodeAt(i);
if(c<128)bytes.push(c);
else if(c<2048)bytes.push(0xc0|(c>>6),0x80|(c&0x3f));
else bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f))}
b.bytes=bytes;

b.hex=bytes.map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
b.decoded='';

step:function(){var t=STATE.turing;if(t.halted)return;
var read=t.tape[t.head]||'_';

var SUDOKU_PUZZLE='530070000600195000098000060800060003400803001700020006060000280000419005000080079';
registerModule('sudoku',{title:'Sudoku',icon:'🧩',desc:'Backtracking solver.',init:function(){this.generate()},
generate:function(){var s=STATE.sudoku;s.grid=SUDOKU_PUZZLE.split('').map(function(c){return parseInt(c)||0});

function ok(g,r,c,v){for(var i=0;i<9;i++){if(g[r*9+i]===v)return false;if(g[i*9+c]===v)return false}

for(var r2=0;r2<3;r2++)for(var c2=0;c2<3;c2++)if(g[(br+r2)*9+(bc+c2)]===v)return false;
return true}
function solveRec(g){var empty=-1;
for(var i=0;i<81;i++)if(g[i]===0){empty=i;break}
if(empty<0)return true;
var r=Math.floor(empty/9),c=empty%9;
for(var v=1;v<=9;v++){if(ok(g,r,c,v)){g[empty]=v;s.steps++;if(solveRec(g))return true;g[empty]=0}}
return false}
solveRec(s.grid);s.solved=true},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010402';ctx.fillRect(0,0,W,H);var s=STATE.sudoku;if(!s.grid)return;
var sz=Math.min(W-240,H-120);var offX=(W-sz)/2-100;var offY=60;var cell=sz/9;
for(var r=0;r<9;r++)for(var c=0;c<9;c++){var v=s.grid[r*9+c];var x=offX+c*cell;var y=offY+r*cell;
ctx.fillStyle=s.given[r*9+c]?'rgba(5,16,9,.9)':'rgba(13,36,22,.7)';ctx.fillRect(x,y,cell-1,cell-1);
if(v){ctx.fillStyle=s.given[r*9+c]?'#40e0ff':'#40ff80';ctx.font='bold '+Math.floor(cell*0.5)+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,x+cell/2,y+cell/2);ctx.textBaseline='alphabetic'}}
for(var i=0;i<=9;i++){var x2=offX+i*cell;var y2=offY+i*cell;
ctx.strokeStyle=(i%3===0)?'#40ff80':'rgba(64,255,128,.3)';ctx.lineWidth=(i%3===0)?3:1;
ctx.beginPath();ctx.moveTo(x2,offY);ctx.lineTo(x2,offY+sz);ctx.stroke();
ctx.beginPath();ctx.moveTo(offX,y2);ctx.lineTo(offX+sz,y2);ctx.stroke()}
setStatsHTML('<div>Steps: '+s.steps+'</div><div>Solved: '+(s.solved?'yes':'no')+'</div>');
updateBadge('🧩 Sudoku · '+(s.solved?'SOLVED':'idle'));statusVal('sbMode','Sudoku');statusVal('sbSteps',s.steps)},
controls:function(){var s=STATE.sudoku;var h='<div class="sec"><h4>Actions</h4>';
h+='<button class="btn primary full" onclick="MODULES.sudoku.solve();renderLeftPanel()">▶ Solve</button>';
h+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.sudoku.generate();renderLeftPanel()">↺ Reset</button></div>';
h+='<div class="sec"><h4>Stats</h4><div class="kv"><div class="row"><span class="k">Steps</span><span class="v">'+s.steps+'</span></div><div class="row"><span class="k">Solved</span><span class="v">'+(s.solved?'yes':'no')+'</span></div></div></div>';
return h},

/* ══════════════ N-QUEENS ══════════════ */
registerModule('nqueens',{title:'N-Queens',icon:'👑',desc:'Backtracking visualizer.',init:function(){this.reset()},
reset:function(){var q=STATE.nqueens;q.board=[];q.solutions=[];q.current=0;q.steps=0;
function solve(row,board){if(row>=q.n){q.solutions.push(board.slice());if(q.solutions.length>=5)return true;return false}
for(var c=0;c<q.n;c++){var ok=true;
for(var r=0;r<row;r++){if(board[r]===c||Math.abs(board[r]-c)===Math.abs(r-row)){ok=false;break}}
if(ok){board[row]=c;q.steps++;if(solve(row+1,board))return true;board[row]=-1}}
return false}
solve(0,new Array(q.n).fill(-1))},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010402';ctx.fillRect(0,0,W,H);var q=STATE.nqueens;
if(!q.solutions.length)return;
var sol=q.solutions[q.current];if(!sol)return;
var sz=Math.min(W-200,H-100);var offX=(W-sz)/2-100;var offY=60;var cell=sz/q.n;
for(var r=0;r<q.n;r++)for(var c=0;c<q.n;c++){var x=offX+c*cell;var y=offY+r*cell;
ctx.fillStyle=(r+c)%2===0?'#0a1a0e':'#050f08';ctx.fillRect(x,y,cell,cell)}
for(var r2=0;r2<q.n;r2++){var c2=sol[r2];if(c2<0)continue;var x2=offX+c2*cell;var y2=offY+r2*cell;
ctx.fillStyle='#40ff80';ctx.font=Math.floor(cell*0.7)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♛',x2+cell/2,y2+cell/2);ctx.textBaseline='alphabetic'}
ctx.fillStyle='rgba(5,16,9,.9)';ctx.strokeStyle='rgba(64,255,128,.4)';ctx.beginPath();ctx.roundRect(30,20,W-60,30,6);ctx.fill();ctx.stroke();
ctx.fillStyle='#40ff80';ctx.font='bold 12px monospace';ctx.textAlign='left';
ctx.fillText('Solution '+(q.current+1)+'/'+q.solutions.length+' · Steps: '+q.steps,W/2-140,40);
setStatsHTML('<div>N: '+q.n+'</div><div>Sols: '+q.solutions.length+'</div><div>Steps: '+q.steps+'</div>');
updateBadge('👑 '+q.n+'-Queens · '+q.solutions.length+' sols');
statusVal('sbMode','N-Queens');statusVal('sbSteps',q.steps)},
controls:function(){var q=STATE.nqueens;var h='<div class="sec"><h4>Board size</h4>';
h+='<div class="ctrl"><div class="lbl"><span>N</span><span>'+q.n+'</span></div>';
h+='<input type="range" min="4" max="12" value="'+q.n+'" oninput="STATE.nqueens.n=parseInt(this.value);MODULES.nqueens.reset();renderLeftPanel()"></div></div>';
h+='<div class="sec"><h4>Solutions</h4><div class="chip-row">';
q.solutions.forEach(function(_,i){h+='<div class="chip '+(q.current===i?'active':'')+'" onclick="STATE.nqueens.current='+i+';renderLeftPanel()">#'+(i+1)+'</div>'});
h+='</div></div>';
h+='<div class="sec"><h4>Stats</h4><div class="kv"><div class="row"><span class="k">Solutions</span><span class="v">'+q.solutions.length+'</span></div><div class="row"><span class="k">Steps</span><span class="v">'+q.steps+'</span></div></div>';
h+='<button class="btn full sm" style="margin-top:6px" onclick="MODULES.nqueens.reset();renderLeftPanel()">↺ Reset</button></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>N-Queens</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">8-Queens: 92 soluções<br>12-Queens: 14,200</div></div>'}});

/* ══════════════ CELLULAR AUTOMATA ══════════════ */
registerModule('ca',{title:'CA Rule 30/110',icon:'🌌',desc:'Autômatos celulares elementares.',init:function(){this.reset()},
reset:function(){var c=STATE.ca;c.grid=[];for(var i=0;i<c.rows;i++)c.grid.push(new Uint8Array(c.width));
c.step=0;c.acc=0;c.grid[0][Math.floor(c.width/2)]=1},
next:function(){var c=STATE.ca;if(c.step>=c.rows-1)return;
var prev=c.grid[c.step];var nxt=c.grid[c.step+1];var w=c.width;var rule=c.rule;
for(var i=0;i<w;i++){var l=prev[(i-1+w)%w],m=prev[i],r=prev[(i+1)%w];
var pattern=(l<<2)|(m<<1)|r;nxt[i]=(rule>>pattern)&1}
c.step++},
tick:function(dt){STATE.time+=dt;var c=STATE.ca;if(!STATE.playing)return;
c.acc+=dt*c.speed;
while(c.acc>=1&&c.step<c.rows-1){this.next();c.acc-=1}},
step:function(){this.next()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010402';ctx.fillRect(0,0,W,H);var c=STATE.ca;
if(!c.grid)return;
var cw=W/c.width;var ch=H/c.rows;
for(var r=0;r<c.rows;r++)for(var x=0;x<c.width;x++){if(c.grid[r][x]){ctx.fillStyle='#40ff80';ctx.fillRect(x*cw,r*ch,cw,ch)}}
ctx.fillStyle='rgba(5,16,9,.9)';ctx.strokeStyle='rgba(64,255,128,.4)';ctx.beginPath();ctx.roundRect(20,20,W-40,30,6);ctx.fill();ctx.stroke();
ctx.fillStyle='#40ff80';ctx.font='bold 12px monospace';ctx.textAlign='left';
ctx.fillText('Rule '+c.rule+' · step '+c.step+' / '+c.rows,W/2-120,40);
setStatsHTML('<div>Rule: '+c.rule+'</div><div>Width: '+c.width+'</div><div>Step: '+c.step+'</div>');
updateBadge('🌌 Rule '+c.rule+' · step '+c.step);
statusVal('sbMode','CA');statusVal('sbSteps',c.step)},
controls:function(){var c=STATE.ca;var h='<div class="sec"><h4>Rule</h4><div class="chip-row">';
[30,60,90,102,110,150,184].forEach(function(r){h+='<div class="chip '+(c.rule===r?'active':'')+'" onclick="STATE.ca.rule='+r+';MODULES.ca.reset();renderLeftPanel()">'+r+'</div>'});
h+='</div><div class="ctrl" style="margin-top:6px"><input type="number" min="0" max="255" value="'+c.rule+'" onchange="STATE.ca.rule=parseInt(this.value);MODULES.ca.reset();renderLeftPanel()"></div></div>';
h+='<div class="sec"><h4>Controls</h4><button class="btn primary full" onclick="MODULES.ca.reset();renderLeftPanel()">↺ Reset</button>';
h+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.ca.step();renderLeftPanel()">⏭ Step</button>';
h+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Speed</span><span>'+c.speed+'</span></div>';
h+='<input type="range" min="1" max="60" value="'+c.speed+'" oninput="STATE.ca.speed=parseInt(this.value)"></div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Elementary CA</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">2^8 = 256 regras.<br>Rule 110 é Turing-completo.</div></div>'}});

/* ══════════════ UI + BOOT ══════════════ */
function buildTabs(){var t=$('tbTabs');t.innerHTML='';
TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});
i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;
$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});
var m=MODULES[k];
statusVal('sbMode',(m&&m.title)||k);
try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}
renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;
$$('.rp-tab').forEach(function(t){t.classList.remove('active')});
e.classList.add('active');
$$('.rp-pane').forEach(function(p){p.classList.remove('active')});
var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
if(p)p.classList.add('active');
renderRightPanel()}
function renderLeftPanel(){
  var b=$('lpBody');if(!b)return;
  var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}
  var h='';
  h+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--green);font-size:.7rem">'+m.icon+' '+m.title+'</h4>';
  h+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+esc(m.desc||'')+'</div></div>';
  try{if(m.controls)h+=m.controls()}
  catch(e){h+='<div class="sec"><div class="empty" style="color:var(--red)">controls error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}
  b.innerHTML=h;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var s=$('rpState');
  if(s)s.innerHTML='<div class="sec"><h4>Live</h4><div class="kv"><div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div><div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div><div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div></div></div>';
  var mp=$('rpMath');
  if(mp){
    try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No theory panel</div>'}
    catch(e){mp.innerHTML='<div class="empty" style="color:var(--red)">'+esc(e.message)+'</div>'}
  }
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var h='<div class="sec"><h4>Log</h4>';
  if(!LOG.length)h+='<div class="empty">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var c=l.type==='error'?'var(--red)':l.type==='success'?'var(--green)':'var(--cyan)';
    h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>';
  });
  h+='</div>';p.innerHTML=h;
}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){MODULES[STATE.currentTab].init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['hacker','light','amber'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');
var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];
document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){openModal('❓ SYNTAX — Help','<div class="sec"><h4>📚 18 Módulos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--green)">🔤 Lexer</b> · <b style="color:var(--green)">🌲 Parser</b> · <b style="color:var(--green)">🔎 NFA</b> · <b style="color:var(--green)">⚙ DFA</b><br><b style="color:var(--green)">🧠 Brainfuck</b> · <b style="color:var(--green)">📐 Shunting</b> · <b style="color:var(--green)">λ Lambda</b><br><b style="color:var(--green)">📊 Sorting</b> · <b style="color:var(--green)">🔍 Search</b> · <b style="color:var(--green)">🕸 Graph</b><br><b style="color:var(--green)">📈 Big-O</b> · <b style="color:var(--green)">🌳 Huffman</b> · <b style="color:var(--green)">📦 RLE</b><br><b style="color:var(--green)">🔢 Base64</b> · <b style="color:var(--green)">🎞 Turing</b> · <b style="color:var(--green)">🧩 Sudoku</b><br><b style="color:var(--green)">👑 N-Queens</b> · <b style="color:var(--green)">🌌 CA</b></div></div><div class="sec"><h4>⌨️ Shortcuts</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Space=Play · →=Step · R=Reset · T=Theme · ?=Help</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){
    try{
      CANV.ctx.clearRect(0,0,CANV.W,CANV.H);
      m.draw(CANV.ctx);
    }catch(e){
      logMsg('draw('+m.key+') error: '+e.message,'error');
      try{
        CANV.ctx.fillStyle='#010402';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);
        CANV.ctx.fillStyle='#ff5060';CANV.ctx.font='bold 14px monospace';
        CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';
        CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2);
      }catch(_){}
    }
  }
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded fired','success');
  try{buildTabs()}catch(e){logMsg('buildTabs error: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas error: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init error: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel error: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel error: '+e.message,'error')}
  logMsg('SYNTAX ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('SYNTAX ready — 18 módulos','success',3000);
});
console.log('%c SYNTAX v2 ','background:linear-gradient(90deg,#40ff80,#40e0ff,#ffb040);color:#020705;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
</script>
