<!DOCTYPE html>
<html lang="pt-BR" data-theme="matrix">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CRYPTOFORGE — Cryptography Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#030705;--panel:#061009;--panel2:#0a1c10;--panel3:#0f2818;--panel4:#153420;
  --bd:#0f2418;--bd2:#1a4028;--tx:#c8ffe0;--tx2:#68b088;--tx3:#3a6850;
  --p1:#00ff88;--p2:#00e0ff;--p3:#ff4060;--p4:#ffd040;--p5:#a060ff;--p6:#ff8040;
  --g1:linear-gradient(135deg,#00ff88,#00e0ff);
  --gHolo:linear-gradient(120deg,#00ff88,#00e0ff,#a060ff,#ff4060,#ffd040,#00ff88);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f5fff8;--panel:#fff;--panel2:#f0fff8;--panel3:#dfffec;--panel4:#c0f8d8;--bd:#b8e0c8;--bd2:#80c0a0;--tx:#0a2018;--tx2:#2a6040;--tx3:#608070;--p1:#008040;--p2:#0060c0;--g1:linear-gradient(135deg,#008040,#0060c0)}
[data-theme="cyber"]{--bg:#0a0005;--panel:#180008;--panel2:#280010;--panel3:#3a0018;--panel4:#4a0020;--bd:#3a0018;--bd2:#600028;--tx:#ffc8d8;--tx2:#c06888;--tx3:#804058;--p1:#ff00a0;--p2:#00e0ff;--g1:linear-gradient(135deg,#ff00a0,#00e0ff)}
[data-theme="amber"]{--bg:#0a0600;--panel:#180e00;--panel2:#281800;--panel3:#3a2400;--panel4:#4a2e00;--bd:#382200;--bd2:#603800;--tx:#ffe0a0;--tx2:#c0a060;--tx3:#806840;--p1:#ffb000;--p2:#ffd060;--g1:linear-gradient(135deg,#ffb000,#ffd060)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#030705}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#000402;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,136,.015) 0,rgba(0,255,136,.015) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(6,16,9,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p4)}.sb-val.c4{color:var(--p5)}.sb-val.c5{color:var(--p3)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(0,255,136,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#030705;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn.danger{background:rgba(255,64,96,.2);border-color:var(--p3);color:var(--p3)}
.btn.danger:hover{background:rgba(255,64,96,.3)}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#030705;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p1)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p3)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.hex{font-family:var(--mono);font-size:.62rem;word-break:break-all;line-height:1.6;color:var(--p2);background:rgba(0,0,0,.3);padding:6px;border-radius:3px;border:1px solid var(--bd)}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('classic')">CRYPTOFORGE</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Bits</span><span class="sb-val c2" id="sbBits">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Entropy</span><span class="sb-val c3" id="sbEntropy">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Rounds</span><span class="sb-val c4" id="sbRounds">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Time</span><span class="sb-val c5" id="sbTime">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Ciphers</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   BIGINT & MODULAR ARITHMETIC
   ══════════════════════════════════════════════════════════ */
function bmodpow(base,exp,mod){
  base=BigInt(base);exp=BigInt(exp);mod=BigInt(mod);
  var result=1n;base=((base%mod)+mod)%mod;
  while(exp>0n){
    if(exp&1n)result=(result*base)%mod;
    exp>>=1n;
    base=(base*base)%mod;
  }
  return result;
}
function bgcd(a,b){a=BigInt(a);b=BigInt(b);while(b){var t=b;b=a%b;a=t}return a}
function begcd(a,b){
  // Extended Euclidean
  a=BigInt(a);b=BigInt(b);
  var old_r=a,r=b;var old_s=1n,s=0n;var old_t=0n,t=1n;
  while(r!==0n){var q=old_r/r;var tmp=old_r-q*r;old_r=r;r=tmp;tmp=old_s-q*s;old_s=s;s=tmp;tmp=old_t-q*t;old_t=t;t=tmp}
  return {g:old_r,x:old_s,y:old_t};
}
function bmodinv(a,m){
  var r=begcd(((BigInt(a)%BigInt(m))+BigInt(m))%BigInt(m),BigInt(m));
  if(r.g!==1n)return null;
  return ((r.x%BigInt(m))+BigInt(m))%BigInt(m);
}
function millerRabin(n,k){
  n=BigInt(n);k=k||20;

registerModule('otp',{title:'One-Time Pad',icon:'🎲',desc:'Unbreakable if key is random + same length + single use.',init:function(){this.encrypt()},
encrypt:function(){var o=STATE.otp;
// Generate random key
o.key='';
for(var i=0;i<o.plain.length;i++){
  o.key+=String.fromCharCode(65+rnd(0,25));
}
o.cipher='';
for(var i=0;i<o.plain.length;i++){
  var p=o.plain.charCodeAt(i)-65;
  var k=o.key.charCodeAt(i)-65;
  if(p<0||p>25){o.cipher+=o.plain[i];continue}
  o.cipher+=String.fromCharCode(65+((p+k)%26));
}
// Decode
o.decoded='';
for(var i=0;i<o.cipher.length;i++){
  var c=o.cipher.charCodeAt(i)-65;
  var k=o.key.charCodeAt(i)-65;
  if(c<0||c>25){o.decoded+=o.cipher[i];continue}
  o.decoded+=String.fromCharCode(65+((c-k+26)%26));
}
o.match=o.decoded===o.plain.toUpperCase()},

ctx.fillText('CIPHER (C = P ⊕ K)',30,220);
ctx.fillStyle='#00e0ff';ctx.font='16px monospace';
ctx.fillText(o.cipher,30,245);
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';
ctx.fillText('DECODED (P = C ⊕ K)',30,285);
ctx.fillStyle=o.match?'#00ff88':'#ff4060';ctx.font='16px monospace';
ctx.fillText(o.decoded,30,310);
ctx.fillStyle=o.match?'#00ff88':'#ff4060';ctx.font='bold 12px monospace';

/* Character-level table */
var ty=380;

ctx.fillText('CHARACTER-LEVEL OPS',30,ty);
var cols=Math.min(10,Math.floor((W-80)/60));

registerModule('playfair',{title:'Playfair Cipher',icon:'🎯',desc:'Digraph substitution using 5×5 grid.',init:function(){this.build();this.encrypt()},
build:function(){var p=STATE.playfair;
var key=p.key.toUpperCase().replace(/[^A-Z]/g,'').replace(/J/g,'I');
var seen='';
var alpha='ABCDEFGHIKLMNOPQRSTUVWXYZ';
for(var i=0;i<key.length;i++){if(seen.indexOf(key[i])<0)seen+=key[i]}
for(var i=0;i<alpha.length;i++){if(seen.indexOf(alpha[i])<0)seen+=alpha[i]}
p.grid=[];
for(var r=0;r<5;r++){
  var row=[];
  for(var c=0;c<5;c++)row.push(seen[r*5+c]);
  p.grid.push(row);
}
p.alpha=alpha;
p.seen=seen},
encrypt:function(){var p=STATE.playfair;
var text=p.plain.toUpperCase().replace(/[^A-Z]/g,'').replace(/J/g,'I');
// Insert X between duplicate pairs
var pairs=[];
var i=0;
while(i<text.length){
  var a=text[i];
  var b=i+1<text.length?text[i+1]:'X';
  if(a===b){pairs.push(a+'X');i++}
  else{pairs.push(a+b);i+=2}
}
if(pairs.length&&pairs[pairs.length-1].length===1)pairs[pairs.length-1]+='X';
p.pairs=pairs;
// Find positions
p.result='';
p.stepTrace=[];
function findPos(ch){
  for(var r=0;r<5;r++)for(var c=0;c<5;c++)if(p.grid[r][c]===ch)return [r,c];
  return null;
}
pairs.forEach(function(pair){
  var a=findPos(pair[0]),b=findPos(pair[1]);
  if(!a||!b){p.result+='??';return}
  var ea,eb,rule;
  if(a[0]===b[0]){
    // Same row: shift right
    ea=[a[0],(a[1]+1)%5];
    eb=[b[0],(b[1]+1)%5];
    rule='same-row';
  }else if(a[1]===b[1]){
    // Same column: shift down
    ea=[(a[0]+1)%5,a[1]];
    eb=[(b[0]+1)%5,b[1]];
    rule='same-col';
  }else{
    // Rectangle
    ea=[a[0],b[1]];
    eb=[b[0],a[1]];
    rule='rectangle';
  }
  var ca=p.grid[ea[0]][ea[1]];
  var cb=p.grid[eb[0]][eb[1]];
  p.result+=ca+cb;
  p.stepTrace.push({pair:pair,a:a,b:b,ea:ea,eb:eb,ca:ca,cb:cb,rule:rule});
});
},

registerModule('hill',{title:'Hill Cipher',icon:'🔢',desc:'Linear algebra mod 26.',init:function(){this.compute()},
compute:function(){var h=STATE.hill;
h.det=((h.matrix[0][0]*h.matrix[1][1]-h.matrix[0][1]*h.matrix[1][0])%26+26)%26;
h.invDet=h.det?bmodinv(h.det,26):null;
h.valid=h.invDet!==null;
if(h.valid){
  // Inverse matrix
  var id=Number(h.invDet);
  h.invMat=[
    [((h.matrix[1][1]*id)%26+26)%26, ((-h.matrix[0][1]*id)%26+26*10)%26],
    [((-h.matrix[1][0]*id)%26+26*10)%26, ((h.matrix[0][0]*id)%26+26)%26]
  ];
}
var text=h.plain.toUpperCase().replace(/[^A-Z]/g,'');
if(text.length%2)text+='X';
h.result='';
h.vectors=[];
for(var i=0;i<text.length;i+=2){
  var a=text.charCodeAt(i)-65;
  var b=text.charCodeAt(i+1)-65;
  var c1=(h.matrix[0][0]*a+h.matrix[0][1]*b)%26;
  var c2=(h.matrix[1][0]*a+h.matrix[1][1]*b)%26;
  h.result+=String.fromCharCode(c1+65)+String.fromCharCode(c2+65);
  h.vectors.push({in:[a,b],out:[c1,c2]});
}},

encrypt:function(){var e=STATE.enigma;
var text=e.text.toUpperCase().replace(/[^A-Z]/g,'');
var rotors=e.rotorPos.slice();
var out='';
for(var i=0;i<text.length;i++){
  // Step rotors (simplified — no double-stepping)
  rotors[2]=(rotors[2]+1)%26;
  if(rotors[2]===0)rotors[1]=(rotors[1]+1)%26;
  if(rotors[1]===0&&rotors[2]===0)rotors[0]=(rotors[0]+1)%26;
  var c=text.charCodeAt(i)-65;
  // Plugboard (swap)
  c=this.plugSwap(c,e.plugboard);

  for(var r=2;r>=0;r--){
    var rotorIdx=e.rotors[r];
    var shifted=(c+rotors[r])%26;
    var mapped=ENIGMA_ROTORS[rotorIdx].charCodeAt(shifted)-65;
    c=(mapped-rotors[r]+26)%26;

  }

registerModule('rc4',{title:'RC4 Stream Cipher',icon:'📡',desc:'KSA + PRGA visualization.',init:function(){this.apply()},

for(var i=0;i<256;i++){
  j=(j+S[i]+keyBytes[i%keyBytes.length])%256;
  var t=S[i];S[i]=S[j];S[j]=t;
}
// PRGA
var plainBytes=strToBytes(r.plain);
var keystream=[];
var i=0,k=0;
r.cipher=[];

  i=(i+1)%256;
  k=(k+S[i])%256;
  var t=S[i];S[i]=S[k];S[k]=t;
  var ks=S[(S[i]+S[k])%256];
  keystream.push(ks);
  r.cipher.push(plainBytes[n]^ks);
}
r.keystream=keystream;
r.S=S;
r.cipherHex=toHex(r.cipher);
r.ksHex=toHex(keystream)},

  }else if(m.mode==='CBC'){
    cb=encBlock(xorBytes(b,prev));
    prev=cb;
  }else if(m.mode==='CFB'){
    var ks=encBlock(prev);
    cb=xorBytes(b,ks);
    prev=cb;
  }else if(m.mode==='OFB'){
    prev=encBlock(prev);
    cb=xorBytes(b,prev);
  }else if(m.mode==='CTR'){
    var ctr=prev.slice();
    ctr[15]=(i)&0xff;
    var ks=encBlock(ctr);
    cb=xorBytes(b,ks);
  }
  cipherBlocks.push(cb);
});
m.cipherBlocks=cipherBlocks;
m.cipherHex=toHex(cipherBlocks.reduce(function(a,b){return a.concat(b)},[]));
// Check ECB pattern
m.pattern=blocks.length>1&&blocks[0].toString()===blocks[1].toString()},

  }
}
ctx.textAlign='left';
/* Mode properties */

ctx.fillText('MODE PROPERTIES',30,py);
var props={
  'ECB':{par:false,iv:false,desc:'Electronic Codebook — INSEGURO (padrões vazam)'},

};
ctx.fillStyle='#c8ffe0';ctx.font='11px monospace';
ctx.fillText('IV required: '+(props[m.mode].iv?'YES':'NO'),30,py+22);
ctx.fillText('Parallelizable: '+(props[m.mode].par?'YES':'NO'),30,py+42);
ctx.fillText(props[m.mode].desc,30,py+62);
if(m.mode==='ECB'){
  ctx.fillStyle='#ff4060';ctx.font='bold 11px monospace';
  ctx.fillText('⚠ ECB leaks patterns — never use in production!',30,py+92);
}
/* Cipher hex */
var cy=py+120;
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';
ctx.fillText('CIPHER (hex)',30,cy);
ctx.fillStyle='#00e0ff';ctx.font='11px monospace';
var hex=m.cipherHex;var cols=Math.floor((W-80)/26);
for(var i=0;i<hex.length;i+=cols*2){
  ctx.fillText(hex.substr(i,cols*2),30,cy+22+Math.floor(i/(cols*2))*16);
}
/* Attack demo */
var dy=cy+120;
if(dy+100<H){
  ctx.fillStyle='#00ff88';ctx.font='bold 12px monospace';

}
SV('sbBits',m.plain.length*8);SV('sbRounds',m.blocks.length);SV('sbMode','Modes');
setStats('<div>Mode: '+m.mode+'</div><div>Blocks: '+m.blocks.length+'</div>');

/* ══════ 13. HASH FUNCTIONS ══════ */
registerModule('sha',{title:'Hash Functions',icon:'#️⃣',desc:'SHA-256, SHA-1, MD5 real implementations.',init:function(){this.hash()},
hash:function(){var s=STATE.sha;
s.hashes={};
try{s.hashes['SHA-256']=sha256(s.input)}catch(e){s.hashes['SHA-256']='error'}
try{s.hashes['SHA-1']=sha1(s.input)}catch(e){s.hashes['SHA-1']='error'}
try{s.hashes['MD5']=md5(s.input)}catch(e){s.hashes['MD5']='error'}
// Avalanche demo: flip one bit
var bytes=strToBytes(s.input);
if(bytes.length){
  var modified=bytes.slice();
  modified[0]^=0x01;
  s.avalancheInput=bytesToStr(modified);
  s.avalancheSHA=sha256(modified);
  s.originalSHA=s.hashes['SHA-256'];
  // Count diff bits
  var diff=0;
  for(var i=0;i<64;i++){
    var a=parseInt(s.originalSHA.substr(i,1),16);
    var b=parseInt(s.avalancheSHA.substr(i,1),16);
    var x=a^b;
    while(x){diff+=x&1;x>>=1}
  }
  s.avalancheBits=diff;
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000402';ctx.fillRect(0,0,W,H);
var s=STATE.sha;
ctx.fillStyle='#00ff88';ctx.font='bold 16px monospace';ctx.textAlign='left';
ctx.fillText('#️⃣ HASH FUNCTIONS',30,40);
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';
ctx.fillText('INPUT',30,80);
ctx.fillStyle='#c8ffe0';ctx.font='14px monospace';
ctx.fillText(s.input.substring(0,60),30,105);
/* Hashes */
var y=160;
['SHA-256','SHA-1','MD5'].forEach(function(algo,i){
  var h=s.hashes[algo]||'';
  ctx.fillStyle='#00ff88';ctx.font='bold 12px monospace';
  ctx.fillText(algo+' ('+(algo==='SHA-256'?256:algo==='SHA-1'?160:128)+' bits)',30,y+i*100);
  ctx.fillStyle='#00e0ff';ctx.font='12px monospace';
  // Split hash in lines
  var cols=Math.floor((W-80)/24);
  for(var k=0;k<h.length;k+=cols*2){
    ctx.fillText(h.substr(k,cols*2),30,y+i*100+22+Math.floor(k/(cols*2))*14);
  }
});
/* Avalanche */
var ay=y+3*100+40;
ctx.fillStyle='#00ff88';ctx.font='bold 12px monospace';
ctx.fillText('AVALANCHE EFFECT',30,ay);
ctx.fillStyle='#68b088';ctx.font='11px monospace';
ctx.fillText('Original:  '+s.originalSHA,30,ay+22);
ctx.fillText('1-bit flip: '+s.avalancheSHA,30,ay+42);
ctx.fillStyle='#ffd040';ctx.font='bold 12px monospace';
if(s.avalancheBits!=null){
  ctx.fillText('Bit differences: '+s.avalancheBits+' / 256 ('+fmt(s.avalancheBits/256*100,1)+'%)',30,ay+68);
  ctx.fillStyle='#c8ffe0';ctx.font='11px monospace';
  ctx.fillText('Good hash: ~50% bits flip (~128/256). Ideal avalanche.',30,ay+90);
}
/* Hash visualization */
var vy=ay+120;
if(vy+150<H){
  ctx.fillStyle='#00ff88';ctx.font='bold 12px monospace';
  ctx.fillText('HASH AS COLOR GRID (SHA-256)',30,vy);
  var h=s.hashes['SHA-256'];
  for(var i=0;i<32;i++){
    var x=30+i*((W-80)/32);
    var byte=parseInt(h.substr(i*2,2),16);
    var r=(byte>>5)<<5;
    var g=(byte&0x1c)<<3;
    var b=(byte&0x3)<<6;
    ctx.fillStyle='rgb('+r+','+g+','+b+')';
    ctx.fillRect(x,vy+20,(W-80)/32-2,40);
  }
  ctx.fillStyle='#c8ffe0';ctx.font='11px monospace';
  ctx.fillText('Each byte of hash → color. Visually different for any change.',30,vy+80);
}
SV('sbBits',s.input.length*8);SV('sbEntropy',fmt(shannonEntropy(strToBytes(s.input)),2));SV('sbMode','Hash');
setStats('<div>SHA-256: '+s.hashes['SHA-256']?.substring(0,16)+'...</div>');
badge('#️⃣ SHA-256 · MD5 · SHA-1')},
onDown:function(){},
controls:function(){var s=STATE.sha;var h='<div class="sec"><h4>Input</h4>';
h+='<div class="ctrl"><textarea onchange="STATE.sha.input=this.value;MODULES.sha.hash();renderLeftPanel()">'+attr(s.input)+'</textarea></div>';
h+='</div>';
h+='<button class="btn primary full" onclick="STATE.sha.input=\'Hello World\';MODULES.sha.hash();renderLeftPanel()">📝 Test string</button>';
h+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.sha.input=\'The quick brown fox jumps over the lazy dog\';MODULES.sha.hash();renderLeftPanel()">📝 Pangram</button>';
h+='</div>';
h+='<div class="sec"><h4>Avalanche test</h4>';
h+='<div class="ctrl"><textarea onchange="STATE.sha.input=this.value;MODULES.sha.hash();renderLeftPanel()">'+attr(s.input)+'</textarea></div>';
h+='<div style="font-size:.6rem;color:var(--tx3)">Change 1 character — see 50% of hash bits flip.</div>';
h+='</div>';
return h},

/* ══════ 14. HMAC ══════ */
registerModule('hmac',{title:'HMAC',icon:'🔑',desc:'Keyed-hash message authentication.',init:function(){this.compute()},
compute:function(){var h=STATE.hmac;
h.output=hmacSHA256(h.key,h.msg);
if(h.verifyMsg!=null)h.verification=h.output===hmacSHA256(h.key,h.verifyMsg)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000402';ctx.fillRect(0,0,W,H);
var h=STATE.hmac;
ctx.fillStyle='#00ff88';ctx.font='bold 16px monospace';ctx.textAlign='left';
ctx.fillText('🔑 HMAC — Keyed Hash MAC',30,40);
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';

ctx.fillStyle='#ffd040';ctx.font='14px monospace';
ctx.fillText(h.key,30,105);
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';
ctx.fillText('MESSAGE',30,145);
ctx.fillStyle='#c8ffe0';ctx.font='14px monospace';
ctx.fillText(h.msg,30,170);
ctx.fillStyle='#68b088';ctx.font='bold 11px monospace';
ctx.fillText('HMAC-SHA256',30,215);
ctx.fillStyle='#00e0ff';ctx.font='12px monospace';
var cols=Math.floor((W-80)/24);
for(var i=0;i<h.output.length;i+=cols*2){
  ctx.fillText(h.output.substr(i,cols*2),30,240+Math.floor(i/(cols*2))*16);
}
/* Construction diagram */
var dy=380;
ctx.fillStyle='#00ff88';ctx.font='bold 12px monospace';
ctx.fillText('CONSTRUCTION (RFC 2104)',30,dy-10);
ctx.fillStyle='#c8ffe0';ctx.font='11px monospace';
ctx.fillText('K+ = K padded to block size (64 bytes)',30,dy+15);
ctx.fillText('ipad = 0x36 repeated 64 times',30,dy+35);
ctx.fillText('opad = 0x5c repeated 64 times',30,dy+55);
ctx.fillText('HMAC(K, m) = H((K+ ⊕ opad) ‖ H((K+ ⊕ ipad) ‖ m))',30,dy+90);
/* Visualization */
var vy=dy+120;
var bx=30,by=vy;
ctx.fillStyle='#ffd040';ctx.fillRect(bx,by,60,30);
ctx.fillStyle='#030705';ctx.font='bold 11px monospace';ctx.textAlign='center';
ctx.fillText('K+',bx+30,by+20);
ctx.fillStyle='#00ff88';ctx.font='14px monospace';
ctx.fillText('⊕',bx+80,by+20);
ctx.fillStyle='#ff4060';ctx.fillRect(bx+100,by,60,30);
ctx.fillStyle='#030705';ctx.fillText('ipad',bx+130,by+20);
ctx.fillStyle='#c8ffe0';ctx.font='14px monospace';
ctx.fillText('→',bx+180,by+20);
ctx.fillStyle='#00e0ff';ctx.fillRect(bx+210,by,100,30);
ctx.fillStyle='#030705';ctx.fillText('SHA256',bx+260,by+20);
ctx.fillStyle='#c8ffe0';ctx.fillText('→ ... → SHA256 → HMAC',bx+330,by+20);
ctx.textAlign='left';
/* Verification */
var vy2=vy+80;
if(h.verification!=null){
  ctx.fillStyle=h.verification?'#00ff88':'#ff4060';
  ctx.font='bold 14px monospace';
  ctx.fillText(h.verification?'✓ MAC VERIFIED':'✗ MAC MISMATCH',30,vy2);
}
SV('sbBits',h.msg.length*8);SV('sbEntropy',fmt(shannonEntropy(strToBytes(h.output)),2));SV('sbMode','HMAC');
setStats('<div>Algo: '+h.algo+'</div><div>Output: 256 bits</div>');
badge('🔑 HMAC-SHA256')},
onDown:function(){},

h2+='<div class="ctrl"><input type="text" value="'+attr(h.key)+'" onchange="STATE.hmac.key=this.value;MODULES.hmac.compute();renderLeftPanel()"></div>';

h2+='</div>';
return h2},
