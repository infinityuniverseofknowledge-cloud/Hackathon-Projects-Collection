function bravaisVectors(type){var a=1;if(type==='SC')return[[a,0,0],[0,a,0],[0,0,a]];if(type==='BCC')return[[a,0,0],[0,a,0],[a/2,a/2,a/2]];if(type==='FCC')return[[a,0,0],[a/2,a/2,0],[a/2,0,a/2]];if(type==='Diamond')return[[a,0,0],[a/4,a/4,a/4],[a/2,a/2,0]];if(type==='HCP'){var c=1.633*a;return[[a,0,0],[a/2,a*Math.sqrt(3)/2,0],[0,0,c]]}if(type==='Simple Hex'){return[[a,0,0],[a/2,a*Math.sqrt(3)/2,0],[0,0,1.6*a]]}return[[a,0,0],[0,a,0],[0,0,a]]}
function coordination(type){var m={SC:6,BCC:8,FCC:12,Diamond:4,HCP:12,'Simple Hex':12};return m[type]||6}
function packingFraction(type){var m={SC:0.524,BCC:0.680,FCC:0.740,Diamond:0.340,HCP:0.740};return m[type]||0.5}
function millerPlanes(h,k,l,a){var d=a/Math.sqrt(h*h+k*k+l*l);return{d:d,angle:Math.atan2(l,Math.sqrt(h*h+k*k))*180/Math.PI}}
function braggLambda(theta,d,n){return 2*d*Math.sin(theta)*n}
function braggTheta(lambda,d,n){var s=n*lambda/(2*d);if(s>1)return null;return Math.asin(s)}
function xrdPattern(lambda,a,hklList){var peaks=[];hklList.forEach(function(hkl){var h=hkl[0],k=hkl[1],l=hkl[2];var d=a/Math.sqrt(h*h+k*k+l*l);var theta=braggTheta(lambda,d,1);if(theta!==null)peaks.push({hkl:hkl,d:d,theta:theta,deg:theta*180/Math.PI})});return peaks}
function structureFactor(hkl,basis,types){var h=hkl[0],k=hkl[1],l=hkl[2];var F=0;for(var i=0;i<basis.length;i++){var r=basis[i];var phase=2*Math.PI*(h*r[0]+k*r[1]+l*r[2]);F+=types[i]*Math.exp(-2*Math.PI*1*phase/(2*Math.PI))}return F}
function structureFactorSimple(hkl,lattice,atoms){var h=hkl[0],k=hkl[1],l=hkl[2];var F=0;atoms.forEach(function(at){var phase=2*Math.PI*(h*at[0]+k*at[1]+l*at[2]);F+=Math.cos(phase)});return Math.abs(F)}
function fermiEnergy(n){return HBAR*HBAR/(2*ME)*Math.pow(3*Math.PI*Math.PI*n,2/3)}
function fermiTemp(TF){return TF*KB/EC}
function densityOfStates3D(m,E){return 1/(2*Math.PI*Math.PI)*Math.pow(2*m/HBAR/HBAR,1.5)*Math.sqrt(E)}
function mobilityFromScattering(tau,m){return EC*tau/m*1e4}
function drudeConductivity(n,e,tau,m){return n*e*e*tau/m}
function hallCoefficient(n,e){return -1/(n*e)}
function hallVoltage(I,B,t,n,e){var vI=I/(n*e*t);return vI*B*t}
function debyeTemperature(vs,n){return HBAR*vs/KB*Math.pow(6*Math.PI*Math.PI*n,1/3)}
function debyeCv(T,TD){var x=TD/T;if(x>20)return 3*R_GAS;var integral=0;for(var i=0.01;i<x;i+=0.05){integral+=i*i*i*i*Math.exp(i)/Math.pow(Math.exp(i)-1,2)*0.05}return 9*R_GAS*Math.pow(T/TD,3)*integral}
function einsteinCv(T,TE){var x=TE/T;if(x>20)return 3*R_GAS;return 3*R_GAS*x*x*Math.exp(x)/Math.pow(Math.exp(x)-1,2)}
function thermalConductivity(Cv,vs,lm){return Cv*vs*lm/3}
function widenmannFranz(L,sigma,T){return L*sigma*T}
function phaseFraction(x,xa,xb){return (x-xa)/(xb-xa)}
function leverRule(xA,xL,xS){return{liq:(xA-xS)/(xL-xS),sol:(xL-xA)/(xL-xS)}}
function gibbsMixing(x,T){return R_GAS*T*(x*Math.log(Math.max(x,1e-9))+(1-x)*Math.log(Math.max(1-x,1e-9)))}
function idealSolutionG(x,T,HA,HB){return (1-x)*HA+x*HB+gibbsMixing(x,T)}
function regularSolutionG(x,T,Omega,HA,HB){return idealSolutionG(x,T,HA,HB)+Omega*x*(1-x)}
function nucleationRate(T,gv,gamma,Ds,d0){var dT=MELT_TEMP.Al-T;var dG=16*Math.PI*gamma*gamma*gamma/(3*gv*gv);return Ds/d0*Math.exp(-dG/(KB*T/EC))}
function jmak(x,k,n){return 1-Math.exp(-Math.pow(k*x,n))}
function avrami(x,k,n){return 1-Math.exp(-k*Math.pow(x,n))}
function fickDiffusion(D0,Qa,T){return D0*Math.exp(-Qa/(R_GAS*T))}
function diffusionLength(D,t){return Math.sqrt(D*t)}
function errFunc(x){var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;var sign=x<0?-1:1;x=Math.abs(x);var t=1/(1+p*x);var y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);return sign*y}
function erfc(x){return 1-errFunc(x)}
function youngsModulusStress(strain,E){return E*strain}
function yieldStressHooke(strain,E,sigmay){var s=E*strain;return s>sigmay?sigmay:s}
function strainHardening(plasticStrain,K,n){return K*Math.pow(plasticStrain,n)}
function hallPetch(sigma0,k,d){return sigma0+k/Math.sqrt(d)}
function solidSolutionStrength(c,k){return k*Math.pow(c,2/3)}
function griffithStrength(gamma,E,a){return Math.sqrt(2*gamma*E/(Math.PI*a))}
function stressIntensity(Y,sigma,a){return Y*sigma*Math.sqrt(Math.PI*a)}
function parisLaw(dK,C,m){return C*Math.pow(dK,m)}
function creepRate(A,sigma,n,Q,R,T){return A*Math.pow(sigma,n)*Math.exp(-Q/(R*T))}
function nabarroHerring(A,sigma,d,D,Q,R,T){return A*D*sigma/(d*d*KB*T/EC)}
function compositeRule(Em,Er,vm){return Em*vm+Er*(1-vm)}
function halpinTsai(Em,Ef,vf,xi){var eta=(Ef/Em-1)/(Ef/Em+xi);return Em*(1+xi*eta*vf)/(1-eta*vf)}
function quantumDotGap(bulkGap,radius){return bulkGap+1.8/(radius*radius)+0.0}
function cntElastic(E,rho,L,d){return{stiffness:E*Math.PI*d*d/4,specific:E/rho}}
function bcsTc(theta,lambda){return 1.13*theta*Math.exp(-1/lambda)}
function coherenceLength(vf,delta){return HBAR*vf/(Math.PI*delta)}
function londonDepth(n,e,m){return Math.sqrt(m/(MU0*n*e*e))}
function meissnerFactor(lambda,r){return 1-Math.exp(-r/lambda)}
function curieTemp(J,Sc,lambda){return 3*J*Sc*(Sc+1)/(2*KB/EC)*1e0}
function magnetization(T,Tc,M0,beta){beta=beta||0.5;if(T>=Tc)return 0;return M0*Math.pow(1-T/Tc,beta)}
function hysteresisLoss(f,Bm,Hc,V){return f*Math.PI*Bm*Hc*V}
function seebeckCoeff(n,mu,T){return -Math.PI*Math.PI*KB*KB*T/(3*EC)*(-1)}
function figureOfMerit(S,sigma,kappa,T){return S*S*sigma*T/kappa}
function ztEfficiency(ZT,Tc,Th){var eta_c=(Th-Tc)/Th;return eta_c*(Math.sqrt(1+ZT)-1)/(Math.sqrt(1+ZT)+Tc/Th)}
function thermalExpansionExpansion(alpha,dT,L0){return L0*(1+alpha*dT)}
function thermalStress(alpha,E,dT){return alpha*E*dT}
function sublimationFlux(p,M,T){return p/Math.sqrt(2*Math.PI*M*DALTON*KB*T)}
function barrettSpecificHeat(Cv){return Cv/3/R_GAS*100}
function ratioCurieWeiss(C,T,theta){return C/(T-theta)}
function larmorNMR(gamma,B){return gamma*B/(2*Math.PI)}
function ESRFreq(ge,B){var muB=9.274e-24;return ge*muB*B/HBAR/(2*Math.PI)}

function drawLattice(ctx,cx,cy,a,N,type,color){color=color||'#ffb040';var scale=a*8;var points=[];for(var i=-N;i<=N;i++){for(var j=-N;j<=N;j++){for(var k=-N;k<=N;k++){var vec=bravaisVectors(type);var x=cx+(i*vec[0][0]+j*vec[1][0]+k*vec[2][0])*scale;var y=cy+(i*vec[0][1]+j*vec[1][1]+k*vec[2][1])*scale;var z=i*vec[0][2]+j*vec[1][2]+k*vec[2][2];var pers=1/(1+z*0.1);x=cx+(x-cx)*pers;y=cy+(y-cy)*pers;if(x>-20&&x<CANV.W+20&&y>-20&&y<CANV.H+20)points.push({x:x,y:y,z:z})}}}points.sort(function(a,b){return b.z-a.z});points.forEach(function(p){ctx.fillStyle=color;ctx.globalAlpha=clamp(0.3+p.z*0.05+0.5,0.2,1);ctx.beginPath();ctx.arc(p.x,p.y,3+p.z*0.05,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}
function heatColor(v){v=clamp(v,0,1);var r,g,b;if(v<0.5){r=Math.floor(v*2*255);g=Math.floor(v*2*100);b=Math.floor((1-v*2)*255)}else{r=255;g=Math.floor((v-0.5)*2*155+100);b=0}return 'rgb('+r+','+g+','+b+')'}

registerModule('bandStructure',{title:'Band Structure E(k)',icon:'∿',desc:'Tight-binding dispersion.',init:function(){this.compute()},compute:function(){var b=STATE.bandStructure;b.bands=[];for(var k=-Math.PI/b.a;k<=Math.PI/b.a;k+=Math.PI/b.a/50){var E1=b.E0-2*b.t*Math.cos(k*b.a);var E2=b.E0+2*b.t*Math.cos(k*b.a)+b.gap;b.bands.push({k:k,E1:E1,E2:E2})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var b=STATE.bandStructure;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('BAND E(k) — t='+b.t+' eV · gap='+b.gap+' eV',20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'k','E (eV)');var maxE=b.E0+2*b.t+b.gap+1,minE=b.E0-2*b.t-1;ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();b.bands.forEach(function(pt,i){var x=px+(pt.k+Math.PI/b.a)/(2*Math.PI/b.a)*pw;var y=py+ph-(pt.E1-minE)/(maxE-minE)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#ff4080';ctx.beginPath();b.bands.forEach(function(pt,i){var x=px+(pt.k+Math.PI/b.a)/(2*Math.PI/b.a)*pw;var y=py+ph-(pt.E2-minE)/(maxE-minE)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='rgba(64,255,144,.1)';ctx.fillRect(px,py+ph-(b.E0-minE)/(maxE-minE)*ph,pw,2);ctx.fillStyle='#40ff90';ctx.font='9px monospace';ctx.fillText('— VB',px+pw-60,py+15);ctx.fillStyle='#ff4080';ctx.fillText('— CB',px+pw-60,py+30);if(b.gap>0.01){var gapY1=py+ph-(b.E0-minE)/(maxE-minE)*ph;var gapY2=py+ph-(b.E0+b.gap-minE)/(maxE-minE)*ph;ctx.fillStyle='rgba(64,160,255,.15)';ctx.fillRect(px,gapY2,pw,gapY1-gapY2);ctx.fillStyle='#40a0ff';ctx.font='bold 10px monospace';ctx.fillText('gap='+b.gap+'eV',px+10,gapY2-5)}setStats('<div>t: '+b.t+'eV</div><div>gap: '+b.gap+'eV</div>');badge('∿ Band gap='+b.gap+'eV');SV('sbA',b.a);SV('sbT',b.t);SV('sbE',b.gap);SV('sbS','—')},controls:function(){var b=STATE.bandStructure;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><s registerModule('fermi',{title:'Fermi Surface',icon:'⚛',desc:'Fermi energy + surface.',init:function(){this.compute()},compute:function(){var f=STATE.fermi;var n=f.n;var EF=HBAR*HBAR/(2*ME)*Math.pow(3*Math.PI*Math.PI*n,2/3);f.EF=EF;f.EFeV=EF/EV_TO_J;f.vF=Math.sqrt(2*EF/ME);f.TF=EF/KB;f.kF=Math.pow(3*Math.PI*Math.PI*n,1/3);f.lambdaF=2*Math.PI/f.kF},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var f=STATE.fermi;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('FERMI — n='+fmtSci(f.n,2)+' cm⁻³ · EF='+fmt(f.EFeV,2)+' eV',20,25);var cx=W*0.35,cy=H/2,r=Math.min(W,H)*0.3;ctx.strokeStyle='rgba(255,176,64,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(64,255,144,.15)';ctx.beginPath();ctx.arc(cx,cy,r*0.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r*0.7,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(cx,cy,r*0.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('kF',cx+r*0.7+5,cy);ctx.fillStyle='#ff4080';ctx.fillText('occupied',cx-30,cy+4);var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,220);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,220);ctx.fillStyle='#ffb040';ctx.font='bold 11px monospace';ctx.fillText('FERMI',ix+8,iy+18);[['EF',fmt(f.EFeV,3)+' eV'],['EF',fmtSci(f.EF,3)+' J'],['vF',fmtSci(f.vF,3)+' m/s'],['TF',fmtSci(f.TF,3)+' K'],['kF',fmtSci(f.kF,3)+' m⁻¹'],['λF',fmtSci(f.lambdaF,3)+' m']].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+8,iy+40+i*20);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+70,iy+40+i*20)});setStats('<div>EF: '+fmt(f.EFeV,2)+'eV</div><div>vF: '+fmtSci(f.vF,2)+'</div>');badge('⚛ EF='+fmt(f.EFeV,2)+'eV');SV('sbA',fmtSci(f.n,2));SV('sbT',fmt(f.EFeV,2));SV('sbE',fmtSci(f.vF,2));SV('sbS',fmtSci(f.TF,2))},controls:function(){var f=STATE.fermi;return '<div class="sec"><h4>Electron density</h4><div class="ctrl"><div class="lbl"><span>log10(n)</span><span>'+Math.log10(f.n).toFixed(2)+'</span></div><input type="range" min="26" max="30" step="0.05" value="'+Math.log10(f.n)+'" oninput="STATE.fermi.n=Math.pow(10,parseFloat(this.value));MODULES.fermi.compute()"></div></div><div class="chip-row"><div class="chip" onclick="STATE.fermi.n=8.5e28;MODULES.fermi.compute()">Cu</div><div class="chip" onclick="STATE.fermi.n=6e28;MODULES.fermi.compute()">Ag</div><div class="chip" onclick="STATE.fermi.n=1.8e29;MODULES.fermi.compute()">Al</div><div class="chip" onclick="STATE.fermi.n=8.5e28;MODULES.fermi.compute()">Au</div><div class="chip" onclick="STATE.fermi.n=2.5e28;MODULES.fermi.compute()">W</div></div>'},mathPanel:function(){return '<div class="sec"><h4>Fermi Energy</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Definição:</b><br>Energia do último nível ocupado T=0<br>f(EF) = 1/2<br><br><b>Fórmula (gás de elétrons livres):</b><br>EF = ħ²/(2m)·(3π²n)^(2/3)<br><br><b>Velocidade de Fermi:</b><br>vF = √(2EF/m) ≈ 1e6 m/s (Cu)<br><br><b>Temperatura de Fermi:</b><br>TF = EF/kB<br>Metais: 10⁴-10⁵ K<br>Não é termodinâmica!<br><br><b>Comprimento de onda:</b><br>λF = 2π/kF<br>kF = (3π²n)^(1/3)<br><br><b>Valores típicos:</b><br>Cu: EF=7 eV, vF=1.57e6 m/s<br>Ag: EF=5.5 eV<br>Al: EF=11.7 eV<br>Na: EF=3.2 eV<br><br><b>Fermi surface:</b><br>Superfície E(k)=EF<br>Determina propriedades<br>Não esférica em geral<br><br><b>Referência:</b> Kittel, Ashcroft</div></div>'}});
registerModule('mobility',{title:'Carrier Mobility',icon:'→',desc:'Drift velocity + saturation.',init:function(){this.compute()},compute:function(){var m=STATE.mobility;var mu=m.mu;var muEff=mu/Math.pow(1+Math.pow(mu*m.E/m.vsat,2),0.5);m.vd=muEff*m.E;m.muEff=muEff;m.curves=[];for(var E=1e2;E<=1e6;E*=1.2){var muE=mu/Math.pow(1+Math.pow(mu*E/m.vsat,2),0.5);m.curves.push({E:E,v:muE*E})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var m=STATE.mobility;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('MOBILITY — '+m.material+' · μ='+m.mu+' cm²/Vs · vd='+fmtSci(m.vd,2),20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'E (V/cm)','vd (cm/s)');ctx.strokeStyle='#40a0ff';ctx.lineWidth=2;ctx.beginPath();m.curves.forEach(function(p,i){var x=px+Math.log10(p.E)/6*pw;var y=py+ph-Math.min(p.v/m.vsat,1.2)*ph/1.2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,64,128,.5)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px,py+ph-m.vsat/m.vsat*ph/1.2);ctx.lineTo(px+pw,py+ph-m.vsat/m.vsat*ph/1.2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('vsat='+fmtSci(m.vsat,2),px+10,py+ph-m.vsat/m.vsat*ph/1.2-5);var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,180);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,180);ctx.fillStyle='#ffb040';ctx.font='bold 10px monospace';ctx.fillText('MOBILITY',ix+8,iy+18);[['μ0',m.mu+' cm²/Vs'],['E',m.E+' V/cm'],['μ(E)',fmt(m.muEff,1)+' cm²/Vs'],['vsat',fmtSci(m.vsat,2)],['vd',fmtSci(m.vd,2)]].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='9px monospace';ctx.fillText(r[0]+':',ix+8,iy+38+i*20);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+70,iy+38+i*20)});setStats('<div>μ: '+m.mu+'</div><div>vd: '+fmtSci(m.vd,2)+'</div>');badge('→ '+m.material+' · μ='+m.mu);SV('sbA',m.material);SV('sbT',m.mu);SV('sbE',fmt registerModule('hall',{title:'Hall Effect',icon:'⚡',desc:'Hall voltage + carrier type.',init:function(){this.compute()},compute:function(){var h=STATE.hall;var q=EC;h.RH=-1/(h.n*EC);h.VH=h.I*h.B/(h.n*EC*h.t);h.vd=h.I/(h.n*EC*h.t*h.B+1e-30)*h.B},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var h=STATE.hall;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('HALL — n='+fmtSci(h.n,2)+' · VH='+fmtSci(h.VH,2)+' V',20,25);var cx=W*0.35,cy=H/2;var plateW=200,plateH=120;ctx.fillStyle='rgba(64,160,255,.2)';ctx.fillRect(cx-plateW/2,cy-plateH/2,plateW,plateH);ctx.strokeStyle='#40a0ff';ctx.lineWidth=2;ctx.strokeRect(cx-plateW/2,cy-plateH/2,plateW,plateH);ctx.fillStyle='#40a0ff';ctx.font='bold 10px monospace';ctx.fillText('I →',cx-plateW/2-30,cy+5);ctx.fillText('B ⊙',cx+plateW/2+10,cy-60);for(var k=0;k<50;k++){ctx.fillStyle='rgba(64,255,144,.5)';ctx.beginPath();ctx.arc(cx-plateW/2+20+Math.random()*80,cy-plateH/2+20+Math.random()*80,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ff4080';ctx.font='bold 11px monospace';ctx.fillText('VH',cx+plateW/2+10,cy+4);ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+plateW/2,cy-plateH/2);ctx.lineTo(cx+plateW/2+20,cy-plateH/2);ctx.moveTo(cx+plateW/2,cy+plateH/2);ctx.lineTo(cx+plateW/2+20,cy+plateH/2);ctx.stroke();var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,180);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,180);ctx.fillStyle='#ffb040';ctx.font='bold 11px monospace';ctx.fillText('HALL',ix+8,iy+18);[['n',fmtSci(h.n,3)+' m⁻³'],['B',h.B+' T'],['I',h.I+' A'],['t',h.t+' m'],['RH',fmtSci(h.RH,3)+' m³/C'],['VH',fmtSci(h.VH,3)+' V']].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+8,iy+40+i*20);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+70,iy+40+i*20)});setStats('<div>VH: '+fmtSci(h.VH,2)+'V</div><div>RH: '+fmtSci(h.RH,2)+'</div>');badge('⚡ registerModule('phonon',{title:'Phonon Dispersion',icon:'〰',desc:'Diatomic chain + acoustic/optical branches.',init:function(){this.compute()},compute:function(){var p=STATE.phonon;p.dispersion=[];var m1=1,m2=2;for(var k=-Math.PI;k<=Math.PI;k+=Math.PI/50){var omega2A=(k*k)*(m1+m2)/(m1*m2)*0.5+Math.sqrt(Math.pow((k*k)*(m1+m2)/(m1*m2)*0.5,2)-4*Math.sin(k/2)*Math.sin(k/2)/(m1*m2));var omega2O=(k*k)*(m1+m2)/(m1*m2)*0.5-Math.sqrt(Math.pow((k*k)*(m1+m2)/(m1*m2)*0.5,2)-4*Math.sin(k/2)*Math.sin(k/2)/(m1*m2));p.dispersion.push({k:k,acoustic:Math.sqrt(Math.max(0,omega2A)),optical:Math.sqrt(Math.max(0,omega2O))})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var p=STATE.phonon;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('PHONON — diatomic chain · ω(k)',20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'k','ω');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();p.dispersion.forEach(function(pt,i){var x=px+(pt.k+Math.PI)/(2*Math.PI)*pw;var y=py+ph-Math.min(pt.acoustic,2)/2*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();p.dispersion.forEach(function(pt,i){var x=px+(pt.k+Math.PI)/(2*Math.PI)*pw;var y=py+ph-Math.min(pt.optical,2)/2*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='9px monospace';ctx.fillText('— acoustic',px+pw-120,py+15);ctx.fillStyle='#ff4080';ctx.fillText('— optical',px+pw-120,py+30);ctx.fillStyle='rgba(64,160,255,.15)';ctx.fillRect(px,py+ph-0.4/2*ph,pw,0.4/2*ph);ctx.fillStyle='#40a0ff';ctx.font='9px monospace';ctx.fillText('gap',px+10,py+ph-0.4/2*ph-5);setStats('<div>N: 2</div><div>ωmax: '+fmt(p.dispersion[p.dispersion.length-1].optical,2)+'</div>');badge('〰 Phonon diatomic');SV('sbA','2');SV('sbT',fmt(p.dispersion[0].optical,2));SV('sbE','—');SV('sbS','—')},controls:function(){var p=STATE.phonon;return '<div class="sec registerModule('lever',{title:'Lever Rule',icon:'⚖',desc:'Phase fractions from tie-line.',init:function(){this.compute()},compute:function(){var l=STATE.lever;var xL=l.xL,xS=l.xS,xA=l.xA;l.fL=(xA-xS)/(xL-xS);l.fS=(xL-xA)/(xL-xS)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var l=STATE.lever;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('LEVER RULE — fL='+fmt(l.fL,3)+' · fS='+fmt(l.fS,3),20,25);var px=60,cy=H/2,pw=W-140;ctx.strokeStyle='#ffb040';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,cy-80);ctx.lineTo(px+pw,cy-80);ctx.moveTo(px,cy+80);ctx.lineTo(px+pw,cy+80);ctx.stroke();ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px+pw,cy);ctx.stroke();var xSx=px+l.xS*pw;var xLx=px+l.xL*pw;var xAx=px+l.xA*pw;ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(xSx,cy,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40a0ff';ctx.beginPath();ctx.arc(xLx,cy,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(xAx,cy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('xS='+fmt(l.xS,2),xSx-20,cy+30);ctx.fillStyle='#40a0ff';ctx.fillText('xL='+fmt(l.xL,2),xLx-20,cy+30);ctx.fillStyle='#40ff90';ctx.fillText('xA='+fmt(l.xA,2),xAx-20,cy-30);var barY=cy+140;ctx.fillStyle='rgba(255,64,128,.3)';ctx.fillRect(px,barY,pw*l.fS,30);ctx.fillStyle='rgba(64,160,255,.3)';ctx.fillRect(px+pw*l.fS,barY,pw*l.fL,30);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.5;ctx.strokeRect(px,barY,pw,30);ctx.fillStyle='#ff4080';ctx.font='bold 11px monospace';ctx.fillText('Solid '+fmt(l.fS*100,1)+'%',px+5,barY+20);ctx.fillStyle='#40a0ff';ctx.fillText('Liquid '+fmt(l.fL*100,1)+'%',px+pw*l.fS+5,barY+20);setStats('<div>fL: '+fmt(l.fL,3)+'</div><div>fS: '+fmt(l.fS,3)+'</div>');badge('⚖ fL='+fmt(l.fL,2)+' fS='+fmt(l.fS,2));SV('sbA',l.xA);SV('sbT',l.xL);SV('sbE',l.xS);SV('sbS',fmt(l.fL,2))},controls:function(){var l=STATE.lever;return '<div class="sec"><h4>Tie-line</h4><div class="ctrl"><div class="lbl"><span>xA (nominal)</span><span>'+l.xA+'</span></div><input type="range" min="0" max="1" step="0.01" value="'+l.xA+'" oninput="STATE.lever.xA=parseFloat(this.value);MODULES.lever.compute()"></div><div class="ctrl"><div class="lbl"><span>xL (liquidus)</span><span>'+l.xL+'</span></div><input type="range" min="0" max="1" step="0.01" value="'+l.xL+'" oninput="STATE.lever.xL=parseFloat(this.value);MODULES.lever.compute()"></div><div class="ctrl"><div class="lbl"><span>xS (solidus)</span><span>'+l.xS+'</span></div><input type="range" min="0" max="1" step="0.01" value="'+l.xS+'" oninput="STATE.lever.xS=parseFloat(this.value);MODULES.lever.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Lever Rule</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Regra:</b><br>fL = (xS - xA)/(xS - xL)<br>fS = (xA - xL)/(xS - xL)<br>fL + fS = 1<br><br><b>Significado:</b><br>Fases em equilíbrio → composições fixas (tie-line)<br>Frações por regra da alavanca<br><br><b>Exemplo (Cu-Ni):</b><br>xL=0.35, xS=0.45, xA=0.40<br>fL = (0.40-0.45)/(0.35-0.45) = 0.5<br>fS = 0.5<br><br><b>Aplicações:</b><br>• Frações de fase<br>• Sequência de solidificação<br>• Segregação<br>• Fundição<br>• Design de ligas<br><br><b>Limitações:</b><br>• Equilíbrio termodinâmico<br>• Não vale em resfriamento rápido<br>• Requer diagrama confiável<br><br><b>Complementar:</b><br>• Regra de Scheil (solidificação)<br>• Gulliver-Scheil<br>• Cinética de transformação</div></div>'}});
registerModule('gibbs',{title:'Gibbs Free Energy',icon:'G',desc:'Ideal + regular solutions.',init:function(){this.compute()},compute:function(){var g=STATE.gibbs;g.curve=[];g.curveIdeal=[];g.curveReg=[];for(var x=0;x<=1;x+=0.02){var G=g.idealG(x,g.T,g.HA,g.HB);var Gr=g.regularG(x,g.T,g.Omega,g.HA,g.HB);g.curve.push({x:x,G:G});g.curveIdeal.push({x:x,G:g.idealG(x,g.T,g.HA,g.HB)});g.curveReg.push({x:x,G:Gr})}},idealG:function(x,T,HA,HB){return (1-x)*HA+x*HB+R_GAS*T*(x*Math.log(Math.max(x,1e-9))+(1-x)*Math.log(Math.max(1-x,1e-9)))/1000},regularG:function(x,T,Omega,HA,HB){return this.idealG(x,T,HA,HB)+Omega*x*(1-x)/1000},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var g=STATE.gibbs;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('GIBBS — T='+g.T+'K · Ω='+g.Omega,20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'x','G (kJ/mol)');var allG=g.curve.map(function(c){return c.G}).concat(g.curveReg.map(function(c){return c.G}));var minG=Math.min.apply(null,allG),maxG=Math.max.apply(null,allG);ctx.strokeStyle='#ff4080';ctx.lineWidth=1.5;ctx.beginPath();g.curveIdeal.forEach(function(c,i){var x=px+c.x*pw;var y=py+ph-(c.G-minG)/(maxG-minG)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();g.curveReg.forEach(function(c,i){var x=px+c.x*pw;var y=py+ph-(c.G-minG)/(maxG-minG)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff4080';ctx.font='9px monospace';ctx.fillText('— ideal',px+pw-80,py+15);ctx.fillStyle='#40ff90';ctx.fillText('— regular',px+pw-80,py+30);setStats('<div>T: '+g.T+'K</div><div>Ω: '+g.Omega+'</div>');badge('G · T='+g.T+'K');SV('sbA',g.T);SV('sbT',g.Omega);SV('sbE',g.HA);SV('sbS',g.HB)},controls:function(){var g=STATE.gibbs;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+g.T+'</span></div><input type="range" min="200" max="2000" step="10" value="'+g.T+'" oninput="STATE.gibbs.T=parseFloat(this.value);MODULES.gibbs.compute()"></div><div class="ctrl"><div class="lbl"><span>HA (J/mol)</span><span>'+g.HA+'</span></div><input type="range" min="-20000" max="20000" step="100" value="'+g.HA+'" oninput="STATE.gibbs.HA=parseFloat(this.value);MODULES.gibbs.compute()"></div><div class="ctrl"><div class="lbl"><span>HB (J/mol)</span><span>'+g.HB+'</span></div><input type="range" min="-20000" max="20000" step="100" value="'+g.HB+'" oninput="STATE.gibbs.HB=parseFloat(this.value);MODULES.gibbs.compute()"></div><div class="ctrl"><div class="lbl"><span>Ω (J/mol)</span><span>'+g.Omega+'</span></div><input type="range" min="-20000" max="20000" step="100" value="'+g.Omega+'" oninput="STATE.gibbs.Omega=parseFloat(this.value);MODULES.gibbs.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Gibbs Free Energy</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Definição:</b><br>G = H - TS<br>dG = -SdT + VdP<br><br><b>Mistura ideal:</b><br>G_mix = RT(x_A ln x_A + x_B ln x_B)<br><br><b>Solução regular:</b><br>G = G_ideal + Ω·x_A·x_B<br>Ω: interaction parameter<br><br><b>Tipos:</b><br>• Ω=0: solução ideal<br>• Ω>0: tendência a separar<br>• Ω<0: ordering/compound<br><br><b>Spinodal:</b><br>∂²G/∂x² = 0<br>Desmistura espontânea<br><br><b>Binodal:</b><br>Common tangent (2 fases)<br><br><b>Aplicações:</b><br>• Diagramas de fase (CALPHAD)<br>• Precipitação<br>• Decomposição spinodal<br>• Nucleação<br>• Estabilidade de fases<br><br><b>Códigos:</b> Thermo-Calc, FactSage, Pandat</div></div>'}});
registerModule('nucleation',{title:'Nucleation',icon:'◉',desc:'Classical nucleation theory.',init:function(){this.compute()},compute:function(){var n=STATE.nucleation;n.dT=MELT_TEMP.Al-n.T;n.gv=n.dT/1000*1e7;n.dG=16*Math.PI*Math.pow(n.gamma,3)/(3*n.gv*n.gv+1e-30);n.rate=1e12*Math.exp(-n.dG/(KB*n.T/EC));n.history=[];for(var T=400;T<=900;T+=10){var dT2=MELT_TEMP.Al-T;var gv2=dT2/1000*1e7;var dG2=16*Math.PI*Math.pow(n.gamma,3)/(3*gv2*gv2+1e-30);n.history.push({T:T,rate:Math.exp(-Math.min(dG2/(KB*T/EC),700))})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var n=STATE.nucleation;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('NUCLEATION — ΔG*='+fmtSci(n.dG,2)+' J',20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'T (K)','rate (a.u.)');ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();n.history.forEach(function(h,i){var x=px+(h.T-400)/500*pw;var y=py+ph-Math.min(h.rate,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,160);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,160);ctx.fillStyle='#ffb040';ctx.font='bold 10px monospace';ctx.fillText('CNT',ix+8,iy+18);[['T',n.T+' K'],['ΔT',n.dT+' K'],['γ',n.gamma+' J/m²'],['ΔG*',fmtSci(n.dG,2)+' J'],['Rate',fmtSci(n.rate,2)]].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='9px monospace';ctx.fillText(r[0]+':',ix+8,iy+38+i*18);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+70,iy+38+i*18)});setStats('<div>ΔG*: '+fmtSci(n.dG,2)+'</div><div>Rate: '+fmtSci(n.rate,2)+'</div>');badge('◉ ΔG*='+fmtSci(n.dG,2));SV('sbA',n.T);SV('sbT',n.gamma);SV('sbE',fmtSci(n.dG,2));SV('sbS',fmtSci(n.rate,2))},controls:function(){var n=STATE.nucleation;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+n.T+'</span></div><input type="range" min="300" max="900" step="10" value="'+n.T+'" oninput="STATE.nucleation.T=parseFloat(this.value);MODULES.nucleation.compute()"></div><div class="ctrl"><div class="lbl"><span>γ (J/m²)</span><span>'+n.gamma+'</span></div><input type="range" min="0.05" max="0.5" step="0.01" value="'+n.gamma+'" oninput="STATE.nucleation.gamma=parseFloat(this.value);MODULES.nucleation.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Classical Nucleation Theory</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Free energy barrier:</b><br>ΔG(r) = -4/3·π·r³·ΔGv + 4π·r²·γ<br><br><b>Critical radius:</b><br>r* = 2γ/ΔGv<br><br><b>Barrier:</b><br>ΔG* = 16πγ³/(3ΔGv²)<br><br><b>Rate:</b><br>J = J₀·exp(-ΔG*/kBT)<br>Homogeneous vs heterogeneous<br><br><b>Heterogeneous:</b><br>ΔG*_het = ΔG*_hom·f(θ)<br>f(θ) = (2+cos θ)(1-cos θ)²/4<br><br><b>Volmer-Weber vs Frank-van der Merwe:</b><br>Growth modes depend on γ<br><br><b>Aplicações:</b><br>• Solidificação<br>• Precipitação<br>• Cristalização<br>• Nucleação em vapores<br>• Nanopartículas<br>• Gelo em nuvens</div></div>'}});

slocation');SV('sbA',fmtSci(d.burgers,2));SV('sbT',fmtSci(d.rho,2));SV('sbE',fmtSci(d.energy,2));SV('sbS',d.shearStress)},controls:function(){var d=STATE.dislocation;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>b (m)</span><span>'+fmtSci(d.burgers,2)+'</span></div><input type="range" min="1" max="10" step="0.1" value="'+(d.burgers*1e10)+'" oninput="STATE.dislocation.burgers=parseFloat(this.value)*1e-10;MODULES.dislocation.compute()"></div><div class="ctrl"><div class="lbl"><span>log10(ρ)</span><span>'+Math.log10(d.rho).toFixed(1)+'</span></div><input type="range" min="6" max="16" step="0.5" value="'+Math.log10(d.rho)+'" oninput="STATE.dislocation.rho=Math.pow(10,parseFloat(this.value));MODULES.dislocation.compute()"></div><div class="ctrl"><div class="lbl"><span>τ (MPa)</span><span>'+(d.shearStress/1e6)+'</span></div><input type="range" min="1" max="1000" step="10" value="'+(d.shearStress/1e6)+'" oninput="STATE.dislocation.shearStress=parseFloat(this.value)*1e6;MODULES.dislocation.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Dislocations</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Tipos:</b><br>• Edge (⊥): extra half-plane<br>• Screw: helical<br>• Mixed: composto<br><br><b>Burgers vector b:</b><br>Magnitude = lattice vector<br>Determina slip system<br><br><b>Energy (edge):</b><br>E/l = Gb²/(4π(1-ν))·ln(R/r₀)<br>~1 eV per atomic plane<br><br><b>Force (Peach-Koehler):</b><br>F/l = τ·b<br><br><b>Slip systems:</b><br>FCC: 12 = {111}&lt;110&gt;<br>BCC: 48 = {110}&lt;111&gt; + {211}&lt;111&gt;<br>HCP: 3 = (0001)&lt;11-20&gt;<br><br><b>Frank-Read source:</b><br>Emissão de loops<br>Fonte de multiplicação<br>τ_c = Gb/L<br><br><b>Interações:</b><br>• Cottrell (solutes)<br>• Jogs, kinks<br>• Stacking faults<br>• Cross-slip<br><br><b>Aplicações:</b> Plasticidade, ductilidade, work hardening</div></div>'}});
registerModule('hallPetch',{title:'Hall-Petch',icon:'↗',desc:'Grain size strengthening.',init:function(){this.compute()},compute:function(){var h=STATE.hallPetch;h.sigma=h.sigma0+h.k/Math.sqrt(h.d);h.curve=[];for(var d=1e-7;d<=1e-3;d*=1.5){h.curve.push({d:d,sigma:h.sigma0+h.k/Math.sqrt(d)})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var h=STATE.hallPetch;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('HALL-PETCH — σy='+fmt(h.sigma/1e6,1)+' MPa · d='+fmtSci(h.d,2)+' m',20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'d^-1/2 (m^-1/2)','σy (MPa)');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();h.curve.forEach(function(c,i){var x=px+(1/Math.sqrt(c.d)-1/Math.sqrt(1e-3))/(1/Math.sqrt(1e-7)-1/Math.sqrt(1e-3))*pw;var y=py+ph-c.sigma/1e9*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('σy = σ₀ + k/√d',px+pw-150,py+20);var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,160);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,160);ctx.fillStyle='#ffb040';ctx.font='bold 10px monospace';ctx.fillText('HALL-PETCH',ix+8,iy+18);[['σ0',(h.sigma0/1e6).toFixed(0)+' MPa'],['k',(h.k/1e6).toFixed(0)+' MPa·m^0.5'],['d',fmtSci(h.d,2)+' m'],['σy',(h.sigma/1e6).toFixed(1)+' MPa']].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='9px monospace';ctx.fillText(r[0]+':',ix+8,iy+38+i*18);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+80,iy+38+i*18)});setStats('<div>σy: '+(h.sigma/1e6).toFixed(0)+'MPa</div><div>d: '+fmtSci(h.d,2)+'m</div>');badge('↗ σy='+(h.sigma/1e6).toFixed(0));SV('sbA',(h.sigma0/1e6).toFixed(0));SV('sbT',(h.k/1e6).toFixed(0));SV('sbE',fmtSci(h.d,2));SV('sbS',(h.sigma/1e6).toFixed(0))},controls:function(){var h=STATE.hallPetch;return '<div class="sec"><h4>Grain size</h4><div class="ctrl"><div class="lbl"><span>d (μm)</span><span>'+(h.d*1e6).toFixed(1)+'</span></div><input type="range" min="0.1" max="1000" step="0.1" value="'+(h.d*1e6)+'" oninput="STATE.hallPetch.d=parseFloat(this.value)*1e-6;MODULES.hallPetch.compute()"></div><div class="ctrl"><div class="lbl"><span>σ0 (MPa)</span><span>'+(h.sigma0/1e6)+'</span></div><input type="range" min="20" max="500" step="10" value="'+(h.sigma0/1e6)+'" oninput="STATE.hallPetch.sigma0=parseFloat(this.value)*1e6;MODULES.hallPetch.compute()"></div><div class="ctrl"><div class="lbl"><span>k (MPa·m^0.5)</span><span>'+(h.k/1e6)+'</span></div><input type="range" min="0.1" max="2" step="0.05" value="'+(h.k/1e6)+'" oninput="STATE.hallPetch.k=parseFloat(this.value)*1e6;MODULES.hallPetch.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Hall-Petch</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Relação (1951):</b><br>σy = σ₀ + k·d^(-1/2)<br>σ₀: friction stress<br>k: locking parameter<br>d: grain size<br><br><b>Physical basis:</b><br>Grain boundaries obstruem dislocações<br>Pile-up de dislocações<br>Menor d → mais barreiras<br><br><b>Range válido:</b><br>d = 10 nm - 1 mm<br><br><b>Inverso (nano):</b><br>d &lt; 10 nm: Hall-Petch inverse<br>Softening por diffusão GB<br><br><b>Valores típicos:</b><br>Aço: σ0=70 MPa, k=0.74 MPa·m^0.5<br>Al: σ0=20 MPa, k=0.04<br>Cu: σ0=25 MPa, k=0.11<br><br><b>Aplicações:</b><br>• Grãos ultrafinos (UFG)<br>• Nanocristalinos<br>• ECAP, HPT (severe plastic deformation)<br>• Twin boundary strengthening<br><br><b>Nobel (Hall-Petch):</b> Petch 1953</div></div>'}});
registerModule('griffith',{title:'Griffith Fracture',icon:'💥',desc:'Energy release rate + fracture.',init:function(){this.compute()},compute:function(){var g=STATE.griffith;g.sigma_c=Math.sqrt(2*g.E*g.gamma/(Math.PI*g.a));g.KI=g.sigma_app*Math.sqrt(Math.PI*g.a);g.propagates=g.KI>=g.KIC;g.curve=[];for(var a=1e-6;a<=1e-2;a*=1.3){g.curve.push({a:a,sigma:Math.sqrt(2*g.E*g.gamma/(Math.PI*a))})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var g=STATE.griffith;ctx.fillStyle=g.propagates?'#ff4080':'#40ff90';ctx.font='bold 13px monospace';ctx.fillText('GRIFFITH — KI='+fmt(g.KI/1e6,2)+' MPam^0.5 · '+(g.propagates?'PROPAGATES':'stable'),20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'a (m)','σc (MPa)');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();g.curve.forEach(function(c,i){var x=px+Math.log10(c.a/1e-6)/4*pw;var y=py+ph-Math.min(c.sigma/1e9,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,64,128,.5)';ctx.setLineDash([3,3]);var sx=px+g.sigma_app/1e9*pw;ctx.beginPath();ctx.moveTo(px,py+ph-g.sigma_app/1e9*ph);ctx.lineTo(px+pw,py+ph-g.sigma_app/1e9*ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='9px monospace';ctx.fillText('σ_app='+(g.sigma_app/1e6).toFixed(0)+'MPa',px+10,py+ph-g.sigma_app/1e9*ph-5);setStats('<div>KI: '+(g.KI/1e6).toFixed(1)+'</div><div>KIC: '+(g.KIC/1e6).toFixed(1)+'</div>');badge('💥 KI='+(g.KI/1e6).toFixed(1));SV('sbA',(g.E/1e9).toFixed(0));SV('sbT',g.gamma);SV('sbE',fmtSci(g.a,2));SV('sbS',(g.KI/1e6).toFixed(1))},controls:function(){var g=STATE.griffith;return '<div class="sec"><h4>Crack</h4><div class="ctrl"><div class="lbl"><span>a (mm)</span><span>'+(g.a*1000).toFixed(3)+'</span></div><input type="range" min="0.01" max="10" step="0.01" value="'+(g.a*1000)+'" oninput="STATE.griffith.a=parseFloat(this.value)*1e-3;MODULES.griffith.compute()"></div></div><div class="sec"><h4>Material</h registerModule('fatigue',{title:'Fatigue',icon:'∞',desc:'S-N curve + Paris law.',init:function(){this.compute()},compute:function(){var f=STATE.fatigue;f.SN=[];for(var N=1e3;N<=1e8;N*=1.5){var sigma=f.Sigma_f*Math.pow(N,-f.b)*Math.pow(1000,f.b);f.SN.push({N:N,sigma:sigma})}f.cycles=0;f.crack=0.001},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var f=STATE.fatigue;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('FATIGUE — '+f.material,20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'log N (cycles)','σ (MPa)');ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();f.SN.forEach(function(p,i){var x=px+(Math.log10(p.N)-3)/5*pw;var y=py+ph-Math.min(p.sigma/1e9,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='9px monospace';ctx.fillText('Basquin: σ = σf·N^b',px+pw-150,py+20);ctx.fillStyle='#40a0ff';ctx.fillText('b='+f.b+' (slope)',px+pw-150,py+40);setStats('<div>Material: '+f.material+'</div><div>Cycles: '+f.cycles+'</div>');badge('∞ '+f.material);SV('sbA',f.material);SV('sbT',f.b);SV('sbE',f.cycles);SV('sbS',fmtSci(f.crack,2))},controls:function(){var f=STATE.fatigue;return '<div class="sec"><h4>Material</h4><div class="chip-row"><div class="chip '+(f.material==='Steel'?'active':'')+'" onclick="STATE.fatigue.material=\'Steel\';STATE.fatigue.Sigma_f=1000e6;STATE.fatigue.b=-0.1;MODULES.fatigue.compute();renderLeftPanel()">Steel</div><div class="chip '+(f.material==='Al'?'active':'')+'" onclick="STATE.fatigue.material=\'Al\';STATE.fatigue.Sigma_f=500e6;STATE.fatigue.b=-0.12;MODULES.fatigue.compute();renderLeftPanel()">Al</div><div class="chip '+(f.material==='Ti'?'active':'')+'" onclick="STATE.fatigue.material=\'Ti\';STATE.fatigue.Sigma_f=900e6;STATE.fatigue.b=-0.08;MODULES.fatigue.compute();renderLeftPanel()">Ti</div></div></div><div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>σf ( registerModule('creep',{title:'Creep',icon:'↘',desc:'Power-law creep + Arrhenius.',init:function(){this.compute()},compute:function(){var c=STATE.creep;c.rate=c.A*Math.pow(c.sigma,c.n)*Math.exp(-c.Q/(R_GAS*c.T));c.strainArr=[];for(var t=0;t<=1000;t+=20){var eps=c.rate*t*3600;c.strainArr.push({t:t,eps:eps})}c.strain=c.rate*STATE.time*1e-3},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var c=STATE.creep;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('CREEP — T='+c.T+'K · σ='+(c.sigma/1e6).toFixed(0)+'MPa · rate='+fmtSci(c.rate,2)+' s⁻¹',20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'time (h)','strain');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();c.strainArr.forEach(function(p,i){var x=px+p.t/1000*pw;var y=py+ph-Math.min(p.eps*100,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40a0ff';ctx.font='9px monospace';ctx.fillText('Primary',px+80,py+20);ctx.fillText('Secondary',px+180,py+20);ctx.fillText('Tertiary',px+280,py+20);var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,180);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,180);ctx.fillStyle='#ffb040';ctx.font='bold 10px monospace';ctx.fillText('CREEP',ix+8,iy+18);[['Mode',c.mode],['T',c.T+' K'],['σ',(c.sigma/1e6).toFixed(0)+' MPa'],['n',c.n],['Q',c.Q+' J'],['Rate',fmtSci(c.rate,2)]].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='9px monospace';ctx.fillText(r[0]+':',ix+8,iy+38+i*18);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+80,iy+38+i*18)});setStats('<div>rate: '+fmtSci(c.rate,2)+'</div><div>T: '+c.T+'K</div>');badge('↘ Creep '+fmtSci(c.rate,2));SV('sbA',c.T);SV('sbT',c.n);SV('sbE',c.Q);SV('sbS',fmtSci(c.rate,2))},controls:function(){var c=STATE.creep;return '<div class="sec"><h4>Temperature</h4><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+c.T+'</span></div><input type="range" min="400  l=STATE.led;return '<div class="sec"><h4>Material</h4><div class="chip-row"><div class="chip '+(l.material==='InGaN'?'active':'')+'" onclick="STATE.led.material=\'InGaN\';STATE.led.gap=2.76;STATE.led.voltage=3.2;MODULES.led.compute();renderLeftPanel()">InGaN (blue)</div><div class="chip '+(l.material==='AlGaInP'?'active':'')'" onclick="STATE.led.material=\'AlGaInP\';STATE.led.gap=2.0;STATE.led.voltage=2.1;MODULES.led.compute();renderLeftPanel()">AlGaInP (red)</div><div class="chip '+(l.material==='GaP'?'active':'')'" onclick="STATE.led.material=\'GaP\';STATE.led.gap=2.26;STATE.led.voltage=2.2;MODULES.led.compute();renderLeftPanel()">GaP (green)</div><div class="chip '+(l.material==='InGaAs'?'active':'')'" onclick="STATE.led.material=\'InGaAs\';STATE.led.gap=0.75;STATE.led.voltage=0.9;MODULES.led.compute();renderLeftPanel()">InGaAs (IR)</div></div></div><div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>gap (eV)</span><span>'+l.gap+'</span></div><input type="range" min="0.5" max="3.5" step="0.05" value="'+l.gap+'" oninput="STATE.led.gap=parseFloat(this.value);MODULES.led.compute()"></div><div class="ctrl"><div class="lbl"><span>Current (mA)</span><span>'+l.current+'</span></div><input type="range" min="1" max="100" step="1" value="'+l.current+'" oninput="STATE.led.current=parseFloat(this.value);MODULES.led.compute()"></div><div class="ctrl"><div class="lbl"><span>η (%)</span><span>'+(l.eff*100).toFixed(0)+'</span></div><input type="range" min="0.05" max="0.9" step="0.05" value="'+l.eff+'" oninput="STATE.led.eff=parseFloat(this.value);MODULES.led.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>LED</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Princípio:</b> recombinção elétron-buraco em junção p-n<br>Fóton com hν = Eg<br><br><b>Wavelength:</b><br>λ(nm) = 1240/Eg(eV)<br>Blue 450nm → 2.76 eV<br>Green 530nm → 2.34<br>Red 630nm → 1.97<br>IR 850nm → 1.46<br><br><b>Eficiência:</b><br>IQE (internal): até 90% (InGaN)<br>EQE (external): 30-70%<br>Droop em alta corrente<br><br><b>Nobel 2014:</b> Akasaki, Amano, Nakamura<br>Blue LED → white LED<br><br><b>Aplicações:</b><br>• Iluminação (white LED)<br>• Displays (μLED)<br>• Automotivo<br>• Sinalização<br>• Optogenética<br>• Comunicação (LiFi)<br>• Sensores<br><br><b>Empresas:</b><br>Nichia, Cree, Lumileds, Osram<br>Samsung, Seoul Semi, MLS</div></div>'}});
registerModule('catalysis',{title:'Catalysis',icon:'⚗',desc:'Sabatier + volcano plot.',init:function(){this.compute()},compute:function(){var c=STATE.catalysis;c.rate=c.TOF*Math.exp(-c.Ea/(R_GAS*c.T*0.001));c.activity=[];for(var dE=-2;dE<=2;dE+=0.05){var rate=Math.exp(-Math.pow((dE+0.5)/0.7,2))*10;c.activity.push({dE:dE,rate:rate})}c.site=Math.max(0,Math.min(1,1-Math.abs(c.Ea-0.8)))},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var c=STATE.catalysis;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('CATALYSIS — '+c.metal+' · '+c.reaction+' · rate='+fmtSci(c.rate,2),20,25);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'ΔE_ads (eV)','activity');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();c.activity.forEach(function(p,i){var x=px+(p.dE+2)/4*pw;var y=py+ph-Math.min(p.rate/10,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('Sabatier optimum',px+pw/2-50,py+20);ctx.fillStyle='#40a0ff';ctx.fillText('Strong binding ← → Weak binding',px+pw-250,py+ph-10);var ix=W-260,iy=30;ctx.fillStyle='rgba(20,16,8,.9)';ctx.fillRect(ix,iy,240,180);ctx.strokeStyle='#ffb040';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,240,180);ctx.fillStyle='#ffb040';ctx.font='bold 10px monospace';ctx.fillText('CATALYSIS',ix+8,iy+18);[['Metal',c.metal],['Reaction',c.reaction],['Ea',c.Ea+' eV'],['T',c.T+' K'],['rate',fmtSci(c.rate,2)]].forEach(function(r,i){ctx.fillStyle='#c0a880';ctx.font='9px monospace';ctx.fillText(r[0]+':',ix+8,iy+38+i*18);ctx.fillStyle='#ffb040';ctx.fillText(r[1],ix+80,iy+38+i*18)});setStats('<div>'+c.metal+'</div><div>Ea: '+c.Ea+'eV</div>');badge('⚗ '+c.metal);SV('sbA',c.metal);SV('sbT',c.Ea);SV('sbE',c.T);SV('sbS',fmtSci(c.rate,2))},controls:function(){var c=STATE.catalysis;return '<div class="sec"><h4>Metal</h4><div class="chip-row"><div class="chip" onclick="STATE.catalysis.metal=\'Pt\';STATE.catalysis.Ea=0.6;MODULES.catalysis.compute()">Pt</div><div class="chip" onclick="STATE.catalysis.metal=\'Pd\';STATE.catalysis.Ea=0.7;MODULES.catalysis.compute()">Pd</div><div class="chip" onclick="STATE.catalysis.metal=\'Cu\';STATE.catalysis.Ea=0.9;MODULES.catalysis.compute()">Cu</div><div class="chip" onclick="STATE.catalysis.metal=\'Ni\';STATE.catalysis.Ea=0.85;MODULES.catalysis.compute()">Ni</div><div class="chip" onclick="STATE.catalysis.metal=\'Ru\';STATE.catalysis.Ea=0.65;MODULES.catalysis.compute()">Ru</div><div class="chip" onclick="STATE.catalysis.metal=\'Fe\';STATE.catalysis.Ea=0.95;MODULES.catalysis.compute()">Fe</div></div></div><div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>Ea (eV)</span><span>'+c.Ea+'</span></div><input type="range" min="0.3" max="1.5" step="0.02" value="'+c.Ea+'" oninput="STATE.catalysis.Ea=parseFloat(this.value);MODULES.catalysis.compute()"></div><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+c.T+'</span></div><input type="range" min="200" max="800" step="5" value="'+c.T+'" oninput="STATE.catalysis.T=parseFloat(this.value);MODULES.catalysis.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Catalysis</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Definição:</b><br>Acelera reação sem ser consumido<br>Não muda equilíbrio, só cinética<br><br><b>Sabatier principle:</b><br>Adsorção ótima: nem muito forte, nem fraca<br>Volcano plot<br><br><b>Rates:</b><br>TOF (turnover frequency): moléculas/site/s<br>Ea (activation energy)<br>Rate = A·exp(-Ea/RT)<br><br><b>Tipos:</b><br>• Heterogeneous (Pt surface)<br>• Homogeneous (in solution)<br>• Enzymatic (biological)<br><br><b>Volcano plots:</b><br>Pt: melhor para HER, ORR<br>Ru: melhor para N2 fixation (Haber)<br>Cu: melhor para CO2 → CH3OH<br>Fe: Haber-Bosch (NH3)<br>Ni: methanation<br><br><b>Aplicações:</b><br>• Haber-Bosch (NH3)<br>• Refining (cracking)<br>• Catalytic converter (Pt, Pd, Rh)<br>• Fischer-Tropsch<br>• Fuel cells<br>• Electrolysis<br>• CO2 reduction</div></div>'}});
registerModule('corrosion',{title:'Corrosion',icon:'🛡',desc:'Pourbaix diagram + Tafel.',init:function(){this.compute()},compute:function(){var c=STATE.corrosion;c.Ecorr=-0.44+0.059*c.pH;c.icorr=1e-6*Math.exp(-0.05*c.pH);c.rate=3270*c.icorr*56/2/7.87;c.pourbaix=[];for(var pH=0;pH<=14;pH+=0.2){for(var E=-1.5;E<=1.5;E+=0.1){var stable='passive';if(E<-0.059*pH-0.1)stable='corrosion';else if(E>0.4)stable='passive';c.pourbaix.push({pH:pH,E:E,stable:stable})}}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#0a0806';ctx.fillRect(0,0,W,H);var c=STATE.corrosion;ctx.fillStyle='#ffb040';ctx.font='bold 13px monospace';ctx.fillText('CORROSION — '+c.material+' · pH='+c.pH+' · Ecorr='+fmt(c.Ecorr,3)+' V',20,25);var px=80,py=60,pw=W-160,ph=H-140;drawAxes(ctx,px,py,pw,ph,'pH','E (V)');c.pourbaix.forEach(function(p){var x=px+p.pH/14*pw;var y=py+ph/2-p.E/2*ph;ctx.fillStyle=p.stable==='corrosion'?'rgba(255,64,128,.2)':p.stable==='passive'?'rgba(64,160,255,.2)':'rgba(64,255,144,.2)';ctx.fillRect(x,y,3,3)});ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();for(var pH=0;pH<=14;pH+=0.1){var E=-0.059*pH;var x=px+pH/14*pw;var y=py+ph/2-E/2*ph;if(pH===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='9px monospace';ctx.fillText('H+/H2',px+pw-60,py+ph/2+10);ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('Corrosion',px+pw*0.15,py+ph*0.8);ctx.fillStyle='#40a0ff';ctx.fillText('Passive',px+pw*0.7,py+ph*0.2);setStats('<div>Ecorr: '+fmt(c.Ecorr,2)+'V</div><div>Rate: '+fmt(c.rate,3)+' mm/y</div>');badge('🛡 '+c.material+' '+fmt(c.rate,2)+'mm/y');SV('sbA',c.material);SV('sbT',c.pH);SV('sbE',fmt(c.Ecorr,3));SV('sbS',fmt(c.rate,3))},controls:function(){var c=STATE.corrosion;return '<div class="sec"><h4>Material</h4><div class="chip-row"><div class="chip '+(c.material==='Fe'?'active':'')+'" onclick="STATE.corrosion.material=\'Fe\';MODULES.corrosion.compute();renderLeftPanel()">Fe</div><div class="chip '+(c.material==='Cu'?'active':'')'" onclick="STATE.corrosion.material=\'Cu\';MODULES.corrosion.compute();renderLeftPanel()">Cu</div><div class="chip '+(c.material==='Al'?'active':'')'" onclick="STATE.corrosion.material=\'Al\';MODULES.corrosion.compute();renderLeftPanel()">Al</div><div class="chip '+(c.material==='Ti'?'active':'')'" onclick="STATE.corrosion.material=\'Ti\';MODULES.corrosion.compute();renderLeftPanel()">Ti</div></div></div><div class="sec"><h4>Environment</h4><div class="ctrl"><div class="lbl"><span>pH</span><span>'+c.pH+'</span></div><input type="range" min="0" max="14" step="0.1" value="'+c.pH+'" oninput="STATE.corrosion.pH=parseFloat(this.value);MODULES.corrosion.compute()"></div><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+c.T+'</span></div><input type="range" min="273" max="373" step="1" value="'+c.T+'" oninput="STATE.corrosion.T=parseFloat(this.value);MODULES.corrosion.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Corrosion</h4><div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)"><b>Definição:</b><br>Degradação eletroquímica<br>Oxi-redução<br><br><b>Nernst:</b><br>E = E0 - (RT/nF)ln Q<br>0.059/n·pH<br><br><b>Pourbaix diagrams:</b><br>E vs pH<br>Regiões: corrosion, passive, immune<br>Útil para seleção de material<br><br><b>Tafel:</b><br>η = a + b·log i<br>b ~ 60-120 mV/decade<br><br><b>Tipos:</b><br>• Uniform<br>• Galvanic (bimetallic)<br>• Pitting<br>• Crevice<br>• Intergranular<br>• Stress corrosion cracking<br>• Erosion<br><br><b>Proteção:</b><br>• Pintura/coatings<br>• Galvanização (Zn)<br>• Proteção catódica<br>• Inibidores<br>• Aço inox (Cr2O3 passive layer)<br>• Anodização (Al)<br><br><b>Custo global:</b> ~3% PIB mundial<br>~US 2.5 trilhões/ano</div></div>'}});

<script>
function buildTabs(){var t=$('tbTabs');t.innerHTML='';TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';i.onclick=function(){switchTab(x.key)};t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});var m=MODULES[k];SV('sbMode',(m&&m.title)||k);try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;$$('.rp-tab').forEach(function(t){t.classList.remove('active')});e.classList.add('active');$$('.rp-pane').forEach(function(p){p.classList.remove('active')});var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));if(p)p.classList.add('active');renderRightPanel()}
function renderLeftPanel(){var b=$('lpBody');if(!b)return;var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}var h='<div class="sec" style="margin-bottom:5px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.65rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.58rem;color:var(--tx3);font-family:var(--mono);line-height:1.4;margin-top:3px">'+esc(m.desc||'')+'</div></div>';try{if(m.controls)h+=m.controls()}catch(e){h+='<div class="sec"><div class="empty">error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}b.innerHTML=h}
function renderRightPanel(){var m=MODULES[STATE.currentTab];var s=$('rpState');if(s){var st='<div class="sec"><h4>Live State</h4><div class="kv">';st+='<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>';st+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>';st+='<div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div>';st+='</div></div>';s.innerHTML=st}var mp=$('rpMath');if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}if(STATE.currentRp==='logs')renderLogs()}
function renderLogs(){var p=$('rpLogs');if(!p)return;var h='<div class="sec"><h4>Log</h4>';if(!LOG.length)h+='<div class="empty">No events</div>';else LOG.slice().reverse().forEach(function(l){var c=l.type==='error'?'var(--p4)':l.type==='success'?'var(--p3)':'var(--p1)';h+='<div style="padding:2px 5px;border-left:2px solid '+c+';margin-bottom:2px;font-family:var(--mono);font-size:.55rem;color:'+c+'">'+esc(l.msg)+'</div>'});h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',800)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',800)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',800)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['mat','paper','steel','gold','ice'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){var blob='$';openModal('MATERIA — Materials Science Studio','<div class="sec" style="border-left:3px solid #ffb040;padding-left:10px;background:rgba(255,176,64,.1);padding:8px;border-radius:3px"><div style="font-size:.65rem;color:#ffb040;font-weight:700;margin-bottom:5px">🔬 MERCADO DE '+blob+'1 TRI (semiconductors + batteries + advanced materials)</div><div style="font-family:var(--mono);font-size:.58rem;line-height:1.6;color:var(--tx2)">TSMC, Intel, CATL, LG Energy, BASF, Corning, Dow, Honeywell, Applied Materials, ASML. Materiais são a base de TUDO: chips, baterias, turbinas, aviões, medical devices, energia.</div></div><div class="sec"><h4>🔬 40 Módulos</h4><div style="font-size:.58rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">CRISTALOGRAFIA</b><br>Bravais · Miller · XRD · Reciprocal · Structure Factor<br><br><b style="color:var(--p1)">ELETRÔNICA</b><br>Band structure · DOS · Fermi · Mobility · Hall<br><br><b style="color:var(--p1)">TÉRMICA</b><br>Phonons · Debye · Cv(T) · Thermal K<br><br><b style="color:var(--p1)">TERMODINÂMICA</b><br>Phase Diagrams · Lever Rule · Gibbs · Nucleation · JMAK · TTT · Diffusion<br><br><b style="color:var(--p1)">MECÂNICA</b><br>Stress-Strain · Dislocation · Hall-Petch · Griffith · Fatigue · Creep · Composite<br><br><b style="color:var(--p1)">FUNCIONAL</b><br>Superconductor · Magnet · Piezo · Thermoelectric · Nano<br><br><b style="color:var(--p1)">APLICAÇÕES</b><br>Battery · Degradation · Solar Cell · LED · Catalysis · Corrosion</div></div><div class="sec"><h4>🧮 Física REAL</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">• 14 Bravais lattices + 7 crystal systems<br>• Miller indices + d-spacing<br>• Bragg law: n·λ = 2·d·sin θ<br>• Structure factor F(hkl) + absences<br>• Tight-binding E(k) = E0 - 2t·cos(ka)<br>• Density of states (3D, 2D, 1D, 0D)<br>• Fermi energy EF = ħ²/(2m)·(3π²n)^(2/3)<br>• Drude/Sommerfeld conductivity<br>• Hall coefficient RH = -1/(n·e)<br>• Phonon diatomic chain dispersion<br>• Debye Cv(T) with T³ limit<br>• Einstein model (harmonic oscillator)<br>• Thermal conductivity kinetic theory<br>• Binary phase diagram (isomorphous + eutectic)<br>• Lever rule for phase fractions<br>• Gibbs energy + regular solution Ω<br>• Classical Nucleation Theory (CNT)<br>• Johnson-Mehl-Avrami-Kolmogorov (JMAK)<br>• TTT diagrams (nose curve)<br>• Fick laws + Arrhenius diffusion<br>• Hooke + Hollomon hardening σ=Kεⁿ<br>• Burgers vector + Peach-Koehler force<br>• Hall-Petch: σy = σ0 + k/√d<br>• Griffith: σc = √(2Eγ/(πa))<br>• Basquin fatigue + Paris law<br>• Power-law creep Arrhenius<br>• Rule of mixtures (Voigt/Reuss) + Halpin-Tsai<br>• BCS theory: Tc = 1.13·θD·exp(-1/λ)<br>• Meissner effect + London depth<br>• Curie-Weiss magnetism<br>• Piezoelectric d33 + k33<br>• Seebeck + Peltier + ZT figure of merit<br>• Quantum dot size-dependent gap<br>• Li-ion electrochemistry + SOC<br>• Battery degradation (Arrhenius aging)<br>• Shockley-Queisser solar limit<br>• LED wavelength λ = 1240/Eg<br>• Sabatier + volcano plot catalysis<br>• Pourbaix + Tafel corrosion</div></div><div class="sec"><h4>💼 Indústrias + Mercado</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b style="color:var(--p1)">SEMICONDUCTORES</b> ('+blob+'600B)<br>TSMC, Samsung, Intel, ASML, Applied Materials<br><br><b style="color:var(--p1)">BATERIAS</b> ('+blob+'120B)<br>CATL, LG Energy, Panasonic, Tesla, BYD<br><br><b style="color:var(--p1)">MATERIAIS AVANÇADOS</b> ('+blob+'100B+)<br>Corning, Dow, BASF, DuPont, 3M<br><br><b style="color:var(--p1)">AVIAÇÃO/DEFESA</b> ('+blob+'50B)<br>Boeing, Airbus, Lockheed, GE, Safran<br><br><b style="color:var(--p1)">CATALYSIS</b> ('+blob+'30B)<br>BASF, Johnson Matthey, Albemarle<br><br><b style="color:var(--p1)">SUPERCONDUTORES</b> ('+blob+'5B)<br>Oxford Instruments, Bruker, Siemens<br><br><b style="color:var(--p1)">TOTAL:</b> '+blob+'1T+ em cadeia de valor</div></div><div class="sec"><h4>🎯 Uso</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">• Ensino de ciência dos materiais<br>• Design de ligas (CALPHAD)<br>• Caracterização XRD<br>• Seleção de materiais<br>• Design de baterias e células solares<br>• Failure analysis<br>• Simulação de processos (tratamento térmico)<br>• Prova de conceito para research</div></div>','<button class="btn primary" onclick="closeModal()">Entendido</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}else if(e.key==='r'||e.key==='R')resetModule();else if(e.key==='t'||e.key==='T')toggleTheme();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();else if(e.key==='Escape')closeModal()});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){var dt=Math.min((now-lastT)/1000,0.05);lastT=now;fAcc+=dt;fFr++;if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}var m=MODULES[STATE.currentTab];if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){logMsg('draw('+m.key+') error: '+e.message,'error');try{CANV.ctx.fillStyle='#0a0806';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#ffb040';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}}}requestAnimationFrame(loop)}
