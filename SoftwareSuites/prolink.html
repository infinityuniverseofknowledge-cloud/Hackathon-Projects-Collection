<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProLink</title>
<style>
:root{--bg:#0a0e1a;--c:#0ea5e9;--card:#111827;--bd:#1f2937;--txt:#e5e7eb;--mut:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--c);flex:1}
.logo .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0ea5e9,#0284c7);display:grid;place-items:center;font-size:20px}
header button{background:var(--c);color:#000;border:0;padding:9px 16px;border-radius:20px;cursor:pointer;font-weight:800;font-size:12px;font-family:inherit}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:12px}
label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:5px;display:block}
input,textarea{width:100%;background:#0a0e1a;border:1px solid var(--bd);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:14px;font-family:inherit;outline:0;margin-bottom:10px;transition:.15s}
input:focus,textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(14,165,233,.2)}
textarea{resize:vertical;min-height:70px}
.btn{background:var(--c);color:#000;border:0;padding:11px 20px;border-radius:9px;cursor:pointer;font-weight:800;font-family:inherit;font-size:13px;transition:.15s}
.btn:hover{filter:brightness(1.1)}
.profile{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.profile .av{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--c),#0284c7);display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;flex-shrink:0}
.profile h1{font-size:1.4rem;margin-bottom:4px}
.profile .head{color:var(--mut);font-size:13px}
.profile .loc{color:var(--mut);font-size:12px;margin-top:4px}
.person{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.person:last-child{border:0}
.person .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--c),#0284c7);display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;font-size:14px}
.person .info{flex:1}
.person .name{font-weight:700;font-size:14px}
.person .role{font-size:12px;color:var(--mut)}
.person button{background:transparent;border:1px solid var(--c);color:var(--c);padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:800;font-size:12px;font-family:inherit;transition:.15s}
.person button:hover{background:var(--c);color:#000}
.person button.connected{background:var(--c);color:#000;border-color:var(--c)}
.connections{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.connections .stat{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:10px;padding:12px;text-align:center}
.connections .stat b{display:block;font-size:20px;color:var(--c);font-family:ui-monospace,monospace}
.connections .stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700}
</style></head><body>
<header><div class="logo"><div class="ic">💼</div>ProLink</div><button id="editBtn">✏️ Editar perfil</button></header>
<div class="card" id="profileCard"></div>
<div class="card"><h2>Conexões</h2><div class="connections" id="conns"></div></div>
<div class="card"><h2>Pessoas que você pode conhecer</h2><div id="people"></div></div>
<div class="card" id="editForm" style="display:none">
<h2>Editar perfil</h2>
<label>Nome</label><input id="fName" placeholder="Seu nome">
<label>Cargo</label><input id="fRole" placeholder="Ex: Desenvolvedor Full Stack">
<label>Empresa</label><input id="fCompany" placeholder="Ex: Google">
<label>Localização</label><input id="fLoc" placeholder="Ex: São Paulo, BR">
<label>Sobre</label><textarea id="fAbout" placeholder="Conte um pouco sobre você..."></textarea>
<button class="btn" id="saveBtn">Salvar</button>
</div>
<script>
const $=s=>document.querySelector(s);
const KEY='prolink.v1';
let prof=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'Você',role:'Profissional',company:'Empresa',loc:'Brasil',about:'Buscando novas oportunidades.',connections:[]};
const people=[
{id:1,name:'Ana Lima',role:'Product Designer',company:'Nubank'},
{id:2,name:'Bruno Costa',role:'Backend Engineer',company:'Google'},
{id:3,name:'Carla Dias',role:'Data Scientist',company:'Itaú'},
{id:4,name:'Diego Reis',role:'CTO',company:'Startup XYZ'},
{id:5,name:'Eva Souza',role:'UX Researcher',company:'Meta'},
{id:6,name:'Felipe Melo',role:'Frontend Dev',company:'Amazon'},
{id:7,name:'Gabi Nunes',role:'Marketing Lead',company:'iFood'},
{id:8,name:'Hugo Alves',role:'DevOps',company:'AWS'},
];
function save(){localStorage.setItem(KEY,JSON.stringify(prof))}
function render(){
  $('#profileCard').innerHTML=`
    <div class="profile">
      <div class="av">${prof.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}</div>
      <div><h1>${prof.name}</h1><div class="head">${prof.role} @ ${prof.company}</div><div class="loc">📍 ${prof.loc}</div></div>
    </div>
    <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin-top:12px">${prof.about}</p>`;
  $('#conns').innerHTML=`
    <div class="stat"><b>${prof.connections.length}</b><span>Conexões</span></div>
    <div class="stat"><b>${Math.floor(prof.connections.length*4.2)}</b><span>Views</span></div>
    <div class="stat"><b>${prof.connections.length*2}</b><span>Matches</span></div>`;
  $('#people').innerHTML=people.filter(p=>!prof.connections.includes(p.id)).map(p=>`
    <div class="person">
      <div class="av">${p.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
      <div class="info"><div class="name">${p.name}</div><div class="role">${p.role} · ${p.company}</div></div>
      <button data-id="${p.id}">+ Conectar</button>
    </div>`).join('');
  document.querySelectorAll('[data-id]').forEach(b=>{
    b.onclick=()=>{prof.connections.push(+b.dataset.id);save();render()};
  });
}
$('#editBtn').onclick=()=>{
  $('#editForm').style.display='block';
  $('#fName').value=prof.name;$('#fRole').value=prof.role;
  $('#fCompany').value=prof.company;$('#fLoc').value=prof.loc;$('#fAbout').value=prof.about;
  $('#editForm').scrollIntoView({behavior:'smooth'});
};
$('#saveBtn').onclick=()=>{
  prof.name=$('#fName').value||'Você';
  prof.role=$('#fRole').value||'Profissional';
  prof.company=$('#fCompany').value||'Empresa';
  prof.loc=$('#fLoc').value||'Brasil';
  prof.about=$('#fAbout').value||'';
  save();$('#editForm').style.display='none';render();
};
render();
</script></body></html>
