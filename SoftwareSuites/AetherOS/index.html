<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AETHER-OS | Omnidimensional Workstation</title>
<style>
:root {
  --bg: #020305; --desktop: #050812; --win-bg: rgba(8, 16, 30, 0.85);
  --border: rgba(0, 240, 255, 0.2); --text: #8ab4d5; --text-light: #e0f0ff; 
  --accent: #00f0ff; --accent2: #ff00aa; --success: #00ff88; --danger: #ff0033;
  --font-mono: "Fira Code", monospace; --font-ui: system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

/* BOOT SCREEN */
#boot-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; padding:30px; font-family:var(--font-mono); color:var(--accent); font-size:0.8rem; gap:8px; }
.boot-line { opacity:0; animation: fadeIn 0.2s forwards; }
@keyframes fadeIn { to { opacity:1; } }
.progress-bar { width:100%; max-width:400px; height:4px; background:#111; margin-top:20px; border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--accent); width:0%; transition: width 0.1s; box-shadow: 0 0 10px var(--accent); }

/* DESKTOP */
#desktop { width: 100%; height: 100%; position: relative; display: none; background: var(--desktop); }
#bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

/* TASKBAR */
#taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(2, 4, 8, 0.9); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; gap: 15px; z-index: 1000; backdrop-filter: blur(15px); }
.tb-start { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 6px; font-family: var(--font-mono); font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.tb-start:hover { background: rgba(0,240,255,0.1); }
.tb-apps { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
.tb-apps::-webkit-scrollbar { display: none; }
.tb-icon { width: 34px; height: 34px; display: flex; justify-content: center; align-items: center; border-radius: 6px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; border: 1px solid transparent; }
.tb-icon:hover { border-color: var(--accent); background: rgba(0,240,255,0.1); }
.tb-icon.active { border-bottom: 2px solid var(--accent); background: rgba(0,240,255,0.15); }
.tb-clock { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }

/* WINDOWS (GLASSMORPHISM) */
.window { position: absolute; background: var(--win-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; min-width: 320px; min-height: 200px; overflow: hidden; backdrop-filter: blur(20px); transform: scale(0.95); opacity: 0; transition: 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
.window.open { transform: scale(1); opacity: 1; }
.window-header { height: 35px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; cursor: grab; }
.window-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-light); display: flex; align-items: center; gap: 8px; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
.window-controls { display: flex; gap: 8px; }
.win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
.win-close { background: var(--danger); box-shadow: 0 0 8px var(--danger); } 
.win-min { background: #ffbd2e; } 
.win-max { background: var(--success); }
.window-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
.window-body::-webkit-scrollbar { width: 6px; } .window-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* UI COMPONENTS */
.input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.input-group label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); }
input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: #111; border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px var(--accent); }
input[type="text"], textarea, select { background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--accent); padding: 8px; font-family: var(--font-mono); font-size: 0.75rem; border-radius: 4px; outline: none; width: 100%; }
input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.btn { background: rgba(0,240,255,0.05); border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; transition: 0.2s; text-align: center; }
.btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0,240,255,0.4); }
.btn-danger { border-color: var(--danger); color: var(--danger); background: rgba(255,0,51,0.05); }
.btn-danger:hover { background: var(--danger); color: #fff; box-shadow: 0 0 15px var(--danger); }

/* SPECIFIC APPS */
/* AI */
#chat-window { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
#chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.8rem; }
.msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; line-height: 1.4; }
.msg.user { background: rgba(0,240,255,0.1); color: var(--accent); align-self: flex-end; border: 1px solid var(--accent); border-bottom-right-radius: 0; }
.msg.ai { background: rgba(255,0,170,0.1); color: #ff80d5; align-self: flex-start; border: 1px solid var(--accent2); border-bottom-left-radius: 0; }
#chat-input-area { display: flex; padding: 8px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.8); }
#chat-input { flex: 1; background: transparent; border: none; color: #fff; font-family: var(--font-mono); font-size: 0.75rem; outline: none; }

/* SQL */
#sql-terminal { background: #000; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; font-family: var(--font-mono); font-size: 0.75rem; padding: 10px; border-radius: 6px; }
#sql-output { flex: 1; overflow-y: auto; color: var(--success); white-space: pre-wrap; margin-bottom: 10px; }
#sql-input { background: transparent; border: none; color: var(--accent); outline: none; font-family: inherit; font-size: inherit; width: 100%; }
#chart-container { height: 150px; width: 100%; display: none; margin-top: 10px; }

/* SHADER LAB */
#shader-canvas { width: 100%; height: 200px; background: #000; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; display: block; }
#shader-code { height: 120px; font-family: var(--font-mono); font-size: 0.65rem; color: #00ff88; background: #000; }

/* LOGIC BUILDER */
#logic-canvas { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 4px; position: relative; overflow: hidden; }
.node { position: absolute; width: 100px; background: #111; border: 2px solid var(--accent); border-radius: 6px; padding: 5px; text-align: center; cursor: grab; font-family: var(--font-mono); font-size: 0.7rem; color: #fff; box-shadow: 0 0 10px rgba(0,240,255,0.2); }
.node.op { border-color: var(--accent2); }
.node.out { border-color: var(--warning); }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>

<div id="boot-screen">
  <div id="boot-text"></div>
  <div class="progress-bar"><div class="progress-fill" id="boot-progress"></div></div>
</div>

<div id="desktop">
  <canvas id="bg-canvas"></canvas>
  <div id="windows-container" style="position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); z-index: 10;"></div>
  
  <div id="taskbar">
    <button class="tb-start" onclick="launchApp('ai')">⟨Æ⟩ AETHER</button>
    <div class="tb-apps" id="taskbar-apps"></div>
    <div class="tb-clock" id="clock">00:00:00</div>
  </div>
</div>

<script>
// ==========================================
// AETHER MICROKERNEL & WINDOW MANAGER
// ==========================================
let zIndex = 10;
const openApps = new Set();

function createWindow(id, title, icon, contentHTML, width, height) {
  if (document.getElementById(id)) {
    const w = document.getElementById(id);
    w.classList.add('open');
    w.style.zIndex = ++zIndex;
    return;
  }
  
  const win = document.createElement('div');
  win.id = id;
  win.className = 'window';
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  win.style.top = (window.innerHeight/2 - height/2) + 'px';
  win.style.left = (window.innerWidth/2 - width/2) + 'px';
  win.style.zIndex = ++zIndex;
  
  win.innerHTML = `
    <div class="window-header" onmousedown="startDrag(event, '${id}')">
      <div class="window-title">${icon} ${title}</div>
      <div class="window-controls">
        <button class="win-btn win-min" onclick="minimizeWindow('${id}')"></button>
        <button class="win-btn win-close" onclick="closeWindow('${id}')"></button>
      </div>
    </div>
    <div class="window-body">${contentHTML}</div>
  `;
  
  document.getElementById('windows-container').appendChild(win);
  setTimeout(() => win.classList.add('open'), 10);
  win.addEventListener('mousedown', () => { win.style.zIndex = ++zIndex; });
  
  const tb = document.getElementById('taskbar-apps');
  const btn = document.createElement('div');
  btn.className = 'tb-icon';
  btn.id = 'tb-' + id;
  btn.innerHTML = icon;
  btn.title = title;
  btn.onclick = () => {
    const w = document.getElementById(id);
    if (w.classList.contains('open')) w.classList.remove('open');
    else { w.classList.add('open'); w.style.zIndex = ++zIndex; }
  };
  tb.appendChild(btn);
  openApps.add(id);
  
  // Initialize app logic
  if (id === 'app-ai') initAI();
  if (id === 'app-crypto') initCrypto();
  if (id === 'app-3d') init3D();
  if (id === 'app-sql') initSQL();
  if (id === 'app-shader') initShader();
  if (id === 'app-logic') initLogic();
  if (id === 'app-bio') initBio();
}

function closeWindow(id) {
  const win = document.getElementById(id);
  if(win) { win.classList.remove('open'); setTimeout(() => win.remove(), 200); }
  const btn = document.getElementById('tb-'+id);
  if(btn) btn.remove();
  openApps.delete(id);
}
function minimizeWindow(id) { document.getElementById(id).classList.remove('open'); }

let isDragging = false, activeWin = null, offsetX, offsetY;
function startDrag(e, id) {
  if (e.target.classList.contains('win-btn')) return;
  isDragging = true; activeWin = document.getElementById(id);
  activeWin.style.zIndex = ++zIndex;
  offsetX = e.clientX - activeWin.offsetLeft;
  offsetY = e.clientY - activeWin.offsetTop;
}
document.addEventListener('mousemove', (e) => {
  if (!isDragging || !activeWin) return;
  activeWin.style.left = (e.clientX - offsetX) + 'px';
  activeWin.style.top = (e.clientY - offsetY) + 'px';
});
document.addEventListener('mouseup', () => { isDragging = false; activeWin = null; });

// Clock & Background Engine
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', {hour12: false}); }, 1000);

const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
function initBg() {
    bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
    particles = [];
    for(let i=0; i<100; i++) particles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, size: Math.random()*2 });
}
function drawBg() {
    bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
    bgCtx.fillStyle = 'rgba(0, 240, 255, 0.3)';
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>bgCanvas.width) p.vx*=-1; if(p.y<0||p.y>bgCanvas.height) p.vy*=-1;
        bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); bgCtx.fill();
    });
    requestAnimationFrame(drawBg);
}


// ==========================================
// 1. AETHER-AI (COGNITIVE CORE)
// ==========================================
function initAI() {
  const chatMsgs = document.getElementById('chat-messages');
  const chatInput = document.getElementById('chat-input');
  
  function addMsg(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerText = text;
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
  }

  if (!chatMsgs.hasChildNodes()) {
    addMsg("AETHER-AI v9.0 initialized. I am the omnidimensional core. How may I assist you? (Try: 'open 3d', 'open sql', 'open shader', 'system status', or 'calculate 5*5')", "ai");
  }

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const txt = chatInput.value.trim();
      if (!txt) return;
      addMsg(txt, "user");
      chatInput.value = '';
      
      setTimeout(() => {
        let lower = txt.toLowerCase();
        let reply = "";
        
        if (lower.includes('hello') || lower.includes('hi')) reply = "Greetings, Architect. The Aether is stable.";
        else if (lower.includes('open 3d')) { launchApp('3d'); reply = "Booting Multivariate 3D Terrain Engine..."; }
        else if (lower.includes('open sql')) { launchApp('sql'); reply = "Initializing NexusDB and Chart.js..."; }
        else if (lower.includes('open shader')) { launchApp('shader'); reply = "Compiling WebGL Shader environment..."; }
        else if (lower.includes('open crypto')) { launchApp('crypto'); reply = "Accessing Hardware Crypto-Vault..."; }
        else if (lower.includes('open logic')) { launchApp('logic'); reply = "Opening Visual Logic Node Builder..."; }
        else if (lower.includes('open bio')) { launchApp('bio'); reply = "Rendering 3D DNA Sequence..."; }
        else if (lower.includes('system status')) reply = `System optimal. Active processes: ${openApps.size}. Memory allocation: Nominal. Quantum state: Entangled.`;
        else if (lower.includes('calculate')) {
            try {
                const mathStr = lower.replace('calculate', '').trim();
                const res = Function('"use strict";return (' + mathStr + ')')();
                reply = `Computational Result: ${res}`;
            } catch(err) { reply = "Syntax error in mathematical expression."; }
        }
        else reply = "Command not recognized in local lexicon. Try opening an application or asking for system status.";
        
        addMsg(reply, "ai");
      }, 500);
    }
  });
}


// ==========================================
// 2. CRYPTO-VAULT (CYBERSECURITY)
// ==========================================
function initCrypto() {
    // Initialization handled by UI buttons
}
async function hashData() {
    const text = document.getElementById('crypto-input').value;
    if(!text) return;
    const out = document.getElementById('crypto-output');
    out.innerText = "Hashing...";
    const msgBuffer = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    out.innerText = "SHA-256 Hash:\n" + hashHex;
}
async function encryptData() {
    const text = document.getElementById('crypto-input').value;
    if(!text) return;
    const out = document.getElementById('crypto-output');
    out.innerText = "Encrypting via AES-GCM...";
    try {
        const key = await crypto.subtle.generateKey({name: "AES-GCM", length: 256}, true, ["encrypt", "decrypt"]);
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(text);
        const ciphertext = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, encoded);
        const b64 = btoa(String.fromCharCode(...new Uint8Array(ciphertext)));
        out.innerText = "AES-GCM Encrypted Payload:\n" + b64 + "\n\n(IV hidden for security)";
    } catch(e) { out.innerText = "Encryption failed on this browser."; }
}


// ==========================================
// 3. MULTIVARIATE 3D TERRAIN
// ==========================================
let scene3d, camera3d, renderer3d, terrainMesh;
function init3D() {
  const container = document.getElementById('3d-container');
  const w = container.clientWidth, h = container.clientHeight;
  
  scene3d = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
  camera3d.position.set(0, 10, 15);
  
  renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3d.setSize(w, h);
  container.appendChild(renderer3d.domElement);
  
  // Terrain Geometry
  const geo = new THREE.PlaneGeometry(20, 20, 64, 64);
  const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true, emissive: 0x004455 });
  terrainMesh = new THREE.Mesh(geo, mat);
  terrainMesh.rotation.x = -Math.PI / 2;
  scene3d.add(terrainMesh);
  
  scene3d.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,10,5);
  scene3d.add(light);
  
  const controls = new THREE.OrbitControls(camera3d, renderer3d.domElement);
  controls.enableZoom = true;
  controls.maxPolarAngle = Math.PI / 2 - 0.1;
  
  function animate3D() {
    if (!document.getElementById('app-3d')) return;
    requestAnimationFrame(animate3D);
    
    const amp = parseFloat(document.getElementById('3d-amp').value);
    const freq = parseFloat(document.getElementById('3d-freq').value);
    const time = Date.now() * 0.001;
    
    const pos = terrainMesh.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i); // Represents depth in plane geometry
        
        // Multivariate function (sine interference + noise)
        let z = Math.sin(x * freq + time) * Math.cos(y * freq * 0.8 + time) * amp;
        z += Math.sin(x * freq * 2.5 - time) * 0.2 * amp;
        
        pos.setZ(i, z);
    }
    pos.needsUpdate = true;
    terrainMesh.geometry.computeVertexNormals();
    
    controls.update();
    renderer3d.render(scene3d, camera3d);
  }
  animate3D();
}


// ==========================================
// 4. NEXUSDB (SQL + DATA SCIENCE)
// ==========================================
let DB = {};
let chartInstance = null;
function initSQL() {
  const input = document.getElementById('sql-input');
  const out = document.getElementById('sql-output');
  
  if (!out.hasChildNodes()) out.innerHTML = "NexusDB v2.0\nTry: CREATE TABLE planets (name, mass)\nINSERT INTO planets VALUES ('Earth', 1)\nSELECT * FROM planets\n\n";
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const query = input.value.trim();
      if (!query) return;
      out.innerHTML += `<span style="color:#fff">nexus> ${query}</span>\n`;
      input.value = '';
      
      try {
        let res = executeSQL(query);
        out.innerHTML += `<span style="color:var(--success)">${res.msg}</span>\n\n`;
        
        if(res.chartData) {
            renderChart(res.chartData);
        }
      } catch(err) {
        out.innerHTML += `<span style="color:var(--danger)">Error: ${err.message}</span>\n\n`;
      }
      out.scrollTop = out.scrollHeight;
    }
  });
}

function executeSQL(q) {
  q = q.trim().replace(/;$/,'');
  const upper = q.toUpperCase();
  
  if (upper.startsWith('CREATE TABLE')) {
    const match = q.match(/CREATE TABLE (\w+) \(([^)]+)\)/i);
    if (!match) throw new Error("Syntax error");
    const tableName = match[1];
    DB[tableName] = { columns: match[2].split(',').map(s=>s.trim()), data: [] };
    return { msg: `Table '${tableName}' created.` };
  }
  
  if (upper.startsWith('INSERT INTO')) {
    const match = q.match(/INSERT INTO (\w+) VALUES \((.+)\)/i);
    if (!match) throw new Error("Syntax error");
    const tableName = match[1];
    if (!DB[tableName]) throw new Error(`Table '${tableName}' missing.`);
    const vals = match[2].match(/[^,]+/g).map(v=>v.trim().replace(/'/g,''));
    const row = {};
    DB[tableName].columns.forEach((col, i) => row[col] = isNaN(vals[i]) ? vals[i] : Number(vals[i]));
    DB[tableName].data.push(row);
    return { msg: `1 row inserted into '${tableName}'.` };
  }
  
  if (upper.startsWith('SELECT')) {
    const match = q.match(/SELECT (.*) FROM (\w+)/i);
    if (!match) throw new Error("Syntax error");
    const tableName = match[2];
    if (!DB[tableName]) throw new Error(`Table '${tableName}' missing.`);
    const data = DB[tableName].data;
    if (data.length === 0) return { msg: "Empty set." };
    
    // Setup Chart.js Data
    const labels = data.map(r => r[DB[tableName].columns[0]]);
    const vals = data.map(r => r[DB[tableName].columns[1]] || 0);
    const chartData = { labels: labels, values: vals };
    
    return { msg: JSON.stringify(data, null, 2), chartData: chartData };
  }
  
  throw new Error("Unrecognized SQL command.");
}

function renderChart(data) {
    document.getElementById('chart-container').style.display = 'block';
    if(chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('sql-chart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: data.labels,
            datasets: [{ label: 'Data Analysis', data: data.values, backgroundColor: 'rgba(0, 240, 255, 0.5)', borderColor: '#00f0ff', borderWidth: 1 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#8ab4d5' } }, x: { ticks: { color: '#8ab4d5' } } } }
    });
}


// ==========================================
// 5. SHADER LAB (GLSL)
// ==========================================
let gl, shaderProgram, timeUniform;
function initShader() {
  const canvas = document.getElementById('shader-canvas');
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  
  gl = canvas.getContext('webgl');
  if (!gl) { alert("WebGL not supported"); return; }
  
  const vsSource = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
  
  // Default shader code
  const defaultFS = `precision mediump float;
uniform vec2 u_resolution;
uniform float u_time;
void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float color = sin(uv.x * 10.0 + u_time) * cos(uv.y * 10.0 + u_time);
    gl_FragColor = vec4(color * 0.5, color, color * 0.8, 1.0);
}`;
  document.getElementById('shader-code').value = defaultFS;
  
  compileShader(vsSource, defaultFS);
  
  function animateShader() {
    if (!document.getElementById('app-shader')) return;
    requestAnimationFrame(animateShader);
    
    if (gl && shaderProgram) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(timeUniform, Date.now() * 0.001);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }
  animateShader();
}

function compileShader(vs, fs) {
  function createShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        return null;
    }
    return shader;
  }
  
  const vShader = createShader(gl.VERTEX_SHADER, vs);
  const fShader = createShader(gl.FRAGMENT_SHADER, fs);
  if (!vShader || !fShader) return;
  
  shaderProgram = gl.createProgram();
  gl.attachShader(shaderProgram, vShader);
  gl.attachShader(shaderProgram, fShader);
  gl.linkProgram(shaderProgram);
  gl.useProgram(shaderProgram);
  
  const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  
  const aVertexPosition = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
  gl.enableVertexAttribArray(aVertexPosition);
  gl.vertexAttribPointer(aVertexPosition, 2, gl.FLOAT, false, 0, 0);
  
  const uResolution = gl.getUniformLocation(shaderProgram, 'u_resolution');
  gl.uniform2f(uResolution, gl.canvas.width, gl.canvas.height);
  timeUniform = gl.getUniformLocation(shaderProgram, 'u_time');
}

function updateShader() {
    const code = document.getElementById('shader-code').value;
    const vs = `attribute vec4 aVertexPosition; void main() { gl_Position = aVertexPosition; }`;
    compileShader(vs, code);
}

// 6. VISUAL LOGIC BUILDER
// ==========================================
let isDraggingNode = false, selectedNode = null, startX, startY, nodeOffsetX, nodeOffsetY;
function initLogic() {
    const canvas = document.getElementById('logic-canvas');
    canvas.innerHTML = '';
    
    // Create Nodes
    createNode('input1', 'INPUT', 20, 50, '10');
    createNode('input2', 'INPUT', 20, 150, '5');
    createNode('op1', '+ ADD', 150, 100, '');
    createNode('out1', 'OUTPUT', 280, 100, '');
    
    // Drag Logic
    canvas.addEventListener('mousedown', (e) => {
        if(e.target.classList.contains('node')) {
            isDraggingNode = true;
            selectedNode = e.target;
            nodeOffsetX = e.clientX - selectedNode.offsetLeft;
            nodeOffsetY = e.clientY - selectedNode.offsetTop;
        }
    });
    
    window.addEventListener('mousemove', (e) => {
        if(!isDraggingNode || !selectedNode) return;
        selectedNode.style.left = (e.clientX - nodeOffsetX) + 'px';
        selectedNode.style.top = (e.clientY - nodeOffsetY) + 'px';
    });
    
    window.addEventListener('mouseup', () => { isDraggingNode = false; selectedNode = null; });
}

function createNode(id, type, x, y, val) {
    const div = document.createElement('div');
    div.id = 'node-' + id;
    div.className = 'node ' + (type === 'OUTPUT' ? 'out' : (type === '+' ? 'op' : ''));
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.innerHTML = `<div style="font-size:0.6rem; color:#888">${type}</div><div style="font-weight:bold; font-size:0.9rem" id="${id}-val">${val || '0'}</div>`;
    document.getElementById('logic-canvas').appendChild(div);
    
    if(type === 'INPUT') {
        div.ondblclick = () => {
            const newVal = prompt("Enter value:", val);
            if(newVal !== null) { div.querySelector('div:last-child').innerText = newVal; executeLogic(); }
        }
    }
}

function executeLogic() {
    const v1 = parseFloat(document.getElementById('input1-val').innerText) || 0;
    const v2 = parseFloat(document.getElementById('input2-val').innerText) || 0;
    document.getElementById('out1-val').innerText = v1 + v2;
}

// 7. NEURAL BIO-SIM (DNA)
// ==========================================
let bioScene, bioCamera, bioRenderer, dnaGroup;
function initBio() {
    const container = document.getElementById('bio-container');
    const w = container.clientWidth, h = container.clientHeight;
    
    bioScene = new THREE.Scene();
    bioCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
    bioCamera.position.z = 10;
    
    bioRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    bioRenderer.setSize(w, h);
    container.appendChild(bioRenderer.domElement);
    
    dnaGroup = new THREE.Group();
    bioScene.add(dnaGroup);
    
    bioScene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.PointLight(0x00f0ff, 1);
    light.position.set(5,5,5);
    bioScene.add(light);
    
    const colors = [0x00ff88, 0xff0033, 0x00f0ff, 0xffb800]; // A, T, C, G
    
    for(let i=0; i<20; i++) {
        const y = (i - 10) * 0.5;
        const angle = i * 0.6;
        
        const x1 = Math.cos(angle) * 2;
        const z1 = Math.sin(angle) * 2;
        const x2 = Math.cos(angle + Math.PI) * 2;
        const z2 = Math.sin(angle + Math.PI) * 2;
        
        // Nucleotides
        const geo = new THREE.SphereGeometry(0.25, 16, 16);
        const m1 = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*4)], emissive: 0x222222 }));
        m1.position.set(x1, y, z1);
        
        const m2 = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*4)], emissive: 0x222222 }));
        m2.position.set(x2, y, z2);
        
        dnaGroup.add(m1); dnaGroup.add(m2);
        
        // Bond
        const pts = [new THREE.Vector3(x1,y,z1), new THREE.Vector3(x2,y,z2)];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
        dnaGroup.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 })));
    }
    
    function animateBio() {
        if (!document.getElementById('app-bio')) return;
        requestAnimationFrame(animateBio);
        dnaGroup.rotation.y += 0.01;
        bioRenderer.render(bioScene, bioCamera);
    }
    animateBio();
}
