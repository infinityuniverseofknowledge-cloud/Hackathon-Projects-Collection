jacobian:function(q){
  var j=STATE.jacobian;
  var J=new Matrix(2,q.length);
  // Standard 2D Jacobian for planar arm
  var l1=j.linkLengths[0],l2=j.linkLengths[1];
  var th1=q[0],th2=q[1];
  J.set(0,0,-l1*Math.sin(th1)-l2*Math.sin(th1+th2));
  J.set(0,1,-l2*Math.sin(th1+th2));
  J.set(1,0,l1*Math.cos(th1)+l2*Math.cos(th1+th2));

step:function(){var j=STATE.jacobian;

/* ══════ 19. MPC ══════ */
registerModule('mpc',{title:'Model Predictive Control',icon:'🔮',desc:'Receding horizon optimal control.',init:function(){this.reset()},
reset:function(){var m=STATE.mpc||{};STATE.mpc=m;
m.x=[0,0]; // pos, vel
m.target=[1,0];
m.horizon=20;
m.dt=0.1;
m.Q=[10,1];
m.R=[0.1];
m.Qf=[100,10];
m.predictions=[];
m.past=[];
m.t=0},
step:function(){
  var m=STATE.mpc;
  // Simple unconstrained MPC via 1-step optimization
  // For linear system, solve QP analytically
  // System: x_{k+1} = A·x_k + B·u_k, A = [1 dt; 0 1], B = [dt²/2; dt]
  // Cost: Σ (x-x_ref)ᵀQ(x-x_ref) + uᵀRu
  // Simplified: use receding horizon with 1-step approximation
  var dt=m.dt;
  var A=new Matrix(2,2,new Float64Array([1,dt,0,1]));
  var B=new Matrix(2,1,new Float64Array([dt*dt/2,dt]));
  // For 1-step: minimize (x+Ax+Bu)ᵀ Q (x+Ax+Bu) + u²R
  // d/du = 2·BᵀQ(Ax+Bu) + 2Ru = 0
  // u = -(BᵀQB + R)⁻¹·BᵀQ·A·x
  var Q=Matrix.diag(m.Q);
  var R=Matrix.diag(m.R);
  var BQ = B.transpose().mul(Q).mul(B);
  var scalar = BQ.d[0] + m.R[0];
  var BQA = B.transpose().mul(Q).mul(A);
  // u = -(BQA·x)/scalar - tracking term
  var tracking = B.transpose().mul(Q).mul(Matrix.fromArray(m.target));
  var u=-(BQA.get(0,0)*m.x[0]+BQA.get(0,1)*m.x[1])/scalar + tracking.d[0]/scalar;
  // Apply saturation
  u=clamp(u,-10,10);
  // Update state
  var xNew=A.mul(Matrix.fromArray(m.x)).add(B.mul(Matrix.fromArray([u])));
  m.x=[xNew.d[0],xNew.d[1]];
  // Prediction horizon preview
  m.predictions=[];
  var predX=m.x.slice();
  for(var k=0;k<m.horizon;k++){
    var xpred=A.mul(Matrix.fromArray(predX)).add(B.mul(Matrix.fromArray([u])));
    predX=[xpred.d[0],xpred.d[1]];
    m.predictions.push(predX[0]);
  }
  m.past.push(m.x[0]);
  if(m.past.length>500)m.past.shift();
  m.lastU=u;
  m.t+=dt},
tick:function(dt){STATE.time+=dt;var m=STATE.mpc;if(!m||!STATE.playing)return;
var sub=Math.floor(dt*30);for(var k=0;k<sub;k++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020610';ctx.fillRect(0,0,W,H);

stateInfo.forEach(function(s,i){

registerModule('trajopt',{title:'Trajectory Optimization',icon:'🛤',desc:'Direct collocation for smooth paths.',init:function(){this.reset()},
reset:function(){var t=STATE.trajopt||{};STATE.trajopt=t;
t.start=[0,0];t.goal=[5,3];
t.N=20;
t.waypoints=[];
t.optimized=[];
t.iterations=0;
t.obstacles=[];
for(var i=0;i<3;i++)t.obstacles.push({x:2+randn(),y:1.5+randn(),r:0.6});
// Initialize with straight line
for(var k=0;k<=t.N;k++){
  t.waypoints.push([
    t.start[0]+(t.goal[0]-t.start[0])*k/t.N,
    t.start[1]+(t.goal[1]-t.start[1])*k/t.N
  ]);
}
t.optimized=t.waypoints.map(function(p){return p.slice()})},
step:function(){
  var t=STATE.trajopt;
  // Gradient descent on waypoints
  var lr=0.1;
  // Smoothness: penalize curvature
  for(var k=1;k<t.N;k++){
    var prev=t.optimized[k-1];
    var cur=t.optimized[k];
    var next=t.optimized[k+1];
    // Smoothness gradient: (prev+next-2*cur)
    var sx=prev[0]+next[0]-2*cur[0];
    var sy=prev[1]+next[1]-2*cur[1];
    cur[0]+=lr*sx*0.5;
    cur[1]+=lr*sy*0.5;
    // Obstacle repulsion
    t.obstacles.forEach(function(o){
      var dx=cur[0]-o.x,dy=cur[1]-o.y;
      var d=Math.hypot(dx,dy);
      if(d<o.r*2){
        var force=(o.r*2-d)/d;
        cur[0]+=force*dx*0.05;
        cur[1]+=force*dy*0.05;
      }
    });
  }
  // Fix start and end
  t.optimized[0]=t.start.slice();
  t.optimized[t.N]=t.goal.slice();
  t.iterations++},
tick:function(dt){STATE.time+=dt;var t=STATE.trajopt;if(!t||!STATE.playing)return;
var sub=Math.floor(dt*50);for(var k=0;k<sub;k++)this.step()},

/* Grid */
drawGrid(ctx,W,H,W/2,H/2,sc,4);

t.obstacles.forEach(function(o){

  ctx.strokeStyle='#ff4060';ctx.lineWidth=2;

t.optimized.forEach(function(p,i){

  if(i===0||i===t.N){
    ctx.fillStyle=i===0?'#00ffa0':'#ff4060';

    ctx.fillStyle='rgba(0,216,255,.6)';

});
/* Legend */
ctx.fillStyle='#7098c0';ctx.font='10px monospace';
ctx.fillStyle='#ffb000';ctx.fillText('■ Initial straight line',30,60);
ctx.fillStyle='#00d8ff';ctx.fillText('■ Optimized smooth trajectory',30,75);

/* Stats */
ctx.fillStyle='rgba(8,16,24,.85)';
ctx.fillRect(W-280,H-140,260,120);
ctx.strokeStyle='#00d8ff';ctx.lineWidth=1.5;
ctx.strokeRect(W-280,H-140,260,120);

var len=0;
for(var k=1;k<t.optimized.length;k++){

}

registerModule('sensorfusion',{title:'IMU+GPS Fusion',icon:'📡',desc:'Complementary filter and EKF.',init:function(){this.reset()},
reset:function(){var s=STATE.sensorfusion||{};STATE.sensorfusion=s;
s.truePos=[0,0];s.trueVel=[0,0];
s.imuEst=[0,0];s.gps=[];
s.ekfState=[0,0,0,0]; // x,y,vx,vy
s.ekfP=Matrix.identity(4);
s.Q=Matrix.diag([0.01,0.01,0.1,0.1]);
s.R_gps=Matrix.diag([4,4]);
s.dt=0.1;
s.history=[];
s.gpsNoise=2.0;
s.imuBias=[0.05,0.05];
s.trueAccel=[0.3,0.2];
s.trueTrack=[];
s.t=0},
step:function(){var s=STATE.sensorfusion;
// True dynamics
s.trueAccel[0]+=randn()*0.1*s.dt;
s.trueAccel[1]+=randn()*0.1*s.dt;
s.trueVel[0]+=s.trueAccel[0]*s.dt;
s.trueVel[1]+=s.trueAccel[1]*s.dt;
s.truePos[0]+=s.trueVel[0]*s.dt;
s.truePos[1]+=s.trueVel[1]*s.dt;
s.trueTrack.push([s.truePos[0],s.truePos[1]]);
// IMU measurement (accelerometer with bias + noise)
var imuAccel=[
  s.trueAccel[0]+s.imuBias[0]+randn()*0.05,
  s.trueAccel[1]+s.imuBias[1]+randn()*0.05
];
// Integrate IMU to get estimate
s.imuEst[0]=s.ekfState[0];
s.imuEst[1]=s.ekfState[1];
// EKF predict
var A=new Matrix(4,4,new Float64Array([
  1,0,s.dt,0,
  0,1,0,s.dt,
  0,0,1,0,
  0,0,0,1
]));
var B=new Matrix(4,2,new Float64Array([
  0.5*s.dt*s.dt,0,
  0,0.5*s.dt*s.dt,
  s.dt,0,
  0,s.dt
]));
var xpred=A.mul(Matrix.fromArray(s.ekfState)).add(B.mul(Matrix.fromArray(imuAccel)));
var Ppred=A.mul(s.ekfP).mul(A.transpose()).add(s.Q);
// GPS measurement (if available)
if(Math.random()<0.3){
  var gpsX=s.truePos[0]+randn()*s.gpsNoise;
  var gpsY=s.truePos[1]+randn()*s.gpsNoise;
  s.gps.push([gpsX,gpsY]);
  var H=new Matrix(2,4,new Float64Array([
    1,0,0,0,
    0,1,0,0
  ]));
  var upd=kalmanUpdate(xpred,Ppred,Matrix.fromArray([gpsX,gpsY]),H,s.R_gps);
  s.ekfState=[upd.x.d[0],upd.x.d[1],upd.x.d[2],upd.x.d[3]];
  s.ekfP=upd.P;
}else{
  s.ekfState=[xpred.d[0],xpred.d[1],xpred.d[2],xpred.d[3]];
  s.ekfP=Ppred;
}
s.history.push([s.ekfState[0],s.ekfState[1]]);
if(s.history.length>500)s.history.shift();
if(s.trueTrack.length>500){s.trueTrack.shift();s.gps.shift()}
s.t+=s.dt},
tick:function(dt){STATE.time+=dt;var s=STATE.sensorfusion;if(!s||!STATE.playing)return;
var sub=Math.floor(dt*10);for(var k=0;k<sub;k++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020610';ctx.fillRect(0,0,W,H);
var s=STATE.sensorfusion;
if(!s)return;

/* Chart */
var px=60,py=80,pw=W-120,ph=H-200;
drawAxes(ctx,px,py,pw,ph,'Time','Position (x)');
var n=s.trueTrack.length;
if(n>1){

  maxX=Math.max(maxX,Math.max.apply(null,s.history.map(function(p){return Math.abs(p[0])})));
  // True
  ctx.strokeStyle='#00ffa0';ctx.lineWidth=2.5;
  ctx.beginPath();

    var x=px+i/n*pw;

    var x=px+i/n*pw;
    var y=py+ph/2-h[0]/maxX*ph/2;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // Legend
  ctx.fillStyle='#7098c0';ctx.font='10px monospace';
  ctx.fillStyle='#00ffa0';ctx.fillText('■ True trajectory',px+10,py+15);
  ctx.fillStyle='#ffb000';ctx.fillText('■ GPS measurements (sparse, noisy)',px+150,py+15);

}
/* State panel */
ctx.fillStyle='rgba(8,16,24,.85)';
ctx.fillRect(30,H-110,W-60,90);
ctx.strokeStyle='#00d8ff';ctx.lineWidth=1.5;
ctx.strokeRect(30,H-110,W-60,90);

ctx.fillText('FUSED STATE',45,H-85);

ctx.fillStyle='#d8e8f8';
ctx.fillText('x = '+fmt(s.ekfState[0],3)+' m',150,H-60);
ctx.fillText('y = '+fmt(s.ekfState[1],3)+' m',150,H-45);
ctx.fillText('True: ('+fmt(s.truePos[0],3)+','+fmt(s.truePos[1],3)+')',150,H-30);

setStats('<div>Est: ('+fmt(s.ekfState[0],2)+','+fmt(s.ekfState[1],2)+')</div><div>True: ('+fmt(s.truePos[0],2)+','+fmt(s.truePos[1],2)+')</div><div>Err: '+fmt(Math.hypot(s.ekfState[0]-s.truePos[0],s.ekfState[1]-s.truePos[1]),3)+'</div>');
badge('📡 Fusion · err='+fmt(Math.hypot(s.ekfState[0]-s.truePos[0],s.ekfState[1]-s.truePos[1]),3));
SV('sbX',fmt(s.ekfState[0],3));SV('sbY',fmt(s.ekfState[1],3));SV('sbRmse',fmt(Math.hypot(s.ekfState[0]-s.truePos[0],s.ekfState[1]-s.truePos[1]),3))},

/* ══════ 22. Q-LEARNING ══════ */
registerModule('qlearn',{title:'Q-Learning',icon:'🧠',desc:'Tabular RL on grid world.',init:function(){this.reset()},
reset:function(){var q=STATE.qlearn||{};STATE.qlearn=q;
q.rows=8;q.cols=8;
q.Q={};
for(var i=0;i<q.rows;i++)for(var j=0;j<q.cols;j++){
  q.Q[i+','+j]=[0,0,0,0];
}
q.agent=[0,0];
q.goal=[q.rows-1,q.cols-1];
q.obstacles=[];
for(var k=0;k<6;k++){
  var oi=Math.floor(Math.random()*q.rows);
  var oj=Math.floor(Math.random()*q.cols);
  if((oi!==0||oj!==0)&&(oi!==q.rows-1||oj!==q.cols-1)){
    q.obstacles.push([oi,oj]);
  }
}
q.episode=0;q.steps=0;q.epsilon=1.0;
q.alpha=0.1;q.gamma=0.95;
q.maxSteps=100;
q.rewards=[];q.totalReward=0;q.path=[]},
step:function(){
  var q=STATE.qlearn;
  var s=q.agent[0]+','+q.agent[1];
  // Epsilon-greedy
  var action;
  if(Math.random()<q.epsilon)action=Math.floor(Math.random()*4);
  else{
    var qv=q.Q[s];
    action=qv.indexOf(Math.max.apply(null,qv));
  }
  var moves=[[0,1],[0,-1],[1,0],[-1,0]];
  var ni=q.agent[0]+moves[action][0];
  var nj=q.agent[1]+moves[action][1];
  var reward=-0.1;
  var done=false;
  if(ni<0||ni>=q.rows||nj<0||nj>=q.cols){ni=q.agent[0];nj=q.agent[1];reward=-1}
  else if(q.obstacles.some(function(o){return o[0]===ni&&o[1]===nj})){reward=-5;ni=q.agent[0];nj=q.agent[1]}
  else if(ni===q.goal[0]&&nj===q.goal[1]){reward=10;done=true}
  var ns=ni+','+nj;
  // Q-learning update
  var maxNext=Math.max.apply(null,q.Q[ns]);
  q.Q[s][action]+=q.alpha*(reward+q.gamma*maxNext-q.Q[s][action]);
  q.agent=[ni,nj];
  q.steps++;
  q.totalReward+=reward;
  q.path.push([ni,nj]);
  if(q.path.length>200)q.path.shift();
  if(done||q.steps>=q.maxSteps){
    q.episode++;
    q.epsilon=Math.max(0.05,q.epsilon*0.995);
    q.agent=[0,0];
    q.steps=0;
    q.rewards.push(q.totalReward);
    q.totalReward=0;
    q.path=[];
  }},

registerModule('dqn',{title:'Deep Q-Network',icon:'🤖',desc:'Neural network Q-approximation.',init:function(){this.reset()},
reset:function(){var d=STATE.dqn||{};STATE.dqn=d;
// Simple 2-layer MLP
d.W1=[];d.b1=[];d.W2=[];d.b2=[];
var stateDim=4;var hidden=16;var actions=2;
for(var i=0;i<hidden;i++){
  var row=[];
  for(var j=0;j<stateDim;j++)row.push(randn()*0.3);
  d.W1.push(row);
  d.b1.push(0);
}
for(var i=0;i<actions;i++){
  var row=[];
  for(var j=0;j<hidden;j++)row.push(randn()*0.3);
  d.W2.push(row);
  d.b2.push(0);
}
// Cart-pole-like state
d.state=[0,0,0,0]; // x, v, theta, omega
d.targetActions=[];
d.episode=0;d.step=0;d.epsilon=1.0;
d.alpha=0.001;d.gamma=0.99;
d.rewards=[];
d.episodeRewards=[];
d.lossHistory=[];d.loss=0;
d.memory=[];d.batchSize=8;
d.t=0},
forward:function(state){
  var d=STATE.dqn;
  // Layer 1
  var h=[];
  for(var i=0;i<d.W1.length;i++){
    var sum=d.b1[i];
    for(var j=0;j<state.length;j++)sum+=d.W1[i][j]*state[j];
    h.push(Math.max(0,sum)); // ReLU
  }
  // Layer 2
  var q=[];
  for(var i=0;i<d.W2.length;i++){
    var sum=d.b2[i];
    for(var j=0;j<h.length;j++)sum+=d.W2[i][j]*h[j];
    q.push(sum);
  }
  return {h:h,q:q}},
step:function(){
  var d=STATE.dqn;
  // Cart-pole dynamics (simplified)
  var dt=0.02;
  var g=9.81,m=1,M=5,l=0.5;
  var x=d.state[0],v=d.state[1],theta=d.state[2],omega=d.state[3];
  // Choose action
  var action;
  if(Math.random()<d.epsilon)action=Math.floor(Math.random()*2);
  else{
    var q=d.forward(d.state).q;
    action=q[0]>q[1]?0:1;
  }
  var force=action===0?-10:10;
  // Cart-pole equations
  var costheta=Math.cos(theta),sintheta=Math.sin(theta);
  var temp=(force+m*l*omega*omega*sintheta)/(M+m);
  var thetaacc=(g*sintheta-costheta*temp)/(l*(4/3-m*costheta*costheta/(M+m)));
  var xacc=temp-m*l*thetaacc*costheta/(M+m);
  d.state[1]+=xacc*dt;
  d.state[3]+=thetaacc*dt;
  d.state[0]+=d.state[1]*dt;
  d.state[2]+=d.state[3]*dt;
  // Reward
  var reward=d.state[2]>=-0.2&&d.state[2]<=0.2?1:-1;
  // Done condition
  var done=Math.abs(d.state[2])>0.5||Math.abs(d.state[0])>2.4;
  // Experience replay
  d.memory.push({s:d.state.slice(),a:action,r:reward,s2:d.state.slice(),done:done});
  if(d.memory.length>1000)d.memory.shift();
  // Train on batch
  if(d.memory.length>d.batchSize){
    var totalLoss=0;
    for(var k=0;k<d.batchSize;k++){
      var exp=d.memory[Math.floor(Math.random()*d.memory.length)];
      // Compute target: r + γ·max Q(s2, ·)
      var qs2=d.forward(exp.s2).q;
      var target=exp.r+(exp.done?0:d.gamma*Math.max.apply(null,qs2));
      // Forward s
      var fwd=d.forward(exp.s);
      var qsa=fwd.q[exp.a];
      var loss=target-qsa;
      totalLoss+=loss*loss;
      // Backward (simplified)
      // dL/dW2[exp.a][j] = -2·loss·h[j]
      for(var j=0;j<fwd.h.length;j++){
        d.W2[exp.a][j]+=d.alpha*2*loss*fwd.h[j];
      }
      d.b2[exp.a]+=d.alpha*2*loss;
      // Backward through layer 1 (ReLU gradient)
      for(var i=0;i<d.W1.length;i++){
        if(fwd.h[i]<=0)continue;
        for(var j=0;j<exp.s.length;j++){
          var grad=loss*d.W2[exp.a][i]*exp.s[j];
          d.W1[i][j]+=d.alpha*grad;
        }
      }
    }
    d.loss=totalLoss/d.batchSize;
    d.lossHistory.push(d.loss);
    if(d.lossHistory.length>500)d.lossHistory.shift();
  }
  d.rewards.push(reward);
  if(d.rewards.length>500)d.rewards.shift();
  d.step++;
  if(done||d.step>200){
    d.episode++;
    d.episodeRewards.push(d.rewards.reduce(function(a,b){return a+b},0));
    d.state=[randn()*0.1,0,randn()*0.05,0];
    d.step=0;d.rewards=[];
    d.epsilon=Math.max(0.05,d.epsilon*0.99);
  }
  d.t+=dt},

var sub=Math.floor(dt*50);for(var k=0;k<sub;k++)this.step()},

registerModule('ransac',{title:'RANSAC',icon:'🎯',desc:'Robust line/plane fitting.',init:function(){this.reset()},
reset:function(){var r=STATE.ransac||{};STATE.ransac=r;
// Generate points with outlier fraction
r.inlierRatio=0.7;
r.points=[];
var slope=0.5,intercept=2;
for(var i=0;i<100;i++){
  var x=Math.random()*10;
  if(Math.random()<r.inlierRatio){
    var y=slope*x+intercept+randn()*0.2;
    r.points.push({x:x,y:y,outlier:false});
  }else{
    var y2=Math.random()*10;
    r.points.push({x:x,y:y2,outlier:true});
  }
}
r.inliers=[];r.outliers=[];r.model=null;
r.iterations=0;r.maxIter=100;r.threshold=0.5;
r.inlierCount=0;r.trail=[]},
step:function(){
  var r=STATE.ransac;
  if(r.iterations>=r.maxIter)return;
  // Sample 2 random points
  var i1=Math.floor(Math.random()*r.points.length);
  var i2=Math.floor(Math.random()*r.points.length);
  while(i2===i1)i2=Math.floor(Math.random()*r.points.length);
  var p1=r.points[i1],p2=r.points[i2];
  if(p1.x===p2.x)return;
  // Fit line
  var m=(p2.y-p1.y)/(p2.x-p1.x);
  var b=p1.y-m*p1.x;
  // Count inliers
  var inliers=[];
  r.points.forEach(function(p,idx){
    var dist=Math.abs(m*p.x+b-p.y)/Math.sqrt(m*m+1);
    if(dist<r.threshold)inliers.push(idx);
  });
  if(inliers.length>r.inlierCount){
    r.inlierCount=inliers.length;
    r.inliers=inliers;
    r.model={m:m,b:b};
    r.outliers=r.points.map(function(p,i){return i}).filter(function(i){return inliers.indexOf(i)<0});
  }
  r.trail.push(inliers.length);
  r.iterations++},

var sub=Math.floor(dt*50);for(var k=0;k<sub;k++)this.step()},

/* ══════ 25. ICP ══════ */
registerModule('icp',{title:'ICP Point Cloud',icon:'☁',desc:'Iterative Closest Point alignment.',init:function(){this.reset()},
reset:function(){var i=STATE.icp||{};STATE.icp=i;
// Generate source point cloud
i.source=[];
for(var k=0;k<80;k++){
  var x=randn()*1+2,y=randn()*1+2;
  i.source.push({x:x,y:y});
}
// Target = source + rotation + translation + noise
i.trueRot=0.5;i.trueTrans=[1.5,0.8];
var c=Math.cos(i.trueRot),s=Math.sin(i.trueRot);
i.target=i.source.map(function(p){
  return {
    x:c*p.x-s*p.y+i.trueTrans[0]+randn()*0.05,
    y:s*p.x+c*p.y+i.trueTrans[1]+randn()*0.05
  };
});
// Transform estimate (starts at identity)
i.rot=0;i.trans=[0,0];
i.iterations=0;i.error=Infinity;
i.history=[];
i.correspondences=[];
// Copy of source that gets transformed
i.current=i.source.map(function(p){return {x:p.x,y:p.y}});
// Initial correspondence
i.updateCorrespondences()},
updateCorrespondences:function(){var i=STATE.icp;
i.correspondences=[];
i.current.forEach(function(p){
  var nearest=null;var minD=Infinity;
  i.target.forEach(function(q){
    var d=Math.hypot(q.x-p.x,q.y-p.y);
    if(d<minD){minD=d;nearest=q}
  });
  i.correspondences.push({src:p,tgt:nearest});
})},
step:function(){
  var i=STATE.icp;
  this.updateCorrespondences();
  // Compute centroids
  var n=i.correspondences.length;
  var srcCx=0,srcCy=0,tgtCx=0,tgtCy=0;
  i.correspondences.forEach(function(c){
    srcCx+=c.src.x;srcCy+=c.src.y;
    tgtCx+=c.tgt.x;tgtCy+=c.tgt.y;
  });
  srcCx/=n;srcCy/=n;tgtCx/=n;tgtCy/=n;
  // Compute optimal rotation via SVD (2D case)
  var H00=0,H01=0,H10=0,H11=0;
  i.correspondences.forEach(function(c){
    var sx=c.src.x-srcCx,sy=c.src.y-srcCy;
    var tx=c.tgt.x-tgtCx,ty=c.tgt.y-tgtCy;
    H00+=sx*tx;H01+=sx*ty;
    H10+=sy*tx;H11+=sy*ty;
  });
  // For 2D: optimal rotation angle
  var theta=Math.atan2(H10-H01,H00+H11);
  var c1=Math.cos(theta),s1=Math.sin(theta);
  // Update transform
  var dx=tgtCx-(c1*srcCx-s1*srcCy);
  var dy=tgtCy-(s1*srcCx+c1*srcCy);
  // Apply to current points
  i.current=i.current.map(function(p){
    return {
      x:c1*p.x-s1*p.y+dx,
      y:s1*p.x+c1*p.y+dy
    };
  });
  i.rot+=theta;
  i.trans[0]+=dx;
  i.trans[1]+=dy;
  // Compute error
  var totalErr=0;
  i.updateCorrespondences();
  i.correspondences.forEach(function(c){
    totalErr+=Math.hypot(c.src.x-c.tgt.x,c.src.y-c.tgt.y);
  });
  i.error=totalErr/n;
  i.history.push(i.error);
  i.iterations++},
tick:function(dt){STATE.time+=dt;var i=STATE.icp;if(!i||!STATE.playing)return;
var sub=Math.floor(dt*20);for(var k=0;k<sub;k++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020610';ctx.fillRect(0,0,W,H);
var i=STATE.icp;
if(!i)return;
ctx.fillStyle='#00d8ff';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('ICP — Iteration '+i.iterations+' · Error '+fmt(i.error,4),30,30);
var cx=W*0.3,cy=H*0.6;
var sc=Math.min(W,H)*0.1;
drawGrid(ctx,W,H,cx,cy,sc,5);
/* Correspondences */
ctx.strokeStyle='rgba(0,216,255,.2)';ctx.lineWidth=1;
i.correspondences.forEach(function(c){
  ctx.beginPath();
  ctx.moveTo(cx+c.src.x*sc,cy-c.src.y*sc);
  ctx.lineTo(cx+c.tgt.x*sc,cy-c.tgt.y*sc);
  ctx.stroke();
});
/* Target (ground truth, red) */
i.target.forEach(function(p){
  ctx.fillStyle='#ff4060';
  ctx.beginPath();ctx.arc(cx+p.x*sc,cy-p.y*sc,3,0,Math.PI*2);ctx.fill();
});
/* Source (initial, faded) */
i.source.forEach(function(p){
  ctx.fillStyle='rgba(255,176,0,.4)';
  ctx.beginPath();ctx.arc(cx+p.x*sc,cy-p.y*sc,3,0,Math.PI*2);ctx.fill();
});
/* Current (aligning, cyan) */
i.current.forEach(function(p){
  ctx.fillStyle='#00ffa0';
  ctx.beginPath();ctx.arc(cx+p.x*sc,cy-p.y*sc,3.5,0,Math.PI*2);ctx.fill();
});
/* Info */
ctx.fillStyle='rgba(8,16,24,.85)';
ctx.fillRect(W*0.62,60,W*0.36,H-120);
ctx.strokeStyle='#00d8ff';ctx.lineWidth=1.5;ctx.strokeRect(W*0.62,60,W*0.36,H-120);
ctx.fillStyle='#00d8ff';ctx.font='bold 12px monospace';
ctx.fillText('ALIGNMENT PROGRESS',W*0.64,80);
ctx.fillStyle='#7098c0';ctx.font='11px monospace';
ctx.fillText('Iterations: '+i.iterations,W*0.64+10,105);
ctx.fillText('Error: '+fmt(i.error,5),W*0.64+10,125);
ctx.fillText('Rotation: '+fmt(i.rot,4)+' rad',W*0.64+10,145);
ctx.fillText('Translation: ('+fmt(i.trans[0],3)+', '+fmt(i.trans[1],3)+')',W*0.64+10,165);
ctx.fillStyle='#7098c0';
ctx.fillText('Ground truth:',W*0.64,195);
ctx.fillStyle='#ff4060';
ctx.fillText('rot = '+fmt(i.trueRot,4)+' rad',W*0.64+10,215);
ctx.fillText('trans = ('+fmt(i.trueTrans[0],3)+','+fmt(i.trueTrans[1],3)+')',W*0.64+10,235);
/* Error chart */
ctx.fillStyle='#00d8ff';ctx.font='bold 11px monospace';
ctx.fillText('Convergence',W*0.64,270);
if(i.history.length>1){
  drawSparkline(ctx,W*0.64+10,285,W*0.32,H-380,i.history,'#00ffa0',true);
}
/* Legend */
ctx.fillStyle='#7098c0';ctx.font='10px monospace';
ctx.fillStyle='#ff4060';ctx.fillText('■ Target cloud',W*0.64,H-70);
ctx.fillStyle='#00ffa0';ctx.fillText('■ Aligning source',W*0.64,H-55);
ctx.fillStyle='#ffb000';ctx.fillText('■ Original source',W*0.64,H-40);
setStats('<div>Iter: '+i.iterations+'</div><div>Error: '+fmt(i.error,4)+'</div><div>Rot: '+fmt(i.rot,3)+'</div>');
badge('☁ ICP · err='+fmt(i.error,4));SV('sbRmse',fmt(i.error,4))},
