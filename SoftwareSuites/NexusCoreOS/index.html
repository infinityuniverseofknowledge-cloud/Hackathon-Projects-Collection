<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEXUS-CORE OS</title>
<style>
:root {
  --bg: #030508; --desktop: #060b14; --window-bg: rgba(8, 14, 24, 0.95);
  --border: #1a3050; --text: #7a9cb5; --text-light: #d0e5f5; --accent: #00f0ff; 
  --danger: #ff0033; --warning: #ffb800; --success: #00ff88; --ai: #a855f7;
  --font-mono: "Fira Code", monospace; --font-ui: system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

/* DESKTOP */
#desktop { width: 100%; height: 100%; position: relative; background-image: linear-gradient(rgba(0,240,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.02) 1px, transparent 1px); background-size: 30px 30px; }

/* TASKBAR */
#taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(3, 5, 8, 0.98); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 10px; z-index: 1000; backdrop-filter: blur(10px); }
.tb-start { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 5px 15px; border-radius: 4px; font-family: var(--font-mono); font-weight: bold; cursor: pointer; }
.tb-apps { display: flex; gap: 8px; flex: 1; overflow-x: auto; }
.tb-apps::-webkit-scrollbar { display: none; }
.tb-icon { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
.tb-icon:hover { background: rgba(0, 240, 255, 0.1); }
.tb-icon.active { border-bottom: 2px solid var(--accent); background: rgba(0, 240, 255, 0.15); }
.tb-clock { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }

/* WINDOWS */
.window { position: absolute; background: var(--window-bg); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; min-width: 300px; min-height: 200px; overflow: hidden; backdrop-filter: blur(15px); transform: scale(0.95); opacity: 0; transition: 0.15s; pointer-events: auto; }
.window.open { transform: scale(1); opacity: 1; }
.window-header { height: 32px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; cursor: grab; }
.window-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-light); display: flex; align-items: center; gap: 5px; }
.window-controls { display: flex; gap: 6px; }
.win-btn { width: 10px; height: 10px; border-radius: 50%; border: none; cursor: pointer; }
.win-close { background: var(--danger); } .win-min { background: var(--warning); } .win-max { background: var(--success); }
.window-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

/* UI COMPONENTS */
.input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.input-group label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); }
input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: #111; border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
input[type="text"], input[type="color"], textarea { background: #000; border: 1px solid var(--border); color: var(--accent); padding: 6px; font-family: var(--font-mono); font-size: 0.75rem; border-radius: 4px; outline: none; width: 100%; }
textarea { resize: none; }
.btn { background: rgba(0,240,255,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; transition: 0.2s; text-align: center; }
.btn:hover { background: var(--accent); color: #000; }
.btn-ai { border-color: var(--ai); color: var(--ai); background: rgba(168,85,247,0.1); }
.btn-ai:hover { background: var(--ai); color: #fff; }

/* SPECIFIC APP STYLES */
#sql-terminal { background: #000; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; font-family: var(--font-mono); font-size: 0.75rem; padding: 10px; }
#sql-output { flex: 1; overflow-y: auto; color: var(--success); white-space: pre-wrap; margin-bottom: 10px; }
#sql-input { background: transparent; border: none; color: var(--accent); outline: none; font-family: inherit; font-size: inherit; }

#chat-window { flex: 1; display: flex; flex-direction: column; background: #000; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
#chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.8rem; }
.msg { padding: 6px 10px; border-radius: 6px; max-width: 80%; line-height: 1.3; }
.msg.user { background: rgba(0, 240, 255, 0.1); color: var(--accent); align-self: flex-end; border: 1px solid var(--accent); }
.msg.ai { background: rgba(168, 85, 247, 0.1); color: #e0c0ff; align-self: flex-start; border: 1px solid var(--ai); }
#chat-input-area { display: flex; padding: 5px; border-top: 1px solid var(--border); background: #050508; }
#chat-input { flex: 1; background: transparent; border: none; color: #fff; font-family: var(--font-mono); font-size: 0.75rem; outline: none; padding: 5px; }

#canvas-editor { display: flex; flex-direction: column; height: 100%; }
#draw-canvas { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 4px; cursor: crosshair; touch-action: none; }
.tools { display: flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; }

#builder-canvas { flex: 1; background: #000; border: 1px solid var(--border); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; border-radius: 4px;}
#code-preview { height: 100px; background: #050508; border: 1px solid var(--border); color: var(--warning); font-family: var(--font-mono); font-size: 0.65rem; padding: 5px; overflow-y: auto; white-space: pre-wrap; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="desktop">
  <div id="windows-container" style="position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); z-index: 10;"></div>
  
  <div id="taskbar">
    <button class="tb-start" onclick="launchApp('ai')">⟨N⟩ START</button>
    <div class="tb-apps" id="taskbar-apps"></div>
    <div class="tb-clock" id="clock">00:00:00</div>
  </div>
</div>

<script>
// ==========================================
// OS KERNEL (WINDOW MANAGER)
// ==========================================
let zIndex = 10;
const openApps = new Set();

function createWindow(id, title, icon, contentHTML, width, height) {
  if (document.getElementById(id)) {
    const w = document.getElementById(id);
    w.classList.add('open');
    w.style.zIndex = ++zIndex;
    return;
  }
  
  const win = document.createElement('div');
  win.id = id;
  win.className = 'window';
  win.style.width = width + 'px';
  win.style.height = height + 'px';
  win.style.top = (window.innerHeight/2 - height/2) + 'px';
  win.style.left = (window.innerWidth/2 - width/2) + 'px';
  win.style.zIndex = ++zIndex;
  
  win.innerHTML = `
    <div class="window-header" onmousedown="startDrag(event, '${id}')">
      <div class="window-title">${icon} ${title}</div>
      <div class="window-controls">
        <button class="win-btn win-min" onclick="minimizeWindow('${id}')"></button>
        <button class="win-btn win-close" onclick="closeWindow('${id}')"></button>
      </div>
    </div>
    <div class="window-body">${contentHTML}</div>
  `;
  
  document.getElementById('windows-container').appendChild(win);
  setTimeout(() => win.classList.add('open'), 10);
  win.addEventListener('mousedown', () => { win.style.zIndex = ++zIndex; });
  
  // Add to taskbar
  const tb = document.getElementById('taskbar-apps');
  const btn = document.createElement('div');
  btn.className = 'tb-icon';
  btn.id = 'tb-' + id;
  btn.innerHTML = icon;
  btn.title = title;
  btn.onclick = () => {
    const w = document.getElementById(id);
    if (w.classList.contains('open')) w.classList.remove('open');
    else { w.classList.add('open'); w.style.zIndex = ++zIndex; }
  };
  tb.appendChild(btn);
  openApps.add(id);
  
  // Initialize specific app logic
  if (id === 'app-ai') initAI();
  if (id === 'app-3d') init3D();
  if (id === 'app-sql') initSQL();
  if (id === 'app-canvas') initCanvas();
  if (id === 'app-builder') initBuilder();
  if (id === 'app-quantum') initQuantumLab();
}

function closeWindow(id) {
  const win = document.getElementById(id);
  if(win) { win.classList.remove('open'); setTimeout(() => win.remove(), 200); }
  const btn = document.getElementById('tb-'+id);
  if(btn) btn.remove();
  openApps.delete(id);
}
function minimizeWindow(id) { document.getElementById(id).classList.remove('open'); }

let isDragging = false, activeWin = null, offsetX, offsetY;
function startDrag(e, id) {
  if (e.target.classList.contains('win-btn')) return;
  isDragging = true; activeWin = document.getElementById(id);
  activeWin.style.zIndex = ++zIndex;
  offsetX = e.clientX - activeWin.offsetLeft;
  offsetY = e.clientY - activeWin.offsetTop;
}
document.addEventListener('mousemove', (e) => {
  if (!isDragging || !activeWin) return;
  activeWin.style.left = (e.clientX - offsetX) + 'px';
  activeWin.style.top = (e.clientY - offsetY) + 'px';
});
document.addEventListener('mouseup', () => { isDragging = false; activeWin = null; });

// Clock
setInterval(() => {
  document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', {hour12: false});
}, 1000);


// ==========================================
// 1. NEXUS-AI CHATBOT
// ==========================================
function initAI() {
  const chatMsgs = document.getElementById('chat-messages');
  const chatInput = document.getElementById('chat-input');
  
  function addMsg(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerText = text;
    chatMsgs.appendChild(div);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
  }

  if (!chatMsgs.hasChildNodes()) {
    addMsg("NEXUS-AI v4.0 initialized. I am the core intelligence of this system. How can I assist you? (Try: 'open 3d', 'open sql', 'status', or 'help')", "ai");
  }

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const txt = chatInput.value.trim();
      if (!txt) return;
      addMsg(txt, "user");
      chatInput.value = '';
      
      // AI Logic
      setTimeout(() => {
        let lower = txt.toLowerCase();
        let reply = "";
        
        if (lower.includes('hello') || lower.includes('hi')) reply = "Hello, Architect. The system is at your command.";
        else if (lower.includes('open 3d')) { launchApp('3d'); reply = "Opening 3D Multivariate Modeler..."; }
        else if (lower.includes('open sql')) { launchApp('sql'); reply = "Booting Relational SQL Engine..."; }
        else if (lower.includes('open canvas')) { launchApp('canvas'); reply = "Launching Canvas Studio..."; }
        else if (lower.includes('open builder')) { launchApp('builder'); reply = "Opening Software Construction Kit..."; }
        else if (lower.includes('status')) reply = `System normal. Active threads: ${openApps.size}. Memory usage: Optimal.`;
        else if (lower.includes('who are you')) reply = "I am NEXUS-AI, a rule-based neural network designed to manage this colossal OS.";
        else if (lower.includes('help')) reply = "Available commands:\n- open [3d, sql, canvas, builder]\n- status\n- who are you\n- calculate [math]";
        else if (lower.includes('calculate')) {
            try {
                // Safely evaluate math
                const mathStr = lower.replace('calculate', '').trim();
                const res = Function('"use strict";return (' + mathStr + ')')();
                reply = `Result: ${res}`;
            } catch(err) { reply = "Syntax error in mathematical expression."; }
        }
        else reply = "I did not understand that command. Type 'help' for a list of capabilities.";
        
        addMsg(reply, "ai");
      }, 600);
    }
  });
}


// ==========================================
// 2. 3D MULTIVARIATE MODELER
// ==========================================
let scene3d, camera3d, renderer3d, mesh3d;
function init3D() {
  const container = document.getElementById('3d-container');
  const w = container.clientWidth, h = container.clientHeight;
  
  scene3d = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(45, w/h, 0.1, 1000);
  camera3d.position.z = 5;
  
  renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3d.setSize(w, h);
  container.appendChild(renderer3d.domElement);
  
  const geo = new THREE.SphereGeometry(1.5, 64, 64);
  const mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true });
  mesh3d = new THREE.Mesh(geo, mat);
  scene3d.add(mesh3d);
  
  scene3d.add(new THREE.AmbientLight(0xffffff, 0.5));
  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(5,5,5);
  scene3d.add(light);
  
  const controls = new THREE.OrbitControls(camera3d, renderer3d.domElement);
  controls.enableZoom = false;
  controls.autoRotate = true;
  
  function animate3D() {
    if (!document.getElementById('app-3d')) return;
    requestAnimationFrame(animate3D);
    
    // Multivariate Deformation Logic
    const amp = parseFloat(document.getElementById('3d-amp').value);
    const freq = parseFloat(document.getElementById('3d-freq').value);
    const noise = parseFloat(document.getElementById('3d-noise').value);
    const time = Date.now() * 0.002;
    
    const pos = mesh3d.geometry.attributes.position;
    const v = new THREE.Vector3();
    
    for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        const originalLength = 1.5;
        
        // Math to deform sphere
        let d = Math.sin(v.x * freq + time) * Math.cos(v.y * freq + time) * Math.sin(v.z * freq + time) * amp;
        d += (Math.random() - 0.5) * noise; // Add noise
        
        // Normalize and apply
        v.normalize().multiplyScalar(originalLength + d);
        pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
    mesh3d.geometry.computeVertexNormals();
    
    controls.update();
    renderer3d.render(scene3d, camera3d);
  }
  animate3D();
}


// ==========================================
// 3. RELATIONAL SQL ENGINE
// ==========================================
let DB = {};
function initSQL() {
  const input = document.getElementById('sql-input');
  const out = document.getElementById('sql-output');
  
  if (!out.hasChildNodes()) {
    out.innerHTML = "NexusDB v1.0\nType SQL commands (e.g., CREATE TABLE, INSERT, SELECT).\n\n";
  }
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const query = input.value.trim();
      if (!query) return;
      out.innerHTML += `<span style="color:#fff">nexus> ${query}</span>\n`;
      input.value = '';
      
      try {
        let res = executeSQL(query);
        out.innerHTML += `<span style="color:var(--success)">${res}</span>\n\n`;
      } catch(err) {
        out.innerHTML += `<span style="color:var(--danger)">Error: ${err.message}</span>\n\n`;
      }
      out.scrollTop = out.scrollHeight;
    }
  });
}

function executeSQL(q) {
  q = q.trim().replace(/;$/,'');
  const upper = q.toUpperCase();
  
  if (upper.startsWith('CREATE TABLE')) {
    const match = q.match(/CREATE TABLE (\w+) \(([^)]+)\)/i);
    if (!match) throw new Error("Syntax error in CREATE TABLE");
    const tableName = match[1];
    const cols = match[2].split(',').map(s=>s.trim());
    DB[tableName] = { columns: cols, data: [] };
    return `Table '${tableName}' created successfully.`;
  }
  
  if (upper.startsWith('INSERT INTO')) {
    const match = q.match(/INSERT INTO (\w+) VALUES \((.+)\)/i);
    if (!match) throw new Error("Syntax error in INSERT");
    const tableName = match[1];
    if (!DB[tableName]) throw new Error(`Table '${tableName}' does not exist.`);
    
    // Parse values (very basic CSV parsing)
    const vals = match[2].match(/[^,]+/g).map(v=>v.trim().replace(/'/g,''));
    if (vals.length !== DB[tableName].columns.length) throw new Error("Column count doesn't match value count.");
    
    const row = {};
    DB[tableName].columns.forEach((col, i) => row[col] = vals[i]);
    DB[tableName].data.push(row);
    return `1 row inserted into '${tableName}'.`;
  }
  
  if (upper.startsWith('SELECT')) {
    const match = q.match(/SELECT (.*) FROM (\w+)/i);
    if (!match) throw new Error("Syntax error in SELECT");
    const tableName = match[2];
    if (!DB[tableName]) throw new Error(`Table '${tableName}' does not exist.`);
    
    if (DB[tableName].data.length === 0) return "Empty set.";
    return JSON.stringify(DB[tableName].data, null, 2);
  }
  
  if (upper === 'SHOW TABLES') {
      return JSON.stringify(Object.keys(DB));
  }
  
  throw new Error("Unrecognized SQL command.");
}


// ==========================================
// 4. CANVAS STUDIO (2D EDITOR)
// ==========================================
let ctx2d, isDrawing = false;
function initCanvas() {
  const canvas = document.getElementById('draw-canvas');
  ctx2d = canvas.getContext('2d');
  
  // Make canvas responsive to its container
  setTimeout(() => {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    ctx2d.fillStyle = "#000";
    ctx2d.fillRect(0,0,canvas.width, canvas.height);
  }, 100);
  
  function getMousePos(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener("mousedown", (e) => { isDrawing = true; ctx2d.beginPath(); const p = getMousePos(e); ctx2d.moveTo(p.x, p.y); });
  canvas.addEventListener("mousemove", (e) => { if(isDrawing) { const p = getMousePos(e); ctx2d.lineTo(p.x, p.y); ctx2d.stroke(); } });
  canvas.addEventListener("mouseup", () => { isDrawing = false; });
  
  // Touch support
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); isDrawing = true; ctx2d.beginPath(); const p = getMousePos(e); ctx2d.moveTo(p.x, p.y); }, {passive: false});
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); if(isDrawing) { const p = getMousePos(e); ctx2d.lineTo(p.x, p.y); ctx2d.stroke(); } }, {passive: false});
  canvas.addEventListener("touchend", () => { isDrawing = false; });
}

function setBrushColor() {
    const color = document.getElementById('brush-color').value;
    const size = document.getElementById('brush-size').value;
    ctx2d.strokeStyle = color;
    ctx2d.lineWidth = size;
    ctx2d.lineCap = 'round';
}
function clearCanvas() {
    const canvas = document.getElementById('draw-canvas');
    ctx2d.fillStyle = "#000";
    ctx2d.fillRect(0,0,canvas.width,canvas.height);
}
function generateArt() {
    clearCanvas();
    for(let i=0; i<50; i++) {
        ctx2d.beginPath();
        ctx2d.strokeStyle = `hsl(${Math.random()*360}, 100%, 50%)`;
        ctx2d.lineWidth = Math.random() * 5;
        ctx2d.arc(Math.random()*500, Math.random()*500, Math.random()*100, 0, Math.PI*2);
        ctx2d.stroke();
    }
}


// ==========================================
// 5. SOFTWARE CONSTRUCTION KIT
// ==========================================
function initBuilder() {
    updateBuilderCode();
}
function addBuilderElement(type) {
    const canvas = document.getElementById('builder-canvas');
    let el;
    if(type === 'btn') {
        el = document.createElement('button');
        el.innerText = "New Button";
        el.className = "btn";
    } else if(type === 'input') {
        el = document.createElement('input');
        el.type = "text";
        el.placeholder = "Enter text...";
    } else if(type === 'text') {
        el = document.createElement('h3');
        el.innerText = "Heading Text";
        el.style.color = "#fff";
    }
    
    el.style.cursor = 'pointer';
    el.onclick = () => { canvas.removeChild(el); updateBuilderCode(); };
    canvas.appendChild(el);
    updateBuilderCode();
}
function updateBuilderCode() {
    const canvas = document.getElementById('builder-canvas');
    const codeEl = document.getElementById('code-preview');
    let html = "";
    Array.from(canvas.children).forEach(child => {
        html += child.outerHTML + "\n";
    });
    codeEl.innerText = html;
}


// ==========================================
// 6. QUANTUM PHYSICS LAB
// ==========================================
function initQuantumLab() {
  const canvas = document.getElementById('quantum-canvas');
  const ctx = canvas.getContext('2d');
  setTimeout(() => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }, 100);
  
  let particles = [];
  for(let i=0; i<50; i++) {
      particles.push({
          x: Math.random() * 300, y: Math.random() * 200,
          vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
          r: Math.random()*3+1
      });
  }
  
  function animateQuantum() {
      if(!document.getElementById('app-quantum')) return;
      requestAnimationFrame(animateQuantum);
      
      const gravity = parseFloat(document.getElementById('q-gravity').value);
      
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.fillRect(0,0,canvas.width, canvas.height);
      
      particles.forEach(p => {
          p.vy += gravity * 0.1;
          p.x += p.vx; p.y += p.vy;
          
          if(p.x < 0 || p.x > canvas.width) p.vx *= -0.9;
          if(p.y > canvas.height) { p.y = canvas.height; p.vy *= -0.9; }
          
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fillStyle = `hsl(${p.vx*100}, 100%, 50%)`;
          ctx.fill();
      });
  }
  animateQuantum();
}


// ==========================================
// APP LAUNCHER
// ==========================================
function launchApp(app) {
  if (app === 'ai') {
    createWindow('app-ai', 'NEXUS-AI', '🧠', `
      <div id="chat-window">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Type a command..." autocomplete="off">
        </div>
      </div>
    `, 350, 450);
  }
  
  if (app === '3d') {
    createWindow('app-3d', '3D Multivariate Modeler', '🧊', `
      <div style="display:flex; flex-direction:column; height:100%; gap:10px;">
        <div id="3d-container" style="flex:1; background:#000; border-radius:4px; border:1px solid var(--border); overflow:hidden;"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
          <div class="input-group"><label>Amplitude</label><input type="range" id="3d-amp" min="0" max="2" step="0.1" value="0.5"></div>
          <div class="input-group"><label>Frequency</label><input type="range" id="3d-freq" min="1" max="10" step="1" value="3"></div>
          <div class="input-group"><label>Noise</label><input type="range" id="3d-noise" min="0" max="0.5" step="0.05" value="0.1"></div>
        </div>
      </div>
    `, 500, 450);
  }
  
  if (app === 'sql') {
    createWindow('app-sql', 'NexusDB Engine', '🗄️', `
      <div id="sql-terminal">
        <div id="sql-output"></div>
        <div style="display:flex;"><span style="color:var(--accent); margin-right:5px;">nexus></span><input type="text" id="sql-input" autocomplete="off" spellcheck="false"></div>
      </div>
    `, 450, 400);
  }
  
  if (app === 'canvas') {
    createWindow('app-canvas', 'Canvas Studio', '🎨', `
      <div id="canvas-editor">
        <div class="tools">
          <input type="color" id="brush-color" value="#00f0ff" onchange="setBrushColor()">
          <input type="range" id="brush-size" min="1" max="20" value="2" oninput="setBrushColor()">
          <button class="btn" onclick="clearCanvas()" style="padding:2px 10px;">Clear</button>
          <button class="btn btn-ai" onclick="generateArt()" style="padding:2px 10px;">Auto-Draw</button>
        </div>
        <canvas id="draw-canvas"></canvas>
      </div>
    `, 500, 400);
  }
  
  if (app === 'builder') {
    createWindow('app-builder', 'Software Construction', '🛠️', `
      <div style="display:flex; flex-direction:column; height:100%; gap:10px;">
        <div style="display:flex; gap:5px;">
          <button class="btn" onclick="addBuilderElement('btn')">+ Button</button>
          <button class="btn" onclick="addBuilderElement('input')">+ Input</button>
          <button class="btn" onclick="addBuilderElement('text')">+ Text</button>
        </div>
        <div id="builder-canvas"></div>
        <div id="code-preview"></div>
      </div>
    `, 450, 450);
  }
  
  if (app === 'quantum') {
    createWindow('app-quantum', 'Quantum Lab', '⚛️', `
      <div style="display:flex; flex-direction:column; height:100%; gap:10px;">
        <canvas id="quantum-canvas" style="flex:1; background:#000; border-radius:4px; border:1px solid var(--border);"></canvas>
        <div class="input-group">
          <label>Gravity / Particle Attraction <span id="q-grav-val">0.5</span></label>
          <input type="range" id="q-gravity" min="0" max="2" step="0.1" value="0.5">
        </div>
      </div>
    `, 400, 400);
  }
}

// Boot Sequence
setTimeout(() => {
    launchApp('ai');
    launchApp('3d');
}, 500);

</script>
</body>
</html>
