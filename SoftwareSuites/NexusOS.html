/* ───────── Spreadsheet ───────── */
APPS.sheet={
  name:'Spreadsheet',icon:'▦',defaultSize:[900,560],
  init:function(body,win){
    var ROWS=40, COLS=12;
    var data={};
    var selected={r:0,c:0};
    var wrap=el('div',{class:'sheet'});
    var toolbar=el('div',{class:'toolbar'});
    var cellRef=el('div',{class:'cellref',text:'A1'});
    var btnClear=el('button',{text:'Clear cell'});
    var btnHelp=el('button',{text:'Functions'});
    toolbar.appendChild(btnClear);toolbar.appendChild(btnHelp);toolbar.appendChild(cellRef);
    var fx=el('div',{class:'fx'});
    var fxlbl=el('div',{class:'lbl',text:'fx'});
    var fxin=el('input',{placeholder:'Type value or =formula'});
    fx.appendChild(fxlbl);fx.appendChild(fxin);
    var gridWrap=el('div',{class:'grid'});
    wrap.appendChild(toolbar);wrap.appendChild(fx);wrap.appendChild(gridWrap);
    body.appendChild(wrap);
    function colName(i){
      var s='';
      while(i>=0){s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26)-1}
      return s;
    }
    function cellKey(r,c){return colName(c)+(r+1)}
    function evalFormula(formula){
      if(formula==null||formula==='')return '';
      var s=String(formula);
      if(s.charAt(0)!=='=')return s;
      var expr=s.substring(1);
      try{
        /* replace cell refs with values */
        expr=expr.replace(/\b([A-Z]+)(\d+)\b/g,function(m,col,row){
          var c=0;
          for(var i=0;i<col.length;i++)c=c*26+col.charCodeAt(i)-64;
          c=c-1;
          var r=parseInt(row)-1;
          var v=data[cellKey(r,c)];
          if(v==null||v==='')return '0';
          if(typeof v==='string'&&v.charAt(0)==='='){var er=evalFormula(v);return isNaN(Number(er))?'0':er}
          return isNaN(Number(v))?'0':v;
        });
        /* basic functions */
        expr=expr.replace(/\bSUM\(([^)]+)\)/g,function(m,args){
          var parts=args.split(',');
          var sum=0;
          parts.forEach(function(p){
            p=p.trim();
            if(p.indexOf(':')>=0){
              var rng=p.split(':');
              var a=parseRef(rng[0]),b=parseRef(rng[1]);
              for(var r=a.r;r<=b.r;r++)for(var c=a.c;c<=b.c;c++){
                var v=data[cellKey(r,c)];var n=Number(v);if(!isNaN(n))sum+=n;
              }
            }else{
              var n=Number(p);if(!isNaN(n))sum+=n;
            }
          });
          return String(sum);
        });
        expr=expr.replace(/\bAVG\(([^)]+)\)/g,function(m,args){
          var parts=args.split(',');var sum=0,count=0;
          parts.forEach(function(p){
            p=p.trim();
            if(p.indexOf(':')>=0){
              var rng=p.split(':');
              var a=parseRef(rng[0]),b=parseRef(rng[1]);
              for(var r=a.r;r<=b.r;r++)for(var c=a.c;c<=b.c;c++){
                var v=data[cellKey(r,c)];var n=Number(v);if(!isNaN(n)&&v!==''){sum+=n;count++}
              }
            }else{var n=Number(p);if(!isNaN(n)){sum+=n;count++}}
          });
          return count?String(sum/count):'0';
        });
        expr=expr.replace(/\bMIN\(([^)]+)\)/g,function(m,args){
          var nums=[];
          args.split(',').forEach(function(p){var n=Number(p.trim());if(!isNaN(n))nums.push(n)});
          return nums.length?String(Math.min.apply(null,nums)):'0';
        });
        expr=expr.replace(/\bMAX\(([^)]+)\)/g,function(m,args){
          var nums=[];
          args.split(',').forEach(function(p){var n=Number(p.trim());if(!isNaN(n))nums.push(n)});
          return nums.length?String(Math.max.apply(null,nums)):'0';
        });
        expr=expr.replace(/\bCOUNT\(([^)]+)\)/g,function(m,args){
          var c=0;
          args.split(',').forEach(function(p){
            p=p.trim();
            if(p.indexOf(':')>=0){
              var rng=p.split(':');var a=parseRef(rng[0]),b=parseRef(rng[1]);
              for(var r=a.r;r<=b.r;r++)for(var cc=a.c;cc<=b.c;cc++){
                var v=data[cellKey(r,cc)];if(v!=null&&v!=='')c++;
              }
            }else if(p!=='')c++;
          });
          return String(c);
        });
        expr=expr.replace(/\bSQRT\(([^)]+)\)/g,function(m,a){return String(Math.sqrt(Number(a)))});
        expr=expr.replace(/\bABS\(([^)]+)\)/g,function(m,a){return String(Math.abs(Number(a)))});
        expr=expr.replace(/\bPI\(\)/g,'3.141592653589793');
        var result=Function('"use strict";return ('+expr+')')();
        return String(result);
      }catch(e){return '#ERR'}
    }
    function parseRef(ref){
      var m=ref.match(/^([A-Z]+)(\d+)$/);
      if(!m)return {r:0,c:0};
      var c=0;
      for(var i=0;i<m[1].length;i++)c=c*26+m[1].charCodeAt(i)-64;
      return {r:parseInt(m[2])-1,c:c-1};
    }
    function renderGrid(){
      var table=el('table');
      var thead=el('thead');
      var htr=el('tr');
      htr.appendChild(el('th',{class:'rowh'}));
      for(var c=0;c<COLS;c++)htr.appendChild(el('th',{text:colName(c)}));
      thead.appendChild(htr);table.appendChild(thead);
      var tbody=el('tbody');
      for(var r=0;r<ROWS;r++){
        var tr=el('tr');
        tr.appendChild(el('td',{class:'rh',text:String(r+1)}));
        for(var c2=0;c2<COLS;c2++){
          var key=cellKey(r,c2);
          var raw=data[key]||'';
          var val=evalFormula(raw);
          var td=el('td');
          td.textContent=val;
          if(!isNaN(Number(val))&&val!=='')td.classList.add('num');
          td.setAttribute('data-r',r);
          td.setAttribute('data-c',c2);
          if(r===selected.r&&c2===selected.c)td.classList.add('sel');
          td.addEventListener('click',function(r,c){
            return function(){selectCell(r,c)}
          }(r,c2));
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      gridWrap.innerHTML='';
      gridWrap.appendChild(table);
    }
    function selectCell(r,c){
      selected={r:r,c:c};
      var key=cellKey(r,c);
      cellRef.textContent=key;
      fxin.value=data[key]||'';
      $$('.sheet td.sel').forEach(function(t){t.classList.remove('sel')});
      var td=gridWrap.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
      if(td)td.classList.add('sel');
    }
    fxin.addEventListener('input',function(){
      var key=cellKey(selected.r,selected.c);
      data[key]=fxin.value;
      var td=gridWrap.querySelector('td[data-r="'+selected.r+'"][data-c="'+selected.c+'"]');
      if(td){
        var val=evalFormula(fxin.value);
        td.textContent=val;
        td.classList.toggle('num',!isNaN(Number(val))&&val!=='');
      }
      /* re-render all to update refs */
      setTimeout(function(){renderGrid();selectCell(selected.r,selected.c)},0);
    });
    fxin.addEventListener('keydown',function(e){
      if(e.key==='Enter'){selectCell(selected.r+1,selected.c);gridWrap.querySelector('table').focus()}
    });
    btnClear.addEventListener('click',function(){fxin.value='';fxin.dispatchEvent(new Event('input'))});
    btnHelp.addEventListener('click',function(){
      alert('Functions:\n\n=SUM(A1:A10)\n=AVG(A1:A10)\n=MIN(A1,B2)\n=MAX(A1,B2)\n=COUNT(A1:A10)\n=SQRT(A1)\n=ABS(A1)\n=PI()\n\nArithmetic: + - * / %\nCell refs: A1, B5, etc.');
    });
    renderGrid();
    selectCell(0,0);
    /* keyboard nav */
    gridWrap.addEventListener('keydown',function(e){
      if(e.target.tagName!=='TD')return;
      if(e.key==='ArrowRight'){e.preventDefault();selectCell(selected.r,Math.min(COLS-1,selected.c+1))}
      if(e.key==='ArrowLeft'){e.preventDefault();selectCell(selected.r,Math.max(0,selected.c-1))}
      if(e.key==='ArrowDown'){e.preventDefault();selectCell(Math.min(ROWS-1,selected.r+1),selected.c)}
      if(e.key==='ArrowUp'){e.preventDefault();selectCell(Math.max(0,selected.r-1),selected.c)}
    });
    gridWrap.setAttribute('tabindex','0');
    return null;
  }
};

/* ───────── Calculator ───────── */
APPS.calc={
  name:'Calculator',icon:'🔢',defaultSize:[340,540],
  init:function(body,win){
    var display='', history='';
    var wrap=el('div',{class:'calc'});
    var disp=el('div',{class:'display'});
    var histEl=el('div',{class:'hist',text:''});
    var curEl=el('div',{class:'cur',text:'0'});
    disp.appendChild(histEl);disp.appendChild(curEl);
    var pad=el('div',{class:'pad'});
    var layout=[
      {k:'C',cls:'fn'},{k:'(',cls:'fn'},{k:')',cls:'fn'},{k:'÷',cls:'op'},
      {k:'√',cls:'sci'},{k:'x²',cls:'sci'},{k:'π',cls:'sci'},{k:'×',cls:'op'},
      {k:'7'},{k:'8'},{k:'9'},{k:'−',cls:'op'},
      {k:'4'},{k:'5'},{k:'6'},{k:'+',cls:'op'},
      {k:'1'},{k:'2'},{k:'3'},{k:'=',cls:'eq'},
      {k:'0'},{k:'.'},{k:'⌫',cls:'fn'},{k:'%',cls:'op'}
    ];
    layout.forEach(function(b){
      var btn=el('button',{class:'k '+(b.cls||''),text:b.k});
      btn.addEventListener('click',function(){onKey(b.k)});
      pad.appendChild(btn);
    });
    wrap.appendChild(disp);wrap.appendChild(pad);
    body.appendChild(wrap);
    function updateDisplay(){
      curEl.textContent=display||'0';
      histEl.textContent=history;
    }
    function onKey(k){
      if(k==='C'){display='';history=''}
      else if(k==='⌫'){display=display.slice(0,-1)}
      else if(k==='='){
        try{
          var expr=display.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'('+Math.PI+')').replace(/√/g,'Math.sqrt');
          var r=Function('"use strict";return ('+expr+')')();
          history=display+' =';
          display=String(r);
        }catch(e){display='Error'}
      }
      else if(k==='x²'){try{display=String(Math.pow(eval(display.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')),2))}catch(e){display='Error'}}
      else if(k==='√'){display+='√('}
      else if(k==='π'){display+='π'}
      else if(k==='%'){display+='%'}
      else display+=k;
      updateDisplay();
    }
    /* physical keyboard */
    function onDocKey(e){
      if(!win.el.classList.contains('active'))return;
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
      var k=e.key;
      if(k==='Enter'||k==='='){onKey('=');e.preventDefault()}
      else if(k==='Escape'){onKey('C');e.preventDefault()}
      else if(k==='Backspace'){onKey('⌫');e.preventDefault()}
      else if('0123456789.+()-*/'.indexOf(k)>=0)onKey(k==='*'?'×':k==='/'?'÷':k);
    }
    document.addEventListener('keydown',onDocKey);
    updateDisplay();
    return function(){document.removeEventListener('keydown',onDocKey)};
  }
};

/* ───────── Paint ───────── */
APPS.paint={
  name:'Paint',icon:'🎨',defaultSize:[800,600],
  init:function(body,win){
    var wrap=el('div',{class:'paint'});
    var tools=el('div',{class:'tools'});
    var state={tool:'brush',color:'#5b8def',size:4};
    var toolList=[
      {k:'brush',icon:'🖌'},{k:'eraser',icon:'◻'},{k:'line',icon:'╱'},
      {k:'rect',icon:'▭'},{k:'circle',icon:'◯'},{k:'fill',icon:'⬛'},
      {k:'spray',icon:'✺'}
    ];
    var toolBtns={};
    toolList.forEach(function(t){
      var b=el('button',{text:t.icon,title:t.k});
      b.addEventListener('click',function(){
        state.tool=t.k;
        Object.keys(toolBtns).forEach(function(k){toolBtns[k].classList.toggle('on',k===t.k)});
      });
      toolBtns[t.k]=b;
      tools.appendChild(b);
    });
    toolBtns.brush.classList.add('on');
    var colorIn=el('input',{type:'color',value:'#5b8def'});
    colorIn.addEventListener('input',function(){state.color=colorIn.value});
    tools.appendChild(colorIn);
    var sizeIn=el('input',{type:'range',min:1,max:40,value:4});
    sizeIn.addEventListener('input',function(){state.size=parseInt(sizeIn.value)});
    tools.appendChild(sizeIn);
    var btnClear=el('button',{text:'🗑',title:'Clear'});
    tools.appendChild(btnClear);
    var btnSave=el('button',{text:'💾',title:'Save PNG'});
    tools.appendChild(btnSave);
    var cw=el('div',{class:'canvas-wrap'});
    var canvas=el('canvas',{width:800,height:500});
    cw.appendChild(canvas);
    wrap.appendChild(tools);wrap.appendChild(cw);
    body.appendChild(wrap);
    var ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle=state.color;
    ctx.lineWidth=state.size;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    var drawing=false;
    var start=null;
    var snapshot=null;
    function getPos(e){
      var r=canvas.getBoundingClientRect();
      var scaleX=canvas.width/r.width;
      var scaleY=canvas.height/r.height;
      return {x:(e.clientX-r.left)*scaleX,y:(e.clientY-r.top)*scaleY};
    }
    canvas.addEventListener('mousedown',function(e){
      drawing=true;
      start=getPos(e);
      snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
      ctx.strokeStyle=state.tool==='eraser'?'#fff':state.color;
      ctx.lineWidth=state.size;
      if(state.tool==='brush'||state.tool==='eraser'){
        ctx.beginPath();ctx.moveTo(start.x,start.y);
      }
    });
    canvas.addEventListener('mousemove',function(e){
      if(!drawing)return;
      var p=getPos(e);
      if(state.tool==='brush'||state.tool==='eraser'){
        ctx.lineTo(p.x,p.y);ctx.stroke();
      }else if(state.tool==='spray'){
        for(var i=0;i<15;i++){
          var a=Math.random()*Math.PI*2;
          var r=Math.random()*state.size*2;
          ctx.fillStyle=state.color;
          ctx.fillRect(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,1,1);
        }
      }else{
        ctx.putImageData(snapshot,0,0);
        ctx.strokeStyle=state.color;
        ctx.lineWidth=state.size;
        ctx.beginPath();
        if(state.tool==='line'){
          ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);
        }else if(state.tool==='rect'){
          ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);
        }else if(state.tool==='circle'){
          var rx=Math.abs(p.x-start.x);
          var ry=Math.abs(p.y-start.y);
          ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,rx/2,ry/2,0,0,Math.PI*2);
        }
        ctx.stroke();
      }
    });
    canvas.addEventListener('mouseup',function(e){
      if(!drawing)return;
      var p=getPos(e);
      if(state.tool==='fill'){
        floodFill(Math.floor(p.x),Math.floor(p.y),state.color);
      }
      drawing=false;
    });
    canvas.addEventListener('mouseleave',function(){drawing=false});
    function floodFill(x,y,fillColor){
      var img=ctx.getImageData(0,0,canvas.width,canvas.height);
      var data=img.data;
      var target=hexToRgb(fillColor);
      var startIdx=(y*canvas.width+x)*4;
      var sr=data[startIdx],sg=data[startIdx+1],sb=data[startIdx+2];
      if(Math.abs(sr-target.r)<3&&Math.abs(sg-target.g)<3&&Math.abs(sb-target.b)<3)return;
      var stack=[[x,y]];
      var visited={};
      while(stack.length){
        var pt=stack.pop();
        var px=pt[0],py=pt[1];
        if(px<0||px>=canvas.width||py<0||py>=canvas.height)continue;
        var key=px+','+py;
        if(visited[key])continue;
        visited[key]=1;
        var i=(py*canvas.width+px)*4;
        if(Math.abs(data[i]-sr)<20&&Math.abs(data[i+1]-sg)<20&&Math.abs(data[i+2]-sb)<20){
          data[i]=target.r;data[i+1]=target.g;data[i+2]=target.b;data[i+3]=255;
          stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
        }
      }
      ctx.putImageData(img,0,0);
    }
    function hexToRgb(h){
      h=h.replace('#','');
      return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};
    }
    btnClear.addEventListener('click',function(){
      if(!confirm('Clear canvas?'))return;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    });
    btnSave.addEventListener('click',function(){
      var a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');
      a.download='nexusos-paint-'+Date.now()+'.png';
      a.click();
      notify('Saved','PNG downloaded','ok');
    });
    return null;
  }
};

/* ───────── Music / Synth ───────── */
APPS.music={
  name:'Music',icon:'🎵',defaultSize:[640,540],
  init:function(body,win){
    var wrap=el('div',{class:'music'});
    var AC=null;
    function ensureAC(){
      if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}
      return AC;
    }
    var settings={wave:'sawtooth',attack:0.01,release:0.5,filter:2000,volume:0.3};
    /* Piano keys */
    wrap.appendChild(el('div',{class:'section-title',text:'Keyboard'}));
    var keys=el('div',{class:'keys'});
    var notes=['C','D','E','F','G','A','B','C'];
    var freqs=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];
    notes.forEach(function(n,i){
      var k=el('div',{class:'key',text:n});
      k.addEventListener('mousedown',function(){playNote(freqs[i]);k.classList.add('on')});
      k.addEventListener('mouseup',function(){k.classList.remove('on')});
      k.addEventListener('mouseleave',function(){k.classList.remove('on')});
      keys.appendChild(k);
    });
    wrap.appendChild(keys);
    /* Controls */
    wrap.appendChild(el('div',{class:'section-title',text:'Oscillator'}));
    var knobs=el('div',{class:'knobs'});
    function addKnob(label,min,max,step,val,onChange){
      var box=el('div',{class:'knob-box'});
      var lbl=el('div',{class:'kb-label'});
      lbl.innerHTML='<span>'+label+'</span><span class="kb-val" id="v_'+label.replace(/ /g,'_')+'">'+val+'</span>';
      var inp=el('input',{type:'range',min:min,max:max,step:step,value:val});
      inp.addEventListener('input',function(){
        lbl.querySelector('.kb-val').textContent=inp.value;
        onChange(parseFloat(inp.value));
      });
      box.appendChild(lbl);box.appendChild(inp);
      return box;
    }
    knobs.appendChild(addKnob('ATTACK',0.001,1,0.001,settings.attack,function(v){settings.attack=v}));
    knobs.appendChild(addKnob('RELEASE',0.05,3,0.05,settings.release,function(v){settings.release=v}));
    knobs.appendChild(addKnob('FILTER Hz',200,8000,50,settings.filter,function(v){settings.filter=v}));
    knobs.appendChild(addKnob('VOLUME',0,1,0.01,settings.volume,function(v){settings.volume=v}));
    wrap.appendChild(knobs);
    /* Wave select */
    var waveBox=el('div',{class:'knob-box'});
    waveBox.innerHTML='<div class="kb-label"><span>WAVE</span><span class="kb-val">'+settings.wave+'</span></div>';
    var waveSel=el('select',{style:'width:100%;background:#0a0c16;border:1px solid var(--bd);border-radius:5px;padding:6px;color:#e8eaf2;font-size:12px'});
    ['sawtooth','square','sine','triangle'].forEach(function(w){
      var o=el('option',{value:w,text:w});
      if(w===settings.wave)o.selected=true;
      waveSel.appendChild(o);
    });
    waveSel.addEventListener('change',function(){settings.wave=waveSel.value;waveBox.querySelector('.kb-val').textContent=waveSel.value});
    waveBox.appendChild(waveSel);
    wrap.appendChild(waveBox);
    /* Sequencer */
    wrap.appendChild(el('div',{class:'section-title',text:'Step Sequencer'}));
    var seq=el('div',{class:'seq'});
    var steps=[];
    for(var s=0;s<16;s++){
      var st=el('div',{class:'step','data-i':s});
      st.addEventListener('click',function(i){return function(){steps[i]=!steps[i];st.classList.toggle('on',steps[i])}}(s));
      steps.push(false);
      seq.appendChild(st);
    }
    wrap.appendChild(seq);
    var seqRunning=false;
    var seqIdx=0;
    var seqTimer=null;
    var seqBtn=el('button',{text:'▶ Play sequence',style:'padding:8px 16px;background:var(--ac);color:#fff;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;margin-top:8px'});
    seqBtn.addEventListener('click',function(){
      seqRunning=!seqRunning;
      seqBtn.textContent=seqRunning?'⏸ Stop sequence':'▶ Play sequence';
      if(seqRunning){
        seqIdx=0;
        seqTimer=setInterval(function(){
          var all=seq.querySelectorAll('.step');
          all.forEach(function(x){x.classList.remove('playing')});
          all[seqIdx].classList.add('playing');
          if(steps[seqIdx])playNote(freqs[seqIdx%8],0.2);
          seqIdx=(seqIdx+1)%16;
        },200);
      }else{
        clearInterval(seqTimer);
        seq.querySelectorAll('.step').forEach(function(x){x.classList.remove('playing')});
      }
    });
    wrap.appendChild(seqBtn);
    function playNote(freq,dur){
      var ac=ensureAC();
      var osc=ac.createOscillator();
      var g=ac.createGain();
      var filt=ac.createBiquadFilter();
      filt.type='lowpass';filt.frequency.value=settings.filter;
      osc.type=settings.wave;
      osc.frequency.value=freq;
      var t=ac.currentTime;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(settings.volume,t+settings.attack);
      g.gain.exponentialRampToValueAtTime(0.001,t+settings.attack+(dur||settings.release));
      osc.connect(filt);filt.connect(g);g.connect(ac.destination);
      osc.start(t);osc.stop(t+settings.attack+(dur||settings.release)+0.1);
    }
    /* Keyboard */
    var keyMap={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7};
    function onDocKey(e){
      if(!win.el.classList.contains('active'))return;
      if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
      var i=keyMap[e.key.toLowerCase()];
      if(i!=null){
        e.preventDefault();
        playNote(freqs[i]);
        var ks=keys.querySelectorAll('.key');
        ks[i].classList.add('on');
        setTimeout(function(){ks[i].classList.remove('on')},150);
      }
    }
    document.addEventListener('keydown',onDocKey);
    return function(){
      document.removeEventListener('keydown',onDocKey);
      if(seqTimer)clearInterval(seqTimer);
      if(AC)try{AC.close()}catch(e){}
    };
  }
};
</script>

/* ───────── System Monitor ───────── */
APPS.sysmon={
  name:'System Monitor',icon:'📊',defaultSize:[520,600],
  init:function(body,win){
    var wrap=el('div',{class:'sysmon'});
    body.appendChild(wrap);
    var hist={cpu:[],mem:[]};
    function gauge(name,val,sub){
      var m=el('div',{class:'metric'});
      m.innerHTML='<div class="m-head"><span class="m-name">'+name+'</span><span class="m-val">'+val+'</span></div><div class="m-bar"><div class="m-fill" style="width:'+parseFloat(val)+'%"></div></div><div class="m-sub">'+sub+'</div>';
      return m;
    }
    function update(){
      wrap.innerHTML='';
      var fps=KERNEL.fps;
      var mem=performance.memory;
      var memUsed=mem?mem.usedJSHeapSize/1048576:Math.random()*400+200;
      var memMax=mem?mem.jsHeapSizeLimit/1048576:2048;
      var memPct=(memUsed/memMax*100);
      var cpuPct=clamp(30+Math.random()*40,5,100);
      hist.cpu.push(cpuPct);if(hist.cpu.length>40)hist.cpu.shift();
      hist.mem.push(memPct);if(hist.mem.length>40)hist.mem.shift();
      wrap.appendChild(gauge('CPU',cpuPct.toFixed(0)+'%','Real: not measurable in browser · sim'));
      wrap.appendChild(gauge('MEMORY',memPct.toFixed(1)+'%',memUsed.toFixed(1)+' / '+memMax.toFixed(0)+' MB'));
      wrap.appendChild(gauge('FPS',String(fps),'60 = smooth'));
      /* Windows */
      var winCount=Object.keys(WM.windows).length;
      wrap.appendChild(gauge('PROCESSES',String(winCount)+' running','Open windows'));
      /* Storage */
      var used=0;
      try{for(var k in localStorage){if(localStorage.hasOwnProperty(k))used+=(localStorage[k]||'').length}}catch(e){}
      var storagePct=Math.min(100,used/1024/1024*100);
      wrap.appendChild(gauge('STORAGE',storagePct.toFixed(2)+'%',(used/1024).toFixed(1)+' KB used'));
      /* Uptime */
      var up=Math.floor((Date.now()-KERNEL.bootTime)/1000);
      wrap.appendChild(gauge('UPTIME','',up+'s'));
    }
    var t=setInterval(update,1000);
    update();
    return function(){clearInterval(t)};
  }
};

/* ───────── Calendar ───────── */
APPS.calendar={
  name:'Calendar',icon:'📅',defaultSize:[640,560],
  init:function(body,win){
    var today=new Date();
    var view={y:today.getFullYear(),m:today.getMonth()};
    var wrap=el('div',{class:'calendar'});
    body.appendChild(wrap);
    function render(){
      wrap.innerHTML='';
      var head=el('div',{class:'cal-head'});
      var title=el('div',{class:'cal-title',text:new Date(view.y,view.m,1).toLocaleString('en',{month:'long',year:'numeric'})});
      var nav=el('div',{class:'cal-nav'});
      var prev=el('button',{text:'‹ Prev'});
      var next=el('button',{text:'Next ›'});
      var nowBtn=el('button',{text:'Today'});
      prev.addEventListener('click',function(){view.m--;if(view.m<0){view.m=11;view.y--}render()});
      next.addEventListener('click',function(){view.m++;if(view.m>11){view.m=0;view.y++}render()});
      nowBtn.addEventListener('click',function(){view.y=today.getFullYear();view.m=today.getMonth();render()});
      nav.appendChild(prev);nav.appendChild(nowBtn);nav.appendChild(next);
      head.appendChild(title);head.appendChild(nav);
      wrap.appendChild(head);
      var grid=el('div',{class:'cal-grid'});
      ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(function(d){
        grid.appendChild(el('div',{class:'dow',text:d}));
      });
      var first=new Date(view.y,view.m,1).getDay();
      var daysIn=new Date(view.y,view.m+1,0).getDate();
      var prevDays=new Date(view.y,view.m,0).getDate();
      /* prev month days */
      for(var i=first-1;i>=0;i--){
        var d=el('div',{class:'day other',text:String(prevDays-i)});
        grid.appendChild(d);
      }
      /* current */
      for(var day=1;day<=daysIn;day++){
        var isToday=day===today.getDate()&&view.m===today.getMonth()&&view.y===today.getFullYear();
        var d=el('div',{class:'day'+(isToday?' today':''),text:String(day)});
        grid.appendChild(d);
      }
      /* next month days */
      var remaining=42-(first+daysIn);
      for(var k=1;k<=remaining;k++){
        var d=el('div',{class:'day other',text:String(k)});
        grid.appendChild(d);
      }
      wrap.appendChild(grid);
      /* Events */
      var evh=el('div',{style:'margin-top:24px'});
      evh.innerHTML='<div style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:10px">Events</div>';
      var events=[
        {date:'Today',title:'Team sync',time:'10:00'},
        {date:'Tomorrow',title:'Product review',time:'14:30'},
        {date:'Friday',title:'Release v1.0',time:'17:00'}
      ];
      events.forEach(function(e){
        var row=el('div',{style:'padding:10px 12px;background:rgba(15,17,30,.5);border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;display:flex;gap:12px;align-items:center;font-size:12px'});
        row.innerHTML='<span style="color:var(--pk);font-weight:600;min-width:80px">'+esc(e.date)+'</span><span style="color:var(--ac2);font-family:var(--mono);min-width:50px">'+e.time+'</span><span style="flex:1;color:var(--tx)">'+esc(e.title)+'</span>';
        evh.appendChild(row);
      });
      wrap.appendChild(evh);
    }
    render();
    return null;
  }
};

/* ───────── Snake Game ───────── */
APPS.snake={
  name:'Snake',icon:'🐍',defaultSize:[520,600],
  init:function(body,win){
    var wrap=el('div',{class:'game'});
    var hud=el('div',{class:'hud'});
    var scoreEl=el('div',{html:'Score: <b id="snkScore">0</b>'});
    var bestEl=el('div',{html:'Best: <b id="snkBest">0</b>'});
    var restartBtn=el('button',{text:'Restart'});
    hud.appendChild(scoreEl);hud.appendChild(bestEl);hud.appendChild(restartBtn);
    var msg=el('div',{class:'msg',text:'Use arrow keys or WASD'});
    var canvas=el('canvas',{width:400,height:400});
    wrap.appendChild(hud);wrap.appendChild(canvas);wrap.appendChild(msg);
    body.appendChild(wrap);
    var ctx=canvas.getContext('2d');
    var CELL=20;
    var W=20,H=20;
    var snake=[{x:10,y:10}];
    var dir={x:1,y:0};
    var nextDir={x:1,y:0};
    var food={x:ri(0,W-1),y:ri(0,H-1)};
    var score=0;
    var best=parseInt(localStorage.getItem('nexusos.snake.best')||'0');
    $('snkBest')&&($('snkBest').textContent=best);
    var dead=false;
    function reset(){
      snake=[{x:10,y:10}];
      dir={x:1,y:0};nextDir={x:1,y:0};
      food={x:ri(0,W-1),y:ri(0,H-1)};
      score=0;dead=false;
      msg.textContent='';
      $('snkScore').textContent='0';
    }
    function tick(){
      if(dead)return;
      dir=nextDir;
      var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(head.x<0||head.x>=W||head.y<0||head.y>=H){die()}
      else if(snake.some(function(s){return s.x===head.x&&s.y===head.y})){die()}
      else{
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){
          score++;$('snkScore').textContent=score;
          if(score>best){best=score;localStorage.setItem('nexusos.snake.best',best);$('snkBest').textContent=best}
          food={x:ri(0,W-1),y:ri(0,H-1)};
          while(snake.some(function(s){return s.x===food.x&&s.y===food.y}))food={x:ri(0,W-1),y:ri(0,H-1)};
        }else snake.pop();
      }
      draw();
    }
    function die(){
      dead=true;
      msg.textContent='☠ Game over — score '+score+' · press Restart or Space';
    }
    function draw(){
      ctx.fillStyle='#000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      /* grid */
      ctx.strokeStyle='rgba(91,141,239,.06)';
      for(var i=0;i<=W;i++){
        ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H*CELL);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(W*CELL,i*CELL);ctx.stroke();
      }
      /* food */
      ctx.fillStyle='#ef4444';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2);
      ctx.fill();
      /* snake */
      snake.forEach(function(s,i){
        var t=i/snake.length;
        ctx.fillStyle='rgb('+Math.floor(91*(1-t)+167*t)+','+Math.floor(141*(1-t)+139*t)+','+Math.floor(239*(1-t)+250*t)+')';
        ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
      });
      /* head eyes */
      ctx.fillStyle='#000';
      ctx.fillRect(snake[0].x*CELL+CELL*0.25,snake[0].y*CELL+CELL*0.25,3,3);
      ctx.fillRect(snake[0].x*CELL+CELL*0.55,snake[0].y*CELL+CELL*0.25,3,3);
    }
    function onKey(e){
      if(!win.el.classList.contains('active'))return;
      if(e.target.tagName==='INPUT')return;
      var k=e.key.toLowerCase();
      if(k==='arrowup'||k==='w'){if(dir.y===0){nextDir={x:0,y:-1}}e.preventDefault()}
      else if(k==='arrowdown'||k==='s'){if(dir.y===0){nextDir={x:0,y:1}}e.preventDefault()}
      else if(k==='arrowleft'||k==='a'){if(dir.x===0){nextDir={x:-1,y:0}}e.preventDefault()}
      else if(k==='arrowright'||k==='d'){if(dir.x===0){nextDir={x:1,y:0}}e.preventDefault()}
      else if(k===' '){reset()}
    }
    document.addEventListener('keydown',onKey);
    restartBtn.addEventListener('click',reset);
    var timer=setInterval(tick,110);
    draw();
    return function(){
      clearInterval(timer);
      document.removeEventListener('keydown',onKey);
    };
  }
};

/* ───────── Minesweeper ───────── */
APPS.minesweeper={
  name:'Minesweeper',icon:'💣',defaultSize:[520,600],
  init:function(body,win){
    var wrap=el('div',{class:'game'});
    var W=12,H=12,MINES=20;
    var hud=el('div',{class:'hud'});
    var minesEl=el('div',{html:'Mines: <b id="msMines">'+MINES+'</b>'});
    var flagEl=el('div',{html:'Flags: <b id="msFlags">0</b>'});
    var timeEl=el('div',{html:'Time: <b id="msTime">0</b>'});
    var restartBtn=el('button',{text:'Restart'});
    hud.appendChild(minesEl);hud.appendChild(flagEl);hud.appendChild(timeEl);hud.appendChild(restartBtn);
    var msg=el('div',{class:'msg',text:''});
    var canvas=el('canvas',{width:480,height:480});
    wrap.appendChild(hud);wrap.appendChild(canvas);wrap.appendChild(msg);
    body.appendChild(wrap);
    var ctx=canvas.getContext('2d');
    var CELL=40;
    var grid, flags, revealed, dead, won, startTime, elapsed, timer;
    function reset(){
      grid=[];
      flags=[];
      revealed=[];
      for(var i=0;i<W*H;i++){grid.push(0);flags.push(false);revealed.push(false)}
      /* place mines */
      var placed=0;
      while(placed<MINES){
        var i=ri(0,W*H-1);
        if(grid[i]!==-1){grid[i]=-1;placed++}
      }
      /* count */
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){
        var i2=y*W+x;
        if(grid[i2]===-1)continue;
        var count=0;
        for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;
          var nx=x+dx,ny=y+dy;
          if(nx>=0&&nx<W&&ny>=0&&ny<H&&grid[ny*W+nx]===-1)count++;
        }
        grid[i2]=count;
      }
      dead=false;won=false;
      startTime=Date.now();elapsed=0;
      msg.textContent='';
      clearInterval(timer);
      timer=setInterval(function(){
        if(!dead&&!won){elapsed=Math.floor((Date.now()-startTime)/1000);$('msTime').textContent=elapsed}
      },250);
      $('msFlags').textContent='0';
      draw();
    }
    function reveal(x,y){
      var i=y*W+x;
      if(revealed[i]||flags[i]||dead||won)return;
      revealed[i]=true;
      if(grid[i]===-1){dead=true;msg.textContent='💥 Boom! Press Restart';return}
      if(grid[i]===0){
        for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;
          var nx=x+dx,ny=y+dy;
          if(nx>=0&&nx<W&&ny>=0&&ny<H)reveal(nx,ny);
        }
      }
      /* check win */
      var safeRevealed=revealed.filter(function(r,i){return r&&grid[i]!==-1}).length;
      if(safeRevealed===W*H-MINES){won=true;msg.textContent='🎉 You won in '+elapsed+'s!'}
    }
    function draw(){
      ctx.fillStyle='#0a0c16';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){
        var i=y*W+x;
        var px=x*CELL,py=y*CELL;
        if(!revealed[i]){
          ctx.fillStyle=flags[i]?'#3a2a1a':'#23273f';
          ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
          ctx.fillStyle='rgba(255,255,255,.06)';
          ctx.fillRect(px+1,py+1,CELL-2,3);
          if(flags[i]){
            ctx.fillStyle='#ef4444';
            ctx.font='bold 22px sans-serif';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('⚑',px+CELL/2,py+CELL/2);
          }
        }else{
          ctx.fillStyle='#151a30';
          ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
          if(grid[i]===-1){
            ctx.fillStyle='#ef4444';
            ctx.font='22px sans-serif';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText('💣',px+CELL/2,py+CELL/2);
          }else if(grid[i]>0){
            var cols=['','#5b8def','#4ade80','#fbbf24','#a78bfa','#ec4899','#22d3ee','#e8eaf2','#98a0c0'];
            ctx.fillStyle=cols[grid[i]];
            ctx.font='bold 18px monospace';
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(String(grid[i]),px+CELL/2,py+CELL/2);
          }
        }
      }
    }
    canvas.addEventListener('click',function(e){
      if(dead||won)return;
      var r=canvas.getBoundingClientRect();
      var x=Math.floor((e.clientX-r.left)/CELL);
      var y=Math.floor((e.clientY-r.top)/CELL);
      if(x>=0&&x<W&&y>=0&&y<H){reveal(x,y);draw()}
    });
    canvas.addEventListener('contextmenu',function(e){
      e.preventDefault();
      if(dead||won)return;
      var r=canvas.getBoundingClientRect();
      var x=Math.floor((e.clientX-r.left)/CELL);
      var y=Math.floor((e.clientY-r.top)/CELL);
      if(x>=0&&x<W&&y>=0&&y<H){
        var i=y*W+x;
        if(!revealed[i]){
          flags[i]=!flags[i];
          $('msFlags').textContent=flags.filter(Boolean).length;
          draw();
        }
      }
    });
    restartBtn.addEventListener('click',reset);
    reset();
    return function(){clearInterval(timer)};
  }
};

    wallpapers.forEach(function(w){

    var b1=el('button',{text:'Export all data'});
    b1.style.cssText='padding:8px 16px;background:rgba(91,141,239,.15);border:1px solid var(--bd);border-radius:6px;color:var(--tx);cursor:pointer;font-size:12px';
    b1.addEventListener('click',function(){
      var data={fs:FS.root,notes:localStorage.getItem('nexusos.notes'),version:'1.0'};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='nexusos-backup-'+Date.now()+'.json';
      a.click();
      notify('Exported','Backup downloaded','ok');
    });
    var b2=el('button',{text:'Reset system'});
    b2.style.cssText='padding:8px 16px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:6px;color:#ef4444;cursor:pointer;font-size:12px';
    b2.addEventListener('click',function(){
      if(!confirm('Reset NEXUS-OS? This will delete all files and notes.'))return;
      localStorage.clear();
      location.reload();
    });
    btnRow.appendChild(b1);btnRow.appendChild(b2);
    sec3.appendChild(btnRow);
    wrap.appendChild(sec3);
    /* About */
    var sec4=el('div');
    sec4.innerHTML='<div style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:10px">About</div><div style="font-size:12px;color:var(--tx2);line-height:1.7">NEXUS-OS v1.0<br>Browser-based operating system<br>© '+new Date().getFullYear()+'<br><br>Keyboard shortcuts:<br>• Ctrl/Cmd+K — command palette<br>• Ctrl/Cmd+Alt+T — terminal<br>• Ctrl/Cmd+Alt+E — editor<br>• Esc — close menus</div>';
    wrap.appendChild(sec4);
    return null;
  }
};
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   NEXUS-OS · Kernel · Shell · Desktop · Boot
   ══════════════════════════════════════════════════════════════ */

var KERNEL={
  bootTime:Date.now(),
  fps:60,
  lastFrame:performance.now(),
  frames:0,
  frameAcc:0,
  init:function(){
    FS.init();
    this.applyStored();
    this.startClock();
    this.startFPS();
    WM.init();
    this.bindStart();
    this.bindCommandPalette();
    this.bindGlobalShortcuts();
    this.renderDesktopIcons();
    this.renderStartMenu();
    this.showBootAnimation();
  },
  applyStored:function(){
    try{
      var theme=localStorage.getItem('nexusos.theme');
      if(theme){
        theme=JSON.parse(theme);
        if(theme.ac)document.documentElement.style.setProperty('--ac',theme.ac);
        if(theme.ac2)document.documentElement.style.setProperty('--ac2',theme.ac2);
      }
      var wall=localStorage.getItem('nexusos.wallpaper');
      if(wall){
        $('wallpaper').style.background=wall;
      }
    }catch(e){}
  },
  startClock:function(){
    var update=function(){
      var d=new Date();
      var h=pad(d.getHours());var m=pad(d.getMinutes());
      var dateStr=d.getDate()+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
      if($('trayClock'))$('trayClock').textContent=h+':'+m;
      if($('trayDate'))$('trayDate').textContent=dateStr;
      /* battery */
      if(navigator.getBattery){
        navigator.getBattery().then(function(b){
          var pct=Math.floor(b.level*100);
          if($('trayBattery'))$('trayBattery').textContent=(b.charging?'⚡':'🔋')+' '+pct+'%';
        });
      }
    };
    update();
    setInterval(update,1000);
  },
  startFPS:function(){
    var self=this;
    function loop(now){
      self.frames++;
      var dt=now-self.lastFrame;
      if(dt>=1000){
        self.fps=Math.round(self.frames*1000/dt);
        self.frames=0;
        self.lastFrame=now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },
  bindStart:function(){
    var btn=$('startBtn');
    var menu=$('startmenu');
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      menu.classList.toggle('on');
      if(menu.classList.contains('on')){
        setTimeout(function(){var i=$('smSearch');if(i)i.focus()},100);
      }
    });
    document.addEventListener('click',function(e){
      if(!e.target.closest('#startmenu')&&!e.target.closest('#startBtn')){
        menu.classList.remove('on');
      }
    });
    /* Search filter */
    var search=$('smSearch');
    search.addEventListener('input',function(){
      var q=search.value.toLowerCase();
      $$('.sm-app').forEach(function(a){
        var name=a.querySelector('.app-name').textContent.toLowerCase();
        a.style.display=name.indexOf(q)>=0?'':'none';
      });
    });
    $('trayMenu').addEventListener('click',function(e){
      e.stopPropagation();
      var r=this.getBoundingClientRect();
      showCtxMenu(r.left-180,r.top-100,[
        {icon:'⚙',label:'Settings',action:function(){WM.open('settings')}},
        {icon:'📊',label:'System Monitor',action:function(){WM.open('sysmon')}},
        {sep:true},
        {icon:'🔄',label:'Reboot',action:function(){if(confirm('Reboot?'))location.reload()}},
        {icon:'⏻',label:'Shut down',action:function(){
          if(!confirm('Shut down NEXUS-OS?'))return;
          document.getElementById('os').style.opacity='0';
          setTimeout(function(){
            document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#5a6080;font-family:monospace;font-size:16px;letter-spacing:6px">GOODBYE</div>';
          },600);
        }}
      ]);
    });
  },
  renderStartMenu:function(){
    var body=$('smBody');
    body.innerHTML='';
    var favorites=['terminal','editor','notes','files','sheet','calc','paint','music'];
    var sections=[
      {title:'Favorites',apps:favorites},
      {title:'All applications',apps:Object.keys(APPS)}
    ];
    sections.forEach(function(sec,i){
      body.appendChild(el('div',{class:'sm-section',text:sec.title}));
      var grid=el('div',{class:'sm-grid'});
      sec.apps.forEach(function(id){
        var app=APPS[id];
        if(!app)return;
        var a=el('div',{class:'sm-app'});
        a.innerHTML='<div class="app-ico" style="background:linear-gradient(135deg,rgba(91,141,239,.3),rgba(167,139,250,.2))">'+app.icon+'</div><div class="app-name">'+esc(app.name)+'</div>';
        a.addEventListener('click',function(){
          WM.open(id);
          $('startmenu').classList.remove('on');
        });
        grid.appendChild(a);
      });
      body.appendChild(grid);
    });
  },
  renderDesktopIcons:function(){
    var icons=$('icons');
    icons.innerHTML='';
    var desktopApps=[
      {id:'terminal',name:'Terminal'},
      {id:'files',name:'Files'},
      {id:'editor',name:'Editor'},
      {id:'notes',name:'Notes'},
      {id:'sheet',name:'Spreadsheet'},
      {id:'calc',name:'Calculator'},
      {id:'paint',name:'Paint'},
      {id:'music',name:'Music'},
      {id:'sysmon',name:'Monitor'},
      {id:'settings',name:'Settings'}
    ];
    desktopApps.forEach(function(d){
      var app=APPS[d.id];
      var ic=el('div',{class:'icon'});
      ic.innerHTML='<div class="ico" style="background:linear-gradient(135deg,rgba(91,141,239,.35),rgba(167,139,250,.25))">'+app.icon+'</div><div class="nm">'+esc(d.name)+'</div>';
      ic.addEventListener('dblclick',function(){WM.open(d.id)});
      ic.addEventListener('click',function(e){
        e.stopPropagation();
        $$('.icon.selected').forEach(function(x){x.classList.remove('selected')});
        ic.classList.add('selected');
      });
      icons.appendChild(ic);
    });
  },
  bindCommandPalette:function(){
    var backdrop=$('cmd');
    var input=$('cmdInput');
    var list=$('cmd-list');
    var sel=0;
    var items=[];
    function buildItems(q){
      q=(q||'').toLowerCase().trim();
      var arr=[];
      Object.keys(APPS).forEach(function(id){
        var a=APPS[id];
        arr.push({
          icon:a.icon,name:a.name,desc:'Open application',kind:'app',
          action:function(){WM.open(id);Cmd.close()}
        });
      });
      arr.push({icon:'📄',name:'New file',desc:'Create a file',kind:'fs',action:function(){
        var name=prompt('File name:','untitled.txt');
        if(name){FS.write('/home/user/'+name,'');KERNEL.renderDesktopIcons();notify('File','Created','ok')}
        Cmd.close();
      }});
      arr.push({icon:'📁',name:'New folder',desc:'Create a folder',kind:'fs',action:function(){
        var name=prompt('Folder name:','New folder');
        if(name){FS.mkdir('/home/user/'+name);KERNEL.renderDesktopIcons();notify('Folder','Created','ok')}
        Cmd.close();
      }});
      arr.push({icon:'🎨',name:'Cycle wallpaper',desc:'Change desktop background',kind:'sys',action:function(){
        var colors=['#16203a','#1a1224','#0f2028','#281414','#0a1f1a'];
        var c=colors[ri(0,colors.length-1)];
        $('wallpaper').style.background='radial-gradient(ellipse at 30% 20%,'+c+' 0%,#05060c 60%,#000 100%)';
        notify('Wallpaper','Cycled','ok');
        Cmd.close();
      }});
      arr.push({icon:'🔄',name:'Reboot',desc:'Restart NEXUS-OS',kind:'sys',action:function(){
        if(confirm('Reboot?'))location.reload();
      }});
      if(q)arr=arr.filter(function(x){return (x.name+' '+x.desc).toLowerCase().indexOf(q)>=0});
      return arr;
    }
    function render(){
      list.innerHTML='';
      items=buildItems(input.value);
      if(!items.length){
        list.innerHTML='<div style="padding:24px;text-align:center;color:var(--tx3);font-size:12px">No matches</div>';
        return;
      }
      if(sel>=items.length)sel=items.length-1;
      items.forEach(function(it,i){
        var row=el('div',{class:'cmd-item'+(i===sel?' sel':'')});
        row.innerHTML='<div class="ci-ico" style="background:linear-gradient(135deg,rgba(91,141,239,.3),rgba(167,139,250,.2))">'+it.icon+'</div><div class="ci-body"><div class="ci-name">'+esc(it.name)+'</div><div class="ci-desc">'+esc(it.desc)+'</div></div>';
        row.addEventListener('click',function(){it.action()});
        list.appendChild(row);
      });
    }
    input.addEventListener('input',function(){sel=0;render()});
    input.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);render()}
      else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);render()}
      else if(e.key==='Enter'){e.preventDefault();if(items[sel])items[sel].action()}
      else if(e.key==='Escape'){e.preventDefault();Cmd.close()}
    });
    backdrop.addEventListener('click',function(e){
      if(e.target===backdrop)Cmd.close();
    });
    window.Cmd={
      open:function(){backdrop.classList.add('on');input.value='';sel=0;render();setTimeout(function(){input.focus()},30)},
      close:function(){backdrop.classList.remove('on')}
    };
  },
  bindGlobalShortcuts:function(){
    document.addEventListener('keydown',function(e){
      var tag=(e.target.tagName||'').toLowerCase();
      var isInput=tag==='input'||tag==='textarea'||e.target.isContentEditable;
      /* Command palette */
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();Cmd.open();return}
      /* Escape */
      if(e.key==='Escape'){
        if($('startmenu').classList.contains('on')){$('startmenu').classList.remove('on');return}
        if($('cmd').classList.contains('on')){Cmd.close();return}
      }
      if(isInput)return;
      /* App shortcuts */
      if((e.metaKey||e.ctrlKey)&&e.altKey){
        var map={t:'terminal',e:'editor',n:'notes',f:'files',c:'calc',p:'paint',m:'music',s:'settings',y:'sysmon'};
        var app=map[e.key.toLowerCase()];
        if(app){e.preventDefault();WM.open(app)}
      }
      /* Single-key app shortcuts when no window focused */
      if(!Object.keys(WM.windows).length){
        if(e.key==='t'&&!e.metaKey&&!e.ctrlKey)WM.open('terminal');
      }
    });
  },
  showBootAnimation:function(){
    var msgs=['Initializing kernel…','Loading filesystem…','Starting window manager…','Mounting virtual devices…','Loading applications…','Starting services…','Ready.'];
    var i=0;
    var msgEl=$('bootMsg');
    var timer=setInterval(function(){
      if(i>=msgs.length){
        clearInterval(timer);
        $('boot').classList.add('done');
        $('os').classList.add('on');
        setTimeout(function(){
          notify('Welcome','NEXUS-OS ready. Press Ctrl+K for commands.','ok');
        },600);
        /* Welcome terminal */
        setTimeout(function(){
          WM.open('terminal');
        },400);
        return;
      }
      msgEl.textContent=msgs[i++];
    },230);
  }
};

/* ───────── Global keyboard shortcuts (Cmd/Ctrl+S handling etc) ───────── */
document.addEventListener('keydown',function(e){
  /* Prevent browser from stealing Ctrl+S in editor */
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){
      e.preventDefault();
      /* Editor handles */
    }
  }
});

/* ───────── Initialize ───────── */
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){KERNEL.init()});
else KERNEL.init();

console.log('%c NEXUS-OS ','background:linear-gradient(90deg,#5b8def,#a78bfa,#ec4899);color:#fff;padding:10px 22px;border-radius:0;font-weight:900;font-size:16px;letter-spacing:6px');
console.log('Browser Operating System · '+(Object.keys(APPS||{}).length||'?')+' applications');
console.log('Terminal · Editor · Spreadsheet · Notes · Files · Calculator · Paint · Music · SysMon · Snake · Minesweeper');
console.log('Ctrl+K for command palette');
</script>
</body>
