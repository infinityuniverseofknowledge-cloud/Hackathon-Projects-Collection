<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoPulse — Pegada de Carbono</title>
<style>
:root{--bg:#070b15;--card:#111827;--card2:#1a2233;--bd:#1f2937;--txt:#e5e7eb;--txt2:#c9d1d9;--mut:#6b7280;--green:#10b981;--green2:#059669;--teal:#14b8a6;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at top left,rgba(16,185,129,.1),transparent 50%),var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.lg-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--teal));display:grid;place-items:center;font-size:20px;box-shadow:0 4px 20px rgba(16,185,129,.4)}
.lg-tx{font-weight:800;font-size:1.3rem;letter-spacing:-.5px;background:linear-gradient(90deg,#34d399,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lg-tx small{display:block;font-size:10px;color:var(--mut);-webkit-text-fill-color:var(--mut);margin-top:2px;font-weight:500}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);padding:6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;font-family:ui-monospace,monospace}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
nav{display:flex;gap:4px;margin-left:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
nav button{background:transparent;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap}
nav button:hover{color:var(--txt)}
nav button.on{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
main{min-height:calc(100vh - 180px)}
.view{display:none;animation:fi .3s ease}
.view.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--a,var(--green));opacity:.7}
.kpi-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:8px}
.kpi-v{font-size:24px;font-weight:900;font-family:ui-monospace,monospace;letter-spacing:-1px;color:var(--a,var(--green));line-height:1}
.kpi-s{font-size:11px;color:var(--mut);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:180px;height:180px;flex-shrink:0}
.donut svg{width:100%;height:100%}
.legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:8px}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0}
.leg-d{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.leg-n{flex:1;color:var(--txt2)}
.leg-v{font-family:ui-monospace,monospace;font-weight:700;font-size:11px}
.bars{width:100%;height:auto;max-height:220px}
.act{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;transition:.15s}
.act:hover{border-color:#2d3748;transform:translateX(2px)}
.act-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.act-i{flex:1;min-width:0}
.act-n{font-size:13px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-m{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace}
.act-c{font-family:ui-monospace,monospace;font-weight:800;color:var(--green);font-size:14px;white-space:nowrap}
.act-del{background:transparent;border:0;color:var(--mut);padding:4px 6px;border-radius:6px;cursor:pointer;font-size:14px;transition:.15s}
.act-del:hover{background:var(--bg);color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty-ic{font-size:48px;margin-bottom:12px;opacity:.5}
.empty p{font-size:13px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.cat-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:20px}
@media(max-width:600px){.cat-tabs{grid-template-columns:repeat(3,1fr)}}
.cat-tab{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px 6px;cursor:pointer;text-align:center;transition:.15s;font-family:inherit;color:var(--mut)}
.cat-tab:hover{border-color:#2d3748;color:var(--txt2)}
.cat-tab.on{background:linear-gradient(135deg,var(--green),var(--green2));border-color:var(--green);color:#fff;transform:translateY(-2px);box-shadow:0 4px 15px rgba(16,185,129,.3)}
.cat-tab .ic{font-size:22px;display:block;margin-bottom:4px}
.cat-tab .nm{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.preview{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(20,184,166,.1));border:1px solid rgba(16,185,129,.3);border-radius:12px;padding:16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.preview-l{font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.preview-v{font-size:24px;font-weight:900;font-family:ui-monospace,monospace}
.btn{background:linear-gradient(135deg,var(--green),var(--green2));border:0;color:#fff;padding:14px 24px;border-radius:10px;cursor:pointer;font-weight:800;font-family:inherit;font-size:14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 15px rgba(16,185,129,.4)}
.btn-full{width:100%}
.btn-sec{background:var(--card2);border:1px solid var(--bd);color:var(--txt)}
.btn-red{background:linear-gradient(135deg,var(--red),#dc2626)}
.prog-wrap{background:var(--card2);border-radius:10px;padding:16px;margin-bottom:12px}
.prog-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.prog-v{font-family:ui-monospace,monospace;font-weight:800;color:var(--green);font-size:14px}
.prog-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--teal));border-radius:5px;transition:width .5s}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ach{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px 8px;text-align:center;transition:.15s;opacity:.4;filter:grayscale(1)}
.ach.on{opacity:1;filter:grayscale(0);border-color:var(--amber);box-shadow:0 0 15px rgba(245,158,11,.2)}
.ach .ic{font-size:26px;display:block;margin-bottom:6px}
.ach .nm{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;line-height:1.3}
.ach.on .nm{color:var(--txt)}
.insight{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--green);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.insight.warn{border-left-color:var(--amber)}
.insight.info{border-left-color:var(--blue)}
.ins-t{font-size:12px;font-weight:800;margin-bottom:4px}
.ins-x{font-size:13px;color:var(--txt2);line-height:1.6}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.cmp{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.cmp .k{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:6px}
.cmp .v{font-size:18px;font-weight:900;font-family:ui-monospace,monospace}
.cmp.you .v{color:var(--green)}
.cmp.avg .v{color:var(--amber)}
.cmp.best .v{color:var(--blue)}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;transition:.2s}
.lcard:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 8px 20px rgba(16,185,129,.15)}
.lcard .ic{font-size:32px;margin-bottom:10px}
.lcard h3{font-size:14px;font-weight:800;margin-bottom:6px}
.lcard p{font-size:12px;color:var(--txt2);line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid #2d3748;border-radius:16px;padding:24px;max-width:420px;width:100%;animation:mi .25s ease}
@keyframes mi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.mt{font-size:16px;font-weight:800;margin-bottom:12px}
.mx{font-size:13px;color:var(--txt2);line-height:1.6;margin-bottom:20px}
.ma{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:2000;pointer-events:none;max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.err{background:linear-gradient(135deg,var(--red),#dc2626)}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{background:var(--card2);border:1px solid var(--bd);color:var(--mut);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.15s}
.fbtn:hover{color:var(--txt2);border-color:#2d3748}
.fbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px;background:rgba(16,185,129,.15);color:#34d399}
.mt-16{margin-top:16px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo"><div class="lg-ic">🌱</div><div class="lg-tx">EcoPulse<small>Rastreador de Pegada de Carbono</small></div></div>
<div class="live"><div class="live-dot"></div><span id="ci">-- g/kWh</span></div>
<nav id="nav">
<button data-v="dashboard" class="on">📊 Painel</button>
<button data-v="add">➕ Adicionar</button>
<button data-v="history">📜 Histórico</button>
<button data-v="goals">🎯 Metas</button>
<button data-v="insights">💡 Insights</button>
<button data-v="learn">📚 Aprender</button>
</nav>
</header>
<main>
<section class="view on" data-v="dashboard">
<div class="kpis" id="kpis"></div>
<div class="grid2">
<div class="card"><div class="card-title"><span>🍩 Por categoria</span><span class="chip" id="totalChip">0 kg</span></div><div id="donutChart"></div></div>
<div class="card"><div class="card-title">📈 Últimos 7 dias</div><div id="weeklyChart"></div></div>
</div>
<div class="card"><div class="card-title">🕒 Recentes</div><div id="recent"></div></div>
<div class="card"><div class="card-title">🏆 Conquistas</div><div class="achs" id="achs"></div></div>
</section>
<section class="view" data-v="add">
<div class="card">
<div class="card-title">➕ Nova atividade</div>
<div class="cat-tabs" id="catTabs"></div>
<div id="addForm"></div>
</div>
</section>
<section class="view" data-v="history">
<div class="card">
<div class="card-title"><span>📜 Histórico</span><span class="chip" id="histCount">0</span></div>
<div class="filters" id="histFilters"></div>
<div id="histList"></div>
</div>
</section>
<section class="view" data-v="goals">
<div class="card"><div class="card-title">🎯 Metas</div><div id="goalsContent"></div></div>
</section>
<section class="view" data-v="insights"><div id="insightsContent"></div></section>
<section class="view" data-v="learn">
<div class="card"><div class="card-title">📚 Aprenda</div><div class="learn" id="learnGrid"></div></div>
</section>
</main>
</div>
<div class="modal" id="modal">
<div class="mbox">
<div class="mt" id="mTitle">Confirmar</div>
<div class="mx" id="mText"></div>
<div class="ma"><button class="btn btn-sec" id="mCancel">Cancelar</button><button class="btn btn-red" id="mConfirm">Confirmar</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const FACTORS={
transport:{car_gasoline:{n:'Carro (gasolina)',f:.192,u:'km',ic:'🚗'},car_ethanol:{n:'Carro (etanol)',f:.120,u:'km',ic:'🚗'},car_electric:{n:'Carro (elétrico)',f:.050,u:'km',ic:'⚡'},motorcycle:{n:'Moto',f:.103,u:'km',ic:'🏍️'},bus:{n:'Ônibus',f:.089,u:'km',ic:'🚌'},metro:{n:'Metrô',f:.041,u:'km',ic:'🚇'},bike:{n:'Bicicleta',f:0,u:'km',ic:'🚴'},walk:{n:'A pé',f:0,u:'km',ic:'🚶'},flight_domestic:{n:'Voo doméstico',f:.255,u:'km',ic:'✈️'},flight_intl:{n:'Voo internacional',f:.195,u:'km',ic:'✈️'}},
food:{beef:{n:'Carne bovina',f:6,u:'refeição',ic:'🥩'},chicken:{n:'Frango',f:2.5,u:'refeição',ic:'🍗'},fish:{n:'Peixe',f:1.8,u:'refeição',ic:'🐟'},vegetarian:{n:'Vegetariana',f:1.2,u:'refeição',ic:'🥗'},vegan:{n:'Vegana',f:.7,u:'refeição',ic:'🌱'},coffee:{n:'Café',f:.28,u:'xícara',ic:'☕'}},
energy:{electricity:{n:'Eletricidade',f:.038,u:'kWh',ic:'⚡'},natural_gas:{n:'Gás natural',f:.202,u:'m³',ic:'🔥'},lpg:{n:'Gás de cozinha',f:3,u:'kg',ic:'🍳'}},
home:{water:{n:'Água',f:.0003,u:'L',ic:'💧'},waste_organic:{n:'Lixo orgânico',f:.5,u:'kg',ic:'🍂'},waste_recycle:{n:'Reciclagem',f:.1,u:'kg',ic:'♻️'},waste_general:{n:'Lixo comum',f:.9,u:'kg',ic:'🗑️'}},
shopping:{clothing:{n:'Roupa',f:10,u:'peça',ic:'👕'},shoes:{n:'Calçado',f:14,u:'par',ic:'👟'},electronics:{n:'Eletrônico',f:50,u:'unidade',ic:'📱'},furniture:{n:'Móvel',f:30,u:'unidade',ic:'🪑'},books:{n:'Livro',f:2.7,u:'unidade',ic:'📚'}}
};
const CAT_META={transport:{name:'Transporte',ic:'🚗',color:'#10b981'},food:{name:'Alimentação',ic:'🍽️',color:'#f59e0b'},energy:{name:'Energia',ic:'⚡',color:'#3b82f6'},home:{name:'Casa',ic:'🏠',color:'#8b5cf6'},shopping:{name:'Compras',ic:'🛍️',color:'#ec4899'}};
const ACHS=[
{id:'first',ic:'🌱',nm:'Primeira',test:s=>s.activities.length>=1},
{id:'ten',ic:'📊',nm:'Analista',test:s=>s.activities.length>=10},
{id:'cyclist',ic:'🚴',nm:'Ciclista',test:s=>s.activities.filter(a=>a.type==='bike').length>=5},
{id:'vegan',ic:'🌿',nm:'Verde',test:s=>s.activities.filter(a=>a.type==='vegan').length>=5},
{id:'saver',ic:'💚',nm:'Econômico',test:s=>totalCO2(s)>0&&totalCO2(s)<10},
{id:'tree',ic:'🌳',nm:'Plantador',test:s=>totalCO2(s)>=21.77},
{id:'streak',ic:'🔥',nm:'Streak 7d',test:s=>checkStreak(s)>=7},
{id:'goal',ic:'🏆',nm:'Meta',test:s=>s.activities.length>=7&&weekCO2(s)<=s.goals.weekly}
];
const LEARN_CARDS=[
{ic:'🌍',t:'Pegada global',d:'Média global ~4.7t CO₂e/pessoa/ano. Ideal 2030: 2t/ano.'},
{ic:'🥩',t:'Impacto da carne',d:'1kg de carne bovina emite ~60kg CO₂e. Trocar por vegetariana 2x/semana = -10kg/mês.'},
{ic:'🚗',t:'Transporte',d:'Carros = 15% das emissões globais. Elétrico emite 4x menos que a gasolina.'},
{ic:'✈️',t:'Voos',d:'SP–Lisboa ida e volta: ~2t CO₂e = metade da cota anual sustentável.'},
{ic:'⚡',t:'Energia',d:'Brasil é 85% renovável: 1kWh = 38g CO₂. Média global: 500g.'},
{ic:'🌳',t:'Compensação',d:'1 árvore adulta absorve 21.77kg de CO₂/ano. Reduzir > compensar.'},
{ic:'♻️',t:'Reciclagem',d:'1kg de alumínio reciclado economiza 9kg de CO₂ vs virgem.'},
{ic:'💧',t:'Água',d:'Tratar 1.000L emite 0.3kg de CO₂e. Banho curto ajuda.'},
{ic:'🍽️',t:'Desperdício',d:'1/3 dos alimentos são desperdiçados = 8% das emissões humanas.'}
];

let state={activities:[],goals:{weekly:20,monthly:80},achievements:[],filter:'all',addCat:'transport'};

function loadState(){try{const s=JSON.parse(localStorage.getItem('ecopulse.v1')||'{}');if(s.activities)state.activities=s.activities;if(s.goals)state.goals=s.goals;if(s.achievements)state.achievements=s.achievements}catch(e){}}
function saveState(){localStorage.setItem('ecopulse.v1',JSON.stringify({activities:state.activities,goals:state.goals,achievements:state.achievements}))}
function seedData(){if(state.activities.length>0)return;const now=new Date();const s=[{c:'transport',t:'car_gasoline',q:25,d:0},{c:'food',t:'beef',q:1,d:0},{c:'energy',t:'electricity',q:12,d:1},{c:'transport',t:'bike',q:8,d:1},{c:'food',t:'vegan',q:2,d:2},{c:'home',t:'water',q:200,d:2},{c:'transport',t:'metro',q:15,d:3},{c:'food',t:'vegetarian',q:1,d:3},{c:'energy',t:'electricity',q:8,d:4},{c:'shopping',t:'clothing',q:1,d:5}];state.activities=s.map((x,i)=>{const dt=new Date(now);dt.setDate(dt.getDate()-x.d);return{id:'seed_'+i,category:x.c,type:x.t,quantity:x.q,co2:calcCO2(x.c,x.t,x.q),date:dt.toISOString(),note:''}});saveState()}
function calcCO2(c,t,q){const f=FACTORS[c]?.[t];return f?parseFloat((f.f*q).toFixed(3)):0}
function totalCO2(s=state){return s.activities.reduce((a,x)=>a+x.co2,0)}
function todayCO2(s=state){const d=new Date().toISOString().slice(0,10);return s.activities.filter(a=>a.date.slice(0,10)===d).reduce((a,x)=>a+x.co2,0)}
function weekCO2(s=state){const w=new Date(Date.now()-7*86400000);return s.activities.filter(a=>new Date(a.date)>=w).reduce((a,x)=>a+x.co2,0)}
function monthCO2(s=state){const m=new Date(Date.now()-30*86400000);return s.activities.filter(a=>new Date(a.date)>=m).reduce((a,x)=>a+x.co2,0)}
function catTotals(s=state){const o={};Object.keys(CAT_META).forEach(k=>o[k]=0);s.activities.forEach(a=>{if(o[a.category]!==undefined)o[a.category]+=a.co2});return o}
function checkStreak(s=state){const days=new Set(s.activities.map(a=>a.date.slice(0,10)));let st=0;const d=new Date();while(days.has(d.toISOString().slice(0,10))){st++;d.setDate(d.getDate()-1)}return st}
function last7(s=state){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);const dn=['D','S','T','Q','Q','S','S'];const v=s.activities.filter(a=>a.date.slice(0,10)===k).reduce((a,x)=>a+x.co2,0);out.push({k,label:dn[d.getDay()],value:v})}return out}

function donutChart(segs,size=180){
const cx=size/2,cy=size/2,r=size/2-20,circ=2*Math.PI*r;
const total=segs.reduce((s,x)=>s+x.value,0);
if(total===0)return'<div class="empty"><div class="empty-ic">🥧</div><p>Adicione atividades</p></div>';
let off=0,paths='';
segs.forEach(s=>{if(s.value<=0)return;const dash=(s.value/total)*circ;paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=dash});
return`<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1f2937" stroke-width="22"/>${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="22" font-weight="900" fill="#e5e7eb" font-family="ui-monospace,monospace">${total.toFixed(1)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#6b7280" font-weight="700">KG CO₂e</text></svg></div><div class="legend">${segs.filter(s=>s.value>0).map(s=>`<div class="leg"><div class="leg-d" style="background:${s.color}"></div><div class="leg-n">${s.name}</div><div class="leg-v">${s.value.toFixed(1)} kg</div></div>`).join('')}</div></div>`;
}
function barChart(data,w=500,h=200){
const max=Math.max(...data.map(d=>d.value),1),pad=30,bw=(w-pad*2)/data.length;
const grad='<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>';
const bars=data.map((d,i)=>{const bh=Math.max(2,(d.value/max)*(h-pad*2));const x=pad+i*bw+bw*.15;const y=h-pad-bh;return`<g><rect x="${x}" y="${y}" width="${bw*.7}" height="${bh}" fill="url(#bg1)" rx="4"><title>${d.label}: ${d.value.toFixed(2)} kg</title></rect><text x="${x+bw*.35}" y="${h-10}" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">${d.label}</text>${d.value>0?`<text x="${x+bw*.35}" y="${y-6}" font-size="9" fill="#9ca3af" text-anchor="middle" font-family="ui-monospace,monospace">${d.value.toFixed(1)}</text>`:''}</g>`}).join('');
return`<svg class="bars" viewBox="0 0 ${w} ${h}">${grad}${bars}</svg>`;
}
function actHTML(a){
const m=CAT_META[a.category],f=FACTORS[a.category]?.[a.type];
const dt=new Date(a.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
return`<div class="act"><div class="act-ic" style="background:${m.color}22;color:${m.color}">${f?.ic||m.ic}</div><div class="act-i"><div class="act-n">${f?.n||a.type}</div><div class="act-m">${a.quantity} ${f?.u||''} · ${dt}</div></div><div class="act-c">${a.co2.toFixed(2)} kg</div><button class="act-del" data-del="${a.id}">✕</button></div>`;
}
function attachDel(){document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDel(b.dataset.del))}

function renderDash(){
const total=totalCO2(),today=todayCO2(),week=weekCO2(),month=monthCO2();
document.getElementById('kpis').innerHTML=`
<div class="kpi" style="--a:#10b981"><div class="kpi-l">Total</div><div class="kpi-v">${total.toFixed(1)}</div><div class="kpi-s">kg CO₂e</div></div>
<div class="kpi" style="--a:#f59e0b"><div class="kpi-l">Hoje</div><div class="kpi-v">${today.toFixed(1)}</div><div class="kpi-s">kg CO₂e</div></div>
<div class="kpi" style="--a:#3b82f6"><div class="kpi-l">7 dias</div><div class="kpi-v">${week.toFixed(1)}</div><div class="kpi-s">kg CO₂e</div></div>
<div class="kpi" style="--a:#8b5cf6"><div class="kpi-l">30 dias</div><div class="kpi-v">${month.toFixed(1)}</div><div class="kpi-s">kg CO₂e</div></div>`;
document.getElementById('totalChip').textContent=total.toFixed(1)+' kg';
const cats=catTotals();
const segs=Object.keys(cats).map(k=>({name:CAT_META[k].name,value:cats[k],color:CAT_META[k].color}));
document.getElementById('donutChart').innerHTML=donutChart(segs);
document.getElementById('weeklyChart').innerHTML=barChart(last7());
const recent=state.activities.slice(-5).reverse();
document.getElementById('recent').innerHTML=recent.length?recent.map(actHTML).join(''):'<div class="empty"><div class="empty-ic">📭</div><p>Nenhuma atividade</p></div>';
attachDel();
document.getElementById('achs').innerHTML=ACHS.map(a=>{const u=a.test(state);if(u&&!state.achievements.includes(a.id)){state.achievements.push(a.id);saveState()}return`<div class="ach ${u?'on':''}"><div class="ic">${a.ic}</div><div class="nm">${a.nm}</div></div>`}).join('');
}

function renderAdd(){
document.getElementById('catTabs').innerHTML=Object.entries(CAT_META).map(([k,m])=>`<button class="cat-tab ${state.addCat===k?'on':''}" data-cat="${k}"><span class="ic">${m.ic}</span><span class="nm">${m.name}</span></button>`).join('');
document.querySelectorAll('.cat-tab').forEach(t=>t.onclick=()=>{state.addCat=t.dataset.cat;renderAdd()});
const factors=FACTORS[state.addCat];
const opts=Object.entries(factors).map(([k,f])=>`<option value="${k}">${f.ic} ${f.n} (${f.f} kg/${f.u})</option>`).join('');
document.getElementById('addForm').innerHTML=`
<div class="field"><label>Tipo</label><select id="fType">${opts}</select></div>
<div class="form-grid">
<div class="field"><label id="qtyLbl">Quantidade</label><input id="fQty" type="number" min="0" step="0.1" value="1"></div>
<div class="field"><label>Data/hora</label><input id="fDate" type="datetime-local"></div>
</div>
<div class="field"><label>Nota (opcional)</label><input id="fNote" placeholder="Ex: casa-trabalho"></div>
<div class="preview"><div class="preview-l">Pegada estimada</div><div class="preview-v" id="previewVal">0.00 kg</div></div>
<button class="btn btn-full mt-16" id="fAdd">➕ Adicionar</button>`;
const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
document.getElementById('fDate').value=now.toISOString().slice(0,16);
const updatePrev=()=>{const t=document.getElementById('fType').value,q=parseFloat(document.getElementById('fQty').value)||0;document.getElementById('previewVal').textContent=calcCO2(state.addCat,t,q).toFixed(2)+' kg';const f=factors[t];document.getElementById('qtyLbl').textContent=`Quantidade (${f?.u||''})`};
document.getElementById('fType').onchange=updatePrev;
document.getElementById('fQty').oninput=updatePrev;
updatePrev();
document.getElementById('fAdd').onclick=()=>{
const t=document.getElementById('fType').value;
const q=parseFloat(document.getElementById('fQty').value)||0;
const ds=document.getElementById('fDate').value;
const note=document.getElementById('fNote').value.trim();
if(q<=0){toast('Quantidade > 0','err');return}
if(!ds){toast('Data obrigatória','err');return}
state.activities.push({id:'a_'+Date.now(),category:state.addCat,type:t,quantity:q,co2:calcCO2(state.addCat,t,q),date:new Date(ds).toISOString(),note});
saveState();toast('✓ Adicionado!');
renderAll();switchView('dashboard');
};
}

function renderHist(){
const filters=['all',...Object.keys(CAT_META)];
document.getElementById('histFilters').innerHTML=filters.map(f=>`<button class="fbtn ${state.filter===f?'on':''}" data-f="${f}">${f==='all'?'🔍 Todos':CAT_META[f].ic+' '+CAT_META[f].name}</button>`).join('');
document.querySelectorAll('.fbtn').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;renderHist()});
let list=state.activities.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
if(state.filter!=='all')list=list.filter(a=>a.category===state.filter);
document.getElementById('histCount').textContent=list.length+' ativ.';
document.getElementById('histList').innerHTML=list.length?list.map(actHTML).join(''):'<div class="empty"><div class="empty-ic">📭</div><p>Nenhuma atividade</p></div>';
attachDel();
}

function renderGoals(){
const w=weekCO2(),m=monthCO2();
const wp=Math.min(100,(w/state.goals.weekly)*100);
const mp=Math.min(100,(m/state.goals.monthly)*100);
document.getElementById('goalsContent').innerHTML=`
<div class="prog-wrap">
<div class="prog-h"><div class="prog-l">🎯 Meta semanal</div><div class="prog-v">${w.toFixed(1)} / ${state.goals.weekly} kg</div></div>
<div class="prog-bar"><div class="prog-fill" style="width:${wp}%;${wp>100?'background:#ef4444':''}"></div></div>
<div class="mt-16"><div class="field"><label>Definir meta (kg/semana)</label><input type="number" id="wGoal" min="1" value="${state.goals.weekly}"></div></div>
</div>
<div class="prog-wrap">
<div class="prog-h"><div class="prog-l">🎯 Meta mensal</div><div class="prog-v">${m.toFixed(1)} / ${state.goals.monthly} kg</div></div>
<div class="prog-bar"><div class="prog-fill" style="width:${mp}%;${mp>100?'background:#ef4444':''}"></div></div>
<div class="mt-16"><div class="field"><label>Definir meta (kg/mês)</label><input type="number" id="mGoal" min="1" value="${state.goals.monthly}"></div></div>
</div>
<button class="btn btn-full mt-16" id="saveGoals">💾 Salvar metas</button>
<div class="mt-16" style="padding:16px;background:var(--card2);border-radius:10px;font-size:12px;color:var(--mut);line-height:1.6">💡 <b style="color:var(--txt2)">Meta ideal:</b> ~38kg/semana (2t/ano = limite climático sustentável).</div>`;
document.getElementById('saveGoals').onclick=()=>{
state.goals.weekly=parseFloat(document.getElementById('wGoal').value)||20;
state.goals.monthly=parseFloat(document.getElementById('mGoal').value)||80;
saveState();toast('✓ Metas salvas!');renderGoals();
};
}

function renderInsights(){
const total=totalCO2(),month=monthCO2(),cats=catTotals();
const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
const trees=total/21.77,carKm=total/0.192,avgDay=month/30;
const yearEst=avgDay*365;
const ins=[];
if(total===0)ins.push({c:'info',t:'🌱 Comece agora',x:'Adicione sua primeira atividade.'});
else{
if(topCat&&topCat[1]>0){const m=CAT_META[topCat[0]];ins.push({c:'warn',t:`${m.ic} ${m.name} é sua maior fonte`,x:`${topCat[1].toFixed(1)} kg (${((topCat[1]/total)*100).toFixed(0)}% do total). Reduza isso primeiro.`})}
if(avgDay>12)ins.push({c:'warn',t:'⚠️ Consumo alto',x:`Média ${avgDay.toFixed(1)} kg/dia — acima da média Brasil (~12kg).`});
else ins.push({c:'',t:'✅ Consumo controlado',x:`Média ${avgDay.toFixed(1)} kg/dia. Continue assim!`});
if(cats.food>total*0.3)ins.push({c:'warn',t:'🥩 Alimentação pesada',x:'Comida > 30% da pegada. Trocar carne 2x/semana = -10kg/mês.'});
if(cats.transport>total*0.4)ins.push({c:'warn',t:'🚗 Transporte dominante',x:'Bike ou transporte público 2x/semana = -20kg/mês.'});
if(cats.energy>total*0.25)ins.push({c:'info',t:'⚡ Energia',x:'Aparelhos em standby consomem até 10%. Desligue da tomada.'});
if(total>21.77)ins.push({c:'info',t:`🌳 Precisa ${trees.toFixed(1)} árvores`,x:`Equivalente a ${trees.toFixed(1)} árvores/ano para compensar.`});
}
document.getElementById('insightsContent').innerHTML=`
<div class="card"><div class="card-title">💡 Insights personalizados</div>${ins.map(i=>`<div class="insight ${i.c}"><div class="ins-t">${i.t}</div><div class="ins-x">${i.x}</div></div>`).join('')}</div>
<div class="card"><div class="card-title">🌍 Comparação anual</div>
<div class="compare">
<div class="cmp you"><div class="k">Você (projetado)</div><div class="v">${yearEst.toFixed(0)} kg</div></div>
<div class="cmp avg"><div class="k">Média Brasil</div><div class="v">4380 kg</div></div>
<div class="cmp best"><div class="k">Meta 2030</div><div class="v">2000 kg</div></div>
</div>
<div class="mt-16" style="font-size:13px;color:var(--txt2);line-height:1.6;padding:16px;background:var(--card2);border-radius:10px">
${yearEst<2000?'🎉 <b style="color:var(--green)">Você já está abaixo da meta 2030!</b> Continue monitorando.':'📉 <b>Reduza '+(yearEst-2000).toFixed(0)+'kg/ano</b> para atingir a meta climática 2030. Cada kg conta.'}
</div>
</div>
<div class="card"><div class="card-title">🧮 Equivalências</div>
<div class="compare">
<div class="cmp"><div class="k">🌳 Árvores/ano</div><div class="v">${trees.toFixed(1)}</div></div>
<div class="cmp"><div class="k">🚗 Km de carro</div><div class="v">${carKm.toFixed(0)}</div></div>
<div class="cmp"><div class="k">📱 Smartphones</div><div class="v">${(total/50).toFixed(1)}</div></div>
</div></div>`;
}

function renderLearn(){
document.getElementById('learnGrid').innerHTML=LEARN_CARDS.map(c=>`<div class="lcard"><div class="ic">${c.ic}</div><h3>${c.t}</h3><p>${c.d}</p></div>`).join('');
}

function renderAll(){renderDash();renderAdd();renderHist();renderGoals();renderInsights();renderLearn()}

function switchView(v){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.dataset.v===v));
if(v==='dashboard')renderDash();
else if(v==='add')renderAdd();
else if(v==='history')renderHist();
else if(v==='goals')renderGoals();
else if(v==='insights')renderInsights();
else if(v==='learn')renderLearn();
window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));

function toast(msg,type){
const t=document.getElementById('toast');
t.textContent=msg;t.className='toast on'+(type==='err'?' err':'');
clearTimeout(toast._t);
toast._t=setTimeout(()=>t.className='toast',2400);
}

function confirmDel(id){
const a=state.activities.find(x=>x.id===id);if(!a)return;
document.getElementById('mTitle').textContent='Excluir atividade?';
document.getElementById('mText').textContent='Isso não pode ser desfeito.';
document.getElementById('modal').classList.add('on');
document.getElementById('mConfirm').onclick=()=>{
state.activities=state.activities.filter(x=>x.id!==id);
saveState();document.getElementById('modal').classList.remove('on');
toast('Atividade excluída');renderAll();
};
}
document.getElementById('mCancel').onclick=()=>document.getElementById('modal').classList.remove('on');

async function fetchCarbonIntensity(){
try{
const r=await fetch('https://api.carbonintensity.org.uk/intensity',{signal:AbortSignal.timeout(5000)});
const d=await r.json();
const v=d?.data?.[0]?.intensity?.actual;
if(v){document.getElementById('ci').textContent=v+' g/kWh';return}
}catch(e){}
document.getElementById('ci').textContent='38 g/kWh (BR)';
}

loadState();seedData();renderAll();fetchCarbonIntensity();
setInterval(fetchCarbonIntensity,300000);
</script>
</body>
