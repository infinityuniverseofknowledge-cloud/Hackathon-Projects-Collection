controls:function(){var l=STATE.lqr;return '<div class="sec"><h4>Cost weights</h4><div class="ctrl"><div class="lbl"><span>Q11 (state 1)</span><span>'+l.Q[0][0]+'</span></div><input type="range" min="0.1" max="100" step="1" value="'+l.Q[0][0]+'" oninput="STATE.lqr.Q=[[parseFloat(this.value),0],[0,1]];MODULES.lqr.reset();renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>R (control)</span><span>'+l.R[0][0]+'</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+l.R[0][0]+'" oninput="STATE.lqr.R=[[parseFloat(this.value)]];MODULES.lqr.reset();renderLeftPanel()"></div></div><div class="sec"><h4>Optimal K</h4><div class="kv"><div class="row"><span class="k">K1</span><span class="v">'+fmt(l.K[0][0],4)+'</span></div><div class="row"><span class="k">K2</span><span class="v">'+fmt(l.K[0][1],4)+'</span></div></div></div><button class="btn primary full" onclick="MODULES.lqr.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>LQR</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Objective:</b><br>J = ∫(xᵀQx + uᵀRu) dt<br><br><b>Optimal control:</b><br>u* = −K·x<br>K = R⁻¹BᵀP<br><br><b>Riccati equation:</b><br>AᵀP + PA − PBR⁻¹BᵀP + Q = 0<br><br><b>Properties:</b><br>• Optimal (quadratic cost)<br>• Stabilizing (closed loop stable)<br>• Robustness margins 60° PM, 6 dB GM<br>• State feedback (full state needed)<br><br><b>Tuning:</b><br>Q large → aggressive state control<br>R large → penalize control effort<br><br><b>Extensions:</b><br>• LQG (LQR + Kalman)<br>• LQR with integral action<br>• Preview control<br>• Constrained LQR<br><br><b>Applications:</b><br>Robotics, aerospace, drones, vehicles</div></div>'}});
registerModule('mpc',{title:'MPC',icon:'🔮',desc:'Model Predictive Control with horizon',cat:'control',init:function(){this.reset()},
reset:function(){var m=STATE.mpc;m.x=[1,0];m.t=0;m.history=[];m.u_hist=[];m.predicted=[]},
step:function(dt){var m=STATE.mpc;var A=[[1,0.1],[0,1]],B=[[0],[0.1]];var u=-0.8*m.x[0]-0.5*m.x[1];u=clamp(u,-5,5);var Ax=matVec(A,m.x);var Bu=matVec(B,[u]);m.x=Ax.map(function(v,i){return v+Bu[i]});m.t+=dt;m.history.push({t:m.t,x0:m.x[0],x1:m.x[1]});m.u_hist.push({t:m.t,u:u});m.predicted=[];var xp=m.x.slice();for(var h=0;h<m.horizon;h++){var up=-0.8*xp[0]-0.5*xp[1];var Axp=matVec(A,xp);var Bup=matVec(B,[up]);xp=Axp.map(function(v,i){return v+Bup[i]});m.predicted.push({h:h+1,x0:xp[0],x1:xp[1]})}if(m.history.length>1000)m.history.shift();if(m.u_hist.length>1000)m.u_hist.shift()},
tick:function(dt){STATE.time+=dt;var m=STATE.mpc;if(!STATE.playing)return;for(var i=0;i<3;i++)this.step(dt/3)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var m=STATE.mpc;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('MPC — Horizon='+m.horizon+' · x=('+fmt(m.x[0],2)+','+fmt(m.x[1],2)+')',24,32);var px=60,py=60,pw=W-140,ph=H*0.5;drawAxes(ctx,px,py,pw,ph,'time','x');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();m.history.forEach(function(h,i){var x=px+i/Math.max(m.history.length,1)*pw;var y=py+ph/2-h.x0/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();m.history.forEach(function(h,i){var x=px+i/Math.max(m.history.length,1)*pw;var y=py+ph/2-h.x1/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var predictX=px+pw*0.95;ctx.strokeStyle='rgba(64,255,144,.4)';ctx.setLineDash([4,4]);ctx.beginPath();m.predicted.forEach(function(p,i){var x=predictX+i/Math.max(m.predicted.length,1)*pw*0.15;var y=py+ph/2-p.x0/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#40ff90';ctx.font='10px monospace';ctx.fillText('prediction',predictX-20,py+15);setStats('<div>x1: '+fmt(m.x[0],3)+'</div><div>x2: '+fmt(m.x[1],3)+'</div><div>H: '+m.horizon+'</div>');badge('🔮 MPC · H='+m.horizon);SV('sbX',fmt(m.x[0],2));SV('sbTheta',fmt(m.x[1],2));SV('sbU','—');SV('sbE','—');SV('sbTau','—')},
controls:function(){var m=STATE.mpc;return '<div class="sec"><h4>Horizon</h4><div class="ctrl"><div class="lbl"><span>N steps</span><span>'+m.horizon+'</span></div><input type="range" min="3" max="30" step="1" value="'+m.horizon+'" oninput="STATE.mpc.horizon=parseInt(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.mpc.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>MPC</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Problem:</b><br>min Σ (xᵀQx + uᵀRu) + xᵀNQxN<br>s.t. x[k+1] = Ax[k] + Bu[k]<br>x ∈ X, u ∈ U (constraints)<br><br><b>Receding horizon:</b><br>1. Solve QP over horizon N<br>2. Apply first control u[0]<br>3. Shift horizon, repeat<br><br><b>Properties:</b><br>• Handles constraints naturally<br>• Optimal over horizon<br>• Robust to disturbance<br>• Computational cost O(N³)<br><br><b>Solver:</b><br>QP → Active set, interior point<br>Explicit MPC (precomputed)<br><br><b>Applications:</b><br>• Chemical plants<br>• Refineries<br>• Robotics<br>• Autonomous driving<br>• SpaceX boosters<br>• Grid control</div></div>'}});
registerModule('polePlace',{title:'Pole Placement',icon:'⚙',desc:'Ackermann formula for pole placement',cat:'control',init:function(){this.reset()},
reset:function(){var p=STATE.polePlace;p.x=[1,0];p.t=0;p.history=[];var charPoly=[1,-(p.poles[0]+p.poles[1]),p.poles[0]*p.poles[1]];var phiA=matAdd(matAdd(matScale(matEye(2),charPoly[0]),matScale(p.A,charPoly[1])),matScale(matMul(p.A,p.A),charPoly[2]));var invC=matInv(p.B);var K=matMul(matMul([[phiA[1][0],phiA[1][1]]],matInv(p.B)),[[0,1]]);var M=matMul(p.B,[[0,1]]);var Ctrb=[[p.B[0][0],p.A[0][1]],[p.B[1][0],p.A[1][1]]];var Ctrb2=matAdd(p.B,matMul(p.A,p.B));Ctrb=[[p.B[0][0],Ctrb2[0][0]],[p.B[1][0],Ctrb2[1][0]]];var last=[[0,1]];var W=matMul(last,matInv(Ctrb));var a1=-(p.A[0][0]+p.A[1][1]);var a0=p.A[0][0]*p.A[1][1]-p.A[0][1]*p.A[1][0];var phiA2=matAdd(matAdd(matEye(2),matScale(p.A,a1)),matScale(matMul(p.A,p.A),a0));var d1=-(p.poles[0]+p.poles[1]);var d0=p.poles[0]*p.poles[1];var phiAd=matAdd(matAdd(matEye(2),matScale(p.A,d1)),matScale(matMul(p.A,p.A),d0));var Kmat=matMul(matMul([[0,1]],matInv(Ctrb)),phiAd);p.K=[Kmat[0][0],Kmat[0][1]];p.Kactual=p.K},
step:function(dt){var p=STATE.polePlace;var u=-(p.K[0]*p.x[0]+p.K[1]*p.x[1]);u=clamp(u,-10,10);var Ax=matVec(p.A,p.x);var Bu=matVec(p.B,[u]);var dx=Ax.map(function(v,i){return v+Bu[i]});p.x=p.x.map(function(v,i){return v+dx[i]*dt});p.t+=dt;p.history.push({t:p.t,x0:p.x[0],x1:p.x[1],u:u});if(p.history.length>1000)p.history.shift()},
tick:function(dt){STATE.time+=dt;var p=STATE.polePlace;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var p=STATE.polePlace;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('POLE PLACEMENT — poles=('+p.poles[0]+','+p.poles[1]+') · K=('+fmt(p.K[0],2)+','+fmt(p.K[1],2)+')',24,32);var px=60,py=60,pw=W-140,ph=H*0.4;drawAxes(ctx,px,py,pw,ph,'time','states');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();p.history.forEach(function(h,i){var x=px+i/Math.max(p.history.length,1)*pw;var y=py+ph/2-h.x0/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();p.history.forEach(function(h,i){var x=px+i/Math.max(p.history.length,1)*pw;var y=py+ph/2-h.x1/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('x1',px+10,py+15);ctx.fillStyle='#ff8c30';ctx.fillText('x2',px+40,py+15);var s=py+ph+40;ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('Complex plane:',px,s+15);var cx=px+pw*0.4,cy=s+100;ctx.strokeStyle='rgba(0,212,255,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-150,cy);ctx.lineTo(cx+150,cy);ctx.moveTo(cx,cy-80);ctx.lineTo(cx,cy+80);ctx.stroke();ctx.fillStyle='rgba(64,255,144,.08)';ctx.fillRect(cx-150,cy-80,150,160);p.poles.forEach(function(pl){if(Math.abs(pl)<150){ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(cx+pl*30,cy,6,0,Math.PI*2);ctx.fill()}});ctx.fillStyle='#ff4080';ctx.font='10px monospace';ctx.fillText('desired poles',cx-150,cy-85);setStats('<div>x1: '+fmt(p.x[0],3)+'</div><div>x2: '+fmt(p.x[1],3)+'</div>');badge('⚙ Pole Place');SV('sbX',fmt(p.x[0],2));SV('sbTheta',fmt(p.x[1],2));SV('sbU',fmt(p.K[0],2));SV('sbE',fmt(p.K[1],2));SV('sbTau','—')},
controls:function(){var p=STATE.polePlace;return '<div class="sec"><h4>Desired poles</h4><div class="ctrl"><div class="lbl"><span>s1</span><span>'+p.poles[0]+'</span></div><input type="range" min="-5" max="0" step="0.1" value="'+p.poles[0]+'" oninput="STATE.polePlace.poles=[parseFloat(this.value),STATE.polePlace.poles[1]];MODULES.polePlace.reset()"></div><div class="ctrl"><div class="lbl"><span>s2</span><span>'+p.poles[1]+'</span></div><input type="range" min="-5" max="0" step="0.1" value="'+p.poles[1]+'" oninput="STATE.polePlace.poles=[STATE.polePlace.poles[0],parseFloat(this.value)];MODULES.polePlace.reset()"></div></div><div class="sec"><h4>Computed K</h4><div class="kv"><div class="row"><span class="k">K1</span><span class="v">'+fmt(p.K[0],4)+'</span></div><div class="row"><span class="k">K2</span><span class="v">'+fmt(p.K[1],4)+'</span></div></div></div><button class="btn primary full" onclick="MODULES.polePlace.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>Pole Placement</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Problem:</b><br>Choose K such that eigenvalues of (A − BK) match desired poles<br><br><b>Ackermann formula:</b><br>K = [0 0 ... 1]·C⁻¹·φ(A)<br>φ(A) = A^n + a_{n-1}A^{n-1} + ... + a_0 I<br>C = controllability matrix<br><br><b>Stability:</b><br>All poles in LHP (Re &lt; 0)<br>Faster pole → faster response<br>Far LHP → high gain → noise amplification<br><br><b>Trade-offs:</b><br>• Fast poles: fast response, high gain, more noise<br>• Slow poles: sluggish<br>• Complex: oscillatory<br>• Repeated: root locus<br><br><b>Applications:</b><br>• Motor control<br>• Flight control<br>• Robotics<br>• Power systems<br><br><b>Limitations:</b><br>Requires full state feedback<br>Full controllability<br>Sensitive to model errors</div></div>'}});
registerModule('rootLocus',{title:'Root Locus',icon:'🌿',desc:'Root locus plot as K varies',cat:'control',init:function(){this.reset()},
reset:function(){var r=STATE.rootLocus;r.Kvals=[];r.loci=[];for(var K=0.01;K<=20;K+=0.2){var den=[1,3,2+K];var poles=[];var disc=9-4*(2+K);if(disc>=0){poles=[(-3+Math.sqrt(disc))/2,(-3-Math.sqrt(disc))/2]}else{poles=[{re:-1.5,im:Math.sqrt(-disc)/2},{re:-1.5,im:-Math.sqrt(-disc)/2}]}r.loci.push({K:K,poles:poles})}r.current=r.loci[Math.floor(r.loci.length/2)]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var r=STATE.rootLocus;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('ROOT LOCUS — K='+r.K.toFixed(2),24,32);var cx=W/2,cy=H/2,scale=Math.min(W,H)/15;ctx.strokeStyle='rgba(0,212,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-250);ctx.lineTo(cx,cy+250);ctx.stroke();ctx.fillStyle='rgba(64,255,144,.05)';ctx.fillRect(cx-300,cy-250,300,500);ctx.fillStyle='#405870';ctx.font='10px monospace';ctx.fillText('Re',cx+280,cy-8);ctx.fillText('Im',cx+8,cy-240);ctx.fillText('LHP',cx-280,cy-240);ctx.fillText('RHP',cx+20,cy-240);r.loci.forEach(function(l){var color='hsl('+(l.K*15)+',80%,60%)';ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();var poles=l.poles;var coords=poles.map(function(pl){if(typeof pl==='number')return{x:cx+pl*scale,y:cy};return{x:cx+pl.re*scale,y:cy-pl.im*scale}});if(coords.length===2){ctx.moveTo(coords[0].x,coords[0].y);ctx.lineTo(coords[1].x,coords[1].y)}ctx.stroke()});var poles=r.current.poles;poles.forEach(function(pl){var x,y;if(typeof pl==='number'){x=cx+pl*scale;y=cy}else{x=cx+pl.re*scale;y=cy-pl.im*scale}ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()});setStats('<div>K: '+fmt(r.K,2)+'</div><div>Poles: 2</div>');badge('🌿 Root Locus · K='+r.K);SV('sbX','—');SV('sbTheta','—');SV('sbU','—');SV('sbE','—');SV('sbTau',r.K.toFixed(2))},
controls:function(){var r=STATE.rootLocus;return '<div class="sec"><h4>Gain K</h4><div class="ctrl"><div class="lbl"><span>K</span><span>'+r.K.toFixed(2)+'</span></div><input type="range" min="0" max="20" step="0.1" value="'+r.K+'" oninput="STATE.rootLocus.K=parseFloat(this.value);var den=[1,3,2+STATE.rootLocus.K];var disc=9-4*(2+STATE.rootLocus.K);if(disc>=0){STATE.rootLocus.current={poles:[(-3+Math.sqrt(disc))/2,(-3-Math.sqrt(disc))/2]}}else{STATE.rootLocus.current={poles:[{re:-1.5,im:Math.sqrt(-disc)/2},{re:-1.5,im:-Math.sqrt(-disc)/2}]}};renderLeftPanel()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Root Locus</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definition:</b><br>Plot of closed-loop poles as K varies from 0 to ∞<br>Closed loop: 1 + K·G(s)H(s) = 0<br><br><b>Rules (Evans):</b><br>1. Starts at open-loop poles (K=0)<br>2. Ends at zeros or infinity (K→∞)<br>3. n−m branches to infinity<br>4. Centroid: (Σpoles − Σzeros)/(n−m)<br>5. Asymptote angles: (2k+1)π/(n−m)<br>6. Breakaway points: dK/ds = 0<br>7. Angles of departure/arrival<br>8. Imaginary axis crossings (Routh)<br><br><b>Stability:</b><br>Poles must remain in LHP<br>K_max for stability<br><br><b>Applications:</b><br>• Loop tuning<br>• Stability analysis<br>• Gain selection<br>• Compensator design</div></div>'}});
registerModule('bode',{title:'Bode Plot',icon:'〰',desc:'Frequency response magnitude and phase',cat:'control',init:function(){this.reset()},
reset:function(){var b=STATE.bode;b.omega=[];b.mag=[];b.phase=[];for(var i=-2;i<=3;i+=0.05){var w=Math.pow(10,i);var s={re:0,im:w};var num=[1];var den=[1,2,1];var Gnum={re:1,im:0};var Gden={re:1-w*w,im:2*w};var G={re:(Gnum.re*Gden.re+Gnum.im*Gden.im)/(Gden.re*Gden.re+Gden.im*Gden.im),im:(Gnum.im*Gden.re-Gnum.re*Gden.im)/(Gden.re*Gden.re+Gden.im*Gden.im)};var mag=Math.sqrt(G.re*G.re+G.im*G.im);var phase=Math.atan2(G.im,G.re);b.omega.push(w);b.mag.push(20*Math.log10(mag));b.phase.push(deg(phase))}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var b=STATE.bode;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('BODE PLOT — Magnitude + Phase',24,32);var px=60,py=60,pw=W-140,ph=H*0.4;drawAxes(ctx,px,py,pw,ph,'ω (rad/s)','|G| dB');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();b.omega.forEach(function(w,i){var x=px+(Math.log10(w)+2)/5*pw;var y=py+ph/2-b.mag[i]/40*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('magnitude',px+10,py+15);var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'ω (rad/s)','∠ (deg)');ctx.strokeStyle='#ff8c30';ctx.lineWidth=2;ctx.beginPath();b.omega.forEach(function(w,i){var x=px+(Math.log10(w)+2)/5*pw;var y=p2+ph*0.6/2-b.phase[i]/180*ph*0.6/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff8c30';ctx.font='10px monospace';ctx.fillText('phase',px+10,p2+15);var wc=Math.sqrt(2);ctx.strokeStyle='rgba(255,64,128,.5)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px+(Math.log10(wc)+2)/5*pw,py);ctx.lineTo(px+(Math.log10(wc)+2)/5*pw,py+ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='10px monospace';ctx.fillText('ωc='+wc.toFixed(2),px+(Math.log10(wc)+2)/5*pw+5,py+15);setStats('<div>ωc: '+wc.toFixed(2)+'</div><div>PM: ~26°</div>');badge('〰 Bode Plot');SV('sbX','—');SV('sbTheta','—');SV('sbU','—');SV('sbE','—');SV('sbTau',wc.toFixed(2))},
controls:function(){return '<div class="sec"><h4>Transfer function</h4><div class="kv"><div class="row"><span class="k">G(s)</span><span class="v">1/(s²+2s+1)</span></div><div class="row"><span class="k">Poles</span><span class="v">-1, -1</span></div><div class="row"><span class="k">DC gain</span><span class="v">1 (0 dB)</span></div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Bode Plot</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Frequency response:</b><br>G(jω) = |G(jω)|·e^(j∠G(jω))<br><br><b>Magnitude:</b><br>20 log₁₀|G(jω)| (dB)<br><br><b>Phase:</b><br>∠G(jω) (degrees)<br><br><b>Key values:</b><br>• ωc: crossover (0 dB)<br>• PM: phase margin<br>• ωp: phase crossover<br>• GM: gain margin<br><br><b>Stability margins:</b><br>GM &gt; 6 dB<br>PM &gt; 45°<br>Typical: GM 6-10 dB, PM 45-60°<br><br><b>Slopes:</b><br>• Pole: −20 dB/decade<br>• Zero: +20 dB/decade<br>• Integrator: −20<br>• Differentiator: +20<br><br><b>Applications:</b><br>• Loop stability<br>• Compensator design<br>• Filter design<br>• Robustness analysis<br>• Nyquist criterion</div></div>'}});
</script>
<script>
registerModule('dh',{title:'DH Parameters',icon:'🔗',desc:'Denavit-Hartenberg forward kinematics',cat:'kinematics',init:function(){this.compute()},
compute:function(){var d=STATE.dh;d.T=matEye(4);d.frames=[d.T];d.links.forEach(function(link){var A=DH(link.theta,link.d,link.a,link.alpha);d.T=matMul(d.T,A);d.frames.push(d.T)});d.ee=[d.T[0][3],d.T[1][3],d.T[2][3]]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var d=STATE.dh;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('DH PARAMETERS — End Effector: ('+fmt(d.ee[0],3)+','+fmt(d.ee[1],3)+','+fmt(d.ee[2],3)+')',24,32);var cx=W/2,cy=H*0.7,scale=80;ctx.strokeStyle='#00d4ff';ctx.lineWidth=6;ctx.lineCap='round';var x=cx,y=cy;d.frames.forEach(function(T,i){if(i===0)return;var px=cx+T[0][3]*scale;var py=cy-T[1][3]*scale;ctx.strokeStyle='hsl('+(i*60)+',80%,60%)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(i,px,py+4);ctx.textAlign='left';x=px;y=py});ctx.lineCap='butt';ctx.fillStyle='rgba(0,212,255,.9)';ctx.fillRect(cx-5,cy-5,10,10);ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('EE',x+15,y-15);ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('Base',cx-15,cy+25);var ix=W-300,iy=60;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('KINEMATIC CHAIN',ix+10,iy+22);d.links.forEach(function(l,i){ctx.fillStyle='#80b0d0';ctx.font='10px monospace';ctx.fillText('Link '+(i+1)+': a='+l.a+' α='+l.alpha,ix+10,iy+50+i*20);ctx.fillStyle='#00d4ff';ctx.fillText('d='+l.d+' θ='+fmt(l.theta,3),ix+150,iy+50+i*20)});setStats('<div>EE x: '+fmt(d.ee[0],3)+'</div><div>EE y: '+fmt(d.ee[1],3)+'</div>');badge('🔗 DH · EE=('+fmt(d.ee[0],2)+','+fmt(d.ee[1],2)+')');SV('sbX',fmt(d.ee[0],2));SV('sbTheta',fmt(d.ee[1],2));SV('sbU',fmt(d.ee[2],2));SV('sbE','—');SV('sbTau','—')},
controls:function(){var d=STATE.dh;var h='<div class="sec"><h4>Joint angles</h4>';d.links.forEach(function(link,i){h+='<div class="ctrl"><div class="lbl"><span>θ'+(i+1)+' (deg)</span><span>'+deg(link.theta).toFixed(1)+'°</span></div><input type="range" min="-180" max="180" step="1" value="'+deg(link.theta)+'" oninput="STATE.dh.links['+i+'].theta=rad(parseFloat(this.value));MODULES.dh.compute()"></div>'});h+='</div><div class="sec"><h4>Link lengths</h4>';d.links.forEach(function(link,i){h+='<div class="ctrl"><div class="lbl"><span>a'+(i+1)+'</span><span>'+link.a+'</span></div><input type="range" min="0.1" max="2" step="0.1" value="'+link.a+'" oninput="STATE.dh.links['+i+'].a=parseFloat(this.value);MODULES.dh.compute()"></div>'});h+='</div>';return h},
mathPanel:function(){return '<div class="sec"><h4>Denavit-Hartenberg</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>4 parameters per link:</b><br>• θ (theta): joint angle<br>• d: link offset<br>• a: link length<br>• α (alpha): link twist<br><br><b>Transform matrix:</b><br>Tᵢ = Rot_z(θ)·Trans_z(d)·Trans_x(a)·Rot_x(α)<br><br><b>Full chain:</b><br>T_0n = T_01 · T_12 · ... · T_(n-1)n<br><br><b>Convention:</b><br>• Standard (Denavit-Hartenberg)<br>• Modified (Craig)<br><br><b>Rules:</b><br>1. z_i is joint i+1 axis<br>2. x_i is common normal<br>3. Origin: z_i ∩ x_i<br>4. α: angle z_(i-1) to z_i about x_i<br><br><b>Applications:</b><br>• Industrial robots (6 DOF)<br>• Surgical robots<br>• Legged robots<br>• Humanoids (e.g., 30+ DOF)<br>• Mobile manipulators</div></div>'}});
registerModule('fk',{title:'Forward Kinematics',icon:'→',desc:'2-DOF planar arm FK',cat:'kinematics',init:function(){this.compute()},
compute:function(){var f=STATE.fk;var pos=fk2(f.t1,f.t2,f.l1,f.l2);f.x=pos.x;f.y=pos.y;f.angles=[{x:0,y:0},{x:f.l1*Math.cos(f.t1),y:f.l1*Math.sin(f.t1)},pos];f.trail.push({x:f.x,y:f.y});if(f.trail.length>300)f.trail.shift()},
tick:function(dt){STATE.time+=dt;var f=STATE.fk;if(!STATE.playing)return;f.t1+=0.01;f.t2+=0.02;this.compute()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var f=STATE.fk;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('FORWARD KINEMATICS — EE: ('+fmt(f.x,3)+','+fmt(f.y,3)+')',24,32);var cx=W/2,cy=H*0.65,scale=Math.min(W,H)/5;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-300);ctx.lineTo(cx,cy+300);ctx.stroke();ctx.strokeStyle='rgba(64,255,144,.3)';ctx.lineWidth=1;ctx.beginPath();f.trail.forEach(function(p,i){var x=cx+p.x*scale;var y=cy-p.y*scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#00d4ff';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+f.angles[1].x*scale,cy-f.angles[1].y*scale);ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(cx+f.angles[1].x*scale,cy-f.angles[1].y*scale);ctx.lineTo(cx+f.x*scale,cy-f.y*scale);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+f.angles[1].x*scale,cy-f.angles[1].y*scale,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(cx+f.x*scale,cy-f.y*scale,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('EE',cx+f.x*scale,cy-f.y*scale+4);ctx.textAlign='left';setStats('<div>EE x: '+fmt(f.x,3)+'</div><div>EE y: '+fmt(f.y,3)+'</div><div>θ1: '+fmt(deg(f.t1),1)+'°</div>');badge('→ FK · EE=('+fmt(f.x,2)+','+fmt(f.y,2)+')');SV('sbX',fmt(f.x,2));SV('sbTheta',fmt(f.y,2));SV('sbU',fmt(deg(f.t1),0)+'°');SV('sbE',fmt(deg(f.t2),0)+'°');SV('sbTau','—')},
controls:function(){var f=STATE.fk;return '<div class="sec"><h4>Joint angles</h4><div class="ctrl"><div class="lbl"><span>θ1 (°)</span><span>'+deg(f.t1).toFixed(1)+'</span></div><input type="range" min="-180" max="180" step="1" value="'+deg(f.t1)+'" oninput="STATE.fk.t1=rad(parseFloat(this.value));MODULES.fk.compute()"></div><div class="ctrl"><div class="lbl"><span>θ2 (°)</span><span>'+deg(f.t2).toFixed(1)+'</span></div><input type="range" min="-180" max="180" step="1" value="'+deg(f.t2)+'" oninput="STATE.fk.t2=rad(parseFloat(this.value));MODULES.fk.compute()"></div></div><div class="sec"><h4>Link lengths</h4><div class="ctrl"><div class="lbl"><span>L1</span><span>'+f.l1+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+f.l1+'" oninput="STATE.fk.l1=parseFloat(this.value);MODULES.fk.compute()"></div><div class="ctrl"><div class="lbl"><span>L2</span><span>'+f.l2+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+f.l2+'" oninput="STATE.fk.l2=parseFloat(this.value);MODULES.fk.compute()"></div></div><button class="btn primary full" onclick="STATE.fk.trail=[]">Clear trail</button>'},mathPanel:function(){return '<div class="sec"><h4>Forward Kinematics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>2-DOF planar arm:</b><br>x = l1·cos(θ1) + l2·cos(θ1+θ2)<br>y = l1·sin(θ1) + l2·sin(θ1+θ2)<br><br><b>General n-DOF:</b><br>p_ee = T_0n · [0,0,0,1]ᵀ<br>T_0n = Π DH matrices<br><br><b>Denavit-Hartenberg:</b><br>T_i = Rot_z(θ)·Trans_z(d)·Trans_x(a)·Rot_x(α)<br><br><b>Pose:</b><br>Position (x,y,z) + Orientation (R matrix 3×3)<br>Total 6 DOF (SE(3) group)<br><br><b>Applications:</b><br>• Path planning<br>• Collision detection<br>• Visual servoing<br>• Calibration<br>• Robot simulation</div></div>'}});
registerModule('ik',{title:'Inverse Kinematics',icon:'←',desc:'Analytical IK for 2-DOF arm',cat:'kinematics',init:function(){this.compute()},
compute:function(){var i=STATE.ik;var sol=invKin2(i.targetX,i.targetY,i.l1,i.l2);if(sol){i.t1=sol.t1;i.t2=sol.t2;i.solutions=[sol];var pos=fk2(i.t1,i.t2,i.l1,i.l2);i.trail.push({x:pos.x,y:pos.y});if(i.trail.length>300)i.trail.shift()}else{i.solutions=[]}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var i=STATE.ik;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('INVERSE KINEMATICS — Target: ('+fmt(i.targetX,2)+','+fmt(i.targetY,2)+')',24,32);var cx=W/2,cy=H*0.65,scale=Math.min(W,H)/5;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-300);ctx.lineTo(cx,cy+300);ctx.stroke();ctx.strokeStyle='rgba(64,255,144,.2)';ctx.beginPath();i.trail.forEach(function(p,idx){var x=cx+p.x*scale;var y=cy-p.y*scale;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,64,128,.5)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx,cy,Math.sqrt(i.targetX*i.targetX+i.targetY*i.targetY)*scale,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);if(i.solutions.length){var pos1={x:i.l1*Math.cos(i.t1),y:i.l1*Math.sin(i.t1)};var pos2=fk2(i.t1,i.t2,i.l1,i.l2);ctx.strokeStyle='#00d4ff';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.lineTo(cx+pos2.x*scale,cy-pos2.y*scale);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+pos1.x*scale,cy-pos1.y*scale,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(cx+pos2.x*scale,cy-pos2.y*scale,10,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#ff4080';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+i.targetX*scale-15,cy-i.targetY*scale-15);ctx.lineTo(cx+i.targetX*scale+15,cy-i.targetY*scale+15);ctx.moveTo(cx+i.targetX*scale-15,cy-i.targetY*scale+15);ctx.lineTo(cx+i.targetX*scale+15,cy-i.targetY*scale-15);ctx.stroke();setStats('<div>Target x: '+fmt(i.targetX,2)+'</div><div>Target y: '+fmt(i.targetY,2)+'</div><div>θ1: '+fmt(deg(i.t1),1)+'°</div>');badge('← IK · '+(i.solutions.length?'reachable':'out of range'));SV('sbX',fmt(i.targetX,2));SV('sbTheta',fmt(i.targetY,2));SV('sbU',fmt(deg(i.t1),0)+'°');SV('sbE',fmt(deg(i.t2),0)+'°');SV('sbTau','—')},
controls:function(){var i=STATE.ik;return '<div class="sec"><h4>Target</h4><div class="ctrl"><div class="lbl"><span>X</span><span>'+i.targetX.toFixed(2)+'</span></div><input type="range" min="-2.5" max="2.5" step="0.05" value="'+i.targetX+'" oninput="STATE.ik.targetX=parseFloat(this.value);MODULES.ik.compute()"></div><div class="ctrl"><div class="lbl"><span>Y</span><span>'+i.targetY.toFixed(2)+'</span></div><input type="range" min="-2.5" max="2.5" step="0.05" value="'+i.targetY+'" oninput="STATE.ik.targetY=parseFloat(this.value);MODULES.ik.compute()"></div></div><div class="sec"><h4>Arm</h4><div class="ctrl"><div class="lbl"><span>L1</span><span>'+i.l1+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+i.l1+'" oninput="STATE.ik.l1=parseFloat(this.value);MODULES.ik.compute()"></div><div class="ctrl"><div class="lbl"><span>L2</span><span>'+i.l2+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+i.l2+'" oninput="STATE.ik.l2=parseFloat(this.value);MODULES.ik.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Inverse Kinematics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Problem:</b><br>Given target position, find joint angles<br><br><b>2-DOF analytical:</b><br>cos θ2 = (x²+y²−l1²−l2²)/(2·l1·l2)<br>θ2 = ±atan2(√(1−cos²θ2), cos θ2)<br>θ1 = atan2(y,x) − atan2(l2·sin θ2, l1+l2·cos θ2)<br><br><b>Two solutions:</b><br>• Elbow up: θ2 &gt; 0<br>• Elbow down: θ2 &lt; 0<br>• Reachable: x²+y² ≤ (l1+l2)²<br><br><b>General methods:</b><br>• Analytical (closed form)<br>• Jacobian transpose<br>• Jacobian pseudoinverse<br>• Damped least squares<br>• CCD (Cyclic Coordinate Descent)<br>• FABRIK<br>• Optimization (TRAC-IK, KDL)<br><br><b>Challenges:</b><br>• Multiple solutions<br>• Singularities<br>• Joint limits<br>• Redundancy (7-DOF)<br>• Collision constraints</div></div>'}});
registerModule('jacobian',{title:'Jacobian',icon:'◫',desc:'Differential kinematics and singularities',cat:'kinematics',init:function(){this.compute()},
compute:function(){var j=STATE.jacobian;j.J=jacobian2(j.t1,j.t2,j.l1,j.l2);j.det=j.J[0][0]*j.J[1][1]-j.J[0][1]*j.J[1][0];j.singular=Math.abs(j.det)<0.01},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var j=STATE.jacobian;ctx.fillStyle=j.singular?'#ff4080':'#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('JACOBIAN — det(J)='+fmt(j.det,4)+(j.singular?' [SINGULAR]':''),24,32);var cx=W/2,cy=H*0.7,scale=Math.min(W,H)/5;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-300);ctx.lineTo(cx,cy+300);ctx.stroke();var pos1={x:j.l1*Math.cos(j.t1),y:j.l1*Math.sin(j.t1)};var pos2=fk2(j.t1,j.t2,j.l1,j.l2);ctx.strokeStyle='#00d4ff';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.lineTo(cx+pos2.x*scale,cy-pos2.y*scale);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(cx+pos2.x*scale,cy-pos2.y*scale,10,0,Math.PI*2);ctx.fill();var eeX=cx+pos2.x*scale,eeY=cy-pos2.y*scale;drawArrow(ctx,eeX,eeY,eeX+j.J[0][0]*scale,eeY-j.J[1][0]*scale,'#a060ff',2);drawArrow(ctx,eeX,eeY,eeX+j.J[0][1]*scale,eeY-j.J[1][1]*scale,'#ff4080',2);ctx.fillStyle='#a060ff';ctx.font='10px monospace';ctx.fillText('∂p/∂θ1',eeX+j.J[0][0]*scale+5,eeY-j.J[1][0]*scale);ctx.fillStyle='#ff4080';ctx.fillText('∂p/∂θ2',eeX+j.J[0][1]*scale+5,eeY-j.J[1][1]*scale);var ix=W-300,iy=60;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(ix,iy,280,140);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,140);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('JACOBIAN MATRIX',ix+10,iy+22);ctx.font='10px monospace';ctx.fillStyle='#80b0d0';ctx.fillText('[ '+fmt(j.J[0][0],3)+'  '+fmt(j.J[0][1],3)+' ]',ix+10,iy+50);ctx.fillText('[ '+fmt(j.J[1][0],3)+'  '+fmt(j.J[1][1],3)+' ]',ix+10,iy+70);ctx.fillStyle='#40ff90';ctx.fillText('det = '+fmt(j.det,4),ix+10,iy+100);ctx.fillStyle=j.singular?'#ff4080':'#40ff90';ctx.fillText(j.singular?'SINGULAR':'NON-SINGULAR',ix+10,iy+120);setStats('<div>det: '+fmt(j.det,3)+'</div><div>'+(j.singular?'singular':'OK')+'</div>');badge('◫ Jacobian · det='+fmt(j.det,2));SV('sbX',fmt(j.J[0][0],2));SV('sbTheta',fmt(j.J[0][1],2));SV('sbU',fmt(j.J[1][0],2));SV('sbE',fmt(j.J[1][1],2));SV('sbTau',fmt(j.det,3))},
controls:function(){var j=STATE.jacobian;return '<div class="sec"><h4>Joint angles</h4><div class="ctrl"><div class="lbl"><span>θ1 (°)</span><span>'+deg(j.t1).toFixed(1)+'</span></div><input type="range" min="-180" max="180" step="1" value="'+deg(j.t1)+'" oninput="STATE.jacobian.t1=rad(parseFloat(this.value));MODULES.jacobian.compute()"></div><div class="ctrl"><div class="lbl"><span>θ2 (°)</span><span>'+deg(j.t2).toFixed(1)+'</span></div><input type="range" min="-180" max="180" step="1" value="'+deg(j.t2)+'" oninput="STATE.jacobian.t2=rad(parseFloat(this.value));MODULES.jacobian.compute()"></div></div><button class="btn full" onclick="STATE.jacobian.t1=0;STATE.jacobian.t2=0;MODULES.jacobian.compute()">Set singular pose</button>'},mathPanel:function(){return '<div class="sec"><h4>Jacobian</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definition:</b><br>ẋ = J(q)·q̇<br>J = ∂f(q)/∂q<br><br><b>2-DOF example:</b><br>J = [∂x/∂θ1  ∂x/∂θ2]<br>    [∂y/∂θ1  ∂y/∂θ2]<br><br><b>Singularity:</b><br>det(J) = 0<br>q̇_required → ∞ for Cartesian velocity<br>Examples: fully stretched, folded<br><br><b>Manipulability:</b><br>w = √det(J·Jᵀ)<br>Yoshikawa measure<br><br><b>Differential IK:</b><br>q̇ = J⁻¹·ẋ (square)<br>q̇ = J⁺·ẋ (pseudoinverse)<br>q̇ = Jᵀ(JJᵀ+λ²I)⁻¹ẋ (damped LS)<br><br><b>Applications:</b><br>• Velocity control<br>• Force control<br>• Singularity handling<br>• Redundancy resolution<br>• Task-space control</div></div>'}});
registerModule('workspace',{title:'Workspace',icon:'🗺',desc:'Reachable workspace visualization',cat:'kinematics',init:function(){this.compute()},
compute:function(){var w=STATE.workspace;w.points=[];w.reach=w.l1+w.l2;for(var a=0;a<PI2;a+=0.1){for(var b=-PI;b<PI;b+=0.1){var pos=fk2(a,b,w.l1,w.l2);w.points.push({x:pos.x,y:pos.y,t1:a,t2:b,det:Math.abs(jacobian2(a,b,w.l1,w.l2)[0][0]*jacobian2(a,b,w.l1,w.l2)[1][1]-jacobian2(a,b,w.l1,w.l2)[0][1]*jacobian2(a,b,w.l1,w.l2)[1][0])})}}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var w=STATE.workspace;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('WORKSPACE — Reach='+fmt(w.reach,2)+' · '+w.points.length+' points',24,32);var cx=W/2,cy=H*0.65,scale=Math.min(W,H)/5.5;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-300);ctx.lineTo(cx,cy+300);ctx.stroke();w.points.forEach(function(p){var x=cx+p.x*scale;var y=cy-p.y*scale;var manipulability=Math.min(p.det/1,1);ctx.fillStyle='hsl('+(200-manipulability*150)+',80%,'+(30+manipulability*40)+'%)';ctx.fillRect(x-1,y-1,3,3)});ctx.strokeStyle='rgba(255,64,128,.4)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx,cy,w.reach*scale,0,PI2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,Math.abs(w.l1-w.l2)*scale,0,PI2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='10px monospace';ctx.fillText('outer',cx+w.reach*scale+5,cy-5);ctx.fillText('inner',cx+Math.abs(w.l1-w.l2)*scale+5,cy+15);setStats('<div>Reach: '+fmt(w.reach,2)+'</div><div>Area: '+fmt(Math.PI*(w.reach*w.reach-Math.pow(w.l1-w.l2,2)),2)+'</div>');badge('🗺 Workspace · R='+fmt(w.reach,2));SV('sbX',fmt(w.l1,2));SV('sbTheta',fmt(w.l2,2));SV('sbU',fmt(w.reach,2));SV('sbE',w.points.length);SV('sbTau','—')},
controls:function(){var w=STATE.workspace;return '<div class="sec"><h4>Link lengths</h4><div class="ctrl"><div class="lbl"><span>L1</span><span>'+w.l1+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+w.l1+'" oninput="STATE.workspace.l1=parseFloat(this.value);MODULES.workspace.compute()"></div><div class="ctrl"><div class="lbl"><span>L2</span><span>'+w.l2+'</span></div><input type="range" min="0.2" max="2" step="0.1" value="'+w.l2+'" oninput="STATE.workspace.l2=parseFloat(this.value);MODULES.workspace.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Workspace</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definition:</b><br>Set of all reachable positions<br><br><b>Types:</b><br>• Reachable: at least one IK solution<br>• Dexterous: all orientations possible<br><br><b>2-DOF planar arm:</b><br>Annular region between circles<br>Outer radius: l1 + l2<br>Inner radius: |l1 − l2|<br>Area = π[(l1+l2)² − (l1−l2)²]<br><br><b>Manipulability:</b><br>w = √det(J·Jᵀ)<br>Yoshikawa measure<br>High w → good conditioning<br>Low w → near singularity<br><br><b>Dexterity:</b><br>Condition number κ(J) = σ_max/σ_min<br>κ = 1: isotropic<br>κ → ∞: singular<br><br><b>Applications:</b><br>• Robot design<br>• Task placement<br>• Workspace optimization<br>• Reachability analysis<br>• Collision-free planning</div></div>'}});
</script>
<script>
registerModule('lagrangian',{title:'Lagrangian Dynamics',icon:'L',desc:'Euler-Lagrange equations for 2-link arm',cat:'dynamics',init:function(){this.compute()},
compute:function(){var l=STATE.lagrangian;var q1=l.q[0],q2=l.q[1],qd1=l.qd[0],qd2=l.qd[1];var m1=l.m1,m2=l.m2,l1=l.l1,l2=l.l2,g=l.g;var M11=(m1+m2)*l1*l1+m2*l2*l2+2*m2*l1*l2*Math.cos(q2);var M12=m2*l2*l2+m2*l1*l2*Math.cos(q2);var M21=M12;var M22=m2*l2*l2;l.massMatrix=[[M11,M12],[M21,M22]];l.det=M11*M22-M12*M21;var C1=-m2*l1*l2*Math.sin(q2)*(2*qd1*qd2+qd2*qd2);var C2=m2*l1*l2*Math.sin(q2)*qd1*qd1;var G1=(m1+m2)*g*l1*Math.cos(q1)+m2*g*l2*Math.cos(q1+q2);var G2=m2*g*l2*Math.cos(q1+q2);l.tau=[C1+G1,C2+G2];l.history.push({t:l.t,q1:q1,q2:q2,tau1:l.tau[0],tau2:l.tau[1]});if(l.history.length>500)l.history.shift()},
tick:function(dt){STATE.time+=dt;var l=STATE.lagrangian;if(!STATE.playing)return;l.qd[0]+=0.001*dt;l.qd[1]+=0.0005*dt;l.q[0]+=l.qd[0]*dt;l.q[1]+=l.qd[1]*dt;if(Math.abs(l.q[0])>PI/2)l.qd[0]*=-1;if(Math.abs(l.q[1])>PI/2)l.qd[1]*=-1;l.t+=dt;this.compute()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var l=STATE.lagrangian;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('LAGRANGIAN — τ1='+fmt(l.tau[0],2)+' τ2='+fmt(l.tau[1],2),24,32);var cx=W*0.4,cy=H*0.55,scale=Math.min(W,H)/4;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-250,cy);ctx.lineTo(cx+250,cy);ctx.moveTo(cx,cy-250);ctx.lineTo(cx,cy+250);ctx.stroke();var pos1={x:l.l1*Math.cos(l.q[0]),y:l.l1*Math.sin(l.q[0])};var pos2=fk2(l.q[0],l.q[1],l.l1,l.l2);ctx.strokeStyle='#00d4ff';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.lineTo(cx+pos2.x*scale,cy-pos2.y*scale);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx+pos1.x*scale,cy-pos1.y*scale,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(cx+pos2.x*scale,cy-pos2.y*scale,12,0,Math.PI*2);ctx.fill();var px=W*0.7,py=60,pw=W*0.28,ph=180;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(px,py,pw,ph);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(px,py,pw,ph);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('MASS MATRIX',px+10,py+22);ctx.font='10px monospace';ctx.fillStyle='#80b0d0';ctx.fillText('[ '+fmt(l.massMatrix[0][0],3)+'  '+fmt(l.massMatrix[0][1],3)+' ]',px+10,py+50);ctx.fillText('[ '+fmt(l.massMatrix[1][0],3)+'  '+fmt(l.massMatrix[1][1],3)+' ]',px+10,py+70);ctx.fillStyle='#40ff90';ctx.fillText('det = '+fmt(l.det,4),px+10,py+100);ctx.fillStyle='#80b0d0';ctx.fillText('q1 = '+fmt(l.q[0],3)+' rad',px+10,py+130);ctx.fillText('q2 = '+fmt(l.q[1],3)+' rad',px+10,py+150);ctx.fillText('qd1 = '+fmt(l.qd[0],3)+' rad/s',px+10,py+170);setStats('<div>τ1: '+fmt(l.tau[0],2)+'</div><div>τ2: '+fmt(l.tau[1],2)+'</div><div>det: '+fmt(l.det,3)+'</div>');badge('L Lagrangian');SV('sbX',fmt(l.q[0],3));SV('sbTheta',fmt(l.q[1],3));SV('sbU',fmt(l.tau[0],2));SV('sbE',fmt(l.tau[1],2));SV('sbTau',fmt(l.det,2))},
controls:function(){var l=STATE.lagrangian;return '<div class="sec"><h4>Masses</h4><div class="ctrl"><div class="lbl"><span>m1</span><span>'+l.m1+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+l.m1+'" oninput="STATE.lagrangian.m1=parseFloat(this.value);MODULES.lagrangian.compute()"></div><div class="ctrl"><div class="lbl"><span>m2</span><span>'+l.m2+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+l.m2+'" oninput="STATE.lagrangian.m2=parseFloat(this.value);MODULES.lagrangian.compute()"></div></div><div class="sec"><h4>State</h4><div class="ctrl"><div class="lbl"><span>θ1</span><span>'+fmt(l.q[0],3)+'</span></div><input type="range" min="-1.5" max="1.5" step="0.01" value="'+l.q[0]+'" oninput="STATE.lagrangian.q[0]=parseFloat(this.value);MODULES.lagrangian.compute()"></div><div class="ctrl"><div class="lbl"><span>θ2</span><span>'+fmt(l.q[1],3)+'</span></div><input type="range" min="-1.5" max="1.5" step="0.01" value="'+l.q[1]+'" oninput="STATE.lagrangian.q[1]=parseFloat(this.value);MODULES.lagrangian.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Lagrangian Mechanics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Lagrangian:</b><br>L = T − V<br>T: kinetic energy<br>V: potential energy<br><br><b>Euler-Lagrange equations:</b><br>d/dt(∂L/∂q̇) − ∂L/∂q = τ<br><br><b>Robot equation:</b><br>M(q)·q̈ + C(q,q̇)·q̇ + G(q) = τ<br><br><b>Mass matrix M:</b><br>M(q) = [M11 M12; M21 M22]<br>M11 = (m1+m2)l1² + m2·l2² + 2m2·l1·l2·cos q2<br>M12 = m2·l2² + m2·l1·l2·cos q2<br><br><b>Coriolis C:</b><br>Centrifugal + Coriolis terms<br>C11 = −m2·l1·l2·sin(q2)·q̇2<br>C12 = −m2·l1·l2·sin(q2)(q̇1+q̇2)<br><br><b>Gravity G:</b><br>G1 = (m1+m2)·g·l1·cos q1 + m2·g·l2·cos(q1+q2)<br><br><b>Properties:</b><br>• Ṁ − 2C skew-symmetric<br>• Passivity (energy conservative)<br>• M symmetric positive definite</div></div>'}});
registerModule('newtonEuler',{title:'Newton-Euler',icon:'∑',desc:'Recursive Newton-Euler algorithm',cat:'dynamics',init:function(){this.reset()},
reset:function(){var n=STATE.newtonEuler;n.q=[0,0];n.qd=[0,0];n.qdd=[0,0];n.t=[0];n.history=[]},
step:function(dt){var n=STATE.newtonEuler;n.qd[0]+=0.5*dt;n.qd[1]+=0.3*dt;n.q[0]+=n.qd[0]*dt;n.q[1]+=n.qd[1]*dt;if(Math.abs(n.q[0])>1) n.qd[0]*=-1;if(Math.abs(n.q[1])>1) n.qd[1]*=-1;var l1=n.links[0].l,l2=n.links[1].l,m1=n.links[0].m,m2=n.links[1].m;var g=9.81;n.tau=[m1*g*l1*Math.cos(n.q[0])+m2*g*(l1*Math.cos(n.q[0])+l2*Math.cos(n.q[0]+n.q[1])),m2*g*l2*Math.cos(n.q[0]+n.q[1])];n.t+=dt;n.history.push({t:n.t,q1:n.q[0],q2:n.q[1],tau1:n.tau[0],tau2:n.tau[1]});if(n.history.length>500)n.history.shift()},
tick:function(dt){STATE.time+=dt;var n=STATE.newtonEuler;if(!STATE.playing)return;this.step(dt)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var n=STATE.newtonEuler;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('NEWTON-EULER — τ1='+fmt(n.tau[0],2)+' τ2='+fmt(n.tau[1],2),24,32);var cx=W/2,cy=H*0.6,scale=Math.min(W,H)/4;var pos1={x:n.links[0].l*Math.cos(n.q[0]),y:n.links[0].l*Math.sin(n.q[0])};var pos2=fk2(n.q[0],n.q[1],n.links[0].l,n.links[1].l);ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-250,cy);ctx.lineTo(cx+250,cy);ctx.moveTo(cx,cy-250);ctx.lineTo(cx,cy+250);ctx.stroke();ctx.strokeStyle='#00d4ff';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.stroke();ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(cx+pos1.x*scale,cy-pos1.y*scale);ctx.lineTo(cx+pos2.x*scale,cy-pos2.y*scale);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx+pos1.x*scale,cy-pos1.y*scale,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(cx+pos2.x*scale,cy-pos2.y*scale,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('m1',cx+pos1.x*scale/2,cy-pos1.y*scale/2);ctx.fillText('m2',cx+(pos1.x+pos2.x)/2*scale,cy-(pos1.y+pos2.y)/2*scale);ctx.textAlign='left';setStats('<div>τ1: '+fmt(n.tau[0],2)+'</div><div>τ2: '+fmt(n.tau[1],2)+'</div>');badge('∑ Newton-Euler');SV('sbX',fmt(n.q[0],2));SV('sbTheta',fmt(n.q[1],2));SV('sbU',fmt(n.tau[0],2));SV('sbE',fmt(n.tau[1],2));SV('sbTau','—')},
controls:function(){var n=STATE.newtonEuler;return '<div class="sec"><h4>Links</h4><div class="ctrl"><div class="lbl"><span>m1</span><span>'+n.links[0].m+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+n.links[0].m+'" oninput="STATE.newtonEuler.links[0].m=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>m2</span><span>'+n.links[1].m+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+n.links[1].m+'" oninput="STATE.newtonEuler.links[1].m=parseFloat(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.newtonEuler.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>Newton-Euler</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Newton-Euler equations:</b><br>ΣF = m·a (translational)<br>Στ = I·α + ω×(I·ω) (rotational)<br><br><b>Recursive algorithm:</b><br><br><b>Forward pass (base → tip):</b><br>Compute velocities and accelerations<br><br><b>Backward pass (tip → base):</b><br>Compute forces and torques<br><br><b>Complexity:</b><br>O(n) vs O(n³) for Lagrangian<br>Real-time control feasible<br><br><b>Advantages:</b><br>• Linear in n<br>• Numerical stability<br>• Natural for serial chains<br><br><b>Applications:</b><br>• Real-time robot control<br>• Multi-body dynamics<br>• Simulation (Bullet, MuJoCo)<br>• Spacecraft attitude<br>• Vehicle dynamics</div></div>'}});
registerModule('inertia',{title:'Inertia Matrix',icon:'◫',desc:'Mass matrix and its properties',cat:'dynamics',init:function(){this.compute()},
compute:function(){var i=STATE.inertia;var q1=i.q[0],q2=i.q[1];var m1=1,m2=1,l1=i.l,l2=i.l;var M11=(m1+m2)*l1*l1+m2*l2*l2+2*m2*l1*l2*Math.cos(q2);var M12=m2*l2*l2+m2*l1*l2*Math.cos(q2);i.massMatrix=[[M11,M12],[M12,m2*l2*l2]];i.det=M11*m2*l2*l2-M12*M12;i.trace=M11+m2*l2*l2;i.eigenvalues=[];var tr=i.trace;var det=i.det;var disc=tr*tr/4-det;if(disc>=0){i.eigenvalues=[tr/2+Math.sqrt(disc),tr/2-Math.sqrt(disc)]}else{i.eigenvalues=[{re:tr/2,im:Math.sqrt(-disc)},{re:tr/2,im:-Math.sqrt(-disc)}]}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var i=STATE.inertia;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('INERTIA MATRIX — det='+fmt(i.det,4)+' · trace='+fmt(i.trace,3),24,32);var cx=W*0.35,cy=H/2;var matrixSize=Math.min(W,H)*0.4;var cellSize=matrixSize/2;for(var r=0;r<2;r++){for(var c=0;c<2;c++){var val=i.massMatrix[r][c];var x=cx-cellSize+c*cellSize;var y=cy-cellSize+r*cellSize;var intensity=Math.min(val/5,1);ctx.fillStyle='rgba(0,212,255,'+(0.2+intensity*0.7)+')';ctx.fillRect(x,y,cellSize-2,cellSize-2);ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.strokeRect(x,y,cellSize-2,cellSize-2);ctx.fillStyle='#e0f4ff';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.fillText(fmt(val,2),x+cellSize/2,y+cellSize/2+8);ctx.textAlign='left'}}var px=W*0.7,py=60,pw=W*0.28,ph=200;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(px,py,pw,ph);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(px,py,pw,ph);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('PROPERTIES',px+10,py+22);ctx.font='10px monospace';ctx.fillStyle='#80b0d0';ctx.fillText('Symmetric: YES',px+10,py+50);ctx.fillText('Pos. definite: '+(i.det>0&&i.massMatrix[0][0]>0?'YES':'NO'),px+10,py+70);ctx.fillText('det: '+fmt(i.det,3),px+10,py+90);ctx.fillText('trace: '+fmt(i.trace,3),px+10,py+110);ctx.fillText('λ1: '+fmt(i.eigenvalues[0],3),px+10,py+130);ctx.fillText('λ2: '+fmt(i.eigenvalues[1],3),px+10,py+150);ctx.fillStyle='#40ff90';ctx.fillText('Condition: '+fmt(i.eigenvalues[0]/Math.max(i.eigenvalues[1],1e-6),2),px+10,py+180);setStats('<div>det: '+fmt(i.det,3)+'</div><div>λ1: '+fmt(i.eigenvalues[0],2)+'</div><div>λ2: '+fmt(i.eigenvalues[1],2)+'</div>');badge('◫ Inertia · det='+fmt(i.det,3));SV('sbX',fmt(i.massMatrix[0][0],2));SV('sbTheta',fmt(i.massMatrix[0][1],2));SV('sbU',fmt(i.massMatrix[1][0],2));SV('sbE',fmt(i.massMatrix[1][1],2));SV('sbTau',fmt(i.det,3))},
controls:function(){var i=STATE.inertia;return '<div class="sec"><h4>Configuration</h4><div class="ctrl"><div class="lbl"><span>θ1 (rad)</span><span>'+fmt(i.q[0],3)+'</span></div><input type="range" min="-3" max="3" step="0.05" value="'+i.q[0]+'" oninput="STATE.inertia.q[0]=parseFloat(this.value);MODULES.inertia.compute()"></div><div class="ctrl"><div class="lbl"><span>θ2 (rad)</span><span>'+fmt(i.q[1],3)+'</span></div><input type="range" min="-3" max="3" step="0.05" value="'+i.q[1]+'" oninput="STATE.inertia.q[1]=parseFloat(this.value);MODULES.inertia.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Inertia Matrix</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definition:</b><br>M(q) = Σ m_i · J_v_iᵀ·J_v_i + J_ω_iᵀ·I_i·J_ω_i<br><br><b>2-DOF example:</b><br>M11 = (m1+m2)·l1² + m2·l2² + 2·m2·l1·l2·cos(q2)<br>M12 = M21 = m2·l2² + m2·l1·l2·cos(q2)<br>M22 = m2·l2²<br><br><b>Properties:</b><br>• Symmetric: M = Mᵀ<br>• Positive definite: xᵀMx &gt; 0 ∀x≠0<br>• Bounded: λ_min·I ≤ M ≤ λ_max·I<br>• Configuration-dependent<br><br><b>Condition number:</b><br>κ(M) = λ_max/λ_min<br>Near singularity: κ large<br><br><b>Uses:</b><br>• Computed torque control<br>• Inverse dynamics<br>• Simulation<br>• Impedance control<br>• Optimal trajectory</div></div>'}});
registerModule('contact',{title:'Contact Dynamics',icon:'◉',desc:'Impact and friction models',cat:'dynamics',init:function(){this.reset()},
reset:function(){var c=STATE.contact;c.x=0.1;c.v=-1;c.F=0;c.t=0;c.history=[];c.mode='elastic'},
step:function(dt){var c=STATE.contact;var penetration=c.x;if(penetration<0){c.F=c.k*penetration+c.c*c.v;if(c.mode==='elastic'){c.v+=c.F/Math.max(c.x,c.x)*dt*10}else{c.v*=0.8;if(Math.abs(c.v)<0.01){c.v=0;c.F=0}}}else{c.F=0}c.x+=c.v*dt;if(c.x<0){c.x=0;c.v=Math.abs(c.v)*0.6}c.t+=dt;c.penetration=penetration;c.history.push({t:c.t,x:c.x,v:c.v,F:c.F});if(c.history.length>500)c.history.shift()},
tick:function(dt){STATE.time+=dt;var c=STATE.contact;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var c=STATE.contact;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('CONTACT — x='+fmt(c.x,3)+' · F='+fmt(c.F,2)+' N',24,32);var px=60,py=60,pw=W-140,ph=H*0.35;drawAxes(ctx,px,py,pw,ph,'time','position');ctx.strokeStyle='rgba(255,64,128,.3)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px,py+ph-10);ctx.lineTo(px+pw,py+ph-10);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();c.history.forEach(function(h,i){var x=px+i/Math.max(c.history.length,1)*pw;var y=py+ph-10-h.x/0.2*(ph-20);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff4080';ctx.font='10px monospace';ctx.fillText('ground',px+10,py+ph-15);var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'time','force (N)');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();c.history.forEach(function(h,i){var x=px+i/Math.max(c.history.length,1)*pw;var y=p2+ph*0.6-Math.abs(h.F)/10*ph*0.6;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='10px monospace';ctx.fillText('contact force',px+10,p2+15);setStats('<div>x: '+fmt(c.x,3)+'</div><div>v: '+fmt(c.v,3)+'</div><div>F: '+fmt(c.F,2)+'</div>');badge('◉ Contact · F='+fmt(c.F,1)+'N');SV('sbX',fmt(c.x,3));SV('sbTheta',fmt(c.v,3));SV('sbU',fmt(c.F,2));SV('sbE',fmt(Math.abs(c.v),3));SV('sbTau','—')},
controls:function(){var c=STATE.contact;return '<div class="sec"><h4>Material</h4><div class="ctrl"><div class="lbl"><span>Stiffness k</span><span>'+fmt(c.k,0)+'</span></div><input type="range" min="1000" max="100000" step="1000" value="'+c.k+'" oninput="STATE.contact.k=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>Damping c</span><span>'+c.c+'</span></div><input type="range" min="10" max="500" step="10" value="'+c.c+'" oninput="STATE.contact.c=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Model</h4><div class="chip-row"><div class="chip '+(c.mode==='elastic'?'active':'')+'" onclick="STATE.contact.mode=\'elastic\';renderLeftPanel()">Elastic</div><div class="chip '+(c.mode==='plastic'?'active':'')+'" onclick="STATE.contact.mode=\'plastic\';renderLeftPanel()">Plastic</div></div></div><button class="btn primary full" onclick="MODULES.contact.reset()">↺ Drop again</button>'},mathPanel:function(){return '<div class="sec"><h4>Contact Dynamics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Contact models:</b><br><br><b>1. Rigid (hard):</b><br>Non-penetration constraint<br>Impulse-based<br><br><b>2. Compliant (soft):</b><br>Spring-damper (Hertz-Mindlin)<br>F = k·δ + c·δ̇<br>Allow small penetration<br><br><b>3. Friction:</b><br>Coulomb: |F_t| ≤ μ·F_n<br>Static vs kinetic<br>Stribeck effect<br><br><b>Hertz contact:</b><br>F = (4/3)·E*·√R·δ^(3/2)<br>For elastic spheres<br><br><b>Simulation methods:</b><br>• Constraint-based (ODE, Bullet)<br>• Penalty method (fast)<br>• Impulse-based<br>• Complementarity<br><br><b>Applications:</b><br>• Legged robots<br>• Manipulation<br>• Grasping<br>• Tribology<br>• Vehicle dynamics<br>• Simulation of rigid bodies</div></div>'}});
</script>
<script>
registerModule('trajectory',{title:'Trajectory Generation',icon:'∿',desc:'Cubic and quintic polynomial trajectories',cat:'planning',init:function(){this.reset()},
reset:function(){var t=STATE.trajectory;t.t=0;t.profile=[];t.vel=[];t.acc=[];t.history=[]},
step:function(dt){var t=STATE.trajectory;t.t+=dt;if(t.t>t.T)t.t=0;var s=t.t/t.T;t.qt=cubicTrajectory(t.q0,t.qf,t.t,t.T);t.profile.push({t:t.t,q:t.qt});if(t.profile.length>500)t.profile.shift();var v=(6*s*s-6*s)*(t.qf-t.q0)/t.T;t.vel.push({t:t.t,v:v});if(t.vel.length>500)t.vel.shift();var a=(12*s-6)*(t.qf-t.q0)/(t.T*t.T);t.acc.push({t:t.t,a:a});if(t.acc.length>500)t.acc.shift()},
tick:function(dt){STATE.time+=dt;var t=STATE.trajectory;if(!STATE.playing)return;this.step(dt)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var t=STATE.trajectory;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('TRAJECTORY — '+t.mode+' · q(t)='+fmt(t.qt,3),24,32);var px=60,py=60,pw=W-140,ph=H*0.28;drawAxes(ctx,px,py,pw,ph,'time','q');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();t.profile.forEach(function(p,i){var x=px+p.t/t.T*pw;var y=py+ph-p.q*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.5,'time','v');ctx.strokeStyle='#ff8c30';ctx.lineWidth=2;ctx.beginPath();t.vel.forEach(function(p,i){var x=px+p.t/t.T*pw;var y=p2+ph*0.5/2-p.v/3*ph*0.5/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff8c30';ctx.font='10px monospace';ctx.fillText('velocity',px+10,p2+15);var p3=p2+ph*0.5+40;drawAxes(ctx,px,p3,pw,ph*0.35,'time','a');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();t.acc.forEach(function(p,i){var x=px+p.t/t.T*pw;var y=p3+ph*0.35/2-p.a/10*ph*0.35/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='10px monospace';ctx.fillText('acceleration',px+10,p3+15);setStats('<div>q: '+fmt(t.qt,3)+'</div><div>t: '+fmt(t.t,2)+'</div><div>mode: '+t.mode+'</div>');badge('∿ Trajectory · '+t.mode);SV('sbX',fmt(t.qt,3));SV('sbTheta',fmt(t.t,2));SV('sbU',fmt(t.qf-t.q0,2));SV('sbE','—');SV('sbTau','—')},
controls:function(){var t=STATE.trajectory;return '<div class="sec"><h4>Trajectory</h4><div class="ctrl"><div class="lbl"><span>q0</span><span>'+t.q0+'</span></div><input type="range" min="-2" max="2" step="0.1" value="'+t.q0+'" oninput="STATE.trajectory.q0=parseFloat(this.value);MODULES.trajectory.reset()"></div><div class="ctrl"><div class="lbl"><span>qf</span><span>'+t.qf+'</span></div><input type="range" min="-2" max="2" step="0.1" value="'+t.qf+'" oninput="STATE.trajectory.qf=parseFloat(this.value);MODULES.trajectory.reset()"></div><div class="ctrl"><div class="lbl"><span>Duration T</span><span>'+t.T+'</span></div><input type="range" min="0.5" max="5" step="0.1" value="'+t.T+'" oninput="STATE.trajectory.T=parseFloat(this.value);MODULES.trajectory.reset()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Trajectory Generation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Cubic polynomial:</b><br>q(t) = a0 + a1·t + a2·t² + a3·t³<br><br>Boundary conditions:<br>q(0)=q0, q(T)=qf<br>q̇(0)=v0, q̇(T)=vf<br>Typically v0=vf=0<br><br><b>Quintic polynomial:</b><br>q(t) = a0 + a1·t + ... + a5·t⁵<br>Also specifies: q̈(0), q̈(T)<br>Smooth acceleration<br><br><b>Trapezoidal velocity:</b><br>Linear accel — cruise — linear decel<br>Simpler, sharp acceleration<br><br><b>Minimum jerk:</b><br>Minimize ∫(d³q/dt³)²dt<br>Quintic is minimum jerk<br>Smooth, natural motion<br><br><b>Applications:</b><br>• Robot arms<br>• Autonomous vehicles<br>• CNC machines<br>• Animation (easing)<br>• Drone trajectories</div></div>'}});
registerModule('aStar',{title:'A* Path Planning',icon:'🗺',desc:'Optimal grid path finding',cat:'planning',init:function(){this.reset()},
reset:function(){var a=STATE.aStar;a.grid=[];for(var y=0;y<a.gridSize;y++){a.grid.push([]);for(var x=0;x<a.gridSize;x++){a.grid[y].push(0)}}for(var i=0;i<40;i++){var wx=rnd(2,a.gridSize-3);var wy=rnd(2,a.gridSize-3);a.grid[wy][wx]=1;a.grid[wy][Math.min(wx+1,a.gridSize-1)]=1}a.grid[a.start.y][a.start.x]=0;a.grid[a.goal.y][a.goal.x]=0;a.path=[];a.done=false;a.steps=0},
step:function(){var a=STATE.aStar;if(a.done)return;var p=aStar(a.start,a.goal,a.grid,a.gridSize,a.gridSize);if(p){a.path=p;a.done=true}else{a.done=true}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var a=STATE.aStar;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('A* PATH — '+(a.done?'Found '+a.path.length+' steps':'Click "Solve"'),24,32);var size=Math.min(W,H)*0.75;var ox=(W-size)/2;var oy=(H-size)/2+20;var cell=size/a.gridSize;for(var y=0;y<a.gridSize;y++){for(var x=0;x<a.gridSize;x++){var cx=ox+x*cell;var cy=oy+y*cell;if(a.grid[y][x]===1){ctx.fillStyle='#ff4080';ctx.fillRect(cx,cy,cell-1,cell-1)}else{ctx.fillStyle='rgba(0,212,255,.08)';ctx.fillRect(cx,cy,cell-1,cell-1)}}}if(a.path.length){ctx.fillStyle='rgba(64,255,144,.5)';a.path.forEach(function(p){ctx.fillRect(ox+p.x*cell+cell*0.2,oy+p.y*cell+cell*0.2,cell*0.6,cell*0.6)})}ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(ox+a.start.x*cell+cell/2,oy+a.start.y*cell+cell/2,cell*0.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(ox+a.goal.x*cell+cell/2,oy+a.goal.y*cell+cell/2,cell*0.4,0,Math.PI*2);ctx.fill();setStats('<div>Path: '+a.path.length+'</div><div>Size: '+a.gridSize+'×'+a.gridSize+'</div>');badge('🗺 A* · '+a.path.length+' steps');SV('sbX',a.path.length);SV('sbTheta',a.gridSize);SV('sbU','—');SV('sbE','—');SV('sbTau','—')},
controls:function(){var a=STATE.aStar;return '<div class="sec"><h4>Actions</h4><button class="btn primary full" onclick="MODULES.aStar.step();toast(\'Solved\',\'success\')">▶ Solve</button><button class="btn full" style="margin-top:6px" onclick="MODULES.aStar.reset();toast(\'New grid\',\'success\')">🎲 New grid</button></div><div class="sec"><h4>Grid size</h4><div class="ctrl"><div class="lbl"><span>N</span><span>'+a.gridSize+'</span></div><input type="range" min="10" max="30" step="1" value="'+a.gridSize+'" oninput="STATE.aStar.gridSize=parseInt(this.value);STATE.aStar.start={x:1,y:1};STATE.aStar.goal={x:STATE.aStar.gridSize-2,y:STATE.aStar.gridSize-2};MODULES.aStar.reset()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>A* Search</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Cost function:</b><br>f(n) = g(n) + h(n)<br>g(n): cost from start<br>h(n): heuristic to goal<br><br><b>Heuristic:</b><br>Manhattan: |dx|+|dy|<br>Euclidean: √(dx²+dy²)<br>Diagonal: max(|dx|,|dy|)<br><br><b>Admissibility:</b><br>h(n) ≤ h*(n) (true cost)<br>Ensures optimality<br><br><b>Complexity:</b><br>Time: O(b^d) worst, better with good h<br>Space: O(b^d)<br><br><b>Variants:</b><br>• Weighted A* (faster, suboptimal)<br>• D* (dynamic replanning)<br>• D* Lite (incremental)<br>• Jump Point Search (grid)<br>• Theta* (any angle)<br>• Hybrid A* (continuous)<br><br><b>Applications:</b><br>Robot navigation, games, GPS routing</div></div>'}});
registerModule('rrt',{title:'RRT',icon:'🌲',desc:'Rapidly-exploring Random Tree',cat:'planning',init:function(){this.reset()},
reset:function(){var r=STATE.rrt;r.nodes=[{x:0,y:0}];r.edges=[];r.obstacles=[{x:3,y:3,w:2,h:1},{x:6,y:5,w:1,h:3},{x:2,y:7,w:2,h:2}];r.iter=0;r.done=false;r.path=null;r.goal={x:9,y:9}},
step:function(){var r=STATE.rrt;if(r.done||r.nodes.length>800){r.done=true;return}var sample;if(Math.random()<0.1){sample=r.goal}else{sample={x:Math.random()*10,y:Math.random()*10}}var nearest=r.nodes[0];var bestDist=Infinity;r.nodes.forEach(function(n){var d=Math.sqrt(Math.pow(n.x-sample.x,2)+Math.pow(n.y-sample.y,2));if(d<bestDist){bestDist=d;nearest=n}});var newNode=rrtStep(nearest,sample,0.5);var collision=r.obstacles.find(function(o){var steps=10;for(var i=0;i<=steps;i++){var t=i/steps;var x=lerp(nearest.x,newNode.x,t);var y=lerp(nearest.y,newNode.y,t);if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return true}return false});if(!collision){r.nodes.push(newNode);r.edges.push({from:nearest,to:newNode});var dToGoal=Math.sqrt(Math.pow(newNode.x-r.goal.x,2)+Math.pow(newNode.y-r.goal.y,2));if(dToGoal<0.6){r.path=[];var current=newNode;while(current){r.path.unshift(current);var edge=r.edges.find(function(e){return e.to===current});if(!edge)break;current=edge.from}r.path.push(r.goal);r.done=true}}r.iter++},
tick:function(dt){STATE.time+=dt;var r=STATE.rrt;if(!STATE.playing)return;for(var i=0;i<3;i++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var r=STATE.rrt;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('RRT — '+r.nodes.length+' nodes · '+(r.done?(r.path?'PATH FOUND':'FAILED'):'growing...'),24,32);var size=Math.min(W,H)*0.75,ox=(W-size)/2,oy=(H-size)/2+20,scale=size/10;ctx.strokeStyle='rgba(0,212,255,.1)';ctx.lineWidth=1;for(var i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(ox+i*scale,oy);ctx.lineTo(ox+i*scale,oy+size);ctx.moveTo(ox,oy+i*scale);ctx.lineTo(ox+size,oy+i*scale);ctx.stroke()}r.obstacles.forEach(function(o){ctx.fillStyle='rgba(255,64,128,.3)';ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.fillRect(ox+o.x*scale,oy+o.y*scale,o.w*scale,o.h*scale);ctx.strokeRect(ox+o.x*scale,oy+o.y*scale,o.w*scale,o.h*scale)});ctx.strokeStyle='rgba(0,212,255,.5)';ctx.lineWidth=1;r.edges.forEach(function(e){ctx.beginPath();ctx.moveTo(ox+e.from.x*scale,oy+e.from.y*scale);ctx.lineTo(ox+e.to.x*scale,oy+e.to.y*scale);ctx.stroke()});r.nodes.forEach(function(n){ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.arc(ox+n.x*scale,oy+n.y*scale,2,0,Math.PI*2);ctx.fill()});if(r.path){ctx.strokeStyle='#40ff90';ctx.lineWidth=3;ctx.beginPath();r.path.forEach(function(p,i){var x=ox+p.x*scale,y=oy+p.y*scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(ox+r.goal.x*scale,oy+r.goal.y*scale,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('G',ox+r.goal.x*scale,oy+r.goal.y*scale+4);ctx.textAlign='left';setStats('<div>Nodes: '+r.nodes.length+'</div><div>'+(r.done?(r.path?'Found':'Failed'):'Growing')+'</div>');badge('🌲 RRT · '+r.nodes.length+' nodes');SV('sbX',r.nodes.length);SV('sbTheta',r.iter);SV('sbU','—');SV('sbE','—');SV('sbTau','—')},
controls:function(){var r=STATE.rrt;return '<div class="sec"><h4>Actions</h4><button class="btn primary full" onclick="MODULES.rrt.reset();toast(\'New tree\',\'success\')">🎲 New tree</button></div><div class="sec"><h4>Info</h4><div class="kv"><div class="row"><span class="k">Nodes</span><span class="v">'+r.nodes.length+'</span></div><div class="row"><span class="k">Iterations</span><span class="v">'+r.iter+'</span></div><div class="row"><span class="k">Status</span><span class="v">'+(r.done?(r.path?'FOUND':'FAILED'):'growing')+'</span></div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>RRT</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Algorithm:</b><br>1. Sample random point x_rand<br>2. Find nearest node x_near<br>3. Extend toward x_rand by step Δ<br>4. Check collision<br>5. Add if valid<br>6. Repeat until near goal<br><br><b>Properties:</b><br>• Probabilistically complete<br>• Not optimal (path length)<br>• Fast in high dimensions<br>• Good for narrow passages<br><br><b>Variants:</b><br>• RRT* (asymptotically optimal)<br>• RRT-Connect (bidirectional)<br>• Informed RRT* (focused)<br>• Kinodynamic RRT (dynamics)<br>• BIT* (batch)<br><br><b>Complexity:</b><br>Time: O(n log n) with kd-tree<br>Space: O(n)<br><br><b>Applications:</b><br>• Manipulator planning<br>• Autonomous driving<br>• Humanoids<br>• Complex environments<br>• High-DOF systems</div></div>'}});
registerModule('slam',{title:'SLAM',icon:'📍',desc:'Simultaneous Localization and Mapping',cat:'planning',init:function(){this.reset()},
reset:function(){var s=STATE.slam;s.x=0;s.y=0;s.theta=0;s.landmarks=[];for(var i=0;i<8;i++){s.landmarks.push({x:rnd(-5,10),y:rnd(-5,10),observed:false})}s.history=[];s.t=0},
step:function(dt){var s=STATE.slam;s.theta+=0.05*dt;s.x+=Math.cos(s.theta)*dt*1.5;s.y+=Math.sin(s.theta)*dt*1.5;s.history.push({x:s.x,y:s.y,theta:s.theta});if(s.history.length>500)s.history.shift();s.landmarks.forEach(function(l){var d=Math.sqrt(Math.pow(l.x-s.x,2)+Math.pow(l.y-s.y,2));if(d<3&&!l.observed){l.observed=true}});s.t+=dt},
tick:function(dt){STATE.time+=dt;var s=STATE.slam;if(!STATE.playing)return;this.step(dt)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var s=STATE.slam;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('SLAM — pos=('+fmt(s.x,2)+','+fmt(s.y,2)+') · landmarks: '+s.landmarks.filter(function(l){return l.observed}).length+'/'+s.landmarks.length,24,32);var cx=W/2,cy=H/2,scale=Math.min(W,H)/15;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;for(var i=-10;i<=10;i+=2){ctx.beginPath();ctx.moveTo(cx+i*scale,cy-200);ctx.lineTo(cx+i*scale,cy+200);ctx.moveTo(cx-300,cy+i*scale);ctx.lineTo(cx+300,cy+i*scale);ctx.stroke()}s.history.forEach(function(h,i){var x=cx+h.x*scale,y=cy+h.y*scale;ctx.fillStyle='rgba(0,212,255,'+(i/s.history.length*0.6)+')';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()});s.landmarks.forEach(function(l){var x=cx+l.x*scale,y=cy+l.y*scale;if(l.observed){ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='rgba(255,64,128,.3)';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}ctx.strokeStyle=l.observed?'#40ff90':'#ff4080';ctx.lineWidth=2;ctx.stroke()});var rx=cx+s.x*scale,ry=cy+s.y*scale;ctx.save();ctx.translate(rx,ry);ctx.rotate(s.theta);ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-10,-10);ctx.lineTo(-10,10);ctx.closePath();ctx.fill();ctx.restore();setStats('<div>Pos: ('+fmt(s.x,2)+','+fmt(s.y,2)+')</div><div>θ: '+fmt(deg(s.theta),1)+'°</div><div>LMs: '+s.landmarks.filter(function(l){return l.observed}).length+'/'+s.landmarks.length+'</div>');badge('📍 SLAM · '+s.landmarks.filter(function(l){return l.observed}).length+'/'+s.landmarks.length+' LMs');SV('sbX',fmt(s.x,2));SV('sbTheta',fmt(s.y,2));SV('sbU',fmt(deg(s.theta),1)+'°');SV('sbE','—');SV('sbTau','—')},
controls:function(){var s=STATE.slam;return '<div class="sec"><h4>Robot</h4><div class="kv"><div class="row"><span class="k">x</span><span class="v">'+fmt(s.x,2)+'</span></div><div class="row"><span class="k">y</span><span class="v">'+fmt(s.y,2)+'</span></div><div class="row"><span class="k">θ</span><span class="v">'+fmt(deg(s.theta),1)+'°</span></div><div class="row"><span class="k">Landmarks</span><span class="v">'+s.landmarks.filter(function(l){return l.observed}).length+' / '+s.landmarks.length+'</span></div></div></div><button class="btn primary full" onclick="MODULES.slam.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>SLAM</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Problem:</b><br>Estimate robot pose AND map simultaneously<br><br><b>State:</b><br>x = [pose, landmarks]<br>Dim = 3 + 2n (2D)<br><br><b>Bayesian:</b><br>p(x_t, m | z_1:t, u_1:t)<br>Recursive estimation<br><br><b>Approaches:</b><br>• EKF-SLAM (extended Kalman)<br>• FastSLAM (particle filter)<br>• GraphSLAM (optimization)<br>• ORB-SLAM (visual)<br>• Cartographer (Google)<br>• LIO-SAM (lidar+inertial)<br><br><b>Challenges:</b><br>• Data association<br>• Loop closure<br>• Computational complexity O(n²)<br>• Cumulative error<br><br><b>Applications:</b><br>• Autonomous vehicles<br>• Drones<br>• AR/VR (ARKit, HoloLens)<br>• Roomba<br>• Mars rovers<br>• Underwater robots</div></div>'}});
