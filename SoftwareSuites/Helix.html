<script>
registerModule('dcMotor',{title:'DC Motor',icon:'⚙',desc:'Electrical and mechanical dynamics',cat:'actuators',init:function(){this.reset()},
reset:function(){var m=STATE.dcMotor;m.omega=0;m.current=0;m.angle=0;m.t=0;m.history=[]},
step:function(dt){var m=STATE.dcMotor;var di=(m.V-m.R*m.current-m.Ke*m.omega)/m.L;var domega=(m.Kt*m.current-m.b*m.omega)/m.J;m.current+=di*dt;m.omega+=domega*dt;m.angle+=m.omega*dt;m.t+=dt;m.history.push({t:m.t,omega:m.omega,current:m.current,angle:m.angle});if(m.history.length>500)m.history.shift()},
tick:function(dt){STATE.time+=dt;var m=STATE.dcMotor;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var m=STATE.dcMotor;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('DC MOTOR — ω='+fmt(m.omega,2)+' rad/s · I='+fmt(m.current,3)+' A',24,32);var px=60,py=60,pw=W-140,ph=H*0.35;drawAxes(ctx,px,py,pw,ph,'time','ω (rad/s)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();m.history.forEach(function(h,i){var x=px+i/Math.max(m.history.length,1)*pw;var y=py+ph/2-h.omega/20*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('speed ω',px+10,py+15);var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'time','I (A)');ctx.strokeStyle='#ff8c30';ctx.lineWidth=2;ctx.beginPath();m.history.forEach(function(h,i){var x=px+i/Math.max(m.history.length,1)*pw;var y=p2+ph*0.6/2-h.current/5*ph*0.6/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff8c30';ctx.font='10px monospace';ctx.fillText('current',px+10,p2+15);setStats('<div>ω: '+fmt(m.omega,2)+'</div><div>I: '+fmt(m.current,3)+'</div><div>V: '+m.V+'V</div>');badge('⚙ DC Motor · ω='+fmt(m.omega,1));SV('sbX',fmt(m.omega,2));SV('sbTheta',fmt(m.angle,2));SV('sbU',fmt(m.current,2));SV('sbE',fmt(m.V,1));SV('sbTau',fmt(m.Kt*m.current,3))},
controls:function(){var m=STATE.dcMotor;return '<div class="sec"><h4>Input</h4><div class="ctrl"><div class="lbl"><span>Voltage V</span><span>'+m.V+' V</span></div><input type="range" min="-48" max="48" step="1" value="'+m.V+'" oninput="STATE.dcMotor.V=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Motor params</h4><div class="ctrl"><div class="lbl"><span>R (Ω)</span><span>'+m.R+'</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+m.R+'" oninput="STATE.dcMotor.R=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>Ke (V·s/rad)</span><span>'+m.Ke+'</span></div><input type="range" min="0.01" max="1" step="0.01" value="'+m.Ke+'" oninput="STATE.dcMotor.Ke=parseFloat(this.value);STATE.dcMotor.Kt=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>J (kg·m²)</span><span>'+m.J+'</span></div><input type="range" min="0.001" max="0.1" step="0.001" value="'+m.J+'" oninput="STATE.dcMotor.J=parseFloat(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.dcMotor.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>DC Motor</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Electrical:</b><br>V = R·i + L·di/dt + Ke·ω<br>Back-EMF: e = Ke·ω<br><br><b>Mechanical:</b><br>J·dω/dt = Kt·i − b·ω − T_load<br>Torque: τ = Kt·i<br><br><b>Steady state:</b><br>ω_ss = (V − R·i)/Ke<br>i_ss = T_load/Kt<br><br><b>Transfer function:</b><br>ω(s)/V(s) = Kt / [(Ls+R)(Js+b) + Kt·Ke]<br><br><b>Time constant:</b><br>τ_m = RJ/(Kt·Ke) (mechanical)<br>τ_e = L/R (electrical)<br><br><b>Speed control:</b><br>• Voltage (armature)<br>• PWM<br>• Field control (shunt)<br><br><b>Applications:</b><br>Robotics, EVs, drones, appliances, industrial</div></div>'}});
registerModule('bldc',{title:'BLDC Motor',icon:'⊙',desc:'Brushless DC motor with electronic commutation',cat:'actuators',init:function(){this.reset()},
reset:function(){var b=STATE.bldc;b.omega=0;b.current=0;b.electAngle=0;b.t=0;b.history=[]},
step:function(dt){var b=STATE.bldc;var backEMF=b.Ke*b.omega;var di=(b.V-backEMF-b.R*b.current)/0.001;b.current+=di*dt;b.torque=b.Kt*b.current;var domega=(b.torque-0.001*b.omega)/b.J;b.omega+=domega*dt;b.electAngle+=b.omega*b.poles/2*dt;if(b.electAngle>2*Math.PI)b.electAngle-=2*Math.PI;b.t+=dt;b.history.push({t:b.t,omega:b.omega,current:b.current,torque:b.torque,angle:b.electAngle});if(b.history.length>500)b.history.shift()},
tick:function(dt){STATE.time+=dt;var b=STATE.bldc;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var b=STATE.bldc;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('BLDC — ω='+fmt(b.omega,2)+' rad/s · τ='+fmt(b.torque,3)+' Nm',24,32);var cx=W*0.35,cy=H/2,r=Math.min(W,H)*0.2;ctx.strokeStyle='rgba(0,212,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();for(var i=0;i<b.poles/2;i++){var ang=i/(b.poles/2)*Math.PI*2+b.electAngle;var x=cx+Math.cos(ang)*r*0.8;var y=cy+Math.sin(ang)*r*0.8;ctx.fillStyle=i%2===0?'#ff4080':'#40ff90';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('rotor',cx,cy+4);ctx.textAlign='left';var px=W*0.6,py=60,pw=W*0.35,ph=H*0.35;drawAxes(ctx,px,py,pw,ph,'time','ω');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();b.history.forEach(function(h,i){var x=px+i/Math.max(b.history.length,1)*pw;var y=py+ph/2-h.omega/100*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'time','τ (Nm)');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();b.history.forEach(function(h,i){var x=px+i/Math.max(b.history.length,1)*pw;var y=p2+ph*0.6/2-h.torque/0.5*ph*0.6/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();setStats('<div>ω: '+fmt(b.omega,1)+'</div><div>τ: '+fmt(b.torque,3)+'</div><div>I: '+fmt(b.current,2)+'</div>');badge('⊙ BLDC · ω='+fmt(b.omega,0));SV('sbX',fmt(b.omega,2));SV('sbTheta',fmt(b.electAngle,2));SV('sbU',fmt(b.current,2));SV('sbE',b.V);SV('sbTau',fmt(b.torque,3))},
controls:function(){var b=STATE.bldc;return '<div class="sec"><h4>Input</h4><div class="ctrl"><div class="lbl"><span>Voltage V</span><span>'+b.V+' V</span></div><input type="range" min="-48" max="48" step="1" value="'+b.V+'" oninput="STATE.bldc.V=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Poles</h4><div class="ctrl"><div class="lbl"><span>Poles</span><span>'+b.poles+'</span></div><input type="range" min="4" max="16" step="2" value="'+b.poles+'" oninput="STATE.bldc.poles=parseInt(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.bldc.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>BLDC Motor</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Construction:</b><br>• Permanent magnets on rotor<br>• Windings on stator<br>• Electronic commutation (no brushes!)<br>• Hall sensors or sensorless<br><br><b>Commutation:</b><br>6-step (trapezoidal)<br>FOC (sinusoidal)<br>Based on rotor position<br><br><b>Advantages:</b><br>• Higher efficiency (85-95%)<br>• No brush maintenance<br>• Better heat dissipation<br>• Higher speed<br>• Silent operation<br><br><b>Torque:</b><br>τ = Kt·I (constant Kt)<br>Linear with current<br><br><b>Applications:</b><br>• Drones (main propulsion)<br>• EVs (Tesla Model 3, etc.)<br>• Robotics (joints)<br>• Fans<br>• Disk drives<br>• E-bikes<br>• Power tools</div></div>'}});
registerModule('gears',{title:'Gear Trains',icon:'⚙',desc:'Gear ratios and torque transmission',cat:'actuators',init:function(){this.compute()},
compute:function(){var g=STATE.gears;g.ratio=g.N2/g.N1;g.omega2=g.omega1/g.ratio;g.torque2=g.torque1*g.ratio*g.efficiency;g.power1=g.torque1*g.omega1;g.power2=g.torque2*g.omega2},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var g=STATE.gears;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('GEAR TRAIN — ratio='+fmt(g.ratio,2)+':1 · ω2='+fmt(g.omega2,2)+' rad/s',24,32);var cx=W/2,cy=H/2;var r1=Math.min(W,H)*0.15,r2=r1*g.ratio;ctx.strokeStyle='#00d4ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx-r1-r2*0.5,cy,r1,0,Math.PI*2);ctx.stroke();for(var a=0;a<g.N1;a++){var ang=a/g.N1*Math.PI*2+STATE.time*0.1;var x=cx-r1-r2*0.5+Math.cos(ang)*r1;var y=cy+Math.sin(ang)*r1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx-r1-r2*0.5+Math.cos(ang)*(r1+15),cy+Math.sin(ang)*(r1+15));ctx.stroke()}ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.arc(cx+r2*0.5,cy,r2,0,Math.PI*2);ctx.stroke();for(var b=0;b<g.N2;b++){var ang2=b/g.N2*Math.PI*2-STATE.time*0.1/g.ratio;var x2=cx+r2*0.5+Math.cos(ang2)*r2;var y2=cy+Math.sin(ang2)*r2;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(cx+r2*0.5+Math.cos(ang2)*(r2+15),cy+Math.sin(ang2)*(r2+15));ctx.stroke()}ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('N1='+g.N1,cx-r1-r2*0.5,cy+r1+40);ctx.fillStyle='#ff8c30';ctx.fillText('N2='+g.N2,cx+r2*0.5,cy+r2+40);ctx.textAlign='left';var px=60,py=H*0.7,pw=W-120,ph=100;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(px,py,pw,ph);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(px,py,pw,ph);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('TRANSMISSION',px+10,py+20);ctx.font='10px monospace';ctx.fillStyle='#80b0d0';ctx.fillText('Input:  ω1='+fmt(g.omega1,2)+' rad/s,  τ1='+fmt(g.torque1,2)+' Nm',px+10,py+45);ctx.fillText('Output: ω2='+fmt(g.omega2,2)+' rad/s,  τ2='+fmt(g.torque2,2)+' Nm',px+10,py+65);ctx.fillText('Power in='+fmt(g.power1,2)+' W, Power out='+fmt(g.power2,2)+' W (η='+fmt(g.efficiency*100,0)+'%)',px+10,py+85);setStats('<div>Ratio: '+fmt(g.ratio,2)+'</div><div>ω2: '+fmt(g.omega2,2)+'</div><div>τ2: '+fmt(g.torque2,2)+'</div>');badge('⚙ Gears · '+fmt(g.ratio,2)+':1');SV('sbX',fmt(g.omega1,2));SV('sbTheta',fmt(g.omega2,2));SV('sbU',fmt(g.torque1,2));SV('sbE',fmt(g.torque2,2));SV('sbTau',fmt(g.ratio,2))},
controls:function(){var g=STATE.gears;return '<div class="sec"><h4>Gear teeth</h4><div class="ctrl"><div class="lbl"><span>N1 (driver)</span><span>'+g.N1+'</span></div><input type="range" min="10" max="100" step="1" value="'+g.N1+'" oninput="STATE.gears.N1=parseInt(this.value);MODULES.gears.compute()"></div><div class="ctrl"><div class="lbl"><span>N2 (driven)</span><span>'+g.N2+'</span></div><input type="range" min="10" max="200" step="1" value="'+g.N2+'" oninput="STATE.gears.N2=parseInt(this.value);MODULES.gears.compute()"></div></div><div class="sec"><h4>Input</h4><div class="ctrl"><div class="lbl"><span>ω1 (rad/s)</span><span>'+g.omega1+'</span></div><input type="range" min="0.1" max="100" step="1" value="'+g.omega1+'" oninput="STATE.gears.omega1=parseFloat(this.value);MODULES.gears.compute()"></div><div class="ctrl"><div class="lbl"><span>τ1 (Nm)</span><span>'+g.torque1+'</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+g.torque1+'" oninput="STATE.gears.torque1=parseFloat(this.value);MODULES.gears.compute()"></div><div class="ctrl"><div class="lbl"><span>η</span><span>'+g.efficiency+'</span></div><input type="range" min="0.5" max="1" step="0.01" value="'+g.efficiency+'" oninput="STATE.gears.efficiency=parseFloat(this.value);MODULES.gears.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Gear Trains</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Ratio:</b><br>N = N2/N1 = ω1/ω2 = τ2/τ1<br><br><b>Speed reduction:</b><br>ω2 = ω1/N<br>Torque increase:<br>τ2 = τ1·N·η<br><br><b>Power (lossless):</b><br>P = τ1·ω1 = τ2·ω2<br>Efficiency: η = P_out/P_in<br><br><b>Types:</b><br>• Spur: parallel shafts<br>• Helical: quieter, axial load<br>• Bevel: perpendicular shafts<br>• Worm: high ratio, self-locking<br>• Planetary: compact, high ratio<br>• Harmonic drive: zero backlash<br>• Cycloidal: high ratio<br><br><b>Applications:</b><br>Robot joints (harmonic, planetary)<br>Car transmissions<br>Wind turbines<br>Industrial machinery<br><br><b>Backlash:</b><br>Critical for precision<br>Harmonic drive: near-zero</div></div>'}});
registerModule('hydraulics',{title:'Hydraulics',icon:'💧',desc:'Fluid power systems',cat:'actuators',init:function(){this.compute()},
compute:function(){var h=STATE.hydraulics;h.force=h.pressure*h.area;h.velocity=h.flow/h.area;h.power=h.pressure*h.flow*h.efficiency;h.flowOut=h.velocity*h.area},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var h=STATE.hydraulics;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('HYDRAULICS — F='+fmt(h.force/1000,2)+' kN · v='+fmt(h.velocity,3)+' m/s',24,32);var cx=W/2,cy=H/2;var cw=200,ch=150;ctx.strokeStyle='#00d4ff';ctx.lineWidth=3;ctx.strokeRect(cx-cw/2,cy-ch/2,cw,ch);var fluidHeight=ch*(h.force/Math.max(h.pressure*h.area,1));ctx.fillStyle='rgba(0,212,255,.3)';ctx.fillRect(cx-cw/2,cy-ch/2,cw,ch);var pistonY=cy+ch/2-h.velocity*20;ctx.fillStyle='#ff8c30';ctx.fillRect(cx-cw/2+5,pistonY,cw-10,20);ctx.strokeStyle='#ff8c30';ctx.lineWidth=3;ctx.strokeRect(cx-cw/2+5,pistonY,cw-10,20);drawArrow(ctx,cx,cy+ch/2+30,cx,cy+ch/2+5,'#40ff90',3);ctx.fillStyle='#40ff90';ctx.font='bold 11px monospace';ctx.fillText('F='+fmt(h.force/1000,2)+' kN',cx+10,cy+ch/2+45);ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('P='+fmt(h.pressure/1e6,2)+' MPa',cx-cw/2,cy-ch/2-10);ctx.fillText('Q='+fmt(h.flow*1000,1)+' L/s',cx-cw/2+120,cy-ch/2-10);setStats('<div>F: '+fmt(h.force/1000,2)+'kN</div><div>v: '+fmt(h.velocity,3)+'</div><div>P: '+fmt(h.power/1000,2)+'kW</div>');badge('💧 Hydraulics · '+fmt(h.force/1000,1)+'kN');SV('sbX',fmt(h.force/1000,2));SV('sbTheta',fmt(h.velocity,3));SV('sbU',fmt(h.pressure/1e6,2));SV('sbE',fmt(h.flow*1000,1));SV('sbTau',fmt(h.power/1000,2))},
controls:function(){var h=STATE.hydraulics;return '<div class="sec"><h4>Pressure</h4><div class="ctrl"><div class="lbl"><span>P (MPa)</span><span>'+fmt(h.pressure/1e6,2)+'</span></div><input type="range" min="0.5" max="40" step="0.1" value="'+h.pressure/1e6+'" oninput="STATE.hydraulics.pressure=parseFloat(this.value)*1e6;MODULES.hydraulics.compute()"></div></div><div class="sec"><h4>Area</h4><div class="ctrl"><div class="lbl"><span>A (cm²)</span><span>'+fmt(h.area*10000,1)+'</span></div><input type="range" min="1" max="100" step="1" value="'+h.area*10000+'" oninput="STATE.hydraulics.area=parseFloat(this.value)/10000;MODULES.hydraulics.compute()"></div></div><div class="sec"><h4>Flow</h4><div class="ctrl"><div class="lbl"><span>Q (L/s)</span><span>'+fmt(h.flow*1000,1)+'</span></div><input type="range" min="0.1" max="20" step="0.1" value="'+h.flow*1000+'" oninput="STATE.hydraulics.flow=parseFloat(this.value)/1000;MODULES.hydraulics.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Hydraulics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Pascal\'s law:</b><br>P = F/A (uniform pressure)<br><br><b>Hydraulic force:</b><br>F = P·A<br><br><b>Flow rate:</b><br>Q = A·v (velocity)<br>v = Q/A<br><br><b>Power:</b><br>P_hyd = P·Q<br>P_mech = F·v<br>η = P_mech/P_hyd<br><br><b>Components:</b><br>• Pump (gear, piston, vane)<br>• Cylinder (single, double acting)<br>• Valves (direction, pressure, flow)<br>• Accumulator<br>• Reservoir<br>• Filters, coolers<br><br><b>Pressure levels:</b><br>• Low: 7-14 MPa<br>• Medium: 14-21 MPa<br>• High: 21-42 MPa<br>• Ultra-high: &gt; 42 MPa<br><br><b>Applications:</b><br>Excavators, cranes, presses<br>Aircraft (landing gear, flight controls)<br>Industrial robots<br>Marine, mining</div></div>'}});
</script>
<script>
registerModule('diffDrive',{title:'Differential Drive',icon:'🚗',desc:'Differential drive kinematics and control',cat:'mobile',init:function(){this.reset()},
reset:function(){var d=STATE.diffDrive;d.x=0;d.y=0;d.theta=0;d.trail=[];d.t=0},
step:function(dt){var d=STATE.diffDrive;var v=(d.vL+d.vR)/2;var w=(d.vR-d.vL)/d.wheelBase;d.x+=v*Math.cos(d.theta)*dt;d.y+=v*Math.sin(d.theta)*dt;d.theta+=w*dt;if(d.theta>Math.PI)d.theta-=2*Math.PI;if(d.theta<-Math.PI)d.theta+=2*Math.PI;d.trail.push({x:d.x,y:d.y,theta:d.theta});if(d.trail.length>500)d.trail.shift();d.t+=dt},
tick:function(dt){STATE.time+=dt;var d=STATE.diffDrive;if(!STATE.playing)return;for(var i=0;i<3;i++)this.step(dt/3)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var d=STATE.diffDrive;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('DIFF DRIVE — pos=('+fmt(d.x,2)+','+fmt(d.y,2)+') θ='+fmt(deg(d.theta),1)+'°',24,32);var cx=W/2,cy=H/2,scale=60;ctx.strokeStyle='rgba(0,212,255,.1)';ctx.lineWidth=1;for(var i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(cx+i*scale,cy-300);ctx.lineTo(cx+i*scale,cy+300);ctx.moveTo(cx-300,cy+i*scale);ctx.lineTo(cx+300,cy+i*scale);ctx.stroke()}ctx.strokeStyle='rgba(64,255,144,.4)';ctx.lineWidth=1.5;ctx.beginPath();d.trail.forEach(function(p,i){var x=cx+p.x*scale;var y=cy-p.y*scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var rx=cx+d.x*scale,ry=cy-d.y*scale;ctx.save();ctx.translate(rx,ry);ctx.rotate(-d.theta);ctx.fillStyle='#00d4ff';ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();ctx.rect(-20,-15,40,30);ctx.fill();ctx.stroke();ctx.fillStyle='#ff8c30';ctx.beginPath();ctx.arc(-15,-18,5,0,Math.PI*2);ctx.arc(-15,18,5,0,Math.PI*2);ctx.fill();drawArrow(ctx,0,0,25,0,'#40ff90',2);ctx.restore();setStats('<div>x: '+fmt(d.x,2)+'</div><div>y: '+fmt(d.y,2)+'</div><div>θ: '+fmt(deg(d.theta),1)+'°</div>');badge('🚗 Diff Drive');SV('sbX',fmt(d.x,2));SV('sbTheta',fmt(d.y,2));SV('sbU',fmt(d.vL,2));SV('sbE',fmt(d.vR,2));SV('sbTau',fmt(deg(d.theta),1)+'°')},
controls:function(){var d=STATE.diffDrive;return '<div class="sec"><h4>Wheel velocities</h4><div class="ctrl"><div class="lbl"><span>vL (m/s)</span><span>'+d.vL+'</span></div><input type="range" min="-3" max="3" step="0.1" value="'+d.vL+'" oninput="STATE.diffDrive.vL=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>vR (m/s)</span><span>'+d.vR+'</span></div><input type="range" min="-3" max="3" step="0.1" value="'+d.vR+'" oninput="STATE.diffDrive.vR=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.diffDrive.vL=1;STATE.diffDrive.vR=1;renderLeftPanel()">Straight</div><div class="chip" onclick="STATE.diffDrive.vL=-1;STATE.diffDrive.vR=1;renderLeftPanel()">Spin right</div><div class="chip" onclick="STATE.diffDrive.vL=1;STATE.diffDrive.vR=-1;renderLeftPanel()">Spin left</div><div class="chip" onclick="STATE.diffDrive.vL=0.5;STATE.diffDrive.vR=1.5;renderLeftPanel()">Turn</div></div></div><button class="btn primary full" onclick="STATE.diffDrive.trail=[]">Clear trail</button>'},mathPanel:function(){return '<div class="sec"><h4>Differential Drive</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Kinematics:</b><br>v = (vL + vR) / 2<br>ω = (vR − vL) / L<br><br>Position update:<br>ẋ = v·cos(θ)<br>ẏ = v·sin(θ)<br>θ̇ = ω<br><br><b>Inverse:</b><br>vL = v − ω·L/2<br>vR = v + ω·L/2<br><br><b>Odometry:</b><br>Δx = Δs·cos(θ + Δθ/2)<br>Δy = Δs·sin(θ + Δθ/2)<br><br><b>Non-holonomic:</b><br>Can\'t move sideways<br>Constrained motion<br><br><b>Control:</b><br>• Pure pursuit<br>• Stanley<br>• MPC<br>• Dynamic window<br><br><b>Applications:</b><br>Roomba, warehouse robots<br>AGVs, TurtleBot<br>Most mobile robots</div></div>'}});
registerModule('quadrotor',{title:'Quadrotor',icon:'⬢',desc:'Quadrotor dynamics and control',cat:'mobile',init:function(){this.reset()},
reset:function(){var q=STATE.quadrotor;q.t=0;q.x=0;q.y=0;q.z=1;q.phi=0;q.theta=0;q.psi=0;q.vx=0;q.vy=0;q.vz=0;q.history=[];q.trail=[]},
step:function(dt){var q=STATE.quadrotor;var thrust=q.cmd[0];var m=q.m;var g=q.g;q.vz+=((thrust*Math.cos(q.phi)*Math.cos(q.theta)-m*g)/m)*dt;q.vx+=(thrust*Math.sin(q.theta))/m*dt;q.vy+=(-thrust*Math.sin(q.phi))/m*dt;q.vx*=0.99;q.vy*=0.99;q.vz*=0.99;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;if(q.z<0){q.z=0;q.vz=Math.max(0,q.vz)};q.phi+=q.cmd[1]*dt*2;q.theta+=q.cmd[2]*dt*2;q.psi+=q.cmd[3]*dt*2;q.phi*=0.98;q.theta*=0.98;q.trail.push({x:q.x,y:q.y,z:q.z,phi:q.phi,theta:q.theta});if(q.trail.length>500)q.trail.shift();q.t+=dt;q.history.push({t:q.t,x:q.x,y:q.y,z:q.z,phi:q.phi,theta:q.theta});if(q.history.length>500)q.history.shift()},
tick:function(dt){STATE.time+=dt;var q=STATE.quadrotor;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var q=STATE.quadrotor;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('QUADROTOR — pos=('+fmt(q.x,2)+','+fmt(q.y,2)+','+fmt(q.z,2)+')',24,32);var cx=W/2,cy=H/2,scale=100;ctx.strokeStyle='rgba(0,212,255,.1)';ctx.lineWidth=1;for(var i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(cx+i*scale,cy-scale*3);ctx.lineTo(cx+i*scale,cy+scale*3);ctx.moveTo(cx-scale*3,cy+i*scale);ctx.lineTo(cx+scale*3,cy+i*scale);ctx.stroke()}ctx.strokeStyle='rgba(64,255,144,.4)';ctx.lineWidth=1.5;ctx.beginPath();q.trail.forEach(function(p,i){var x=cx+p.x*scale;var y=cy-p.y*scale;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var rx=cx+q.x*scale;var ry=cy-q.y*scale;var size=30+q.z*5;ctx.save();ctx.translate(rx,ry);ctx.rotate(-q.psi);ctx.fillStyle='#00d4ff';ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,size,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ff8c30';var pos=[[-size*0.7,-size*0.7],[size*0.7,-size*0.7],[-size*0.7,size*0.7],[size*0.7,size*0.7]];pos.forEach(function(p,i){var thrust=q.cmd[0]/9.81;ctx.globalAlpha=0.3+thrust*0.5;ctx.beginPath();ctx.arc(p[0],p[1],8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});ctx.restore();ctx.fillStyle='rgba(0,212,255,.9)';ctx.fillRect(cx-200,cy+150,400,40);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('Altitude: '+fmt(q.z,2)+' m    |    Roll: '+fmt(deg(q.phi),1)+'°    Pitch: '+fmt(deg(q.theta),1)+'°',cx-190,cy+175);setStats('<div>x: '+fmt(q.x,2)+'</div><div>y: '+fmt(q.y,2)+'</div><div>z: '+fmt(q.z,2)+'</div>');badge('⬢ Quadrotor · z='+fmt(q.z,2));SV('sbX',fmt(q.x,2));SV('sbTheta',fmt(q.y,2));SV('sbU',fmt(q.z,2));SV('sbE',fmt(q.phi,2));SV('sbTau',fmt(q.theta,2))},
controls:function(){var q=STATE.quadrotor;return '<div class="sec"><h4>Thrust (u1)</h4><div class="ctrl"><div class="lbl"><span>Force (N)</span><span>'+fmt(q.cmd[0],2)+'</span></div><input type="range" min="0" max="20" step="0.1" value="'+q.cmd[0]+'" oninput="STATE.quadrotor.cmd[0]=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Moments</h4><div class="ctrl"><div class="lbl"><span>Roll (u2)</span><span>'+fmt(q.cmd[1],3)+'</span></div><input type="range" min="-2" max="2" step="0.05" value="'+q.cmd[1]+'" oninput="STATE.quadrotor.cmd[1]=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>Pitch (u3)</span><span>'+fmt(q.cmd[2],3)+'</span></div><input type="range" min="-2" max="2" step="0.05" value="'+q.cmd[2]+'" oninput="STATE.quadrotor.cmd[2]=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Autopilot</h4><div class="chip-row"><div class="chip" onclick="STATE.quadrotor.cmd=[9.81,0,0,0]">Hover</div><div class="chip" onclick="STATE.quadrotor.cmd=[14,0.5,0,0]">Rise</div><div class="chip" onclick="STATE.quadrotor.cmd=[9.81,1,0,0]">Roll right</div><div class="chip" onclick="STATE.quadrotor.cmd=[9.81,0,1,0]">Pitch fwd</div></div></div><button class="btn primary full" onclick="MODULES.quadrotor.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>Quadrotor</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Dynamics:</b><br>m·ẍ = u1·(cos φ sin θ cos ψ + sin φ sin ψ)<br>m·ÿ = u1·(cos φ sin θ sin ψ − sin φ cos ψ)<br>m·z̈ = u1·cos φ cos θ − m·g<br><br><b>Attitude:</b><br>I·ω̇ = τ − ω×(I·ω)<br>τ = [u2, u3, u4]<br><br><b>Controls:</b><br>u1: total thrust<br>u2: roll moment<br>u3: pitch moment<br>u4: yaw moment<br><br><b>Underactuated:</b><br>4 inputs, 6 DOF<br>Position ← attitude<br>Attitude must be controlled first<br><br><b>Control:</b><br>• Cascade PID (attitude + position)<br>• Backstepping<br>• Sliding mode<br>• LQR<br>• MPC<br>• Geometric (SE(3))<br><br><b>Applications:</b><br>Photography, delivery, inspection, military</div></div>'}});
registerModule('bipedal',{title:'Bipedal Walker',icon:'🚶',desc:'Bipedal locomotion and gait cycle',cat:'mobile',init:function(){this.reset()},
reset:function(){var b=STATE.bipedal;b.t=0;b.x=0;b.y=1;b.phase='stance';b.step=0.5;b.hipAngle=0.3;b.kneeAngle=0.5;b.footX=0;b.footY=0;b.history=[]},
step:function(dt){var b=STATE.bipedal;b.t+=dt;var cycle=b.t%1;if(cycle<0.5){b.phase='stance';b.y=1+Math.sin(cycle*Math.PI*2)*0.03;b.x+=0.005;b.hipAngle=0.3-Math.sin(cycle*Math.PI*2)*0.2}else{b.phase='swing';b.y=1+Math.sin(cycle*Math.PI)*0.1;b.hipAngle=0.3+Math.sin((cycle-0.5)*Math.PI*2)*0.3}b.footX=b.hipAngle*0.5;b.footY=b.y-Math.cos(b.hipAngle)*0.8;b.history.push({t:b.t,x:b.x,y:b.y,phase:b.phase});if(b.history.length>500)b.history.shift()},
tick:function(dt){STATE.time+=dt;var b=STATE.bipedal;if(!STATE.playing)return;for(var i=0;i<4;i++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var b=STATE.bipedal;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('BIPEDAL WALKER — x='+fmt(b.x,2)+' m · phase: '+b.phase,24,32);var cx=W/2,cy=H*0.65,scale=Math.min(W,H)/3;ctx.strokeStyle='rgba(0,212,255,.15)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.stroke();var hipX=cx+b.x*scale;var hipY=cy-b.y*scale;ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.arc(hipX,hipY,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#00d4ff';ctx.lineWidth=8;ctx.lineCap='round';var frontKnee={x:hipX+Math.sin(b.hipAngle)*scale*0.2,y:hipY+Math.cos(b.hipAngle)*scale*0.2};ctx.beginPath();ctx.moveTo(hipX,hipY);ctx.lineTo(frontKnee.x,frontKnee.y);ctx.stroke();var frontFoot={x:frontKnee.x+Math.sin(b.hipAngle-b.kneeAngle)*scale*0.2,y:frontKnee.y+Math.cos(b.hipAngle-b.kneeAngle)*scale*0.2};ctx.beginPath();ctx.moveTo(frontKnee.x,frontKnee.y);ctx.lineTo(frontFoot.x,frontFoot.y);ctx.stroke();var backKnee={x:hipX+Math.sin(b.hipAngle+0.3)*scale*0.2,y:hipY+Math.cos(b.hipAngle+0.3)*scale*0.2};ctx.strokeStyle='#ff8c30';ctx.beginPath();ctx.moveTo(hipX,hipY);ctx.lineTo(backKnee.x,backKnee.y);ctx.stroke();var backFoot={x:backKnee.x+Math.sin(b.hipAngle+0.3-0.4)*scale*0.2,y:backKnee.y+Math.cos(b.hipAngle+0.3-0.4)*scale*0.2};ctx.beginPath();ctx.moveTo(backKnee.x,backKnee.y);ctx.lineTo(backFoot.x,backFoot.y);ctx.stroke();ctx.lineCap='butt';ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(frontFoot.x,frontFoot.y,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(backFoot.x,backFoot.y,8,0,Math.PI*2);ctx.fill();setStats('<div>x: '+fmt(b.x,2)+'</div><div>y: '+fmt(b.y,2)+'</div><div>phase: '+b.phase+'</div>');badge('🚶 Bipedal · '+b.phase);SV('sbX',fmt(b.x,2));SV('sbTheta',fmt(b.y,2));SV('sbU',b.phase);SV('sbE',fmt(deg(b.hipAngle),1)+'°');SV('sbTau',fmt(deg(b.kneeAngle),1)+'°')},
controls:function(){var b=STATE.bipedal;return '<div class="sec"><h4>Gait</h4><div class="ctrl"><div class="lbl"><span>Hip angle</span><span>'+fmt(deg(b.hipAngle),1)+'°</span></div><input type="range" min="-0.5" max="0.8" step="0.01" value="'+b.hipAngle+'" oninput="STATE.bipedal.hipAngle=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>Knee angle</span><span>'+fmt(deg(b.kneeAngle),1)+'°</span></div><input type="range" min="0.1" max="1.2" step="0.01" value="'+b.kneeAngle+'" oninput="STATE.bipedal.kneeAngle=parseFloat(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.bipedal.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>Bipedal Locomotion</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Gait cycle:</b><br>1. Stance (foot on ground)<br>2. Swing (foot in air)<br>Duty factor: stance/total<br><br><b>Zero Moment Point (ZMP):</b><br>Pivot where total moment = 0<br>Must stay in support polygon<br>Stability criterion<br><br><b>Capture Point:</b><br>CP = x_com + ẋ_com·√(z_com/g)<br>Where to step to stop<br><br><b>Models:</b><br>• LIPM (Linear Inverted Pendulum)<br>• SLIP (Spring Loaded Inverted)<br>• 3D compass<br>• Full dynamics (30+ DOF)<br><br><b>Control:</b><br>• ZMP preview control<br>• Capture point<br>• MPC<br>• RL (Boston Dynamics, ANYmal)<br><br><b>Examples:</b><br>ASIMO (Honda), Atlas (Boston Dynamics)<br>Cassie, Digit, Unitree H1<br>Optimus (Tesla), Figure 01</div></div>'}});
registerModule('impedance',{title:'Impedance Control',icon:'⊂',desc:'Force and impedance control for interaction',cat:'advanced',init:function(){this.reset()},
reset:function(){var i=STATE.impedance;i.x=0;i.xd=0;i.t=0;i.history=[]},
step:function(dt){var imp=STATE.impedance;var F_cmd=imp.md*(-imp.kd/imp.md*(imp.x-imp.x_ref)-imp.bd/imp.md*imp.xd)+imp.F_ext;var acc=(F_cmd+imp.F_ext-imp.bd*imp.xd-imp.kd*(imp.x-imp.x_ref))/imp.md;imp.xd+=acc*dt;imp.x+=imp.xd*dt;imp.t+=dt;imp.history.push({t:imp.t,x:imp.x,xd:imp.xd,F:imp.F_ext});if(imp.history.length>500)imp.history.shift()},
tick:function(dt){STATE.time+=dt;var i=STATE.impedance;if(!STATE.playing)return;for(var j=0;j<4;j++)this.step(dt/4)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var i=STATE.impedance;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('IMPEDANCE CONTROL — x='+fmt(i.x,3)+' · F='+fmt(i.F_ext,2)+' N',24,32);var px=60,py=60,pw=W-140,ph=H*0.35;drawAxes(ctx,px,py,pw,ph,'time','x');ctx.strokeStyle='rgba(255,140,48,.5)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px,py+ph/2-i.x_ref/3*ph/2);ctx.lineTo(px+pw,py+ph/2-i.x_ref/3*ph/2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();i.history.forEach(function(h,idx){var x=px+idx/Math.max(i.history.length,1)*pw;var y=py+ph/2-h.x/3*ph/2;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'time','F (N)');ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();i.history.forEach(function(h,idx){var x=px+idx/Math.max(i.history.length,1)*pw;var y=p2+ph*0.6/2-h.F/20*ph*0.6/2;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#40ff90';ctx.font='10px monospace';ctx.fillText('external force',px+10,p2+15);setStats('<div>x: '+fmt(i.x,3)+'</div><div>ẋ: '+fmt(i.xd,3)+'</div><div>F: '+fmt(i.F_ext,2)+'</div>');badge('⊂ Impedance Control');SV('sbX',fmt(i.x,3));SV('sbTheta',fmt(i.xd,3));SV('sbU',fmt(i.md,2));SV('sbE',fmt(i.bd,2));SV('sbTau',fmt(i.kd,2))},
controls:function(){var i=STATE.impedance;return '<div class="sec"><h4>Impedance</h4><div class="ctrl"><div class="lbl"><span>md (mass)</span><span>'+i.md+'</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+i.md+'" oninput="STATE.impedance.md=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>bd (damping)</span><span>'+i.bd+'</span></div><input type="range" min="1" max="50" step="1" value="'+i.bd+'" oninput="STATE.impedance.bd=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>kd (stiffness)</span><span>'+i.kd+'</span></div><input type="range" min="10" max="500" step="10" value="'+i.kd+'" oninput="STATE.impedance.kd=parseFloat(this.value);renderLeftPanel()"></div></div><div class="sec"><h4>Reference</h4><div class="ctrl"><div class="lbl"><span>x_ref</span><span>'+i.x_ref+'</span></div><input type="range" min="-2" max="2" step="0.1" value="'+i.x_ref+'" oninput="STATE.impedance.x_ref=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>F_ext (N)</span><span>'+i.F_ext+'</span></div><input type="range" min="-20" max="20" step="1" value="'+i.F_ext+'" oninput="STATE.impedance.F_ext=parseFloat(this.value);renderLeftPanel()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Impedance Control</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Objective:</b><br>Make robot behave as mass-spring-damper<br><br><b>Impedance equation:</b><br>Md·(ẍ − ẍd) + Bd·(ẋ − ẋd) + Kd·(x − xd) = F_ext<br><br>Md: desired inertia<br>Bd: desired damping<br>Kd: desired stiffness<br><br><b>Admittance control:</b><br>Force → Position (dual)<br><br><b>Control modes:</b><br>• Pure impedance (F = f(x))<br>• Pure admittance (v = f(F))<br>• Hybrid (both)<br><br><b>Tuning:</b><br>Stiff → position control<br>Soft → compliant interaction<br>Overdamped: ζ &gt; 1<br>Underdamped: ζ &lt; 1<br><br><b>Applications:</b><br>• Human-robot collaboration<br>• Assembly (peg-in-hole)<br>• Polishing, grinding<br>• Surgery (force feedback)<br>• Exoskeletons<br>• Legged robots (compliant contact)</div></div>'}});
registerModule('rl',{title:'Reinforcement Learning',icon:'🎓',desc:'Q-learning for robot control',cat:'advanced',init:function(){this.reset()},
reset:function(){var r=STATE.rl;r.state=0;r.action=0;r.Q=[[0,0,0],[0,0,0]];r.reward=0;r.totalReward=0;r.episodes=0;r.history=[];r.steps=0},
step:function(){var r=STATE.rl;var action;if(Math.random()<r.epsilon){action=rnd(0,2)}else{var qs=r.Q[r.state];action=qs.indexOf(Math.max.apply(null,qs))}var nextState,reward;if(action===2){nextState=r.state;reward=0;r.episodes++}else if(action===0){nextState=Math.max(0,r.state-1);reward=-1}else{nextState=Math.min(1,r.state+1);reward=nextState===1?10:-1}r.Q[r.state][action]+=r.lr*(reward+r.gamma*Math.max.apply(null,r.Q[nextState])-r.Q[r.state][action]);r.state=nextState;r.reward=reward;r.totalReward+=reward;r.steps++;r.history.push({steps:r.steps,state:r.state,reward:reward,total:r.totalReward});if(r.history.length>500)r.history.shift()},
tick:function(dt){STATE.time+=dt;var r=STATE.rl;if(!STATE.playing)return;for(var i=0;i<3;i++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020608';ctx.fillRect(0,0,W,H);var r=STATE.rl;ctx.fillStyle='#00d4ff';ctx.font='bold 15px monospace';ctx.fillText('Q-LEARNING — state='+r.state+' · total reward='+fmt(r.totalReward,1),24,32);var cx=W/2,cy=H*0.4;var states=[{x:cx-150,y:cy,name:'Start'},{x:cx+150,y:cy,name:'Goal'}];ctx.strokeStyle='rgba(0,212,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(states[0].x+20,cy);ctx.lineTo(states[1].x-20,cy);ctx.stroke();drawArrow(ctx,states[0].x+20,cy-10,states[0].x+60,cy-10,'#40ff90',2);drawArrow(ctx,states[1].x-60,cy+10,states[1].x-20,cy+10,'#ff4080',2);states.forEach(function(s,i){ctx.fillStyle=i===r.state?'#40ff90':'#00d4ff';ctx.beginPath();ctx.arc(s.x,s.y,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020608';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(s.name,s.x,s.y+4);ctx.textAlign='left'});var qx=60,qy=cy+100,qw=W-120,qh=H*0.3;ctx.fillStyle='rgba(8,18,26,.9)';ctx.fillRect(qx,qy,qw,qh);ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.2;ctx.strokeRect(qx,qy,qw,qh);ctx.fillStyle='#00d4ff';ctx.font='bold 11px monospace';ctx.fillText('Q-TABLE',qx+10,qy+20);ctx.font='10px monospace';ctx.fillStyle='#80b0d0';ctx.fillText('State   Left    Stay    Right',qx+20,qy+50);[0,1].forEach(function(s){ctx.fillStyle='#80b0d0';ctx.fillText('State '+s,qx+20,qy+70+s*22);[0,1,2].forEach(function(a){var max=Math.max.apply(null,r.Q[s]);var color=r.Q[s][a]===max?'#40ff90':'#00d4ff';ctx.fillStyle=color;ctx.fillText(fmt(r.Q[s][a],2),qx+100+a*80,qy+70+s*22)})});setStats('<div>State: '+r.state+'</div><div>Reward: '+fmt(r.totalReward,1)+'</div><div>Steps: '+r.steps+'</div>');badge('🎓 RL · '+fmt(r.totalReward,0));SV('sbX',r.state);SV('sbTheta',fmt(r.totalReward,1));SV('sbU',r.steps);SV('sbE',fmt(r.lr,2));SV('sbTau',fmt(r.gamma,2))},
controls:function(){var r=STATE.rl;return '<div class="sec"><h4>Hyperparameters</h4><div class="ctrl"><div class="lbl"><span>α (lr)</span><span>'+r.lr+'</span></div><input type="range" min="0.01" max="0.9" step="0.01" value="'+r.lr+'" oninput="STATE.rl.lr=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>γ (discount)</span><span>'+r.gamma+'</span></div><input type="range" min="0.5" max="0.99" step="0.01" value="'+r.gamma+'" oninput="STATE.rl.gamma=parseFloat(this.value);renderLeftPanel()"></div><div class="ctrl"><div class="lbl"><span>ε (explore)</span><span>'+r.epsilon+'</span></div><input type="range" min="0" max="0.5" step="0.01" value="'+r.epsilon+'" oninput="STATE.rl.epsilon=parseFloat(this.value);renderLeftPanel()"></div></div><button class="btn primary full" onclick="MODULES.rl.reset()">↺ Reset Q-table</button>'},mathPanel:function(){return '<div class="sec"><h4>Q-Learning</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Update rule:</b><br>Q(s,a) ← Q(s,a) + α·[r + γ·max Q(s\',a\') − Q(s,a)]<br><br><b>Variables:</b><br>α: learning rate (0-1)<br>γ: discount factor (0-1)<br>ε: exploration (ε-greedy)<br><br><b>Algorithm:</b><br>1. Choose action (ε-greedy)<br>2. Execute, observe reward and next state<br>3. Update Q-value<br>4. Repeat<br><br><b>Off-policy:</b><br>Learns optimal policy<br>Independent of behavior<br><br><b>Variants:</b><br>• SARSA (on-policy)<br>• DQN (deep Q-network)<br>• Double DQN<br>• Dueling DQN<br>• PPO, A3C, SAC<br>• TD3, DDPG<br><br><b>Applications:</b><br>• Robot control<br>• Game playing (AlphaGo)<br>• Autonomous driving<br>• Manipulation<br>• Locomotion (ANYmal, Atlas)<br>• Sim-to-real transfer</div></div>'}});
</script>
<script>
function buildCategories(){var b=$('lpBody');b.innerHTML='';CATS.forEach(function(cat){var sec=el('div',{class:'cat-section open','data-cat':cat.id});var head=el('div',{class:'cat-head'});head.innerHTML='<span>'+cat.icon+' '+cat.name+'</span><span class="cat-arrow">▸</span>';head.onclick=function(){sec.classList.toggle('open')};var items=el('div',{class:'cat-items'});cat.items.forEach(function(key){var m=MODULES[key];if(!m)return;var it=el('div',{class:'cat-item','data-key':key});it.innerHTML='<span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span>';it.onclick=function(){switchTab(key)};items.appendChild(it)});sec.appendChild(head);sec.appendChild(items);b.appendChild(sec)});updateActiveCat()}
function updateActiveCat(){$$('.cat-item').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-key')===STATE.currentTab)})}
function updateBreadcrumb(){var m=MODULES[STATE.currentTab];var b=$('breadcrumb');if(!m||STATE.currentTab==='home'){b.innerHTML='<div class="bc-item"><span style="color:var(--p1)">Home</span></div>';return}var cat=CATS.find(function(c){return c.items.indexOf(STATE.currentTab)>=0});var h='<div class="bc-item" onclick="openHome()" style="cursor:pointer"><span style="color:var(--tx3)">Home</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item"><span style="color:var(--tx3)">'+(cat?cat.name:'—')+'</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item active"><span>'+m.icon+' '+m.title+'</span></div>';b.innerHTML=h}
function switchTab(k){STATE.currentTab=k;var m=MODULES[k];if(!m){openHome();return}SV('sbMode',m.title);try{if(m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}renderLeftPanel();renderRightPanel();updateActiveCat();updateBreadcrumb()}
function openHome(){STATE.currentTab='home';SV('sbMode','Home');var b=$('lpBody');buildCategories();var h='<div class="sec"><h4>7 Categories · '+Object.keys(MODULES).length+' Modules</h4><div class="grid-overlay">';CATS.forEach(function(cat){h+='<div class="card" onclick="document.querySelector(\'.cat-section[data-cat=&quot;'+cat.id+'&quot;]\').scrollIntoView({behavior:\'smooth\'})"><div class="card-title">'+cat.icon+' '+cat.name+'</div><div class="card-desc">'+cat.items.length+' modules</div></div>'});h+='</div></div>';$('rpState').innerHTML=h;updateBreadcrumb();var W=CANV.W,H=CANV.H;if(CANV.ctx){CANV.ctx.fillStyle='#020608';CANV.ctx.fillRect(0,0,W,H);CANV.ctx.fillStyle='#00d4ff';CANV.ctx.font='bold 52px monospace';CANV.ctx.textAlign='center';CANV.ctx.fillText('HELIX',W/2,H/2-50);CANV.ctx.font='14px monospace';CANV.ctx.fillStyle='#80b0d0';CANV.ctx.fillText('Robotics · Control Systems · Mechatronics Studio',W/2,H/2-10);CANV.ctx.font='12px monospace';CANV.ctx.fillStyle='#405870';CANV.ctx.fillText('Press ⌘K or Ctrl+K to search · Click any module',W/2,H/2+40);CANV.ctx.textAlign='left'}}
function switchRp(name,e){STATE.currentRp=name;$$('.rp-tab').forEach(function(t){t.classList.remove('active')});e.classList.add('active');$$('.rp-pane').forEach(function(p){p.classList.remove('active')});var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));if(p)p.classList.add('active');renderRightPanel()}
function renderLeftPanel(){var m=MODULES[STATE.currentTab];if(!m){buildCategories();return}updateBreadcrumb()}
function renderRightPanel(){var m=MODULES[STATE.currentTab];var s=$('rpState');if(s){if(STATE.currentTab==='home')return;var st='<div class="sec"><h4>'+m.icon+' '+m.title+'</h4>';st+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-bottom:8px">'+esc(m.desc||'')+'</div>';st+='<div class="kv"><div class="row"><span class="k">Module</span><span class="v">'+m.title+'</span></div>';var cat=CATS.find(function(c){return c.items.indexOf(m.key)>=0});st+='<div class="row"><span class="k">Category</span><span class="v">'+(cat?cat.name:'—')+'</span></div>';st+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div></div></div>';s.innerHTML=st}var mp=$('rpMath');if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}if(STATE.currentRp==='logs')renderLogs();renderControlsToLeft()}
function renderControlsToLeft(){var b=$('lpBody');if(!b)return;var m=MODULES[STATE.currentTab];if(!m){buildCategories();return}var h='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.68rem">'+m.icon+' '+m.title+'</h4></div>';try{if(m.controls)h+=m.controls()}catch(e){h+='<div class="sec"><div class="empty">error: '+esc(e.message)+'</div></div>'}h+='<div class="sec"><button class="btn full" onclick="buildCategories();updateActiveCat()">← All categories</button></div>';b.innerHTML=h}
function renderLogs(){var p=$('rpLogs');if(!p)return;var h='<div class="sec"><h4>Log <span class="badge">'+LOG.length+'</span></h4>';if(!LOG.length)h+='<div class="empty">No events</div>';else LOG.slice().reverse().forEach(function(l){var c=l.type==='error'?'var(--p4)':l.type==='success'?'var(--p1)':'var(--p2)';h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:2px;font-family:var(--mono);font-size:.55rem;color:'+c+'">'+esc(l.msg)+'</div>'});h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('btnPlay').classList.toggle('pulse',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',700)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',700)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',700)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['helix','light','industrial','matrix','cyber'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function filterTabs(v){v=v.toLowerCase();if(!v){buildCategories();return}var b=$('lpBody');b.innerHTML='';var matched=[];TABS.forEach(function(t){if(t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0)matched.push(t)});if(!matched.length){b.innerHTML='<div class="empty">Nothing found</div>';return}var h='<div class="sec"><h4>Results <span class="badge">'+matched.length+'</span></h4>';matched.forEach(function(m){h+='<div class="cat-item" onclick="switchTab(\''+m.key+'\')"><span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span></div>'});h+='</div>';b.innerHTML=h}
function openCmdPalette(){$('cmdPalette').classList.add('show');$('cmdInput').value='';filterCmd('');$('cmdInput').focus()}
function closeCmdPalette(){$('cmdPalette').classList.remove('show')}
function filterCmd(v){v=(v||'').toLowerCase();var r=$('cmdResults');r.innerHTML='';var items=[];TABS.forEach(function(t){if(!v||t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0){var cat=CATS.find(function(c){return c.items.indexOf(t.key)>=0});items.push({icon:t.icon,name:t.title,cat:cat?cat.name:'—',action:function(){switchTab(t.key);closeCmdPalette()}})}});[{icon:'🏠',name:'Home',cat:'Nav',action:function(){openHome();closeCmdPalette()}},{icon:'⚙',name:'Settings',cat:'System',action:function(){openSettings();closeCmdPalette()}},{icon:'🎨',name:'Theme',cat:'System',action:function(){toggleTheme();closeCmdPalette()}},{icon:'❓',name:'Help',cat:'System',action:function(){openHelp();closeCmdPalette()}}].forEach(function(cmd){if(!v||cmd.name.toLowerCase().indexOf(v)>=0)items.push(cmd)});if(!items.length){r.innerHTML='<div class="cmd-empty">Nothing found for "'+esc(v)+'"</div>';return}items.forEach(function(it,i){var e=el('div',{class:'cmd-item'+(i===0?' selected':'')});e.innerHTML='<span class="cmd-icon">'+it.icon+'</span><span class="cmd-name">'+it.name+'</span><span class="cmd-cat">'+it.cat+'</span>';e.onclick=it.action;r.appendChild(e)});r.querySelectorAll('.cmd-item').forEach(function(e){e.onmouseenter=function(){r.querySelectorAll('.cmd-item').forEach(function(x){x.classList.remove('selected')});e.classList.add('selected')}})}
function cmdKeydown(e){var r=$('cmdResults');if(e.key==='Escape'){closeCmdPalette();e.preventDefault()}else if(e.key==='Enter'){var sel=r.querySelector('.cmd-item.selected');if(sel)sel.click()}else if(e.key==='ArrowDown'){e.preventDefault();var items=r.querySelectorAll('.cmd-item');var cur=Array.from(items).findIndex(function(x){return x.classList.contains('selected')});var next=Math.min(items.length-1,cur+1);items.forEach(function(x){x.classList.remove('selected')});items[next].classList.add('selected');items[next].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'){e.preventDefault();var items2=r.querySelectorAll('.cmd-item');var cur2=Array.from(items2).findIndex(function(x){return x.classList.contains('selected')});var prev=Math.max(0,cur2-1);items2.forEach(function(x){x.classList.remove('selected')});items2[prev].classList.add('selected');items2[prev].scrollIntoView({block:'nearest'})}}
function openSettings(){openModal('⚙ Settings','<div class="sec"><h4>Theme</h4><div class="chip-row">'+THEMES.map(function(t){return '<div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\''+t+'\');closeModal();toast(\'Theme: '+t+'\',\'success\')">'+t+'</div>'}).join('')+'</div></div><div class="sec"><h4>Layout</h4><div class="chip-row"><div class="chip" onclick="toggleLeftPanel()">Toggle Left Panel</div><div class="chip" onclick="toggleRightPanel()">Toggle Right Panel</div></div></div><div class="sec"><h4>About</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)"><b>HELIX</b> · Robotics, Control & Mechatronics Studio<br>30 modules · 7 categories · Pure JavaScript<br>Real algorithms — no external deps</div></div>','<button class="btn primary" onclick="closeModal()">OK</button>',{size:'sm'})}

ules<br>• Bode — frequency response<br>• Denavit-Hartenberg — 4-parameter transform<br>• Forward kinematics — DH chain multiplication<br>• Inverse kinematics — analytical 2-DOF<br>• Jacobian — analytical 2×2 matrix + det<br>• Workspace — manipulability analysis<br>• Lagrangian dynamics — Euler-Lagrange<br>• Newton-Euler — recursive O(n) algorithm<br>• Inertia matrix — M(q) with eigenvalues<br>• Contact dynamics — spring-damper model<br>• Cubic + quintic trajectories<br>• A* — optimal grid search with heuristic<br>• RRT — rapidly-exploring random tree<br>• SLAM — simultaneous localization and mapping<br>• DC motor — back-EMF electrical model<br>• BLDC — electronic commutation<br>• Gears — ratio, efficiency, power<br>• Hydraulics — Pascal law + flow<br>• Differential drive — non-holonomic kinematics<br>• Quadrotor — underactuated dynamics<br>• Bipedal — gait cycle + ZMP concept<br>• Impedance — mass-spring-damper interaction<br>• Q-learning — TD update rule</div></div><div class="sec"><h4>⌨ Keyboard Shortcuts</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b>⌘K / Ctrl+K</b> — Command palette<br><b>Space</b> — Play/Pause<br><b>→</b> — Step forward<br><b>R</b> — Reset module<br><b>T</b> — Toggle theme<br><b>L</b> — Toggle left panel<br><b>I</b> — Toggle right panel<br><b>S</b> — Settings<br><b>?</b> — This help<br><b>Esc</b> — Close modal/palette</div></div><div class="sec"><h4>💼 Industry Leaders</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b>Industrial:</b> Fanuc, ABB, KUKA, Yaskawa, Universal Robots<br><b>Humanoid:</b> Boston Dynamics, Tesla, Figure, Agility<br><b>Drones:</b> DJI, Skydio, Zipline<br><b>Surgical:</b> Intuitive Surgical, Medtronic<br><b>Simulation:</b> NVIDIA Isaac, Gazebo, MuJoCo<br><b>Consumer:</b> iRobot, Ecovacs, Roborock<br><b>Warehouse:</b> Amazon Robotics, Ocado<br><b>Agricultural:</b> John Deere, Naio<br><br><b>Global market:</b> '+blob+'300B+ growing 15% YoY</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;var mod=e.ctrlKey||e.metaKey;if(mod&&e.key==='k'){e.preventDefault();openCmdPalette()}else if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}else if(e.key==='r'||e.key==='R')resetModule();else if(e.key==='t'||e.key==='T')toggleTheme();else if(e.key==='l'||e.key==='L')toggleLeftPanel();else if(e.key==='i'||e.key==='I')toggleRightPanel();else if(e.key==='s'||e.key==='S')openSettings();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))openHelp();else if(e.key==='Escape'){closeModal();closeCmdPalette()}});
document.addEventListener('click',function(e){if(e.target===$('cmdPalette'))closeCmdPalette()});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){var dt=Math.min((now-lastT)/1000,0.05);lastT=now;fAcc+=dt;fFr++;if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}var m=MODULES[STATE.currentTab];if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){logMsg('draw('+m.key+') error: '+e.message,'error');try{CANV.ctx.fillStyle='#020608';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#00d4ff';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}}}requestAnimationFrame(loop)}
