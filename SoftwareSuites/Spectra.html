}
ctx.stroke();
// Reference -3dB
ctx.strokeStyle='rgba(255,176,0,.4)';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(30,70+(H-200)-3/100*(H-200));ctx.lineTo(30+pw,70+(H-200)-3/100*(H-200));ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ffb000';ctx.font='9px monospace';
ctx.fillText('-3 dB',30+pw-40,70+(H-200)-3/100*(H-200)-3);
// True peak location
var peakX=30+l.f/(l.N/2)*pw;
ctx.strokeStyle='#ff4060';ctx.setLineDash([2,3]);

/* Metrics */

ctx.fillStyle='rgba(10,12,20,.85)';

ctx.fillStyle='#00ffa0';
ctx.fillText(l.window,sx+130,sy+70);
ctx.fillStyle='#7090b8';
ctx.fillText('Side lobe:',sx+10,sy+92);
var sll={rect:'-13 dB',hann:'-31 dB',hamming:'-41 dB',blackman:'-57 dB'}[l.window];
ctx.fillStyle='#ffb000';

ctx.fillStyle='#7090b8';
ctx.fillText('Rolloff:',sx+10,sy+114);

ctx.fillStyle='#ffb000';

ctx.fillStyle='#7090b8';

var ml={rect:'2 bins',hann:'4 bins',hamming:'4 bins',blackman:'6 bins'}[l.window];
ctx.fillStyle='#ffb000';
ctx.fillText(ml,sx+130,sy+136);
setStats('<div>f: '+l.f+' bins</div><div>Window: '+l.window+'</div><div>SLL: '+sll+'</div>');
badge('🎯 Leakage · '+l.window);SV('sbRmse',sll)},

registerModule('channel',{title:'Channel Coding Trade-off',icon:'📊',desc:'Coding gain vs bandwidth expansion.',init:function(){this.compute()},
compute:function(){var c=STATE.channel||{};
STATE.channel=c;
c.codeRate=0.5;c.snr=5;c.ebN0Min=-1.59;
// SNR vs Eb/N0
c.ebN0=c.snr-10*Math.log10(1/c.codeRate);
// Shannon limit for rate R
c.shannonEbN0=(Math.pow(2,c.codeRate)-1)/c.codeRate;
c.shannonEbN0dB=10*Math.log10(c.shannonEbN0);
// BER for uncoded BPSK
c.berUncoded=0.5*Math.exp(-Math.pow(10,c.ebN0/10));
// BER with coding (approximate)
c.berCoded=0.5*Math.exp(-Math.pow(10,(c.ebN0+3)/10));
// Coding gain
c.codingGain=10*Math.log10(1/c.codeRate)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020306';ctx.fillRect(0,0,W,H);
var c=STATE.channel;
if(!c.codeRate)return;
ctx.fillStyle='#00c8ff';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('CHANNEL CODING — R='+c.codeRate+' · Eb/N0='+fmt(c.ebN0,2)+' dB',30,30);
var pw=W-60;
var plotH=H-180;
/* BER curve */
ctx.fillStyle='#00c8ff';ctx.font='bold 11px monospace';
ctx.fillText('BER vs Eb/N0',30,60);
drawGrid(ctx,30,80,pw,plotH,8,10);
// X: Eb/N0 from -2 to 12 dB
// Y: log BER from 1e0 to 1e-6
ctx.strokeStyle='#00c8ff';ctx.lineWidth=2;
ctx.beginPath();
var first=true;
for(var snrDb=-2;snrDb<=12;snrDb+=0.2){
  var ber=0.5*Math.exp(-Math.pow(10,snrDb/10));
  if(ber<1e-6)continue;
  var x=30+(snrDb+2)/14*pw;
  var y=80+plotH-(Math.log10(ber)+6)/6*plotH;
  if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.fillStyle='#00c8ff';ctx.font='10px monospace';
ctx.fillText('Uncoded BPSK',30+10,80+15);
// Coded curve (shifted left by coding gain)
ctx.strokeStyle='#00ffa0';ctx.lineWidth=2;ctx.beginPath();
first=true;
for(var snrDb2=-2;snrDb2<=12;snrDb2+=0.2){
  var ber2=0.5*Math.exp(-Math.pow(10,(snrDb2+3)/10));
  if(ber2<1e-8)continue;
  var x2=30+(snrDb2+2)/14*pw;
  var y2=80+plotH-(Math.log10(ber2)+6)/6*plotH;
  if(first){ctx.moveTo(x2,y2);first=false}else ctx.lineTo(x2,y2);
}
ctx.stroke();
ctx.fillStyle='#00ffa0';
ctx.fillText('Coded (3 dB gain)',30+180,80+15);
// Shannon limit
var shannonX=30+(c.shannonEbN0dB+2)/14*pw;
ctx.strokeStyle='#ff4060';ctx.setLineDash([4,4]);ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(shannonX,80);ctx.lineTo(shannonX,80+plotH);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ff4060';
ctx.fillText('Shannon limit '+fmt(c.shannonEbN0dB,2)+' dB',shannonX+5,80+plotH-20);
// Current point
var curX=30+(c.ebN0+2)/14*pw;
var curBer=c.berUncoded;
if(curBer>1e-6){
  var curY=80+plotH-(Math.log10(curBer)+6)/6*plotH;
  ctx.fillStyle='#ffb000';
  ctx.beginPath();ctx.arc(curX,curY,6,0,Math.PI*2);ctx.fill();
}
/* Info box */
ctx.fillStyle='rgba(10,12,20,.85)';
ctx.fillRect(W-280,60,260,180);
ctx.strokeStyle='#00c8ff';ctx.lineWidth=1.5;
ctx.strokeRect(W-280,60,260,180);
ctx.fillStyle='#00c8ff';ctx.font='bold 11px monospace';
ctx.fillText('TRADE-OFF',W-270,82);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('Code rate R:',W-270,110);
ctx.fillStyle='#00ffa0';
ctx.fillText(c.codeRate.toFixed(3),W-150,110);
ctx.fillStyle='#7090b8';
ctx.fillText('Bandwidth expand:',W-270,132);
ctx.fillStyle='#ffb000';
ctx.fillText('×'+(1/c.codeRate).toFixed(2),W-150,132);
ctx.fillStyle='#7090b8';
ctx.fillText('SNR:',W-270,154);
ctx.fillStyle='#00ffa0';
ctx.fillText(c.snr+' dB',W-150,154);
ctx.fillStyle='#7090b8';
ctx.fillText('Eb/N0:',W-270,176);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(c.ebN0,2)+' dB',W-150,176);
ctx.fillStyle='#7090b8';
ctx.fillText('Shannon limit:',W-270,198);
ctx.fillStyle='#ff4060';
ctx.fillText(fmt(c.shannonEbN0dB,2)+' dB',W-150,198);
ctx.fillStyle='#7090b8';
ctx.fillText('Uncoded BER:',W-270,220);
ctx.fillStyle='#ff4060';
ctx.fillText(c.berUncoded.toExponential(3),W-150,220);
setStats('<div>Rate R: '+c.codeRate+'</div><div>Eb/N0: '+fmt(c.ebN0,2)+'dB</div><div>Shannon: '+fmt(c.shannonEbN0dB,2)+'dB</div>');
badge('📊 Channel · R='+c.codeRate+' · Shannon '+fmt(c.shannonEbN0dB,2)+'dB');SV('sbRate','R='+c.codeRate);SV('sbBer',c.berUncoded.toExponential(2))},
onDown:function(p){},
controls:function(){var c=STATE.channel||{};var h='<div class="sec"><h4>Code rate</h4>';
h+='<div class="ctrl"><div class="lbl"><span>R = k/n</span><span>'+c.codeRate+'</span></div><input type="range" min="0.1" max="0.99" step="0.01" value="'+c.codeRate+'" oninput="STATE.channel.codeRate=parseFloat(this.value);MODULES.channel.compute()"></div>';
h+='</div>';

h+='</div>';
h+='<div class="sec"><h4>Shannon Limit</h4><div style="font-size:.58rem;color:var(--tx2);font-family:var(--mono);line-height:1.7">Eb/N0 ≥ (2^R − 1)/R<br>R=1 (sem codificação): 0 dB<br>R=0.5: −1.59 dB<br>R→0: −1.59 dB (limite absoluto)</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Channel Coding</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Shannon (1948)<br><br><b>Capacidade:</b><br>C = B·log₂(1+SNR)<br><br><b>Eb/N0 limite:</b><br>(Eb/N0)_min = (2^R − 1)/R<br>→ −1.59 dB para R→0<br><br><b>Compromisso:</b><br>Reduzir BER → aumentar banda ou potência<br><br><b>Códigos modernos:</b><br>• Hamming: baixo overhead<br>• Reed-Solomon: burst errors<br>• Convolucional + Viterbi<br>• Turbo (Berrou 1993): ~0.5 dB<br>• LDPC: ~0.05 dB<br>• Polar (Arikan 2008): atinge Shannon<br><br>5G usa LDPC (data) + Polar (control)<br>Ganho de codificação: 3-10 dB típico</div></div>'}});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#020306';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#00c8ff';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('SPECTRA ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('SPECTRA ready — 25 módulos de DSP e telecom','success',3000);
});
