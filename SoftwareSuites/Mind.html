registerModule('maze',{
  title:'Maze & Pathfinding',
  icon:'🌀',
  desc:'Generate perfect mazes (recursive / Prim) and solve with A*, BFS, or DFS. Compare exploration strategies.',
  init:function(){
    this.generate();
  },
  generate:function(){
    var m=STATE.maze;
    /* Ensure odd dimensions */
    if(m.W%2===0)m.W++;
    if(m.H%2===0)m.H++;
    if(m.algorithm==='recursive')m.grid=generateMazeRecursive(m.W,m.H);
    else if(m.algorithm==='prim')m.grid=generateMazePrim(m.W,m.H);
    else m.grid=generateMazeRandom(m.W,m.H,0.3);
    m.start={x:1,y:1};
    m.end={x:m.W-2,y:m.H-2};
    m.grid[m.start.y*m.W+m.start.x]=0;
    m.grid[m.end.y*m.W+m.end.x]=0;
    m.path=null;
    m.visited=null;
    m.solveNodes=0;
    m.solveTime=0;
    m.solveOrder=[];
    m.solveStep=0;
  },
  solve:function(){
    var m=STATE.maze;
    var start=performance.now();
    var stats={nodes:0};
    var result;
    if(m.solvingAlgorithm==='astar')result=solveAStar(m.grid,m.W,m.H,[m.start.x,m.start.y],[m.end.x,m.end.y],stats);
    else if(m.solvingAlgorithm==='bfs')result=solveBFS(m.grid,m.W,m.H,[m.start.x,m.start.y],[m.end.x,m.end.y],stats);
    else result=solveDFS(m.grid,m.W,m.H,[m.start.x,m.start.y],[m.end.x,m.end.y],stats);
    m.solveTime=performance.now()-start;
    m.solveNodes=stats.nodes;
    m.solveOrder=result.order;
    m.solveStep=0;
    /* Check if path found */
    var endIdx=result.endIdx;
    if(result.cameFrom[endIdx]!==-1||endIdx===m.start.y*m.W+m.start.x){
      var path=reconstructPath(result.cameFrom,endIdx);
      m.path=path.map(function(idx){return {x:idx%m.W,y:Math.floor(idx/m.W)}});
    } else {
      m.path=null;
    }
    logMsg('Maze solved with '+m.solvingAlgorithm+': '+stats.nodes+' nodes, '+(m.path?m.path.length+' steps':'no path'),'success');
  },
  tick:function(dt){
    var m=STATE.maze;
    if(m.animateSolve&&m.solveStep<m.solveOrder.length){
      m.solveStep+=Math.max(1,Math.round(dt*200));
      if(m.solveStep>m.solveOrder.length)m.solveStep=m.solveOrder.length;
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050210';
    ctx.fillRect(0,0,W,H);
    var m=STATE.maze;
    if(!m.grid)return;
    var pad=40;
    var cs=Math.min((W-pad*2)/m.W,(H-pad*2)/m.H);
    var ox=(W-cs*m.W)/2;
    var oy=(H-cs*m.H)/2;
    /* Walls */
    for(var y=0;y<m.H;y++){
      for(var x=0;x<m.W;x++){
        if(m.grid[y*m.W+x]){
          ctx.fillStyle='#281e50';
          ctx.fillRect(ox+x*cs,oy+y*cs,cs+0.5,cs+0.5);
        }
      }
    }
    /* Visited cells (animation) */
    if(m.solveOrder.length>0){
      var maxStep=m.solveStep;
      for(var i=0;i<Math.min(maxStep,m.solveOrder.length);i++){
        var idx=m.solveOrder[i];
        var vx=idx%m.W,vy=Math.floor(idx/m.W);
        ctx.fillStyle='rgba(64,224,255,.3)';
        ctx.fillRect(ox+vx*cs,oy+vy*cs,cs,cs);
      }
    }
    /* Path */
    if(m.path){
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=Math.max(2,cs*0.3);
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();
      m.path.forEach(function(p,i){
        var px=ox+p.x*cs+cs/2;
        var py=oy+p.y*cs+cs/2;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      });
      ctx.stroke();
    }
    /* Start / End markers */
    ctx.fillStyle='#40ff90';
    ctx.beginPath();
    ctx.arc(ox+m.start.x*cs+cs/2,oy+m.start.y*cs+cs/2,cs*0.4,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#ff5080';
    ctx.beginPath();
    ctx.arc(ox+m.end.x*cs+cs/2,oy+m.end.y*cs+cs/2,cs*0.4,0,Math.PI*2);
    ctx.fill();
    /* Info */
    ctx.fillStyle='rgba(13,10,26,.85)';
    ctx.strokeStyle='rgba(176,96,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#b060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('MAZE',32,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e8e0ff';
    ctx.fillText('Size: '+m.W+'×'+m.H,32,62);
    ctx.fillText('Algorithm: '+m.algorithm,32,80);
    ctx.fillText('Solver: '+m.solvingAlgorithm,32,98);
    if(m.solveNodes){
      ctx.fillStyle='#40e0ff';
      ctx.fillText('Nodes: '+m.solveNodes+' · '+fmt(m.solveTime,2)+' ms',32,116);
    }
    setStatsHTML(
      '<div>Size: '+m.W+'×'+m.H+'</div>'+
      '<div>Solver: '+m.solvingAlgorithm+'</div>'+
      '<div>Nodes: '+m.solveNodes+'</div>'+
      '<div>Path: '+(m.path?m.path.length+' steps':'—')+'</div>'+
      '<div>Time: '+fmt(m.solveTime,2)+' ms</div>'
    );
    updateBadge('🌀 Maze · '+m.algorithm+' + '+m.solvingAlgorithm);
    $('sbMode').textContent='Maze';
    $('sbNodes').textContent=m.solveNodes;
  },
  onDown:function(){},
  controls:function(){
    var m=STATE.maze;
    var html='';
    html+='<div class="sec"><h4>Generate</h4>';
    html+='<button class="btn primary full" onclick="MODULES.maze.generate();renderLeftPanel()">🎲 New maze</button>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Generator</span></div>';
    html+='<div class="chip-row">';
    [['recursive','Recursive'],['prim','Prim'],['random','Random']].forEach(function(a){
      html+='<div class="chip '+(m.algorithm===a[0]?'active':'')+'" onclick="STATE.maze.algorithm=\''+a[0]+'\';MODULES.maze.generate();renderLeftPanel()">'+a[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Width</span><span>'+m.W+'</span></div>';
    html+='<input type="range" min="11" max="61" step="2" value="'+m.W+'" oninput="STATE.maze.W=parseInt(this.value);MODULES.maze.generate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Height</span><span>'+m.H+'</span></div>';
    html+='<input type="range" min="11" max="41" step="2" value="'+m.H+'" oninput="STATE.maze.H=parseInt(this.value);MODULES.maze.generate();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Solve</h4>';
    html+='<button class="btn full" onclick="MODULES.maze.solve();renderLeftPanel()">🔍 Solve maze</button>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Solver</span></div>';
    html+='<div class="chip-row">';
    [['astar','A*'],['bfs','BFS'],['dfs','DFS']].forEach(function(a){
      html+='<div class="chip '+(m.solvingAlgorithm===a[0]?'active':'')+'" onclick="STATE.maze.solvingAlgorithm=\''+a[0]+'\';renderLeftPanel()">'+a[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span style="font-size:.68rem;color:var(--tx2)">Animate search</span><div class="chip '+(m.animateSolve?'active':'')+'" onclick="STATE.maze.animateSolve=!STATE.maze.animateSolve;renderLeftPanel()">'+(m.animateSolve?'ON':'OFF')+'</div></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Statistics</h4>';
    html+='<div class="stats-grid">';
    html+='<div class="stat"><div class="sv">'+m.solveNodes+'</div><div class="sl">Nodes</div></div>';
    html+='<div class="stat"><div class="sv" style="color:var(--c3)">'+(m.path?m.path.length:0)+'</div><div class="sl">Path</div></div>';
    html+='<div class="stat"><div class="sv" style="color:var(--c5)">'+fmt(m.solveTime,1)+'</div><div class="sl">ms</div></div>';
    html+='</div></div>';
    return html;
  },
  mathPanel:function(){
    var m=STATE.maze;
    return '<div class="sec"><h4>A* Search</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'f(n) = g(n) + h(n)<br><br>'+
      'g(n): cost from start to n<br>'+
      'h(n): heuristic estimate from n to goal<br><br>'+
      'For 4-connected grids, Manhattan distance:<br>'+
      'h(n) = |x₁ − x₂| + |y₁ − y₂|<br><br>'+
      'Admissible heuristic → A* finds the optimal path.'+
      '</div></div>'+
      '<div class="sec"><h4>BFS vs DFS</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">BFS:</b> FIFO queue. Explores in expanding waves. Finds shortest path in unweighted graphs.<br><br>'+
      '<b class="text-c1">DFS:</b> LIFO stack. Follows one path deep. Can miss optimal paths.'+
      '</div></div>'+
      '<div class="sec"><h4>Maze generation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Recursive backtracker:</b><br>'+
      'DFS through cells, carving passages. Produces long winding corridors (perfect maze, unique path).<br><br>'+
      '<b class="text-c1">Prim\'s algorithm:</b><br>'+
      'Grows maze from seed, expanding from random frontier walls. More branching.'+
      '</div></div>'+
      '<div class="sec"><h4>Current run</h4><div class="kv">'+
      '<div class="row"><span class="k">Generator</span><span class="v">'+m.algorithm+'</span></div>'+
      '<div class="row"><span class="k">Solver</span><span class="v">'+m.solvingAlgorithm+'</span></div>'+
      '<div class="row"><span class="k">Nodes visited</span><span class="v">'+m.solveNodes+'</span></div>'+
      '<div class="row"><span class="k">Path length</span><span class="v">'+(m.path?m.path.length:'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(m.solveTime,3)+' ms</span></div>'+
      '</div></div>';
  }
});

<script>
/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'chess',icon:'♞',label:'Chess'},
  {key:'life',icon:'🧬',label:'Life'},
  {key:'genetic',icon:'🧪',label:'Genetic'},
  {key:'ttt',icon:'⭕',label:'Tic-Tac-Toe'},
  {key:'nqueens',icon:'♛',label:'N-Queens'},
  {key:'maze',icon:'🌀',label:'Maze'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');

}
function renderLeftPanel(){
  var body=$('lpBody');

  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';

}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+

      '</div></div>'+

      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">Chess:</b> minimax + alpha-beta<br>'+
      '<b class="text-c1">Life:</b> cellular automaton<br>'+
      '<b class="text-c1">Genetic:</b> evolutionary optimization<br>'+
      '<b class="text-c1">Tic-Tac-Toe:</b> exhaustive game tree<br>'+
      '<b class="text-c1">N-Queens:</b> backtracking search<br>'+
      '<b class="text-c1">Maze:</b> A*/BFS/DFS pathfinding'+
      '</div></div>';
  }
  var mathPane=$('rpMath');

  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');

    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();

  };

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='6'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Loading chess evaluation tables...',
  'Compiling minimax + alpha-beta engine...',
  'Preparing Game of Life rules...',
  'Warming up genetic algorithm...',
  'Loading Tic-Tac-Toe game tree...',
  'Preparing N-Queens backtracker...',
  'Compiling A* pathfinding...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('MIND ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  /* Init all modules that have lazy state */
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  /* Pre-init life, genetic, ttt, maze */
  STATE.life.rule=parseRule(STATE.life.ruleString);
  MODULES.life.init();
  MODULES.genetic.init();
  MODULES.ttt.init();
  MODULES.nqueens.init();
  MODULES.maze.generate();
  renderLeftPanel();
  renderRightPanel();
  logMsg('MIND initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='ready';
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
