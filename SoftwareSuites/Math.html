<!DOCTYPE html>
<html lang="en" data-theme="math">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MATH — Mathematical Explorations Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#08040c;--bg2:#100818;--bg3:#1c0e2c;--bg4:#2a1544;
  --panel:#100818;--panel2:#1c0e2c;--panel3:#2a1544;--panel4:#3c1e60;
  --bd:#1e0c30;--bd2:#3c1a58;--bd3:#602c88;
  --tx:#f0d8ff;--tx2:#c090e8;--tx3:#805898;--mu:#4c2c6c;
  --c1:#ff40a0;--c1h:#ff80c0;--c1l:#c02060;
  --c2:#40d0ff;--c2h:#80e0ff;--c2l:#2090c0;
  --c3:#ffe040;--c3h:#fff080;--c3l:#c0b020;
  --c4:#40ff90;--c4h:#80ffb8;--c4l:#20c060;
  --c5:#c060ff;--c5h:#d090ff;--c5l:#8030c0;
  --c6:#ff8040;--c6h:#ffa870;--c6l:#c05020;
  --c7:#40ffff;--c7h:#80ffff;--c7l:#20c0c0;
  --ok:#40ff90;--warn:#ffe040;--err:#ff40a0;--info:#40d0ff;
  --g1:linear-gradient(135deg,#ff40a0,#c060ff);
  --g2:linear-gradient(135deg,#40d0ff,#40ff90);
  --gHolo:linear-gradient(120deg,#ff40a0,#c060ff,#40d0ff,#40ff90,#ffe040,#ff40a0);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#faf0ff;--bg2:#f0e0ff;--bg3:#e0d0f8;--panel:#fff;--panel2:#faf0ff;--panel3:#f0e0ff;
  --bd:#d8c0e8;--bd2:#b898d0;--tx:#1c0830;--tx2:#5a3078;--tx3:#9060a8;
  --c1:#c02060;--c2:#0060c0;--c3:#a08000;--c4:#008040;--c5:#7030c0;--c6:#c05020;--c7:#008080;
  --g1:linear-gradient(135deg,#c02060,#7030c0)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101014;--bg3:#18181e;--panel:#101014;--panel2:#18181e;--panel3:#202028;
  --bd:#282830;--bd2:#404048;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#08040c;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px;overflow:hidden}
#boot.hidden{opacity:0;pointer-events:none}
#bootFrac{position:absolute;inset:0;pointer-events:none;opacity:0.7}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:16px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px;position:relative;z-index:1}
.boot-sub{font-size:.66rem;color:#ff40a0;letter-spacing:10px;margin-bottom:26px;opacity:.75;position:relative;z-index:1}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#1c0e2c;border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative;z-index:1}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ff40a0}
.boot-pct{font-size:.66rem;color:#ff40a0;margin-bottom:14px;position:relative;z-index:1}
.boot-log{font-size:.58rem;color:#805898;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7;position:relative;z-index:1}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#08040c;box-shadow:0 0 12px rgba(255,64,160,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#1c0e2c;transition:var(--t1)}
.tb-status .dot.on{background:var(--c4);box-shadow:0 0 10px var(--c4);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#040208;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(16,8,24,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c3);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,64,160,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#08040c;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(255,64,160,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--c3);border-color:var(--c3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#08040c;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c4)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <canvas id="bootFrac" style="position:absolute;inset:0"></canvas>
  <div class="boot-logo">MATH</div>
  <div class="boot-sub">MATHEMATICAL EXPLORATIONS</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('fractals')">MATH</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">exploring</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Iter</span><span class="sb-val c2" id="sbIter">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Zoom</span><span class="sb-val c3" id="sbZoom">1×</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">R</span><span class="sb-val c4" id="sbR">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Dim</span><span class="sb-val c5" id="sbDim">2</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Fractals</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function sci(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';if(n===0)return '0';var e=Math.floor(Math.log10(Math.abs(n)));if(e>=-2&&e<4)return fmt(n,d);var m=n/Math.pow(10,e);return fmt(m,d)+'×10^'+e}
function toast(m,t,d){t=t||'info';d=d||2200;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:.95rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);

}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
  var m=MODULES[STATE.currentTab];
  if(m&&m.onResize)m.onResize();
}
var INPUT={down:false,x:0,y:0,lastX:0,lastY:0,dx:0,dy:0,right:false};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.right=e.button===2;INPUT.x=p.x;INPUT.y=p.y;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.dx=0;INPUT.dy=0;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.dx=p.x-INPUT.lastX;INPUT.dy=p.y-INPUT.lastY;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onWheel(e){e.preventDefault();var m=MODULES[STATE.currentTab];var p=canvasPos(e);if(m&&m.onWheel)m.onWheel(p,e.deltaY);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY,button:0});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

function drawGlowText(ctx,text,x,y,color,size,align){
  ctx.save();
  ctx.font='bold '+(size||14)+'px monospace';

  ctx.fillStyle=color;
  ctx.fillText(text,x,y);
  ctx.restore();
}
/* Complex number ops for fractals */
function cadd(a,b){return {re:a.re+b.re,im:a.im+b.im}}
function cmul(a,b){return {re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function cabs2(a){return a.re*a.re+a.im*a.im}

var FRACTAL_PALETTES={
  'rainbow':function(t){
    /* HSV rainbow */
    var h=t*360;
    var c=1,s=1,v=1;
    var hh=h/60;
    var x=c*(1-Math.abs(hh%2-1));
    var r,g,b;
    if(hh<1){r=c;g=x;b=0}
    else if(hh<2){r=x;g=c;b=0}
    else if(hh<3){r=0;g=c;b=x}
    else if(hh<4){r=0;g=x;b=c}
    else if(hh<5){r=x;g=0;b=c}
    else {r=c;g=0;b=x}
    return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];
  },
  'fire':function(t){
    var r=Math.round(255*Math.pow(t,0.5));
    var g=Math.round(255*Math.pow(t,2));
    var b=Math.round(255*Math.pow(t,4));
    return [r,g,b];
  },
  'ice':function(t){
    var r=Math.round(255*Math.pow(t,2));
    var g=Math.round(200*Math.pow(t,1.5));
    var b=Math.round(255*Math.pow(t,0.5));
    return [r,g,b];
  },
  'mono':function(t){
    var v=Math.round(255*t);
    return [v,v,v];
  },
  'neon':function(t){
    /* Purple → cyan → yellow */
    var r,g,b;
    if(t<0.5){
      var s=t*2;
      r=Math.round(120+s*40);
      g=Math.round(40+s*180);
      b=Math.round(255);
    } else {
      var s2=(t-0.5)*2;
      r=Math.round(160+s2*95);
      g=Math.round(220+s2*35);
      b=Math.round(255-s2*200);
    }
    return [r,g,b];
  },
  'grayscale':function(t){var v=Math.round(t*255);return [v,v,v]}
};
registerModule('fractals',{
  title:'Fractals',
  icon:'🌀',
  desc:'Mandelbrot, Julia, Burning Ship, Tricorn. Escape-time algorithm with smooth coloring. Scroll to zoom into infinite detail.',
  init:function(){
    var f=STATE.fractals;
    f.cx=-0.5;f.cy=0;f.zoom=1;
    f.xMin=-2.2;f.yMin=-1.4;f.xMax=1.0;f.yMax=1.4;
    f.needRender=true;
    logMsg('Fractals: '+f.type+' maxIter='+f.maxIter,'success');
  },
  onResize:function(){STATE.fractals.needRender=true},
  mandelbrot:function(cr,ci,maxIter){
    var zr=0,zi=0,zr2=0,zi2=0,iter=0;
    while(zr2+zi2<=4&&iter<maxIter){
      zi=2*zr*zi+ci;
      zr=zr2-zi2+cr;
      zr2=zr*zr;
      zi2=zi*zi;
      iter++;
    }
    if(iter>=maxIter)return maxIter;
    /* Smooth coloring */
    var logZn=Math.log(zr2+zi2)/2;
    var nu=Math.log(logZn/Math.log(2))/Math.log(2);
    return iter+1-nu;
  },
  julia:function(zr,zi,cr,ci,maxIter){
    var zr2=zr*zr,zi2=zi*zi,iter=0;
    while(zr2+zi2<=4&&iter<maxIter){
      zi=2*zr*zi+ci;
      zr=zr2-zi2+cr;
      zr2=zr*zr;
      zi2=zi*zi;
      iter++;
    }
    if(iter>=maxIter)return maxIter;
    var logZn=Math.log(zr2+zi2)/2;
    var nu=Math.log(logZn/Math.log(2))/Math.log(2);
    return iter+1-nu;
  },
  burningship:function(cr,ci,maxIter){
    var zr=0,zi=0,iter=0;
    var zr2=0,zi2=0;
    while(zr2+zi2<=4&&iter<maxIter){
      zr=zr2-zi2+cr;
      zi=Math.abs(2*zr*zi)+ci;
      zr2=zr*zr;
      zi2=zi*zi;
      iter++;
    }
    if(iter>=maxIter)return maxIter;
    var logZn=Math.log(zr2+zi2)/2;
    var nu=Math.log(logZn/Math.log(2))/Math.log(2);
    return iter+1-nu;
  },
  tricorn:function(cr,ci,maxIter){
    var zr=0,zi=0,zr2=0,zi2=0,iter=0;
    while(zr2+zi2<=4&&iter<maxIter){
      zi=-2*zr*zi+ci;
      zr=zr2-zi2+cr;
      zr2=zr*zr;
      zi2=zi*zi;
      iter++;
    }
    if(iter>=maxIter)return maxIter;
    var logZn=Math.log(zr2+zi2)/2;
    var nu=Math.log(logZn/Math.log(2))/Math.log(2);
    return iter+1-nu;
  },
  tick:function(dt){
    STATE.time+=dt;
    if(!STATE.playing)return;
  },
  stepOnce:function(){this.render()},
  render:function(){
    var f=STATE.fractals;
    var W=CANV.W,H=CANV.H;
    var imageData=ctx_createImageData(W,H);
    var d=imageData.data;
    var palette=FRACTAL_PALETTES[f.palette];
    var cr,ci;
    var xRange=f.xMax-f.xMin;
    var yRange=f.yMax-f.yMin;
    /* Center for zooming */
    var targetCx=0,targetCy=0;
    if(f.type==='julia'||f.type==='mandelbrot'||f.type==='burningship'||f.type==='tricorn'){
      targetCx=(f.xMin+f.xMax)/2;
      targetCy=(f.yMin+f.yMax)/2;
    }
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var re=f.xMin+(x/W)*xRange;
        var im=f.yMin+(y/H)*yRange;
        var val;
        switch(f.type){
          case 'mandelbrot':val=this.mandelbrot(re,im,f.maxIter);break;
          case 'julia':val=this.julia(re,im,f.juliaRe,f.juliaIm,f.maxIter);break;
          case 'burningship':val=this.burningship(re,im,f.maxIter);break;
          case 'tricorn':val=this.tricorn(re,im,f.maxIter);break;
        }
        var idx=(y*W+x)*4;
        if(val>=f.maxIter){
          d[idx]=0;d[idx+1]=0;d[idx+2]=0;d[idx+3]=255;
        } else {
          var t=(val/f.maxIter);
          var col=palette(t);
          d[idx]=col[0];d[idx+1]=col[1];d[idx+2]=col[2];d[idx+3]=255;
        }
      }
    }
    /* Store and display */
    var off=document.createElement('canvas');
    off.width=W;off.height=H;
    off.getContext('2d').putImageData(imageData,0,0);
    CANV.ctx.drawImage(off,0,0);
    f.needRender=false;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    var f=STATE.fractals;
    if(f.needRender)this.render();
    else {
      /* If we have an image, just redraw it - but simplest is to re-render */
      this.render();
    }
    /* Info overlay */
    ctx.fillStyle='rgba(16,8,24,0.9)';

    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('FRACTAL · '+f.type.toUpperCase(),32,42);
    ctx.fillStyle='#f0d8ff';
    ctx.font='10px monospace';
    ctx.fillText('Center: ('+fmt(f.cx,6)+', '+fmt(f.cy,6)+')',32,62);
    ctx.fillText('Zoom: '+sci(f.zoom,3),32,78);
    ctx.fillText('Max iter: '+f.maxIter,32,94);
    ctx.fillText('Palette: '+f.palette,32,110);
    ctx.fillText('Width: '+sci(f.xMax-f.xMin,3),32,126);
    /* Hint */
    ctx.fillStyle='rgba(16,8,24,0.85)';
    ctx.strokeStyle='rgba(255,64,160,0.4)';
    ctx.beginPath();ctx.roundRect(20,H-50,460,36,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff40a0';
    ctx.font='11px monospace';
    ctx.fillText('Drag to pan  ·  Scroll to zoom  ·  Right-click to reset',32,H-28);
    setStatsHTML(
      '<div>Zoom: '+sci(f.zoom,2)+'</div>'+
      '<div>Iter: '+f.maxIter+'</div>'+
      '<div>Type: '+f.type+'</div>'+
      '<div>Palette: '+f.palette+'</div>'
    );
    updateBadge('🌀 '+f.type+' · zoom '+sci(f.zoom,2)+' · iter '+f.maxIter);
    $('sbMode').textContent='Fractals';
    $('sbIter').textContent=f.maxIter;
    $('sbZoom').textContent=sci(f.zoom,2)+'×';
  },
  onDown:function(p){
    if(INPUT.right){
      this.init();
    }
  },
  onMove:function(p){
    var f=STATE.fractals;
    if(!INPUT.down)return;
    var xRange=f.xMax-f.xMin;
    var yRange=f.yMax-f.yMin;
    var dx=-INPUT.dx/CANV.W*xRange;
    var dy=-INPUT.dy/CANV.H*yRange;
    f.xMin+=dx;f.xMax+=dx;
    f.yMin+=dy;f.yMax+=dy;
    f.cx=(f.xMin+f.xMax)/2;
    f.cy=(f.yMin+f.yMax)/2;
    f.needRender=true;
  },
  onWheel:function(p,delta){
    var f=STATE.fractals;
    var factor=delta>0?1.15:1/1.15;
    /* Zoom toward cursor */
    var mx=p.x/CANV.W;
    var my=p.y/CANV.H;
    var xRange=f.xMax-f.xMin;
    var yRange=f.yMax-f.yMin;
    var cx=f.xMin+mx*xRange;
    var cy=f.yMin+my*yRange;
    f.xMin=cx-(cx-f.xMin)*factor;
    f.xMax=cx+(f.xMax-cx)*factor;
    f.yMin=cy-(cy-f.yMin)*factor;
    f.yMax=cy+(f.yMax-cy)*factor;
    f.zoom*=1/factor;
    f.cx=(f.xMin+f.xMax)/2;
    f.cy=(f.yMin+f.yMax)/2;
    /* Increase max iter at high zoom for detail */
    var baseIter=80;
    var zoomIter=Math.floor(Math.log10(f.zoom)*40);
    f.maxIter=clamp(baseIter+zoomIter,80,500);
    f.needRender=true;
  },
  controls:function(){
    var f=STATE.fractals;
    var html='';
    html+='<div class="sec"><h4>Fractal type</h4><div class="chip-row">';

    });
    html+='</div></div>';
    if(f.type==='julia'){
      html+='<div class="sec"><h4>Julia constant c</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>Re(c)</span><span>'+fmt(f.juliaRe,4)+'</span></div>';
      html+='<input type="range" min="-2" max="2" step="0.001" value="'+f.juliaRe+'" oninput="STATE.fractals.juliaRe=parseFloat(this.value);STATE.fractals.needRender=true;renderLeftPanel()"></div>';
      html+='<div class="ctrl"><div class="lbl"><span>Im(c)</span><span>'+fmt(f.juliaIm,4)+'</span></div>';
      html+='<input type="range" min="-2" max="2" step="0.001" value="'+f.juliaIm+'" oninput="STATE.fractals.juliaIm=parseFloat(this.value);STATE.fractals.needRender=true;renderLeftPanel()"></div>';
      html+='</div>';
      html+='<div class="sec"><h4>Famous Julia sets</h4><div class="chip-row">';
      [['Douady rabbit',-0.123,0.745],['Dendrite',0,1],['San Marco',-0.75,0],['Siegel disk',-0.391,-0.587],['Spiral',-0.8,0.156],['Dragon',-0.79,0.15]].forEach(function(p){
        html+='<div class="chip" onclick="STATE.fractals.juliaRe='+p[1]+';STATE.fractals.juliaIm='+p[2]+';STATE.fractals.needRender=true;renderLeftPanel()">'+p[0]+'</div>';
      });
      html+='</div></div>';
    }
    html+='<div class="sec"><h4>Iterations</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Max iter</span><span>'+f.maxIter+'</span></div>';
    html+='<input type="range" min="20" max="500" step="10" value="'+f.maxIter+'" oninput="STATE.fractals.maxIter=parseInt(this.value);STATE.fractals.needRender=true;renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.fractals.init();renderLeftPanel()">↺ Reset view</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="jumpDeep()">🎯 Deep zoom (Seahorse)</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Try it</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '• Scroll to zoom into infinite detail<br>'+
      '• Drag to pan around the fractal<br>'+
      '• Max iter auto-increases with zoom<br>'+
      '• For Julia: try Douady rabbit preset'
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var f=STATE.fractals;
    return '<div class="sec"><h4>Mandelbrot set</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'M = {c ∈ ℂ : z_{n+1} = z_n² + c does not diverge}<br><br>'+
      'with z₀ = 0.<br><br>'+
      'Escape-time algorithm: iterate until |z| > 2 (bounded by 2).'+
      '</div></div>'+
      '<div class="sec"><h4>Julia set</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'For fixed c, iterate z_{n+1} = z_n² + c from z₀ = pixel.<br><br>'+
      'Julia set = boundary between basins of attraction.<br><br>'+
      'The Mandelbrot set is the set of c for which the Julia set is connected.'+
      '</div></div>'+
      '<div class="sec"><h4>Smooth coloring</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Basic escape-time has visible bands.<br><br>'+
      'Smooth version: μ = n + 1 − log(log|z_n|)/log 2<br><br>'+
      'This gives continuous color, no banding.'+
      '</div></div>'+
      '<div class="sec"><h4>Hausdorff dimension</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Mandelbrot boundary: exactly 2 (Shishikura, 1991).<br><br>'+
      'The set itself is a compact, connected, simply-connected subset of ℂ.'+
      '</div></div>';
  }
});
function ctx_createImageData(W,H){
  return CANV.ctx.createImageData(W,H);
}
function setFractalType(type){
  var f=STATE.fractals;
  f.type=type;
  if(type==='mandelbrot'){f.xMin=-2.2;f.yMin=-1.4;f.xMax=1.0;f.yMax=1.4;f.cx=-0.5;f.cy=0;f.zoom=1}
  else if(type==='julia'){f.xMin=-2;f.yMin=-2;f.xMax=2;f.yMax=2;f.cx=0;f.cy=0;f.zoom=1}
  else if(type==='burningship'){f.xMin=-2.5;f.yMin=-2.0;f.xMax=1.5;f.yMax=1.0;f.cx=-0.5;f.cy=-0.5;f.zoom=1}
  else if(type==='tricorn'){f.xMin=-2;f.yMin=-2;f.xMax=2;f.yMax=2;f.cx=0;f.cy=0;f.zoom=1}
  f.needRender=true;
  renderLeftPanel();
}

/* ================================================================
   MODULE 2: CHAOS (Strange Attractors)
   ================================================================ */
var CHAOS_SYSTEMS={
  'lorenz':{
    name:'Lorenz',
    deriv:function(p,x,y,z){
      return {
        dx:p.sigma*(y-x),
        dy:x*(p.rho-z)-y,
        dz:x*y-p.beta*z
      };
    },
    init:{x:0.1,y:0,z:0},
    scale:1/25,
    zAxis:true
  },
  'rossler':{
    name:'Rössler',
    deriv:function(p,x,y,z){
      return {
        dx:-y-z,
        dy:x+p.a*y,
        dz:p.b+z*(x-p.c)
      };
    },
    init:{x:1,y:1,z:0},
    scale:1/15,
    zAxis:true
  },
  'aizawa':{
    name:'Aizawa',
    deriv:function(p,x,y,z){
      var a=p.aizawaParams.a,b=p.aizawaParams.b,c=p.aizawaParams.c;
      var d=p.aizawaParams.d,e=p.aizawaParams.e,f=p.aizawaParams.f;
      return {
        dx:(z-b)*x-d*y,
        dy:d*x+(z-b)*y,
        dz:c+a*z-z*z*z/3-(x*x+y*y)*(1+e*z)+f*z*x*x*x
      };
    },
    init:{x:0.1,y:0,z:0},
    scale:1/2,
    zAxis:true
  },
  'thomas':{
    name:'Thomas',
    deriv:function(p,x,y,z){
      var b=p.thomasParams.b;
      return {
        dx:Math.sin(y)-b*x,
        dy:Math.sin(z)-b*y,
        dz:Math.sin(x)-b*z
      };
    },
    init:{x:0.1,y:0,z:0},
    scale:1/3,
    zAxis:true
  }
};
registerModule('chaos',{
  title:'Chaos',
  icon:'🦋',
  desc:'Strange attractors. Lorenz (butterfly), Rössler (spiral), Aizawa, Thomas. RK4 integration of 3D ODEs with real-time rotation.',
  init:function(){
    var c=STATE.chaos;
    var sys=CHAOS_SYSTEMS[c.system];
    c.x=sys.init.x;c.y=sys.init.y;c.z=sys.init.z;
    c.t=0;
    c.trail=[];
    logMsg('Chaos: '+sys.name+' attractor initialized','success');
  },
  tick:function(dt){
    STATE.time+=dt;
    var c=STATE.chaos;
    if(!STATE.playing)return;
    var sys=CHAOS_SYSTEMS[c.system];
    var steps=10;
    var h=c.dt;
    for(var k=0;k<steps;k++){
      /* RK4 for 3D system */
      var f1=sys.deriv(c,c.x,c.y,c.z);
      var f2=sys.deriv(c,c.x+f1.dx*h/2,c.y+f1.dy*h/2,c.z+f1.dz*h/2);
      var f3=sys.deriv(c,c.x+f2.dx*h/2,c.y+f2.dy*h/2,c.z+f2.dz*h/2);
      var f4=sys.deriv(c,c.x+f3.dx*h,c.y+f3.dy*h,c.z+f3.dz*h);
      c.x+=h/6*(f1.dx+2*f2.dx+2*f3.dx+f4.dx);
      c.y+=h/6*(f1.dy+2*f2.dy+2*f3.dy+f4.dy);
      c.z+=h/6*(f1.dz+2*f2.dz+2*f3.dz+f4.dz);
      c.t+=h;
      c.trail.push({x:c.x,y:c.y,z:c.z});
    }
    if(c.trail.length>c.maxTrail)c.trail.splice(0,c.trail.length-c.maxTrail);
    if(c.autoRotate)c.rotation+=c.rotateSpeed*dt;
  },
  stepOnce:function(){this.tick(0.1)},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040208';
    ctx.fillRect(0,0,W,H);
    var c=STATE.chaos;
    var sys=CHAOS_SYSTEMS[c.system];
    /* Compute rotation matrices */
    var cosR=Math.cos(c.rotation),sinR=Math.sin(c.rotation);
    var tiltX=0.4;
    var cosT=Math.cos(tiltX),sinT=Math.sin(tiltX);
    /* 3D → 2D projection */
    function project(p){
      var x=p.x,y=p.y,z=p.z;
      /* Rotate around Z axis (vertical) */
      var x1=x*cosR-y*sinR;
      var y1=x*sinR+y*cosR;
      /* Tilt camera */
      var y2=y1*cosT-z*sinT;
      /* Perspective: scale */
      var scale=Math.min(W,H)*0.35*sys.scale;
      var cx=W/2,cy=H/2;
      return {x:cx+x1*scale,y:cy-y2*scale};
    }
    /* Axes */
    if(c.showAxes){
      ctx.strokeStyle='rgba(192,96,255,0.2)';
      ctx.lineWidth=1;
      var origin=project({x:0,y:0,z:0});
      var xAx=project({x:20,y:0,z:0});
      var yAx=project({x:0,y:20,z:0});
      var zAx=project({x:0,y:0,z:20});
      ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(xAx.x,xAx.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(yAx.x,yAx.y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(zAx.x,zAx.y);ctx.stroke();
      ctx.fillStyle='#ff40a0';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText('X',xAx.x,xAx.y);
      ctx.fillText('Y',yAx.x,yAx.y);
      ctx.fillText('Z',zAx.x,zAx.y);
    }
    /* Draw trail */
    if(c.trail.length>1){
      var maxSpeed=0;
      /* Compute speed range for coloring */
      if(c.colorBySpeed){
        for(var i=1;i<c.trail.length;i++){
          var p1=c.trail[i-1],p2=c.trail[i];
          var sp=Math.sqrt(Math.pow(p2.x-p1.x,2)+Math.pow(p2.y-p1.y,2)+Math.pow(p2.z-p1.z,2));
          if(sp>maxSpeed)maxSpeed=sp;
        }
      }
      /* Draw segments */
      var prev=null;
      for(var i=0;i<c.trail.length;i++){
        var p=c.trail[i];
        var sp=0;
        if(i>0&&c.colorBySpeed){
          var p1=c.trail[i-1];
          sp=Math.sqrt(Math.pow(p.x-p1.x,2)+Math.pow(p.y-p1.y,2)+Math.pow(p.z-p1.z,2))/Math.max(0.001,maxSpeed);
        }
        var screenP=project(p);
        if(prev){
          var alpha=(i/c.trail.length)*0.9+0.1;
          if(c.colorBySpeed){
            /* Speed → hue: slow=cyan, fast=magenta */
            var hue=200-sp*200;
            ctx.strokeStyle='hsla('+hue+',85%,60%,'+alpha+')';
          } else {
            ctx.strokeStyle='rgba(255,64,160,'+alpha+')';
          }
          ctx.lineWidth=1.5;
          ctx.beginPath();
          ctx.moveTo(prev.x,prev.y);
          ctx.lineTo(screenP.x,screenP.y);
          ctx.stroke();
        }
        prev=screenP;
      }
      /* Current position marker */
      var last=c.trail[c.trail.length-1];
      var lp=project(last);
      ctx.fillStyle='#ffe040';
      ctx.shadowColor='#ffe040';ctx.shadowBlur=15;
      ctx.beginPath();ctx.arc(lp.x,lp.y,5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    /* Info panel */
    ctx.fillStyle='rgba(16,8,24,0.9)';
    ctx.strokeStyle='rgba(255,64,160,0.5)';
    ctx.beginPath();ctx.roundRect(20,20,280,130,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff40a0';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText(sys.name.toUpperCase()+' ATTRACTOR',32,42);
    ctx.fillStyle='#f0d8ff';
    ctx.font='10px monospace';
    ctx.fillText('t = '+fmt(c.t,1),32,62);
    ctx.fillText('Position: ('+fmt(c.x,2)+', '+fmt(c.y,2)+', '+fmt(c.z,2)+')',32,78);
    ctx.fillText('Trail: '+c.trail.length+' / '+c.maxTrail,32,94);
    ctx.fillText('Rotation: '+fmt(c.rotation*180/Math.PI,0)+'°',32,110);
    if(c.system==='lorenz'){
      ctx.fillStyle='#40d0ff';
      ctx.fillText('σ='+c.sigma+' ρ='+c.rho+' β='+fmt(c.beta,2),32,126);
    }
    setStatsHTML(
      '<div>System: '+sys.name+'</div>'+
      '<div>x='+fmt(c.x,2)+'</div>'+
      '<div>y='+fmt(c.y,2)+'</div>'+
      '<div>z='+fmt(c.z,2)+'</div>'+
      '<div>Trail: '+c.trail.length+'</div>'
    );
    updateBadge('🦋 '+sys.name+' · '+c.trail.length+' pts');
    $('sbMode').textContent='Chaos';
  },
  onDown:function(p){},
  onMove:function(p){
    var c=STATE.chaos;
    if(!INPUT.down)return;
    c.rotation+=INPUT.dx*0.01;
  },
  onWheel:function(p,delta){
    /* not used */
  },
  controls:function(){
    var c=STATE.chaos;
    var html='';
    html+='<div class="sec"><h4>System</h4><div class="chip-row">';
    Object.keys(CHAOS_SYSTEMS).forEach(function(k){
      html+='<div class="chip '+(c.system===k?'active':'')+'" onclick="STATE.chaos.system=\''+k+'\';MODULES.chaos.init();renderLeftPanel()">'+CHAOS_SYSTEMS[k].name+'</div>';
    });
    html+='</div></div>';
    if(c.system==='lorenz'){
      html+='<div class="sec"><h4>Lorenz parameters</h4>';

      html+='<input type="range" min="1" max="20" step="0.5" value="'+c.sigma+'" oninput="STATE.chaos.sigma=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='<div class="ctrl"><div class="lbl"><span>ρ (Rayleigh)</span><span>'+c.rho+'</span></div>';

    if(c.system==='aizawa'){

      html+='<div class="ctrl"><div class="lbl"><span>b</span><span>'+fmt(c.aizawaParams.b,3)+'</span></div>';

    html+='<div class="sec"><h4>Display</h4>';

    html+='<input type="range" min="500" max="20000" step="500" value="'+c.maxTrail+'" oninput="STATE.chaos.maxTrail=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Rotation speed</span><span>'+fmt(c.rotateSpeed,2)+'</span></div>';
    html+='<input type="range" min="-2" max="2" step="0.05" value="'+c.rotateSpeed+'" oninput="STATE.chaos.rotateSpeed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Options</h4><div class="chip-row">';
    html+='<div class="chip '+(c.autoRotate?'active':'')+'" onclick="STATE.chaos.autoRotate=!STATE.chaos.autoRotate;renderLeftPanel()">Auto-rotate</div>';
    html+='<div class="chip '+(c.colorBySpeed?'active':'')+'" onclick="STATE.chaos.colorBySpeed=!STATE.chaos.colorBySpeed;renderLeftPanel()">Color by speed</div>';
    html+='<div class="chip '+(c.showAxes?'active':'')+'" onclick="STATE.chaos.showAxes=!STATE.chaos.showAxes;renderLeftPanel()">Show axes</div>';
    html+='</div></div>';

    html+='<button class="btn primary full" onclick="MODULES.chaos.init()">↺ Reset</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.chaos;
    var sys=CHAOS_SYSTEMS[c.system];
    var eq={
      'lorenz':['dx/dt = σ(y − x)','dy/dt = x(ρ − z) − y','dz/dt = xy − βz'],
      'rossler':['dx/dt = −y − z','dy/dt = x + ay','dz/dt = b + z(x − c)'],
      'aizawa':['dx/dt = (z−b)x − dy','dy/dt = dx + (z−b)y','dz/dt = c + az − z³/3 − (x²+y²)(1+ez) + fx³'],
      'thomas':['dx/dt = sin(y) − bx','dy/dt = sin(z) − by','dz/dt = sin(x) − bz']
    }[c.system];
    return '<div class="sec"><h4>'+sys.name+' system</h4>'+

      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'A fractal set on which chaotic dynamics live. Fractional Hausdorff dimension.<br><br>'+
      'Lorenz: dim ≈ 2.06<br>'+
      'Rössler: dim ≈ 2.01'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">System</span><span class="v">'+sys.name+'</span></div>'+
      '<div class="row"><span class="k">t</span><span class="v">'+fmt(c.t,1)+'</span></div>'+

      '</div></div>';
  }
});

<script>
/* ================================================================
   MODULE 3: ITERATED MAPS (logistic, bifurcation)
   ================================================================ */
registerModule('maps',{
  title:'Iterated Maps',
  icon:'🔀',
  desc:'Logistic map x→rx(1−x), bifurcation diagram, Feigenbaum constants. Road to chaos via period-doubling.',
  init:function(){
    var m=STATE.maps;
    m.x0=0.4;
    m.trajectory=[];
    m.t=0;
    m.bifurcation=null;
    logMsg('Maps: logistic r='+m.r+' x₀='+m.x0,'success');
  },
  iterate:function(x,r){return r*x*(1-x)},
  tick:function(dt){
    STATE.time+=dt;
    var m=STATE.maps;
    if(!STATE.playing)return;
    if(m.computeBif)return; /* Bifurcation has priority */
    /* Add a few iterations per frame */
    for(var k=0;k<2;k++){
      m.x0=this.iterate(m.x0,m.r);
      m.trajectory.push(m.x0);
    }
    if(m.trajectory.length>m.maxHistory)m.trajectory.splice(0,m.trajectory.length-m.maxHistory);
    m.history.push({t:m.trajectory.length,x:m.x0});
    if(m.history.length>500)m.history.shift();
  },
  stepOnce:function(){
    var m=STATE.maps;
    m.x0=this.iterate(m.x0,m.r);
    m.trajectory.push(m.x0);
  },
  computeBifurcation:function(){
    var m=STATE.maps;
    var W=CANV.W,H=CANV.H;
    var N=1000; /* iterations per r */
    var skip=200; /* discard first N */
    m.bifurcation=CANV.ctx.createImageData(W,H);
    var d=m.bifurcation.data;
    /* Initialize to black */
    for(var i=0;i<d.length;i+=4){d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=255}
    for(var x=0;x<W;x++){
      var r=m.bifR0+(x/W)*(m.bifR1-m.bifR0);
      var y=0.5;
      /* Warm up */
      for(var k=0;k<skip;k++)y=r*y*(1-y);
      /* Plot attractor values */
      for(var k=0;k<N;k++){
        y=r*y*(1-y);
        var py=Math.floor(H-(y)*(H-10)-5);
        if(py>=0&&py<H){
          var idx=(py*W+x)*4;
          /* Accumulate brightness */
          if(d[idx+2]<255)d[idx+2]+=30;
          if(d[idx+2]>255)d[idx+2]=255;
        }
      }
    }
    /* Show */
    var off=document.createElement('canvas');
    off.width=W;off.height=H;
    off.getContext('2d').putImageData(m.bifurcation,0,0);
    CANV.ctx.drawImage(off,0,0);
    m.computeBif=false;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    var m=STATE.maps;
    if(m.computeBif){
      this.computeBifurcation();
      return;
    }
    /* Layout: cobweb top-left, time series top-right, bifurcation bottom */
    ctx.fillStyle='#040208';
    ctx.fillRect(0,0,W,H);
    var halfW=W/2-30;
    var topH=H/2-30;
    /* Cobweb plot */
    this.drawCobweb(ctx,30,30,halfW,topH);
    /* Time series */
    this.drawTimeSeries(ctx,halfW+60,30,halfW,topH);
    /* Bifurcation diagram */
    this.drawBifurcationDiagram(ctx,30,topH+70,W-60,H-topH-100);
    /* Info panel */
    ctx.fillStyle='rgba(16,8,24,0.9)';
    ctx.strokeStyle='rgba(255,64,160,0.5)';
    ctx.beginPath();ctx.roundRect(20,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff40a0';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('LOGISTIC MAP',32,42);
    ctx.fillStyle='#f0d8ff';
    ctx.font='10px monospace';
    ctx.fillText('x_{n+1} = r·x_n·(1−x_n)',32,62);
    ctx.fillText('r = '+fmt(m.r,4),32,78);
    ctx.fillText('x_n = '+fmt(m.x0,6),32,94);
    var regime;
    if(m.r<1)regime='extinction';
    else if(m.r<3)regime='fixed point';
    else if(m.r<3.449)regime='period-2';
    else if(m.r<3.545)regime='period-4';
    else if(m.r<3.5699)regime='period-doubling';
    else regime='chaos';
    ctx.fillStyle='#40d0ff';
    ctx.fillText('Regime: '+regime,32,114);
    setStatsHTML(
      '<div>r = '+fmt(m.r,4)+'</div>'+
      '<div>x_n = '+fmt(m.x0,5)+'</div>'+
      '<div>Iterations: '+m.history.length+'</div>'+
      '<div>Regime: '+regime+'</div>'
    );
    updateBadge('🔀 Logistic · r='+fmt(m.r,3)+' · x='+fmt(m.x0,3));
    $('sbMode').textContent='Iterated Maps';
    $('sbR').textContent=fmt(m.r,3);
  },
  drawCobweb:function(ctx,x,y,w,h){
    var m=STATE.maps;
    ctx.fillStyle='rgba(16,8,24,0.6)';
    ctx.strokeStyle='rgba(255,64,160,0.4)';
    ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff40a0';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('COBWEB',x+10,y-6);
    /* Diagonal y=x */
    ctx.strokeStyle='rgba(255,64,160,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w,y);ctx.stroke();
    /* Parabola y=r*x*(1-x) */
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(var i=0;i<=100;i++){
      var px=i/100;
      var py=m.r*px*(1-px);
      var sx=x+px*w;
      var sy=y+h-py*h;
      if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    /* Cobweb trajectory */
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=1.5;
    var curr=0.4;
    var path=[{x:curr,y:0}];
    for(var k=0;k<50;k++){
      /* Vertical to curve */
      var next=m.r*curr*(1-curr);
      path.push({x:curr,y:next});
      /* Horizontal to diagonal */
      path.push({x:next,y:next});
      curr=next;
    }
    ctx.beginPath();
    path.forEach(function(p,i){
      var sx=x+p.x*w;
      var sy=y+h-p.y*h;
      if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    });
    ctx.stroke();
    /* Current point */
    var cx=x+m.x0*w;
    var cy=y+h-m.x0*h;
    ctx.fillStyle='#40ff90';
    ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  },
  drawTimeSeries:function(ctx,x,y,w,h){
    var m=STATE.maps;
    ctx.fillStyle='rgba(16,8,24,0.6)';
    ctx.strokeStyle='rgba(64,208,255,0.4)';
    ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('x_n over iterations',x+10,y-6);
    var n=m.trajectory.length;
    if(n>1){
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      var cols=Math.min(n,500);
      for(var i=0;i<cols;i++){
        var idx=Math.floor(i/cols*n);
        var px=x+(i/cols)*w;
        var py=y+h-m.trajectory[idx]*h;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
      /* Dots for last 20 */
      for(var i=Math.max(0,n-20);i<n;i++){
        var px=x+(i/n)*w;
        var py=y+h-m.trajectory[i]*h;
        ctx.fillStyle='#ffe040';
        ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fill();
      }
    }
  },
  drawBifurcationDiagram:function(ctx,x,y,w,h){
    var m=STATE.maps;
    ctx.fillStyle='rgba(16,8,24,0.6)';
    ctx.strokeStyle='rgba(192,96,255,0.4)';
    ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#c060ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('BIFURCATION DIAGRAM (r = '+m.bifR0+' → '+m.bifR1+')',x+10,y-6);
    /* Do a lower-res bifurcation for this panel */
    var res=200;
    var iter=300;
    var skip=100;
    for(var col=0;col<res;col++){
      var r=m.bifR0+(col/res)*(m.bifR1-m.bifR0);
      var x0=0.5;
      for(var k=0;k<skip;k++)x0=r*x0*(1-x0);
      for(var k=0;k<iter;k++){
        x0=r*x0*(1-x0);
        var px=x+10+col/res*(w-20);
        var py=y+h-10-x0*(h-20);
        if(py>y+20&&py<y+h-5){
          ctx.fillStyle='rgba(192,96,255,0.7)';
          ctx.fillRect(px,py,1.5,1.5);
        }
      }
    }
    /* Marker at current r */
    var mx=x+10+(m.r-m.bifR0)/(m.bifR1-m.bifR0)*(w-20);
    if(mx>x&&mx<x+w){
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=2;
      ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(mx,y+20);ctx.lineTo(mx,y+h-5);ctx.stroke();
      ctx.setLineDash([]);
    }
    /* Feigenbaum points */
    var feigPts=[
      {r:3.0,name:'period-2'},
      {r:3.44949,name:'period-4'},
      {r:3.54409,name:'period-8'},
      {r:3.56995,name:'chaos onset'}
    ];
    ctx.font='8px monospace';
    feigPts.forEach(function(p){
      var px=x+10+(p.r-m.bifR0)/(m.bifR1-m.bifR0)*(w-20);
      if(px<x||px>x+w)return;
      ctx.fillStyle='#40ff90';
      ctx.beginPath();ctx.arc(px,y+15,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#40ff90';
      ctx.textAlign='center';
      ctx.save();
      ctx.translate(px,y+h-3);
      ctx.rotate(-Math.PI/4);
      ctx.fillText(p.name,0,0);
      ctx.restore();
    });
  },
  onDown:function(p){
    /* Click anywhere to set r based on x position */
    var m=STATE.maps;
    /* Bifurcation axis */
    var x=30,y=CANV.H*0.5+40,w=CANV.W-60,h=CANV.H*0.5-70;
    if(p.y>y&&p.y<y+h){
      m.r=m.bifR0+((p.x-x-10)/(w-20))*(m.bifR1-m.bifR0);

registerModule('ifs',{
  title:'IFS Fractals',
  icon:'🌿',
  desc:'Iterated Function Systems with the chaos game. Randomly apply affine transformations — the attractor emerges from chaos.',
  init:function(){
    var i=STATE.ifs;
    i.points=[];
    i.current={x:0,y:0};
    i.totalGenerated=0;
    logMsg('IFS: '+IFS_SYSTEMS[i.type].name,'success');
  },
  tick:function(dt){
    STATE.time+=dt;
    var i=STATE.ifs;
    if(!STATE.playing)return;
    /* Generate N new points per frame */
    var sys=IFS_SYSTEMS[i.type];
    var batch=i.speed;
    for(var k=0;k<batch;k++){
      var r=Math.random();
      var cum=0;
      var chosen=sys.transforms[0];
      for(var t=0;t<sys.transforms.length;t++){
        cum+=sys.transforms[t].p;
        if(r<=cum){chosen=sys.transforms[t];break}
      }
      var x=chosen.a*i.current.x+chosen.b*i.current.y+chosen.e;
      var y=chosen.c*i.current.x+chosen.d*i.current.y+chosen.f;
      i.current.x=x;
      i.current.y=y;
      i.points.push({x:x,y:y});
      i.totalGenerated++;
    }
    if(i.points.length>i.numPoints)i.points.splice(0,i.points.length-i.numPoints);
  },
  stepOnce:function(){this.tick(0.3)},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#040208';
    ctx.fillRect(0,0,W,H);
    var i=STATE.ifs;
    var sys=IFS_SYSTEMS[i.type];
    var cx=W/2,cy=H/2+sys.offsetY*H*0.3;
    var scale=Math.min(W,H)*sys.scale/400;
    /* Bounding box computation */
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    i.points.forEach(function(p){
      if(p.x<minX)minX=p.x;
      if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y;
      if(p.y>maxY)maxY=p.y;
    });
    if(!isFinite(minX)){minX=-1;maxX=1;minY=-1;maxY=2}
    var rangeX=Math.max(maxX-minX,0.001);
    var rangeY=Math.max(maxY-minY,0.001);
    var scaleAuto=Math.min((W-40)/rangeX,(H-40)/rangeY);
    var offX=(minX+maxX)/2;
    var offY=(minY+maxY)/2;
    /* Draw points */
    var cols={
      'green':'#40ff90',
      'fire':'#ff8040',
      'ice':'#40d0ff',
      'rainbow':null,
      'mono':'#f0d8ff'
    };
    var baseColor=cols[i.colormap]||'#40ff90';
    /* Use additive blending for dense areas */
    i.points.forEach(function(p,idx){
      var sx=W/2+(p.x-offX)*scaleAuto;
      var sy=H/2-(p.y-offY)*scaleAuto;
      var col=baseColor;
      if(i.colormap==='rainbow'){
        var hue=(idx/i.points.length)*360;
        col='hsl('+hue+',80%,60%)';
      }
      ctx.fillStyle=col;
      /* 1-pixel points, additive-ish */
      ctx.fillRect(sx,sy,1,1);
    });
    /* Info panel */
    ctx.fillStyle='rgba(16,8,24,0.9)';
    ctx.strokeStyle='rgba(64,255,144,0.5)';
    ctx.beginPath();ctx.roundRect(20,20,260,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40ff90';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('IFS · '+sys.name.toUpperCase(),32,42);
    ctx.fillStyle='#f0d8ff';
    ctx.font='10px monospace';
    ctx.fillText('Transforms: '+sys.transforms.length,32,62);
    ctx.fillText('Points shown: '+i.points.length,32,78);
    ctx.fillText('Total: '+i.totalGenerated.toLocaleString(),32,94);
    ctx.fillText('Iterations/s: '+i.speed+'×60',32,110);
    setStatsHTML(
      '<div>Points: '+i.points.length+'</div>'+
      '<div>Generated: '+i.totalGenerated+'</div>'+
      '<div>Type: '+i.type+'</div>'
    );
    updateBadge('🌿 IFS · '+sys.name+' · '+i.totalGenerated+' pts');
    $('sbMode').textContent='IFS Fractals';
  },
  onDown:function(p){},
  controls:function(){
    var i=STATE.ifs;
    var html='';
    html+='<div class="sec"><h4>System</h4><div class="chip-row">';
    Object.keys(IFS_SYSTEMS).forEach(function(k){
      html+='<div class="chip '+(i.type===k?'active':'')+'" onclick="STATE.ifs.type=\''+k+'\';STATE.ifs.points=[];STATE.ifs.current={x:0,y:0};STATE.ifs.totalGenerated=0;renderLeftPanel()">'+IFS_SYSTEMS[k].name+'</div>';
    });

registerModule('lsystem',{
  title:'L-Systems',
  icon:'🌳',
  desc:'Lindenmayer systems — parallel string rewriting for modeling plant growth. Interpreted with turtle graphics.',
  init:function(){
    var l=STATE.lsystem;
    this.buildString();
    logMsg('L-System: '+LSYS_PRESETS[l.preset].name+' iter='+l.iterations,'success');
  },
  buildString:function(){
    var l=STATE.lsystem;
    var preset=LSYS_PRESETS[l.preset];
    l.axiom=preset.axiom;
    l.rules=preset.rules;
    var s=l.axiom;
    /* Iterate rewriting */
    for(var i=0;i<l.iterations;i++){
      var newS='';
      for(var k=0;k<s.length;k++){
        var c=s[k];
        newS+=l.rules[c]||c;
      }
      s=newS;
      /* Cap string length to prevent freezing */
      if(s.length>100000){
        s=s.substring(0,100000);
        break;
      }
    }
    l.commands=s;
    l.drawProgress=0;
  },
  tick:function(dt){
    STATE.time+=dt;
    var l=STATE.lsystem;
    if(!STATE.playing)return;
    /* Progressive drawing */
    if(l.autoDraw&&l.drawProgress<l.commands.length){
      l.drawProgress+=Math.max(100,Math.floor(l.commands.length/60));
      if(l.drawProgress>l.commands.length)l.drawProgress=l.commands.length;
    }
  },
  stepOnce:function(){
    var l=STATE.lsystem;
    l.drawProgress=l.commands.length;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    var l=STATE.lsystem;
    ctx.fillStyle='#040208';
    ctx.fillRect(0,0,W,H);
    /* Turtle graphics */
    var stack=[];
    var turtle={x:0,y:0,angle:-90}; /* angle in degrees */
    /* First pass: compute bounds */
    var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    var testTurtle={x:0,y:0,angle:-90};
    var testStack=[];
    var angRad=0;
    for(var k=0;k<l.commands.length;k++){
      var c=l.commands[k];
      if(c==='F'||c==='G'){
        var rad=testTurtle.angle*Math.PI/180;
        testTurtle.x+=Math.cos(rad);
        testTurtle.y+=Math.sin(rad);
        if(testTurtle.x<minX)minX=testTurtle.x;
        if(testTurtle.x>maxX)maxX=testTurtle.x;
        if(testTurtle.y<minY)minY=testTurtle.y;
        if(testTurtle.y>maxY)maxY=testTurtle.y;
      } else if(c==='+'){testTurtle.angle+=l.angle}
      else if(c==='-'){testTurtle.angle-=l.angle}
      else if(c==='['){testStack.push({x:testTurtle.x,y:testTurtle.y,angle:testTurtle.angle})}
      else if(c===']'){var st=testStack.pop();if(st){testTurtle.x=st.x;testTurtle.y=st.y;testTurtle.angle=st.angle}}
    }
    if(!isFinite(minX)){minX=0;maxX=1;minY=0;maxY=1}
    var rangeX=maxX-minX;var rangeY=maxY-minY;
    var scale=Math.min((W-40)/rangeX,(H-40)/rangeY);
    var offX=(minX+maxX)/2;
    var offY=(minY+maxY)/2;
    /* Transform turtle coords to screen */
    function proj(x,y){
      return {x:W/2+(x-offX)*scale,y:H/2+(y-offY)*scale};
    }
    /* Second pass: draw */
    ctx.lineCap='round';
    ctx.lineJoin='round';
    var maxDepth=1;
    var drawEnd=Math.min(l.drawProgress,l.commands.length);
    for(var k=0;k<drawEnd;k++){
      var c=l.commands[k];
      if(c==='F'||c==='G'){
        var rad=turtle.angle*Math.PI/180;
        var nx=turtle.x+Math.cos(rad);
        var ny=turtle.y+Math.sin(rad);
        var p1=proj(turtle.x,turtle.y);
        var p2=proj(nx,ny);
        /* Color */
        var col;
        if(l.colorMode==='gradient'){
          var depth=stack.length;
          if(depth>maxDepth)maxDepth=depth;
          var t=depth/Math.max(1,l.iterations);
          col='hsl('+(120-t*120)+',70%,'+(40+t*30)+'%)';
        } else if(l.colorMode==='rainbow'){
          col='hsl('+((k/l.commands.length)*360)+',80%,60%)';
        } else if(l.colorMode==='green'){
          col='#40ff90';
        } else {
          col='#ffe040';
        }
        ctx.strokeStyle=col;
        ctx.lineWidth=Math.max(1,l.lineWidth*Math.pow(l.lineWidthScale,stack.length));
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
        turtle.x=nx;turtle.y=ny;
      } else if(c==='+'){turtle.angle+=l.angle}
      else if(c==='-'){turtle.angle-=l.angle}
      else if(c==='['){stack.push({x:turtle.x,y:turtle.y,angle:turtle.angle})}
      else if(c===']'){var st=stack.pop();if(st){turtle.x=st.x;turtle.y=st.y;turtle.angle=st.angle}}
    }
    /* Info panel */
    ctx.fillStyle='rgba(16,8,24,0.9)';
    ctx.strokeStyle='rgba(64,255,144,0.5)';
    ctx.beginPath();ctx.roundRect(20,20,260,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40ff90';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('L-SYSTEM · '+LSYS_PRESETS[l.preset].name.toUpperCase(),32,42);
    ctx.fillStyle='#f0d8ff';
    ctx.font='10px monospace';
    ctx.fillText('Iterations: '+l.iterations,32,62);
    ctx.fillText('String length: '+l.commands.length.toLocaleString(),32,78);
    ctx.fillText('Draw progress: '+l.drawProgress+'/'+l.commands.length,32,94);
    ctx.fillText('Angle: '+l.angle+'°',32,110);
    setStatsHTML(
      '<div>Iter: '+l.iterations+'</div>'+
      '<div>Length: '+l.commands.length.toLocaleString()+'</div>'+
      '<div>Progress: '+Math.round(l.drawProgress/l.commands.length*100)+'%</div>'+
      '<div>Depth: '+maxDepth+'</div>'
    );
    updateBadge('🌳 L-System · '+LSYS_PRESETS[l.preset].name+' · '+l.commands.length+' chars');
    $('sbMode').textContent='L-Systems';
  },
  onDown:function(p){},
  controls:function(){
    var l=STATE.lsystem;
    var html='';
    html+='<div class="sec"><h4>Preset</h4><div class="chip-row">';
    Object.keys(LSYS_PRESETS).forEach(function(k){
      html+='<div class="chip '+(l.preset===k?'active':'')+'" onclick="STATE.lsystem.preset=\''+k+'\';STATE.lsystem.iterations='+LSYS_PRESETS[k].iter+';STATE.lsystem.angle='+LSYS_PRESETS[k].angle+';MODULES.lsystem.init();renderLeftPanel()">'+LSYS_PRESETS[k].name+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Iterations</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Iter</span><span>'+l.iterations+'</span></div>';
    html+='<input type="range" min="1" max="8" step="1" value="'+l.iterations+'" oninput="STATE.lsystem.iterations=parseInt(this.value);MODULES.lsystem.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Angle</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Angle</span><span>'+l.angle+'°</span></div>';
    html+='<input type="range" min="5" max="150" step="1" value="'+l.angle+'" oninput="STATE.lsystem.angle=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Line width</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Base width</span><span>'+fmt(l.lineWidth,2)+'</span></div>';
    html+='<input type="range" min="0.5" max="5" step="0.1" value="'+l.lineWidth+'" oninput="STATE.lsystem.lineWidth=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Color</h4><div class="chip-row">';
    ['gradient','rainbow','green','yellow'].forEach(function(c){
      html+='<div class="chip '+(l.colorMode===c?'active':'')+'" onclick="STATE.lsystem.colorMode=\''+c+'\';renderLeftPanel()">'+c+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.lsystem.buildString();STATE.lsystem.drawProgress=0">▶ Rebuild</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.lsystem.drawProgress=0">↺ Replay draw</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Current rules</h4>';
    html+='<div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)">'+
      'Axiom: '+esc(l.axiom)+'<br>'+
      Object.keys(l.rules).map(function(k){
        return esc(k)+' → '+esc(l.rules[k]);
      }).join('<br>')+
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var l=STATE.lsystem;
    return '<div class="sec"><h4>L-System</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Aristid Lindenmayer (1968) — parallel rewriting system.<br><br>'+
      'Start with axiom. At each iteration, ALL symbols are replaced simultaneously using the production rules.'+
      '</div></div>'+
      '<div class="sec"><h4>Turtle graphics</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c1)">F, G</b> — move forward drawing a line<br>'+
      '<b style="color:var(--c1)">+</b> — turn right by angle<br>'+
      '<b style="color:var(--c1)">−</b> — turn left by angle<br>'+
      '<b style="color:var(--c1)">[</b> — push turtle state<br>'+
      '<b style="color:var(--c1)">]</b> — pop turtle state<br><br>'+
      'The brackets enable branching structures (trees).'+

      '<div class="sec"><h4>Complexity growth</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'String length grows exponentially or polynomially depending on rules.<br><br>'+
      'Current: '+l.commands.length.toLocaleString()+' chars at iter '+l.iterations+''+
      '</div></div>'+
      '<div class="sec"><h4>Applications</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+

});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* Animated boot: real-time Mandelbrot zoom */
function animateBootFrac(){
  var bc=$('bootFrac');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  var imgData=bctx.createImageData(bc.width,bc.height);
  var d=imgData.data;
  var W=bc.width,H=bc.height;
  /* Zoom parameters */
  var cx=-0.743643887,cy=0.131825904;
  var zoom=1;
  var frameCount=0;
  function renderFrame(){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    var halfW=3.5/zoom;
    var halfH=halfW*H/W;
    var maxIter=Math.min(200,80+Math.floor(Math.log10(zoom)*30));
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var zr=0,zi=0,zr2=0,zi2=0,iter=0;
        var cr=cx+(x/W-0.5)*2*halfW;
        var ci=cy+(y/H-0.5)*2*halfH;
        while(zr2+zi2<=4&&iter<maxIter){
          zi=2*zr*zi+ci;
          zr=zr2-zi2+cr;
          zr2=zr*zr;
          zi2=zi*zi;
          iter++;
        }
        var idx=(y*W+x)*4;
        if(iter>=maxIter){
          d[idx]=0;d[idx+1]=0;d[idx+2]=0;d[idx+3]=255;
        } else {
          var t=iter/maxIter;
          var r=Math.round(255*Math.pow(t,0.4));
          var g=Math.round(150*Math.pow(t,1.2));
          var b=Math.round(255*Math.pow(t,0.6));
          d[idx]=r;d[idx+1]=g;d[idx+2]=b;d[idx+3]=255;
        }
      }
    }
    bctx.putImageData(imgData,0,0);
    zoom*=1.02;
    if(zoom>1e8){zoom=1}
    requestAnimationFrame(renderFrame);
  }
  renderFrame();
}

var BOOT_STEPS=[
  'Compiling Mandelbrot escape-time algorithm...',
  'Loading strange attractors (Lorenz, Rössler)...',
  'Seeding logistic map r=3.7...',
  'Building Barnsley fern IFS (4 transforms)...',
  'Compiling Lindenmayer rewrite rules...',
  'Initializing smooth coloring (log-log)...',
  'Rendering boot fractal (real-time zoom)...',

];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');

    pct+=rnd(8,18);if(pct>100)pct=100;

    if(idx<BOOT_STEPS.length){

      l.textContent='[ OK ] '+BOOT_STEPS[idx];

      clearInterval(iv);

        $('boot').classList.add('hidden');

      },400);

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}
