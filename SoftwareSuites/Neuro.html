<!DOCTYPE html>
<html lang="pt-BR" data-theme="neuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEURO — Computational Neuroscience Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#0a0408;--panel:#140810;--panel2:#1c0c18;--panel3:#2a1224;--panel4:#3a1830;
  --bd:#281220;--bd2:#4a2038;--tx:#ffe8f0;--tx2:#c088a0;--tx3:#804860;
  --p1:#ff4090;--p2:#00e0ff;--p3:#ffb000;--p4:#a060ff;--p5:#40ff80;--p6:#ff6040;
  --g1:linear-gradient(135deg,#ff4090,#a060ff);
  --gHolo:linear-gradient(120deg,#ff4090,#a060ff,#00e0ff,#40ff80,#ffb000,#ff4090);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#fff5f8;--panel:#fff;--panel2:#fdf2f6;--panel3:#fce4ec;--panel4:#f4ccd8;--bd:#f0c0d0;--bd2:#c08098;--tx:#200815;--tx2:#803850;--tx3:#b07088;--p1:#d02060;--p2:#0080c0;--g1:linear-gradient(135deg,#d02060,#0080c0)}
[data-theme="mint"]{--bg:#021008;--panel:#041a0e;--panel2:#062418;--panel3:#0a3024;--panel4:#0e3c30;--bd:#082818;--bd2:#105038;--tx:#c0ffe0;--tx2:#70c0a0;--tx3:#408070;--p1:#40ff80;--p2:#00e0ff;--g1:linear-gradient(135deg,#40ff80,#00e0ff)}
[data-theme="gold"]{--bg:#0c0804;--panel:#160e08;--panel2:#1e1410;--panel3:#2c1e18;--panel4:#3a2820;--bd:#2a1a14;--bd2:#4a3028;--tx:#fff0e0;--tx2:#c0a080;--tx3:#806048;--p1:#ffb040;--p2:#ff6090;--g1:linear-gradient(135deg,#ffb040,#ff6090)}
[data-theme="mono"]{--bg:#080808;--panel:#101010;--panel2:#181818;--panel3:#242424;--panel4:#303030;--bd:#202020;--bd2:#404040;--tx:#f0f0f0;--tx2:#909090;--tx3:#606060;--p1:#e0e0e0;--p2:#ff4090;--g1:linear-gradient(135deg,#e0e0e0,#ff4090)}
[data-theme="ocean"]{--bg:#020810;--panel:#04101c;--panel2:#061828;--panel3:#0a2438;--panel4:#0e3048;--bd:#082028;--bd2:#104060;--tx:#c0e0ff;--tx2:#7098c0;--tx3:#406890;--p1:#40a0ff;--p2:#ff60c0;--g1:linear-gradient(135deg,#40a0ff,#ff60c0)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0408}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes spike{0%{transform:scale(0.3);opacity:1}100%{transform:scale(2.5);opacity:0}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#050208;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,64,144,.012) 0,rgba(255,64,144,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(20,8,16,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,64,144,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#0a0408;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#0a0408;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p5)}.toast.warn{border-left-color:var(--p3)}.toast.error{border-left-color:var(--p6)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.code{font-family:var(--mono);font-size:.62rem;background:rgba(0,0,0,.4);padding:8px;border-radius:4px;border:1px solid var(--bd);line-height:1.5;white-space:pre;overflow-x:auto;color:var(--tx)}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('hh')">NEURO</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">V</span><span class="sb-val c2" id="sbV">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Rate</span><span class="sb-val c3" id="sbR">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">I</span><span class="sb-val c4" id="sbI">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Info</span><span class="sb-val c5" id="sbInfo">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Hodgkin-Huxley</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function rndn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',function(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchmove',function(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchend',function(e){onUp();e.preventDefault()},{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}
var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ═══════════════════════════════════════════════════════════════
   NEURO CORE — HH, LIF, SYNAPSES, ETC
   ═══════════════════════════════════════════════════════════════ */
var KB_=1.380649e-23;
var QE_=1.602176634e-19;
var R_GAS=8.314;
var F_FARADAY=96485;

/* Hodgkin-Huxley alpha/beta rate functions (mV, ms) */
function hhAlphaM(V){var x=(V+40)/10;if(Math.abs(x)<1e-6)return 1;return 0.1*x/(1-Math.exp(-x))}
function hhBetaM(V){return 4.0*Math.exp(-(V+65)/18)}
function hhAlphaH(V){return 0.07*Math.exp(-(V+65)/20)}
function hhBetaH(V){return 1/(1+Math.exp(-(V+35)/10))}
function hhAlphaN(V){var x=(V+55)/10;if(Math.abs(x)<1e-6)return 0.1;return 0.01*x/(1-Math.exp(-x))}
function hhBetaN(V){return 0.125*Math.exp(-(V+65)/80)}

/* HH steady state */
function hhInf(V){var am=hhAlphaM(V),bm=hhBetaM(V);var ah=hhAlphaH(V),bh=hhBetaH(V);var an=hhAlphaN(V),bn=hhBetaN(V);return {m:am/(am+bm),h:ah/(ah+bh),n:an/(an+bn)}}

/* HH current */
function hhCurrent(V,m,h,n,gNa,gK,gL,ENa,EK,EL){
  return -gNa*m*m*m*h*(V-ENa)-gK*n*n*n*n*(V-EK)-gL*(V-EL);
}

/* LIF dynamics */
function lifStep(V,I,C,gL,EL,Vth,Vreset,dt){
  var dV=(I-gL*(V-EL))/C*dt;
  var newV=V+dV;
  var spiked=false;
  if(newV>=Vth){newV=Vreset;spiked=true}
  return {V:newV,spike:spiked};
}

/* Synaptic conductance (exponential decay) */
function synStep(g,gmax,tau,tauRise,dt){
  return g*Math.exp(-dt/tau);
}

/* NMDA Mg block */
function nmdaBlock(V,Mg){return 1/(1+Mg*Math.exp(-V/16.13)/3.57)}

/* STDP */
function stdpWindow(dt,tauPlus,tauMinus,Aplus,Aminus){
  if(dt>0)return Aplus*Math.exp(-dt/tauPlus);
  else if(dt<0)return -Aminus*Math.exp(dt/tauMinus);
  return 0;
}

/* Wilson-Cowan neural field */
function wcStep(E,I,wEE,wEI,wIE,wII,S,dt,tauE,tauI,P){
  function Sfun(x){return 1/(1+Math.exp(-x))}
  var dE=(-E+Sfun(wEE*E-wEI*I+P))/tauE*dt;
  var dI=(-I+Sfun(wIE*E-wII*I))/tauI*dt;
  return {E:E+dE,I:I+dI};
}

/* Hopfield energy */
function hopfieldEnergy(s,w){
  var E=0;
  for(var i=0;i<s.length;i++){
    for(var j=0;j<s.length;j++){
      E-=0.5*w[i][j]*s[i]*s[j];
    }
  }
  return E;
}

/* Fire rate from spike train */
function firingRate(spikes,twindow){
  return spikes.filter(function(t){return t>STATE.time-twindow}).length/twindow;
}

/* Inter-spike interval stats */
function isiStats(spikeTimes){
  if(spikeTimes.length<2)return {mean:0,cv:0};
  var isis=[];
  for(var i=1;i<spikeTimes.length;i++)isis.push(spikeTimes[i]-spikeTimes[i-1]);
  var mean=isis.reduce(function(a,b){return a+b},0)/isis.length;
  var variance=isis.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/isis.length;
  return {mean:mean,cv:Math.sqrt(variance)/mean,isis:isis};
}

/* Fano factor */
function fanoFactor(spikes,twindow,bins){
  var counts=new Array(bins).fill(0);
  spikes.forEach(function(t){
    var idx=Math.floor(t/twindow*bins);
    if(idx>=0&&idx<bins)counts[idx]++;
  });
  var mean=counts.reduce(function(a,b){return a+b},0)/bins;
  var variance=counts.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/bins;
  return variance/mean;
}

/* Information theory */
function entropy(p){
  var H=0;
  for(var i=0;i<p.length;i++)if(p[i]>1e-12)H-=p[i]*Math.log2(p[i]);
  return H;
}
function mutualInfo(joint){
  var px=new Array(joint.length).fill(0);
  var py=new Array(joint[0].length).fill(0);
  var N=joint.length,M=joint[0].length;
  for(var i=0;i<N;i++)for(var j=0;j<M;j++){px[i]+=joint[i][j];py[j]+=joint[i][j]}
  var MI=0;
  for(var i2=0;i2<N;i2++){
    for(var j2=0;j2<M;j2++){
      if(joint[i2][j2]>1e-12){
        MI+=joint[i2][j2]*Math.log2(joint[i2][j2]/(px[i2]*py[j2]+1e-12));
      }
    }
  }
  return MI;
}

/* Balloon model (fMRI) */
function balloonStep(q,v,E0,tau0,alpha,tauMTT,dt,f){
  var dq=(f/E0)-q/v*Math.pow(v,1/alpha)*(1-(1-E0)/E0)/tauMTT;
  var dv=(f-Math.pow(v,1/alpha))/tauMTT;
  return {q:q+dq*dt*10,v:v+dv*dt*10};
}

/* BOLD signal (simplified) */
function boldFromBalloon(q,v,V0,a1,a2){
  return V0*(a1*(1-q)-(a2*(1-v)));
}

/* Calcium GCaMP */
function calciumStep(Ca,CaRest,spike,tau,dt){
  var dCa=-(Ca-CaRest)/tau*dt;
  if(spike)Ca+=1.0;
  return Ca+dCa;
}

/* Cable equation */
function cableStep(V,prev,I,rL,cm,dx,dt){
  var n=V.length;
  var dV=new Array(n);
  for(var i=0;i<n;i++){
    var lap=0;
    if(i>0)lap+=(prev[i-1]-prev[i]);
    if(i<n-1)lap+=(prev[i+1]-prev[i]);
    dV[i]=(lap/(rL*dx*dx)+I[i]-V[i])/(cm)*dt*10;
  }
  return V.map(function(v,i){return v+dV[i]});
}

/* Bayesian decoder */
function bayesDecode(likelihood,prior){
  var post=likelihood.map(function(l,i){return l*prior[i]});
  var norm=post.reduce(function(a,b){return a+b},0);
  return post.map(function(p){return p/norm});
}

/* Kalman filter (BCI) */
function kalmanStep(x,P,A,Q,H,R,z){
  /* Predict */
  var xp=A[0]*x[0]+A[1]*x[1];
  var yp=A[2]*x[0]+A[3]*x[1];
  var P00=A[0]*P[0]*A[0]+A[0]*P[1]*A[2]+A[1]*P[2]*A[0]+A[1]*P[3]*A[2]+Q[0];
  var P01=A[0]*P[0]*A[1]+A[0]*P[1]*A[3]+A[1]*P[2]*A[1]+A[1]*P[3]*A[3];
  var P10=A[2]*P[0]*A[0]+A[2]*P[1]*A[2]+A[3]*P[2]*A[0]+A[3]*P[3]*A[2];
  var P11=A[2]*P[0]*A[1]+A[2]*P[1]*A[3]+A[3]*P[2]*A[1]+A[3]*P[3]*A[3]+Q[3];
  /* Update (simplified scalar) */
  var S=H[0]*P00*H[0]+H[1]*P11*H[1]+R;
  var y=z[0]-H[0]*xp-H[1]*yp;
  var K0=(P00*H[0]+P01*H[1])/S;
  var K1=(P10*H[0]+P11*H[1])/S;
  return {x:[xp+K0*y,yp+K1*y],P:[P00-K0*H[0]*P00,P01-K0*H[1]*P01,P10-K1*H[0]*P10,P11-K1*H[1]*P11]};
}

/* ChR2 kinetics (4-state model simplified to 2-state) */
function chr2Step(O,C,light,k_on,k_off,dt){
  if(light){O+=k_on*(1-O)*dt}
  else{O-=k_off*O*dt}
  return clamp(O,0,1);
}

/* Retinal photoreceptor (Weber-Fechner) */
function photoreceptorResponse(I,I0){
  return Math.log(1+I/I0);
}

/* Cochlear place frequency (Greenwood) */
function cochlearFreq(x,A,a,k){
  /* x: 0 (apex) to 1 (base) */
  A=A||165.4;a=a||2.1;k=k||0.88;
  return A*(Math.pow(10,a*(1-x))-k);
}

/* Optic flow (motion) */
function opticFlow(vx,vy,x,y,f){
  return {u:f*vx/(f+y*0+1e-6),v:f*vy/(f+y*0+1e-6)};
}

/* Oscillation power via simple FFT-like DFT */
function dft(signal,freqs){
  var N=signal.length;
  return freqs.map(function(f){
    var re=0,im=0;
    for(var t=0;t<N;t++){
      var ang=2*Math.PI*f*t/N;
      re+=signal[t]*Math.cos(ang);
      im+=signal[t]*Math.sin(ang);
    }
    return Math.sqrt(re*re+im*im)/N;
  });
}

/* ═══════════════════════════════════════════════════════════════
   DRAWING UTILITIES
   ═══════════════════════════════════════════════════════════════ */
function drawGrid(ctx,x,y,w,h,rows,cols){
  ctx.strokeStyle='rgba(255,64,144,.08)';ctx.lineWidth=1;
  for(var i=0;i<=rows;i++){var yy=y+i*h/rows;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}
  for(var j=0;j<=cols;j++){var xx=x+j*w/cols;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}
}
function drawAxes(ctx,x,y,w,h,xL,yL){
  ctx.strokeStyle='rgba(255,64,144,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();
  ctx.fillStyle='#804860';ctx.font='10px monospace';
  if(xL)ctx.fillText(xL,x+w/2-20,y+h+22);
  if(yL){ctx.save();ctx.translate(x-20,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(yL,0,0);ctx.restore()}
}
function drawRaster(ctx,x,y,w,h,spikes,tmin,tmax,nNeurons,color){
  var yPer=h/Math.max(nNeurons,1);
  spikes.forEach(function(sp){
    var px=x+(sp.t-tmin)/(tmax-tmin)*w;
    var py=y+sp.n*yPer;
    if(px>=x&&px<=x+w){
      ctx.strokeStyle=color||'#ff4090';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+yPer*0.9);ctx.stroke();
    }
  });
}
function drawSpike(ctx,x,y,r,color){
  ctx.fillStyle=color||'#ff4090';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';
  ctx.stroke();
}
function drawArrow(ctx,x1,y1,x2,y2,color){
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-y1,x2-x1);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-10*Math.cos(ang-0.4),y2-10*Math.sin(ang-0.4));
  ctx.lineTo(x2-10*Math.cos(ang+0.4),y2-10*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();
}
function drawNeuron(ctx,x,y,r,active,label,color){
  color=color||'#ff4090';
  var act=active||0;
  ctx.fillStyle=active?'rgba(255,64,144,0.4)':'rgba(40,18,32,0.5)';
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  /* Dendrites */
  ctx.strokeStyle=color;ctx.lineWidth=1.5;
  for(var a=0;a<6;a++){
    var ang=a/6*Math.PI*2;
    var ex=x+Math.cos(ang)*(r+8);
    var ey=y+Math.sin(ang)*(r+8);
    ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*r,y+Math.sin(ang)*r);ctx.lineTo(ex,ey);ctx.stroke();
  }
  if(label){
    ctx.fillStyle=color;ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText(label,x,y+4);ctx.textAlign='left';
  }
  if(active){
    ctx.fillStyle='#ffb000';
    ctx.beginPath();ctx.arc(x,y,r*0.4,0,Math.PI*2);ctx.fill();
  }
}

registerModule('lif',{title:'Leaky Integrate-and-Fire',icon:'▲',desc:'Simplified neuron model with refractory period.',init:function(){this.reset()},
reset:function(){var l=STATE.lif;
l.V=-70;l.history=[];l.spikes=[];l.t=0;l.refractory=0},
step:function(dt){var l=STATE.lif;
var dtms=dt*1000;
if(l.refractory>0){l.refractory-=dtms;l.V=l.Vreset}
else{
  var res=lifStep(l.V,l.Iext,l.Cm,l.gL,l.EL,l.Vth,l.Vreset,dtms);
  l.V=res.V;
  if(res.spike){l.spikes.push(l.t);l.refractory=l.tauRef}
}
l.t+=dtms;
l.history.push({V:l.V,t:l.t,ref:l.refractory>0});
if(l.history.length>2000)l.history.shift();
while(l.spikes.length>0&&l.spikes[0]<l.t-1000)l.spikes.shift()},

registerModule('dendrite',{title:'Dendritic Integration',icon:'🌿',desc:'Cable equation, passive spread, attenuation.',init:function(){this.reset()},
reset:function(){var d=STATE.dendrite;
d.V=new Array(d.n).fill(-65);
d.I=new Array(d.n).fill(0);
d.t=0;d.spikes=[]},
step:function(dt){var d=STATE.dendrite;
/* Input current at some position */
d.I=new Array(d.n).fill(0);
d.I[d.inputPos]=5;
var dtms=dt*1000;
var lambda=Math.sqrt(1/(d.rL*0.001)); /* space constant */
/* Explicit cable equation */
var newV=d.V.map(function(v,i){
  var lap=0;
  if(i>0)lap+=(d.V[i-1]-v);

registerModule('network',{title:'Spiking Network',icon:'🕸',desc:'Random recurrent network of LIF neurons.',init:function(){this.reset()},
reset:function(){var n=STATE.network;
n.V=new Array(n.n).fill(-65);
n.weights=[];
for(var i=0;i<n.n;i++){
  n.weights.push([]);
  for(var j=0;j<n.n;j++){
    if(i===j)n.weights[i].push(0);
    else n.weights[i].push(Math.random()<0.3?(Math.random()<0.8?0.5:-0.3):0);
  }
}
n.spikes=[];n.activities=new Array(n.n).fill(0);n.t=0;n.history=[]},
step:function(dt){var n=STATE.network;
var dtms=dt*1000;
for(var i=0;i<n.n;i++){
  var Isyn=0;
  n.weights[i].forEach(function(w,j){if(w&&n.activities[j]>0)Isyn+=w*n.activities[j]*10});
  var Isup=Math.random()*5;
  var res=lifStep(n.V[i],Isyn+Isup,1,0.1,-70,-55,-70,dtms);
  n.V[i]=res.V;
  if(res.spike){n.spikes.push({t:n.t,n:i});n.activities[i]=1;n.V[i]=-70}
  else n.activities[i]*=Math.exp(-dtms/5);
}
n.t+=dtms;
n.history.push({t:n.t,rate:n.spikes.filter(function(s){return s.t>n.t-50}).length/n.n*20});
if(n.history.length>1000)n.history.shift();
while(n.spikes.length>0&&n.spikes[0].t<n.t-500)n.spikes.shift()},

var cx=W*0.35,cy=H*0.4,r=Math.min(W,H)*0.22;
var nodePos=[];
for(var i=0;i<n.n;i++){
  var a=i/n.n*Math.PI*2-Math.PI/2;
  nodePos.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
}
/* Connections */
ctx.lineWidth=0.5;
for(var i2=0;i2<n.n;i2++){
  for(var j=0;j<n.n;j++){
    var w=n.weights[i2][j];
    if(w){
      ctx.strokeStyle=w>0?'rgba(64,255,128,.15)':'rgba(255,48,96,.15)';
      ctx.beginPath();
      ctx.moveTo(nodePos[i2].x,nodePos[i2].y);
      ctx.lineTo(nodePos[j].x,nodePos[j].y);
      ctx.stroke();
    }

}
/* Nodes */

  ctx.beginPath();ctx.arc(nodePos[i3].x,nodePos[i3].y,size,0,Math.PI*2);ctx.fill();
  if(act>0.5){
    ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.stroke();
  }
}
/* Raster */
var rpy=py=H*0.7;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('SPIKE RASTER',60,py-5);
var tmin=n.t-300,tmax=n.t;

var yPer=rh/n.n;
n.spikes.forEach(function(sp){

  if(x>=rx&&x<=rx+rw){
    ctx.strokeStyle='#ff4090';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,ry+sp.n*yPer);ctx.lineTo(x,ry+sp.n*yPer+yPer);ctx.stroke();
  }
});
/* Info */
var ix=W-260,iy=60;
ctx.fillStyle='rgba(20,8,16,.9)';ctx.fillRect(ix,iy,240,200);
ctx.strokeStyle='#ff4090';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,200);

ctx.fillText('NETWORK INFO',ix+10,iy+22);
ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('Neurons:',ix+10,iy+48);ctx.fillStyle='#00e0ff';ctx.fillText(n.n,ix+180,iy+48);

registerModule('hopfield',{title:'Hopfield Network',icon:'◆',desc:'Attractor dynamics + memory recall.',init:function(){this.reset()},
reset:function(){var h=STATE.hopfield;
h.n=25;
/* Create 3 patterns */
h.patterns=[];
for(var p=0;p<3;p++){
  var pat=[];
  for(var i=0;i<h.n;i++)pat.push(Math.random()<0.5?-1:1);
  h.patterns.push(pat);
}
/* Weights: outer products (Hebbian) */
h.weights=[];
for(var i2=0;i2<h.n;i2++){
  h.weights.push([]);
  for(var j=0;j<h.n;j++){
    if(i2===j)h.weights[i2].push(0);
    else{
      var w=0;
      for(var k=0;k<h.patterns.length;k++)w+=h.patterns[k][i2]*h.patterns[k][j];
      h.weights[i2].push(w/h.n);
    }
  }
}
/* Start from corrupted pattern 0 */
h.state=h.patterns[0].slice();
var flip=Math.floor(h.n*0.2);
for(var f=0;f<flip;f++){
  var idx=rnd(0,h.n-1);
  h.state[idx]*=-1;
}
h.energy=[hopfieldEnergy(h.state,h.weights)];
h.history=[]},
step:function(){var h=STATE.hopfield;
/* Async update: pick random neuron */
var i=rnd(0,h.n-1);
var sum=0;
for(var j=0;j<h.n;j++)sum+=h.weights[i][j]*h.state[j];
if(sum>0)h.state[i]=1;
else if(sum<0)h.state[i]=-1;
h.energy.push(hopfieldEnergy(h.state,h.weights));
if(h.energy.length>500)h.energy.shift()},
tick:function(dt){STATE.time+=dt;var h=STATE.hopfield;if(!STATE.playing)return;
for(var i=0;i<3;i++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);
var h=STATE.hopfield;
ctx.fillStyle='#ff4090';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('HOPFIELD — E='+fmt(h.energy[h.energy.length-1],3)+' · n='+h.n,30,30);
/* Network grid (5x5 for 25 neurons) */
var gridSize=Math.sqrt(h.n);
var px=60,py=80;
var cellSize=Math.min(40,(H*0.5)/gridSize);

for(var i=0;i<h.n;i++){

  var x=px+col*cellSize;

  ctx.fillStyle=h.state[i]>0?'#00e0ff':'#ff3060';
  ctx.fillRect(x,y,cellSize-2,cellSize-2);

}

var patX=px+gridSize*cellSize+30;

ctx.fillText('STORED PATTERNS',patX,py-5);
h.patterns.forEach(function(pat,p){

registerModule('wc',{title:'Wilson-Cowan',icon:'♨',desc:'E/I population dynamics.',init:function(){this.reset()},
reset:function(){var w=STATE.wc;

w.E=res.E;w.I=res.I;

w.history.push({t:w.t,E:w.E,I:w.I});
if(w.history.length>2000)w.history.shift()},

ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';

    var ex=i/N,iy=j/N;
    var d=wcStep(ex,iy,w.wEE,w.wEI,w.wIE,w.wII,0,0.1,w.tauE,w.tauI,w.P);
    var vx=(d.E-ex)*N*15,vy=(d.I-iy)*N*15;

sig+=0.3*Math.sin(2*Math.PI*4*t); /* theta */

o.signal.push({t:t,v:sig});
if(o.signal.length>2000)o.signal.shift();

/* 14. CONNECTOME */
registerModule('connectome',{title:'Connectome',icon:'🔗',desc:'Graph analysis of neural networks.',init:function(){this.reset()},
reset:function(){var c=STATE.connectome;
c.n=50;
/* Generate random adjacency (with some hubs) */
c.adj=[];
for(var i=0;i<c.n;i++){
  c.adj.push(new Array(c.n).fill(0));
}
/* Hub structure */
for(var i2=0;i2<5;i2++){
  var hub=i2;
  for(var j=0;j<c.n;j++){if(hub!==j&&Math.random()<0.3){c.adj[hub][j]=1;c.adj[j][hub]=1}}
}
for(var i3=5;i3<c.n;i3++){
  for(var j2=i3+1;j2<c.n;j2++){
    if(Math.random()<0.05){c.adj[i3][j2]=1;c.adj[j2][i3]=1}
  }
}
/* Degree */
c.degree=c.adj.map(function(row){return row.reduce(function(a,b){return a+b},0)});
/* Clustering coefficient */
c.clustering=0;
for(var k=0;k<c.n;k++){
  var neigh=[];
  for(var m=0;m<c.n;m++)if(c.adj[k][m])neigh.push(m);
  var links=0;
  for(var a=0;a<neigh.length;a++)for(var b=a+1;b<neigh.length;b++)if(c.adj[neigh[a]][neigh[b]])links++;
  if(neigh.length>1)c.clustering+=(2*links)/(neigh.length*(neigh.length-1));
}
c.clustering/=c.n;
/* Path length (BFS average) */
c.pathLength=0;
var count=0;
for(var s=0;s<c.n;s++){
  var dist=new Array(c.n).fill(-1);
  dist[s]=0;
  var queue=[s];
  while(queue.length>0){
    var u=queue.shift();
    for(var v=0;v<c.n;v++){
      if(c.adj[u][v]&&dist[v]<0){dist[v]=dist[u]+1;queue.push(v)}
    }
  }
  for(var t=0;t<c.n;t++){if(dist[t]>0){c.pathLength+=dist[t];count++}}
}
if(count>0)c.pathLength/=count},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);
var c=STATE.connectome;
ctx.fillStyle='#ff4090';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('CONNECTOME — n='+c.n+' · C='+fmt(c.clustering,3)+' · L='+fmt(c.pathLength,2),30,30);
/* Network visualization */
var cx=W*0.4,cy=H*0.45,r=Math.min(W,H)*0.3;
/* Force-directed layout */
var pos=[];
for(var i=0;i<c.n;i++){
  var a=i/c.n*Math.PI*2;
  var rad=r*(0.3+0.7*Math.random());
  pos.push({x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad,vx:0,vy:0});
}
/* Relax */
for(var iter=0;iter<100;iter++){
  for(var i2=0;i2<c.n;i2++){
    var fx=0,fy=0;
    for(var j=0;j<c.n;j++){
      if(i2===j)continue;
      var dx=pos[j].x-pos[i2].x,dy=pos[j].y-pos[i2].y;
      var d2=dx*dx+dy*dy+1;
      if(c.adj[i2][j]){
        fx+=dx*0.001;
        fy+=dy*0.001;
      }else{
        fx-=dx/d2*100;
        fy-=dy/d2*100;
      }
    }
    pos[i2].vx=fx;pos[i2].vy=fy;
  }
  pos.forEach(function(p){p.x+=p.vx;p.y+=p.vy});
}
/* Edges */
c.adj.forEach(function(row,i3){
  row.forEach(function(v,j2){
    if(v&&i3<j2){
      ctx.strokeStyle='rgba(255,64,144,.15)';ctx.lineWidth=0.5;
      ctx.beginPath();
      ctx.moveTo(pos[i3].x,pos[i3].y);
      ctx.lineTo(pos[j2].x,pos[j2].y);
      ctx.stroke();
    }
  });
});
/* Nodes colored by degree */
var maxDeg=Math.max.apply(null,c.degree);
pos.forEach(function(p,i4){
  var d=c.degree[i4];
  var size=4+d/Math.max(maxDeg,1)*10;
  var hue=240*(1-d/Math.max(maxDeg,1));
  ctx.fillStyle='hsl('+hue+',70%,60%)';
  ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();
});
/* Degree distribution */
var dx=W*0.72,dy=80,dw=W*0.24,dh=H*0.3;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('DEGREE DISTRIBUTION',dx,dy-5);
var hist=new Array(20).fill(0);
c.degree.forEach(function(d){hist[Math.min(19,d)]++});
var maxH=Math.max.apply(null,hist.concat([1]));
var bw=dw/20;
for(var i5=0;i5<20;i5++){
  var h=hist[i5]/maxH*dh;
  ctx.fillStyle='#00e0ff';
  ctx.fillRect(dx+i5*bw+1,dy+dh-h,bw-2,h);
}
/* Info */
var ix=W-260,iy=H*0.6;
ctx.fillStyle='rgba(20,8,16,.9)';ctx.fillRect(ix,iy,240,200);
ctx.strokeStyle='#ff4090';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,200);
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('CONNECTOME INFO',ix+10,iy+22);
ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('Nodes:',ix+10,iy+48);ctx.fillStyle='#00e0ff';ctx.fillText(c.n,ix+180,iy+48);
ctx.fillStyle='#c088a0';ctx.fillText('Edges:',ix+10,iy+68);
var E=0;c.adj.forEach(function(row){row.forEach(function(v){E+=v})});
ctx.fillStyle='#00e0ff';ctx.fillText(E/2,ix+180,iy+68);
ctx.fillStyle='#c088a0';ctx.fillText('Avg degree:',ix+10,iy+88);
ctx.fillStyle='#40ff80';ctx.fillText(fmt(E/c.n,2),ix+180,iy+88);
ctx.fillStyle='#c088a0';ctx.fillText('Clustering C:',ix+10,iy+113);
ctx.fillStyle='#ffb000';ctx.fillText(fmt(c.clustering,3),ix+180,iy+113);
ctx.fillStyle='#c088a0';ctx.fillText('Path length L:',ix+10,iy+138);
ctx.fillStyle='#ff4090';ctx.fillText(fmt(c.pathLength,2),ix+180,iy+138);
ctx.fillStyle='#c088a0';ctx.fillText('Small-world σ:',ix+10,iy+163);
var sigma=(c.clustering/0.05)/(c.pathLength/3);
ctx.fillStyle=sigma>1?'#40ff80':'#ff3060';
ctx.fillText(fmt(sigma,2),ix+180,iy+163);
ctx.fillStyle='#c088a0';ctx.fillText('Type:',ix+10,iy+188);
ctx.fillStyle=sigma>1?'#40ff80':'#ffb000';
ctx.fillText(sigma>1?'Small-world':'Random',ix+180,iy+188);
setStats('<div>N: '+c.n+'</div><div>C: '+fmt(c.clustering,3)+'</div><div>L: '+fmt(c.pathLength,2)+'</div>');
badge('🔗 Connectome · C='+fmt(c.clustering,2)+' L='+fmt(c.pathLength,2));
SV('sbV','—');SV('sbR',fmt(c.clustering,3));SV('sbI',fmt(c.pathLength,2))},
controls:function(){var c=STATE.connectome;var h='<div class="sec"><h4>Network size</h4>';
h+='<div class="ctrl"><div class="lbl"><span>N nodes</span><span>'+c.n+'</span></div><input type="range" min="20" max="150" step="5" value="'+c.n+'" oninput="STATE.connectome.n=parseInt(this.value);MODULES.connectome.reset()"></div>';
h+='</div>';
h+='<button class="btn primary full" onclick="MODULES.connectome.reset();toast(\'New connectome\',\'success\')">🎲 Randomize</button>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Connectomics</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Escalas:</b><br>• Micro (synapses, μm)<br>• Meso (columns, ~100μm-1mm)<br>• Macro (regions, cm)<br><br><b>Métricas:</b><br>• Degree k_i<br>• Clustering C_i = 2E_i/(k_i(k_i-1))<br>• Path length L<br>• Modularity Q<br>• Betweenness<br>• Rich club<br><br><b>Small-world (Watts-Strogatz):</b><br>C &gt;&gt; C_random, L ≈ L_random<br>σ = (C/C_rand)/(L/L_rand) &gt; 1<br><br><b>Scale-free (Barabasi):</b><br>P(k) ~ k^(-γ)<br>γ ≈ 2-3<br>Hubs emergem<br><br><b>Human Connectome Project:</b><br>~1000 subjects<br>dMRI + fMRI<br>~360 regions (Glasser 2016)<br><br><b>Modelos:</b><br>• C. elegans (~300 neurons)<br>• Drosophila (~100k)<br>• Mouse (~70M)<br>• Human (~86B)<br>• MICrONS (2021, ~200k cortical)</div></div>'}});

/* 15. LFP */
registerModule('lfp',{title:'Local Field Potential',icon:'📡',desc:'LFP from population spiking.',init:function(){this.reset()},
reset:function(){var l=STATE.lfp;
l.spikes=[];l.lfp=[];l.t=0},
step:function(dt){var l=STATE.lfp;
var dtms=dt*1000;
/* Random spikes across population */
for(var i=0;i<10;i++){
  if(Math.random()<0.01){l.spikes.push({t:l.t,neuron:i})}
}
/* LFP = convolution of spikes with synaptic kernel */
var lfpVal=0;
l.spikes.forEach(function(sp){
  var age=(l.t-sp.t)/100;
  if(age>=0)lfpVal+=sp.neuron%2===0?Math.exp(-age):-0.5*Math.exp(-age);
});
lfpVal+=rndn()*0.02;
l.lfp.push({t:l.t,v:lfpVal});
if(l.lfp.length>2000)l.lfp.shift();
l.t+=dtms;
while(l.spikes.length>0&&l.spikes[0].t<l.t-500)l.spikes.shift()},
tick:function(dt){STATE.time+=dt;var l=STATE.lfp;if(!STATE.playing)return;
for(var i=0;i<5;i++)this.step(0.001)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);

registerModule('bci',{title:'Brain-Computer Interface',icon:'🖱',desc:'Kalman decoder for cursor control.',init:function(){this.reset()},
reset:function(){var b=STATE.bci;
b.x=0;b.y=0;b.vx=0;b.vy=0;b.target=Math.random()*2-1;b.target2=Math.random()*2-1;
b.history=[];b.error=0;
b.A=[1,0.1,0,1]; /* state transition */
b.Q=[0.01,0,0,0.01];
b.H=[1,0,1,0];
b.R=0.1;
b.P=[1,0,0,1];
b.t=0},
step:function(dt){var b=STATE.bci;
var dtSec=dt;
/* True dynamics */
b.vx+=rndn()*0.1;
b.vy+=rndn()*0.1;
b.vx*=0.95;b.vy*=0.95;
b.x+=b.vx*dtSec;
b.y+=b.vy*dtSec;
/* Observed neural activity (2D) */
var zx=b.x+rndn()*0.1;
var zy=b.y+rndn()*0.1;
/* Kalman update */
var res=kalmanStep([b.x,b.y],b.P,b.A,b.Q,[1,1],b.R,[zx,zy]);
b.pred=res.x;
b.P=res.P;
var err=Math.sqrt(Math.pow(res.x[0]-b.x,2)+Math.pow(res.x[1]-b.y,2));
b.error=err*0.9+b.error*0.1;
b.history.push({t:b.t,x:b.x,y:b.y,px:res.x[0],py:res.x[1],tx:b.target,ty:b.target2});
if(b.history.length>2000)b.history.shift();
b.t+=dtSec},
tick:function(dt){STATE.time+=dt;var b=STATE.bci;if(!STATE.playing)return;
var sub=Math.floor(dt*20);
for(var i=0;i<sub;i++)this.step(0.05)},

var cx=W*0.5,cy=H*0.45,r=Math.min(W,H)*0.35;

var ty=cy+b.target2*r*0.8;

ctx.beginPath();ctx.arc(tx,ty,15,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#40ff80';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(tx,ty,15,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#40ff80';ctx.font='bold 10px monospace';

var py=cy+b.y*r*0.8;

}
/* Trajectory */
ctx.strokeStyle='rgba(255,64,144,.4)';ctx.lineWidth=1;
ctx.beginPath();
b.history.forEach(function(h,i){
  var x=cx+h.x*r*0.8,y=cy+h.y*r*0.8;

});
ctx.stroke();

ctx.fillStyle='rgba(20,8,16,.9)';ctx.fillRect(ix,iy,240,240);

ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('BCI STATE',ix+10,iy+22);
ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('Cursor x:',ix+10,iy+48);ctx.fillStyle='#ff4090';ctx.fillText(fmt(b.x,4),ix+180,iy+48);
ctx.fillStyle='#c088a0';ctx.fillText('Cursor y:',ix+10,iy+68);ctx.fillStyle='#ff4090';ctx.fillText(fmt(b.y,4),ix+180,iy+68);
ctx.fillStyle='#c088a0';ctx.fillText('Target x:',ix+10,iy+88);ctx.fillStyle='#40ff80';ctx.fillText(fmt(b.target,4),ix+180,iy+88);
ctx.fillStyle='#c088a0';ctx.fillText('Velocity vx:',ix+10,iy+113);ctx.fillStyle='#00e0ff';ctx.fillText(fmt(b.vx,4),ix+180,iy+113);
ctx.fillStyle='#c088a0';ctx.fillText('Velocity vy:',ix+10,iy+133);ctx.fillStyle='#00e0ff';ctx.fillText(fmt(b.vy,4),ix+180,iy+133);
ctx.fillStyle='#c088a0';ctx.fillText('Prediction x:',ix+10,iy+158);
ctx.fillStyle='#a060ff';ctx.fillText(b.pred?fmt(b.pred[0],4):'—',ix+180,iy+158);
ctx.fillStyle='#c088a0';ctx.fillText('Error:',ix+10,iy+183);
ctx.fillStyle=b.error<0.1?'#40ff80':b.error<0.5?'#ffb000':'#ff3060';

registerModule('dbs',{title:'Deep Brain Stimulation',icon:'⚡',desc:'Parkinsonian oscillations, stimulation.',init:function(){this.reset()},
reset:function(){var d=STATE.dbs;
d.V=-65;d.t=0;d.history=[];d.spikes=[]},
step:function(dt){var d=STATE.dbs;
var dtms=dt*1000;
/* Parkinsonian beta oscillation drive */
var betaDrive=Math.sin(2*Math.PI*20*d.t/1000)*5;
/* DBS pulses */
var dbsCurrent=0;
if(d.amp>0){
  var pulsePhase=(d.t%1000)/1000*d.freq;
  var pulseLoc=pulsePhase-Math.floor(pulsePhase);
  if(pulseLoc<d.pulseWidth*d.freq)dbsCurrent=d.amp*10;
}
var Iext=5+betaDrive+dbsCurrent;
var res=lifStep(d.V,Iext,1,0.1,-70,-55,-70,dtms);
d.V=res.V;
if(res.spike){d.spikes.push(d.t);d.V=-70}
d.t+=dtms;
d.history.push({t:d.t,V:d.V});
if(d.history.length>2000)d.history.shift();
while(d.spikes.length>0&&d.spikes[0]<d.t-1000)d.spikes.shift()},
tick:function(dt){STATE.time+=dt;var d=STATE.dbs;if(!STATE.playing)return;
for(var i=0;i<10;i++)this.step(0.001)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);
var d=STATE.dbs;
ctx.fillStyle='#ff4090';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('DBS — '+d.freq+'Hz · '+d.amp+'mA · V='+fmt(d.V,1)+'mV',30,30);
/* Voltage trace */
var px=60,py=80,pw=W-120,ph=H*0.35;
drawAxes(ctx,px,py,pw,ph,'t (ms)','V (mV)');
ctx.strokeStyle='#ff4090';ctx.lineWidth=1.5;
ctx.beginPath();
var tmin=d.history.length>0?d.history[0].t:0;
var tmax=d.history.length>0?d.history[d.history.length-1].t:tmin+1;
d.history.forEach(function(pt,i){
  var x=px+(pt.t-tmin)/(tmax-tmin+1e-9)*pw;
  var y=py+ph-(pt.V+80)/40*ph;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Spike raster */
d.spikes.forEach(function(sp){
  var x=px+(sp-tmin)/(tmax-tmin+1e-9)*pw;
  if(x>=px&&x<=px+pw){
    ctx.strokeStyle='#ffb000';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,py+ph-5);ctx.lineTo(x,py+ph-15);ctx.stroke();
  }
});
/* Spectrum */
var sy=py+ph+40;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('SPIKE RATE SPECTRUM',px,sy-5);
drawGrid(ctx,px,sy,pw,H-sy-30,3,8);
/* Simplified spectrum: beta peak if DBS off */
ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;
ctx.beginPath();
for(var f=0;f<=60;f+=1){
  var power=0;
  if(d.amp<1)power+=5*Math.exp(-(f-20)*(f-20)/8); /* beta 20Hz */
  power+=0.3+rndn()*0.1;
  var x=px+f/60*pw;
  var y=sy+(H-sy-30)*(1-Math.min(power/6,1));
  if(f===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.fillStyle='#ffb000';ctx.font='10px monospace';
ctx.fillText('β peak 20Hz',px+20/60*pw,sy+15);
/* Info */
var ix=W-260,iy=60;
ctx.fillStyle='rgba(20,8,16,.9)';ctx.fillRect(ix,iy,240,240);
ctx.strokeStyle='#ff4090';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,240);
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('DBS STATE',ix+10,iy+22);
ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('Frequency:',ix+10,iy+48);ctx.fillStyle='#ff4090';ctx.fillText(d.freq+' Hz',ix+180,iy+48);
ctx.fillStyle='#c088a0';ctx.fillText('Amplitude:',ix+10,iy+68);ctx.fillStyle='#00e0ff';ctx.fillText(d.amp+' mA',ix+180,iy+68);
ctx.fillStyle='#c088a0';ctx.fillText('Pulse width:',ix+10,iy+88);ctx.fillStyle='#40ff80';ctx.fillText(d.pulseWidth+' ms',ix+180,iy+88);
ctx.fillStyle='#c088a0';ctx.fillText('V:',ix+10,iy+113);ctx.fillStyle='#ffb000';ctx.fillText(fmt(d.V,2)+' mV',ix+180,iy+113);
ctx.fillStyle='#c088a0';ctx.fillText('Rate:',ix+10,iy+138);
ctx.fillStyle='#ff4090';
var rate=d.spikes.filter(function(s){return s>d.t-1000}).length;
ctx.fillText(rate+' Hz',ix+180,iy+138);
ctx.fillStyle='#c088a0';ctx.fillText('DBS on?',ix+10,iy+163);
ctx.fillStyle=d.amp>1?'#40ff80':'#ff3060';
ctx.fillText(d.amp>1?'YES':'NO',ix+180,iy+163);
ctx.fillStyle='#c088a0';ctx.fillText('β power:',ix+10,iy+188);
ctx.fillStyle=d.amp>1?'#40ff80':'#ff3060';
ctx.fillText(d.amp>1?'suppressed':'elevated',ix+180,iy+188);
ctx.fillStyle='#c088a0';ctx.fillText('Target:',ix+10,iy+213);
ctx.fillStyle='#a060ff';ctx.fillText('STN (Parkinson)',ix+180,iy+213);
setStats('<div>Rate: '+rate+'Hz</div><div>Amp: '+d.amp+'mA</div><div>f: '+d.freq+'Hz</div>');
badge('⚡ DBS · '+d.freq+'Hz '+d.amp+'mA');
SV('sbV',fmt(d.V,1));SV('sbR',rate+'Hz');SV('sbI',d.amp)},

registerModule('cochlear',{title:'Cochlear Implant',icon:'👂',desc:'Greenwood map, frequency-place.',init:function(){this.compute()},
compute:function(){var c=STATE.cochlear;
c.response=[];
for(var x=0;x<=1;x+=0.01){
  var freq=cochlearFreq(x);
  c.response.push({x:x,freq:freq});
}
c.positionFreq=cochlearFreq(c.position);
c.positionX=1-(Math.log10((c.freq/165.4)+0.88))/2.1;
if(c.positionX<0)c.positionX=0;if(c.positionX>1)c.positionX=1},
tick:function(dt){STATE.time+=dt},

registerModule('retina',{title:'Retinal Processing',icon:'👁',desc:'Photoreceptors → ganglion cells.',init:function(){this.reset()},
reset:function(){var r=STATE.retina;
r.photoreceptors=[];
for(var i=0;i<20;i++)r.photoreceptors.push({x:i,response:0});
r.ganglion=[];
for(var j=0;j<10;j++)r.ganglion.push({x:j*2,response:0});
r.t=0},
step:function(dt){var r=STATE.retina;
r.t+=dt;
/* Stimulus: moving grating */
for(var i=0;i<r.photoreceptors.length;i++){
  var grating=0.5+0.5*Math.cos(2*Math.PI*(i/5+r.t*0.3));
  r.photoreceptors[i].response=grating;
}
/* Ganglion: center-surround */
for(var j=0;j<r.ganglion.length;j++){
  var center=r.photoreceptors[Math.min(2*j,r.photoreceptors.length-1)].response;
  var surround=0,count=0;
  for(var k=Math.max(0,2*j-2);k<=Math.min(r.photoreceptors.length-1,2*j+2);k++){
    if(Math.abs(k-2*j)>0) {surround+=r.photoreceptors[k].response;count++}
  }
  surround=count>0?surround/count:0;
  r.ganglion[j].response=center-surround;
}},
tick:function(dt){STATE.time+=dt;var r=STATE.retina;if(!STATE.playing)return;
for(var i=0;i<5;i++)this.step(0.01)},

registerModule('decode',{title:'Bayesian Decoder',icon:'🎯',desc:'Population vector + ML decoding.',init:function(){this.reset()},
reset:function(){var d=STATE.decode;
d.n=20;
d.tuningCurves=[];
for(var i=0;i<d.n;i++){
  var pref=i/d.n*360;
  d.tuningCurves.push({pref:pref,peak:1+Math.random()*0.5});
}

d.target=Math.random()*360;
d.decoded=0;
d.error=0},
step:function(dt){var d=STATE.decode;
/* Response with noise */

registerModule('reservoir',{title:'Reservoir Computing',icon:'🌊',desc:'Echo state network for time series.',init:function(){this.reset()},
reset:function(){var r=STATE.reservoir;
r.n=100;
/* Random reservoir weights */
r.W=[];
for(var i=0;i<r.n;i++){
  r.W.push([]);
  for(var j=0;j<r.n;j++)r.W[i].push(rndn()*0.1);
}
/* Scale for spectral radius */
var scale=0.95/Math.sqrt(r.n*0.1);
for(var i2=0;i2<r.n;i2++)for(var j2=0;j2<r.n;j2++)r.W[i2][j2]*=scale;
r.W_in=new Array(r.n).fill(0);
for(var i3=0;i3<r.n;i3++)r.W_in[i3]=rndn();
r.W_out=new Array(r.n).fill(0);
r.state=new Array(r.n).fill(0);
r.t=0;
r.output=[];
r.error=[];
r.targets=[]},
step:function(dt){var r=STATE.reservoir;
/* Target signal */
var t=r.t;
var target=Math.sin(2*Math.PI*t*0.1)+0.3*Math.sin(2*Math.PI*t*0.3);
r.targets.push(target);
/* Reservoir update: x(t+1) = tanh(W·x + W_in·u) */
var input=target;
var newState=new Array(r.n);
for(var i=0;i<r.n;i++){
  var sum=r.W_in[i]*input;
  for(var j=0;j<r.n;j++)sum+=r.W[i][j]*r.state[j];
  newState[i]=Math.tanh(sum);
}
r.state=newState;
/* Simple readout: average weighted */
var out=0;
for(var i2=0;i2<r.n;i2++)out+=r.W_out[i2]*r.state[i2];
r.output.push(out);
r.error.push(Math.pow(out-target,2));
if(r.output.length>1000){r.output.shift();r.error.shift();r.targets.shift()}
/* Online learning (LMS-like) */
var err=target-out;
for(var i3=0;i3<r.n;i3++)r.W_out[i3]+=0.001*err*r.state[i3];
r.t+=dt},

registerModule('plasticity',{title:'Plasticity Rules',icon:'🔧',desc:'BCM, Oja, homeostasis.',init:function(){this.reset()},
reset:function(){var p=STATE.plasticity;
p.w=0.5;p.theta=0.3;p.rate=10;p.t=0;p.history=[]},
step:function(dt){var p=STATE.plasticity;
/* BCM: Δw = η·φ(r)·r with φ(r) = r(r-θ) */
var pre=Math.max(0,rndn()+p.rate/20);
var post=Math.max(0,rndn()+p.rate/20);
var bcm=pre*post*(post-p.theta);
/* Oja: Δw = η·(x·y - y²·w) */
var oja=p.rate*0.01*(pre*post-post*post*p.w);
/* Homeostatic: sliding threshold */
p.theta=p.theta*0.99+post*post*0.01;
var dw=0.001*bcm+oja*0.5;
p.w=clamp(p.w+dw,0,2);
p.t+=dt;
p.history.push({t:p.t,w:p.w,theta:p.theta,bcm:bcm});
if(p.history.length>500)p.history.shift()},
tick:function(dt){STATE.time+=dt;var p=STATE.plasticity;if(!STATE.playing)return;
for(var i=0;i<3;i++)this.step(dt)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);

ctx.fillStyle='#ff4090';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('PLASTICITY — w='+fmt(p.w,4)+' · θ='+fmt(p.theta,4),30,30);
/* BCM curve */
var px=60,py=80,pw=W*0.4,ph=H*0.4;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('BCM MODIFICATION FUNCTION',px,py-5);
drawAxes(ctx,px,py,pw,ph,'post-synaptic rate r','φ(r)·r');
ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;
ctx.beginPath();
for(var r=0;r<=2;r+=0.02){
  var phi=r*(r-p.theta);
  var x=px+r/2*pw;
  var y=py+ph/2-phi*ph*2;
  if(r===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
/* Zero line */
ctx.strokeStyle='rgba(160,136,160,.3)';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(px,py+ph/2);ctx.lineTo(px+pw,py+ph/2);ctx.stroke();
ctx.setLineDash([]);
/* Theta marker */
var tx=px+p.theta/2*pw;
ctx.strokeStyle='#ff3060';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(tx,py);ctx.lineTo(tx,py+ph);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ff3060';ctx.font='bold 10px monospace';
ctx.fillText('θ='+fmt(p.theta,3),tx+5,py+15);
/* Weight evolution */
var ex=W*0.55,ey=80,ew=W*0.4,eh=H*0.4;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('WEIGHT + THRESHOLD DYNAMICS',ex,ey-5);
drawGrid(ctx,ex,ey,ew,eh,3,5);
ctx.strokeStyle='#40ff80';ctx.lineWidth=2;
ctx.beginPath();
p.history.forEach(function(pt,i){
  var x=ex+i/Math.max(p.history.length,1)*ew;
  var y=ey+eh-pt.w*eh/2;

});
ctx.stroke();
ctx.strokeStyle='#ffb000';
ctx.beginPath();
p.history.forEach(function(pt,i){
  var x=ex+i/Math.max(p.history.length,1)*ew;
  var y=ey+eh-pt.theta*eh/2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
ctx.fillStyle='#40ff80';ctx.font='10px monospace';
ctx.fillText('— w (weight)',ex+ew-150,ey+15);
ctx.fillStyle='#ffb000';
ctx.fillText('— θ (threshold)',ex+ew-150,ey+30);
/* Info */
var ix=W-260,iy=H*0.6;

ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('w:',ix+10,iy+48);ctx.fillStyle='#40ff80';ctx.fillText(fmt(p.w,4),ix+180,iy+48);
ctx.fillStyle='#c088a0';ctx.fillText('θ (BCM):',ix+10,iy+68);ctx.fillStyle='#ffb000';ctx.fillText(fmt(p.theta,4),ix+180,iy+68);
ctx.fillStyle='#c088a0';ctx.fillText('Rules:',ix+10,iy+93);ctx.fillStyle='#00e0ff';ctx.fillText('BCM + Oja',ix+180,iy+93);
ctx.fillStyle='#c088a0';ctx.fillText('Rate:',ix+10,iy+118);ctx.fillStyle='#ff4090';ctx.fillText(p.rate,ix+180,iy+118);
ctx.fillStyle='#c088a0';ctx.fillText('Updates:',ix+10,iy+143);ctx.fillStyle='#00e0ff';ctx.fillText(p.history.length,ix+180,iy+143);
ctx.fillStyle='#c088a0';ctx.fillText('Homeostasis:',ix+10,iy+168);
ctx.fillStyle='#40ff80';ctx.fillText('YES (sliding θ)',ix+180,iy+168);

ctx.fillText(p.w<2?'Bounded':'Saturated',ix+180,iy+218);
setStats('<div>w: '+fmt(p.w,3)+'</div><div>θ: '+fmt(p.theta,3)+'</div><div>Updates: '+p.history.length+'</div>');
badge('🔧 Plasticity · w='+fmt(p.w,3));
SV('sbV',fmt(p.w,3));SV('sbR',fmt(p.theta,3));SV('sbI',p.history.length)},

h+='<div class="ctrl"><div class="lbl"><span>θ</span><span>'+fmt(p.theta,3)+'</span></div><input type="range" min="0.1" max="1" step="0.05" value="'+p.theta+'" oninput="STATE.plasticity.theta=parseFloat(this.value);renderLeftPanel()"></div>';

registerModule('wholebrain',{title:'Whole-Brain Dynamics',icon:'🌐',desc:'Brain regions + connectivity + dynamics.',init:function(){this.reset()},
reset:function(){var w=STATE.wholebrain;
/* Major brain regions */
w.regions=[
  {name:'V1',x:0.5,y:0.75,size:1.0,activity:0.2},
  {name:'V4',x:0.55,y:0.6,size:0.8,activity:0.3},
  {name:'IT',x:0.6,y:0.45,size:0.9,activity:0.4},
  {name:'A1',x:0.35,y:0.55,size:0.8,activity:0.3},
  {name:'S1',x:0.4,y:0.35,size:0.9,activity:0.35},
  {name:'M1',x:0.35,y:0.2,size:0.95,activity:0.4},
  {name:'PFC',x:0.2,y:0.15,size:1.0,activity:0.5},
  {name:'PPC',x:0.5,y:0.25,size:0.85,activity:0.4},
  {name:'Hip',x:0.65,y:0.55,size:0.7,activity:0.35},
  {name:'Amyg',x:0.55,y:0.5,size:0.6,activity:0.3},
  {name:'Thal',x:0.5,y:0.45,size:0.8,activity:0.5},
  {name:'BG',x:0.35,y:0.4,size:0.7,activity:0.4}
];
/* Coupling matrix */
w.coupling=[];
var N=w.regions.length;
for(var i=0;i<N;i++){
  w.coupling.push([]);
  for(var j=0;j<N;j++){
    if(i===j)w.coupling[i].push(0);
    else{
      var dx=w.regions[i].x-w.regions[j].x;
      var dy=w.regions[i].y-w.regions[j].y;
      var d=Math.sqrt(dx*dx+dy*dy);
      w.coupling[i].push(Math.exp(-d*3)*0.3*(0.5+Math.random()));
    }
  }
}
/* State */
w.activity=w.regions.map(function(r){return r.activity});
w.history=[];w.t=0},
step:function(dt){var w=STATE.wholebrain;
var N=w.regions.length;
var dtms=dt*1000;
var newAct=new Array(N);
for(var i=0;i<N;i++){
  var sum=0;
  for(var j=0;j<N;j++)sum+=w.coupling[i][j]*w.activity[j];
  var noise=rndn()*0.05;
  var dA=(-w.activity[i]+Math.tanh(2*sum+0.5)+noise)*dtms/20;
  newAct[i]=clamp(w.activity[i]+dA,0,1);
}
w.activity=newAct;
w.t+=dtms;
w.history.push({t:w.t,activity:newAct.slice()});
if(w.history.length>1000)w.history.shift()},
tick:function(dt){STATE.time+=dt;var w=STATE.wholebrain;if(!STATE.playing)return;
for(var i=0;i<2;i++)this.step(0.02)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);
var w=STATE.wholebrain;
ctx.fillStyle='#ff4090';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('WHOLE BRAIN — '+w.regions.length+' regions · t='+fmt(w.t/1000,2)+'s',30,30);
/* Brain outline */
var cx=W*0.35,cy=H*0.5,scale=Math.min(W,H)*0.5;
ctx.strokeStyle='#c088a0';ctx.lineWidth=2;
ctx.beginPath();
ctx.ellipse(cx,cy,scale*0.55,scale*0.6,0,0,Math.PI*2);
ctx.stroke();
/* Connections (colored by strength) */
var N=w.regions.length;
for(var i=0;i<N;i++){
  for(var j=i+1;j<N;j++){
    var strength=w.coupling[i][j]+w.coupling[j][i];
    if(strength>0.05){
      var r1=w.regions[i],r2=w.regions[j];
      var x1=cx+(r1.x-0.5)*scale;
      var y1=cy+(r1.y-0.5)*scale;
      var x2=cx+(r2.x-0.5)*scale;
      var y2=cy+(r2.y-0.5)*scale;
      ctx.strokeStyle='rgba(255,64,144,'+(strength*0.8)+')';
      ctx.lineWidth=strength*5;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
}
/* Regions colored by activity */
w.regions.forEach(function(r,i){
  var x=cx+(r.x-0.5)*scale;
  var y=cy+(r.y-0.5)*scale;
  var act=w.activity[i];
  var size=r.size*12;
  ctx.fillStyle='hsl('+(240-act*240)+',80%,'+(20+act*40)+'%)';
  ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f0e8f0';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#f0e8f0';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText(r.name,x,y+3);ctx.textAlign='left';
});
/* Activity time series */
var sx=W*0.7,sy=80,sw=W*0.28,sh=H*0.35;
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('ACTIVITY TIME SERIES',sx,sy-5);
drawGrid(ctx,sx,sy,sw,sh,3,5);
var showR=[0,6,10];
showR.forEach(function(ri,idx){
  ctx.strokeStyle=['#00e0ff','#ffb000','#40ff80'][idx];
  ctx.lineWidth=1.5;
  ctx.beginPath();
  w.history.forEach(function(h,i2){
    var x=sx+i2/Math.max(w.history.length,1)*sw;
    var y=sy+sh-h.activity[ri]*sh;
    if(i2===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle=['#00e0ff','#ffb000','#40ff80'][idx];
  ctx.font='10px monospace';
  ctx.fillText(w.regions[ri].name,sx+sw+5,sy+15+idx*15);
});
/* Info */
var ix=W-260,iy=sy+sh+40;
ctx.fillStyle='rgba(20,8,16,.9)';ctx.fillRect(ix,iy,240,200);
ctx.strokeStyle='#ff4090';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,240);
ctx.fillStyle='#ff4090';ctx.font='bold 11px monospace';
ctx.fillText('BRAIN STATE',ix+10,iy+22);
ctx.fillStyle='#c088a0';ctx.font='10px monospace';
ctx.fillText('Regions:',ix+10,iy+48);ctx.fillStyle='#00e0ff';ctx.fillText(w.regions.length,ix+180,iy+48);
ctx.fillStyle='#c088a0';ctx.fillText('Mean activity:',ix+10,iy+68);
var mean=w.activity.reduce(function(a,b){return a+b},0)/w.activity.length;
ctx.fillStyle='#ff4090';ctx.fillText(fmt(mean,4),ix+180,iy+68);
ctx.fillStyle='#c088a0';ctx.fillText('Max activity:',ix+10,iy+88);
ctx.fillStyle='#ffb000';ctx.fillText(fmt(Math.max.apply(null,w.activity),4),ix+180,iy+88);
ctx.fillStyle='#c088a0';ctx.fillText('Samples:',ix+10,iy+113);ctx.fillStyle='#00e0ff';ctx.fillText(w.history.length,ix+180,iy+113);
ctx.fillStyle='#c088a0';ctx.fillText('Dynamics:',ix+10,iy+138);ctx.fillStyle='#a060ff';ctx.fillText('Rate model',ix+180,iy+138);
ctx.fillStyle='#c088a0';ctx.fillText('Coupling:',ix+10,iy+163);ctx.fillStyle='#40ff80';ctx.fillText('Distance-based',ix+180,iy+163);
ctx.fillStyle='#c088a0';ctx.fillText('Noise:',ix+10,iy+188);ctx.fillStyle='#ffb000';ctx.fillText('σ=0.05',ix+180,iy+188);
ctx.fillStyle='#c088a0';ctx.fillText('Scale:',ix+10,iy+213);ctx.fillStyle='#00e0ff';ctx.fillText('Mesoscale',ix+180,iy+213);
setStats('<div>Regions: '+w.regions.length+'</div><div>Mean: '+fmt(mean,3)+'</div><div>t: '+fmt(w.t/1000,2)+'s</div>');
badge('🌐 Whole Brain · '+w.regions.length+' regions');
SV('sbV',fmt(mean,3));SV('sbR',fmt(w.t/1000,2));SV('sbI',w.regions.length)},
controls:function(){var w=STATE.wholebrain;var h='<div class="sec"><h4>Regions</h4><div class="kv">';
w.regions.forEach(function(r,i){
  h+='<div class="row"><span class="k">'+r.name+'</span><span class="v">'+fmt(w.activity[i],3)+'</span></div>';
});
h+='</div></div>';
h+='<button class="btn primary full" onclick="MODULES.wholebrain.reset();toast(\'Reset brain\',\'success\')">↺ Reset</button>';
return h},

  var c=l.type==='error'?'var(--p6)':l.type==='success'?'var(--p5)':'var(--p1)';
  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#050208';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#ff4090';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('NEURO ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');

  toast('NEURO ready — 25 módulos neurociência','success',3000);
});
