  var box=el('div',{style:'max-width:1200px;margin:0 auto'});
  box.innerHTML='<div style="font-family:var(--serif);font-size:1.8rem;color:var(--tx);margin-bottom:20px;letter-spacing:-.3px">Standard Amino Acids</div>'+
    '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px">20 canonical residues · alphabetical</div>';
  var tbl=el('table',{class:'dtable'});
  tbl.innerHTML='<thead><tr><th>Code</th><th>Name</th><th>Class</th><th style="text-align:right">MW</th><th style="text-align:right">pKa COOH</th><th style="text-align:right">pKa NH₃</th><th style="text-align:right">pKa R</th><th style="text-align:right">Hydropathy</th></tr></thead>';
  var tb=el('tbody');
  var sorted=AMINO_ACIDS.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var classColors={
    nonpolar:'am',polar:'cy',acidic:'rd',basic:'vi',aromatic:'pk'
  };
  sorted.forEach(function(a){
    var tr=el('tr');
    tr.innerHTML='<td class="sym">'+a.code3+' / '+a.code1+'</td>'+
      '<td>'+a.name+'</td>'+
      '<td><span class="badge '+(classColors[a.class]||'am')+'">'+a.class+'</span></td>'+
      '<td class="num">'+fmt(a.mw,2)+'</td>'+
      '<td class="num">'+fmt(a.pKa_COOH,2)+'</td>'+
      '<td class="num">'+fmt(a.pKa_NH3,2)+'</td>'+
      '<td class="num">'+(a.pKa_R?fmt(a.pKa_R,2):'—')+'</td>'+
      '<td class="num">'+fmt(a.hydropathy,1)+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  box.appendChild(tbl);
  /* Peptide calculator */
  var pCalc=el('div',{style:'margin-top:30px;padding:20px;background:var(--panel);border:1px solid var(--bd);border-radius:10px'});
  pCalc.innerHTML='<div style="font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--em2);margin-bottom:16px">Peptide Mass Calculator</div>';
  var seqInput=el('input',{type:'text',placeholder:'e.g. ACDEFGHIKL',style:'width:100%;padding:12px;background:#06080d;border:1px solid var(--bd);border-radius:6px;font-family:var(--mono);font-size:14px;color:var(--am);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase'});
  seqInput.value='ACDEFGHIKLMNPQRSTVWY';
  var result=el('div',{style:'font-family:var(--mono);font-size:14px;color:var(--tx);padding:14px;background:#000;border:1px solid var(--bd);border-radius:6px'});
  seqInput.oninput=function(){
    try{
      var r=peptideMass(this.value);
      result.innerHTML='<span style="color:var(--em2);font-size:1.6rem;font-family:var(--serif);font-weight:500">'+fmt(r.mass,3)+' Da</span> <span style="color:var(--tx3);margin-left:12px">'+r.count+' residues</span>';
    }catch(e){result.textContent='error: '+e.message}
  };
  pCalc.appendChild(seqInput);
  pCalc.appendChild(result);
  box.appendChild(pCalc);
  wrap.appendChild(box);
  cont.appendChild(wrap);
  setTimeout(function(){seqInput.oninput()},30);
};

/* ═══════════════════════════════════════════════════════════
   MODULE: Functional Groups
   ═══════════════════════════════════════════════════════════ */
MODULES_RENDER.groups=function(){
  var cont=$('stageContent');
  cont.innerHTML='';
  var wrap=el('div',{style:'position:absolute;inset:0;padding:80px 40px 40px;overflow-y:auto'});
  var box=el('div',{style:'max-width:1100px;margin:0 auto'});
  box.innerHTML='<div style="font-family:var(--serif);font-size:1.8rem;color:var(--tx);margin-bottom:20px;letter-spacing:-.3px">Organic Functional Groups</div>'+
    '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px">nomenclature and properties</div>';
  var grid=el('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px'});
  FUNCTIONAL_GROUPS.forEach(function(g){
    var card=el('div',{style:'background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;transition:var(--t)'});
    card.onmouseover=function(){this.style.borderColor='var(--am)'};
    card.onmouseout=function(){this.style.borderColor='var(--bd)'};
    card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">'+
      '<div style="font-family:var(--serif);font-size:1.3rem;color:var(--am);letter-spacing:-.2px">'+esc(g.name)+'</div>'+
      '<div style="font-family:var(--mono);font-size:14px;color:var(--em2);font-weight:600;padding:2px 8px;background:rgba(16,185,129,.1);border-radius:4px">'+esc(g.formula)+'</div>'+
      '</div>'+
      '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">'+esc(g.class)+'</div>'+
      '<div style="font-family:var(--mono);font-size:11px;color:var(--tx2);line-height:1.6;margin-bottom:10px">'+esc(g.properties)+'</div>'+
      '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);padding-top:8px;border-top:1px solid var(--bd)">'+
      '<div>prefix: <span style="color:var(--am2)">'+esc(g.prefix)+'</span></div>'+
      '<div>suffix: <span style="color:var(--am2)">'+esc(g.suffix)+'</span></div>'+
      '</div>';
    grid.appendChild(card);
  });
  box.appendChild(grid);
  wrap.appendChild(box);
  cont.appendChild(wrap);
};

/* ═══════════════════════════════════════════════════════════
   MODULE: Constants
   ═══════════════════════════════════════════════════════════ */
MODULES_RENDER.constants=function(){
  var cont=$('stageContent');
  cont.innerHTML='';
  var wrap=el('div',{style:'position:absolute;inset:0;padding:80px 40px 40px;overflow-y:auto'});
  var box=el('div',{style:'max-width:900px;margin:0 auto'});
  box.innerHTML='<div style="font-family:var(--serif);font-size:1.8rem;color:var(--tx);margin-bottom:20px;letter-spacing:-.3px">Physical Constants</div>'+
    '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px">SI values · CODATA 2018</div>';
  var tbl=el('table',{class:'dtable'});
  tbl.innerHTML='<thead><tr><th>Constant</th><th style="text-align:right">Value</th><th>Units</th></tr></thead>';
  var tb=el('tbody');
  GAS_CONSTANTS.forEach(function(c){
    var tr=el('tr');
    tr.innerHTML='<td>'+esc(c.name)+'</td><td class="num">'+esc(c.value)+'</td><td>'+esc(c.units)+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  box.appendChild(tbl);

  cont.appendChild(wrap);
};

/* ═══════════════════════════════════════════════════════════
   MODULE: Spectral Lines
   ═══════════════════════════════════════════════════════════ */
MODULES_RENDER.spectral=function(){
  var cont=$('stageContent');
  cont.innerHTML='';
  var wrap=el('div',{style:'absolute;inset:0;padding:80px 40px 40px;overflow-y:auto'});
  wrap.style.cssText='position:absolute;inset:0;padding:80px 40px 40px;overflow-y:auto';
  var box=el('div',{style:'max-width:1100px;margin:0 auto'});
  box.innerHTML='<div style="font-family:var(--serif);font-size:1.8rem;color:var(--tx);margin-bottom:20px;letter-spacing:-.3px">Atomic Emission Lines</div>'+
    '<div style="font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px">visible spectrum (400–700 nm)</div>';
  var elements=[
    {n:'Hydrogen (Balmer)',color:'#ec4899',lines:[656.3,486.1,434.0,410.2]},
    {n:'Helium',color:'#f59e0b',lines:[447.1,471.3,492.2,501.6,587.6,667.8,706.5]},
    {n:'Sodium',color:'#fbbf24',lines:[589.0,589.6,568.8,615.4]},
    {n:'Mercury',color:'#06b6d4',lines:[404.7,435.8,546.1,577.0,579.1]},
    {n:'Neon',color:'#ef4444',lines:[585.2,588.2,594.5,614.3,640.2,650.7,659.9,692.9]},
    {n:'Argon',color:'#8b5cf6',lines:[415.9,420.1,425.9,451.1,458.0,462.8,476.5,480.6,488.0,497.2,506.2,514.5,549.6,560.7,565.1,573.9,583.5,588.9,603.2,605.3,610.6,617.3,642.0,675.3,696.5,706.7,714.7,738.4]},
    {n:'Cadmium',color:'#10b981',lines:[467.8,480.0,508.6,643.8]},
    {n:'Zinc',color:'#22d3ee',lines:[468.0,472.2,481.1,636.2]},
    {n:'Potassium',color:'#a855f7',lines:[404.4,404.7,766.5,769.9]},
    {n:'Calcium',color:'#f472b6',lines:[422.7,428.3,429.9,443.5,445.5,558.9,610.3,612.2,616.2,616.6,643.9]}
  ];
  var canvas=el('canvas',{width:1000,height:400});
  canvas.style.cssText='width:100%;background:#000;border:1px solid var(--bd);border-radius:8px;margin-bottom:24px';
  var cctx=canvas.getContext('2d');
  function draw(){
    var W=canvas.width,H=canvas.height;
    cctx.clearRect(0,0,W,H);
    /* Rainbow background */
    var grad=cctx.createLinearGradient(40,0,W-20,0);
    for(var i=0;i<=10;i++){
      var nm=400+(i/10)*300;
      var rgb=wavelengthToRGB(nm);
      grad.addColorStop(i/10,'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')');
    }
    cctx.fillStyle=grad;
    cctx.globalAlpha=0.15;
    cctx.fillRect(40,30,W-60,20);
    cctx.globalAlpha=1;
    /* X-axis */
    cctx.fillStyle='rgba(245,158,11,.5)';
    cctx.font='10px "JetBrains Mono",monospace';
    cctx.textAlign='center';
    for(var nm2=400;nm2<=700;nm2+=50){
      var x=40+(nm2-400)/300*(W-60);
      cctx.fillText(nm2+'',x,25);
      cctx.fillText('nm',x,75);
    }
    /* Lines */
    elements.forEach(function(elm,i){
      var y=100+i*28;
      /* Element name */
      cctx.fillStyle='rgba(232,228,216,.7)';
      cctx.font='11px "JetBrains Mono",monospace';
      cctx.textAlign='right';
      cctx.fillText(elm.n,35,y+4);
      /* Baseline */
      cctx.strokeStyle='rgba(245,158,11,.08)';
      cctx.beginPath();cctx.moveTo(40,y);cctx.lineTo(W-20,y);cctx.stroke();
      /* Lines */
      elm.lines.forEach(function(nm3){
        if(nm3<380||nm3>720)return;
        var x=40+(nm3-400)/300*(W-60);
        cctx.strokeStyle=elm.color;
        cctx.lineWidth=2;
        cctx.beginPath();
        cctx.moveTo(x,y-10);
        cctx.lineTo(x,y+10);
        cctx.stroke();
        /* Glow */
        cctx.shadowColor=elm.color;
        cctx.shadowBlur=8;
        cctx.stroke();
        cctx.shadowBlur=0;
      });
    });
  }
  function wavelengthToRGB(wl){
    var r=0,g=0,b=0;
    if(wl>=380&&wl<440){r=-(wl-440)/60;b=1}
    else if(wl>=440&&wl<490){g=(wl-440)/50;b=1}
    else if(wl>=490&&wl<510){g=1;b=-(wl-510)/20}
    else if(wl>=510&&wl<580){r=(wl-510)/70;g=1}
    else if(wl>=580&&wl<645){r=1;g=-(wl-645)/65}
    else if(wl>=645&&wl<781){r=1}
    return [Math.floor(r*255),Math.floor(g*255),Math.floor(b*255)];
  }
  box.appendChild(canvas);
  wrap.appendChild(box);
  cont.appendChild(wrap);
  setTimeout(draw,30);
};
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   ELEMENTUM · Info panel · Boot · Main loop
   ═══════════════════════════════════════════════════════════ */

/* ══════════ Info panel rendering ══════════ */
function renderInfoPanel(){
  var body=$('infoBody');
  var icon=$('infoIcon');
  var title=$('infoTitle');
  var sub=$('infoSubtitle');
  var z=S.selected;
  if(!z){
    icon.textContent='?';
    icon.style.background='linear-gradient(135deg,var(--tx3),var(--tx3))';
    title.textContent='Select an element';
    sub.textContent='no selection';
    body.innerHTML='<div class="hint">Choose an element from the periodic table to view its properties.</div>';
    return;
  }
  var e=EL_BY_Z[z];
  var cat=CATEGORIES[e.cat];
  icon.textContent=e.sym;
  icon.style.background='linear-gradient(135deg,'+cat.c+','+shadeColor(cat.c,-40)+')';
  title.textContent=e.name;
  sub.textContent='Z='+e.Z+' · '+cat.n;
  var html='';
  html+='<div class="badge-row">';
  html+='<span class="badge am">'+cat.n+'</span>';
  html+='<span class="badge cy">Group '+e.group+'</span>';
  html+='<span class="badge vi">Period '+e.period+'</span>';
  html+='<span class="badge em">'+e.block+' orbital</span>';
  html+='</div>';
  html+='<div class="sec-head">Atomic</div>';
  html+=prop('Symbol',e.sym,'am');
  html+=prop('Name',e.name);
  html+=prop('Atomic number',e.Z,'am');
  html+=prop('Atomic mass',fmt(e.mass,4)+' u');
  html+=prop('Configuration',e.config);
  html+=prop('Block',e.block);
  html+=prop('Group',e.group);
  html+=prop('Period',e.period);
  html+='<div class="sec-head">Physical</div>';
  html+=prop('Melting point',e.mp!=null?fmt(e.mp,2)+' K':'—');
  html+=prop('Melting point',e.mp!=null?fmt(e.mp-273.15,1)+' °C':'—');
  html+=prop('Boiling point',e.bp!=null?fmt(e.bp,2)+' K':'—');
  html+=prop('Density',e.dens!=null?e.dens+' g/cm³':'—');
  html+='<div class="sec-head">Chemical</div>';
  html+=prop('Electronegativity',e.en!=null?e.en:'—','em');
  /* Shells */
  var shells=shellsOf(e.Z);
  html+=prop('Shells',shells.join(' · '));
  html+=prop('Valence electrons',valenceElectrons(e),'em');
  html+='<div class="sec-head">Isotopes</div>';
  var isos=ISOTOPES[e.Z];
  if(isos){
    isos.forEach(function(iso){
      var note=iso.radioactive?'☢ radioactive':'';
      html+=prop('¹⁹⁷'.substring(0,1)+'⁰'.substring(0,1)+' isotope',iso.A+' ('+iso.n+'n)',null,'','');
    });
    /* Redo simply */
    html=html.replace(/¹⁹⁷.*?isotope/,'');
    isos.forEach(function(iso){
      var note=iso.radioactive?' ☢':'';
      html+='<div class="prop"><span class="k">Mass '+iso.A+'</span><span class="v">'+(iso.abund>0?iso.abund+'%':'-')+note+'</span></div>';
    });
  } else {
    html+='<div class="hint">No isotope data for this element.</div>';
  }
  body.innerHTML=html;
}
function prop(k,v,cls){
  return '<div class="prop"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v)+'</span></div>';
}
function valenceElectrons(e){
  var group=e.group;
  if(group<=2)return group;
  if(group>=13&&group<=18)return group-10;
  return '—';
}
function shadeColor(hex,pct){
  var c=hex.replace('#','');
  var r=parseInt(c.substr(0,2),16);
  var g=parseInt(c.substr(2,2),16);
  var b=parseInt(c.substr(4,2),16);
  r=clamp(r+Math.round(r*pct/100),0,255);
  g=clamp(g+Math.round(g*pct/100),0,255);
  b=clamp(b+Math.round(b*pct/100),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ══════════ Search ══════════ */
function setupSearch(){
  var input=$('searchInput');
  input.addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();
    if(!q)return;
    var found=ELEMENTS.find(function(row){
      var e=EL_BY_Z[row[0]];
      return e.sym.toLowerCase()===q||e.name.toLowerCase().indexOf(q)===0||String(e.Z)===q;
    });
    if(found)selectElement(found[0]);
  });
}

/* ══════════ Boot sequence ══════════ */
function boot(){
  var stages=[
    {msg:'loading periodic table…',pct:20},
    {msg:'parsing 118 elements…',pct:40},
    {msg:'initializing chemistry engine…',pct:60},
    {msg:'building module renderers…',pct:80},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){ $('boot').style.display='none'; },600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,150);
  }
  setTimeout(next,200);
}

/* ══════════ Main animation loop ══════════ */
var lastT=performance.now();
function loop(now){
  var dt=(now-lastT)/1000;lastT=now;
  S.anim.time+=dt;
  /* Update detail view (Bohr model animates) */
  if(S.module==='detail'&&S.selected){
    S.ctx.clearRect(0,0,S.W,S.H);
    drawBohrModel(EL_BY_Z[S.selected]);
    /* Info overlay for detail */
    renderDetailOverlay();
  }
  requestAnimationFrame(loop);
}
function renderDetailOverlay(){
  var ctx=S.ctx;
  var e=EL_BY_Z[S.selected];
  /* Right side: element details */
  var x=S.W-340;
  var y=60;
  ctx.fillStyle='#fbbf24';
  ctx.font='bold 20px "JetBrains Mono",monospace';
  ctx.textAlign='right';
  ctx.fillText('Z='+e.Z, x+300, y);
  ctx.textAlign='left';
  ctx.font='bold 56px "Spectral",Georgia,serif';
  ctx.fillStyle='#e8e4d8';
  ctx.fillText(e.sym, x, y+80);
  ctx.font='14px "JetBrains Mono",monospace';
  ctx.fillStyle='#9ca8bf';
  ctx.fillText(e.name, x+100, y+70);
  ctx.font='11px "JetBrains Mono",monospace';
  ctx.fillStyle='#5a6478';
  ctx.fillText('atomic mass '+fmt(e.mass,4)+' u', x+100, y+90);
  /* Details rows */
  var rows=[
    ['Group',e.group],
    ['Period',e.period],
    ['Block',e.block],
    ['Category',CATEGORIES[e.cat].n],
    ['Melting',e.mp!=null?fmt(e.mp,2)+' K':'—'],
    ['Boiling',e.bp!=null?fmt(e.bp,2)+' K':'—'],
    ['Density',e.dens!=null?e.dens+' g/cm³':'—'],
    ['Electroneg',e.en!=null?e.en:'—'],
    ['Config',e.config]
  ];
  var ry=y+140;
  rows.forEach(function(r,i){
    var yy=ry+i*24;
    ctx.fillStyle='#5a6478';
    ctx.font='10px "JetBrains Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText(r[0].toUpperCase(), x, yy);
    ctx.fillStyle='#e8e4d8';
    ctx.font='13px "JetBrains Mono",monospace';
    ctx.textAlign='right';
    ctx.fillText(String(r[1]), x+300, yy);
  });
  ctx.textAlign='left';
}

/* ══════════ Init ══════════ */
function init(){
  initCanvas();
  buildNav();
  setupSearch();
  renderModule();
  renderInfoPanel();
  switchModule('periodic');
  boot();
  requestAnimationFrame(loop);
  /* Keyboard */
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();$('searchInput').focus()}
    if(e.key==='Escape'){$('searchInput').blur();$('searchInput').value=''}
  });
  /* Periodic table tile hover tooltip */
  console.log('%c ELEMENTUM ','background:linear-gradient(90deg,#fbbf24,#10b981,#8b5cf6);color:#0a0d14;padding:10px 22px;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:6px');
  console.log('Chemistry Laboratory Workstation · 22 modules · 118 elements · offline');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
