<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#06070d">
<title>LAUNCH STUDIO v2.0 · Banking Edition</title>
<style>
/* ================================================================
   DESIGN SYSTEM v2.0 — Futuristic Banking UI
   ================================================================ */
:root{
  /* Cores base */
  --void:#030409;
  --bg:#06070d;
  --panel:#0b0e18;
  --panel2:#101422;
  --elevated:#161b2e;
  --input:#0d1120;
  --hover:#1a2038;

  /* Vidro */
  --glass:rgba(16,20,34,.65);
  --glass-b:rgba(130,150,220,.10);
  --glass-hi:rgba(130,150,220,.20);

  /* Texto */
  --t1:#eef1f8;
  --t2:#9aa6c8;
  --t3:#5c6a8e;
  --t4:#38425e;

  /* Acentos */
  --acc:#6c8cff;
  --acc2:#a855f7;
  --acc3:#22d3ee;
  --acc-hi:#8aa4ff;
  --acc-dim:rgba(108,140,255,.14);
  --acc-glow:rgba(108,140,255,.35);
  --acc-glow2:rgba(168,85,247,.28);

  /* Semânticas */
  --ok:#34d399;
  --ok-dim:rgba(52,211,153,.14);
  --warn:#fbbf24;
  --warn-dim:rgba(251,191,36,.14);
  --danger:#f87171;
  --danger-dim:rgba(248,113,113,.14);
  --info:#60a5fa;
  --info-dim:rgba(96,165,250,.14);
  --amazon:#ff9900;
  --amazon-dim:rgba(255,153,0,.14);
  --pix:#32bcad;
  --swift:#1e6fba;
  --stripe:#635bff;
  --paypal:#003087;

  /* Espaço */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;--sp7:48px;--sp8:64px;

  /* Tipo */
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  --disp:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --xs:11px;--sm:13px;--base:15px;--lg:18px;--xl:24px;--2xl:32px;--3xl:44px;

  /* Raios */
  --r1:6px;--r2:10px;--r3:16px;--r4:24px;--rfull:9999px;

  /* Sombras */
  --sh1:0 1px 3px rgba(0,0,0,.5);
  --sh2:0 8px 32px rgba(0,0,0,.55);
  --sh3:0 20px 60px rgba(0,0,0,.65);
  --sh-glow:0 0 32px var(--acc-glow);
  --sh-glow2:0 0 48px var(--acc-glow2);

  /* Transições */
  --tf:120ms cubic-bezier(.4,0,.2,1);
  --tb:220ms cubic-bezier(.4,0,.2,1);
  --ts:400ms cubic-bezier(.4,0,.2,1);
  --tbounce:500ms cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);font-size:var(--base);line-height:1.6;
  color:var(--t1);background:var(--void);min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
ul,ol{list-style:none}

/* ================================================================
   FUNDO ANIMADO — Aurora + Grid + Partículas
   ================================================================ */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-grid{
  position:absolute;inset:-20%;
  background-image:
    linear-gradient(rgba(108,140,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(108,140,255,.035) 1px,transparent 1px);
  background-size:56px 56px;
  transform:perspective(800px) rotateX(15deg);
  animation:gridPulse 12s ease-in-out infinite;
}
@keyframes gridPulse{0%,100%{opacity:.6}50%{opacity:1}}
.bg-aurora{position:absolute;inset:0;overflow:hidden;filter:blur(90px);opacity:.55}
.aurora-blob{
  position:absolute;border-radius:50%;
  will-change:transform,opacity;
}
.aurora-blob.b1{
  width:560px;height:560px;top:-15%;left:-10%;
  background:radial-gradient(circle,var(--acc) 0%,transparent 70%);
  animation:float1 22s ease-in-out infinite;
}
.aurora-blob.b2{
  width:480px;height:480px;top:30%;right:-12%;
  background:radial-gradient(circle,var(--acc2) 0%,transparent 70%);
  animation:float2 26s ease-in-out infinite;
}
.aurora-blob.b3{
  width:420px;height:420px;bottom:-15%;left:25%;
  background:radial-gradient(circle,var(--acc3) 0%,transparent 70%);
  animation:float3 30s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(180px,120px) scale(1.15)}66%{transform:translate(-80px,220px) scale(.95)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-220px,180px) scale(1.2)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,-160px) scale(1.1)}}
.bg-particles{position:absolute;inset:0}
.particle{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--acc);opacity:.25;
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:.5}
  90%{opacity:.5}
  100%{transform:translateY(-100vh);opacity:0}
}
.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 40%,transparent 30%,var(--void) 100%);
}

/* Foco acessível */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.skip-link{position:absolute;top:-100px;left:16px;background:var(--acc);color:#fff;padding:8px 16px;border-radius:var(--r1);z-index:9999;font-weight:600}
.skip-link:focus{top:16px}

/* ================================================================
   LAYOUT
   ================================================================ */
.app-shell{display:flex;min-height:100vh;position:relative;z-index:1}

.sidebar{
  width:264px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-right:1px solid var(--glass-b);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  overflow-y:auto;z-index:100;transition:transform var(--tb);
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--t4);border-radius:3px}
.sidebar::-webkit-scrollbar-thumb:hover{background:var(--t3)}

.brand{padding:var(--sp5) var(--sp5) var(--sp4);border-bottom:1px solid var(--glass-b)}
.brand-name{
  font-family:var(--disp);font-size:var(--lg);font-weight:900;letter-spacing:-.01em;
  background:linear-gradient(135deg,var(--acc),var(--acc2),var(--acc3));
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:brandShimmer 6s ease infinite;
}
@keyframes brandShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand-sub{font-size:var(--xs);color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.brand-badge{
  display:inline-flex;align-items:center;gap:4px;margin-top:8px;
  padding:3px 9px;border-radius:var(--rfull);
  background:var(--amazon-dim);color:var(--amazon);
  font-size:9px;font-weight:700;letter-spacing:.08em;
  border:1px solid rgba(255,153,0,.3);
}
.brand-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--amazon);animation:pulseDot 1.8s ease infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

.nav-section{padding:var(--sp3) 0}
.nav-label{padding:var(--sp2) var(--sp5);font-size:10px;font-weight:700;color:var(--t4);letter-spacing:.12em;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:var(--sp3);padding:var(--sp2) var(--sp5);
  color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;
  font-size:var(--sm);border-left:2px solid transparent;transition:var(--tf);position:relative;
}
.nav-item:hover{background:var(--hover);color:var(--t1);padding-left:calc(var(--sp5) + 4px)}
.nav-item.active{background:var(--acc-dim);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.nav-item.active::after{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--acc);border-radius:3px 0 0 3px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.75}
.nav-item.active svg{opacity:1}
.nav-item .badge-mini{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:var(--rfull);background:var(--acc-dim);color:var(--acc)}

.main-content{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:var(--sp4);
  padding:var(--sp3) var(--sp6);
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--glass-b);
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-family:var(--disp);font-size:var(--lg);font-weight:800;letter-spacing:.02em}
.topbar-actions{margin-left:auto;display:flex;gap:var(--sp2);align-items:center}

.view{padding:var(--sp6);display:none;animation:viewIn var(--tb)}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================================================================
   COMPONENTES
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp2);
  padding:var(--sp2) var(--sp4);border-radius:var(--r2);border:1px solid transparent;
  font-size:var(--sm);font-weight:600;cursor:pointer;transition:var(--tf);white-space:nowrap;
  position:relative;overflow:hidden;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  transform:translateX(-100%);transition:transform .5s;
}
.btn:hover:not(:disabled)::before{transform:translateX(100%)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 20px var(--acc-glow)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 32px var(--acc-glow)}
.btn-secondary{background:var(--elevated);color:var(--t1);border-color:var(--glass-b)}
.btn-secondary:hover:not(:disabled){background:var(--hover);border-color:var(--acc)}
.btn-ghost{background:transparent;color:var(--t2)}
.btn-ghost:hover:not(:disabled){background:var(--hover);color:var(--t1)}
.btn-danger{background:var(--danger-dim);color:var(--danger);border-color:rgba(248,113,113,.3)}
.btn-danger:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-amazon{background:linear-gradient(135deg,var(--amazon),#ffb84d);color:#1a1000;font-weight:700}
.btn-amazon:hover:not(:disabled){box-shadow:0 8px 28px rgba(255,153,0,.4);transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:var(--xs)}
.btn-lg{padding:14px 28px;font-size:var(--base)}

.card{
  background:var(--glass);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-b);border-radius:var(--r3);
  padding:var(--sp5);transition:var(--tb);position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-hi),transparent);
}
.card:hover{border-color:var(--glass-hi);transform:translateY(-2px);box-shadow:var(--sh2)}
.card-title{font-family:var(--disp);font-size:var(--sm);font-weight:700;letter-spacing:.04em;margin-bottom:var(--sp2)}
.card-sub{font-size:var(--sm);color:var(--t2)}

.grid{display:grid;gap:var(--sp4)}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.stat-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-b);border-radius:var(--r3);padding:var(--sp4);transition:var(--tb)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--sh-glow)}
.stat-label{font-size:var(--xs);color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat-value{font-family:var(--disp);font-size:var(--2xl);font-weight:900;margin-top:var(--sp1);letter-spacing:-.02em}
.stat-value.accent{background:linear-gradient(135deg,var(--acc),var(--acc3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.success{color:var(--ok)}
.stat-value.warning{color:var(--warn)}
.stat-value.danger{color:var(--danger)}
.stat-value.amazon{color:var(--amazon)}
.stat-sub{font-size:var(--xs);color:var(--t3);margin-top:4px}

/* Forms */
.form-group{margin-bottom:var(--sp4)}
.form-label{display:block;font-size:var(--sm);font-weight:600;margin-bottom:var(--sp2);color:var(--t2)}
.form-label .req{color:var(--danger);margin-left:2px}
.form-input,.form-select,.form-textarea{
  width:100%;padding:var(--sp3);background:var(--input);
  border:1px solid var(--glass-b);border-radius:var(--r2);
  color:var(--t1);font-size:var(--sm);transition:var(--tf);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim);background:var(--bg);
}
.form-input.err,.form-textarea.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-dim)}
.form-textarea{min-height:100px;resize:vertical;font-family:var(--sans)}
.form-error{font-size:var(--xs);color:var(--danger);margin-top:var(--sp1);display:none}
.form-error.show{display:block}
.form-hint{font-size:var(--xs);color:var(--t3);margin-top:var(--sp1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp4)}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--rfull);font-size:var(--xs);font-weight:700;letter-spacing:.03em}
.badge-draft{background:var(--t4);color:var(--t2)}
.badge-review{background:var(--warn-dim);color:var(--warn)}
.badge-published{background:var(--ok-dim);color:var(--ok)}
.badge-archived{background:var(--danger-dim);color:var(--danger)}
.badge-demo{background:var(--info-dim);color:var(--info)}
.badge-amazon{background:var(--amazon-dim);color:var(--amazon)}
.badge-pix{background:rgba(50,188,173,.14);color:var(--pix)}
.badge-swift{background:rgba(30,111,186,.14);color:#4a9fe0}
.badge-ok{background:var(--ok-dim);color:var(--ok)}
.badge-warn{background:var(--warn-dim);color:var(--warn)}
.badge-danger{background:var(--danger-dim);color:var(--danger)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(3,4,9,.88);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:var(--sp4);animation:fadeIn var(--tb)}
.modal-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--glass-hi);border-radius:var(--r4);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh3);animation:modalIn var(--tbounce)}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--sp4) var(--sp5);border-bottom:1px solid var(--glass-b)}
.modal-title{font-family:var(--disp);font-size:var(--lg);font-weight:800}
.modal-body{padding:var(--sp5)}
.modal-footer{display:flex;gap:var(--sp2);justify-content:flex-end;padding:var(--sp4) var(--sp5);border-top:1px solid var(--glass-b)}

/* Toast */
.toast-container{position:fixed;bottom:var(--sp5);right:var(--sp5);z-index:2000;display:flex;flex-direction:column;gap:var(--sp2);max-width:380px}
.toast{background:var(--elevated);border:1px solid var(--glass-b);border-left:3px solid var(--acc);border-radius:var(--r2);padding:var(--sp3) var(--sp4);font-size:var(--sm);box-shadow:var(--sh2);animation:toastIn .3s var(--tbounce);backdrop-filter:blur(12px)}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warn)}
.toast.amazon{border-left-color:var(--amazon)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.95)}to{opacity:1;transform:none}}

/* Empty state */
.empty-state{text-align:center;padding:var(--sp8) var(--sp4);color:var(--t3)}
.empty-state svg{width:56px;height:56px;margin:0 auto var(--sp4);opacity:.35}
.empty-title{font-size:var(--lg);font-weight:700;color:var(--t2)}
.empty-desc{font-size:var(--sm);margin-top:var(--sp2);max-width:440px;margin-left:auto;margin-right:auto}

/* Progress */
.progress{height:6px;background:var(--input);border-radius:var(--rfull);overflow:hidden;margin:var(--sp2) 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3));background-size:200% 100%;transition:width var(--ts);animation:progressShimmer 3s linear infinite}
@keyframes progressShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}

/* Tabs */
.tabs{display:flex;gap:var(--sp1);border-bottom:1px solid var(--glass-b);margin-bottom:var(--sp5);overflow-x:auto;padding-bottom:2px}
.tab{padding:var(--sp2) var(--sp4);border:none;background:none;color:var(--t2);cursor:pointer;font-size:var(--sm);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:var(--tf)}
.tab:hover{color:var(--t1)}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}

/* Table */
.table{width:100%;border-collapse:collapse;font-size:var(--sm)}
.table th{text-align:left;padding:var(--sp3);font-size:var(--xs);font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--glass-b)}
.table td{padding:var(--sp3);border-bottom:1px solid rgba(130,150,220,.06)}
.table tr:hover td{background:var(--hover)}

/* Code */
.code{background:var(--void);border:1px solid var(--glass-b);border-radius:var(--r2);padding:var(--sp4);font-family:var(--mono);font-size:var(--xs);overflow-x:auto;white-space:pre;line-height:1.7;color:var(--t2)}

/* Status dot */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulseDot 2s ease infinite}
.status-dot.off{background:var(--t4)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.status-dot.err{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* Provider card */
.prov-card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-b);border-radius:var(--r3);padding:var(--sp4);transition:var(--tb);cursor:pointer;position:relative;overflow:hidden}
.prov-card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:var(--sh2)}
.prov-card.active{border-color:var(--ok);background:var(--ok-dim)}
.prov-logo{width:44px;height:44px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:18px;margin-bottom:var(--sp3)}
.prov-name{font-weight:700;font-size:var(--sm);margin-bottom:2px}
.prov-type{font-size:var(--xs);color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.prov-meta{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp3);padding-top:var(--sp3);border-top:1px solid var(--glass-b);font-size:var(--xs)}

/* Responsive */
.mobile-toggle{display:none;background:none;border:none;color:var(--t1);cursor:pointer;padding:var(--sp2)}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none}
.sidebar-backdrop.open{display:block}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--sh3);width:280px}
  .sidebar.open{transform:none}
  .mobile-toggle{display:flex}
  .topbar{padding:var(--sp3) var(--sp4)}
  .view{padding:var(--sp4)}
  .toast-container{left:var(--sp4);right:var(--sp4);bottom:var(--sp4);max-width:none}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media print{.sidebar,.topbar,.toast-container,.btn,.bg-layer{display:none !important}body{background:#fff;color:#000}}
</style>
</head>
<body>

<!-- Fundo animado -->
<div class="bg-layer" aria-hidden="true">
  <div class="bg-aurora">
    <div class="aurora-blob b1"></div>
    <div class="aurora-blob b2"></div>

/* ---------- Transaction Simulator ---------- */
const TxSimulator={
  simulate(amount,currency,method,from,to){
    const id='TX-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    const feePct={pix:0,stripe:0.029,paypal:0.034,mercadopago:0.0399,adyen:0.025,amazon:0.029,swift:0.015}[method]||0.03;
    const feeFixed={pix:0,stripe:0.30,paypal:0.49,mercadopago:0.10,adyen:0.25,amazon:0.30,swift:15}[method]||0;
    const fee=amount*feePct+feeFixed;
    const net=amount-fee;
    return{
      id:id,amount:amount,currency:currency,method:method,
      from:from||'Cliente',to:to||'Vendedor',fee:fee,net:net,
      status:'simulated-completed',isDemo:true,
      createdAt:new Date().toISOString(),
      note:'Transação simulada. Nenhum valor real foi movimentado.'
    };
  },
  runBatch(n){
    const methods=['pix','stripe','paypal','mercadopago','adyen','amazon'];
    const currencies=['BRL','USD','EUR'];
    const out=[];
    for(let i=0;i<n;i++){
      const m=methods[Math.floor(Math.random()*methods.length)];
      const c=currencies[Math.floor(Math.random()*currencies.length)];
      const a=Math.round((Math.random()*500+10)*100)/100;
      out.push(this.simulate(a,c,m,'Cliente '+i,'Vendedor Demo'));
    }
    return out;
  }
};

      total:p.length,drafts:p.filter(x=>x.status==='draft').length,

      demoOrders:S.orders.filter(o=>o.isDemo).length,

};

/* ---------- Local Assistant ---------- */
const Assistant={
  analyze(p){
    const r=ProductService.readiness(p);const issues=[];const sug=[];
    if(!p.title||p.title.length<10){issues.push('Título curto');sug.push('Expanda o título para 30+ caracteres com o benefício principal.')}
    if(!p.description||p.description.length<80){issues.push('Descrição insuficiente');sug.push('Adicione problema, solução, público-alvo e diferencial.')}
    if((p.tags||[]).length<3){issues.push('Poucas tags');sug.push('Adicione 5–8 tags cobrindo tema, formato e público.')}
    if(!p.price||Number(p.price)<=0){issues.push('Preço não definido');sug.push('Defina preço entre R$ 9,90 e R$ 299,90.')}
    if(!p.coverUrl&&!p.coverEmoji){issues.push('Sem capa');sug.push('Adicione URL de imagem ou emoji representativo.')}
    return{readiness:r,issues:issues,suggestions:sug,summary:r.score>=70?'Produto com boa base ('+r.score+'/100). Faltam '+r.missing.length+' ajustes.':'Produto precisa de trabalho ('+r.score+'/100). '+r.missing.length+' campos críticos faltando.'};
  },
  genDesc(p){
    return['**'+p.title+'**','','Um '+(p.type||'produto digital')+' prático para quem trabalha com '+(p.category||'geral')+'.','','**O que você recebe:**','• Arquivo completo e pronto','• Guia de aplicação passo a passo','• Atualizações da versão '+(p.version||'1.0.0'),'','**Para quem é:**','Profissionais e criadores que precisam de resultados rápidos.','','**Diferencial:**','Conteúdo estruturado, testado e com licença clara.'].join('\n');
  },
  genTags(p){return[p.type,p.category,'digital','download','template','produtividade','criador','prático'].filter(Boolean).slice(0,8).map(t=>String(t).toLowerCase().replace(/\s+/g,'-'))},
  checklist(p){
    return[
      {step:'Título otimizado',done:(p.title||'').length>=20},
      {step:'Descrição 300+ chars',done:(p.description||'').length>=300},
      {step:'Preço definido',done:Number(p.price)>0},
      {step:'5+ tags',done:(p.tags||[]).length>=5},
      {step:'Capa visual',done:!!(p.coverUrl||p.coverEmoji)},
      {step:'Licença clara',done:!!p.license},
      {step:'Versão semântica',done:/^\d+\.\d+\.\d+$/.test(p.version||'')},
      {step:'Categoria específica',done:p.category!=='geral'}
    ];
  }
};

function buildNav(){
  const c=$('#nav-container');if(!c)return;c.innerHTML='';
  NAV.forEach(sec=>{
    const s=el('div',{class:'nav-section'});
    s.appendChild(el('div',{class:'nav-label',text:sec.sec}));
    sec.items.forEach(it=>{
      const b=el('button',{class:'nav-item'+(S._currentView===it.id?' active':''),attrs:{'data-nav':it.id}});
      b.innerHTML='<span style="width:18px;text-align:center">'+it.icon+'</span><span>'+it.label+'</span>';
      b.onclick=()=>navigate(it.id);
      s.appendChild(b);
    });
    c.appendChild(s);
  });
}

function navigate(view){
  S._currentView=view;
  const titles={dashboard:'Dashboard',banking:'Banking Center',api_center:'API Center',tx_sim:'Simulador de Transações',currency:'Conversor Multi-Moeda',studio:'Estúdio de criação',products:'Meus produtos',marketplace:'Marketplace',cart:'Carrinho',orders:'Pedidos',assistant:'Assistente de IA',analytics:'Análise',settings:'Configurações',selftest:'Auto-testes',demo:'Demonstração'};
  $('#view-title').textContent=titles[view]||view;
  const c=$('#view-container');
  const fn=V[view];
  c.innerHTML=typeof fn==='function'?fn():'<div class="empty-state"><div class="empty-title">View não encontrada</div></div>';
  buildNav();
  bindView(view);
  window.scrollTo(0,0);
}

function bindView(view){
  const c=$('#view-container');
  $$('[data-nav]',document).forEach(b=>b.onclick=()=>navigate(b.dataset.nav));

  if(view==='studio'){
    const f=$('#product-form');
    if(f){
      const d=$('#p-description'),cnt=$('#desc-count');
      d.addEventListener('input',()=>{cnt.textContent=d.value.length});
      f.addEventListener('submit',submitProduct);
      $('#btn-ai-assist').onclick=()=>aiSuggest();
    }
  }

  if(view==='products'){
    $('#filter-search').addEventListener('input',debounce(e=>{S.settings._search=e.target.value;navigate('products')},220));
    $('#filter-cat').onchange=e=>{S.settings._filterCat=e.target.value;navigate('products')};
    $('#filter-status').onchange=e=>{S.settings._filterStatus=e.target.value;navigate('products')};
    $('#filter-sort').onchange=e=>{S.settings._sort=e.target.value;navigate('products')};
    $$('[data-action]',c).forEach(b=>{
      b.onclick=()=>{
        const id=b.dataset.id,act=b.dataset.action;
        if(act==='edit'){const p=S.product(id);if(p)openEdit(p)}
        else if(act==='preview'){previewProduct(id)}
        else if(act==='delete'){confirmDel(id)}
      };
    });
  }

  if(view==='marketplace'){
    $$('[data-action="add-cart"]',c).forEach(b=>b.onclick=()=>{if(CartService.add(b.dataset.id)){toast('Adicionado ao carrinho','success')}});
  }

  if(view==='cart'){
    $$('[data-cart-qty]',c).forEach(i=>i.onchange=()=>{CartService.setQty(i.dataset.cartQty,i.value);navigate('cart')});
    $$('[data-action="remove-cart"]',c).forEach(b=>b.onclick=()=>{CartService.rm(b.dataset.id);navigate('cart')});
    const ck=$('#btn-checkout');if(ck)ck.onclick=checkout;
  }

  if(view==='orders'){
    const b=$('#btn-export-csv');
    if(b)b.onclick=()=>{download(OrderService.csv(),'orders.csv','text/csv');toast('CSV exportado','success')};
  }

  if(view==='assistant'){
    const b=$('#btn-ai-analyze');if(b)b.onclick=runAssistant;
  }

  if(view==='banking'){
    $$('[data-prov]',c).forEach(p=>{
      p.onclick=()=>{const id=p.dataset.prov;const pr=BankingService.get(id);openModal(pr.name,'<p class="card-sub" style="margin-bottom:var(--sp4)">'+esc(pr.desc)+'</p><div class="code" style="font-size:10px">'+JSON.stringify({tipo:pr.type,moedas:pr.currencies,regioes:pr.regions,taxa:pr.fee},null,2)+'</div>','<button class="btn btn-ghost" data-close>Fechar</button><button class="btn btn-amazon" onclick="closeModal();navigate(\'api_center\')">Configurar</button>')};
    });
    $$('#bank-tabs .tab',c).forEach(t=>t.onclick=()=>{
      $$('#bank-tabs .tab',c).forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const reg=t.dataset.region;
      const list=reg==='all'?BankingService.providers:BankingService.byRegion(reg);
      const grid=$('#prov-grid');
      grid.innerHTML=list.map(p=>{
        const cfg=S.integrations[p.id]||{};
        const st=cfg.status||'not-configured';
        const stMap={'configured':['on','Configurado'],'incomplete':['warn','Incompleto'],'not-configured':['off','Não configurado']};
        const [dot,label]=stMap[st]||stMap['not-configured'];
        return '<div class="prov-card" data-prov="'+p.id+'"><div class="prov-logo" style="background:'+p.color+'22;color:'+p.color+'">'+p.letter+'</div><div class="prov-name">'+esc(p.name)+'</div><div class="prov-type">'+esc(p.type)+'</div><p style="font-size:var(--xs);color:var(--t2);margin-top:var(--sp2);line-height:1.5">'+esc(p.desc)+'</p><div class="prov-meta"><span><span class="status-dot '+dot+'"></span>'+label+'</span><span style="color:var(--t3)">'+esc(p.fee)+'</span></div></div>';
      }).join('');
      $$('[data-prov]',grid).forEach(p=>p.onclick=()=>{const pr=BankingService.get(p.dataset.prov);openModal(pr.name,'<p class="card-sub">'+esc(pr.desc)+'</p>','<button class="btn btn-ghost" data-close>Fechar</button>')});
    });
  }

  if(view==='api_center'){
    $$('[data-api-enable]',c).forEach(cb=>cb.onchange=()=>{
      const id=cb.dataset.apiEnable;if(!S.integrations[id])S.integrations[id]={};
      S.integrations[id].enabled=cb.checked;S._persist();
    });
    $$('[data-api-field]',c).forEach(inp=>inp.onchange=()=>{
      const parts=inp.dataset.apiField.split('.');const id=parts[0],k=parts[1];
      if(!S.integrations[id])S.integrations[id]={};
      S.integrations[id][k]=inp.value;S._persist();
    });
    $$('[data-api-test]',c).forEach(b=>b.onclick=()=>{
      const id=b.dataset.apiTest;
      b.disabled=true;b.textContent='Testando…';
      setTimeout(()=>{
        const r=BankingService.testIntegration(id);
        b.disabled=false;b.textContent='Testar';
        openModal('Resultado do teste',(r.ok?'<div class="badge badge-ok" style="margin-bottom:var(--sp3)">✓ SUCESSO</div>':'<div class="badge badge-danger" style="margin-bottom:var(--sp3)">✗ FALHA</div>')+'<p style="margin-bottom:var(--sp3)">'+esc(r.message)+'</p>'+(r.note?'<div class="form-hint">'+esc(r.note)+'</div>':''),'<button class="btn btn-ghost" data-close>Fechar</button>');
      },600);
    });
  }

  if(view==='tx_sim'){
    const b=$('#btn-sim-tx');
    if(b)b.onclick=()=>{
      const amt=parseFloat($('#tx-amount').value)||0;
      const cur=$('#tx-cur').value;const m=$('#tx-method').value;
      if(amt<=0){toast('Valor deve ser positivo','error');return}
      const tx=TxSimulator.simulate(amt,cur,m,'Cliente Demo','Vendedor Demo');
      S.addTx(tx);
      toast('Transação simulada: '+tx.id,'amazon');
      $('#tx-last').textContent=JSON.stringify(tx,null,2);
      navigate('tx_sim');
    };
    const bb=$('#btn-sim-batch');
    if(bb)bb.onclick=()=>{
      const batch=TxSimulator.runBatch(10);
      batch.forEach(t=>S.addTx(t));
      toast('10 transações simuladas','amazon');
      navigate('tx_sim');
    };
  }

  if(view==='currency'){
    const b=$('#btn-convert');
    if(b)b.onclick=()=>{
      const v=parseFloat($('#cv-amount').value)||0;
      const from=$('#cv-from').value,to=$('#cv-to').value;
      const r=Currency.convert(v,from,to);
      $('#cv-result').textContent=fmtMoney(r,to);
    };
  }

  if(view==='settings'){
    $('#btn-export-data').onclick=()=>{download(JSON.stringify(Storage.exportAll(),null,2),'launch-studio-v2-export.json','application/json');toast('Exportado','success')};
    $('#btn-import-data').onclick=()=>$('#import-file').click();
    $('#import-file').onchange=handleImport;
    $('#btn-reset-all').onclick=()=>{
      openModal('Apagar tudo','<p>Todos os dados serão removidos. Irreversível.</p>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="btn-confirm-reset">Apagar</button>');
      $('#btn-confirm-reset').onclick=()=>{Storage.resetAll();CartService.clear();closeModal();toast('Dados apagados','success');navigate('dashboard')};
    };
  }

  if(view==='demo'){
    $('#btn-load-demo').onclick=loadDemo;
    $('#btn-clear-demo').onclick=()=>{
      openModal('Limpar','<p>Remove todos os dados.</p>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="btn-clear-confirm">Limpar</button>');
      $('#btn-clear-confirm').onclick=()=>{Storage.resetAll();CartService.clear();closeModal();toast('Limpo','success');navigate('dashboard')};
    };
  }

  if(view==='selftest'){
    $('#btn-run-selftest').onclick=runSelfTests;
  }
}

/* ---------- Handlers específicos ---------- */
function submitProduct(e){
  e.preventDefault();
  const data={title:$('#p-title').value,description:$('#p-description').value,type:$('#p-type').value,category:$('#p-category').value,price:$('#p-price').value,currency:$('#p-currency').value,version:$('#p-version').value,tags:$('#p-tags').value,coverUrl:$('#p-cover').value};
  const errs=ProductService.validate(data);
  $$('.form-error').forEach(x=>x.classList.remove('show'));
  $$('.form-input,.form-textarea').forEach(x=>x.classList.remove('err'));
  if(Object.keys(errs).length>0){
    for(const f in errs){
      const e=$('#err-'+f),i=$('#p-'+f);
      if(e){e.textContent=errs[f];e.classList.add('show')}
      if(i)i.classList.add('err');
    }
    toast('Corrija os campos destacados','error');return;
  }
  const p=ProductService.create(data);
  S.addProduct(p);
  toast('Produto salvo como rascunho','success');
  navigate('products');
}

function aiSuggest(){
  const d={title:$('#p-title').value,description:$('#p-description').value,type:$('#p-type').value,category:$('#p-category').value,price:$('#p-price').value,version:$('#p-version').value,tags:$('#p-tags').value};
  if(!d.title){toast('Preencha o título primeiro','warning');return}
  const desc=Assistant.genDesc(d);const tags=Assistant.genTags(d);
  openModal('Sugestões IA Local','<div class="form-group"><label class="form-label">Descrição</label><textarea class="form-textarea" id="ai-desc" style="min-height:200px">'+esc(desc)+'</textarea></div><div class="form-group"><label class="form-label">Tags</label><input class="form-input" id="ai-tags" value="'+esc(tags.join(', '))+'"></div>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="btn-apply-ai">Aplicar</button>');
  $('#btn-apply-ai').onclick=()=>{
    $('#p-description').value=$('#ai-desc').value;
    $('#desc-count').textContent=$('#p-description').value.length;
    $('#p-tags').value=$('#ai-tags').value;
    closeModal();toast('Sugestões aplicadas','success');
  };
}

function runAssistant(){
  const out=$('#assistant-output');
  if(!S.products.length){out.innerHTML='<div class="empty-state"><div class="empty-title">Crie um produto primeiro</div></div>';return}
  out.innerHTML=S.products.slice(0,10).map(p=>{
    const r=ProductService.readiness(p);
    const color=r.level==='excellent'?'var(--ok)':r.level==='good'?'var(--acc)':r.level==='fair'?'var(--warn)':'var(--danger)';
    return '<div class="card" style="margin-bottom:var(--sp3)"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>'+esc(p.title)+'</b><div style="font-size:var(--xs);color:var(--t3);margin-top:2px">'+esc(p.category)+' · '+fmtMoney(p.price,p.currency)+'</div></div><div style="text-align:right"><div style="font-family:var(--disp);font-size:1.6rem;font-weight:900;color:'+color+'">'+r.score+'</div><div style="font-size:10px;color:'+color+'">'+r.level+'</div></div></div>'+r.missing.length>0?'<div style="margin-top:var(--sp3);font-size:var(--xs);color:var(--warn)">Faltando: '+r.missing.map(m=>m.label).join(' · ')+'</div>':''+'</div>';
  }).join('');
}

function openEdit(p){
  S.settings._editId=p.id;
  navigate('studio');
  setTimeout(()=>{
    $('#p-title').value=p.title;$('#p-description').value=p.description;
    $('#p-type').value=p.type;$('#p-category').value=p.category;
    $('#p-price').value=p.price;$('#p-currency').value=p.currency||'BRL';
    $('#p-version').value=p.version;$('#p-tags').value=(p.tags||[]).join(', ');
    $('#p-cover').value=p.coverUrl||'';
    $('#desc-count').textContent=p.description.length;
  },50);
}

function previewProduct(id){
  const p=S.product(id);if(!p)return;
  const r=ProductService.readiness(p);
  openModal(p.title,'<div style="font-size:2rem;margin-bottom:var(--sp3)">'+(p.coverEmoji||'📦')+'</div><div class="badge badge-'+p.status+'" style="margin-bottom:var(--sp3)">'+p.status+'</div><p style="margin-bottom:var(--sp4)">'+esc(p.description)+'</p><div style="display:flex;justify-content:space-between;padding-top:var(--sp3);border-top:1px solid var(--glass-b)"><span style="font-family:var(--disp);font-weight:900;color:var(--acc);font-size:1.4rem">'+fmtMoney(p.price,p.currency)+'</span><span style="color:var(--t3);font-size:var(--xs)">Readiness '+r.score+'/100</span></div>','<button class="btn btn-ghost" data-close>Fechar</button>');
}

function confirmDel(id){
  const p=S.product(id);if(!p)return;
  openModal('Excluir produto','<p>Excluir "<b>'+esc(p.title)+'</b>"? Irreversível.</p>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="btn-confirm-del">Excluir</button>');
  $('#btn-confirm-del').onclick=()=>{S.delProduct(id);closeModal();toast('Excluído','success');navigate('products')};
}

function checkout(){
  const items=CartService.items();if(!items.length)return;
  const total=CartService.total();
  openModal('Finalizar (demo)','<div style="padding:var(--sp3);background:var(--warn-dim);border-radius:var(--r2);margin-bottom:var(--sp4);color:var(--warn);font-size:var(--sm)">⚠ Transação simulada — sem pagamento real</div><p>Total: <strong style="color:var(--acc);font-family:var(--mono)">'+fmtBRL(total)+'</strong></p><p style="font-size:var(--xs);color:var(--t3);margin-top:var(--sp3)">Em produção, este fluxo se conectaria a um gateway real via backend.</p>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="btn-confirm-order">Criar pedido demo</button>');
  $('#btn-confirm-order').onclick=()=>{
    const o=OrderService.createDemo(items,total);
    CartService.clear();closeModal();
    toast('Pedido '+o.id+' criado','success');
    navigate('orders');
  };
}

function handleImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const d=safeParse(ev.target.result);
    try{Storage.importAll(d);toast('Importado com sucesso','success');navigate('dashboard')}
    catch(err){toast('Importação rejeitada: '+err.message,'error',5000)}
  };
  r.readAsText(f);e.target.value='';
}

function loadDemo(){
  openModal('Carregar demo','<p>Adicionar 6 produtos e transações de exemplo?</p>','<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="btn-load-confirm">Carregar</button>');

      {title:'Pack de 50 Templates Notion',description:'Coleção de 50 templates para gestão de projetos, finanças e estudos. Todos editáveis.',type:'template',category:'produtividade',price:39.90,currency:'BRL',tags:'notion, template',coverEmoji:'📋',status:'published',version:'1.4.2',license:'standard'},
      {title:'Curso de Design de Interfaces',description:'Curso em vídeo de 8 horas cobrindo UI/UX, Figma e prototipagem. Inclui certificado.',type:'course',category:'design',price:149.90,currency:'BRL',tags:'design, ui, figma',coverEmoji:'🎨',status:'published',version:'3.0.0',license:'standard'},
      {title:'Kit de Ícones Minimalistas',description:'200 ícones SVG em 4 estilos para interfaces digitais.',type:'artwork',category:'design',price:29.90,currency:'BRL',tags:'icones, svg',coverEmoji:'◆',status:'draft',version:'1.0.0'},
      {title:'E-book de Finanças Pessoais',description:'Guia para organizar orçamento em 30 dias com planilhas.',type:'ebook',category:'negocios',price:34.90,currency:'BRL',tags:'financas, orcamento',coverEmoji:'💰',status:'review',version:'1.2.0'},
      {title:'Banco de Áudios Relaxantes',description:'20 faixas para meditação e foco em WAV e MP3.',type:'audio',category:'saude',price:59.90,currency:'BRL',tags:'audio, meditacao',coverEmoji:'🎵',status:'draft',version:'1.0.0'}

function download(content,name,mime){
  const b=new Blob([content],{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- Self tests ---------- */
function runSelfTests(){
  const out=$('#selftest-output');
  const snap={products:S.products.slice(),orders:S.orders.slice(),tx:S.transactions.slice()};
  const results=[];
  function T(name,fn){try{const r=fn();results.push({n:name,s:r===true?'PASS':(r==='SKIP'?'SKIPPED':'FAIL'),d:r===true?'':String(r)})}catch(e){results.push({n:name,s:'FAIL',d:e.message})}}
  T('uid gera IDs únicos',()=>uid('x')!==uid('x'));
  T('fmtBRL formata',()=>fmtBRL(10.5).indexOf('10,50')>=0);
  T('esc neutraliza HTML',()=>esc('<script>').indexOf('&lt;')>=0);
  T('State tem estrutura',()=>Array.isArray(S.products)&&Array.isArray(S.orders));
  T('Validação rejeita título curto',()=>{const e=ProductService.validate({title:'ab',description:'desc valida aqui',price:10});return e.title?true:'Deveria rejeitar'});
  T('Validação rejeita preço negativo',()=>{const e=ProductService.validate({title:'Título válido',description:'desc valida aqui',price:-5});return e.price?true:'Deveria rejeitar'});
  T('Readiness score varia',()=>{const p=ProductService.readiness({title:'X',description:'',tags:[],price:0});const g=ProductService.readiness({title:'Título completo',description:'x'.repeat(200),tags:['a','b','c'],price:50,category:'tech',coverEmoji:'📦',license:'std',version:'1.0.0'});return g.score>p.score});
  T('Exportação JSON válida',()=>{const d=Storage.exportAll();return d.version===2&&Array.isArray(d.products)});
  T('Importação rejeita inválido',()=>{try{Storage.importAll({foo:'bar'});return 'Deveria falhar'}catch(e){return true}});
  T('CSV gerado com header',()=>OrderService.csv().startsWith('"ID"'));
  T('Assistente gera descrição',()=>Assistant.genDesc({title:'X',type:'ebook',category:'tech'}).length>50);
  T('Assistente gera tags',()=>Array.isArray(Assistant.genTags({type:'ebook',category:'tech'}))&&Assistant.genTags({type:'ebook',category:'tech'}).length>0);
  T('Checklist tem 8 passos',()=>Assistant.checklist({}).length===8);
  T('Banking cataloga 15 provedores',()=>BankingService.providers.length===15);
  T('Currency converte BRL→USD',()=>Currency.convert(100,'BRL','USD')>0);
  T('TxSimulator calcula taxa',()=>{const t=TxSimulator.simulate(100,'BRL','pix');return t.fee===0&&t.net===100});
  T('TxSimulator gera ID único',()=>TxSimulator.simulate(10,'BRL','pix').id!==TxSimulator.simulate(10,'BRL','pix').id);
  T('API Catalog tem 13 entradas',()=>API_CATALOG.length===13);
  T('localStorage disponível',()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return 'SKIP'}});
  T('S.byCategory calcula',()=>{const a=Analytics.compute();return typeof a.byCategory==='object'});

  S.products=snap.products;S.orders=snap.orders;S.transactions=snap.tx;

  const pass=results.filter(r=>r.s==='PASS').length;
  const fail=results.filter(r=>r.s==='FAIL').length;
  const skip=results.filter(r=>r.s==='SKIPPED').length;

  out.innerHTML='<div class="grid grid-3" style="margin-bottom:var(--sp4)">'+
    '<div class="stat-card"><div class="stat-label">PASS</div><div class="stat-value success">'+pass+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">FAIL</div><div class="stat-value danger">'+fail+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">SKIPPED</div><div class="stat-value warning">'+skip+'</div></div>'+
  '</div><div class="card">'+results.map(r=>'<div style="display:flex;justify-content:space-between;padding:var(--sp2) 0;border-bottom:1px solid rgba(130,150,220,.06);font-size:var(--sm)"><span>'+esc(r.n)+'</span><span style="color:'+(r.s==='PASS'?'var(--ok)':r.s==='FAIL'?'var(--danger)':'var(--warn)')+';font-weight:700">'+r.s+'</span></div>'+(r.d?'<div style="font-size:var(--xs);color:var(--t3);padding-bottom:var(--sp2)">'+esc(r.d)+'</div>':'')).join('')+'</div>';
}

/* ================================================================
   9. BOOTSTRAP
   ================================================================ */
function seedParticles(){
  const c=$('#particles');if(!c)return;
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.bottom=(-Math.random()*100)+'px';
    p.style.animationDuration=(15+Math.random()*25)+'s';
    p.style.animationDelay=(-Math.random()*20)+'s';
    p.style.background=Math.random()>0.5?'var(--acc)':'var(--acc2)';
    c.appendChild(p);
  }
}

function init(){
  seedParticles();
  S.load();
  CartService.load();
  buildNav();
  navigate('dashboard');

  $('#mobile-toggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('#sidebar-backdrop').classList.toggle('open')};
  $('#sidebar-backdrop').onclick=()=>{$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('open')};
  $('#btn-export-top').onclick=()=>{download(JSON.stringify(Storage.exportAll(),null,2),'launch-studio-v2-export.json','application/json');toast('Exportado','success')};
  $('#btn-api-center').onclick=()=>navigate('api_center');

  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select'))return;
    if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('open')}
  });

  window.LaunchStudio={version:'2.0.0',State:S,runTests:()=>{navigate('selftest');runSelfTests()}};
  console.log('%cLaunch Studio v2.0 · Banking Edition','color:#6c8cff;font-weight:bold;font-size:14px');
  console.log('Digite LaunchStudio.runTests() para executar auto-testes.');
}

document.addEventListener('DOMContentLoaded',init);
</script>
