document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* Animated boot: logic circuit */
function animateBootCircuit(){
  var bc=$('bootCircuit');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  var t0=performance.now();
  /* Draw a small circuit that evaluates */
  var inputs=[
    {x:0.1,y:0.3,v:true},
    {x:0.1,y:0.5,v:false},
    {x:0.1,y:0.7,v:true}
  ];
  function frame(){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    var t=(performance.now()-t0)/1000;
    bctx.fillStyle='#050710';
    bctx.fillRect(0,0,bc.width,bc.height);
    /* Input nodes */
    inputs.forEach(function(inp,i){
      var px=inp.x*bc.width;
      var py=inp.y*bc.height;
      var col=inp.v?'#40ffa0':'#4a5a9c';
      bctx.fillStyle=col;
      bctx.shadowColor=col;bctx.shadowBlur=15;
      bctx.beginPath();bctx.arc(px,py,15,0,Math.PI*2);bctx.fill();
      bctx.shadowBlur=0;
      bctx.fillStyle='#050710';
      bctx.font='bold 12px monospace';
      bctx.textAlign='center';
      bctx.textBaseline='middle';
      bctx.fillText('I'+i,px,py);
      bctx.textBaseline='alphabetic';
    });
    /* AND gate */
    var g1x=0.5*bc.width,g1y=0.4*bc.height;
    var v1=inputs[0].v&&inputs[1].v;
    bctx.fillStyle=v1?'#40ffa0':'#4a5a9c';
    bctx.shadowColor=bctx.fillStyle;bctx.shadowBlur=v1?15:0;
    bctx.beginPath();
    bctx.moveTo(g1x-50,g1y-30);
    bctx.lineTo(g1x,g1y-30);
    bctx.arc(g1x,g1y,30,-Math.PI/2,Math.PI/2);
    bctx.lineTo(g1x-50,g1y+30);
    bctx.closePath();bctx.fill();
    bctx.shadowBlur=0;
    bctx.strokeStyle='#050710';bctx.lineWidth=2;bctx.stroke();
    bctx.fillStyle='#050710';
    bctx.font='bold 14px monospace';
    bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText('AND',g1x,g1y);
    bctx.textBaseline='alphabetic';
    /* OR gate */
    var g2x=0.5*bc.width,g2y=0.7*bc.height;
    var v2=inputs[1].v||inputs[2].v;
    bctx.fillStyle=v2?'#40ffa0':'#4a5a9c';
    bctx.shadowColor=bctx.fillStyle;bctx.shadowBlur=v2?15:0;
    bctx.beginPath();
    bctx.moveTo(g2x-50,g2y-30);
    bctx.quadraticCurveTo(g2x+20,g2y-30,g2x+50,g2y);
    bctx.quadraticCurveTo(g2x+20,g2y+30,g2x-50,g2y+30);
    bctx.quadraticCurveTo(g2x-20,g2y,g2x-50,g2y-30);
    bctx.fill();
    bctx.shadowBlur=0;
    bctx.strokeStyle='#050710';bctx.lineWidth=2;bctx.stroke();
    bctx.fillStyle='#050710';
    bctx.font='bold 14px monospace';
    bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText('OR',g2x,g2y);
    bctx.textBaseline='alphabetic';
    /* Wires */
    bctx.lineWidth=2;
    /* I0 → AND */
    bctx.strokeStyle=inputs[0].v?'#40ffa0':'#4a5a9c';
    bctx.beginPath();
    bctx.moveTo(inputs[0].x*bc.width+15,inputs[0].y*bc.height);
    bctx.lineTo(g1x-50,inputs[0].y*bc.height);
    bctx.lineTo(g1x-50,g1y-15);
    bctx.stroke();
    /* I1 → AND and I1 → OR */
    bctx.strokeStyle=inputs[1].v?'#40ffa0':'#4a5a9c';
    bctx.beginPath();
    bctx.moveTo(inputs[1].x*bc.width+15,inputs[1].y*bc.height);
    bctx.lineTo(g1x-50,inputs[1].y*bc.height);
    bctx.lineTo(g1x-50,g1y+15);
    bctx.stroke();
    bctx.beginPath();
    bctx.moveTo(inputs[1].x*bc.width+15,inputs[1].y*bc.height);
    bctx.lineTo(g2x-70,inputs[1].y*bc.height);
    bctx.lineTo(g2x-70,g2y-15);
    bctx.lineTo(g2x-50,g2y-15);
    bctx.stroke();
    /* I2 → OR */
    bctx.strokeStyle=inputs[2].v?'#40ffa0':'#4a5a9c';
    bctx.beginPath();
    bctx.moveTo(inputs[2].x*bc.width+15,inputs[2].y*bc.height);
    bctx.lineTo(g2x-50,inputs[2].y*bc.height);
    bctx.lineTo(g2x-50,g2y+15);
    bctx.stroke();
    /* Outputs */
    var o1x=0.85*bc.width;
    var o1y=0.4*bc.height;
    bctx.strokeStyle=v1?'#40ffa0':'#4a5a9c';
    bctx.beginPath();
    bctx.moveTo(g1x+30,g1y);
    bctx.lineTo(o1x-15,o1y);
    bctx.stroke();
    bctx.fillStyle=v1?'#40ffa0':'#4a5a9c';
    bctx.shadowColor=bctx.fillStyle;bctx.shadowBlur=v1?15:0;
    bctx.beginPath();bctx.arc(o1x,o1y,15,0,Math.PI*2);bctx.fill();
    bctx.shadowBlur=0;
    bctx.fillStyle='#050710';
    bctx.font='bold 12px monospace';
    bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText('Q1',o1x,o1y);
    var o2x=0.85*bc.width;
    var o2y=0.7*bc.height;
    bctx.strokeStyle=v2?'#40ffa0':'#4a5a9c';
    bctx.beginPath();
    bctx.moveTo(g2x+50,g2y);
    bctx.lineTo(o2x-15,o2y);
    bctx.stroke();
    bctx.fillStyle=v2?'#40ffa0':'#4a5a9c';
    bctx.shadowColor=bctx.fillStyle;bctx.shadowBlur=v2?15:0;
    bctx.beginPath();bctx.arc(o2x,o2y,15,0,Math.PI*2);bctx.fill();
    bctx.shadowBlur=0;
    bctx.fillStyle='#050710';
    bctx.font='bold 12px monospace';
    bctx.fillText('Q2',o2x,o2y);
    bctx.textBaseline='alphabetic';
    /* Animate inputs slowly */
    if(Math.floor(t)%2===0){
      inputs.forEach(function(inp,i){
        if(Math.random()<0.005)inp.v=!inp.v;
      });
    }
    requestAnimationFrame(frame);
  }
  frame();
}

var BOOT_STEPS=[
  'Loading propositional logic parser...',
  'Compiling CNF conversion (De Morgan, distribution)...',
  'Preparing DPLL with unit propagation...',
  'Loading resolution refutation engine...',
  'Building semantic tableaux tree...',
  'Wiring AND/OR/NAND/XOR gates...',
  'Rendering animated logic circuit...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  animateBootCircuit();
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';

      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('LOGIC ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('LOGIC initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='reasoning';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});
