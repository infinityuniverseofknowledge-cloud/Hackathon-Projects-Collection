<!DOCTYPE html>
<html lang="en" data-theme="logic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LOGIC — Logic & Computation Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#050710;--bg2:#0a0e20;--bg3:#121a34;--bg4:#1c2850;
  --panel:#0a0e20;--panel2:#121a34;--panel3:#1c2850;--panel4:#283a70;
  --bd:#101a3c;--bd2:#1c2858;--bd3:#2c3e8c;
  --tx:#d8e4ff;--tx2:#8898d0;--tx3:#4a5a9c;--mu:#2a3a78;
  --c1:#40c0ff;--c1h:#80d0ff;--c1l:#2090c0;
  --c2:#ff60a0;--c2h:#ff90c0;--c2l:#c03080;
  --c3:#40ffa0;--c3h:#80ffc0;--c3l:#20c080;
  --c4:#ffd040;--c4h:#ffe880;--c4l:#c0a020;
  --c5:#c060ff;--c5h:#d090ff;--c5l:#8030c0;
  --c6:#ff8040;--c6h:#ffa870;--c6l:#c05020;
  --c7:#40ffff;--c7h:#80ffff;--c7l:#20c0c0;
  --ok:#40ffa0;--warn:#ffd040;--err:#ff60a0;--info:#40c0ff;
  --g1:linear-gradient(135deg,#40c0ff,#c060ff);
  --g2:linear-gradient(135deg,#40ffa0,#40c0ff);
  --gHolo:linear-gradient(120deg,#40c0ff,#c060ff,#ff60a0,#ffd040,#40ffa0,#40c0ff);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f4ff;--bg2:#e0e8ff;--bg3:#d0dcf8;--panel:#fff;--panel2:#f0f4ff;--panel3:#e0e8ff;
  --bd:#c0d0e8;--bd2:#a0b8d0;--tx:#0a1030;--tx2:#405078;--tx3:#8090b0;
  --c1:#0060c0;--c2:#c02060;--c3:#008060;--c4:#a08000;--c5:#7030c0;--c6:#c05020;--c7:#008080;
  --g1:linear-gradient(135deg,#0060c0,#7030c0)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101014;--bg3:#18181e;--panel:#101014;--panel2:#18181e;--panel3:#202028;
  --bd:#282830;--bd2:#404048;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#050710;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px;overflow:hidden}
#boot.hidden{opacity:0;pointer-events:none}
#bootCircuit{position:absolute;inset:0;pointer-events:none}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:16px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px;position:relative;z-index:1}
.boot-sub{font-size:.66rem;color:#40c0ff;letter-spacing:10px;margin-bottom:26px;opacity:.75;position:relative;z-index:1}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#121a34;border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative;z-index:1}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40c0ff}
.boot-pct{font-size:.66rem;color:#40c0ff;margin-bottom:14px;position:relative;z-index:1}
.boot-log{font-size:.58rem;color:#4a5a9c;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7;position:relative;z-index:1}
.boot-log .ok{color:#40ffa0}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#050710;box-shadow:0 0 12px rgba(64,192,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#121a34;transition:var(--t1)}
.tb-status .dot.on{background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#020410;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(10,14,32,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c4);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,192,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#050710;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(64,192,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--c4);border-color:var(--c4)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#050710;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c4)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <canvas id="bootCircuit" style="position:absolute;inset:0"></canvas>
  <div class="boot-logo">LOGIC</div>
  <div class="boot-sub">LOGIC &amp; COMPUTATION LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('truth')">LOGIC</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">reasoning</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Vars</span><span class="sb-val c2" id="sbVars">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Clauses</span><span class="sb-val c3" id="sbClauses">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Steps</span><span class="sb-val c4" id="sbSteps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Result</span><span class="sb-val c5" id="sbResult">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Truth Tables</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:.95rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});

/* ================================================================
   PROPOSITIONAL LOGIC CORE
   ================================================================
   Formula AST nodes:
   { type:'var', name:'A' }
   { type:'not', child }
   { type:'and', left, right }
   { type:'or', left, right }
   { type:'imp', left, right }     (implication →)
   { type:'iff', left, right }     (biconditional ↔)
   { type:'xor', left, right }
   ================================================================ */
/* Tokenizer */
function tokenize(str){
  var tokens=[];
  var i=0;
  while(i<str.length){
    var c=str[i];
    if(c===' '||c==='\t'||c==='\n'){i++;continue}
    if(/[A-Za-z]/.test(c)){
      var name='';
      while(i<str.length&&/[A-Za-z0-9_]/.test(str[i])){name+=str[i];i++}
      tokens.push({type:'var',value:name});
      continue;
    }
    if(c==='('){tokens.push({type:'lp'});i++;continue}
    if(c===')'){tokens.push({type:'rp'});i++;continue}
    if(c==='~'||c==='!'||c==='¬'){tokens.push({type:'not'});i++;continue}
    if(c==='&'||c==='∧'||c==='^'){tokens.push({type:'and'});i++;continue}
    if(c==='|'||c==='∨'||c==='+'){tokens.push({type:'or'});i++;continue}
    if(c==='-'&&str[i+1]==='>'){tokens.push({type:'imp'});i+=2;continue}
    if(c==='='&&str[i+1]==='>'){tokens.push({type:'imp'});i+=2;continue}
    if(c==='<'){ /* <-> or <- */
      if(str[i+1]==='-'&&str[i+2]==='>'){tokens.push({type:'iff'});i+=3;continue}
    }
    if(c==='<'&&str[i+1]==='='&&str[i+2]==='>'){tokens.push({type:'iff'});i+=3;continue}
    if(c==='↔'||c==='≡'){tokens.push({type:'iff'});i++;continue}
    if(c==='→'){tokens.push({type:'imp'});i++;continue}
    if(c==='⊕'||c==='X'){tokens.push({type:'xor'});i++;continue}
    /* Unknown - skip */
    i++;
  }
  return tokens;
}
/* Parser with precedence: ¬ > ∧ > ∨ > → > ↔ */
function parseFormula(str){
  var tokens=tokenize(str);
  var pos=0;
  function peek(){return tokens[pos]}
  function consume(){return tokens[pos++]}
  function parseIff(){
    var left=parseImp();
    while(peek()&&peek().type==='iff'){
      consume();
      var right=parseImp();
      left={type:'iff',left:left,right:right};
    }
    return left;
  }
  function parseImp(){
    var left=parseOr();
    if(peek()&&peek().type==='imp'){
      consume();
      var right=parseImp();
      return {type:'imp',left:left,right:right};
    }
    return left;
  }
  function parseOr(){
    var left=parseAnd();
    while(peek()&&peek().type==='or'){
      consume();
      var right=parseAnd();
      left={type:'or',left:left,right:right};
    }
    return left;
  }
  function parseAnd(){
    var left=parseNot();
    while(peek()&&peek().type==='and'){
      consume();
      var right=parseNot();
      left={type:'and',left:left,right:right};
    }
    return left;
  }
  function parseNot(){
    if(peek()&&peek().type==='not'){
      consume();
      return {type:'not',child:parseNot()};
    }
    return parseAtom();
  }
  function parseAtom(){
    var t=peek();
    if(!t)return {type:'var',name:'?'};
    if(t.type==='var'){
      consume();
      return {type:'var',name:t.value};
    }
    if(t.type==='lp'){
      consume();
      var f=parseIff();
      if(peek()&&peek().type==='rp')consume();
      return f;
    }
    consume();
    return {type:'var',name:'?'};
  }
  try{
    var ast=parseIff();
    return ast;
  }catch(e){
    return {type:'var',name:'error'};
  }
}
/* Collect variables in AST */
function collectVars(ast,set){
  set=set||{};
  if(!ast)return set;
  if(ast.type==='var')set[ast.name]=true;
  else if(ast.type==='not')collectVars(ast.child,set);
  else {collectVars(ast.left,set);collectVars(ast.right,set)}
  return set;
}
/* Evaluate AST under assignment */
function evalAst(ast,env){
  if(!ast)return false;
  switch(ast.type){
    case 'var':return !!env[ast.name];
    case 'not':return !evalAst(ast.child,env);
    case 'and':return evalAst(ast.left,env)&&evalAst(ast.right,env);
    case 'or':return evalAst(ast.left,env)||evalAst(ast.right,env);
    case 'imp':return !evalAst(ast.left,env)||evalAst(ast.right,env);
    case 'iff':return evalAst(ast.left,env)===evalAst(ast.right,env);
    case 'xor':return evalAst(ast.left,env)!==evalAst(ast.right,env);
  }
  return false;
}
/* Pretty-print AST to string */
function astToString(ast){
  if(!ast)return '?';
  switch(ast.type){
    case 'var':return ast.name;
    case 'not':return '¬'+astToString(ast.child);
    case 'and':return '('+astToString(ast.left)+' ∧ '+astToString(ast.right)+')';
    case 'or':return '('+astToString(ast.left)+' ∨ '+astToString(ast.right)+')';
    case 'imp':return '('+astToString(ast.left)+' → '+astToString(ast.right)+')';
    case 'iff':return '('+astToString(ast.left)+' ↔ '+astToString(ast.right)+')';
    case 'xor':return '('+astToString(ast.left)+' ⊕ '+astToString(ast.right)+')';
  }
  return '?';
}
/* Convert to NNF (Negation Normal Form) */
function toNNF(ast,neg){
  if(!ast)return ast;
  neg=!!neg;
  switch(ast.type){
    case 'var':
      return neg?{type:'not',child:ast}:ast;
    case 'not':
      return toNNF(ast.child,!neg);
    case 'and':
      if(neg)return {type:'or',left:toNNF(ast.left,true),right:toNNF(ast.right,true)};
      return {type:'and',left:toNNF(ast.left,false),right:toNNF(ast.right,false)};
    case 'or':
      if(neg)return {type:'and',left:toNNF(ast.left,true),right:toNNF(ast.right,true)};
      return {type:'or',left:toNNF(ast.left,false),right:toNNF(ast.right,false)};
    case 'imp':
      /* A → B = ¬A ∨ B */
      var impl={type:'or',left:ast.left,right:ast.right};
      if(neg)impl={type:'and',left:ast.left,right:{type:'not',child:ast.right}};
      return toNNF(impl,neg);
    case 'iff':
      /* A ↔ B = (A∧B) ∨ (¬A∧¬B) */
      var iff;
      if(!neg){
        iff={type:'or',left:{type:'and',left:ast.left,right:ast.right},right:{type:'and',left:{type:'not',child:ast.left},right:{type:'not',child:ast.right}}};
      } else {
        iff={type:'and',left:{type:'or',left:ast.left,right:{type:'not',child:ast.right}},right:{type:'or',left:{type:'not',child:ast.left},right:ast.right}};
      }
      return toNNF(iff,false);
    case 'xor':
      /* A ⊕ B = (A∧¬B) ∨ (¬A∧B) */
      var xor={type:'or',left:{type:'and',left:ast.left,right:{type:'not',child:ast.right}},right:{type:'and',left:{type:'not',child:ast.left},right:ast.right}};
      return toNNF(xor,neg);
  }
  return ast;
}
/* Convert NNF to CNF (list of clauses, each clause is array of literals) */
function cnfClauses(ast){
  /* Returns array of clauses; each clause is array of {name, negated} */
  var nnf=toNNF(ast,false);
  /* Distribute OR over AND */
  function toCNF(node){
    if(node.type==='var')return [[{name:node.name,negated:false}]];
    if(node.type==='not'&&node.child.type==='var')return [[{name:node.child.name,negated:true}]];
    if(node.type==='and'){
      var l=toCNF(node.left);
      var r=toCNF(node.right);
      return l.concat(r);
    }
    if(node.type==='or'){
      var l2=toCNF(node.left);
      var r2=toCNF(node.right);
      /* Cross product */
      var out=[];
      for(var i=0;i<l2.length;i++){
        for(var j=0;j<r2.length;j++){
          out.push(l2[i].concat(r2[j]));
        }
      }
      return out;
    }
    /* Fallback */
    return [[{name:'?'+Math.random(),negated:false}]];
  }
  return toCNF(nnf);
}
/* Generate all truth assignments */
function* allAssignments(vars){
  var names=Object.keys(vars);
  var n=names.length;
  for(var i=0;i<(1<<n);i++){
    var env={};
    for(var j=0;j<n;j++){
      env[names[j]]=!!(i&(1<<(n-1-j)));
    }
    yield env;
  }
}
/* Determine formula type */
function classifyFormula(ast){
  var vars=collectVars(ast);
  var names=Object.keys(vars);
  var total=0,sat=0;
  for(var env of allAssignments(vars)){
    total++;
    if(evalAst(ast,env))sat++;
  }
  if(sat===total)return 'tautology';
  if(sat===0)return 'contradiction';
  return 'contingent';
}

/* ================================================================
   MODULE 2: SAT SOLVER (DPLL)
   ================================================================ */
registerModule('sat',{
  title:'SAT Solver',
  icon:'🎯',
  desc:'DPLL algorithm for Boolean satisfiability. Unit propagation, pure literal elimination, and backtracking. This is the same algorithm used in modern SAT solvers like MiniSat.',
  init:function(){
    this.parseInput();
    logMsg('SAT: '+STATE.sat.clauses.length+' clauses, '+STATE.sat.vars.length+' variables','success');
  },
  parseInput:function(){
    var s=STATE.sat;
    var ast=parseFormula(s.currentFormula);
    var clauses=cnfClauses(ast);
    s.clauses=clauses;
    var varSet={};
    clauses.forEach(function(cl){
      cl.forEach(function(lit){varSet[lit.name]=true});
    });
    s.vars=Object.keys(varSet);
    s.assignment={};
    s.trace=[];
    s.steps=0;
    s.solution=null;
    s.backtrackCount=0;
    s.decisionCount=0;
    s.unitProps=0;
  },
  /* Check if clause is satisfied under assignment */
  clauseStatus:function(clause,assignment){
    var hasUndef=false;
    for(var i=0;i<clause.length;i++){
      var lit=clause[i];
      var val=assignment[lit.name];
      if(val===undefined){hasUndef=true;continue}
      var litVal=lit.negated?!val:val;
      if(litVal)return 'sat';
    }
    return hasUndef?'undef':'conflict';
  },
  /* Find unit clauses */
  findUnit:function(assignment){
    var s=STATE.sat;
    for(var i=0;i<s.clauses.length;i++){
      var clause=s.clauses[i];
      var unassigned=null;
      var count=0;
      var sat=false;
      for(var j=0;j<clause.length;j++){
        var lit=clause[j];
        var val=assignment[lit.name];
        if(val===undefined){unassigned=lit;count++}
        else {
          var litVal=lit.negated?!val:val;
          if(litVal){sat=true;break}
        }
      }
      if(!sat&&count===1)return unassigned;
    }
    return null;
  },
  /* Find pure literal */
  findPure:function(assignment){
    var s=STATE.sat;
    var pos={},neg={};
    s.clauses.forEach(function(cl){
      cl.forEach(function(lit){
        if(assignment[lit.name]!==undefined)return;
        if(lit.negated)neg[lit.name]=true;
        else pos[lit.name]=true;
      });
    });
    for(var name in pos){
      if(!neg[name])return {name:name,negated:false};
    }
    for(var name in neg){
      if(!pos[name])return {name:name,negated:true};
    }
    return null;
  },
  /* Check if all clauses satisfied */
  allSatisfied:function(assignment){
    var s=STATE.sat;
    for(var i=0;i<s.clauses.length;i++){
      if(this.clauseStatus(s.clauses[i],assignment)!=='sat')return false;
    }
    return true;
  },
  /* Any conflict? */
  anyConflict:function(assignment){
    var s=STATE.sat;
    for(var i=0;i<s.clauses.length;i++){
      if(this.clauseStatus(s.clauses[i],assignment)==='conflict')return true;
    }
    return false;
  },
  /* DPLL recursive */
  dpll:function(assignment){
    if(STATE.sat.steps>=STATE.sat.maxSteps)return null;
    STATE.sat.steps++;
    /* Check conflict */
    if(this.anyConflict(assignment))return 'conflict';
    if(this.allSatisfied(assignment))return assignment;
    /* Unit propagation */
    if(STATE.sat.unitProp){
      var unit=this.findUnit(assignment);
      if(unit){
        var newA=Object.assign({},assignment);
        newA[unit.name]=unit.negated?false:true;
        STATE.sat.unitProps++;
        STATE.sat.trace.push({type:'unit',lit:unit});
        return this.dpll(newA);
      }
    }
    /* Pure literal */
    if(STATE.sat.pureLiteral){
      var pure=this.findPure(assignment);
      if(pure){
        var newA2=Object.assign({},assignment);
        newA2[pure.name]=pure.negated?false:true;
        STATE.sat.trace.push({type:'pure',lit:pure});
        return this.dpll(newA2);
      }
    }
    /* Choose variable (MOMS heuristic - most occurrences in minimal-size clauses) */
    var bestVar=null,bestCount=-1;
    for(var i=0;i<STATE.sat.vars.length;i++){
      var v=STATE.sat.vars[i];
      if(assignment[v]!==undefined)continue;
      var count=0;
      STATE.sat.clauses.forEach(function(cl){
        if(STATE.sat.clauseStatus(cl,assignment)!=='sat'){
          cl.forEach(function(lit){if(lit.name===v)count++});
        }
      });
      if(count>bestCount){bestCount=count;bestVar=v}
    }
    if(bestVar===null)return 'conflict';
    STATE.sat.decisionCount++;
    STATE.sat.trace.push({type:'decision',name:bestVar,value:true});
    /* Try true first */
    var a1=Object.assign({},assignment);
    a1[bestVar]=true;
    var r1=this.dpll(a1);
    if(r1&&r1!=='conflict')return r1;
    /* Backtrack */
    STATE.sat.backtrackCount++;
    STATE.sat.trace.push({type:'backtrack',name:bestVar});
    var a2=Object.assign({},assignment);
    a2[bestVar]=false;
    var r2=this.dpll(a2);
    return r2;
  },
  solve:function(){
    var s=STATE.sat;
    this.parseInput();
    var result=this.dpll({});
    if(result&&result!=='conflict'){
      s.solution=result;
      logMsg('SAT: satisfiable with '+s.decisionCount+' decisions, '+s.backtrackCount+' backtracks','success');
      toast('SAT: satisfiable','success');
    } else {
      s.solution=null;
      logMsg('SAT: unsatisfiable','warn');
      toast('UNSAT','warn');
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    /* Animation phase for wire glow */
    if(STATE.sat.animation)STATE.sat.animation.phase=(STATE.sat.animation.phase||0)+dt;
  },
  stepOnce:function(){this.solve()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020410';
    ctx.fillRect(0,0,W,H);
    var s=STATE.sat;
    /* Formula display */
    drawGlowText(ctx,s.currentFormula,'#40c0ff',W/2,35,'#40c0ff',14,'center');
    /* Clause visualization */
    var clauseY=70;
    var clauseH=Math.min(60,(H*0.4)/Math.max(1,s.clauses.length));
    ctx.fillStyle='#8898d0';
    ctx.font='11px monospace';
    ctx.textAlign='left';
    ctx.fillText('CNF CLAUSES ('+s.clauses.length+')',30,clauseY-5);
    s.clauses.forEach(function(cl,i){
      var y=clauseY+i*(clauseH+4);
      /* Clause background */
      var status=s.solution?this.clauseStatus(cl,s.solution):(s.trace.length?'undef':'undef');
      var bg=status==='sat'?'rgba(64,255,160,.15)':status==='conflict'?'rgba(255,96,160,.15)':'rgba(28,40,80,.6)';
      ctx.fillStyle=bg;
      ctx.fillRect(30,y,W-60,clauseH);
      ctx.strokeStyle=status==='sat'?'#40ffa0':status==='conflict'?'#ff60a0':'#2c3e8c';
      ctx.lineWidth=1.5;
      ctx.strokeRect(30,y,W-60,clauseH);
      /* Literals */
      var litW=80;
      var litX=40;
      cl.forEach(function(lit,j){
        var val=undefined;
        if(s.solution)val=s.solution[lit.name];
        var litVal=val!==undefined?(lit.negated?!val:val):undefined;
        var col=litVal===true?'#40ffa0':litVal===false?'#ff60a0':'#8898d0';
        ctx.fillStyle=col;
        ctx.font='bold 14px monospace';
        ctx.textAlign='left';
        ctx.fillText((lit.negated?'¬':'')+lit.name,litX,y+clauseH/2+5);
        litX+=litW;
      });
      /* Clause number */
      ctx.fillStyle='#4a5a9c';
      ctx.font='10px monospace';
      ctx.textAlign='right';
      ctx.fillText('C'+(i+1),W-40,y+clauseH/2+3);
    },this);
    /* Solution */
    if(s.solution){
      var solY=H*0.5+60;
      ctx.fillStyle='rgba(64,255,160,.15)';
      ctx.strokeStyle='#40ffa0';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(30,solY,W-60,80,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#40ffa0';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('SATISFIABLE',44,solY+22);
      ctx.fillStyle='#d8e4ff';
      ctx.font='13px monospace';
      var assignStr=s.vars.map(function(v){
        return v+'='+(s.solution[v]?'T':'F');
      }).join('  ');
      ctx.fillText(assignStr,44,solY+48);
      ctx.fillStyle='#8898d0';
      ctx.font='10px monospace';
      ctx.fillText('Stats: '+s.decisionCount+' decisions, '+s.backtrackCount+' backtracks, '+s.unitProps+' unit props',44,solY+68);
    } else if(s.trace.length>0){
      var unsatY=H*0.5+60;
      ctx.fillStyle='rgba(255,96,160,.15)';
      ctx.strokeStyle='#ff60a0';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(30,unsatY,W-60,60,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff60a0';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText('UNSATISFIABLE',W/2,unsatY+34);
    }
    /* Trace panel */
    if(s.trace.length>0){
      var traceY=H-160;
      ctx.fillStyle='rgba(10,14,32,.9)';
      ctx.strokeStyle='rgba(64,192,255,.4)';
      ctx.beginPath();ctx.roundRect(30,traceY,W-60,140,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#40c0ff';
      ctx.font='bold 11px monospace';
      ctx.textAlign='left';
      ctx.fillText('DPLL TRACE (last 6 steps)',44,traceY+20);
      var trace=s.trace.slice(-6);
      trace.forEach(function(t,i){
        var y=traceY+38+i*17;
        var col=t.type==='unit'?'#40ffa0':t.type==='decision'?'#ffd040':t.type==='backtrack'?'#ff60a0':'#40c0ff';
        ctx.fillStyle=col;
        ctx.font='11px monospace';
        var text='';
        if(t.type==='unit')text='UNIT: '+(t.lit.negated?'¬':'')+t.lit.name+' = '+(!t.lit.negated);
        else if(t.type==='pure')text='PURE: '+(t.lit.negated?'¬':'')+t.lit.name+' = '+(!t.lit.negated);
        else if(t.type==='decision')text='DECIDE: '+t.name+' = '+t.value;
        else if(t.type==='backtrack')text='BACKTRACK on '+t.name;
        ctx.fillText(text,44,y);
      });
    }
    setStatsHTML(
      '<div>Vars: '+s.vars.length+'</div>'+
      '<div>Clauses: '+s.clauses.length+'</div>'+
      '<div>Decisions: '+s.decisionCount+'</div>'+
      '<div>Backtracks: '+s.backtrackCount+'</div>'+
      '<div>Result: '+(s.solution?'SAT':'UNSAT')+'</div>'

    updateBadge('🎯 SAT · '+s.clauses.length+' clauses · '+(s.solution?'SAT':'UNSAT'));
    $('sbMode').textContent='SAT Solver';
    $('sbVars').textContent=s.vars.length;
    $('sbClauses').textContent=s.clauses.length;
    $('sbSteps').textContent=s.steps;
    $('sbResult').textContent=s.solution?'SAT':'UNSAT';
  },
  onDown:function(){},

    html+='<div style="font-family:var(--mono);font-size:.55rem;color:var(--tx3);line-height:1.5">Uses CNF conversion. Any propositional formula works.</div>';
    html+='</div>';

function loadSatPreset(name){
  var s=STATE.sat;
  if(name==='pigeonhole'){
    /* 3 pigeons, 2 holes - UNSAT */
    s.currentFormula='(x1h1 | x1h2) & (x2h1 | x2h2) & (x3h1 | x3h2) & (~x1h1 | ~x2h1) & (~x1h1 | ~x3h1) & (~x2h1 | ~x3h1) & (~x1h2 | ~x2h2) & (~x1h2 | ~x3h2) & (~x2h2 | ~x3h2)';
  } else if(name==='4queens'){
    /* Simplified 4-queens: one queen per row, no two in same col or diagonal */
    /* Using variables xIJ = queen in row I, column J */
    var clauses=[];
    /* Each row has at least one queen */
    for(var r=0;r<4;r++){
      clauses.push(['x'+r+'0','x'+r+'1','x'+r+'2','x'+r+'3'].join('|'));
    }
    /* No two in same column */
    for(var c=0;c<4;c++){
      for(var i=0;i<4;i++)for(var j=i+1;j<4;j++){
        clauses.push(['~x'+i+c,'~x'+j+c].join('|'));
      }
    }
    /* No two on same diagonal */
    for(var i=0;i<4;i++)for(var j=0;j<4;j++){
      for(var k=0;k<4;k++)for(var l=0;l<4;l++){
        if(i===k&&j===l)continue;
        if(Math.abs(i-k)===Math.abs(j-l)){
          clauses.push(['~x'+i+j,'~x'+k+l].join('|'));
        }
      }
    }
    s.currentFormula=clauses.join(' & ');
  } else if(name==='parity'){
    /* XOR chain: A⊕B⊕C = T */
    s.currentFormula='(A X B) X C';
  } else if(name==='rand-sat'){
    /* Random 3-SAT with 5 vars, 12 clauses */
    var vars=['A','B','C','D','E'];
    var cs=[];
    for(var i=0;i<12;i++){
      var cl=[];
      for(var j=0;j<3;j++){
        var v=vars[rnd(0,vars.length-1)];
        var neg=Math.random()<0.5?'~':'';
        if(cl.indexOf(neg+v)<0)cl.push(neg+v);
      }
      cs.push(cl.join('|'));
    }
    s.currentFormula=cs.join(' & ');
  } else if(name==='simple'){
    s.currentFormula='(A | B) & (~A | C) & (~B | ~C) & (A | ~C)';
  } else if(name==='unsat'){
    s.currentFormula='(A) & (~A)';
  }
  MODULES.sat.init();
  renderLeftPanel();
}

<script>

registerModule('resolution',{
  title:'Resolution',
  icon:'⚔',
  desc:'Automated theorem proving by resolution refutation. Convert to clauses, negate the conclusion, derive the empty clause.',
  init:function(){
    this.setup();
    logMsg('Resolution: proving '+STATE.resolution.conclusion,'success');
  },
  setup:function(){
    var r=STATE.resolution;
    r.initialClauses=[];
    /* Convert premises */
    r.premises.forEach(function(p,i){
      var ast=parseFormula(p);
      var clauses=cnfClauses(ast);
      clauses.forEach(function(cl){
        r.initialClauses.push({clause:cl,from:'P'+(i+1),derived:false});
      });
    });
    /* Add negation of conclusion */
    var conclAst=parseFormula(r.conclusion);
    var negConcl={type:'not',child:conclAst};
    var conclClauses=cnfClauses(negConcl);
    conclClauses.forEach(function(cl){
      r.initialClauses.push({clause:cl,from:'¬C',derived:false});
    });
    /* Deduplicate clauses */
    var seen={};
    r.initialClauses=r.initialClauses.filter(function(item){
      var key=clauseKey(item.clause);
      if(seen[key])return false;
      seen[key]=true;
      return true;
    });
    r.derivedClauses=r.initialClauses.slice();
    r.proofs=[];
    r.currentStep=0;
    r.valid=false;
  },
  clauseKey:function(cl){
    return cl.map(function(l){return (l.negated?'¬':'')+l.name}).sort().join(',');
  },
  /* Check if two clauses can resolve; return resolvent or null */
  resolve:function(c1,c2){
    /* Find complementary pair */
    for(var i=0;i<c1.length;i++){
      for(var j=0;j<c2.length;j++){
        if(c1[i].name===c2[j].name&&c1[i].negated!==c2[j].negated){
          /* Resolvent: union minus both */
          var resolvent=[];
          var seen={};
          for(var k=0;k<c1.length;k++){
            if(k===i)continue;
            var key=(c1[k].negated?'¬':'')+c1[k].name;
            if(!seen[key]){seen[key]=true;resolvent.push(c1[k])}
          }
          for(var k=0;k<c2.length;k++){
            if(k===j)continue;
            var key2=(c2[k].negated?'¬':'')+c2[k].name;
            if(!seen[key2]){seen[key2]=true;resolvent.push(c2[k])}
          }
          /* Check for tautology (both x and ¬x in resolvent) */
          var names={};
          var tautology=false;
          resolvent.forEach(function(l){
            var k=l.name;
            if(!names[k])names[k]={};
            names[k][l.negated?'neg':'pos']=true;
            if(names[k].neg&&names[k].pos)tautology=true;
          });
          if(tautology)return null;
          return resolvent;
        }
      }
    }
    return null;
  },
  /* Perform one resolution step */
  doStep:function(){
    var r=STATE.resolution;
    /* Find a resolvable pair not yet resolved */
    for(var i=0;i<r.derivedClauses.length;i++){
      for(var j=i+1;j<r.derivedClauses.length;j++){
        var ci=r.derivedClauses[i].clause;
        var cj=r.derivedClauses[j].clause;
        var resolvent=this.resolve(ci,cj);
        if(resolvent===null)continue;
        var key=this.clauseKey(resolvent);
        /* Check if already derived */
        var exists=r.derivedClauses.some(function(item){
          return STATE.resolution.clauseKey?false:(item.clause.map(function(l){return (l.negated?'¬':'')+l.name}).sort().join(',')===key);
        });
        if(exists)continue;
        /* Add resolvent */
        r.derivedClauses.push({clause:resolvent,from:i+','+j,derived:true});
        r.currentStep++;
        logMsg('Resolution step '+r.currentStep+': '+clauseToString(resolvent),'info');
        /* Check for empty clause */
        if(resolvent.length===0){
          r.valid=true;
          logMsg('✓ Empty clause derived! Proof complete','success');
          toast('Proved! Empty clause derived','success');
        }
        return true;
      }
    }
    /* No more resolutions possible */
    if(!r.valid){
      logMsg('No more resolutions — cannot prove','warn');
      toast('Cannot derive empty clause','warn');
    }
    return false;
  },
  tick:function(dt){
    STATE.time+=dt;
  },
  stepOnce:function(){this.doStep()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;

  },

function clauseToString(cl){
  if(cl.length===0)return '□';
  return cl.map(function(l){return (l.negated?'¬':'')+l.name}).join(' ∨ ');
}
function runAllResolutions(){
  var r=STATE.resolution;
  var limit=50;
  while(!r.valid&&limit-->0){
    if(!MODULES.resolution.doStep())break;
  }
  renderLeftPanel();
}
function loadProof(name){
  var r=STATE.resolution;
  if(name==='modus-ponens'){
    r.premises=['A -> B','A'];
    r.conclusion='B';
  } else if(name==='syllogism'){
    r.premises=['A -> B','B -> C'];
    r.conclusion='A -> C';
  } else if(name==='contrapositive'){
    r.premises=['A -> B'];
    r.conclusion='~B -> ~A';
  } else if(name==='de-morgan'){
    r.premises=['~(A & B)'];
    r.conclusion='~A | ~B';
  } else if(name==='excluded-middle'){
    r.premises=[];
    r.conclusion='A | ~A';
  }
  MODULES.resolution.setup();
  renderLeftPanel();
}

/* ================================================================
   MODULE 4: SEMANTIC TABLEAUX
   ================================================================ */
registerModule('tableaux',{
  title:'Semantic Tableaux',
  icon:'🌲',
  desc:'Analytic tableaux proof method. Expand formulas into branches; a closed branch yields contradiction. All closed = valid.',
  init:function(){
    this.reset();
    logMsg('Tableaux: proving '+STATE.tableaux.formula,'success');
  },
  reset:function(){
    var t=STATE.tableaux;
    t.nodes=[];
    t.closed=0;
    t.open=0;
    t.steps=0;
    t.verdict='pending';
    /* Root node with negation of formula (to prove validity) */
    var ast=parseFormula(t.formula);
    var negated={type:'not',child:ast};
    t.nodes.push({id:0,formula:astToString(negated),ast:negated,parent:-1,children:[],status:'open',expanded:false,level:0});
  },
  /* Get subformulas to expand a node */
  expand:function(node){
    var ast=node.ast;
    var children=[];
    /* Simplification: handle one connective at a time */
    if(ast.type==='and'){
      /* Conjunction: single child with both */
      children.push(astToString(ast.left));
      children.push(astToString(ast.right));
      return {type:'single',children:children,asts:[ast.left,ast.right]};
    }
    if(ast.type==='or'){
      /* Disjunction: two branches */
      return {type:'branch',branches:[
        {formula:astToString(ast.left),ast:ast.left},
        {formula:astToString(ast.right),ast:ast.right}
      ]};
    }
    if(ast.type==='imp'){
      /* A → B = ¬A ∨ B */
      return {type:'branch',branches:[
        {formula:'¬'+astToString(ast.left),ast:{type:'not',child:ast.left}},
        {formula:astToString(ast.right),ast:ast.right}
      ]};
    }
    if(ast.type==='not'){
      var inner=ast.child;
      if(inner.type==='not'){
        return {type:'single',children:[astToString(inner.child)],asts:[inner.child]};
      }
      if(inner.type==='and'){
        /* ¬(A∧B) = ¬A ∨ ¬B */
        return {type:'branch',branches:[
          {formula:'¬'+astToString(inner.left),ast:{type:'not',child:inner.left}},
          {formula:'¬'+astToString(inner.right),ast:{type:'not',child:inner.right}}
        ]};
      }
      if(inner.type==='or'){
        /* ¬(A∨B) = ¬A ∧ ¬B */
        return {type:'single',children:['¬'+astToString(inner.left),'¬'+astToString(inner.right)],asts:[{type:'not',child:inner.left},{type:'not',child:inner.right}]};
      }
      if(inner.type==='imp'){
        /* ¬(A→B) = A ∧ ¬B */
        return {type:'single',children:[astToString(inner.left),'¬'+astToString(inner.right)],asts:[inner.left,{type:'not',child:inner.right}]};
      }
    }
    if(ast.type==='iff'){
      /* A ↔ B = (A∧B) ∨ (¬A∧¬B) */
      return {type:'branch',branches:[
        {formula:'('+astToString(ast.left)+'∧'+astToString(ast.right)+')',ast:{type:'and',left:ast.left,right:ast.right}},
        {formula:'(¬'+astToString(ast.left)+'∧¬'+astToString(ast.right)+')',ast:{type:'and',left:{type:'not',child:ast.left},right:{type:'not',child:ast.right}}}
      ]};
    }
    return null;
  },
  step:function(){
    var t=STATE.tableaux;
    /* Find next unexpanded open node */
    var node=null;
    for(var i=0;i<t.nodes.length;i++){
      if(t.nodes[i].status==='open'&&!t.nodes[i].expanded){
        node=t.nodes[i];
        break;
      }
    }
    if(!node){
      /* All done */
      this.finalize();
      return;
    }
    /* Check if node is atomic (variable or negated variable) */
    if(node.ast.type==='var'){
      /* Look for contradiction in this branch */
      if(this.hasContradiction(node.id)){
        node.status='closed';
        t.closed++;
        logMsg('Branch closed at node '+node.id,'info');
      }
      node.expanded=true;
      t.steps++;
      return;
    }
    if(node.ast.type==='not'&&node.ast.child.type==='var'){
      if(this.hasContradiction(node.id)){
        node.status='closed';
        t.closed++;
        logMsg('Branch closed at node '+node.id,'info');
      }
      node.expanded=true;
      t.steps++;
      return;
    }
    var expansion=this.expand(node);
    if(!expansion){
      node.expanded=true;
      t.steps++;
      return;
    }
    node.expanded=true;
    if(expansion.type==='single'){
      /* Add children to same branch */
      expansion.children.forEach(function(f,idx){
        var childId=t.nodes.length;
        t.nodes.push({
          id:childId,
          formula:f,
          ast:expansion.asts[idx],
          parent:node.id,
          children:[],
          status:'open',
          expanded:false,
          level:node.level+1
        });
        node.children.push(childId);
      });
    } else {
      /* Branching */
      expansion.branches.forEach(function(b){
        var childId=t.nodes.length;
        t.nodes.push({
          id:childId,
          formula:b.formula,
          ast:b.ast,
          parent:node.id,
          children:[],
          status:'open',
          expanded:false,
          level:node.level+1
        });
        node.children.push(childId);
      });
    }
    t.steps++;
    logMsg('Expanded node '+node.id+': '+node.formula,'info');
    /* Check contradictions in all newly created nodes */
    t.nodes.forEach(function(n){
      if(n.status==='open'&&!n.expanded){
        if(this.checkContradiction(n)){
          n.status='closed';
          t.closed++;
        }
      }
    },this);
  },
  hasContradiction:function(nodeId){
    /* Check if there is a variable and its negation in this branch */
    var t=STATE.tableaux;
    var path=this.pathToRoot(nodeId);
    var pos={},neg={};
    path.forEach(function(nid){
      var node=t.nodes[nid];
      var lit=this.parseLiteral(node.formula);
      if(lit){
        if(lit.negated)neg[lit.name]=true;
        else pos[lit.name]=true;
      }
    },this);
    for(var name in pos){
      if(neg[name])return true;
    }
    return false;
  },
  parseLiteral:function(str){
    /* Parse a simple literal like "A" or "¬A" */
    str=str.trim();
    if(str.indexOf('¬')===0||str.indexOf('~')===0){
      return {name:str.replace(/[¬~]/,'').trim(),negated:true};
    }
    if(/^[A-Za-z][A-Za-z0-9_]*$/.test(str)){
      return {name:str,negated:false};
    }
    return null;
  },
  checkContradiction:function(node){
    var lit=this.parseLiteral(node.formula);
    if(!lit)return false;
    var path=this.pathToRoot(node.id);
    var hasOpposite=false;
    path.forEach(function(nid){
      if(nid===node.id)return;
      var other=STATE.tableaux.nodes[nid];
      var otherLit=this.parseLiteral(other.formula);
      if(otherLit&&otherLit.name===lit.name&&otherLit.negated!==lit.negated){
        hasOpposite=true;
      }
    },this);
    return hasOpposite;
  },
  pathToRoot:function(nodeId){
    var path=[];
    var cur=nodeId;
    while(cur>=0){
      path.unshift(cur);
      cur=STATE.tableaux.nodes[cur].parent;
    }
    return path;
  },
  finalize:function(){
    var t=STATE.tableaux;
    /* All leaves: check status */
    var leaves=t.nodes.filter(function(n){return n.children.length===0});
    var allClosed=leaves.every(function(n){return n.status==='closed'});
    var anyOpen=leaves.some(function(n){return n.status==='open'});
    if(allClosed){
      t.verdict='valid';
      logMsg('✓ All branches closed → formula is VALID','success');
      toast('Formula is VALID','success');
    } else if(anyOpen){
      t.verdict='invalid';
      logMsg('✗ Open branch found → formula is NOT valid','warn');
      toast('Formula is NOT valid','warn');
    }
  },
  tick:function(dt){STATE.time+=dt;},
  stepOnce:function(){this.step()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020410';
    ctx.fillRect(0,0,W,H);
    var t=STATE.tableaux;
    /* Formula at top */
    drawGlowText(ctx,t.formula,'#40c0ff',W/2,35,'#40c0ff',14,'center');
    ctx.fillStyle='#4a5a9c';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Root: ¬('+t.formula+')  [negated to test validity]',W/2,58);
    /* Draw tree */
    if(t.nodes.length===0)return;
    /* Compute layout: BFS levels */
    var levels={};
    t.nodes.forEach(function(n){
      if(!levels[n.level])levels[n.level]=[];
      levels[n.level].push(n);
    });
    var maxLevel=Math.max.apply(null,Object.keys(levels).map(Number));
    var treeTop=90;
    var treeH=H-treeTop-160;
    var levelH=Math.min(80,treeH/(maxLevel+1));
    var positions={};
    Object.keys(levels).forEach(function(l){
      var level=parseInt(l);
      var nodesInLevel=levels[l];
      var y=treeTop+level*levelH;
      var spacing=W/(nodesInLevel.length+1);
      nodesInLevel.forEach(function(n,i){
        positions[n.id]={x:spacing*(i+1),y:y};
      });
    });
    /* Draw edges */
    ctx.strokeStyle='#2c3e8c';
    ctx.lineWidth=1.5;
    t.nodes.forEach(function(n){
      var p1=positions[n.id];
      n.children.forEach(function(cid){
        var child=t.nodes[cid];
        var p2=positions[cid];
        ctx.strokeStyle=child.status==='closed'?'#ff60a0':'#40c0ff';
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y+18);
        ctx.lineTo(p2.x,p2.y-18);
        ctx.stroke();
      });
    });
    /* Draw nodes */
    t.nodes.forEach(function(n){
      var p=positions[n.id];
      if(!p)return;
      var isLeaf=n.children.length===0;
      var col=n.status==='closed'?'#ff60a0':(n.expanded?'#40c0ff':'#ffd040');
      if(isLeaf&&n.status==='open')col='#40ffa0';
      ctx.fillStyle='rgba(10,14,32,.9)';
      ctx.strokeStyle=col;
      ctx.lineWidth=n.id===0?2:1.5;
      ctx.beginPath();
      ctx.roundRect(p.x-55,p.y-16,110,32,6);
      ctx.fill();
      ctx.stroke();
      /* Formula text */
      ctx.fillStyle=col;
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      var text=n.formula.length>18?n.formula.substring(0,16)+'…':n.formula;
      ctx.fillText(text,p.x,p.y);
      ctx.textBaseline='alphabetic';
      /* Close mark */
      if(n.status==='closed'){
        ctx.strokeStyle='#ff60a0';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(p.x+45,p.y-14);
        ctx.lineTo(p.x+55,p.y-4);
        ctx.moveTo(p.x+55,p.y-14);
        ctx.lineTo(p.x+45,p.y-4);
        ctx.stroke();
      }
    });
    /* Info panel */
    ctx.fillStyle='rgba(10,14,32,.9)';
    ctx.strokeStyle='rgba(64,192,255,.5)';
    ctx.beginPath();ctx.roundRect(20,20,240,110,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40c0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('TABLEAU',32,42);
    ctx.fillStyle='#d8e4ff';
    ctx.font='10px monospace';
    ctx.fillText('Nodes: '+t.nodes.length,32,62);
    ctx.fillText('Closed: '+t.closed,32,78);
    ctx.fillText('Steps: '+t.steps,32,94);
    ctx.fillStyle=t.verdict==='valid'?'#40ffa0':t.verdict==='invalid'?'#ff60a0':'#ffd040';
    ctx.fillText('Verdict: '+t.verdict,32,110);
    /* Verdict banner */
    var vY=H-100;
    if(t.verdict==='valid'){
      ctx.fillStyle='rgba(64,255,160,.15)';
      ctx.strokeStyle='#40ffa0';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(30,vY,W-60,70,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#40ffa0';
      ctx.font='bold 18px monospace';
      ctx.textAlign='center';
      ctx.fillText('✓ FORMULA IS VALID (tautology)',W/2,vY+42);
    } else if(t.verdict==='invalid'){
      ctx.fillStyle='rgba(255,96,160,.15)';
      ctx.strokeStyle='#ff60a0';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(30,vY,W-60,70,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff60a0';
      ctx.font='bold 16px monospace';
      ctx.textAlign='center';
      ctx.fillText('✗ FORMULA IS NOT VALID (open branch)',W/2,vY+42);
    } else {
      ctx.fillStyle='rgba(64,192,255,.15)';
      ctx.strokeStyle='#40c0ff';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(30,vY,W-60,70,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#40c0ff';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText('Click "Expand step" to build proof tree',W/2,vY+42);
    }
    setStatsHTML(
      '<div>Nodes: '+t.nodes.length+'</div>'+
      '<div>Closed: '+t.closed+'</div>'+
      '<div>Steps: '+t.steps+'</div>'+
      '<div>'+t.verdict+'</div>'
    );
    updateBadge('🌲 Tableau · '+t.nodes.length+' nodes · '+t.verdict);
    $('sbMode').textContent='Semantic Tableaux';
    $('sbSteps').textContent=t.steps;
    $('sbResult').textContent=t.verdict;
  },

  mathPanel:function(){
    return '<div class="sec"><h4>Semantic tableaux</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'A proof method that systematically tries to <b>falsify</b> the formula.<br><br>'+
      '1. Start with ¬formula at the root<br>'+
      '2. Expand connectives into branches:<br>'+
      '   • Conjunctions add to same branch<br>'+
      '   • Disjunctions split into two branches<br>'+
      '3. When a branch contains a contradiction (A and ¬A), close it<br>'+
      '4. If ALL branches close → formula is valid<br>'+
      '5. If any branch stays open → formula is not valid'+
      '</div></div>'+
      '<div class="sec"><h4>Expansion rules</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c1)">α-rules</b> (linear, no branching):<br>'+
      'A ∧ B  ⟶ A, B (same branch)<br>'+
      '¬(A ∨ B)  ⟶ ¬A, ¬B<br>'+
      '¬(A → B)  ⟶ A, ¬B<br><br>'+
      '<b style="color:var(--c2)">β-rules</b> (branching):<br>'+
      'A ∨ B  ⟶ A | B<br>'+
      'A → B  ⟶ ¬A | B<br>'+
      '¬(A ∧ B)  ⟶ ¬A | ¬B'+
      '</div></div>'+
      '<div class="sec"><h4>Comparison to resolution</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Tableaux and resolution are equivalent in power.<br><br>'+
      'Tableaux is more <b>natural</b> — each step corresponds to a logical rule.<br>'+
      'Resolution is easier to <b>automate</b> — uses only one rule.'+
      '</div></div>';
  }
});
function runAllTableauSteps(){
  for(var k=0;k<100;k++){
    var before=STATE.tableaux.steps;
    MODULES.tableaux.step();
    if(STATE.tableaux.steps===before)break;
    if(STATE.tableaux.verdict!=='pending')break;
  }
  renderLeftPanel();
}
function loadTautology(name){
  var t=STATE.tableaux;
  if(name==='modus-ponens')t.formula='((A -> B) & A) -> B';
  else if(name==='contrapositive')t.formula='(A -> B) -> (~B -> ~A)';
  else if(name==='de-morgan')t.formula='~(A & B) <-> (~A | ~B)';
  else if(name==='distributive')t.formula='A & (B | C) <-> (A & B) | (A & C)';
  else if(name==='not-valid')t.formula='(A | B) -> (A & B)';
  MODULES.tableaux.reset();
  renderLeftPanel();
}

registerModule('circuits',{
  title:'Logic Circuits',
  icon:'⚡',
  desc:'Boolean gates: AND, OR, NOT, NAND, NOR, XOR. See how NAND alone can build any circuit. Half adder, full adder, and more.',
  init:function(){
    this.loadCircuit(STATE.circuits.currentCircuit);
    logMsg('Circuits: '+STATE.circuits.currentCircuit,'success');
  },
  loadCircuit:function(name){
    var c=STATE.circuits;
    c.currentCircuit=name;
    var preset=c.presets[name];
    c.inputs=new Array(preset.inputs).fill(false);
    c.gates=preset.gates.map(function(g){
      return {type:g.type,ins:g.ins.slice(),out:g.out||null,value:false};
    });
    this.evaluate();
  },
  evaluate:function(){
    var c=STATE.circuits;
    /* Evaluate gates in order */
    var values={};
    /* Inputs */
    c.inputs.forEach(function(v,i){values[i]=v});
    /* Gates */
    c.gates.forEach(function(g,idx){
      var inVals=g.ins.map(function(inp){
        if(typeof inp==='string'){
          return values[inp]!==undefined?values[inp]:false;
        }
        return values[inp]!==undefined?values[inp]:false;
      });
      var out=false;
      switch(g.type){
        case 'and':out=inVals.every(function(v){return v});break;
        case 'or':out=inVals.some(function(v){return v});break;
        case 'not':out=!inVals[0];break;
        case 'nand':out=!inVals.every(function(v){return v});break;
        case 'nor':out=!inVals.some(function(v){return v});break;
        case 'xor':out=inVals.filter(function(v){return v}).length%2===1;break;
      }
      g.value=out;
      values[g.out||('g'+idx)]=out;
    });
    c.values=values;
  },
  tick:function(dt){
    STATE.time+=dt;
    STATE.circuits.animPhase+=dt;
  },
  stepOnce:function(){this.evaluate()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020410';
    ctx.fillRect(0,0,W,H);
    var c=STATE.circuits;
    var preset=c.presets[c.currentCircuit];
    /* Title */
    drawGlowText(ctx,preset.name.toUpperCase(),'#40c0ff',30,35,'#40c0ff',16);
    /* Layout: inputs on left, gates in middle, outputs on right */
    var inputX=80;
    var gateX=W*0.5;
    var outputX=W-120;
    var inputSpacing=Math.min(60,(H-160)/(c.inputs.length||1));
    var inputStartY=(H-(c.inputs.length-1)*inputSpacing)/2;
    /* Draw input nodes */
    var inputPositions=[];
    c.inputs.forEach(function(v,i){
      var y=inputStartY+i*inputSpacing;
      inputPositions.push({x:inputX,y:y});
      /* Node circle */
      var col=v?'#40ffa0':'#4a5a9c';
      ctx.fillStyle=col;
      ctx.shadowColor=col;ctx.shadowBlur=v?15:0;
      ctx.beginPath();ctx.arc(inputX,y,20,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#0a0e20';
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle='#0a0e20';
      ctx.font='bold 12px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText('I'+i,inputX,y);
      ctx.textBaseline='alphabetic';
      /* Value label */
      ctx.fillStyle=col;
      ctx.font='bold 14px monospace';
      ctx.textAlign='left';
      ctx.fillText(v?'1':'0',inputX+30,y+5);
      /* Click to toggle indicator */
      ctx.fillStyle='#8898d0';
      ctx.font='9px monospace';
      ctx.fillText('(click)',inputX+52,y+5);
    });
    /* Draw gates */
    var gateSpacing=Math.min(90,(H-160)/(c.gates.length||1));
    var gateStartY=(H-(c.gates.length-1)*gateSpacing)/2;
    var gatePositions=[];
    c.gates.forEach(function(g,i){
      var y=gateStartY+i*gateSpacing;
      gatePositions.push({x:gateX,y:y});
      /* Gate symbol */
      var col=g.value?'#40ffa0':'#4a5a9c';
      ctx.fillStyle=col;
      ctx.shadowColor=col;ctx.shadowBlur=g.value?15:0;
      if(g.type==='not'||g.type==='nor'||g.type==='nand'){
        /* Draw gate body + bubble */
        ctx.beginPath();
        ctx.moveTo(gateX-35,y-22);
        ctx.lineTo(gateX+20,y-22);
        ctx.lineTo(gateX+35,y);
        ctx.lineTo(gateX+20,y+22);
        ctx.lineTo(gateX-35,y+22);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='#0a0e20';
        ctx.lineWidth=2;
        ctx.stroke();
        /* Output bubble */
        ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(gateX+42,y,6,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#0a0e20';
        ctx.stroke();
      } else if(g.type==='and'){
        /* D-shape */
        ctx.beginPath();
        ctx.moveTo(gateX-35,y-22);
        ctx.lineTo(gateX,y-22);
        ctx.arc(gateX,y,22,-Math.PI/2,Math.PI/2);
        ctx.lineTo(gateX-35,y+22);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='#0a0e20';
        ctx.lineWidth=2;
        ctx.stroke();
      } else if(g.type==='or'){
        /* Curved shape */
        ctx.beginPath();
        ctx.moveTo(gateX-35,y-22);
        ctx.quadraticCurveTo(gateX+15,y-22,gateX+35,y);
        ctx.quadraticCurveTo(gateX+15,y+22,gateX-35,y+22);
        ctx.quadraticCurveTo(gateX-15,y,gateX-35,y-22);
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='#0a0e20';
        ctx.lineWidth=2;
        ctx.stroke();
      } else if(g.type==='xor'){
        /* OR shape + curved back */
        ctx.beginPath();
        ctx.moveTo(gateX-35,y-22);
        ctx.quadraticCurveTo(gateX+15,y-22,gateX+35,y);
        ctx.quadraticCurveTo(gateX+15,y+22,gateX-35,y+22);
        ctx.quadraticCurveTo(gateX-15,y,gateX-35,y-22);
        ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='#0a0e20';
        ctx.lineWidth=2;
        ctx.stroke();
        /* Extra arc */
        ctx.strokeStyle=col;
        ctx.beginPath();
        ctx.moveTo(gateX-43,y-22);
        ctx.quadraticCurveTo(gateX-23,y,gateX-43,y+22);
        ctx.stroke();
      }
      /* Gate type label */
      ctx.fillStyle='#0a0e20';
      ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(g.type.toUpperCase(),gateX,y);
      ctx.textBaseline='alphabetic';
      /* Output value */
      ctx.fillStyle=col;
      ctx.font='bold 14px monospace';
      ctx.textAlign='left';
      ctx.fillText(g.value?'1':'0',gateX+55,y+5);
    });
    /* Draw wires */
    ctx.lineWidth=2;
    c.gates.forEach(function(g,idx){
      var gpos=gatePositions[idx];
      var g2=c.gates[idx];
      g.ins.forEach(function(inp,i){
        var sourcePos=null;
        var sourceVal=false;
        if(typeof inp==='string'){
          /* From another gate's output */
          var srcIdx=c.gates.findIndex(function(gg){return gg.out===inp});
          if(srcIdx>=0){
            sourcePos=gatePositions[srcIdx];
            sourceVal=c.gates[srcIdx].value;
          }
        } else if(typeof inp==='number'){
          if(inp<c.inputs.length){
            sourcePos=inputPositions[inp];
            sourceVal=c.inputs[inp];
          } else {
            var gateIdx=inp-c.inputs.length;
            if(gateIdx>=0&&gateIdx<c.gates.length){
              sourcePos=gatePositions[gateIdx];
              sourceVal=c.gates[gateIdx].value;
            }
          }
        }
        if(!sourcePos)return;
        /* Wire path */
        var startX=sourcePos.x+55;
        var startY=sourcePos.y;
        var endX=gpos.x-45;
        var endY=gpos.y-22+i*22;
        var col=sourceVal?'#40ffa0':'#4a5a9c';
        ctx.strokeStyle=col;
        ctx.shadowColor=col;ctx.shadowBlur=sourceVal?6:0;
        ctx.beginPath();
        ctx.moveTo(startX,startY);
        var midX=(startX+endX)/2;
        ctx.lineTo(midX,startY);
        ctx.lineTo(midX,endY);
        ctx.lineTo(endX,endY);
        ctx.stroke();
        ctx.shadowBlur=0;
        /* Current flowing animation */
        if(sourceVal){
          var phase=(STATE.circuits.animPhase*2)%1;
          var dotX=startX+(midX-startX)*Math.min(1,phase*2);
          var dotY=startY;
          if(phase*2>1){
            dotX=midX;
            dotY=startY+(endY-startY)*(phase*2-1);
          }
          if(phase*2>2){
            dotX=midX+(endX-midX)*(phase*2-2);
            dotY=endY;
          }
          ctx.fillStyle='#ffe040';
          ctx.beginPath();ctx.arc(dotX,dotY,3,0,Math.PI*2);ctx.fill();
        }
      });
    });
    /* Draw outputs (labeled gates or final gates) */
    c.gates.forEach(function(g,i){
      if(g.out){
        var pos=gatePositions[i];
        var outX=outputX;
        var outY=pos.y;
        /* Wire from gate to output */
        ctx.strokeStyle=g.value?'#40ffa0':'#4a5a9c';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(pos.x+75,pos.y);
        ctx.lineTo(outX-20,outY);
        ctx.stroke();
        /* Output node */
        var col=g.value?'#40ffa0':'#4a5a9c';
        ctx.fillStyle=col;
        ctx.shadowColor=col;ctx.shadowBlur=g.value?15:0;
        ctx.beginPath();ctx.arc(outX,outY,20,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
        ctx.strokeStyle='#0a0e20';
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.fillStyle='#0a0e20';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(g.out,outX,outY);
        ctx.textBaseline='alphabetic';
      }
    });
    /* Truth table inset */
    this.drawTruthTable(ctx,W-260,20);
    /* Info panel */
    ctx.fillStyle='rgba(10,14,32,.9)';
    ctx.strokeStyle='rgba(64,192,255,.5)';
    ctx.beginPath();ctx.roundRect(20,20,220,110,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40c0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('CIRCUIT INFO',32,42);
    ctx.fillStyle='#d8e4ff';
    ctx.font='10px monospace';
    ctx.fillText('Circuit: '+preset.name,32,62);
    ctx.fillText('Inputs: '+c.inputs.length,32,78);
    ctx.fillText('Gates: '+c.gates.length,32,94);
    ctx.fillText('Click inputs to toggle',32,110);
    setStatsHTML(
      '<div>Circuit: '+preset.name+'</div>'+
      '<div>Inputs: '+c.inputs.length+'</div>'+
      '<div>Gates: '+c.gates.length+'</div>'+
      '<div>Values: '+c.inputs.map(function(v){return v?'1':'0'}).join('')+'</div>'
    );
    updateBadge('⚡ '+preset.name+' · '+c.inputs.length+' in · '+c.gates.length+' gates');
    $('sbMode').textContent='Logic Circuits';
  },
  drawTruthTable:function(ctx,x,y){
    var c=STATE.circuits;
    /* Show truth table for this circuit */
    var n=c.inputs.length;
    var rows=1<<n;
    var colW=60;
    var rowH=18;
    var tableH=rows*rowH+30;
    ctx.fillStyle='rgba(10,14,32,.9)';
    ctx.strokeStyle='rgba(255,208,64,.4)';
    ctx.beginPath();ctx.roundRect(x-10,y,240,tableH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 10px monospace';
    ctx.textAlign='left';
    ctx.fillText('TRUTH TABLE',x,y+14);
    /* Header */
    ctx.fillStyle='#4a5a9c';
    ctx.font='9px monospace';
    for(var i=0;i<n;i++){
      ctx.fillText('I'+i,x+i*20+10,y+30);
    }
    /* Body */
    var preset=c.presets[c.currentCircuit];
    var outputs=preset.gates.filter(function(g){return g.out}).map(function(g){return g.out});
    var outX=x+n*20+40;
    outputs.forEach(function(o,i){
      ctx.fillStyle='#4a5a9c';
      ctx.fillText(o,outX+i*30,y+30);
    });
    /* Rows */
    for(var r=0;r<rows;r++){
      var y2=y+40+r*rowH;
      if(y2+rowH>y+tableH-5)break;
      /* Compute values for this input combination */
      var env=[];
      for(var i=0;i<n;i++)env.push(!!(r&(1<<(n-1-i))));
      /* Evaluate gates with these inputs */
      var vals={};
      env.forEach(function(v,i){vals[i]=v});
      var outputs_values=[];
      c.gates.forEach(function(g,idx){
        var inVals=g.ins.map(function(inp){
          if(typeof inp==='string')return vals[inp]!==undefined?vals[inp]:false;
          return vals[inp]!==undefined?vals[inp]:false;
        });
        var out=false;
        switch(g.type){
          case 'and':out=inVals.every(function(v){return v});break;
          case 'or':out=inVals.some(function(v){return v});break;
          case 'not':out=!inVals[0];break;
          case 'nand':out=!inVals.every(function(v){return v});break;
          case 'nor':out=!inVals.some(function(v){return v});break;
          case 'xor':out=inVals.filter(function(v){return v}).length%2===1;break;
        }
        vals[g.out||('g'+idx)]=out;
        if(g.out)outputs_values.push(out);
      });
      /* Highlight current row */
      var isCurrent=env.every(function(v,i){return v===c.inputs[i]});
      if(isCurrent){
        ctx.fillStyle='rgba(64,192,255,.15)';
        ctx.fillRect(x-5,y2-3,230,rowH);
      }
      /* Values */
      env.forEach(function(v,i){
        ctx.fillStyle=v?'#40ffa0':'#ff60a0';
        ctx.font='10px monospace';
        ctx.textAlign='left';
        ctx.fillText(v?'1':'0',x+i*20+12,y2+8);
      });
      outputs_values.forEach(function(v,i){
        ctx.fillStyle=v?'#40ffa0':'#ff60a0';
        ctx.font='bold 10px monospace';
        ctx.fillText(v?'1':'0',outX+i*30+4,y2+8);
      });
    }
  },
  onDown:function(p){
    /* Toggle inputs */
    var c=STATE.circuits;
    var inputX=80;
    var inputSpacing=Math.min(60,(CANV.H-160)/(c.inputs.length||1));
    var inputStartY=(CANV.H-(c.inputs.length-1)*inputSpacing)/2;
    for(var i=0;i<c.inputs.length;i++){
      var y=inputStartY+i*inputSpacing;
      if(Math.hypot(p.x-inputX,p.y-y)<25){
        c.inputs[i]=!c.inputs[i];
        this.evaluate();
        break;
      }
    }
  },
  controls:function(){
    var c=STATE.circuits;
    var html='';
    html+='<div class="sec"><h4>Circuit</h4><div class="chip-row">';
    Object.keys(c.presets).forEach(function(k){
      html+='<div class="chip '+(c.currentCircuit===k?'active':'')+'" onclick="MODULES.circuits.loadCircuit(\''+k+'\');renderLeftPanel()">'+c.presets[k].name+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Inputs</h4><div class="chip-row">';
    c.inputs.forEach(function(v,i){
      html+='<div class="chip '+(v?'active':'')+'" onclick="STATE.circuits.inputs['+i+']=!STATE.circuits.inputs['+i+'];MODULES.circuits.evaluate();renderLeftPanel()">I'+i+' = '+(v?'1':'0')+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Current values</h4><div class="kv">';
    c.gates.forEach(function(g,i){
      html+='<div class="row"><span class="k">Gate '+(i+1)+' ('+g.type.toUpperCase()+')</span><span class="v">'+(g.value?'1':'0')+(g.out?' → '+g.out:'')+'</span></div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.circuits.evaluate()">↻ Evaluate</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.circuits.inputs=STATE.circuits.inputs.map(function(){return false});MODULES.circuits.evaluate()">✕ All inputs = 0</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.circuits.inputs=STATE.circuits.inputs.map(function(){return true});MODULES.circuits.evaluate()">✓ All inputs = 1</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Gate universality</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '<b style="color:var(--c1)">NAND</b> alone can build any circuit — try "NAND → AND" preset.<br><br>'+
      'AND from NAND: NAND(A,B) then invert<br>'+
      'OR from NAND: (A NAND A) NAND (B NAND B)'+
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Boolean gates</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'AND  (∧): output 1 iff all inputs 1<br>'+
      'OR   (∨): output 1 iff any input 1<br>'+
      'NOT  (¬): output 1 iff input 0<br>'+
      'NAND: ¬(A∧B)<br>'+
      'NOR:  ¬(A∨B)<br>'+
      'XOR:  A⊕B = (A∧¬B) ∨ (¬A∧B)'+
      '</div></div>'+
      '<div class="sec"><h4>NAND universality</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'NAND is functionally complete: any Boolean function can be built from NANDs alone.<br><br>'+
      'NOT(A) = NAND(A,A)<br>'+
      'AND(A,B) = NOT(NAND(A,B))<br>'+
      'OR(A,B) = NAND(NAND(A,A), NAND(B,B))<br><br>'+
      'This is why NAND flash memory and NAND-only ASIC designs are possible.'+
      '</div></div>'+
      '<div class="sec"><h4>De Morgan for gates</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '¬(A∧B) = ¬A ∨ ¬B (NAND ≡ OR of inverted inputs)<br>'+
      '¬(A∨B) = ¬A ∧ ¬B (NOR ≡ AND of inverted inputs)'+
      '</div></div>'+
      '<div class="sec"><h4>Applications</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Half adder: 2 inputs (A,B) → Sum, Carry<br>'+
      'Full adder: 3 inputs (A,B,Cin) → Sum, Cout<br>'+
      'N-bit adder: chain N full adders<br>'+
      'ALU, registers, CPU control logic — all built from gates'+
      '</div></div>';
  }
});
</script>

function togglePlay(){

}
function stepOnce(){

}
function resetModule(){

    MODULES[STATE.currentTab].init();toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['logic','light','mono'];
function toggleTheme(){

function showHelp(){

    '<div class="sec"><h4>🧠 About</h4><div style="font-size:.62rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)">Logic and computability workbench in one HTML file. Truth tables, DPLL SAT solver, resolution refutation, semantic tableaux, and logic circuits — all real algorithms, no libraries.</div></div>'+

    '<b style="color:var(--c1)">Space</b> — Play/pause<br>'+
