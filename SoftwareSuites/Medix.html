<!DOCTYPE html>
<html lang="pt-BR" data-theme="clinical">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MEDIX — Clinical Analytics Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#0a0410;--panel:#140818;--panel2:#1c0c20;--panel3:#28142e;--panel4:#381c40;
  --bd:#2a1430;--bd2:#502858;--tx:#f0e0f8;--tx2:#b090c0;--tx3:#785888;
  --p1:#ff4080;--p2:#40e0ff;--p3:#40ff90;--p4:#ffd040;--p5:#a060ff;--p6:#ff8040;
  --g1:linear-gradient(135deg,#ff4080,#a060ff);
  --gHolo:linear-gradient(120deg,#ff4080,#a060ff,#40e0ff,#40ff90,#ffd040,#ff4080);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#fdf8fc;--panel:#fff;--panel2:#fdf8fc;--panel3:#f8eef8;--panel4:#f0dff0;--bd:#e8d0e8;--bd2:#c8a0c8;--tx:#1a0818;--tx2:#583058;--tx3:#885888;--p1:#c00060;--p2:#0060a0;--g1:linear-gradient(135deg,#c00060,#6020c0)}
[data-theme="scrubs"]{--bg:#f0f8f8;--panel:#fff;--panel2:#f0f8f8;--panel3:#e0f0f0;--panel4:#d0e8e8;--bd:#c0dcdc;--bd2:#80b0b0;--tx:#0a2020;--tx2:#406060;--tx3:#708080;--p1:#0080a0;--p2:#0060c0;--g1:linear-gradient(135deg,#0080a0,#0060c0)}
[data-theme="dark"]{--bg:#000;--panel:#0a0a0f;--panel2:#14141c;--panel3:#1e1e28;--panel4:#282834;--bd:#202030;--bd2:#383848;--tx:#e0e0f0;--tx2:#9090a8;--tx3:#606078;--p1:#40a0ff;--p2:#40d0a0;--g1:linear-gradient(135deg,#40a0ff,#40d0a0)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0410}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p3);box-shadow:0 0 10px var(--p3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#050210;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,64,128,.012) 0,rgba(255,64,128,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(20,8,24,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,64,128,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#0a0410;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn.danger{background:rgba(255,64,128,.2);border-color:var(--p1);color:var(--p1)}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#0a0410;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p3)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p1)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.risk-low{color:#40ff90}.risk-mid{color:#ffd040}.risk-high{color:#ff8040}.risk-crit{color:#ff4080;font-weight:900}
.badge-risk{padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:.6rem;font-weight:700;display:inline-block}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('ecg')">MEDIX</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">HR</span><span class="sb-val c2" id="sbHR">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">SpO₂</span><span class="sb-val c3" id="sbSpo2">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">BP</span><span class="sb-val c4" id="sbBP">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">T°</span><span class="sb-val c5" id="sbTemp">--</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">ECG</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   MEDICAL CALCULATIONS LIBRARY
   ══════════════════════════════════════════════════════════ */

/* Glasgow Coma Scale total (3-15) */
function gcsTotal(eye,verbal,motor){return eye+verbal+motor}
function gcsSeverity(total){
  if(total>=13)return {level:'Mild',color:'#40ff90'};
  if(total>=9)return {level:'Moderate',color:'#ffd040'};
  return {level:'Severe',color:'#ff4080'};
}

/* APACHE II score */
function apacheII(p){
  // p: {temp, map, hr, rr, paO2, pH, na, k, cr, hct, wbc, age, chronic, gcs}
  var score=0;
  // Temperature (°C)
  if(p.temp>=41||p.temp<=29.9)score+=4;
  else if(p.temp>=39||p.temp<=31.9)score+=3;
  else if(p.temp>=38.5||p.temp<=33.9)score+=1;
  else if(p.temp<=35.9)score+=2;
  // MAP
  if(p.map>=160||p.map<=49)score+=4;
  else if(p.map>=130)score+=3;
  else if(p.map>=110||p.map<=69)score+=2;
  else if(p.map<=79)score+=1;
  // HR
  if(p.hr>=180||p.hr<=39)score+=4;
  else if(p.hr>=140||p.hr<=54)score+=3;
  else if(p.hr>=110||p.hr<=69)score+=2;
  else if(p.hr>=70&&p.hr<=109)score+=0;
  // RR
  if(p.rr>=50||p.rr<=5)score+=4;
  else if(p.rr>=35)score+=3;
  else if(p.rr>=25||p.rr<=9)score+=1;
  else if(p.rr>=10&&p.rr<=11)score+=1;
  // Oxygenation
  if(p.paO2<55)score+=4;
  else if(p.paO2<61)score+=3;
  else if(p.paO2<71)score+=1;
  // pH
  if(p.pH>=7.7||p.pH<7.15)score+=4;
  else if(p.pH>=7.6||p.pH<7.25)score+=3;
  else if(p.pH>=7.5||p.pH<7.33)score+=1;
  else if(p.pH<7.33)score+=2;
  // Na
  if(p.na>=180||p.na<=110)score+=4;
  else if(p.na>=160||p.na<=119)score+=3;
  else if(p.na>=155||p.na<=129)score+=2;
  else if(p.na>=150||p.na<=134)score+=1;
  // K
  if(p.k>=7||p.k<2.5)score+=4;
  else if(p.k>=6)score+=3;
  else if(p.k>=5.5||p.k<3)score+=1;
  else if(p.k>=3&&p.k<3.5)score+=1;
  // Creatinine
  if(p.cr>=3.5)score+=4;
  else if(p.cr>=2)score+=3;
  else if(p.cr>=1.5||p.cr<0.6)score+=2;
  // Hct
  if(p.hct>=60||p.hct<20)score+=4;
  else if(p.hct>=50||p.hct<30)score+=2;
  else if(p.hct>=46)score+=1;
  // WBC
  if(p.wbc>=40||p.wbc<1)score+=4;
  else if(p.wbc>=20||p.wbc<3)score+=2;
  else if(p.wbc>=15)score+=1;
  // GCS
  score+=15-p.gcs;
  // Age
  if(p.age>=75)score+=6;
  else if(p.age>=65)score+=5;
  else if(p.age>=55)score+=3;
  else if(p.age>=45)score+=2;
  // Chronic health
  score+=p.chronic;
  return score;
}
function apacheIIMortality(score){
  // Approximate from Knaus et al. 1985
  var mort={
    0:4,5:8,10:15,15:25,20:40,25:55,30:73,35:88,40:95
  };
  var keys=Object.keys(mort).map(Number).sort(function(a,b){return a-b});
  for(var i=0;i<keys.length-1;i++){
    if(score>=keys[i]&&score<keys[i+1]){
      var t=(score-keys[i])/(keys[i+1]-keys[i]);
      return lerp(mort[keys[i]],mort[keys[i+1]],t);
    }
  }
  return mort[keys[keys.length-1]];
}

/* SOFA score */
function sofaScore(p){
  var s=0;
  // Respiration PaO2/FiO2
  if(p.pf<100)s+=4;
  else if(p.pf<200)s+=3;
  else if(p.pf<300)s+=2;
  else if(p.pf<400)s+=1;
  // Coagulation Platelets (×10³/μL)
  if(p.plt<20)s+=4;
  else if(p.plt<50)s+=3;
  else if(p.plt<100)s+=2;
  else if(p.plt<150)s+=1;
  // Liver Bilirubin (mg/dL)
  if(p.bili>=12)s+=4;
  else if(p.bili>=6)s+=3;
  else if(p.bili>=2)s+=2;
  else if(p.bili>=1.2)s+=1;
  // Cardiovascular
  if(p.map<70&&!p.vaso)s+=1;
  else if(p.dopa<=5||p.dobut)s+=2;
  else if(p.dopa>5||p.epi<=0.1)s+=3;
  else if(p.dopa>15||p.epi>0.1)s+=4;
  // CNS GCS
  if(p.gcs<6)s+=4;
  else if(p.gcs<10)s+=3;
  else if(p.gcs<13)s+=2;
  else if(p.gcs<15)s+=1;
  // Renal Creatinine
  if(p.cr>=5)s+=4;
  else if(p.cr>=3.5)s+=3;
  else if(p.cr>=2)s+=2;
  else if(p.cr>=1.2)s+=1;
  return s;
}
function sofaMortality(score){
  // from Ferreira et al. 2001
  if(score<=6)return {rate:score*3.2,label:'Low'};
  if(score<=9)return {rate:20+score*4,label:'Moderate'};
  if(score<=12)return {rate:50+score*2,label:'High'};
  return {rate:80+score,label:'Very High'};
}

/* Wells Score for DVT/PE */
function wellsDVT(items){
  var score=0;
  if(items.cancer)score+=1;
  if(items.paralysis)score+=1;
  if(items.bedridden)score+=1;
  if(items.tenderness)score+=1;
  if(items.swelling)score+=1;
  if(items.pitting)score+=1;
  if(items.collateral)score+=1;
  if(items.prevDVT)score+=1;
  if(items.altDx)score-=2;
  return score;
}
function wellsDVTProb(score){
  if(score>=3)return {level:'High',prob:75,color:'#ff4080'};
  if(score>=1)return {level:'Moderate',prob:17,color:'#ffd040'};
  return {level:'Low',prob:3,color:'#40ff90'};
}

/* CHA2DS2-VASc */
function cha2ds2vasc(p){
  var score=0;
  if(p.chf)score+=1;
  if(p.htn)score+=1;
  if(p.age>=75)score+=2;
  else if(p.age>=65)score+=1;
  if(p.dm)score+=1;
  if(p.stroke)score+=2;
  if(p.vasc)score+=1;
  if(p.female)score+=1;
  return score;
}
function chadsvascRisk(score){
  var risk=[0,1.3,2.2,3.2,4.0,6.7,9.8,9.6,6.7,15.2];
  return risk[Math.min(score,9)]||0;
}

/* eGFR CKD-EPI 2021 */
function egfr(scr,age,sex){
  var k=sex==='F'?0.7:0.9;
  var a=sex==='F'?-0.241:-0.302;
  var min=Math.min(scr/k,1);
  var max=Math.max(scr/k,1);
  var e=142*Math.pow(min,a)*Math.pow(max,-1.2)*Math.pow(0.9938,age);
  if(sex==='F')e*=1.012;
  return e;
}
function ckdStage(e){
  if(e>=90)return {stage:'G1',label:'Normal',color:'#40ff90'};
  if(e>=60)return {stage:'G2',label:'Mild ↓',color:'#40ff90'};
  if(e>=45)return {stage:'G3a',label:'Mild-mod ↓',color:'#ffd040'};
  if(e>=30)return {stage:'G3b',label:'Mod-severe ↓',color:'#ff8040'};
  if(e>=15)return {stage:'G4',label:'Severe ↓',color:'#ff4080'};
  return {stage:'G5',label:'Kidney failure',color:'#ff4080'};
}

/* Blood gas analysis (Winter's formula for metabolic acidosis) */
function winterFormula(hco3){
  var expCO2=1.5*hco3+8;
  return {low:expCO2-2,high:expCO2+2,expected:expCO2};
}
function anionGap(na,cl,hco3,k){
  var ag=na-(cl+hco3);
  if(k)ag=na+k-cl-hco3;
  return ag;
}
function deltaRatio(ag,hco3){
  var agNormal=12;
  var hco3Normal=24;
  return (ag-agNormal)/(hco3Normal-hco3);
}

/* Bergman minimal model (glucose-insulin dynamics) */
function bergmanStep(state,p,dt){
  // state: [G, X, I] (glucose mg/dL, remote insulin, insulin μU/mL)
  // p: {G0, p1, p2, p3, n, k, V}
  var G=state[0],X=state[1],I=state[2];
  var dG=-(p.p1+X)*G+p.p1*p.Gb+p.meal;
  var dX=-p.p2*X+p.p3*(I-p.Ib);
  var dI=-p.n*(I-p.Ib)+p.insulinInput;
  return [G+dG*dt, X+dX*dt, I+dI*dt];
}

/* Pharmacokinetics - 1 and 2 compartment */
function pkOneComp(dose,bioavail,ka,ke,Vd,t){
  // One-compartment with first-order absorption
  if(ka===0)return (dose*bioavail/Vd)*Math.exp(-ke*t);
  return (dose*bioavail*ka/(Vd*(ka-ke)))*(Math.exp(-ke*t)-Math.exp(-ka*t));
}
function pkTwoComp(dose,A,B,alpha,beta,t){
  return dose*(A*Math.exp(-alpha*t)+B*Math.exp(-beta*t));
}
function halfLife(ke){return Math.log(2)/ke}

/* ECG waveform synthesis (real P-QRS-T morphology) */
function ecgWave(t,hr){
  // t: time in seconds, hr: heart rate
  var period=60/hr;
  var phase=(t%period)/period;
  var p=0;
  // P wave (0.0-0.1)
  if(phase<0.1)p=0.15*Math.sin(phase/0.1*Math.PI);
  // PR segment (0.1-0.16)
  // QRS complex (0.16-0.24)
  if(phase>=0.16&&phase<0.18)p-=0.1*Math.sin((phase-0.16)/0.02*Math.PI); // Q
  if(phase>=0.18&&phase<0.21)p+=1.0*Math.sin((phase-0.18)/0.03*Math.PI); // R
  if(phase>=0.21&&phase<0.24)p-=0.2*Math.sin((phase-0.21)/0.03*Math.PI); // S
  // ST segment (0.24-0.35)
  // T wave (0.35-0.5)
  if(phase>=0.35&&phase<0.5)p+=0.3*Math.sin((phase-0.35)/0.15*Math.PI);
  // Baseline noise
  p+=randn()*0.01;
  return p;
}

/* Kaplan-Meier survival estimate */
function kaplanMeier(times,events){
  var allTimes=[];
  for(var i=0;i<times.length;i++)allTimes.push({t:times[i],e:events[i]});
  allTimes.sort(function(a,b){return a.t-b.t});
  var n=allTimes.length;
  var survival=1;
  var out=[{t:0,s:1}];
  var atRisk=n;
  for(var i=0;i<allTimes.length;i++){
    if(allTimes[i].e===1){
      survival*=((atRisk-1)/atRisk);
      out.push({t:allTimes[i].t,s:survival});
    }
    atRisk--;
  }
  return out;
}

/* Gompertz tumor growth */
function gompertz(V0,a,b,t){
  return V0*Math.exp((a/b)*(1-Math.exp(-b*t)));
}

/* Henderson-Hasselbalch */
function hhEq(pKa,ratio){return pKa+Math.log10(ratio)}

/* Cardiac output (Fick) */
function fickCO(VO2,CaO2,CvO2){
  // VO2 mL/min, CaO2/CvO2 mL/dL
  return VO2/(CaO2-CvO2)*10/1000; // L/min
}

/* Framingham 10-year CVD risk (simplified) */
function framinghamRisk(p){
  // p: {age, sex, tc, hdl, sbp, smoker, dm, bpTx}
  var lnAge=Math.log(p.age);
  var lnTC=Math.log(p.tc);
  var lnHDL=Math.log(p.hdl);
  var lnSBP=Math.log(p.sbp);
  var s;
  if(p.sex==='M'){
    s=3.112+0.719*lnAge+0.117*lnTC-0.151*lnHDL+0.283*lnSBP-(p.smoker?0.523:0)-(p.dm?0.24:0);
    var mean=23.98,sd=0.887;
  }else{
    s=31.764-0.030*lnAge+0.118*lnTC-0.280*lnHDL+0.222*lnSBP-(p.smoker?0.214:0)-(p.dm?0.24:0);
    var mean=26.193,sd=0.876;
  }
  var z=(s-mean)/sd;
  return 1-Math.pow(0.95,Math.exp(z));
}

/* ══════════════════════════════════════════════════════════
   DRAWING UTILITIES
   ══════════════════════════════════════════════════════════ */
function drawSparkline(ctx,x,y,w,h,values,color,fill){
  if(values.length<2)return;
  var mx=Math.max.apply(null,values),mn=Math.min.apply(null,values);
  if(mx===mn){mx=mn+1}
  ctx.beginPath();
  for(var i=0;i<values.length;i++){
    var px=x+i/(values.length-1)*w;
    var py=y+h-(values[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  if(fill){
    ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,color+'88');g.addColorStop(1,color+'00');
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
}
function drawBars(ctx,x,y,w,h,values,colors,labels){
  var n=values.length;
  var bw=(w-(n-1)*4)/n;
  var mx=Math.max.apply(null,values)||1;
  for(var i=0;i<n;i++){
    var bh=values[i]/mx*h;
    ctx.fillStyle=colors[i%colors.length];
    ctx.fillRect(x+i*(bw+4),y+h-bh,bw,bh);
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.strokeRect(x+i*(bw+4),y+h-bh,bw,bh);
    if(labels){
      ctx.fillStyle='#b090c0';ctx.font='9px monospace';ctx.textAlign='center';
      ctx.fillText(labels[i],x+i*(bw+4)+bw/2,y+h+12);
    }
  }
}
function riskColor(score,max){
  var t=score/max;
  if(t<0.3)return '#40ff90';
  if(t<0.6)return '#ffd040';
  if(t<0.85)return '#ff8040';
  return '#ff4080';
}
function drawGauge(ctx,cx,cy,r,value,max,label,unit){
  var startAngle=Math.PI*0.75;
  var endAngle=Math.PI*2.25;
  var range=endAngle-startAngle;
  // Arc background
  ctx.strokeStyle='rgba(80,40,88,.4)';ctx.lineWidth=12;
  ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);ctx.stroke();
  // Value arc
  var t=clamp(value/max,0,1);
  var vAngle=startAngle+range*t;
  ctx.strokeStyle=riskColor(value,max);ctx.lineWidth=12;
  ctx.beginPath();ctx.arc(cx,cy,r,startAngle,vAngle);ctx.stroke();
  // Center text
  ctx.fillStyle='#f0e0f8';ctx.font='bold '+Math.floor(r*0.5)+'px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(value),cx,cy-5);
  ctx.fillStyle='#b090c0';ctx.font='11px monospace';
  ctx.fillText(label,cx,cy+r*0.5);
  if(unit){ctx.fillText(unit,cx,cy+r*0.7)}
  ctx.textBaseline='alphabetic';
}

function drawVitalTile(ctx,x,y,w,h,color,value,label,unit,min,max,normalRange){
  ctx.fillStyle='rgba(20,8,24,.6)';

function computeNEWS(v){
  var score=0;
  // RR
  if(v.rr<=8||v.rr>=25)score+=3;
  else if(v.rr>=21)score+=2;
  else if(v.rr<=11)score+=1;
  // SpO2
  if(v.spo2<=91)score+=3;
  else if(v.spo2<=93)score+=2;
  else if(v.spo2<=95)score+=1;
  // Temp
  if(v.temp<=35||v.temp>=39.1)score+=2;
  else if(v.temp<=36||v.temp>=38.1)score+=1;
  // BP sys
  if(v.bpSys<=90)score+=3;
  else if(v.bpSys<=100)score+=2;
  else if(v.bpSys<=110)score+=1;
  // HR
  if(v.hr<=40||v.hr>=131)score+=3;
  else if(v.hr>=111)score+=2;
  else if(v.hr<=50||v.hr>=91)score+=1;
  var level=score>=7?'High':score>=5?'Medium':score>=1?'Low':'None';
  return {score:score,level:level};
}

registerModule('bloodgas',{title:'Blood Gas Analysis',icon:'🩸',desc:'ABG interpretation with Winter\'s formula.',init:function(){this.analyze()},
analyze:function(){var b=STATE.bloodgas;
b.ag=anionGap(b.na,b.cl,b.hco3);
b.winter=winterFormula(b.hco3);
b.deltaRatio=deltaRatio(b.ag,b.hco3);
// Determine primary disorder
var disorder='Normal';
var comp='Appropriate';
if(b.pH<7.35){
  if(b.pCO2>45){
    // Respiratory acidosis
    var acuteExp=b.hco3+((b.pCO2-40)*0.1);
    var chronicExp=b.hco3+((b.pCO2-40)*0.35);
    if(Math.abs(b.hco3-acuteExp)<2)comp='Acute (no compensation)';
    else if(Math.abs(b.hco3-chronicExp)<2)comp='Chronic (renal compensation)';
    disorder='Respiratory Acidosis';
  }else if(b.hco3<22){
    disorder='Metabolic Acidosis';
    var expected=b.winter.expected;
    if(b.pCO2<expected-2)comp='Additional respiratory alkalosis';
    else if(b.pCO2>expected+2)comp='Additional respiratory acidosis';
    else comp='Appropriate respiratory compensation';
  }
}else if(b.pH>7.45){
  if(b.pCO2<35){
    disorder='Respiratory Alkalosis';
    var acuteExp2=b.hco3-((40-b.pCO2)*0.2);
    var chronicExp2=b.hco3-((40-b.pCO2)*0.5);
    if(Math.abs(b.hco3-chronicExp2)<2)comp='Chronic';
    else comp='Acute';
  }else if(b.hco3>26){
    disorder='Metabolic Alkalosis';
    comp='Variable compensation';
  }
}

/* ══════ 11. DIABETES MODEL (Bergman) ══════ */
registerModule('diabetes',{title:'Diabetes Model',icon:'🍰',desc:'Bergman minimal model of glucose-insulin.',init:function(){this.reset()},
reset:function(){var d=STATE.diabetes;d.t=0;d.history=[];d.mealSchedule=[{t:30,carb:50},{t:180,carb:60},{t:360,carb:40}]},
tick:function(dt){STATE.time+=dt;var d=STATE.diabetes;if(!STATE.playing)return;
var sub=Math.floor(dt*20);dt=0.05;
for(var i=0;i<sub;i++){
  // Meal effect
  var meal=0;
  d.mealSchedule.forEach(function(m){
    if(Math.abs(d.t-m.t)<15)meal+=m.carb*0.5;
  });
  // Insulin input (basal + bolus)
  var insulinInput=1+d.insulinInput;
  var p={
    Gb:d.Gb,
    Ib:d.Ib,
    p1:0.03,
    p2:0.03,
    p3:5e-5,
    n:0.1,
    meal:meal
  };
  var state=[d.G,d.X,d.I];
  state=bergmanStep(state,p,dt);
  d.G=Math.max(20,Math.min(600,state[0]));
  d.X=state[1];
  d.I=Math.max(0,Math.min(200,state[2]));
  d.t+=dt;
}
d.history.push({t:d.t,G:d.G,I:d.I});
if(d.history.length>3000)d.history.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050210';ctx.fillRect(0,0,W,H);
var d=STATE.diabetes;
/* Glucose chart */
var cx=60,cy=60,cw=W-120,ch=H*0.5;
ctx.fillStyle='rgba(20,8,24,.6)';
ctx.fillRect(cx,cy,cw,ch);
ctx.strokeStyle='rgba(255,64,128,.3)';ctx.lineWidth=1;ctx.strokeRect(cx,cy,cw,ch);
/* Grid */
ctx.strokeStyle='rgba(255,64,128,.1)';
for(var i=0;i<=5;i++){ctx.beginPath();ctx.moveTo(cx,cy+i*ch/5);ctx.lineTo(cx+cw,cy+i*ch/5);ctx.stroke()}
/* Draw glucose */
if(d.history.length>1){
  ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();
  d.history.forEach(function(x,i){
    var px=cx+i/d.history.length*cw;
    var py=cy+ch-(x.G/300)*ch;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  });
  ctx.stroke();
  /* Insulin */
  ctx.strokeStyle='#40e0ff';ctx.lineWidth=1.5;ctx.beginPath();
  d.history.forEach(function(x,i){
    var px=cx+i/d.history.length*cw;
    var py=cy+ch-(x.I/100)*ch;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  });
  ctx.stroke();
}
/* Target band */
var targetLow=cy+ch-(70/300)*ch;
var targetHigh=cy+ch-(140/300)*ch;
ctx.fillStyle='rgba(64,255,144,.1)';
ctx.fillRect(cx,targetHigh,cw,targetLow-targetHigh);
ctx.strokeStyle='rgba(64,255,144,.4)';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(cx,targetHigh);ctx.lineTo(cx+cw,targetHigh);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx,targetLow);ctx.lineTo(cx+cw,targetLow);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#40ff90';ctx.font='10px monospace';
ctx.fillText('70',cx-25,targetLow+4);
ctx.fillText('140',cx-30,targetHigh+4);
/* Info */
ctx.fillStyle='rgba(20,8,24,.9)';
ctx.fillRect(cx,cy+ch+30,cw,150);
ctx.strokeStyle='#ff4080';ctx.strokeRect(cx,cy+ch+30,cw,150);
ctx.fillStyle='#ff4080';ctx.font='bold 13px monospace';
ctx.fillText('BERGMAN MINIMAL MODEL',cx+12,cy+ch+52);
ctx.fillStyle='#b090c0';ctx.font='11px monospace';
ctx.fillText('Tempo: '+fmt(d.t,1)+' min',cx+12,cy+ch+74);
ctx.fillStyle='#40ff90';ctx.font='bold 16px monospace';
ctx.fillText('Glicose: '+fmt(d.G,0)+' mg/dL',cx+12,cy+ch+100);

registerModule('tumor',{title:'Tumor Growth',icon:'🔬',desc:'Gompertz model with treatment response.',init:function(){this.reset()},
reset:function(){var t=STATE.tumor;t.t=0;t.history=[];t.V=t.V0;t.cycles=[]},
tick:function(dt){STATE.time+=dt;var t=STATE.tumor;if(!STATE.playing)return;
var sub=Math.floor(dt*10);var ddt=0.1;
for(var i=0;i<sub;i++){
  var growth=t.a*t.V*Math.log(t.b*Math.log(1/t.V)+1);
  // Simplified Gompertz: dV/dt = a·V·ln(K/V), K=1
  var K=1;
  var dV=t.a*t.V*Math.log(K/Math.max(t.V,1e-6));
  // Treatment effect
  if(t.treatment>0)dV-=t.response*t.V*0.5;
  t.V=Math.max(1e-6,Math.min(1,t.V+dV*ddt));
  // Record treatment cycles
  if(t.treatment>0&&t.cycles.length<10&&Math.random()<0.005){
    t.cycles.push({t:t.t,V:t.V});
  }
  t.t+=ddt;
}
t.history.push({t:t.t,V:t.V});
if(t.history.length>3000)t.history.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050210';ctx.fillRect(0,0,W,H);
var t=STATE.tumor;
/* Chart */
var cx=60,cy=60,cw=W-120,ch=H*0.5;
ctx.fillStyle='rgba(20,8,24,.6)';
ctx.fillRect(cx,cy,cw,ch);
ctx.strokeStyle='rgba(255,64,128,.3)';ctx.strokeRect(cx,cy,cw,ch);
/* Log scale Y */
ctx.fillStyle='#b090c0';ctx.font='10px monospace';
for(var i=0;i<=4;i++){
  var y=cy+i*ch/4;
  ctx.fillText('10^'+(-1-i),cx-35,y+4);
  ctx.strokeStyle='rgba(255,64,128,.1)';ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx+cw,y);ctx.stroke();
}
/* Curve */
if(t.history.length>1){
  ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.beginPath();
  t.history.forEach(function(x,i){
    var px=cx+i/t.history.length*cw;
    var logV=Math.log10(Math.max(x.V,1e-6));
    var py=cy+ch-(-logV-1)/4*ch;
    py=cy+(logV+5)/4.5*ch;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  });
  ctx.stroke();
}
/* Treatment cycles */
t.cycles.forEach(function(c){
  var idx=Math.floor(c.t/Math.max(t.t,1)*t.history.length);
  var px=cx+idx/t.history.length*cw;
  ctx.strokeStyle='#ffd040';ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,cy+ch);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#ffd040';ctx.font='9px monospace';
  ctx.fillText('R×',px-6,cy+15);
});
/* Info */
ctx.fillStyle='rgba(20,8,24,.9)';
ctx.fillRect(cx,cy+ch+30,cw,140);
ctx.strokeStyle='#ff4080';ctx.strokeRect(cx,cy+ch+30,cw,140);
ctx.fillStyle='#ff4080';ctx.font='bold 13px monospace';
ctx.fillText('GOMPERTZ TUMOR MODEL',cx+12,cy+ch+52);
ctx.fillStyle='#b090c0';ctx.font='11px monospace';
ctx.fillText('Tempo: '+fmt(t.t,1)+' u',cx+12,cy+ch+74);
ctx.fillText('V(t) = '+fmt(t.V*100,4)+'% do máx',cx+12,cy+ch+92);
ctx.fillStyle='#40ff90';ctx.font='bold 14px monospace';
var vol=t.V*1e9; // assume 1 unit = 1e9 cells
ctx.fillText('Células: '+vol.toExponential(2),cx+12,cy+ch+116);
ctx.fillStyle='#ffd040';
ctx.fillText('Diâmetro ≈ '+fmt(Math.pow(vol,1/3)*0.01*2,2)+' mm',cx+12,cy+ch+138);
setStats('<div>V: '+fmt(t.V,5)+'</div><div>t: '+fmt(t.t,1)+'</div>');
badge('🔬 Tumor · V='+fmt(t.V,4));SV('sbMode','Tumor')},

registerModule('kaplan',{title:'Kaplan-Meier Survival',icon:'📉',desc:'Survival curves with log-rank test.',init:function(){this.generate()},
generate:function(){var k=STATE.kaplan;k.times=[];k.events=[];
for(var i=0;i<k.n;i++){
  // Exponential with HR adjustment
  var rate=0.05;
  var t=-Math.log(Math.random())/rate;
  var event=Math.random()<0.7?1:0;
  k.times.push(t);
  k.events.push(event);
}
k.curve=kaplanMeier(k.times,k.events)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050210';ctx.fillRect(0,0,W,H);
var k=STATE.kaplan;
/* Chart */
var cx=60,cy=60,cw=W-120,ch=H*0.6;
ctx.fillStyle='rgba(20,8,24,.6)';
ctx.fillRect(cx,cy,cw,ch);
ctx.strokeStyle='rgba(255,64,128,.3)';ctx.strokeRect(cx,cy,cw,ch);
/* Axes */
ctx.fillStyle='#b090c0';ctx.font='10px monospace';
ctx.fillText('100%',cx-40,cy+5);
ctx.fillText('50%',cx-35,cy+ch/2+5);
ctx.fillText('0%',cx-30,cy+ch+5);
ctx.fillText('Time (months)',cx+cw/2-30,cy+ch+30);
/* Grid */
ctx.strokeStyle='rgba(255,64,128,.1)';
for(var i=0;i<=5;i++){ctx.beginPath();ctx.moveTo(cx,cy+i*ch/5);ctx.lineTo(cx+cw,cy+i*ch/5);ctx.stroke()}
/* KM curve */
if(k.curve&&k.curve.length>1){
  var maxT=k.curve[k.curve.length-1].t;
  ctx.strokeStyle='#40ff90';ctx.lineWidth=2.5;
  ctx.beginPath();
  var prevS=1;
  k.curve.forEach(function(p,i){
    var px=cx+p.t/maxT*cw;
    var py=cy+ch-p.s*ch;
    if(i===0)ctx.moveTo(px,py);
    else{
      ctx.lineTo(px,cy+ch-prevS*ch);
      ctx.lineTo(px,py);
    }
    prevS=p.s;
  });
  ctx.lineTo(cx+cw,cy+ch-prevS*ch);
  ctx.stroke();
}
/* Info */
ctx.fillStyle='rgba(20,8,24,.9)';
ctx.fillRect(cx,cy+ch+50,cw,120);
ctx.strokeStyle='#ff4080';ctx.strokeRect(cx,cy+ch+50,cw,120);
ctx.fillStyle='#ff4080';ctx.font='bold 13px monospace';
ctx.fillText('KAPLAN-MEIER ANALYSIS',cx+12,cy+ch+72);
ctx.fillStyle='#b090c0';ctx.font='11px monospace';
ctx.fillText('N = '+k.n+' pacientes',cx+12,cy+ch+92);
ctx.fillText('Eventos: '+k.events.filter(function(e){return e}).length,cx+12,cy+ch+110);
ctx.fillText('Censurados: '+k.events.filter(function(e){return !e}).length,cx+12,cy+ch+128);
if(k.curve.length>0){
  var mst=k.curve.find(function(p){return p.s<=0.5});
  ctx.fillStyle='#40ff90';ctx.font='bold 14px monospace';
  ctx.fillText('Median survival: '+(mst?fmt(mst.t,1)+' meses':'> ' + fmt(k.curve[k.curve.length-1].t,1)),cx+12,cy+ch+152);
}
setStats('<div>N: '+k.n+'</div><div>Events: '+k.events.filter(function(e){return e}).length+'</div>');
badge('📉 KM · '+k.n+' patients');SV('sbMode','KM')},

registerModule('shock',{title:'Hemodynamics',icon:'💉',desc:'Shock classification by invasive parameters.',init:function(){this.classify()},
classify:function(){var s=STATE.shock;
s.map=s.bpDia+(s.bpSys-s.bpDia)/3;
s.svr=((s.map-s.cvp)/s.co)*80;
s.ci=s.co/1.7; // per BSA=1.7m²
// Classify shock type
if(s.ci<2.2&&s.svr>1600&&s.paop<18)s.type='Hypovolemic';
else if(s.ci<2.2&&s.svr>1600&&s.paop<18&&s.cvp<5)s.type='Hypovolemic';
else if(s.ci<2.2&&s.svr<800)s.type='Distributive (septic/neurogenic)';
else if(s.ci<2.2&&s.paop>18)s.type='Cardiogenic';
else if(s.svr>1400&&s.ci>2.2)s.type='Obstructive (PE/tamponade)';
else s.type='Normal';
// Mixed shock
if(s.ci<2.2&&s.svr>1600&&s.cvp>15)s.type='Cardiac tamponade / RV failure'},

registerModule('acidbase',{title:'Acid-Base Balance',icon:'⚖',desc:'Step-by-step ABG interpretation.',init:function(){this.analyze()},
analyze:function(){var a=STATE.acidbase;
a.ag=anionGap(a.na,a.cl,a.hco3);
a.winter=winterFormula(a.hco3);
a.deltaRatio=deltaRatio(a.ag,a.hco3);
// Step-by-step
a.steps=[];
a.steps.push({step:1,text:'pH = '+a.pH+' → '+(a.pH<7.35?'Acidemia':a.pH>7.45?'Alkalemia':'Normal')});
if(a.pH<7.35){
  if(a.pCO2>45){a.steps.push({step:2,text:'Primary respiratory acidosis (↑pCO₂)'})}
  else if(a.hco3<22){a.steps.push({step:2,text:'Primary metabolic acidosis (↓HCO₃⁻)'})}
}else if(a.pH>7.45){
  if(a.pCO2<35){a.steps.push({step:2,text:'Primary respiratory alkalosis (↓pCO₂)'})}
  else if(a.hco3>26){a.steps.push({step:2,text:'Primary metabolic alkalosis (↑HCO₃⁻)'})}
}
if(a.ag>12)a.steps.push({step:3,text:'Anion gap elevated = '+fmt(a.ag,1)+' → check MUDPILES'});
else a.steps.push({step:3,text:'Anion gap normal = '+fmt(a.ag,1)});
a.steps.push({step:4,text:'Winter: expected pCO₂ = '+fmt(a.winter.low,1)+'-'+fmt(a.winter.high,1)});
a.steps.push({step:5,text:'Delta ratio = '+fmt(a.deltaRatio,2)});
if(a.deltaRatio<0.4)a.steps.push({step:6,text:'Pure normal-AG metabolic acidosis'});
else if(a.deltaRatio<1)a.steps.push({step:6,text:'Mixed normal + high AG acidosis'});
else if(a.deltaRatio<2)a.steps.push({step:6,text:'Pure high AG metabolic acidosis'});
else a.steps.push({step:6,text:'Mixed high AG acidosis + metabolic alkalosis'});
},

registerModule('resp',{title:'Respiratory Mechanics',icon:'🌬',desc:'Lung compliance, resistance, waveforms.',init:function(){this.reset()},
reset:function(){var r=STATE.resp;r.t=0;r.history=[];r.volume=0},
tick:function(dt){STATE.time+=dt;var r=STATE.resp;if(!STATE.playing)return;
var sub=Math.floor(dt*50);var ddt=0.02;
for(var i=0;i<sub;i++){
  var period=60/r.rr;
  var phase=(r.t%period)/period;
  // Square or sine flow
  var flow;
  if(r.mode==='CMV'||r.mode==='AC'){
    flow=phase<0.4?30:-30;
  }else{
    flow=20*Math.sin(phase*Math.PI*2);
  }
  // Compliance effect on pressure
  r.paw=flow*r.resistance+(r.volume+r.peep*r.compliance)/r.compliance;
  r.volume+=flow*ddt;
  if(phase>0.9)r.volume=Math.max(0,r.volume*0.9);
  r.flow=flow;
  r.t+=ddt;
  r.history.push({t:r.t,V:r.volume,P:r.paw,F:r.flow});
  if(r.history.length>2000)r.history.shift();
}
},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050210';ctx.fillRect(0,0,W,H);
var r=STATE.resp;
/* 3 stacked charts */
var charts=[
  {y:30,label:'Pressure (cm H₂O)',color:'#ff4080',key:'P',min:0,max:40},
  {y:H/3+20,label:'Flow (L/min)',color:'#40e0ff',key:'F',min:-50,max:50},
  {y:2*H/3+10,label:'Volume (mL)',color:'#40ff90',key:'V',min:0,max:800}
];
charts.forEach(function(ch){
  var cx=60,cy=ch.y,cw=W-120,chh=H/3-40;
  ctx.fillStyle='rgba(20,8,24,.6)';
  ctx.fillRect(cx,cy,cw,chh);
  ctx.strokeStyle='rgba(255,64,128,.3)';
  ctx.strokeRect(cx,cy,cw,chh);
  ctx.fillStyle=ch.color;ctx.font='bold 11px monospace';
  ctx.fillText(ch.label,cx+8,cy-5);
  // Y axis ref
  var zeroY=cy+chh*(1-(0-ch.min)/(ch.max-ch.min));
  ctx.strokeStyle='rgba(255,64,128,.2)';ctx.beginPath();
  ctx.moveTo(cx,zeroY);ctx.lineTo(cx+cw,zeroY);ctx.stroke();
  if(r.history.length>1){
    ctx.strokeStyle=ch.color;ctx.lineWidth=1.5;
    ctx.beginPath();
    r.history.forEach(function(h,i){
      var px=cx+i/r.history.length*cw;
      var v=h[ch.key];
      var py=cy+chh-(v-ch.min)/(ch.max-ch.min)*chh;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.stroke();
  }
});
setStats('<div>RR: '+r.rr+'</div><div>Vt: '+r.Vt+'</div><div>Ppeak: '+fmt(r.paw,1)+'</div><div>PEEP: '+r.peep+'</div>');
badge('🌬 Resp · Ppeak='+fmt(r.paw,1)+' cmH₂O');SV('sbMode','Resp')},

registerModule('ecmo',{title:'ECMO Physiology',icon:'🫀',desc:'Extracorporeal membrane oxygenation.',init:function(){this.compute()},
compute:function(){var e=STATE.ecmo;
// O2 delivery: DO2 = CO × CaO2 × 10
e.delivery=(e.flow*e.hb*1.34*e.satPost/100)*10; // mL O2/min
// CO2 removal (sweep gas dependent)
e.co2Removal=e.sweep*20;
// Oxygenation before/after
e.o2Content=e.hb*1.34*(e.satPost/100)+(0.003*100);
// Recirculation (VV ECMO): if femoral-return, ↑ recirc
if(e.mode==='VV')e.recirculation=0.15;
else if(e.mode==='VA')e.recirculation=0.05;
else e.recirculation=0.10;
e.effectiveFlow=e.flow*(1-e.recirculation);
// Oxygenation contribution

registerModule('brain',{title:'EEG Monitor',icon:'📡',desc:'Brain waves across sleep/awake states.',init:function(){var b=STATE.brain;b.t=0;b.history=[]},
tick:function(dt){STATE.time+=dt;var b=STATE.brain;if(!STATE.playing)return;
b.t+=dt;
var sub=Math.floor(dt*100);var ddt=0.01;
for(var i=0;i<sub;i++){
  var sample=[];
  b.channels.forEach(function(ch,ci){
    var val=0;
    // Frequency bands based on state
    if(b.state==='awake'){
      val=10*Math.sin(2*Math.PI*10*b.t)+3*Math.sin(2*Math.PI*20*b.t+ci);
    }else if(b.state==='drowsy'){
      val=20*Math.sin(2*Math.PI*7*b.t)+5*Math.sin(2*Math.PI*15*b.t+ci);
    }else if(b.state==='NREM1'){
      val=30*Math.sin(2*Math.PI*5*b.t)+8*Math.sin(2*Math.PI*12*b.t+ci);
    }else if(b.state==='NREM2'){
      val=15*Math.sin(2*Math.PI*3*b.t)+60*Math.sin(2*Math.PI*14*b.t)*(Math.random()<0.05?1:0);
    }else if(b.state==='NREM3'){
      val=50*Math.sin(2*Math.PI*1.5*b.t)+10*Math.sin(2*Math.PI*8*b.t+ci);
    }else if(b.state==='REM'){
      val=8*Math.sin(2*Math.PI*15*b.t)+5*Math.sin(2*Math.PI*25*b.t+ci);
    }else if(b.state==='seizure'){
      val=80*Math.sin(2*Math.PI*3*b.t)*(1+0.3*Math.sin(2*Math.PI*0.5*b.t))*(Math.random()*0.5+0.75);
    }
    val+=randn()*2;
    sample.push({ch:ch,v:val});
  });
  b.history.push({t:b.t,samples:sample});
  b.t+=ddt;
}
if(b.history.length>800)b.history.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#050210';ctx.fillRect(0,0,W,H);
var b=STATE.brain;
/* Title */
ctx.fillStyle='#ff4080';ctx.font='bold 14px monospace';
ctx.fillText('EEG MONITOR — '+b.channels.length+' channels · '+b.state,30,25);
/* Channels stacked */
var startY=50;
var chH=(H-startY-120)/b.channels.length;
b.channels.forEach(function(ch,ci){
  var cy=startY+ci*chH+chH/2;
  ctx.strokeStyle='rgba(255,64,128,.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(60,cy);ctx.lineTo(W-20,cy);ctx.stroke();
  ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';
  ctx.fillText(ch,20,cy+4);
  // Trace
  ctx.strokeStyle='#40ff90';ctx.lineWidth=1.2;
  ctx.beginPath();
  b.history.forEach(function(s,i){
    var sample=s.samples[ci];
    if(!sample)return;
    var x=60+i/b.history.length*(W-80);
    var y=cy-sample.v*chH/300;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
});
/* Info panel */
var iy=H-100;
ctx.fillStyle='rgba(20,8,24,.9)';
ctx.fillRect(30,iy,W-60,80);
ctx.strokeStyle='#ff4080';ctx.strokeRect(30,iy,W-60,80);
ctx.fillStyle='#ff4080';ctx.font='bold 12px monospace';
ctx.fillText('BRAIN STATE: '+b.state.toUpperCase(),45,iy+22);
ctx.fillStyle='#b090c0';ctx.font='11px monospace';
var info={
  'awake':'Alpha (8-13 Hz) + Beta (13-30 Hz) · eyes closed dominant',
  'drowsy':'Theta (4-8 Hz) predominant · transition',
  'NREM1':'Theta activity, slow eye movements',
  'NREM2':'Spindles (12-14 Hz) + K-complexes',
  'NREM3':'Delta (0.5-4 Hz) · slow-wave sleep · arousal threshold ↑',
  'REM':'Desynchronized, low-voltage, mixed frequency (like awake)',
  'seizure':'⚠ RHYTHMIC HIGH-VOLTAGE 3 Hz spike-wave (absence)'
};
ctx.fillText(info[b.state]||'',45,iy+45);
ctx.fillText('Sample: '+fmt(b.t,2)+'s',45,iy+65);
setStats('<div>State: '+b.state+'</div><div>Channels: '+b.channels.length+'</div>');
badge('📡 EEG · '+b.state);SV('sbMode','EEG')},

[['awake','Awake'],['drowsy','Drowsy'],['NREM1','N1'],['NREM2','N2'],['NREM3','N3'],['REM','REM'],['seizure','Seizure']].forEach(function(s){

function buildTabs(){var t=$('tbTabs');t.innerHTML='';
TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});
i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;
$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});
var m=MODULES[k];
SV('sbMode',(m&&m.title)||k);
try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}
renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;
$$('.rp-tab').forEach(function(t){t.classList.remove('active')});
e.classList.add('active');
$$('.rp-pane').forEach(function(p){p.classList.remove('active')});
var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
if(p)p.classList.add('active');
renderRightPanel()}
function renderLeftPanel(){
  var b=$('lpBody');if(!b)return;
  var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}

  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});
h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['clinical','paper','scrubs','dark'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){openModal('❓ MEDIX — Clinical Analytics Studio','<div class="sec" style="border-left:3px solid #ff4080;padding-left:12px;background:rgba(255,64,128,.1);padding:10px;border-radius:4px"><div style="font-size:.68rem;color:#ff4080;font-weight:700;margin-bottom:6px">⚠ AVISO IMPORTANTE</div><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">Este software é <b>exclusivamente educacional e de simulação</b>. Não deve ser usado para decisões clínicas reais. Sempre consulte profissionais de saúde habilitados e diretrizes atualizadas.</div></div><div class="sec"><h4>🏥 24 Módulos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">MONITORIZAÇÃO</b><br>ECG · Vitals · EEG · Ventilator · ECMO<br><br><b style="color:var(--p1)">LABORATÓRIO</b><br>Blood Gas · Acid-Base · Renal<br><br><b style="color:var(--p1)">ESCORES CLÍNICOS</b><br>APACHE II · SOFA · GCS · Wells · CHA₂DS₂-VASc<br>Framingham · qSOFA · Hemodynamics<br><br><b style="color:var(--p1)">FARMACOLOGIA</b><br>PK · Drug Interactions<br><br><b style="color:var(--p1)">MODELAGEM</b><br>Diabetes (Bergman) · Tumor (Gompertz) · Kaplan-Meier<br><br><b style="color:var(--p1)">EMERGÊNCIA</b><br>ACLS Cardiac Arrest · Sepsis Screening</div></div><div class="sec"><h4>🔬 Algoritmos Reais</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">• APACHE II (Knaus 1985) · SOFA (Vincent 1996)<br>• CKD-EPI 2021 · Bergman minimal model<br>• Gompertz tumor · Kaplan-Meier (1958)<br>• CHA₂DS₂-VASc (Lip 2010) · Wells DVT<br>• Framingham (D\'Agostino 2008)<br>• Winter\'s formula · Anion gap · Delta ratio<br>• CYP450 interactions database</div></div><div class="sec"><h4>⌨️ Atalhos</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Space=Play · →=Step · R=Reset · T=Tema · ?=Help</div></div>','<button class="btn primary" onclick="closeModal()">Entendido</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#050210';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#ff4080';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('MEDIX ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('MEDIX ready — 24 módulos clínicos (educacional)','success',3000);
});
