<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocialNova</title>
<style>
:root{--bg:#0a0e1a;--c:#06b6d4;--card:#111827;--bd:#1f2937;--txt:#e5e7eb;--mut:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:grid;grid-template-columns:220px 1fr 280px;gap:20px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:900px){body{grid-template-columns:1fr}}
aside{position:sticky;top:16px;height:fit-content}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;margin-bottom:20px;color:var(--c)}
.logo .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#0891b2);display:grid;place-items:center;font-size:20px}
nav button{background:transparent;border:0;color:var(--txt);padding:12px 16px;width:100%;text-align:left;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;transition:.15s;display:flex;align-items:center;gap:12px;margin-bottom:4px}
nav button:hover{background:var(--card)}
nav button.on{background:var(--card);color:var(--c)}
nav button .b{margin-left:auto;background:var(--c);color:#000;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.compose{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.compose textarea{width:100%;background:transparent;border:0;color:var(--txt);font-size:15px;font-family:inherit;resize:none;outline:0;min-height:80px;line-height:1.5}
.compose textarea::placeholder{color:var(--mut)}
.compose .bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:12px;margin-top:8px}
.compose .cbtn{background:var(--c);color:#000;border:0;padding:9px 20px;border-radius:20px;cursor:pointer;font-weight:800;font-size:13px;font-family:inherit;transition:.15s}
.compose .cbtn:disabled{opacity:.4;cursor:not-allowed}
.compose .cbtn:hover:not(:disabled){filter:brightness(1.15)}
.post{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.post .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--c),#0891b2);display:grid;place-items:center;color:#000;font-weight:800;flex-shrink:0}
.post .head .info{flex:1}
.post .head .name{font-weight:700;font-size:14px}
.post .head .time{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace}
.post .content{font-size:15px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.post .actions{display:flex;gap:6px;border-top:1px solid var(--bd);padding-top:10px}
.post .actions button{background:transparent;border:0;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:5px;transition:.15s}
.post .actions button:hover{background:rgba(6,182,212,.1);color:var(--c)}
.post .actions button.liked{color:#ef4444}
.post .actions button.liked:hover{color:#ef4444}
.comment-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.comment{background:rgba(255,255,255,.03);border-radius:8px;padding:8px 12px;font-size:13px}
.comment .cn{font-weight:700;font-size:11px;color:var(--c);margin-bottom:3px}
.sidebox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.sidebox h3{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:12px}
.trend{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;cursor:pointer}
.trend:last-child{border:0}
.trend .tag{color:var(--c);font-weight:700}
.trend .cnt{font-size:11px;color:var(--mut)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.user-row .avatar{width:32px;height:32px;font-size:12px}
.user-row .n{flex:1;font-size:13px;font-weight:600}
.user-row button{background:var(--c);color:#000;border:0;padding:5px 12px;border-radius:15px;cursor:pointer;font-size:11px;font-weight:800;font-family:inherit}
.mut{color:var(--mut);text-align:center;padding:30px 10px;font-size:13px}
</style></head><body>
<aside><div class="logo"><div class="ic">🌐</div>SocialNova</div>
<nav>
<button class="on" data-tab="feed"><span>🏠</span>Início</button>
<button data-tab="explore"><span>🔍</span>Explorar</button>
<button data-tab="profile"><span>👤</span>Meu perfil</button>
<button data-tab="saved"><span>🔖</span>Salvos<span class="b" id="savedCount">0</span></button>
</nav></aside>
<main>
<div class="compose">
<textarea id="txt" placeholder="O que está acontecendo?" maxlength="500"></textarea>
<div class="bottom"><span style="font-size:12px;color:var(--mut)" id="cnt">0/500</span><button class="cbtn" id="post" disabled>Postar</button></div>
</div>
<div id="feed"></div>
</main>
<aside>
<div class="sidebox"><h3>Em alta</h3><div id="trends"></div></div>
<div class="sidebox"><h3>Sugestões</h3><div id="suggest"></div></div>
</aside>
<script>
const $=s=>document.querySelector(s);
const KEY='socialnova.v1';
let posts=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentUser={name:'Você',handle:'voce'};
const fakeUsers=['Ana Lima','Bruno Costa','Carla Dias','Diego Reis','Eva Souza','Felipe Melo','Gabi Nunes','Hugo Alves'];
const fakeTexts=['Acabei de lançar meu novo projeto! 🚀','Alguém aí já testou a nova atualização?','Dia produtivo hoje 💪','Reflexão: o tempo passa rápido demais','Alguém recomenda um bom livro?','Trabalhando em algo novo... fiquem ligados','Sexta chegou! 🎉','Aprendendo coisas novas todos os dias'];
function seed(){
  if(posts.length)return;
  for(let i=0;i<6;i++){
    posts.push({id:Date.now()+i,user:fakeUsers[i%fakeUsers.length],text:fakeTexts[i],ts:Date.now()-i*3600000,likes:Math.floor(Math.random()*50),comments:[],liked:false,saved:false});
  }
  save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(posts))}
function timeAgo(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return 'agora';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
function render(){
  const feed=$('#feed');
  if(!posts.length){feed.innerHTML='<div class="mut">Nenhum post ainda. Seja o primeiro!</div>';return}
  feed.innerHTML=posts.slice().sort((a,b)=>b.ts-a.ts).map(p=>`
    <div class="post" data-id="${p.id}">
      <div class="head">
        <div class="avatar">${p.user.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
        <div class="info"><div class="name">${p.user}</div><div class="time">${timeAgo(p.ts)}</div></div>
      </div>
      <div class="content">${p.text.replace(/</g,'&lt;')}</div>
      <div class="actions">
        <button class="${p.liked?'liked':''}" data-a="like" data-id="${p.id}">${p.liked?'❤️':'🤍'} ${p.likes}</button>
        <button data-a="comment" data-id="${p.id}">💬 ${p.comments.length}</button>
        <button data-a="share" data-id="${p.id}">🔗 Compartilhar</button>
        <button data-a="save" data-id="${p.id}">${p.saved?'🔖':'📑'} ${p.saved?'Salvo':'Salvar'}</button>
      </div>
      ${p.comments.length?`<div class="comment-list">${p.comments.map(c=>`<div class="comment"><div class="cn">${c.user}</div>${c.text.replace(/</g,'&lt;')}</div>`).join('')}</div>`:''}
    </div>`).join('');
  feed.querySelectorAll('[data-a]').forEach(b=>{
    b.onclick=()=>act(b.dataset.a,b.dataset.id);
  });
  $('#savedCount').textContent=posts.filter(p=>p.saved).length;
  renderTrends();
}
function act(a,id){
  const p=posts.find(x=>x.id==id);if(!p)return;
  if(a==='like'){p.liked=!p.liked;p.likes+=(p.liked?1:-1)}
  else if(a==='save'){p.saved=!p.saved}
  else if(a==='comment'){const t=prompt('Comentário:');if(t&&t.trim())p.comments.push({user:currentUser.name,text:t.trim()})}
  else if(a==='share'){const url=location.href+'#post-'+id;navigator.clipboard?.writeText(url).then(()=>alert('Link copiado!'))}
  save();render();
}
function renderTrends(){
  const tags=['#tecnologia','#design','#IA','#startup','#marketing','#dev'];
  $('#trends').innerHTML=tags.map(t=>`<div class="trend"><div class="tag">${t}</div><div class="cnt">${Math.floor(Math.random()*1000)+100} posts</div></div>`).join('');
  $('#suggest').innerHTML=fakeUsers.slice(0,4).map(u=>`<div class="user-row"><div class="avatar">${u.split(' ').map(x=>x[0]).join('')}</div><div class="n">${u}</div><button>Seguir</button></div>`).join('');
}
$('#txt').addEventListener('input',e=>{
  const n=e.target.value.length;
  $('#cnt').textContent=n+'/500';
  $('#post').disabled=n===0;
});
$('#post').onclick=()=>{
  const t=$('#txt').value.trim();
  if(!t)return;
  posts.push({id:Date.now(),user:currentUser.name,text:t,ts:Date.now(),likes:0,comments:[],liked:false,saved:false});
  save();$('#txt').value='';$('#cnt').textContent='0/500';$('#post').disabled=true;render();
};
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const tab=b.dataset.tab;
    if(tab==='saved'){posts=posts;renderSaved()}
    else render();
  };
});
function renderSaved(){
  const feed=$('#feed');
  const list=posts.filter(p=>p.saved);
  if(!list.length){feed.innerHTML='<div class="mut">Nenhum post salvo</div>';return}
  feed.innerHTML=list.map(p=>`<div class="post"><div class="head"><div class="avatar">${p.user.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="info"><div class="name">${p.user}</div><div class="time">${timeAgo(p.ts)}</div></div></div><div class="content">${p.text.replace(/</g,'&lt;')}</div></div>`).join('');
}
seed();render();
</script></body></html>
