<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TECTONIC-OS | Construction Engine</title>
<style>
:root {
  --bg: #06080a; --desktop: #0a0f18; --window-bg: rgba(15, 22, 35, 0.9);
  --border: #1f2e45; --text: #8ea4c6; --text-light: #e0e8f5;
  --accent: #00f0ff; --accent2: #ff6b00; --success: #00ff88;
  --font-mono: "Fira Code", monospace; --font-ui: system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

#desktop { width: 100%; height: 100%; position: relative; background-image: linear-gradient(rgba(10,15,24,0.8) 1px, transparent 1px), linear-gradient(90deg, rgba(10,15,24,0.8) 1px, transparent 1px); background-size: 30px 30px; display: none; }

#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); z-index: 1; }
canvas { display: block; outline: none; touch-action: none; }

#taskbar { position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: rgba(6, 8, 10, 0.95); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; gap: 15px; z-index: 1000; backdrop-filter: blur(10px); }
.tb-logo { font-family: var(--font-mono); font-weight: 900; color: var(--accent2); font-size: 1.1rem; letter-spacing: 2px; }
.tb-apps { display: flex; gap: 10px; flex: 1; }
.tb-icon { width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; border-radius: 6px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; background: rgba(255,255,255,0.05); }
.tb-icon:hover { background: rgba(0, 240, 255, 0.15); color: var(--accent); }
.tb-stats { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent2); display: flex; gap: 15px; }

.window { position: absolute; background: var(--window-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; min-width: 280px; min-height: 200px; overflow: hidden; backdrop-filter: blur(15px); transform: scale(0.95); opacity: 0; transition: 0.2s; z-index: 10; }
.window.open { transform: scale(1); opacity: 1; }
.window-header { height: 35px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 10px; cursor: grab; }
.window-title { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-light); display: flex; align-items: center; gap: 8px; }
.window-controls { display: flex; gap: 8px; }
.win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
.win-close { background: #ff5f56; }
.window-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

.builder-controls { display: flex; flex-direction: column; gap: 10px; }
.block-btn { background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); transition: 0.2s; }
.block-btn:hover { border-color: var(--accent); color: var(--accent); }
.block-btn.active { border-color: var(--accent); background: rgba(0, 240, 255, 0.1); color: var(--accent); }
.block-btn .price { font-size: 0.7rem; color: var(--accent2); }
.btn { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: var(--font-mono); text-transform: uppercase; }
.btn:hover { opacity: 0.8; }
.btn-danger { background: var(--accent2); color: #fff; }
.data-box { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-light); line-height: 1.5; }
.data-box span { color: var(--accent); }
</style>
</head>
<body>

<div id="boot-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 30px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent);">
  <div id="boot-text"></div>
</div>

<div id="desktop">
  <div id="canvas-container"></div>
  
  <div style="position: absolute; top: 15px; left: 15px; width: 250px; z-index: 100; display: flex; flex-direction: column; gap: 10px;">
    <div class="window open" style="position: relative; width: 100%; height: auto;">
      <div class="window-header">
        <div class="window-title">🛠️ Blueprint Builder</div>
      </div>
      <div class="window-body">
        <p style="font-size: 0.7rem; color: #888; margin-bottom: 5px;">Toque no chão para construir.</p>
        <div class="builder-controls">
          <div class="block-btn active" data-type="0" onclick="selectBlock(0)">🧱 Fundação <span class="price">10</span></div>
          <div class="block-btn" data-type="1" onclick="selectBlock(1)">🧱 Parede <span class="price">15</span></div>
          <div class="block-btn" data-type="2" onclick="selectBlock(2)">🪟 Vidro Neon <span class="price">25</span></div>
          <div class="block-btn" data-type="3" onclick="selectBlock(3)">🏠 Telhado <span class="price">20</span></div>
          <div class="block-btn" data-type="4" onclick="selectBlock(4)">⚡ Emissor <span class="price">50</span></div>
        </div>
        <button class="btn btn-danger" style="margin-top: 10px;" onclick="clearBuild()">Demolir Tudo</button>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <div class="tb-logo">⟨T⟩ TECTONIC</div>
    <div class="tb-apps">
      <div class="tb-icon" onclick="openApp('analyzer')" title="Estrutural">📊</div>
      <div class="tb-icon" onclick="openApp('cloud')" title="Salvar Nuvem">☁️</div>
      <div class="tb-icon" onclick="openApp('terminal')" title="Terminal">💻</div>
    </div>
    <div class="tb-stats">
      <div>BLOCOS: <span id="stat-blocks" style="color:#fff;">0</span></div>
      <div>VOLUME: <span id="stat-volume" style="color:#fff;">0 m³</span></div>
      <div>CRÉDITOS: <span id="stat-credits" style="color:var(--success);">10,000</span></div>
    </div>
  </div>
</div>

<div id="windows-container" style="position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); pointer-events: none; z-index: 500;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const container = document.getElementById("canvas-container");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06080a, 0.03);
scene.background = new THREE.Color(0x06080a);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(10, 15, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.enableDamping = true;
controls.dampingFactor = 0.05;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00f0ff, 1, 50);
pointLight.position.set(0, 10, 0);
scene.add(pointLight);

const gridHelper = new THREE.GridHelper(40, 40, 0x1f2e45, 0x111a28);
scene.add(gridHelper);

const planeGeo = new THREE.PlaneGeometry(40, 40);
const planeMat = new THREE.MeshStandardMaterial({ color: 0x0a0f18, roughness: 0.8, metalness: 0.2 });
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -0.01;
plane.receiveShadow = true;
scene.add(plane);

function createProceduralTexture(type, baseColor) {
  const canvas = document.createElement("canvas");
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, 128, 128);

  if (type === "concrete") {
    for (let i = 0; i < 2000; i++) {
      ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.1})`;
      ctx.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
    }
  } else if (type === "glass") {
    ctx.strokeStyle = "rgba(0, 240, 255, 0.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, 108, 108);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.beginPath(); ctx.moveTo(10, 10); ctx.lineTo(118, 118); ctx.stroke();
  } else if (type === "roof") {
    for (let i = 0; i < 128; i += 16) {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(0, i, 128, 4);
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const materials = {
  0: new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.9, map: createProceduralTexture("concrete", "#334455") }),
  1: new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.8, map: createProceduralTexture("concrete", "#556677") }),
  2: new THREE.MeshStandardMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.5, map: createProceduralTexture("glass", "#00f0ff") }),
  3: new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7, map: createProceduralTexture("roof", "#8b4513") }),
  4: new THREE.MeshStandardMaterial({ color: 0x7a00ff, emissive: 0x7a00ff, emissiveIntensity: 0.8 })
};

let currentBlockType = 0;
let blocks = [];
let credits = 10000;
const blockCosts = [10, 15, 25, 20, 50];

window.selectBlock = (type) => {
  currentBlockType = type;
  document.querySelectorAll(".block-btn").forEach(btn => btn.classList.remove("active"));
  document.querySelector(`.block-btn[data-type="${type}"]`).classList.add("active");
};

function updateStats() {
  document.getElementById("stat-blocks").innerText = blocks.length;
  document.getElementById("stat-volume").innerText = (blocks.length * 1) + " m³";
  document.getElementById("stat-credits").innerText = credits.toLocaleString("pt-BR");
}

function addBlock(x, y, z, type) {
  if (credits < blockCosts[type]) {
    alert("Créditos insuficientes!");
    return;
  }
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.Mesh(geo, materials[type]);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { type: type };
  
  scene.add(mesh);
  blocks.push(mesh);
  
  credits -= blockCosts[type];
  updateStats();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const ghostGeo = new THREE.BoxGeometry(1, 1, 1);
const ghostMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.5, wireframe: true });
const ghostMesh = new THREE.Mesh(ghostGeo, ghostMat);
scene.add(ghostMesh);

window.addEventListener("pointermove", (e) => {
  if (e.target.tagName !== "CANVAS") { ghostMesh.visible = false; return; }
  pointer.x = (e.clientX / container.clientWidth) * 2 - 1;
  pointer.y = -(e.clientY / container.clientHeight) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects([plane, ...blocks]);

  if (intersects.length > 0) {
    const intersect = intersects[0];
    let pos = intersect.point.clone();
    if (intersect.face) pos.add(intersect.face.normal.multiplyScalar(0.5));
    
    pos.x = Math.round(pos.x);
    pos.y = Math.round(pos.y);
    pos.z = Math.round(pos.z);
    if (pos.y < 0) pos.y = 0;

    ghostMesh.position.copy(pos);
    ghostMesh.visible = true;
    ghostMesh.userData.pos = pos;
  }
});

window.addEventListener("pointerdown", (e) => {
  if (e.target.tagName === "CANVAS" && e.button === 0) {
    if (ghostMesh.visible && ghostMesh.userData.pos) {
      const p = ghostMesh.userData.pos;
      addBlock(p.x, p.y, p.z, currentBlockType);
    }
  }
});

window.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (e.target.tagName === "CANVAS") {
    pointer.x = (e.clientX / container.clientWidth) * 2 - 1;
    pointer.y = -(e.clientY / container.clientHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(blocks);
    if (intersects.length > 0) {
      const block = intersects[0].object;
      scene.remove(block);
      blocks = blocks.filter(b => b !== block);
      block.geometry.dispose();
      updateStats();
    }
  }
});

window.clearBuild = () => {
  blocks.forEach(b => scene.remove(b));
  blocks = [];
  credits = 10000;
  updateStats();
};

let zIndexCounter = 100;
window.createWindow = (id, title, contentHTML) => {
  if (document.getElementById(id)) {
    const w = document.getElementById(id);
    w.classList.add("open");
    w.style.zIndex = ++zIndexCounter;
    return;
  }
  const win = document.createElement("div");
  win.id = id;
  win.className = "window";
  win.style.width = "320px";
  win.style.height = "400px";
  win.style.top = "50px";
  win.style.right = "15px";
  win.style.pointerEvents = "auto";
  win.style.zIndex = ++zIndexCounter;
  win.innerHTML = `
    <div class="window-header" onmousedown="startDrag(event, '${id}')">
      <div class="window-title">${title}</div>
      <div class="window-controls"><button class="win-btn win-close" onclick="document.getElementById('${id}').remove()"></button></div>
    </div>
    <div class="window-body">${contentHTML}</div>
  `;
  document.getElementById("windows-container").appendChild(win);
  setTimeout(() => win.classList.add("open"), 10);
};

let isDragging = false, activeId = null, offsetX, offsetY;
window.startDrag = (e, id) => {
  isDragging = true; activeId = id;
  const win = document.getElementById(id);
  win.style.zIndex = ++zIndexCounter;
  offsetX = e.clientX - win.offsetLeft;
  offsetY = e.clientY - win.offsetTop;
};
document.addEventListener("mousemove", (e) => {
  if (!isDragging || !activeId) return;
  const win = document.getElementById(activeId);
  win.style.left = (e.clientX - offsetX) + "px";
  win.style.top = (e.clientY - offsetY) + "px";
  win.style.right = "auto";
});
document.addEventListener("mouseup", () => { isDragging = false; activeId = null; });

window.openApp = (app) => {
  if (app === "analyzer") {
    let volume = blocks.length;
    let entropy = 0;
    if (volume > 0) {
      const types = [0,0,0,0,0];
      blocks.forEach(b => types[b.userData.type]++);
      types.forEach(t => { if(t>0) { let p = t/volume; entropy -= p * Math.log2(p); } });
    }
    const kComplexity = (volume * (entropy/2.3) + 12).toFixed(2);
    
    createWindow("app-analyzer", "📊 Structural Data Science", `
      <div class="data-box" style="margin-bottom:15px;">
        <strong style="color:var(--accent);">Análise Autônoma (NexusBit)</strong><br><br>
        Massa Total: <span>${volume} Toneladas</span><br>
        Entropia Estrutural: <span>${entropy.toFixed(3)} H(x)</span><br>
        Complexidade de Kolmogorov: <span>${kComplexity} KB</span><br><br>
        <span style="color:${entropy > 2 ? "var(--success)" : "var(--accent2)"}">
          Status: ${volume === 0 ? "Aguardando Projeto" : (entropy > 1.5 ? "Estrutura Otimizada" : "Estrutura Monolítica")}
        </span>
      </div>
    `);
  }
  
  if (app === "cloud") {
    createWindow("app-cloud", "☁️ Kolmogorov Cloud Vault", `
      <p style="font-size:0.8rem; margin-bottom:10px;">Exporte sua construção como um tensor matemático.</p>
      <div class="data-box" style="margin-bottom:15px;">
        Arquivo Alvo: <span>blueprint.tectonic</span><br>
        Tamanho Não Comprimido: <span>${(blocks.length * 64)} Bytes</span><br>
        Compressão K-Scheme: <span style="color:var(--success);">~1.2 KB</span>
      </div>
      <button class="btn" onclick="exportBlueprint()">⬇️ Gerar Arquivo</button>
    `);
  }

  if (app === "terminal") {
    createWindow("app-term", "💻 Tectonic Shell", `
      <div class="data-box" style="height: 250px; overflow-y: auto; display:flex; flex-direction:column;">
        <div style="color:var(--accent);">Tectonic-OS Kernel v1.0.0</div>
        <div style="color:#888;">Memory: 4096MB / 8192MB</div>
        <div style="margin-top:10px; color:var(--success);">root@tectonic:~# _</div>
      </div>
    `);
  }
};

window.exportBlueprint = () => {
  const data = blocks.map(b => `${Math.round(b.position.x)},${Math.round(b.position.y)},${Math.round(b.position.z)},${b.userData.type}`).join("|");
  const compressed = btoa(data);
  const blob = new Blob([`TECTONIC-TENSOR-V1

${compressed}`], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `blueprint_${Date.now()}.tectonic`;
  a.click();
  URL.revokeObjectURL(url);
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const time = Date.now() * 0.001;
  blocks.forEach(b => {
    if (b.userData.type === 4) {
      b.material.emissiveIntensity = 0.5 + Math.sin(time * 3) * 0.5;
    }
  });
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

const bootText = document.getElementById("boot-text");
const bootLines = [
  "[SYS] Tectonic-OS Kernel loaded.",
  "[GPU] Initializing WebGL 2.0 Context...",
  "[PHYSICS] Raycasting spatial grid... OK.",
  "[DATA] Mounting NexusBit Data Science engine... OK.",
  "[CLOUD] Establishing Kolmogorov compression... OK.",
  "[READY] Welcome, Architect."
];

let currentLine = 0;
const bootInterval = setInterval(() => {
  if (currentLine < bootLines.length) {
    const div = document.createElement("div");
    div.innerText = bootLines[currentLine];
    bootText.appendChild(div);
    currentLine++;
  } else {
    clearInterval(bootInterval);
    setTimeout(() => {
      document.getElementById("boot-screen").style.display = "none";
      document.getElementById("desktop").style.display = "block";
      animate();
      updateStats();
    }, 500);
  }
}, 300);
</script>
</body>
</html>
