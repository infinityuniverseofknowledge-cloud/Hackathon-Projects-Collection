<!DOCTYPE html>
<html lang="pt-BR" data-theme="terra">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AURORA — Earth System Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#030806;--panel:#081410;--panel2:#0c1e18;--panel3:#122c24;--panel4:#1a3c30;
  --bd:#123024;--bd2:#1e5038;--tx:#d8f0e0;--tx2:#70b090;--tx3:#3a6850;
  --p1:#00e888;--p2:#00c8ff;--p3:#ff4060;--p4:#ffb000;--p5:#a060ff;--p6:#ff8040;
  --g1:linear-gradient(135deg,#00e888,#00c8ff);
  --gHolo:linear-gradient(120deg,#00e888,#00c8ff,#a060ff,#ff4060,#ffb000,#00e888);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f4faf6;--panel:#fff;--panel2:#f4faf6;--panel3:#e4f4e8;--panel4:#d0ecd8;--bd:#c0dcd0;--bd2:#88c0a0;--tx:#082018;--tx2:#2a6050;--tx3:#609080;--p1:#00a060;--p2:#0080c0;--g1:linear-gradient(135deg,#00a060,#0080c0)}
[data-theme="ice"]{--bg:#040a10;--panel:#08141c;--panel2:#0c202c;--panel3:#122c3c;--panel4:#1a3c50;--bd:#143040;--bd2:#1e4a68;--tx:#c8e8ff;--tx2:#6090b8;--tx3:#405870;--p1:#40c8ff;--p2:#a0e0ff;--g1:linear-gradient(135deg,#40c8ff,#a0e0ff)}
[data-theme="desert"]{--bg:#0a0806;--panel:#181208;--panel2:#221a0c;--panel3:#302414;--panel4:#3c2e1c;--bd:#2e2214;--bd2:#503828;--tx:#f0e0c8;--tx2:#c0a080;--tx3:#806048;--p1:#ffa040;--p2:#ff8040;--g1:linear-gradient(135deg,#ffa040,#ff8040)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#030806}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#020806;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,232,136,.012) 0,rgba(0,232,136,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(8,20,16,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p4)}.sb-val.c4{color:var(--p5)}.sb-val.c5{color:var(--p3)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(0,232,136,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#030806;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn.danger{background:rgba(255,64,96,.15);border-color:var(--p3);color:var(--p3)}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#030806;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p1)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p3)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('radiation')">AURORA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">T</span><span class="sb-val c2" id="sbTemp">288</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">CO₂</span><span class="sb-val c3" id="sbCO2">420</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Year</span><span class="sb-val c4" id="sbYear">2024</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">ΔT</span><span class="sb-val c5" id="sbDT">0.0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Radiative</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   PHYSICAL CONSTANTS (CODATA 2018 + IPCC AR6)
   ══════════════════════════════════════════════════════════ */
var SIGMA_SB=5.670374419e-8;         // Stefan-Boltzmann W/(m²K⁴)
var H_PLANCK=6.62607015e-34;
var K_BOLTZ=1.380649e-23;
var C_LIGHT=299792458;
var G_CONST=6.67430e-11;
var M_EARTH=5.972e24;
var R_EARTH=6.371e6;
var M_SUN=1.98892e30;
var AU=1.495978707e11;
var SOLAR_CONST=1361;                // W/m² at 1 AU
var EARTH_ALBEDO=0.30;
var T_EFF_EARTH=255;                 // K, effective radiating temp
var T_SURF_EARTH=288;                // K, surface temp
var GHG_FORCING_2XCO2=3.93;          // W/m² (IPCC AR6)
var CLIMATE_SENSITIVITY=3.0;         // K per 2×CO2 (best estimate)
var OMEGA_EARTH=7.292115e-5;
var CP_AIR=1005;                     // J/(kg·K)
var RHO_AIR=1.225;                   // kg/m³
var LATENT_HEAT_WATER=2.5e6;         // J/kg
var HEAT_CAPACITY_OCEAN=4e9;         // J/(m²·K) for 3km ocean layer
var CO2_PREINDUSTRIAL=280;           // ppm
var CO2_CURRENT=424;                 // ppm (2024)
var KEELING_AMPLITUDE=3.0;           // seasonal cycle amplitude (ppm)
var SOLAR_LUMINOSITY=3.828e26;

/* ══════════════════════════════════════════════════════════
   NUMERICAL METHODS
   ══════════════════════════════════════════════════════════ */
function rk4(y,t,dt,deriv){
  var n=y.length;
  var k1=deriv(y,t);
  var y2=new Array(n);for(var i=0;i<n;i++)y2[i]=y[i]+k1[i]*dt/2;
  var k2=deriv(y2,t+dt/2);
  var y3=new Array(n);for(var i=0;i<n;i++)y3[i]=y[i]+k2[i]*dt/2;
  var k3=deriv(y3,t+dt/2);
  var y4=new Array(n);for(var i=0;i<n;i++)y4[i]=y[i]+k3[i]*dt;
  var k4=deriv(y4,t+dt);
  var out=new Array(n);
  for(var i=0;i<n;i++)out[i]=y[i]+(k1[i]+2*k2[i]+2*k3[i]+k4[i])*dt/6;
  return out;
}
function eulerStep(y,dt,deriv){
  var d=deriv(y);
  for(var i=0;i<y.length;i++)y[i]+=d[i]*dt;
  return y;
}
function laplacian2D(f,Nx,Ny,dx,dy){
  var out=new Float32Array(Nx*Ny);
  for(var j=1;j<Ny-1;j++){
    for(var i=1;i<Nx-1;i++){
      var idx=j*Nx+i;
      out[idx]=(f[idx-1]+f[idx+1]+f[idx-Nx]+f[idx+Nx]-4*f[idx])/(dx*dx);
    }
  }
  return out;
}
function divergence2D(u,v,Nx,Ny,dx,dy){
  var out=new Float32Array(Nx*Ny);
  for(var j=1;j<Ny-1;j++){
    for(var i=1;i<Nx-1;i++){
      var idx=j*Nx+i;
      out[idx]=(u[idx+1]-u[idx-1])/(2*dx)+(v[idx+Nx]-v[idx-Nx])/(2*dy);
    }
  }
  return out;
}
function gaussianFilter2D(f,Nx,Ny,sigma){
  var out=new Float32Array(Nx*Ny);
  var k=Math.ceil(sigma*3);
  var kernel=[];
  var sum=0;
  for(var i=-k;i<=k;i++){
    var w=Math.exp(-i*i/(2*sigma*sigma));
    kernel.push(w);
    sum+=w;
  }
  kernel=kernel.map(function(v){return v/sum});
  // Horizontal pass
  var temp=new Float32Array(Nx*Ny);
  for(var j=0;j<Ny;j++){
    for(var i=0;i<Nx;i++){
      var s=0;
      for(var kk=-k;kk<=k;kk++){
        var ii=clamp(i+kk,0,Nx-1);
        s+=f[j*Nx+ii]*kernel[kk+k];
      }
      temp[j*Nx+i]=s;
    }
  }
  // Vertical pass
  for(var j=0;j<Ny;j++){
    for(var i=0;i<Nx;i++){
      var s=0;
      for(var kk=-k;kk<=k;kk++){
        var jj=clamp(j+kk,0,Ny-1);
        s+=temp[jj*Nx+i]*kernel[kk+k];
      }
      out[j*Nx+i]=s;
    }
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   RADIATIVE TRANSFER
   ══════════════════════════════════════════════════════════ */
function planck(wavelength,T){
  // B_λ(T) = 2hc²/λ⁵ · 1/(e^(hc/λkT)−1)  [W/(m²·sr·m)]
  var c1=2*H_PLANCK*C_LIGHT*C_LIGHT/Math.pow(wavelength,5);
  var c2=H_PLANCK*C_LIGHT/(wavelength*K_BOLTZ*T);
  return c1/(Math.exp(c2)-1);
}
function wienPeak(T){return 2.897771955e-3/T}
function stefanBoltzmann(T){return SIGMA_SB*Math.pow(T,4)}
function brightnessTemp(wavelength,radiance){
  // Inverse Planck
  var c2=H_PLANCK*C_LIGHT/(wavelength*K_BOLTZ);
  var c1=2*H_PLANCK*C_LIGHT*C_LIGHT/Math.pow(wavelength,5);
  return c2/Math.log(c1/radiance+1);
}
function schwarzschildOpticalDepth(z,H){return Math.exp(-z/H)}
function greenhouseEfficiency(co2ppm){
  // Logarithmic forcing (Myhre et al. 1998)
  return 5.35*Math.log(co2ppm/CO2_PREINDUSTRIAL);
}
function outgoingLongwave(T_surf,T_eff,emissivity){
  return emissivity*SIGMA_SB*Math.pow(T_surf,4);
}

/* ══════════════════════════════════════════════════════════
   ENERGY BALANCE MODEL (EBM)
   ══════════════════════════════════════════════════════════ */
function ebm0DStep(T,F_co2,F_other,C,dt){
  // C·dT/dt = S(1-α)/4 − σT⁴ + F
  var S=SOLAR_CONST;
  var alpha=EARTH_ALBEDO;
  var incoming=S*(1-alpha)/4;
  var outgoing=SIGMA_SB*Math.pow(T,4);
  var dT=(incoming-outgoing+F_co2+F_other)/C;
  return T+dT*dt;
}
function ebm1DStep(T_lat,F,C,D,dt){
  // Diffusion EBM: C·∂T/∂t = D·∇²T + S(x)(1-α(T)) − σT⁴ + F
  var N=T_lat.length;
  var out=new Float64Array(N);
  for(var i=0;i<N;i++){
    // Solar insolation vs latitude (annual mean)
    var lat=-Math.PI/2+Math.PI*i/(N-1);
    var S_lat=SOLAR_CONST/Math.PI*(1-0.482*Math.pow(3*Math.sin(lat)*Math.sin(lat)-1,1)); // Legendre approx
    // Temperature-dependent albedo (ice-albedo feedback)
    var alpha;
    if(T_lat[i]<263)alpha=0.6;
    else if(T_lat[i]<283)alpha=0.3+(T_lat[i]-263)/(283-263)*0.3;
    else alpha=0.3;
    // Laplacian
    var lap=0;
    if(i>0&&i<N-1)lap=(T_lat[i-1]+T_lat[i+1]-2*T_lat[i]);
    else if(i===0)lap=(T_lat[i+1]-T_lat[i]);
    else lap=(T_lat[i-1]-T_lat[i]);
    var inRad=S_lat*(1-alpha);
    var outRad=SIGMA_SB*Math.pow(T_lat[i],4);
    var dT=(D*lap+inRad-outRad+F)/C;
    out[i]=T_lat[i]+dT*dt;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   LORENZ 96 (Atmospheric chaos)
   ══════════════════════════════════════════════════════════ */
function lorenz96Deriv(x,F){
  var N=x.length;
  var dx=new Array(N);
  for(var i=0;i<N;i++){
    var xm1=x[(i-1+N)%N];
    var xp2=x[(i+2)%N];
    dx[i]=(xm1-xp2)*x[(i+1)%N]-x[i]+F;
  }
  return dx;
}

/* ══════════════════════════════════════════════════════════
   SHALLOW WATER EQUATIONS ON SPHERE
   ══════════════════════════════════════════════════════════ */
function shallowWaterStep(h,u,v,Nx,Ny,dx,dy,g,f0,beta,dt){
  // ∂u/∂t + u·∇u = -g·∂h/∂x + f·v
  // ∂h/∂t + ∇·(h·u) = 0
  var un=new Float32Array(Nx*Ny);
  var vn=new Float32Array(Nx*Ny);
  var hn=new Float32Array(Nx*Ny);
  for(var j=1;j<Ny-1;j++){
    for(var i=1;i<Nx-1;i++){
      var idx=j*Nx+i;
      // Coriolis parameter (beta-plane)
      var lat=(j-Ny/2)*dy;
      var f=f0+beta*lat;
      // Height gradient
      var dhdx=(h[idx+1]-h[idx-1])/(2*dx);
      var dhdy=(h[idx+Nx]-h[idx-Nx])/(2*dy);
      // Advection
      var dudx=u[idx]*(u[idx+1]-u[idx-1])/(2*dx);
      var dudy=v[idx]*(u[idx+Nx]-u[idx-Nx])/(2*dy);
      var dvdx=u[idx]*(v[idx+1]-v[idx-1])/(2*dx);
      var dvdy=v[idx]*(v[idx+Nx]-v[idx-Nx])/(2*dy);
      // Update
      un[idx]=u[idx]+dt*(-dudx-dudy-g*dhdx+f*v[idx]);
      vn[idx]=v[idx]+dt*(-dvdx-dvdy-g*dhdy-f*u[idx]);
      // Continuity
      var dhudx=(h[idx+1]*u[idx+1]-h[idx-1]*u[idx-1])/(2*dx);
      var dhvdy=(h[idx+Nx]*v[idx+Nx]-h[idx-Nx]*v[idx-Nx])/(2*dy);
      hn[idx]=h[idx]-dt*(dhudx+dhvdy);
    }
  }
  return {h:hn,u:un,v:vn};
}

/* ══════════════════════════════════════════════════════════
   STOMMEL OCEAN GYRE
   ══════════════════════════════════════════════════════════ */
function stommelGyre(N,epsilon){
  // Solve: ϵ·∇²ψ + ∂ψ/∂x = -sin(πy)
  // Using iterative Jacobi
  var psi=new Float64Array(N*N);
  for(var iter=0;iter<500;iter++){
    var newPsi=new Float64Array(N*N);
    for(var j=1;j<N-1;j++){
      for(var i=1;i<N-1;i++){
        var idx=j*N+i;
        var lap=psi[idx-1]+psi[idx+1]+psi[idx-N]+psi[idx+N]-4*psi[idx];
        var dx=psi[idx+1]-psi[idx-1];
        newPsi[idx]=(4*psi[idx]+epsilon*lap+dx)/4;
      }
    }
    psi=newPsi;
  }
  return psi;
}

/* ══════════════════════════════════════════════════════════
   DELAYED OSCILLATOR (ENSO)
   ══════════════════════════════════════════════════════════ */
function ensoStep(T,hist,b,c,tau,dt){
  // dT/dt = b·T(t) − c·T(t−τ)
  var N=hist.length;
  var Tpast=hist[Math.max(0,N-Math.round(tau/dt))];
  var dT=b*T-c*Tpast;
  return T+dT*dt;
}

/* ══════════════════════════════════════════════════════════
   SHALLOW ICE APPROXIMATION
   ══════════════════════════════════════════════════════════ */
function siaStep(H,bdot,A,Gamma,dt){
  // ∂H/∂t = ḃ + ∇·(Γ·H^(n+2)·|∇h|^(n-1)·∇h)
  // n=3 (Glen's law)
  var N=H.length;
  var out=new Float64Array(N);
  var n=3;
  for(var i=0;i<N;i++){
    var dHdx;
    if(i===0)dHdx=(H[1]-H[0]);
    else if(i===N-1)dHdx=(H[N-1]-H[N-2]);
    else dHdx=(H[i+1]-H[i-1])/2;
    var diffusivity=Gamma*Math.pow(Math.max(H[i],0),n+2)*Math.pow(Math.abs(dHdx),n-1);
    var flux=diffusivity*dHdx;
    var divFlux;
    if(i===0)divFlux=(flux);
    else if(i===N-1)divFlux=(-flux);
    else divFlux=(flux+diffusivity*dHdx)/2;
    out[i]=H[i]+(bdot[i]+A*dHdx-divFlux)*dt;
    out[i]=Math.max(0,out[i]);
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   CARBON CYCLE BOX MODEL
   ══════════════════════════════════════════════════════════ */
function carbonCycleStep(state,emissions,dt){
  // state = [atm, land, ocean_surf, ocean_deep]
  var atm=state[0],land=state[1],oSurf=state[2],oDeep=state[3];
  // Fluxes
  var kLA=0.05;      // land → atm
  var kAL=0.03;      // atm → land
  var kSO=0.05;      // surf → deep
  var kOS=0.02;      // deep → surf
  var kAS=0.08;      // atm → ocean surface
  var kSA=0.08;      // ocean surface → atm
  var kLA_resp=0.06; // respiration
  var dAtm=emissions-kAS*atm+kSA*oSurf+kLA_resp*land;
  var dLand=kAL*atm-kLA_resp*land;
  var dOSurf=kAS*atm-kSA*oSurf-kSO*oSurf+kOS*oDeep;
  var dODeep=kSO*oSurf-kOS*oDeep;
  return [
    atm+dAtm*dt,
    land+dLand*dt,
    oSurf+dOSurf*dt,
    oDeep+dODeep*dt
  ];
}

/* ══════════════════════════════════════════════════════════
   ROTHERMEL WILDFIRE SPREAD
   ══════════════════════════════════════════════════════════ */
function rothermelROS(wind,fuelMoisture,slope,sigma){
  // Rate of spread (Rothermel 1972, simplified)
  // σ: surface-area-to-volume ratio (1/m)
  var rho_p=513;               // fuel particle density kg/m³
  var beta=sigma*0.0015;       // packing ratio
  var beta_op=0.20395*Math.pow(sigma,-0.8189);
  var A=133*Math.pow(sigma,-0.7913);
  var gamma_max=Math.pow(sigma,1.5)/(495+0.0594*Math.pow(sigma,1.5));
  var gamma=gamma_max*Math.pow(beta/beta_op,A)*Math.exp(A*(1-beta/beta_op));
  // Moisture damping
  var rM=fuelMoisture/0.3;
  var eta_M=1-2.59*rM+5.11*rM*rM-3.52*rM*rM*rM;
  eta_M=clamp(eta_M,0,1);
  // Wind factor
  var C=7.47*Math.exp(-0.133*Math.pow(sigma,0.55));
  var B=0.02526*Math.pow(sigma,0.54);
  var E=0.715*Math.exp(-3.59e-4*sigma);
  var phi_w=wind>0?C*Math.pow(wind,B)*Math.pow(beta/beta_op,-E):0;
  // Slope factor
  var phi_s=5.275*Math.pow(beta,-0.3)*Math.pow(Math.tan(slope),2);
  // Heat
  var H=18000e3;               // J/kg (low heat content)
  var Q_ig=250+1116*fuelMoisture; // J/kg ignition
  var eps=Math.exp(-138/sigma);
  var rho_b=beta*rho_p;
  var xi=Math.exp((0.792+0.681*Math.sqrt(sigma))*(beta+0.1))/(192+0.2595*sigma);
  var IR=gamma*H*eta_M*(1-0)
  // Numerator & denominator
  var num=IR*xi*(1+phi_w+phi_s);
  var den=rho_b*eps*Q_ig;
  return num/den;
}

/* ══════════════════════════════════════════════════════════
   CHAPMAN OZONE CYCLE
   ══════════════════════════════════════════════════════════ */
function chapmanStep(O3,O,O2,uvFlux,dt){
  // O2 + hv → 2O          (rate J2·[O2])
  // O + O2 + M → O3 + M   (rate k2·[O]·[O2]·[M])
  // O3 + hv → O + O2      (rate J3·[O3])
  // O + O3 → 2O2           (rate k3·[O]·[O3])
  var J2=uvFlux*1e-8;
  var J3=uvFlux*1e-6;
  var k2=6e-34*1e18; // scaled
  var k3=1e-15*1e18;
  var M=1e18; // air density
  var dO3=J2*O2/2+k2*O*O2*M-J3*O3-k3*O*O3;
  var dO=J2*O2-k2*O*O2*M+J3*O3-k3*O*O3;
  return [O3+dO3*dt,O+dO*dt];
}

/* ══════════════════════════════════════════════════════════
   KÖHLER ACTIVATION
   ══════════════════════════════════════════════════════════ */
function kohlerSaturationRatio(r,rDry,kappa){
  // s = A/r − B·r_dry³/r³
  var A=1.2e-9;
  var B=kappa;
  return A/r-B*Math.pow(rDry,3)/Math.pow(r,3);
}

/* ══════════════════════════════════════════════════════════
   CLAUSIUS-CLAPEYRON
   ══════════════════════════════════════════════════════════ */
function saturationVaporPressure(T){
  // Magnus formula (T in K)
  var Tc=T-273.15;
  return 6.1094*Math.exp(17.625*Tc/(Tc+243.04));
}
function relativeHumidity(T,rh){return rh*saturationVaporPressure(T)/100}
function precipitableWater(waterVapor,rho){
  // Column water vapor
  return waterVapor*rho;
}

/* ══════════════════════════════════════════════════════════
   SATELLITE ORBIT
   ══════════════════════════════════════════════════════════ */
function sunSynchronousInclination(altitude){
  // Inclination for sun-synchronous orbit
  var a=R_EARTH+altitude;
  var n=Math.sqrt(G_CONST*M_EARTH/Math.pow(a,3)); // rad/s
  var J2=1.08263e-3;
  var dOm_dt=n*1.5*J2*Math.pow(R_EARTH/a,2);
  // Want dOm_dt = 1.99106e-7 rad/s (2π/year)
  var target=2*Math.PI/(365.25*86400);
  var cosi=-target/dOm_dt;
  return Math.acos(clamp(cosi,-1,1))*180/Math.PI;
}
function orbitalPeriod(altitude){
  var a=R_EARTH+altitude;
  return 2*Math.PI*Math.sqrt(Math.pow(a,3)/(G_CONST*M_EARTH));
}
function satelliteGroundTrack(altitude,inclination,t,lon0){
  var a=R_EARTH+altitude;
  var T=orbitalPeriod(altitude);
  var n=2*Math.PI/T;
  var theta=n*t;
  // Simplified: circular orbit
  var lat=Math.asin(Math.sin(inclination*Math.PI/180)*Math.sin(theta));
  var lon=Math.atan2(Math.cos(inclination*Math.PI/180)*Math.sin(theta),Math.cos(theta))-OMEGA_EARTH*t+lon0;
  return {lat:lat*180/Math.PI,lon:((lon*180/Math.PI+540)%360)-180};
}

/* ══════════════════════════════════════════════════════════
   InSAR PHASE
   ══════════════════════════════════════════════════════════ */
function insarPhase(deformation,wavelength,incidence){
  // φ = 4π·d·cos(θ)/λ
  return 4*Math.PI*deformation*Math.cos(incidence)/wavelength;
}
function insarDeformation(phase,wavelength,incidence){
  return phase*wavelength/(4*Math.PI*Math.cos(incidence));
}

/* ══════════════════════════════════════════════════════════
   VEGETATION INDICES
   ══════════════════════════════════════════════════════════ */
function ndvi(nir,red){return (nir-red)/(nir+red+1e-10)}
function evi(nir,red,blue){
  return 2.5*(nir-red)/(nir+6*red-7.5*blue+1);
}
function savi(nir,red,L){
  L=L||0.5;
  return (nir-red)/(nir+red+L)*(1+L);
}

/* ══════════════════════════════════════════════════════════
   BUdyko HYDROLOGY
   ══════════════════════════════════════════════════════════ */
function budykoET(P,PET){
  // Budyko curve: ET/P = f(PET/P)
  var phi=PET/P;
  if(phi<1){
    return P*(1-Math.exp(-phi));
  }else{
    return P*Math.exp(-phi);
  }
}
function penmanPET(Rn,T,rh,wind){
  // Simplified Penman-Monteith
  var delta=4098*(0.6108*Math.exp(17.27*T/(T+237.3)))/Math.pow(T+237.3,2);
  var gamma=0.066;
  return (delta*Rn+gamma*900/(T+273)*wind*(saturationVaporPressure(T+273.15)-rh/100*saturationVaporPressure(T+273.15)))/(delta+gamma*(1+0.34*wind));
}

/* ══════════════════════════════════════════════════════════
   ROSSBY WAVES (Jet Stream)
   ══════════════════════════════════════════════════════════ */
function rossbyPhaseSpeed(k,beta,U){
  // cp = U - β/k²
  return U-beta/(k*k);
}
function rossbyWavelength(U,beta){
  // Stationary: L = 2π·√(U/β)
  return 2*Math.PI*Math.sqrt(U/beta);
}

/* ══════════════════════════════════════════════════════════
   URBAN HEAT ISLAND
   ══════════════════════════════════════════════════════════ */
function urbanHeatIsland(Rn_urban,Rn_rural,H_urban,H_rural,LE_urban,LE_rural){
  // ΔT from energy balance difference
  var Q_urban=Rn_urban-H_urban-LE_urban;
  var Q_rural=Rn_rural-H_rural-LE_rural;
  var dT=(Q_urban-Q_rural)/15; // W/m² → K approx
  return dT;
}

/* ══════════════════════════════════════════════════════════
   SEA LEVEL
   ══════════════════════════════════════════════════════════ */
function stericSeaLevel(dT,depth,alpha){
  // Thermal expansion
  alpha=alpha||2e-4; // per K
  return alpha*dT*depth;
}
function iceMassSeaLevel(iceMassGt){
  // 1 Gt = 1e12 kg; ocean area = 3.6e14 m²
  return iceMassGt*1e12/(3.6e14*1025);
}

/* ══════════════════════════════════════════════════════════
   RANDOM NUMBER GENERATORS
   ══════════════════════════════════════════════════════════ */
function MT19937(seed){
  this.mt=new Array(624);this.index=624;
  this.mt[0]=seed>>>0;
  for(var i=1;i<624;i++)this.mt[i]=(1812433253*(this.mt[i-1]^(this.mt[i-1]>>>30))+i)>>>0;
}
MT19937.prototype.next=function(){
  if(this.index>=624){
    for(var i=0;i<624;i++){
      var y=(this.mt[i]&0x80000000)|(this.mt[(i+1)%624]&0x7fffffff);
      this.mt[i]=this.mt[(i+397)%624]^(y>>>1);
      if(y&1)this.mt[i]^=0x9908b0df;
    }
    this.index=0;
  }
  var y=this.mt[this.index++];
  y^=y>>>11;y^=(y<<7)&0x9d2c5680;y^=(y<<15)&0xefc60000;y^=y>>>18;
  return (y>>>0)/4294967296;
};
MT19937.prototype.gauss=function(){
  var u1=this.next()||1e-10,u2=this.next();
  return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
};

/* ══════════════════════════════════════════════════════════
   SPECTRAL METHODS (FFT)
   ══════════════════════════════════════════════════════════ */
function fft1D(re,im){
  var n=re.length;
  if(n<=1)return;
  // Bit-reversal
  var j=0;
  for(var i=0;i<n-1;i++){
    if(i<j){var t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}
    var m=n>>1;
    while(j>=m&&m>0){j-=m;m>>=1}
    j+=m;
  }
  for(var len=2;len<=n;len<<=1){
    var half=len>>1;
    var wReal=Math.cos(-2*Math.PI/len);
    var wImag=Math.sin(-2*Math.PI/len);
    for(var k=0;k<n;k+=len){
      var wr=1,wi=0;
      for(var q=0;q<half;q++){
        var ur=re[k+q],ui=im[k+q];
        var vr=re[k+q+half]*wr-im[k+q+half]*wi;
        var vi=re[k+q+half]*wi+im[k+q+half]*wr;
        re[k+q]=ur+vr;im[k+q]=ui+vi;
        re[k+q+half]=ur-vr;im[k+q+half]=ui-vi;
        var nwr=wr*wReal-wi*wImag;
        wi=wr*wImag+wi*wReal;
        wr=nwr;
      }
    }
  }
}
function nextPow2(n){var p=1;while(p<n)p<<=1;return p}

/* ══════════════════════════════════════════════════════════
   COLOR MAPS
   ══════════════════════════════════════════════════════════ */
function viridis(v){
  v=clamp(v,0,1);
  var r=Math.floor(68+(253-68)*v);
  var g=Math.floor(1+(231-1)*v);
  var b=Math.floor(84+(37-84)*v);
  return 'rgb('+r+','+g+','+b+')';
}
function plasma(v){
  v=clamp(v,0,1);
  var r=Math.floor(13+(237-13)*Math.pow(v,0.7));
  var g=Math.floor(8+(180-8)*Math.pow(v,1.2));
  var b=Math.floor(135+(255-135)*Math.pow(v,0.5));
  return 'rgb('+r+','+g+','+b+')';
}
function thermal(v){
  v=clamp(v,0,1);
  if(v<0.25)return 'rgb('+Math.floor(v*4*255)+',0,0)';
  if(v<0.5)return 'rgb(255,'+Math.floor((v-0.25)*4*255)+',0)';
  if(v<0.75)return 'rgb(255,255,'+Math.floor((v-0.5)*4*255)+')';
  return 'rgb(255,255,255)';
}
function earthColors(T){
  // Map temperature to Earth-like colors
  if(T<220)return 'rgb(240,248,255)';
  if(T<250)return 'rgb(200,230,255)';
  if(T<270)return 'rgb(180,220,200)';
  if(T<285)return 'rgb(180,240,160)';
  if(T<295)return 'rgb(240,230,140)';
  if(T<305)return 'rgb(255,180,100)';
  return 'rgb(255,100,100)';
}
function vegetationColors(ndvi){
  if(ndvi<0)return 'rgb(80,80,180)';
  if(ndvi<0.2)return 'rgb(200,180,140)';
  if(ndvi<0.5)return 'rgb(200,220,120)';
  if(ndvi<0.7)return 'rgb(120,200,80)';
  return 'rgb(40,150,40)';
}

/* ══════════════════════════════════════════════════════════
   DRAW UTILITIES
   ══════════════════════════════════════════════════════════ */
function drawGrid(ctx,x,y,w,h,rows,cols){
  ctx.strokeStyle='rgba(0,232,136,.08)';ctx.lineWidth=1;
  for(var i=0;i<=rows;i++){
    var yy=y+i*h/rows;
    ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();
  }
  for(var j=0;j<=cols;j++){
    var xx=x+j*w/cols;
    ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke();
  }
}
function drawAxes(ctx,x,y,w,h,xLabel,yLabel){
  ctx.strokeStyle='rgba(0,232,136,.4)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x,y+h);ctx.lineTo(x,y);
  ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);
  ctx.stroke();
  ctx.fillStyle='#3a6850';ctx.font='10px monospace';
  if(xLabel)ctx.fillText(xLabel,x+w/2-30,y+h+22);
  if(yLabel){
    ctx.save();ctx.translate(x-20,y+h/2);ctx.rotate(-Math.PI/2);
    ctx.fillText(yLabel,0,0);ctx.restore();
  }
}
function drawSparkline(ctx,x,y,w,h,values,color,fill){
  if(values.length<2)return;
  var mx=Math.max.apply(null,values),mn=Math.min.apply(null,values);
  if(mx===mn){mx=mn+1}
  ctx.beginPath();
  for(var i=0;i<values.length;i++){
    var px=x+i/(values.length-1)*w;
    var py=y+h-(values[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  if(fill){
    ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,color+'88');g.addColorStop(1,color+'00');
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
}
function drawField2D(ctx,field,Nx,Ny,x,y,w,h,cmap){
  var maxV=-Infinity,minV=Infinity;
  for(var i=0;i<field.length;i++){if(field[i]>maxV)maxV=field[i];if(field[i]<minV)minV=field[i]}
  var range=maxV-minV||1;
  var cellW=w/Nx,cellH=h/Ny;
  for(var j=0;j<Ny;j++){
    for(var i2=0;i2<Nx;i2++){
      var v=(field[j*Nx+i2]-minV)/range;
      ctx.fillStyle=cmap(v);
      ctx.fillRect(x+i2*cellW,y+j*cellH,cellW+0.5,cellH+0.5);
    }
  }
}
function drawHeatmap(ctx,matrix,x,y,w,h,minV,maxV,cmap){
  var n=matrix.length,m=matrix[0].length;
  var cw=w/m,ch=h/n;
  for(var i=0;i<n;i++){
    for(var j=0;j<m;j++){
      var v=(matrix[i][j]-minV)/(maxV-minV||1);
      ctx.fillStyle=cmap(v);
      ctx.fillRect(x+j*cw,y+i*ch,cw+0.5,ch+0.5);
    }
  }
}

registerModule('radiation',{title:'Radiative Transfer',icon:'☀',desc:'Planck spectrum, greenhouse gases.',init:function(){this.compute()},
compute:function(){var r=STATE.radiation;
r.wavelengths=[];
r.spectrum_surface=[];
r.spectrum_atm=[];
r.spectrum_window=[];
// Spectrum from 4 to 50 μm (thermal IR)
for(var wl=4;wl<=50;wl+=0.1){
  r.wavelengths.push(wl);
  var lam=wl*1e-6;
  // Surface emission (288 K)
  var B_surf=planck(lam,r.T_surface);
  r.spectrum_surface.push(B_surf);
  // Atmosphere (255 K)
  var B_atm=planck(lam,r.T_atm);
  r.spectrum_atm.push(B_atm);
  // Atmospheric window (8-13 μm) - low absorption
  var abs_co2=Math.exp(-Math.pow((wl-15)/2,2))*20*r.co2ppm/CO2_PREINDUSTRIAL;
  var abs_h2o=Math.exp(-Math.pow((wl-6.3)/1.5,2))*10+r.h2o*15;
  var abs_ch4=Math.exp(-Math.pow((wl-7.7)/0.5,2))*2*r.ch4ppb/1800;
  var abs_o3=Math.exp(-Math.pow((wl-9.6)/0.8,2))*3;
  var total_abs=Math.exp(-(abs_co2+abs_h2o+abs_ch4+abs_o3));
  r.spectrum_window.push(B_surf*total_abs+B_atm*(1-total_abs));
}
// Forcing from CO2
r.forcing_co2=greenhouseEfficiency(r.co2ppm);
// Wien peak
r.wienPeak=wienPeak(r.T_surface)*1e6;
// Energy balance
r.incoming=SOLAR_CONST*(1-EARTH_ALBEDO)/4;
r.outgoing=stefanBoltzmann(r.T_surface)*0.6;
r.net_balance=r.incoming-r.outgoing},

registerModule('ebm',{title:'Energy Balance Model',icon:'🌡',desc:'1D latitudinal EBM with ice-albedo feedback.',init:function(){this.reset()},
reset:function(){var e=STATE.ebm;
e.T=new Float64Array(e.N);
// Initialize with solar-driven temperature
for(var i=0;i<e.N;i++){
  var lat=-Math.PI/2+Math.PI*i/(e.N-1);
  var S_lat=SOLAR_CONST/Math.PI;
  e.T[i]=Math.pow((S_lat*(1-0.3))/SIGMA_SB,0.25)*Math.pow(Math.max(0.01,Math.cos(lat)),0.25);
}
// Smooth
e.T=gaussianFilter2D(e.T,1,e.N,2);
e.t=0;e.history=[]},
step:function(dt){var e=STATE.ebm;
var newT=ebm1DStep(e.T,e.F_co2+e.F_other,e.C,e.D,dt);
// Smooth to keep stable
for(var i=1;i<e.N-1;i++)e.T[i]=newT[i];
// Mean temperature
var mean=0;
for(var i=0;i<e.N;i++)mean+=e.T[i];
mean/=e.N;
e.meanT=mean;
e.history.push(mean);
if(e.history.length>2000)e.history.shift();
e.t+=dt},
tick:function(dt){STATE.time+=dt;var e=STATE.ebm;if(!STATE.playing)return;
var sub=Math.floor(dt*100);for(var i=0;i<sub;i++)this.step(0.1)},

registerModule('gcm',{title:'General Circulation',icon:'🌍',desc:'Shallow water equations on β-plane.',init:function(){this.reset()},
reset:function(){var g=STATE.gcm;
var Nx=g.Nx,Ny=g.Ny;
g.h=new Float32Array(Nx*Ny);
g.u=new Float32Array(Nx*Ny);
g.v=new Float32Array(Nx*Ny);
// Initial perturbation (Gaussian bump)
for(var j=0;j<Ny;j++){
  for(var i=0;i<Nx;i++){
    var x=(i-Nx/2)/(Nx/4);
    var y=(j-Ny/2)/(Ny/4);
    g.h[j*Nx+i]=1000+500*Math.exp(-(x*x+y*y));
  }
}
g.t=0},
step:function(dt){var g=STATE.gcm;
var dx=1e5,dy=1e5;
var result=shallowWaterStep(g.h,g.u,g.v,g.Nx,g.Ny,dx,dy,g.g,g.f0,g.beta,dt);
g.h=result.h;g.u=result.u;g.v=result.v;
// Add perturbation every 100 steps
g.t+=dt},
tick:function(dt){STATE.time+=dt;var g=STATE.gcm;if(!STATE.playing)return;
var sub=Math.floor(dt*10);for(var i=0;i<sub;i++)this.step(g.dt)},

registerModule('ice',{title:'Ice Sheet Dynamics',icon:'❄',desc:'Shallow Ice Approximation (SIA).',init:function(){this.reset()},

registerModule('wildfire',{title:'Wildfire Spread',icon:'🔥',desc:'Rothermel rate of spread.',init:function(){this.reset()},
reset:function(){var w=STATE.wildfire;
w.N=60;
w.fire=new Float32Array(w.N*w.N);
// Ignite center
w.fire[Math.floor(w.N/2)*w.N+Math.floor(w.N/2)]=1;
w.fuel=new Float32Array(w.N*w.N);
for(var i=0;i<w.N*w.N;i++)w.fuel[i]=1+randn()*0.2;
w.t=0;w.steps=0},
step:function(){var w=STATE.wildfire;
var ros=rothermelROS(w.wind,w.moisture,w.slope,w.sigma)/100; // scale
ros=clamp(ros,0.05,2);
var newFire=new Float32Array(w.N*w.N);
for(var j=1;j<w.N-1;j++){
  for(var i=1;i<w.N-1;i++){
    var idx=j*w.N+i;
    if(w.fire[idx]>0)newFire[idx]=Math.min(1,w.fire[idx]+0.1);
    else{
      // Spread from neighbors
      var maxNeighbor=0;
      for(var dj=-1;dj<=1;dj++){
        for(var di=-1;di<=1;di++){
          if(di===0&&dj===0)continue;
          var nidx=(j+dj)*w.N+(i+di);
          if(w.fire[nidx]>0){
            // Wind direction amplification
            var windFactor=1+0.5*(di*Math.cos(0)+dj*Math.sin(0));
            maxNeighbor=Math.max(maxNeighbor,w.fire[nidx]*windFactor*ros*0.02);
          }
        }
      }
      if(maxNeighbor>Math.random()&&w.fuel[idx]>0){
        newFire[idx]=Math.min(1,maxNeighbor);
        w.fuel[idx]*=0.5;
      }
    }
  }
}
w.fire=newFire;
w.t+=0.1;w.steps++},
tick:function(dt){STATE.time+=dt;var w=STATE.wildfire;if(!w||!STATE.playing)return;
var sub=Math.floor(dt*20);for(var i=0;i<sub;i++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var w=STATE.wildfire;
if(!w.fire)return;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('WILDFIRE SPREAD — '+w.steps+' steps · wind='+w.wind+' m/s',30,30);
var sz=Math.min(W-60,H-140);
var ox=(W-sz)/2,oy=60;
/* Terrain + fire */
for(var j=0;j<w.N;j++){
  for(var i=0;i<w.N;i++){
    var idx=j*w.N+i;
    var x=ox+i*sz/w.N;
    var y=oy+j*sz/w.N;
    var f=w.fire[idx];
    if(f>0){
      // Burning
      var r=Math.floor(255*Math.min(1,f*2));
      var g=Math.floor(150*Math.max(0,1-f));
      var b=0;
      ctx.fillStyle='rgb('+r+','+g+','+b+')';
    }else{
      // Unburned / burned
      var fuel=w.fuel[idx];
      if(fuel<0.7){
        ctx.fillStyle='rgb('+Math.floor(30)+','+Math.floor(20)+','+Math.floor(15)+')';
      }else{
        var g2=Math.floor(80+fuel*60);
        ctx.fillStyle='rgb('+Math.floor(40)+','+g2+','+Math.floor(30)+')';
      }
    }
    ctx.fillRect(x,y,sz/w.N+0.5,sz/w.N+0.5);
  }
}
// Wind arrow
ctx.strokeStyle='#ffb000';ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(ox+sz*0.1,oy+20);ctx.lineTo(ox+sz*0.1+w.wind*3,oy+20);ctx.stroke();
ctx.fillStyle='#ffb000';ctx.font='bold 11px monospace';
ctx.fillText('Wind',ox+sz*0.1,oy+15);
/* Info */
var ix=W-260,iy=60;
if(ix<ox+sz+20)ix=ox+sz+20;
if(ix+240>W)ix=W-250;
ctx.fillStyle='rgba(8,20,16,.85)';
ctx.fillRect(ix,iy,240,220);
ctx.strokeStyle='#00e888';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,220);
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('ROTHERMEL MODEL',ix+10,iy+22);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('Wind speed:',ix+10,iy+48);
ctx.fillStyle='#ffb000';
ctx.fillText(w.wind+' m/s',ix+180,iy+48);
ctx.fillStyle='#7090b8';
ctx.fillText('Fuel moisture:',ix+10,iy+68);
ctx.fillStyle='#00c8ff';
ctx.fillText(w.moisture,ix+180,iy+68);
ctx.fillStyle='#7090b8';
ctx.fillText('Slope:',ix+10,iy+88);
ctx.fillStyle='#ff4060';
ctx.fillText(w.slope,ix+180,iy+88);
ctx.fillStyle='#7090b8';
ctx.fillText('σ (SAV):',ix+10,iy+108);
ctx.fillStyle='#00e888';
ctx.fillText(w.sigma+' 1/m',ix+180,iy+108);
ctx.fillStyle='#7090b8';
ctx.fillText('ROS:',ix+10,iy+128);
var ros=rothermelROS(w.wind,w.moisture,w.slope,w.sigma);
ctx.fillStyle='#ff4060';
ctx.fillText(fmt(ros,2)+' m/min',ix+180,iy+128);
ctx.fillStyle='#7090b8';
ctx.fillText('Burned area:',ix+10,iy+148);
var burned=0;
for(var i=0;i<w.fire.length;i++)if(w.fire[i]>0)burned++;
ctx.fillStyle='#ff8040';
ctx.fillText(fmt(burned*100/(w.N*w.N),1)+'%',ix+180,iy+148);
ctx.fillStyle='#7090b8';
ctx.fillText('Time:',ix+10,iy+168);
ctx.fillStyle='#00e888';
ctx.fillText(fmt(w.t,1)+' min',ix+180,iy+168);
ctx.fillStyle='#7090b8';
ctx.fillText('Steps:',ix+10,iy+188);
ctx.fillStyle='#00e888';
ctx.fillText(w.steps,ix+180,iy+188);
setStats('<div>Wind: '+w.wind+' m/s</div><div>Moisture: '+w.moisture+'</div><div>ROS: '+fmt(ros,2)+' m/min</div><div>Burned: '+fmt(burned*100/(w.N*w.N),1)+'%</div>');
badge('🔥 Wildfire · ROS='+fmt(ros,2)+' m/min');SV('sbTemp',fmt(ros,1))},
onDown:function(p){},
controls:function(){var w=STATE.wildfire;var h='<div class="sec"><h4>Fire environment</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Wind speed</span><span>'+w.wind+' m/s</span></div><input type="range" min="0" max="20" step="0.5" value="'+w.wind+'" oninput="STATE.wildfire.wind=parseFloat(this.value);renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Fuel moisture</span><span>'+w.moisture+'</span></div><input type="range" min="0.01" max="0.5" step="0.01" value="'+w.moisture+'" oninput="STATE.wildfire.moisture=parseFloat(this.value);renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Slope</span><span>'+w.slope+'</span></div><input type="range" min="0" max="0.5" step="0.01" value="'+w.slope+'" oninput="STATE.wildfire.slope=parseFloat(this.value);renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>σ (SAV)</span><span>'+w.sigma+' 1/m</span></div><input type="range" min="500" max="6000" step="100" value="'+w.sigma+'" oninput="STATE.wildfire.sigma=parseInt(this.value);renderLeftPanel()"></div>';
h+='</div>';
h+='<button class="btn primary full" onclick="MODULES.wildfire.reset();toast(\'Reset\',\'success\')">↺ Reset</div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Rothermel Model</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Rothermel (1972) — USDA Forest Service<br><br><b>Rate of Spread:</b><br>R = I_R·ξ·(1+φ_w+φ_s)/(ρ_b·ε·Q_ig)<br><br>I_R = γ·H·η_M (intensidade reativa)<br>ξ = fator de propagação<br>φ_w = fator vento<br>φ_s = fator inclinação<br>ρ_b = densidade aparente<br>ε = efetividade de aquecimento<br>Q_ig = calor de ignição<br><br><b>Fatores de propagação:</b><br>φ_w = C·U^B·(β/β_op)^(-E)<br>φ_s = 5.275·β^(-0.3)·tan²(θ)<br><br><b>Uso:</b> BEHAVE, FARSITE, Phoenix<br>Previsão operacional de incêndios</div></div>'}});

registerModule('ozone',{title:'Ozone Layer',icon:'⭕',desc:'Chapman cycle + catalytic destruction.',init:function(){this.reset()},
reset:function(){var o=STATE.ozone;o.O3=1e12;o.O=1e10;o.history=[];o.t=0},
step:function(dt){var o=STATE.ozone;
var res=chapmanStep(o.O3,o.O,o.O2,o.uvFlux,dt);
o.O3=Math.max(1e8,res[0]);
o.O=Math.max(1e6,res[1]);
o.history.push(o.O3);
if(o.history.length>2000)o.history.shift();
o.t+=dt},
tick:function(dt){STATE.time+=dt;var o=STATE.ozone;if(!STATE.playing)return;
var sub=Math.floor(dt*200);for(var i=0;i<sub;i++)this.step(0.01)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var o=STATE.ozone;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('OZONE CHEMISTRY — Chapman cycle · UV='+o.uvFlux,30,30);
/* Ozone profile */
var pw=W-60,ph=H*0.5;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('OZONE CONCENTRATION (Dobson Units)',30,60);
drawGrid(ctx,30,70,pw,ph,4,8);
// Vertical profile (Chapman-like)
ctx.strokeStyle='#00c8ff';ctx.lineWidth=2.5;
ctx.beginPath();
for(var alt=0;alt<=50;alt++){
  // Chapman profile peaks at ~25 km
  var peak=25;
  var o3_density=o.O3*1e-12*Math.exp(-Math.pow((alt-peak)/8,2));
  var x=30+alt/50*pw;
  var y=70+ph-o3_density*ph*0.9;
  if(alt===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
// Fill
ctx.fillStyle='rgba(0,200,255,.15)';
ctx.beginPath();
ctx.moveTo(30,70+ph);
for(var alt=0;alt<=50;alt++){
  var o3_density=o.O3*1e-12*Math.exp(-Math.pow((alt-25)/8,2));
  ctx.lineTo(30+alt/50*pw,70+ph-o3_density*ph*0.9);
}
ctx.lineTo(30+pw,70+ph);
ctx.fill();
// Labels
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('0 km',30,70+ph+15);
ctx.fillText('25 km',30+pw*0.5-15,70+ph+15);
ctx.fillText('50 km',30+pw-30,70+ph+15);
ctx.fillText('Stratosphere',30+pw*0.7,80);
ctx.fillText('Troposphere',30+pw*0.2,80);
/* Time series */
var hy=70+ph+50;
var hh=H-hy-80;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('TOTAL OZONE (time)',30,hy-5);
drawGrid(ctx,30,hy,pw,hh,4,8);
if(o.history.length>1){
  var mx=Math.max.apply(null,o.history),mn=Math.min.apply(null,o.history);
  ctx.strokeStyle='#00e888';ctx.lineWidth=2;
  ctx.beginPath();
  o.history.forEach(function(v,i){
    var x=30+i/o.history.length*pw;
    var y=hy+hh-(v-mn)/(mx-mn+1e-6)*hh;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
/* Info */
var ix=W-260,iy=60;
ctx.fillStyle='rgba(8,20,16,.85)';
ctx.fillRect(ix,iy,240,180);
ctx.strokeStyle='#00e888';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,180);
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('OZONE STATE',ix+10,iy+22);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('O₃ (molecules):',ix+10,iy+48);
ctx.fillStyle='#00c8ff';
ctx.fillText(o.O3.toExponential(2),ix+160,iy+48);
ctx.fillStyle='#7090b8';
ctx.fillText('O (molecules):',ix+10,iy+68);
ctx.fillStyle='#00c8ff';
ctx.fillText(o.O.toExponential(2),ix+160,iy+68);
ctx.fillStyle='#7090b8';
ctx.fillText('UV flux:',ix+10,iy+88);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(o.uvFlux,2),ix+160,iy+88);
ctx.fillStyle='#7090b8';
ctx.fillText('Total O₃:',ix+10,iy+108);
var totalO3=o.O3*1e-12;
ctx.fillStyle='#00e888';
ctx.fillText(fmt(totalO3,3)+' DU',ix+160,iy+108);
ctx.fillStyle='#7090b8';
ctx.fillText('Time:',ix+10,iy+128);
ctx.fillStyle='#00e888';
ctx.fillText(fmt(o.t,2),ix+160,iy+128);
ctx.fillStyle='#7090b8';
ctx.fillText('Est. T:',ix+10,iy+148);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(220+o.O3*5e-11,1)+' K',ix+160,iy+148);
ctx.fillStyle='#7090b8';
ctx.fillText('Status:',ix+10,iy+168);
ctx.fillStyle='#00e888';
ctx.fillText(totalO3>250?'Healthy':'Depleted',ix+160,iy+168);
setStats('<div>O₃: '+o.O3.toExponential(2)+'</div><div>DU: '+fmt(totalO3,1)+'</div><div>UV: '+fmt(o.uvFlux,2)+'</div>');
badge('⭕ Ozone · '+fmt(totalO3,0)+' DU');SV('sbTemp',fmt(totalO3,0))},
onDown:function(p){},
controls:function(){var o=STATE.ozone;var h='<div class="sec"><h4>UV Flux</h4>';
h+='<div class="ctrl"><div class="lbl"><span>UV flux</span><span>'+fmt(o.uvFlux,2)+'</span></div><input type="range" min="0.1" max="5" step="0.05" value="'+o.uvFlux+'" oninput="STATE.ozone.uvFlux=parseFloat(this.value)"></div>';
h+='</div>';
h+='<div class="sec"><h4>Presets</h4><div class="chip-row">';
[['Normal',1],['High UV',3],['Low UV',0.3],['Ozone hole',4]].forEach(function(p){
  h+='<div class="chip" onclick="STATE.ozone.uvFlux='+p[1]+';MODULES.ozone.reset();renderLeftPanel()">'+p[0]+'</div>';
});
h+='</div></div>';
h+='<button class="btn primary full" onclick="MODULES.ozone.reset();toast(\'Reset\',\'success\')">↺ Reset</button>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Chapman Cycle</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Chapman (1930)<br><br><b>Reações:</b><br>O₂ + hv (λ<242 nm) → 2O   (J₂)<br>O + O₂ + M → O₃ + M       (k₂)<br>O₃ + hv (λ<320 nm) → O₂ + O (J₃)<br>O + O₃ → 2O₂                (k₃)<br><br><b>Equilíbrio fotoquímico:</b><br>[O₃] = [O₂]·√(J₂·k₂/(J₃·k₃))<br><br><b>Perfil vertical:</b><br>Pico em ~25 km (estratosfera)<br>~90% do ozônio total<br>~300 DU coluna típica<br><br><b>Destruição catalítica:</b><br>ClO, BrO, NOx, HOx<br>CFC-11, CFC-12<br>Protocolo de Montreal (1987)</div></div>'}});

/* ══════ 11. CLOUD PHYSICS ══════ */
registerModule('clouds',{title:'Cloud Physics',icon:'☁',desc:'Köhler activation and droplet growth.',init:function(){this.compute()},
compute:function(){var c=STATE.clouds;
c.radii=[];
for(var r=0.01;r<10;r*=1.15)c.radii.push(r);
c.kohlerCurves=[];
[0.05,0.1,0.2,0.4,0.8].forEach(function(rd){
  var curve=[];
  c.radii.forEach(function(r){
    var s=kohlerSaturationRatio(r*1e-6,rd*1e-6,c.kappa);
    curve.push(s*100);
  });
  c.kohlerCurves.push({rDry:rd,curve:curve});
});
// Saturation vapor pressure curve
c.temps=[];
c.esat=[];
for(var T=250;T<=320;T+=2){
  c.temps.push(T);
  c.esat.push(saturationVaporPressure(T));
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var c=STATE.clouds;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('CLOUD PHYSICS — Köhler theory · κ='+c.kappa,30,30);
/* Köhler curves */
var pw=W*0.55,ph=H-140;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('KÖHLER CURVES (supersaturation vs radius)',30,60);
drawGrid(ctx,30,70,pw,ph,4,8);
// Curve for each dry radius

registerModule('insar',{title:'InSAR',icon:'📡',desc:'Interferometric SAR phase.',init:function(){this.reset()},
reset:function(){var i=STATE.insar;
i.phase=new Float32Array(i.Nx*i.Ny);
i.deformation=new Float32Array(i.Nx*i.Ny);
// Gaussian deformation (volcano inflation / earthquake)
for(var j=0;j<i.Ny;j++){
  for(var k=0;k<i.Nx;k++){
    var dx=(k-i.Nx/2)/(i.Nx/6);
    var dy=(j-i.Ny/2)/(i.Ny/6);
    // Coseismic: Okada-like
    var r=Math.sqrt(dx*dx+dy*dy);
    i.deformation[j*i.Nx+k]=0.15*Math.exp(-r*r);
    i.phase[j*i.Nx+k]=insarPhase(i.deformation[j*i.Nx+k],i.wavelength,i.incidence);
  }
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var i=STATE.insar;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('InSAR — λ='+(i.wavelength*100).toFixed(2)+' cm · incidence='+fmt(i.incidence*180/Math.PI,0)+'°',30,30);
/* Wrapped phase (interferogram) */
var pw=Math.min(W-60,H-140);
var ox=(W-pw)/2,oy=60;
for(var j=0;j<i.Ny;j++){
  for(var k=0;k<i.Nx;k++){
    var phase=i.phase[j*i.Nx+k];
    // Wrap to [-π, π]
    var wrapped=phase-Math.round(phase/(2*Math.PI))*2*Math.PI;
    var t=(wrapped+Math.PI)/(2*Math.PI);
    ctx.fillStyle=plasma(t);
    ctx.fillRect(ox+k*pw/i.Nx,oy+j*pw/i.Ny,pw/i.Nx+0.5,pw/i.Ny+0.5);
  }
}
ctx.strokeStyle='#00e888';ctx.lineWidth=1;ctx.strokeRect(ox,oy,pw,pw);
// Colorbar
var cbX=ox+pw+10,cbW=20;
for(var k=0;k<256;k++){

ctx.strokeStyle='#00e888';ctx.strokeRect(cbX,oy,cbW,pw);

registerModule('ndvi',{title:'Vegetation Indices',icon:'🍃',desc:'NDVI, EVI, SAVI from multispectral bands.',init:function(){this.compute()},
compute:function(){var n=STATE.ndvi;
n.nir=new Float32Array(n.Nx*n.Ny);
n.red=new Float32Array(n.Nx*n.Ny);
n.blue=new Float32Array(n.Nx*n.Ny);
n.ndvi=new Float32Array(n.Nx*n.Ny);
n.evi=new Float32Array(n.Nx*n.Ny);
// Simulate landscape with gradients
for(var j=0;j<n.Ny;j++){
  for(var i=0;i<n.Nx;i++){
    var idx=j*n.Nx+i;
    // Vegetation fraction varies
    var vegFrac=0.5+0.4*Math.sin(i*0.2)*Math.cos(j*0.15);
    var waterMask=Math.max(0,Math.sin((i-10)*0.3)*Math.cos((j-20)*0.25));
    // Spectral reflectance
    n.nir[idx]=0.3+vegFrac*0.4*(1-waterMask);
    n.red[idx]=0.2-vegFrac*0.15*(1-waterMask)+randn()*0.02;
    n.blue[idx]=0.1-vegFrac*0.05*(1-waterMask)+randn()*0.01;
    n.ndvi[idx]=ndvi(n.nir[idx],n.red[idx]);
    n.evi[idx]=evi(n.nir[idx],n.red[idx],n.blue[idx]);
  }
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var n=STATE.ndvi;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('VEGETATION INDICES — mode: '+n.showMode.toUpperCase(),30,30);
var mode=n.showMode;
var field=mode==='ndvi'?n.ndvi:mode==='evi'?n.evi:n.nir;
/* Main map */
var pw=W*0.5-30,ph=H*0.5-60;
var ox=30,oy=60;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText(mode.toUpperCase()+' MAP',ox,oy-5);
for(var j=0;j<n.Ny;j++){
  for(var i=0;i<n.Nx;i++){
    var v=field[j*n.Nx+i];
    var col;
    if(mode==='ndvi')col=vegetationColors(v);
    else if(mode==='evi')col=vegetationColors(v*1.2);
    else col=thermal(v*3);
    ctx.fillStyle=col;
    ctx.fillRect(ox+i*pw/n.Nx,oy+j*ph/n.Ny,pw/n.Nx+0.5,ph/n.Ny+0.5);
  }
}
ctx.strokeStyle='#00e888';ctx.lineWidth=1;ctx.strokeRect(ox,oy,pw,ph);
/* Spectral bands */
var bandX=W*0.55,bandY=60,bandW=W*0.2,bandH=H*0.5-60;

registerModule('landsat',{title:'Landsat Time Series',icon:'📈',desc:'Multi-decadal NDVI with change detection.',init:function(){this.reset()},
reset:function(){var l=STATE.landsat;
l.series=[];
l.changePoints=[];
var base=0.4;
for(var i=0;i<l.N;i++){
  var t=1984+i*(40/l.N);
  var trend=base+0.003*(t-1984);
  var seasonal=0.15*Math.sin(2*Math.PI*(i%12)/12);
  var noise=randn()*0.03;
  var value=trend+seasonal+noise;
  // Add change event
  if(t>2010&&t<2013)value-=0.15;
  l.series.push({t:t,ndvi:value});
}
// Detect change points
for(var i=1;i<l.series.length-1;i++){
  var prev=l.series[i-1].ndvi;
  var cur=l.series[i].ndvi;
  var next=l.series[i+1].ndvi;
  var diff=Math.abs(cur-(prev+next)/2);
  if(diff>0.1)l.changePoints.push(l.series[i]);
}
l.t=0},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);

ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('LANDSAT TIME SERIES — '+l.series.length+' observations',30,30);
var pw=W-60,ph=H-160;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('NDVI (1984-2024)',30,60);
drawGrid(ctx,30,70,pw,ph,4,10);
// Time series
ctx.strokeStyle='#40ff90';ctx.lineWidth=1.5;
ctx.beginPath();
l.series.forEach(function(s,i){
  var x=30+i/l.series.length*pw;
  var y=70+ph-(s.ndvi-0)*ph*2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
// Trend line
var sumT=0,sumY=0,sumTT=0,sumTY=0,n=l.series.length;
l.series.forEach(function(s,i){
  var t=i/n;
  sumT+=t;sumY+=s.ndvi;
  sumTT+=t*t;sumTY+=t*s.ndvi;
});
var slope=(n*sumTY-sumT*sumY)/(n*sumTT-sumT*sumT);
var intercept=(sumY-slope*sumT)/n;
ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.setLineDash([5,5]);
ctx.beginPath();
for(var i=0;i<2;i++){
  var x=30+i*pw;
  var y=70+ph-(intercept+slope*i-0)*ph*2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.setLineDash([]);
// Change points
l.changePoints.forEach(function(cp){
  var x=30+l.series.indexOf(cp)/l.series.length*pw;
  var y=70+ph-(cp.ndvi-0)*ph*2;
  ctx.fillStyle='#ff4060';

});
// Legend
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillStyle='#40ff90';ctx.fillText('— NDVI series',30,70+ph+22);
ctx.fillStyle='#ffb000';ctx.fillText('-- Linear trend',150,70+ph+22);
ctx.fillStyle='#ff4060';ctx.fillText('● Change points',300,70+ph+22);
/* Info */
var ix=W-260,iy=60;
ctx.fillStyle='rgba(8,20,16,.85)';
ctx.fillRect(ix,iy,240,200);
ctx.strokeStyle='#00e888';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,200);
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('TREND ANALYSIS',ix+10,iy+22);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('Observations:',ix+10,iy+48);
ctx.fillStyle='#00e888';
ctx.fillText(l.series.length,ix+160,iy+48);
ctx.fillStyle='#7090b8';
ctx.fillText('Start year:',ix+10,iy+68);
ctx.fillStyle='#00e888';
ctx.fillText('1984',ix+160,iy+68);
ctx.fillStyle='#7090b8';
ctx.fillText('End year:',ix+10,iy+88);
ctx.fillStyle='#00e888';
ctx.fillText('2024',ix+160,iy+88);
ctx.fillStyle='#7090b8';
ctx.fillText('Slope (NDVI/40yr):',ix+10,iy+108);
ctx.fillStyle=slope>0?'#40ff90':'#ff4060';
ctx.fillText(fmt(slope,4),ix+160,iy+108);
ctx.fillStyle='#7090b8';
ctx.fillText('Slope per year:',ix+10,iy+128);

ctx.fillStyle='#7090b8';
ctx.fillText('Mean NDVI:',ix+10,iy+148);

ctx.fillStyle='#7090b8';
ctx.fillText('Change points:',ix+10,iy+168);
ctx.fillStyle='#ff4060';
ctx.fillText(l.changePoints.length,ix+160,iy+168);

setStats('<div>Slope: '+fmt(slope,3)+'/40yr</div><div>Mean: '+fmt(sumY/n,3)+'</div><div>Changes: '+l.changePoints.length+'</div>');
badge('📈 Landsat · trend='+fmt(slope,3));SV('sbTemp',fmt(sumY/n,2))},

w.runoff=w.P-w.ET;

for(var k=0.5;k<=10;k+=0.1){
  var cp=rossbyPhaseSpeed(k,r.beta,r.U);

}},

var curY=70+ph/2-clamp(r.phaseSpeed,-20,20)/40*ph;
ctx.fillStyle='#ff4060';
ctx.beginPath();ctx.arc(curX,curY,6,0,Math.PI*2);ctx.fill();
/* Wave pattern visualization */
var wx=W*0.55,wy=60,ww=W*0.4,wh=H*0.6;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('WAVE PATTERN (planetary waves)',wx,wy-5);

ctx.fillRect(wx,wy,ww,wh);
// Draw sinusoidal wave
ctx.strokeStyle='#40ff90';ctx.lineWidth=2;
var time=STATE.time*0.5;
ctx.beginPath();
for(var x=0;x<ww;x++){
  var phase=(x/ww)*r.k*Math.PI*2+time*r.phaseSpeed/10;
  var y=wy+wh/2+Math.sin(phase)*wh*0.3;
  if(x===0)ctx.moveTo(wx+x,y);else ctx.lineTo(wx+x,y);
}
ctx.stroke();
// Second wave (harmonics)
ctx.strokeStyle='rgba(0,200,255,.5)';ctx.lineWidth=1.5;
ctx.beginPath();
for(var x=0;x<ww;x++){
  var phase=(x/ww)*r.k*Math.PI*4+time*r.phaseSpeed/5;
  var y=wy+wh/2+Math.sin(phase)*wh*0.15;
  if(x===0)ctx.moveTo(wx+x,y);else ctx.lineTo(wx+x,y);
}
ctx.stroke();
// Jet stream arrow
ctx.strokeStyle='#ffb000';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(wx+10,wy+30);ctx.lineTo(wx+60,wy+30);ctx.stroke();
ctx.beginPath();ctx.moveTo(wx+60,wy+30);ctx.lineTo(wx+50,wy+25);ctx.lineTo(wx+50,wy+35);ctx.closePath();ctx.fill();
ctx.fillStyle='#ffb000';ctx.font='bold 10px monospace';
ctx.fillText('U='+r.U+' m/s',wx+15,wy+22);

var ix=W-260,iy=60;
if(ix<wx+ww)ix=wx+ww+10;
if(ix+240>W)ix=W-250;
ctx.fillStyle='rgba(8,20,16,.85)';
ctx.fillRect(ix,iy,240,180);
ctx.strokeStyle='#00e888';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,180);
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('ROSSBY WAVES',ix+10,iy+22);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('Wavenumber k:',ix+10,iy+48);
ctx.fillStyle='#00e888';
ctx.fillText(fmt(r.k,2),ix+180,iy+48);
ctx.fillStyle='#7090b8';
ctx.fillText('Base flow U:',ix+10,iy+68);
ctx.fillStyle='#00e888';
ctx.fillText(r.U+' m/s',ix+180,iy+68);
ctx.fillStyle='#7090b8';
ctx.fillText('β:',ix+10,iy+88);
ctx.fillStyle='#00e888';
ctx.fillText(r.beta.toExponential(2),ix+180,iy+88);
ctx.fillStyle='#7090b8';
ctx.fillText('Phase speed:',ix+10,iy+108);
ctx.fillStyle='#ff4060';
ctx.fillText(fmt(r.phaseSpeed,2)+' m/s',ix+180,iy+108);
ctx.fillStyle='#7090b8';
ctx.fillText('Stationary L:',ix+10,iy+128);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(r.wavelength/1000,1)+' km',ix+180,iy+128);
ctx.fillStyle='#7090b8';
ctx.fillText('Type:',ix+10,iy+148);
ctx.fillStyle=r.phaseSpeed<0?'#00c8ff':'#40ff90';
ctx.fillText(r.phaseSpeed<0?'Westward':'Eastward',ix+180,iy+148);
ctx.fillStyle='#7090b8';
ctx.fillText('Wavelength:',ix+10,iy+168);
ctx.fillStyle='#00c8ff';
ctx.fillText(fmt(2*Math.PI/r.k*1000,0)+' km',ix+180,iy+168);
setStats('<div>cp: '+fmt(r.phaseSpeed,2)+' m/s</div><div>L: '+fmt(2*Math.PI/r.k,2)+' rad</div>');
badge('🌬 Rossby · cp='+fmt(r.phaseSpeed,1)+' m/s');SV('sbTemp',fmt(r.phaseSpeed,2))},

<script>

registerModule('urban',{title:'Urban Heat Island',icon:'🏙',desc:'Urban vs rural energy balance.',init:function(){this.reset()},
reset:function(){var u=STATE.urban;
u.field=new Float32Array(u.Nx*u.Ny);
u.t=0},
step:function(dt){var u=STATE.urban;
// UHI from energy balance
u.deltaT=urbanHeatIsland(u.Rn_urban,u.Rn_rural,u.H_urban,u.H_rural,u.LE_urban,u.LE_rural);
// Field: city center warmer
for(var j=0;j<u.Ny;j++){
  for(var i=0;i<u.Nx;i++){
    var dx=(i-u.Nx/2)/(u.Nx/4);
    var dy=(j-u.Ny/2)/(u.Ny/4);
    var r=Math.sqrt(dx*dx+dy*dy);
    // Urban influence
    var urban=Math.exp(-r*r*0.5);
    // Time variation
    var timeVar=1+0.3*Math.sin(u.t*0.5);
    u.field[j*u.Nx+i]=u.deltaT*urban*timeVar;
  }
}
u.t+=dt},
tick:function(dt){STATE.time+=dt;var u=STATE.urban;if(!u||!STATE.playing)return;
var sub=Math.floor(dt*30);for(var i=0;i<sub;i++)this.step(0.05)},

});

[['Phoenix',500,50,400,150],['Tokyo',450,80,350,200],['São Paulo',480,100,320,180],['London',350,120,300,250]].forEach(function(p){

registerModule('seaLevel',{title:'Sea Level Rise',icon:'📏',desc:'Thermal expansion + ice melt.',init:function(){this.reset()},
reset:function(){var s=STATE.seaLevel;s.history=[];s.t=0;s.year=2024},
step:function(dt){var s=STATE.seaLevel;
// Thermal expansion (steric)
s.steric=stericSeaLevel(s.dT,s.depth);
// Ice melt contribution (mm)
s.ice=iceMassSeaLevel(s.iceMassGt)*1000; // convert to mm
// Total
s.total=s.steric*1000+s.ice; // mm
s.year+=dt;
s.history.push({year:s.year,slr:s.total});
if(s.history.length>2000)s.history.shift();
s.t+=dt},
tick:function(dt){STATE.time+=dt;var s=STATE.seaLevel;if(!s||!STATE.playing)return;
var sub=Math.floor(dt*30);for(var i=0;i<sub;i++)this.step(0.1)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var s=STATE.seaLevel;
if(!s.history)return;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('SEA LEVEL RISE — year '+fmt(s.year,0)+' · total '+fmt(s.total/1000,2)+' m',30,30);
/* Time series */
var pw=W-60,ph=H*0.5;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('SEA LEVEL RISE (mm vs pre-industrial)',30,60);
drawGrid(ctx,30,70,pw,ph,4,8);
if(s.history.length>1){
  var mx=Math.max.apply(null,s.history.map(function(h){return Math.max(0,h.slr)}));
  var mn=Math.min.apply(null,s.history.map(function(h){return h.slr}));
  mx=Math.max(mx,1);
  ctx.strokeStyle='#00c8ff';ctx.lineWidth=2.5;
  ctx.beginPath();
  s.history.forEach(function(h,i){
    var x=30+i/s.history.length*pw;
    var y=70+ph-(h.slr-mn)/(mx-mn+1e-6)*ph;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
// Decomposition bars
var bx=W*0.65,by=60,bw=W*0.3,bh=H*0.5;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('CONTRIBUTIONS',bx,by-5);
var maxContrib=Math.max(s.steric*1000,s.ice,1);
var bars=[
  {name:'Thermal',value:s.steric*1000,color:'#00c8ff'},

  {name:'Total',value:s.total,color:'#00e888'}
];
bars.forEach(function(b,i){
  var y=by+20+i*40;

  ctx.textAlign='right';
  ctx.fillText(fmt(b.value,1)+' mm',bx+bw-20,y+18);
  ctx.textAlign='left';
});
/* Info */
var iy=by+bh+20;
ctx.fillStyle='rgba(8,20,16,.85)';
ctx.fillRect(bx,iy,W-bx-30,H-iy-80);
ctx.strokeStyle='#00e888';ctx.lineWidth=1.5;ctx.strokeRect(bx,iy,W-bx-30,H-iy-80);
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('SEA LEVEL STATE',bx+10,iy+22);
ctx.fillStyle='#7090b8';ctx.font='10px monospace';
ctx.fillText('Temp change:',bx+10,iy+48);
ctx.fillStyle='#ff4060';
ctx.fillText('+'+s.dT+' K',W-80,iy+48);
ctx.fillStyle='#7090b8';
ctx.fillText('Ocean depth:',bx+10,iy+68);
ctx.fillStyle='#00c8ff';
ctx.fillText(s.depth+' m',W-80,iy+68);
ctx.fillStyle='#7090b8';
ctx.fillText('Ice melt:',bx+10,iy+88);
ctx.fillStyle='#a0e0ff';
ctx.fillText(s.iceMassGt+' Gt',W-80,iy+88);
ctx.fillStyle='#7090b8';
ctx.fillText('Thermal SLR:',bx+10,iy+108);
ctx.fillStyle='#00c8ff';
ctx.fillText(fmt(s.steric*1000,1)+' mm',W-80,iy+108);
ctx.fillStyle='#7090b8';
ctx.fillText('Ice SLR:',bx+10,iy+128);
ctx.fillStyle='#a0e0ff';
ctx.fillText(fmt(s.ice,1)+' mm',W-80,iy+128);
ctx.fillStyle='#7090b8';
ctx.fillText('Total SLR:',bx+10,iy+148);
ctx.fillStyle='#00e888';
ctx.fillText(fmt(s.total/1000,3)+' m',W-80,iy+148);
ctx.fillStyle='#7090b8';
ctx.fillText('Year:',bx+10,iy+168);
ctx.fillStyle='#00e888';
ctx.fillText(fmt(s.year,0),W-80,iy+168);
setStats('<div>Total SLR: '+fmt(s.total/1000,3)+' m</div><div>Steric: '+fmt(s.steric*1000,1)+' mm</div><div>Ice: '+fmt(s.ice,1)+' mm</div>');
badge('📏 Sea Level · +'+fmt(s.total/1000,2)+' m');SV('sbTemp',fmt(s.total/1000,2))},
onDown:function(p){},
controls:function(){var s=STATE.seaLevel;var h='<div class="sec"><h4>Temperature</h4>';
h+='<div class="ctrl"><div class="lbl"><span>ΔT vs pre-industrial</span><span>+'+s.dT+' K</span></div><input type="range" min="0" max="5" step="0.1" value="'+s.dT+'" oninput="STATE.seaLevel.dT=parseFloat(this.value)"></div>';

[['SSP1-1.9',1.5,250],['SSP1-2.6',1.8,400],['SSP2-4.5',2.7,650],['SSP3-7.0',3.6,900],['SSP5-8.5',4.4,1200]].forEach(function(p){

/* ══════ 20. ATTRIBUTION ══════ */
registerModule('attribution',{title:'Climate Attribution',icon:'📊',desc:'Detection and attribution of climate change.',init:function(){this.reset()},
reset:function(){var a=STATE.attribution;
a.N=100;a.observed=[];a.natural=[];a.anthropogenic=[];a.ensemble=[];
a.t=0;
// Generate ensemble
for(var i=0;i<a.N;i++){
  var obs=[],nat=[],ant=[];
  for(var y=1850;y<=2024;y++){
    var natVar=randn()*0.1;
    var natTrend=0;
    var antTrend=(y-1850)*0.012;
    var antVar=randn()*0.05;
    obs.push(natVar+antTrend+antVar);
    nat.push(natVar+natTrend);
    ant.push(natVar+natTrend+antTrend);
  }
  a.observed.push(obs);
  a.natural.push(nat);
  a.anthropogenic.push(ant);
}
a.years=Array.from({length:175},function(_,i){return 1850+i})},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var a=STATE.attribution;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';

registerModule('downscale',{title:'Statistical Downscaling',icon:'🔍',desc:'Super-resolution of climate fields.',init:function(){this.compute()},
compute:function(){var d=STATE.downscale;
// Coarse field (16×16)
d.coarse=new Float32Array(d.Nx*d.Ny);
for(var j=0;j<d.Ny;j++){
  for(var i=0;i<d.Nx;i++){
    // Multi-scale synthetic
    d.coarse[j*d.Nx+i]=Math.sin(i*0.3)*Math.cos(j*0.3)+randn()*0.1;
  }
}
// Fine field (4× resolution)
var Nf=d.Nx*4;
d.fine=new Float32Array(Nf*Nf);
for(var j=0;j<Nf;j++){
  for(var i=0;i<Nf;i++){
    d.fine[j*Nf+i]=Math.sin(i*0.075)*Math.cos(j*0.075)
      +0.3*Math.sin(i*0.3)*Math.cos(j*0.25)
      +randn()*0.05;
  }
}
// Predict fine from coarse via bicubic interpolation
d.predicted=new Float32Array(Nf*Nf);
for(var j=0;j<Nf;j++){
  for(var i=0;i<Nf;i++){
    var ci=i/4,cj=j/4;
    var i0=Math.floor(ci),j0=Math.floor(cj);
    var i1=Math.min(i0+1,d.Nx-1),j1=Math.min(j0+1,d.Ny-1);
    var fx=ci-i0,fy=cj-j0;
    // Bilinear
    var v=d.coarse[j0*d.Nx+i0]*(1-fx)*(1-fy)+d.coarse[j0*d.Nx+i1]*fx*(1-fy)+d.coarse[j1*d.Nx+i0]*(1-fx)*fy+d.coarse[j1*d.Nx+i1]*fx*fy;
    d.predicted[j*Nf+i]=v;
  }
}
// Error
var err=0;
for(var i=0;i<d.fine.length;i++)err+=Math.pow(d.fine[i]-d.predicted[i],2);
d.error=Math.sqrt(err/d.fine.length);
d.Nf=Nf},

registerModule('co2',{title:'CO₂ Scenarios',icon:'💨',desc:'SSP emission pathways and warming.',init:function(){this.compute()},
compute:function(){var c=STATE.co2||{};
STATE.co2=c;
c.years=Array.from({length:100},function(_,i){return 2020+i});
c.scenarios={};
// SSP scenarios
c.scenarios['SSP1-1.9']={color:'#00e888',emissions:[],co2:[],temp:[]};
c.scenarios['SSP1-2.6']={color:'#40ff90',emissions:[],co2:[],temp:[]};
c.scenarios['SSP2-4.5']={color:'#ffb000',emissions:[],co2:[],temp:[]};
c.scenarios['SSP3-7.0']={color:'#ff8040',emissions:[],co2:[],temp:[]};
c.scenarios['SSP5-8.5']={color:'#ff4060',emissions:[],co2:[],temp:[]};
// Emission curves
function emissionsSSP(name,t){
  // t: year offset from 2020
  if(name==='SSP1-1.9')return Math.max(0,40*Math.exp(-t/30)-5);
  if(name==='SSP1-2.6')return Math.max(0,40*Math.exp(-t/40)+2);
  if(name==='SSP2-4.5')return 40*Math.exp(-t/80)+5;
  if(name==='SSP3-7.0')return 40+t*0.5;
  if(name==='SSP5-8.5')return 40+t*0.8;
  return 40;
}
var co2init=420;
var tempInit=1.2;
for(var name in c.scenarios){
  var scen=c.scenarios[name];
  var co2=co2init;
  var temp=tempInit;
  for(var y=0;y<100;y++){
    var em=emissionsSSP(name,y);
    // CO2 accumulates (simplified)
    co2+=em*0.05; // 1 GtC ≈ 0.05 ppm per year ratio
    // Temperature response
    var forcing=5.35*Math.log(co2/280);
    temp=temp+(forcing*0.8-temp*0.3)*0.05;
    scen.emissions.push(em);
    scen.co2.push(co2);
    scen.temp.push(temp);
  }
}},

registerModule('monsoon',{title:'Monsoon',icon:'🌧',desc:'Land-sea contrast monsoon dynamics.',init:function(){this.reset()},
reset:function(){var m=STATE.monsoon||{};
STATE.monsoon=m;
m.t=0;m.N=100;m.landTemp=25;m.oceanTemp=28;m.pressure=0;m.rainfall=0;m.history=[];
m.day=0},
step:function(dt){var m=STATE.monsoon;
// Solar heating (seasonal cycle)
var yearPhase=m.day/365*2*Math.PI;
var solar=Math.sin(yearPhase+Math.PI/2); // max in June
// Land heats up faster than ocean
m.landTemp=15+15*solar+randn()*0.5;
m.oceanTemp=24+2*solar+randn()*0.2;
// Land-sea temperature difference
var dT=m.landTemp-m.oceanTemp;
// Pressure gradient
m.pressure=dT*0.5;
// Wind (onshore if land is warmer)
m.wind=m.pressure*0.3;
// Rainfall (monsoon)
m.rainfall=Math.max(0,m.wind*1.5+randn()*2);
m.history.push({day:m.day,rainfall:m.rainfall,dT:dT});
if(m.history.length>2000)m.history.shift();
m.day+=dt*5;
m.t+=dt},
tick:function(dt){STATE.time+=dt;var m=STATE.monsoon;if(!m||!STATE.playing)return;
var sub=Math.floor(dt*50);for(var i=0;i<sub;i++)this.step(0.02)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);

if(!m.history)return;

ctx.fillText('MONSOON — day '+fmt(m.day%365,0)+' · rainfall='+fmt(m.rainfall,1)+' mm/day',30,30);

drawGrid(ctx,30,70,pw,ph,4,12);
if(m.history.length>1){

  ctx.strokeStyle='#00c8ff';ctx.lineWidth=2.5;

}
/* Land-sea contrast */

registerModule('aerosol',{title:'Aerosols & AQI',icon:'💨',desc:'Aerosol optics and air quality.',init:function(){this.compute()},
compute:function(){var a=STATE.aerosol||{};
STATE.aerosol=a;
a.pm25=35; // μg/m³
a.pm10=55;
a.no2=40;
a.so2=20;
a.o3=80;
a.co=1.5;
// AQI calculation (EPA)
function aqiPM25(pm){
  var breakpoints=[[0,12,0,50],[12.1,35.4,51,100],[35.5,55.4,101,150],[55.5,150.4,151,200],[150.5,250.4,201,300],[250.5,350.4,301,400],[350.5,500.4,401,500]];
  for(var i=0;i<breakpoints.length;i++){
    var bp=breakpoints[i];
    if(pm>=bp[0]&&pm<=bp[1]){
      return Math.round((bp[3]-bp[2])/(bp[1]-bp[0])*(pm-bp[0])+bp[2]);
    }
  }
  return 500;
}
a.aqiPM25=aqiPM25(a.pm25);
a.aqiPM10=aqiPM25(a.pm10*0.7); // simplified
a.aqiNO2=aqiPM25(a.no2*0.5);
a.aqiO3=aqiPM25(a.o3*0.5);
a.aqiSO2=aqiPM25(a.so2*0.5);
a.aqiCO=aqiPM25(a.co*30);
a.aqi=Math.max(a.aqiPM25,a.aqiPM10,a.aqiNO2,a.aqiO3,a.aqiSO2,a.aqiCO);
// Aerosol optical depth
a.aod=a.pm25*0.01;
// Radiative forcing
a.forcing=-a.aod*25; // cooling (W/m²)
// Health risk
a.risk=a.aqi<=50?'Good':a.aqi<=100?'Moderate':a.aqi<=150?'Unhealthy (sensitive)':a.aqi<=200?'Unhealthy':a.aqi<=300?'Very unhealthy':'Hazardous';
a.riskColor=a.aqi<=50?'#00e888':a.aqi<=100?'#ffb000':a.aqi<=150?'#ff8040':a.aqi<=200?'#ff4060':a.aqi<=300?'#a060ff':'#8a2be2'},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020806';ctx.fillRect(0,0,W,H);
var a=STATE.aerosol;
if(!a)return;
ctx.fillStyle='#00e888';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('AEROSOLS & AIR QUALITY — AQI='+a.aqi+' · '+a.risk,30,30);
/* AQI gauge */
var cx=W*0.3,cy=H*0.4,r=Math.min(W*0.2,H*0.3);
var colors=['#00e888','#ffb000','#ff8040','#ff4060','#a060ff','#8a2be2'];
for(var i=0;i<6;i++){
  ctx.strokeStyle=colors[i];
  ctx.lineWidth=20;
  ctx.beginPath();
  ctx.arc(cx,cy,r,-Math.PI+i*Math.PI/3,-Math.PI+(i+1)*Math.PI/3);
  ctx.stroke();
}
// Needle
var angle=-Math.PI+a.aqi/500*Math.PI;
ctx.strokeStyle='#fff';ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(angle)*r*0.9,cy+Math.sin(angle)*r*0.9);
ctx.stroke();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();
// AQI value
ctx.fillStyle=a.riskColor;
ctx.font='bold 36px monospace';ctx.textAlign='center';
ctx.fillText(a.aqi,cx,cy+r*0.6);
ctx.font='bold 14px monospace';
ctx.fillText(a.risk,cx,cy+r*0.75);
ctx.textAlign='left';
/* Pollutant bars */
var bx=W*0.62,by=60,bw=W*0.35;
ctx.fillStyle='#00e888';ctx.font='bold 11px monospace';
ctx.fillText('POLLUTANTS (μg/m³)',bx,by-5);
var pollutants=[
  {name:'PM2.5',value:a.pm25,limit:35,color:'#ff4060'},
  {name:'PM10',value:a.pm10,limit:50,color:'#ff8040'},
  {name:'NO₂',value:a.no2,limit:40,color:'#ffb000'},
  {name:'SO₂',value:a.so2,limit:20,color:'#a060ff'},
  {name:'O₃',value:a.o3,limit:100,color:'#00c8ff'},
  {name:'CO',value:a.co*100,limit:400,color:'#40ff90'}
];
pollutants.forEach(function(p,i){
  var y=by+10+i*40;
