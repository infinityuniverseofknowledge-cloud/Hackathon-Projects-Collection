<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusOS · Painel Avançado</title>
<style>
  :root{
    --bg1:#0b0f1a; --bg2:#131a2b; --acc:#6ee7ff; --acc2:#a78bfa;
    --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --glass:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
    --txt:#e6edf7; --mut:#8ea0bd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'SF Pro Display',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 10% -10%,#1b2440 0%,transparent 60%),
               radial-gradient(1000px 700px at 110% 110%,#2a1b40 0%,transparent 60%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--txt); overflow-x:hidden; min-height:100vh;
    padding:20px 16px 100px;
  }
  /* fundo animado */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(2px 2px at 20% 30%,rgba(110,231,255,.6),transparent 50%),
      radial-gradient(2px 2px at 70% 60%,rgba(167,139,250,.6),transparent 50%),
      radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.5),transparent 50%),
      radial-gradient(1px 1px at 85% 20%,rgba(255,255,255,.4),transparent 50%);
    background-size:500px 500px;animation:float 60s linear infinite;opacity:.6;
  }
  @keyframes float{to{background-position:500px 500px, -500px 300px, 300px -500px, -300px -300px}}

  header,main{position:relative;z-index:1;max-width:1100px;margin:0 auto}

  /* HEADER */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:44px;height:44px;border-radius:14px;
    background:conic-gradient(from 180deg,var(--acc),var(--acc2),var(--acc));
    display:grid;place-items:center;font-weight:800;color:#0b0f1a;font-size:20px;
    box-shadow:0 0 24px rgba(110,231,255,.5); animation:spin 8s linear infinite;
  }
  @keyframes spin{to{filter:hue-rotate(360deg)}}
  h1{font-size:20px;font-weight:700;letter-spacing:.3px}
  h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400;letter-spacing:2px}
  .status{font-size:12px;color:var(--ok);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.4}}

  /* TABS */
  nav{display:flex;gap:6px;background:var(--glass);border:1px solid var(--border);
      padding:6px;border-radius:16px;margin-bottom:20px;backdrop-filter:blur(20px);overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:1;min-width:80px;background:transparent;border:0;color:var(--mut);
    padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
    transition:.25s;font-family:inherit;white-space:nowrap;
  }
  nav button.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0f1a;
                     box-shadow:0 6px 20px rgba(110,231,255,.35)}
  nav button:not(.active):hover{color:var(--txt);background:rgba(255,255,255,.05)}

  /* CARDS */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

  .card{
    background:var(--glass);border:1px solid var(--border);border-radius:20px;
    padding:18px;backdrop-filter:blur(20px);position:relative;overflow:hidden;
    transition:transform .25s, border-color .25s;
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(110,231,255,.4)}
  .card .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px}
  .card .val{font-size:28px;font-weight:800;margin-top:6px;
             background:linear-gradient(135deg,var(--acc),var(--acc2));
             -webkit-background-clip:text;background-clip:text;color:transparent}

  h2.sec{font-size:15px;margin:22px 0 12px;color:var(--mut);text-transform:uppercase;letter-spacing:2px;font-weight:600}

  /* INPUTS */
  input,textarea,select{
    width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);
    color:var(--txt);padding:12px 14px;border-radius:12px;font-size:14px;
    font-family:inherit;outline:none;transition:.2s;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(110,231,255,.15)}
  textarea{resize:vertical;min-height:90px}

  button.btn{
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0f1a;
    border:0;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;
    cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:.3px;
  }
  button.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(110,231,255,.35)}
  button.btn.alt{background:rgba(255,255,255,.08);color:var(--txt)}
  button.btn.err{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff}

  .row{display:flex;gap:8px;flex-wrap:wrap}

  /* TASKS */
  .task{display:flex;align-items:center;gap:12px;padding:12px 14px;
        background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;
        animation:slideIn .3s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .task input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
  .task .txt{flex:1;font-size:14px}
  .task.done .txt{text-decoration:line-through;color:var(--mut);opacity:.6}
  .task .del{background:transparent;border:0;color:var(--err);font-size:18px;cursor:pointer;padding:4px 8px}

  /* CALC */
  .calc-display{
    background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:14px;
    padding:20px;text-align:right;font-size:32px;font-weight:700;margin-bottom:12px;
    font-variant-numeric:tabular-nums;min-height:80px;word-break:break-all;
    color:var(--acc);
  }
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .calc-grid button{
    padding:18px 0;font-size:18px;font-weight:700;border-radius:14px;border:1px solid var(--border);
    background:rgba(255,255,255,.05);color:var(--txt);cursor:pointer;transition:.15s;font-family:inherit;
  }
  .calc-grid button:hover{background:rgba(255,255,255,.12)}
  .calc-grid button.op{background:rgba(110,231,255,.15);color:var(--acc)}
  .calc-grid button.eq{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0f1a;grid-column:span 2}
  .calc-grid button.zero{grid-column:span 2}

  /* CHAT/LOG */
  #log{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:14px;
       padding:14px;font-family:ui-monospace,monospace;font-size:12px;
       max-height:260px;overflow-y:auto;color:#a5f3fc;line-height:1.7}
  #log .t{color:var(--mut)}

  /* VIEWS */
  .view{display:none;animation:fade .35s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* FAB */
  #fab{
    position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0b0f1a;
    border:0;font-size:26px;font-weight:700;cursor:pointer;z-index:50;
    box-shadow:0 10px 30px rgba(110,231,255,.5);transition:.3s;
  }
  #fab:hover{transform:scale(1.08) rotate(90deg)}

  /* TOAST */
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
         background:rgba(20,30,50,.95);border:1px solid var(--acc);color:var(--txt);
         padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
         opacity:0;transition:.3s;pointer-events:none;z-index:60;backdrop-filter:blur(10px)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .stat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
  .bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));
            border-radius:4px;transition:width .6s ease}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">N</div>
    <h1>NexusOS<small>SYSTEM v2.4</small></h1>
  </div>
  <div class="status"><span class="dot"></span><span id="clock">--:--:--</span></div>
</header>

<nav>
  <button class="active" data-v="dash">📊 Painel</button>
  <button data-v="tasks">✅ Tarefas</button>
  <button data-v="calc">🧮 Calc</button>
  <button data-v="notes">📝 Notas</button>
  <button data-v="sys">⚙️ Sistema</button>
</nav>

<main>

  <!-- DASH -->
  <section class="view active" id="dash">
    <div class="grid g2">
      <div class="card"><div class="lbl">Tarefas</div><div class="val" id="s-tasks">0</div></div>
      <div class="card"><div class="lbl">Notas</div><div class="val" id="s-notes">0</div></div>
      <div class="card"><div class="lbl">Uptime</div><div class="val" id="s-up">0s</div></div>
      <div class="card"><div class="lbl">Memória</div><div class="val" id="s-mem">--</div></div>
    </div>

    <h2 class="sec">Progresso</h2>
    <div class="card">
      <div class="stat"><span>Tarefas concluídas</span><span id="p-txt">0%</span></div>
      <div class="bar" style="margin-top:10px"><span id="p-bar" style="width:0%"></span></div>
    </div>

    <h2 class="sec">Atividade</h2>
    <div id="log"></div>
  </section>

  <!-- TASKS -->
  <section class="view" id="tasks">
    <div class="card">
      <div class="row">
        <input id="t-in" placeholder="Nova tarefa..." onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn" onclick="addTask()">Adicionar</button>
      </div>
    </div>
    <h2 class="sec">Lista</h2>
    <div id="t-list"></div>
  </section>

  <!-- CALC -->
  <section class="view" id="calc">
    <div class="card">
      <div class="calc-display" id="c-disp">0</div>
      <div class="calc-grid">
        <button onclick="cIn('C')" class="op">C</button>
        <button onclick="cIn('(')" class="op">(</button>
        <button onclick="cIn(')')" class="op">)</button>
        <button onclick="cIn('/')" class="op">÷</button>
        <button onclick="cIn('7')">7</button>
        <button onclick="cIn('8')">8</button>
        <button onclick="cIn('9')">9</button>
        <button onclick="cIn('*')" class="op">×</button>
        <button onclick="cIn('4')">4</button>
        <button onclick="cIn('5')">5</button>
        <button onclick="cIn('6')">6</button>
        <button onclick="cIn('-')" class="op">−</button>
        <button onclick="cIn('1')">1</button>
        <button onclick="cIn('2')">2</button>
        <button onclick="cIn('3')">3</button>
        <button onclick="cIn('+')" class="op">+</button>
        <button onclick="cIn('0')" class="zero">0</button>
        <button onclick="cIn('.')">.</button>
        <button onclick="cEq()" class="eq">=</button>
      </div>
    </div>
  </section>

  <!-- NOTES -->
  <section class="view" id="notes">
    <div class="card">
      <div class="row">
        <input id="n-title" placeholder="Título da nota...">
        <button class="btn" onclick="saveNote()">💾 Salvar</button>
      </div>
      <textarea id="n-body" placeholder="Escreva aqui..." style="margin-top:10px"></textarea>
    </div>
    <h2 class="sec">Notas salvas</h2>
    <div id="n-list" class="grid g3"></div>
  </section>

  <!-- SYS -->
  <section class="view" id="sys">
    <div class="card">
      <div class="lbl">Informações do dispositivo</div>
      <div id="sys-info" style="margin-top:12px;font-size:13px;line-height:1.9;color:var(--mut)"></div>
    </div>
    <h2 class="sec">Dados</h2>
    <div class="card">
      <div class="row">
        <button class="btn alt" onclick="exportData()">⬇️ Exportar JSON</button>
        <button class="btn err" onclick="wipe()">🗑️ Apagar tudo</button>
      </div>
    </div>
  </section>

</main>

<button id="fab" onclick="showToast('NexusOS v2.4 · ' + new Date().toLocaleTimeString())">＋</button>
<div id="toast"></div>

<script>
/* ================= ESTADO ================= */
const S = {
  tasks: JSON.parse(localStorage.getItem('nx_tasks')||'[]'),
  notes: JSON.parse(localStorage.getItem('nx_notes')||'[]'),
  start: Date.now()
};
const save = () => {
  localStorage.setItem('nx_tasks', JSON.stringify(S.tasks));
  localStorage.setItem('nx_notes', JSON.stringify(S.notes));
};

/* ================= NAV ================= */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    b.classList.add('active');
    document.getElementById(b.dataset.v).classList.add('active');
    log('view → '+b.dataset.v);
  };
});

/* ================= LOG ================= */
function log(m){
  const el=document.getElementById('log');
  const t=new Date().toLocaleTimeString();
  el.innerHTML=`<div><span class="t">[${t}]</span> ${m}</div>`+el.innerHTML;
  if(el.children.length>60) el.lastChild.remove();
}

/* ================= TOAST ================= */
let tId;
function showToast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(tId); tId=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= TASKS ================= */
function addTask(){
  const inp=document.getElementById('t-in');
  const v=inp.value.trim(); if(!v) return;
  S.tasks.push({id:Date.now(),txt:v,done:false});
  inp.value=''; save(); renderTasks(); log('+ tarefa: '+v);
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id); if(t) t.done=!t.done; save(); renderTasks();
}
function delTask(id){
  S.tasks=S.tasks.filter(x=>x.id!==id); save(); renderTasks(); log('− tarefa removida');
}
function renderTasks(){
  const el=document.getElementById('t-list');
  if(!S.tasks.length){ el.innerHTML='<div class="card" style="text-align:center;color:var(--mut)">Sem tarefas ainda.</div>'; }
  else{
    el.innerHTML=S.tasks.map(t=>`
      <div class="task ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})">
        <span class="txt">${esc(t.txt)}</span>
        <button class="del" onclick="delTask(${t.id})">✕</button>
      </div>`).join('');
  }
  document.getElementById('s-tasks').textContent=S.tasks.length;
  const d=S.tasks.filter(t=>t.done).length;
  const pct=S.tasks.length?Math.round(d/S.tasks.length*100):0;
  document.getElementById('p-txt').textContent=pct+'%';
  document.getElementById('p-bar').style.width=pct+'%';
}

/* ================= CALC ================= */
let cBuf='';
function cIn(c){
  if(c==='C'){cBuf='';}
  else cBuf+=c;
  document.getElementById('c-disp').textContent=cBuf||'0';
}
function cEq(){
  try{
    const r=Function('"use strict";return('+cBuf+')')();
    document.getElementById('c-disp').textContent=r;
    log('calc: '+cBuf+' = '+r);
    cBuf=String(r);
  }catch(e){ document.getElementById('c-disp').textContent='erro'; cBuf=''; }
}

/* ================= NOTES ================= */
function saveNote(){
  const t=document.getElementById('n-title').value.trim();
  const b=document.getElementById('n-body').value.trim();
  if(!t && !b) return;
  S.notes.unshift({id:Date.now(),t:t||'(sem título)',b,ts:new Date().toLocaleString()});
  document.getElementById('n-title').value='';
  document.getElementById('n-body').value='';
  save(); renderNotes(); log('+ nota: '+t); showToast('Nota salva');
}
function delNote(id){
  S.notes=S.notes.filter(n=>n.id!==id); save(); renderNotes();
}
function renderNotes(){
  const el=document.getElementById('n-list');
  if(!S.notes.length){ el.innerHTML='<div class="card" style="color:var(--mut);text-align:center">Sem notas.</div>'; }
  else{
    el.innerHTML=S.notes.map(n=>`
      <div class="card">
        <div class="lbl">${esc(n.ts)}</div>
        <div style="font-weight:700;margin:6px 0 8px">${esc(n.t)}</div>
        <div style="font-size:13px;color:var(--mut);white-space:pre-wrap;max-height:120px;overflow:auto">${esc(n.b)}</div>
        <button class="btn err" style="margin-top:10px;padding:6px 12px;font-size:12px" onclick="delNote(${n.id})">Excluir</button>
      </div>`).join('');
  }
  document.getElementById('s-notes').textContent=S.notes.length;
}

/* ================= SYS ================= */
function renderSys(){
  const ua=navigator.userAgent;
  const info=`
    Plataforma: ${navigator.platform||'—'}<br>
    Idioma: ${navigator.language}<br>
    Cores de CPU: ${navigator.hardwareConcurrency||'—'}<br>
    Memória: ${navigator.deviceMemory?navigator.deviceMemory+' GB':'—'}<br>
    Online: ${navigator.onLine?'✅ Sim':'❌ Não'}<br>
    Tela: ${screen.width}×${screen.height}<br>
    UserAgent: ${esc(ua.slice(0,80))}...
  `;
  document.getElementById('sys-info').innerHTML=info;
  document.getElementById('s-mem').textContent = navigator.deviceMemory? navigator.deviceMemory+'GB' : '--';
}

/* ================= EXPORT/WIPE ================= */
function exportData(){
  const data=JSON.stringify({tasks:S.tasks,notes:S.notes},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='nexus_backup_'+Date.now()+'.json';
  a.click(); showToast('Backup exportado'); log('export → json');
}
function wipe(){
  if(!confirm('Apagar todos os dados?')) return;
  S.tasks=[]; S.notes=[]; save(); renderTasks(); renderNotes();
  showToast('Dados apagados'); log('wipe');
}

/* ================= UTIL ================= */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ================= LOOP ================= */
setInterval(()=>{
  document.getElementById('clock').textContent=new Date().toLocaleTimeString();
  const s=Math.floor((Date.now()-S.start)/1000);
  document.getElementById('s-up').textContent = s<60? s+'s' : Math.floor(s/60)+'m'+s%60+'s';
},1000);

/* ================= INIT ================= */
renderTasks(); renderNotes(); renderSys();
log('Sistema iniciado');
log('Bem-vindo ao NexusOS');
</script>
</body>
</html>
