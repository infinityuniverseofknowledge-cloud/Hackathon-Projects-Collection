<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Câmbio Internacional — Frankfurter</title>
<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#1a2233;--txt:#e5e7eb;--mut:#6b7280;--acc:#3b82f6;--ok:#10b981;--bd:#1f2937}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:20px}
.app{max-width:800px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:grid;place-items:center;font-size:22px}
h1{font-size:1.3rem;font-weight:800}h1 span{display:block;font-size:.75rem;color:var(--mut);font-weight:400;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:14px}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
@media(max-width:600px){.conv{grid-template-columns:1fr;gap:8px}}
label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:5px;display:block}
input,select{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #3b82f633}
.swap{background:var(--card2);border:1px solid var(--bd);width:42px;height:42px;border-radius:50%;cursor:pointer;color:var(--acc);font-size:18px;display:grid;place-items:center;transition:.25s;justify-self:center}
.swap:hover{background:var(--acc);color:#fff;transform:rotate(180deg)}
.result{background:linear-gradient(135deg,#1e3a8a,#1e40af);border:1px solid #3b82f6;border-radius:12px;padding:18px;margin-top:14px}
.result .lbl{font-size:11px;color:#93c5fd;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.result .val{font-size:28px;font-weight:800;font-family:ui-monospace,monospace;letter-spacing:-1px;word-break:break-all}
.result .rate{font-size:12px;color:#bfdbfe;margin-top:6px}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.hitem{background:var(--card2);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
.hitem .d{font-size:10px;color:var(--mut);font-weight:700;margin-bottom:3px}
.hitem .v{font-size:14px;font-weight:800;font-family:ui-monospace,monospace}
.chart{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-top:12px}
.chart svg{width:100%;height:180px;overflow:visible}
.chart .gl{stroke:#1f2937;stroke-width:1}
.chart .line{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .lbl{font-size:9px;fill:var(--mut);font-family:ui-monospace,monospace}
.msg{padding:20px;text-align:center;color:var(--mut);font-size:13px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:10px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">💱</div>
    <h1>Câmbio Internacional<span>Frankfurter API · 201 moedas · 84 bancos centrais</span></h1>
  </header>

  <div class="card">
    <h2>Conversor de moedas</h2>
    <div class="conv">
      <div><label>Valor</label><input id="amount" type="number" value="1000" step="0.01"></div>
      <div style="align-self:end"><button class="swap" id="swap">⇄</button></div>
      <div><label>De / Para</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <select id="from"></select>
          <select id="to"></select>
        </div>
      </div>
    </div>
    <div class="result">
      <div class="lbl">Resultado</div>
      <div class="val" id="result">—</div>
      <div class="rate" id="rate"></div>
    </div>
  </div>

  <div class="card">
    <h2>Histórico (últimos 90 dias)</h2>
    <div class="chart" id="chart"><div class="msg"><span class="spinner"></span>Carregando...</div></div>
    <div class="hist" id="hist"></div>
  </div>

  <footer>Frankfurter · API sem chave · Dados de bancos centrais oficiais</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const API='https://api.frankfurter.dev/v1';
let currencies={};

async function loadCurrencies(){
  const r=await fetch(`${API}/currencies`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  currencies=await r.json();
}

function populate(){
  const codes=Object.keys(currencies).sort();
  const html=codes.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('#from').innerHTML=html;$('#to').innerHTML=html;
  $('#from').value='USD';$('#to').value='BRL';
}

function fmt(n){
  if(n==null)return '—';
  const a=Math.abs(n);
  if(a>=1)return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:4});
  return n.toFixed(6);
}

async function convert(){
  const amount=parseFloat($('#amount').value)||0;
  const from=$('#from').value,to=$('#to').value;
  if(from===to){
    $('#result').textContent=amount.toFixed(2)+' '+to;
    $('#rate').textContent='1 '+from+' = 1 '+to;return;
  }
  try{
    const r=await fetch(`${API}/latest?amount=${amount}&base=${from}&symbols=${to}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const v=d.rates[to];
    $('#result').textContent=fmt(v)+' '+to;
    $('#rate').textContent=`1 ${from} = ${fmt(v/amount)} ${to} · ${d.date}`;
  }catch(e){
    $('#result').textContent='—';$('#rate').textContent='Erro: '+e.message;
  }
  loadChart();
}

async function loadChart(){
  const from=$('#from').value,to=$('#to').value;
  if(from===to){$('#chart').innerHTML='<div class="msg">Selecione moedas diferentes</div>';$('#hist').innerHTML='';return}
  $('#chart').innerHTML='<div class="msg"><span class="spinner"></span>Carregando histórico...</div>';
  try{
    const end=new Date(),start=new Date();
    start.setDate(end.getDate()-90);
    const f=d=>d.toISOString().slice(0,10);
    const r=await fetch(`${API}/${f(start)}..${f(end)}?base=${from}&symbols=${to}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    const entries=Object.entries(d.rates).sort().map(([k,v])=>[k,v[to]]);
    if(!entries.length){$('#chart').innerHTML='<div class="msg">Sem dados</div>';return}
    drawChart(entries);
    // Últimos 10
    const last=entries.slice(-10).reverse();
    $('#hist').innerHTML=last.map(([dt,v])=>`
      <div class="hitem"><div class="d">${dt.slice(5)}</div><div class="v">${fmt(v)}</div></div>
    `).join('');
  }catch(e){
    $('#chart').innerHTML='<div class="msg" style="color:#fca5a5">Erro: '+e.message+'</div>';
  }
}

function drawChart(data){
  const w=760,h=180,pad=30;
  const vals=data.map(d=>d[1]);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const px=i=>pad+i*(w-2*pad)/(data.length-1);
  const py=v=>h-pad-(v-min)*(h-2*pad)/range;
  const path=data.map((d,i)=>(i?'L':'M')+px(i)+','+py(d[1])).join(' ');
  const area=path+` L${px(data.length-1)},${h-pad} L${px(0)},${h-pad} Z`;
  const ticks=[0,.5,1].map(t=>{
    const v=min+range*t;
    return `<line class="gl" x1="${pad}" x2="${w-pad}" y1="${py(v)}" y2="${py(v)}"/>
            <text class="lbl" x="2" y="${py(v)+3}">${v.toFixed(3)}</text>`;
  }).join('');
  const labels=[
    [0,data[0][0].slice(5)],
    [Math.floor(data.length/2),data[Math.floor(data.length/2)][0].slice(5)],
    [data.length-1,data[data.length-1][0].slice(5)]
  ].map(([i,d])=>`<text class="lbl" x="${px(i)}" y="${h-8}" text-anchor="middle">${d}</text>`).join('');
  $('#chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks}<path d="${area}" fill="url(#g)"/><path class="line" d="${path}"/>
    <circle cx="${px(data.length-1)}" cy="${py(vals[vals.length-1])}" r="4" fill="#3b82f6" stroke="#111827" stroke-width="2"/>
    ${labels}</svg>`;
}

$('#amount').addEventListener('input',convert);
$('#from').addEventListener('change',convert);
$('#to').addEventListener('change',convert);
$('#swap').addEventListener('click',()=>{
  const a=$('#from').value;$('#from').value=$('#to').value;$('#to').value=a;convert();
});

(async()=>{
  try{
    await loadCurrencies();
    populate();
    convert();
  }catch(e){
    $('#result').textContent='Erro: '+e.message;
  }
})();
</script>
</body>
</html>
