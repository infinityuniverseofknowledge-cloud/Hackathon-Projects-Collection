<script>
/* ═══════════════════════════════════════════════════════════════
   IMAGE3D_MODULE_MARKER
   Módulo de análise de imagem e reconstrução 2.5D densa.
   Não é IA — é segmentação por cor + relevo por luminância.
   ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

function ready(fn){
  if (window.OMNI && window.OMNI.SceneManager && window.OMNI.SceneManager.scene){
    try { fn(); } catch(e){ console.error('[Image3D]', e); }
  } else {
    setTimeout(function(){ ready(fn); }, 120);
  }
}
ready(init);

function init(){
  var S = window.OMNI.SceneManager;
  var scene = S.scene;

  /* ============ GRUPO DE OBJETOS EXTRAÍDOS ============ */
  var importedGroup = new THREE.Group();
  importedGroup.name = 'Importados';
  scene.add(importedGroup);

  /* ============ UI — painel esquerdo ============ */
  var panel = document.createElement('div');
  panel.className = 'sect';
  panel.id = 'image3dSection';
  panel.innerHTML = [
    '<div class="panel-title">🧠 Image → 3D</div>',
    '<input type="file" id="i3dFile" accept="image/*" style="display:none">',
    '<button class="tbtn" id="i3dLoad" style="width:100%">+ Carregar imagem</button>',
    '<div style="margin-top:6px;position:relative">',
      '<canvas id="i3dPreview" width="220" height="145" style="width:100%;',
        'border:1px solid #263048;border-radius:6px;background:#05070c;display:block;cursor:crosshair"></canvas>',
    '</div>',
    '<div class="row" style="margin-top:8px"><label>Segmentação</label>',
      '<input type="range" id="i3dThresh" min="15" max="80" step="1" value="35">',
      '<span class="val" id="i3dThreshV">35</span></div>',
    '<div class="row"><label>Resolução</label>',
      '<input type="range" id="i3dRes" min="48" max="180" step="4" value="120">',
      '<span class="val" id="i3dResV">120</span></div>',
    '<div class="row"><label>Profundidade</label>',
      '<input type="range" id="i3dDepth" min="0" max="1.2" step="0.05" value="0.35">',
      '<span class="val" id="i3dDepthV">0.35</span></div>',
    '<div class="row"><label>Tamanho (m)</label>',
      '<input type="range" id="i3dScale" min="0.5" max="6" step="0.1" value="2.2">',
      '<span class="val" id="i3dScaleV">2.2</span></div>',
    '<div class="grid2" style="margin-top:6px">',
      '<button class="grid-btn" id="i3dDetect">🔍 Detectar</button>',
      '<button class="grid-btn active" id="i3dExtract">🧊 Extrair</button>',
    '</div>',
    '<div class="grid2" style="margin-top:4px">',
      '<button class="grid-btn" id="i3dClear">🗑 Limpar extraídos</button>',
      '<button class="grid-btn" id="i3dAuto">⚡ Auto</button>',
    '</div>',
    '<div id="i3dInfo" style="font-size:10px;color:#7b8ba3;margin-top:6px;',
      'font-family:ui-monospace,monospace;line-height:1.6">Sem imagem</div>',
    '<div id="i3dList" style="margin-top:6px;max-height:130px;overflow-y:auto;',
      'font-size:10px;font-family:ui-monospace,monospace"></div>'
  ].join('');
  var lp = document.getElementById('leftPanel');
  if (lp) lp.appendChild(panel); else document.body.appendChild(panel);

  /* ============ ESTADO ============ */
  var srcCanvas = document.createElement('canvas');
  var srcCtx = srcCanvas.getContext('2d');
  var srcData = null;      /* ImageData analisado */
  var srcW = 0, srcH = 0;  /* dimensões da análise */
  var regionIdArr = null;  /* Int32Array: -1 = fora, -2 = pequena, >=0 = id */
  var regions = [];        /* {id, minX, minY, maxX, maxY, count, color} */
  var selectedId = -1;
  var previewCanvas = document.getElementById('i3dPreview');
  var previewCtx = previewCanvas.getContext('2d');
  var previewImg = null;
  var lastFile = null;

  /* ============ UTIL ============ */
  function srgbToLinear(v){
    v = v / 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }
  function setInfo(t){ document.getElementById('i3dInfo').textContent = t; }
  function setStatus(t, k){
    var el = document.getElementById('statusBar'); if (!el) return;
    var cls = k === 'ok' ? 'ok' : k === 'err' ? 'err' : k === 'warn' ? 'warn' : '';
    el.innerHTML = '<span class="' + cls + '">●</span> ' + t;
  }

  /* ============ CARREGAR IMAGEM ============ */
  function loadImage(file){
    if (!file || !file.type.startsWith('image/')) {
      setInfo('Formato não suportado (use JPG/PNG/WebP)');
      return;
    }
    lastFile = file;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var res = parseInt(document.getElementById('i3dRes').value) || 120;
        var aspect = img.width / img.height;
        if (aspect >= 1){ srcW = res; srcH = Math.max(16, Math.round(res / aspect)); }
        else { srcH = res; srcW = Math.max(16, Math.round(res * aspect)); }
        srcCanvas.width = srcW;
        srcCanvas.height = srcH;
        srcCtx.imageSmoothingEnabled = true;
        srcCtx.drawImage(img, 0, 0, srcW, srcH);
        srcData = srcCtx.getImageData(0, 0, srcW, srcH);
        previewImg = img;
        regions = [];
        regionIdArr = null;
        selectedId = -1;
        drawPreview();
        renderList();
        setInfo('Imagem ' + img.width + '×' + img.height + ' → análise ' + srcW + '×' + srcH);
      };
      img.onerror = function(){ setInfo('Erro ao decodificar imagem'); };
      img.src = r.result;
    };
    r.onerror = function(){ setInfo('Erro ao ler arquivo'); };
    r.readAsDataURL(file);
  }

  /* ============ PREVIEW ============ */
  function drawPreview(){
    var cw = previewCanvas.width, ch = previewCanvas.height;
    previewCtx.fillStyle = '#05070c';
    previewCtx.fillRect(0, 0, cw, ch);
    if (!previewImg){ return; }
    var aspect = previewImg.width / previewImg.height;
    var w = cw, h = cw / aspect;
    if (h > ch){ h = ch; w = ch * aspect; }
    var ox = (cw - w) / 2, oy = (ch - h) / 2;
    previewCtx.drawImage(previewImg, ox, oy, w, h);
    if (regions.length){
      previewCtx.font = '9px monospace';
      for (var i = 0; i < regions.length; i++){
        var r = regions[i];
        var rx = ox + (r.minX / srcW) * w;
        var ry = oy + (r.minY / srcH) * h;
        var rw = ((r.maxX - r.minX + 1) / srcW) * w;
        var rh = ((r.maxY - r.minY + 1) / srcH) * h;
        previewCtx.strokeStyle = (r.id === selectedId) ? '#ff60a8' : 'rgba(77,184,255,0.55)';
        previewCtx.lineWidth = (r.id === selectedId) ? 2 : 1;
        previewCtx.strokeRect(rx, ry, rw, rh);
        previewCtx.fillStyle = 'rgba(0,0,0,0.75)';
        previewCtx.fillRect(rx, ry - 10, 22, 10);
        previewCtx.fillStyle = '#4db8ff';
        previewCtx.fillText('#' + r.id, rx + 2, ry - 2);
      }
    }
  }

  /* ============ SEGMENTAÇÃO POR COR (BFS flood fill) ============ */
  function segmentAll(){
    if (!srcData){ setInfo('Carregue uma imagem primeiro'); return; }
    var thresh = parseInt(document.getElementById('i3dThresh').value) || 35;
    var threshSq = thresh * thresh * 3;
    var data = srcData.data;
    var total = srcW * srcH;
    regionIdArr = new Int32Array(total);
    for (var i = 0; i < total; i++) regionIdArr[i] = -1;
    regions = [];
    var queue = new Int32Array(total);
    var nextId = 0;

    setStatus('Analisando ' + total + ' pixels...', 'warn');

    for (var y = 0; y < srcH; y++){
      for (var x = 0; x < srcW; x++){
        var s = y * srcW + x;
        if (regionIdArr[s] !== -1) continue;
        var r0 = data[s*4], g0 = data[s*4+1], b0 = data[s*4+2];
        var head = 0, tail = 0;
        queue[tail++] = s;
        regionIdArr[s] = nextId;
        var minX = x, maxX = x, minY = y, maxY = y;
        var sumR = 0, sumG = 0, sumB = 0, count = 0;
        while (head < tail){
          var cur = queue[head++];
          var cx = cur % srcW;
          var cy = (cur / srcW) | 0;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;
          sumR += data[cur*4];
          sumG += data[cur*4+1];
          sumB += data[cur*4+2];
          count++;
          /* 8 vizinhos */
          for (var dy = -1; dy <= 1; dy++){
            var ny = cy + dy;
            if (ny < 0 || ny >= srcH) continue;
            for (var dx = -1; dx <= 1; dx++){
              if (dx === 0 && dy === 0) continue;
              var nx = cx + dx;
              if (nx < 0 || nx >= srcW) continue;
              var n = ny * srcW + nx;
              if (regionIdArr[n] !== -1) continue;
              var dr = data[n*4] - r0;
              var dg = data[n*4+1] - g0;
              var db = data[n*4+2] - b0;
              if (dr*dr + dg*dg + db*db > threshSq) continue;
              regionIdArr[n] = nextId;
              queue[tail++] = n;
            }
          }
        }
        if (count < 30){
          /* Marca como pequena para não poluir */
          for (var k = 0; k < tail; k++) regionIdArr[queue[k]] = -2;
        } else {
          regions.push({
            id: nextId,
            minX: minX, minY: minY, maxX: maxX, maxY: maxY,
            count: count,
            color: [Math.round(sumR/count), Math.round(sumG/count), Math.round(sumB/count)]
          });
          nextId++;
        }
      }
    }

    regions.sort(function(a, b){ return b.count - a.count; });
    if (regions.length) selectedId = regions[0].id;

    drawPreview();
    renderList();
    setStatus('Detectadas ' + regions.length + ' regiões', 'ok');
    setInfo(regions.length + ' regiões · toque para selecionar');
  }

  /* ============ LISTA DE REGIÕES ============ */
  function renderList(){
    var el = document.getElementById('i3dList');
    el.innerHTML = '';
    if (!regions.length){
      el.innerHTML = '<div style="color:#556377;padding:6px 0">Nenhuma região. Clique em 🔍 Detectar.</div>';
      return;
    }
    for (var i = 0; i < regions.length; i++){
      var r = regions[i];
      var div = document.createElement('div');
      var on = r.id === selectedId;
      div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;' +
        'padding:3px 6px;border-radius:4px;cursor:pointer;margin-bottom:2px;' +
        'border:1px solid ' + (on ? '#ff60a8' : 'transparent') + ';' +
        'background:' + (on ? 'rgba(255,96,168,0.15)' : 'transparent') + ';' +
        'color:' + (on ? '#fff' : '#8b9ab2');
      var col = 'rgb(' + r.color.join(',') + ')';
      div.innerHTML =
        '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;' +
        'background:' + col + ';margin-right:6px;vertical-align:middle;border:1px solid #333"></span>' +
        '#' + r.id + ' <span style="color:#556377">' + (r.maxX-r.minX+1) + '×' + (r.maxY-r.minY+1) + '</span></span>' +
        '<span style="color:#4db8ff">' + r.count + 'px</span>';
      (function(rid){
        div.addEventListener('click', function(){
          selectedId = rid; drawPreview(); renderList();
        });
      })(r.id);
      el.appendChild(div);
    }
  }

  /* ============ CLIQUE NO PREVIEW ============ */
  function pickRegion(px, py){
    if (!srcData || !previewImg) return -1;
    var cw = previewCanvas.width, ch = previewCanvas.height;
    var aspect = previewImg.width / previewImg.height;
    var w = cw, h = cw / aspect;
    if (h > ch){ h = ch; w = ch * aspect; }
    var ox = (cw - w) / 2, oy = (ch - h) / 2;
    var sx = Math.floor(((px - ox) / w) * srcW);
    var sy = Math.floor(((py - oy) / h) * srcH);
    if (sx < 0 || sy < 0 || sx >= srcW || sy >= srcH) return -1;
    return regionIdArr ? regionIdArr[sy * srcW + sx] : -1;
  }
  previewCanvas.addEventListener('click', function(e){
    var rect = previewCanvas.getBoundingClientRect();
    var px = (e.clientX - rect.left) / rect.width * previewCanvas.width;
    var py = (e.clientY - rect.top) / rect.height * previewCanvas.height;
    var rid = pickRegion(px, py);
    if (rid >= 0){ selectedId = rid; drawPreview(); renderList(); }
  });

  /* ============ EXTRAIR REGIÃO → MALHA DENSA ============ */
  function extractRegion(rid){
    if (rid < 0 || !regionIdArr){ setInfo('Selecione uma região'); return; }
    var reg = null;
    for (var i = 0; i < regions.length; i++) if (regions[i].id === rid) { reg = regions[i]; break; }
    if (!reg) return;

    var depth = parseFloat(document.getElementById('i3dDepth').value) || 0.35;
    var targetSize = parseFloat(document.getElementById('i3dScale').value) || 2.2;

    var bw = reg.maxX - reg.minX + 1;
    var bh = reg.maxY - reg.minY + 1;
    var scale = targetSize / Math.max(bw, bh);
    var cx = reg.minX + bw / 2;
    var cy = reg.minY + bh / 2;

    /* Mapa de índices locais */
    var idxMap = new Int32Array(srcW * srcH);
    for (var k = 0; k < idxMap.length; k++) idxMap[k] = -1;
    var vcount = 0;
    var data = srcData.data;
    for (var y = reg.minY; y <= reg.maxY; y++){
      for (var x = reg.minX; x <= reg.maxX; x++){
        var p = y * srcW + x;
        if (regionIdArr[p] === rid){ idxMap[p] = vcount++; }
      }
    }
    if (vcount < 4){ setInfo('Região muito pequena'); return; }

    var positions = new Float32Array(vcount * 3);
    var colors = new Float32Array(vcount * 3);
    var uvs = new Float32Array(vcount * 2);

    for (var y2 = reg.minY; y2 <= reg.maxY; y2++){
      for (var x2 = reg.minX; x2 <= reg.maxX; x2++){
        var p2 = y2 * srcW + x2;
        var vi = idxMap[p2];
        if (vi < 0) continue;
        var pr = data[p2*4], pg = data[p2*4+1], pb = data[p2*4+2];
        var lum = (pr * 0.299 + pg * 0.587 + pb * 0.114) / 255;
        var h = lum * depth;
        /* Plano XY com +Z apontando para câmera */
        positions[vi*3+0] = (x2 - cx) * scale;
        positions[vi*3+1] = (cy - y2) * scale;
        positions[vi*3+2] = h;
        colors[vi*3+0] = srgbToLinear(pr);
        colors[vi*3+1] = srgbToLinear(pg);
        colors[vi*3+2] = srgbToLinear(pb);
        uvs[vi*2+0] = (x2 - reg.minX) / bw;
        uvs[vi*2+1] = 1 - (y2 - reg.minY) / bh;
      }
    }

    /* Triangulação: cada 2×2 de pixels vira 2 triângulos */
    var indices = [];
    for (var y3 = reg.minY; y3 < reg.maxY; y3++){
      for (var x3 = reg.minX; x3 < reg.maxX; x3++){
        var a = idxMap[y3 * srcW + x3];
        var b = idxMap[y3 * srcW + (x3+1)];
        var c = idxMap[(y3+1) * srcW + x3];
        var d = idxMap[(y3+1) * srcW + (x3+1)];
        if (a >= 0 && b >= 0 && c >= 0 && d >= 0){
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }
    }
    if (!indices.length){ setInfo('Não foi possível triangular'); return; }

    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.setIndex(indices);
    geom.computeVertexNormals();
    geom.computeBoundingSphere();

    var mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.62,
      metalness: 0.06,
      side: THREE.DoubleSide
    });
    var mesh = new THREE.Mesh(geom, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.pickable = true;
    mesh.userData.name = 'Imagem #' + rid;
    mesh.userData.cat = 'imported';
    mesh.userData.h = 0.3;

    /* Posiciona em frente à câmera */
    var cam = S.camera;
    var dir = new THREE.Vector3();
    cam.getWorldDirection(dir);
    var origin = cam.position.clone().add(dir.multiplyScalar(4.5));
    origin.y = 1.4;
    mesh.position.copy(origin);
    /* Vira para a câmera */
    var toCam = cam.position.clone().sub(mesh.position);
    mesh.rotation.y = Math.atan2(toCam.x, toCam.z);

    importedGroup.add(mesh);

    var tris = indices.length / 3;
    setInfo('Extraído #' + rid + ' · ' + vcount + ' vértices · ' + tris.toLocaleString() + ' triângulos');
    setStatus('Objeto: ' + tris.toLocaleString() + ' triângulos', 'ok');
  }

  /* ============ LIMPAR EXTRAÍDOS ============ */
  function clearExtracted(){
    while (importedGroup.children.length){
      var c = importedGroup.children[0];
      c.traverse(function(o){
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      importedGroup.remove(c);
    }
    setStatus('Extraídos limpos', 'ok');
    setInfo('Cena limpa');
  }

  /* ============ AUTO ============ */
  function autoExtract(){
    if (!srcData){ setInfo('Carregue uma imagem primeiro'); return; }
    if (!regions.length) segmentAll();
    var extracted = 0;
    var max = Math.min(6, regions.length);
    for (var i = 0; i < max; i++){
      /* Extrai cada região grande com espaçamento radial */
      var reg = regions[i];
      if (reg.count < 80) continue;
      extractOne(reg, i, max);
      extracted++;
    }
    setStatus('Extraídos ' + extracted + ' objetos automaticamente', 'ok');
  }
  function extractOne(reg, idx, total){
    var rid = reg.id;
    var depth = parseFloat(document.getElementById('i3dDepth').value) || 0.35;
    var targetSize = parseFloat(document.getElementById('i3dScale').value) || 2.2;
    var bw = reg.maxX - reg.minX + 1;
    var bh = reg.maxY - reg.minY + 1;
    var scale = targetSize / Math.max(bw, bh) * 0.55;
    var cx = reg.minX + bw / 2;
    var cy = reg.minY + bh / 2;
    var idxMap = new Int32Array(srcW * srcH);
    for (var k = 0; k < idxMap.length; k++) idxMap[k] = -1;
    var vcount = 0;
    var data = srcData.data;
    for (var y = reg.minY; y <= reg.maxY; y++)
      for (var x = reg.minX; x <= reg.maxX; x++){
        var p = y * srcW + x;
        if (regionIdArr[p] === rid) idxMap[p] = vcount++;
      }
    if (vcount < 20) return;
    var positions = new Float32Array(vcount * 3);
    var colors = new Float32Array(vcount * 3);
    for (var y2 = reg.minY; y2 <= reg.maxY; y2++)
      for (var x2 = reg.minX; x2 <= reg.maxX; x2++){
        var p2 = y2 * srcW + x2;
        var vi = idxMap[p2];
        if (vi < 0) continue;
        var pr = data[p2*4], pg = data[p2*4+1], pb = data[p2*4+2];
        var lum = (pr * 0.299 + pg * 0.587 + pb * 0.114) / 255;
        positions[vi*3+0] = (x2 - cx) * scale;
        positions[vi*3+1] = (cy - y2) * scale;
        positions[vi*3+2] = lum * depth * 0.55;
        colors[vi*3+0] = srgbToLinear(pr);
        colors[vi*3+1] = srgbToLinear(pg);
        colors[vi*3+2] = srgbToLinear(pb);
      }
    var indices = [];
    for (var y3 = reg.minY; y3 < reg.maxY; y3++)
      for (var x3 = reg.minX; x3 < reg.maxX; x3++){
        var a = idxMap[y3 * srcW + x3];
        var b = idxMap[y3 * srcW + (x3+1)];
        var c = idxMap[(y3+1) * srcW + x3];
        var d = idxMap[(y3+1) * srcW + (x3+1)];
        if (a >= 0 && b >= 0 && c >= 0 && d >= 0){
          indices.push(a, c, b); indices.push(b, c, d);
        }
      }
    if (!indices.length) return;
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geom.setIndex(indices);
    geom.computeVertexNormals();
    geom.computeBoundingSphere();
    var mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.65, metalness: 0.05, side: THREE.DoubleSide
    }));
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.pickable = true;
    mesh.userData.name = 'Imagem #' + rid;
    mesh.userData.cat = 'imported';
    /* Coloca em círculo ao redor do centro */
    var angle = (idx / Math.max(total,1)) * Math.PI * 2;
    var radius = 3.2;
    mesh.position.set(Math.cos(angle) * radius, 1.4, Math.sin(angle) * radius);
    mesh.rotation.y = Math.atan2(-mesh.position.x, -mesh.position.z);
    importedGroup.add(mesh);
  }

  /* ============ BIND ============ */
  var fi = document.getElementById('i3dFile');
  document.getElementById('i3dLoad').addEventListener('click', function(){ fi.click(); });
  fi.addEventListener('change', function(e){
    if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('i3dDetect').addEventListener('click', segmentAll);
  document.getElementById('i3dExtract').addEventListener('click', function(){
    if (selectedId < 0){ setInfo('Selecione uma região primeiro'); return; }
    extractRegion(selectedId);
  });
  document.getElementById('i3dClear').addEventListener('click', clearExtracted);
  document.getElementById('i3dAuto').addEventListener('click', autoExtract);

  ['i3dThresh','i3dRes','i3dDepth','i3dScale'].forEach(function(id){
    var inp = document.getElementById(id);
    var out = document.getElementById(id + 'V');
    if (inp && out){
      inp.addEventListener('input', function(){ out.textContent = inp.value; });
      out.textContent = inp.value;
    }
  });
  /* Reanalisa ao mudar resolução se já tem imagem */
  document.getElementById('i3dRes').addEventListener('change', function(){
    if (lastFile) loadImage(lastFile);
  });

  /* Drag & drop no painel */
  panel.addEventListener('dragover', function(e){ e.preventDefault(); panel.style.borderColor = '#ff60a8'; });
  panel.addEventListener('dragleave', function(){ panel.style.borderColor = ''; });
  panel.addEventListener('drop', function(e){
    e.preventDefault();
    panel.style.borderColor = '';
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
  });

  /* Atalhos: O extrai seleção, A extrai automático */
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'o' && selectedId >= 0) extractRegion(selectedId);
    if (k === 'a') autoExtract();
  });

  /* API */
  window.Image3D = {
    loadImage: loadImage,
    segmentAll: segmentAll,
    extractRegion: extractRegion,
    autoExtract: autoExtract,
    clearExtracted: clearExtracted,
    get regions(){ return regions.slice(); },
    get imported(){ return importedGroup; }
  };

  console.log('[Image3D] Módulo carregado. Atalhos: O=extrair, A=auto');
}
})();
</script>
