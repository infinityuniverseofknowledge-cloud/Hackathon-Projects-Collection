<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>OMNISPACE 3D v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0e14;color:#dfe6f2;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;font-size:13px;touch-action:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;outline:none;background:none}
canvas{display:block}
#app{position:fixed;inset:0;display:grid;
  grid-template-rows:44px 1fr 26px;
  grid-template-columns:240px 1fr 240px;
  grid-template-areas:"top top top" "left center right" "bot bot bot";
  background:#0b0e14}
#topBar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg,#141a26,#0e131c);border-bottom:1px solid #1e2634;z-index:20}
#leftPanel{grid-area:left;background:#0e131c;border-right:1px solid #1e2634;
  overflow-y:auto;padding:10px;z-index:15}
#rightPanel{grid-area:right;background:#0e131c;border-left:1px solid #1e2634;
  overflow-y:auto;padding:10px;z-index:15}
#centerArea{grid-area:center;position:relative;overflow:hidden;background:#05070c}
#botBar{grid-area:bot;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:#0a0e16;border-top:1px solid #1e2634;
  font-family:ui-monospace,monospace;font-size:11px;color:#7b8ba3;z-index:20}
#canvas3D{width:100%;height:100%;display:block;touch-action:none}
.logo{font-weight:800;letter-spacing:2px;color:#4db8ff;text-shadow:0 0 12px rgba(77,184,255,.35)}
.logo span{color:#ff60a8}
.tbtn{padding:5px 10px;border:1px solid #263048;border-radius:6px;background:#131a26;
  color:#b8c4d8;font-size:11px}
.tbtn:hover{background:#1a2333;border-color:#3a4a68;color:#fff}
.tbtn.primary{background:#1a4f7a;border-color:#3a80b8;color:#fff}
.tbtn.play{background:#1a7a3a;border-color:#3ab860;color:#fff}
.tbtn.play.active{background:#ff60a8;border-color:#ff60a8}
.panel-title{font-size:11px;letter-spacing:1.2px;color:#6b7b93;
  text-transform:uppercase;margin:4px 0 6px}
.sect{border:1px solid #1e2634;border-radius:8px;background:#0c1220;padding:8px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:0 0 82px;font-size:11px;color:#8b9ab2}
.row input[type=range]{flex:1;height:3px;accent-color:#4db8ff}
.row input[type=number],.row select{flex:1;padding:4px 6px;background:#0a0f18;
  border:1px solid #263048;border-radius:4px;font-size:11px}
.row .val{flex:0 0 38px;text-align:right;font-family:ui-monospace,monospace;
  font-size:10px;color:#4db8ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.grid-btn{padding:6px 4px;border:1px solid #263048;border-radius:6px;background:#131a26;
  font-size:10px;color:#b8c4d8;text-align:center}
.grid-btn:hover{background:#1a2333;color:#fff}
.grid-btn.active{background:#1a4f7a;border-color:#3a80b8;color:#fff}
#statusBar{color:#8899ad}
#statusBar .ok{color:#4ade80}
#statusBar .warn{color:#fbbf24}
#statusBar .err{color:#f87171}
#diagPanel{position:absolute;top:8px;right:8px;max-width:280px;
  background:rgba(8,12,20,.95);border:1px solid #263048;border-radius:8px;
  padding:8px 10px;font-family:ui-monospace,monospace;font-size:10px;
  color:#c8d4e8;z-index:30;display:none;max-height:60vh;overflow-y:auto}
#diagPanel.show{display:block}
#diagPanel h4{margin-bottom:6px;color:#4db8ff;font-size:11px;letter-spacing:1px}
#diagPanel .tr{display:flex;justify-content:space-between;padding:1px 0;
  border-bottom:1px dashed #1a2333}
#toast{position:absolute;bottom:50px;left:50%;transform:translateX(-50%) translateY(10px);
  padding:8px 18px;background:rgba(10,15,25,.96);border:1px solid #263048;
  border-radius:8px;color:#c8d4e8;font-size:11px;opacity:0;
  transition:all .25s;pointer-events:none;z-index:50;max-width:80%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fpHud{position:absolute;inset:0;pointer-events:none;z-index:12;display:none}
#fpHud.show{display:block}
#crosshair{position:absolute;top:50%;left:50%;width:14px;height:14px;
  transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
#crosshair::before,#crosshair::after{content:'';position:absolute;
  background:#fff;box-shadow:0 0 4px rgba(0,0,0,.9)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#joyZoneFP{position:absolute;inset:0;pointer-events:none;display:none}
#joyZoneFP.show{display:block}
#joyBaseFP{position:absolute;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,rgba(80,120,180,.42) 0%,
    rgba(40,60,100,.42) 45%,rgba(20,26,36,.55) 100%);
  border:2.5px solid rgba(150,190,240,.55);
  box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(80,140,220,.25);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;
  pointer-events:none;backdrop-filter:blur(6px)}
#joyBaseFP.show{opacity:1}
#joyBaseFP::before{content:'';position:absolute;inset:22px;border-radius:50%;
  border:1.5px dashed rgba(150,190,240,.32)}
#joyKnobFP{position:absolute;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(230,240,255,.98) 0%,
    rgba(150,190,240,.95) 25%,rgba(60,100,180,.9) 60%,rgba(20,40,90,.95) 100%);
  border:3px solid #d8e8ff;
  box-shadow:0 8px 24px rgba(40,100,200,.55),0 0 40px rgba(100,160,240,.4),
    inset 0 -6px 12px rgba(0,0,0,.35),inset 0 6px 12px rgba(220,240,255,.5);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none}
#joyKnobFP.show{opacity:1}
.fpActions{position:absolute;right:20px;bottom:30px;display:flex;
  flex-direction:column;gap:12px;align-items:center;pointer-events:auto;z-index:13}
.fpBtn{width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(120,180,90,.98) 0%,
    rgba(60,100,40,.95) 45%,rgba(20,40,15,.98) 100%);
  border:2.5px solid #a0e060;color:#f0ffd0;font-size:1.5rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 -4px 8px rgba(0,0,0,.45);
  transition:transform .1s;font-family:ui-monospace,monospace}
.fpBtn:active{transform:scale(.9)}
.fpBtn.small{width:52px;height:52px;font-size:.85rem;
  background:radial-gradient(circle at 35% 28%,rgba(120,80,180,.98) 0%,
    rgba(60,30,100,.95) 45%,rgba(20,10,40,.98) 100%);
  border-color:#c090ff;color:#f0d8ff}
#fpModeHint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  color:#8ba0c0;font-size:11px;font-family:ui-monospace,monospace;
  pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.9);opacity:.9;
  background:rgba(8,12,20,.6);padding:6px 12px;border-radius:8px;border:1px solid #263048}
#fpModeHint b{color:#4db8ff}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "center" "bot";
    grid-template-rows:44px 1fr 26px}
  #leftPanel,#rightPanel{position:fixed;top:44px;bottom:26px;width:270px;
    transition:transform .25s;z-index:18}
  #leftPanel{left:0;transform:translateX(-100%)}
  #rightPanel{right:0;transform:translateX(100%)}
  #leftPanel.show{transform:translateX(0)}
  #rightPanel.show{transform:translateX(0)}
  #toggleLeft,#toggleRight{display:inline-block}
}
</style>
</head>
<body>
<div id="app">
  <div id="topBar">
    <div class="logo">OMNI<span>SPACE</span> 3D</div>
    <button class="tbtn" id="toggleLeft">☰</button>
    <button class="tbtn" id="toggleRight">⚙</button>
    <div style="flex:1"></div>
    <button class="tbtn primary" id="btnGenerate">⟳ Novo Edifício</button>
    <button class="tbtn" id="btnRandomSeed">🎲 Seed</button>
    <button class="tbtn play" id="btnPlay">🎮 Jogar</button>
    <button class="tbtn" id="btnDiag">🐞</button>
  </div>

  <div id="leftPanel">
    <div class="sect">
      <div class="panel-title">Edifício</div>
      <div class="row"><label>Grid</label>
        <select id="selGrid">
          <option value="2">2 × 2</option>
          <option value="3" selected>3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
        </select></div>
      <div class="row"><label>Slot (m)</label>
        <input type="range" id="rSlot" min="4" max="10" step="0.5" value="7">
        <span class="val" id="vSlot">7.0</span></div>
      <div class="row"><label>Preenchim.</label>
        <input type="range" id="rFill" min="0.4" max="1" step="0.05" value="0.75">
        <span class="val" id="vFill">0.75</span></div>
      <div class="row"><label>Pé-direito</label>
        <input type="range" id="rH" min="2.4" max="4.2" step="0.1" value="2.9">
        <span class="val" id="vH">2.9</span></div>
      <div class="row"><label>Porta (m)</label>
        <input type="range" id="rDoor" min="0.8" max="1.5" step="0.05" value="1.05">
        <span class="val" id="vDoor">1.05</span></div>
      <div class="row"><label>Seed</label>
        <input type="number" id="inpSeed" value="7777"></div>
      <div class="grid2" style="margin-top:6px">
        <button class="grid-btn" id="btnRegenFurn">↻ Móveis</button>
        <button class="grid-btn" id="btnRegenAll">↻ Tudo</button>
      </div>
    </div>

    <div class="sect">
      <div class="panel-title">Materiais</div>
      <div class="row"><label>Piso</label><select id="selFloorStyle">
        <option value="wood">Madeira</option><option value="tile">Cerâmica</option>
        <option value="marble">Mármore</option><option value="concrete">Concreto</option>
      </select></div>
      <div class="row"><label>Parede</label><select id="selWallStyle">
        <option value="plaster">Gesso</option><option value="brick">Tijolo</option>
        <option value="concrete">Concreto</option><option value="woodPanel">Painel madeira</option>
      </select></div>
    </div>

    <div class="sect">
      <div class="panel-title">Qualidade</div>
      <div class="grid3">
        <button class="grid-btn" data-q="low">LOW</button>
        <button class="grid-btn active" data-q="balanced">BAL</button>
        <button class="grid-btn" data-q="high">HIGH</button>
      </div>
    </div>

    <div class="sect">
      <div class="panel-title">Visualização</div>
      <div class="grid2">
        <button class="grid-btn active" id="btnCeilVis">Teto ✓</button>
        <button class="grid-btn" id="btnWireframe">Wireframe</button>
        <button class="grid-btn" id="btnGrid">Grade</button>
        <button class="grid-btn" id="btnLamps">Luzes ✓</button>
      </div>
    </div>
  </div>

  <div id="centerArea">
    <canvas id="canvas3D"></canvas>

    <div id="fpHud">
      <div id="crosshair"></div>
      <div id="joyZoneFP">
        <div id="joyBaseFP"></div>
        <div id="joyKnobFP"></div>
      </div>
      <div class="fpActions">
        <button class="fpBtn" id="btnJumpFP">⬆</button>
        <button class="fpBtn small" id="btnRunFP">🏃</button>
      </div>
      <div id="fpModeHint">Toque <b>esquerda</b> p/ andar · <b>direita</b> p/ olhar</div>
    </div>

    <div id="diagPanel"></div>
  </div>

  <div id="rightPanel">
    <div class="sect">
      <div class="panel-title">Câmera</div>
      <div class="grid2">
        <button class="grid-btn" data-cam="top">Topo</button>
        <button class="grid-btn" data-cam="front">Frente</button>
        <button class="grid-btn" data-cam="side">Lado</button>
        <button class="grid-btn" data-cam="iso">Isom.</button>
      </div>
    </div>
    <div class="sect">
      <div class="panel-title">Iluminação</div>
      <div class="row"><label>Ambiente</label>
        <input type="range" id="rAmb" min="0" max="2" step="0.05" value="0.55">
        <span class="val" id="vAmb">0.55</span></div>
      <div class="row"><label>Sol</label>
        <input type="range" id="rSun" min="0" max="2" step="0.05" value="1.0">
        <span class="val" id="vSun">1.0</span></div>
      <div class="row"><label>Exposição</label>
        <input type="range" id="rExp" min="0.3" max="2" step="0.05" value="1.0">
        <span class="val" id="vExp">1.0</span></div>
      <div class="grid3">
        <button class="grid-btn active" data-light="day">Dia</button>
        <button class="grid-btn" data-light="eve">Tarde</button>
        <button class="grid-btn" data-light="nit">Noite</button>
      </div>
      <div class="grid3" style="margin-top:5px">
        <button class="grid-btn" data-light="cin">Cine</button>
        <button class="grid-btn" data-light="arc">Arq.</button>
        <button class="grid-btn" data-light="warm">Quente</button>
      </div>
    </div>
    <div class="sect">
      <div class="panel-title">Legenda</div>
      <div style="font-size:10px;color:#7b8ba3;line-height:1.8;font-family:ui-monospace,monospace">
        <b style="color:#4db8ff">Editar:</b><br>
        1 dedo — orbitar · pinça — zoom<br><br>
        <b style="color:#ff60a8">FPS:</b><br>
        Esq. anda · Dir. olha<br>
        ⬆ pula · 🏃 corre<br>
        Desktop: WASD + mouse
      </div>
    </div>
  </div>

  <div id="botBar">
    <span id="statusBar"><span class="ok">●</span> Pronto</span>
    <span style="flex:1"></span>
    <span id="roomCount">0 salas</span>
    <span id="objCount">0 objetos</span>
    <span id="fps">— fps</span>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script>
'use strict';
/* ================================================================
   UTILS
   ================================================================ */
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function $id(id){ return document.getElementById(id); }
function toast(msg, dur){
  const t = $id('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), dur||2000);
}
function setStatus(txt, kind){
  const cls = kind==='ok'?'ok':kind==='warn'?'warn':kind==='err'?'err':'';
  $id('statusBar').innerHTML = '<span class="'+cls+'">●</span> ' + txt;
}

/* ================================================================
   TEXTURE FACTORY — alta complexidade + bump maps
   ================================================================ */
const TextureFactory = (function(){
  function mk(size, draw){
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    draw(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function mkBump(size, draw){
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    draw(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
  }
  function col(hex, amt){
    const c = new THREE.Color(hex);
    return '#' + new THREE.Color(
      clamp(c.r+amt,0,1), clamp(c.g+amt,0,1), clamp(c.b+amt,0,1)
    ).getHexString();
  }

  /* ============ WOOD — 512×512 com grão direcional + nós + poros ============ */
  function wood(base, seed, vertical){
    const rng = mulberry32(seed||1);
    // cor
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = base; ctx.fillRect(0,0,S,S);
      // bandas de tom entre tábuas
      const bands = 8;
      for (let i=0; i<bands; i++){
        const off = (i/bands) * S + (rng()-0.5)*3;
        ctx.fillStyle = 'rgba(0,0,0,'+(0.02 + rng()*0.05).toFixed(3)+')';
        ctx.fillRect(off, 0, 1+rng()*2, S);
      }
      // grão principal (linhas verticais/horizontais)
      const nGrain = 90;
      for (let i=0; i<nGrain; i++){
        const pos = rng() * S;
        const w = 0.6 + rng()*2.2;
        const alpha = 0.10 + rng()*0.22;
        ctx.strokeStyle = rng()>0.5 ? 'rgba(60,30,10,'+alpha+')' : 'rgba(120,80,40,'+alpha+')';
        ctx.lineWidth = w;
        ctx.beginPath();
        if (vertical){
          ctx.moveTo(pos, 0);
          for (let y=0; y<=S; y+=10){
            const wob = Math.sin(y*0.012 + i*0.4) * (2+rng()*3);
            ctx.lineTo(pos + wob, y);
          }
        } else {
          ctx.moveTo(0, pos);
          for (let x=0; x<=S; x+=10){
            const wob = Math.sin(x*0.012 + i*0.4) * (2+rng()*3);
            ctx.lineTo(x, pos + wob);
          }
        }
        ctx.stroke();
      }
      // poros (pontinhos escuros)
      for (let i=0; i<2000; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = 'rgba(30,15,5,'+(0.05 + rng()*0.15)+')';
        const l = 0.6 + rng()*1.4;
        if (vertical) ctx.fillRect(x, y, 0.5, l);
        else ctx.fillRect(x, y, l, 0.5);
      }
      // nós
      const knots = 3 + Math.floor(rng()*3);
      for (let k=0; k<knots; k++){
        const kx = rng()*S, ky = rng()*S;
        const kr = 8 + rng()*14;
        for (let r=2; r<kr; r+=1.5){
          ctx.strokeStyle = 'rgba(40,20,8,'+(0.15 + r*0.01)+')';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.ellipse(kx, ky, r, r*(0.55+rng()*0.2), rng()*Math.PI, 0, Math.PI*2);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(25,12,4,0.9)';
        ctx.beginPath(); ctx.arc(kx, ky, 2.5, 0, Math.PI*2); ctx.fill();
      }
      // highlight / sombra em gradiente
      const g = ctx.createLinearGradient(0,0,S,S);
      g.addColorStop(0, 'rgba(255,255,255,0.03)');
      g.addColorStop(0.5, 'rgba(0,0,0,0.02)');
      g.addColorStop(1, 'rgba(0,0,0,0.08)');
      ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
    });
    // bump
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#808080'; ctx.fillRect(0,0,S,S);
      const nGrain = 60;
      for (let i=0; i<nGrain; i++){
        const pos = rng() * S;
        ctx.strokeStyle = 'rgba(0,0,0,'+(0.08 + rng()*0.15)+')';
        ctx.lineWidth = 0.5 + rng()*2;
        ctx.beginPath();
        if (vertical){
          ctx.moveTo(pos, 0);
          for (let y=0; y<=S; y+=12) ctx.lineTo(pos + Math.sin(y*0.02 + i)*(1.5), y);
        } else {
          ctx.moveTo(0, pos);
          for (let x=0; x<=S; x+=12) ctx.lineTo(x, pos + Math.sin(x*0.02 + i)*(1.5));
        }
        ctx.stroke();
      }
      for (let i=0; i<800; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x, y, 1, 1);
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  /* ============ TILES — cerâmica com variação por peça ============ */
  function tiles(base, groutCol, seed, n){
    const rng = mulberry32(seed||2);
    n = n || 4;
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = groutCol; ctx.fillRect(0,0,S,S);
      const cw = S/n;
      // grão do grout
      for (let i=0; i<3000; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = rng()>0.5 ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(x, y, 1, 1);
      }
      for (let i=0; i<n; i++){
        for (let j=0; j<n; j++){
          const tint = (rng()-0.5) * 0.10;
          const x0 = i*cw, y0 = j*cw;
          ctx.fillStyle = col(base, tint);
          ctx.fillRect(x0+3, y0+3, cw-6, cw-6);
          // brilho superior
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          ctx.fillRect(x0+3, y0+3, cw-6, 3);
          ctx.fillStyle = 'rgba(255,255,255,0.04)';
          ctx.fillRect(x0+3, y0+3, 3, cw-6);
          // sombra inferior
          ctx.fillStyle = 'rgba(0,0,0,0.10)';
          ctx.fillRect(x0+3, y0+cw-6, cw-6, 3);
          // micro ruído da cerâmica
          for (let k=0; k<40; k++){
            const px = x0 + 3 + rng()*(cw-6);
            const py = y0 + 3 + rng()*(cw-6);
            ctx.fillStyle = rng()>0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
            ctx.fillRect(px, py, 1, 1);
          }
          // desgaste nos cantos
          if (rng() < 0.15){
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.beginPath();
            ctx.arc(x0 + 6 + rng()*(cw-12), y0 + 6 + rng()*(cw-12),
                    3 + rng()*6, 0, Math.PI*2);
            ctx.fill();
          }
        }
      }
    });
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#333'; ctx.fillRect(0,0,S,S);
      const cw = S/n;
      for (let i=0; i<n; i++){
        for (let j=0; j<n; j++){
          ctx.fillStyle = '#c8c8c8';
          ctx.fillRect(i*cw+2, j*cw+2, cw-4, cw-4);
          // variação sutil
          for (let k=0; k<30; k++){
            const px = i*cw + 2 + rng()*(cw-4);
            const py = j*cw + 2 + rng()*(cw-4);
            ctx.fillStyle = rng()>0.5 ? '#b0b0b0' : '#e0e0e0';
            ctx.fillRect(px, py, 1, 1);
          }
        }
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  /* ============ BRICK ============ */
  function brick(base, mortarCol, seed){
    const rng = mulberry32(seed||3);
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = mortarCol; ctx.fillRect(0,0,S,S);
      // grão da argamassa
      for (let i=0; i<4000; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = rng()>0.5 ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.05)';
        ctx.fillRect(x, y, 1, 1);
      }
      const rows = 8;
      const rh = S / rows;
      const bw = S / 4;
      for (let r=0; r<rows; r++){
        const off = (r % 2) * (bw/2);
        for (let x=-1; x<6; x++){
          const bx = x*bw + off;
          const by = r*rh;
          const tint = (rng()-0.5)*0.14;
          // cor base do tijolo
          ctx.fillStyle = col(base, tint);
          ctx.fillRect(bx+3, by+3, bw-6, rh-6);
          // sombra de borda
          ctx.fillStyle = 'rgba(0,0,0,0.15)';
          ctx.fillRect(bx+3, by+rh-4, bw-6, 2);
          ctx.fillRect(bx+bw-5, by+3, 2, rh-6);
          // highlight superior
          ctx.fillStyle = 'rgba(255,200,180,0.10)';
          ctx.fillRect(bx+3, by+3, bw-6, 2);
          // mancha / variação
          if (rng() < 0.35){
            ctx.fillStyle = 'rgba(0,0,0,'+(0.05+rng()*0.10)+')';
            const sx = bx + 4 + rng()*(bw-8);
            const sy = by + 4 + rng()*(rh-8);
            ctx.beginPath(); ctx.arc(sx, sy, 2+rng()*5, 0, Math.PI*2); ctx.fill();
          }
          // pequenas trincas
          if (rng() < 0.15){
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(bx + 4 + rng()*(bw-8), by + 4 + rng()*(rh-8));
            ctx.lineTo(bx + 4 + rng()*(bw-8), by + 4 + rng()*(rh-8));
            ctx.stroke();
          }
        }
      }
    });
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0,0,S,S);
      const rows = 8, rh = S/rows, bw = S/4;
      for (let r=0; r<rows; r++){
        const off = (r%2)*(bw/2);
        for (let x=-1; x<6; x++){
          ctx.fillStyle = '#c8c8c8';
          ctx.fillRect(x*bw+off+2, r*rh+2, bw-4, rh-4);
          for (let k=0; k<20; k++){
            ctx.fillStyle = rng()>0.5 ? '#a0a0a0' : '#e0e0e0';
            ctx.fillRect(x*bw+off+2 + rng()*(bw-4), r*rh+2 + rng()*(rh-4), 1, 1);
          }
        }
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  /* ============ PLASTER — parede de gesso ============ */
  function plaster(base, seed){
    const rng = mulberry32(seed||4);
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = base; ctx.fillRect(0,0,S,S);
      // textura fina (grão médio)
      for (let i=0; i<8000; i++){
        const x = rng()*S, y = rng()*S;
        const a = 0.02 + rng()*0.06;
        ctx.fillStyle = rng() > 0.5 ? 'rgba(255,255,255,'+a+')' : 'rgba(0,0,0,'+a+')';
        ctx.fillRect(x, y, 1, 1);
      }
      // manchas suaves grandes
      for (let i=0; i<12; i++){
        const cx = rng()*S, cy = rng()*S;
        const r = 40 + rng()*120;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const a = rng()*0.04;
        g.addColorStop(0, rng()>0.5 ? 'rgba(255,255,255,'+a+')' : 'rgba(0,0,0,'+a+')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
      // pinceladas sutis
      for (let i=0; i<80; i++){
        const x = rng()*S, y = rng()*S;
        ctx.strokeStyle = 'rgba(0,0,0,'+(0.02 + rng()*0.04)+')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (rng()-0.5)*30, y + (rng()-0.5)*30);
        ctx.stroke();
      }
    });
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#a0a0a0'; ctx.fillRect(0,0,S,S);
      for (let i=0; i<3000; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = rng()>0.5 ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(x, y, 1, 1);
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  /* ============ CONCRETE ============ */
  function concrete(base, seed){
    const rng = mulberry32(seed||5);
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = base; ctx.fillRect(0,0,S,S);
      // agregado
      for (let i=0; i<12000; i++){
        const x = rng()*S, y = rng()*S;
        const a = 0.02 + rng()*0.09;
        ctx.fillStyle = rng() > 0.5 ? 'rgba(255,255,255,'+a+')' : 'rgba(0,0,0,'+a+')';
        ctx.fillRect(x, y, 1 + (rng()>0.85 ? 1 : 0), 1 + (rng()>0.85 ? 1 : 0));
      }
      // manchas escuras / líquenes
      for (let i=0; i<20; i++){
        const cx = rng()*S, cy = rng()*S;
        const r = 30 + rng()*140;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const a = 0.03 + rng()*0.10;
        g.addColorStop(0, 'rgba(30,30,30,'+a+')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
      // rachaduras finas
      for (let i=0; i<10; i++){
        let x = rng()*S, y = rng()*S;
        ctx.strokeStyle = 'rgba(20,20,20,0.35)';
        ctx.lineWidth = 0.4 + rng()*0.4;
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let k=0; k<30; k++){
          x += (rng()-0.5)*14; y += (rng()-0.5)*14;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // grandes manchas claras
      for (let i=0; i<6; i++){
        const cx = rng()*S, cy = rng()*S;
        const r = 60 + rng()*120;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, 'rgba(255,255,255,0.05)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
    });
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#909090'; ctx.fillRect(0,0,S,S);
      for (let i=0; i<6000; i++){
        const x = rng()*S, y = rng()*S;
        ctx.fillStyle = rng()>0.5 ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.10)';
        ctx.fillRect(x, y, 1, 1);
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  /* ============ MARBLE ============ */
  function marble(base, seed){
    const rng = mulberry32(seed||6);
    const colorTex = mk(512, (ctx, S)=>{
      ctx.fillStyle = base; ctx.fillRect(0,0,S,S);
      // fundo com variação
      for (let i=0; i<4000; i++){
        const a = 0.02 + rng()*0.05;
        ctx.fillStyle = rng()>0.5 ? 'rgba(255,255,255,'+a+')' : 'rgba(0,0,0,'+a+')';
        ctx.fillRect(rng()*S, rng()*S, 1, 1);
      }
      // veios principais (escuros)
      for (let i=0; i<18; i++){
        const y0 = rng()*S;
        ctx.strokeStyle = 'rgba(40,40,55,'+(0.20 + rng()*0.30)+')';
        ctx.lineWidth = 0.8 + rng()*2.2;
        ctx.beginPath();
        ctx.moveTo(0, y0);
        let x = 0, y = y0;
        while (x < S){
          x += 4 + rng()*10;
          y += (rng()-0.5) * 12 + Math.sin(x*0.02+i)*3;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        // ramos
        for (let b=0; b<3; b++){
          const bx = rng()*S, by = y0 + (rng()-0.5)*40;
          ctx.strokeStyle = 'rgba(50,50,65,'+(0.15+rng()*0.20)+')';
          ctx.lineWidth = 0.5 + rng()*1.0;
          ctx.beginPath(); ctx.moveTo(bx, by);
          let cx = bx, cy = by;
          for (let k=0; k<8; k++){
            cx += (rng()-0.5)*20; cy += (rng()-0.5)*20;
            ctx.lineTo(cx, cy);
          }
          ctx.stroke();
        }
      }
      // veios secundários claros
      for (let i=0; i<12; i++){
        const y0 = rng()*S;
        ctx.strokeStyle = 'rgba(255,255,255,'+(0.10+rng()*0.15)+')';
        ctx.lineWidth = 0.5 + rng()*1.2;
        ctx.beginPath(); ctx.moveTo(0, y0);
        let x=0, y=y0;
        while (x<S){ x += 5+rng()*8; y += (rng()-0.5)*8; ctx.lineTo(x,y); }
        ctx.stroke();
      }
    });
    const bumpTex = mkBump(256, (ctx, S)=>{
      ctx.fillStyle = '#b0b0b0'; ctx.fillRect(0,0,S,S);
      const rng2 = mulberry32(seed+1);
      for (let i=0; i<2000; i++){
        const x = rng2()*S, y = rng2()*S;
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(x, y, 1, 1);
      }
    });
    return { color: colorTex, bump: bumpTex };
  }

  return { wood, tiles, brick, plaster, concrete, marble };
})();

/* ================================================================
   MATERIAL CACHE — combina color + bump + roughness
   ================================================================ */
const MaterialCache = (function(){
  const cache = new Map();
  function get(key, build){
    if (cache.has(key)) return cache.get(key);
    const m = build();
    cache.set(key, m);
    return m;
  }
  function clear(){ cache.forEach(m => m.dispose && m.dispose()); cache.clear(); }
  return { get, clear };
})();

function makeFloorMaterial(style){
  return MaterialCache.get('floor:'+style, ()=>{
    let tex, rough = 0.75, bumpScale = 0.03;
    if (style === 'wood'){
      tex = TextureFactory.wood('#8b5c3a', 11, false);
      rough = 0.62;
      bumpScale = 0.035;
    } else if (style === 'tile'){
      tex = TextureFactory.tiles('#c8bca8', '#6a6460', 12, 4);
      rough = 0.28;
      bumpScale = 0.02;
    } else if (style === 'marble'){
      tex = TextureFactory.marble('#e8e4dc', 13);
      rough = 0.18;
      bumpScale = 0.012;
    } else {
      tex = TextureFactory.concrete('#8a8a92', 14);
      rough = 0.92;
      bumpScale = 0.045;
    }
    tex.color.repeat.set(2, 2);
    tex.bump.repeat.set(2, 2);
    return new THREE.MeshStandardMaterial({
      map: tex.color,
      bumpMap: tex.bump,
      bumpScale: bumpScale,
      roughness: rough,
      metalness: 0.04
    });
  });
}
function makeWallMaterial(style){
  return MaterialCache.get('wall:'+style, ()=>{
    let tex, rough = 0.92, bumpScale = 0.04;
    if (style === 'brick'){
      tex = TextureFactory.brick('#a85c44', '#8a8278', 21);
      rough = 0.88;
      bumpScale = 0.06;
    } else if (style === 'concrete'){
      tex = TextureFactory.concrete('#b8b4ac', 22);
      rough = 0.95;

    } else if (style === 'woodPanel'){
      tex = TextureFactory.wood('#8b5c3a', 23, true);

    } else {

    }

    return new THREE.MeshStandardMaterial({

      metalness: 0.03
    });
  });
}
function makeCeilingMaterial(){
  return MaterialCache.get('ceil', ()=>{
    const tex = TextureFactory.plaster('#eae6de', 25);
    tex.color.repeat.set(1.2, 1.2);

    });

}

/* ================================================================
   WALL BUILDER — igual ao v2
   ================================================================ */
const WallBuilder = {
  build(p){
    const { x1, z1, x2, z2, height, thickness, openings, material,
            glassMaterial, frameMaterial } = p;
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const angle = Math.atan2(dz, dx);
    const group = new THREE.Group();
    const colliders = [];
    const ops = (openings || []).slice().sort((a,b)=>a.position - b.position);
    let cursor = 0;
    const segs = [];
    for (const op of ops){
      const c = op.position * len;
      const s = c - op.width/2, e = c + op.width/2;
      if (s > cursor) segs.push({ s: cursor, e: s, op: null });
      segs.push({ s, e, op });
      cursor = e;
    }
    if (cursor < len) segs.push({ s: cursor, e: len, op: null });

    const t = thickness;
    for (const seg of segs){
      const segLen = seg.e - seg.s;
      if (segLen < 0.01) continue;
      const cT = (seg.s + seg.e) / 2;
      const cx = x1 + Math.cos(angle) * cT;
      const cz = z1 + Math.sin(angle) * cT;
      const cosA = Math.abs(Math.cos(angle));
      const sinA = Math.abs(Math.sin(angle));
      const hw = (segLen*cosA + t*sinA)/2;
      const hd = (segLen*sinA + t*cosA)/2;

      if (!seg.op){
        const m = new THREE.Mesh(new THREE.BoxGeometry(segLen, height, t), material);
        m.position.set(cx, height/2, cz);
        m.rotation.y = -angle;
        m.castShadow = true; m.receiveShadow = true;
        m.userData.pickable = true; m.userData.kind='wall'; m.userData.name='Parede';
        group.add(m);
        colliders.push({
          min: new THREE.Vector3(cx-hw, 0, cz-hd),
          max: new THREE.Vector3(cx+hw, height, cz+hd)
        });
      } else {
        const op = seg.op;
        const sillH = op.sillHeight || 0;
        const topH = height - sillH - op.height;
        if (sillH > 0.01){
          const u = new THREE.Mesh(new THREE.BoxGeometry(segLen, sillH, t), material);
          u.position.set(cx, sillH/2, cz);
          u.rotation.y = -angle;
          u.castShadow = true; u.receiveShadow = true;
          group.add(u);
          colliders.push({
            min: new THREE.Vector3(cx-hw, 0, cz-hd),
            max: new THREE.Vector3(cx+hw, sillH, cz+hd)
          });
        }
        if (topH > 0.01){
          const a = new THREE.Mesh(new THREE.BoxGeometry(segLen, topH, t), material);
          a.position.set(cx, height-topH/2, cz);
          a.rotation.y = -angle;
          a.castShadow = true; a.receiveShadow = true;
          group.add(a);
          colliders.push({
            min: new THREE.Vector3(cx-hw, height-topH, cz-hd),
            max: new THREE.Vector3(cx+hw, height, cz+hd)
          });
        }
        // moldura
        const fw = 0.07;
        const fMat = frameMaterial || material;
        const lf = new THREE.Mesh(new THREE.BoxGeometry(fw, op.height + fw*2, t+0.03), fMat);
        lf.position.set(
          x1 + Math.cos(angle)*seg.s + Math.cos(angle)*fw/2,
          sillH + op.height/2,
          z1 + Math.sin(angle)*seg.s + Math.sin(angle)*fw/2);
        lf.rotation.y = -angle; group.add(lf);
        const rf = new THREE.Mesh(new THREE.BoxGeometry(fw, op.height + fw*2, t+0.03), fMat);
        rf.position.set(
          x1 + Math.cos(angle)*seg.e - Math.cos(angle)*fw/2,
          sillH + op.height/2,
          z1 + Math.sin(angle)*seg.e - Math.sin(angle)*fw/2);
        rf.rotation.y = -angle; group.add(rf);
        const tf2 = new THREE.Mesh(new THREE.BoxGeometry(segLen, fw, t+0.03), fMat);
        tf2.position.set(cx, sillH + op.height + fw/2, cz);
        tf2.rotation.y = -angle; group.add(tf2);

        if (op.kind === 'window' && glassMaterial){
          const g = new THREE.Mesh(
            new THREE.BoxGeometry(segLen - fw*2, op.height - 0.02, 0.02),
            glassMaterial);
          g.position.set(cx, sillH + op.height/2, cz);
          g.rotation.y = -angle;
          group.add(g);
          // mullion
          const mull = new THREE.Mesh(new THREE.BoxGeometry(0.03, op.height, 0.03), fMat);
          mull.position.set(cx, sillH + op.height/2, cz);
          mull.rotation.y = -angle;
          group.add(mull);
        }
      }
    }
    group.userData.colliders = colliders;
    return group;
  }
};

/* ================================================================
   FURNITURE FACTORY — inclui lâmpada de teto emissiva
   ================================================================ */
const FurnitureFactory = (function(){
  const woodMat = ()=> new THREE.MeshStandardMaterial({
    map: MaterialCache.get('woodFurn', ()=> TextureFactory.wood('#8b5c3a', 91, false).color).clone(),
    roughness: 0.65
  });
  const woodDark = ()=> new THREE.MeshStandardMaterial({ color: 0x5a3a20, roughness: 0.75 });
  const metal = ()=> new THREE.MeshStandardMaterial({ color: 0x8a8a94, roughness: 0.32, metalness: 0.75 });
  const white = ()=> new THREE.MeshStandardMaterial({ color: 0xf4f0e8, roughness: 0.82 });
  const glass = ()=> new THREE.MeshPhysicalMaterial({
    color: 0x9fc8ff, transparent: true, opacity: 0.28,
    roughness: 0.08, metalness: 0.0, transmission: 0.7, thickness: 0.05
  });
  const screenM = ()=> new THREE.MeshStandardMaterial({
    color: 0x0c1424, emissive: 0x1a3a5a, emissiveIntensity: 0.55, roughness: 0.15
  });
  const plantM = ()=> new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 0.85 });
  const potM = ()=> new THREE.MeshStandardMaterial({ color: 0x8a4a2a, roughness: 0.75 });
  const fabric = (c, r)=> new THREE.MeshStandardMaterial({
    color: c, roughness: r === undefined ? 0.92 : r
  });
  const lampGlow = ()=> new THREE.MeshStandardMaterial({
    color: 0xffe8b0, emissive: 0xffb040, emissiveIntensity: 1.4, roughness: 0.4
  });

  function box(w,h,d,mat,x,y,z){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function cyl(rt,rb,h,mat,x,y,z,seg){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16), mat);
    m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function sph(r,mat,x,y,z){
    const m = new THREE.Mesh(new THREE.SphereGeometry(r,14,10), mat);
    m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  function grp(name, cat, fp){
    const g = new THREE.Group();
    g.userData.pickable = true;
    g.userData.name = name;
    g.userData.cat = cat || 'furniture';
    g.userData.footprint = fp || { w:1, d:1 };
    return g;
  }

  function bed(){
    const g = grp('Cama','bed',{w:1.4,d:2.0});
    const w=1.4,l=2.0,fh=0.35;
    g.add(box(w,fh,l,woodDark(),0,fh/2,0));
    g.add(box(w-0.05,0.22,l-0.15,white(),0,fh+0.11,0));

/* ================================================================
   BUILDING GENERATOR — adiciona lâmpada de teto por sala
   ================================================================ */
const BuildingGenerator = (function(){
  const ROOM_STYLES = ['living','bedroom','office','kitchen','dining','bathroom'];

  function generate(params){
    const { gridSize, slotSize, fillRate, height, doorW,
            floorStyle, wallStyle, density, seed } = params;
    const rng = mulberry32(seed);
    const rg = SceneManager.roomGroup;
    const fg = SceneManager.furnGroup;

    disposeChildren(rg);
    disposeChildren(fg);

    const fMat = makeFloorMaterial(floorStyle);
    const wMat = makeWallMaterial(wallStyle);
    const cMat = makeCeilingMaterial();
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x9fc8ff, transparent: true, opacity: 0.25,
      roughness: 0.05, metalness: 0.0, transmission: 0.75, thickness: 0.05
    });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a1f18, roughness: 0.65 });

    const occ = [];
    for (let r=0; r<gridSize; r++){
      occ[r] = [];
      for (let c=0; c<gridSize; c++) occ[r][c] = rng() < fillRate;
    }
    const center = Math.floor(gridSize/2);
    occ[center][center] = true;

    const halfGrid = (gridSize-1) / 2;
    const allColliders = [];
    const rooms = [];

    const bW = gridSize * slotSize;
    const bD = gridSize * slotSize;
    const floor = new THREE.Mesh(new THREE.BoxGeometry(bW, 0.15, bD), fMat);
    floor.position.set(0, -0.075, 0);
    floor.receiveShadow = true;
    floor.userData.pickable = true; floor.userData.kind='floor'; floor.userData.name='Piso';
    rg.add(floor);

    const ceiling = new THREE.Mesh(new THREE.BoxGeometry(bW, 0.1, bD), cMat);
    ceiling.position.set(0, height + 0.05, 0);
    ceiling.receiveShadow = true;
    ceiling.userData.pickable = true; ceiling.userData.kind='ceiling'; ceiling.userData.name='Teto';
    rg.add(ceiling);

    for (let r=0; r<gridSize; r++){
      for (let c=0; c<gridSize; c++){
        if (!occ[r][c]) continue;
        const roomX = (c - halfGrid) * slotSize;
        const roomZ = (r - halfGrid) * slotSize;
        const hw = slotSize / 2;
        const styleIdx = Math.floor(rng() * ROOM_STYLES.length);
        const style = ROOM_STYLES[styleIdx];
        const roomSeed = Math.floor(rng() * 999999);
        rooms.push({ x: roomX, z: roomZ, style, seed: roomSeed, grid: [r,c] });

        // lâmpada de teto
        const lamp = FurnitureFactory.create('ceilingLamp');
        lamp.position.set(roomX, height - 0.02, roomZ);
        rg.add(lamp);

        const southHasRoom = (r+1 < gridSize) && occ[r+1][c];
        const sOps = southHasRoom
          ? [{ position: 0.5, width: doorW, height: Math.min(2.1, height-0.2), sillHeight: 0, kind:'door' }]
          : [];
        const wS = WallBuilder.build({ x1: roomX-hw, z1: roomZ+hw, x2: roomX+hw, z2: roomZ+hw,
          height, thickness: 0.16, openings: sOps, material: wMat,
          glassMaterial: glassMat, frameMaterial: frameMat });
        rg.add(wS); allColliders.push(...(wS.userData.colliders||[]));

        const northHasRoom = (r-1 >= 0) && occ[r-1][c];
        const nOps = northHasRoom
          ? [{ position: 0.5, width: doorW, height: Math.min(2.1, height-0.2), sillHeight: 0, kind:'door' }]
          : [{ position: 0.5, width: 1.4, height: 1.0, sillHeight: 0.9, kind:'window' }];
        const wN = WallBuilder.build({ x1: roomX-hw, z1: roomZ-hw, x2: roomX+hw, z2: roomZ-hw,
          height, thickness: 0.16, openings: nOps, material: wMat,
          glassMaterial: glassMat, frameMaterial: frameMat });
        rg.add(wN); allColliders.push(...(wN.userData.colliders||[]));

        const westHasRoom = (c-1 >= 0) && occ[r][c-1];
        const wOps = westHasRoom
          ? [{ position: 0.5, width: doorW, height: Math.min(2.1, height-0.2), sillHeight: 0, kind:'door' }]
          : [];
        const wW = WallBuilder.build({ x1: roomX-hw, z1: roomZ-hw, x2: roomX-hw, z2: roomZ+hw,
          height, thickness: 0.16, openings: wOps, material: wMat,
          glassMaterial: glassMat, frameMaterial: frameMat });
        rg.add(wW); allColliders.push(...(wW.userData.colliders||[]));

        const eastHasRoom = (c+1 < gridSize) && occ[r][c+1];
        const eOps = eastHasRoom
          ? [{ position: 0.5, width: doorW, height: Math.min(2.1, height-0.2), sillHeight: 0, kind:'door' }]
          : [{ position: 0.5, width: 1.4, height: 1.0, sillHeight: 0.9, kind:'window' }];
        const wE = WallBuilder.build({ x1: roomX+hw, z1: roomZ-hw, x2: roomX+hw, z2: roomZ+hw,
          height, thickness: 0.16, openings: eOps, material: wMat,
          glassMaterial: glassMat, frameMaterial: frameMat });
        rg.add(wE); allColliders.push(...(wE.userData.colliders||[]));
      }
    }

    const collidersFurn = [];
    for (const room of rooms){
      const furn = generateRoomFurniture(room, slotSize, height, density, rng);
      fg.add(furn.group);
      collidersFurn.push(...furn.colliders);
    }

    SceneManager.setColliders([...allColliders, ...collidersFurn]);
    UIManager.setRoomCount(rooms.length);
    BuildingGenerator._lastRooms = rooms;
    return rooms;
  }

  function generateRoomFurniture(room, size, height, density, rng){
    const g = new THREE.Group();
    g.userData.pickable = false;
    const colliders = [];
    const placed = [];
    const half = size/2 - 0.35;

    function canPlace(x, z, w, d){
      const c = 0.15;
      if (x - w/2 < room.x - half) return false;
      if (x + w/2 > room.x + half) return false;
      if (z - d/2 < room.z - half) return false;
      if (z + d/2 > room.z + half) return false;
      const dc = 1.2;
      if (Math.abs(x - room.x) < dc/2 && z - d/2 < room.z - half + dc) return false;
      if (Math.abs(x - room.x) < dc/2 && z + d/2 > room.z + half - dc) return false;
      if (Math.abs(z - room.z) < dc/2 && x - w/2 < room.x - half + dc) return false;
      if (Math.abs(z - room.z) < dc/2 && x + w/2 > room.x + half - dc) return false;
      for (const p of placed){
        if (Math.abs(p.x - x) < (p.w + w)/2 + c &&
            Math.abs(p.z - z) < (p.d + d)/2 + c) return false;
      }
      return true;
    }
    function addFurn(type, opts, count){
      const n = count || 1;
      for (let i=0; i<n; i++){
        if (rng() > density) continue;
        const proto = FurnitureFactory.create(type, opts);
        if (!proto) continue;
        const fp = proto.userData.footprint || { w:1, d:1 };
        let attempts = 30, ok = false;
        while (attempts-- > 0 && !ok){
          const x = room.x + (rng()-0.5) * (size - 1.5);
          const z = room.z + (rng()-0.5) * (size - 1.5);
          const rot = Math.floor(rng()*4) * Math.PI/2;
          let fw = fp.w, fd = fp.d;
          if (rot === Math.PI/2 || rot === -Math.PI/2){ fw = fp.d; fd = fp.w; }
          if (canPlace(x, z, fw, fd)){
            proto.position.set(x, 0, z);
            proto.rotation.y = rot;
            proto.userData.h = (type === 'bookshelf' || type === 'wardrobe') ? 2.0 : 0.8;
            g.add(proto);
            placed.push({ x, z, w: fw, d: fd });
            colliders.push({
              min: new THREE.Vector3(x - fw/2, 0, z - fd/2),
              max: new THREE.Vector3(x + fw/2, proto.userData.h, z + fd/2)
            });
            ok = true;
          }
        }
      }
    }

    if (room.style === 'living'){
      addFurn('sofa', null, 1);
      addFurn('coffeeTable', null, 1);
      addFurn('tv', null, 1);
      addFurn('armchair', null, 2);
      addFurn('plant', null, 2);
      addFurn('lamp', null, 1);
      addFurn('painting', null, 2);
    } else if (room.style === 'bedroom'){
      addFurn('bed', null, 1);
      addFurn('nightstand', null, 2);
      addFurn('wardrobe', null, 1);
      addFurn('lamp', null, 1);
      addFurn('plant', null, 1);
      addFurn('painting', null, 1);
    } else if (room.style === 'office'){
      addFurn('desk', null, 2);
      addFurn('chair', null, 2);
      addFurn('bookshelf', null, 2);
      addFurn('plant', null, 2);
      addFurn('painting', null, 1);
    } else if (room.style === 'kitchen'){
      addFurn('fridge', null, 1);
      addFurn('kitchenSink', null, 1);
      addFurn('diningTable', null, 1);
      addFurn('chair', null, 4);
    } else if (room.style === 'dining'){
      addFurn('diningTable', null, 1);
      addFurn('chair', null, 6);
      addFurn('plant', null, 1);
      addFurn('painting', null, 1);
    } else if (room.style === 'bathroom'){
      addFurn('toilet', null, 1);
      addFurn('bathtub', null, 1);
      addFurn('plant', null, 1);
    }

    if (rng() < 0.7){
      const rg = FurnitureFactory.create('rug',
        { w: Math.min(2.5, size-2), d: Math.min(1.8, size-2) });
      if (rg){ rg.position.set(room.x, 0, room.z); g.add(rg); }
    }

    return { group: g, colliders };
  }

  function disposeChildren(parent){
    while (parent.children.length){
      const c = parent.children[0];
      c.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      parent.remove(c);
    }
  }

  return { generate, _lastRooms: null };
})();

/* ================================================================
   SCENE MANAGER — iluminação melhorada
   ================================================================ */
const SceneManager = (function(){
  let scene, camera, renderer, controls, raycaster, pointer;
  let gridHelper, roomGroup, furnGroup;
  let ambient, sun, hemi, fill;
  let currentPreset = 'day';

  function init(canvas){
    renderer = new THREE.WebGLRenderer({
      canvas, antialias: true, powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.setClearColor(0x0a0e16, 1);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e16);
    scene.fog = new THREE.Fog(0x0a0e16, 40, 130);

    camera = new THREE.PerspectiveCamera(58, 1, 0.05, 500);
    camera.position.set(15, 14, 15);
    camera.rotation.order = 'YXZ';

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);

    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();

    // --- Iluminação composta ---
    hemi = new THREE.HemisphereLight(0xbcd4ff, 0x302820, 0.5);
    scene.add(hemi);

    ambient = new THREE.AmbientLight(0xffffff, 0.38);
    scene.add(ambient);

    sun = new THREE.DirectionalLight(0xffe8c0, 1.1);
    sun.position.set(14, 24, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 90;
    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    // Luz de preenchimento (fill) oposta ao sol — reduz sombras mortas
    fill = new THREE.DirectionalLight(0x8090c0, 0.22);
    fill.position.set(-12, 10, -14);
    scene.add(fill);

    roomGroup = new THREE.Group(); roomGroup.name = 'Arquitetura'; scene.add(roomGroup);
    furnGroup = new THREE.Group(); furnGroup.name = 'Mobília'; scene.add(furnGroup);

    gridHelper = new THREE.GridHelper(60, 60, 0x22314a, 0x131a26);
    gridHelper.position.y = 0.001;
    gridHelper.visible = false;
    scene.add(gridHelper);

    resize();
    window.addEventListener('resize', resize);
    applyLightPreset('day');
  }

  function applyLightPreset(name){
    currentPreset = name;
    if (name === 'day'){
      scene.background.setHex(0x87b0e0);
      scene.fog.color.setHex(0x87b0e0);
      hemi.color.setHex(0xbcd4ff); hemi.groundColor.setHex(0x504030);
      hemi.intensity = 0.55;
      ambient.intensity = 0.38;
      sun.color.setHex(0xffe8c0); sun.intensity = 1.15;
      sun.position.set(16, 26, 10);
      fill.color.setHex(0x8090c0); fill.intensity = 0.25;
    } else if (name === 'eve'){
      scene.background.setHex(0xff9850);
      scene.fog.color.setHex(0xd07030);
      hemi.color.setHex(0xffa860); hemi.groundColor.setHex(0x402818);
      hemi.intensity = 0.42;
      ambient.intensity = 0.32;
      sun.color.setHex(0xff8040); sun.intensity = 0.75;
      sun.position.set(-20, 14, 8);
      fill.color.setHex(0x6040a0); fill.intensity = 0.30;
    } else if (name === 'nit'){
      scene.background.setHex(0x0a0f28);
      scene.fog.color.setHex(0x0a0f28);
      hemi.color.setHex(0x3040a0); hemi.groundColor.setHex(0x0a0808);
      hemi.intensity = 0.22;
      ambient.intensity = 0.22;
      sun.color.setHex(0x8088c0); sun.intensity = 0.18;
      sun.position.set(6, 20, -10);
      fill.color.setHex(0x404880); fill.intensity = 0.20;
    } else if (name === 'cin'){
      scene.background.setHex(0x101018);
      scene.fog.color.setHex(0x101018);
      hemi.color.setHex(0x2030a0); hemi.groundColor.setHex(0x0a0810);
      hemi.intensity = 0.28;
      ambient.intensity = 0.18;
      sun.color.setHex(0xff6080); sun.intensity = 0.55;
      sun.position.set(18, 8, -12);
      fill.color.setHex(0x4060ff); fill.intensity = 0.45;
      renderer.toneMappingExposure = 1.1;
    } else if (name === 'arc'){
      scene.background.setHex(0xf0f0f0);
      scene.fog.color.setHex(0xf0f0f0);
      hemi.color.setHex(0xffffff); hemi.groundColor.setHex(0xc0c0c0);
      hemi.intensity = 0.75;
      ambient.intensity = 0.65;
      sun.color.setHex(0xffffff); sun.intensity = 0.9;
      sun.position.set(10, 30, 5);
      fill.color.setHex(0xffffff); fill.intensity = 0.4;
      renderer.toneMappingExposure = 1.0;
    } else if (name === 'warm'){
      scene.background.setHex(0x2a1810);
      scene.fog.color.setHex(0x2a1810);
      hemi.color.setHex(0xffc080); hemi.groundColor.setHex(0x301810);
      hemi.intensity = 0.45;
      ambient.intensity = 0.35;
      sun.color.setHex(0xffa050); sun.intensity = 0.9;
      sun.position.set(10, 18, 8);
      fill.color.setHex(0xa06030); fill.intensity = 0.35;
    }
    $id('rAmb').value = ambient.intensity;
    $id('rSun').value = sun.intensity;
    $id('vAmb').textContent = ambient.intensity.toFixed(2);
    $id('vSun').textContent = sun.intensity.toFixed(2);
  }

  function resize(){
    const parent = renderer.domElement.parentElement;
    const w = parent.clientWidth, h = parent.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  function render(){ renderer.render(scene, camera); }

  function pick(cx, cy){
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects([roomGroup, furnGroup], true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o && !o.userData.pickable) o = o.parent;
    return o;
  }

  function setColliders(list){ allColliders = list; }
  let allColliders = [];
  function getColliders(){ return allColliders; }

  function setWireframe(v){
    [roomGroup, furnGroup].forEach(g => g.traverse(o => {
      if (o.isMesh && o.material){
        if (Array.isArray(o.material)) o.material.forEach(m => m.wireframe = v);
        else o.material.wireframe = v;
      }
    }));
  }
  function setCeilingVisible(v){
    roomGroup.traverse(o => { if (o.userData.kind === 'ceiling') o.visible = v; });
  }
  function setGrid(v){ gridHelper.visible = v; }
  function setLampsVisible(v){
    roomGroup.traverse(o => {
      if (o.userData.cat === 'light' || o.userData.name === 'Lâmpada de teto'){
        o.visible = v;
        o.traverse(c => { if (c.isLight) c.visible = v; });
      }
    });
  }
  function applyQuality(q){
    if (q === 'low'){
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = false;
      sun.castShadow = false;
    } else if (q === 'balanced'){
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.shadowMap.enabled = true;
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
    } else {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
    }
  }
  function setExposure(v){ renderer.toneMappingExposure = v; }

  return {
    init, render, resize, pick, setColliders, getColliders,
    setWireframe, setCeilingVisible, setGrid, setLampsVisible,
    applyQuality, applyLightPreset, setExposure,
    get scene(){ return scene; }, get camera(){ return camera; },
    get renderer(){ return renderer; }, get controls(){ return controls; },
    get roomGroup(){ return roomGroup; }, get furnGroup(){ return furnGroup; },
    get ambient(){ return ambient; }, get sun(){ return sun; }, get hemi(){ return hemi; }
  };
})();

/* ================================================================
   ORBIT CONTROLS
   ================================================================ */
function OrbitControls(camera, dom){
  const self = this;
  this.target = new THREE.Vector3(0, 1.2, 0);
  this.spherical = new THREE.Spherical(25, Math.PI/3, 0);
  this.enabled = true;
  let state = 'none', sx=0, sy=0, ss=null, st=null;
  function update(){
    const p = new THREE.Vector3().setFromSpherical(self.spherical);
    camera.position.copy(p).add(self.target);
    camera.lookAt(self.target);
  }
  this.update = update;
  function onDown(e){
    if (!self.enabled) return;
    state = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    sx = e.clientX; sy = e.clientY;
    ss = self.spherical.clone(); st = self.target.clone();
  }
  function onMove(e){
    if (!self.enabled || state === 'none') return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (state === 'orbit'){
      self.spherical.theta = ss.theta - dx * 0.008;
      self.spherical.phi = clamp(ss.phi - dy * 0.008, 0.05, Math.PI - 0.05);
    } else {
      const sc = self.spherical.radius * 0.0018;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      self.target.copy(st);
      self.target.addScaledVector(right, -dx * sc);
      self.target.addScaledVector(up, dy * sc);
    }
    update();
  }
  function onUp(){ state = 'none'; }
  function onWheel(e){ e.preventDefault();
    self.spherical.radius = clamp(self.spherical.radius * (1+e.deltaY*0.001), 2, 120);
    update(); }
  function onCtx(e){ e.preventDefault(); }
  let touchId = null, lastX = 0, lastY = 0, pinchStart = 0, pinchRadius = 0;
  function onTS(e){
    if (!self.enabled) return;
    if (e.touches.length === 1 && touchId === null){
      touchId = e.touches[0].identifier;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2){
      const [a,b] = e.touches;
      pinchStart = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      pinchRadius = self.spherical.radius;
      touchId = null;
    }
  }
  function onTM(e){
    if (!self.enabled) return;
    if (e.touches.length === 1 && touchId !== null){
      const t = e.touches[0];
      if (t.identifier !== touchId) return;
      const dx = t.clientX - lastX, dy = t.clientY - lastY;
      lastX = t.clientX; lastY = t.clientY;
      self.spherical.theta -= dx * 0.008;
      self.spherical.phi = clamp(self.spherical.phi - dy * 0.008, 0.05, Math.PI - 0.05);
      update();
    } else if (e.touches.length === 2 && pinchStart > 0){
      e.preventDefault();
      const [a,b] = e.touches;
      const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      self.spherical.radius = clamp(pinchRadius * pinchStart / Math.max(d,1), 2, 120);
      update();
    }
  }
  function onTE(e){ if (e.touches.length === 0){ touchId = null; pinchStart = 0; } }
  dom.addEventListener('pointerdown', onDown);
  dom.addEventListener('pointermove', onMove);
  dom.addEventListener('pointerup', onUp);
  dom.addEventListener('pointercancel', onUp);
  dom.addEventListener('wheel', onWheel, { passive: false });
  dom.addEventListener('contextmenu', onCtx);
  dom.addEventListener('touchstart', onTS, { passive: true });
  dom.addEventListener('touchmove', onTM, { passive: false });
  dom.addEventListener('touchend', onTE);
  dom.addEventListener('touchcancel', onTE);
  this.setView = function(p){
    const d = self.spherical.radius;
    if (p === 'top')   self.spherical = new THREE.Spherical(d, 0.1, 0);
    if (p === 'front') self.spherical = new THREE.Spherical(d, Math.PI/2, 0);
    if (p === 'side')  self.spherical = new THREE.Spherical(d, Math.PI/2, Math.PI/2);
    if (p === 'iso')   self.spherical = new THREE.Spherical(d, Math.PI/3, Math.PI/4);
    update();
  };
  update();
}

/* ================================================================
   FIRST PERSON — MOVIMENTO CORRIGIDO
   ================================================================ */
const FirstPerson = (function(){
  let enabled = false;
  const player = {
    pos: new THREE.Vector3(0, 1.65, 0),
    vel: new THREE.Vector3(0, 0, 0),
    yaw: 0, pitch: 0,
    onGround: false,
    eyeHeight: 1.65,
    radius: 0.32,
    speed: 3.5,
    runSpeed: 6.5,
    gravity: 22,
    jumpSpeed: 7.2
  };
  let keys = {};
  let colliders = [];
  let joyActive = false, joyId = null, joyBaseX = 0, joyBaseY = 0;
  let joyX = 0, joyY = 0;
  let lookId = null, lookLastX = 0, lookLastY = 0;
  let runHeld = false, jumpQueued = false;

  function setColliders(list){ colliders = list; }

  function enter(spawn){
    enabled = true;
    player.pos.set(spawn.x, player.eyeHeight, spawn.z);
    player.vel.set(0, 0, 0);
    player.yaw = 0; player.pitch = 0;
    $id('fpHud').classList.add('show');
    if ('ontouchstart' in window) $id('joyZoneFP').classList.add('show');
    SceneManager.controls.enabled = false;
    SceneManager.setCeilingVisible(false);
    setStatus('FPS · esq. anda · dir. olha', 'ok');
  }
  function exit(){
    enabled = false;
    $id('fpHud').classList.remove('show');
    $id('joyZoneFP').classList.remove('show');
    SceneManager.controls.enabled = true;
    SceneManager.setCeilingVisible(true);
    setStatus('Modo edição', 'ok');
  }
  function toggle(){
    if (enabled) exit();
    else {
      const rooms = BuildingGenerator._lastRooms;
      const spawn = { x: 0, z: 0 };
      if (rooms && rooms.length){ spawn.x = rooms[0].x; spawn.z = rooms[0].z; }
      enter(spawn);
    }
    return enabled;
  }

  function moveAxis(axis, amount){
    if (amount === 0) return;
    const next = player.pos.clone();
    next[axis] += amount;
    if (!collides(next)) player.pos.copy(next);
    else player.vel[axis] = 0;
  }
  function collides(pos){
    const r = player.radius;
    const h = player.eyeHeight + 0.1;
    const px1 = pos.x - r, px2 = pos.x + r;
    const py1 = pos.y - h, py2 = pos.y + 0.1;
    const pz1 = pos.z - r, pz2 = pos.z + r;
    for (let i=0; i<colliders.length; i++){
      const c = colliders[i];
      if (px2 < c.min.x || px1 > c.max.x) continue;
      if (py2 < c.min.y || py1 > c.max.y) continue;
      if (pz2 < c.min.z || pz1 > c.max.z) continue;
      return true;
    }
    return false;
  }

  function update(dt){
    if (!enabled) return;
    let mx = 0, mz = 0;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (joyActive){ mx += joyX; mz += joyY; }
    const len = Math.hypot(mx, mz);
    if (len > 1){ mx /= len; mz /= len; }

    // ==== CORREÇÃO DO MOVIMENTO ====
    // Base: camera local +Z é oposto do forward, e queremos mover
    // conforme o yaw atual. Fórmula correta para rotação Y:
    //   world_x = mx*cos(yaw) + mz*sin(yaw)
    //   world_z = -mx*sin(yaw) + mz*cos(yaw)
    const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
    const wx = mx * c + mz * s;
    const wz = -mx * s + mz * c;

    const speed = runHeld || keys['shift'] ? player.runSpeed : player.speed;
    player.vel.x = wx * speed;
    player.vel.z = wz * speed;
    player.vel.y -= player.gravity * dt;

    if ((jumpQueued || keys[' ']) && player.onGround){
      player.vel.y = player.jumpSpeed;
      player.onGround = false;
      jumpQueued = false;
    }

    moveAxis('x', player.vel.x * dt);
    moveAxis('z', player.vel.z * dt);
    moveAxis('y', player.vel.y * dt);

    if (player.pos.y <= player.eyeHeight){
      player.pos.y = player.eyeHeight;
      player.vel.y = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }

    const cam = SceneManager.camera;
    cam.position.copy(player.pos);
    cam.rotation.order = 'YXZ';
    cam.rotation.y = player.yaw;
    cam.rotation.x = player.pitch;
    cam.rotation.z = 0;

    if ((Math.abs(player.vel.x) > 0.5 || Math.abs(player.vel.z) > 0.5) && player.onGround){
      const bob = Math.sin(performance.now()*0.012) * 0.035;
      cam.position.y += bob;
    }
  }

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === ' ') e.preventDefault();
    if (k === 'escape' && enabled){ exit(); UIManager.syncPlayButton(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  document.addEventListener('mousemove', e => {
    if (!enabled) return;
    if (document.pointerLockElement === SceneManager.renderer.domElement){
      player.yaw   -= e.movementX * 0.0022;
      player.pitch -= e.movementY * 0.0022;
      player.pitch = clamp(player.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
    }
  });

  function attachTouch(dom){
    dom.addEventListener('touchstart', e => {
      if (!enabled) return;
      for (const t of e.changedTouches){
        const isLeft = t.clientX < window.innerWidth * 0.5;
        if (isLeft && !joyActive){
          joyActive = true; joyId = t.identifier;
          joyBaseX = t.clientX; joyBaseY = t.clientY;
          joyX = 0; joyY = 0;
          showJoy(t.clientX, t.clientY, 0, 0);
          e.preventDefault();
        } else if (!isLeft && lookId === null){
          lookId = t.identifier;
          lookLastX = t.clientX; lookLastY = t.clientY;
          e.preventDefault();
        }
      }
    }, { passive: false });

    dom.addEventListener('touchmove', e => {
      if (!enabled) return;
      for (const t of e.changedTouches){
        if (t.identifier === joyId){
          let dx = t.clientX - joyBaseX;
          let dy = t.clientY - joyBaseY;
          const d = Math.hypot(dx, dy);
          const maxD = 55;
          if (d > maxD){ dx = dx/d*maxD; dy = dy/d*maxD; }
          joyX = dx / maxD; joyY = dy / maxD;
          showJoy(joyBaseX, joyBaseY, dx, dy);
          e.preventDefault();
        } else if (t.identifier === lookId){
          const dx = t.clientX - lookLastX;
          const dy = t.clientY - lookLastY;
          lookLastX = t.clientX; lookLastY = t.clientY;
          player.yaw   -= dx * 0.0055;
          player.pitch -= dy * 0.0055;
          player.pitch = clamp(player.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
          e.preventDefault();
        }
      }
    }, { passive: false });

    function endT(e){
      for (const t of e.changedTouches){
        if (t.identifier === joyId){ joyActive = false; joyId = null; joyX = 0; joyY = 0; hideJoy(); }
        if (t.identifier === lookId){ lookId = null; }
      }
    }
    dom.addEventListener('touchend', endT);
    dom.addEventListener('touchcancel', endT);
  }

  function showJoy(bx, by, dx, dy){
    const base = $id('joyBaseFP'), knob = $id('joyKnobFP');
    base.style.left = bx + 'px'; base.style.top = by + 'px';
    knob.style.left = (bx + dx) + 'px'; knob.style.top = (by + dy) + 'px';
    base.classList.add('show'); knob.classList.add('show');
  }
  function hideJoy(){
    $id('joyBaseFP').classList.remove('show');
    $id('joyKnobFP').classList.remove('show');
  }

  function bindButtons(){
    const bj = $id('btnJumpFP');
    bj.addEventListener('click', () => { if (enabled) jumpQueued = true; });
    bj.addEventListener('touchstart', e => { e.preventDefault(); if (enabled) jumpQueued = true; }, { passive: false });
    const br = $id('btnRunFP');
    br.addEventListener('touchstart', e => { e.preventDefault(); runHeld = true; }, { passive: false });
    br.addEventListener('touchend', e => { e.preventDefault(); runHeld = false; }, { passive: false });
    br.addEventListener('mousedown', () => { runHeld = true; });
    br.addEventListener('mouseup', () => { runHeld = false; });
  }

  return {
    update, enter, exit, toggle, setColliders, attachTouch, bindButtons,
    get enabled(){ return enabled; }, get player(){ return player; }
  };
})();

/* ================================================================
   UI MANAGER
   ================================================================ */
const UIManager = (function(){
  let currentQuality = 'balanced';
  function bindRange(id, valId, fmt){
    const inp = $id(id), out = $id(valId);
    if (!inp || !out) return;
    const upd = () => out.textContent = fmt ? fmt(inp.value) : inp.value;
    inp.addEventListener('input', upd); upd();
  }
  function readParams(){
    return {
      gridSize: parseInt($id('selGrid').value),
      slotSize: parseFloat($id('rSlot').value),
      fillRate: parseFloat($id('rFill').value),
      height: parseFloat($id('rH').value),
      doorW: parseFloat($id('rDoor').value),
      floorStyle: $id('selFloorStyle').value,
      wallStyle: $id('selWallStyle').value,
      density: 0.75,
      seed: parseInt($id('inpSeed').value) || 1
    };
  }
  function setQuality(q){
    currentQuality = q;
    document.querySelectorAll('[data-q]').forEach(b =>
      b.classList.toggle('active', b.dataset.q === q));
    SceneManager.applyQuality(q);
  }
  function setRoomCount(n){ $id('roomCount').textContent = n + ' salas'; }
  function setObjectCount(n){ $id('objCount').textContent = n + ' objetos'; }
  function setFPS(f){ $id('fps').textContent = Math.round(f) + ' fps'; }
  function syncPlayButton(){
    const b = $id('btnPlay');
    if (FirstPerson.enabled){ b.classList.add('active'); b.textContent = '✕ Sair'; }
    else { b.classList.remove('active'); b.textContent = '🎮 Jogar'; }
  }
  function showDiag(){
    const panel = $id('diagPanel');
    let tris = 0, meshes = 0;
    [SceneManager.roomGroup, SceneManager.furnGroup].forEach(g => g.traverse(o => {
      if (o.isMesh && o.geometry){
        meshes++;
        if (o.geometry.index) tris += o.geometry.index.count / 3;
        else if (o.geometry.attributes.position) tris += o.geometry.attributes.position.count / 3;
      }
    }));
    const info = SceneManager.renderer.info;
    const p = FirstPerson.player;
    let html = '<h4>DIAGNÓSTICO</h4>';
    html += '<div class="tr"><span>WebGL</span><span style="color:#4ade80">OK</span></div>';
    html += '<div class="tr"><span>Three.js</span><span style="color:#4ade80">r' + THREE.REVISION + '</span></div>';
    html += '<div class="tr"><span>Qualidade</span><span>' + currentQuality + '</span></div>';
    html += '<div class="tr"><span>Modo</span><span>' + (FirstPerson.enabled ? 'FPS' : 'Edição') + '</span></div>';
    html += '<div class="tr"><span>Meshes</span><span>' + meshes + '</span></div>';
    html += '<div class="tr"><span>Triângulos</span><span>' + Math.round(tris) + '</span></div>';
    html += '<div class="tr"><span>Colliders</span><span>' + SceneManager.getColliders().length + '</span></div>';
    html += '<div class="tr"><span>Draw calls</span><span>' + info.render.calls + '</span></div>';
    html += '<div class="tr"><span>Texturas</span><span>' + info.memory.textures + '</span></div>';
    html += '<div class="tr"><span>Posição</span><span>' + p.pos.x.toFixed(1) + ',' + p.pos.y.toFixed(1) + ',' + p.pos.z.toFixed(1) + '</span></div>';
    html += '<button class="tbtn" id="closeDiag" style="margin-top:8px;width:100%">Fechar</button>';
    panel.innerHTML = html;
    panel.classList.add('show');
    $id('closeDiag').addEventListener('click', () => panel.classList.remove('show'));
  }
  return { bindRange, readParams, setQuality, setRoomCount, setObjectCount,
           setFPS, syncPlayButton, showDiag,
           get quality(){ return currentQuality; } };
})();

/* ================================================================
   MAIN
   ================================================================ */
(function main(){
  function hasWebGL(){
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext &&
        (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch(e){ return false; }
  }
  if (typeof THREE === 'undefined'){
    document.body.innerHTML = '<div style="padding:20px;color:#f87171;font-family:monospace">' +
      'ERRO: Three.js não pôde ser carregado.</div>';
    return;
  }
  if (!hasWebGL()){
    document.body.innerHTML = '<div style="padding:20px;color:#f87171;font-family:monospace">' +
      'ERRO: WebGL indisponível.</div>';
    return;
  }

  const canvas = $id('canvas3D');
  SceneManager.init(canvas);

  function regenAll(){
    const p = UIManager.readParams();
    setStatus('Gerando edifício...');
    try {
      BuildingGenerator.generate(p);
      FirstPerson.setColliders(SceneManager.getColliders());
      let n = 0;
      SceneManager.furnGroup.traverse(o => {
        if (o.parent === SceneManager.furnGroup && o.userData.pickable) n++;
      });
      UIManager.setObjectCount(n);
      setStatus('Edifício: ' + BuildingGenerator._lastRooms.length + ' salas', 'ok');
    } catch(e){
      console.error(e);
      setStatus('Erro: ' + e.message, 'err');
    }
  }
  regenAll();

  UIManager.bindRange('rSlot','vSlot', v => parseFloat(v).toFixed(1));
  UIManager.bindRange('rFill','vFill', v => parseFloat(v).toFixed(2));
  UIManager.bindRange('rH','vH', v => parseFloat(v).toFixed(1));
  UIManager.bindRange('rDoor','vDoor', v => parseFloat(v).toFixed(2));
  UIManager.bindRange('rAmb','vAmb', v => parseFloat(v).toFixed(2));
  UIManager.bindRange('rSun','vSun', v => parseFloat(v).toFixed(2));
  UIManager.bindRange('rExp','vExp', v => parseFloat(v).toFixed(2));

  $id('btnGenerate').addEventListener('click', regenAll);
  $id('btnRegenAll').addEventListener('click', regenAll);
  $id('btnRegenFurn').addEventListener('click', regenAll);
  $id('btnRandomSeed').addEventListener('click', () => {
    $id('inpSeed').value = Math.floor(Math.random() * 999999);
    regenAll();
  });
  $id('btnDiag').addEventListener('click', () => UIManager.showDiag());
  $id('btnPlay').addEventListener('click', () => { FirstPerson.toggle(); UIManager.syncPlayButton(); });

  document.querySelectorAll('[data-q]').forEach(b => {
    b.addEventListener('click', () => UIManager.setQuality(b.dataset.q));
  });

  $id('btnCeilVis').addEventListener('click', e => {
    const on = e.target.classList.toggle('active');
    SceneManager.setCeilingVisible(on);
    e.target.textContent = on ? 'Teto ✓' : 'Teto ✗';
  });
  $id('btnWireframe').addEventListener('click', e => {
    SceneManager.setWireframe(e.target.classList.toggle('active'));
  });
  $id('btnGrid').addEventListener('click', e => {
    SceneManager.setGrid(e.target.classList.toggle('active'));
  });
  $id('btnLamps').addEventListener('click', e => {
    const on = e.target.classList.toggle('active');
    SceneManager.setLampsVisible(on);
    e.target.textContent = on ? 'Luzes ✓' : 'Luzes ✗';
  });

  document.querySelectorAll('[data-cam]').forEach(b => {
    b.addEventListener('click', () => SceneManager.controls.setView(b.dataset.cam));
  });
  document.querySelectorAll('[data-light]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-light]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      SceneManager.applyLightPreset(b.dataset.light);
    });
  });
  $id('rAmb').addEventListener('input', e => SceneManager.ambient.intensity = parseFloat(e.target.value));
  $id('rSun').addEventListener('input', e => SceneManager.sun.intensity = parseFloat(e.target.value));
  $id('rExp').addEventListener('input', e => SceneManager.setExposure(parseFloat(e.target.value)));

  $id('toggleLeft').addEventListener('click', () => $id('leftPanel').classList.toggle('show'));
  $id('toggleRight').addEventListener('click', () => $id('rightPanel').classList.toggle('show'));

  FirstPerson.attachTouch(canvas);
  FirstPerson.bindButtons();

  let lastT = performance.now(), lastFpsT = lastT, fpsFrames = 0;
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if (FirstPerson.enabled) FirstPerson.update(dt);
    else SceneManager.controls.update();
    SceneManager.render();
    fpsFrames++;
    if (now - lastFpsT > 500){
      UIManager.setFPS(fpsFrames * 1000 / (now - lastFpsT));
      fpsFrames = 0; lastFpsT = now;
    }
  }
  animate();

  window.OMNI = { SceneManager, BuildingGenerator, FirstPerson, UIManager };
  setStatus('Pronto · clique 🎮 Jogar para entrar em FPS', 'ok');
})();
</script>
