<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060f"><title>Game Deals Monitor</title>
<style>
:root{--bg:#08060f;--pan:#100c1c;--pan2:#181428;--bd:rgba(139,92,246,.16);
--txt:#eeebf8;--txt2:#a8a0c0;--dim:#5a5270;--violet:#8b5cf6;--violet2:#a78bfa;
--pink:#ec4899;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#22d3ee;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--sans);background:var(--bg);color:var(--txt)}
body{background-image:radial-gradient(800px 500px at 15% -10%,rgba(139,92,246,.09),transparent),
radial-gradient(700px 400px at 100% 100%,rgba(236,72,153,.05),transparent);background-attachment:fixed}
#app{display:grid;grid-template-rows:62px 1fr 32px;height:100vh;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 22px;
border-bottom:1px solid var(--bd);background:rgba(8,6,15,.94);backdrop-filter:blur(20px);z-index:10}
.logo{display:flex;align-items:center;gap:12px}
.logo .mk{width:36px;height:36px;border-radius:9px;
background:linear-gradient(135deg,var(--violet),var(--pink));display:grid;place-items:center;
color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 22px rgba(139,92,246,.5)}
.logo b{font-size:13px;letter-spacing:2.5px;font-weight:800}
.logo small{display:block;font-size:9px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.hud{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--txt2)}
.hud .live{display:flex;align-items:center;gap:6px;font-family:var(--mono);color:var(--green)}
.hud .live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);
box-shadow:0 0 10px var(--green);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
.btn{background:transparent;border:1px solid var(--bd);color:var(--violet);padding:9px 14px;
font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
cursor:pointer;transition:.2s;border-radius:8px}
.btn:hover{border-color:var(--violet);background:rgba(139,92,246,.08)}
main{display:grid;grid-template-columns:1fr 400px;overflow:hidden}
.desk{padding:22px;overflow-y:auto}
.desk::-webkit-scrollbar{width:8px}.desk::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:18px}
.kpi .lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:900;letter-spacing:-1px;margin-top:10px;
background:linear-gradient(135deg,var(--violet),var(--pink));-webkit-background-clip:text;
background-clip:text;color:transparent}
.kpi .sub{font-size:11px;color:var(--txt2);margin-top:6px;font-family:var(--mono)}
h2{font-size:11px;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;margin:22px 0 12px;
font-weight:700;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--bd)}
h2:first-child{margin-top:0}
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.deal{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:.15s;position:relative}
.deal:hover{border-color:rgba(139,92,246,.5);transform:translateY(-2px)}
.deal .thumb{height:100px;background:var(--pan2);border-radius:8px;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}
.deal .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.deal .title{font-size:13px;font-weight:800;line-height:1.3;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.deal .prices{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.deal .sale{font-family:var(--mono);font-size:22px;font-weight:900;color:var(--green)}
.deal .retail{font-family:var(--mono);font-size:12px;color:var(--dim);text-decoration:line-through}
.deal .save{position:absolute;top:12px;right:12px;background:var(--green);color:#08060f;padding:4px 10px;
border-radius:100px;font-size:10px;font-weight:900;font-family:var(--mono);letter-spacing:1px}
.deal .store{font-size:11px;color:var(--txt2);margin-top:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
.deal .deal-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--dim);font-family:var(--mono)}
.side{background:rgba(16,12,28,.96);border-left:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--bd)}
.side-hd{padding:18px 22px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:800;
letter-spacing:2.5px;text-transform:uppercase;color:var(--violet)}
.panel{padding:18px 22px;border-bottom:1px solid var(--bd)}
.panel label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
margin-bottom:6px;font-weight:700}
.panel select,.panel input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--txt);
padding:11px 13px;border-radius:8px;font-size:13px;font-family:var(--sans);outline:none;font-weight:700;margin-bottom:10px}
.panel select:focus,.panel input:focus{border-color:var(--violet)}
.panel .result{padding:14px;background:rgba(139,92,246,.08);border:1px solid var(--violet);
border-radius:10px;font-family:var(--mono);font-size:18px;font-weight:900;color:var(--violet2);text-align:center;
word-break:break-all;margin-top:8px}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 22px;
border-top:1px solid var(--bd);background:rgba(8,6,15,.94);font-size:10px;color:var(--dim);
letter-spacing:1.5px;font-family:var(--mono)}
footer .ok{color:var(--green)}
@media(max-width:800px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{max-height:55vh;border-left:0;border-top:1px solid var(--bd)}
}
</style></head><body>
<div id="app">
<header>
  <div class="logo"><div class="mk">◈</div>
    <div><b>GAME DEALS MONITOR</b><small>CHEAPSHARK · MULTI-STORE PRICE TRACKER</small></div></div>
  <div class="hud">
    <div class="live"><span class="dot"></span>LIVE · <span id="clock">--:--:--</span></div>
    <button class="btn" onclick="loadDeals()">↻ Refresh</button>
  </div>
</header>
<main>
  <div class="desk">
    <div class="kpis" id="kpis"></div>
    <h2>Best Deals</h2>
    <div class="deals" id="deals"></div>
  </div>
  <aside class="side">
    <div class="side-hd">◈ Store Lookup</div>
    <div class="panel">
      <label>Game title</label>
      <input id="qTitle" placeholder="e.g. Elden Ring, Cyberpunk" onkeydown="if(event.key==='Enter')searchGame()">
      <button class="btn" style="width:100%;padding:12px" onclick="searchGame()">Search Deals</button>
      <div class="result" id="sgResult">—</div>
    </div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Filters</div>
    <div class="panel">
      <label>Max price (USD)</label>
      <input type="number" id="fMax" value="30" oninput="filterDeals()">
      <label style="margin-top:12px">Min discount (%)</label>
      <input type="number" id="fDisc" value="50" oninput="filterDeals()">
      <label style="margin-top:12px">Store</label>
      <select id="fStore" onchange="filterDeals()">
        <option value="">All stores</option>
        <option value="1">Steam</option>
        <option value="7">GOG</option>
        <option value="11">Humble Bundle</option>
        <option value="25">Epic Games</option>
      </select>
    </div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Stats</div>
    <div class="panel" id="stats"></div>
  </aside>
</main>
<footer>
  <div><span class="ok">●</span> GAME DEALS MONITOR v1.0</div>
  <div id="ftInfo">CheapShark API · 20+ stores · keyless</div>
</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2});

const STORES={'1':'Steam','2':'GamersGate','3':'GreenManGaming','7':'GOG','8':'Origin','11':'Humble Bundle','13':'Uplay','15':'Fanatical','21':'WinGameStore','23':'GameBillet','24':'Voidu','25':'Epic Games','27':'Games Planet','28':'Games Load','29':'GamersGate','30':'IndieGala','31':'Blizzard','33':'AllYouPlay','35':'DLGamer','36':'Noctre','37':'DreamGame'};

let ALL_DEALS=[];

async function loadDeals(){
  $('#ftInfo').textContent='Loading CheapShark deals…';
  try{
    const r=await fetch('https://www.cheapshark.com/api/1.0/deals?pageSize=20&sortBy=Deal+Rating&onSale=1');
    ALL_DEALS=await r.json();
    renderKpis(); renderDeals();
    $('#ftInfo').textContent=`CheapShark · ${ALL_DEALS.length} deals loaded · ${new Date().toLocaleTimeString()}`;
  }catch(e){
    $('#ftInfo').textContent='Error: '+e.message;
  }
}

function renderKpis(){
  const totalDeals=ALL_DEALS.length;
  const avgDiscount=ALL_DEALS.reduce((a,d)=>a+(+d.savings||0),0)/totalDeals;
  const bestDeal=ALL_DEALS.reduce((a,b)=>(+b.savings||0)>(+a.savings||0)?b:a,ALL_DEALS[0]||{});
  const stores=new Set(ALL_DEALS.map(d=>d.storeID)).size;
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="lbl">Active Deals</div><div class="val">${totalDeals}</div><div class="sub">live listings</div></div>
    <div class="kpi"><div class="lbl">Avg Discount</div><div class="val">${avgDiscount.toFixed(0)}%</div><div class="sub">across all</div></div>
    <div class="kpi"><div class="lbl">Best Deal</div><div class="val">${(+bestDeal.savings||0).toFixed(0)}%</div><div class="sub">${esc((bestDeal.title||'').slice(0,20))}</div></div>
    <div class="kpi"><div class="lbl">Stores</div><div class="val">${stores}</div><div class="sub">retailers tracked</div></div>
  `;
}

function renderDeals(){
  const maxPrice=parseFloat($('#fMax').value)||99999;
  const minDisc=parseFloat($('#fDisc').value)||0;
  const storeF=$('#fStore').value;
  const list=ALL_DEALS.filter(d=>(+d.salePrice<=maxPrice)&&(+d.savings>=minDisc)&&(!storeF||d.storeID===storeF)).slice(0,20);
  $('#deals').innerHTML=list.length?list.map(d=>`
    <div class="deal">
      <div class="save">−${(+d.savings||0).toFixed(0)}%</div>
      <div class="thumb">${d.thumb?`<img src="${d.thumb}" loading="lazy" onerror="this.style.display='none'">`:'<span style="font-size:32px;opacity:.3">◈</span>'}</div>
      <div class="title">${esc(d.title)}</div>
      <div class="prices">
        <span class="sale">${money(d.salePrice)}</span>
        <span class="retail">${money(d.normalPrice)}</span>
      </div>
      <div class="store">${esc(STORES[d.storeID]||'Store #'+d.storeID)}</div>
      <div class="deal-meta">
        <span>Rating: ${(+d.dealRating||0).toFixed(1)}</span>
        <span>Meta: ${(+d.metacriticScore||0)>0?d.metacriticScore:'—'}</span>
      </div>
    </div>`).join(''):'<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--dim)">No deals match filters</div>';
  updateStats(list);
}

function updateStats(list){
  const totalValue=list.reduce((a,d)=>a+(+d.savings*(+d.normalPrice)/100),0);
  $('#stats').innerHTML=`
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(139,92,246,.06);font-size:12px">
      <span style="color:var(--dim)">Deals shown</span>
      <span style="font-family:var(--mono);font-weight:800;color:var(--violet2)">${list.length}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(139,92,246,.06);font-size:12px">
      <span style="color:var(--dim)">Total savings</span>
      <span style="font-family:var(--mono);font-weight:800;color:var(--green)">${money(totalValue)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:12px">
      <span style="color:var(--dim)">Avg price</span>
      <span style="font-family:var(--mono);font-weight:800">${money(list.reduce((a,d)=>a+(+d.salePrice),0)/(list.length||1))}</span>
    </div>
  `;
}

function filterDeals(){renderDeals();}

async function searchGame(){
  const q=$('#qTitle').value.trim();
  if(!q)return;
  $('#sgResult').textContent='Searching…';
  try{
    const r=await fetch(`https://www.cheapshark.com/api/1.0/games?title=${encodeURIComponent(q)}&limit=5`);
    const d=await r.json();
    if(d.length){
      $('#sgResult').textContent=money(d[0].cheapest);
      $('#deals').innerHTML=d.map(g=>`
        <div class="deal">
          <div class="thumb">${g.thumb?`<img src="${g.thumb}" onerror="this.style.display='none'">`:''}</div>
          <div class="title">${esc(g.external)}</div>
          <div class="prices"><span class="sale">${money(g.cheapest)}</span></div>
          <div class="store">Cheapest available</div>
        </div>`).join('');
    }else{
      $('#sgResult').textContent='Not found';
    }
  }catch(e){
    $('#sgResult').textContent='Error';
  }
}

setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});},1000);
loadDeals();
setInterval(loadDeals,120000);
</script></body></html>
