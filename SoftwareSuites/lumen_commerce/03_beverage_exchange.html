<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a06"><title>Craft Beverage Exchange</title>
<style>
:root{--bg:#0f0a06;--pan:#1a120a;--pan2:#251810;--bd:rgba(217,119,6,.18);
--txt:#fef3e2;--txt2:#b8a48a;--dim:#6e5a44;--amber:#d97706;--amber2:#f59e0b;
--gold:#fbbf24;--green:#22c55e;--red:#ef4444;
--serif:'Georgia',serif;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--sans);background:var(--bg);color:var(--txt)}
body{background-image:radial-gradient(800px 500px at 20% -10%,rgba(217,119,6,.07),transparent),
radial-gradient(700px 400px at 100% 100%,rgba(251,191,36,.05),transparent);background-attachment:fixed}
#app{display:grid;grid-template-rows:64px 1fr 34px;height:100vh;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;
border-bottom:1px solid var(--bd);background:rgba(15,10,6,.94);backdrop-filter:blur(20px);z-index:10}
.logo{display:flex;align-items:center;gap:14px}
.logo .mk{font-family:var(--serif);font-size:22px;color:var(--gold);letter-spacing:5px;
text-shadow:0 0 30px rgba(217,119,6,.5)}
.logo small{color:var(--dim);font-size:9px;letter-spacing:4px;font-family:var(--sans)}
.hud{display:flex;gap:8px}
.btn{background:transparent;border:1px solid var(--bd);color:var(--amber);padding:9px 16px;
font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
cursor:pointer;transition:.2s;border-radius:4px}
.btn:hover{border-color:var(--amber);background:rgba(217,119,6,.08)}
main{display:grid;grid-template-columns:1fr 400px;overflow:hidden}
.desk{padding:24px;overflow-y:auto}
.desk::-webkit-scrollbar{width:8px}.desk::-webkit-scrollbar-thumb{background:var(--bd)}
h2{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin:22px 0 12px;
font-weight:700;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--bd)}
h2:first-child{margin-top:0}
.breweries{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.br{background:var(--pan);border:1px solid var(--bd);border-radius:6px;padding:18px;transition:.2s;position:relative;overflow:hidden}
.br::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,var(--amber),var(--gold));opacity:.6}
.br:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.br .name{font-family:var(--serif);font-size:16px;line-height:1.3;color:var(--txt);margin-bottom:6px}
.br .type{display:inline-block;padding:3px 10px;border-radius:3px;font-size:9.5px;font-weight:800;
letter-spacing:1.5px;font-family:var(--mono);text-transform:uppercase;background:rgba(217,119,6,.15);color:var(--amber);margin-bottom:10px}
.br .meta{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--txt2);line-height:1.5}
.br .meta .l{color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:1px}
.side{background:rgba(26,18,10,.96);border-left:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--bd)}
.side-hd{padding:18px 22px;border-bottom:1px solid var(--bd);font-family:var(--serif);
font-size:15px;color:var(--gold);letter-spacing:3px}
.panel{padding:18px 22px;border-bottom:1px solid var(--bd)}
.panel label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
margin-bottom:6px;font-weight:700}
.panel input,.panel select{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--txt);
padding:11px 13px;border-radius:4px;font-size:13px;font-family:var(--sans);outline:none;font-weight:600;margin-bottom:10px}
.panel input:focus,.panel select:focus{border-color:var(--amber)}
.panel .result{padding:16px;background:rgba(217,119,6,.08);border:1px solid var(--gold);
border-radius:4px;font-family:var(--mono);font-size:22px;font-weight:900;color:var(--gold);text-align:center;
word-break:break-all;margin-top:10px}
.stats-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(217,119,6,.06);
font-size:12px}
.stats-row:last-child{border-bottom:0}
.stats-row .l{color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:700}
.stats-row .v{font-family:var(--mono);font-weight:800}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 24px;
border-top:1px solid var(--bd);background:rgba(15,10,6,.94);font-size:10px;color:var(--dim);
letter-spacing:2px;font-family:var(--mono)}
footer .ok{color:var(--gold)}
@media(max-width:800px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{max-height:50vh;border-left:0;border-top:1px solid var(--bd)}
  .logo .mk{font-size:16px}
}
</style></head><body>
<div id="app">
<header>
  <div class="logo"><span class="mk">BREW</span><small>CRAFT BEVERAGE EXCHANGE · OPEN BREWERY DB</small></div>
  <div class="hud">
    <button class="btn" onclick="loadBreweries()">↻ Reload</button>
  </div>
</header>
<main>
  <div class="desk">
    <h2>Featured Breweries</h2>
    <div class="breweries" id="breweries"></div>
  </div>
  <aside class="side">
    <div class="side-hd">◈ Search</div>
    <div class="panel">
      <label>City</label>
      <input id="qCity" placeholder="e.g. San Diego, Austin" onkeydown="if(event.key==='Enter')search()">
      <button class="btn" style="width:100%;padding:12px" onclick="search()">Search City</button>
      <div class="result" id="srchRes">—</div>
    </div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Distribution Calculator</div>
    <div class="panel">
      <label>Barrels (BBL)</label>
      <input type="number" id="dcBarrels" value="500" oninput="calcDist()">
      <label style="margin-top:12px">Price per pint ($)</label>
      <input type="number" id="dcPrice" value="7" step="0.25" oninput="calcDist()">
      <label style="margin-top:12px">Production cost / BBL ($)</label>
      <input type="number" id="dcCost" value="180" oninput="calcDist()">
      <div class="result" id="dcResult">—</div>
    </div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Breakdown</div>
    <div class="panel" id="dcAnalysis"></div>
  </aside>
</main>
<footer>
  <div><span class="ok">●</span> CRAFT BEVERAGE EXCHANGE v1.0</div>
  <div id="ftInfo">Open Brewery DB · 8,000+ US breweries · keyless</div>
</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});

async function loadBreweries(){
  $('#ftInfo').textContent='Loading Open Brewery DB…';
  try{
    const r=await fetch('https://api.openbrewerydb.org/v1/breweries?per_page=12&sort=name:asc');
    const d=await r.json();
    renderBreweries(d);
    $('#ftInfo').textContent=`Open Brewery DB · ${d.length} breweries loaded`;
  }catch(e){
    $('#ftInfo').textContent='Error: '+e.message;
  }
}

function renderBreweries(list){
  $('#breweries').innerHTML=list.map(b=>`
    <div class="br">
      <div class="name">${esc(b.name)}</div>
      <div class="type">${esc(b.brewery_type||'—')}</div>
      <div class="meta">
        <div><span class="l">CITY</span> ${esc(b.city||'—')}, ${esc(b.state||'—')}</div>
        <div><span class="l">COUNTRY</span> ${esc(b.country||'—')}</div>
        <div><span class="l">PHONE</span> ${esc(b.phone||'—')}</div>
        <div><span class="l">WEB</span> ${b.website_url?`<a href="${esc(b.website_url)}" target="_blank" rel="noopener" style="color:var(--amber);text-decoration:none">${esc(b.website_url.slice(0,40))}</a>`:'—'}</div>
      </div>
    </div>`).join('');
}

async function search(){
  const q=$('#qCity').value.trim();
  if(!q)return;
  $('#srchRes').textContent='Searching…';
  try{
    const r=await fetch(`https://api.openbrewerydb.org/v1/breweries?by_city=${encodeURIComponent(q)}&per_page=12`);
    const d=await r.json();
    if(d.length){
      $('#srchRes').textContent=d.length+' breweries';
      renderBreweries(d);
    }else{
      $('#srchRes').textContent='No breweries found';
    }
  }catch(e){
    $('#srchRes').textContent='Error';
  }
}

function calcDist(){
  const barrels=parseFloat($('#dcBarrels').value)||0;
  const price=parseFloat($('#dcPrice').value)||0;
  const cost=parseFloat($('#dcCost').value)||0;
  const pintsPerBbl=248;
  const totalPints=barrels*pintsPerBbl;
  const revenue=totalPints*price;
  const totalCost=barrels*cost;
  const profit=revenue-totalCost;
  const margin=revenue?(profit/revenue*100):0;
  $('#dcResult').textContent=money(revenue);
  $('#dcAnalysis').innerHTML=`
    <div class="stats-row"><span class="l">Barrels</span><span class="v">${barrels} BBL</span></div>
    <div class="stats-row"><span class="l">Total pints</span><span class="v">${totalPints.toLocaleString()}</span></div>
    <div class="stats-row"><span class="l">Revenue</span><span class="v" style="color:var(--green)">${money(revenue)}</span></div>
    <div class="stats-row"><span class="l">Production cost</span><span class="v" style="color:var(--red)">${money(totalCost)}</span></div>
    <div class="stats-row"><span class="l">Gross profit</span><span class="v" style="color:var(--gold)">${money(profit)}</span></div>
    <div class="stats-row"><span class="l">Margin</span><span class="v">${margin.toFixed(1)}%</span></div>
  `;
}

loadBreweries();
calcDist();
</script></body></html>
