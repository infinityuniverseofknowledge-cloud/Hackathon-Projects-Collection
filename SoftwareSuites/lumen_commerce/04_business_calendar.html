<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050810"><title>Business Calendar Pro</title>
<style>
:root{--bg:#050810;--pan:#0c1020;--pan2:#141a30;--bd:rgba(96,165,250,.15);
--txt:#eef2f8;--txt2:#96a8c0;--dim:#4a5870;--blue:#60a5fa;--blue2:#3b82f6;
--gold:#eab308;--green:#22c55e;--red:#ef4444;--violet:#a78bfa;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--sans);background:var(--bg);color:var(--txt)}
body{background-image:radial-gradient(800px 500px at 15% -10%,rgba(96,165,250,.08),transparent),
radial-gradient(700px 400px at 100% 100%,rgba(234,179,8,.05),transparent);background-attachment:fixed}
#app{display:grid;grid-template-rows:62px 1fr 32px;height:100vh;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 22px;
border-bottom:1px solid var(--bd);background:rgba(5,8,16,.94);backdrop-filter:blur(20px);z-index:10}
.logo{display:flex;align-items:center;gap:12px}
.logo .mk{width:36px;height:36px;border-radius:10px;
background:linear-gradient(135deg,var(--blue),var(--gold));display:grid;place-items:center;
color:#050810;font-weight:900;font-size:15px;box-shadow:0 4px 22px rgba(96,165,250,.4)}
.logo b{font-size:13px;letter-spacing:2.5px;font-weight:800}
.logo small{display:block;font-size:9px;color:var(--dim);letter-spacing:3px;margin-top:2px}
.hud{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--txt2)}
.hud .live{display:flex;align-items:center;gap:6px;font-family:var(--mono);color:var(--green)}
.hud .live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);
box-shadow:0 0 10px var(--green);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
.btn{background:transparent;border:1px solid var(--bd);color:var(--blue);padding:9px 14px;
font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
cursor:pointer;transition:.2s;border-radius:8px}
.btn:hover{border-color:var(--blue);background:rgba(96,165,250,.08)}
main{display:grid;grid-template-columns:1fr 400px;overflow:hidden}
.desk{padding:22px;overflow-y:auto}
.desk::-webkit-scrollbar{width:8px}.desk::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:18px}
.kpi .lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:900;letter-spacing:-1px;margin-top:10px;
background:linear-gradient(135deg,var(--blue),var(--gold));-webkit-background-clip:text;
background-clip:text;color:transparent}
.kpi .sub{font-size:11px;color:var(--txt2);margin-top:6px;font-family:var(--mono)}
h2{font-size:11px;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;margin:22px 0 12px;
font-weight:700;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--bd)}
h2:first-child{margin-top:0}
.holidays{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hol{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:.15s;position:relative;overflow:hidden}
.hol::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
background:linear-gradient(90deg,var(--blue),var(--gold));opacity:.6}
.hol:hover{border-color:rgba(96,165,250,.5);transform:translateY(-2px)}
.hol .date{font-family:var(--mono);font-size:10.5px;color:var(--blue);letter-spacing:1.5px;font-weight:800;text-transform:uppercase}
.hol .name{font-size:13.5px;font-weight:800;margin-top:8px;line-height:1.3}
.hol .local{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:6px;font-style:italic}
.hol .badge{position:absolute;top:12px;right:12px;background:rgba(234,179,8,.15);color:var(--gold);
padding:3px 9px;border-radius:100px;font-size:9px;font-weight:800;letter-spacing:1px;font-family:var(--mono)}
.hol .badge.public{background:rgba(34,197,94,.15);color:var(--green)}
.hol .badge.bank{background:rgba(96,165,250,.15);color:var(--blue)}
.side{background:rgba(12,16,32,.96);border-left:1px solid var(--bd);overflow-y:auto;display:flex;flex-direction:column}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--bd)}
.side-hd{padding:18px 22px;border-bottom:1px solid var(--bd);font-size:11px;font-weight:800;
letter-spacing:2.5px;text-transform:uppercase;color:var(--blue)}
.panel{padding:18px 22px;border-bottom:1px solid var(--bd)}
.panel label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
margin-bottom:6px;font-weight:700}
.panel select,.panel input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--bd);color:var(--txt);
padding:11px 13px;border-radius:8px;font-size:13px;font-family:var(--sans);outline:none;font-weight:700;margin-bottom:10px}
.panel select:focus,.panel input:focus{border-color:var(--blue)}
.panel .result{padding:14px;background:rgba(96,165,250,.08);border:1px solid var(--blue);
border-radius:10px;font-family:var(--mono);font-size:18px;font-weight:900;color:var(--blue);text-align:center;
word-break:break-all;margin-top:8px}
.stats-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(96,165,250,.06);
font-size:12px}
.stats-row:last-child{border-bottom:0}
.stats-row .l{color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:700}
.stats-row .v{font-family:var(--mono);font-weight:800}
footer{display:flex;justify-content:space-between;align-items:center;padding:0 22px;
border-top:1px solid var(--bd);background:rgba(5,8,16,.94);font-size:10px;color:var(--dim);
letter-spacing:1.5px;font-family:var(--mono)}
footer .ok{color:var(--blue)}
@media(max-width:800px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{max-height:55vh;border-left:0;border-top:1px solid var(--bd)}
}
</style></head><body>
<div id="app">
<header>
  <div class="logo"><div class="mk">◈</div>
    <div><b>BUSINESS CALENDAR PRO</b><small>NAGER.DATE · GLOBAL HOLIDAYS API</small></div></div>
  <div class="hud">
    <div class="live"><span class="dot"></span>LIVE · <span id="clock">--:--:--</span></div>
    <button class="btn" onclick="loadHolidays()">↻ Reload</button>
  </div>
</header>
<main>
  <div class="desk">
    <div class="kpis" id="kpis"></div>
    <h2 id="resultsTitle">Holidays · United States</h2>
    <div class="holidays" id="holidays"></div>
  </div>
  <aside class="side">
    <div class="side-hd">◈ Country & Year</div>
    <div class="panel">
      <label>Country</label>
      <select id="hCountry" onchange="loadHolidays()">
        <option value="US" selected>🇺🇸 United States</option>
        <option value="GB">🇬🇧 United Kingdom</option>
        <option value="DE">🇩🇪 Germany</option>
        <option value="FR">🇫🇷 France</option>
        <option value="BR">🇧🇷 Brazil</option>
        <option value="JP">🇯🇵 Japan</option>
        <option value="CA">🇨🇦 Canada</option>
        <option value="AU">🇦🇺 Australia</option>
        <option value="IN">🇮🇳 India</option>
        <option value="MX">🇲🇽 Mexico</option>
      </select>
      <label style="margin-top:12px">Year</label>
      <select id="hYear" onchange="loadHolidays()">
        <option value="2024">2024</option>
        <option value="2025" selected>2025</option>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
    </div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Business Impact</div>
    <div class="panel" id="bizImpact"></div>
    <div class="side-hd" style="border-top:1px solid var(--bd)">Q1 Calendar</div>
    <div class="panel" id="q1List"></div>
  </aside>
</main>
<footer>
  <div><span class="ok">●</span> BUSINESS CALENDAR PRO v1.0</div>
  <div id="ftInfo">Nager.Date API · 100+ countries · keyless</div>
</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const COUNTRIES={US:'United States',GB:'United Kingdom',DE:'Germany',FR:'France',BR:'Brazil',JP:'Japan',CA:'Canada',AU:'Australia',IN:'India',MX:'Mexico'};

async function loadHolidays(){
  const country=$('#hCountry').value;
  const year=$('#hYear').value;
  $('#ftInfo').textContent='Loading holidays…';
  $('#resultsTitle').textContent=`Holidays · ${COUNTRIES[country]} ${year}`;
  try{
    const r=await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${country}`);
    const d=await r.json();
    renderKpis(d); renderHolidays(d); renderBusinessImpact(d); renderQ1(d);
    $('#ftInfo').textContent=`Nager.Date · ${COUNTRIES[country]} · ${d.length} holidays in ${year}`;
  }catch(e){
    $('#ftInfo').textContent='Error: '+e.message;
  }
}

function renderKpis(list){
  const total=list.length;
  const publicH=list.filter(h=>h.types&&h.types.includes('Public')).length;
  const bankH=list.filter(h=>h.types&&h.types.includes('Bank')).length;
  const next=list.reduce((a,b)=>new Date(b.date)>new Date()&&(!a||new Date(b.date)<new Date(a.date))?b:a,null);
  const nextDays=next?Math.ceil((new Date(next.date)-new Date())/86400000):'—';
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="lbl">Total Holidays</div><div class="val">${total}</div><div class="sub">in selected year</div></div>
    <div class="kpi"><div class="lbl">Public Holidays</div><div class="val">${publicH}</div><div class="sub">national</div></div>
    <div class="kpi"><div class="lbl">Bank Holidays</div><div class="val">${bankH||'—'}</div><div class="sub">banking sector</div></div>
    <div class="kpi"><div class="lbl">Next Holiday</div><div class="val">${nextDays}${nextDays!=='—'?'d':''}</div><div class="sub">${next?esc(next.name.slice(0,20)):'—'}</div></div>
  `;
}

function renderHolidays(list){
  $('#holidays').innerHTML=list.map(h=>{
    const types=h.types||['Public'];
    const typeStr=types.includes('Public')?'public':types.includes('Bank')?'bank':'';
    return `<div class="hol">
      <div class="badge ${typeStr}">${types[0].toUpperCase()}</div>
      <div class="date">${esc(h.date)}</div>
      <div class="name">${esc(h.name)}</div>
      ${h.localName&&h.localName!==h.name?`<div class="local">${esc(h.localName)}</div>`:''}
    </div>`;
  }).join('');
}

function renderBusinessImpact(list){
  const days=list.length;
  const workdays=260-days;
  const impact=(days/260*100).toFixed(1);
  $('#bizImpact').innerHTML=`
    <div class="stats-row"><span class="l">Trading days</span><span class="v">${workdays}</span></div>
    <div class="stats-row"><span class="l">Holidays</span><span class="v">${days}</span></div>
    <div class="stats-row"><span class="l">Business impact</span><span class="v" style="color:var(--gold)">${impact}%</span></div>
    <div class="stats-row"><span class="l">Q1-Q4 avg</span><span class="v">${(days/4).toFixed(1)} per Q</span></div>
  `;
}

function renderQ1(list){
  const q1=list.filter(h=>h.date.startsWith('2025-0'+'1')||h.date.startsWith('2025-02')||h.date.startsWith('2025-03'));
  $('#q1List').innerHTML=q1.length?q1.map(h=>
    `<div class="stats-row"><span class="l">${esc(h.date.slice(5))}</span><span class="v" style="font-size:10.5px">${esc(h.name.slice(0,22))}</span></div>`
  ).join(''):'<p style="color:var(--dim);font-size:11px">No holidays in Q1</p>';
}

setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});},1000);
loadHolidays();
</script></body></html>
