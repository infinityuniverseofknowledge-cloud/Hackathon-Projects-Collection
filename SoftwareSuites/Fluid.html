<script>
var TABS=[
  {key:'smoke',icon:'💨',label:'Smoke'},
  {key:'waves',icon:'🌊',label:'Waves'},
  {key:'vortices',icon:'🌀',label:'Vortices'},
  {key:'sph',icon:'💧',label:'SPH'},
  {key:'burgers',icon:'⚡',label:'Burgers'}
];
function buildTabs(){
  var tabs=$('tbTabs');tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active')});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active')});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');if(!body)return;
  var m=MODULES[STATE.currentTab];if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.7rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4><div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div style="font-size:.6rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b style="color:var(--c1)">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.6rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c2)':l.type==='warn'?'var(--c4)':'var(--c1)';
    html+='<div style="padding:3px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Flowing':'Paused','info',900);
}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&(m.stepOnce||m.step)){if(m.stepOnce)m.stepOnce();else m.step();}else toast('No step','info',900);}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['fluid','light','mono'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function showHelp(){
  openModal('❓ FLUID — Help',
    '<div class="sec"><h4>🌊 About</h4><div style="font-size:.62rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)">Fluid dynamics and PDE workbench in one HTML file. Real Navier-Stokes solver (Stable Fluids), 2D wave equation, point vortex dynamics, SPH particle fluid, and Burgers equation — all from scratch, no libraries.</div></div>'+
    '<div class="sec"><h4>📚 Modules</h4><div style="font-size:.62rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)">'+
    '<b style="color:var(--c1)">💨 Smoke</b> — Stable Fluids (Jos Stam), mouse-driven<br>'+
    '<b style="color:var(--c1)">🌊 Waves</b> — 2D wave equation with reflections<br>'+
    '<b style="color:var(--c1)">🌀 Vortices</b> — point vortex dynamics + Biot-Savart<br>'+
    '<b style="color:var(--c1)">💧 SPH</b> — particle fluid with kernel smoothing<br>'+
    '<b style="color:var(--c1)">⚡ Burgers</b> — 1D nonlinear PDE, shock formation'+
    '</div></div>'+
    '<div class="sec"><h4>⌨️ Shortcuts</h4><div style="font-size:.62rem;font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+
    '<b style="color:var(--c1)">Space</b> — Play/pause<br>'+
    '<b style="color:var(--c1)">→</b> — Single step<br>'+
    '<b style="color:var(--c1)">R</b> — Reset module<br>'+
    '<b style="color:var(--c1)">1-5</b> — Jump to module<br>'+
    '<b style="color:var(--c1)">T</b> — Cycle theme<br>'+
    '<b style="color:var(--c1)">?</b> — This help'+
    '</div></div>'+
    '<div class="sec"><h4>🎮 Tips</h4><div style="font-size:.6rem;font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    '• Smoke: drag mouse to inject velocity + density; try "Auto-emitter"<br>'+
    '• Waves: two clicks close together → interference pattern<br>'+
    '• Vortices: dipole preset shows self-propelled vortex pair<br>'+
    '• SPH: click to add particles; raise viscosity for honey-like fluid<br>'+
    '• Burgers: watch a sine wave steepen into a shock then smooth out'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* Animated boot fluid */
function animateBootFluid(){
  var bc=$('bootFluid');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  var t0=performance.now();
  function frame(){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    var t=(performance.now()-t0)/1000;
    bctx.clearRect(0,0,bc.width,bc.height);
    /* Draw multiple layers of flowing sine waves */
    var layers=[
      {color:'rgba(64,208,255,.25)',amp:60,freq:0.008,speed:0.6,offset:0},
      {color:'rgba(64,255,208,.22)',amp:80,freq:0.006,speed:0.4,offset:1.5},
      {color:'rgba(128,128,255,.18)',amp:100,freq:0.005,speed:0.3,offset:3},
      {color:'rgba(255,96,160,.12)',amp:120,freq:0.004,speed:0.2,offset:4.5}
    ];
    var cy=bc.height/2;
    layers.forEach(function(L,i){
      bctx.beginPath();
      bctx.moveTo(0,cy);
      for(var x=0;x<bc.width;x+=6){
        var y=cy+Math.sin(x*L.freq+t*L.speed)*L.amp*Math.sin(t*0.5+L.offset)+Math.sin(x*L.freq*2.3+t*L.speed*1.7)*L.amp*0.3;
        bctx.lineTo(x,y);
      }
      bctx.lineTo(bc.width,cy);
      bctx.lineTo(bc.width,bc.height);
      bctx.lineTo(0,bc.height);
      bctx.closePath();
      bctx.fillStyle=L.color;
      bctx.fill();
    });
    /* Small particles */
    for(var i=0;i<80;i++){
      var x=(t*20+i*17)%bc.width;
      var y=bc.height/2+Math.sin(t+i*0.5)*150;
      bctx.fillStyle='rgba(160,220,255,'+(0.3+0.3*Math.sin(t*2+i))+')';
      bctx.beginPath();
      bctx.arc(x,y,1.5,0,Math.PI*2);
      bctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
}

var BOOT_STEPS=[
  'Compiling Stable Fluids solver (advect + project)...',
  'Initializing Gauss-Seidel pressure relaxation...',
  'Precomputing vorticity confinement stencils...',
  'Loading Biot-Savart vortex kernel...',
  'Setting up SPH poly6 + spiky kernels...',
  'Building spatial hash grid for particles...',
  'Configuring Burgers shock capture...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  animateBootFluid();
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('FLUID ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('FLUID initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='flowing';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});

console.log('%c FLUID ','background:linear-gradient(90deg,#40d0ff,#40ffd0,#8080ff);color:#020810;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('%cFluid Dynamics Lab','color:#40d0ff;font-weight:600');
console.log('%cSmoke · Waves · Vortices · SPH · Burgers','color:#40ffd0');
console.log('%cPress ? for help','color:#80a8d0');
</script>
