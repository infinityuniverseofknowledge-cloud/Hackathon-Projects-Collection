<!DOCTYPE html>
<html lang="en" data-theme="fluid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FLUID — Fluid Dynamics Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#020810;--bg2:#04101c;--bg3:#0a1c30;--bg4:#142a48;
  --panel:#04101c;--panel2:#0a1c30;--panel3:#142a48;--panel4:#1e3a60;
  --bd:#0a2038;--bd2:#164068;--bd3:#2260a0;
  --tx:#d0e8ff;--tx2:#80a8d0;--tx3:#4a7090;--mu:#2a4868;
  --c1:#40d0ff;--c1h:#80e0ff;--c1l:#2090c0;
  --c2:#40ffd0;--c2h:#80ffe0;--c2l:#20c0a0;
  --c3:#8080ff;--c3h:#b0b0ff;--c3l:#4040c0;
  --c4:#ffd040;--c4h:#ffe880;--c4l:#c0a020;
  --c5:#ff60a0;--c5h:#ff90c0;--c5l:#c03080;
  --c6:#ff8040;--c6h:#ffa870;--c6l:#c05020;
  --ok:#40ffd0;--warn:#ffd040;--err:#ff60a0;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40d0ff,#40ffd0);
  --g2:linear-gradient(135deg,#8080ff,#40d0ff);
  --gHolo:linear-gradient(120deg,#40d0ff,#40ffd0,#8080ff,#ff60a0,#ffd040,#40d0ff);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f8ff;--bg2:#e0f0ff;--bg3:#d0e8f8;--panel:#fff;--panel2:#f0f8ff;--panel3:#e0f0ff;
  --bd:#c0d8e8;--bd2:#a0c0d8;--tx:#0a1830;--tx2:#305070;--tx3:#6080a0;
  --c1:#0060c0;--c2:#008060;--c3:#3030c0;--c4:#a08000;--c5:#c02060;--c6:#c05020;
  --g1:linear-gradient(135deg,#0060c0,#008060)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101014;--bg3:#18181e;--panel:#101014;--panel2:#18181e;--panel3:#202028;
  --bd:#282830;--bd2:#404048;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#020810;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px;overflow:hidden}
#boot.hidden{opacity:0;pointer-events:none}
#bootFluid{position:absolute;inset:0;pointer-events:none;opacity:.6}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:16px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px;position:relative;z-index:1}
.boot-sub{font-size:.66rem;color:#40d0ff;letter-spacing:10px;margin-bottom:26px;opacity:.75;position:relative;z-index:1}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#0a1c30;border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative;z-index:1}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40d0ff}
.boot-pct{font-size:.66rem;color:#40d0ff;margin-bottom:14px;position:relative;z-index:1}
.boot-log{font-size:.58rem;color:#4a7090;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7;position:relative;z-index:1}
.boot-log .ok{color:#40ffd0}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#020810;box-shadow:0 0 12px rgba(64,208,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#0a1c30;transition:var(--t1)}
.tb-status .dot.on{background:var(--c2);box-shadow:0 0 10px var(--c2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#01060e;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(4,16,28,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c4);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,208,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#020810;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(64,208,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--c4);border-color:var(--c4)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#020810;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c2)}.toast.warn{border-left-color:var(--c4)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <canvas id="bootFluid" style="position:absolute;inset:0"></canvas>
  <div class="boot-logo">FLUID</div>
  <div class="boot-sub">FLUID DYNAMICS LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('smoke')">FLUID</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">flowing</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Grid</span><span class="sb-val c2" id="sbGrid">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Iter</span><span class="sb-val c3" id="sbIter">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">CFL</span><span class="sb-val c4" id="sbCfl">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">E</span><span class="sb-val c5" id="sbEnergy">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Smoke</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:.95rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault()});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}

function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY,button:0});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){

  };

/* ================================================================
   COLOR PALETTES
   ================================================================ */
/* Plasma palette: black → purple → cyan → white */
function plasmaRGB(t){
  t=clamp(t,0,1);
  var r,g,b;
  if(t<0.25){
    var s=t/0.25;
    r=Math.round(20*s);
    g=0;
    b=Math.round(40+120*s);
  } else if(t<0.5){
    var s=(t-0.25)/0.25;
    r=Math.round(20+40*s);
    g=Math.round(40*s);
    b=Math.round(160+60*s);
  } else if(t<0.75){
    var s=(t-0.5)/0.25;
    r=Math.round(60+120*s);
    g=Math.round(40+160*s);
    b=Math.round(220+35*s);
  } else {
    var s=(t-0.75)/0.25;
    r=Math.round(180+75*s);
    g=Math.round(200+55*s);
    b=255;
  }
  return [r,g,b];
}
/* Ocean palette: dark → deep blue → teal → cyan → white */
function oceanRGB(t){
  t=clamp(t,0,1);
  var r=Math.round(255*Math.pow(t,2.5));
  var g=Math.round(255*Math.pow(t,1.6));
  var b=Math.round(100+155*Math.pow(t,0.7));
  return [r,g,b];
}
/* Fire palette */
function fireRGB(t){
  t=clamp(t,0,1);
  var r=Math.round(255*Math.pow(t,0.6));
  var g=Math.round(255*Math.pow(t,1.4));
  var b=Math.round(255*Math.pow(t,3));
  return [r,g,b];
}

/* Shared ImageData cache for grid solvers */
var IMG_CACHE={canvas:null,ctx:null,img:null};
function gridToCanvas(ctx,field,W,H,drawW,drawH,palette,scale){
  if(!IMG_CACHE.canvas||IMG_CACHE.canvas.width!==W||IMG_CACHE.canvas.height!==H){
    IMG_CACHE.canvas=document.createElement('canvas');
    IMG_CACHE.canvas.width=W;IMG_CACHE.canvas.height=H;
    IMG_CACHE.ctx=IMG_CACHE.canvas.getContext('2d');
    IMG_CACHE.img=IMG_CACHE.ctx.createImageData(W,H);
  }
  var d=IMG_CACHE.img.data;
  var s=scale||1;
  for(var i=0;i<W*H;i++){
    var v=clamp(field[i]*s,0,1);
    var c=palette(v);
    d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;
  }
  IMG_CACHE.ctx.putImageData(IMG_CACHE.img,0,0);
  ctx.drawImage(IMG_CACHE.canvas,0,0,drawW,drawH);
}

<script>

  currentTab:'smoke',

/* ================================================================
   MODULE 1: SMOKE (Stable Fluids — Jos Stam)
   ================================================================ */
registerModule('smoke',{
  title:'Eulerian Smoke',
  icon:'💨',
  desc:'Jos Stam\'s Stable Fluids. Advection + Gauss-Seidel diffusion + pressure projection enforces incompressibility. Mouse drags smoke with velocity.',
  init:function(){
    var s=STATE.smoke;
    var N=s.N;
    s.size=(N+2)*(N+2);
    s.u=new Float32Array(s.size);
    s.v=new Float32Array(s.size);
    s.u0=new Float32Array(s.size);
    s.v0=new Float32Array(s.size);
    s.dens=new Float32Array(s.size);
    s.dens0=new Float32Array(s.size);
    s.curl=new Float32Array(s.size);
    /* Seed with some smoke in center */
    for(var i=0;i<s.size;i++){
      if(Math.random()<0.001)s.dens[i]=1;
    }
    logMsg('Smoke: '+N+'×'+N+' grid, '+s.iter+' GS iters','success');
  },
  IX:function(i,j){return i+(STATE.smoke.N+2)*j},
  setBnd:function(b,x){
    var s=STATE.smoke,N=s.N,IX=this.IX.bind(this);
    for(var i=1;i<=N;i++){
      x[IX(0,i)]   = b===1?-x[IX(1,i)]:x[IX(1,i)];
      x[IX(N+1,i)] = b===1?-x[IX(N,i)]:x[IX(N,i)];
      x[IX(i,0)]   = b===2?-x[IX(i,1)]:x[IX(i,1)];
      x[IX(i,N+1)] = b===2?-x[IX(i,N)]:x[IX(i,N)];
    }
    x[IX(0,0)]     = 0.5*(x[IX(1,0)]+x[IX(0,1)]);
    x[IX(0,N+1)]   = 0.5*(x[IX(1,N+1)]+x[IX(0,N)]);
    x[IX(N+1,0)]   = 0.5*(x[IX(N,0)]+x[IX(N+1,1)]);
    x[IX(N+1,N+1)] = 0.5*(x[IX(N,N+1)]+x[IX(N+1,N)]);
  },
  linSolve:function(x,x0,a,c,iters){
    var s=STATE.smoke,N=s.N,IX=this.IX.bind(this);
    var cRecip=1/c;
    for(var k=0;k<iters;k++){
      for(var j=1;j<=N;j++){
        for(var i=1;i<=N;i++){
          x[IX(i,j)]=(x0[IX(i,j)]+a*(x[IX(i-1,j)]+x[IX(i+1,j)]+x[IX(i,j-1)]+x[IX(i,j+1)]))*cRecip;
        }
      }
      this.setBnd(0,x);
    }
  },
  project:function(u,v,p,div){
    var s=STATE.smoke,N=s.N,IX=this.IX.bind(this);
    var h=1.0/N;
    for(var j=1;j<=N;j++){
      for(var i=1;i<=N;i++){
        div[IX(i,j)]=-0.5*h*(u[IX(i+1,j)]-u[IX(i-1,j)]+v[IX(i,j+1)]-v[IX(i,j-1)]);
        p[IX(i,j)]=0;
      }
    }
    this.setBnd(0,div);this.setBnd(0,p);
    this.linSolve(p,div,1,4,s.iter);
    for(var j=1;j<=N;j++){
      for(var i=1;i<=N;i++){
        u[IX(i,j)]-=0.5*(p[IX(i+1,j)]-p[IX(i-1,j)])/h;
        v[IX(i,j)]-=0.5*(p[IX(i,j+1)]-p[IX(i,j-1)])/h;
      }
    }
    this.setBnd(1,u);this.setBnd(2,v);
  },
  advect:function(d,d0,u,v,dt){
    var s=STATE.smoke,N=s.N,IX=this.IX.bind(this);
    var dt0=dt*N;
    for(var j=1;j<=N;j++){
      for(var i=1;i<=N;i++){
        var x=i-dt0*u[IX(i,j)];
        var y=j-dt0*v[IX(i,j)];
        if(x<0.5)x=0.5;if(x>N+0.5)x=N+0.5;
        if(y<0.5)y=0.5;if(y>N+0.5)y=N+0.5;
        var i0=Math.floor(x),i1=i0+1;
        var j0=Math.floor(y),j1=j0+1;
        var s1=x-i0,s0=1-s1;
        var t1=y-j0,t0=1-t1;
        d[IX(i,j)]=s0*(t0*d0[IX(i0,j0)]+t1*d0[IX(i0,j1)])+s1*(t0*d0[IX(i1,j0)]+t1*d0[IX(i1,j1)]);
      }
    }
    this.setBnd(0,d);
  },
  vorticityConfinement:function(dt){
    var s=STATE.smoke,N=s.N,IX=this.IX.bind(this);
    var curl=s.curl,u=s.u,v=s.v;
    /* Compute curl */
    for(var j=1;j<=N;j++){
      for(var i=1;i<=N;i++){
        curl[IX(i,j)]=0.5*((v[IX(i+1,j)]-v[IX(i-1,j)])-(u[IX(i,j+1)]-u[IX(i,j-1)]));
      }
    }
    /* Apply confinement */
    var eps=s.vorticity/100;
    var force=new Float32Array(s.size*2);
    for(var j=2;j<N;j++){
      for(var i=2;i<N;i++){
        var dwdx=0.5*(Math.abs(curl[IX(i+1,j)])-Math.abs(curl[IX(i-1,j)]));
        var dwdy=0.5*(Math.abs(curl[IX(i,j+1)])-Math.abs(curl[IX(i,j-1)]));
        var len=Math.sqrt(dwdx*dwdx+dwdy*dwdy)+1e-5;
        var nx=dwdx/len;
        var ny=dwdy/len;
        u[IX(i,j)]+=eps*ny*curl[IX(i,j)]*dt;
        v[IX(i,j)]-=eps*nx*curl[IX(i,j)]*dt;
      }
    }
  },
  step:function(dt){
    var s=STATE.smoke,N=s.N;
    s.u0.set(s.u);s.v0.set(s.v);s.dens0.set(s.dens);
    /* Diffuse velocity (small) */
    if(s.visc>0){
      var a=s.visc*dt*N*N;
      this.linSolve(s.u,s.u0,a,1+a,4);
      this.linSolve(s.v,s.v0,a,1+a,4);
    }
    /* Project */
    this.project(s.u,s.v,s.u0,s.v0);
    /* Advect velocity */
    var u0=s.u0.slice(),v0=s.v0.slice();
    this.advect(s.u,u0,s.u,s.v,dt);
    this.advect(s.v,v0,s.u,s.v,dt);
    this.project(s.u,s.v,s.u0,s.v0);
    /* Vorticity confinement */
    if(s.vorticity>0)this.vorticityConfinement(dt);
    /* Diffuse density */
    if(s.diff>0){
      var a2=s.diff*dt*N*N;
      this.linSolve(s.dens,s.dens0,a2,1+a2,4);
    }
    /* Advect density */
    var d0=s.dens0.slice();
    this.advect(s.dens,d0,s.u,s.v,dt);
  },
  addForce:function(x,y,dx,dy){
    var s=STATE.smoke,N=s.N;
    /* x,y in [0,1] normalized */
    var i=clamp(Math.floor(x*N)+1,1,N);
    var j=clamp(Math.floor(y*N)+1,1,N);
    s.u[this.IX(i,j)]+=dx*s.force;
    s.v[this.IX(i,j)]+=dy*s.force;
    s.dens[this.IX(i,j)]+=s.density;
    /* Small radius spread */
    for(var di=-2;di<=2;di++)for(var dj=-2;dj<=2;dj++){
      var ii=clamp(i+di,1,N),jj=clamp(j+dj,1,N);
      var w=Math.exp(-(di*di+dj*dj)/2);
      s.u[this.IX(ii,jj)]+=dx*s.force*w*0.5;
      s.v[this.IX(ii,jj)]+=dy*s.force*w*0.5;
      s.dens[this.IX(ii,jj)]+=s.density*w*0.7;
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var s=STATE.smoke;
    if(!STATE.playing)return;
    var sub=s.substeps;
    var sdt=s.dt/sub;
    for(var k=0;k<sub;k++)this.step(sdt);
    /* Auto-emitter: forces at bottom center */
    if(s.autoEmitter){
      var t=STATE.time*2;
      var fx=0.5+0.15*Math.sin(t);
      var ang=s.emitterAngle+0.3*Math.sin(t*1.5);
      this.addForce(fx,0.92,Math.cos(ang-Math.PI/2)*0.8,Math.sin(ang-Math.PI/2)*0.8);
    }
    /* Fade density */
    for(var i=0;i<s.dens.length;i++)s.dens[i]*=0.995;
    /* Clamp density */
    for(var i=0;i<s.dens.length;i++)if(s.dens[i]>4)s.dens[i]=4;
  },
  stepOnce:function(){ this.tick(0.05); },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#01060e';
    ctx.fillRect(0,0,W,H);
    var s=STATE.smoke;
    if(!s.dens)return;
    var N=s.N;
    /* Render to screen with palette */
    var pal=s.colorScheme==='fire'?fireRGB:s.colorScheme==='ocean'?oceanRGB:plasmaRGB;
    /* Render each cell directly at screen resolution but only N² pixels */
    var scale=Math.min(W/H,H/H);
    /* Simpler: use offscreen canvas approach */
    if(!s.imageData||s.imageData.width!==N){
      s.imageData=ctx.createImageData(N,N);
    }
    var img=s.imageData;
    var d=img.data;
    /* Render the interior N×N */
    for(var j=0;j<N;j++){
      for(var i=0;i<N;i++){
        var v=s.dens[this.IX(i+1,j+1)];
        var c=pal(v*0.6);
        var idx=(j*N+i)*4;
        d[idx]=c[0];d[idx+1]=c[1];d[idx+2]=c[2];d[idx+3]=255;
      }
    }
    /* Draw to offscreen then scale */
    var off=document.createElement('canvas');
    off.width=N;off.height=N;
    off.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(off,0,0,W,H);
    /* Info panel */
    ctx.fillStyle='rgba(4,16,28,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,150,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('STABLE FLUIDS (STAM)',32,42);
    ctx.fillStyle='#d0e8ff';
    ctx.font='10px monospace';
    ctx.fillText('Grid: '+N+'×'+N,32,62);
    ctx.fillText('Gauss-Seidel: '+s.iter+' iters',32,78);
    ctx.fillText('Vorticity: '+s.vorticity,32,94);
    ctx.fillText('Force: '+fmt(s.force,1),32,110);
    ctx.fillText('Substeps: '+s.substeps,32,126);
    ctx.fillText('Auto-emitter: '+(s.autoEmitter?'ON':'off'),32,142);
    /* Drag hint */
    ctx.fillStyle='rgba(4,16,28,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,H-50,400,36,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='11px monospace';
    ctx.textAlign='left';
    ctx.fillText('Drag mouse to inject smoke + force  ·  Right-click = burst',32,H-28);
    /* Total density (for stats) */
    var total=0;
    for(var i=0;i<s.dens.length;i++)total+=s.dens[i];
    setStatsHTML(
      '<div>Grid: '+N+'×'+N+'</div>'+
      '<div>Total mass: '+fmt(total,0)+'</div>'+
      '<div>Cells: '+(s.size).toLocaleString()+'</div>'+
      '<div>Palette: '+s.colorScheme+'</div>'
    );
    updateBadge('💨 Smoke · '+N+'×'+N+' · mass '+fmt(total,0));
    $('sbMode').textContent='Smoke';
    $('sbGrid').textContent=N+'×'+N;
    $('sbIter').textContent=s.iter;
  },
  onDown:function(p){this._apply(p);},
  onMove:function(p){if(INPUT.down)this._apply(p);},
  _apply:function(p){
    var s=STATE.smoke;
    var nx=p.x/CANV.W;
    var ny=1-p.y/CANV.H;
    var dx=INPUT.dx*0.02*s.force;
    var dy=-INPUT.dy*0.02*s.force;
    if(INPUT.right){
      /* Burst */
      for(var k=0;k<8;k++){
        var a=Math.random()*Math.PI*2;
        this.addForce(nx,ny,Math.cos(a)*1.5,Math.sin(a)*1.5);
      }
    } else if(Math.abs(dx)>0.01||Math.abs(dy)>0.01){
      this.addForce(nx,ny,dx,dy);
    } else {
      this.addForce(nx,ny,0,0);
    }
  },
  controls:function(){
    var s=STATE.smoke;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Grid N</span><span>'+s.N+'</span></div>';
    html+='<input type="range" min="48" max="160" step="8" value="'+s.N+'" oninput="STATE.smoke.N=parseInt(this.value);MODULES.smoke.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Gauss-Seidel iters</span><span>'+s.iter+'</span></div>';
    html+='<input type="range" min="4" max="30" step="2" value="'+s.iter+'" oninput="STATE.smoke.iter=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Vorticity confinement</span><span>'+s.vorticity+'</span></div>';
    html+='<input type="range" min="0" max="60" step="1" value="'+s.vorticity+'" oninput="STATE.smoke.vorticity=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Mouse force</span><span>'+fmt(s.force,1)+'</span></div>';
    html+='<input type="range" min="1" max="20" step="0.5" value="'+s.force+'" oninput="STATE.smoke.force=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Substeps/frame</span><span>'+s.substeps+'</span></div>';
    html+='<input type="range" min="1" max="4" step="1" value="'+s.substeps+'" oninput="STATE.smoke.substeps=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Palette</h4><div class="chip-row">';
    ['plasma','ocean','fire'].forEach(function(c){
      html+='<div class="chip '+(s.colorScheme===c?'active':'')+'" onclick="STATE.smoke.colorScheme=\''+c+'\';renderLeftPanel()">'+c+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Options</h4><div class="chip-row">';
    html+='<div class="chip '+(s.autoEmitter?'active':'')+'" onclick="STATE.smoke.autoEmitter=!STATE.smoke.autoEmitter;renderLeftPanel()">Auto-emitter</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.smoke.init()">↺ Reset field</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="for(var k=0;k<20;k++)MODULES.smoke.addForce(0.5,0.9,Math.cos(Math.random()*6.28)*1.5,Math.sin(Math.random()*6.28)*1.5);toast(\'Burst!\',\'success\')">💥 Burst at center</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Interaction</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '<b style="color:var(--c1)">Drag</b> — inject velocity + density<br>'+
      '<b style="color:var(--c3)">Right-click</b> — burst'
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var s=STATE.smoke;
    return '<div class="sec"><h4>Navier-Stokes (incompressible)</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '∂u/∂t = −(u·∇)u − ∇p + ν∇²u + F<br>'+
      '∇·u = 0<br><br>'+
      'u velocity, p pressure, ν viscosity, F external force'+
      '</div></div>'+
      '<div class="sec"><h4>Stable Fluids algorithm</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '1. Advect: u ← u(x − u·dt)<br>'+
      '2. Diffuse (implicit): (I − ν·dt·∇²)u = u₀<br>'+
      '3. Project: solve ∇²p = ∇·u, u ← u − ∇p<br><br>'+
      'Jos Stam (1999) — unconditionally stable.'+
      '</div></div>'+
      '<div class="sec"><h4>Semi-Lagrangian advection</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Instead of forward tracing particles, we trace <b>backwards</b>:<br>'+
      'x_back = x − u·dt<br>'+
      'Then bilinearly interpolate the field.'+
      '</div></div>'+
      '<div class="sec"><h4>Vorticity confinement</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Restores small-scale swirls lost to numerical diffusion:<br><br>'+
      'ω = ∇×u<br>'+
      'N = ∇|ω| / |∇|ω||<br>'+
      'F = ε·(N × ω)'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Grid</span><span class="v">'+s.N+'×'+s.N+'</span></div>'+
      '<div class="row"><span class="k">GS iters</span><span class="v">'+s.iter+'</span></div>'+
      '<div class="row"><span class="k">Vorticity ε</span><span class="v">'+s.vorticity+'</span></div>'+
      '<div class="row"><span class="k">Substeps</span><span class="v">'+s.substeps+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 2: WAVES (2D wave equation)
   ================================================================ */
registerModule('waves',{
  title:'Wave Equation',
  icon:'🌊',
  desc:'2D wave equation ∂²u/∂t² = c²∇²u via finite differences. Click to splash. Reflects off walls, interferes with existing waves.',
  init:function(){
    var w=STATE.waves;
    var N=w.N;
    w.curr=new Float32Array(N*N);
    w.prev=new Float32Array(N*N);
    w.next=new Float32Array(N*N);
    w.energy=0;w.excited=0;
    logMsg('Waves: '+N+'×'+N+' grid, c='+w.c,'success');
  },
  step:function(){
    var w=STATE.waves;
    var N=w.N;
    var c2=w.c*w.c;
    var curr=w.curr,prev=w.prev,next=w.next;
    for(var j=1;j<N-1;j++){
      for(var i=1;i<N-1;i++){
        var idx=j*N+i;
        var lap=curr[(j-1)*N+i]+curr[(j+1)*N+i]+curr[j*N+i-1]+curr[j*N+i+1]-4*curr[idx];
        next[idx]=2*curr[idx]-prev[idx]+c2*lap;
        next[idx]*=w.damping;
      }
    }
    /* Boundary handling */
    if(w.absorb){
      /* Absorbing (Mur) — simplified as damping near edges */
      for(var i=0;i<N;i++){
        next[i]*=0.5;next[(N-1)*N+i]*=0.5;
        next[i*N]*=0.5;next[i*N+N-1]*=0.5;
      }
    } else {
      /* Reflecting (Neumann: ∂u/∂n = 0) */
      for(var i=0;i<N;i++){
        next[i]=next[N+i];
        next[(N-1)*N+i]=next[(N-2)*N+i];
        next[i*N]=next[i*N+1];
        next[i*N+N-1]=next[i*N+N-2];
      }
    }
    /* Rotate buffers */
    w.prev=curr;w.curr=next;w.next=prev;
    /* Track energy */
    var e=0;
    for(var i=0;i<w.curr.length;i++)e+=w.curr[i]*w.curr[i];
    w.energy=e;
  },
  excite:function(x,y,radius,strength){
    var w=STATE.waves;
    var N=w.N;
    var cx=Math.floor(x*N);
    var cy=Math.floor(y*N);
    var r=Math.max(1,Math.floor(radius*N));
    for(var j=-r;j<=r;j++){
      for(var i=-r;j<=r;j++);/* placeholder */
    }
    for(var j=-r;j<=r;j++){
      for(var i=-r;i<=r;i++){
        var d=Math.sqrt(i*i+j*j);
        if(d>r)continue;
        var nx=cx+i,ny=cy+j;
        if(nx<1||nx>=N-1||ny<1||ny>=N-1)continue;
        var s=1-d/r;
        var idx=ny*N+nx;
        var delta=strength*s*s*Math.cos(d*Math.PI/r);
        w.curr[idx]-=delta;
        w.prev[idx]-=delta*0.5;
      }
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var w=STATE.waves;
    if(!STATE.playing)return;
    var steps=Math.max(1,Math.floor(dt*60));
    for(var k=0;k<steps;k++)this.step();
  },
  stepOnce:function(){ this.step(); },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#01060e';
    ctx.fillRect(0,0,W,H);
    var w=STATE.waves;
    if(!w.curr)return;
    var N=w.N;
    /* Compute display image */
    if(!w.imageData||w.imageData.width!==N){
      w.imageData=ctx.createImageData(N,N);
    }
    var img=w.imageData;
    var d=img.data;
    var pal=w.colorScheme==='plasma'?plasmaRGB:w.colorScheme==='fire'?fireRGB:oceanRGB;
    for(var j=0;j<N;j++){
      for(var i=0;i<N;i++){
        var v=w.curr[j*N+i];
        /* Map v from [-1,1] to [0,1] with 0.5 neutral */
        var t=v*1.5+0.5;
        var c=pal(clamp(t,0,1));
        var idx=(j*N+i)*4;
        d[idx]=c[0];d[idx+1]=c[1];d[idx+2]=c[2];d[idx+3]=255;
      }
    }
    var off=document.createElement('canvas');
    off.width=N;off.height=N;
    off.getContext('2d').putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(off,0,0,W,H);
    /* Overlay info */
    ctx.fillStyle='rgba(4,16,28,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,150,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('2D WAVE EQUATION',32,42);
    ctx.fillStyle='#d0e8ff';
    ctx.font='10px monospace';
    ctx.fillText('Grid: '+N+'×'+N,32,62);
    ctx.fillText('c (speed): '+fmt(w.c,3),32,78);
    ctx.fillText('damping: '+fmt(w.damping,4),32,94);
    ctx.fillText('Boundary: '+(w.absorb?'absorbing':'reflecting'),32,110);
    ctx.fillText('Energy: '+fmt(w.energy,2),32,126);
    ctx.fillText('Excitation: '+w.excited,32,142);
    /* Hint */
    ctx.fillStyle='rgba(4,16,28,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,H-50,420,36,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='11px monospace';
    ctx.fillText('Click to inject a wave  ·  Drag to draw a continuous source',32,H-28);
    setStatsHTML(
      '<div>Grid: '+N+'×'+N+'</div>'+
      '<div>c: '+fmt(w.c,3)+'</div>'+
      '<div>Energy: '+fmt(w.energy,1)+'</div>'+
      '<div>Boundary: '+(w.absorb?'absorb':'reflect')+'</div>'
    );
    updateBadge('🌊 Wave · '+N+'×'+N+' · c='+fmt(w.c,2));
    $('sbMode').textContent='Waves';
    $('sbGrid').textContent=N+'×'+N;
    $('sbEnergy').textContent=fmt(w.energy,0);
  },
  onDown:function(p){
    var w=STATE.waves;
    this.excite(p.x/CANV.W,p.y/CANV.H,0.03,w.srcStrength);
    w.excited++;
  },
  onMove:function(p){
    if(!INPUT.down)return;
    var w=STATE.waves;
    this.excite(p.x/CANV.W,p.y/CANV.H,0.015,w.srcStrength*0.5);
  },
  controls:function(){
    var w=STATE.waves;
    var html='';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Wave speed c</span><span>'+fmt(w.c,3)+'</span></div>';
    html+='<input type="range" min="0.05" max="0.7" step="0.01" value="'+w.c+'" oninput="STATE.waves.c=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Damping</span><span>'+fmt(w.damping,4)+'</span></div>';
    html+='<input type="range" min="0.9" max="1" step="0.001" value="'+w.damping+'" oninput="STATE.waves.damping=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Source strength</span><span>'+fmt(w.srcStrength,2)+'</span></div>';
    html+='<input type="range" min="0.2" max="4" step="0.1" value="'+w.srcStrength+'" oninput="STATE.waves.srcStrength=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Grid N</span><span>'+w.N+'</span></div>';
    html+='<input type="range" min="60" max="200" step="10" value="'+w.N+'" oninput="STATE.waves.N=parseInt(this.value);MODULES.waves.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Palette</h4><div class="chip-row">';
    ['ocean','plasma','fire'].forEach(function(c){
      html+='<div class="chip '+(w.colorScheme===c?'active':'')+'" onclick="STATE.waves.colorScheme=\''+c+'\';renderLeftPanel()">'+c+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Boundary</h4><div class="chip-row">';
    html+='<div class="chip '+(w.absorb?'active':'')+'" onclick="STATE.waves.absorb=true;renderLeftPanel()">Absorbing</div>';
    html+='<div class="chip '+(!w.absorb?'active':'')+'" onclick="STATE.waves.absorb=false;renderLeftPanel()">Reflecting</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.waves.init()">↺ Reset</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.waves.excite(0.5,0.5,0.05,3)">💥 Big splash</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.waves.excite(0.3,0.5,0.02,2);MODULES.waves.excite(0.7,0.5,0.02,2);toast(\'Interference\',\'info\')">🌊 Double source</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Try it</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '• Set reflecting boundaries and click — waves bounce forever<br>'+
      '• Click two sources close together to see interference<br>'+
      '• Lower damping to 0.999 for near-perfect propagation'
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var w=STATE.waves;
    var cfl=w.c;
    return '<div class="sec"><h4>Wave equation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '∂²u/∂t² = c²·∇²u<br><br>'+
      'Discretized (leapfrog):<br>'+
      'uⁿ⁺¹ = 2uⁿ − uⁿ⁻¹ + c²·Δt²·∇²uⁿ'+
      '</div></div>'+
      '<div class="sec"><h4>5-point Laplacian</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '∇²u ≈ u[i−1,j] + u[i+1,j] + u[i,j−1] + u[i,j+1] − 4u[i,j]<br><br>'+
      '(assumes Δx = Δy = 1)'+
      '</div></div>'+
      '<div class="sec"><h4>CFL condition</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'For stability in 2D: c ≤ 1/√2 ≈ 0.707<br><br>'+
      'Current c = '+fmt(cfl,3)+'  '+(cfl<0.707?'✓ stable':'✗ unstable!')+
      '</div></div>'+
      '<div class="sec"><h4>Boundary conditions</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c1)">Dirichlet:</b> u = 0 at boundary (fixed end)<br>'+
      '<b style="color:var(--c1)">Neumann:</b> ∂u/∂n = 0 at boundary (free end) — waves reflect'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 3: VORTICES (Point vortex dynamics)
   ================================================================ */
registerModule('vortices',{
  title:'Point Vortices',
  icon:'🌀',
  desc:'Biot-Savart law governs vortex interactions. Like-signs orbit, opposite-signs translate as dipoles. Click to add vortices.',
  init:function(){
    STATE.vortices.vortices=[];
    /* Start with a nice dipole */
    this.addVortex(0.4,0.5,1);
    this.addVortex(0.6,0.5,-1);
    logMsg('Vortices: point vortex model with Biot-Savart','success');
  },
  addVortex:function(x,y,gamma){
    STATE.vortices.vortices.push({
      x:x,y:y,gamma:gamma,
      trail:[]
    });
  },
  velocityAt:function(x,y,skip){
    var v=STATE.vortices.vortices;
    var vx=0,vy=0;
    var core=0.012; /* core radius squared */
    for(var i=0;i<v.length;i++){
      if(i===skip)continue;
      var dx=x-v[i].x;
      var dy=y-v[i].y;
      var r2=dx*dx+dy*dy+core;
      var f=v[i].gamma/(2*Math.PI*r2);
      /* Biot-Savart: v = Γ/(2π r²) * (-dy, dx) */
      vx+=-dy*f;
      vy+=dx*f;
    }
    return {x:vx,y:vy};
  },
  tick:function(dt){
    STATE.time+=dt;
    var vr=STATE.vortices;
    if(!STATE.playing)return;
    /* RK2 for each vortex */
    var sub=4;
    var sdt=dt/sub;
    for(var k=0;k<sub;k++){
      vr.vortices.forEach(function(v,i){
        var a=this.velocityAt(v.x,v.y,i);
        var mx=v.x+a.x*sdt/2;
        var my=v.y+a.y*sdt/2;
        var b=this.velocityAt(mx,my,i);
        v.x+=b.x*sdt;
        v.y+=b.y*sdt;
      },this);
    }
    /* Trail + boundary check */
    vr.vortices.forEach(function(v){
      v.trail.push({x:v.x,y:v.y});
      if(v.trail.length>vr.trailLength)v.trail.shift();
      if(v.x<-0.2||v.x>1.2||v.y<-0.2||v.y>1.2){
        /* Wrap */
        if(v.x<-0.2)v.x=1.2;
        if(v.x>1.2)v.x=-0.2;
        if(v.y<-0.2)v.y=1.2;
        if(v.y>1.2)v.y=-0.2;
        v.trail=[];
      }
    });
  },
  stepOnce:function(){this.tick(0.05)},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#01060e';
    ctx.fillRect(0,0,W,H);
    var vr=STATE.vortices;
    /* Velocity field as arrows */
    if(vr.showVelocityField){
      var grid=vr.gridSpacing;
      for(var y=0;y<H;y+=grid){
        for(var x=0;x<W;x+=grid){
          var nx=x/W,ny=y/H;
          var v=this.velocityAt(nx,ny,-1);
          var mag=Math.sqrt(v.x*v.x+v.y*v.y);
          var len=clamp(mag*30,0,grid*0.9);
          var ang=Math.atan2(v.y,v.x);
          var ex=x+Math.cos(ang)*len;
          var ey=y+Math.sin(ang)*len;
          var alpha=clamp(mag*2,0,0.5);
          ctx.strokeStyle='rgba(64,208,255,'+alpha+')';
          ctx.lineWidth=1.2;
          ctx.beginPath();
          ctx.moveTo(x,y);
          ctx.lineTo(ex,ey);
          ctx.stroke();
        }
      }
    }
    /* Vortex trails */
    if(vr.showTrails){
      vr.vortices.forEach(function(v){
        if(v.trail.length<2)return;
        var col=v.gamma>0?'#ff60a0':'#40ffd0';
        for(var i=0;i<v.trail.length-1;i++){
          var a=i/v.trail.length;
          ctx.strokeStyle=col;
          ctx.globalAlpha=a*0.7;
          ctx.lineWidth=1.5+a*2;
          ctx.beginPath();
          ctx.moveTo(v.trail[i].x*W,v.trail[i].y*H);
          ctx.lineTo(v.trail[i+1].x*W,v.trail[i+1].y*H);
          ctx.stroke();
        }
        ctx.globalAlpha=1;
      });
    }
    /* Vortices as glowing circles */
    vr.vortices.forEach(function(v){
      var x=v.x*W,y=v.y*H;
      var r=8+Math.abs(v.gamma)*3;
      var col=v.gamma>0?'#ff60a0':'#40ffd0';
      var g=ctx.createRadialGradient(x,y,0,x,y,r*3);
      g.addColorStop(0,col);
      g.addColorStop(0.5,col.replace('rgb','rgba').replace(')',',0.3)'));
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,r*3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      /* Sign indicator */
      ctx.fillStyle='#020810';
      ctx.font='bold 12px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(v.gamma>0?'+':'−',x,y+1);
      ctx.textBaseline='alphabetic';
    });
    /* Info */
    ctx.fillStyle='rgba(4,16,28,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('POINT VORTEX MODEL',32,42);
    ctx.fillStyle='#d0e8ff';
    ctx.font='10px monospace';
    ctx.fillText('Vortices: '+vr.vortices.length,32,62);
    ctx.fillText('Trail length: '+vr.trailLength,32,78);
    ctx.fillText('RK2 substeps: 4',32,94);
    ctx.fillText('Field: '+(vr.showVelocityField?'shown':'hidden'),32,110);
    /* Hint */
    ctx.fillStyle='rgba(4,16,28,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,H-50,440,36,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='11px monospace';
    ctx.fillText('Left-click = + vortex  ·  Right-click = − vortex  ·  Drag = add',32,H-28);
    setStatsHTML(
      '<div>Vortices: '+vr.vortices.length+'</div>'+
      '<div>+ vortices: '+vr.vortices.filter(function(v){return v.gamma>0}).length+'</div>'+
      '<div>− vortices: '+vr.vortices.filter(function(v){return v.gamma<0}).length+'</div>'+
      '<div>Trail: '+vr.trailLength+'</div>'
    );
    updateBadge('🌀 Vortices · '+vr.vortices.length+' point vortices');
    $('sbMode').textContent='Vortices';
  },
  onDown:function(p){
    var x=p.x/CANV.W,y=p.y/CANV.H;
    if(INPUT.right){
      this.addVortex(x,y,-1);
    } else {
      this.addVortex(x,y,1);
    }
  },
  onMove:function(p){
    if(!INPUT.down)return;
    if(Math.abs(INPUT.dx)>3||Math.abs(INPUT.dy)>3){
      var x=p.x/CANV.W,y=p.y/CANV.H;
      if(INPUT.right)this.addVortex(x,y,-0.5);
      else this.addVortex(x,y,0.5);
    }
  },
  controls:function(){
    var vr=STATE.vortices;
    var html='';
    html+='<div class="sec"><h4>Vortices</h4><div class="kv">';
    html+='<div class="row"><span class="k">Total</span><span class="v">'+vr.vortices.length+'</span></div>';
    html+='<div class="row"><span class="k">Positive (+Γ)</span><span class="v" style="color:var(--c5)">'+vr.vortices.filter(function(v){return v.gamma>0}).length+'</span></div>';
    html+='<div class="row"><span class="k">Negative (−Γ)</span><span class="v" style="color:var(--c2)">'+vr.vortices.filter(function(v){return v.gamma<0}).length+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Display</h4>';

/* ================================================================
   MODULE 4: SPH (Smoothed Particle Hydrodynamics)
   ================================================================ */
registerModule('sph',{
  title:'Particle Fluid (SPH)',
  icon:'💧',
  desc:'SPH particle fluid with poly6/spiky kernels and spatial hashing. Particles fall under gravity and splash against walls.',
  init:function(){
    var s=STATE.sph;
    s.particles=[];
    var W=CANV.W||800,H=CANV.H||600;
    s.boundsW=W;s.boundsH=H;
    for(var i=0;i<s.N;i++){
      s.particles.push({
        x:rndF(W*0.3,W*0.7),
        y:rndF(H*0.2,H*0.6),
        vx:rndF(-0.3,0.3),
        vy:rndF(-0.3,0.3),
        dens:0,
        pres:0
      });
    }
    s.hashCols=Math.ceil(W/s.h);
    s.hashRows=Math.ceil(H/s.h);
    logMsg('SPH: '+s.N+' particles, h='+s.h,'success');
  },
  buildHash:function(){
    var s=STATE.sph;
    var cols=s.hashCols,rows=s.hashRows;
    s.hashGrid=[];
    for(var i=0;i<cols*rows;i++)s.hashGrid.push([]);
    for(var k=0;k<s.particles.length;k++){
      var p=s.particles[k];
      var cx=clamp(Math.floor(p.x/s.h),0,cols-1);
      var cy=clamp(Math.floor(p.y/s.h),0,rows-1);
      s.hashGrid[cy*cols+cx].push(k);
    }
  },
  findNeighbors:function(p){
    var s=STATE.sph;
    var cols=s.hashCols,rows=s.hashRows;
    var cx=clamp(Math.floor(p.x/s.h),0,cols-1);
    var cy=clamp(Math.floor(p.y/s.h),0,rows-1);
    var list=[];
    for(var dy=-1;dy<=1;dy++){
      for(var dx=-1;dx<=1;dx++){
        var nx=cx+dx,ny=cy+dy;
        if(nx<0||nx>=cols||ny<0||ny>=rows)continue;
        var cell=s.hashGrid[ny*cols+nx];
        for(var k=0;k<cell.length;k++){
          var j=cell[k];
          if(s.particles[j]!==p)list.push(s.particles[j]);
        }
      }
    }
    return list;
  },
  step:function(){
    var s=STATE.sph;
    var h=s.h;
    var h2=h*h;
    /* Build spatial hash */
    this.buildHash();
    /* Compute densities */
    var mass=1.0;
    var poly6Coef=315/(64*Math.PI*Math.pow(h,9));
    for(var k=0;k<s.particles.length;k++){
      var p=s.particles[k];
      var dens=0;
      var nbrs=this.findNeighbors(p);
      for(var j=0;j<nbrs.length;j++){
        var dx=p.x-nbrs[j].x;
        var dy=p.y-nbrs[j].y;
        var r2=dx*dx+dy*dy;
        if(r2<h2){
          var d=h2-r2;
          dens+=mass*poly6Coef*d*d*d;
        }
      }
      /* Self contribution */
      dens+=mass*poly6Coef*h2*h2*h2;
      p.dens=dens;
      p.pres=s.stiffness*(dens-s.restDens);
      if(p.pres<0)p.pres=0;
      p.nbrs=nbrs;
    }
    /* Compute forces */
    var spikyGradCoef=-45/(Math.PI*Math.pow(h,6));
    var viscLapCoef=45/(Math.PI*Math.pow(h,6));
    for(var k=0;k<s.particles.length;k++){
      var p=s.particles[k];
      var fx=0,fy=0;
      for(var j=0;j<p.nbrs.length;j++){
        var q=p.nbrs[j];
        var dx=p.x-q.x;
        var dy=p.y-q.y;
        var r2=dx*dx+dy*dy;
        if(r2>=h2||r2<1e-6)continue;
        var r=Math.sqrt(r2);
        /* Pressure force (spiky gradient) */
        var gradMag=spikyGradCoef*(h-r)*(h-r);
        var avgPres=(p.pres+q.pres)/(2*q.dens+1e-6);
        fx-=avgPres*gradMag*dx/r;
        fy-=avgPres*gradMag*dy/r;
        /* Viscosity */
        var viscMag=viscLapCoef*(h-r);
        fx+=s.viscosity*(q.vx-p.vx)/q.dens*viscMag;
        fy+=s.viscosity*(q.vy-p.vy)/q.dens*viscMag;
      }
      p.fx=fx;
      p.fy=fy+s.gravity;
    }
    /* Integrate */
    var dt=0.5;
    for(var k=0;k<s.particles.length;k++){
      var p=s.particles[k];
      p.vx+=p.fx*dt;
      p.vy+=p.fy*dt;
      p.vx*=s.damping;
      p.vy*=s.damping;
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      /* Bounds */
      var pad=8;
      if(p.x<pad){p.x=pad;p.vx*=-0.5}
      if(p.x>s.boundsW-pad){p.x=s.boundsW-pad;p.vx*=-0.5}
      if(p.y<pad){p.y=pad;p.vy*=-0.5}
      if(p.y>s.boundsH-pad){p.y=s.boundsH-pad;p.vy*=-0.5}
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    if(!STATE.playing)return;
    var s=STATE.sph;
    s.boundsW=CANV.W;s.boundsH=CANV.H;
    /* Multiple substeps for stability */
    for(var k=0;k<2;k++)this.step();
  },
  stepOnce:function(){this.step()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#01060e';
    ctx.fillRect(0,0,W,H);
    var s=STATE.sph;
    if(!s.particles.length)return;
    /* Draw particles */
    for(var k=0;k<s.particles.length;k++){
      var p=s.particles[k];
      /* Color by density: low = cyan, high = white */
      var t=clamp(p.dens/(s.restDens*1.5),0,1);
      var r=Math.round(60+t*195);
      var g=Math.round(180+t*75);
      var b=255;
      ctx.fillStyle='rgba('+r+','+g+','+b+',0.9)';
      ctx.beginPath();
      ctx.arc(p.x,p.y,3.5,0,Math.PI*2);
      ctx.fill();
    }
    /* Info */
    ctx.fillStyle='rgba(4,16,28,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('SPH FLUID',32,42);
    ctx.fillStyle='#d0e8ff';
    ctx.font='10px monospace';
    ctx.fillText('Particles: '+s.particles.length,32,62);
    ctx.fillText('Smoothing h: '+s.h,32,78);
    ctx.fillText('Stiffness: '+fmt(s.stiffness,3),32,94);
    ctx.fillText('Viscosity: '+fmt(s.viscosity,3),32,110);
    setStatsHTML(
      '<div>Particles: '+s.particles.length+'</div>'+
      '<div>h: '+s.h+'</div>'+
      '<div>Hash: '+s.hashCols+'×'+s.hashRows+'</div>'+
      '<div>k: '+fmt(s.stiffness,3)+'</div>'
    );
    updateBadge('💧 SPH · '+s.particles.length+' particles · h='+s.h);
    $('sbMode').textContent='SPH';
  },
  onDown:function(p){
    /* Spawn particles at click */
    var s=STATE.sph;
    for(var k=0;k<15;k++){
      var a=Math.random()*Math.PI*2;
      var r=Math.random()*20;
      s.particles.push({
        x:p.x+Math.cos(a)*r,
        y:p.y+Math.sin(a)*r,
        vx:rndF(-1,1),
        vy:rndF(-1,1),
        dens:0,pres:0
      });
    }
  },
  onMove:function(p){
    if(!INPUT.down)return;
    if(Math.random()<0.3){
      STATE.sph.particles.push({
        x:p.x+rndF(-8,8),
        y:p.y+rndF(-8,8),
        vx:rndF(-0.5,0.5),
        vy:rndF(-0.5,0.5),
        dens:0,pres:0
      });
    }
  },
  controls:function(){
    var s=STATE.sph;
    var html='';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Particles</span><span>'+s.N+'</span></div>';
    html+='<input type="range" min="100" max="800" step="50" value="'+s.N+'" oninput="STATE.sph.N=parseInt(this.value);MODULES.sph.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Smoothing radius h</span><span>'+s.h+'</span></div>';
    html+='<input type="range" min="10" max="30" step="1" value="'+s.h+'" oninput="STATE.sph.h=parseInt(this.value);MODULES.sph.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Stiffness</span><span>'+fmt(s.stiffness,3)+'</span></div>';
    html+='<input type="range" min="0.005" max="0.15" step="0.005" value="'+s.stiffness+'" oninput="STATE.sph.stiffness=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Viscosity</span><span>'+fmt(s.viscosity,3)+'</span></div>';
    html+='<input type="range" min="0" max="0.3" step="0.005" value="'+s.viscosity+'" oninput="STATE.sph.viscosity=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Gravity</span><span>'+fmt(s.gravity,3)+'</span></div>';
    html+='<input type="range" min="0" max="0.5" step="0.01" value="'+s.gravity+'" oninput="STATE.sph.gravity=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.sph.init()">↺ Reset fluid</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.sph.particles.forEach(function(p){p.vy-=5});toast(\'Splash!\',\'success\')">💧 Splash up</button>';
    html+='</div>';

    '</div></div>';

  },

/* ================================================================
   MODULE 5: BURGERS EQUATION
   ================================================================ */
registerModule('burgers',{
  title:'Burgers Equation',
  icon:'⚡',
  desc:'1D Burgers equation: ∂u/∂t + u·∂u/∂x = ν·∂²u/∂x². Nonlinear advection steepens into shocks; viscosity smooths them.',
  init:function(){
    var b=STATE.burgers;
    var N=b.N;
    b.u=new Float32Array(N);
    b.time=0;
    b.row=0;
    b.historyRows=150;
    b.history=[];
    for(var r=0;r<b.historyRows;r++)b.history.push(new Float32Array(N));
    /* Initialize based on mode */
    if(b.initMode==='sine'){
      for(var i=0;i<N;i++)b.u[i]=Math.sin(2*Math.PI*i/N);
    } else if(b.initMode==='step'){
      for(var i=0;i<N;i++)b.u[i]=i<N/2?1:-1;
    } else if(b.initMode==='gauss'){
      var sig=N*0.05;
      for(var i=0;i<N;i++){
        var x=i-N/2;
        b.u[i]=Math.exp(-x*x/(2*sig*sig));
      }
    } else if(b.initMode==='shock'){
      for(var i=0;i<N;i++){
        var x=i/N;
        b.u[i]=Math.tanh((x-0.5)*20);
      }
    }
    logMsg('Burgers: ν='+b.nu+', init='+b.initMode,'success');
  },
  step:function(){
    var b=STATE.burgers;
    var N=b.N;
    var nu=b.nu;
    var u=b.u;
    /* Explicit upwind + central diffusion */
    var un=new Float32Array(N);
    var dx=1.0/N;
    var dt=b.dt;
    var cflMax=0;
    for(var i=0;i<N;i++){
      var im=(i-1+N)%N;
      var ip=(i+1)%N;
      /* Advection: upwind scheme */
      var adv;
      if(u[i]>0)adv=-u[i]*(u[i]-u[im])/dx;
      else adv=-u[i]*(u[ip]-u[i])/dx;
      /* Diffusion: central difference */
      var diff=nu*(u[ip]-2*u[i]+u[im])/(dx*dx);
      un[i]=u[i]+dt*(adv+diff);
      cflMax=Math.max(cflMax,Math.abs(u[i])*dt/dx);
    }
    b.u=un;
    b.time+=dt;
    b._cfl=cflMax;
    /* Record history row for heatmap */
    var row=b.row%b.historyRows;
    for(var i=0;i<N;i++)b.history[row][i]=b.u[i];
    b.row++;
  },
  tick:function(dt){
    STATE.time+=dt;
    var b=STATE.burgers;
    if(!STATE.playing)return;
    /* Multiple steps per frame */
    var steps=8;
    for(var k=0;k<steps;k++){
      if(b.time<b.maxTime)this.step();
    }
    /* Auto reset when time reaches max */
    if(b.time>=b.maxTime){
      b.time=0;b.row=0;
      this.init();
    }
    /* Compute energy (L2 norm) */
    var e=0;
    for(var i=0;i<b.u.length;i++)e+=b.u[i]*b.u[i];
    b.energy=e/b.N;
  },
  stepOnce:function(){this.step()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#01060e';
    ctx.fillRect(0,0,W,H);
    var b=STATE.burgers;
    if(!b.history)return;
    var N=b.N;
    var rows=b.historyRows;
    /* Heatmap: x = space, y = time (newest at top) */
    var pad=60;
    var mapX=pad;
    var mapY=pad+20;
    var mapW=W-2*pad;
    var mapH=H-2*pad-40;
    /* Draw each row of history as a horizontal strip */
    var cellH=mapH/rows;
    var cellW=mapW/N;
    var pal=plasmaRGB;
    for(var r=0;r<rows;r++){
      /* Newest at bottom */
      var histRow=(b.row-1-r+rows*100)%rows;
      var data=b.history[histRow];
      var y=mapY+(rows-1-r)*cellH;
      for(var i=0;i<N;i++){
        var v=clamp((data[i]+1.5)/3,0,1);
        var c=pal(v);
        ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
        ctx.fillRect(mapX+i*cellW,y,cellW+0.6,cellH+0.6);
      }
    }
    /* Border */
    ctx.strokeStyle='rgba(64,208,255,.5)';
    ctx.lineWidth=1.5;
    ctx.strokeRect(mapX,mapY,mapW,mapH);
    /* Axes labels */
    ctx.fillStyle='#4a7090';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    for(var i=0;i<=4;i++){
      var x=mapX+i/4*mapW;
      ctx.fillText(fmt(i/4,2),x,mapY+mapH+16);
    }
    ctx.fillText('space x ∈ [0,1]',mapX+mapW/2,mapY+mapH+32);
    ctx.save();
    ctx.translate(mapX-30,mapY+mapH/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign='center';
    ctx.fillText('time t →',0,0);
    ctx.restore();
    /* Time labels */
    ctx.textAlign='right';
    ctx.fillText('t='+fmt(b.maxTime,2),mapX-8,mapY+8);
    ctx.fillText('t=0',mapX-8,mapY+mapH-8);
    /* Title */
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('BURGERS EQUATION · space-time diagram',mapX,pad);
    /* Info panel */
    ctx.fillStyle='rgba(4,16,28,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,140,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('BURGERS PDE',W-248,42);
    ctx.fillStyle='#d0e8ff';
    ctx.font='10px monospace';
    ctx.fillText('Grid: N='+N,W-248,62);
    ctx.fillText('ν (viscosity): '+fmt(b.nu,5),W-248,78);
    ctx.fillText('dt: '+fmt(b.dt,5),W-248,94);
    ctx.fillText('Time: '+fmt(b.time,3)+' / '+fmt(b.maxTime,2),W-248,110);
    ctx.fillText('CFL: '+fmt(b._cfl||0,3),W-248,126);
    ctx.fillText('Init: '+b.initMode,W-248,142);
    /* Legend */
    ctx.fillStyle='rgba(4,16,28,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,H-50,440,36,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='11px monospace';
    ctx.fillText('Watch nonlinearity steepen the wave → shock formation',32,H-28);
    setStatsHTML(
      '<div>N: '+N+'</div>'+
      '<div>ν: '+fmt(b.nu,4)+'</div>'+
      '<div>t: '+fmt(b.time,2)+'</div>'+
      '<div>E: '+fmt(b.energy,4)+'</div>'+
      '<div>CFL: '+fmt(b._cfl||0,2)+'</div>'
    );
    updateBadge('⚡ Burgers · N='+N+' · ν='+fmt(b.nu,4)+' · t='+fmt(b.time,2));
    $('sbMode').textContent='Burgers';
    $('sbGrid').textContent=N;
    $('sbCfl').textContent=fmt(b._cfl||0,2);
    $('sbEnergy').textContent=fmt(b.energy,3);
  },
  onDown:function(p){},
  controls:function(){
    var b=STATE.burgers;
    var html='';
    html+='<div class="sec"><h4>Initial condition</h4><div class="chip-row">';
    [['sine','Sine'],['step','Step'],['gauss','Gaussian'],['shock','tanh shock']].forEach(function(p){
      html+='<div class="chip '+(b.initMode===p[0]?'active':'')+'" onclick="STATE.burgers.initMode=\''+p[0]+'\';MODULES.burgers.init();renderLeftPanel()">'+p[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Viscosity ν</span><span>'+fmt(b.nu,5)+'</span></div>';
    html+='<input type="range" min="0.0001" max="0.05" step="0.0001" value="'+b.nu+'" oninput="STATE.burgers.nu=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Grid N</span><span>'+b.N+'</span></div>';
    html+='<input type="range" min="100" max="500" step="20" value="'+b.N+'" oninput="STATE.burgers.N=parseInt(this.value);MODULES.burgers.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Max time</span><span>'+fmt(b.maxTime,2)+'</span></div>';
    html+='<input type="range" min="0.3" max="5" step="0.1" value="'+b.maxTime+'" oninput="STATE.burgers.maxTime=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>dt</span><span>'+fmt(b.dt,5)+'</span></div>';
    html+='<input type="range" min="0.0001" max="0.005" step="0.0001" value="'+b.dt+'" oninput="STATE.burgers.dt=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.burgers.init()">↺ Restart</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Try it</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '• ν = 0.001, sine init → wave steepens into a shock<br>'+
      '• ν = 0.05 → viscosity smooths it out<br>'+
      '• Step init → single propagating front<br>'+
      '• Watch the space-time heatmap: shock = sharp color transition'
    '</div></div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.burgers;
    return '<div class="sec"><h4>Burgers equation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '∂u/∂t + u·∂u/∂x = ν·∂²u/∂x²<br><br>'+
      'Nonlinear advection + linear diffusion'+
      '</div></div>'+
      '<div class="sec"><h4>Shock formation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'The nonlinear term u·∂u/∂x makes larger u move faster. When the wave profile has ∂u/∂x < 0, later parts catch up to earlier parts — the gradient steepens until a shock forms.<br><br>'+
      'Viscosity ν smears the shock over width ~ ν/u.'+
      '</div></div>'+
      '<div class="sec"><h4>Inviscid limit (ν → 0)</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Pure Burgers without viscosity develops discontinuities in finite time. This is the 1D analog of shock waves in gas dynamics.<br><br>'+
      'Analytic solution: Cole-Hopf transformation.'+
      '</div></div>'+
      '<div class="sec"><h4>Numerical scheme</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Upwind for advection, central for diffusion.<br><br>'+
      'CFL condition: |u|·dt/dx ≤ 1<br>'+
      'Current: '+fmt(b._cfl||0,3)+'  '+((b._cfl||0)<1?'✓ stable':'✗ unstable!')+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">N</span><span class="v">'+b.N+'</span></div>'+
      '<div class="row"><span class="k">ν</span><span class="v">'+fmt(b.nu,5)+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(b.time,3)+'</span></div>'+
      '<div class="row"><span class="k">Energy</span><span class="v">'+fmt(b.energy,4)+'</span></div>'+
      '</div></div>';
  }
});
