registerModule('hopfield',{
  title:'Hopfield Network',
  icon:'💭',
  desc:'Associative memory network. Store multiple patterns and recall them from noisy partial inputs.',
  init:function(){
    var h=STATE.hopfield;
    var N=h.N;
    /* Create patterns */
    h.patterns=[];
    /* Pattern 0: the letter H */
    var p0=new Float32Array(N*N);
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      if(x>=2&&x<=3&&y>=2&&y<N-2)p0[y*N+x]=1;
      if(x>=N-4&&x<=N-3&&y>=2&&y<N-2)p0[y*N+x]=1;
      if(y>=N/2-1&&y<=N/2+1&&x>=2&&x<N-2)p0[y*N+x]=1;
    }
    h.patterns.push(p0);
    /* Pattern 1: the letter X */
    var p1=new Float32Array(N*N);
    for(var y2=0;y2<N;y2++)for(var x2=0;x2<N;x2++){
      if(Math.abs(x2-y2)<3&&y2>=2&&y2<N-2)p1[y2*N+x2]=1;
      if(Math.abs(x2-(N-1-y2))<3&&y2>=2&&y2<N-2)p1[y2*N+x2]=1;
    }
    h.patterns.push(p1);
    /* Pattern 2: the letter O */
    var p2=new Float32Array(N*N);
    for(var y3=0;y3<N;y3++)for(var x3=0;x3<N;x3++){
      var d=Math.hypot(x3-N/2,y3-N/2);
      if(d>N/3&&d<N/2.5&&x3>2&&x3<N-2&&y3>2&&y3<N-2)p2[y3*N+x3]=1;
    }
    h.patterns.push(p2);
    /* Convert to ±1 and pad to full N*N */
    h.patterns=h.patterns.map(function(p){
      var out=new Float32Array(N*N);
      for(var i=0;i<N*N;i++)out[i]=p[i]?1:-1;
      return out;
    });
    /* Train network */
    h.weights=hopfieldTrain(N*N,h.patterns);
    /* Initialize state from pattern 0 with noise */
    h.state=h.patterns[0].slice();
    h.noiseAmount=h.noise||0.3;
    for(var i2=0;i2<N*N;i2++){
      if(Math.random()<h.noiseAmount)h.state[i2]*=-1;
    }
    h.iterations=0;
    h.history=[];
  },
  corrupt:function(){
    var h=STATE.hopfield;
    h.state=h.patterns[h.currentPattern].slice();
    for(var i=0;i<h.N*h.N;i++){
      if(Math.random()<h.noise)h.state[i]*=-1;
    }
    h.iterations=0;
    h.history=[];
  },
  tick:function(dt){
    var h=STATE.hopfield;
    if(!STATE.playing)return;
    /* Run several update steps */
    for(var s=0;s<3;s++){
      h.state=hopfieldStep(h.weights,h.state);
      h.iterations++;
    }
    /* Compute energy */
    var energy=0;
    var N=h.N*h.N;
    for(var i=0;i<N;i++){
      for(var j=i+1;j<N;j++){
        energy-=h.weights[i][j]*h.state[i]*h.state[j];
      }
    }
    h.history.push(energy);
    if(h.history.length>200)h.history.shift();
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var h=STATE.hopfield;
    var N=h.N;
    /* Display patterns and current state */
    var size=Math.min((W-60)/2,(H-200)/2);
    var ox1=20,oy1=60;
    /* Stored patterns */
    for(var p=0;p<h.patterns.length;p++){
      var px=ox1+p*(size+10);
      var py=oy1;
      var data=h.patterns[p];
      var cw=size/N;
      var ch=size/N;
      for(var y=0;y<N;y++){
        for(var x=0;x<N;x++){
          var v=data[y*N+x];
          ctx.fillStyle=v>0?'#e060ff':'#100520';
          ctx.fillRect(px+x*cw,py+y*ch,cw+0.5,ch+0.5);
        }
      }
      ctx.strokeStyle='#e060ff';
      ctx.lineWidth=1.5;
      ctx.strokeRect(px,py,size,size);
      ctx.fillStyle='#e0e0ff';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText('Pattern '+(p+1),px+size/2,py-8);
    }
    /* Current state (large) */
    var stateSize=Math.min(W-100,H*0.4);
    var sx=(W-stateSize)/2;
    var sy=oy1+size+40;
    var cw2=stateSize/N;
    var ch2=stateSize/N;
    for(var y2=0;y2<N;y2++){
      for(var x2=0;x2<N;x2++){
        var v2=h.state[y2*N+x2];
        ctx.fillStyle=v2>0?'#40d0ff':'#100520';
        ctx.fillRect(sx+x2*cw2,sy+y2*ch2,cw2+0.5,ch2+0.5);
      }
    }
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.strokeRect(sx,sy,stateSize,stateSize);
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillText('Current state (iterations: '+h.iterations+')',sx+stateSize/2,sy-8);
    /* Overlap with each pattern */
    var overlaps=[];
    for(var p2=0;p2<h.patterns.length;p2++){
      var ov=0;
      for(var i=0;i<N*N;i++)ov+=h.state[i]*h.patterns[p2][i];
      overlaps.push(ov/(N*N));
    }
    /* Info */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(W-300,20,280,140,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('HOPFIELD NETWORK',W-288,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('Neurons: '+(N*N),W-288,64);
    ctx.fillText('Patterns: '+h.patterns.length,W-288,80);
    ctx.fillText('Iterations: '+h.iterations,W-288,96);
    ctx.fillText('Noise: '+fmt(h.noise,2),W-288,112);
    /* Overlap bars */
    for(var p3=0;p3<overlaps.length;p3++){
      ctx.fillStyle='rgba(64,208,255,.2)';
      ctx.fillRect(W-288,120+p3*15,180,10);
      ctx.fillStyle='#40d0ff';
      ctx.fillRect(W-288,120+p3*15,180*Math.max(0,overlaps[p3]),10);
      ctx.fillStyle='#e0e0ff';
      ctx.font='9px monospace';
      ctx.textAlign='right';
      ctx.fillText('P'+(p3+1)+': '+fmt(overlaps[p3],3),W-100,130+p3*15);
      ctx.textAlign='left';
    }
    setStatsHTML(
      '<div>Neurons: '+(N*N)+'</div>'+
      '<div>Patterns: '+h.patterns.length+'</div>'+
      '<div>Iters: '+h.iterations+'</div>'+
      '<div>Best overlap: '+fmt(Math.max.apply(null,overlaps),3)+'</div>'
    );
    updateBadge('💭 Hopfield · '+h.patterns.length+' memories · iter '+h.iterations);
    $('sbMode').textContent='Hopfield';
  },
  onDown:function(){},
  controls:function(){
    var h=STATE.hopfield;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.hopfield.corrupt();renderLeftPanel()">🎲 Corrupt from pattern</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.hopfield.init();renderLeftPanel()">↺ Reset</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Recall from</h4>';
    for(var p=0;p<h.patterns.length;p++){
      html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.hopfield.currentPattern='+p+';MODULES.hopfield.corrupt();renderLeftPanel()">Pattern '+(p+1)+'</button>';
    }
    html+='</div>';
    html+='<div class="sec"><h4>Noise level</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Corruption</span><span>'+fmt(h.noise,2)+'</span></div>';
    html+='<input type="range" min="0" max="0.6" step="0.02" value="'+h.noise+'" oninput="STATE.hopfield.noise=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Network size</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Grid</span><span>'+h.N+'×'+h.N+'</span></div>';
    html+='<input type="range" min="20" max="40" step="2" value="'+h.N+'" oninput="STATE.hopfield.N=parseInt(this.value);MODULES.hopfield.init();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var h=STATE.hopfield;
    return '<div class="sec"><h4>Hopfield network</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Recurrent network with symmetric weights (w_ij = w_ji) and no self-connections.<br><br>'+
      'Dynamics: s_i(t+1) = sign(Σ_j w_ij·s_j(t))<br><br>'+
      'Energy function:<br>'+
      'E = −½·Σ_ij w_ij·s_i·s_j<br><br>'+
      'Network converges to local minima of E — these are the stored patterns.'+
      '</div></div>'+
      '<div class="sec"><h4>Hebbian learning</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'w_ij = (1/N)·Σ_p ξ_i^p·ξ_j^p<br><br>'+
      'Each pattern ξ^p contributes to the weight matrix. Cells that are active together get strong connections — the classic "fire together, wire together" rule.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Neurons</span><span class="v">'+(h.N*h.N)+'</span></div>'+
      '<div class="row"><span class="k">Patterns</span><span class="v">'+h.patterns.length+'</span></div>'+
      '<div class="row"><span class="k">Capacity</span><span class="v">~'+Math.floor(h.N*h.N*0.14)+' patterns</span></div>'+
      '<div class="row"><span class="k">Iterations</span><span class="v">'+h.iterations+'</span></div>'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 10: SLEEP CYCLES
   ================================================================ */
registerModule('sleep',{
  title:'Sleep Cycles',
  icon:'😴',
  desc:'Circadian rhythm and sleep stages across 24 hours. Shows cycles, hormones, and EEG patterns.',
  init:function(){
    var s=STATE.sleep;
    s.time=0;
    s.hours=24;
    s.stageHistory=[];
    s.adenosine=0;
    s.melatonin=0;
    s.cortisol=1;
  },
  tick:function(dt){
    var s=STATE.sleep;
    if(!STATE.playing)return;
    s.time+=dt*s.speed||0.5;
    if(s.time>24)s.time=0;
    /* Update circadian hormones */
    var hour=s.time;
    /* Melatonin peaks at 3am */
    s.melatonin=Math.max(0,Math.sin((hour-21)/24*Math.PI*2)+0.5);
    /* Cortisol peaks at 8am */
    s.cortisol=1+0.5*Math.cos((hour-8)/24*Math.PI*2);
    /* Adenosine builds up while awake */
    if(hour>=7&&hour<23){
      s.adenosine+=dt*0.005;
    } else {
      s.adenosine-=dt*0.01;
    }
    s.adenosine=clamp(s.adenosine,0,1);
    /* Determine sleep stage */
    var stage=0;
    if(hour>=23||hour<7){
      /* Asleep: cycle every 90 min */
      var sleepStart=23;
      var minutesInSleep=((hour-sleepStart+24)%24)*60;
      var cyclePos=(minutesInSleep%s.cycleLength)/s.cycleLength;
      if(cyclePos<0.1)stage=1; /* N1 */
      else if(cyclePos<0.4)stage=2; /* N2 */
      else if(cyclePos<0.7)stage=3; /* N3 deep */
      else if(cyclePos<0.95)stage=2; /* back to N2 */
      else stage=4; /* REM */
    } else {
      stage=0; /* Awake */
    }
    if(stage!==s.currentStage){
      s.stageHistory.push({time:hour,stage:stage});
      if(s.stageHistory.length>200)s.stageHistory.shift();
    }
    s.currentStage=stage;
    s.stage=s.stages[stage];
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var s=STATE.sleep;
    /* 24-hour clock */
    var cx=W*0.3,cy=H*0.4;
    var R=Math.min(W*0.25,H*0.3);
    /* Clock face */
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    /* Hour marks */
    for(var h=0;h<24;h++){
      var a=(h/24)*Math.PI*2-Math.PI/2;
      var r1=h%6===0?R-15:R-8;
      var r2=R;
      ctx.strokeStyle=h===Math.floor(s.time)?'#ffe040':'rgba(224,96,255,.3)';
      ctx.lineWidth=h%6===0?2:1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
      ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
      ctx.stroke();
      if(h%6===0){
        ctx.fillStyle='#e0e0ff';
        ctx.font='10px monospace';
        ctx.textAlign='center';
        ctx.fillText(h.toString(),cx+Math.cos(a)*(R-25),cy+Math.sin(a)*(R-25)+4);
      }
    }
    /* Day/night shading */
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,-Math.PI/2+Math.PI*7/12,-Math.PI/2+Math.PI*23/12);
    ctx.closePath();
    ctx.fillStyle='rgba(20,10,50,.5)';
    ctx.fill();
    /* Hand */
    var a2=(s.time/24)*Math.PI*2-Math.PI/2;
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a2)*(R-20),cy+Math.sin(a2)*(R-20));
    ctx.stroke();
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();
    /* Time label */
    ctx.fillStyle='#e060ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(Math.floor(s.time).toString().padStart(2,'0')+':'+Math.floor((s.time%1)*60).toString().padStart(2,'0'),cx,cy+R+25);
    /* Stage display */
    var stageNames=['Awake','N1 (light)','N2 (medium)','N3 (deep)','REM (dreaming)'];
    var stageColors=['#ffe040','#40d0ff','#40ff90','#e060ff','#ff5080'];
    var sx=W*0.65;
    var sy=H*0.15;
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(sx,sy,W*0.32,180,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('CURRENT STAGE',sx+12,sy+22);
    ctx.font='bold 20px monospace';
    ctx.fillStyle=stageColors[s.currentStage];
    ctx.fillText(stageNames[s.currentStage],sx+12,sy+50);
    /* Stage progression bars */
    for(var st=0;st<5;st++){
      var barY=sy+70+st*20;
      ctx.fillStyle='rgba(64,32,96,.4)';
      ctx.fillRect(sx+12,barY,200,14);
      ctx.fillStyle=stageColors[st];
      var width=st===s.currentStage?200*0.9:30;
      ctx.fillRect(sx+12,barY,width,14);
      ctx.fillStyle='#e0e0ff';
      ctx.font='10px monospace';
      ctx.fillText(stageNames[st],sx+220,barY+11);
    }
    /* Hormones graph */
    var gx=20,gy=H*0.7;
    var gw=W-40,gh=H*0.25;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(224,96,255,.3)';
    ctx.beginPath();ctx.roundRect(gx,gy,gw,gh,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 11px monospace';
    ctx.fillText('HORMONES & ADENOSINE',gx+8,gy+16);
    /* Draw hormone curves */
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2;
    ctx.beginPath();
    for(var x=0;x<gw-20;x++){
      var hour=(x/(gw-20))*24;
      var cort=1+0.5*Math.cos((hour-8)/24*Math.PI*2);
      var py=gy+gh-20-cort*40;
      if(x===0)ctx.moveTo(gx+10+x,py);else ctx.lineTo(gx+10+x,py);
    }
    ctx.stroke();
    ctx.strokeStyle='#40ff90';
    ctx.beginPath();
    for(var x2=0;x2<gw-20;x2++){
      var hour2=(x2/(gw-20))*24;
      var mel=Math.max(0,Math.sin((hour2-21)/24*Math.PI*2)+0.5);
      var py2=gy+gh-20-mel*40;
      if(x2===0)ctx.moveTo(gx+10+x2,py2);else ctx.lineTo(gx+10+x2,py2);
    }
    ctx.stroke();
    ctx.strokeStyle='#ff5080';
    ctx.beginPath();
    for(var x3=0;x3<gw-20;x3++){
      var hour3=(x3/(gw-20))*24;
      var ad=hour3>=7&&hour3<23?1:0;
      var py3=gy+gh-20-ad*40;
      if(x3===0)ctx.moveTo(gx+10+x3,py3);else ctx.lineTo(gx+10+x3,py3);
    }
    ctx.stroke();
    /* Current position */
    var px=gx+10+(s.time/24)*(gw-20);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px,gy);ctx.lineTo(px,gy+gh);ctx.stroke();
    setStatsHTML(
      '<div>Time: '+Math.floor(s.time)+'h</div>'+
      '<div>Stage: '+s.stage+'</div>'+
      '<div>Adenosine: '+fmt(s.adenosine,2)+'</div>'+
      '<div>Melatonin: '+fmt(s.melatonin,2)+'</div>'
    );
    updateBadge('😴 Sleep · '+s.stage+' at '+Math.floor(s.time)+'h');
    $('sbMode').textContent='Sleep Cycles';
    $('sbTime').textContent=Math.floor(s.time)+'h';
  },
  onDown:function(p){
    var s=STATE.sleep;
    var W=CANV.W,H=CANV.H;
    var cx=W*0.3,cy=H*0.4;
    var R=Math.min(W*0.25,H*0.3);
    /* Click on clock to set time */
    var a=Math.atan2(p.y-cy,p.x-cx);
    var hour=((a+Math.PI/2)/(Math.PI*2))*24;
    if(hour<0)hour+=24;
    if(Math.hypot(p.x-cx,p.y-cy)<R+20){
      s.time=hour;
    }
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  controls:function(){
    var s=STATE.sleep;
    var html='';
    html+='<div class="sec"><h4>Time</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Hour of day</span><span>'+fmt(s.time,1)+'</span></div>';
    html+='<input type="range" min="0" max="24" step="0.1" value="'+s.time+'" oninput="STATE.sleep.time=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="STATE.sleep.time=23;renderLeftPanel()">🛏 Start sleep (23:00)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.sleep.time=7;renderLeftPanel()">☀ Wake up (07:00)</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Cycle length (min)</span><span>'+s.cycleLength+'</span></div>';
    html+='<input type="range" min="60" max="120" step="5" value="'+s.cycleLength+'" oninput="STATE.sleep.cycleLength=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Current state</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Stage</span><span class="v">'+s.stage+'</span></div>';
    html+='<div class="row"><span class="k">Adenosine</span><span class="v">'+fmt(s.adenosine,3)+'</span></div>';
    html+='<div class="row"><span class="k">Melatonin</span><span class="v">'+fmt(s.melatonin,3)+'</span></div>';
    html+='<div class="row"><span class="k">Cortisol</span><span class="v">'+fmt(s.cortisol,3)+'</span></div>';
    html+='</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Sleep stages</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">N1 (5%):</b> Light transition, theta waves<br>'+
      '<b class="text-c1">N2 (45%):</b> Sleep spindles, K-complexes<br>'+
      '<b class="text-c1">N3 (25%):</b> Slow-wave sleep, delta waves, memory consolidation<br>'+
      '<b class="text-c1">REM (25%):</b> Dreaming, muscle paralysis, high brain activity'+
      '</div></div>'+
      '<div class="sec"><h4>Circadian rhythm</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'The suprachiasmatic nucleus (SCN) in the hypothalamus generates an internal ~24-hour clock.<br><br>'+
      'Melatonin peaks at 3 AM, suppresses wakefulness.<br>'+
      'Cortisol peaks at 8 AM, promotes alertness.<br>'+
      'Adenosine builds up while awake and clears during sleep.'+
      '</div></div>'+
      '<div class="sec"><h4>Sleep cycles</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Each cycle lasts ~90 minutes and progresses N1→N2→N3→N2→REM. Early cycles have more N3; later cycles have more REM. A typical night has 4-6 cycles.'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 11: NEUROTRANSMITTERS
   ================================================================ */
registerModule('nt',{
  title:'Neurotransmitters',
  icon:'💊',
  desc:'Interactive brain with 7 neurotransmitter systems. Click on regions to see receptor distributions.',
  init:function(){
    var n=STATE.nt;
    n.t=0;
  },
  tick:function(dt){
    var n=STATE.nt;
    n.t+=dt;
    /* Slowly fluctuate levels */
    Object.keys(n.levels).forEach(function(k){
      n.levels[k]=clamp(n.levels[k]+rndF(-0.005,0.005),0,1);
    });
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var n=STATE.nt;
    /* Brain outline */
    var cx=W*0.4,cy=H*0.5;
    var bw=W*0.5,bh=H*0.6;
    /* Draw brain shape */
    ctx.beginPath();
    ctx.ellipse(cx,cy,bw*0.5,bh*0.5,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(224,96,255,.6)';
    ctx.lineWidth=3;
    ctx.stroke();
    /* Sulci */
    ctx.strokeStyle='rgba(224,96,255,.3)';
    ctx.lineWidth=1.5;
    for(var i=0;i<6;i++){
      ctx.beginPath();
      var a=(i/6)*Math.PI*2;
      ctx.moveTo(cx+Math.cos(a)*bw*0.15,cy+Math.sin(a)*bh*0.15);
      ctx.lineTo(cx+Math.cos(a)*bw*0.45,cy+Math.sin(a)*bh*0.45);
      ctx.stroke();
    }
    /* Brain regions with neurotransmitter distributions */
    var ntInfo=NEUROTRANSMITTERS[n.selected];
    var regions=[
      {name:'Prefrontal',x:cx-bw*0.3,y:cy-bh*0.15,size:30,nts:['dopamine','norepinephrine','serotonin']},
      {name:'Striatum',x:cx-bw*0.1,y:cy-bh*0.05,size:28,nts:['dopamine','gaba']},
      {name:'VTA',x:cx-bw*0.05,y:cy+bh*0.1,size:15,nts:['dopamine']},
      {name:'Raphe',x:cx-bw*0.05,y:cy+bh*0.25,size:12,nts:['serotonin']},
      {name:'Locus Coeruleus',x:cx-bw*0.15,y:cy+bh*0.2,size:10,nts:['norepinephrine']},
      {name:'Amygdala',x:cx-bw*0.2,y:cy+bh*0.15,size:18,nts:['gaba','glutamate','norepinephrine']},
      {name:'Hippocampus',x:cx-bw*0.05,y:cy+bh*0.15,size:22,nts:['acetylcholine','glutamate']},
      {name:'Basal Forebrain',x:cx-bw*0.35,y:cy-bh*0.3,size:16,nts:['acetylcholine']},
      {name:'Hypothalamus',x:cx-bw*0.1,y:cy+bh*0.05,size:14,nts:['endorphins']}
    ];
    regions.forEach(function(region){
      var hasNT=region.nts.indexOf(n.selected)>=0;
      var strength=hasNT?n.levels[n.selected]:0.15;
      var color=hasNT?ntInfo.color:'rgba(80,60,120,.5)';
      /* Region circle */
      ctx.beginPath();
      ctx.arc(region.x,region.y,region.size*(0.5+strength*0.8),0,Math.PI*2);
      ctx.fillStyle=hasNT?color+'30':'rgba(40,20,60,.3)';
      ctx.fill();
      ctx.strokeStyle=hasNT?color:'rgba(80,60,120,.5)';
      ctx.lineWidth=hasNT?2.5:1;
      ctx.stroke();
      /* Label */
      ctx.fillStyle=hasNT?'#e0e0ff':'rgba(160,140,180,.6)';
      ctx.font=(hasNT?'bold ':'')+'10px monospace';
      ctx.textAlign='center';
      ctx.fillText(region.name,region.x,region.y+region.size+15);
    });
    /* Selected NT info */
    var infoX=W*0.72;
    var infoY=20;
    ctx.fillStyle='rgba(20,10,32,.9)';
    ctx.strokeStyle=ntInfo.color;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(infoX,infoY,W*0.26,220,8);ctx.fill();ctx.stroke();
    ctx.fillStyle=ntInfo.color;
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText(ntInfo.name.toUpperCase(),infoX+12,infoY+24);
    ctx.font='11px monospace';
    ctx.fillStyle='#a0a0c0';
    ctx.fillText(ntInfo.type,infoX+12,infoY+44);
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('Function:',infoX+12,infoY+70);
    ctx.fillStyle=ntInfo.color;
    ctx.fillText(ntInfo.role,infoX+12,infoY+88);
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('Action:',infoX+12,infoY+114);
    ctx.fillStyle=ntInfo.effect==='inhibitory'?'#ff5080':(ntInfo.effect==='excitatory'?'#40ff90':'#ffe040');
    ctx.fillText(ntInfo.effect,infoX+12,infoY+132);
    /* Level meter */
    var level=n.levels[n.selected];
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('Level:',infoX+12,infoY+158);
    ctx.fillStyle='rgba(64,32,96,.5)';
    ctx.fillRect(infoX+12,infoY+170,W*0.22,20);
    ctx.fillStyle=ntInfo.color;
    ctx.fillRect(infoX+12,infoY+170,W*0.22*level,20);
    ctx.fillStyle='#e0e0ff';
    ctx.font='bold 12px monospace';
    ctx.fillText(fmt(level*100,0)+'%',infoX+12,infoY+210);
    setStatsHTML(
      '<div>NT: '+ntInfo.name+'</div>'+
      '<div>Level: '+fmt(level*100,0)+'%</div>'+

registerModule('pharm',{
  title:'Pharmacology',
  icon:'💉',
  desc:'Drug-receptor binding kinetics. Real absorption, distribution, elimination model.',
  init:function(){
    var p=STATE.pharm;
    p.t=0;
    p.bloodLevel=0;
    p.receptorOccupancy=0;
    p.doseHistory=[{time:0,amount:p.dose}];
    p.effect=0;
  },
  tick:function(dt){
    var p=STATE.pharm;
    if(!STATE.playing)return;
    var simDt=0.1;
    var steps=Math.min(20,Math.round(dt*100));
    for(var s=0;s<steps;s++){
      p.t+=simDt;
      /* Absorption: from GI to blood */
      var absorbed=0;
      if(p.doseHistory.length>0&&p.t-p.doseHistory[p.doseHistory.length-1].time<5){
        absorbed=p.dose*p.absorptionRate*0.02;
      }
      /* Elimination */
      var eliminated=p.bloodLevel*p.eliminationRate*0.01;
      /* One-compartment model */
      p.bloodLevel+=(absorbed-eliminated)*simDt;
      p.bloodLevel=clamp(p.bloodLevel,0,200);
      /* Receptor occupancy from Hill equation */
      var receptorHill=p.bloodLevel/(p.bloodLevel+p.kd);
      p.receptorOccupancy=receptorHill;
      /* Effect lags occupancy */
      p.effect+=(receptorHill-p.effect)*0.05;
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var p=STATE.pharm;
    var drug=DRUGS[p.drug];
    /* Concentration-time curve */
    var pad=60;
    var plotW=W-pad*2;
    var plotH=H*0.4;
    var plotX=pad,plotY=80;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(224,96,255,.3)';
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(224,96,255,.08)';
    for(var i=0;i<=10;i++){
      var gy=plotY+i*plotH/10;
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    /* Simulate future curve */
    var curve=[];
    var simState={bloodLevel:p.bloodLevel,t:p.t};
    var futureT=100; /* simulate 100s ahead */
    for(var ft=0;ft<futureT;ft+=0.5){
      var absorbed=(ft<5)?p.dose*p.absorptionRate*0.02:0;
      var elim=simState.bloodLevel*p.eliminationRate*0.01;
      simState.bloodLevel+=(absorbed-elim)*0.5;
      simState.bloodLevel=clamp(simState.bloodLevel,0,200);
      curve.push({t:simState.t+ft,conc:simState.bloodLevel});
    }
    /* Draw curve */
    if(curve.length>1){
      var maxConc=Math.max(150,Math.max.apply(null,curve.map(function(c){return c.conc})));
      ctx.strokeStyle='#e060ff';
      ctx.lineWidth=2.5;
      ctx.beginPath();
      for(var c=0;c<curve.length;c++){
        var px=plotX+(curve[c].t/100)*plotW;
        var py=plotY+plotH-(curve[c].conc/maxConc)*plotH;
        if(c===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
      /* Current marker */
      var nowT=p.t;
      var nowPx=plotX+Math.min(1,nowT/100)*plotW;
      var nowPy=plotY+plotH-(p.bloodLevel/maxConc)*plotH;
      ctx.fillStyle='#ffe040';
      ctx.beginPath();ctx.arc(nowPx,nowPy,6,0,Math.PI*2);ctx.fill();
      /* Therapeutic window */
      var therLow=maxConc*0.2;
      var therHigh=maxConc*0.8;
      ctx.fillStyle='rgba(64,255,144,.1)';
      ctx.fillRect(plotX,plotY+plotH-(therHigh/maxConc)*plotH,plotW,(therHigh-therLow)/maxConc*plotH);
      ctx.strokeStyle='rgba(64,255,144,.4)';
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      ctx.moveTo(plotX,plotY+plotH-(therLow/maxConc)*plotH);
      ctx.lineTo(plotX+plotW,plotY+plotH-(therLow/maxConc)*plotH);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(plotX,plotY+plotH-(therHigh/maxConc)*plotH);
      ctx.lineTo(plotX+plotW,plotY+plotH-(therHigh/maxConc)*plotH);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(64,255,144,.6)';
      ctx.font='9px monospace';
      ctx.textAlign='left';
      ctx.fillText('Therapeutic window',plotX+8,plotY+plotH-(therHigh/maxConc)*plotH-4);
    }
    /* Receptor occupancy bar */
    var barY=plotY+plotH+40;
    var barX=plotX;
    var barW=plotW;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.beginPath();ctx.roundRect(barX,barY,barW,60,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e0e0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('Receptor occupancy',barX+8,barY+18);
    ctx.fillStyle='rgba(64,32,96,.5)';
    ctx.fillRect(barX+8,barY+24,barW-16,25);
    var occColor=p.receptorOccupancy<0.3?'#40ff90':(p.receptorOccupancy<0.7?'#ffe040':'#ff5080');
    ctx.fillStyle=occColor;
    ctx.fillRect(barX+8,barY+24,(barW-16)*p.receptorOccupancy,25);
    ctx.fillStyle='#e0e0ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='right';
    ctx.fillText(fmt(p.receptorOccupancy*100,1)+'%',barX+barW-8,barY+42);
    /* Info */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,320,50,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PHARMACOLOGY · '+drug.name,32,42);
    ctx.fillStyle='#e0e0ff';
    ctx.font='11px monospace';
    ctx.fillText('Target: '+drug.target+' | Effect: '+drug.effect,32,60);
    setStatsHTML(
      '<div>Drug: '+p.drug+'</div>'+
      '<div>Blood: '+fmt(p.bloodLevel,1)+' mg/L</div>'+
      '<div>Occupancy: '+fmt(p.receptorOccupancy*100,1)+'%</div>'+
      '<div>Effect: '+fmt(p.effect*100,1)+'%</div>'
    );
    updateBadge('💉 Pharmacology · '+p.drug+' · '+fmt(p.receptorOccupancy*100,0)+'% bound');
    $('sbMode').textContent='Pharmacology';
  },
  onDown:function(){},
  controls:function(){
    var p=STATE.pharm;
    var html='';
    html+='<div class="sec"><h4>Drug</h4>';
    html+='<div class="chip-row">';
    Object.keys(DRUGS).forEach(function(d){
      html+='<div class="chip '+(p.drug===d?'active':'')+'" onclick="STATE.pharm.drug=\''+d+'\';STATE.pharm.kd=DRUGS[\''+d+'\'].kd;MODULES.pharm.init();renderLeftPanel()">'+d+'</div>';
    });
    html+='</div></div>';
    var drug=DRUGS[p.drug];
    html+='<div class="sec"><h4>'+drug.name+'</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Target</span><span class="v">'+drug.target+'</span></div>';
    html+='<div class="row"><span class="k">Effect</span><span class="v">'+drug.effect+'</span></div>';
    html+='<div class="row"><span class="k">Kd</span><span class="v">'+drug.kd+' mg/L</span></div>';
    html+='<div class="row"><span class="k">t½</span><span class="v">'+drug.halfLife+' h</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Dose</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Amount</span><span>'+p.dose+' mg</span></div>';
    html+='<input type="range" min="10" max="200" step="5" value="'+p.dose+'" oninput="STATE.pharm.dose=parseInt(this.value);MODULES.pharm.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Pharmacokinetics</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Absorption rate</span><span>'+fmt(p.absorptionRate,2)+'</span></div>';
    html+='<input type="range" min="0.1" max="2" step="0.05" value="'+p.absorptionRate+'" oninput="STATE.pharm.absorptionRate=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Elimination rate</span><span>'+fmt(p.eliminationRate,2)+'</span></div>';
    html+='<input type="range" min="0.02" max="0.5" step="0.01" value="'+p.eliminationRate+'" oninput="STATE.pharm.eliminationRate=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.pharm.init();renderLeftPanel()">💉 Administer dose</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var p=STATE.pharm;
    return '<div class="sec"><h4>Pharmacokinetics</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'One-compartment model:<br>'+
      'dC/dt = k_a·D·e^(−k_a·t) − k_e·C<br><br>'+
      'k_a = absorption rate<br>'+
      'k_e = elimination rate<br>'+
      'C = blood concentration'+
      '</div></div>'+
      '<div class="sec"><h4>Receptor binding</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Hill equation:<br>'+
      'θ = C/(C + K_d)<br><br>'+
      'θ = fraction of receptors bound<br>'+
      'K_d = dissociation constant (lower = higher affinity)'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Blood conc.</span><span class="v">'+fmt(p.bloodLevel,2)+' mg/L</span></div>'+

    c._addEdge(6,8,0.9);
    c._addEdge(9,10,0.9);
    c._addEdge(13,16,0.9);
    c._addEdge(14,17,0.9);
    c._addEdge(19,20,0.9);
    c._addEdge(22,23,0.9);
    c._addEdge(24,25,0.9);
    c._addEdge(27,28,0.9);
    c._addEdge(4,5,0.9);
    /* Cross-system */
    c._addEdge(18,26,0.4);
    c._addEdge(18,29,0.5);
    c._addEdge(21,17,0.6);
    logMsg('Connectome: '+c.regions.length+' regions, '+c.edges.length+' connections','success');
  },
  _addEdge:function(a,b,w){
    if(a===b)return;
    for(var i=0;i<STATE.connectome.edges.length;i++){
      var e=STATE.connectome.edges[i];
      if((e.a===a&&e.b===b)||(e.a===b&&e.b===a))return;
    }
    STATE.connectome.edges.push({a:a,b:b,w:w});
  },
  tick:function(dt){
    STATE.time+=dt;
    if(STATE.connectome.rotating)STATE.connectome.angle+=dt*0.3;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var c=STATE.connectome;
    var cx=W/2,cy=H/2;
    var scale=Math.min(W,H)*0.45;
    var angle=c.angle;
    /* Compute node positions */
    c.regions.forEach(function(r){
      var a=Math.atan2(r.y,r.x)+angle;
      var radius=Math.hypot(r.x,r.y)*scale;
      r.px=cx+Math.cos(a)*radius;
      r.py=cy+Math.sin(a)*radius;
    });
    /* Draw edges */
    c.edges.forEach(function(e){
      var ra=c.regions[e.a];
      var rb=c.regions[e.b];
      ctx.strokeStyle='rgba(224,96,255,'+e.w*0.5+')';
      ctx.lineWidth=e.w*2.5;
      ctx.beginPath();
      ctx.moveTo(ra.px,ra.py);
      ctx.lineTo(rb.px,rb.py);
      ctx.stroke();
    });
    /* Draw nodes */
    c.regions.forEach(function(r,i){
      var isSelected=i===c.selected;
      /* Node size by degree */
      var degree=0;
      c.edges.forEach(function(e){
        if(e.a===i||e.b===i)degree++;
      });
      var radius=6+degree*0.8;
      if(isSelected)radius*=1.4;
      /* Glow */
      ctx.shadowBlur=isSelected?20:10;
      ctx.shadowColor=r.color;
      ctx.fillStyle=r.color;
      ctx.beginPath();
      ctx.arc(r.px,r.py,radius,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
      /* Label */
      if(c.showLabels){
        ctx.fillStyle='#e0e0ff';
        ctx.font=(isSelected?'bold ':'')+'10px monospace';
        ctx.textAlign='center';
        ctx.fillText(r.name,r.px,r.py-radius-4);
      }
    });
    /* Info panel */
    if(c.selected>=0){
      var sel=c.regions[c.selected];
      var infoX=20;
      var infoY=20;
      ctx.fillStyle='rgba(20,10,32,.9)';
      ctx.strokeStyle=sel.color;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(infoX,infoY,280,140,8);ctx.fill();ctx.stroke();
      ctx.fillStyle=sel.color;
      ctx.font='bold 14px monospace';
      ctx.textAlign='left';
      ctx.fillText(sel.name,infoX+12,infoY+24);
      ctx.font='11px monospace';
      ctx.fillStyle='#e0e0ff';
      ctx.fillText('System: '+sel.system,infoX+12,infoY+46);
      ctx.fillText('Hemisphere: '+sel.hemisphere,infoX+12,infoY+64);
      /* Connections */
      var connections=[];
      c.edges.forEach(function(e){
        if(e.a===c.selected)connections.push({to:c.regions[e.b].name,w:e.w});
        else if(e.b===c.selected)connections.push({to:c.regions[e.a].name,w:e.w});
      });
      ctx.fillText('Connections: '+connections.length,infoX+12,infoY+82);
      connections.slice(0,4).forEach(function(conn,i){
        ctx.fillStyle='rgba(224,96,255,'+conn.w+')';
        ctx.fillText('→ '+conn.to+' ('+fmt(conn.w,2)+')',infoX+12,infoY+100+i*14);
      });
    }
    /* Legend */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(W-260,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('CONNECTOME',W-248,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('Regions: '+c.regions.length,W-248,64);
    ctx.fillText('Connections: '+c.edges.length,W-248,82);
    /* Systems legend */
    var systems=['Visual','Auditory','Somatosensory','Motor','Prefrontal','Parietal','Limbic','Subcortical'];
    var colors=['#ffe040','#40d0ff','#40ff90','#ff5080','#e060ff','#40ffd0','#ff8040','#a060ff'];
    systems.forEach(function(s,i){
      ctx.fillStyle=colors[i];
      ctx.fillRect(W-248,92+i*10,6,6);
      ctx.fillStyle='#a0a0c0';
      ctx.font='9px monospace';
      ctx.fillText(s,W-238,99+i*10);
    });
    setStatsHTML(
      '<div>Regions: '+c.regions.length+'</div>'+
      '<div>Edges: '+c.edges.length+'</div>'+
      '<div>Selected: '+(c.selected>=0?c.regions[c.selected].name:'—')+'</div>'
    );
    updateBadge('🕸 Connectome · '+c.regions.length+' regions, '+c.edges.length+' edges');
    $('sbMode').textContent='Connectome';
  },
  onDown:function(p){
    var c=STATE.connectome;
    /* Find nearest region */
    var best=-1,bestD=25;
    c.regions.forEach(function(r,i){
      var d=Math.hypot(r.px-p.x,r.py-p.y);
      if(d<bestD){bestD=d;best=i;}
    });
    c.selected=best;
  },
  controls:function(){
    var c=STATE.connectome;
    var html='';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Show labels</span><div class="chip '+(c.showLabels?'active':'')+'" onclick="STATE.connectome.showLabels=!STATE.connectome.showLabels;renderLeftPanel()">'+(c.showLabels?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Auto-rotate</span><div class="chip '+(c.rotating?'active':'')+'" onclick="STATE.connectome.rotating=!STATE.connectome.rotating;renderLeftPanel()">'+(c.rotating?'ON':'OFF')+'</div></div>';
    html+='<button class="btn full sm" style="margin-top:8px" onclick="STATE.connectome.angle=0;renderLeftPanel()">↺ Reset rotation</button>';
    html+='</div>';
    if(c.selected>=0){
      var sel=c.regions[c.selected];
      var connections=[];
      c.edges.forEach(function(e){
        if(e.a===c.selected)connections.push({to:c.regions[e.b].name,w:e.w});
        else if(e.b===c.selected)connections.push({to:c.regions[e.a].name,w:e.w});
      });
      html+='<div class="sec"><h4>'+sel.name+'</h4>';
      html+='<div class="kv">';
      html+='<div class="row"><span class="k">System</span><span class="v">'+sel.system+'</span></div>';
      html+='<div class="row"><span class="k">Hemisphere</span><span class="v">'+sel.hemisphere+'</span></div>';
      html+='<div class="row"><span class="k">Connections</span><span class="v">'+connections.length+'</span></div>';
      html+='</div></div>';
      html+='<div class="sec"><h4>Connected to</h4>';
      connections.forEach(function(conn){
        html+='<div style="font-family:var(--mono);font-size:.6rem;padding:3px 6px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:2px">';
        html+='<span style="color:var(--c1)">'+conn.to+'</span>';
        html+='<span style="float:right;color:var(--c3)">'+fmt(conn.w,2)+'</span></div>';
      });
      html+='</div>';
    }
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click regions to see connections.</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.connectome;
    /* Compute stats */
    var degrees=c.regions.map(function(_,i){
      var d=0;
      c.edges.forEach(function(e){if(e.a===i||e.b===i)d++;});
      return d;
    });
    var avgDeg=degrees.reduce(function(s,d){return s+d},0)/degrees.length;
    var maxDeg=Math.max.apply(null,degrees);
    var hubIdx=degrees.indexOf(maxDeg);
    return '<div class="sec"><h4>Network metrics</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Regions:</b> '+c.regions.length+'<br>'+
      '<b class="text-c1">Edges:</b> '+c.edges.length+'<br>'+
      '<b class="text-c1">Avg degree:</b> '+fmt(avgDeg,2)+'<br>'+
      '<b class="text-c1">Hub:</b> '+c.regions[hubIdx].name+' ('+maxDeg+' conn)<br>'+
      '<b class="text-c1">Density:</b> '+fmt((2*c.edges.length)/(c.regions.length*(c.regions.length-1)),3)+
      '</div></div>'+
      '<div class="sec"><h4>Small-world topology</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Real brain networks are "small-world":<br>'+
      '• High clustering (local neighborhoods)<br>'+
      '• Short average path length<br>'+
      '• Few hub regions<br><br>'+
      'This balance supports both local processing and global integration.'+
      '</div></div>'+
      '<div class="sec"><h4>Human Connectome Project</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'The HCP (2010-) mapped connections between 360 cortical regions using diffusion MRI. Your brain has ~86 billion neurons and ~100 trillion synapses.'+
      '</div></div>';
  }
});

registerModule('atlas',{
  title:'Brain Atlas',
  icon:'🧠',
  desc:'Interactive 3D-style brain with 12 labeled regions. Click to see functions and clinical relevance.',
  init:function(){
    STATE.atlas.rotation=0;
  },
  tick:function(dt){
    STATE.time+=dt;
    if(STATE.playing)STATE.atlas.rotation+=dt*0.3;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var a=STATE.atlas;
    var cx=W*0.45,cy=H*0.5;
    var scale=Math.min(W,H)*0.35;
    /* Brain outline (side view) */
    ctx.strokeStyle='rgba(224,96,255,.5)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.ellipse(cx,cy,scale*1.4,scale,0,0,Math.PI*2);
    ctx.stroke();
    /* Sulci */
    ctx.strokeStyle='rgba(224,96,255,.2)';
    ctx.lineWidth=1.5;
    for(var i=0;i<8;i++){
      var a1=(i/8)*Math.PI*2+a.rotation*0.1;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a1)*scale*0.4,cy+Math.sin(a1)*scale*0.4);
      ctx.lineTo(cx+Math.cos(a1)*scale*1.35,cy+Math.sin(a1)*scale*0.95);
      ctx.stroke();
    }
    /* Draw regions */
    BRAIN_REGIONS.forEach(function(r){
      var x=cx+(r.x-0.5)*scale*2.5;
      var y=cy+(r.y-0.5)*scale*2;
      var isSel=r.name.toLowerCase().indexOf(a.selected)>=0;
      var radius=isSel?35:25;
      /* Glow */
      var grad=ctx.createRadialGradient(x,y,0,x,y,radius*1.5);
      grad.addColorStop(0,r.color+'80');
      grad.addColorStop(1,r.color+'00');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(x,y,radius*1.5,0,Math.PI*2);ctx.fill();
      /* Circle */
      ctx.fillStyle=isSel?r.color:r.color+'60';
      ctx.beginPath();ctx.arc(x,y,radius*0.7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=r.color;
      ctx.lineWidth=isSel?3:1.5;
      ctx.stroke();
      /* Label */
      ctx.fillStyle='#e0e0ff';
      ctx.font=(isSel?'bold ':'')+'10px monospace';
      ctx.textAlign='center';
      ctx.fillText(r.name,x,y-radius-6);
    });
    /* Info panel for selected region */
    var sel=BRAIN_REGIONS.find(function(r){return r.name.toLowerCase().indexOf(a.selected)>=0;});
    if(sel){
      var px=W-280,py=20;
      ctx.fillStyle='rgba(20,10,32,.9)';
      ctx.strokeStyle=sel.color;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(px,py,260,150,8);ctx.fill();ctx.stroke();
      ctx.fillStyle=sel.color;
      ctx.font='bold 14px monospace';
      ctx.textAlign='left';
      ctx.fillText(sel.name.toUpperCase(),px+12,py+24);
      ctx.fillStyle='#e0e0ff';
      ctx.font='11px monospace';
      ctx.fillText('Function:',px+12,py+52);
      ctx.fillStyle=sel.color;
      /* Word wrap */
      var words=sel.func.split(' ');
      var lines=[];
      var line='';
      words.forEach(function(w){
        if((line+' '+w).length>28){
          lines.push(line);line=w;
        } else line=(line?line+' ':'')+w;
      });
      if(line)lines.push(line);
      lines.forEach(function(l,i){
        ctx.fillText(l,px+12,py+72+i*16);
      });
    }
    setStatsHTML(
      '<div>Regions: '+BRAIN_REGIONS.length+'</div>'+
      '<div>Selected: '+a.selected+'</div>'
    );
    updateBadge('🧠 Brain Atlas · '+a.selected);
    $('sbMode').textContent='Brain Atlas';
  },
  onDown:function(p){
    var a=STATE.atlas;
    var W=CANV.W,H=CANV.H;
    var cx=W*0.45,cy=H*0.5;
    var scale=Math.min(W,H)*0.35;
    var best=null,bestD=40;
    BRAIN_REGIONS.forEach(function(r){
      var x=cx+(r.x-0.5)*scale*2.5;
      var y=cy+(r.y-0.5)*scale*2;
      var d=Math.hypot(x-p.x,y-p.y);
      if(d<bestD){bestD=d;best=r.name;}
    });
    if(best)a.selected=best.toLowerCase().split(' ')[0];
  },
  controls:function(){
    var a=STATE.atlas;
    var html='';
    html+='<div class="sec"><h4>Regions</h4>';
    BRAIN_REGIONS.forEach(function(r){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.62rem;cursor:pointer;border-left:3px solid '+r.color+'" onclick="STATE.atlas.selected=\''+r.name.toLowerCase().split(\' \')[0]+'\';renderLeftPanel()">';
      html+='<div style="color:'+r.color+'">'+r.name+'</div>';
      html+='<div style="color:var(--tx3);font-size:.55rem">'+r.func+'</div>';
      html+='</div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var a=STATE.atlas;
    var sel=BRAIN_REGIONS.find(function(r){return r.name.toLowerCase().indexOf(a.selected)>=0;});
    return '<div class="sec"><h4>Brain anatomy</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'The human brain contains ~86 billion neurons and ~85 billion glial cells. It consumes 20% of the body\'s energy despite being only 2% of body mass.'+
      '</div></div>'+
      '<div class="sec"><h4>Major subdivisions</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">Cerebrum:</b> Largest part, divided into 4 lobes (frontal, parietal, temporal, occipital)<br><br>'+
      '<b class="text-c1">Cerebellum:</b> 10% of volume, 50% of neurons. Coordination and motor learning.<br><br>'+
      '<b class="text-c1">Brainstem:</b> Midbrain, pons, medulla. Vital autonomic functions.'+
      '</div></div>'+
      (sel?'<div class="sec"><h4>Selected: '+sel.name+'</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+sel.func+'</div></div>':'');
  }
});

function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];

function renderLogs(){
  var p=$('rpLogs');

  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';

    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c5)':'var(--c1)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+

      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });

var THEMES=['neuro','matrix','cortex','paper'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);

  document.documentElement.setAttribute('data-theme',next);

  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    hh:{V:STATE.hh.V,m:STATE.hh.m,h:STATE.hh.h,n:STATE.hh.n,gNa:STATE.hh.gNa,gK:STATE.hh.gK},
    lif:{V:STATE.lif.V,spikes:STATE.lif.totalSpikes},
    izh:{v:STATE.izh.v,u:STATE.izh.u,preset:STATE.izh.preset},
    stdp:{mean:mean(Array.from(STATE.stdp.weights))},
    snn:{neurons:STATE.snn.numNeurons,synapses:STATE.snn.synapses.length},
    eeg:{channels:STATE.eeg.channels},
    hopfield:{N:STATE.hopfield.N,patterns:STATE.hopfield.patterns.length},
    connectome:{regions:STATE.connectome.regions.length,edges:STATE.connectome.edges.length}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='mente-config.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Config exported','success');
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='9'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='0')switchTab('sleep');
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(5,12);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('MENTE ready · Press ? for help','success',3500);
      },400);
    }
  },140);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}
