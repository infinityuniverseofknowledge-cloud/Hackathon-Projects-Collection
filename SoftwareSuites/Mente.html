<!DOCTYPE html>
<html lang="en" data-theme="neuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MENTE — Neuroscience Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#0a0510;--bg2:#140a20;--bg3:#1e1030;--bg4:#2a1848;
  --panel:#140a20;--panel2:#1e1030;--panel3:#2a1848;--panel4:#3c2460;
  --bd:#2e1c50;--bd2:#482e78;--bd3:#6848a8;
  --tx:#f0e0ff;--tx2:#b8a0d8;--tx3:#8068a0;--mu:#503870;
  --c1:#e060ff;--c1h:#ee90ff;--c1l:#b030d0;
  --c2:#40d0ff;--c2h:#80e0ff;--c2l:#20a0c0;
  --c3:#ffe040;--c3h:#fff080;--c3l:#c0a020;
  --c4:#ff5080;--c4h:#ff90a8;--c4l:#c03060;
  --c5:#40ff90;--c5h:#80ffc0;--c5l:#20c060;
  --c6:#ffa040;--c6h:#ffc080;--c6l:#c07020;
  --c7:#40ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff40c0;--c8h:#ff80d8;--c8l:#c02090;
  --ok:#40ff90;--warn:#ffe040;--err:#ff5080;--info:#40d0ff;
  --g1:linear-gradient(135deg,#e060ff,#40d0ff);
  --g2:linear-gradient(135deg,#ffe040,#ff5080);
  --gHolo:linear-gradient(120deg,#e060ff,#40d0ff,#40ff90,#ffe040,#ff5080,#e060ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.8);
  --sh2:0 16px 48px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="matrix"]{--bg:#000800;--bg2:#001200;--bg3:#001e00;--panel:#001200;--panel2:#001e00;
  --bd:#004000;--bd2:#006000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#40ffc0;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}
[data-theme="cortex"]{--bg:#0f0608;--bg2:#1e0c10;--bg3:#2c1418;--panel:#1e0c10;--panel2:#2c1418;
  --bd:#50242c;--bd2:#78383c;--tx:#ffe8e8;--tx2:#d8a0a0;--tx3:#a06868;
  --c1:#ff4060;--c2:#ffa040;--c3:#ffe040;--c4:#ff80c0;
  --g1:linear-gradient(135deg,#ff4060,#ffa040)}
[data-theme="paper"]{--bg:#f5f0ff;--bg2:#ede8fc;--bg3:#ddd4f0;--panel:#fff;--panel2:#f5f0ff;--panel3:#ede8fc;--panel4:#ddd4f0;
  --bd:#c0b8dc;--bd2:#9080b8;--tx:#100830;--tx2:#403060;--tx3:#7060a0;
  --c1:#8020c0;--c2:#0060c0;--c3:#c08000;--c4:#c00040;--c5:#008040;
  --g1:linear-gradient(135deg,#8020c0,#0060c0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#0a0510;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-brain{width:200px;height:200px;margin-bottom:20px}
.boot-brain svg{width:100%;height:100%}
.boot-brain .outline{fill:none;stroke:#e060ff;stroke-width:2;filter:drop-shadow(0 0 8px #e060ff)}
.boot-brain .sulcus{fill:none;stroke:#e060ff;stroke-width:1.5;opacity:.6}
.boot-brain .neuron{fill:#40d0ff;filter:drop-shadow(0 0 6px #40d0ff);animation:fire 2s ease-in-out infinite}
.boot-brain .neuron:nth-child(2n){animation-delay:.4s;fill:#ffe040}
.boot-brain .neuron:nth-child(3n){animation-delay:.8s;fill:#40ff90}
.boot-brain .neuron:nth-child(5n){animation-delay:1.2s;fill:#ff5080}
.boot-brain .link{stroke:#e060ff;stroke-width:1;opacity:.3}
.boot-brain .link.active{stroke:#40d0ff;opacity:.9;animation:fire 2s ease-in-out infinite}
@keyframes fire{0%,100%{opacity:.3}50%{opacity:1}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#e060ff;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#2a1848;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #e060ff}
.boot-pct{font-size:.7rem;color:#e060ff;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#8068a0;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.65rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0510;box-shadow:0 0 14px rgba(224,96,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#2a1848;transition:var(--t1)}
.tb-status .dot.on{background:var(--c5);box-shadow:0 0 10px var(--c5);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:300px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#050208;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(20,10,32,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:360px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(224,96,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#0a0510;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(224,96,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#0a0510;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:.95rem;font-weight:800;color:var(--c1);line-height:1.1}
.stat .sl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c5)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:260px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-brain">
    <svg viewBox="0 0 200 200">
      <path class="outline" d="M 60,50 Q 40,30 60,20 Q 90,10 110,30 Q 140,25 150,50 Q 170,70 155,100 Q 175,130 145,155 Q 130,175 100,175 Q 70,175 55,155 Q 30,130 45,100 Q 25,70 60,50 Z"/>
      <path class="sulcus" d="M 60,60 Q 80,70 75,95 Q 70,115 85,130"/>
      <path class="sulcus" d="M 140,60 Q 120,75 125,100 Q 130,120 115,135"/>
      <path class="sulcus" d="M 90,55 Q 95,80 85,105 Q 80,125 95,145"/>
      <path class="sulcus" d="M 50,90 Q 70,95 75,115"/>
      <path class="sulcus" d="M 150,90 Q 130,100 125,120"/>
      <line class="link" x1="70" y1="70" x2="100" y2="80"/>
      <line class="link active" x1="100" y1="80" x2="125" y2="75"/>
      <line class="link active" x1="100" y1="80" x2="95" y2="115"/>
      <line class="link" x1="95" y1="115" x2="70" y2="120"/>
      <line class="link active" x1="95" y1="115" x2="125" y2="120"/>
      <line class="link" x1="70" y1="120" x2="90" y2="150"/>
      <line class="link active" x1="125" y1="120" x2="115" y2="150"/>
      <circle class="neuron" cx="70" cy="70" r="4"/>
      <circle class="neuron" cx="100" cy="80" r="5"/>
      <circle class="neuron" cx="125" cy="75" r="4"/>
      <circle class="neuron" cx="95" cy="115" r="5"/>
      <circle class="neuron" cx="70" cy="120" r="4"/>
      <circle class="neuron" cx="125" cy="120" r="4"/>
      <circle class="neuron" cx="90" cy="150" r="3"/>
      <circle class="neuron" cx="115" cy="150" r="3"/>
    </svg>
  </div>
  <div class="boot-logo">MENTE</div>
  <div class="boot-sub">NEUROSCIENCE STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('action')">MENTE</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">t</span><span class="sb-val c2" id="sbTime">0.00 ms</span></div>

/* ================================================================
   HODGKIN-HUXLEY MODEL
   Classic 1952 model of squid giant axon
   ================================================================ */
function hhAlphaM(V){return 0.1*(V+40)/(1-Math.exp(-(V+40)/10))}
function hhBetaM(V){return 4*Math.exp(-(V+65)/18)}
function hhAlphaH(V){return 0.07*Math.exp(-(V+65)/20)}
function hhBetaH(V){return 1/(1+Math.exp(-(V+35)/10))}
function hhAlphaN(V){return 0.01*(V+55)/(1-Math.exp(-(V+55)/10))}
function hhBetaN(V){return 0.125*Math.exp(-(V+65)/80)}

function hhStep(hh,dt,Iext){
  var V=hh.V,m=hh.m,h=hh.h,n=hh.n;
  /* Gating variable derivatives */
  var dm=hhAlphaM(V)*(1-m)-hhBetaM(V)*m;
  var dh=hhAlphaH(V)*(1-h)-hhBetaH(V)*h;
  var dn=hhAlphaN(V)*(1-n)-hhBetaN(V)*n;
  /* Ionic currents */
  var INa=hh.gNa*m*m*m*h*(V-hh.ENa);
  var IK=hh.gK*n*n*n*n*(V-hh.EK);
  var IL=hh.gL*(V-hh.EL);
  /* Membrane equation */
  var dV=(-INa-IK-IL+Iext)/hh.C;
  /* Euler integration */
  hh.V+=dV*dt;
  hh.m+=dm*dt;
  hh.h+=dh*dt;
  hh.n+=dn*dt;
  /* Clamp gating variables */
  hh.m=clamp(hh.m,0,1);
  hh.h=clamp(hh.h,0,1);
  hh.n=clamp(hh.n,0,1);
  /* Spike detection */
  if(hh.V>0&&!hh._spiking){
    hh._spiking=true;
    hh.spikeCount=(hh.spikeCount||0)+1;
    hh.spikeTimes=(hh.spikeTimes||[]);
    hh.spikeTimes.push(hh.simulationTime);
  }
  if(hh.V<-20)hh._spiking=false;
  return {INa:INa,IK:IK,IL:IL,gNa:hh.gNa*m*m*m*h,gK:hh.gK*n*n*n*n};
}

/* ================================================================
   LEAKY INTEGRATE-AND-FIRE
   ================================================================ */
function lifStep(lif,dt,I){
  var V=lif.V;
  /* dV/dt = (-(V - Vrest) + R·I) / tau */
  var dV=(-(V-lif.Vrest)+lif.R*I)/lif.tau;
  V+=dV*dt;
  lif.V=V;
  /* Refractory period */
  if(lif.refractory>0){
    lif.refractory-=dt;
    lif.V=lif.Vreset;
    return false;
  }
  /* Spike threshold */
  if(V>=lif.Vth){
    lif.V=lif.Vreset;
    lif.refractory=lif.refractoryPeriod;
    lif.totalSpikes++;
    lif.spikeTimes.push(lif.time);
    if(lif.spikeTimes.length>100)lif.spikeTimes.shift();
    return true;
  }
  return false;
}

/* ================================================================
   IZHIKEVICH MODEL
   2D system that reproduces many neuron types
   ================================================================ */
function izhStep(izh,dt,I){
  var v=izh.v,u=izh.u;
  /* dv/dt = 0.04v² + 5v + 140 - u + I */
  /* du/dt = a(bv - u) */
  var dv=0.04*v*v+5*v+140-u+I;
  var du=izh.a*(izh.b*v-u);
  v+=dv*dt;
  u+=du*dt;
  /* Spike reset */
  if(v>=30){
    v=izh.c;
    u=u+izh.d;
    izh.spike_times.push(izh.time);
    if(izh.spike_times.length>200)izh.spike_times.shift();
  }
  izh.v=v;izh.u=u;
}

/* ================================================================
   STDP - Spike-Timing Dependent Plasticity
   ================================================================ */
function stdpUpdateWeight(w,dtPre,dtPost){
  /* If pre before post: potentiation */
  /* If post before pre: depression */
  var dw=0;
  if(dtPost>0){
    /* pre fired before post */
    dw=0.01*Math.exp(-dtPost/20);
  } else if(dtPre>0){
    /* post fired before pre */
    dw=-0.012*Math.exp(-dtPre/20);
  }
  return clamp(w+dw,0,1);
}

/* ================================================================
   HOPFIELD NETWORK
   ================================================================ */
function hopfieldTrain(N,patterns){
  /* Hebbian learning: W = (1/N) Σ p·pᵀ − I */
  var W=[];
  for(var i=0;i<N;i++){
    W.push(new Float32Array(N));
  }
  for(var p=0;p<patterns.length;p++){
    var pat=patterns[p];
    for(var i2=0;i2<N;i2++){
      for(var j=0;j<N;j++){
        if(i2===j)continue;
        W[i2][j]+=pat[i2]*pat[j]/patterns.length;
      }
    }
  }
  /* Zero diagonal */
  for(var k=0;k<N;k++)W[k][k]=0;
  return W;
}
function hopfieldStep(W,state){
  /* Asynchronous update: pick random neuron */
  var N=state.length;
  var newState=state.slice();
  /* Update all neurons (synchronous) */
  for(var i=0;i<N;i++){
    var sum=0;
    for(var j=0;j<N;j++)sum+=W[i][j]*state[j];
    newState[i]=sum>=0?1:-1;
  }
  return newState;
}

<script>
/* ================================================================
   MODULE 1: ACTION POTENTIAL (Hodgkin-Huxley)
   ================================================================ */
registerModule('action',{
  title:'Action Potential',
  icon:'⚡',
  desc:'Hodgkin-Huxley model of the squid giant axon. Real differential equations for Na⁺ and K⁺ conductances.',
  init:function(){
    var hh=STATE.hh;
    hh.V=hh.V0;hh.m=0.05;hh.h=0.6;hh.n=0.32;
    hh.simulationTime=0;
    hh.V_history=[];hh.I_history=[];
    hh.gNa_history=[];hh.gK_history=[];
    hh.spikeCount=0;hh.spikeTimes=[];
    hh._spiking=false;
  },
  tick:function(dt){
    var hh=STATE.hh;
    if(!STATE.playing)return;
    /* Simulation timestep */
    var simDt=0.01;
    var steps=Math.min(50,Math.round(dt*1000));
    for(var i=0;i<steps;i++){
      hh.simulationTime+=simDt;
      /* External current: pulse at stimulusStart */
      var t=hh.simulationTime;
      var Iext=0;
      if(t>=hh.stimulusStart&&t<hh.stimulusStart+hh.stimulusDuration){
        Iext=hh.stimulusAmp;
      }
      var currents=hhStep(hh,simDt,Iext);
      /* Record history */
      hh.V_history.push(hh.V);
      hh.I_history.push(Iext);
      hh.gNa_history.push(currents.gNa);
      hh.gK_history.push(currents.gK);
      if(hh.V_history.length>hh.maxHistory){
        hh.V_history.shift();hh.I_history.shift();
        hh.gNa_history.shift();hh.gK_history.shift();
      }
    }
    STATE.time+=dt;
    $('sbV').textContent=fmt(hh.V,1)+' mV';
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var hh=STATE.hh;
    /* Voltage trace */
    var pad=60;
    var plotW=W-pad*2;
    var plotH=H*0.35;
    var plotX=pad;
    var plotY=60;
    /* Background */
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(224,96,255,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(224,96,255,.08)';
    for(var i=0;i<=10;i++){
      var gy=plotY+i*plotH/10;
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    /* Voltage trace */
    var history=hh.V_history;
    if(history.length>1){
      var Vmin=-90,Vmax=60;
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(var i2=0;i2<history.length;i2++){
        var px=plotX+(i2/history.length)*plotW;
        var py=plotY+plotH-((history[i2]-Vmin)/(Vmax-Vmin))*plotH;
        if(i2===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    /* Current trace */
    var curY=plotY+plotH+20;
    var curH=60;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.beginPath();ctx.roundRect(plotX,curY,plotW,curH,6);ctx.fill();ctx.stroke();
    if(hh.I_history.length>1){
      var Imax=Math.max(15,hh.stimulusAmp*1.2);
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(var i3=0;i3<hh.I_history.length;i3++){
        var px=plotX+(i3/hh.I_history.length)*plotW;
        var py=curY+curH-(hh.I_history[i3]/Imax)*curH;
        if(i3===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    /* Conductance plot */
    var condY=curY+curH+20;
    var condH=120;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.beginPath();ctx.roundRect(plotX,condY,plotW,condH,6);ctx.fill();ctx.stroke();
    if(hh.gNa_history.length>1){
      /* Na conductance */
      var gMax=Math.max(50,hh.gNa);
      ctx.strokeStyle='#ff8040';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      for(var i4=0;i4<hh.gNa_history.length;i4++){
        var px=plotX+(i4/hh.gNa_history.length)*plotW;
        var py=condY+condH-(hh.gNa_history[i4]/gMax)*condH;
        if(i4===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
      /* K conductance */
      ctx.strokeStyle='#40d0ff';
      ctx.beginPath();
      for(var i5=0;i5<hh.gK_history.length;i5++){
        var px=plotX+(i5/hh.gK_history.length)*plotW;
        var py=condY+condH-(hh.gK_history[i5]/gMax)*condH;
        if(i5===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    /* Legend */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,260,130,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('HODGKIN-HUXLEY MODEL',32,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('V = '+fmt(hh.V,2)+' mV',32,64);
    ctx.fillText('m = '+fmt(hh.m,4),32,80);
    ctx.fillText('h = '+fmt(hh.h,4),32,96);
    ctx.fillText('n = '+fmt(hh.n,4),32,112);
    ctx.fillText('t = '+fmt(hh.simulationTime,2)+' ms',32,128);
    /* Conductance legend */
    ctx.fillStyle='#ff8040';
    ctx.fillText('■ gNa',180,80);
    ctx.fillStyle='#40d0ff';
    ctx.fillText('■ gK',180,96);
    /* Labels */
    ctx.fillStyle='#40d0ff';
    ctx.font='10px monospace';
    ctx.fillText('Membrane potential (mV)',plotX+8,plotY+16);
    ctx.fillStyle='#ffe040';
    ctx.fillText('Stimulus current (μA/cm²)',plotX+8,curY+16);
    ctx.fillStyle='#ff8040';
    ctx.fillText('Conductances (orange=Na, blue=K)',plotX+8,condY+16);
    setStatsHTML(
      '<div>V = '+fmt(hh.V,1)+' mV</div>'+
      '<div>Spikes: '+(hh.spikeCount||0)+'</div>'+
      '<div>t = '+fmt(hh.simulationTime,1)+' ms</div>'+
      '<div>m/h/n = '+fmt(hh.m,3)+'/'+fmt(hh.h,3)+'/'+fmt(hh.n,3)+'</div>'
    );
    updateBadge('⚡ Hodgkin-Huxley · V='+fmt(hh.V,1)+' mV');
    $('sbMode').textContent='Action Potential';
    $('sbTime').textContent=fmt(hh.simulationTime,1)+' ms';
    $('sbSpikes').textContent=hh.spikeCount||0;
  },

function hhPreset(name){
  var hh=STATE.hh;
  if(name==='threshold'){hh.stimulusAmp=6.5;}
  else if(name==='burst'){hh.stimulusAmp=15;hh.stimulusDuration=4;}
  else if(name==='noNa'){hh.gNa=0;}

  MODULES.action.init();
  renderLeftPanel();
}

registerModule('lif',{
  title:'LIF Neuron',
  icon:'📈',
  desc:'Leaky Integrate-and-Fire model. Simplest spiking neuron — used throughout computational neuroscience.',
  init:function(){
    var lif=STATE.lif;
    lif.V=lif.Vrest;
    lif.time=0;
    lif.V_history=[];
    lif.spikeTimes=[];
    lif.totalSpikes=0;
    lif.refractory=0;
  },
  tick:function(dt){
    var lif=STATE.lif;
    if(!STATE.playing)return;
    var simDt=0.1;
    var steps=Math.min(30,Math.round(dt*1000));
    for(var i=0;i<steps;i++){
      lif.time+=simDt;
      var I=lif.I;
      if(lif.inputMode==='sine'){
        I=lif.I_sine_amp*Math.sin(2*Math.PI*lif.I_sine_freq*lif.time/1000);
      } else if(lif.inputMode==='noise'){
        I=lif.I+rndF(-5,5);
      }
      lifStep(lif,simDt,I);
      lif.V_history.push(lif.V);
      if(lif.V_history.length>lif.maxHistory)lif.V_history.shift();
    }
    STATE.time+=dt;
    $('sbV').textContent=fmt(lif.V,1)+' mV';
    $('sbSpikes').textContent=lif.totalSpikes;
    $('sbRate').textContent=fmt(lif.totalSpikes/Math.max(1,lif.time/1000),1)+' Hz';
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var lif=STATE.lif;
    var pad=60;
    var plotW=W-pad*2;
    var plotH=H*0.5;
    var plotX=pad;
    var plotY=80;
    /* Plot background */
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(64,208,255,.08)';
    for(var i=0;i<=10;i++){
      var gy=plotY+i*plotH/10;
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    /* Threshold line */
    var Vmin=-90,Vmax=-40;
    var thY=plotY+plotH-((lif.Vth-Vmin)/(Vmax-Vmin))*plotH;
    ctx.strokeStyle='rgba(255,80,128,.5)';
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(plotX,thY);ctx.lineTo(plotX+plotW,thY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ff5080';
    ctx.font='10px monospace';
    ctx.fillText('threshold '+lif.Vth+' mV',plotX+8,thY-4);
    /* Rest line */
    var restY=plotY+plotH-((lif.Vrest-Vmin)/(Vmax-Vmin))*plotH;
    ctx.strokeStyle='rgba(64,255,144,.3)';
    ctx.beginPath();ctx.moveTo(plotX,restY);ctx.lineTo(plotX+plotW,restY);ctx.stroke();
    ctx.fillStyle='#40ff90';
    ctx.fillText('rest '+lif.Vrest+' mV',plotX+8,restY+12);
    /* V trace */
    var history=lif.V_history;
    if(history.length>1){
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=2;
      ctx.beginPath();
      for(var j=0;j<history.length;j++){
        var px=plotX+(j/history.length)*plotW;
        var py=plotY+plotH-((history[j]-Vmin)/(Vmax-Vmin))*plotH;
        if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    /* Spike raster */
    var rasterY=plotY+plotH+30;
    var rasterH=80;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.beginPath();ctx.roundRect(plotX,rasterY,plotW,rasterH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='10px monospace';
    ctx.fillText('Spike raster (recent spikes)',plotX+8,rasterY+14);
    /* Draw recent spikes */
    lif.spikeTimes.slice(-30).forEach(function(t){
      var tNow=lif.time;
      var tStart=tNow-1000;
      if(t<tStart)return;
      var px=plotX+((t-tStart)/1000)*plotW;
      ctx.fillStyle='#ffe040';
      ctx.fillRect(px,rasterY+30,2,rasterH-40);
    });
    /* Info */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,260,60,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('LEAKY INTEGRATE-AND-FIRE',32,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e0ff';
    ctx.fillText('V='+fmt(lif.V,2)+' mV | I='+fmt(lif.I,1)+' | Spikes: '+lif.totalSpikes,32,64);
    setStatsHTML(
      '<div>V = '+fmt(lif.V,2)+' mV</div>'+
      '<div>Spikes: '+lif.totalSpikes+'</div>'+
      '<div>Rate: '+fmt(lif.totalSpikes/Math.max(0.001,lif.time/1000),1)+' Hz</div>'+
      '<div>I = '+fmt(lif.I,1)+'</div>'
    );
    updateBadge('📈 LIF · V='+fmt(lif.V,1)+' mV · '+lif.totalSpikes+' spikes');
    $('sbMode').textContent='LIF Neuron';
  },
  onDown:function(){},
  controls:function(){
    var lif=STATE.lif;
    var html='';
    html+='<div class="sec"><h4>Current input</h4>';
    html+='<div class="chip-row">';
    [['constant','Constant'],['sine','Sine'],['noise','Noisy']].forEach(function(m){
      html+='<div class="chip '+(lif.inputMode===m[0]?'active':'')+'" onclick="STATE.lif.inputMode=\''+m[0]+'\';renderLeftPanel()">'+m[1]+'</div>';
    });
    html+='</div></div>';
    if(lif.inputMode==='constant'){
      html+='<div class="sec"><h4>Amplitude</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>I (μA)</span><span>'+fmt(lif.I,1)+'</span></div>';
      html+='<input type="range" min="0" max="40" step="0.5" value="'+lif.I+'" oninput="STATE.lif.I=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='</div>';
    } else if(lif.inputMode==='sine'){
      html+='<div class="sec"><h4>Sine parameters</h4>';
      html+='<div class="ctrl"><div class="lbl"><span>Amplitude</span><span>'+fmt(lif.I_sine_amp,1)+'</span></div>';
      html+='<input type="range" min="0" max="40" step="0.5" value="'+lif.I_sine_amp+'" oninput="STATE.lif.I_sine_amp=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='<div class="ctrl"><div class="lbl"><span>Frequency (Hz)</span><span>'+fmt(lif.I_sine_freq,1)+'</span></div>';
      html+='<input type="range" min="0.1" max="10" step="0.1" value="'+lif.I_sine_freq+'" oninput="STATE.lif.I_sine_freq=parseFloat(this.value);renderLeftPanel()"></div>';
      html+='</div>';
    }
    html+='<div class="sec"><h4>Neuron parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Tau (ms)</span><span>'+fmt(lif.tau,1)+'</span></div>';
    html+='<input type="range" min="2" max="50" step="0.5" value="'+lif.tau+'" oninput="STATE.lif.tau=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>R (MΩ)</span><span>'+fmt(lif.R,1)+'</span></div>';
    html+='<input type="range" min="1" max="50" step="0.5" value="'+lif.R+'" oninput="STATE.lif.R=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Threshold (mV)</span><span>'+fmt(lif.Vth,1)+'</span></div>';
    html+='<input type="range" min="-70" max="-30" step="0.5" value="'+lif.Vth+'" oninput="STATE.lif.Vth=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Reset (mV)</span><span>'+fmt(lif.Vreset,1)+'</span></div>';
    html+='<input type="range" min="-90" max="-60" step="0.5" value="'+lif.Vreset+'" oninput="STATE.lif.Vreset=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Refractory (ms)</span><span>'+fmt(lif.refractoryPeriod,1)+'</span></div>';
    html+='<input type="range" min="0" max="20" step="0.5" value="'+lif.refractoryPeriod+'" oninput="STATE.lif.refractoryPeriod=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.lif.init();renderLeftPanel()">↺ Reset</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var lif=STATE.lif;
    return '<div class="sec"><h4>LIF equation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'τ_m·dV/dt = −(V − V_rest) + R·I(t)<br><br>'+
      'When V ≥ V_threshold: emit spike, V ← V_reset<br>'+
      'Then refractory period during which V stays at V_reset.'+
      '</div></div>'+
      '<div class="sec"><h4>Current model</h4><div class="kv">'+

registerModule('izh',{

    izh.spike_times=[];

    var pad=60;
    var plotW=W-pad*2;

    var plotX=pad,plotY=80;
    /* V trace */
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(224,96,255,.3)';

/* ================================================================
   MODULE 4: STDP PLASTICITY
   ================================================================ */
registerModule('stdp',{
  title:'STDP Plasticity',
  icon:'🔗',
  desc:'Spike-Timing Dependent Plasticity. Synaptic weights change based on precise timing of pre- and post-synaptic spikes.',
  init:function(){
    var s=STATE.stdp;
    s.weights=new Float32Array(s.numSynapses);
    for(var i=0;i<s.numSynapses;i++)s.weights[i]=0.5;
    s.lastPre=new Float32Array(s.numSynapses);
    for(var j=0;j<s.numSynapses;j++)s.lastPre[j]=-Infinity;
    s.lastPost=-Infinity;
    s.history=[];
    s.t=0;
  },
  tick:function(dt){
    var s=STATE.stdp;
    if(!STATE.playing)return;
    var simDt=1.0; /* 1 ms per tick */
    var steps=Math.min(10,Math.round(dt*100));
    for(var st=0;st<steps;st++){
      s.t+=simDt;
      /* Pre-synaptic spike: Poisson process */
      for(var i=0;i<s.numSynapses;i++){
        if(Math.random()<s.rate*simDt/1000){
          s.lastPre[i]=s.t;
          s.preSpikes.push({synapse:i,time:s.t});
        }
      }
      /* Post-synaptic spike */
      /* Fires when enough input arrives */
      var totalInput=0;
      for(var i2=0;i2<s.numSynapses;i2++){
        if(s.t-s.lastPre[i2]<5)totalInput+=s.weights[i2];
      }
      if(totalInput>2.0&&Math.random()<0.3){
        s.lastPost=s.t;
        s.postSpikes.push({time:s.t});
        /* STDP update */
        for(var i3=0;i3<s.numSynapses;i3++){
          var dtPre=s.t-s.lastPre[i3];
          if(dtPre<100){
            if(dtPre>0){
              /* Pre before post: potentiate */
              s.weights[i3]+=s.A_plus*Math.exp(-dtPre/s.tau_plus);
            } else if(dtPre<0){
              /* Post before pre: depress */
              s.weights[i3]-=s.A_minus*Math.exp(dtPre/s.tau_minus);
            }
            s.weights[i3]=clamp(s.weights[i3],s.w_min,s.w_max);
          }
        }
      }
      /* Trim spike history */
      if(s.preSpikes.length>1000)s.preSpikes.shift();
      if(s.postSpikes.length>500)s.postSpikes.shift();
    }
    /* Record weight distribution */
    s.history.push(Array.from(s.weights));
    if(s.history.length>200)s.history.shift();
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var s=STATE.stdp;
    /* STDP curve */
    var pad=60;
    var plotW=W-pad*2;
    var plotH=H*0.35;
    var plotX=pad,plotY=80;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(224,96,255,.3)';
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Axes */
    var cx=plotX+plotW/2;
    var cy=plotY+plotH/2;
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.moveTo(plotX,cy);ctx.lineTo(plotX+plotW,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,plotY);ctx.lineTo(cx,plotY+plotH);ctx.stroke();
    /* STDP curve */
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    for(var x=-50;x<=50;x+=0.5){
      var dw;
      if(x>0)dw=s.A_plus*Math.exp(-x/s.tau_plus);
      else if(x<0)dw=-s.A_minus*Math.exp(x/s.tau_minus);
      else dw=0;
      var px=cx+(x/50)*plotW/2;
      var py=cy-dw*30;
      if(x===-50)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle='#ffe040';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Δt = t_post − t_pre (ms)',cx,plotY+plotH-8);
    ctx.save();
    ctx.translate(plotX+16,cy);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Δw',0,0);
    ctx.restore();
    ctx.fillStyle='#40ff90';
    ctx.textAlign='left';
    ctx.fillText('LTP (potentiation)',plotX+plotW*0.6,plotY+20);
    ctx.fillStyle='#ff5080';
    ctx.fillText('LTD (depression)',plotX+plotW*0.1,plotY+plotH-20);
    /* Weight histogram */
    var histY=plotY+plotH+30;
    var histH=140;
    var histX=pad;
    var histW=plotW;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.beginPath();ctx.roundRect(histX,histY,histW,histH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.fillText('WEIGHT DISTRIBUTION (20 synapses)',histX+8,histY+16);
    /* Histogram bins */
    var bins=new Array(20).fill(0);
    for(var i=0;i<s.weights.length;i++){
      bins[Math.min(19,Math.floor(s.weights[i]*20))]++;
    }
    var maxBin=Math.max.apply(null,bins);
    var binW=histW/20;
    for(var b=0;b<20;b++){
      var bh=(bins[b]/maxBin)*(histH-50);
      var bx=histX+b*binW+2;
      var by=histY+histH-bh-20;
      var hue=240-b*12;
      ctx.fillStyle='hsl('+hue+',80%,60%)';
      ctx.fillRect(bx,by,binW-4,bh);
    }
    /* Raster plot */
    var rasterY=histY+histH+30;
    var rasterH=100;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.beginPath();ctx.roundRect(histX,rasterY,histW,rasterH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe040';
    ctx.font='10px monospace';
    ctx.fillText('Spike raster (top: post, bottom: pre)',histX+8,rasterY+14);
    /* Post spikes */
    var tNow=s.t;
    var tStart=tNow-500;
    s.postSpikes.forEach(function(sp){
      if(sp.time<tStart)return;
      var px=histX+((sp.time-tStart)/500)*histW;
      ctx.fillStyle='#e060ff';
      ctx.fillRect(px,rasterY+24,1.5,rasterH*0.3);
    });
    /* Pre spikes */
    s.preSpikes.forEach(function(sp){
      if(sp.time<tStart)return;
      var px=histX+((sp.time-tStart)/500)*histW;
      var py=rasterY+24+rasterH*0.35+(sp.synapse/s.numSynapses)*rasterH*0.6;
      ctx.fillStyle='#40d0ff';
      ctx.fillRect(px,py,1.5,3);
    });
    setStatsHTML(
      '<div>Synapses: '+s.numSynapses+'</div>'+
      '<div>Mean weight: '+fmt(mean(Array.from(s.weights)),3)+'</div>'+
      '<div>Min: '+fmt(Math.min.apply(null,Array.from(s.weights)),3)+'</div>'+
      '<div>Max: '+fmt(Math.max.apply(null,Array.from(s.weights)),3)+'</div>'
    );
    updateBadge('🔗 STDP · '+s.numSynapses+' synapses · mean w='+fmt(mean(Array.from(s.weights)),2));
    $('sbMode').textContent='STDP';
  },
  onDown:function(){},
  controls:function(){
    var s=STATE.stdp;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.stdp.init();renderLeftPanel()">↺ Reset weights</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Network parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Synapses</span><span>'+s.numSynapses+'</span></div>';
    html+='<input type="range" min="5" max="50" step="1" value="'+s.numSynapses+'" oninput="STATE.stdp.numSynapses=parseInt(this.value);MODULES.stdp.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Pre firing rate (Hz)</span><span>'+s.rate+'</span></div>';
    html+='<input type="range" min="1" max="20" step="0.5" value="'+s.rate+'" oninput="STATE.stdp.rate=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>STDP parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>A+ (LTP)</span><span>'+fmt(s.A_plus,4)+'</span></div>';
    html+='<input type="range" min="0.001" max="0.03" step="0.001" value="'+s.A_plus+'" oninput="STATE.stdp.A_plus=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>A− (LTD)</span><span>'+fmt(s.A_minus,4)+'</span></div>';
    html+='<input type="range" min="0.001" max="0.03" step="0.001" value="'+s.A_minus+'" oninput="STATE.stdp.A_minus=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>τ+</span><span>'+s.tau_plus+' ms</span></div>';
    html+='<input type="range" min="5" max="50" step="1" value="'+s.tau_plus+'" oninput="STATE.stdp.tau_plus=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>τ−</span><span>'+s.tau_minus+' ms</span></div>';
    html+='<input type="range" min="5" max="50" step="1" value="'+s.tau_minus+'" oninput="STATE.stdp.tau_minus=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var s=STATE.stdp;
    return '<div class="sec"><h4>STDP rule</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Δw = A₊·exp(−Δt/τ₊) if Δt > 0 (pre before post)<br>'+
      'Δw = −A₋·exp(Δt/τ₋) if Δt < 0 (post before pre)<br><br>'+
      'Δt = t_post − t_pre<br><br>'+
      'This simple rule is believed to underlie learning and memory in the brain.'+
      '</div></div>'+
      '<div class="sec"><h4>Why it matters</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Hebb\'s postulate: "Cells that fire together, wire together."<br><br>'+
      'STDP refines this: it\'s not just coincidence, but the *order* of firing that matters. If pre fires before post (causal), synapse strengthens. If post fires before pre (acausal), synapse weakens.<br><br>'+
      'This is a biologically plausible learning rule, discovered in 1997 by Markram et al.'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Mean weight</span><span class="v">'+fmt(mean(Array.from(s.weights)),3)+'</span></div>'+

registerModule('snn',{
  title:'Spiking Network',
  icon:'🌐',
  desc:'80-neuron spiking neural network with excitatory and inhibitory populations. Shows emergent oscillations.',
  init:function(){
    var s=STATE.snn;
    s.neurons=[];
    s.synapses=[];
    s.raster=[];
    s.t=0;
    /* Create neurons */
    for(var i=0;i<s.numNeurons;i++){
      s.neurons.push({
        id:i,
        V:s.V_rest,
        type:i<s.numNeurons*(1-s.inhibitoryRatio)?'E':'I',
        x:Math.random()*CANV.W,
        y:Math.random()*CANV.H,
        spikes:[],
        lastSpike:-Infinity
      });
    }
    /* Random connections */
    for(var pre=0;pre<s.numNeurons;pre++){
      for(var post=0;post<s.numNeurons;post++){
        if(pre===post)continue;
        if(Math.random()<s.connectDensity){
          var isInhib=s.neurons[pre].type==='I';
          s.synapses.push({
            pre:pre,
            post:post,
            w:isInhib?rndF(-2,-0.5):rndF(0.3,1.5),
            delay:rndF(1,5)
          });
        }
      }
    }
    logMsg('SNN: '+s.numNeurons+' neurons, '+s.synapses.length+' synapses','success');
  },
  tick:function(dt){
    var s=STATE.snn;
    if(!s.running||!STATE.playing)return;
    var simDt=0.1;
    var steps=Math.min(20,Math.round(dt*100));
    for(var st=0;st<steps;st++){
      s.t+=simDt;
      /* Update each neuron */
      for(var i=0;i<s.neurons.length;i++){
        var n=s.neurons[i];
        /* In refractory period */
        if(s.t-n.lastSpike<s.refractoryPeriod){
          n.V=s.V_reset_abs;
          continue;
        }
        /* Sum synaptic input */
        var Isyn=0;
        for(var k=0;k<s.synapses.length;k++){
          var syn=s.synapses[k];
          if(syn.post!==i)continue;
          var preN=s.neurons[syn.pre];
          var dtSince= s.t-preN.lastSpike;
          if(dtSince>0&&dtSince<syn.delay+10){
            Isyn+=syn.w*Math.exp(-(dtSince-syn.delay)/10)*(dtSince>=syn.delay?1:0);
          }
        }
        /* LIF dynamics */
        var dV=(-(n.V-s.V_rest)+s.Iext*10+Isyn*5)/s.tau_m;
        n.V+=dV*simDt*10;
        /* Spike */
        if(n.V>=s.V_th){
          n.V=s.V_reset;
          n.lastSpike=s.t;
          n.spikes.push(s.t);
          if(n.spikes.length>50)n.spikes.shift();
          s.raster.push({neuron:i,time:s.t});
          if(s.raster.length>s.maxRaster)s.raster.shift();
        }
      }
    }
    /* Compute global rate */
    var recentWindow=s.t-100;
    var recentSpikes=s.raster.filter(function(r){return r.time>recentWindow});
    s.globalRate=recentSpikes.length/(s.numNeurons*0.1);
    STATE.time+=dt;
    $('sbSpikes').textContent=s.raster.length;
    $('sbRate').textContent=fmt(s.globalRate,1)+' Hz';
    $('sbV').textContent=fmt(s.neurons[0].V,1)+' mV';
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var s=STATE.snn;
    /* Layout neurons on a grid */
    var cols=Math.ceil(Math.sqrt(s.numNeurons));
    var rows=Math.ceil(s.numNeurons/cols);
    var size=Math.min(W-80,H*0.6-80);
    var cellW=size/cols;
    var cellH=size/rows;
    var ox=(W-size)/2;
    var oy=80;
    /* Update neuron positions */
    s.neurons.forEach(function(n,i){
      n.x=ox+(i%cols)*cellW+cellW/2;
      n.y=oy+Math.floor(i/cols)*cellH+cellH/2;
    });
    /* Draw synapses */
    ctx.lineWidth=0.3;
    s.synapses.forEach(function(syn){
      var pre=s.neurons[syn.pre];
      var post=s.neurons[syn.post];
      /* Alpha by weight magnitude */
      var alpha=Math.min(0.2,Math.abs(syn.w)*0.1);
      ctx.strokeStyle=syn.w>0?'rgba(255,80,128,'+alpha+')':'rgba(64,208,255,'+alpha+')';
      ctx.beginPath();
      ctx.moveTo(pre.x,pre.y);
      ctx.lineTo(post.x,post.y);
      ctx.stroke();
    });
    /* Draw neurons */
    s.neurons.forEach(function(n){
      var sinceSpike=s.t-n.lastSpike;
      var firing=sinceSpike<5;
      var color;
      if(n.type==='E')color=firing?'#ff5080':'rgba(255,80,128,.4)';
      else color=firing?'#40d0ff':'rgba(64,208,255,.4)';
      var radius=firing?6:3;
      if(firing){
        ctx.shadowBlur=15;
        ctx.shadowColor=color;
      }
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.arc(n.x,n.y,radius,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
    });
    /* Raster plot */
    var rasterY=H-120;
    var rasterH=100;
    var rasterX=40;
    var rasterW=W-80;
    ctx.fillStyle='rgba(20,10,32,.6)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.beginPath();ctx.roundRect(rasterX,rasterY,rasterW,rasterH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='10px monospace';
    ctx.textAlign='left';
    ctx.fillText('Population raster plot (E=red, I=blue)',rasterX+8,rasterY+14);
    var tNow=s.t;
    var tStart=tNow-500;
    s.raster.forEach(function(r){
      if(r.time<tStart)return;
      var n=s.neurons[r.neuron];
      var px=rasterX+((r.time-tStart)/500)*rasterW;
      var py=rasterY+20+(r.neuron/s.numNeurons)*(rasterH-30);
      ctx.fillStyle=n.type==='E'?'#ff5080':'#40d0ff';
      ctx.fillRect(px,py,1,2);
    });
    /* Legend */
    ctx.fillStyle='rgba(20,10,32,.85)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,280,50,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('SPIKING NEURAL NETWORK',32,42);
    ctx.font='11px monospace';
    ctx.fillStyle='#e0e0ff';
    ctx.fillText(s.numNeurons+' neurons, '+s.synapses.length+' synapses',32,60);
    setStatsHTML(
      '<div>Neurons: '+s.numNeurons+'</div>'+
      '<div>Synapses: '+s.synapses.length+'</div>'+
      '<div>Rate: '+fmt(s.globalRate,2)+' Hz</div>'+
      '<div>t = '+fmt(s.t/1000,2)+' s</div>'
    );
    updateBadge('🌐 SNN · '+s.numNeurons+' neurons · '+fmt(s.globalRate,1)+' Hz');
    $('sbMode').textContent='Spiking Network';
  },
  onDown:function(p){
    var s=STATE.snn;
    /* Find nearest neuron and inject current */
    var best=-1,bestD=20;
    s.neurons.forEach(function(n,i){
      var d=Math.hypot(n.x-p.x,n.y-p.y);
      if(d<bestD){bestD=d;best=i;}
    });
    if(best>=0){
      s.neurons[best].V=s.V_th+1;
    }
  },
  controls:function(){
    var s=STATE.snn;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn '+(s.running?'danger':'primary')+' full" onclick="STATE.snn.running=!STATE.snn.running;renderLeftPanel()">'+(s.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.snn.init();renderLeftPanel()">🎲 New network</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Network structure</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Neurons</span><span>'+s.numNeurons+'</span></div>';
    html+='<input type="range" min="20" max="200" step="10" value="'+s.numNeurons+'" oninput="STATE.snn.numNeurons=parseInt(this.value);MODULES.snn.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Connectivity</span><span>'+fmt(s.connectDensity*100,0)+'%</span></div>';
    html+='<input type="range" min="0.05" max="0.5" step="0.01" value="'+s.connectDensity+'" oninput="STATE.snn.connectDensity=parseFloat(this.value);MODULES.snn.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Inhibitory fraction</span><span>'+fmt(s.inhibitoryRatio*100,0)+'%</span></div>';
    html+='<input type="range" min="0" max="0.5" step="0.05" value="'+s.inhibitoryRatio+'" oninput="STATE.snn.inhibitoryRatio=parseFloat(this.value);MODULES.snn.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Dynamics</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>External input</span><span>'+s.Iext+'</span></div>';
    html+='<input type="range" min="0" max="20" step="0.5" value="'+s.Iext+'" oninput="STATE.snn.Iext=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>τ_m (ms)</span><span>'+s.tau_m+'</span></div>';
    html+='<input type="range" min="5" max="50" step="1" value="'+s.tau_m+'" oninput="STATE.snn.tau_m=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Refractory (ms)</span><span>'+s.refractoryPeriod+'</span></div>';
    html+='<input type="range" min="0" max="15" step="0.5" value="'+s.refractoryPeriod+'" oninput="STATE.snn.refractoryPeriod=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click on a neuron to make it spike.</div>';
    return html;
  },
  mathPanel:function(){
    var s=STATE.snn;
    return '<div class="sec"><h4>Network dynamics</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Each neuron follows LIF dynamics:<br>'+
      'τ_m·dV/dt = −(V − V_rest) + R·I_total<br><br>'+
      'Total input = external + Σ synaptic<br><br>'+
      'Synaptic current: I_syn(t) = Σ w·exp(−(t−t_spike−δ)/τ_s)'+
      '</div></div>'+
      '<div class="sec"><h4>Emergent behavior</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Excitatory (E) neurons have positive weights and increase firing.<br>'+
      'Inhibitory (I) neurons have negative weights and suppress firing.<br><br>'+
      'With the right E/I balance, networks oscillate spontaneously — a phenomenon observed in the real cortex (gamma oscillations at 30-80 Hz).'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Neurons</span><span class="v">'+s.numNeurons+'</span></div>'+
      '<div class="row"><span class="k">Synapses</span><span class="v">'+s.synapses.length+'</span></div>'+
      '<div class="row"><span class="k">Global rate</span><span class="v">'+fmt(s.globalRate,2)+' Hz</span></div>'+
      '<div class="row"><span class="k">Sim time</span><span class="v">'+fmt(s.t/1000,2)+' s</span></div>'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 6: EEG
   ================================================================ */
registerModule('eeg',{
  title:'EEG Rhythms',
  icon:'📊',
  desc:'Electroencephalogram simulation with delta, theta, alpha, beta and gamma bands. Real Fourier spectrum.',
  init:function(){
    var e=STATE.eeg;
    e.t=0;
    e.signals=[];
    for(var ch=0;ch<e.channels;ch++){
      e.signals.push(new Float32Array(e.sampleRate*e.duration));
    }
  },
  tick:function(dt){
    var e=STATE.eeg;
    if(!STATE.playing)return;
    var simDt=1/e.sampleRate;
    var samplesPerFrame=Math.min(50,Math.round(dt*e.sampleRate));
    for(var s=0;s<samplesPerFrame;s++){
      e.t+=simDt;
      var t=e.t;
      /* Generate signal as sum of oscillations in each frequency band */
      var value=0;
      e.frequencies.forEach(function(band){
        var center=(band.range[0]+band.range[1])/2;
        value+=band.amp*Math.sin(2*Math.PI*center*t+rndF(0,0.01));
      });
      /* Add 1/f noise */
      value+=rndF(-0.3,0.3);
      /* Store in each channel with slight offset */
      for(var ch=0;ch<e.channels;ch++){
        e.signals[ch][e.signals[ch].length-1]=0;
        /* Shift left */
        for(var k=0;k<e.signals[ch].length-1;k++){
          e.signals[ch][k]=e.signals[ch][k+1];
        }
        e.signals[ch][e.signals[ch].length-1]=value*(1+ch*0.1);
      }
    }
    STATE.time+=dt;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var e=STATE.eeg;
    /* Multi-channel display */
    var pad=80;
    var startY=60;
    var chanH=(H-100)/e.channels;
    var plotW=W-pad-40;
    for(var ch=0;ch<e.channels;ch++){
      var y=startY+ch*chanH;
      /* Background */
      ctx.fillStyle=ch%2===0?'rgba(20,10,32,.4)':'rgba(20,10,32,.6)';
      ctx.fillRect(pad,y,plotW,chanH-4);
      /* Signal */
      var signal=e.signals[ch];
      ctx.strokeStyle=e.frequencies[ch%e.frequencies.length].color;
      ctx.lineWidth=1.5;
      ctx.beginPath();
      var samplesToShow=Math.min(signal.length,e.sampleRate*2);
      var offset=signal.length-samplesToShow;
      for(var s=0;s<samplesToShow;s++){
        var val=signal[offset+s];
        var px=pad+(s/samplesToShow)*plotW;
        var py=y+chanH/2-val*15;
        if(s===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.stroke();
      /* Channel label */
      ctx.fillStyle='#e0e0ff';
      ctx.font='11px monospace';
      ctx.textAlign='right';
      ctx.fillText('Ch'+(ch+1),pad-8,y+chanH/2+4);
      /* Scale bar */
      ctx.strokeStyle='rgba(224,96,255,.4)';
      ctx.beginPath();
      ctx.moveTo(pad+8,y+chanH-10);
      ctx.lineTo(pad+8,y+chanH-4);
      ctx.stroke();
      ctx.fillStyle='rgba(224,96,255,.6)';
      ctx.font='9px monospace';
      ctx.textAlign='left';
      ctx.fillText('100 μV',pad+12,y+chanH-6);
    }
    /* Frequency bands info */
    ctx.fillStyle='rgba(20,10,32,.9)';
    ctx.strokeStyle='rgba(224,96,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,300,130,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('EEG FREQUENCY BANDS',32,42);
    ctx.font='10px monospace';
    e.frequencies.forEach(function(b,i){
      ctx.fillStyle=b.color;
      ctx.fillText('■ '+b.name+' ('+b.range[0]+'-'+b.range[1]+' Hz)',32,62+i*16);
      ctx.fillStyle='#a0a0c0';
      ctx.fillText('Amp: '+fmt(b.amp,2),180,62+i*16);
    });
    setStatsHTML(
      '<div>Channels: '+e.channels+'</div>'+
      '<div>Sample rate: '+e.sampleRate+' Hz</div>'+
      '<div>Bands: 5</div>'+
      '<div>t = '+fmt(e.t,2)+' s</div>'
    );
    updateBadge('📊 EEG · '+e.channels+' channels');
    $('sbMode').textContent='EEG';
    $('sbTime').textContent=fmt(e.t,2)+' s';
  },
  onDown:function(){},
  controls:function(){
    var e=STATE.eeg;
    var html='';
    html+='<div class="sec"><h4>Frequency bands</h4>';
    e.frequencies.forEach(function(b,i){
      html+='<div class="ctrl"><div class="lbl"><span style="color:'+b.color+'">'+b.name+' ('+b.range[0]+'-'+b.range[1]+' Hz)</span><span>'+fmt(b.amp,2)+'</span></div>';
      html+='<input type="range" min="0" max="2" step="0.05" value="'+b.amp+'" oninput="STATE.eeg.frequencies['+i+'].amp=parseFloat(this.value);renderLeftPanel()"></div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Channels</span><span>'+e.channels+'</span></div>';
    html+='<input type="range" min="1" max="16" step="1" value="'+e.channels+'" oninput="STATE.eeg.channels=parseInt(this.value);MODULES.eeg.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Presets</h4>';
    html+='<button class="btn full sm" onclick="eegPreset(\'awake\')">😊 Awake relaxed (alpha)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="eegPreset(\'focused\')">🧠 Focused (beta)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="eegPreset(\'drowsy\')">😴 Drowsy (theta)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="eegPreset(\'deep\')">💤 Deep sleep (delta)</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="eegPreset(\'seizure\')">⚠ Seizure activity</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>EEG frequency bands</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">Delta (0.5-4 Hz):</b> deep sleep, unconsciousness<br>'+
      '<b class="text-c1">Theta (4-8 Hz):</b> drowsiness, meditation, memory<br>'+
      '<b class="text-c1">Alpha (8-13 Hz):</b> relaxed wakefulness, eyes closed<br>'+
      '<b class="text-c1">Beta (13-30 Hz):</b> active thinking, focus<br>'+
      '<b class="text-c1">Gamma (30-80 Hz):</b> cognition, binding, attention'+
      '</div></div>'+
      '<div class="sec"><h4>Signal generation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'EEG(t) = Σ band_amp_i · sin(2π·f_i·t + φ_i) + noise<br><br>'+
      'Real EEG is a sum of population-level synaptic currents from millions of neurons. The scalp signal reflects synchronized activity, not single spikes.'+
      '</div></div>'+
      '<div class="sec"><h4>Clinical relevance</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'EEG is used for:<br>'+
      '• Epilepsy diagnosis<br>'+
      '• Sleep staging<br>'+
      '• Anesthesia monitoring<br>'+
      '• Brain-computer interfaces<br>'+
      '• Research on cognition'+
      '</div></div>';
  }
});
function eegPreset(name){
  var e=STATE.eeg;
  var presets={
    awake:{delta:0.2,theta:0.3,alpha:1.0,beta:0.3,gamma:0.1},
    focused:{delta:0.1,theta:0.2,alpha:0.3,beta:1.0,gamma:0.5},
    drowsy:{delta:0.3,theta:1.0,alpha:0.4,beta:0.2,gamma:0.1},
    deep:{delta:1.5,theta:0.3,alpha:0.1,beta:0.1,gamma:0.1},
    seizure:{delta:0.5,theta:0.8,alpha:0.3,beta:0.5,gamma:1.5}
  };
  var p=presets[name];
  e.frequencies[0].amp=p.delta;
  e.frequencies[1].amp=p.theta;
  e.frequencies[2].amp=p.alpha;
  e.frequencies[3].amp=p.beta;
  e.frequencies[4].amp=p.gamma;
  renderLeftPanel();
}

/* ================================================================
   MODULE 7: RETINA + V1
   ================================================================ */
registerModule('retina',{
  title:'Retina + V1',
  icon:'👁',
  desc:'Visual processing from photoreceptors to V1 simple cells. Difference-of-Gaussians receptive fields and orientation-selective neurons.',
  init:function(){
    var r=STATE.retina;
    var N=r.gridSize;
    r.image=new Float32Array(N*N);
    r.bipolar=new Float32Array(N*N);
    r.ganglion=new Float32Array(N*N);
    r.v1=new Float32Array(N*N);
    /* Generate test image: a diagonal stripe pattern */
    for(var y=0;y<N;y++){
      for(var x=0;x<N;x++){
        var v=Math.sin((x*0.4+y*0.4))*0.5+0.5;
        v+=(x>N/2&&y>N/2)?0.5:0;
        r.image[y*N+x]=clamp(v,0,1);
      }
    }
    this.compute();
  },
  compute:function(){
    var r=STATE.retina;
    var N=r.gridSize;
    /* Difference of Gaussians */
    var sigmaCenter=1.0;
    var sigmaSurround=2.0;
    var K=3;
    function gaussian(x,y,sigma){
      return Math.exp(-(x*x+y*y)/(2*sigma*sigma))/(2*Math.PI*sigma*sigma);
    }
    /* Compute filter kernels */
    var kernelSize=Math.ceil(K*sigmaSurround)*2+1;
    var half=Math.floor(kernelSize/2);
    /* Apply DoG */
    for(var y2=0;y2<N;y2++){
      for(var x2=0;x2<N;x2++){
        var sum=0;
        for(var dy=-half;dy<=half;dy++){
          for(var dx=-half;dx<=half;dx++){
            var nx=x2+dx,ny=y2+dy;
            if(nx<0||nx>=N||ny<0||ny>=N)continue;
            var g=gaussian(dx,dy,sigmaCenter)/gaussian(0,0,sigmaCenter)-0.5*gaussian(dx,dy,sigmaSurround)/gaussian(0,0,sigmaSurround);
            sum+=r.image[ny*N+nx]*g;
          }
        }
        r.ganglion[y2*N+x2]=clamp(sum*2+0.5,0,1);
      }
    }
    /* V1 orientation-selective filter */
    var theta=r.orientation*Math.PI/180;
    var sigma=1.5;
    var gamma=0.5;
    var wavelength=4;
    for(var y3=0;y3<N;y3++){
      for(var x3=0;x3<N;x3++){
        var sum2=0;
        for(var dy2=-K;dy2<=K;dy2++){
          for(var dx2=-K;dx2<=K;dx2++){
            var nx2=x3+dx2,ny2=y3+dy2;
            if(nx2<0||nx2>=N||ny2<0||ny2>=N)continue;
            /* Gabor */
            var xTheta=dx2*Math.cos(theta)+dy2*Math.sin(theta);
            var yTheta=-dx2*Math.sin(theta)+dy2*Math.cos(theta);
            var gabor=Math.exp(-(xTheta*xTheta+gamma*gamma*yTheta*yTheta)/(2*sigma*sigma))*Math.cos(2*Math.PI*xTheta/wavelength);
            sum2+=r.image[ny2*N+nx2]*gabor;
          }
        }
        r.v1[y3*N+x3]=clamp(sum2+0.5,0,1);
      }
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#050208';
    ctx.fillRect(0,0,W,H);
    var r=STATE.retina;
    var N=r.gridSize;
    /* Four panels: image, bipolar, ganglion, V1 */
    var size=Math.min((W-60)/2,(H-100)/2);
    var panels=[
      {data:r.image,label:'Retinal Image',color:'#40d0ff'},
      {data:r.ganglion,label:'Ganglion (DoG)',color:'#ffe040'},
      {data:null,label:'Orientation '+r.orientation+'°',color:'#40ff90'},
      {data:r.v1,label:'V1 Simple Cell',color:'#ff5080'}
    ];
    /* Draw first, second, and fourth panels */
    var positions=[
      {x:20,y:60},
      {x:40+size,y:60},
      {x:20,y:100+size},
      {x:40+size,y:100+size}
    ];
    for(var p=0;p<4;p++){
      var pos=positions[p];
      var panel=panels[p];
      var data=panel.data;
      if(p===2){
        /* Orientation wheel */
        ctx.fillStyle='rgba(20,10,32,.6)';
        ctx.beginPath();ctx.roundRect(pos.x,pos.y,size,size,6);ctx.fill();
        ctx.strokeStyle='rgba(224,96,255,.4)';
        ctx.beginPath();ctx.roundRect(pos.x,pos.y,size,size,6);ctx.stroke();
        var cx=pos.x+size/2,cy=pos.y+size/2;
        /* Draw orientation arrows for all angles */
        for(var ang=0;ang<180;ang+=15){
          var rad=ang*Math.PI/180;
          var len=size*0.4;
          var isSelected=Math.abs(ang-r.orientation)<7.5;
          ctx.strokeStyle=isSelected?'#40ff90':'rgba(64,255,144,.3)';
          ctx.lineWidth=isSelected?4:2;
          ctx.beginPath();
          ctx.moveTo(cx-Math.cos(rad)*len,cy-Math.sin(rad)*len);
          ctx.lineTo(cx+Math.cos(rad)*len,cy+Math.sin(rad)*len);
          ctx.stroke();
        }
        ctx.fillStyle='#40ff90';
        ctx.font='bold 14px monospace';
        ctx.textAlign='center';
        ctx.fillText(r.orientation+'°',cx,cy+size/2-20);
      } else if(data){
        var cellW=size/N;
        var cellH=size/N;
        for(var y=0;y<N;y++){
          for(var x=0;x<N;x++){
            var v=data[y*N+x];
            var val=Math.floor(v*255);
            ctx.fillStyle='rgb('+val+','+val+','+val+')';
            ctx.fillRect(pos.x+x*cellW,pos.y+y*cellH,cellW+0.5,cellH+0.5);
          }
        }
      }
      /* Border and label */
      ctx.strokeStyle=panel.color;
      ctx.lineWidth=2;
      ctx.strokeRect(pos.x,pos.y,size,size);
      ctx.fillStyle=panel.color;
      ctx.font='bold 11px monospace';
      ctx.textAlign='left';

function retinaStimulus(type){
  var r=STATE.retina;
  var N=r.gridSize;
  for(var y=0;y<N;y++){
    for(var x=0;x<N;x++){
      var v=0;
      if(type==='stripes'){
        v=Math.sin(x*0.8)>0?1:0;
      } else if(type==='edge'){
        v=x>N/2?1:0;
      } else if(type==='dot'){
        v=Math.hypot(x-N/2,y-N/2)<N/6?1:0;
      } else if(type==='noise'){
        v=Math.random();
      } else if(type==='rings'){
        v=(Math.sin(Math.hypot(x-N/2,y-N/2)*1.5)+1)/2;
      }
      r.image[y*N+x]=v;
    }
  }
  MODULES.retina.compute();
  renderLeftPanel();
}

registerModule('motor',{
  title:'Motor Control',
  icon:'💪',
  desc:'Stretch reflex arc with muscle spindle feedback and Golgi tendon organ. Real sensorimotor loop simulation.',
  init:function(){
    var m=STATE.motor;
    m.muscleLength=0;
    m.muscleForce=0;
    m.target=0;
    m.alpha=0;
    m.t=0;
    m.afferentPath=[];
    m.efferentPath=[];
  },
  tick:function(dt){
    var m=STATE.motor;
    if(!STATE.playing)return;
    var simDt=0.01;
    var steps=Math.min(10,Math.round(dt*100));
    for(var s=0;s<steps;s++){
      m.t+=simDt;
      /* Muscle spindle: measures stretch (length - rest length) */
      var stretch=m.muscleLength;
      m.spindleSignal=stretch*2;
      /* GTO: measures force */
      m.gtoSignal=m.muscleForce*0.5;
      /* Reflex: muscle activation = target command + spindle signal - GTO signal */
      var reflexSignal=(m.target+m.spindleSignal-m.gtoSignal)*m.reflexGain;
      m.alpha=clamp(reflexSignal,-1,1);
      /* Muscle dynamics: force = stiffness·length + alpha·activation */
      var desiredForce=m.stiffness*m.target+m.alpha*m.stiffness*0.5;
      var massAcc=(desiredForce-m.muscleForce-m.damping*m.muscleLength*10)/m.muscleMass;
      m.muscleForce+=massAcc*simDt*10;
      m.muscleLength+=m.muscleForce*simDt*0.1;
      /* Gravity-like restoring force */
      m.muscleLength-=m.muscleLength*0.05;
      m.muscleLength=clamp(m.muscleLength,-1.5,1.5);
    }
    STATE.time+=dt;
  },
