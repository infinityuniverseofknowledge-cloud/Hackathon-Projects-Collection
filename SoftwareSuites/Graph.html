  }
});

/* ================================================================
   MODULE 5: FORCE-DIRECTED LAYOUT
   ================================================================ */
registerModule('force',{
  title:'Force Layout',
  icon:'🌌',
  desc:'Fruchterman-Reingold force-directed layout. Springs pull neighbors together, Coulomb repulsion pushes all nodes apart. Watch structure emerge.',
  init:function(){
    this.generate();
    logMsg('Force layout: '+STATE.force.N+' nodes, '+STATE.force.edges.length+' edges','success');
  },
  generate:function(){
    var f=STATE.force;
    var W=CANV.W||800,H=CANV.H||600;
    f.nodes=[];
    for(var i=0;i<f.N;i++){
      f.nodes.push({
        x:rndF(0.3,0.7)*W,
        y:rndF(0.3,0.7)*H,
        vx:0,vy:0,
        id:i
      });
    }
    /* Edges: preferential attachment-ish */
    f.edges=[];
    var seen={};
    /* Chain backbone */
    for(var i=0;i<f.N-1;i++){
      f.edges.push({a:i,b:i+1});
      seen[i+'_'+(i+1)]=1;
    }
    /* Extra random edges */
    var target=f.N*f.edgesPerNode/2;
    while(f.edges.length<target){
      var a=rnd(0,f.N-1),b=rnd(0,f.N-1);
      if(a===b)continue;
      var key=Math.min(a,b)+'_'+Math.max(a,b);
      if(seen[key])continue;
      seen[key]=1;
      f.edges.push({a:a,b:b});
    }
    f.iter=0;
    f.temperature=Math.min(W,H)*0.1;
    f.running=true;
  },
  step:function(){
    var f=STATE.force;
    var W=CANV.W,H=CANV.H;
    var N=f.nodes.length;
    /* Compute repulsive forces (all pairs — O(n²)) */
    var fx=new Float32Array(N);
    var fy=new Float32Array(N);
    var k2=f.springLen*f.springLen;
    for(var i=0;i<N;i++){
      for(var j=i+1;j<N;j++){
        var dx=f.nodes[i].x-f.nodes[j].x;
        var dy=f.nodes[i].y-f.nodes[j].y;
        var d2=dx*dx+dy*dy+0.01;
        var d=Math.sqrt(d2);
        var force=k2/d*f.repulsion;
        var fx2=dx/d*force;
        var fy2=dy/d*force;
        fx[i]+=fx2;fy[i]+=fy2;
        fx[j]-=fx2;fy[j]-=fy2;
      }
    }
    /* Spring forces */
    f.edges.forEach(function(e){
      var dx=f.nodes[e.b].x-f.nodes[e.a].x;
      var dy=f.nodes[e.b].y-f.nodes[e.a].y;
      var d=Math.sqrt(dx*dx+dy*dy)+0.01;
      var force=(d-f.springLen)*f.springK;
      var fx2=dx/d*force;
      var fy2=dy/d*force;
      fx[e.a]+=fx2;fy[e.a]+=fy2;
      fx[e.b]-=fx2;fy[e.b]-=fy2;
    });
    /* Apply with temperature-limited displacement */
    var maxDisp=f.temperature;
    for(var i=0;i<N;i++){
      if(i===f.dragNode)continue;
      var disp=Math.sqrt(fx[i]*fx[i]+fy[i]*fy[i]);
      if(disp>0.001){
        var lim=Math.min(disp,maxDisp);
        f.nodes[i].x+=fx[i]/disp*lim;
        f.nodes[i].y+=fy[i]/disp*lim;
      }
      /* Bounds */
      f.nodes[i].x=clamp(f.nodes[i].x,30,W-30);
      f.nodes[i].y=clamp(f.nodes[i].y,30,H-30);
    }
    /* Cool down */
    f.temperature*=f.cooling;
    f.iter++;
    if(f.iter>f.iterations||f.temperature<0.1){
      f.running=false;
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var f=STATE.force;
    if(!STATE.playing||!f.running)return;
    /* Multiple steps per frame */
    var steps=3;
    for(var k=0;k<steps;k++){
      if(f.running)this.step();
    }
  },
  stepOnce:function(){if(STATE.force.running)this.step()},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#0a0402';
    ctx.fillRect(0,0,W,H);
    var f=STATE.force;
    if(!f.nodes.length)return;
    /* Draw edges */
    ctx.strokeStyle='rgba(255,160,64,.25)';
    ctx.lineWidth=1.5;
    f.edges.forEach(function(e){
      var n1=f.nodes[e.a],n2=f.nodes[e.b];
      ctx.beginPath();
      ctx.moveTo(n1.x,n1.y);
      ctx.lineTo(n2.x,n2.y);
      ctx.stroke();
    });
    /* Draw nodes */
    f.nodes.forEach(function(n){
      var isDrag=n===f.dragNode;
      ctx.fillStyle=isDrag?'#ffd060':'#40d0ff';
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(n.x,n.y,7,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      if(f.showLabels){
        ctx.fillStyle='#ffe0c8';
        ctx.font='8px monospace';
        ctx.textAlign='center';
        ctx.fillText(String(n.id),n.x,n.y+3);
      }
    });
    /* Info panel */
    ctx.fillStyle='rgba(28,12,8,.9)';
    ctx.strokeStyle='rgba(255,160,64,.5)';
    ctx.beginPath();ctx.roundRect(20,20,260,150,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffa040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('FRUCHTERMAN-REINGOLD',32,42);
    ctx.fillStyle='#ffe0c8';
    ctx.font='10px monospace';
    ctx.fillText('Nodes: '+f.N,32,62);
    ctx.fillText('Edges: '+f.edges.length,32,78);
    ctx.fillText('Iteration: '+f.iter+'/'+f.iterations,32,94);
    ctx.fillText('Temperature: '+fmt(f.temperature,2),32,110);
    ctx.fillText('Spring len: '+f.springLen,32,126);
    ctx.fillText('Running: '+(f.running?'yes':'no'),32,142);
    setStatsHTML(
      '<div>Nodes: '+f.N+'</div>'+
      '<div>Edges: '+f.edges.length+'</div>'+
      '<div>Iteration: '+f.iter+'</div>'+
      '<div>Temp: '+fmt(f.temperature,1)+'</div>'
    );
    updateBadge('🌌 Force layout · iter '+f.iter+'/'+f.iterations+' · T='+fmt(f.temperature,1));
    $('sbMode').textContent='Force Layout';
    $('sbNodes').textContent=f.N;
    $('sbEdges').textContent=f.edges.length;
    $('sbSteps').textContent=f.iter;
  },
  onDown:function(p){
    var f=STATE.force;
    /* Find closest node */
    var best=null,bestD=Infinity;
    for(var i=0;i<f.nodes.length;i++){
      var d=Math.hypot(f.nodes[i].x-p.x,f.nodes[i].y-p.y);
      if(d<bestD){bestD=d;best=f.nodes[i]}
    }
    if(bestD<20)f.dragNode=best;
  },
  onMove:function(p){
    var f=STATE.force;
    if(!INPUT.down||!f.dragNode)return;
    f.dragNode.x=p.x;
    f.dragNode.y=p.y;
    /* Poke physics */
    f.temperature=Math.max(f.temperature,20);
    f.running=true;
  },
  onUp:function(){STATE.force.dragNode=null;},
  controls:function(){
    var f=STATE.force;
    var html='';
    html+='<div class="sec"><h4>Graph</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Nodes</span><span>'+f.N+'</span></div>';
    html+='<input type="range" min="10" max="80" step="2" value="'+f.N+'" oninput="STATE.force.N=parseInt(this.value);MODULES.force.generate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Edges per node</span><span>'+fmt(f.edgesPerNode,1)+'</span></div>';
    html+='<input type="range" min="1.5" max="5" step="0.1" value="'+f.edgesPerNode+'" oninput="STATE.force.edgesPerNode=parseFloat(this.value);MODULES.force.generate();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Physics</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Spring length</span><span>'+f.springLen+'</span></div>';
    html+='<input type="range" min="30" max="200" step="5" value="'+f.springLen+'" oninput="STATE.force.springLen=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Repulsion</span><span>'+fmt(f.repulsion,2)+'</span></div>';
    html+='<input type="range" min="0.2" max="3" step="0.1" value="'+f.repulsion+'" oninput="STATE.force.repulsion=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Spring K</span><span>'+fmt(f.springK,3)+'</span></div>';
    html+='<input type="range" min="0.01" max="0.2" step="0.005" value="'+f.springK+'" oninput="STATE.force.springK=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Cooling</span><span>'+fmt(f.cooling,3)+'</span></div>';
    html+='<input type="range" min="0.9" max="0.999" step="0.001" value="'+f.cooling+'" oninput="STATE.force.cooling=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.force.generate()">🎲 New graph</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.force._poke()">♨️ Reheat</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Interaction</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      'Clique e arraste um nó para reposicioná-lo. A temperatura aumenta e o layout se reajusta.'
    '</div></div>';
    return html;
  },
  _poke:function(){STATE.force.temperature=Math.min(CANV.W,CANV.H)*0.1;STATE.force.running=true;STATE.force.iter=0},
  mathPanel:function(){
    var f=STATE.force;
    return '<div class="sec"><h4>Force model</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '<b style="color:var(--c1)">Repulsion</b> (all pairs):<br>'+
      'F_rep = k²/d<br><br>'+
      '<b style="color:var(--c1)">Attraction</b> (edges only):<br>'+
      'F_att = (d − k)·s<br><br>'+
      'where k = optimal distance, s = spring constant'+
      '</div></div>'+
      '<div class="sec"><h4>Annealing</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Movement limited by "temperature" T:<br>'+
      '|Δp| ≤ min(|F|, T)<br><br>'+
      'T ← T·cooling each iteration. Forces vanish as T → 0.'+
      '</div></div>'+
      '<div class="sec"><h4>Energy interpretation</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'System minimizes:<br>'+
      'E = Σ_edges (d − k)² − Σ_pairs k²·log(d)<br><br>'+
      'Local minimum = readable layout. Force-directed layouts are approximate — global optimum is NP-hard.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Nodes</span><span class="v">'+f.N+'</span></div>'+
      '<div class="row"><span class="k">Edges</span><span class="v">'+f.edges.length+'</span></div>'+
      '<div class="row"><span class="k">Iteration</span><span class="v">'+f.iter+'</span></div>'+
      '<div class="row"><span class="k">Temperature</span><span class="v">'+fmt(f.temperature,2)+'</span></div>'+
      '</div></div>';
  }
});

document.addEventListener('keydown',function(e){

/* Animated boot graph */
function animateBootGraph(){
  var bc=$('bootGraph');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  /* Random node cloud */
  var nodes=[];
  for(var i=0;i<40;i++)nodes.push({x:Math.random()*bc.width,y:Math.random()*bc.height,vx:rndF(-0.3,0.3),vy:rndF(-0.3,0.3)});
  /* Edges: nearest neighbors */
  var edges=[];
  for(var i=0;i<nodes.length;i++){
    var ds=[];
    for(var j=0;j<nodes.length;j++){if(i!==j)ds.push({j:j,d:Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y)})}
    ds.sort(function(a,b){return a.d-b.d});
    for(var k=0;k<2;k++)edges.push({a:i,b:ds[k].j});
  }
  var t0=performance.now();
  function frame(){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    bctx.fillStyle='#100604';
    bctx.fillRect(0,0,bc.width,bc.height);
    /* Update nodes */
    nodes.forEach(function(n){
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>bc.width)n.vx*=-1;
      if(n.y<0||n.y>bc.height)n.vy*=-1;
    });
    /* Draw edges */
    bctx.strokeStyle='rgba(255,160,64,.15)';
    bctx.lineWidth=1;
    edges.forEach(function(e){
      var n1=nodes[e.a],n2=nodes[e.b];
      bctx.beginPath();bctx.moveTo(n1.x,n1.y);bctx.lineTo(n2.x,n2.y);bctx.stroke();
    });
    /* Draw nodes */
    nodes.forEach(function(n){
      bctx.fillStyle='rgba(255,160,64,.4)';
      bctx.beginPath();bctx.arc(n.x,n.y,3,0,Math.PI*2);bctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
}

var BOOT_STEPS=[
  'Compiling priority queue for A*...',

  'Building BFS residual graph for Edmonds-Karp...',
  'Initializing DSATUR saturation counts...',
  'Setting up Fruchterman-Reingold force model...',

];
function bootSequence(){

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('GRAPH initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='computing';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});
