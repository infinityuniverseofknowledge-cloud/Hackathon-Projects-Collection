<script>
/* ================================================================
   MODULE 8: INEQUALITY
   ================================================================ */
registerModule('inequality',{
  title:'Inequality',
  icon:'⚖️',
  desc:'Wealth distribution dynamics. Gini coefficient, Lorenz curve, redistribution, and wealth tax.',
  init:function(){
    var ine=STATE.inequality;
    ine.wealth=[];
    for(var i=0;i<ine.numAgents;i++)ine.wealth.push(rndF(0.5,1.5));
    /* Normalize */
    var sum=ine.wealth.reduce(function(a,b){return a+b},0);
    ine.wealth=ine.wealth.map(function(w){return w/sum});
    ine.steps=0;
    ine.history=[];
    ine.gini=gini(ine.wealth);
  },
  tick:function(dt){
    var ine=STATE.inequality;
    if(!ine.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*50));
    for(var st=0;st<steps;st++){
      /* Random transactions */
      for(var k=0;k<ine.numAgents*ine.transactionRate; k++){
        var i=rnd(0,ine.numAgents-1);
        var j=rnd(0,ine.numAgents-1);
        if(i===j)continue;
        /* Transaction size proportional to smaller wealth */
        var amount=ine.wealth[Math.min(i,j)]*rndF(0.01,0.1);
        if(ine.wealth[i]>=amount){
          ine.wealth[i]-=amount;
          ine.wealth[j]+=amount;
        }
      }
      /* Wealth tax + redistribution */
      if(ine.wealthTax>0){
        var collected=0;
        for(var i2=0;i2<ine.numAgents;i2++){
          var tax=ine.wealth[i2]*ine.wealthTax*0.01;
          ine.wealth[i2]-=tax;
          collected+=tax;
        }
        var perCapita=collected/ine.numAgents;
        for(var i3=0;i3<ine.numAgents;i3++)ine.wealth[i3]+=perCapita;
      }
      ine.steps++;
    }
    ine.gini=gini(ine.wealth);
    ine.history.push({step:ine.steps,gini:ine.gini});
    STATE.time+=dt;
    $('sbStep').textContent=ine.steps;
    $('sbVal').textContent='G='+fmt(ine.gini,3);
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var ine=STATE.inequality;
    /* Header */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('⚖️ WEALTH INEQUALITY',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Gini = '+fmt(ine.gini,4)+' · '+ine.numAgents+' agents · step '+ine.steps,W/2,56);
    /* Lorenz curve */
    var lx=60,ly=90;
    var lw=Math.min((W-140)/2,H-200);
    var lh=lw;
    ctx.fillStyle='rgba(18,18,30,.4)';
    ctx.strokeStyle='rgba(255,224,80,.3)';
    ctx.beginPath();ctx.roundRect(lx,ly,lw,lh,8);ctx.fill();ctx.stroke();
    /* Perfect equality line */
    ctx.strokeStyle='rgba(80,208,255,.5)';
    ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.moveTo(lx,ly+lh);
    ctx.lineTo(lx+lw,ly);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Lorenz curve */
    var points=lorenzCurve(ine.wealth);
    ctx.strokeStyle='#ffe050';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    points.forEach(function(p,i){
      var px=lx+p.x*lw;
      var py=ly+lh-p.y*lh;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.stroke();
    /* Fill area (inequality) */
    ctx.fillStyle='rgba(255,224,80,.1)';
    ctx.beginPath();
    ctx.moveTo(lx,ly+lh);
    points.forEach(function(p){
      ctx.lineTo(lx+p.x*lw,ly+lh-p.y*lh);
    });
    ctx.lineTo(lx+lw,ly);
    ctx.closePath();
    ctx.fill();
    /* Labels */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('LORENZ CURVE',lx+10,ly+20);
    ctx.fillStyle='#b0b0e0';
    ctx.font='10px monospace';
    ctx.fillText('x: population %',lx+10,ly+lh-20);
    ctx.save();
    ctx.translate(lx+12,ly+lh/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('wealth %',0,0);
    ctx.restore();
    /* Gini chart */
    var gx=lx+lw+40,gy=ly;
    var gw=lw,gh=lh;
    ctx.fillStyle='rgba(18,18,30,.4)';
    ctx.strokeStyle='rgba(80,255,144,.3)';
    ctx.beginPath();ctx.roundRect(gx,gy,gw,gh,8);ctx.fill();ctx.stroke();
    /* Gini over time */
    if(ine.history.length>1){
      var maxG=Math.max(0.5,Math.max.apply(null,ine.history.map(function(h){return h.gini})));
      ctx.strokeStyle='#50ff90';
      ctx.lineWidth=2;
      ctx.beginPath();
      ine.history.forEach(function(h,i){
        var px=gx+(i/(ine.history.length-1))*gw;
        var py=gy+gh-(h.gini/maxG)*gh*0.9-gh*0.05;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      });
      ctx.stroke();
    }
    /* Info */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('GINI OVER TIME',gx+10,gy+20);
    /* Top 10% share */
    var sorted=ine.wealth.slice().sort(function(a,b){return b-a});
    var top10=sorted.slice(0,Math.floor(ine.numAgents*0.1)).reduce(function(a,b){return a+b},0);
    var bot50=sorted.slice(-Math.floor(ine.numAgents*0.5)).reduce(function(a,b){return a+b},0);
    var infoY=ly+lh+20;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(255,224,80,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.fillText('DISTRIBUTION',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Top 10% owns: '+fmt(top10*100,1)+'% of wealth',60,infoY+48);
    ctx.fillText('Bottom 50% owns: '+fmt(bot50*100,1)+'% of wealth',60,infoY+68);
    ctx.fillText('Gini coefficient: '+fmt(ine.gini,4)+'  (0=perfect equality, 1=perfect inequality)',60,infoY+88);
    setStatsHTML(
      '<div>Gini: '+fmt(ine.gini,4)+'</div>'+
      '<div>Top 10%: '+fmt(top10*100,1)+'%</div>'+
      '<div>Bottom 50%: '+fmt(bot50*100,1)+'%</div>'+
      '<div>Step: '+ine.steps+'</div>'
    );
    updateBadge('⚖️ Inequality · Gini '+fmt(ine.gini,3));
    $('sbMode').textContent='Inequality';
    $('sbVal').textContent='G='+fmt(ine.gini,3);
  },
  onDown:function(){},
  controls:function(){
    var ine=STATE.inequality;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(ine.running?'danger':'primary')+' full" onclick="STATE.inequality.running=!STATE.inequality.running;renderLeftPanel()">'+(ine.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.inequality.init();renderLeftPanel()">↺ Reset</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Transaction rate</span><span>'+fmt(ine.transactionRate,2)+'</span></div>';
    html+='<input type="range" min="0.1" max="2" step="0.05" value="'+ine.transactionRate+'" oninput="STATE.inequality.transactionRate=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Wealth tax %</span><span>'+fmt(ine.wealthTax,2)+'</span></div>';
    html+='<input type="range" min="0" max="2" step="0.05" value="'+ine.wealthTax+'" oninput="STATE.inequality.wealthTax=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Agents</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Number</span><span>'+ine.numAgents+'</span></div>';
    html+='<input type="range" min="100" max="2000" step="100" value="'+ine.numAgents+'" oninput="STATE.inequality.numAgents=parseInt(this.value);MODULES.inequality.init();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var ine=STATE.inequality;
    return '<div class="sec"><h4>Gini Coefficient</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'G = Σᵢ Σⱼ |xᵢ − xⱼ| / (2n²μ)<br><br>'+
      'Or from Lorenz curve: G = 1 − 2·∫L(F)dF<br><br>'+
      'G=0: perfect equality<br>'+
      'G=1: perfect inequality'+
      '</div></div>'+
      '<div class="sec"><h4>Empirical values</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '• Sweden: 0.27<br>'+
      '• Germany: 0.32<br>'+
      '• USA: 0.41<br>'+
      '• Brazil: 0.53<br>'+
      '• South Africa: 0.63'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Gini</span><span class="v">'+fmt(ine.gini,4)+'</span></div>'+
      '<div class="row"><span class="k">Wealth tax</span><span class="v">'+fmt(ine.wealthTax,2)+'%</span></div>'+
      '<div class="row"><span class="k">Step</span><span class="v">'+ine.steps+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 9: COOPERATION / PUBLIC GOODS
   ================================================================ */
registerModule('cooperation',{
  title:'Public Goods Game',
  icon:'🤝',
  desc:'Tragedy of the commons. Watch cooperation collapse or thrive under punishment and reputation.',
  init:function(){
    var c=STATE.cooperation;
    c.contributions=[];
    for(var i=0;i<c.numAgents;i++)c.contributions.push(Math.random()<0.5?1:0);
    c.steps=0;
    c.history=[{step:0,avg:mean(c.contributions),coop:c.contributions.filter(function(x){return x>0}).length/c.numAgents}];
    c.avgContribution=mean(c.contributions);
  },
  tick:function(dt){
    var c=STATE.cooperation;
    if(!c.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*10));
    for(var st=0;st<steps;st++){
      /* Public goods game: each agent contributes 0 or 1 to public pool
         Pool multiplied by multiplier, distributed equally */
      var totalContributed=c.contributions.reduce(function(a,b){return a+b},0);
      var pool=totalContributed*c.multiplier;
      var perCapita=pool/c.numAgents;
      /* Payoff: contributed contribution, received perCapita */
      var payoffs=c.contributions.map(function(contrib){
        return perCapita-contrib;
      });
      /* If punishment enabled: defectors pay fine to cooperators */
      if(c.allowPunishment){
        var defectors=c.contributions.filter(function(x){return x===0}).length;
        if(defectors>0&&defectors<c.numAgents){
          c.contributions.forEach(function(contrib,i){
            if(contrib===0)payoffs[i]-=c.punishmentFine;
            else payoffs[i]+=c.punishmentFine*defectors/(c.numAgents-defectors);
          });
        }
      }
      /* Imitation: each agent copies strategy of a random neighbor if they're doing better */
      var newContrib=c.contributions.slice();
      for(var i=0;i<c.numAgents;i++){
        var j=rnd(0,c.numAgents-1);
        if(payoffs[j]>payoffs[i]){
          /* Copy with high probability */
          if(Math.random()<0.7)newContrib[i]=c.contributions[j];
        }
      }
      c.contributions=newContrib;
      c.steps++;
    }
    c.avgContribution=mean(c.contributions);
    var coop=c.contributions.filter(function(x){return x>0}).length/c.numAgents;
    c.history.push({step:c.steps,avg:c.avgContribution,coop:coop});
    STATE.time+=dt;
    $('sbStep').textContent=c.steps;
    $('sbVal').textContent=fmt(c.avgContribution,3);
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var c=STATE.cooperation;
    /* Header */
    ctx.fillStyle='#50ffd0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🤝 PUBLIC GOODS GAME',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText(c.numAgents+' agents · multiplier '+c.multiplier+' · step '+c.steps,W/2,56);
    /* Grid of agents */
    var cols=Math.ceil(Math.sqrt(c.numAgents));
    var cellSize=Math.min((W-80)/cols,(H*0.5)/cols);
    var ox=(W-cols*cellSize)/2;
    var oy=100;
    c.contributions.forEach(function(contrib,i){
      var col=i%cols;
      var row=Math.floor(i/cols);
      var px=ox+col*cellSize;
      var py=oy+row*cellSize;
      ctx.fillStyle=contrib>0?'#50ffd0':'#ff5080';
      ctx.fillRect(px+1,py+1,cellSize-2,cellSize-2);
    });
    /* Stats */
    var coop=c.contributions.filter(function(x){return x>0}).length/c.numAgents;
    var infoY=oy+cols*cellSize+20;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(80,255,208,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50ffd0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('COOPERATION STATE',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Cooperators: '+fmt(coop*100,1)+'%  Defectors: '+fmt((1-coop)*100,1)+'%',60,infoY+48);
    ctx.fillText('Average contribution: '+fmt(c.avgContribution,3),60,infoY+68);
    ctx.fillText('Multiplier: '+fmt(c.multiplier,2)+(c.allowPunishment?' · Punishment ON':''),60,infoY+88);
    setStatsHTML(
      '<div>Cooperators: '+fmt(coop*100,1)+'%</div>'+
      '<div>Avg contribution: '+fmt(c.avgContribution,3)+'</div>'+
      '<div>Multiplier: '+fmt(c.multiplier,2)+'</div>'+
      '<div>Step: '+c.steps+'</div>'
    );
    updateBadge('🤝 Public Goods · '+fmt(coop*100,1)+'% cooperate');
    $('sbMode').textContent='Public Goods';
  },
  onDown:function(){},
  controls:function(){
    var c=STATE.cooperation;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(c.running?'danger':'primary')+' full" onclick="STATE.cooperation.running=!STATE.cooperation.running;renderLeftPanel()">'+(c.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.cooperation.init();renderLeftPanel()">↺ Reset</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Multiplier</span><span>'+fmt(c.multiplier,2)+'</span></div>';
    html+='<input type="range" min="1" max="5" step="0.1" value="'+c.multiplier+'" oninput="STATE.cooperation.multiplier=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Allow punishment</span><div class="chip '+(c.allowPunishment?'active':'')+'" onclick="STATE.cooperation.allowPunishment=!STATE.cooperation.allowPunishment;renderLeftPanel()">'+(c.allowPunishment?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Punishment fine</span><span>'+fmt(c.punishmentFine,2)+'</span></div>';
    html+='<input type="range" min="0" max="2" step="0.1" value="'+c.punishmentFine+'" oninput="STATE.cooperation.punishmentFine=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Agents</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Number</span><span>'+c.numAgents+'</span></div>';
    html+='<input type="range" min="25" max="400" step="25" value="'+c.numAgents+'" oninput="STATE.cooperation.numAgents=parseInt(this.value);MODULES.cooperation.init();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.cooperation;
    return '<div class="sec"><h4>Public Goods Game</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Each player decides: contribute c ∈ {0,1} to public pool.<br><br>'+
      'Pool = multiplier × Σ contributions<br>'+
      'Payoff_i = Pool/N − c_i<br><br>'+
      'Nash equilibrium: everyone defects (c=0)<br>'+
      'Social optimum: everyone cooperates (c=1) if multiplier > 1'+
      '</div></div>'+
      '<div class="sec"><h4>Tragedy of the Commons</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Hardin (1968): individuals acting rationally in their own interest deplete shared resources, even when it\'s against everyone\'s long-term interest.<br><br>'+
      'Elinor Ostrom won Nobel Prize 2009 for showing communities can self-govern. Solutions: punishment, reputation, communication, monitoring.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Multiplier</span><span class="v">'+fmt(c.multiplier,2)+'</span></div>'+
      '<div class="row"><span class="k">Avg contribution</span><span class="v">'+fmt(c.avgContribution,3)+'</span></div>'+
      '<div class="row"><span class="k">Punishment</span><span class="v">'+(c.allowPunishment?'on':'off')+'</span></div>'+
      '<div class="row"><span class="k">Step</span><span class="v">'+c.steps+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 10: TRAFFIC (Nagel-Schreckenberg)
   ================================================================ */
registerModule('traffic',{
  title:'Traffic',
  icon:'🚗',
  desc:'Nagel-Schreckenberg cellular automaton. Watch traffic jams form from nothing — a self-organized phenomenon.',
  init:function(){
    var t=STATE.traffic;
    t.cars=[];
    var numCars=Math.floor(t.roadLength*t.density);
    var positions=[];
    for(var i=0;i<numCars;i++)positions.push(i*t.roadLength/numCars);
    positions.forEach(function(pos,i){
      t.cars.push({pos:Math.floor(pos),v:rnd(0,t.maxSpeed)});
    });
    t.steps=0;
    t.history=[];
  },
  tick:function(dt){
    var t=STATE.traffic;
    if(!t.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*20));
    for(var st=0;st<steps;st++){
      t.cars=nschStep(t.cars,t.roadLength,t.maxSpeed,t.pBrake);
      t.steps++;
    }
    /* Compute stats */
    t.avgSpeed=mean(t.cars.map(function(c){return c.v}));
    t.flow=t.avgSpeed*t.density;
    t.history.push({step:t.steps,avgSpeed:t.avgSpeed,flow:t.flow});
    STATE.time+=dt;
    $('sbStep').textContent=t.steps;
    $('sbVal').textContent=fmt(t.avgSpeed,2);
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var t=STATE.traffic;
    /* Header */
    ctx.fillStyle='#ffa040';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🚗 TRAFFIC FLOW (Nagel-Schreckenberg)',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('density='+fmt(t.density,2)+' · vmax='+t.maxSpeed+' · p_brake='+fmt(t.pBrake,2)+' · step '+t.steps,W/2,56);
    /* Road */
    var roadY=H*0.35;
    var roadH=40;
    var roadX=40;
    var roadW=W-80;
    ctx.fillStyle='rgba(40,40,80,.6)';
    ctx.fillRect(roadX,roadY,roadW,roadH);
    /* Center line */
    ctx.strokeStyle='rgba(255,224,80,.3)';
    ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(roadX,roadY+roadH/2);ctx.lineTo(roadX+roadW,roadY+roadH/2);ctx.stroke();

registerModule('trade',{
  title:'Trade Networks',
  icon:'⚓',
  desc:'Ricardian comparative advantage. Countries specialize and trade for mutual benefit.',
  init:function(){
    var t=STATE.trade;
    t.countries=[];
    for(var i=0;i<t.numCountries;i++){
      t.countries.push({
        name:'Country '+(i+1),
        laborHours:100,
        prodA:rndF(0.5,3),
        prodB:rndF(0.5,3),
        stockA:0,
        stockB:0,
        color:['#ff7050','#50d0ff','#ffe050','#50ff90','#a060ff','#ff5080'][i%6]
      });
    }
    t.steps=0;
    t.history=[];
  },
  tick:function(dt){
    var t=STATE.trade;
    if(!t.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*5));
    for(var st=0;st<steps;st++){
      /* Each country produces according to comparative advantage */
      /* Find opportunity cost */
      t.countries.forEach(function(c){
        var oc = c.prodA/c.prodB; /* Opportunity cost of A in terms of B */
        if(oc < 1){
          /* Specialize in A */
          c.stockA += c.prodA*10;
        } else {
          /* Specialize in B */
          c.stockB += c.prodB*10;
        }
      });
      /* Trade: countries with surplus trade for what they lack */
      for(var i=0;i<t.countries.length;i++){
        for(var j=i+1;j<t.countries.length;j++){
          var c1=t.countries[i],c2=t.countries[j];
          /* If c1 has surplus A and lacks B, trade with c2 */
          if(c1.stockA>c1.stockB&&c2.stockB>c2.stockA){
            var tradeA=Math.min(c1.stockA*0.1,c2.stockA*0.1+1);
            var tradeB=tradeA*1.2;
            if(c2.stockB>=tradeB){
              c1.stockA-=tradeA;
              c1.stockB+=tradeB;
              c2.stockB-=tradeB;
              c2.stockA+=tradeA;
            }
          } else if(c1.stockB>c1.stockA&&c2.stockA>c2.stockB){
            var tradeA2=Math.min(c2.stockA*0.1,c1.stockA*0.1+1);
            var tradeB2=tradeA2*1.2;
            if(c1.stockB>=tradeB2){
              c2.stockA-=tradeA2;
              c2.stockB+=tradeB2;
              c1.stockB-=tradeB2;
              c1.stockA+=tradeA2;
            }
          }
        }
      }
      t.steps++;
    }
    STATE.time+=dt;
    $('sbStep').textContent=t.steps;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var t=STATE.trade;
    /* Header */
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('⚓ TRADE NETWORKS',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Ricardian comparative advantage · step '+t.steps,W/2,56);
    /* Countries as circles */
    var cx=W/2,cy=H*0.45;
    var R=Math.min(W,H)*0.3;
    t.countries.forEach(function(c,i){
      var angle=(i/t.countries.length)*Math.PI*2-Math.PI/2;
      var x=cx+Math.cos(angle)*R;
      var y=cy+Math.sin(angle)*R;
      c.px=x;c.py=y;
      /* Circle */
      ctx.fillStyle=c.color+'30';
      ctx.strokeStyle=c.color;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();ctx.stroke();
      /* Name */
      ctx.fillStyle=c.color;
      ctx.font='bold 11px monospace';
      ctx.textAlign='center';
      ctx.fillText('C'+(i+1),x,y+4);
      /* Production info */
      ctx.fillStyle='#b0b0e0';
      ctx.font='9px monospace';
      ctx.fillText('A:'+fmt(c.prodA,1)+' B:'+fmt(c.prodB,1),x,y+48);
    });
    /* Trade edges between all pairs, thickness by volume */
    for(var i=0;i<t.countries.length;i++){
      for(var j=i+1;j<t.countries.length;j++){
        var c1=t.countries[i],c2=t.countries[j];
        var balance=Math.abs(c1.stockA-c1.stockB)+Math.abs(c2.stockA-c2.stockB);
        ctx.strokeStyle='rgba(80,208,255,'+Math.min(0.5,balance*0.005)+')';
        ctx.lineWidth=Math.min(4,balance*0.05);
        ctx.beginPath();
        ctx.moveTo(c1.px,c1.py);
        ctx.lineTo(c2.px,c2.py);
        ctx.stroke();
      }
    }
    /* Info */
    var infoY=H*0.75;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(80,208,255,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('TRADE STATE',60,infoY+24);
    /* Sorted by total wealth */
    var sorted=t.countries.slice().sort(function(a,b){
      return (b.stockA+b.stockB)-(a.stockA+a.stockB);
    });
    sorted.slice(0,4).forEach(function(c,i){
      var total=c.stockA+c.stockB;
      ctx.fillStyle=c.color;
      ctx.font='11px monospace';
      ctx.fillText(c.name+': A='+fmt(c.stockA,0)+' B='+fmt(c.stockB,0)+' · Total='+fmt(total,0),60,infoY+48+i*20);
    });
    setStatsHTML(
      '<div>Countries: '+t.numCountries+'</div>'+
      '<div>Step: '+t.steps+'</div>'+
      '<div>Richest: '+(sorted[0]?sorted[0].name:'—')+'</div>'
    );
    updateBadge('⚓ Trade · step '+t.steps);
    $('sbMode').textContent='Trade Networks';
  },
  onDown:function(){},
  controls:function(){
    var t=STATE.trade;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(t.running?'danger':'primary')+' full" onclick="STATE.trade.running=!STATE.trade.running;renderLeftPanel()">'+(t.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.trade.init();renderLeftPanel()">🎲 New countries</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Countries</h4>';
    t.countries.forEach(function(c,i){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:2px;font-family:var(--mono);font-size:.6rem;border-left:3px solid '+c.color+'">';
      html+='<div style="color:'+c.color+';font-weight:600">'+c.name+'</div>';
      html+='<div style="color:var(--tx3)">Prod: A='+fmt(c.prodA,2)+', B='+fmt(c.prodB,2)+' | Stock: A='+fmt(c.stockA,0)+', B='+fmt(c.stockB,0)+'</div>';
      html+='</div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var t=STATE.trade;
    return '<div class="sec"><h4>Comparative Advantage</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'David Ricardo (1817): even if one country is absolutely better at producing everything, both benefit from trade if they specialize according to comparative advantage.<br><br>'+
      'Opportunity cost of good A = production of B / production of A<br><br>'+
      'Country with LOWER opportunity cost specializes in A.'+
      '</div></div>'+
      '<div class="sec"><h4>Gains from trade</h4>'+

      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+

  }

registerModule('taxation',{
  title:'Taxation',
  icon:'💰',
  desc:'Design a tax system. Adjust brackets and rates, see revenue, Gini, and behavioral effects.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var t=STATE.taxation;
    /* Generate log-normal income distribution */
    var n=10000;
    var income=[];
    var rng=makeRNG(12345);
    for(var i=0;i<n;i++){
      /* Box-Muller */
      var u=0,v=0;
      while(u===0)u=rng();
      while(v===0)v=rng();
      var z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
      income.push(Math.exp(0.6*z+10)); /* mean ~ e^10 ≈ 22000 */
    }
    t.incomeDistribution=income;
    /* Compute taxes */
    var afterTax=[];
    var totalRevenue=0;
    income.forEach(function(inc){
      var tax=0;
      for(var b=t.numBrackets-1;b>=0;b--){
        if(inc>t.thresholds[b]){
          tax+=(inc-t.thresholds[b])*t.rates[b]/100;
          inc=t.thresholds[b];
        }
      }
      totalRevenue+=tax;
      afterTax.push(income[afterTax.length]+0); /* wrong index bug fix below */
    });
    /* Correct */
    afterTax=[];
    totalRevenue=0;
    income.forEach(function(inc){
      var tax=0;
      var taxable=inc;
      for(var b=t.numBrackets-1;b>=0;b--){
        if(taxable>t.thresholds[b]){
          tax+=(taxable-t.thresholds[b])*t.rates[b]/100;
          taxable=t.thresholds[b];
        }
      }
      totalRevenue+=tax;
      afterTax.push(inc-tax);
    });
    /* Add UBI */
    if(t.universalBasicIncome>0){
      for(var i=0;i<afterTax.length;i++)afterTax[i]+=t.universalBasicIncome;
      totalRevenue-=t.universalBasicIncome*afterTax.length;
    }
    t.totalRevenue=totalRevenue;
    t.giniBefore=gini(income);
    t.giniAfter=gini(afterTax);
    t.results={
      avgIncome:mean(income),
      avgAfterTax:mean(afterTax),
      avgTax:mean(income.map(function(inc,i){return inc-afterTax[i];})),
      totalRevenue:totalRevenue
    };
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var t=STATE.taxation;
    /* Header */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('💰 TAX SYSTEM DESIGN',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText(t.numBrackets+' brackets · revenue '+fmt(t.totalRevenue/1e9,2)+'B',W/2,56);
    /* Income distribution */
    var distY=90;
    var distH=140;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(255,224,80,.4)';
    ctx.beginPath();ctx.roundRect(40,distY,W-80,distH,8);ctx.fill();ctx.stroke();
    /* Histogram */
    var bins=50;
    var binCounts=new Array(bins).fill(0);
    var maxIncome=200000;
    t.incomeDistribution.forEach(function(inc){
      var bin=Math.min(bins-1,Math.floor(inc/maxIncome*bins));
      binCounts[bin]++;
    });
    var maxCount=Math.max.apply(null,binCounts);
    var bw=(W-100)/bins;
    for(var b=0;b<bins;b++){
      var bh=(binCounts[b]/maxCount)*(distH-40);
      ctx.fillStyle='#ffe050';
      ctx.fillRect(50+b*bw,distY+distH-bh-20,bw-1,bh);
    }
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('INCOME DISTRIBUTION',60,distY+16);
    /* Bracket visualization */
    var brY=distY+distH+20;
    var brH=80;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,208,255,.4)';
    ctx.beginPath();ctx.roundRect(40,brY,W-80,brH,8);ctx.fill();ctx.stroke();
    var bwx=(W-120)/t.numBrackets;
    var colors=['#50ff90','#50d0ff','#ffe050','#ffa040','#ff5080','#a060ff','#ff40c0'];
    t.rates.forEach(function(rate,i){
      var bx=60+i*bwx;

    });
    /* Info */
    var infoY=brY+brH+20;

    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();

    ctx.font='11px monospace';
    ctx.fillText('Total revenue: '+fmt(t.totalRevenue/1e9,2)+'B credits',60,infoY+48);
    ctx.fillText('Avg income before tax: '+fmt(t.results.avgIncome,0),60,infoY+68);
    ctx.fillText('Avg after tax: '+fmt(t.results.avgAfterTax,0),60,infoY+88);
    ctx.fillText('Gini before: '+fmt(t.giniBefore,3)+' → after: '+fmt(t.giniAfter,3),60,infoY+108);
    setStatsHTML(
      '<div>Revenue: '+fmt(t.totalRevenue/1e9,2)+'B</div>'+
      '<div>Gini before: '+fmt(t.giniBefore,3)+'</div>'+
      '<div>Gini after: '+fmt(t.giniAfter,3)+'</div>'+

registerModule('culture',{
  title:'Cultural Evolution',
  icon:'🎭',
  desc:'Axelrod model of cultural dissemination. Watch cultural regions form, boundaries emerge, and diversity stabilize.',
  init:function(){
    var c=STATE.culture;
    c.grid=[];
    c.gridSize=20;
    for(var i=0;i<c.gridSize*c.gridSize;i++){
      var cell=[];
      for(var f=0;f<c.numFeatures;f++){
        cell.push(rnd(0,c.numTraits-1));
      }
      c.grid.push(cell);
    }
    c.steps=0;
    c.history=[];
    c.numRegions=c.gridSize*c.gridSize;
  },
  similarity:function(a,b){
    var s=0;
    for(var i=0;i<a.length;i++)if(a[i]===b[i])s++;
    return s/a.length;
  },
  tick:function(dt){
    var c=STATE.culture;
    if(!c.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*30));
    for(var st=0;st<steps;st++){
      /* Pick random agent */
      var i=rnd(0,c.grid.length-1);
      var x=i%c.gridSize;
      var y=Math.floor(i/c.gridSize);
      /* Pick random neighbor */
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      var d=dirs[rnd(0,3)];
      var nx=x+d[0],ny=y+d[1];
      if(nx<0||nx>=c.gridSize||ny<0||ny>=c.gridSize)continue;
      var j=ny*c.gridSize+nx;
      /* Interact with probability proportional to similarity */
      var sim=this.similarity(c.grid[i],c.grid[j]);
      if(Math.random()<sim&&sim<1){
        /* Make more similar: pick a feature where they differ and copy */
        var diffs=[];
        for(var f=0;f<c.numFeatures;f++)if(c.grid[i][f]!==c.grid[j][f])diffs.push(f);
        if(diffs.length>0){
          var feat=diffs[rnd(0,diffs.length-1)];
          c.grid[i][feat]=c.grid[j][feat];
        }
      }
      c.steps++;
    }
    /* Count regions */
    c.numRegions=this.countRegions();
    c.history.push({step:c.steps,regions:c.numRegions});
    STATE.time+=dt;
    $('sbStep').textContent=c.steps;
    $('sbVal').textContent=c.numRegions;
  },
  countRegions:function(){
    var c=STATE.culture;
    var visited=new Array(c.grid.length).fill(false);
    var regions=0;
    for(var i=0;i<c.grid.length;i++){
      if(visited[i])continue;
      regions++;
      /* BFS */
      var queue=[i];
      visited[i]=true;
      while(queue.length){
        var cur=queue.shift();
        var x=cur%c.gridSize;
        var y=Math.floor(cur/c.gridSize);
        var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        dirs.forEach(function(d){
          var nx=x+d[0],ny=y+d[1];
          if(nx<0||nx>=c.gridSize||ny<0||ny>=c.gridSize)return;
          var nIdx=ny*c.gridSize+nx;
          if(visited[nIdx])return;
          /* Same region if identical culture */
          if(this.similarity(c.grid[cur],c.grid[nIdx])===1){
            visited[nIdx]=true;
            queue.push(nIdx);
          }
        },this);
      }
    }
    return regions;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var c=STATE.culture;
    /* Header */
    ctx.fillStyle='#ff40c0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🎭 CULTURAL EVOLUTION',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Axelrod model · '+c.numRegions+' regions · step '+c.steps,W/2,56);
    /* Grid */
    var gridSize=Math.min(W,H*0.75)-100;
    var cellSize=gridSize/c.gridSize;
    var ox=(W-gridSize)/2;
    var oy=80;
    for(var y=0;y<c.gridSize;y++){
      for(var x=0;x<c.gridSize;x++){
        var cell=c.grid[y*c.gridSize+x];
        /* Convert culture to color */
        var r=0,g=0,b=0;
        for(var f=0;f<cell.length;f++){
          var v=cell[f]/c.numTraits;
          if(f%3===0)r+=v/c.numFeatures*255;
          else if(f%3===1)g+=v/c.numFeatures*255;
          else b+=v/c.numFeatures*255;
        }
        ctx.fillStyle='rgb('+Math.floor(r)+','+Math.floor(g)+','+Math.floor(b)+')';
        ctx.fillRect(ox+x*cellSize,oy+y*cellSize,cellSize+0.5,cellSize+0.5);
      }
    }
    /* Info */
    var infoY=oy+gridSize+20;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(255,64,192,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff40c0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('CULTURAL STATE',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Regions: '+c.numRegions+' of '+(c.gridSize*c.gridSize)+' cells',60,infoY+48);
    ctx.fillText('Diversity index: '+fmt(c.numRegions/(c.gridSize*c.gridSize),3),60,infoY+68);
    ctx.fillText('Cultural features: '+c.numFeatures+' · Traits per feature: '+c.numTraits,60,infoY+88);
    setStatsHTML(
      '<div>Regions: '+c.numRegions+'</div>'+
      '<div>Step: '+c.steps+'</div>'+
      '<div>Diversity: '+fmt(c.numRegions/(c.gridSize*c.gridSize),2)+'</div>'
    );
    updateBadge('🎭 Culture · '+c.numRegions+' regions');
    $('sbMode').textContent='Cultural Evolution';
    $('sbVal').textContent=c.numRegions;
  },
  onDown:function(){},
  controls:function(){
    var c=STATE.culture;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(c.running?'danger':'primary')+' full" onclick="STATE.culture.running=!STATE.culture.running;renderLeftPanel()">'+(c.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.culture.init();renderLeftPanel()">🎲 Reset</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Features</span><span>'+c.numFeatures+'</span></div>';
    html+='<input type="range" min="3" max="15" step="1" value="'+c.numFeatures+'" oninput="STATE.culture.numFeatures=parseInt(this.value);MODULES.culture.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Traits per feature</span><span>'+c.numTraits+'</span></div>';
    html+='<input type="range" min="2" max="15" step="1" value="'+c.numTraits+'" oninput="STATE.culture.numTraits=parseInt(this.value);MODULES.culture.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Grid size</span><span>'+c.gridSize+'×'+c.gridSize+'</span></div>';
    html+='<input type="range" min="10" max="40" step="2" value="'+c.gridSize+'" oninput="STATE.culture.gridSize=parseInt(this.value);MODULES.culture.init();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.culture;
    return '<div class="sec"><h4>Axelrod Model (1997)</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Each agent has F cultural features, each with Q possible traits.<br><br>'+
      'Two agents interact with probability = fraction of shared features (homophily).<br><br>'+
      'When they interact, one copies a random differing feature of the other.'+
      '</div></div>'+
      '<div class="sec"><h4>Emergent phenomena</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '• Cultural regions form<br>'+
      '• Boundaries stabilize (diversity persists)<br>'+
      '• Not always consensus<br>'+
      '• Number of regions depends on F and Q<br><br>'+
      'Demonstrates how local interactions create global patterns.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Grid</span><span class="v">'+c.gridSize+'×'+c.gridSize+'</span></div>'+
      '<div class="row"><span class="k">Features</span><span class="v">'+c.numFeatures+'</span></div>'+
      '<div class="row"><span class="k">Traits</span><span class="v">'+c.numTraits+'</span></div>'+
      '<div class="row"><span class="k">Regions</span><span class="v">'+c.numRegions+'</span></div>'+
      '</div></div>';
  }
});

   ================================================================ */
registerModule('bargaining',{
  title:'Bargaining',
  icon:'🤝',
  desc:'Ultimatum game and Nash bargaining. Watch rational behavior vs fairness emerge.',
  init:function(){
    var b=STATE.bargaining;
    b.offers=[];
    b.history=[];
    b.steps=0;
  },
  simulate:function(){
    var b=STATE.bargaining;
    b.offers=[];
    for(var i=0;i<500;i++){
      /* Proposer makes offer based on proposer power */
      var proposerShare=rndF(b.proposerPower-0.15,b.proposerPower+0.15);
      proposerShare=clamp(proposerShare,0.05,0.95);
      /* Responder accepts if offer >= minAcceptance */
      var responderShare=1-proposerShare;
      var accepted=responderShare>=b.minAcceptance||proposerShare>0.95;
      b.offers.push({proposer:proposerShare,responder:responderShare,accepted:accepted});
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bargaining;
    /* Header */
    ctx.fillStyle='#50ff90';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🤝 BARGAINING',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Ultimatum game · 500 trials',W/2,56);
    /* Distribution of offers */
    var plotX=60,plotY=80;
    var plotW=W-120,plotH=H*0.5;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,255,144,.4)';
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,8);ctx.fill();ctx.stroke();
    /* Histogram of proposer shares */
    var bins=20;
    var counts=new Array(bins).fill(0);
    b.offers.forEach(function(o){
      var bin=Math.min(bins-1,Math.floor(o.proposer*bins));
      counts[bin]++;
    });
    var maxCount=Math.max.apply(null,counts);
    var bw=plotW/bins;
    for(var i=0;i<bins;i++){
      var bh=(counts[i]/maxCount)*(plotH-40);
      ctx.fillStyle='#50ff90';
      ctx.fillRect(plotX+i*bw+2,plotY+plotH-bh-20,bw-4,bh);
    }
    ctx.fillStyle='#50ff90';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PROPOSER SHARE DISTRIBUTION',plotX+10,plotY+16);
    /* Axis */
    ctx.fillStyle='#b0b0e0';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    for(var j=0;j<=5;j++){
      ctx.fillText((j*20)+'%',plotX+j*plotW/5,plotY+plotH+16);
    }
    /* Info */
    var infoY=plotY+plotH+40;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(80,255,144,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50ff90';
    ctx.font='bold 12px monospace';
    var accepted=b.offers.filter(function(o){return o.accepted}).length;
    var avgProposer=mean(b.offers.map(function(o){return o.proposer}));
    ctx.fillText('RESULTS',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Acceptance rate: '+fmt(accepted/b.offers.length*100,1)+'%',60,infoY+48);
    ctx.fillText('Average proposer share: '+fmt(avgProposer*100,1)+'%',60,infoY+68);
    ctx.fillText('Minimum acceptance threshold: '+fmt(b.minAcceptance*100,1)+'%',60,infoY+88);
    ctx.fillText('Rational prediction (homo economicus): 99% / 1%',60,infoY+108);
    ctx.fillText('Empirical result: ~60% / 40% (fairness)',60,infoY+128);
    setStatsHTML(
      '<div>Trials: '+b.offers.length+'</div>'+
      '<div>Accepted: '+fmt(accepted/b.offers.length*100,0)+'%</div>'+
      '<div>Avg share: '+fmt(avgProposer*100,1)+'%</div>'+
      '<div>Threshold: '+fmt(b.minAcceptance*100,0)+'%</div>'
    );
    updateBadge('🤝 Bargaining · accept '+fmt(accepted/b.offers.length*100,0)+'%');
    $('sbMode').textContent='Bargaining';
  },
  onDown:function(){},
  controls:function(){
    var b=STATE.bargaining;
    var html='';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Proposer power</span><span>'+fmt(b.proposerPower,2)+'</span></div>';
    html+='<input type="range" min="0.1" max="0.9" step="0.05" value="'+b.proposerPower+'" oninput="STATE.bargaining.proposerPower=parseFloat(this.value);MODULES.bargaining.simulate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Responder min acceptance</span><span>'+fmt(b.minAcceptance,2)+'</span></div>';
    html+='<input type="range" min="0" max="0.6" step="0.05" value="'+b.minAcceptance+'" oninput="STATE.bargaining.minAcceptance=parseFloat(this.value);MODULES.bargaining.simulate();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.bargaining.simulate();renderLeftPanel()">🎲 New simulation</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.bargaining;
    return '<div class="sec"><h4>Ultimatum Game</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Proposer offers split of $10. Responder accepts or rejects. If rejected, both get $0.<br><br>'+
      '<b>Rational play:</b> offer $0.01, responder accepts any positive amount.<br><br>'+
      '<b>Empirical:</b> most offer 40-50%, reject below 20%.'+
      '</div></div>'+
      '<div class="sec"><h4>Nash Bargaining Solution</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Maximize (u₁−d₁)·(u₂−d₂)<br><br>'+
      'Product of utility gains over disagreement point. Predicts 50/50 split when symmetric.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Proposer power</span><span class="v">'+fmt(b.proposerPower,2)+'</span></div>'+
      '<div class="row"><span class="k">Min acceptance</span><span class="v">'+fmt(b.minAcceptance,2)+'</span></div>'+
      '<div class="row"><span class="k">Trials</span><span class="v">'+b.offers.length+'</span></div>'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 15: COALITIONS
   ================================================================ */
registerModule('coalition',{
  title:'Coalitions',
  icon:'🏛',
  desc:'Cooperative game theory. Shapley value distributes coalition gains fairly among players.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var c=STATE.coalition;
    /* Random coalition values */
    c.values=[];
    var rng=makeRNG(42);
    for(var i=0;i<c.numPlayers;i++){
      c.values.push(1+rng()*10);
    }
    /* Value function: sum of member values + synergy */
    c.coalitionValues={};
    var valueFunction=function(members){
      var sum=0;
      members.forEach(function(m){sum+=c.values[m]});
      /* Synergy: bonus if all together */
      if(members.length>=3)sum*=1.2;
      return sum;
    };
    c.shapley=shapleyValue([...Array(c.numPlayers).keys()],valueFunction);
    c.coalitionValues=valueFunction;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var c=STATE.coalition;
    /* Header */
    ctx.fillStyle='#a060ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🏛 COALITION FORMATION',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Shapley value distribution · '+c.numPlayers+' players',W/2,56);
    /* Player values */
    var px=60,py=90;
    var pw=W-120,ph=80;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(px,py,pw,ph,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PLAYER VALUES',px+10,py+24);
    c.values.forEach(function(v,i){
      var bx=px+10+i*(pw-20)/c.numPlayers;
      var bh=v/15*ph*0.6;
      ctx.fillStyle='#a060ff';
      ctx.fillRect(bx+10,py+ph-bh-20,(pw-20)/c.numPlayers-20,bh);
      ctx.fillStyle='#b0b0e0';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText('P'+(i+1),bx+(pw-20)/c.numPlayers/2,py+ph-8);
    });
    /* Shapley values */
    var sy=py+ph+20;
    var sh=120;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,255,144,.4)';
    ctx.beginPath();ctx.roundRect(60,sy,W-120,sh,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50ff90';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('SHAPLEY VALUES (fair distribution)',70,sy+24);
    var totalShapley=c.shapley.reduce(function(a,b){return a+b},0);
    c.shapley.forEach(function(sv,i){
      var bx=70+i*(W-160)/c.numPlayers;
      var bh=sv/Math.max.apply(null,c.shapley)*(sh-50);
      ctx.fillStyle='#50ff90';
      ctx.fillRect(bx+10,sy+sh-bh-10,(W-160)/c.numPlayers-20,bh);
      ctx.fillStyle='#b0b0e0';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText(fmt(sv,2),bx+(W-160)/c.numPlayers/2,sy+sh-bh-15);
      ctx.fillText('P'+(i+1),bx+(W-160)/c.numPlayers/2,sy+sh+2);
    });
    /* Info */
    var infoY=sy+sh+30;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('COALITION ANALYSIS',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Grand coalition value: '+fmt(c.coalitionValues([...Array(c.numPlayers).keys()]),2),60,infoY+48);
    ctx.fillText('Total Shapley distributed: '+fmt(totalShapley,2),60,infoY+68);
    ctx.fillText('Sum of player values: '+fmt(c.values.reduce(function(a,b){return a+b},0),2),60,infoY+88);
    ctx.fillText('Synergy bonus: '+fmt((1.2-1)*100,0)+'% (coalitions of 3+)',60,infoY+108);
    setStatsHTML(
      '<div>Players: '+c.numPlayers+'</div>'+
      '<div>Grand value: '+fmt(c.coalitionValues([...Array(c.numPlayers).keys()]),2)+'</div>'+
      '<div>Sum Shapley: '+fmt(totalShapley,2)+'</div>'
    );
    updateBadge('🏛 Coalition · '+c.numPlayers+' players');
    $('sbMode').textContent='Coalitions';
  },
  onDown:function(){},
  controls:function(){
    var c=STATE.coalition;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.coalition.init();renderLeftPanel()">🎲 New players</button>';

registerModule('media',{
  title:'Information Cascades',
  icon:'📡',
  desc:'Information cascades and polarization. Watch rational individuals create irrational herds.',
  init:function(){
    var m=STATE.media;
    m.agents=[];
    for(var i=0;i<m.numAgents;i++){
      m.agents.push({
        signal:Math.random()<0.5?1:-1,
        belief:0,
        choice:0
      });
    }
    m.cascade=[];
    m.steps=0;
    m.history=[];
    m.polarization=0;
  },
  tick:function(dt){
    var m=STATE.media;
    if(!m.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*5));
    for(var st=0;st<steps;st++){
      /* Sequential decision: each agent observes previous choices and their own signal */
      var prevChoices=m.cascade.slice(-20); /* Last 20 observations */
      var socialSignal=prevChoices.reduce(function(a,b){return a+b},0);
      /* Decide */
      var agentIdx=m.cascade.length%m.numAgents;
      var agent=m.agents[agentIdx];
      /* Private signal + social influence */
      var socialPull=socialSignal*m.socialInfluence;
      var privatePull=agent.signal*(1-m.socialInfluence);
      var score=socialPull+privatePull;
      agent.choice=score>0?1:-1;
      agent.belief=score;
      m.cascade.push(agent.choice);
      m.steps++;
    }
    /* Measure polarization */
    var pos=m.cascade.filter(function(x){return x>0}).length;
    m.polarization=1-Math.abs(2*pos-m.cascade.length)/m.cascade.length;
    m.history.push({step:m.steps,polarization:m.polarization});
    STATE.time+=dt;
    $('sbStep').textContent=m.steps;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var m=STATE.media;

    /* Draw decisions */

      var view=Math.min(cw-20,m.cascade.length*8);
      var start=Math.max(0,m.cascade.length-view/8);
      m.cascade.slice(-view/8|0).forEach(function(c,i){

      '<div>Polarization: '+fmt(m.polarization,3)+'</div>'
    );
    updateBadge('📡 Cascades · step '+m.steps);
    $('sbMode').textContent='Information Cascades';
  },

  controls:function(){

registerModule('classDyn',{
  title:'Class Dynamics',
  icon:'🏭',
  desc:'Multi-class society simulation. Watch wealth concentrate or redistribute under different policies.',
  init:function(){
    var cd=STATE.classDyn;
    cd.steps=0;
    cd.history=[];
    cd.revolution=false;
  },
  tick:function(dt){
    var cd=STATE.classDyn;
    if(!cd.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*10));
    for(var st=0;st<steps;st++){
      /* Each class grows wealth at rate proportional to wealth (capital returns) */
      var newWealth=cd.classWealth.map(function(w,i){
        return w*(1+rndF(0.005,0.02));
      });
      /* Redistribute via tax */
      if(cd.taxRate>0){
        var totalTax=0;
        newWealth.forEach(function(w,i){
          var tax=w*cd.taxRate;
          newWealth[i]=w-tax;
          totalTax+=tax;
        });
        /* Equal distribution */
        var perClass=totalTax/cd.numClasses;
        for(var i=0;i<cd.numClasses;i++)newWealth[i]+=perClass;
      }
      /* Normalize */
      var sum=newWealth.reduce(function(a,b){return a+b},0);
      cd.classWealth=newWealth.map(function(w){return w/sum});
      /* Check revolution: if bottom 50% has < 5% wealth */
      var bottomHalf=cd.classWealth.slice(0,3).reduce(function(a,b){return a+b},0);
      if(bottomHalf<0.05&&cd.classWealth[cd.numClasses-1]>0.7){
        cd.revolution=true;
      }
      cd.steps++;
    }
    cd.history.push({step:cd.steps,wealth:cd.classWealth.slice(),revolution:cd.revolution});
    STATE.time+=dt;
    $('sbStep').textContent=cd.steps;

registerModule('migration',{
  title:'Migration',
  icon:'✈️',
  desc:'Push-pull migration dynamics. Watch populations flow between regions based on economic opportunity.',
  init:function(){
    var m=STATE.migration;
    m.regions=[];
    for(var i=0;i<m.numRegions;i++){
      m.regions.push({
        name:'Region '+(i+1),
        population:rndF(0.5,2),
        wage:rndF(0.5,2),
        attractiveness:rndF(0.5,1.5),
        color:['#ff7050','#50d0ff','#ffe050','#50ff90','#a060ff','#ff5080'][i%6]
      });
    }
    m.steps=0;
    m.history=[];
  },
  tick:function(dt){
    var m=STATE.migration;
    if(!m.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*5));
    for(var st=0;st<steps;st++){
      /* Compute migration flows */
      var flows=[];
      for(var i=0;i<m.numRegions;i++){
        flows.push(new Array(m.numRegions).fill(0));
      }
      for(var i=0;i<m.numRegions;i++){
        for(var j=0;j<m.numRegions;j++){
          if(i===j)continue;
          var ri=m.regions[i],rj=m.regions[j];
          /* Push-pull: wage differential + attractiveness */
          var push=pullFactor(ri,rj);
          var flow=ri.population*push*0.02*(1-m.barrier);
          if(flow>0){
            flows[i][j]=flow;
          }
        }
      }
      /* Apply flows */
      var newPop=m.regions.map(function(r){return r.population;});
      for(var i=0;i<m.numRegions;i++){
        for(var j=0;j<m.numRegions;j++){
          if(flows[i][j]>0){
            newPop[i]-=flows[i][j];
            newPop[j]+=flows[i][j];
          }
        }
      }
      /* Update populations */
      m.regions.forEach(function(r,i){
        r.population=Math.max(0.05,newPop[i]);
        /* Wages equilibrate with population (diminishing returns) */
        r.wage=r.wage*(1-0.01)+r.attractiveness/r.population*0.01;
      });
      m.steps++;
    }
    function pullFactor(ri,rj){
      return Math.max(0,rj.wage-ri.wage)*rj.attractiveness*0.5;
    }
    STATE.time+=dt;
    $('sbStep').textContent=m.steps;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var m=STATE.migration;
    /* Header */
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('✈️ MIGRATION DYNAMICS',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Push-pull model · step '+m.steps,W/2,56);
    /* Regions as circles */
    var cx=W/2,cy=H*0.45;
    var R=Math.min(W,H)*0.3;
    var totalPop=m.regions.reduce(function(s,r){return s+r.population},0);
    m.regions.forEach(function(r,i){
      var angle=(i/m.numRegions)*Math.PI*2-Math.PI/2;
      var x=cx+Math.cos(angle)*R;
      var y=cy+Math.sin(angle)*R;
      r.px=x;r.py=y;
      var size=Math.max(20,Math.sqrt(r.population/totalPop*m.numRegions)*30);
      ctx.fillStyle=r.color+'30';
      ctx.strokeStyle=r.color;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();ctx.stroke();
      /* Label */
      ctx.fillStyle=r.color;
      ctx.font='bold 11px monospace';
      ctx.textAlign='center';
      ctx.fillText('R'+(i+1),x,y+4);
      ctx.fillStyle='#b0b0e0';
      ctx.font='9px monospace';
      ctx.fillText('pop:'+fmt(r.population,2),x,y+size+14);
      ctx.fillText('w:'+fmt(r.wage,2),x,y+size+26);
    });
    /* Info */
    var infoY=H*0.75;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(80,208,255,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('MIGRATION STATE',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    var sorted=m.regions.slice().sort(function(a,b){return b.population-a.population});
    sorted.slice(0,3).forEach(function(r,i){
      ctx.fillText(r.name+': pop='+fmt(r.population,2)+' wage='+fmt(r.wage,2),60,infoY+48+i*20);
    });
    setStatsHTML(
      '<div>Regions: '+m.numRegions+'</div>'+
      '<div>Step: '+m.steps+'</div>'+
      '<div>Barrier: '+fmt(m.barrier,2)+'</div>'+
      '<div>Largest: '+sorted[0].name+'</div>'
    );
    updateBadge('✈️ Migration · step '+m.steps);
    $['sbMode'].textContent='Migration';
  },
  onDown:function(){},
  controls:function(){
    var m=STATE.migration;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(m.running?'danger':'primary')+' full" onclick="STATE.migration.running=!STATE.migration.running;renderLeftPanel()">'+(m.running?'⏸ Pause':'▶ Run')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.migration.init();renderLeftPanel()">🎲 New world</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Migration barrier</span><span>'+fmt(m.barrier,2)+'</span></div>';

registerModule('referendum',{
  title:'Referendum',
  icon:'🗳️',
  desc:'Direct democracy simulator. Watch how turnout, information, and thresholds affect outcomes.',
  init:function(){
    this.simulate();
  },
  simulate:function(){
    var r=STATE.referendum;
    var prop=r.proposals[r.currentProposal];
    r.votes=[];
    var rng=makeRNG(7777);
    for(var i=0;i<r.numVoters;i++){
      /* Each voter has a probability of voting yes based on support and spread */
      var yes=Math.random()<prop.support+rndF(-prop.spread/2,prop.spread/2);
      r.votes.push(yes?1:0);
    }
    var yesCount=r.votes.filter(function(v){return v===1}).length;
    r.result={
      yes:yesCount,
      no:r.votes.length-yesCount,
      yesPct:yesCount/r.votes.length,
      passes:yesCount/r.votes.length>prop.threshold,
      threshold:prop.threshold
    };
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var r=STATE.referendum;
    var prop=r.proposals[r.currentProposal];
    /* Header */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🗳️ REFERENDUM',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Proposal: "'+prop.name+'" · '+r.numVoters+' voters',W/2,56);
    /* Vote bar */
    var barX=80,barY=120;
    var barW=W-160,barH=80;
    ctx.fillStyle='#ff5080';
    ctx.beginPath();ctx.roundRect(barX,barY,barW*0.5,barH,8);ctx.fill();
    ctx.fillStyle='#50ff90';
    ctx.beginPath();ctx.roundRect(barX,barY,barW*r.result.yesPct,barH,8);ctx.fill();
    /* Threshold marker */
    var thX=barX+barW*prop.threshold;
    ctx.strokeStyle='#ffe050';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(thX,barY-10);ctx.lineTo(thX,barY+barH+10);ctx.stroke();
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillText('Threshold: '+fmt(prop.threshold*100,0)+'%',thX,barY-15);
    /* Labels */
    ctx.fillStyle='#fff';
    ctx.font='bold 20px monospace';
    ctx.textAlign='left';
    ctx.fillText('YES: '+r.result.yes+' ('+fmt(r.result.yesPct*100,1)+'%)',barX+10,barY+barH/2+8);
    ctx.textAlign='right';
    ctx.fillText('NO: '+r.result.no+' ('+fmt((1-r.result.yesPct)*100,1)+'%)',barX+barW-10,barY+barH/2+8);
    /* Result */
    var resultY=barY+barH+40;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle=r.result.passes?'#50ff90':'#ff5080';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(40,resultY,W-80,H-resultY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle=r.result.passes?'#50ff90':'#ff5080';
    ctx.font='bold 32px monospace';
    ctx.textAlign='center';
    ctx.fillText(r.result.passes?'PASSED':'REJECTED',W/2,resultY+70);
    ctx.fillStyle='#b0b0e0';
    ctx.font='12px monospace';
    ctx.fillText('Proposal: '+prop.name,W/2,resultY+110);
    ctx.fillText('Yes %: '+fmt(r.result.yesPct*100,2)+'% · Threshold: '+fmt(prop.threshold*100,0)+'%',W/2,resultY+130);
    ctx.fillText('Margin: '+(r.result.yesPct>prop.threshold?'+':'')+fmt((r.result.yesPct-prop.threshold)*100,2)+' percentage points',W/2,resultY+150);
    setStatsHTML(
      '<div>Yes: '+fmt(r.result.yesPct*100,1)+'%</div>'+
      '<div>No: '+fmt((1-r.result.yesPct)*100,1)+'%</div>'+
      '<div>Threshold: '+fmt(prop.threshold*100,0)+'%</div>'+
      '<div style="color:'+(r.result.passes?'var(--c5)':'var(--c4)')+'">'+(r.result.passes?'PASSED':'REJECTED')+'</div>'
    );
    updateBadge('🗳️ Referendum · '+(r.result.passes?'PASSED':'REJECTED')+' · '+fmt(r.result.yesPct*100,1)+'% yes');
    $['sbMode'].textContent='Referendum';
  },
  onDown:function(){},
  controls:function(){
    var r=STATE.referendum;
    var html='';
    html+='<div class="sec"><h4>Proposals</h4>';
    r.proposals.forEach(function(p,i){
      html+='<div style="padding:6px 10px;background:'+(r.currentProposal===i?'rgba(255,224,80,.2)':'var(--panel3)')+';border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.65rem;border-left:3px solid '+(r.currentProposal===i?'var(--c3)':'transparent')+'" onclick="STATE.referendum.currentProposal='+i+';MODULES.referendum.simulate();renderLeftPanel()">';
      html+='<div style="color:var(--c3);font-weight:600">'+p.name+'</div>';
      html+='<div style="color:var(--tx3);font-size:.55rem">Support: '+fmt(p.support*100,0)+'% · Threshold: '+fmt(p.threshold*100,0)+'%</div>';
      html+='</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    var prop=r.proposals[r.currentProposal];
    html+='<div class="ctrl"><div class="lbl"><span>Base support</span><span>'+fmt(prop.support*100,0)+'%</span></div>';
    html+='<input type="range" min="0.2" max="0.8" step="0.02" value="'+prop.support+'" oninput="STATE.referendum.proposals['+r.currentProposal+'].support=parseFloat(this.value);MODULES.referendum.simulate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Threshold</span><span>'+fmt(prop.threshold*100,0)+'%</span></div>';
    html+='<input type="range" min="0.4" max="0.7" step="0.01" value="'+prop.threshold+'" oninput="STATE.referendum.proposals['+r.currentProposal+'].threshold=parseFloat(this.value);MODULES.referendum.simulate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Voters</span><span>'+r.numVoters+'</span></div>';
    html+='<input type="range" min="100" max="5000" step="100" value="'+r.numVoters+'" oninput="STATE.referendum.numVoters=parseInt(this.value);MODULES.referendum.simulate();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.referendum.simulate();renderLeftPanel()">🎲 New vote</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var r=STATE.referendum;
    var prop=r.proposals[r.currentProposal];
    return '<div class="sec"><h4>Direct Democracy</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Referendums allow citizens to vote directly on legislation.<br><br>'+
      'Used in: Switzerland (frequent), California (propositions), Ireland (constitutional), Brexit (2016), EU treaties.'+
      '</div></div>'+
      '<div class="sec"><h4>Arguments For</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+

      '</div></div>'+
      '<div class="sec"><h4>Arguments Against</h4>'+

      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='9'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='0')switchTab('media');
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(4,9);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CIVITAS ready · Press ? for help','success',3500);
      },400);
    }
  },110);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}
