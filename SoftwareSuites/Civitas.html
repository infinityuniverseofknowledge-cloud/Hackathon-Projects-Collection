<!DOCTYPE html>
<html lang="en" data-theme="civic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CIVITAS — Society Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#0a0a14;--bg2:#12121e;--bg3:#1c1c30;--bg4:#282848;
  --panel:#12121e;--panel2:#1c1c30;--panel3:#282848;--panel4:#383860;
  --bd:#2c2c50;--bd2:#484878;--bd3:#6868a0;
  --tx:#f0f0ff;--tx2:#b0b0e0;--tx3:#7070a0;--mu:#484878;
  --c1:#ff7050;--c1h:#ffa080;--c1l:#c04030;
  --c2:#50d0ff;--c2h:#80e0ff;--c2l:#2090c0;
  --c3:#ffe050;--c3h:#fff080;--c3l:#c0a030;
  --c4:#ff5080;--c4h:#ff90a8;--c4l:#c03060;
  --c5:#50ff90;--c5h:#80ffc0;--c5l:#20c060;
  --c6:#a060ff;--c6h:#c090ff;--c6l:#7030c0;
  --c7:#50ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff40c0;--c8h:#ff80d8;--c8l:#c02090;
  --ok:#50ff90;--warn:#ffe050;--err:#ff5080;--info:#50d0ff;
  --g1:linear-gradient(135deg,#ff7050,#a060ff);
  --g2:linear-gradient(135deg,#ffe050,#ff5080);
  --gHolo:linear-gradient(120deg,#ff7050,#50d0ff,#50ff90,#ffe050,#ff5080,#a060ff,#ff7050);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.8);
  --sh2:0 16px 48px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --serif:'Georgia','Times New Roman',serif;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="parliament"]{--bg:#f8f4e8;--bg2:#f0e8d0;--bg3:#e0d4b8;--panel:#fff;--panel2:#f8f4e8;--panel3:#f0e8d0;--panel4:#e0d4b8;
  --bd:#c8bca0;--bd2:#a09080;--tx:#1a1008;--tx2:#504030;--tx3:#807060;
  --c1:#c04020;--c2:#0060c0;--c3:#c08000;--c4:#c00040;--c5:#008040;--c6:#6020c0;
  --g1:linear-gradient(135deg,#c04020,#6020c0)}
[data-theme="night"]{--bg:#050510;--bg2:#0a0a1e;--bg3:#12122e;--panel:#0a0a1e;--panel2:#12122e;
  --bd:#242450;--bd2:#3a3a78;--tx:#c0c8ff;--tx2:#8088d0;
  --c1:#ff4060;--c2:#40d0ff;--c3:#ffe040;--c4:#ff60a0;--c5:#40ff80;
  --g1:linear-gradient(135deg,#ff4060,#40d0ff)}
[data-theme="sepia"]{--bg:#f5ede0;--bg2:#ede0c8;--bg3:#dcccb0;--panel:#fff;--panel2:#f5ede0;--panel3:#ede0c8;--panel4:#dcccb0;
  --bd:#c0a880;--bd2:#a08860;--tx:#201808;--tx2:#503c20;--tx3:#806840;
  --c1:#804020;--c2:#206080;--c3:#a07020;--c4:#802040;--c5:#206040;--c6:#604080;
  --g1:linear-gradient(135deg,#804020,#604080)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#0a0a14;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-civ{width:240px;height:200px;margin-bottom:20px}
.boot-civ svg{width:100%;height:100%}
.boot-civ .building{fill:none;stroke:#ff7050;stroke-width:2;filter:drop-shadow(0 0 6px #ff7050)}
.boot-civ .pillar{fill:#ffe050;opacity:.7}
.boot-civ .people{fill:#50d0ff;filter:drop-shadow(0 0 4px #50d0ff)}
.boot-civ .net{stroke:#50ff90;stroke-width:1.5;opacity:.6}
.boot-civ .net.active{stroke:#ffe050;opacity:1;animation:fire 2s ease-in-out infinite}
@keyframes fire{0%,100%{opacity:.4}50%{opacity:1}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#ff7050;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#282848;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ff7050}
.boot-pct{font-size:.7rem;color:#ff7050;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#7070a0;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#50ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0a14;box-shadow:0 0 14px rgba(255,112,80,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#282848;transition:var(--t1)}
.tb-status .dot.on{background:var(--c5);box-shadow:0 0 10px var(--c5);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:320px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#06060e;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(18,18,30,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:400px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:340px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,112,80,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#0a0a14;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,112,80,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#0a0a14;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:.95rem;font-weight:800;color:var(--c1);line-height:1.1}
.stat .sl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

/* Special blocks */
.party-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}
.candidate{padding:6px 10px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;display:flex;align-items:center;font-family:var(--mono);font-size:.65rem}
.payoff-cell{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center;font-family:var(--mono);font-size:.65rem}
.payoff-cell.nash{background:rgba(80,255,144,.2);border-color:#50ff90;color:#50ff90}
.ballot-item{padding:6px 10px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.65rem;cursor:pointer;transition:var(--t1)}
.ballot-item:hover{background:var(--panel4);border-color:var(--c1)}
.ballot-item.ranked{border-left:3px solid var(--c3);background:rgba(255,224,80,.15)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c5)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:280px}#rightPanel{width:300px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-civ">
    <svg viewBox="0 0 240 200">
      <path class="building" d="M 80,180 L 80,80 L 120,60 L 160,80 L 160,180 Z"/>
      <rect class="pillar" x="88" y="90" width="6" height="80"/>
      <rect class="pillar" x="104" y="90" width="6" height="80"/>
      <rect class="pillar" x="130" y="90" width="6" height="80"/>
      <rect class="pillar" x="146" y="90" width="6" height="80"/>
      <polygon class="building" points="120,60 80,80 160,80" fill="#ffe050" fill-opacity=".3"/>
      <circle class="people" cx="30" cy="160" r="5"/>
      <circle class="people" cx="45" cy="160" r="5"/>
      <circle class="people" cx="195" cy="160" r="5"/>
      <circle class="people" cx="210" cy="160" r="5"/>
      <circle class="people" cx="30" cy="40" r="4"/>
      <circle class="people" cx="210" cy="40" r="4"/>
      <line class="net" x1="30" y1="160" x2="45" y2="160"/>
      <line class="net" x1="195" y1="160" x2="210" y2="160"/>
      <line class="net active" x1="30" y1="40" x2="120" y2="40"/>
      <line class="net active" x1="210" y1="40" x2="120" y2="40"/>
      <line class="net" x1="30" y1="160" x2="120" y2="180"/>
      <line class="net" x1="210" y1="160" x2="120" y2="180"/>
      <line class="net active" x1="30" y1="40" x2="30" y2="160"/>
      <line class="net active" x1="210" y1="40" x2="210" y2="160"/>
    </svg>
  </div>
  <div class="boot-logo">CIVITAS</div>
  <div class="boot-sub">SOCIETY & CIVILIZATION STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('gametheory')">CIVITAS</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>

/* Seeded RNG */
function makeRNG(seed){
  return function(){
    seed|=0;
    seed=(seed+0x6D2B79F5)|0;
    var t=seed;
    t=(t^(t>>>15))*(t|1);
    t^=t+((t^(t>>>7))*(t|61));
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

/* ================================================================
   GAME THEORY SOLVERS
   ================================================================ */
/* Find pure Nash equilibria for 2x2 game
   Payoff matrices: A[i][j] = payoff to Row player when Row plays i, Col plays j
                    B[i][j] = payoff to Col player */
function findPureNash(A,B){
  var eq=[];
  for(var i=0;i<2;i++){
    for(var j=0;j<2;j++){
      /* Check if (i,j) is Nash: no profitable deviation */
      var rowBest=true;
      for(var i2=0;i2<2;i2++){
        if(A[i2][j]>A[i][j]){rowBest=false;break;}
      }
      var colBest=true;
      for(var j2=0;j2<2;j2++){
        if(B[i][j2]>B[i][j]){colBest=false;break;}
      }
      if(rowBest&&colBest)eq.push([i,j]);
    }
  }
  return eq;
}

/* Find mixed Nash for 2x2 (if no pure) */
function findMixedNash2x2(A,B){
  /* Row player makes col indifferent: A[0][0]*p + A[1][0]*(1-p) = A[0][1]*p + A[1][1]*(1-p) */
  var p;
  var denom=(A[0][0]-A[1][0]-A[0][1]+A[1][1]);
  if(Math.abs(denom)>1e-9){
    p=(A[1][1]-A[1][0])/denom;
  } else return null;
  /* Col player makes row indifferent: B[0][0]*q + B[0][1]*(1-q) = B[1][0]*q + B[1][1]*(1-q) */
  var q;
  var denom2=(B[0][0]-B[0][1]-B[1][0]+B[1][1]);
  if(Math.abs(denom2)>1e-9){
    q=(B[1][1]-B[0][1])/denom2;
  } else return null;
  if(p<0||p>1||q<0||q>1)return null;
  return {p:p,q:q};
}

/* Prisoner's Dilemma strategy matching */
function pdPlay(strategy1,strategy2,history1,history2,round){
  var def={defect:true,cooperate:false};
  /* Tit-for-tat */
  if(strategy1==='tft'){
    return round===0?false:history2[history2.length-1];
  }
  /* Tit-for-two-tats */
  if(strategy1==='tf2t'){
    if(round<2)return false;
    return !(history2[history2.length-1]&&history2[history2.length-2]);
  }
  if(strategy1==='always-cooperate')return false;
  if(strategy1==='always-defect')return true;
  if(strategy1==='random')return Math.random()<0.5;
  if(strategy1==='grim'){
    if(history2.indexOf(true)>=0)return true;
    return false;
  }
  if(strategy1==='pavlov'){
    if(round===0)return false;
    /* Win-stay, lose-shift */
    var lastPayoff=history1[history1.length-1];
    var lastAction=history1[history1.length-1];
    /* Simplified */
    return !history2[history2.length-1];
  }
  return Math.random()<0.5;
}

/* Replicator dynamics for 2 strategies: dx/dt = x(f1 - avg) */
function replicator2(x,payoffsA){
  /* payoffsA[i][j] = payoff to i when opponent j */
  var f0=payoffsA[0][0]*x+payoffsA[0][1]*(1-x);
  var f1=payoffsA[1][0]*x+payoffsA[1][1]*(1-x);
  var avg=x*f0+(1-x)*f1;
  return x*(f0-avg);
}

/* ================================================================
   VOTING SYSTEMS
   ================================================================ */
function pluralityVote(ballots,candidates){
  var counts={};
  candidates.forEach(function(c){counts[c]=0});
  ballots.forEach(function(b){counts[b[0]]++});
  return counts;
}
function bordaCount(ballots,candidates){
  var scores={};
  candidates.forEach(function(c){scores[c]=0});
  var n=candidates.length;
  ballots.forEach(function(b){
    b.forEach(function(c,i){
      scores[c]+=(n-1-i);
    });
  });
  return scores;
}
function instantRunoff(ballots,candidates){
  var rounds=[];
  var remaining=candidates.slice();
  while(remaining.length>1){
    var counts={};
    remaining.forEach(function(c){counts[c]=0});
    ballots.forEach(function(b){
      for(var i=0;i<b.length;i++){
        if(remaining.indexOf(b[i])>=0){
          counts[b[i]]++;
          break;
        }
      }
    });
    rounds.push({counts:JSON.parse(JSON.stringify(counts)),eliminated:null});
    /* Check majority */
    var total=Object.values(counts).reduce(function(a,b){return a+b},0);
    var maxCount=Math.max.apply(null,Object.values(counts));
    if(maxCount>total/2)break;
    /* Eliminate lowest */
    var minCount=Infinity;
    var toElim=remaining[0];
    remaining.forEach(function(c){
      if(counts[c]<minCount){minCount=counts[c];toElim=c;}
    });
    rounds[rounds.length-1].eliminated=toElim;
    remaining=remaining.filter(function(c){return c!==toElim});
  }
  return rounds;
}
function approvalVote(ballots,candidates){
  var counts={};
  candidates.forEach(function(c){counts[c]=0});
  ballots.forEach(function(b){
    b.forEach(function(c){counts[c]++});
  });
  return counts;
}
function condorcetWinner(ballots,candidates){
  /* Pairwise comparisons */
  var pairwise={};
  candidates.forEach(function(c1){
    pairwise[c1]={};
    candidates.forEach(function(c2){
      if(c1===c2)return;
      var count=0;
      ballots.forEach(function(b){
        var i1=b.indexOf(c1);
        var i2=b.indexOf(c2);
        if(i1>=0&&(i2<0||i1<i2))count++;
      });
      pairwise[c1][c2]=count;
    });
  });
  /* Find Condorcet winner: beats everyone */
  for(var i=0;i<candidates.length;i++){
    var c=candidates[i];
    var beatsAll=true;
    for(var j=0;j<candidates.length;j++){
      if(i===j)continue;
      var c2=candidates[j];
      if(pairwise[c][c2]<=pairwise[c2][c]){beatsAll=false;break;}
    }
    if(beatsAll)return {winner:c,pairwise:pairwise};
  }
  return {winner:null,pairwise:pairwise};
}

/* ================================================================
   ECONOMIC UTILITIES
   ================================================================ */
/* Supply and demand curves */
function supplyCurve(p,a,b){return a+b*p}
function demandCurve(p,a,b){return a-b*p}
function marketEquilibrium(aS,bS,aD,bD){
  /* aS + bS*p = aD - bD*p → p = (aD - aS)/(bS + bD) */
  var p=(aD-aS)/(bS+bD);
  var q=aS+bS*p;
  return {price:p,quantity:q};
}
function consumerSurplus(pStar,qStar,demandA,demandB){
  /* Approximate triangle */
  var pMax=demandA/demandB;
  return 0.5*(pMax-pStar)*qStar;
}
function producerSurplus(pStar,qStar,supplyA,supplyB){
  var pMin=-supplyA/supplyB;
  return 0.5*(pStar-pMin)*qStar;
}

/* Gini coefficient */
function gini(values){
  var sorted=values.slice().sort(function(a,b){return a-b});
  var n=sorted.length;
  var sum=0;
  for(var i=0;i<n;i++){
    sum+=(2*i-n+1)*sorted[i];
  }
  var mean=values.reduce(function(a,b){return a+b},0)/n;
  return sum/(n*n*mean);
}

/* Lorenz curve points */
function lorenzCurve(values,nPoints){
  var sorted=values.slice().sort(function(a,b){return a-b});
  var total=sorted.reduce(function(a,b){return a+b},0);
  var points=[{x:0,y:0}];
  var cum=0;
  for(var i=0;i<sorted.length;i++){
    cum+=sorted[i];
    points.push({x:(i+1)/sorted.length,y:cum/total});
  }
  return points;
}

/* ================================================================
   EPIDEMIOLOGY
   ================================================================ */
function sirStep(S,I,R,beta,gamma,dt,N){
  var dS=-beta*S*I/N;
  var dI=beta*S*I/N-gamma*I;
  var dR=gamma*I;
  return {
    S:S+dS*dt,
    I:I+dI*dt,
    R:R+dR*dt,
    newInfections:beta*S*I/N*dt
  };
}

/* ================================================================
   POPULATION DYNAMICS
   ================================================================ */
function lotkaVolterra(prey,pred,a,b,c,d,dt){
  var dPrey=a*prey-b*prey*pred;
  var dPred=-c*pred+d*prey*pred;
  return {prey:prey+dPrey*dt,pred:pred+dPred*dt};
}
function logisticGrowth(N,r,K,dt){
  return N+r*N*(1-N/K)*dt;
}

/* ================================================================
   SOCIAL NETWORK
   ================================================================ */
function degrootUpdate(opinions,adjacency){
  var newOp=opinions.slice();
  for(var i=0;i<opinions.length;i++){
    var neighbors=adjacency[i];
    if(!neighbors||neighbors.length===0)continue;
    var sum=0;
    for(var j=0;j<neighbors.length;j++)sum+=opinions[neighbors[j]];
    newOp[i]=sum/neighbors.length;
  }
  return newOp;
}

/* ================================================================
   AUCTION MECHANISMS
   ================================================================ */
function firstPriceAuction(bidders){
  var winner=0;
  var maxBid=-Infinity;
  bidders.forEach(function(b,i){
    if(b.bid>maxBid){maxBid=b.bid;winner=i;}
  });
  return {winner:winner,price:maxBid};
}
function secondPriceAuction(bidders){
  var sorted=bidders.slice().sort(function(a,b){return b.bid-a.bid});
  return {winner:bidders.indexOf(sorted[0]),price:sorted[1]?sorted[1].bid:sorted[0].bid};
}
function englishAuction(bidders){
  /* Ascending */
  var current=0;
  var active=bidders.map(function(b,i){return i});
  while(active.length>1){
    current+=1;
    active=active.filter(function(i){return bidders[i].value>=current});
  }
  return {winner:active[0],price:current};
}
function dutchAuction(bidders,startPrice){
  var price=startPrice;
  while(price>0){
    for(var i=0;i<bidders.length;i++){
      if(bidders[i].value>=price)return {winner:i,price:price};
    }
    price-=1;
  }
  return {winner:-1,price:0};
}

/* ================================================================
   SHAPLEY VALUE (for small games)
   ================================================================ */
function shapleyValue(players,valueFunction){
  /* Enumerate all permutations, compute marginal contributions */
  var n=players.length;
  var shapley=new Array(n).fill(0);
  var perms=permutations(n);
  perms.forEach(function(perm){
    var coalition=[];
    var prevValue=0;
    perm.forEach(function(p){
      coalition.push(p);
      var newValue=valueFunction(coalition);
      shapley[p]+=(newValue-prevValue);
      prevValue=newValue;
    });
  });
  return shapley.map(function(s){return s/perms.length});
}
function permutations(n){
  if(n===0)return [[]];
  var result=[];
  function permute(arr,remaining){
    if(remaining.length===0){result.push(arr.slice());return;}
    for(var i=0;i<remaining.length;i++){
      var next=remaining.slice();
      var elem=next.splice(i,1)[0];
      arr.push(elem);
      permute(arr,next);
      arr.pop();
    }
  }
  permute([],[...Array(n).keys()]);
  return result;
}

/* ================================================================
   STABLE MARRIAGE (Gale-Shapley)
   ================================================================ */
function galeShapley(menPrefs,womenPrefs){
  var n=menPrefs.length;
  var freeMen=[...Array(n).keys()];
  var womenPartner=new Array(n).fill(-1);
  var menPartner=new Array(n).fill(-1);
  var nextProposal=new Array(n).fill(0);
  while(freeMen.length>0){
    var m=freeMen.shift();
    var w=menPrefs[m][nextProposal[m]++];
    if(womenPartner[w]===-1){
      womenPartner[w]=m;
      menPartner[m]=w;
    } else {
      var current=womenPartner[w];
      if(womenPrefs[w].indexOf(m)<womenPrefs[w].indexOf(current)){
        womenPartner[w]=m;
        menPartner[m]=w;
        menPartner[current]=-1;
        freeMen.push(current);
      } else {
        freeMen.push(m);
      }
    }
  }
  return {menPartner:menPartner,womenPartner:womenPartner};
}

/* ================================================================
   NAGEL-SCHRECKENBERG TRAFFIC MODEL
   ================================================================ */
function nschStep(cars,roadLength,maxSpeed,pBrake){
  var newCars=cars.map(function(c){return Object.assign({},c)});
  /* 1. Accelerate */
  for(var i=0;i<newCars.length;i++){
    if(newCars[i].v<maxSpeed)newCars[i].v++;
  }
  /* 2. Brake to avoid collision */
  for(var i=0;i<newCars.length;i++){
    var nextCar=newCars[(i+1)%newCars.length];
    var gap=(nextCar.pos-newCars[i].pos+roadLength)%roadLength-1;
    if(newCars[i].v>gap)newCars[i].v=Math.max(0,gap);
  }
  /* 3. Random braking */
  for(var i=0;i<newCars.length;i++){
    if(Math.random()<pBrake)newCars[i].v=Math.max(0,newCars[i].v-1);
  }
  /* 4. Move */
  for(var i=0;i<newCars.length;i++){
    newCars[i].pos=(newCars[i].pos+newCars[i].v)%roadLength;
  }
  return newCars;
}

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={down:false,x:0,y:0,lastX:0,lastY:0};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def;}
function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

registerModule('gametheory',{
  title:'Game Theory',
  icon:'🎮',
  desc:'2×2 games with Nash equilibrium solver. Play iterated games with strategies like tit-for-tat, always-defect, and grim trigger.',
  init:function(){
    this.reset();
    this.analyze();
  },
  reset:function(){
    var g=STATE.gametheory;
    g.history1=[];
    g.history2=[];
    g.scores=[0,0];
    g.roundNum=0;
    g.rounds=[];
  },
  analyze:function(){
    var g=STATE.gametheory;
    g.pureNash=findPureNash(g.A,g.B);
    g.mixed=findMixedNash2x2(g.A,g.B);
  },
  setGame:function(name){
    var g=STATE.gametheory;
    g.game=name;
    if(name==='pd'){
      /* Prisoner's Dilemma */
      g.A=[[3,0],[5,1]];
      g.B=[[3,5],[0,1]];
    } else if(name==='stag'){
      /* Stag Hunt */
      g.A=[[3,3],[0,1]];
      g.B=[[3,0],[1,3]];
    } else if(name==='chicken'){
      /* Chicken / Hawk-Dove */
      g.A=[[0,-1],[1,-3]];
      g.B=[[0,1],[-1,-3]];
    } else if(name==='coord'){
      /* Coordination */
      g.A=[[2,1],[1,2]];
      g.B=[[2,1],[1,2]];
    } else if(name==='matching'){
      /* Matching Pennies */
      g.A=[[1,-1],[-1,1]];
      g.B=[[-1,1],[1,-1]];
    }
    this.analyze();
    this.reset();
  },
  tick:function(dt){
    var g=STATE.gametheory;
    if(!STATE.playing||!g.running)return;
    var rounds=Math.max(1,Math.round(g.speed*dt*10));
    for(var i=0;i<rounds;i++){
      var a1=pdPlay(g.strategy1,g.strategy2,g.history1,g.history2,g.roundNum);
      var a2=pdPlay(g.strategy2,g.strategy1,g.history2,g.history1,g.roundNum);
      g.history1.push(a1);
      g.history2.push(a2);
      var p1=g.A[a1?1:0][a2?1:0];
      var p2=g.B[a1?1:0][a2?1:0];
      g.scores[0]+=p1;
      g.scores[1]+=p2;
      g.roundNum++;
      g.rounds.push({a1:a1,a2:a2,p1:p1,p2:p2});
    }
    STATE.time+=dt;
    $('sbScore').textContent=g.scores[0]+' vs '+g.scores[1];
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var g=STATE.gametheory;
    /* Header */
    ctx.fillStyle='#ff7050';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left';
    ctx.fillText('🎮 GAME THEORY — '+g.game.toUpperCase(),30,36);
    /* Payoff matrix */
    var mx=W*0.08,my=80,mw=Math.min(W*0.35,320),mh=240;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(255,112,80,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(mx,my,mw,mh,10);ctx.fill();ctx.stroke();
    /* Matrix cells */
    var cellW=(mw-40)/2;
    var cellH=(mh-60)/2;
    var labels=['C','D'];
    for(var i=0;i<2;i++){
      for(var j=0;j<2;j++){
        var cx=mx+20+j*cellW;
        var cy=my+50+i*cellH;
        var isNash=g.pureNash.some(function(eq){return eq[0]===i&&eq[1]===j;});
        ctx.fillStyle=isNash?'rgba(80,255,144,.2)':'rgba(40,40,80,.6)';
        ctx.strokeStyle=isNash?'#50ff90':'rgba(72,72,120,.6)';
        ctx.lineWidth=isNash?2:1;
        ctx.beginPath();ctx.roundRect(cx+2,cy+2,cellW-4,cellH-4,6);ctx.fill();ctx.stroke();
        ctx.fillStyle=isNash?'#50ff90':'#b0b0e0';
        ctx.font='bold 14px monospace';
        ctx.textAlign='center';
        ctx.fillText(g.A[i][j]+', '+g.B[i][j],cx+cellW/2,cy+cellH/2+5);
      }
    }
    /* Labels */
    ctx.fillStyle='#ff7050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillText('C',mx+20+cellW/2,my+30);
    ctx.fillText('D',mx+20+1.5*cellW,my+30);
    ctx.save();
    ctx.translate(mx+10,my+50+cellH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('C',0,0);
    ctx.restore();
    ctx.save();
    ctx.translate(mx+10,my+50+1.5*cellH);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('D',0,0);
    ctx.restore();
    /* Nash info */
    var nx=mx+mw+30;
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('NASH EQUILIBRIA',nx,my+20);
    ctx.font='11px monospace';
    ctx.fillStyle='#b0b0e0';
    if(g.pureNash.length>0){
      g.pureNash.forEach(function(eq,i){
        ctx.fillText('Pure: ('+['C','D'][eq[0]]+','+['C','D'][eq[1]]+')',nx,my+42+i*18);
      });
    } else {
      ctx.fillText('Pure: none',nx,my+42);
    }
    if(g.mixed){
      ctx.fillText('Mixed: Row '+fmt(g.mixed.p*100,1)+'% C',nx,my+42+g.pureNash.length*18);
      ctx.fillText('        Col '+fmt(g.mixed.q*100,1)+'% C',nx,my+60+g.pureNash.length*18);
    }
    /* Iterated game panel */
    var itY=my+mh+20;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,208,255,.4)';
    ctx.beginPath();ctx.roundRect(30,itY,W-60,H-itY-30,10);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('ITERATED GAME · Round '+g.roundNum+' · '+g.strategy1+' vs '+g.strategy2,50,itY+24);
    /* Recent actions */
    var rx=50;
    var ry=itY+50;
    var rw=Math.min(30,(W-140)/30);
    var count=Math.min(30,g.rounds.length);
    var start=Math.max(0,g.rounds.length-count);
    for(var k=0;k<count;k++){
      var r=g.rounds[start+k];
      /* Player 1 action */
      ctx.fillStyle=r.a1?'#ff5080':'#50ff90';
      ctx.fillRect(rx+k*rw*2,ry,rw-2,20);
      /* Player 2 action */
      ctx.fillStyle=r.a2?'#ff5080':'#50ff90';
      ctx.fillRect(rx+k*rw*2+rw,ry+25,rw-2,20);
    }
    ctx.fillStyle='#ff7050';
    ctx.font='11px monospace';
    ctx.textAlign='left';
    ctx.fillText('P1',rx,ry+38);
    ctx.fillText('P2',rx,ry+63);
    /* Scores */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 14px monospace';
    ctx.textAlign='right';
    ctx.fillText('P1: '+g.scores[0],W-60,itY+50);
    ctx.fillText('P2: '+g.scores[1],W-60,itY+72);
    setStatsHTML(
      '<div>Game: '+g.game+'</div>'+
      '<div>Round: '+g.roundNum+'</div>'+
      '<div>P1: '+g.scores[0]+'</div>'+
      '<div>P2: '+g.scores[1]+'</div>'
    );
    updateBadge('🎮 Game Theory · '+g.game+' · round '+g.roundNum);
    $('sbMode').textContent='Game Theory';
    $('sbVal').textContent=g.scores[0]+'/'+g.scores[1];
  },
  onDown:function(p){},
  controls:function(){
    var g=STATE.gametheory;
    var html='';
    html+='<div class="sec"><h4>Game</h4>';
    html+='<div class="chip-row">';
    [['pd','Prisoner\'s Dilemma'],['stag','Stag Hunt'],['chicken','Chicken'],['coord','Coordination'],['matching','Matching Pennies']].forEach(function(ga){
      html+='<div class="chip '+(g.game===ga[0]?'active':'')+'" onclick="STATE.gametheory.setGame=\''+ga[0]+'\';MODULES.gametheory.setGame(\''+ga[0]+'\');renderLeftPanel()">'+ga[1]+'</div>';

      html+='<div class="chip '+(g.strategy2===s[0]?'active':'')+'" onclick="STATE.gametheory.strategy2=\''+s[0]+'\';renderLeftPanel()">'+s[1]+'</div>';

    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.gametheory.reset();renderLeftPanel()">↺ Reset scores</button>';

  },

registerModule('voting',{
  title:'Voting Systems',
  icon:'🗳',
  desc:'Compare plurality, Borda, IRV, approval, and Condorcet. Witness Arrow\'s theorem and Condorcet cycles in action.',
  init:function(){
    this.generate();
  },
  generate:function(){
    var v=STATE.voting;
    v.ballots=[];
    for(var i=0;i<v.numVoters;i++){
      /* Generate random preference over candidates */
      var prefs=v.candidates.slice().sort(function(){return Math.random()-0.5});
      v.ballots.push(prefs);
    }
    this.compute();
  },
  compute:function(){
    var v=STATE.voting;
    v.results={
      plurality:pluralityVote(v.ballots,v.candidates),
      borda:bordaCount(v.ballots,v.candidates),
      approval:approvalVote(v.ballots.map(function(b){return b.slice(0,rnd(1,v.candidates.length))}),v.candidates),
      irv:instantRunoff(v.ballots,v.candidates)
    };
    v.condorcet=condorcetWinner(v.ballots,v.candidates);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var v=STATE.voting;
    /* Header */
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🗳 VOTING SYSTEMS',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText(v.numVoters+' voters · '+v.candidates.length+' candidates',W/2,56);
    /* Plurality */
    var colors=['#ff7050','#50d0ff','#ffe050','#50ff90','#ff5080','#a060ff'];
    var blockY=90;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,208,255,.4)';
    ctx.beginPath();ctx.roundRect(30,blockY,W-60,100,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PLURALITY (first past the post)',50,blockY+22);
    /* Bars */
    var total=Object.values(v.results.plurality).reduce(function(a,b){return a+b},0);
    var bx=50,by=blockY+40;
    var maxVal=Math.max.apply(null,Object.values(v.results.plurality));
    v.candidates.forEach(function(c,i){
      var val=v.results.plurality[c];
      var barW=(W-140)*val/Math.max(1,maxVal);
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(bx,by+i*15,barW,12);
      ctx.fillStyle='#fff';
      ctx.font='10px monospace';
      ctx.textAlign='left';
      ctx.fillText(c+' '+val+' ('+fmt(val/total*100,1)+'%)',bx+barW+6,by+i*15+10);
    });
    /* Borda */
    var block2Y=200;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(255,224,80,.4)';
    ctx.beginPath();ctx.roundRect(30,block2Y,W-60,100,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('BORDA COUNT (positional)',50,block2Y+22);
    var maxBorda=Math.max.apply(null,Object.values(v.results.borda));
    v.candidates.forEach(function(c,i){
      var val=v.results.borda[c];
      var barW=(W-140)*val/Math.max(1,maxBorda);
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(50,block2Y+40+i*15,barW,12);
      ctx.fillStyle='#fff';
      ctx.font='10px monospace';
      ctx.fillText(c+' '+val,50+barW+6,block2Y+40+i*15+10);
    });
    /* IRV */
    var block3Y=310;
    ctx.fillStyle='rgba(18,18,30,.6)';
    ctx.strokeStyle='rgba(80,255,144,.4)';
    ctx.beginPath();ctx.roundRect(30,block3Y,W-60,H-block3Y-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#50ff90';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('INSTANT RUNOFF (IRV)',50,block3Y+22);
    /* IRV rounds */
    var roundY=block3Y+45;
    v.results.irv.forEach(function(round,i){
      ctx.fillStyle='#b0b0e0';
      ctx.font='10px monospace';

        if(round.counts[c]!==undefined){
          var val=round.counts[c];
          var barW=val/Math.max(1,v.numVoters)*200;
          ctx.fillStyle=colors[v.candidates.indexOf(c)%colors.length];
          ctx.fillRect(cx,roundY+i*20-8,barW,10);
          ctx.fillStyle='#fff';
          ctx.font='9px monospace';
          ctx.fillText(c+':'+val,cx+barW+4,roundY+i*20);
        }
        cx+=120;
      });
    });

      ctx.font='bold 12px monospace';
      ctx.textAlign='left';

      '<div>Voters: '+v.numVoters+'</div>'+

      '<div>Condorcet: '+(v.condorcet.winner||'CYCLE')+'</div>'
    );

    $('sbMode').textContent='Voting Systems';

  onDown:function(){},

      var bWinner=Object.keys(v.results.borda).sort(function(a,b){return v.results.borda[b]-v.results.borda[a]})[0];
      var irvWinner=v.results.irv[v.results.irv.length-1];

      html+='<div class="row"><span class="k">Borda</span><span class="v">'+bWinner+'</span></div>';
      html+='<div class="row"><span class="k">IRV</span><span class="v">'+irvMax+'</span></div>';
      html+='<div class="row"><span class="k">Condorcet</span><span class="v">'+(v.condorcet.winner||'CYCLE')+'</span></div>';
      html+='</div>';
      if(pWinner!==bWinner||bWinner!==irvMax||irvMax!==v.condorcet.winner){
        html+='<div style="margin-top:10px;padding:8px;background:rgba(255,80,128,.15);border-radius:var(--rxs);font-family:var(--mono);font-size:.6rem;color:var(--c4)">';
        html+='⚠ Different voting systems produce different winners — Arrow\'s theorem in action!';
        html+='</div>';
      }
    }
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var v=STATE.voting;
    return '<div class="sec"><h4>Arrow\'s Impossibility Theorem</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+

registerModule('markets',{
  title:'Markets',
  icon:'📈',
  desc:'Supply and demand curves with tax wedge, deadweight loss, consumer and producer surplus.',
  init:function(){this.compute();},
  compute:function(){
    var m=STATE.markets;
    m.equilibrium=marketEquilibrium(m.supplyA,m.supplyB,m.demandA,m.demandB);
    m.consumerSurplus=consumerSurplus(m.equilibrium.price,m.equilibrium.quantity,m.demandA,m.demandB);
    m.producerSurplus=producerSurplus(m.equilibrium.price,m.equilibrium.quantity,m.supplyA,m.supplyB);
    if(m.tax>0){
      /* With tax: supply shifts up by tax */
      var newEq=marketEquilibrium(m.supplyA+m.supplyB*m.tax,m.supplyB,m.demandA,m.demandB);
      m.taxEquilibrium=newEq;
      m.taxRevenue=m.tax*newEq.quantity;
      m.deadweightLoss=0.5*m.tax*(m.equilibrium.quantity-newEq.quantity);
    } else {
      m.taxEquilibrium=null;
      m.taxRevenue=0;
      m.deadweightLoss=0;
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var m=STATE.markets;
    /* Plot area */
    var pad=80;
    var plotX=pad,plotY=60;
    var plotW=W-pad-60,plotH=H-140;
    ctx.fillStyle='rgba(18,18,30,.4)';
    ctx.strokeStyle='rgba(80,208,255,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,8);ctx.fill();ctx.stroke();
    /* Axes */
    ctx.strokeStyle='rgba(80,208,255,.5)';
    ctx.beginPath();
    ctx.moveTo(plotX+40,plotY+plotH-40);
    ctx.lineTo(plotX+plotW-20,plotY+plotH-40);
    ctx.moveTo(plotX+40,plotY+plotH-40);
    ctx.lineTo(plotX+40,plotY+20);
    ctx.stroke();
    /* Axis labels */
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.textAlign='center';
    ctx.fillText('Quantity',plotX+plotW/2,plotY+plotH-10);
    ctx.save();
    ctx.translate(plotX+16,plotY+plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText('Price',0,0);
    ctx.restore();
    /* Max values */
    var maxQ=m.demandA/m.demandB*1.1;
    var maxP=m.demandA/m.demandB;
    function toX(q){return plotX+40+(q/maxQ)*(plotW-60);}
    function toY(p){return plotY+plotH-40-(p/maxP)*(plotH-60);}
    /* Demand curve */
    ctx.strokeStyle='#ff5080';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    for(var q=0;q<=maxQ;q+=maxQ/100){
      var p=(m.demandA-q)/m.demandB;
      if(p<0)break;
      var px=toX(q),py=toY(p);
      if(q===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    /* Supply curve */
    ctx.strokeStyle='#50d0ff';
    ctx.beginPath();
    for(var q2=0;q2<=maxQ;q2+=maxQ/100){
      var p2=(q2-m.supplyA)/m.supplyB;
      if(p2<0)break;
      var px2=toX(q2),py2=toY(p2);
      if(q2===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
    }
    ctx.stroke();
    /* Supply + tax */
    if(m.tax>0){
      ctx.strokeStyle='rgba(80,208,255,.4)';
      ctx.setLineDash([4,3]);
      ctx.beginPath();
      for(var q3=0;q3<=maxQ;q3+=maxQ/100){
        var p3=(q3-m.supplyA-m.supplyB*m.tax)/m.supplyB;
        if(p3<0)break;
        var px3=toX(q3),py3=toY(p3);
        if(q3===0)ctx.moveTo(px3,py3);else ctx.lineTo(px3,py3);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    /* Equilibrium */
    var eq=m.equilibrium;
    var ex=toX(eq.quantity);
    var ey=toY(eq.price);
    ctx.strokeStyle='rgba(255,224,80,.5)';
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(ex,plotY+plotH-40);
    ctx.lineTo(ex,ey);
    ctx.moveTo(plotX+40,ey);
    ctx.lineTo(ex,ey);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Point */
    ctx.fillStyle='#ffe050';
    ctx.beginPath();ctx.arc(ex,ey,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    /* Labels */
    ctx.fillStyle='#ffe050';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';
    ctx.fillText('E',ex,ey-12);
    ctx.fillStyle='#ff5080';
    ctx.fillText('Demand',plotX+plotW-60,plotY+30);
    ctx.fillStyle='#50d0ff';
    ctx.fillText('Supply',plotX+plotW-60,plotY+50);
    /* Info box */
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(255,112,80,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(30,plotY+plotH+10,W-60,80,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe050';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('MARKET EQUILIBRIUM',50,plotY+plotH+32);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('Price: '+fmt(eq.price,2)+' · Quantity: '+fmt(eq.quantity,2),50,plotY+plotH+52);
    ctx.fillText('Consumer surplus: '+fmt(m.consumerSurplus,1)+' · Producer surplus: '+fmt(m.producerSurplus,1),50,plotY+plotH+72);
    setStatsHTML(
      '<div>Price: '+fmt(eq.price,2)+'</div>'+
      '<div>Quantity: '+fmt(eq.quantity,1)+'</div>'+
      '<div>CS: '+fmt(m.consumerSurplus,0)+'</div>'+
      '<div>PS: '+fmt(m.producerSurplus,0)+'</div>'+
      (m.tax>0?'<div>DWL: '+fmt(m.deadweightLoss,1)+'</div>':'')
    );
    updateBadge('📈 Markets · P='+fmt(eq.price,2)+' Q='+fmt(eq.quantity,1));
    $('sbMode').textContent='Markets';
  },
  onDown:function(){},
  controls:function(){
    var m=STATE.markets;
    var html='';
    html+='<div class="sec"><h4>Demand parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Intercept a</span><span>'+m.demandA+'</span></div>';
    html+='<input type="range" min="20" max="200" step="5" value="'+m.demandA+'" oninput="STATE.markets.demandA=parseFloat(this.value);MODULES.markets.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Slope b</span><span>'+m.demandB+'</span></div>';
    html+='<input type="range" min="0.5" max="8" step="0.1" value="'+m.demandB+'" oninput="STATE.markets.demandB=parseFloat(this.value);MODULES.markets.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Supply parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Intercept a</span><span>'+m.supplyA+'</span></div>';
    html+='<input type="range" min="-30" max="30" step="1" value="'+m.supplyA+'" oninput="STATE.markets.supplyA=parseFloat(this.value);MODULES.markets.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Slope b</span><span>'+m.supplyB+'</span></div>';
    html+='<input type="range" min="0.5" max="8" step="0.1" value="'+m.supplyB+'" oninput="STATE.markets.supplyB=parseFloat(this.value);MODULES.markets.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Tax</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Tax per unit</span><span>'+fmt(m.tax,1)+'</span></div>';
    html+='<input type="range" min="0" max="50" step="0.5" value="'+m.tax+'" oninput="STATE.markets.tax=parseFloat(this.value);MODULES.markets.compute();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var m=STATE.markets;
    return '<div class="sec"><h4>Market Equilibrium</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Demand: Q_D = a_D − b_D · P<br>'+
      'Supply: Q_S = a_S + b_S · P<br><br>'+
      'At equilibrium Q_D = Q_S:<br>'+
      'P* = (a_D − a_S)/(b_S + b_D)<br>'+
      'Q* = a_S + b_S · P*'+
      '</div></div>'+
      '<div class="sec"><h4>Welfare</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Consumer surplus = ½ · (P_max − P*) · Q*<br>'+

      '<div class="sec"><h4>Current</h4><div class="kv">'+

registerModule('auctions',{
  title:'Auctions',
  icon:'🔨',
  desc:'Compare first-price, second-price (Vickrey), English, and Dutch auctions. Witness revenue equivalence.',
  init:function(){
    this.generate();
  },
  generate:function(){
    var a=STATE.auctions;
    a.bidders=[];
    for(var i=0;i<a.numBidders;i++){
      a.bidders.push({
        value:rndF(20,100),
        bid:0
      });
    }
    this.run();
  },
  run:function(){
    var a=STATE.auctions;
    /* Bidding strategies */
    a.bidders.forEach(function(b){
      /* First price: bid shading */
      if(a.type==='firstprice')b.bid=b.value*rndF(0.6,0.85);
      /* Second price: bid truthfully */
      else if(a.type==='vickrey')b.bid=b.value;
      /* English/Dutch: bid truthfully */
      else b.bid=b.value;
    });
    /* Run auction */
    var result;
    if(a.type==='firstprice')result=firstPriceAuction(a.bidders);
    else if(a.type==='vickrey')result=secondPriceAuction(a.bidders);
    else if(a.type==='english')result=englishAuction(a.bidders);
    else if(a.type==='dutch')result=dutchAuction(a.bidders,150);
    a.result=result;
    a.revenueHistory.push(result.price);
    if(a.revenueHistory.length>50)a.revenueHistory.shift();
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;

      ctx.fillStyle='#b0b0e0';

      ctx.fillStyle='#ffe050';
      ctx.fillText('Bid: '+fmt(b.bid,1),340,y+20);

        ctx.fillText('★ WINNER',W-160,y+20);
      }

    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('AUCTION RESULT',50,ry+26);
    ctx.fillStyle='#b0b0e0';
    ctx.font='12px monospace';

      var cx=W-200,cy=ry+30;

    setStatsHTML(

  },

  controls:function(){

    var html='';

      html+='<div class="chip '+(a.type===t[0]?'active':'')+'" onclick="STATE.auctions.type=\''+t[0]+'\';MODULES.auctions.run();renderLeftPanel()">'+t[1]+'</div>';

    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.auctions.generate();renderLeftPanel()">🎲 New bidders</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.auctions.run();renderLeftPanel()">🔨 Re-run auction</button>';

      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '<b class="text-c1">First-price:</b> highest bidder wins, pays their bid. Optimal bid = shading factor × value<br><br>'+
      '<b class="text-c1">Second-price (Vickrey):</b> highest bidder wins, pays second-highest bid. Truthful bidding is dominant strategy.<br><br>'+
      '<b class="text-c1">English:</b> ascending price, last bidder standing wins<br><br>'+

/* ================================================================

   ================================================================ */
registerModule('evolution',{
  title:'Evolutionary Games',
  icon:'🧬',
  desc:'Replicator dynamics. Watch strategy frequencies evolve under natural selection.',
  init:function(){
    var e=STATE.evolution;
    e.x=0.5;
    e.history=[{t:0,x:0.5}];
    e.steps=0;
  },
  tick:function(dt){
    var e=STATE.evolution;
    if(!e.running||!STATE.playing)return;
    var simDt=0.05;
    var steps=Math.max(1,Math.round(dt*40));
    for(var i=0;i<steps;i++){
      var dx=replicator2(e.x,e.payoffs);
      e.x=clamp(e.x+dx*simDt,0,1);
      e.steps++;
      e.history.push({t:e.steps*simDt,x:e.x});
    }
    STATE.time+=dt;
    $('sbStep').textContent=e.steps;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var e=STATE.evolution;
    /* Header */
    ctx.fillStyle='#50ff90';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🧬 EVOLUTIONARY GAMES',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText('Replicator dynamics: dx/dt = x(f₁ − avg)',W/2,56);
    /* Simplex visualization */
    var cx=W/2,cy=H*0.4;
    var size=Math.min(W,H)*0.35;
    /* Triangle (2-strategy simplex) */
    ctx.strokeStyle='rgba(80,255,144,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx,cy-size);
    ctx.lineTo(cx-size,cy+size*0.7);
    ctx.moveTo(cx,cy-size);
    ctx.lineTo(cx+size,cy+size*0.7);
    ctx.stroke();
    /* Bar */
    var bx=cx-size*1.2;
    var by=cy+size*0.8;
    var bw=size*2.4;
    var bh=40;
    ctx.fillStyle='rgba(40,40,80,.6)';
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();
    ctx.fillStyle='#50ff90';
    ctx.beginPath();ctx.roundRect(bx,by,bw*e.x,bh,8);ctx.fill();
    ctx.fillStyle='#ff7050';
    ctx.beginPath();ctx.roundRect(bx+bw*e.x,by,bw*(1-e.x),bh,8);ctx.fill();
    /* Labels */
    ctx.fillStyle='#50ff90';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('Strategy 1: '+fmt(e.x*100,2)+'%',bx,by+bh+24);
    ctx.fillStyle='#ff7050';
    ctx.textAlign='right';
    ctx.fillText('Strategy 2: '+fmt((1-e.x)*100,2)+'%',bx+bw,by+bh+24);
    /* History chart */
    var hy=by+bh+50;
    var hh=H-hy-40;
    if(hh>50){
      ctx.fillStyle='rgba(18,18,30,.6)';
      ctx.strokeStyle='rgba(80,208,255,.4)';

function epiPreset(name){
  var e=STATE.epidemiology;
  if(name==='flu'){e.beta=0.26;e.gamma=0.2;}
  else if(name==='covid'){e.beta=0.4;e.gamma=0.16;}
  else if(name==='measles'){e.beta=0.9;e.gamma=0.06;}
  else if(name==='herd'){e.beta=0.4;e.gamma=0.16;e.vaccination=0.7;}
  e.R0=e.beta/e.gamma;
  MODULES.epidemiology.init();
  renderLeftPanel();
}

registerModule('socialnet',{
  title:'Social Networks',
  icon:'🕸',
  desc:'Opinion dynamics on networks. Watch consensus, polarization, and echo chambers emerge.',
  init:function(){
    var s=STATE.socialnet;
    s.agents=[];
    for(var i=0;i<s.numAgents;i++){
      s.agents.push({
        x:rndF(0.05,0.95),
        y:rndF(0.05,0.95),
        opinion:Math.random()<s.initialSpread?1:-1,
        size:5
      });
    }
    /* Build topology */
    s.adjacency=[];
    for(var j=0;j<s.numAgents;j++)s.adjacency.push([]);
    if(s.topology==='smallworld'){
      /* Ring + random shortcuts */
      var k=4;
      for(var a=0;a<s.numAgents;a++){
        for(var d=1;d<=k/2;d++){
          var b=(a+d)%s.numAgents;
          s.adjacency[a].push(b);
          s.adjacency[b].push(a);
        }
      }
      /* Add shortcuts */
      for(var sh=0;sh<s.numAgents*0.1;sh++){
        var x=rnd(0,s.numAgents-1);
        var y=rnd(0,s.numAgents-1);
        if(x!==y&&s.adjacency[x].indexOf(y)<0){
          s.adjacency[x].push(y);
          s.adjacency[y].push(x);
        }
      }
    } else if(s.topology==='random'){
      for(var a2=0;a2<s.numAgents;a2++){
        for(var b2=0;b2<s.numAgents;b2++){
          if(a2!==b2&&Math.random()<0.05){
            s.adjacency[a2].push(b2);
          }
        }
      }
    } else {
      /* Fully connected */
      for(var a3=0;a3<s.numAgents;a3++){
        for(var b3=0;b3<s.numAgents;b3++){
          if(a3!==b3)s.adjacency[a3].push(b3);
        }
      }
    }
    /* History */
    s.history=[{step:0,pos:s.agents.filter(function(a){return a.opinion>0}).length/100,neg:s.agents.filter(function(a){return a.opinion<0}).length/100}];
    s.steps=0;
    s.polarization=0;
  },
  tick:function(dt){
    var s=STATE.socialnet;
    if(!s.running||!STATE.playing)return;
    var steps=Math.max(1,Math.round(dt*20));
    for(var st=0;st<steps;st++){
      /* Update each agent: majority of neighbors */
      var newOpinions=s.agents.map(function(a,i){
        var neighbors=s.adjacency[i];
        if(!neighbors||neighbors.length===0)return a.opinion;
        var sum=0;
        neighbors.forEach(function(n){sum+=s.agents[n].opinion;});
        return sum>=0?1:-1;
      });
      s.agents.forEach(function(a,i){a.opinion=newOpinions[i];});
      s.steps++;
    }
    /* Compute polarization */
    var pos=s.agents.filter(function(a){return a.opinion>0}).length;
    var neg=s.numAgents-pos;
    s.polarization=1-Math.abs(pos-neg)/s.numAgents;
    s.history.push({step:s.steps,pos:pos/s.numAgents,neg:neg/s.numAgents});
    STATE.time+=dt;
    $('sbStep').textContent=s.steps;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#06060e';
    ctx.fillRect(0,0,W,H);
    var s=STATE.socialnet;
    /* Header */
    ctx.fillStyle='#a060ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('🕸 SOCIAL NETWORKS',W/2,36);
    ctx.fillStyle='#7070a0';
    ctx.font='11px monospace';
    ctx.fillText(s.topology+' topology · '+s.numAgents+' agents · step '+s.steps,W/2,56);
    /* Network visualization */
    var plotX=60,plotY=80;
    var plotW=W-120,plotH=H-160;
    /* Draw edges */
    ctx.strokeStyle='rgba(160,96,255,.1)';
    ctx.lineWidth=0.5;
    s.adjacency.forEach(function(neighbors,i){
      var a=s.agents[i];
      neighbors.forEach(function(j){
        if(j>i){
          var b=s.agents[j];
          ctx.beginPath();
          ctx.moveTo(plotX+a.x*plotW,plotY+a.y*plotH);
          ctx.lineTo(plotX+b.x*plotW,plotY+b.y*plotH);
          ctx.stroke();
        }
      });
    });
    /* Draw agents */
    s.agents.forEach(function(a){
      ctx.fillStyle=a.opinion>0?'#50d0ff':'#ff5080';
      ctx.beginPath();
      ctx.arc(plotX+a.x*plotW,plotY+a.y*plotH,a.size,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=1;
      ctx.stroke();
    });
    /* Info */
    var pos=s.agents.filter(function(a){return a.opinion>0}).length;
    var infoY=plotY+plotH+20;
    ctx.fillStyle='rgba(18,18,30,.9)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(40,infoY,W-80,H-infoY-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('OPINION DYNAMICS',60,infoY+24);
    ctx.fillStyle='#b0b0e0';
    ctx.font='11px monospace';
    ctx.fillText('+1: '+pos+' ('+fmt(pos/s.numAgents*100,1)+'%)   -1: '+(s.numAgents-pos)+' ('+fmt((s.numAgents-pos)/s.numAgents*100,1)+'%)',60,infoY+48);
    ctx.fillText('Polarization index: '+fmt(s.polarization,3),60,infoY+68);
    setStatsHTML(
      '<div>Agents: '+s.numAgents+'</div>'+
      '<div>Step: '+s.steps+'</div>'+
      '<div>+1: '+fmt(pos/s.numAgents*100,1)+'%</div>'+
      '<div>Polarization: '+fmt(s.polarization,2)+'</div>'
    );
    updateBadge('🕸 Social Networks · step '+s.steps);
    $('sbMode').textContent='Social Networks';
  },
  onDown:function(){},
  controls:function(){
    var s=STATE.socialnet;
    var html='';
    html+='<div class="sec"><h4>Simulation</h4>';
    html+='<button class="btn '+(s.running?'danger':'primary')+' full" onclick="STATE.socialnet.running=!STATE.socialnet.running;renderLeftPanel()">'+(s.running?'⏸ Pause':'▶ Run')+'</button>';
