[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-cli",
    "crates/forge-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/forge-rs/forge"
description = "Fast, incremental build system with content-addressed cache and remote execution"
authors = ["FORGE Contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
glob = "0.3"
rayon = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
notify = "6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
