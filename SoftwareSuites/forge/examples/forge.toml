# Example FORGE configuration for a Rust project.
#
# Drop this in your project root and run:
#     forge run build
#     forge run test
#     forge graph | dot -Tpng -o tasks.png

[forge]
version = "1"

[task.check]
command = "cargo check --all-targets"
inputs = ["**/*.rs", "Cargo.toml", "Cargo.lock"]

[task.lint]
command = "cargo clippy --all-targets -- -D warnings"
inputs = ["**/*.rs", "Cargo.toml", "Cargo.lock"]
depends = ["check"]

[task.fmt]
command = "cargo fmt --all -- --check"
inputs = ["**/*.rs"]

[task.test]
command = "cargo test --all"
inputs = ["**/*.rs", "Cargo.toml", "Cargo.lock"]
depends = ["lint"]

[task.build]
command = "cargo build --release"
inputs = ["**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/forge"]
depends = ["test", "fmt"]

[task.docs]
command = "cargo doc --no-deps"
inputs = ["**/*.rs", "Cargo.toml"]
depends = ["check"]

[task.ci]
command = "echo CI passed"
inputs = []
depends = ["build", "docs"]
