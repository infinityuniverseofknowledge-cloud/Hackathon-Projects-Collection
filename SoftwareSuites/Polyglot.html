R.tracing=function(dt){
  clear();
  var s=SNIPPETS.tracing;
  /* Draw a sample span tree */
  var spans=[
    {id:'1',parent:null,name:'HTTP GET /api/checkout',service:'frontend',start:0,duration:180,kind:'SERVER'},
    {id:'2',parent:'1',name:'auth.validate',service:'auth',start:10,duration:20,kind:'CLIENT'},
    {id:'3',parent:'1',name:'cart.fetch',service:'cart',start:30,duration:40,kind:'CLIENT'},
    {id:'4',parent:'3',name:'db.query',service:'cart-db',start:35,duration:30,kind:'CLIENT'},
    {id:'5',parent:'1',name:'payment.charge',service:'payment',start:70,duration:90,kind:'CLIENT'},
    {id:'6',parent:'5',name:'stripe.api',service:'stripe',start:80,duration:70,kind:'CLIENT'},
    {id:'7',parent:'5',name:'db.insert',service:'payment-db',start:75,duration:60,kind:'CLIENT'},
    {id:'8',parent:'1',name:'email.send',service:'notification',start:160,duration:15,kind:'PRODUCER'}
  ];
  var padL=80,padT=140;
  var rowH=28;
  var timeScale=(S.W-padL-100)/200;
  var colors={SERVER:'#00ff88',CLIENT:'#00d4ff',PRODUCER:'#a855f7',CONSUMER:'#ffb000',INTERNAL:'#7898a8'};
  spans.forEach(function(span,i){
    var y=padT+i*rowH;
    var depth=0;
    var parent=span.parent;
    while(parent){
      depth++;
      var p=spans.find(function(s2){return s2.id===parent});
      if(!p)break;
      parent=p.parent;
    }
    var x=padL+depth*30+span.start*timeScale;
    var w=span.duration*timeScale;
    var color=colors[span.kind]||'#7898a8';
    S.ctx.fillStyle=color+'40';
    S.ctx.fillRect(x,y,w,20);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(x+.5,y+.5,w-1,19);
    S.ctx.fillStyle=color;
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(span.name,x+6,y+14);
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText(span.service,padL-70+depth*30,y+14);
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.textAlign='right';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(span.duration+'ms',S.W-20,y+14);
  });
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 13px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('SPAN TREE · total 180ms',80,120);
  var html=renderCodeViewer(s.code,s.lang,s.file,s.caption);
  $('stageContent').innerHTML=html;
};

/* ══════════════ Reliability ══════════════ */
R.rateLimit=function(dt){
  clear();
  headline('Rate Limiting','5 algorithms · production patterns');
  if(!S.sim.rl){
    S.sim.rl={
      algorithm:'token',
      limiters:{
        token:new TokenBucket(10,20),
        fixed:(function(){var c=0,ws=Date.now();return function(){var now=Date.now();if(now-ws>1000){c=0;ws=now}if(c<20){c++;return true}return false}})()
      },
      history:[],
      accepted:0,
      rejected:0
    };
  }
  var rl=S.sim.rl;
  if(S.t-S.sim.lastReq>0.03){
    S.sim.lastReq=S.t;
    var ok;
    if(rl.algorithm==='token')ok=rl.limiters.token.tryConsume();
    else ok=rl.limiters.fixed();
    rl.history.push({time:Date.now(),ok:ok});
    if(rl.history.length>100)rl.history.shift();
    if(ok)rl.accepted++;else rl.rejected++;
  }
  /* Plot */
  var padL=60,padT=180;
  var plotW=S.W-padL*2,plotH=200;
  S.ctx.fillStyle='rgba(8,18,28,.8)';
  S.ctx.fillRect(padL,padT,plotW,plotH);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(padL+.5,padT+.5,plotW-1,plotH-1);
  rl.history.forEach(function(h,i){
    var x=padL+(i/rl.history.length)*plotW;
    var y=padT+plotH/2+(h.ok?-40:40);
    S.ctx.fillStyle=h.ok?'#00ff88':'#ff4444';
    S.ctx.beginPath();S.ctx.arc(x,y,3,0,Math.PI*2);S.ctx.fill();
  });
  /* Stats */
  var total=rl.accepted+rl.rejected;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Rate: '+fmt(rl.accepted/total*100||0,1)+'% accepted',padL,padT+plotH+40);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('accepted: '+rl.accepted+' · rejected: '+rl.rejected,padL,padT+plotH+65);
  /* Code */
  var algos=[
    {k:'token',n:'Token Bucket'},
    {k:'fixed',n:'Fixed Window'}
  ];
  algos.forEach(function(a,i){
    var x=60+i*160,y=S.H-50;
    S.ctx.fillStyle=rl.algorithm===a.k?'rgba(0,255,136,.3)':'rgba(8,18,28,.9)';
    S.ctx.fillRect(x,y,150,32);
    S.ctx.strokeStyle=rl.algorithm===a.k?'#00ff88':'rgba(0,255,136,.4)';
    S.ctx.lineWidth=rl.algorithm===a.k?2:1;
    S.ctx.strokeRect(x+.5,y+.5,149,31);
    S.ctx.fillStyle=rl.algorithm===a.k?'#5cffb0':'#7898a8';

R.circuitBreaker=function(dt){
  clear();
  headline('Circuit Breaker','CLOSED → OPEN → HALF-OPEN');
  if(!S.sim.cb){S.sim.cb={cb:new CircuitBreaker(5,3000),history:[],requests:0}}
  var c=S.sim.cb;
  if(S.t-S.sim.lastReq>0.1){
    S.sim.lastReq=S.t;
    if(c.cb.allow()){
      c.requests++;
      var ok=Math.random()<0.7;
      if(ok)c.cb.success();else c.cb.failure();
      c.history.push({allowed:true,success:ok,state:c.cb.state});
    } else {
      c.history.push({allowed:false,success:false,state:c.cb.state});
    }
    if(c.history.length>60)c.history.shift();
  }
  var cx=S.W/2,cy=S.H/2;
  var states=[
    {name:'CLOSED',x:cx-200,y:cy-60,color:'#00ff88'},
    {name:'OPEN',x:cx+200,y:cy-60,color:'#ff4444'},
    {name:'HALF-OPEN',x:cx,y:cy+120,color:'#ffb000'}
  ];
  /* Edges */
  [[0,1],[1,2],[2,0],[2,1]].forEach(function(e){
    var a=states[e[0]],b=states[e[1]];
    var ang=Math.atan2(b.y-a.y,b.x-a.x);
    var x1=a.x+Math.cos(ang)*70,y1=a.y+Math.sin(ang)*70;
    var x2=b.x-Math.cos(ang)*70,y2=b.y-Math.sin(ang)*70;
    S.ctx.strokeStyle='rgba(120,152,168,.5)';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    S.ctx.moveTo(x1,y1);S.ctx.lineTo(x2,y2);
    S.ctx.stroke();
    S.ctx.beginPath();
    S.ctx.moveTo(x2,y2);
    S.ctx.lineTo(x2-10*Math.cos(ang-0.3),y2-10*Math.sin(ang-0.3));
    S.ctx.lineTo(x2-10*Math.cos(ang+0.3),y2-10*Math.sin(ang+0.3));
    S.ctx.closePath();
    S.ctx.fillStyle='rgba(120,152,168,.5)';
    S.ctx.fill();
  });
  states.forEach(function(st){
    var isAct=c.cb.state===st.name;
    S.ctx.fillStyle=isAct?st.color+'40':'rgba(8,18,28,.9)';
    S.ctx.beginPath();S.ctx.arc(st.x,st.y,60,0,Math.PI*2);S.ctx.fill();
    S.ctx.strokeStyle=isAct?st.color:'rgba(120,152,168,.3)';
    S.ctx.lineWidth=isAct?3:1.5;
    S.ctx.stroke();
    S.ctx.fillStyle=isAct?st.color:'#7898a8';
    S.ctx.font='700 13px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(st.name,st.x,st.y+5);
  });
  var allowedCount=c.history.filter(function(h){return h.allowed}).length;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('State: '+c.cb.state+' · Failures: '+c.cb.failures+'/'+c.cb.threshold,60,S.H-50);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText('Requests: '+c.requests+' · Allowed: '+allowedCount,60,S.H-30);
};

R.backoff=function(dt){
  clear();
  headline('Retries & Backoff','exponential with jitter');
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'attempt','delay (ms)');
  var strategies=[
    {name:'fixed',color:'#7898a8',fn:function(i){return 1000}},
    {name:'linear',color:'#00d4ff',fn:function(i){return 1000*i}},
    {name:'exponential',color:'#00ff88',fn:function(i){return Math.min(30000,1000*Math.pow(2,i-1))}},
    {name:'full jitter',color:'#ffb000',fn:function(i){return Math.random()*Math.min(30000,1000*Math.pow(2,i-1))}},
    {name:'equal jitter',color:'#a855f7',fn:function(i){
      var cap=Math.min(30000,1000*Math.pow(2,i-1));
      return cap/2+Math.random()*cap/2;
    }}
  ];
  strategies.forEach(function(s,idx){
    S.ctx.strokeStyle=s.color;
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    for(var i=1;i<=8;i++){
      var d=s.fn(i);
      var x=padL+((i-1)/7)*plotW;
      var y=padT+plotH-(d/30000)*plotH*0.9;
      if(i===1)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    S.ctx.fillStyle=s.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('▪ '+s.name,padL+10+((idx%3)*180),padT+20+Math.floor(idx/3)*18);
  });
  /* Samples */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('EXAMPLE DELAYS (attempts 1-5)',padL,S.H-140);
  strategies.forEach(function(s,si){
    S.ctx.fillStyle=s.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(s.name+':',padL,S.H-115+si*20);
    for(var i=1;i<=5;i++){
      S.ctx.fillText(Math.round(s.fn(i))+'ms',padL+120+(i-1)*90,S.H-115+si*20);
    }
  });
};

    html+='<div class="sec-head">Stats</div>';
    html+=prop('Accepted',rl.accepted||0,'gr');
    html+=prop('Rejected',rl.rejected||0,'rd');
  }
  else if(id==='cidr'){
    var c=S.sim.cidr||{input:'10.0.0.0/24'};
    html+='<div class="sec-head">Input</div>';
    html+='<div class="field"><label>CIDR notation</label><input type="text" value="'+c.input+'" onchange="S.sim.cidr.input=this.value;renderInfo()"></div>';
    html+='<div class="sec-head">Private ranges</div>';
    html+='<div class="hint">• 10.0.0.0/8 (16.7M addrs)<br>• 172.16.0.0/12 (1M addrs)<br>• 192.168.0.0/16 (65K addrs)<br>• 100.64.0.0/10 (CGNAT)<br>• 169.254.0.0/16 (link-local)</div>';
  }
  else {
    var m=MODULES.find(function(x){return x.id===id});
    if(m){
      html+='<div class="sec-head">'+m.name+'</div>';
      html+='<div class="hint">'+m.sub+'</div>';
      if(m.lang&&m.lang!=='multi'){
        html+='<div class="sec-head">Language</div>';
        html+='<div class="hint"><span class="lang-badge '+(LANG_BADGE[m.lang]||'')+'">'+(LANG_LABEL[m.lang]||m.lang)+'</span></div>';
      }
    }
  }
  body.innerHTML=html;
}
function prop(k,v,cls){
  return '<div class="prop"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v)+'</span></div>';
}
</script>
<script>
/* ══════════════ Interactions ══════════════ */
function bindInteractions(){
  S.cv.addEventListener('click',function(e){
    var r=S.cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    if(S.module==='cidr'&&S.sim.cidrBtns){
      S.sim.cidrBtns.forEach(function(b){
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          S.sim.cidr.input=b.k;
          toast('CIDR: '+b.k,'gr');
        }
      });
    }
    if(S.module==='rateLimit'&&S.sim.rlBtns){
      S.sim.rlBtns.forEach(function(b){
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          S.sim.rl.algorithm=b.k;
          S.sim.rl.history=[];
          toast('Algorithm: '+b.k,'cy');
        }
      });
    }
  });
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key==='r'||e.key==='R'){
      if(S.module==='k8sRollout')S.sim.k8sD.tl=null;
      if(S.module==='rateLimit')S.sim.rl.history=[];
    }
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0||(m.lang&&m.lang.indexOf(q)>=0);
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

function renderModule(){
  var r=R[S.module];
  if(r)r(0);
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#02060a';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff4444';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'loading tokenizer…',pct:10},
    {msg:'compiling language configs…',pct:22},
    {msg:'parsing snippets…',pct:38},
    {msg:'initializing canvas…',pct:55},
    {msg:'mounting modules…',pct:75},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,180);
  }
  setTimeout(next,200);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  boot();
  requestAnimationFrame(loop);
  console.log('%c POLYGLOT ','background:linear-gradient(90deg,#00ff88,#00d4ff,#ff2d92);color:#02060a;padding:10px 22px;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('Multi-Language DevOps Workbench · '+MODULES.length+' modules · '+Object.keys(LANG_CONFIGS).length+' languages');
  console.log('Real syntax highlighting for Bash/Python/Go/Rust/TS/YAML/HCL/SQL/PromQL/Lua/Make/Groovy');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
</body>
</html>
