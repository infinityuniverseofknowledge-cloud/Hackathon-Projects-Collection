<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>POLYGLOT — Multi-Language DevOps Workbench</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#02060a;color:#c0d8d0;font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
:root{
  --bg:#02060a;--bg2:#050c12;--panel:#08121c;--panel2:#0e1c2a;--panel3:#182c40;--panel4:#243d56;
  --bd:#0e1c2a;--bd2:#182c40;--bd3:#2e4d6a;
  --tx:#c0d8d0;--tx2:#7898a8;--tx3:#3d5a70;--tx4:#182c40;
  --gr:#00ff88;--gr2:#5cffb0;--gr3:#00a558;
  --am:#ffb000;--am2:#ffcc55;
  --cy:#00d4ff;--cy2:#5ce5ff;
  --rd:#ff4444;--rd2:#ff8080;
  --pu:#a855f7;--pu2:#c899ff;
  --pk:#ff2d92;--pk2:#ff85c0;
  --bl:#3d80ff;--bl2:#80aaff;
  /* Polyglot token colors */
  --tk-kw:#ff2d92;--tk-str:#00ff88;--tk-cmt:#3d5a70;--tk-num:#ffb000;
  --tk-id:#c0d8d0;--tk-blt:#00d4ff;--tk-typ:#a855f7;--tk-op:#7898a8;
  --mo:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --sa:'Inter',-apple-system,system-ui,sans-serif;
  --di:'Orbitron','Chakra Petch','Inter',sans-serif;
  --t:.15s cubic-bezier(.4,0,.2,1);
}
::selection{background:rgba(0,255,136,.35);color:#fff}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 12% 18%,rgba(0,255,136,.07),transparent 40%),
  radial-gradient(circle at 88% 82%,rgba(0,212,255,.06),transparent 45%),
  radial-gradient(circle at 50% 50%,rgba(255,45,146,.04),transparent 60%),
  radial-gradient(circle at 80% 20%,rgba(168,85,247,.05),transparent 40%),
  linear-gradient(rgba(0,255,136,.02) 1px,transparent 1px) 0 0/30px 30px,
  linear-gradient(90deg,rgba(0,255,136,.02) 1px,transparent 1px) 0 0/30px 30px,
  #02060a}

#shell{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}

.top{height:50px;background:linear-gradient(180deg,rgba(8,18,28,.96),rgba(2,6,10,.96));backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;position:relative;z-index:100}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),var(--cy),var(--pk),transparent);opacity:.7}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--di);font-weight:900;font-size:1.3rem;letter-spacing:4px;color:var(--gr);text-shadow:0 0 22px rgba(0,255,136,.6)}
.brand-sub{font-family:var(--mo);font-size:9px;letter-spacing:2.4px;color:var(--tx3);text-transform:uppercase}
.div{width:1px;height:24px;background:var(--bd2)}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:#000;border:1px solid var(--bd2);border-radius:3px}
.chip span{font-family:var(--mo);font-size:9px;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase}
.chip b{font-family:var(--mo);font-size:11px;color:var(--gr2);font-weight:600}
.chip b.cy{color:var(--cy2)}
.chip b.pk{color:var(--pk2)}
.chip b.am{color:var(--am2)}
.chip b.pu{color:var(--pu2)}
.stats{display:flex;gap:14px;margin-left:auto;font-family:var(--mo);font-size:10px;letter-spacing:.8px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font-size:8px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px}
.stat .v{color:var(--gr2);font-weight:600}

.main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}

.nav{width:260px;background:rgba(8,18,28,.94);backdrop-filter:blur(12px);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-search{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-search input{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11px;color:var(--gr2);letter-spacing:.5px;transition:var(--t)}
.nav-search input:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,136,.12)}
.nav-search input::placeholder{color:var(--tx3)}
.nav-cat{padding:11px 0 3px}
.nav-cat-label{font-family:var(--mo);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);padding:0 13px 5px;font-weight:600;display:flex;align-items:center;gap:6px}
.nav-cat-label .badge-lang{background:var(--panel3);border:1px solid var(--bd2);border-radius:6px;padding:0 5px;font-size:7.5px;color:var(--gr2);letter-spacing:1px}
.nav-item{padding:6px 13px;font-size:12px;color:var(--tx2);cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:10px;position:relative}
.nav-item:hover{background:rgba(0,255,136,.06);color:var(--tx)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,255,136,.16),transparent);color:var(--gr2);border-left:2px solid var(--gr);padding-left:11px}
.nav-item .ico{font-size:13px;width:18px;text-align:center;opacity:.85;font-family:var(--mo)}

.stage{flex:1;position:relative;overflow:hidden;background:transparent;min-width:0;display:flex;flex-direction:column}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stageContent{position:absolute;inset:0;pointer-events:none;z-index:5}

.info{width:340px;background:rgba(8,18,28,.94);backdrop-filter:blur(12px);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.info-head{padding:13px 17px;border-bottom:1px solid var(--bd);position:relative;background:linear-gradient(180deg,rgba(0,255,136,.05),transparent)}
.info-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),transparent);opacity:.55}
.info-title{font-family:var(--di);font-size:1.15rem;font-weight:700;color:var(--tx);letter-spacing:.5px}
.info-sub{font-family:var(--mo);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.info-body{padding:14px 17px 24px;flex:1}

.prop{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-family:var(--mo);font-size:11px;gap:12px;align-items:baseline}
.prop:last-child{border-bottom:none}
.prop .k{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;flex-shrink:0}
.prop .v{color:var(--tx);text-align:right;font-weight:500;word-break:break-word}
.prop .v.gr{color:var(--gr2)}
.prop .v.cy{color:var(--cy2)}
.prop .v.am{color:var(--am2)}
.prop .v.pu{color:var(--pu2)}
.prop .v.pk{color:var(--pk2)}
.prop .v.rd{color:var(--rd2)}

.sec-head{font-family:var(--mo);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);margin:15px 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-head::before{content:'';flex:1;height:1px;background:var(--bd);order:-1}
.sec-head::after{content:'';flex:0 0 8px;height:1px;background:var(--gr)}
.sec-head:first-child{margin-top:0}

.btn{padding:7px 13px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);border-radius:3px;font-family:var(--mo);font-size:10.5px;font-weight:500;letter-spacing:.4px;cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel3);border-color:var(--gr);color:var(--gr2)}
.btn.primary{background:linear-gradient(135deg,var(--gr),var(--gr3));color:#02060a;border-color:transparent;font-weight:600}
.btn.cy{background:linear-gradient(135deg,var(--cy),#0891cc);color:#02060a;font-weight:600}
.btn.am{background:linear-gradient(135deg,var(--am),#cc8000);color:#02060a;font-weight:600}
.btn.pu{background:linear-gradient(135deg,var(--pu),#7c2ecc);color:#fff;font-weight:600}
.btn.pk{background:linear-gradient(135deg,var(--pk),#cc0e6a);color:#fff;font-weight:600}
.btn.rd{background:rgba(255,68,68,.15);border-color:var(--rd);color:var(--rd2)}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.full{width:100%;justify-content:center}

.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mo);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11.5px;color:var(--gr2);letter-spacing:.3px}
.field textarea{resize:vertical;min-height:70px;line-height:1.55;font-family:var(--mo);font-size:11px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,136,.1)}
.field select option{background:#08121c;color:var(--gr2)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 13px;background:rgba(8,18,28,.96);border:1px solid var(--bd2);border-left:3px solid var(--gr);font-family:var(--mo);font-size:10.5px;color:var(--tx);letter-spacing:.3px;max-width:340px;animation:tin .25s;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:3px}
.toast.cy{border-left-color:var(--cy)}
.toast.am{border-left-color:var(--am)}
.toast.rd{border-left-color:var(--rd)}
.toast.pu{border-left-color:var(--pu)}
.toast.pk{border-left-color:var(--pk)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ══════ CODE VIEWER ══════ */
.code-container{position:absolute;top:100px;left:40px;right:40px;bottom:60px;background:rgba(2,6,10,.92);border:1px solid var(--bd2);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 60px rgba(0,0,0,.6)}
.code-header{background:linear-gradient(180deg,rgba(14,28,42,.95),rgba(8,18,28,.95));border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.code-header .dots{display:flex;gap:5px}
.code-header .dots span{width:11px;height:11px;border-radius:50%;display:block}
.code-header .dot-r{background:#ff5f56}
.code-header .dot-y{background:#ffbd2e}
.code-header .dot-g{background:#27c93f}
.code-header .filename{font-family:var(--mo);font-size:11px;color:var(--tx2);letter-spacing:.5px;margin-left:8px}
.code-header .lang-tag{margin-left:auto;background:var(--panel3);border:1px solid var(--bd2);border-radius:4px;padding:3px 9px;font-family:var(--mo);font-size:9.5px;color:var(--gr2);letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.code-body{flex:1;overflow:auto;padding:0;font-family:var(--mo);font-size:12.5px;line-height:1.65;letter-spacing:.15px;user-select:text}
.code-body pre{margin:0;padding:16px 20px;white-space:pre;overflow:visible}
.code-body .ln{display:inline-block;width:44px;color:var(--tx3);text-align:right;padding-right:16px;user-select:none;position:sticky;left:0;background:rgba(2,6,10,.95)}
.tk-keyword{color:var(--tk-kw);font-weight:600}
.tk-string{color:var(--tk-str)}
.tk-comment{color:var(--tk-cmt);font-style:italic}
.tk-number{color:var(--tk-num)}
.tk-identifier{color:var(--tk-id)}
.tk-builtin{color:var(--tk-blt)}
.tk-type{color:var(--tk-typ);font-weight:500}
.tk-operator{color:var(--tk-op)}

.code-caption{position:absolute;top:64px;left:40px;right:40px;font-family:var(--mo);font-size:10.5px;color:var(--tx3);letter-spacing:.3px}
.code-caption b{color:var(--gr2);font-weight:600}

.code-tabs{display:flex;gap:0;position:absolute;top:78px;left:40px;right:40px;border-bottom:1px solid var(--bd);z-index:6;pointer-events:auto}
.code-tab{padding:7px 14px;font-family:var(--mo);font-size:10.5px;letter-spacing:.5px;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:var(--t);text-transform:uppercase;font-weight:600}
.code-tab:hover{color:var(--tx2)}
.code-tab.active{color:var(--gr2);border-bottom-color:var(--gr)}

.lang-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-family:var(--mo);font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-right:6px}
.lb-bash{background:rgba(0,255,136,.15);color:var(--gr2);border:1px solid rgba(0,255,136,.3)}
.lb-py{background:rgba(255,176,0,.15);color:var(--am2);border:1px solid rgba(255,176,0,.3)}
.lb-go{background:rgba(0,212,255,.15);color:var(--cy2);border:1px solid rgba(0,212,255,.3)}
.lb-rs{background:rgba(255,45,146,.15);color:var(--pk2);border:1px solid rgba(255,45,146,.3)}
.lb-js{background:rgba(255,176,0,.15);color:var(--am2);border:1px solid rgba(255,176,0,.3)}
.lb-ts{background:rgba(61,128,255,.15);color:var(--bl2);border:1px solid rgba(61,128,255,.3)}
.lb-yaml{background:rgba(168,85,247,.15);color:var(--pu2);border:1px solid rgba(168,85,247,.3)}
.lb-sql{background:rgba(0,255,136,.15);color:var(--gr2);border:1px solid rgba(0,255,136,.3)}
.lb-hcl{background:rgba(168,85,247,.15);color:var(--pu2);border:1px solid rgba(168,85,247,.3)}
.lb-docker{background:rgba(0,212,255,.15);color:var(--cy2);border:1px solid rgba(0,212,255,.3)}
.lb-promql{background:rgba(255,176,0,.15);color:var(--am2);border:1px solid rgba(255,176,0,.3)}
.lb-lua{background:rgba(61,128,255,.15);color:var(--bl2);border:1px solid rgba(61,128,255,.3)}
.lb-make{background:rgba(120,152,168,.15);color:var(--tx2);border:1px solid rgba(120,152,168,.3)}
.lb-groovy{background:rgba(0,255,136,.15);color:var(--gr2);border:1px solid rgba(0,255,136,.3)}
.lb-toml{background:rgba(0,212,255,.15);color:var(--cy2);border:1px solid rgba(0,212,255,.3)}
.lb-proto{background:rgba(168,85,247,.15);color:var(--pu2);border:1px solid rgba(168,85,247,.3)}

.hint{font-family:var(--mo);font-size:10.5px;color:var(--tx3);line-height:1.7;letter-spacing:.3px}
.hint b{color:var(--tx2)}
.hint code{background:var(--panel2);border:1px solid var(--bd);border-radius:3px;padding:1px 5px;font-family:var(--mo);font-size:10.5px;color:var(--gr2)}

#boot{position:fixed;inset:0;background:#02060a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9990;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.boot-canvas{width:260px;height:160px;position:relative;margin-bottom:8px}
.boot-canvas svg{width:100%;height:100%}
.boot-canvas svg *{opacity:0;animation:pgIn .4s forwards}
.boot-canvas svg *:nth-child(1){animation-delay:.02s}
.boot-canvas svg *:nth-child(2){animation-delay:.04s}
.boot-canvas svg *:nth-child(3){animation-delay:.06s}
.boot-canvas svg *:nth-child(4){animation-delay:.08s}
.boot-canvas svg *:nth-child(5){animation-delay:.10s}
.boot-canvas svg *:nth-child(6){animation-delay:.12s}
.boot-canvas svg *:nth-child(7){animation-delay:.14s}
.boot-canvas svg *:nth-child(8){animation-delay:.16s}
.boot-canvas svg *:nth-child(9){animation-delay:.18s}
.boot-canvas svg *:nth-child(10){animation-delay:.20s}
.boot-canvas svg *:nth-child(11){animation-delay:.22s}
.boot-canvas svg *:nth-child(12){animation-delay:.24s}
.boot-canvas svg *:nth-child(13){animation-delay:.26s}
.boot-canvas svg *:nth-child(14){animation-delay:.28s}
.boot-canvas svg *:nth-child(15){animation-delay:.30s}
.boot-canvas svg *:nth-child(16){animation-delay:.32s}
@keyframes pgIn{to{opacity:1}}
.boot-mark{font-family:var(--di);font-size:2.6rem;font-weight:900;letter-spacing:8px;color:var(--gr);text-shadow:0 0 40px rgba(0,255,136,.7)}
.boot-sub{font-family:var(--mo);font-size:10px;letter-spacing:4px;color:var(--tx3);text-transform:uppercase}
.boot-bar{width:320px;height:2px;background:var(--panel3);overflow:hidden;border-radius:1px}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),var(--cy),var(--pk));transition:width .3s;box-shadow:0 0 12px var(--gr)}

@media(max-width:1100px){.nav{width:200px}.info{width:280px}}
@media(max-width:800px){.nav{width:60px}.nav-item span:not(.ico){display:none}.nav-cat-label span:not(.badge-lang){display:none}.info{width:240px}.code-container{left:20px;right:20px}.code-caption,.code-tabs{left:20px;right:20px}}
</style>
</head>
<body>

<div id="bg"></div>

<div id="boot">
  <div class="boot-canvas">
    <svg viewBox="0 0 260 160" fill="none" stroke="#00ff88" stroke-width="1.1">
      <rect x="10" y="20" width="55" height="30" rx="4"/>
      <text x="37" y="40" fill="#5cffb0" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">bash</text>
      <rect x="10" y="65" width="55" height="30" rx="4" stroke="#ffb000"/>
      <text x="37" y="85" fill="#ffcc55" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">python</text>
      <rect x="10" y="110" width="55" height="30" rx="4" stroke="#00d4ff"/>
      <text x="37" y="130" fill="#5ce5ff" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">go</text>
      <rect x="100" y="10" width="60" height="30" rx="4" stroke="#ff2d92"/>
      <text x="130" y="30" fill="#ff85c0" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">rust</text>
      <rect x="100" y="50" width="60" height="30" rx="4" stroke="#3d80ff"/>
      <text x="130" y="70" fill="#80aaff" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">typescript</text>
      <rect x="100" y="90" width="60" height="30" rx="4" stroke="#a855f7"/>
      <text x="130" y="110" fill="#c899ff" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">yaml</text>
      <rect x="100" y="130" width="60" height="30" rx="4" stroke="#00ff88"/>
      <text x="130" y="150" fill="#5cffb0" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">sql</text>
      <rect x="195" y="20" width="55" height="30" rx="4" stroke="#a855f7"/>
      <text x="222" y="40" fill="#c899ff" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">hcl</text>
      <rect x="195" y="65" width="55" height="30" rx="4" stroke="#00d4ff"/>
      <text x="222" y="85" fill="#5ce5ff" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">docker</text>
      <rect x="195" y="110" width="55" height="30" rx="4" stroke="#ffb000"/>
      <text x="222" y="130" fill="#ffcc55" font-family="monospace" font-size="10" text-anchor="middle" stroke="none">promql</text>
      <line x1="65" y1="35" x2="100" y2="25" opacity="0.4"/>
      <line x1="65" y1="80" x2="100" y2="65" opacity="0.4"/>
      <line x1="65" y1="125" x2="100" y2="105" opacity="0.4"/>
      <line x1="160" y1="25" x2="195" y2="35" opacity="0.4"/>
      <line x1="160" y1="65" x2="195" y2="80" opacity="0.4"/>
      <line x1="160" y1="105" x2="195" y2="125" opacity="0.4"/>
    </svg>
  </div>
  <div class="boot-mark">POLYGLOT</div>
  <div class="boot-sub">multi-language devops workbench</div>
  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-sub" id="bootStatus" style="font-size:8px">loading…</div>
</div>

<div id="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-name">POLYGLOT</span>
      <span class="brand-sub">multi-language devops</span>
    </div>
    <div class="div"></div>

/* ══════════ Tokenizer ══════════ */
function tokenize(code,lang){
  var cfg=LANG_CONFIGS[lang];
  if(!cfg)return [{t:'identifier',s:code}];
  var tokens=[];
  var i=0;
  var n=code.length;
  while(i<n){
    /* Comment */
    if(cfg.comment&&code.substr(i,cfg.comment.length)===cfg.comment){
      var end=code.indexOf('\n',i);
      if(end===-1)end=n;
      tokens.push({t:'comment',s:code.substring(i,end)});
      i=end;
      continue;
    }
    /* Block comment for C-like */
    if((lang==='go'||lang==='rust'||lang==='js'||lang==='ts'||lang==='groovy'||lang==='proto')&&code.substr(i,2)==='/*'){
      var end2=code.indexOf('*/',i+2);
      if(end2===-1)end2=n;
      else end2+=2;
      tokens.push({t:'comment',s:code.substring(i,end2)});
      i=end2;
      continue;
    }
    /* String */
    var strMatched=false;
    for(var si=0;si<cfg.strings.length;si++){
      if(code[i]===cfg.strings[si]){
        var q=cfg.strings[si];
        var j=i+1;
        while(j<n&&code[j]!==q){
          if(code[j]==='\\')j++;
          j++;
        }
        j=Math.min(j+1,n);
        tokens.push({t:'string',s:code.substring(i,j)});
        i=j;
        strMatched=true;
        break;
      }
    }
    if(strMatched)continue;
    /* Number */
    if(/[0-9]/.test(code[i])||(code[i]==='.'&&/[0-9]/.test(code[i+1]||''))){
      var j2=i;
      while(j2<n&&/[0-9._a-fA-FxXeE+-]/.test(code[j2]))j2++;
      tokens.push({t:'number',s:code.substring(i,j2)});
      i=j2;
      continue;
    }
    /* Identifier/Keyword */
    if(/[a-zA-Z_$]/.test(code[i])){
      var j3=i;
      while(j3<n&&/[a-zA-Z0-9_$-]/.test(code[j3]))j3++;
      var w=code.substring(i,j3);
      var wu=w.toUpperCase();
      var wl=w.toLowerCase();
      var type='identifier';
      if(cfg.keywords&&(cfg.keywords.indexOf(w)>=0||cfg.keywords.indexOf(wu)>=0))type='keyword';
      else if(cfg.types&&(cfg.types.indexOf(w)>=0||cfg.types.indexOf(wu)>=0))type='type';
      else if(cfg.builtins&&cfg.builtins.indexOf(w)>=0)type='builtin';
      tokens.push({t:type,s:w});
      i=j3;
      continue;
    }
    /* Default */
    tokens.push({t:'operator',s:code[i]});
    i++;
  }
  return tokens;
}

function highlight(code,lang){
  var toks=tokenize(code,lang);
  return toks.map(function(t){return '<span class="tk-'+t.t+'">'+esc(t.s)+'</span>'}).join('');
}

function murmur3(key,seed){
  seed=seed||0;
  var h=seed>>>0;
  for(var i=0;i<key.length;i++){
    var k=key.charCodeAt(i);
    k=Math.imul(k,0xcc9e2d51);k=(k<<15)|(k>>>17);k=Math.imul(k,0x1b873593);
    h^=k;h=(h<<13)|(h>>>19);h=(Math.imul(h,5)+0xe6546b64)>>>0;
  }
  h^=key.length;h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;
  return h>>>0;
}
function parseCIDR(cidr){
  var m=cidr.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/);
  if(!m)return null;
  var ip=(parseInt(m[1])<<24)|(parseInt(m[2])<<16)|(parseInt(m[3])<<8)|parseInt(m[4]);
  var prefix=parseInt(m[5]);
  var mask=prefix===0?0:((0xFFFFFFFF<<(32-prefix))>>>0);
  var network=(ip&mask)>>>0;
  var broadcast=(network|~mask)>>>0;
  var hosts=prefix>=31?0:Math.pow(2,32-prefix)-2;
  return {network:network,broadcast:broadcast,mask:mask,prefix:prefix,hosts:hosts};
}
function ipStr(n){return ((n>>>24)&0xFF)+'.'+((n>>>16)&0xFF)+'.'+((n>>>8)&0xFF)+'.'+(n&0xFF)}
function TokenBucket(rate,capacity){this.rate=rate;this.capacity=capacity;this.tokens=capacity;this.last=Date.now()}
TokenBucket.prototype.tryConsume=function(){
  var now=Date.now();
  this.tokens=Math.min(this.capacity,this.tokens+(now-this.last)/1000*this.rate);
  this.last=now;
  if(this.tokens>=1){this.tokens--;return true}
  return false;
};
function CircuitBreaker(threshold,timeout){
  this.state='CLOSED';this.failures=0;this.threshold=threshold;this.timeout=timeout;this.openedAt=0;
}
CircuitBreaker.prototype.allow=function(){
  if(this.state==='CLOSED')return true;
  if(this.state==='OPEN'){
    if(Date.now()-this.openedAt>this.timeout){this.state='HALF_OPEN';return true}
    return false;
  }
  return true;
};
CircuitBreaker.prototype.success=function(){
  if(this.state==='HALF_OPEN'){this.state='CLOSED';this.failures=0}
  else this.failures=0;
};
CircuitBreaker.prototype.failure=function(){
  this.failures++;
  if(this.state==='HALF_OPEN'||this.failures>=this.threshold){
    this.state='OPEN';this.openedAt=Date.now();
  }
};
function expBackoff(attempt,base,max){
  base=base||100;max=max||30000;
  return rnd(0,Math.min(max,base*Math.pow(2,attempt)));
}
function schedulePod(pod,nodes){
  var feasible=nodes.filter(function(n){return n.cpuFree>=pod.cpuRequest&&n.memFree>=pod.memRequest&&!n.taints});
  return feasible.map(function(n){
    var cpuScore=100*(1-n.cpuUsed/n.cpuTotal);
    var memScore=100*(1-n.memUsed/n.memTotal);
    var balanced=100-Math.abs(n.cpuUsed/n.cpuTotal-n.memUsed/n.memTotal)*100;
    return {node:n,cpuScore:cpuScore,memScore:memScore,balanced:balanced,score:cpuScore*0.4+memScore*0.3+balanced*0.3};
  }).sort(function(a,b){return b.score-a.score});
}

set -euo pipefail

readonly LOG="\${1:-/var/log/nginx/access.log}"

# ─── Top 10 IPs by request count ───
# awk $1 = ip, then sort numerically by count
awk '{print $1}' "$LOG" \\
  | sort \\
  | uniq -c \\
  | sort -rn \\
  | head -n 10

# ─── Top URLs with response time p95 ───
# $7 = URL, $NF = time_ms
awk '
  {
    url = $7
    count[url]++
    times[url][count[url]] = $NF + 0
  }
  END {
    for (u in count) {
      n = asort(times[u], sorted)
      p95 = sorted[int(n * 0.95)]
      printf "%-60s %6d reqs  p95=%6.1f ms\\n", u, count[u], p95
    }
  }
' "$LOG" | sort -k2 -rn | head -20

# ─── Transform JSON-ish log to CSV with sed ───
sed -E '
  s/^\\{//; s/\\}$//
  s/"([^"]+)":/"\\1",/g
  s/,$//
' "$LOG" | head -3

# ─── Stream-process 100 GB without buffering ───
# stdbuf -o0 tail -F "$LOG" \\
#   | grep --line-buffered -E ' 5[0-9]{2} ' \\
#   | awk '{print strftime("%H:%M:%S"), $7, $9}'`
};

set -euo pipefail

# ─── jq: filter Kubernetes pods by status ───
kubectl get pods -A -o json \\
  | jq -r '
      .items[]
      | select(.status.phase != "Running")
      | "\\(.metadata.namespace)/\\(.metadata.name)\\t\\(.status.phase)"
    '

# ─── jq: aggregate container restarts by namespace ───
kubectl get pods -A -o json \\
  | jq '
      [ .items[] | {
          ns: .metadata.namespace,
          restarts: ([.status.containerStatuses[]?.restartCount] | add // 0)
        }
      ]
      | group_by(.ns)
      | map({ns: .[0].ns, total: (map(.restarts) | add)})
      | sort_by(-.total)
    '

# ─── jq: transform CloudTrail event ───
jq -c '.Records[]
  | select(.eventSource | startswith("ec2."))
  | {
      time: .eventTime,
      action: .eventName,
      user: .userIdentity.arn,
      ip: .sourceIPAddress,
      resources: [.resources[]?.ARN]
    }' cloudtrail.json

# ─── jq: slurp + reduce ───
jq -s 'reduce .[] as $item ({}; . * $item)' config-*.json

# ─── yq: extract image tags from K8s manifests ───
yq e '.spec.template.spec.containers[].image' deployment.yaml

# ─── yq: multi-doc update in place ───
yq e -i '
  select(.kind == "Deployment")
  | .spec.replicas = 5
' k8s/*.yaml

# ─── yq: convert YAML to JSON on the fly ───
yq e -o=json '.' config.yaml | jq '.server.port'

# ─── yq: merge overlapping maps ───
yq ea '. as $item ireduce ({}; . * $item)' base.yaml override.yaml`

  lang:'python',file:'k8s_operator.py',
  caption:'Async Kubernetes operator — <b>production Python with modern typing</b>',
  code:`"""Kubernetes deployment watcher with auto-scaling."""
from __future__ import annotations

import asyncio
import logging
import signal
from dataclasses import dataclass
from typing import AsyncIterator

from kubernetes import client, config, watch
from kubernetes.client.exceptions import ApiException

log = logging.getLogger(__name__)


@dataclass(frozen=True, slots=True)
class Scaled:
    name: str
    namespace: str
    replicas: int


class DeploymentOperator:
    def __init__(self, namespace: str, target_replicas: int) -> None:
        config.load_incluster_config()
        self._apps = client.AppsV1Api()
        self._ns = namespace
        self._target = target_replicas
        self._shutdown = asyncio.Event()

    async def reconcile(self, name: str) -> None:
        try:
            deploy = await asyncio.to_thread(
                self._apps.read_namespaced_deployment, name, self._ns
            )
        except ApiException as exc:
            if exc.status == 404:
                log.warning("deployment %s/%s missing", self._ns, name)
                return
            raise

        current = deploy.spec.replicas or 0
        if current != self._target:
            log.info("%s/%s: scaling %d -> %d",
                     self._ns, name, current, self._target)
            await asyncio.to_thread(
                self._apps.patch_namespaced_deployment_scale,
                name,
                self._ns,
                {"spec": {"replicas": self._target}},
            )

    async def watch(self) -> AsyncIterator[Scaled]:
        w = watch.Watch()
        while not self._shutdown.is_set():
            try:
                for event in w.stream(
                    self._apps.list_namespaced_deployment,
                    self._ns,
                    timeout_seconds=60,
                ):
                    deploy = event["object"]
                    yield Scaled(
                        name=deploy.metadata.name,
                        namespace=deploy.metadata.namespace,
                        replicas=deploy.spec.replicas or 0,
                    )
            except ApiException as exc:
                log.error("watch error: %s", exc)
                await asyncio.sleep(5)


async def run(ns: str, replicas: int) -> None:
    op = DeploymentOperator(ns, replicas)

    def _stop(*_: object) -> None:
        op._shutdown.set()

    loop = asyncio.get_running_loop()
    for sig in (signal.SIGTERM, signal.SIGINT):
        loop.add_signal_handler(sig, _stop)

    async for pod in op.watch():
        await op.reconcile(pod.name)


if __name__ == "__main__":
    logging.basicConfig(level=logging.INFO)
    asyncio.run(run("production", 5))`
};

  lang:'python',file:'async_chaos.py',
  caption:'asyncio concurrency patterns — <b>structured concurrency</b>',
  code:`"""Concurrency patterns with asyncio: semaphores, task groups, timeouts."""
from __future__ import annotations

import asyncio
from contextlib import asynccontextmanager
from dataclasses import dataclass
from typing import AsyncIterator

import aiohttp


@dataclass
class Result:
    url: str
    status: int
    elapsed_ms: float
    error: str | None = None


@asynccontextmanager
async def session(limit: int = 100) -> AsyncIterator[aiohttp.ClientSession]:
    connector = aiohttp.TCPConnector(
        limit=limit,
        limit_per_host=10,
        ttl_dns_cache=300,
        enable_cleanup_closed=True,
    )
    timeout = aiohttp.ClientTimeout(total=10, connect=2)
    async with aiohttp.ClientSession(
        connector=connector, timeout=timeout
    ) as sess:
        yield sess


async def probe(
    sess: aiohttp.ClientSession,
    url: str,
    sem: asyncio.Semaphore,
) -> Result:
    async with sem:
        start = asyncio.get_running_loop().time()
        try:
            async with sess.get(url) as resp:
                await resp.read()
                elapsed = (asyncio.get_running_loop().time() - start) * 1000
                return Result(url, resp.status, elapsed)
        except (aiohttp.ClientError, asyncio.TimeoutError) as exc:
            elapsed = (asyncio.get_running_loop().time() - start) * 1000
            return Result(url, 0, elapsed, str(exc))


async def probe_all(urls: list[str], concurrency: int = 50) -> list[Result]:
    sem = asyncio.Semaphore(concurrency)
    results: list[Result] = []

    async with session() as sess:
        # Python 3.11+ structured concurrency
        async with asyncio.TaskGroup() as tg:
            tasks = [tg.create_task(probe(sess, u, sem)) for u in urls]
        results = [t.result() for t in tasks]

    return results


async def with_retry(coro_fn, retries: int = 5) -> object:
    for attempt in range(retries):
        try:
            return await coro_fn()
        except Exception:
            if attempt == retries - 1:
                raise
            # Full jitter
            delay = asyncio.get_running_loop().time()
            await asyncio.sleep(min(30, 2 ** attempt) * (0.5 + 0.5 * (delay % 1)))`
};

SNIPPETS.goConcurrency={
  lang:'go',file:'worker.go',
  caption:'Worker pool + context cancellation — <b>Go concurrency patterns</b>',
  code:`package worker

import (
	"context"
	"errors"
	"sync"
	"time"
)

var ErrQueueFull = errors.New("job queue full")

// Job is a unit of work sent to a worker.
type Job struct {
	ID       string
	Payload  []byte
	Deadline time.Time
}

// Result is the worker's response.
type Result struct {
	ID    string
	Data  []byte
	Error error
}

// Pool runs N workers consuming from a bounded queue.
type Pool struct {
	workers int
	queue   chan Job
	handler func(context.Context, Job) ([]byte, error)
	wg      sync.WaitGroup
}

func NewPool(workers, queueSize int, h func(context.Context, Job) ([]byte, error)) *Pool {
	return &Pool{
		workers: workers,
		queue:   make(chan Job, queueSize),
		handler: h,
	}
}

// Submit enqueues a job, respecting ctx cancellation.
func (p *Pool) Submit(ctx context.Context, j Job) error {
	select {
	case p.queue <- j:
		return nil
	case <-ctx.Done():
		return ctx.Err()
	default:
		return ErrQueueFull
	}
}

// Start launches the workers and returns a channel of results.
func (p *Pool) Start(ctx context.Context) <-chan Result {
	out := make(chan Result, p.workers)
	for i := 0; i < p.workers; i++ {
		p.wg.Add(1)
		go func(id int) {
			defer p.wg.Done()
			for {
				select {
				case <-ctx.Done():
					return
				case job, ok := <-p.queue:
					if !ok {
						return
					}
					jctx := ctx
					var cancel context.CancelFunc
					if !job.Deadline.IsZero() {
						jctx, cancel = context.WithDeadline(ctx, job.Deadline)
					}
					data, err := p.handler(jctx, job)
					if cancel != nil {
						cancel()
					}
					select {
					case out <- Result{ID: job.ID, Data: data, Error: err}:
					case <-ctx.Done():
						return
					}
				}
			}
		}(i)
	}

	// Close results channel when all workers stop.
	go func() {
		p.wg.Wait()
		close(out)
	}()

	return out
}`
};

  lang:'go',file:'reconciler.go',
  caption:'Kubernetes controller with controller-runtime — <b>operator pattern</b>',
  code:`package controllers

import (
	"context"
	"time"

	appsv1 "k8s.io/api/apps/v1"
	corev1 "k8s.io/api/core/v1"
	apierrors "k8s.io/apimachinery/pkg/api/errors"
	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
	"k8s.io/apimachinery/pkg/runtime"
	ctrl "sigs.k8s.io/controller-runtime"
	"sigs.k8s.io/controller-runtime/pkg/client"
	"sigs.k8s.io/controller-runtime/pkg/log"
)

// WebAppReconciler reconciles a WebApp object.
type WebAppReconciler struct {
	client.Client
	Scheme *runtime.Scheme
}

// +kubebuilder:rbac:groups=apps.example.com,resources=webapps,verbs=get;list;watch;create;update
// +kubebuilder:rbac:groups=apps,resources=deployments,verbs=get;list;watch;create;update

func (r *WebAppReconciler) Reconcile(ctx context.Context, req ctrl.Request) (ctrl.Result, error) {
	l := log.FromContext(ctx)

	var deploy appsv1.Deployment
	if err := r.Get(ctx, req.NamespacedName, &deploy); err != nil {
		if apierrors.IsNotFound(err) {
			return ctrl.Result{}, nil
		}
		return ctrl.Result{}, err
	}

	// Desired state
	desired := int32(3)
	if deploy.Spec.Replicas == nil || *deploy.Spec.Replicas != desired {
		l.Info("adjusting replicas", "from", deploy.Spec.Replicas, "to", desired)
		deploy.Spec.Replicas = &desired
		if err := r.Update(ctx, &deploy); err != nil {
			return ctrl.Result{}, err
		}
	}

	// Health check: ensure at least one ready replica
	ready := int32(0)
	for _, c := range deploy.Status.Conditions {
		if c.Type == appsv1.DeploymentAvailable && c.Status == corev1.ConditionTrue {
			ready = deploy.Status.ReadyReplicas
			break
		}
	}

	if ready == 0 {
		l.Info("no ready replicas, requeueing", "name", deploy.Name)
		return ctrl.Result{RequeueAfter: 30 * time.Second}, nil
	}

	return ctrl.Result{}, nil
}

func (r *WebAppReconciler) SetupWithManager(mgr ctrl.Manager) error {
	return ctrl.NewControllerManagedBy(mgr).
		For(&appsv1.Deployment{}).
		Owns(&corev1.Service{}).
		Complete(r)
}

var _ = metav1.Now`
};

SNIPPETS.goServer={
  lang:'go',file:'server.go',
  caption:'HTTP server with middleware — <b>stdlib-only production patterns</b>',
  code:`package server

import (
	"context"
	"encoding/json"
	"errors"
	"log/slog"
	"net/http"
	"os"
	"time"
)

type Middleware func(http.Handler) http.Handler

func Chain(h http.Handler, mw ...Middleware) http.Handler {
	for i := len(mw) - 1; i >= 0; i-- {
		h = mw[i](h)
	}
	return h
}

func RequestID() Middleware {
	return func(next http.Handler) http.Handler {
		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
			id := r.Header.Get("X-Request-Id")
			if id == "" {
				id = generateID()
			}
			w.Header().Set("X-Request-Id", id)
			next.ServeHTTP(w, r)
		})
	}
}

func Logging(logger *slog.Logger) Middleware {
	return func(next http.Handler) http.Handler {
		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
			start := time.Now()
			rw := &responseWriter{ResponseWriter: w, status: 200}
			next.ServeHTTP(rw, r)
			logger.Info("request",
				"method", r.Method,
				"path", r.URL.Path,
				"status", rw.status,
				"duration_ms", time.Since(start).Milliseconds(),
			)
		})
	}
}

func Recoverer() Middleware {
	return func(next http.Handler) http.Handler {
		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
			defer func() {
				if rec := recover(); rec != nil {
					slog.Error("panic", "err", rec)
					http.Error(w, "internal error", 500)
				}
			}()
			next.ServeHTTP(w, r)
		})
	}
}

type responseWriter struct {
	http.ResponseWriter
	status int
}

func (rw *responseWriter) WriteHeader(code int) {
	rw.status = code
	rw.ResponseWriter.WriteHeader(code)
}

func main() {
	logger := slog.New(slog.NewJSONHandler(os.Stdout, &slog.HandlerOptions{Level: slog.LevelInfo}))

	mux := http.NewServeMux()
	mux.HandleFunc("GET /healthz", func(w http.ResponseWriter, _ *http.Request) {
		w.WriteHeader(200)
		_, _ = w.Write([]byte("ok"))
	})
	mux.HandleFunc("GET /api/v1/users/{id}", getUser)

	handler := Chain(mux, Recoverer(), RequestID(), Logging(logger))

	srv := &http.Server{
		Addr:              ":8080",
		Handler:           handler,
		ReadHeaderTimeout: 5 * time.Second,
		ReadTimeout:       15 * time.Second,
		WriteTimeout:      15 * time.Second,
		IdleTimeout:       60 * time.Second,
	}

	ctx, cancel := signal.NotifyContext(context.Background(), os.Interrupt)
	defer cancel()

	go func() {
		if err := srv.ListenAndServe(); err != nil && !errors.Is(err, http.ErrServerClosed) {
			slog.Error("listen", "err", err)
		}
	}()

	<-ctx.Done()
	shutdownCtx, cancelShutdown := context.WithTimeout(context.Background(), 30*time.Second)
	defer cancelShutdown()
	_ = srv.Shutdown(shutdownCtx)
}

func getUser(w http.ResponseWriter, r *http.Request) {
	id := r.PathValue("id")
	w.Header().Set("Content-Type", "application/json")
	_ = json.NewEncoder(w).Encode(map[string]string{"id": id})
}`
};

use std::time::Duration;

use anyhow::{Context, Result};
use clap::{Parser, Subcommand};
use tracing::{info, warn};

#[derive(Parser, Debug)]
#[command(name = "kubectl-rs", version, about = "Kubernetes CLI in Rust")]
struct Cli {
    /// Namespace to operate in.
    #[arg(short, long, default_value = "default", env = "KUBE_NS")]
    namespace: String,

    /// Kubeconfig path.
    #[arg(long, env = "KUBECONFIG")]
    kubeconfig: Option<PathBuf>,

    #[command(subcommand)]
    command: Command,
}

#[derive(Subcommand, Debug)]
enum Command {
    /// List pods in the namespace.
    List {
        /// Output format.
        #[arg(short, long, value_enum, default_value = "table")]
        output: OutputFormat,
    },
    /// Scale a deployment.
    Scale {
        name: String,
        replicas: u32,
    },
    /// Watch events until Ctrl-C.
    Watch {
        #[arg(short, long, default_value_t = 5)]
        interval_secs: u64,
    },
}

#[derive(Debug, Clone, Copy, clap::ValueEnum)]
enum OutputFormat { Table, Json, Yaml }

#[tokio::main]
async fn main() -> Result<()> {
    tracing_subscriber::fmt()
        .with_env_filter(
            tracing_subscriber::EnvFilter::try_from_default_env()
                .unwrap_or_else(|_| "info".into()),
        )
        .init();

    let cli = Cli::parse();

    info!(ns = %cli.namespace, "starting kubectl-rs");

    let config = match &cli.kubeconfig {
        Some(p) => kube::Config::from_custom_kubeconfig(
            kube::config::Kubeconfig::read_from(p)?,
            &Default::default(),
        )
        .await
        .with_context(|| format!("loading kubeconfig from {}", p.display()))?,
        None => kube::Config::infer().await?,
    };

    let client = kube::Client::try_from(config)?;

    match cli.command {
        Command::List { output } => {
            let pods: kube::Api<k8s_openapi::api::core::v1::Pod> =
                kube::Api::namespaced(client, &cli.namespace);
            let list = pods.list(&Default::default()).await?;
            for pod in list.items {
                let name = pod.metadata.name.as_deref().unwrap_or("?");
                let phase = pod.status.as_ref()
                    .and_then(|s| s.phase.as_deref())
                    .unwrap_or("Unknown");
                match output {
                    OutputFormat::Table => println!("{:<40} {}", name, phase),
                    OutputFormat::Json => println!("{}", serde_json::to_string(&pod)?),
                    OutputFormat::Yaml => println!("{}", serde_yaml::to_string(&pod)?),
                }
            }
        }
        Command::Scale { name, replicas } => {
            let deployments: kube::Api<k8s_openapi::api::apps::v1::Deployment> =
                kube::Api::namespaced(client, &cli.namespace);
            let patch = serde_json::json!({"spec": {"replicas": replicas}});
            deployments
                .patch(&name, &kube::api::PatchParams::default(), &kube::api::Patch::Merge(&patch))
                .await
                .with_context(|| format!("scaling {name}"))?;
            info!(name, replicas, "scaled");
        }
        Command::Watch { interval_secs } => {
            let mut interval = tokio::time::interval(Duration::from_secs(interval_secs));
            loop {
                tokio::select! {
                    _ = interval.tick() => info!("tick"),
                    _ = tokio::signal::ctrl_c() => {
                        warn!("shutting down");
                        break;
                    }
                }
            }
        }
    }

    Ok(())
}`

SNIPPETS.rustAsync={
  lang:'rust',file:'pool.rs',
  caption:'Async worker pool with tokio — <b>backpressure + cancellation</b>',
  code:`use std::sync::Arc;
use std::time::Duration;

use tokio::sync::{mpsc, Semaphore};
use tokio::time::{sleep, timeout};
use tokio_util::sync::CancellationToken;
use tracing::{error, info, warn};

#[derive(Debug, Clone)]
pub struct Job {
    pub id: String,
    pub payload: Vec<u8>,
    pub timeout: Duration,
}

#[derive(Debug)]
pub struct Result_ {
    pub id: String,
    pub data: Vec<u8>,
}

pub struct Pool<F>
where
    F: Fn(Job) -> futures::future::BoxFuture<'static, anyhow::Result<Vec<u8>>>
        + Send + Sync + 'static,
{
    workers: usize,
    queue_size: usize,
    handler: Arc<F>,
    shutdown: CancellationToken,
}

impl<F> Pool<F>
where
    F: Fn(Job) -> futures::future::BoxFuture<'static, anyhow::Result<Vec<u8>>>
        + Send + Sync + 'static,
{
    pub fn new(workers: usize, queue_size: usize, handler: F) -> Self {
        Self {
            workers,
            queue_size,
            handler: Arc::new(handler),
            shutdown: CancellationToken::new(),
        }
    }

    pub fn shutdown_token(&self) -> CancellationToken {
        self.shutdown.clone()
    }

    pub async fn run(
        &self,
        mut rx: mpsc::Receiver<Job>,
    ) -> mpsc::Receiver<Result_> {
        let (tx, result_rx) = mpsc::channel::<Result_>(self.queue_size);
        let sem = Arc::new(Semaphore::new(self.workers));

        let handler = self.handler.clone();
        let shutdown = self.shutdown.clone();

        tokio::spawn(async move {
            loop {
                tokio::select! {
                    _ = shutdown.cancelled() => {
                        warn!("pool shutting down");
                        break;
                    }
                    Some(job) = rx.recv() => {
                        let permit = match sem.clone().acquire_owned().await {
                            Ok(p) => p,
                            Err(_) => break,
                        };
                        let handler = handler.clone();
                        let tx = tx.clone();
                        tokio::spawn(async move {
                            let _permit = permit;
                            let id = job.id.clone();
                            let to = job.timeout;

                            let fut = (handler)(job);
                            match timeout(to, fut).await {
                                Ok(Ok(data)) => {
                                    info!(%id, "job succeeded");
                                    let _ = tx.send(Result_ { id, data }).await;
                                }
                                Ok(Err(e)) => {
                                    error!(%id, err = %e, "job failed");
                                }
                                Err(_) => {
                                    warn!(%id, "job timed out");
                                }
                            }
                        });
                    }
                    else => break,
                }
            }
        });

        result_rx
    }
}

// Usage
pub async fn example() -> anyhow::Result<()> {
    let pool = Pool::new(8, 256, |job: Job| {
        Box::pin(async move {
            sleep(Duration::from_millis(50)).await;
            Ok(job.payload)
        })
    });

    let (tx, rx) = mpsc::channel(1024);
    let mut results = pool.run(rx).await;

    tokio::spawn(async move {
        for i in 0..1000 {
            let job = Job {
                id: format!("job-{i}"),
                payload: vec![0u8; 64],
                timeout: Duration::from_secs(5),
            };
            if tx.send(job).await.is_err() {
                break;
            }
        }
    });

    while let Some(r) = results.recv().await {
        info!(id = %r.id, len = r.data.len(), "result");
    }

    Ok(())
}`
};

SNIPPETS.rustPerf={
  lang:'rust',file:'parser.rs',
  caption:'Zero-copy parsing with lifetimes — <b>performance engineering in Rust</b>',
  code:`//! Zero-copy HTTP/1.1 request line parser.
//! Parses without allocation using borrowed slices.

use std::str;

#[derive(Debug, PartialEq)]
pub struct RequestLine<'a> {
    pub method: &'a str,
    pub target: &'a str,
    pub version: &'a str,
}

#[derive(Debug)]
pub enum ParseError {
    Incomplete,
    Invalid(&'static str),
}

const CRLF: &[u8] = b"\\r\\n";

impl<'a> RequestLine<'a> {
    /// Parse from a byte buffer without copying.
    pub fn parse(buf: &'a [u8]) -> Result<RequestLine<'a>, ParseError> {
        let end = memchr::memmem::find(buf, CRLF).ok_or(ParseError::Incomplete)?;
        let line = &buf[..end];

        // Single pass: find first two spaces
        let mut iter = line.splitn(3, |&b| b == b' ');
        let method = iter.next().ok_or(ParseError::Invalid("method"))?;
        let target = iter.next().ok_or(ParseError::Invalid("target"))?;
        let version = iter.next().ok_or(ParseError::Invalid("version"))?;

        if method.is_empty() || method.len() > 32 {
            return Err(ParseError::Invalid("method length"));
        }
        if !version.starts_with(b"HTTP/") {
            return Err(ParseError::Invalid("version prefix"));
        }

        // Safe: we validated it's ASCII by construction
        let method = unsafe { str::from_utf8_unchecked(method) };
        let target = unsafe { str::from_utf8_unchecked(target) };
        let version = unsafe { str::from_utf8_unchecked(version) };

        Ok(RequestLine { method, target, version })
    }
}

// Usage example
fn main() {
    let buf = b"GET /api/v1/users?page=2 HTTP/1.1\\r\\nHost: example.com\\r\\n\\r\\n";
    let line = RequestLine::parse(buf).unwrap();
    println!("{line:?}"); // zero copies, just borrows

    // Fast path for hot loops: SIMD-friendly byte scanning
    // memchr::memchr(b' ', buf) is ~10x faster than a loop
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn parse_simple() {
        let line = RequestLine::parse(b"GET / HTTP/1.1\\r\\n").unwrap();
        assert_eq!(line.method, "GET");
        assert_eq!(line.target, "/");
        assert_eq!(line.version, "HTTP/1.1");
    }

    #[test]
    fn incomplete_returns_error() {
        assert!(matches!(
            RequestLine::parse(b"GET / HTTP/1.1"),
            Err(ParseError::Incomplete)
        ));
    }
}`
};

import pino from 'pino';

const logger = pino({
  level: process.env.LOG_LEVEL ?? 'info',
  formatters: {
    level: (label) => ({ level: label }),
  },
});

const app = Fastify({

  requestIdHeader: 'x-request-id',
  trustProxy: true,
});

// ─── Register plugins ───
await app.register(import('@fastify/helmet'), {
  contentSecurityPolicy: false,
});
await app.register(import('@fastify/rate-limit'), {
  max: 100,
  timeWindow: '1 minute',
  keyGenerator: (req) => req.ip,
});
await app.register(import('@fastify/cors'), {
  origin: ['https://app.example.com'],
  credentials: true,
});

// ─── Routes ───
app.get('/healthz', async () => ({ status: 'ok', ts: Date.now() }));

app.get('/api/v1/users/:id', {
  schema: {
    params: {
      type: 'object',
      properties: { id: { type: 'string', format: 'uuid' } },
      required: ['id'],
    },
    response: {
      200: {
        type: 'object',
        properties: {
          id: { type: 'string' },
          name: { type: 'string' },
        },
      },
    },
  },
}, async (req, reply) => {
  const { id } = req.params;
  req.log.info({ userId: id }, 'fetch user');
  const user = await db.users.findOne({ id });
  if (!user) return reply.code(404).send({ error: 'not found' });
  return { id: user.id, name: user.name };
});

// ─── Error handler ───
app.setErrorHandler((err, req, reply) => {
  req.log.error({ err, reqId: req.id }, 'request failed');
  if (err.validation) {
    return reply.code(400).send({ error: 'bad request', details: err.validation });
  }
  reply.code(err.statusCode ?? 500).send({ error: 'internal error' });
});

// ─── Graceful shutdown ───
const signals = ['SIGINT', 'SIGTERM'];
let shuttingDown = false;
for (const sig of signals) {
  process.on(sig, async () => {
    if (shuttingDown) return;
    shuttingDown = true;
    app.log.info({ signal: sig }, 'shutting down');

    const forceTimer = setTimeout(() => {
      app.log.error('forced exit after 30s');
      process.exit(1);
    }, 30_000);
    forceTimer.unref();

    try {
      await app.close();
      app.log.info('clean shutdown');
      process.exit(0);
    } catch (err) {
      app.log.error({ err }, 'shutdown error');
      process.exit(1);
    }
  });
}

// ─── Start ───
await app.listen({
  port: Number(process.env.PORT ?? 8080),
  host: '0.0.0.0',
});`
};

SNIPPETS.typescript={
  lang:'ts',file:'k8s-client.ts',
  caption:'Typed Kubernetes client with zod validation — <b>type-safe infrastructure</b>',
  code:`import { CoreV1Api, KubeConfig, type V1Pod } from '@kubernetes/client-node';
import { z } from 'zod';

// ─── Runtime schema ───
const PodInfoSchema = z.object({
  name: z.string().min(1),
  namespace: z.string().min(1),
  phase: z.enum(['Pending', 'Running', 'Succeeded', 'Failed', 'Unknown']),
  restarts: z.number().int().min(0),
  ready: z.boolean(),
  nodeName: z.string().optional(),
});

export type PodInfo = z.infer<typeof PodInfoSchema>;

// ─── Discriminated unions for events ───
type WatchEvent =
  | { type: 'ADDED'; pod: PodInfo }
  | { type: 'MODIFIED'; pod: PodInfo; prev: PodInfo }
  | { type: 'DELETED'; pod: PodInfo };

// ─── Service class ───
export class PodWatcher {
  private readonly api: CoreV1Api;
  private readonly ac = new AbortController();

  constructor(kc: KubeConfig) {
    this.api = kc.makeApiClient(CoreV1Api);
  }

  async list(namespace: string, labelSelector?: string): Promise<PodInfo[]> {
    const { body } = await this.api.listNamespacedPod(
      namespace,
      undefined, undefined, undefined,
      labelSelector,
    );

    return body.items
      .map((pod) => this.toInfo(pod))
      .filter((x): x is PodInfo => x !== null);
  }

  async *watch(
    namespace: string,
    selector?: string,
  ): AsyncGenerator<WatchEvent, void, void> {
    const res = await this.api.listNamespacedPod(
      namespace,
      undefined, undefined, undefined,
      selector,
      undefined, undefined, undefined,
      undefined, undefined,
      undefined, undefined,
      undefined, undefined,
      { signal: this.ac.signal } as any,
    );

    // seed with current pods
    for (const pod of res.body.items) {
      const info = this.toInfo(pod);
      if (info) yield { type: 'ADDED', pod: info };
    }

    // real watch() from @kubernetes/client-node has a stream API;
    // illustrate the transformation here.
    const stream = this.streamEvents(namespace, selector);
    for await (const ev of stream) {
      const info = this.toInfo(ev.object);
      if (!info) continue;

      switch (ev.type) {
        case 'ADDED':
        case 'MODIFIED':
        case 'DELETED':
          yield { type: ev.type, pod: info } as WatchEvent;
          break;
      }
    }
  }

  stop(): void {
    this.ac.abort();
  }

  private toInfo(pod: V1Pod): PodInfo | null {
    const parsed = PodInfoSchema.safeParse({
      name: pod.metadata?.name,
      namespace: pod.metadata?.namespace,
      phase: pod.status?.phase ?? 'Unknown',
      restarts:
        pod.status?.containerStatuses?.reduce(
          (sum, cs) => sum + cs.restartCount,
          0,
        ) ?? 0,
      ready: pod.status?.conditions?.some(
        (c) => c.type === 'Ready' && c.status === 'True',
      ) ?? false,
      nodeName: pod.spec?.nodeName,
    });

    if (!parsed.success) {
      console.warn('invalid pod', parsed.error.format());
      return null;
    }
    return parsed.data;
  }

  private async *streamEvents(
    _ns: string,
    _sel?: string,
  ): AsyncGenerator<{ type: 'ADDED'|'MODIFIED'|'DELETED'; object: V1Pod }> {
    // placeholder
  }
}`
};

  int32 replicas = 5;
  DeploymentStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  map<string, string> labels = 8;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_PENDING = 1;
  DEPLOYMENT_STATUS_RUNNING = 2;
  DEPLOYMENT_STATUS_DEGRADED = 3;
  DEPLOYMENT_STATUS_FAILED = 4;
}

// ─── Requests/responses ───
message CreateDeploymentRequest {
  string name = 1;
  string namespace = 2;
  string image = 3;
  int32 replicas = 4;
  map<string, string> labels = 5;
  google.protobuf.Duration timeout = 6;
}

message GetDeploymentRequest {
  string id = 1;
}

message ListDeploymentsRequest {
  string namespace = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  string next_page_token = 2;
}

message WatchRequest {
  string namespace = 1;
  string label_selector = 2;
}

message WatchEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_ADDED = 1;
    TYPE_MODIFIED = 2;
    TYPE_DELETED = 3;
  }
  Type type = 1;
  Deployment deployment = 2;
}

// ─── Service with all four RPC types ───
service DeployService {
  // Unary
  rpc Create(CreateDeploymentRequest) returns (Deployment);
  rpc Get(GetDeploymentRequest) returns (Deployment);

  // Server streaming
  rpc List(ListDeploymentsRequest) returns (stream Deployment);
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Client streaming
  rpc BulkCreate(stream CreateDeploymentRequest) returns (ListDeploymentsResponse);

  // Bidirectional
  rpc Sync(stream WatchEvent) returns (stream Deployment);
}`
};

SNIPPETS.sqlMigration={
  lang:'sql',file:'migration.sql',
  caption:'Zero-downtime migration — <b>online schema change patterns</b>',
  code:`-- ─── Add email_verified to users table without downtime ───
-- Strategy: expand-contract pattern
--   1. Add nullable column (fast, metadata only)
--   2. Backfill in batches from application code
--   3. Add constraint as NOT VALID (fast)
--   4. VALIDATE constraint (background scan)
--   5. (Later deploy) Set NOT NULL

BEGIN;

SET LOCAL lock_timeout = '5s';
SET LOCAL statement_timeout = '30s';

-- Step 1: expand (fast)
ALTER TABLE users
    ADD COLUMN email_verified BOOLEAN,
    ADD COLUMN verified_at TIMESTAMPTZ;

-- Step 3: add constraint without full scan
ALTER TABLE users
    ADD CONSTRAINT users_email_verified_consistent
    CHECK (email_verified IS NULL OR verified_at IS NOT NULL)
    NOT VALID;

COMMIT;

-- Step 4: validate (does not block reads/writes)
ALTER TABLE users VALIDATE CONSTRAINT users_email_verified_consistent;

-- ─── Concurrent index creation (no table lock) ───
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_email_verified
    ON users (email_verified)
    WHERE email_verified = true;

-- Covering index for common lookup
CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_email_org
    ON users (email, organization_id)
    INCLUDE (email_verified, verified_at);

-- ─── Analyze to update statistics ───
ANALYZE users (email_verified);

-- ─── Advanced: partition migration example ───
BEGIN;

-- Detach old partition
ALTER TABLE events DETACH PARTITION events_2023_q4 CONCURRENTLY;

-- Attach new partition with matching schema
CREATE TABLE events_2024_q1 (
    LIKE events INCLUDING ALL
);

ALTER TABLE events ATTACH PARTITION events_2024_q1
    FOR VALUES FROM ('2024-01-01') TO ('2024-04-01');

COMMIT;

-- ─── Online column rename via view ───
CREATE VIEW users_v2 AS
    SELECT id, email AS email_address, created_at
    FROM users;

-- After all app instances are updated:
ALTER TABLE users RENAME COLUMN email TO email_address;
DROP VIEW users_v2;`
};

SNIPPETS.luaNginx={
  lang:'lua',file:'limiter.lua',
  caption:'OpenResty rate limiter — <b>Lua in Nginx for edge middleware</b>',
  code:`-- Distributed rate limiting at the edge with OpenResty.
-- Uses a shared dict + Redis fallback for cross-node coordination.

local redis       = require "resty.redis"
local cjson       = require "cjson.safe"
local ngx_re      = require "ngx.re"
local shared_dict = ngx.shared.rate_limit

local _M = {}

-- Sliding window via token bucket in shared dict + Redis
local function allow_locally(key, rate, burst)
    local bucket = shared_dict:get(key)
    if not bucket then
        bucket = { tokens = burst, ts = ngx.now() }
    end

    local now     = ngx.now()
    local elapsed = now - bucket.ts

    -- Refill
    bucket.tokens = math.min(burst, bucket.tokens + elapsed * rate)
    bucket.ts     = now

    if bucket.tokens >= 1 then
        bucket.tokens = bucket.tokens - 1
        shared_dict:set(key, bucket, 60)
        return true, bucket.tokens
    end

    shared_dict:set(key, bucket, 60)
    return false, 0
end

-- Distributed check (fallback when local insufficient)
local function allow_redis(key, rate, burst)
    local red = redis:new()
    red:set_timeouts(50, 50, 50)

    local ok, err = red:connect("redis.internal", 6379)
    if not ok then
        ngx.log(ngx.ERR, "redis connect: ", err)
        return true  -- fail-open
    end

    -- Atomic token bucket in Lua
    local script = [[
        local key   = KEYS[1]
        local rate  = tonumber(ARGV[1])
        local burst = tonumber(ARGV[2])
        local now   = tonumber(ARGV[3])

        local data = redis.call("HMGET", key, "tokens", "ts")
        local tokens = tonumber(data[1]) or burst
        local ts     = tonumber(data[2]) or now

        local elapsed = now - ts
        tokens = math.min(burst, tokens + elapsed * rate)

        local allowed = 0
        if tokens >= 1 then
            tokens = tokens - 1
            allowed = 1
        end

        redis.call("HMSET", key, "tokens", tokens, "ts", now)
        redis.call("EXPIRE", key, 60)
        return allowed
    ]]

    local allowed = red:eval(script, 1, key, rate, burst, ngx.now())
    red:set_keepalive(10000, 100)

    return tonumber(allowed) == 1
end

function _M.limit(rate, burst)
    return function()
        -- Build key from client identity + route
        local ip    = ngx.var.binary_remote_addr
        local route = ngx.var.uri
        local key   = "rl:" .. ngx.md5(ip .. ":" .. route)

        local ok, remaining = allow_locally(key, rate, burst)

        if not ok then
            -- Double-check against Redis to avoid local false positives
            ok = allow_redis(key, rate, burst)
        end

        ngx.header["X-RateLimit-Limit"]     = burst
        ngx.header["X-RateLimit-Remaining"] = math.floor(remaining)

        if not ok then
            ngx.header["Retry-After"] = 1
            ngx.status = 429
            ngx.say(cjson.encode({
                error   = "rate_limited",
                message = "Too many requests. Retry after 1 second."
            }))
            return ngx.exit(429)
        end
    end
end

return _M`
};

- name: Configure Kubernetes worker nodes
  hosts: workers
  become: true
  gather_facts: true
  serial: "25%"
  max_fail_percentage: 10
  any_errors_fatal: false

  vars:
    containerd_version: "1.7.13"
    kubernetes_version: "1.29"
    crio_disabled: true

  pre_tasks:
    - name: Verify OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
        fail_msg: "Unsupported OS: {{ ansible_os_family }}"
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: containerd
      vars:
        version: "{{ containerd_version }}"
      tags: [containerd]
    - role: kubelet
      vars:
        version: "{{ kubernetes_version }}"
      tags: [kubelet]

  tasks:
    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Remove swap from fstab
      ansible.posix.mount:
        path: swap
        state: absent
      when: ansible_swaptotal_mb > 0

    - name: Load kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
      notify: reload-modules

    - name: Apply sysctl settings
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Join cluster
      ansible.builtin.command:
        cmd: kubeadm join {{ hostvars[groups['masters'][0]].ansible_host }}:6443 --token {{ kubeadm_token }} --discovery-token-ca-cert-hash {{ ca_hash }}
        creates: /etc/kubernetes/kubelet.conf
      when: not (ansible_check_mode or kubelet_join_file.stat.exists)

  handlers:
    - name: reload-modules
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]

    - name: restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        daemon_reload: true

  post_tasks:
    - name: Wait for node Ready
      ansible.builtin.shell: |
        kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_status
      until: node_status.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: "{{ groups['masters'][0] }}"`
};

  lang:'bash',file:'vault-ops.sh',
  caption:'HashiCorp Vault — <b>secret engines, policies, and dynamic credentials</b>',
  code:`#!/usr/bin/env bash
set -euo pipefail

readonly VAULT_ADDR="\${VAULT_ADDR:-https://vault.example.com:8200}"
export VAULT_ADDR

# ─── Authentication (OIDC or AppRole) ───
authenticate() {
  if [[ -n "\${VAULT_TOKEN:-}" ]]; then return; fi
  if command -v oidc-agent >/dev/null; then
    vault login -method=oidc role=dev
  else
    vault login -method=approle \\
      role_id="\$VAULT_ROLE_ID" \\
      secret_id="\$VAULT_SECRET_ID"
  fi
}

# ─── Enable secret engine (KV v2) ───
vault secrets enable -path=kv kv-v2 2>/dev/null || true
vault kv put kv/app/production/database \\
  host=db.internal \\
  port=5432 \\
  username=app \\
  password="$(openssl rand -base64 32)"

# ─── Write policy (HCL) ───
vault policy write app-reader - <<'POLICY'
path "kv/data/app/production/database" {
  capabilities = ["read"]
}

path "kv/data/app/{{identity.entity.id}}/*" {
  capabilities = ["create", "read", "update", "delete", "list"]
}

# Deny everything else explicitly for auditability
path "kv/*" {
  capabilities = ["deny"]
}
POLICY

# ─── Enable database secrets engine (dynamic creds) ───
vault secrets enable database 2>/dev/null || true

vault write database/config/postgres-prod \\
  plugin_name=postgresql-database-plugin \\
  allowed_roles="app-readonly,app-readwrite" \\
  connection_url="postgresql://{{username}}:{{password}}@db.internal:5432/app?sslmode=require" \\
  username="vault_admin" \\
  password="$VAULT_DB_ADMIN_PASSWORD"

vault write database/roles/app-readonly \\
  db_name=postgres-prod \\
  creation_statements="CREATE ROLE \\"{{name}}\\" LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \\"{{name}}\\";" \\
  default_ttl=1h \\
  max_ttl=24h

# ─── Fetch dynamic credentials (returns a one-time user) ───
vault read -format=json database/creds/app-readonly | jq -r '
  "PGUSER=\(.data.username)\\nPGPASSWORD=\(.data.password)\\nPGEXPIRES=\(.lease_duration)s"
'

# ─── Transit engine for encryption as a service ───
vault secrets enable transit 2>/dev/null || true
vault write -f transit/keys/app-encryption type=chacha20-poly1305

# Encrypt a message
CIPHER=$(echo -n "secret message" | base64 | vault write -field=ciphertext transit/encrypt/app-encryption plaintext=-)
echo "ciphertext: $CIPHER"

# Decrypt
PLAINTEXT=$(vault write -field=plaintext transit/decrypt/app-encryption ciphertext="$CIPHER" | base64 -d)
echo "plaintext: $PLAINTEXT"  # -> secret message`
};

  lang:'go',file:'tracing.go',
  caption:'OpenTelemetry tracing — <b>context propagation across services</b>',
  code:`package main

import (
	"context"
	"fmt"
	"log"
	"net/http"
	"time"

	"go.opentelemetry.io/otel"
	"go.opentelemetry.io/otel/attribute"
	"go.opentelemetry.io/otel/codes"
	"go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc"
	"go.opentelemetry.io/otel/propagation"
	"go.opentelemetry.io/otel/sdk/resource"
	sdktrace "go.opentelemetry.io/otel/sdk/trace"
	semconv "go.opentelemetry.io/otel/semconv/v1.21.0"
	"go.opentelemetry.io/otel/trace"
)

var tracer = otel.Tracer("acme/web")

func initTracer(ctx context.Context) (*sdktrace.TracerProvider, error) {
	exporter, err := otlptracegrpc.New(ctx,
		otlptracegrpc.WithEndpoint("otel-collector:4317"),
		otlptracegrpc.WithInsecure(),
	)
	if err != nil {
		return nil, fmt.Errorf("otlp exporter: %w", err)
	}

	res, err := resource.Merge(
		resource.Default(),
		resource.NewWithAttributes(
			semconv.SchemaURL,
			semconv.ServiceName("web"),
			semconv.ServiceVersion("1.0.0"),
			semconv.DeploymentEnvironment("production"),
		),
	)
	if err != nil {
		return nil, err
	}

	tp := sdktrace.NewTracerProvider(
		sdktrace.WithBatcher(exporter,
			sdktrace.WithMaxQueueSize(2048),
			sdktrace.WithBatchTimeout(5*time.Second),
		),
		sdktrace.WithResource(res),
		sdktrace.WithSampler(sdktrace.ParentBased(
			sdktrace.TraceIDRatioBased(0.1),
		)),
	)

	otel.SetTracerProvider(tp)
	otel.SetTextMapPropagator(propagation.NewCompositeTextMapPropagator(
		propagation.TraceContext{},
		propagation.Baggage{},
	))
	return tp, nil
}

func handleRequest(w http.ResponseWriter, r *http.Request) {
	ctx := otel.GetTextMapPropagator().Extract(r.Context(), propagation.HeaderCarrier(r.Header))
	ctx, span := tracer.Start(ctx, "handleRequest",
		trace.WithSpanKind(trace.SpanKindServer),
		trace.WithAttributes(
			attribute.String("http.method", r.Method),
			attribute.String("http.route", r.URL.Path),
			attribute.String("http.user_agent", r.UserAgent()),
		),
	)
	defer span.End()

	userID, err := authenticate(ctx, r.Header.Get("Authorization"))
	if err != nil {
		span.RecordError(err)
		span.SetStatus(codes.Error, "auth failed")
		http.Error(w, "unauthorized", 401)
		return
	}
	span.SetAttributes(attribute.String("user.id", userID))

	if err := processOrder(ctx, userID); err != nil {
		span.RecordError(err)
		span.SetStatus(codes.Error, err.Error())
		http.Error(w, "internal error", 500)
		return
	}

	span.SetAttributes(attribute.Int("http.status_code", 200))
	w.WriteHeader(200)
}

func authenticate(ctx context.Context, auth string) (string, error) {
	ctx, span := tracer.Start(ctx, "auth.validate")
	defer span.End()
	span.SetAttributes(attribute.Int("auth.token.length", len(auth)))

	// simulate
	time.Sleep(5 * time.Millisecond)
	return "user-42", nil
}

func processOrder(ctx context.Context, userID string) error {
	ctx, span := tracer.Start(ctx, "order.process",
		trace.WithAttributes(attribute.String("user.id", userID)),
	)
	defer span.End()

	// Nested spans
	ctx, dbSpan := tracer.Start(ctx, "db.insert",
		trace.WithSpanKind(trace.SpanKindClient),
		trace.WithAttributes(attribute.String("db.system", "postgresql")),
	)
	time.Sleep(20 * time.Millisecond)
	dbSpan.SetStatus(codes.Ok, "")
	dbSpan.End()

	// Another nested span
	ctx, pubSpan := tracer.Start(ctx, "kafka.publish",
		trace.WithSpanKind(trace.SpanKindProducer),
		trace.WithAttributes(attribute.String("messaging.system", "kafka")),
	)
	_ = ctx
	time.Sleep(3 * time.Millisecond)
	pubSpan.SetStatus(codes.Ok, "")
	pubSpan.End()

	return nil
}

	ctx := context.Background()
	tp, err := initTracer(ctx)
	if err != nil {
		log.Fatal(err)
	}
	defer func() { _ = tp.Shutdown(ctx) }()

	http.HandleFunc("/api/order", handleRequest)
	log.Fatal(http.ListenAndServe(":8080", nil))

function makeHashRing(nodes,replicas){
  replicas=replicas||150;
  var ring=[];
  for(var i=0;i<nodes.length;i++){
    for(var r=0;r<replicas;r++){
      var h=murmur3(nodes[i]+'#'+r);
      ring.push({hash:h,node:nodes[i]});
    }
  }
  ring.sort(function(a,b){return a.hash-b.hash});
  return {
    ring:ring,
    locate:function(key){
      var h=murmur3(key);
      var lo=0,hi=ring.length-1;
      if(h<=ring[0].hash)return ring[0].node;
      while(lo<hi){
        var mid=(lo+hi)>>1;
        if(ring[mid].hash<h)lo=mid+1;else hi=mid;
      }
      return ring[lo].node;
    }
  };
}

function rollingUpdate(desired,maxSurge,maxUnavail){
  var tl=[];
  var ready=desired,updated=0,available=desired;
  tl.push({step:0,ready:ready,updated:updated,available:available});
  var step=0;
  while(updated<desired&&step<100){
    step++;
    var canAdd=Math.min(maxSurge,desired-updated);
    updated+=canAdd;
    ready+=canAdd;
    var canRemove=Math.min(maxUnavail,available-(desired-maxUnavail));
    if(available-canRemove>=desired-maxUnavail)available-=canRemove;
    tl.push({step:step,ready:ready,updated:updated,available:available});
  }
  return tl;
}

function hpaCompute(cur,current,target,min,max){
  var ratio=current/target;
  var desired=Math.ceil(cur*ratio);
  if(ratio>1.1&&ratio<1.1)desired=cur;
  if(ratio>2)desired=cur*2;
  if(ratio<0.5)desired=Math.ceil(cur*0.5);
  return clamp(desired,min,max);
}

function errorBudget(slo,total,bad,minutes){
  var allowed=total*(1-slo);
  var remaining=Math.max(0,allowed-bad);
  var burn=(bad/minutes)/(allowed/minutes);
  return {allowed:allowed,consumed:bad,remaining:remaining,remainingPct:allowed>0?remaining/allowed*100:0,burnRate:burn,status:burn>2?'critical':(burn>1?'warning':'ok')};
}

function tokenCount(code,lang){
  var toks=tokenize(code,lang);
  var counts={keyword:0,string:0,comment:0,number:0,identifier:0,builtin:0,type:0,operator:0};
  toks.forEach(function(t){counts[t.t]=(counts[t.t]||0)+1});
  return counts;
}

R.terraform=function(dt){
  clear();
  var s=SNIPPETS.hclFormat;
  /* Draw resource graph */
  var resources=[
    {name:'aws_instance.web',type:'resource',x:200,y:140},
    {name:'aws_security_group.web',type:'resource',x:200,y:240},
    {name:'aws_iam_instance_profile.web',type:'resource',x:200,y:340},
    {name:'data.aws_ami.ubuntu',type:'data',x:60,y:190},
    {name:'var.instances',type:'var',x:60,y:290},
    {name:'out.instance_ips',type:'output',x:340,y:190}
  ];
  var edges=[
    {from:0,to:1},{from:0,to:2},{from:0,to:3},{from:0,to:4},{from:0,to:5}
  ];
  /* Draw edges */
  edges.forEach(function(e){
    var a=resources[e.from],b=resources[e.to];
    S.ctx.strokeStyle='rgba(168,85,247,.4)';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    S.ctx.moveTo(a.x+50,a.y);
    S.ctx.lineTo(b.x-50,b.y);
    S.ctx.stroke();
  });
  /* Draw nodes */
  resources.forEach(function(r){
    var color=r.type==='resource'?'#00ff88':(r.type==='data'?'#00d4ff':'#ffb000');
    S.ctx.fillStyle=color+'20';
    S.ctx.fillRect(r.x-90,r.y-20,180,40);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(r.x-89.5,r.y-19.5,179,39);
    S.ctx.fillStyle=color;
    S.ctx.font='600 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(r.name,r.x,r.y+4);
  });
  /* Info */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('RESOURCE GRAPH · '+resources.length+' nodes',30,100);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Green: resources · Blue: data sources · Amber: outputs/vars',30,120);
  /* Show code */
  var html=renderCodeViewer(s.code,s.lang,s.file,s.caption);
  $('stageContent').innerHTML=html;
};

R.k8sScheduler=function(dt){
  clear();
  headline('K8s Scheduler','filter → score → bind');
  if(!S.sim.sched){
    S.sim.sched={
      nodes:[
        {name:'node-1',cpuTotal:8000,cpuUsed:3000,memTotal:16000,memUsed:4000,taints:false},
        {name:'node-2',cpuTotal:8000,cpuUsed:6000,memTotal:16000,memUsed:8000,taints:false},
        {name:'node-3',cpuTotal:8000,cpuUsed:2000,memTotal:16000,memUsed:10000,taints:false},
        {name:'node-4',cpuTotal:8000,cpuUsed:5000,memTotal:16000,memUsed:2000,taints:true}
      ],
      pod:{cpuRequest:2000,memRequest:4000}
    };
  }
  var sc=S.sim.sched;
  var scores=schedulePod(sc.pod,sc.nodes.map(function(n){
    return {name:n.name,cpuTotal:n.cpuTotal,cpuUsed:n.cpuUsed,memTotal:n.memTotal,memUsed:n.memUsed,cpuFree:n.cpuTotal-n.cpuUsed,memFree:n.memTotal-n.memUsed,taints:n.taints};
  }));
  var padL=80,padT=140;
  var cardW=(S.W-padL*2)/sc.nodes.length-20;
  var cardH=S.H-padT-140;
  sc.nodes.forEach(function(n,i){
    var x=padL+i*(cardW+20),y=padT;
    var feasible=!n.taints&&(n.cpuTotal-n.cpuUsed>=sc.pod.cpuRequest)&&(n.memTotal-n.memUsed>=sc.pod.memRequest);
    S.ctx.fillStyle=feasible?'rgba(0,255,136,.08)':'rgba(255,68,68,.08)';
    S.ctx.fillRect(x,y,cardW,cardH);
    S.ctx.strokeStyle=feasible?'#00ff88':'#ff4444';
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(x+.5,y+.5,cardW-1,cardH-1);
    S.ctx.fillStyle=feasible?'#5cffb0':'#ff8080';
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(n.name,x+cardW/2,y+25);
    S.ctx.fillStyle=feasible?'#00ff88':'#ff4444';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(feasible?'FEASIBLE':'TAINTED',x+cardW/2,y+45);
    /* CPU bar */
    var cpuPct=n.cpuUsed/n.cpuTotal;
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('CPU',x+10,y+75);
    S.ctx.textAlign='right';
    S.ctx.fillText(n.cpuUsed+'/'+n.cpuTotal,x+cardW-10,y+75);
    S.ctx.fillStyle='rgba(0,212,255,.15)';
    S.ctx.fillRect(x+10,y+85,cardW-20,12);
    S.ctx.fillStyle=cpuPct>0.8?'#ff4444':(cpuPct>0.6?'#ffb000':'#00d4ff');
    S.ctx.fillRect(x+10,y+85,(cardW-20)*cpuPct,12);
    /* Mem bar */
    var memPct=n.memUsed/n.memTotal;
    S.ctx.fillStyle='#7898a8';
    S.ctx.textAlign='left';
    S.ctx.fillText('MEM',x+10,y+120);
    S.ctx.textAlign='right';
    S.ctx.fillText(n.memUsed+'/'+n.memTotal,x+cardW-10,y+120);
    S.ctx.fillStyle='rgba(168,85,247,.15)';
    S.ctx.fillRect(x+10,y+130,cardW-20,12);
    S.ctx.fillStyle=memPct>0.8?'#ff4444':(memPct>0.6?'#ffb000':'#a855f7');
    S.ctx.fillRect(x+10,y+130,(cardW-20)*memPct,12);
    /* Score */
    if(feasible){
      var s2=scores.find(function(sc2){return sc2.node.name===n.name});
      if(s2){
        S.ctx.fillStyle='#ffb000';
        S.ctx.font='700 14px "Orbitron",monospace';
        S.ctx.textAlign='center';
        S.ctx.fillText(fmt(s2.score,1),x+cardW/2,y+175);
        S.ctx.fillStyle='#7898a8';
        S.ctx.font='9px "JetBrains Mono",monospace';
        S.ctx.fillText('cpu='+fmt(s2.cpuScore,0)+' mem='+fmt(s2.memScore,0)+' bal='+fmt(s2.balanced,0),x+cardW/2,y+195);
      }
    }
  });
  if(scores.length>0){
    S.ctx.fillStyle='#02060a';
    S.ctx.font='700 16px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('BEST NODE: '+scores[0].node.name,S.W/2,S.H-50);
  }
  S.ctx.fillStyle='#5ce5ff';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Pod request: cpu='+sc.pod.cpuRequest+'m mem='+sc.pod.memRequest+'Mi',80,S.H-25);
};

R.k8sRollout=function(dt){
  clear();
  headline('K8s Rolling Update','maxSurge / maxUnavailable');
  if(!S.sim.k8sD){S.sim.k8sD={desired:6,maxSurge:2,maxUnavail:1,tl:null,step:0,running:true}}
  var k=S.sim.k8sD;
  if(!k.tl){k.tl=rollingUpdate(k.desired,k.maxSurge,k.maxUnavail);k.step=0}
  if(k.running&&S.t-S.sim.lastStep>0.3){
    S.sim.lastStep=S.t;
    k.step++;
    if(k.step>=k.tl.length)k.step=0;
  }
  var cur=k.tl[Math.min(k.step,k.tl.length-1)];
  var padL=80,padT=140;
  var podSize=50,podSpacing=60;
  S.ctx.fillStyle='#5ce5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('OLD (v1.0)',padL,padT-15);
  S.ctx.fillText('NEW (v2.0)',padL,padT+120);
  for(var i=0;i<k.desired;i++){
    var x=padL+i*podSpacing;
    var isReady=i<cur.available-Math.max(0,cur.updated-cur.available);
    S.ctx.fillStyle=isReady?'rgba(0,212,255,.6)':'rgba(0,212,255,.15)';
    S.ctx.fillRect(x,padT,podSize,podSize);
    S.ctx.strokeStyle=isReady?'#00d4ff':'rgba(0,212,255,.3)';
    S.ctx.strokeRect(x+.5,padT+.5,podSize-1,podSize-1);
    S.ctx.fillStyle=isReady?'#02060a':'#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('v1',x+podSize/2,padT+podSize/2+4);
  }
  for(var j=0;j<k.desired;j++){
    var x2=padL+j*podSpacing;
    var isNew=j<cur.updated;
    S.ctx.fillStyle=isNew?'rgba(0,255,136,.6)':'rgba(0,255,136,.15)';
    S.ctx.fillRect(x2,padT+135,podSize,podSize);
    S.ctx.strokeStyle=isNew?'#00ff88':'rgba(0,255,136,.3)';
    S.ctx.strokeRect(x2+.5,padT+135.5,podSize-1,podSize-1);
    S.ctx.fillStyle=isNew?'#02060a':'#7898a8';
    S.ctx.fillText('v2',x2+podSize/2,padT+135+podSize/2+4);
  }
  /* Timeline */
  var tlY=padT+250;
  if(tlY+150<S.H){
    S.ctx.fillStyle='#5cffb0';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('PROGRESS',padL,tlY-10);
    var barW=(S.W-padL-80)/k.tl.length;
    k.tl.forEach(function(s,i){
      var x=padL+i*barW;
      var h1=s.available/k.desired*60;
      var h2=s.updated/k.desired*60;
      S.ctx.fillStyle='rgba(0,212,255,.6)';
      S.ctx.fillRect(x,tlY+60-h1,barW*0.4-2,h1);
      S.ctx.fillStyle='rgba(0,255,136,.6)';
      S.ctx.fillRect(x+barW*0.45,tlY+60-h2,barW*0.4-2,h2);
      if(i===k.step){
        S.ctx.strokeStyle='#ffb000';
        S.ctx.lineWidth=2;
        S.ctx.strokeRect(x-2,tlY-2,barW+2,64);
      }
    });
  }
};
