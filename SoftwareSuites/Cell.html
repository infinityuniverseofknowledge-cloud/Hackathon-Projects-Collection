<!DOCTYPE html>
<html lang="en" data-theme="cell">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CELL — Complex Systems Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#05040d;--bg2:#0a0818;--bg3:#120e26;--bg4:#1c1638;
  --panel:#0a0818;--panel2:#120e26;--panel3:#1c1638;--panel4:#2a2050;
  --bd:#1a1438;--bd2:#2c2258;--bd3:#423478;
  --tx:#e8e0ff;--tx2:#a090d0;--tx3:#605090;--mu:#302870;
  --c1:#a060ff;--c1h:#c090ff;--c1l:#7030c0;
  --c2:#40e0ff;--c2h:#80e8ff;--c2l:#2090b0;
  --c3:#ff60a0;--c3h:#ff90c0;--c3l:#c03080;
  --c4:#80ff40;--c4h:#b0ff80;--c4l:#40c020;
  --c5:#ffcc40;--c5h:#ffe080;--c5l:#c0a020;
  --c6:#ff8040;--c6h:#ffa870;--c6l:#c05020;
  --ok:#80ff40;--warn:#ffcc40;--err:#ff60a0;--info:#40e0ff;
  --g1:linear-gradient(135deg,#a060ff,#40e0ff);
  --g2:linear-gradient(135deg,#ff60a0,#ffcc40);
  --gHolo:linear-gradient(120deg,#a060ff,#40e0ff,#80ff40,#ffcc40,#ff60a0,#a060ff);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f5f0ff;--bg2:#eae0ff;--bg3:#dcd0f8;--panel:#fff;--panel2:#f5f0ff;--panel3:#eae0ff;
  --bd:#d0c0e8;--bd2:#b0a0d0;--tx:#100830;--tx2:#403068;--tx3:#8070a0;
  --c1:#7030c0;--c2:#0060c0;--c3:#c02060;--c4:#408000;--c5:#a08000;
  --g1:linear-gradient(135deg,#7030c0,#0060c0)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101014;--bg3:#18181e;--panel:#101014;--panel2:#18181e;--panel3:#202028;
  --bd:#282830;--bd2:#404048;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#05040d;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px;overflow:hidden}
#boot.hidden{opacity:0;pointer-events:none}
#bootGrid{position:absolute;inset:0;pointer-events:none}
.boot-cells{width:180px;height:180px;margin-bottom:16px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;position:relative;z-index:1}
.boot-cells .cell{background:#1c1638;border-radius:3px;animation:cel 2s ease-in-out infinite}
.boot-cells .cell:nth-child(1){animation-delay:0s}
.boot-cells .cell:nth-child(2){animation-delay:.1s}
.boot-cells .cell:nth-child(3){animation-delay:.2s}
.boot-cells .cell:nth-child(7){animation-delay:.3s}
.boot-cells .cell:nth-child(8){animation-delay:.4s}
.boot-cells .cell:nth-child(9){animation-delay:.5s}
.boot-cells .cell:nth-child(13){animation-delay:.6s}
.boot-cells .cell:nth-child(14){animation-delay:.7s}
.boot-cells .cell:nth-child(15){animation-delay:.8s}
.boot-cells .cell:nth-child(19){animation-delay:.9s}
.boot-cells .cell:nth-child(20){animation-delay:1.0s}
.boot-cells .cell:nth-child(21){animation-delay:1.1s}
.boot-cells .cell:nth-child(25){animation-delay:1.2s}
.boot-cells .cell:nth-child(26){animation-delay:1.3s}
.boot-cells .cell:nth-child(27){animation-delay:1.4s}
.boot-cells .cell:nth-child(31){animation-delay:1.5s}
.boot-cells .cell:nth-child(32){animation-delay:1.6s}
.boot-cells .cell:nth-child(33){animation-delay:1.7s}
@keyframes cel{0%,100%{background:#1c1638}50%{background:#a060ff;box-shadow:0 0 15px #a060ff}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px;position:relative;z-index:1}
.boot-sub{font-size:.66rem;color:#a060ff;letter-spacing:10px;margin-bottom:26px;opacity:.75;position:relative;z-index:1}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#120e26;border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative;z-index:1}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #a060ff}
.boot-pct{font-size:.66rem;color:#a060ff;margin-bottom:14px;position:relative;z-index:1}
.boot-log{font-size:.58rem;color:#605090;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7;position:relative;z-index:1}
.boot-log .ok{color:#80ff40}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#05040d;box-shadow:0 0 12px rgba(160,96,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#120e26;transition:var(--t1)}
.tb-status .dot.on{background:var(--c4);box-shadow:0 0 10px var(--c4);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#02010a;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(10,8,24,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c5);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(160,96,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#05040d;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(160,96,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--c5);border-color:var(--c5)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#05040d;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c4)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <canvas id="bootGrid" style="position:absolute;inset:0"></canvas>
  <div class="boot-cells">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>
  <div class="boot-logo">CELL</div>
  <div class="boot-sub">COMPLEX SYSTEMS LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('turing')">CELL</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">evolving</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Gen</span><span class="sb-val c2" id="sbGen">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Cells</span><span class="sb-val c3" id="sbCells">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Density</span><span class="sb-val c4" id="sbDens">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Rule</span><span class="sb-val c5" id="sbRule">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Turing</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}

/* Map a scalar [0,1] to RGB via a viridis-like palette */
var VIRIDIS=[
  [68,1,84],[72,40,120],[62,73,137],[49,104,142],[38,130,142],
  [31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]
];
function scalarToRGB(t){
  t=clamp(t,0,1);
  var n=VIRIDIS.length-1;
  var i=Math.floor(t*n);
  var f=t*n-i;
  if(i>=n){var v=VIRIDIS[n];return [v[0],v[1],v[2]]}
  var a=VIRIDIS[i],b=VIRIDIS[i+1];
  return [
    Math.round(a[0]+(b[0]-a[0])*f),
    Math.round(a[1]+(b[1]-a[1])*f),
    Math.round(a[2]+(b[2]-a[2])*f)
  ];
}
/* Purple-cyan-magenta palette for CELL theme */
var CELLPAL=[
  [10,8,24],[26,18,56],[52,32,120],[90,48,180],[140,72,220],
  [180,110,255],[220,150,255],[255,180,240],[255,220,220],[255,255,255]
];
function cellRGB(t){
  t=clamp(t,0,1);
  var n=CELLPAL.length-1;
  var i=Math.floor(t*n);
  var f=t*n-i;
  if(i>=n){var v=CELLPAL[n];return [v[0],v[1],v[2]]}
  var a=CELLPAL[i],b=CELLPAL[i+1];
  return [
    Math.round(a[0]+(b[0]-a[0])*f),
    Math.round(a[1]+(b[1]-a[1])*f),
    Math.round(a[2]+(b[2]-a[2])*f)
  ];
}
/* Green-lime for cells */
function cellGreenRGB(t){
  t=clamp(t,0,1);
  return [
    Math.round(10+t*200),
    Math.round(20+t*230),
    Math.round(30+t*90)
  ];
}
/* Blue-orange for Lenia */
function leniaRGB(t){
  t=clamp(t,0,1);
  /* teal → yellow → red */
  var r=Math.round(255*Math.pow(t,0.5));
  var g=Math.round(200*Math.pow(t,1.5));
  var b=Math.round(255*Math.pow(1-t,2));
  return [r,g,b];
}

registerModule('turing',{
  title:'Turing Patterns',
  icon:'🧫',
  desc:'Gray-Scott reaction-diffusion. Two chemicals (U, V) diffuse and react via ∂u/∂t = Du∇²u − uv² + f(1−u). Emergent patterns rival biology.',
  init:function(){
    var t=STATE.turing;
    var N=t.W*t.H;
    t.u=new Float32Array(N);
    t.v=new Float32Array(N);
    t.u2=new Float32Array(N);
    t.v2=new Float32Array(N);
    this.reset();
    logMsg('Turing: '+t.W+'×'+t.H+' grid, preset '+t.preset,'success');
  },
  reset:function(){
    var t=STATE.turing;
    /* Fill with U=1, V=0 */
    for(var i=0;i<t.u.length;i++){t.u[i]=1;t.v[i]=0}
    /* Seed with random V patches */
    var seeds=rnd(8,20);
    for(var s=0;s<seeds;s++){
      var cx=rnd(10,t.W-10),cy=rnd(10,t.H-10);
      var rad=rnd(3,8);
      for(var dy=-rad;dy<=rad;dy++){
        for(var dx=-rad;dx<=rad;dx++){
          if(dx*dx+dy*dy<=rad*rad){
            var x=cx+dx,y=cy+dy;
            if(x>=0&&x<t.W&&y>=0&&y<t.H){
              t.v[y*t.W+x]=1;
              t.u[y*t.W+x]=0.5;
            }
          }
        }
      }
    }
    t.generation=0;
  },
  seedAt:function(px,py,radius){
    var t=STATE.turing;
    for(var dy=-radius;dy<=radius;dy++){
      for(var dx=-radius;dx<=radius;dx++){
        if(dx*dx+dy*dy>radius*radius)continue;
        var x=px+dx,y=py+dy;
        if(x<0||x>=t.W||y<0||y>=t.H)continue;
        t.v[y*t.W+x]=1;
        t.u[y*t.W+x]=0.5;
      }
    }
  },
  step:function(){
    var t=STATE.turing;
    var W=t.W,H=t.H;
    var u=t.u,v=t.v,u2=t.u2,v2=t.v2;
    var Du=t.Du,Dv=t.Dv,f=t.f,k=t.k,dt=t.dt;
    var uvv,dU,dV;
    for(var y=0;y<H;y++){
      var yN=y-1<0?H-1:y-1;
      var yS=y+1>=H?0:y+1;
      for(var x=0;x<W;x++){
        var xW=x-1<0?W-1:x-1;
        var xE=x+1>=W?0:x+1;
        var idx=y*W+x;
        var idxN=yN*W+x,idxS=yS*W+x,idxW=y*W+xW,idxE=y*W+xE;
        var uC=u[idx],vC=v[idx];
        /* 5-point Laplacian */
        var lapU=u[idxN]+u[idxS]+u[idxW]+u[idxE]-4*uC;
        var lapV=v[idxN]+v[idxS]+v[idxW]+v[idxE]-4*vC;
        uvv=uC*vC*vC;
        dU=Du*lapU-uvv+f*(1-uC);
        dV=Dv*lapV+uvv-(f+k)*vC;
        u2[idx]=clamp(uC+dU*dt,0,1);
        v2[idx]=clamp(vC+dV*dt,0,1);
      }
    }
    /* Swap buffers */
    t.u=u2;t.v=v2;t.u2=u;t.v2=v;
    t.generation++;
  },
  tick:function(dt){
    STATE.time+=dt;
    var t=STATE.turing;
    if(!STATE.playing)return;
    /* Multiple substeps per frame */
    for(var i=0;i<t.stepsPerFrame;i++)this.step();
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02010a';
    ctx.fillRect(0,0,W,H);
    var t=STATE.turing;
    /* Compute render area */
    var cellW=Math.min(W/t.W,H/t.H);
    var renderW=t.W*cellW,renderH=t.H*cellH_;
    var renderH=t.H*cellW;
    var ox=(W-renderW)/2,oy=(H-renderH)/2;
    /* Build pixel image */
    if(!t.imagedata||t.imagedata.width!==t.W||t.imagedata.height!==t.H){
      t.imagedata=ctx.createImageData(t.W,t.H);
    }
    var img=t.imagedata;
    var d=img.data;
    for(var i=0;i<t.u.length;i++){
      /* Show (u-v) scaled: v is the pattern */
      var vv=t.v[i];
      var uv=t.u[i]-vv;
      /* Colorize based on v concentration */
      var c=cellRGB(vv*1.8);
      d[i*4]=c[0];
      d[i*4+1]=c[1];
      d[i*4+2]=c[2];
      d[i*4+3]=255;

    /* Cursor brush preview */
    if(INPUT.x>ox&&INPUT.x<ox+renderW&&INPUT.y>oy&&INPUT.y<oy+renderH){
      var bx=(INPUT.x-ox)/cellW;

      '<div>Grid: '+t.W+'×'+t.H+'</div>'+
      '<div>Gen: '+t.generation+'</div>'+
      '<div>Preset: '+TURING_PRESETS[t.preset].name+'</div>'+
      '<div>f='+fmt(t.f,4)+' k='+fmt(t.k,4)+'</div>'

    $('sbGen').textContent=t.generation;
    $('sbCells').textContent=(t.W*t.H).toLocaleString();
  },
  onDown:function(p){
    var t=STATE.turing;
    var W=CANV.W,H=CANV.H;
    var cellW=Math.min(W/t.W,H/t.H);
    var renderW=t.W*cellW,renderH=t.H*cellW;
    var ox=(W-renderW)/2,oy=(H-renderH)/2;
    if(p.x<ox||p.x>ox+renderW||p.y<oy||p.y>oy+renderH)return;

        }

      this.seedAt(gx,gy,t.brushSize);

var LIFE_PRESETS={
  'random':{name:'Random',build:function(W,H,d){return null}},
  'glider':{name:'Glider',build:function(W,H){var g=new Uint8Array(W*H);var cx=Math.floor(W/2),cy=Math.floor(H/2);
    [[1,0],[2,1],[0,2],[1,2],[2,2]].forEach(function(p){g[(cy+p[1])*W+cx+p[0]]=1});return g}},
  'glider-gun':{name:'Gosper Gun',build:function(W,H){var g=new Uint8Array(W*H);
    var gun=[[24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],[11,3],[15,3],[20,3],[21,3],[34,3],[35,3],[0,4],[1,4],[10,4],[16,4],[20,4],[21,4],[0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],[10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]];
    var ox=5,oy=5;
    gun.forEach(function(p){if(p[0]+ox<W&&p[1]+oy<H)g[(oy+p[1])*W+ox+p[0]]=1});
    return g}},
  'pulsar':{name:'Pulsar',build:function(W,H){var g=new Uint8Array(W*H);var cx=Math.floor(W/2),cy=Math.floor(H/2);
    var p=[[2,0],[3,0],[4,0],[8,0],[9,0],[10,0],[0,2],[5,2],[7,2],[12,2],[0,3],[5,3],[7,3],[12,3],[0,4],[5,4],[7,4],[12,4],[2,5],[3,5],[4,5],[8,5],[9,5],[10,5],[2,7],[3,7],[4,7],[8,7],[9,7],[10,7],[0,8],[5,8],[7,8],[12,8],[0,9],[5,9],[7,9],[12,9],[0,10],[5,10],[7,10],[12,10],[2,12],[3,12],[4,12],[8,12],[9,12],[10,12]];
    p.forEach(function(q){if(cx+q[0]-6>=0&&cx+q[0]-6<W&&cy+q[1]-6>=0&&cy+q[1]-6<H)g[(cy+q[1]-6)*W+cx+q[0]-6]=1});
    return g}},
  'pentadecathlon':{name:'Pentadecathlon',build:function(W,H){var g=new Uint8Array(W*H);var cx=Math.floor(W/2),cy=Math.floor(H/2);
    for(var i=0;i<10;i++){var y=cy+i-5;if(y>=0&&y<H)g[y*W+cx]=1}
    return g}},
  'r-pentomino':{name:'R-Pentomino',build:function(W,H){var g=new Uint8Array(W*H);var cx=Math.floor(W/2),cy=Math.floor(H/2);
    [[1,0],[2,0],[0,1],[1,1],[1,2]].forEach(function(p){g[(cy+p[1])*W+cx+p[0]]=1});return g}},
  'acorn':{name:'Acorn',build:function(W,H){var g=new Uint8Array(W*H);var cx=Math.floor(W/2),cy=Math.floor(H/2);
    [[1,0],[3,1],[0,2],[1,2],[4,2],[5,2],[6,2]].forEach(function(p){g[(cy+p[1])*W+cx+p[0]]=1});return g}}
};
registerModule('life',{
  title:"Conway's Life",
  icon:'🔲',
  desc:'The classic 2D cellular automaton. Each cell lives, dies, or is born based on its 8 neighbors. Turing-complete.',
  init:function(){
    var l=STATE.life;
    l.grid=new Uint8Array(l.W*l.H);
    l.next=new Uint8Array(l.W*l.H);
    this.loadPreset(l.preset);
    logMsg('Life: '+l.W+'×'+l.H+' grid, preset '+l.preset,'success');
  },
  loadPreset:function(name){
    var l=STATE.life;
    l.preset=name;
    l.grid=new Uint8Array(l.W*l.H);
    if(name==='random'){
      for(var i=0;i<l.grid.length;i++)l.grid[i]=Math.random()<l.density?1:0;
    } else {
      var g=LIFE_PRESETS[name].build(l.W,l.H,l.density);
      l.grid=g;
    }
    l.generation=0;
    l.history=[];
    this.computeStats();
  },
  computeStats:function(){
    var l=STATE.life;
    var count=0;
    for(var i=0;i<l.grid.length;i++)if(l.grid[i])count++;
    l.population=count;
  },
  step:function(){
    var l=STATE.life;
    var W=l.W,H=l.H;
    var grid=l.grid,next=l.next;
    var S=l.rules.survive,B=l.rules.birth;
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var n=0;
        for(var dy=-1;dy<=1;dy++){
          for(var dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;
            var nx=x+dx,ny=y+dy;
            if(l.wrap){nx=(nx+W)%W;ny=(ny+H)%H}
            else if(nx<0||nx>=W||ny<0||ny>=H)continue;
            n+=grid[ny*W+nx];
          }
        }
        var idx=y*W+x;
        var alive=grid[idx];
        if(alive){
          next[idx]=S.indexOf(n)>=0?1:0;
        } else {
          next[idx]=B.indexOf(n)>=0?1:0;
        }
      }
    }
    /* Swap */
    var tmp=l.grid;l.grid=l.next;l.next=tmp;
    l.generation++;
    this.computeStats();
    if(l.generation%10===0)l.history.push(l.population);
    if(l.history.length>60)l.history.shift();
  },
  tick:function(dt){
    STATE.time+=dt;
    var l=STATE.life;
    if(!STATE.playing)return;
    for(var i=0;i<l.speed;i++)this.step();

    ctx.fillStyle='#80ff40';
    for(var y=0;y<l.H;y++){
      for(var x=0;x<l.W;x++){

        }
      }
    }
    /* Grid overlay if zoomed in enough */
    if(cellW>6){
      ctx.strokeStyle='rgba(160,96,255,.1)';
      ctx.lineWidth=0.5;
      for(var i=0;i<=l.W;i++){
        ctx.beginPath();ctx.moveTo(ox+i*cellW,oy);ctx.lineTo(ox+i*cellW,oy+renderH);ctx.stroke();
      }
      for(var j=0;j<=l.H;j++){
        ctx.beginPath();ctx.moveTo(ox,oy+j*cellW);ctx.lineTo(ox+renderW,oy+j*cellW);ctx.stroke();
      }
    }
    /* Border */
    ctx.strokeStyle='rgba(128,255,64,.4)';

    ctx.font='10px monospace';
    ctx.fillText('Grid: '+l.W+'×'+l.H,32,62);
    ctx.fillText('Generation: '+l.generation,32,78);
    ctx.fillText('Population: '+l.population,32,94);
    ctx.fillText('Density: '+fmt(l.population/(l.W*l.H)*100,1)+'%',32,110);
    ctx.fillText('Wrap: '+(l.wrap?'YES (torus)':'NO (bounded)'),32,126);
    /* Mini population history */

        var px=hx+10+(i/l.history.length)*(hw-20);
        var py=hy+hh-10-(l.history[i]/maxPop)*(hh-30);
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);

    }
    /* Legend hint */

    setStatsHTML(
      '<div>Grid: '+l.W+'×'+l.H+'</div>'+

    $('sbDens').textContent=fmt(l.population/(l.W*l.H)*100,1)+'%';
  },
  onDown:function(p){

    var W=CANV.W,H=CANV.H;
    var cellW=Math.min(W/l.W,H/l.H);
    var renderW=l.W*cellW,renderH=l.H*cellW;

<script>
/* ================================================================
   MODULE 3: WOLFRAM 1D ELEMENTARY CA
   ================================================================ */
registerModule('wolfram',{
  title:'Wolfram Automata',
  icon:'🎼',
  desc:'All 256 elementary cellular automata. Each rule is an 8-bit truth table mapping 3-cell neighborhoods to the next state.',
  init:function(){
    var w=STATE.wolfram;
    w.grid=new Uint8Array(w.W*w.H);
    this.reset();
    logMsg('Wolfram: rule '+w.rule,'success');
  },
  reset:function(){
    var w=STATE.wolfram;
    w.grid=new Uint8Array(w.W*w.H);
    w.row=0;
    /* Initialize row 0 based on mode */
    if(w.initMode==='single'){
      w.grid[Math.floor(w.W/2)]=1;
    } else {
      /* Random */
      for(var i=0;i<w.W;i++)w.grid[i]=Math.random()<0.5?1:0;
    }
    /* Prefill some rows to give something to look at */
    for(var r=0;r<Math.min(w.H-1,60);r++)this.stepRow();
  },
  stepRow:function(){
    var w=STATE.wolfram;
    if(w.row>=w.H-1)return;
    var y=w.row;
    var next=y+1;
    var rule=w.rule;
    for(var x=0;x<w.W;x++){
      var l,r;
      if(w.wrap){
        l=w.grid[y*w.W+((x-1+w.W)%w.W)];
        r=w.grid[y*w.W+((x+1)%w.W)];
      } else {
        l=x-1<0?0:w.grid[y*w.W+x-1];
        r=x+1>=w.W?0:w.grid[y*w.W+x+1];
      }
      var c=w.grid[y*w.W+x];
      var idx=(l<<2)|(c<<1)|r;
      var bit=(rule>>idx)&1;
      w.grid[next*w.W+x]=bit;
    }
    w.row=next;
  },
  step:function(){
    this.stepRow();
    if(STATE.wolfram.row>=STATE.wolfram.H-1){
      /* Scroll up by half and continue */
      var w=STATE.wolfram;
      var half=Math.floor(w.H/2);
      var newGrid=new Uint8Array(w.W*w.H);
      for(var y=0;y<half;y++){
        for(var x=0;x<w.W;x++){
          newGrid[y*w.W+x]=w.grid[(y+half)*w.W+x];
        }
      }
      w.grid=newGrid;
      w.row=half;
      for(var r=0;r<half;r++)this.stepRow();
    }
  },
  tick:function(dt){
    STATE.time+=dt;
    var w=STATE.wolfram;
    if(!STATE.playing)return;
    for(var i=0;i<3;i++)this.step();
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02010a';
    ctx.fillRect(0,0,W,H);
    var w=STATE.wolfram;
    var cellW=Math.min(W/w.W,H/w.H);
    var renderW=w.W*cellW,renderH=w.H*cellW;
    var ox=(W-renderW)/2,oy=(H-renderH)/2;
    /* Draw cells */
    for(var y=0;y<w.H;y++){
      for(var x=0;x<w.W;x++){
        if(w.grid[y*w.W+x]){
          var alive=y<=w.row;
          /* Fade older rows */
          var t=alive?1:0.3;
          if(alive){
            var fade=1-(w.row-y)/w.H*0.6;
            ctx.fillStyle='rgba(160,96,255,'+fade+')';
          } else {
            ctx.fillStyle='rgba(160,96,255,.3)';
          }
          ctx.fillRect(ox+x*cellW,oy+y*cellW,cellW+0.5,cellW+0.5);
        }
      }
    }
    /* Row indicator */
    ctx.strokeStyle='rgba(64,224,255,.6)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(ox,oy+(w.row+0.5)*cellW);
    ctx.lineTo(ox+renderW,oy+(w.row+0.5)*cellW);
    ctx.stroke();
    /* Border */
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.lineWidth=1.5;
    ctx.strokeRect(ox,oy,renderW,renderH);
    /* Rule table visualization */
    var panelW=420;
    var panelH=110;
    var px=W-panelW-20,py=20;
    ctx.fillStyle='rgba(10,8,24,.9)';
    ctx.strokeStyle='rgba(160,96,255,.4)';

    ctx.textAlign='left';

    /* 8 neighborhood boxes */
    var boxY=py+34;
    var boxSize=44;

      var bx=px+14+i*(boxSize+4);

      var patternIdx=i;
      var l=(patternIdx>>2)&1;
      var c=(patternIdx>>1)&1;
      var r=patternIdx&1;
      /* Top row shows 3 cells */
      for(var k=0;k<3;k++){
        var cellV=k===0?l:k===1?c:r;
        ctx.fillStyle=cellV?'#a060ff':'#1c1638';
        ctx.fillRect(bx+k*(boxSize/3),boxY,boxSize/3-1,12);
      }
      /* Result bit below */
      var result=(w.rule>>i)&1;
      ctx.fillStyle='#685898';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText('↓',bx+boxSize/2,boxY+26);
      ctx.fillStyle=result?'#40e0ff':'#1c1638';
      ctx.fillRect(bx+boxSize/6,boxY+32,boxSize*2/3-1,12);
      ctx.fillStyle='#e8e0ff';
      ctx.font='bold 10px monospace';
      ctx.fillText(String(result),bx+boxSize/2,boxY+72);
    }
    setStatsHTML(
      '<div>Rule: '+w.rule+'</div>'+
      '<div>Binary: '+w.rule.toString(2).padStart(8,'0')+'</div>'+
      '<div>Grid: '+w.W+'×'+w.H+'</div>'+
      '<div>Row: '+w.row+'</div>'

    $('sbMode').textContent='Wolfram';
    $('sbRule').textContent=w.rule;
  },

/* ================================================================
   MODULE 4: LENIA — continuous cellular automata
   ================================================================ */
registerModule('lenia',{
  title:'Lenia',
  icon:'🦠',
  desc:'Continuous CA by Bert Wang-Chak Chan. Each cell\'s state updates via convolution with a ring kernel and a Gaussian growth function. Produces lifelike motion.',
  init:function(){
    var l=STATE.lenia;
    var N=l.W*l.H;
    l.state=new Float32Array(N);
    l.next=new Float32Array(N);
    this.buildKernel();
    this.loadPreset(l.preset);
    logMsg('Lenia: '+l.W+'×'+l.H+' grid, kernel R='+l.kernelRadius,'success');
  },
  buildKernel:function(){
    var l=STATE.lenia;
    var R=l.kernelRadius;
    var size=2*R+1;
    l.kernel=new Float32Array(size*size);
    var sum=0;
    for(var y=-R;y<=R;y++){
      for(var x=-R;x<=R;x++){
        var r=Math.sqrt(x*x+y*y)/R;
        var k;
        if(r<1){
          /* Ring kernel: (4r(1-r))^4 */
          var t=4*r*(1-r);
          k=Math.pow(t,4);
        } else {
          k=0;
        }
        l.kernel[(y+R)*size+(x+R)]=k;
        sum+=k;
      }
    }
    /* Normalize */
    if(sum>0)for(var i=0;i<l.kernel.length;i++)l.kernel[i]/=sum;
    l.kernelSize=size;
  },
  loadPreset:function(name){
    var l=STATE.lenia;
    l.preset=name;
    var N=l.W*l.H;
    l.state=new Float32Array(N);
    l.next=new Float32Array(N);
    if(name==='orbium'){
      /* Orbium: ring-shaped glider */
      var cx=Math.floor(l.W/2),cy=Math.floor(l.H/2);
      for(var y=0;y<l.H;y++){
        for(var x=0;x<l.W;x++){
          var dx=x-cx,dy=y-cy;
          var r=Math.sqrt(dx*dx+dy*dy);
          /* Concentric rings */
          var v=0;
          if(r<8)v=1;
          else if(r<10)v=0;
          else if(r<12)v=0.5;
          l.state[y*l.W+x]=v*Math.exp(-(r*r)/200);
        }
      }
      /* Apply some initial noise */
      for(var i=0;i<N;i++)if(Math.random()<0.02)l.state[i]=Math.random();
    } else if(name==='random'){
      for(var i=0;i<N;i++)l.state[i]=Math.random();
    } else if(name==='spots'){
      /* Many random spots */
      for(var s=0;s<30;s++){
        var sx=rnd(5,l.W-5),sy=rnd(5,l.H-5);
        var sr=rndF(3,8);
        for(var y=-Math.ceil(sr);y<=Math.ceil(sr);y++){
          for(var x=-Math.ceil(sr);x<=Math.ceil(sr);x++){
            var r2=Math.sqrt(x*x+y*y);
            if(r2<sr){
              var nx=sx+x,ny=sy+y;
              if(nx<0||nx>=l.W||ny<0||ny>=l.H)continue;
              l.state[ny*l.W+nx]=Math.max(l.state[ny*l.W+nx],1-r2/sr);
            }
          }
        }
      }
    } else if(name==='glider'){
      /* Offset orbium-like glider */
      var cx=Math.floor(l.W/3),cy=Math.floor(l.H/2);
      for(var y=0;y<l.H;y++){
        for(var x=0;x<l.W;x++){
          var dx=x-cx,dy=y-cy;
          var r=Math.sqrt(dx*dx+dy*dy);
          if(r<6)l.state[y*l.W+x]=1;
          else if(r<9)l.state[y*l.W+x]=0.5;
        }
      }
    }
    l.generation=0;
  },
  convolve:function(){
    var l=STATE.lenia;
    var W=l.W,H=l.H;
    var R=l.kernelRadius;
    var ks=l.kernelSize;
    var result=new Float32Array(W*H);
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var sum=0;
        for(var ky=-R;ky<=R;ky++){
          var ny=(y+ky+H)%H;
          for(var kx=-R;kx<=R;kx++){
            var nx=(x+kx+W)%W;
            sum+=l.state[ny*W+nx]*l.kernel[(ky+R)*ks+(kx+R)];
          }
        }
        result[y*W+x]=sum;
      }
    }
    return result;
  },
  step:function(){
    var l=STATE.lenia;
    var W=l.W,H=l.H;
    var N=W*H;
    /* Convolve state with kernel */
    var conv=this.convolve();
    /* Growth function: G(u) = 2·exp(−((u−μ)/σ)²/2) − 1 */
    var mu=l.mu,sig=l.sigma;
    for(var i=0;i<N;i++){
      var u=conv[i];
      var diff=(u-mu)/sig;
      var growth=2*Math.exp(-0.5*diff*diff)-1;
      var newVal=l.state[i]+l.dt*growth;
      l.next[i]=clamp(newVal,0,1);
    }
    /* Swap */
    var tmp=l.state;l.state=l.next;l.next=tmp;
    l.generation++;
  },
  tick:function(dt){
    STATE.time+=dt;
    var l=STATE.lenia;
    if(!STATE.playing)return;
    /* Multiple substeps per frame */
    var steps=2;
    for(var i=0;i<steps;i++)this.step();
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02010a';
    ctx.fillRect(0,0,W,H);
    var l=STATE.lenia;
    var cellW=Math.min(W/l.W,H/l.H);
    var renderW=l.W*cellW,renderH=l.H*cellW;
    var ox=(W-renderW)/2,oy=(H-renderH)/2;
    /* Draw with color based on state value */
    for(var y=0;y<l.H;y++){
      for(var x=0;x<l.W;x++){
        var v=l.state[y*l.W+x];
        if(v>0.01){
          var c=leniaRGB(v);
          ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
          ctx.fillRect(ox+x*cellW,oy+y*cellW,cellW+0.5,cellW+0.5);
        }
      }
    }
    ctx.strokeStyle='rgba(64,224,255,.3)';
    ctx.lineWidth=1.5;
    ctx.strokeRect(ox,oy,renderW,renderH);
    /* Info panel */
    ctx.fillStyle='rgba(10,8,24,.9)';
    ctx.strokeStyle='rgba(64,224,255,.4)';
    ctx.beginPath();ctx.roundRect(20,20,250,130,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40e0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('LENIA',32,42);
    ctx.fillStyle='#e8e0ff';
    ctx.font='10px monospace';
    ctx.fillText('Grid: '+l.W+'×'+l.H,32,62);
    ctx.fillText('Generation: '+l.generation,32,78);
    ctx.fillText('μ='+fmt(l.mu,3)+'  σ='+fmt(l.sigma,4),32,94);
    ctx.fillText('kernel R='+l.kernelRadius,32,110);
    ctx.fillText('dt='+fmt(l.dt,3),32,126);
    /* Kernel preview */
    var kx=W-180,ky=20,ks=140;
    ctx.fillStyle='rgba(10,8,24,.9)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(kx,ky,ks,ks+30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 10px monospace';
    ctx.textAlign='left';
    ctx.fillText('KERNEL (ring)',kx+10,ky+16);
    /* Draw kernel heatmap */
    var kr=l.kernelRadius;
    var cellK=ks/(2*kr+1);
    for(var yy=0;yy<2*kr+1;yy++){
      for(var xx=0;xx<2*kr+1;xx++){
        var kv=l.kernel[yy*l.kernelSize+xx];
        var kc=cellRGB(kv*3);
        ctx.fillStyle='rgb('+kc[0]+','+kc[1]+','+kc[2]+')';
        ctx.fillRect(kx+xx*cellK,ky+20+yy*cellK,cellK+0.5,cellK+0.5);
      }
    }
    /* Growth function preview */
    var gx=20,gy=H-90,gw=300,gh=70;
    ctx.fillStyle='rgba(10,8,24,.9)';
    ctx.strokeStyle='rgba(128,255,64,.4)';
    ctx.beginPath();ctx.roundRect(gx,gy,gw,gh,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#80ff40';
    ctx.font='bold 10px monospace';
    ctx.textAlign='left';
    ctx.fillText('GROWTH FUNCTION G(u)',gx+10,gy+16);
    /* Draw growth curve */
    ctx.strokeStyle='#80ff40';
    ctx.lineWidth=1.8;
    ctx.beginPath();
    for(var i=0;i<=200;i++){
      var u=i/200;
      var diff=(u-l.mu)/l.sigma;
      var g=2*Math.exp(-0.5*diff*diff)-1;
      var px=gx+20+(i/200)*(gw-40);
      var py=gy+gh-15-(g+1)/2*(gh-30);
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    /* Zero line */
    ctx.strokeStyle='rgba(128,255,64,.2)';
    ctx.beginPath();ctx.moveTo(gx+20,gy+gh-15-(0+1)/2*(gh-30));ctx.lineTo(gx+gw-20,gy+gh-15-(0+1)/2*(gh-30));ctx.stroke();
    setStatsHTML(
      '<div>Grid: '+l.W+'×'+l.H+'</div>'+
      '<div>Gen: '+l.generation+'</div>'+
      '<div>μ='+fmt(l.mu,3)+' σ='+fmt(l.sigma,4)+'</div>'+
      '<div>R='+l.kernelRadius+'</div>'
    );
    updateBadge('🦠 Lenia · gen '+l.generation+' · '+l.W+'×'+l.H);
    $('sbMode').textContent='Lenia';
    $('sbGen').textContent=l.generation;
    $('sbCells').textContent=(l.W*l.H).toLocaleString();
  },
  onDown:function(p){
    var l=STATE.lenia;
    var W=CANV.W,H=CANV.H;
    var cellW=Math.min(W/l.W,H/l.H);
    var renderW=l.W*cellW,renderH=l.H*cellW;
    var ox=(W-renderW)/2,oy=(H-renderH)/2;
    if(p.x<ox||p.x>ox+renderW||p.y<oy||p.y>oy+renderH)return;
    var gx=Math.floor((p.x-ox)/cellW);
    var gy=Math.floor((p.y-oy)/cellW);
    var r=6;
    for(var dy=-r;dy<=r;dy++){
      for(var dx=-r;dx<=r;dx++){
        var d2=dx*dx+dy*dy;
        if(d2>r*r)continue;
        var x=gx+dx,y=gy+dy;
        if(x<0||x>=l.W||y<0||y>=l.H)continue;
        l.state[y*l.W+x]=Math.max(l.state[y*l.W+x],1-Math.sqrt(d2)/r);
      }
    }
  },
  onMove:function(p){if(INPUT.down)this.onDown(p);},
  controls:function(){
    var l=STATE.lenia;
    var html='';
    html+='<div class="sec"><h4>Preset</h4><div class="chip-row">';
    [['orbium','Orbium'],['glider','Glider'],['spots','Spots'],['random','Random']].forEach(function(p){
      html+='<div class="chip '+(l.preset===p[0]?'active':'')+'" onclick="MODULES.lenia.loadPreset(\''+p[0]+'\');renderLeftPanel()">'+p[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Growth parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>μ (center)</span><span>'+fmt(l.mu,3)+'</span></div>';
    html+='<input type="range" min="0.02" max="0.5" step="0.005" value="'+l.mu+'" oninput="STATE.lenia.mu=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>σ (width)</span><span>'+fmt(l.sigma,4)+'</span></div>';
    html+='<input type="range" min="0.005" max="0.1" step="0.001" value="'+l.sigma+'" oninput="STATE.lenia.sigma=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>dt (step size)</span><span>'+fmt(l.dt,3)+'</span></div>';
    html+='<input type="range" min="0.02" max="0.3" step="0.005" value="'+l.dt+'" oninput="STATE.lenia.dt=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Kernel radius</span><span>'+l.kernelRadius+'</span></div>';
    html+='<input type="range" min="4" max="20" step="1" value="'+l.kernelRadius+'" oninput="STATE.lenia.kernelRadius=parseInt(this.value);MODULES.lenia.buildKernel();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.lenia.loadPreset(STATE.lenia.preset)">↺ Reset preset</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="var l=STATE.lenia;for(var i=0;i<l.state.length;i++)l.state[i]=0;l.generation=0">✕ Clear</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="var l=STATE.lenia;for(var i=0;i<l.state.length;i++)l.state[i]=Math.random();l.generation=0">🎲 Randomize</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Click to seed</h4>';
    html+='<div style="font-family:var(--mono);font-size:.58rem;line-height:1.6;color:var(--tx2)">Clique na grade para adicionar "vida" localmente.</div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var l=STATE.lenia;
    return '<div class="sec"><h4>Update rule</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Aᵗ⁺¹(x) = clip[Aᵗ(x) + dt·G(K ∗ Aᵗ)(x)]<br><br>'+
      'where:<br>'+
      '• K is a ring kernel (2D convolution)<br>'+
      '• G(u) = 2·exp(−½((u−μ)/σ)²) − 1<br>'+
      '• clip to [0, 1]'+
      '</div></div>'+
      '<div class="sec"><h4>Ring kernel</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'K(r) = (4r(1−r))⁴  for r ∈ [0,1)<br>'+
      'r = distance / kernel_radius<br><br>'+
      'Peak at r = 0.5 (a ring, not a blob) — this is what creates the lifelike motion.'+
      '</div></div>'+
      '<div class="sec"><h4>Growth function</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Gaussian centered at μ with width σ.<br><br>'+
      'Cells grow when local average is near μ, shrink otherwise.<br>'+
      'The result oscillates like a biological cell.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Grid</span><span class="v">'+l.W+'×'+l.H+'</span></div>'+
      '<div class="row"><span class="k">μ</span><span class="v">'+fmt(l.mu,3)+'</span></div>'+
      '<div class="row"><span class="k">σ</span><span class="v">'+fmt(l.sigma,4)+'</span></div>'+
      '<div class="row"><span class="k">dt</span><span class="v">'+fmt(l.dt,3)+'</span></div>'+
      '<div class="row"><span class="k">R</span><span class="v">'+l.kernelRadius+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 5: BOIDS — Flocking
   ================================================================ */
registerModule('boids',{
  title:'Boids Flocking',
  icon:'🦅',
  desc:'Craig Reynolds\' 1987 model. Each agent follows three rules: separation, alignment, cohesion. Emergent flocking from local interactions.',
  init:function(){
    var b=STATE.boids;
    b.boids=[];
    for(var i=0;i<b.count;i++){
      b.boids.push({
        x:rndF(0,CANV.W||800),
        y:rndF(0,CANV.H||600),
        vx:rndF(-1,1)*b.maxSpeed,
        vy:rndF(-1,1)*b.maxSpeed,
        trail:[]
      });
    }
    logMsg('Boids: '+b.count+' agents','success');
  },
  buildHash:function(){
    var b=STATE.boids;
    b.hashSize=b.perception;
    b.hashCols=Math.ceil(CANV.W/b.hashSize);
    b.hashRows=Math.ceil(CANV.H/b.hashSize);
    b.hashGrid=[];
    for(var i=0;i<b.hashCols*b.hashRows;i++)b.hashGrid.push([]);
    b.boids.forEach(function(bd,i){
      var cx=clamp(Math.floor(bd.x/b.hashSize),0,b.hashCols-1);
      var cy=clamp(Math.floor(bd.y/b.hashSize),0,b.hashRows-1);
      b.hashGrid[cy*b.hashCols+cx].push(i);
    });
  },
  neighborsOf:function(bd){
    var b=STATE.boids;
    var cx=clamp(Math.floor(bd.x/b.hashSize),0,b.hashCols-1);
    var cy=clamp(Math.floor(bd.y/b.hashSize),0,b.hashRows-1);
    var out=[];
    for(var dy=-1;dy<=1;dy++){
      for(var dx=-1;dx<=1;dx++){
        var nx=cx+dx,ny=cy+dy;
        if(nx<0||nx>=b.hashCols||ny<0||ny>=b.hashRows)continue;
        var cell=b.hashGrid[ny*b.hashCols+nx];
        for(var k=0;k<cell.length;k++){
          var j=cell[k];
          if(b.boids[j]!==bd)out.push(b.boids[j]);
        }
      }
    }
    return out;
  },
  tick:function(dt){
    STATE.time+=dt;
    var b=STATE.boids;
    if(!STATE.playing)return;
    this.buildHash();
    var maxSpeed=b.maxSpeed;
    var maxForce=0.15;
    b.boids.forEach(function(bd){
      var neighbors=b.neighborsOf(bd);
      var sx=0,sy=0,ax=0,ay=0,cx=0,cy=0;
      var nSep=0,nAli=0,nCoh=0;
      neighbors.forEach(function(other){
        var dx=bd.x-other.x,dy=bd.y-other.y;
        var d2=dx*dx+dy*dy;
        var d=Math.sqrt(d2);
        if(d<0.001)return;
        /* Separation */
        if(d<b.separation){
          sx+=dx/d;sy+=dy/d;
          nSep++;
        }
        /* Alignment + Cohesion */
        if(d<b.perception){
          ax+=other.vx;ay+=other.vy;
          cx+=other.x;cy+=other.y;
          nAli++;
          nCoh++;
        }
      });
      var fx=0,fy=0;
      if(nSep>0){
        sx/=nSep;sy/=nSep;
        var sl=Math.sqrt(sx*sx+sy*sy);
        if(sl>0){sx/=sl;sy/=sl}
        sx*=maxSpeed;sx-=bd.vx;
        sy*=maxSpeed;sy-=bd.vy;
        fx+=sx*b.sepWeight;
        fy+=sy*b.sepWeight;
      }
      if(nAli>0){
        ax/=nAli;ay/=nAli;
        var al=Math.sqrt(ax*ax+ay*ay);
        if(al>0){ax/=al;ay/=al}
        ax*=maxSpeed;ax-=bd.vx;
        ay*=maxSpeed;ay-=bd.vy;
        fx+=ax*b.aliWeight;
        fy+=ay*b.aliWeight;
      }
      if(nCoh>0){
        cx/=nCoh;cy/=nCoh;
        cx-=bd.x;cy-=bd.y;
        var cl=Math.sqrt(cx*cx+cy*cy);
        if(cl>0){cx/=cl;cy/=cl}
        cx*=maxSpeed;cx-=bd.vx;
        cy*=maxSpeed;cy-=bd.vy;
        fx+=cx*b.cohWeight;
        fy+=cy*b.cohWeight;
      }
      /* Limit force */
      var fl=Math.sqrt(fx*fx+fy*fy);
      if(fl>maxForce){fx=fx/fl*maxForce;fy=fy/fl*maxForce}
      /* Update */
      bd.vx+=fx*dt*60;
      bd.vy+=fy*dt*60;
      var v=Math.sqrt(bd.vx*bd.vx+bd.vy*bd.vy);
      if(v>maxSpeed){bd.vx=bd.vx/v*maxSpeed;bd.vy=bd.vy/v*maxSpeed}
      if(v<0.5){bd.vx*=1.05;bd.vy*=1.05}
      bd.x+=bd.vx*dt*60;
      bd.y+=bd.vy*dt*60;
      /* Wrap */
      if(bd.x<0)bd.x+=CANV.W;
      if(bd.x>CANV.W)bd.x-=CANV.W;
      if(bd.y<0)bd.y+=CANV.H;
      if(bd.y>CANV.H)bd.y-=CANV.H;
      /* Trail */
      bd.trail.push({x:bd.x,y:bd.y});
      if(bd.trail.length>b.trailLength)bd.trail.shift();
    });
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02010a';
    ctx.fillRect(0,0,W,H);
    var b=STATE.boids;
    /* Trails */
    if(b.trailLength>0){
      b.boids.forEach(function(bd,idx){
        if(bd.trail.length<2)return;
        var hue=(idx/b.boids.length)*360;
        for(var i=0;i<bd.trail.length-1;i++){
          var a=i/bd.trail.length;
          ctx.strokeStyle='hsla('+hue+',80%,60%,'+(a*0.4)+')';
          ctx.lineWidth=1.2;
          ctx.beginPath();
          ctx.moveTo(bd.trail[i].x,bd.trail[i].y);
          ctx.lineTo(bd.trail[i+1].x,bd.trail[i+1].y);
          ctx.stroke();
        }
      });
    }
    /* Boids as triangles */
    b.boids.forEach(function(bd,idx){
      var ang=Math.atan2(bd.vy,bd.vx);
      var sz=5;
      var hue=(idx/b.boids.length)*360;
      ctx.fillStyle='hsl('+hue+',85%,60%)';
      ctx.beginPath();
      ctx.moveTo(bd.x+Math.cos(ang)*sz*2,bd.y+Math.sin(ang)*sz*2);
      ctx.lineTo(bd.x+Math.cos(ang+2.4)*sz,bd.y+Math.sin(ang+2.4)*sz);
      ctx.lineTo(bd.x+Math.cos(ang-2.4)*sz,bd.y+Math.sin(ang-2.4)*sz);
      ctx.closePath();
      ctx.fill();
      /* Neighbor visualization */
      if(b.showNeighbors&&b.boids.indexOf(bd)===0){
        ctx.strokeStyle='rgba(64,224,255,.3)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.arc(bd.x,bd.y,b.perception,0,Math.PI*2);
        ctx.stroke();
        ctx.strokeStyle='rgba(255,96,160,.4)';
        ctx.beginPath();
        ctx.arc(bd.x,bd.y,b.separation,0,Math.PI*2);
        ctx.stroke();
      }
    });
    /* Info panel */
    ctx.fillStyle='rgba(10,8,24,.9)';
    ctx.strokeStyle='rgba(128,255,64,.4)';
    ctx.beginPath();ctx.roundRect(20,20,240,120,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#80ff40';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('BOIDS FLOCKING',32,42);
    ctx.fillStyle='#e8e0ff';
    ctx.font='10px monospace';
    ctx.fillText('Boids: '+b.boids.length,32,62);
    ctx.fillText('Perception: '+b.perception+' px',32,78);
    ctx.fillText('Separation: '+b.separation+' px',32,94);
    ctx.fillText('Max speed: '+fmt(b.maxSpeed,1)+' px/f',32,110);
    ctx.fillText('Trail length: '+b.trailLength,32,126);
    setStatsHTML(
      '<div>Boids: '+b.boids.length+'</div>'+
      '<div>Perception: '+b.perception+'</div>'+
      '<div>Separation: '+b.separation+'</div>'+
      '<div>Hash cells: '+(b.hashCols*b.hashRows)+'</div>'
    );
    updateBadge('🦅 Boids · '+b.boids.length+' agents · '+b.hashCols+'×'+b.hashRows+' hash');
    $('sbMode').textContent='Boids';
    $('sbCells').textContent=b.boids.length;
  },
  onDown:function(p){
    var b=STATE.boids;
    /* Spawn a few boids at click point */
    for(var i=0;i<5;i++){
      b.boids.push({
        x:p.x+rndF(-10,10),
        y:p.y+rndF(-10,10),
        vx:rndF(-1,1)*b.maxSpeed,
        vy:rndF(-1,1)*b.maxSpeed,
        trail:[]
      });
    }
    b.count=b.boids.length;
  },
  onMove:function(p){},
  controls:function(){
    var b=STATE.boids;
    var html='';
    html+='<div class="sec"><h4>Population</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Number of boids</span><span>'+b.boids.length+'</span></div>';
    html+='<input type="range" min="10" max="400" step="5" value="'+b.boids.length+'" oninput="rebuildBoids(parseInt(this.value));renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Behavior weights</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Separation</span><span>'+fmt(b.sepWeight,2)+'</span></div>';
    html+='<input type="range" min="0" max="3" step="0.05" value="'+b.sepWeight+'" oninput="STATE.boids.sepWeight=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Alignment</span><span>'+fmt(b.aliWeight,2)+'</span></div>';
    html+='<input type="range" min="0" max="3" step="0.05" value="'+b.aliWeight+'" oninput="STATE.boids.aliWeight=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Cohesion</span><span>'+fmt(b.cohWeight,2)+'</span></div>';
    html+='<input type="range" min="0" max="3" step="0.05" value="'+b.cohWeight+'" oninput="STATE.boids.cohWeight=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Radii</h4>';

    html+='<input type="range" min="20" max="150" step="5" value="'+b.perception+'" oninput="STATE.boids.perception=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Separation radius</span><span>'+b.separation+'</span></div>';
    html+='<input type="range" min="10" max="80" step="2" value="'+b.separation+'" oninput="STATE.boids.separation=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Physics</h4>';

    html+='<input type="range" min="1" max="8" step="0.1" value="'+b.maxSpeed+'" oninput="STATE.boids.maxSpeed=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Trail length</span><span>'+b.trailLength+'</span></div>';
    html+='<input type="range" min="0" max="40" step="1" value="'+b.trailLength+'" oninput="STATE.boids.trailLength=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Options</h4><div class="chip-row">';
    html+='<div class="chip '+(b.showNeighbors?'active':'')+'" onclick="STATE.boids.showNeighbors=!STATE.boids.showNeighbors;renderLeftPanel()">Show radii (boid #1)</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.boids.init()">↺ Reset flock</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Boids rules</h4>';
    html+='<div style="font-family:var(--mono);font-size:.56rem;line-height:1.65;color:var(--tx2)">'+
      '<b style="color:var(--c3)">Separation</b> — avoid crowding neighbors<br>'+
      '<b style="color:var(--c2)">Alignment</b> — steer toward average heading<br>'+
      '<b style="color:var(--c4)">Cohesion</b> — steer toward average position'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.boids;
    return '<div class="sec"><h4>Boids rules</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'For each boid, find neighbors within perception radius:<br><br>'+
      '<b style="color:var(--c3)">1. Separation:</b> steer away from very close neighbors<br>'+
      'F_sep = Σ (p_self − p_neighbor) / |p_self − p_neighbor|<br><br>'+
      '<b style="color:var(--c2)">2. Alignment:</b> steer toward average velocity<br>'+
      'F_ali = avg(v_neighbor) − v_self<br><br>'+
      '<b style="color:var(--c4)">3. Cohesion:</b> steer toward average position<br>'+
      'F_coh = avg(p_neighbor) − p_self'+
      '</div></div>'+
      '<div class="sec"><h4>Force combination</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'F_total = w_sep·F_sep + w_ali·F_ali + w_coh·F_coh<br><br>'+
      'Then: a = F_total, v ← v + a·dt, then clip |v| ≤ v_max.<br>'+
      'p ← p + v·dt'+
      '</div></div>'+
      '<div class="sec"><h4>Spatial hashing</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Naive neighbor search: O(n²)<br>'+
      'Grid hash + 3×3 cell lookup: O(n·k) where k = avg neighbors per cell<br><br>'+
      'Current: n='+b.boids.length+', grid='+b.hashCols+'×'+b.hashRows+
      '</div></div>'+
      '<div class="sec"><h4>Emergence</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'No leader, no central control. Flocking emerges purely from local rules.<br><br>'+
      'Real flocks (starlings, fish schools) follow similar rules. Reynolds&apos; 1987 paper "Flocks, Herds, and Schools" is a classic of computer graphics.'+
      '</div></div>';
  }
});
function rebuildBoids(n){
  var b=STATE.boids;
  while(b.boids.length<n){
    b.boids.push({
      x:rndF(0,CANV.W),
      y:rndF(0,CANV.H),
      vx:rndF(-1,1)*b.maxSpeed,
      vy:rndF(-1,1)*b.maxSpeed,
      trail:[]
    });
  }
  if(b.boids.length>n)b.boids.length=n;
  b.count=b.boids.length;
}
</script>

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* Animated boot grid */
function animateBootGrid(){
  var bc=$('bootGrid');
  if(!bc)return;
  bc.width=window.innerWidth;bc.height=window.innerHeight;
  var bctx=bc.getContext('2d');
  var cellSize=24;
  var cols=Math.ceil(bc.width/cellSize);
  var rows=Math.ceil(bc.height/cellSize);
  var alive=new Uint8Array(cols*rows);
  for(var i=0;i<alive.length;i++)alive[i]=Math.random()<0.2?1:0;
  var t0=performance.now();
  var lastStep=t0;
  function frame(now){
    if(!bc.isConnected||$('boot').classList.contains('hidden'))return;
    /* Step every 200ms */
    if(now-lastStep>200){
      lastStep=now;
      var next=new Uint8Array(alive.length);
      for(var y=0;y<rows;y++){
        for(var x=0;x<cols;x++){
          var n=0;
          for(var dy=-1;dy<=1;dy++){
            for(var dx=-1;dx<=1;dx++){
              if(dx===0&&dy===0)continue;
              var nx=(x+dx+cols)%cols;
              var ny=(y+dy+rows)%rows;
              n+=alive[ny*cols+nx];
            }
          }
          var cur=alive[y*cols+x];
          if(cur)next[y*cols+x]=(n===2||n===3)?1:0;
          else next[y*cols+x]=n===3?1:0;
        }
      }
      alive=next;
    }
    bctx.fillStyle='#05040d';
    bctx.fillRect(0,0,bc.width,bc.height);
    for(var y=0;y<rows;y++){
      for(var x=0;x<cols;x++){
        if(alive[y*cols+x]){
          bctx.fillStyle='rgba(160,96,255,0.35)';
          bctx.fillRect(x*cellSize+2,y*cellSize+2,cellSize-4,cellSize-4);
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

var BOOT_STEPS=[
  'Initializing Gray-Scott reaction-diffusion PDE solver...',
  'Loading Conway Life patterns (glider, gun, pulsar)...',
  'Precomputing 256 Wolfram elementary rules...',
  'Building Lenia ring kernel (4r(1-r))^4...',
  'Setting up boid spatial hash grid...',
  'Compiling continuous growth functions...',
  'Seeding initial states...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  animateBootGrid();
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CELL ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('CELL initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='evolving';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});
