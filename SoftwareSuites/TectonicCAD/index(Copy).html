<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TECTONIC CAD | Structural Analysis</title>
<style>
:root {
  --bg: #06080a; --desktop: #0a0f18; --window-bg: rgba(15, 22, 35, 0.95);
  --border: #1f2e45; --text: #8ea4c6; --text-light: #e0e8f5;
  --accent: #00f0ff; --danger: #ff0033; --warning: #ffb800; --success: #00ff88;
  --font-mono: "Fira Code", monospace; --font-ui: system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

#desktop { width: 100%; height: 100%; position: relative; display: block; }
#canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
canvas { display: block; outline: none; touch-action: none; }

#crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); border: 1px solid rgba(0, 240, 255, 0.5); border-radius: 50%; z-index: 5; pointer-events: none; display: none; }
#crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: var(--accent); transform: translate(-50%, -50%); border-radius: 50%; }

#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }

.top-bar { display: flex; justify-content: space-between; padding: 15px; pointer-events: auto; }
.panel { background: var(--window-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; backdrop-filter: blur(10px); pointer-events: auto; width: 260px; max-width: 45vw; }
.panel h2 { font-size: 0.9rem; color: var(--accent); margin-bottom: 10px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
.mat-btn { display: flex; justify-content: space-between; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px 10px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; transition: 0.2s; width: 100%; text-align: left; }
.mat-btn:hover { border-color: var(--accent); }
.mat-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--accent); color: var(--accent); }
.mat-prop { color: #666; font-size: 0.65rem; }

.hud { display: flex; flex-direction: column; gap: 5px; font-family: var(--font-mono); font-size: 0.75rem; }
.hud-row { display: flex; justify-content: space-between; }
.hud-val { color: #fff; font-weight: bold; }
.hud-val.safe { color: var(--success); }
.hud-val.warn { color: var(--warning); }
.hud-val.fail { color: var(--danger); }

.actions { padding: 15px; display: flex; gap: 10px; pointer-events: auto; justify-content: center; flex-wrap: wrap; }
.btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: var(--font-mono); text-transform: uppercase; font-size: 0.8rem; box-shadow: 0 0 15px rgba(0,240,255,0.3); transition: 0.2s; flex: 1; min-width: 150px; }
.btn:hover { transform: scale(1.05); }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(255,0,51,0.3); }

.hint { position: absolute; bottom: 80px; width: 100%; text-align: center; font-size: 0.7rem; color: #555; pointer-events: none; }
</style>

<!-- CARREGANDO THREE.JS SEM MODULOS (FUNCIONA DIRETO DO ARQUIVO) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="desktop">
  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <div id="ui-layer">
    <div class="top-bar">
      <div class="panel">
        <h2>🛠️ Materiais</h2>
        <button class="mat-btn active" data-type="0" onclick="selectMat(0)"><span>Concreto</span><span class="mat-prop">30 MPa</span></button>
        <button class="mat-btn" data-type="1" onclick="selectMat(1)"><span>Aço</span><span class="mat-prop">250 MPa</span></button>
        <button class="mat-btn" data-type="2" onclick="selectMat(2)"><span>Madeira</span><span class="mat-prop">20 MPa</span></button>
        <button class="mat-btn" data-type="3" onclick="selectMat(3)"><span>Vidro</span><span class="mat-prop">50 MPa</span></button>
      </div>

      <div class="panel">
        <h2>📊 Telemetria</h2>
        <div class="hud">
          <div class="hud-row"><span>Blocos:</span> <span class="hud-val" id="hud-blocks">0</span></div>
          <div class="hud-row"><span>Massa:</span> <span class="hud-val" id="hud-mass">0 t</span></div>
          <div class="hud-row"><span>C. Massa:</span> <span class="hud-val" id="hud-com">0m</span></div>
          <div class="hud-row"><span>F. Segurança:</span> <span class="hud-val safe" id="hud-fos">∞</span></div>
          <div class="hud-row"><span>Carga Base:</span> <span class="hud-val" id="hud-maxload">0 kN</span></div>
        </div>
      </div>
    </div>

    <div class="hint">Toque na tela para construir // Arraste para girar // Toque longo para apagar</div>

    <div class="actions">
      <button class="btn" onclick="runFEA()">Analisar Estrutura (FEA)</button>
      <button class="btn btn-danger" onclick="clearBuild()">Demolir Tudo</button>
    </div>
  </div>
</div>

<script>
// CÓDIGO 100% GLOBAL (NÃO USA IMPORT/EXPORT)
const container = document.getElementById("canvas-container");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06080a, 0.03);
scene.background = new THREE.Color(0x06080a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(12, 15, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Na versão global, o OrbitControls fica dentro de THREE
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

const gridHelper = new THREE.GridHelper(40, 40, 0x1f2e45, 0x111a28);
scene.add(gridHelper);
const plane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0a0f18, roughness: 0.9 }));
plane.rotation.x = -Math.PI / 2;
plane.position.y = -0.01;
plane.receiveShadow = true;
scene.add(plane);

const materialsData = [
  { name: "Concreto", color: 0x888888, mass: 2400, strength: 30000 },
  { name: "Aço", color: 0x445566, mass: 7800, strength: 250000 },
  { name: "Madeira", color: 0x8b5a2b, mass: 600, strength: 20000 },
  { name: "Vidro", color: 0x00f0ff, mass: 2500, strength: 50000 }
];

const meshes = {};
materialsData.forEach((mat, i) => {
  meshes[i] = new THREE.MeshStandardMaterial({ 
    color: mat.color, roughness: i === 3 ? 0.1 : 0.8, metalness: i === 3 ? 0.5 : 0.1,
    transparent: i === 3, opacity: i === 3 ? 0.6 : 1.0
  });
});

let currentMat = 0;
let blocks = [];
const blockGeo = new THREE.BoxGeometry(1, 1, 1);

function selectMat(type) {
  currentMat = type;
  document.querySelectorAll(".mat-btn").forEach(btn => btn.classList.remove("active"));
  document.querySelector('.mat-btn[data-type="' + type + '"]').classList.add("active");
  resetColors();
}

function addBlock(x, y, z, type) {
  const mesh = new THREE.Mesh(blockGeo, meshes[type].clone());
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { type: type, mass: materialsData[type].mass, strength: materialsData[type].strength, load: 0 };
  scene.add(mesh);
  blocks.push(mesh);
  updateHUD();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let touchStartTime = 0;
let touchMoved = false;

const ghostMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.3, wireframe: true });
const ghostMesh = new THREE.Mesh(blockGeo, ghostMat);
scene.add(ghostMesh);

function updateGhostAndBuild(clientX, clientY, build) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects([plane].concat(blocks));

  if (intersects.length > 0) {
    const intersect = intersects[0];
    let pos = intersect.point.clone();
    if (intersect.face) pos.add(intersect.face.normal.multiplyScalar(0.5));
    
    pos.x = Math.round(pos.x);
    pos.y = Math.round(pos.y);
    pos.z = Math.round(pos.z);
    if (pos.y < 0) pos.y = 0;

    ghostMesh.position.copy(pos);
    ghostMesh.visible = true;

    if (build) {
      addBlock(pos.x, pos.y, pos.z, currentMat);
      resetColors();
      ghostMesh.visible = false;
    }
  } else {
    ghostMesh.visible = false;
  }
}

renderer.domElement.addEventListener("touchstart", function(e) {
  touchStartTime = Date.now();
  touchMoved = false;
  document.getElementById("crosshair").style.display = "block";
  if (e.touches.length > 0) updateGhostAndBuild(e.touches[0].clientX, e.touches[0].clientY, false);
}, { passive: false });

renderer.domElement.addEventListener("touchmove", function(e) {
  touchMoved = true;
  if (e.touches.length > 0) updateGhostAndBuild(e.touches[0].clientX, e.touches[0].clientY, false);
}, { passive: false });

renderer.domElement.addEventListener("touchend", function(e) {
  document.getElementById("crosshair").style.display = "none";
  const duration = Date.now() - touchStartTime;
  
  if (!touchMoved && duration < 250) {
    const touch = e.changedTouches[0];
    updateGhostAndBuild(touch.clientX, touch.clientY, true);
  }
});

renderer.domElement.addEventListener("mousemove", function(e) { updateGhostAndBuild(e.clientX, e.clientY, false); });
renderer.domElement.addEventListener("mousedown", function(e) {
  if (e.button === 0) updateGhostAndBuild(e.clientX, e.clientY, true);
  else if (e.button === 2) {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const intersects = raycaster.intersectObjects(blocks);
    if (intersects.length > 0) {
      const block = intersects[0].object;
      scene.remove(block);
      blocks = blocks.filter(function(b) { return b !== block; });
      resetColors();
    }
  }
});
window.addEventListener("contextmenu", function(e) { e.preventDefault(); });

function resetColors() {
  blocks.forEach(function(b) {
    b.material.color.setHex(materialsData[b.userData.type].color);
    b.material.emissive.setHex(0x000000);
    b.userData.load = 0;
  });
  updateHUD();
}

function runFEA() {
  if (blocks.length === 0) return;
  resetColors();
  // Ordena de cima para baixo
  const sortedBlocks = [].concat(blocks).sort(function(a, b) { return b.position.y - a.position.y; });
  
  let totalMass = 0, comX = 0, comY = 0, maxBaseLoad = 0;

  blocks.forEach(function(b) {
    totalMass += b.userData.mass;
    comX += b.position.x * b.userData.mass;
    comY += b.position.y * b.userData.mass;
  });
  comX /= totalMass; comY /= totalMass;

  sortedBlocks.forEach(function(block) {
    block.userData.load = (block.userData.mass * 9.81) / 1000; 
    const below = sortedBlocks.find(function(b) { 
        return Math.abs(b.position.x - block.position.x) < 0.1 && 
               Math.abs(b.position.z - block.position.z) < 0.1 && 
               Math.abs(b.position.y - (block.position.y - 1)) < 0.1; 
    });
    if (below) {
      below.userData.load += block.userData.load;
    } else {
      if (block.userData.load > maxBaseLoad) maxBaseLoad = block.userData.load;
    }
  });

  // Carga de vento
  sortedBlocks.forEach(function(block) { block.userData.load += (block.position.y * 15); });

  let minFoS = Infinity, failed = false;
  blocks.forEach(function(block) {
    const stressRatio = block.userData.load / (block.userData.strength / 1000);
    const fos = 1 / stressRatio;
    if (fos < minFoS) minFoS = fos;

    if (stressRatio > 1.0) { 
      block.material.color.setHex(0xff0033); block.material.emissive.setHex(0xff0033); block.material.emissiveIntensity = 0.5; failed = true; 
    } else if (stressRatio > 0.7) { 
      block.material.color.setHex(0xffb800); block.material.emissive.setHex(0xffb800); block.material.emissiveIntensity = 0.3; 
    } else { 
      block.material.color.setHex(0x00ff88); block.material.emissive.setHex(0x00ff88); block.material.emissiveIntensity = 0.1; 
    }
  });

  document.getElementById("hud-blocks").innerText = blocks.length;
  document.getElementById("hud-mass").innerText = (totalMass / 1000).toFixed(1) + " t";
  document.getElementById("hud-com").innerText = comX.toFixed(1) + "m, " + comY.toFixed(1) + "m";
  document.getElementById("hud-maxload").innerText = maxBaseLoad.toFixed(1) + " kN";
  
  const fosEl = document.getElementById("hud-fos");
  if (failed) { fosEl.innerText = "COLAPSO"; fosEl.className = "hud-val fail"; }
  else { fosEl.innerText = minFoS > 100 ? "∞" : minFoS.toFixed(2); fosEl.className = minFoS < 1.5 ? "hud-val warn" : "hud-val safe"; }
}

function clearBuild() {
  blocks.forEach(function(b) { scene.remove(b); });
  blocks = [];
  updateHUD();
  resetColors();
}

function updateHUD() {
  document.getElementById("hud-blocks").innerText = blocks.length;
  if (blocks.length === 0) resetColors();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
