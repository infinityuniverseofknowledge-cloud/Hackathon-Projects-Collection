<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusAI Search — Pesquisa com Aprendizado</title>
<style>
:root{--bg:#0a0e1a;--c:#6366f1;--card:#111827;--bd:#1f2937;--txt:#e5e7eb;--mut:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;max-width:820px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:var(--c);flex:1}
.logo .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:grid;place-items:center;font-size:20px}
.badge{background:rgba(99,102,241,.2);color:var(--c);padding:5px 12px;border-radius:10px;font-size:11px;font-weight:800;font-family:ui-monospace,monospace}
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar input{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;color:var(--txt);font-size:15px;font-family:inherit;outline:0;transition:.15s}
.search-bar input:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.search-bar button{background:var(--c);color:#fff;border:0;padding:0 24px;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px;font-family:inherit;transition:.15s}
.search-bar button:hover{filter:brightness(1.15)}
.search-bar button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button{background:var(--card);border:1px solid var(--bd);color:var(--mut);padding:7px 14px;border-radius:18px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:.15s}
.chips button:hover{color:var(--c);border-color:var(--c)}
.result{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.result h2{font-size:1.3rem;margin-bottom:8px;color:var(--c)}
.result .meta{font-size:11px;color:var(--mut);margin-bottom:14px;font-family:ui-monospace,monospace}
.result .extract{font-size:14px;line-height:1.7;color:#c9d1d9;margin-bottom:14px;white-space:pre-wrap}
.result .extract a{color:var(--c)}
.result .foot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:12px;margin-top:12px;font-size:11px}
.result .foot .stat{background:rgba(99,102,241,.15);color:var(--c);padding:5px 10px;border-radius:8px;font-family:ui-monospace,monospace;font-weight:700}
.result .actions{display:flex;gap:6px;margin-top:12px}
.result .actions button,.result .actions a{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);color:var(--c);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;text-decoration:none;transition:.15s}
.result .actions button:hover,.result .actions a:hover{background:var(--c);color:#fff}
.learned{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.15));border:1px solid rgba(99,102,241,.4);border-radius:12px;padding:14px;margin-bottom:14px;font-size:12px;color:#c7d2fe}
.learned b{color:var(--c)}
.learned .list{margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;color:var(--mut)}
.msg{text-align:center;color:var(--mut);padding:40px 20px;font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<header><div class="logo"><div class="ic">🔍</div>NexusAI Search</div><span class="badge" id="mem">0 memórias</span></header>
<div class="search-bar"><input id="q" placeholder="Pesquise na Wikipedia — cada busca é salva na memória da IA"><button id="go">🔍</button></div>
<div class="chips"><button data-q="Inteligência artificial">IA</button><button data-q="Brasil">Brasil</button><button data-q="Física quântica">Quântica</button><button data-q="Machine learning">ML</button><button data-q="Revolução Francesa">Revolução</button></div>
<div id="out"></div>
<script>

class Mem {
  constructor(d=64){this.d=d;this.m=[];this.load()}
  tok(t){return t.toLowerCase().replace(/[^\wáàâãéêíóôõúçñ\s]/g,"").split(/\s+/).filter(w=>w.length>2)}
  emb(t){
    const v=new Float32Array(this.d);
    const ts=this.tok(t);
    if(!ts.length)return v;
    ts.forEach(w=>{
      let h=0;
      for(let i=0;i<w.length;i++)h=(h*31+w.charCodeAt(i))>>>0;
      v[h%this.d]+=1;
      v[(h*7+13)%this.d]+=0.5;
    });
    let n=0;for(let i=0;i<this.d;i++)n+=v[i]*v[i];
    n=Math.sqrt(n)||1;
    for(let i=0;i<this.d;i++)v[i]/=n;
    return v;
  }
  cos(a,b){let s=0;for(let i=0;i<this.d;i++)s+=a[i]*b[i];return s}
  add(text,meta={}){
    const v=this.emb(text);
    this.m.push({id:Date.now()+Math.random(),t:text,v,meta,ts:Date.now()});
    if(this.m.length>500)this.m.shift();
    this.save();
    return this.m[this.m.length-1];
  }
  find(q,k=5){
    if(!this.m.length)return [];
    const qv=this.emb(q);
    return this.m.map(m=>({...m,score:this.cos(qv,m.v)}))
      .sort((a,b)=>b.score-a.score).slice(0,k);
  }
  save(){try{localStorage.setItem("nexus.mem",JSON.stringify(this.m.map(m=>({id:m.id,t:m.t,meta:m.meta,ts:m.ts,v:Array.from(m.v)}))))}catch(e){}}
  load(){try{const d=JSON.parse(localStorage.getItem("nexus.mem")||"[]");this.m=d.map(x=>({...x,v:Float32Array.from(x.v||[])}))}catch(e){this.m=[]}}
  clear(){this.m=[];localStorage.removeItem("nexus.mem")}
}
const engine=new Mem();
function respond(query){
  const found=engine.find(query,3).filter(x=>x.score>0.15);
  if(found.length){
    const best=found[0];
    return {answer:`Com base no que aprendi (score ${(best.score*100).toFixed(0)}%): "${best.t.slice(0,200)}"${found[1]?` E também: "${found[1].t.slice(0,120)}"`:""}`,memories:found};
  }
  return {answer:null,memories:[]};
}

const $=s=>document.querySelector(s);
function paint(){ $('#mem').textContent=engine.m.length+' memórias' }
async function search(q){
  const out=$('#out');
  out.innerHTML='<div class="msg"><span class="spin"></span>Pesquisando...</div>';
  try{
    const r=await fetch('https://pt.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q));
    if(!r.ok)throw new Error('Não encontrado');
    const d=await r.json();
    const extract=(d.extract||'').slice(0,800);
    const mem=engine.add(d.title+': '+extract,{source:'wikipedia',title:d.title});
    const rel=engine.find(d.title,3).filter(x=>x.id!==mem.id&&x.score>0.2);
    out.innerHTML='<div class="learned">✅ <b>Aprendi!</b> Salvo em memória matricial ('+engine.m.length+' memórias totais).'+(rel.length?' Relacionado: '+rel.map(x=>x.t.slice(0,40)).join(' · '):'')+'</div>'+
      '<div class="result"><h2>'+d.title+'</h2><div class="meta">'+d.description+' · '+(d.content_urls?.desktop?.page||'')+'</div><div class="extract">'+(extract||'Sem resumo disponível').replace(/</g,'&lt;')+'</div>'+
      '<div class="foot"><span class="stat">📚 Wikipedia PT</span><span class="stat">🧠 '+(1+rel.length)+' memórias relacionadas</span></div>'+
      '<div class="actions"><a href="https://pt.wikipedia.org/wiki/'+encodeURIComponent(d.title)+'" target="_blank">Ver completo →</a><button onclick="window.location.href=\'nexus-memory.html\'">Ver na memória</button></div></div>';
    paint();
  }catch(e){
    out.innerHTML='<div class="msg" style="color:#ef4444">Erro: '+e.message+'<br><br>Tente outro termo.</div>';
  }
}
$('#go').onclick=()=>{const q=$('#q').value.trim();if(q)search(q)};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)search(q)}});
document.querySelectorAll('.chips button').forEach(b=>{
  b.onclick=()=>{$('#q').value=b.dataset.q;search(b.dataset.q)};
});
paint();
</script></body></html>
