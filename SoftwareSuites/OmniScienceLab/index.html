<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OMNI-SCIENCE LAB | Advanced Simulation Engine</title>
<style>
:root {
  --bg: #05080f; --panel: rgba(10, 18, 30, 0.85); --border: #1a3a5a;
  --text: #8ab4d5; --text-light: #e0f0ff; --accent: #00f0ff; 
  --quantum: #ff00ff; --bio: #00ff88; --astro: #ffb800; --chem: #ff0033;
  --font-mono: "Fira Code", monospace; --font-ui: system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

/* MAIN LAYOUT */
#app { display: flex; height: 100vh; flex-direction: column; }
#viewport { flex: 1; position: relative; overflow: hidden; background: radial-gradient(circle at center, #0a1525 0%, #000000 100%); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

/* TOP HUD */
#top-hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
.hud-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 15px; backdrop-filter: blur(10px); pointer-events: auto; font-family: var(--font-mono); font-size: 0.75rem; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
.hud-title { color: var(--accent); font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
.hud-row { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 3px; }
.hud-val { color: #fff; }

/* BOTTOM DOCK (MODULE SELECTOR) */
#dock { height: 80px; background: rgba(5, 8, 15, 0.95); border-top: 1px solid var(--border); display: flex; justify-content: center; align-items: center; gap: 15px; padding: 0 15px; z-index: 100; overflow-x: auto; }
.module-btn { background: #000; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; white-space: nowrap; }
.module-btn .icon { font-size: 1.5rem; }
.module-btn:hover { border-color: var(--accent); }
.module-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px rgba(0,240,255,0.2); }

/* CONTROL PANELS (FLOAT) */
.control-panel { position: absolute; bottom: 100px; right: 15px; width: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; backdrop-filter: blur(15px); z-index: 20; display: none; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: 0.3s; }
.control-panel.active { display: flex; }
.control-panel h3 { font-family: var(--font-mono); font-size: 0.9rem; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 5px; }
.input-group { display: flex; flex-direction: column; gap: 5px; font-family: var(--font-mono); font-size: 0.75rem; }
.input-group label { display: flex; justify-content: space-between; color: var(--text-light); }
input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #111; border-radius: 3px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
.btn { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.75rem; cursor: pointer; text-align: center; transition: 0.2s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { border-color: var(--chem); color: var(--chem); }

/* TERMINAL LOG */
#log { position: absolute; bottom: 100px; left: 15px; width: 250px; height: 150px; background: rgba(0,0,0,0.8); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: 0.65rem; color: var(--bio); overflow-y: auto; z-index: 10; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
.log-line { opacity: 0; animation: fadeIn 0.3s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="app">
  <div id="viewport">
    <canvas id="science-canvas"></canvas>
    
    <!-- HUD -->
    <div id="top-hud">
      <div class="hud-panel">
        <div class="hud-title">OMNI-SCIENCE OS v4.2</div>
        <div class="hud-row"><span>MODULE:</span> <span class="hud-val" id="hud-module">QUANTUM PHYSICS</span></div>
        <div class="hud-row"><span>STATUS:</span> <span class="hud-val" id="hud-status" style="color:var(--bio)">STABLE</span></div>
      </div>
      <div class="hud-panel">
        <div class="hud-row"><span>ENTROPY:</span> <span class="hud-val" id="hud-entropy">0.00</span></div>
        <div class="hud-row"><span>ENERGY:</span> <span class="hud-val" id="hud-energy">100%</span></div>
      </div>
    </div>

    <!-- LOG -->
    <div id="log"></div>

    <!-- CONTROL PANELS -->
    <div id="panel-quantum" class="control-panel active">
      <h3>⚛️ Quantum Entanglement</h3>
      <div class="input-group">
        <label>Decoherence Rate <span id="val-decoherence">0.5</span></label>
        <input type="range" id="sl-decoherence" min="0" max="100" value="50">
      </div>
      <button class="btn" onclick="quantumEntangle()">Initiate Entanglement</button>
      <button class="btn btn-danger" onclick="quantumCollapse()">Measure State (Collapse)</button>
    </div>

    <div id="panel-bio" class="control-panel">
      <h3>🧬 CRISPR Gene Editor</h3>
      <div class="input-group">
        <label>Mutation Rate <span id="val-mutation">1%</span></label>
        <input type="range" id="sl-mutation" min="0" max="100" value="1">
      </div>
      <button class="btn" onclick="dnaMutate()">Splice Sequence (Mutate)</button>
      <button class="btn" onclick="dnaRepair()">Repair DNA</button>
    </div>

    <div id="panel-astro" class="control-panel">
      <h3>🪐 Exoplanet Spectrometry</h3>
      <div class="input-group">
        <label>O2 (Oxygen) <span id="val-o2">10%</span></label>
        <input type="range" id="sl-o2" min="0" max="100" value="10">
      </div>
      <div class="input-group">
        <label>CH4 (Methane) <span id="val-ch4">5%</span></label>
        <input type="range" id="sl-ch4" min="0" max="100" value="5">
      </div>
      <button class="btn" onclick="astroAnalyze()">Analyze Biosignatures</button>
    </div>

    <div id="panel-chem" class="control-panel">
      <h3>💎 Crystal Lattice</h3>
      <div class="input-group">
        <label>Atomic Radius <span id="val-radius">1.0</span></label>
        <input type="range" id="sl-radius" min="10" max="200" value="100">
      </div>
      <button class="btn" onclick="crystalGenerate('fcc')">FCC (Face-Centered)</button>
      <button class="btn" onclick="crystalGenerate('bcc')">BCC (Body-Centered)</button>
      <button class="btn" onclick="crystalGenerate('diamond')">Diamond Cubic</button>
    </div>

  </div>

  <!-- DOCK -->
  <div id="dock">
    <div class="module-btn active" onclick="switchModule('quantum', event)">
      <span class="icon">⚛️</span> Quantum
    </div>
    <div class="module-btn" onclick="switchModule('bio', event)">
      <span class="icon">🧬</span> Biology
    </div>
    <div class="module-btn" onclick="switchModule('astro', event)">
      <span class="icon">🪐</span> Astronomy
    </div>
    <div class="module-btn" onclick="switchModule('chem', event)">
      <span class="icon">💎</span> Chemistry
    </div>
  </div>
</div>

<script>
// ==========================================
// CORE SETUP & UI
// ==========================================
const canvas = document.getElementById('science-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
camera.position.set(0, 5, 15);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x00f0ff, 2, 30);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);

// Logging
const logEl = document.getElementById('log');
function logMsg(msg) {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerText = '> ' + msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
}

// Module Switching
let currentModule = 'quantum';
const panels = { quantum: document.getElementById('panel-quantum'), bio: document.getElementById('panel-bio'), astro: document.getElementById('panel-astro'), chem: document.getElementById('panel-chem') };
const groups = { quantum: new THREE.Group(), bio: new THREE.Group(), astro: new THREE.Group(), chem: new THREE.Group() };

Object.values(groups).forEach(g => scene.add(g));

function switchModule(mod, e) {
    document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
    if(e) e.currentTarget.classList.add('active');
    
    Object.values(panels).forEach(p => p.classList.remove('active'));
    panels[mod].classList.add('active');
    
    Object.values(groups).forEach(g => g.visible = false);
    groups[mod].visible = true;
    currentModule = mod;
    
    document.getElementById('hud-module').innerText = mod.toUpperCase();
    
    // Camera reset depending on module
    if (mod === 'quantum') { camera.position.set(0, 0, 15); }
    else if (mod === 'bio') { camera.position.set(0, 0, 12); }
    else if (mod === 'astro') { camera.position.set(0, 0, 20); }
    else if (mod === 'chem') { camera.position.set(5, 10, 15); }
    
    logMsg("System switched to " + mod.toUpperCase() + " module.");
}

// Global Animation Variables
let time = 0;
let animationFuncs = [];

// ==========================================
// MODULE 1: QUANTUM ENTANGLEMENT
// ==========================================
let q1, q2, qLine;
let isEntangled = false;

function initQuantum() {
    const g = groups.quantum;
    
    const geo = new THREE.SphereGeometry(2, 32, 32);
    const mat1 = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.5, wireframe: true });
    const mat2 = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.5, wireframe: true });
    
    q1 = new THREE.Mesh(geo, mat1); q1.position.set(-5, 0, 0);
    q2 = new THREE.Mesh(geo, mat2); q2.position.set(5, 0, 0);
    g.add(q1); g.add(q2);
    
    // Wave function rings
    const ringGeo = new THREE.TorusGeometry(2.5, 0.05, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat); q1.add(ring1);
    const ring2 = new THREE.Mesh(ringGeo, ringMat); q2.add(ring2);
    
    // Entanglement line
    const points = [new THREE.Vector3(-5, 0, 0), new THREE.Vector3(5, 0, 0)];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const lineMat = new THREE.LineDashedMaterial({ color: 0xff00ff, dashSize: 0.5, gapSize: 0.2 });
    qLine = new THREE.Line(lineGeo, lineMat);
    qLine.computeLineDistances();
    qLine.visible = false;
    g.add(qLine);
    
    animationFuncs.push(() => {
        if (currentModule !== 'quantum') return;
        q1.rotation.x += 0.01; q1.rotation.y += 0.02;
        q2.rotation.x -= 0.01; q2.rotation.y -= 0.02;
        
        if (isEntangled) {
            qLine.material.color.setHSL(Math.sin(time)*0.5+0.5, 1, 0.5);
            qLine.material.needsUpdate = true;
        }
    });
}

window.quantumEntangle = () => {
    isEntangled = true;
    qLine.visible = true;
    q1.material.emissiveIntensity = 2;
    q2.material.emissiveIntensity = 2;
    logMsg("Qubits entangled. Non-local correlation established.");
};

window.quantumCollapse = () => {
    isEntangled = false;
    qLine.visible = false;
    q1.material.emissiveIntensity = 0.1;
    q2.material.emissiveIntensity = 0.1;
    
    // Random spin direction (collapse)
    const spin = Math.random() > 0.5 ? 1 : -1;
    q1.scale.set(1, spin, 1);
    q2.scale.set(1, -spin, 1); // Opposite spin due to entanglement
    
    logMsg("Wave function collapsed. Spin states determined: " + (spin>0?"UP":"DOWN") + " / " + (spin>0?"DOWN":"UP"));
};

// ==========================================
// MODULE 2: CRISPR DNA (BIOLOGY)
// ==========================================
let dnaStrand, nucleotides = [];
const baseColors = { A: 0x00ff88, T: 0xff0033, C: 0x00f0ff, G: 0xffb800 };

function initBio() {
    const g = groups.bio;
    const numPairs = 20;
    const radius = 3;
    const heightStep = 0.8;
    
    const baseMats = {
        A: new THREE.MeshStandardMaterial({ color: baseColors.A, emissive: baseColors.A, emissiveIntensity: 0.5 }),
        T: new THREE.MeshStandardMaterial({ color: baseColors.T, emissive: baseColors.T, emissiveIntensity: 0.5 }),
        C: new THREE.MeshStandardMaterial({ color: baseColors.C, emissive: baseColors.C, emissiveIntensity: 0.5 }),
        G: new THREE.MeshStandardMaterial({ color: baseColors.G, emissive: baseColors.G, emissiveIntensity: 0.5 })
    };

    const bases = ['A', 'T', 'C', 'G'];
    
    for (let i = 0; i < numPairs; i++) {
        const y = (i - numPairs/2) * heightStep;
        const angle = i * 0.5;
        
        const base1 = bases[Math.floor(Math.random() * 4)];
        let base2 = base1 === 'A' ? 'T' : base1 === 'T' ? 'A' : base1 === 'C' ? 'G' : 'C'; // Complement
        
        const x1 = Math.cos(angle) * radius;
        const z1 = Math.sin(angle) * radius;
        const x2 = Math.cos(angle + Math.PI) * radius;
        const z2 = Math.sin(angle + Math.PI) * radius;
        
        const sphereGeo = new THREE.SphereGeometry(0.4, 16, 16);
        
        const s1 = new THREE.Mesh(sphereGeo, baseMats[base1]);
        s1.position.set(x1, y, z1);
        s1.userData = { base: base1, originalBase: base1, pairIndex: i };
        
        const s2 = new THREE.Mesh(sphereGeo, baseMats[base2]);
        s2.position.set(x2, y, z2);
        s2.userData = { base: base2, originalBase: base2, pairIndex: i };
        
        g.add(s1); g.add(s2);
        nucleotides.push(s1, s2);
        
        // Hydrogen bonds (line between pairs)
        const points = [new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2)];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 }));
        g.add(line);
    }
    
    animationFuncs.push(() => {
        if (currentModule !== 'bio') return;
        g.rotation.y += 0.005;
        
        // Pulsing effect
        nucleotides.forEach(n => {
            const scale = 1 + Math.sin(time * 5 + n.userData.pairIndex) * 0.1;
            n.scale.set(scale, scale, scale);
        });
    });
}

window.dnaMutate = () => {
    const mutationRate = parseInt(document.getElementById('sl-mutation').value) / 100;
    let mutations = 0;
    const bases = ['A', 'T', 'C', 'G'];
    
    nucleotides.forEach(n => {
        if (Math.random() < mutationRate) {
            let newBase = bases[Math.floor(Math.random() * 4)];
            n.material = new THREE.MeshStandardMaterial({ color: baseColors[newBase], emissive: baseColors[newBase], emissiveIntensity: 0.5 });
            n.userData.base = newBase;
            mutations++;
        }
    });
    
    logMsg(`CRISPR Splice complete. ${mutations} point mutations introduced.`);
    if (mutations > 5) logMsg("WARNING: High mutation rate detected. Possible oncogenesis.");
};

window.dnaRepair = () => {
    nucleotides.forEach(n => {
        n.material = new THREE.MeshStandardMaterial({ color: baseColors[n.userData.originalBase], emissive: baseColors[n.userData.originalBase], emissiveIntensity: 0.5 });
        n.userData.base = n.userData.originalBase;
    });
    logMsg("DNA sequence repaired to original state.");
};

// ==========================================
// MODULE 3: EXOPLANET SPECTROMETRY (ASTRONOMY)
// ==========================================
function initAstro() {
    const g = groups.astro;
    
    // Create a star and a planet
    const starGeo = new THREE.SphereGeometry(5, 32, 32);
    const starMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.3 });
    const star = new THREE.Mesh(starGeo, starMat);
    star.position.set(-8, 0, -5);
    g.add(star);
    
    const planetGeo = new THREE.SphereGeometry(1.5, 32, 32);
    const planetMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.8 });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    planet.position.set(2, 0, 0);
    g.add(planet);
    
    // Light rays (photons)
    const photonGeo = new THREE.BufferGeometry();
    const photonPos = [];
    for(let i=0; i<30; i++) {
        photonPos.push(-8 + Math.random()*2, Math.random()*4-2, -5 + Math.random()*2); // Start at star
    }
    photonGeo.setAttribute('position', new THREE.Float32BufferAttribute(photonPos, 3));
    const photonMat = new THREE.PointsMaterial({ color: 0xffff00, size: 0.2 });
    const photons = new THREE.Points(photonGeo, photonMat);
    g.add(photons);
    
    // Spectrometry Graph Overlay
    const canvas2D = document.createElement('canvas');
    canvas2D.width = 400; canvas2D.height = 150;
    canvas2D.style.position = 'absolute';
    canvas2D.style.bottom = '120px';
    canvas2D.style.left = '50%';
    canvas2D.style.transform = 'translateX(-50%)';
    canvas2D.style.background = 'rgba(0,0,0,0.8)';
    canvas2D.style.border = '1px solid #1a3a5a';
    canvas2D.style.borderRadius = '8px';
    canvas2D.id = 'spectro-graph';
    document.getElementById('viewport').appendChild(canvas2D);
    const ctx2D = canvas2D.getContext('2d');
    
    animationFuncs.push(() => {
        if (currentModule !== 'astro') return;
        g.rotation.y += 0.002;
        
        // Move photons towards planet (simplistic)
        const pos = photons.geometry.attributes.position.array;
        for(let i=0; i<30; i++) {
            pos[i*3] += 0.1; // move right
            if (pos[i*3] > 2) { // Hit planet
                pos[i*3] = -8; // Reset to star
                pos[i*3+1] = Math.random()*4-2;
                pos[i*3+2] = -5 + Math.random()*2;
            }
        }
        photons.geometry.attributes.position.needsUpdate = true;
        
        // Draw Spectrometry Graph
        const o2 = parseInt(document.getElementById('sl-o2').value);
        const ch4 = parseInt(document.getElementById('sl-ch4').value);
        
        ctx2D.clearRect(0,0,400,150);
        
        // Spectrum background (Rainbow)
        const grad = ctx2D.createLinearGradient(0,0,400,0);
        grad.addColorStop(0, 'rgba(255,0,0,0.2)'); grad.addColorStop(0.2, 'rgba(255,165,0,0.2)');
        grad.addColorStop(0.4, 'rgba(255,255,0,0.2)'); grad.addColorStop(0.6, 'rgba(0,255,0,0.2)');
        grad.addColorStop(0.8, 'rgba(0,0,255,0.2)'); grad.addColorStop(1, 'rgba(75,0,130,0.2)');
        ctx2D.fillStyle = grad;
        ctx2D.fillRect(0,0,400,150);
        
        // Base intensity line
        ctx2D.beginPath();
        ctx2D.strokeStyle = '#fff';
        ctx2D.lineWidth = 2;
        ctx2D.moveTo(0, 100);
        ctx2D.lineTo(400, 100);
        ctx2D.stroke();
        
        // Absorption lines (Dips)
        ctx2D.lineWidth = 4;
        
        // O2 line (around 760nm -> position ~300 on graph)
        if (o2 > 0) {
            ctx2D.beginPath(); ctx2D.strokeStyle = 'rgba(0,255,255,' + (o2/100) + ')';
            ctx2D.moveTo(300, 100); ctx2D.lineTo(300, 100 + o2); ctx2D.stroke();
            ctx2D.fillStyle = 'cyan'; ctx2D.font = '10px monospace'; ctx2D.fillText('O2', 290, 140);
        }
        
        // CH4 line (around 600nm -> position ~200)
        if (ch4 > 0) {
            ctx2D.beginPath(); ctx2D.strokeStyle = 'rgba(255,0,255,' + (ch4/100) + ')';
            ctx2D.moveTo(200, 100); ctx2D.lineTo(200, 100 + ch4); ctx2D.stroke();
            ctx2D.fillStyle = 'magenta'; ctx2D.font = '10px monospace'; ctx2D.fillText('CH4', 190, 140);
        }
        
        // Axis labels
        ctx2D.fillStyle = '#888'; ctx2D.font = '10px monospace';
        ctx2D.fillText('UV', 10, 130); ctx2D.fillText('Visible', 180, 130); ctx2D.fillText('IR', 380, 130);
    });
}

window.astroAnalyze = () => {
    const o2 = parseInt(document.getElementById('sl-o2').value);
    const ch4 = parseInt(document.getElementById('sl-ch4').value);
    
    logMsg("Analyzing atmospheric transmission spectrum...");
    if (o2 > 15 && ch4 > 10) {
        logMsg("BIOSIGNATURE DETECTED! High probability of biological activity (Photosynthesis).");
        document.getElementById('hud-status').innerText = "LIFE DETECTED";
        document.getElementById('hud-status').style.color = "var(--bio)";
    } else {
        logMsg("Analyzing... No conclusive biosignatures found. Planet likely barren.");
        document.getElementById('hud-status').innerText = "BARREN";
        document.getElementById('hud-status').style.color = "var(--warning)";
    }
};

// ==========================================
// MODULE 4: CRYSTAL LATTICE (CHEMISTRY)
// ==========================================
let crystalGroup = new THREE.Group();
groups.chem.add(crystalGroup);

window.crystalGenerate = (type) => {
    // Clear previous crystal
    while(crystalGroup.children.length > 0){ 
        crystalGroup.remove(crystalGroup.children[0]); 
    }
    
    const radius = parseInt(document.getElementById('sl-radius').value) / 100;
    const atomGeo = new THREE.SphereGeometry(0.4 * radius, 16, 16);
    const atomMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.8, roughness: 0.2, emissive: 0x003366 });
    const bondMat = new THREE.LineBasicMaterial({ color: 0x888888 });
    
    const positions = [];
    
    if (type === 'fcc') {
        // Face-Centered Cubic
        const s = 2;
        positions.push([0,0,0]); // Corners (simplified)
        positions.push([s,s,0], [s,0,s], [0,s,s]); // Face centers
        positions.push([-s,-s,0], [-s,0,-s], [0,-s,-s]);
        positions.push([s,-s,0], [s,0,-s], [0,s,-s]);
        positions.push([-s,s,0], [-s,0,s], [0,-s,s]);
    } else if (type === 'bcc') {
        // Body-Centered Cubic
        const s = 2;
        positions.push([0,0,0]);
        positions.push([s,s,s], [-s,-s,-s], [s,-s,s], [-s,s,-s]);
        positions.push([s,s,-s], [-s,-s,s], [s,-s,-s], [-s,s,s]);
        positions.push([s,0,0], [-s,0,0], [0,s,0], [0,-s,0], [0,0,s], [0,0,-s]);
    } else if (type === 'diamond') {
        // Diamond Cubic (Tetrahedral)
        const s = 2;
        positions.push([0,0,0], [s,s,s]); // Basis 1
        positions.push([s,s,0], [0,0,s], [s,0,s], [0,s,0]); // Basis 2
        // Expand lattice
        for(let x=-1; x<=1; x+=2) {
            for(let y=-1; y<=1; y+=2) {
                for(let z=-1; z<=1; z+=2) {
                    positions.push([x*s, y*s, z*s]);
                }
            }
        }
    }
    
    // Create Atoms
    const atoms = [];
    positions.forEach(p => {
        const atom = new THREE.Mesh(atomGeo, atomMat);
        atom.position.set(p[0], p[1], p[2]);
        crystalGroup.add(atom);
        atoms.push(p);
    });
    
    // Create Bonds (connect atoms that are close)
    for(let i=0; i<atoms.length; i++) {
        for(let j=i+1; j<atoms.length; j++) {
            const dx = atoms[i][0] - atoms[j][0];
            const dy = atoms[i][1] - atoms[j][1];
            const dz = atoms[i][2] - atoms[j][2];
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            
            // If distance is close to lattice constant, draw bond
            if (dist > 1.5 && dist < 2.8) {
                const points = [
                    new THREE.Vector3(atoms[i][0], atoms[i][1], atoms[i][2]),
                    new THREE.Vector3(atoms[j][0], atoms[j][1], atoms[j][2])
                ];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, bondMat);
                crystalGroup.add(line);
            }
        }
    }
    
    logMsg(`Generated ${type.toUpperCase()} crystal lattice. Atoms: ${positions.length}.`);
    
    // Center and rotate
    crystalGroup.rotation.set(0,0,0);
};

// Add animation for crystal
animationFuncs.push(() => {
    if (currentModule !== 'chem') return;
    crystalGroup.rotation.y += 0.01;
    crystalGroup.rotation.x += 0.005;
});

// ==========================================
// MAIN LOOP & INIT
// ==========================================
function animate() {
    requestAnimationFrame(animate);
    time += 0.05;
    controls.update();
    
    // Run active module animations
    animationFuncs.forEach(fn => fn());
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
});

// Initialization
initQuantum();
initBio();
initAstro();
crystalGenerate('fcc'); // Default crystal
switchModule('quantum'); // Default module
animate();

logMsg("OMNI-SCIENCE OS booted successfully.");
logMsg("Quantum Engine initialized.");
</script>
