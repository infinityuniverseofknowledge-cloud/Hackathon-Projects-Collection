<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AURA-WALLS | Premium Digital Decor</title>
<style>
:root {
  --bg: #030305; --panel: rgba(10, 12, 18, 0.85);
  --border: rgba(255, 255, 255, 0.08); --text: #a0a5b5;
  --text-light: #ffffff; --accent: #00f0ff; --accent-gold: #ffcc00;
  --font-ui: system-ui, sans-serif; --font-mono: monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; height: 100vh; }

#wall-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#fallback-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
#particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }

.top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
.brand h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--text-light); text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); letter-spacing: 1px; }

.store-stats { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 8px 15px; border-radius: 12px; display: flex; gap: 15px; }
.stat-item label { font-size: 0.6rem; text-transform: uppercase; color: #888; display: block;}
.stat-item span { font-family: var(--font-mono); color: var(--accent-gold); font-size: 1rem; font-weight: bold; }

.storefront { pointer-events: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 15px; flex-wrap: wrap;}

.preview-card { background: var(--panel); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 15px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
.preview-card h2 { font-size: 1.1rem; color: var(--text-light); }
.preview-card .desc { font-size: 0.75rem; line-height: 1.3; color: #888; }
.price-tag { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
.price-tag .price { font-family: var(--font-mono); font-size: 1.2rem; color: var(--accent-gold); font-weight: bold; }
.buy-btn { background: var(--accent-gold); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
.buy-btn.owned { background: #333; color: #888; cursor: default; }

.swatch-container { display: flex; gap: 10px; pointer-events: auto; overflow-x: auto; padding-bottom: 10px; width: 100%; max-width: 350px; }
.swatch { min-width: 50px; height: 50px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; position: relative; background: #000; flex-shrink: 0; }
.swatch canvas { width: 100%; height: 100%; opacity: 0.6; border-radius: 8px;}
.swatch:hover { transform: translateY(-3px); }
.swatch.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
.swatch.active canvas { opacity: 1; }

.hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #555; font-family: var(--font-mono); animation: pulse 2s infinite; text-align: center; width: 100%;}
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

#error-box { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #300; border: 1px solid red; color: white; padding: 20px; border-radius: 8px; z-index: 999; font-family: monospace; width: 90%; max-width: 400px; text-align: center; }

@media (max-width: 768px) {
  .storefront { flex-direction: column; align-items: center; }
  .preview-card { max-width: 100%; }
}
</style>
</head>
<body>

<canvas id="wall-canvas"></canvas>
<canvas id="fallback-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<div id="ui-layer">
  <div class="top-bar">
    <div class="brand">
      <h1>AURA<span>WALLS</span></h1>
      <p>PREMIUM DIGITAL DECOR</p>
    </div>
    <div class="store-stats">
      <div class="stat-item"><label>Saldo</label><span>₡ 12,450</span></div>
      <div class="stat-item"><label>Coleção</label><span id="collection-count">0 / 4</span></div>
    </div>
  </div>

  <div class="storefront">
    <div class="preview-card">
      <h2 id="pattern-title">Op-Art Genesis</h2>
      <p class="desc" id="pattern-desc">Ondas quânticas hipnóticas.</p>
      <div class="price-tag">
        <div class="price" id="pattern-price">₡ 4,500</div>
        <button class="buy-btn" id="buy-btn">Comprar</button>
      </div>
    </div>
    <div class="swatch-container" id="swatches"></div>
  </div>

  <div class="hint">Deslize o dedo na tela para interagir</div>
</div>

<div id="error-box">
  <strong>Aviso do Sistema:</strong> Seu dispositivo bloqueou a renderização 3D (WebGL).<br><br>
  <span style="color:#ccc; font-size:12px;">Ativando Modo de Compatibilidade 2D...</span>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO INICIAL E TRATAMENTO DE ERROS
// ==========================================
const canvas = document.getElementById('wall-canvas');
const fallbackCanvas = document.getElementById('fallback-canvas');
const errorBox = document.getElementById('error-box');

// Garantir tamanho antes de iniciar
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gl = null;
try {
    gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
} catch (e) {
    console.error("Erro ao criar WebGL:", e);
}

if (!gl) {
    // Ativa o fallback se o WebGL não existir
    errorBox.style.display = 'block';
    canvas.style.display = 'none';
    fallbackCanvas.style.display = 'block';
    initFallback2D();
} else {
    try {
        initWebGL();
    } catch (e) {
        console.error("Erro no Shader:", e);
        errorBox.style.display = 'block';
        canvas.style.display = 'none';
        fallbackCanvas.style.display = 'block';
        initFallback2D();
    }
}

// ==========================================
// MOTOR WEBGL (COM SHADERS CORRIGIDOS)
// ==========================================
function initWebGL() {
    const vsSource = `
        attribute vec4 aVertexPosition;
        void main() { gl_Position = aVertexPosition; }
    `;

    const fsSource = `
        precision mediump float;
        uniform vec2 u_resolution;
        uniform vec2 u_mouse;
        uniform float u_time;
        uniform int u_pattern;
        
        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            vec2 mouse = (u_mouse - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
            
            float dist = length(uv - mouse);
            uv += (uv - mouse) * dist * 0.1;
            
            float t = u_time * 0.5;
            vec3 color = vec3(0.0);
            
            if (u_pattern == 0) {
                float wave = sin(uv.x * 10.0 + t) * cos(uv.y * 10.0 + t);
                float ring = sin(length(uv) * 30.0 - t * 5.0);
                float val = smoothstep(0.2, 0.8, wave + ring);
                color = vec3(0.1, 0.6, 0.9) * val + vec3(0.8, 0.1, 0.4) * (1.0 - val);
            } else if (u_pattern == 1) {
                float a = atan(uv.y, uv.x);
                float r = length(uv);
                float angle = a + r * 8.0 - t * 2.0;
                float val = sin(angle * 5.0) * 0.5 + 0.5;
                color = mix(vec3(0.05, 0.05, 0.1), vec3(0.9, 0.7, 0.1), smoothstep(0.0, 1.0, val));
            } else if (u_pattern == 2) {
                vec2 p = uv * 8.0;
                p.x += sin(p.y + t) * 0.5;
                vec2 id = floor(p);
                vec2 f = fract(p) - 0.5;
                float d = length(f);
                float c = smoothstep(0.45, 0.55, d);
                color = mix(vec3(0.2, 0.8, 0.4), vec3(0.02, 0.02, 0.05), c);
            } else if (u_pattern == 3) {
                vec2 p = uv * 20.0;
                float lines = sin(p.x) * sin(p.y);
                float glow = 0.02 / (abs(lines) + 0.01);
                color = vec3(0.01, 0.05, 0.1) + vec3(0.0, 0.8, 1.0) * glow;
            }
            
            float vignette = length(uv) * 0.8;
            color *= smoothstep(1.5, 0.5, vignette);
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    function compileShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error("Erro ao compilar shader: " + gl.getShaderInfoLog(shader));
        }
        return shader;
    }

    const shaderProgram = gl.createProgram();
    gl.attachShader(shaderProgram, compileShader(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(shaderProgram, compileShader(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(shaderProgram);
    gl.useProgram(shaderProgram);

    const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

    const aVertexPosition = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
    gl.enableVertexAttribArray(aVertexPosition);
    gl.vertexAttribPointer(aVertexPosition, 2, gl.FLOAT, false, 0, 0);

    window.glData = {
        uResolution: gl.getUniformLocation(shaderProgram, 'u_resolution'),
        uMouse: gl.getUniformLocation(shaderProgram, 'u_mouse'),
        uTime: gl.getUniformLocation(shaderProgram, 'u_time'),
        uPattern: gl.getUniformLocation(shaderProgram, 'u_pattern'),
        gl: gl
    };

    // Injeção de correção: Enviar dados iniciais ANTES de desenhar
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(window.glData.uResolution, canvas.width, canvas.height);
    gl.uniform2f(window.glData.uMouse, canvas.width / 2, canvas.height / 2);
}

// ==========================================
// MOTOR FALLBACK 2D
// ==========================================
let fallbackTime = 0;
function initFallback2D() {
    const ctx = fallbackCanvas.getContext('2d');
    fallbackCanvas.width = window.innerWidth;
    fallbackCanvas.height = window.innerHeight;
    
    function drawFallback() {
        fallbackTime += 0.05;
        ctx.fillStyle = '#05050a';
        ctx.fillRect(0, 0, fallbackCanvas.width, fallbackCanvas.height);
        
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.lineWidth = 2;
        for(let i=0; i<10; i++) {
            ctx.beginPath();
            let r = (fallbackTime * 20 + i * 40) % 300;
            ctx.arc(fallbackCanvas.width/2, fallbackCanvas.height/2, r, 0, Math.PI*2);
            ctx.stroke();
        }
        requestAnimationFrame(drawFallback);
    }
    drawFallback();
}

// ==========================================
// LÓGICA DA LOJA
// ==========================================
const patterns = [
  { id: 0, name: "Op-Art Genesis", price: 4500, desc: "Ondas quânticas hipnóticas." },
  { id: 1, name: "Golden Spiral", price: 8200, desc: "Elegância matemática pura." },
  { id: 2, name: "Truchet Flow", price: 3500, desc: "Labirintos contínuos em movimento." },
  { id: 3, name: "Cyber Grid", price: 6000, desc: "Luzes de neon futuristas." }
];

let currentPattern = 0;
let ownedPatterns = new Set();
let time = 0;

function updateStoreUI(index) {
  const p = patterns[index];
  currentPattern = p.id;
  
  document.getElementById('pattern-title').innerText = p.name;
  document.getElementById('pattern-desc').innerText = p.desc;
  document.getElementById('pattern-price').innerText = `₡ ${p.price.toLocaleString('pt-BR')}`;
  
  const btn = document.getElementById('buy-btn');
  if (ownedPatterns.has(p.id)) {
    btn.innerText = 'Adquirido';
    btn.classList.add('owned');
  } else {
    btn.innerText = 'Comprar';
    btn.classList.remove('owned');
  }

  document.querySelectorAll('.swatch').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  
  document.getElementById('collection-count').innerText = `${ownedPatterns.size} / 4`;
}

function initSwatches() {
  const container = document.getElementById('swatches');
  patterns.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'swatch';
    div.innerHTML = `<canvas width="50" height="50"></canvas>`;
    div.onclick = () => updateStoreUI(i);
    container.appendChild(div);
    
    const ctx = div.querySelector('canvas').getContext('2d');
    const imgData = ctx.createImageData(50, 50);
    for (let y = 0; y < 50; y++) {
      for (let x = 0; x < 50; x++) {
        const idx = (y * 50 + x) * 4;
        let r = 0, g = 0, b = 0;
        if (p.id === 0) { r = x * 5; g = y * 5; b = 255; }
        if (p.id === 1) { r = 255; g = (x+y)*2; b = 0; }
        if (p.id === 2) { r = 0; g = 255; b = x*5; }
        if (p.id === 3) { r = 0; g = 100; b = 255; }
        imgData.data[idx] = r; imgData.data[idx+1] = g; imgData.data[idx+2] = b; imgData.data[idx+3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  });
  updateStoreUI(0);
}

// Efeito de Partículas de Compra
const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
pCanvas.width = window.innerWidth;
pCanvas.height = window.innerHeight;
let particles = [];

function createParticles(x, y) {
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 0.5) * 15,
      life: 1.0,
      color: `hsl(${Math.random() * 60 + 40}, 100%, 60%)`
    });
  }
}

function drawParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.fillStyle = p.color; pCtx.globalAlpha = p.life;
    pCtx.beginPath(); pCtx.arc(p.x, p.y, Math.random() * 3 + 1, 0, Math.PI * 2); pCtx.fill();
  }
  pCtx.globalAlpha = 1.0;
  requestAnimationFrame(drawParticles);
}

document.getElementById('buy-btn').addEventListener('click', (e) => {
  const p = patterns[currentPattern];
  if (ownedPatterns.has(p.id)) return;
  ownedPatterns.add(p.id);
  updateStoreUI(currentPattern);
  const rect = e.target.getBoundingClientRect();
  createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
});

// Eventos de Redimensionamento e Mouse
window.addEventListener('resize', () => {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
  if (window.glData) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.glData.gl.viewport(0, 0, canvas.width, canvas.height);
    window.glData.gl.uniform2f(window.glData.uResolution, canvas.width, canvas.height);
  } else {
    fallbackCanvas.width = window.innerWidth;
    fallbackCanvas.height = window.innerHeight;
  }
});

function handleMove(clientX, clientY) {
  if (window.glData) {
    // Inverte Y para o WebGL (origem no canto inferior esquerdo)
    window.glData.gl.uniform2f(window.glData.uMouse, clientX, window.innerHeight - clientY);
  }
}

window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: true});

// Loop de Renderização
function render(now) {
  now *= 0.001;
  time += 0.05;
  
  if (window.glData && window.glData.gl) {
    const gl = window.glData.gl;
    gl.uniform1f(window.glData.uTime, time);
    gl.uniform1i(window.glData.uPattern, currentPattern);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  
  requestAnimationFrame(render);
}

// Inicialização segura
initSwatches();
drawParticles();
requestAnimationFrame(render);
</script>
</body>
</html>
