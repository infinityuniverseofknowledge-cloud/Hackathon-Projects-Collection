<!DOCTYPE html>
<html lang="pt-BR" data-theme="deepspace">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>COSMOS — Space Mission Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#01020a;--panel:#050714;--panel2:#0a0f28;--panel3:#101840;--panel4:#182258;
  --bd:#121c4a;--bd2:#243890;--tx:#d8e0ff;--tx2:#8090d8;--tx3:#4858a8;
  --p1:#4090ff;--p2:#40e0ff;--p3:#ff60a0;--p4:#ffd040;--p5:#a060ff;--p6:#ff8040;
  --g1:linear-gradient(135deg,#4090ff,#a060ff);
  --gHolo:linear-gradient(120deg,#4090ff,#a060ff,#ff60a0,#ffd040,#40e0ff,#4090ff);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f5f7ff;--panel:#fff;--panel2:#f5f7ff;--panel3:#e8ecff;--panel4:#d4dcf8;--bd:#c8d0e8;--bd2:#98a8d0;--tx:#0a1028;--tx2:#404878;--tx3:#8088b0;--p1:#2050c0;--p2:#0080c0;--g1:linear-gradient(135deg,#2050c0,#6020c0)}
[data-theme="nova"]{--bg:#0a0206;--panel:#180510;--panel2:#280a1c;--panel3:#3a1030;--panel4:#4a1840;--bd:#38122c;--bd2:#702050;--tx:#ffd8e8;--tx2:#c06898;--tx3:#804068;--p1:#ff3090;--p2:#ffd040;--g1:linear-gradient(135deg,#ff3090,#ffd040)}
[data-theme="solar"]{--bg:#0a0600;--panel:#1a1000;--panel2:#2a1a00;--panel3:#3a2600;--panel4:#4a3200;--bd:#3c2400;--bd2:#6a3c00;--tx:#ffe8c0;--tx2:#c09860;--tx3:#806040;--p1:#ffa020;--p2:#ffd060;--g1:linear-gradient(135deg,#ffa020,#ffd060)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#01020a}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p2);box-shadow:0 0 10px var(--p2);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#000003;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(64,144,255,.012) 0,rgba(64,144,255,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(5,7,20,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p4)}.sb-val.c4{color:var(--p5)}.sb-val.c5{color:var(--p3)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(64,144,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#01020a;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#01020a;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p2)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p3)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('orbits')">COSMOS</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">T+</span><span class="sb-val c2" id="sbTime">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">v</span><span class="sb-val c3" id="sbVel">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Alt</span><span class="sb-val c4" id="sbAlt">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Δv</span><span class="sb-val c5" id="sbDv">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Orbits</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   ASTRONOMY CONSTANTS (SI, CODATA 2018)
   ══════════════════════════════════════════════════════════ */
var AU=1.495978707e11;         // meters
var G=6.67430e-11;             // m³/(kg·s²)
var C_LIGHT=299792458;         // m/s
var H_PLANCK=6.62607015e-34;   // J·s
var K_BOLTZ=1.380649e-23;      // J/K
var SIGMA_SB=5.670374419e-8;   // W/(m²·K⁴)
var M_SUN=1.98892e30;          // kg
var M_EARTH=5.972e24;          // kg
var R_EARTH=6.371e6;           // m
var M_MOON=7.342e22;
var M_MARS=6.417e23;
var M_JUP=1.898e27;
var DAY=86400;                 // seconds
var YEAR=365.256*DAY;          // sidereal year
var PC=3.0857e16;              // parsec
var LY=9.4607e15;              // light year
var SIGMA_T=6.6524587321e-29;  // Thomson cross section
var M_PROTON=1.67262192e-27;
var SIGMA_T_CM2=SIGMA_T*1e4;
var ELECTRON_MASS=9.1093837e-31;
var EPSILON_0=8.8541878128e-12;
var MU_0=1.25663706212e-6;

/* ══════════════════════════════════════════════════════════
   3D VECTOR MATH
   ══════════════════════════════════════════════════════════ */
function V3(x,y,z){return {x:x,y:y,z:z}}
V3.add=function(a,b){return V3(a.x+b.x,a.y+b.y,a.z+b.z)};
V3.sub=function(a,b){return V3(a.x-b.x,a.y-b.y,a.z-b.z)};
V3.scale=function(a,s){return V3(a.x*s,a.y*s,a.z*s)};
V3.dot=function(a,b){return a.x*b.x+a.y*b.y+a.z*b.z};
V3.cross=function(a,b){return V3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x)};
V3.len=function(a){return Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)};
V3.norm=function(a){var l=V3.len(a)||1;return V3(a.x/l,a.y/l,a.z/l)};
V3.dist=function(a,b){return V3.len(V3.sub(a,b))};

/* ══════════════════════════════════════════════════════════
   KEPLER ORBITAL MECHANICS
   ══════════════════════════════════════════════════════════ */
function solveKepler(M,e){
  // Solve E - e·sin(E) = M using Newton-Raphson
  M=((M%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  var E=M;
  for(var i=0;i<30;i++){
    var f=E-e*Math.sin(E)-M;
    var fp=1-e*Math.cos(E);
    var dE=f/fp;
    E-=dE;
    if(Math.abs(dE)<1e-12)break;
  }
  return E;
}
function keplerToCartesian(a,e,i,Omega,omega,M){
  var E=solveKepler(M,e);
  var nu=2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2));
  var r=a*(1-e*Math.cos(E));
  var xo=r*Math.cos(nu);
  var yo=r*Math.sin(nu);
  // Rotate by omega (arg of periapsis), i (inclination), Omega (long asc node)
  var x1=xo*Math.cos(omega)-yo*Math.sin(omega);
  var y1=xo*Math.sin(omega)+yo*Math.cos(omega);
  var z1=0;
  var x2=x1;
  var y2=y1*Math.cos(i);
  var z2=y1*Math.sin(i);
  var x=x2*Math.cos(Omega)-y2*Math.sin(Omega);
  var y=x2*Math.sin(Omega)+y2*Math.cos(Omega);
  var z=z2;
  return {x:x,y:y,z:z,nu:nu,r:r};
}
function orbitalPeriod(a,M){return 2*Math.PI*Math.sqrt(a*a*a/(G*M))}
function orbitalVelocity(r,a,M){return Math.sqrt(G*M*(2/r-1/a))}
function escapeVelocity(r,M){return Math.sqrt(2*G*M/r)}
function visViva(r,a,M){return G*M*(2/r-1/a)}
function meanMotion(a,M){return Math.sqrt(G*M/(a*a*a))}
function hohmannDeltaV(r1,r2,M){
  var v1=Math.sqrt(G*M/r1);
  var v2=Math.sqrt(G*M/r2);
  var a_t=(r1+r2)/2;
  var dv1=Math.sqrt(G*M*(2/r1-1/a_t))-v1;
  var dv2=v2-Math.sqrt(G*M*(2/r2-1/a_t));
  return {dv1:Math.abs(dv1),dv2:Math.abs(dv2),total:Math.abs(dv1)+Math.abs(dv2),transferTime:Math.PI*Math.sqrt(a_t*a_t*a_t/(G*M))};
}
function hillSphere(a,m,M){return a*Math.pow(m/(3*M),1/3)}

/* ══════════════════════════════════════════════════════════
   RELATIVITY
   ══════════════════════════════════════════════════════════ */
function lorentzFactor(v){return 1/Math.sqrt(1-(v/C_LIGHT)*(v/C_LIGHT))}
function schwarzschildRadius(M){return 2*G*M/(C_LIGHT*C_LIGHT)}
function timeDilationSR(v){return lorentzFactor(v)}
function gravitationalTimeDilation(M,r){return 1/Math.sqrt(1-schwarzschildRadius(M)/r)}
function blackbodyPeak(T){
  // Wien's displacement law: λ_max = b/T
  var b=2.897771955e-3;
  return b/T;
}
function blackbodyRadiance(lambda,T){
  // Planck's law (W·m⁻²·sr⁻¹·m⁻¹)
  var c=C_LIGHT,k=K_BOLTZ,h=H_PLANCK;
  var x=h*c/(lambda*k*T);
  return (2*h*c*c/(Math.pow(lambda,5)))/(Math.exp(x)-1);
}
function blackbodyPeakRadiance(T){
  var lam=blackbodyPeak(T);
  return blackbodyRadiance(lam,T);
}
function luminosity(R,T){return 4*Math.PI*R*R*SIGMA_SB*T*T*T*T}
function apparentMagnitude(L,d){return -2.5*Math.log10(L/(4*Math.PI*d*d))-Math.log10(3.0128e28)};
function distanceModulus(m,M){return m-M}
function parallaxToDistance(theta_arcsec){return 1/theta_arcsec}

/* ══════════════════════════════════════════════════════════
   NUMERICAL INTEGRATORS
   ══════════════════════════════════════════════════════════ */
function rk4(y,t,dt,deriv){
  var n=y.length;
  var k1=deriv(y,t);
  var y2=new Array(n);for(var i=0;i<n;i++)y2[i]=y[i]+k1[i]*dt/2;
  var k2=deriv(y2,t+dt/2);
  var y3=new Array(n);for(var i=0;i<n;i++)y3[i]=y[i]+k2[i]*dt/2;
  var k3=deriv(y3,t+dt/2);
  var y4=new Array(n);for(var i=0;i<n;i++)y4[i]=y[i]+k3[i]*dt;
  var k4=deriv(y4,t+dt);
  var out=new Array(n);
  for(var i=0;i<n;i++)out[i]=y[i]+(k1[i]+2*k2[i]+2*k3[i]+k4[i])*dt/6;
  return out;
}
function leapfrog(x,v,a,dt){var vh=v+a*dt/2;var xn=x+vh*dt;return {x:xn,vh:vh}}

/* ══════════════════════════════════════════════════════════
   HELPER: days since J2000
   ══════════════════════════════════════════════════════════ */
function daysSinceJ2000(date){
  var d=date||new Date();
  return (d.getTime()/86400000)-10957.5;
}
function planetPosition(planet,t){
  var M_deg=planet.M0+360*(t/(365.25*planet.P));
  var M=M_deg*Math.PI/180;
  var E=solveKepler(M,planet.e);
  var nu=2*Math.atan2(Math.sqrt(1+planet.e)*Math.sin(E/2),Math.sqrt(1-planet.e)*Math.cos(E/2));
  var r=planet.a*(1-planet.e*Math.cos(E));
  var Om=planet.Om*Math.PI/180,om=planet.om*Math.PI/180,i=planet.i*Math.PI/180;
  var xo=r*Math.cos(nu),yo=r*Math.sin(nu);
  var x1=xo*Math.cos(om)-yo*Math.sin(om);
  var y1=xo*Math.sin(om)+yo*Math.cos(om);
  var x2=x1,y2=y1*Math.cos(i),z2=y1*Math.sin(i);
  var x=x2*Math.cos(Om)-y2*Math.sin(Om);
  var y=x2*Math.sin(Om)+y2*Math.cos(Om);
  return {x:x,y:y,z:z2,r:r,nu:nu};
}

/* ══════════════════════════════════════════════════════════
   DRAW HELPERS
   ══════════════════════════════════════════════════════════ */
function drawSparkline(ctx,x,y,w,h,values,color,fill){
  if(values.length<2)return;
  var mx=Math.max.apply(null,values),mn=Math.min.apply(null,values);
  if(mx===mn){mx=mn+1}
  ctx.beginPath();
  for(var i=0;i<values.length;i++){
    var px=x+i/(values.length-1)*w;
    var py=y+h-(values[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  if(fill){
    ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,color+'88');g.addColorStop(1,color+'00');
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
}
function starfield(ctx,W,H,seed){
  seed=seed||0;
  var n=300;
  for(var i=0;i<n;i++){
    var h=((i*2654435761)>>>0);
    var x=(h%10000)/10000*W;
    var y=(((h>>14)%10000)/10000)*H;
    var sz=((h>>20)&15)/15*1.5+0.3;
    var b=((h>>25)&7)/7;
    ctx.fillStyle='rgba(255,255,255,'+(0.3+b*0.7)+')';
    ctx.fillRect(x,y,sz,sz);
  }
}
</script>

registerModule('orbits',{title:'Kepler Orbits',icon:'🪐',desc:'Two-body problem with real orbital elements.',init:function(){this.reset()},
reset:function(){var o=STATE.orbits;o.trail=[];o.t=0;o.M0=0},
tick:function(dt){STATE.time+=dt;var o=STATE.orbits;
if(!STATE.playing)return;
o.t+=dt*o.speed*10;
o.M=o.M0+2*Math.PI*o.t/100;
var pos=keplerToCartesian(o.a*AU,o.e,o.i*Math.PI/180,o.Omega*Math.PI/180,o.omega*Math.PI/180,o.M);
o.pos=pos;o.trail.push({x:pos.x/AU,y:pos.y/AU});
if(o.trail.length>2000)o.trail.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,1);
var o=STATE.orbits;
var cx=W/2,cy=H/2;
// scale to fit aphelion
var rmax=o.a*(1+o.e)*AU;
var sc=Math.min(W,H)*0.4/rmax;
/* Orbit ellipse */
ctx.strokeStyle='rgba(64,224,255,.3)';ctx.lineWidth=1.5;
var b=o.a*Math.sqrt(1-o.e*o.e);
for(var nu=0;nu<2*Math.PI;nu+=0.02){
  var r=o.a*(1-o.e*o.e)/(1+o.e*Math.cos(nu));
  var xo=r*Math.cos(nu),yo=r*Math.sin(nu);
  var x1=xo*Math.cos(o.omega*Math.PI/180)-yo*Math.sin(o.omega*Math.PI/180);
  var y1=xo*Math.sin(o.omega*Math.PI/180)+yo*Math.cos(o.omega*Math.PI/180);
  var px=cx+x1*AU*sc,py=cy-y1*AU*sc;
  if(nu===0)ctx.beginPath();
  if(nu===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.stroke();
/* Trail */
if(o.trail.length>1){
  ctx.strokeStyle='#4090ff';ctx.lineWidth=2;
  ctx.beginPath();
  o.trail.forEach(function(p,i){var px=cx+p.x*AU*sc,py=cy-p.y*AU*sc;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});
  ctx.stroke();
}
/* Sun */
ctx.fillStyle='#ffd040';
ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();
var g=ctx.createRadialGradient(cx,cy,0,cx,cy,40);
g.addColorStop(0,'rgba(255,208,64,.4)');g.addColorStop(1,'rgba(255,208,64,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fill();
/* Body */
if(o.pos){
  var px=cx+o.pos.x*sc,py=cy-o.pos.y*sc;
  ctx.fillStyle='#40e0ff';
  ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  /* Velocity vector */
  if(o.showVel){
    var vel=orbitalVelocity(o.pos.r,o.a*AU,M_SUN);
    ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+20,py);ctx.stroke();
    ctx.fillStyle='#ffd040';ctx.font='10px monospace';ctx.fillText('v='+fmt(vel/1000,2)+' km/s',px+25,py+4);
  }
}
/* Info */
setStats('<div>a: '+o.a+' AU</div><div>e: '+o.e+'</div><div>i: '+o.i+'°</div><div>r: '+(o.pos?fmt(o.pos.r/AU,3):'—')+' AU</div>');
badge('🪐 Orbit · a='+o.a+' e='+fmt(o.e,2));SV('sbTime',fmt(o.t,1));SV('sbVel',o.pos?fmt(orbitalVelocity(o.pos.r,o.a*AU,M_SUN)/1000,2)+' km/s':'—');SV('sbAlt',o.pos?fmt((o.pos.r/AU-1),2)+' AU':'—')},
onDown:function(){},
controls:function(){var o=STATE.orbits;var h='<div class="sec"><h4>Orbital elements</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Semi-major a</span><span>'+o.a+' AU</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+o.a+'" oninput="STATE.orbits.a=parseFloat(this.value);MODULES.orbits.reset();renderLeftPanel()"></div>';

[['Earth',1,0.017,0],['Halley',17.8,0.967,162],['Comet',5,0.8,60],['Circular',3,0,0],['Molniya',26.6,0.74,63]].forEach(function(p){

registerModule('starchart',{title:'Star Chart',icon:'🌌',desc:'RA/Dec projection with real bright stars.',init:function(){},
tick:function(dt){STATE.time+=dt;var s=STATE.starchart;s.time+=dt*0.01},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,3);
var s=STATE.starchart;
/* Project sky - stereographic centered at (ra, dec) */
var cx=W/2,cy=H/2;
var scale=Math.min(W,H)*0.45;
function project(ra,dec){
  var ra0=s.ra*Math.PI/12;
  var dec0=s.dec*Math.PI/180;
  var raR=ra*Math.PI/12;
  var decR=dec*Math.PI/180;
  var cosc=Math.sin(dec0)*Math.sin(decR)+Math.cos(dec0)*Math.cos(decR)*Math.cos(raR-ra0);
  if(cosc<0)return null;
  var k=2/(1+cosc);
  var x=k*Math.cos(decR)*Math.sin(raR-ra0);
  var y=k*(Math.cos(dec0)*Math.sin(decR)-Math.sin(dec0)*Math.cos(decR)*Math.cos(raR-ra0));
  return {x:cx+x*scale/2,y:cy-y*scale/2};
}
/* Constellation lines */
if(s.showLines){
  for(var cname in CONSTELLATIONS){
    var line=CONSTELLATIONS[cname];
    ctx.strokeStyle='rgba(64,144,255,.25)';ctx.lineWidth=1;
    ctx.beginPath();
    line.forEach(function(p,i){
      var pt=project(p[0],p[1]);
      if(!pt)return;
      if(i===0)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y);
    });
    ctx.stroke();
  }
}
/* Stars */
STAR_CATALOG.forEach(function(star){
  var ra=star[1],dec=star[2],mag=star[3],bv=star[4];
  if(mag>s.minMag)return;
  var pt=project(ra,dec);
  if(!pt)return;
  var r=Math.max(0.5,(6-mag)*0.9);
  var col=starColor(star[6]?star[6]:0);
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,Math.PI*2);ctx.fill();
  if(mag<2){
    var g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,r*4);
    g.addColorStop(0,col+Math.floor(200).toString(16)+Math.floor(255).toString(16));
    g.addColorStop(1,col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,r*4,0,Math.PI*2);ctx.fill();
  }
  if(mag<2.5){
    ctx.fillStyle='#d8e0ff';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(star[0],pt.x,pt.y-r-3);
    ctx.textAlign='left';
  }
});
/* DSOs */
if(s.showDSO){
  DEEP_SKY.forEach(function(dso){
    var pt=project(dso.ra,dso.dec);
    if(!pt)return;
    if(dso.mag>s.minMag)return;
    ctx.strokeStyle=dso.type==='galaxy'?'#ff9060':dso.type==='nebula'?'#40e0ff':'#ffd040';
    ctx.lineWidth=1.5;
    var rad=dso.size*10;
    if(dso.type==='galaxy'){
      ctx.beginPath();ctx.ellipse(pt.x,pt.y,rad,rad*0.4,0.5,0,Math.PI*2);ctx.stroke();
    }else if(dso.type==='cluster'){
      for(var k=0;k<8;k++){
        var a=k/8*Math.PI*2;
        ctx.beginPath();ctx.arc(pt.x+Math.cos(a)*rad*0.5,pt.y+Math.sin(a)*rad*0.5,1,0,Math.PI*2);ctx.stroke();
      }
    }else{
      ctx.beginPath();ctx.arc(pt.x,pt.y,rad*0.5,0,Math.PI*2);ctx.stroke();
    }
  });
}
/* Crosshair */
ctx.strokeStyle='rgba(64,144,255,.6)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(cx-15,cy);ctx.lineTo(cx+15,cy);ctx.moveTo(cx,cy-15);ctx.lineTo(cx,cy+15);ctx.stroke();
/* Info */
setStats('<div>RA: '+fmt(s.ra,2)+'h</div><div>Dec: '+fmt(s.dec,1)+'°</div><div>Stars: '+STAR_CATALOG.length+'</div>');
badge('🌌 Star Chart · '+STAR_CATALOG.length+' stars');SV('sbTime',fmt(s.ra,1)+'h');SV('sbVel',fmt(s.dec,0)+'°')},

registerModule('rocket',{title:'Rocket Launch',icon:'🚀',desc:'Tsiolkovsky + gravity turn simulation.',init:function(){this.reset()},
reset:function(){var r=STATE.rocket;r.t=0;r.altitude=0;r.velocity=0;r.mass=r.dryMass+r.fuelMass;r.pitch=90;r.vertical=true;r.thrustCurve=[];r.pitchCurve=[];r.burned=0},
tick:function(dt){STATE.time+=dt;var r=STATE.rocket;if(!STATE.playing)return;if(r.mass<=r.dryMass)return;
var sub=dt*5;
for(var i=0;i<sub;i++){
  var dt2=1/5;
  // Gravity turn: reduce pitch over time
  if(r.gTurn){
    var altFac=clamp(r.altitude/100000,0,1);
    r.pitch=90-(90-r.targetPitch||0)*altFac;
  }
  var pitchRad=r.pitch*Math.PI/180;
  var thrustAccel=r.thrust/r.mass;
  var g=G*M_EARTH/Math.pow(R_EARTH+r.altitude,2);
  var massFlow=r.thrust/(r.isp*9.81);
  r.mass-=massFlow*dt2;
  if(r.mass<r.dryMass){r.mass=r.dryMass}
  var accel=thrustAccel-g;
  r.velocity+=accel*dt2;
  r.altitude+=r.velocity*Math.sin(pitchRad)*dt2;
  r.burned+=massFlow*dt2;
  r.t+=dt2;
  r.thrustCurve.push(thrustAccel);
  r.pitchCurve.push(r.pitch);
  if(r.thrustCurve.length>3000){r.thrustCurve.shift();r.pitchCurve.shift()}
}
},

/* ══════ 6. GRAVITY N-BODY ══════ */
registerModule('gravity',{title:'N-Body Simulator',icon:'🎯',desc:'Real N-body integration with RK4.',init:function(){this.reset()},
reset:function(){var g=STATE.gravity;g.planets=[];g.trail=[];g.probe={x:0,y:0,vx:0,vy:0,m:0};
// Setup Sun + Earth + Moon + Jupiter
g.bodies=[
  {x:0,y:0,vx:0,vy:0,m:M_SUN,color:'#ffd040',radius:8,name:'Sun'},
  {x:1,y:0,vx:0,vy:-29780,m:M_EARTH,color:'#40e0ff',radius:3,name:'Earth'},
  {x:5.2,y:0,vx:0,vy:-13070,m:M_JUP,color:'#ffa860',radius:5,name:'Jupiter'}
];
// Init velocities from circular orbits (relative to Sun)
g.bodies[1].vy=-Math.sqrt(G*M_SUN/(1*AU));
g.bodies[2].vy=-Math.sqrt(G*M_SUN/(5.2*AU));
g.t=0},
step:function(dt){var g=STATE.gravity;var bodies=g.bodies;
var acc=bodies.map(function(){return {ax:0,ay:0}});
for(var i=0;i<bodies.length;i++){
  for(var j=i+1;j<bodies.length;j++){
    var dx=bodies[j].x-bodies[i].x;
    var dy=bodies[j].y-bodies[i].y;
    var d2=dx*dx+dy*dy+1e6;
    var d=Math.sqrt(d2);
    var f=G/(d2*d);
    acc[i].ax+=f*bodies[j].m*dx;
    acc[i].ay+=f*bodies[j].m*dy;
    acc[j].ax-=f*bodies[i].m*dx;
    acc[j].ay-=f*bodies[i].m*dy;
  }
}
for(var i=0;i<bodies.length;i++){
  bodies[i].vx+=acc[i].ax*dt;
  bodies[i].vy+=acc[i].ay*dt;
  bodies[i].x+=bodies[i].vx*dt;
  bodies[i].y+=bodies[i].vy*dt;
}
g.t+=dt},
tick:function(dt){STATE.time+=dt;var g=STATE.gravity;if(!STATE.playing)return;
var sub=dt*10;
for(var i=0;i<sub;i++)this.step(0.3*DAY*0.1)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,6);
var g=STATE.gravity;
var cx=W/2,cy=H/2;
var sc=Math.min(W,H)*0.42/(6*AU);
/* Trail */
if(g.trail.length>1){
  ctx.strokeStyle='rgba(64,224,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();
  g.trail.forEach(function(p,i){var px=cx+p.x*sc,py=cy-p.y*sc;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});
  ctx.stroke();
}
/* Bodies */
g.bodies.forEach(function(b){
  var px=cx+b.x*sc,py=cy-b.y*sc;
  var rad=Math.max(2,Math.log(Math.abs(b.m))/3);
  var gr=ctx.createRadialGradient(px,py,0,px,py,rad*3);
  gr.addColorStop(0,b.color);
  gr.addColorStop(1,b.color+'00');
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.arc(px,py,rad*3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=b.color;
  ctx.beginPath();ctx.arc(px,py,rad,0,Math.PI*2);ctx.fill();
  if(b.name){
    ctx.fillStyle='#d8e0ff';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(b.name,px,py-rad-4);ctx.textAlign='left';
  }
});
/* Track Earth's trail */
var earth=g.bodies[1];
g.trail.push({x:earth.x,y:earth.y});
if(g.trail.length>3000)g.trail.shift();
setStats('<div>Bodies: '+g.bodies.length+'</div><div>t: '+fmt(g.t/DAY,1)+' days</div><div>Earth: r='+fmt(Math.sqrt(earth.x*earth.x+earth.y*earth.y)/AU,3)+' AU</div>');
badge('🎯 N-Body · '+g.bodies.length+' bodies');SV('sbTime',fmt(g.t/DAY,0)+'d')},

/* ══════ 7. LAGRANGE POINTS ══════ */
registerModule('lagrange',{title:'Lagrange Points',icon:'⚖',desc:'Restricted 3-body problem equilibria.',init:function(){this.compute()},
compute:function(){var l=STATE.lagrange;
var mu=l.system==='Earth-Moon'?0.01215:0.0009537; // Earth-Moon vs Sun-Earth
l.mu=mu;
// L1, L2, L3 (approx)
var r=(mu/3)**(1/3);
l.L=[
  {name:'L1',x:1-r,y:0},
  {name:'L2',x:1+r,y:0},
  {name:'L3',x:-1-r*0.9,y:0},
  {name:'L4',x:0.5-mu,y:Math.sqrt(3)/2},
  {name:'L5',x:0.5-mu,y:-Math.sqrt(3)/2}
]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,7);
var l=STATE.lagrange;
var cx=W/2,cy=H/2;
var sc=Math.min(W,H)*0.35;
/* Rotating frame axes */
ctx.strokeStyle='rgba(64,144,255,.2)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(cx-sc*1.5,cy);ctx.lineTo(cx+sc*1.5,cy);ctx.stroke();
/* Primary (larger body) at origin */
ctx.fillStyle='#ffd040';
ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#d8e0ff';ctx.font='10px monospace';ctx.textAlign='center';
ctx.fillText('Primary',cx,cy-16);
/* Secondary at x=1 */
var sx=cx+sc,sy=cy;
ctx.fillStyle='#40e0ff';
ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#d8e0ff';
ctx.fillText('Secondary',sx,sy-12);
/* Lagrange points */
l.L.forEach(function(pt){
  var px=cx+pt.x*sc,py=cy-pt.y*sc;
  ctx.fillStyle='#ff60a0';
  ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ff60a0';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#ff60a0';ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillText(pt.name,px,py-14);ctx.textAlign='left';
});
/* Potential contours */
ctx.strokeStyle='rgba(64,224,255,.15)';
for(var r=0.3;r<1.5;r+=0.15){
  ctx.beginPath();
  for(var a=0;a<Math.PI*2;a+=0.05){
    var rr=r*(1+0.15*Math.cos(3*a));
    var px=cx+rr*sc*Math.cos(a);
    var py=cy+rr*sc*Math.sin(a);

registerModule('blackhole',{title:'Black Hole',icon:'⚫',desc:'Schwarzschild geodesics with lensing.',init:function(){this.reset()},
reset:function(){var b=STATE.blackhole;
b.rays=[];
for(var i=0;i<48;i++){
  var y0=-2+i*(4/48);
  b.rays.push({y0:y0,x0:-8,y0s:y0,pts:[],active:true});
}
b.rs=schwarzschildRadius(b.M*M_SUN);
// Accretion disk
b.accretion=[];
for(var i=0;i<200;i++){
  var r=2.5+Math.random()*6;
  var a=Math.random()*Math.PI*2;
  b.accretion.push({r:r,a:a,speed:1/Math.pow(r,1.5)});
}},
tick:function(dt){STATE.time+=dt;var b=STATE.blackhole;if(!STATE.playing)return;
b.accretion.forEach(function(p){p.a+=p.speed*dt*0.5});
/* Trace rays */
b.rays.forEach(function(ray){
  ray.pts=[{x:ray.x0,y:ray.y0}];
  var x=ray.x0,y=ray.y0;
  var vx=1,vy=0;
  for(var k=0;k<500;k++){
    var r=Math.sqrt(x*x+y*y);
    if(r<1)break;
    if(x>8)break;
    var f=-b.gravLens*1/Math.pow(r,3);
    var ax=f*x,ay=f*y;
    vx+=ax*0.01;vy+=ay*0.01;
    var sp=Math.sqrt(vx*vx+vy*vy);
    vx/=sp;vy/=sp;
    x+=vx*0.05;y+=vy*0.05;
    ray.pts.push({x:x,y:y});
  }
});
},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,8);
var b=STATE.blackhole;
var cx=W/2,cy=H/2;
var sc=Math.min(W,H)*0.1;
/* Accretion disk */
if(b.diskOn){
  b.accretion.forEach(function(p){
    var x=Math.cos(p.a)*p.r*sc;
    var y=Math.sin(p.a)*p.r*sc;
    var py=cy-y*0.4; // tilted
    var px=cx+x;
    var col='hsl('+(20+Math.abs(y/50))+',90%,'+(50+Math.random()*20)+'%)';
    ctx.fillStyle=col;
    ctx.fillRect(px-1,py-1,2,2);
  });
  // Glow
  var g=ctx.createRadialGradient(cx,cy,b.rs*sc*0.9,cx,cy,b.rs*sc*5);
  g.addColorStop(0,'rgba(255,150,50,.4)');
  g.addColorStop(0.5,'rgba(255,80,100,.15)');
  g.addColorStop(1,'rgba(255,80,100,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(cx,cy,b.rs*sc*5,0,Math.PI*2);ctx.fill();
}
/* Rays (light bending) */
if(b.lensingOn){
  b.rays.forEach(function(ray){
    if(!ray.active)return;
    ctx.strokeStyle='rgba(64,224,255,.5)';ctx.lineWidth=1;
    ctx.beginPath();
    ray.pts.forEach(function(p,i){
      var px=cx+p.x*sc,py=cy+p.y*sc;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.stroke();
  });
}
/* Black hole */
ctx.fillStyle='#000';
ctx.beginPath();ctx.arc(cx,cy,b.rs*sc,0,Math.PI*2);ctx.fill();
/* Photon sphere */
ctx.strokeStyle='rgba(255,208,64,.6)';ctx.lineWidth=1.5;
ctx.setLineDash([4,4]);
ctx.beginPath();ctx.arc(cx,cy,1.5*b.rs*sc,0,Math.PI*2);ctx.stroke();
ctx.setLineDash([]);
/* Event horizon */
ctx.strokeStyle='#ff60a0';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(cx,cy,b.rs*sc,0,Math.PI*2);ctx.stroke();
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(20,20,240,160);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(20,20,240,160);
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('SCHWARZSCHILD METRIC',30,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('M = '+b.M+' M☉',30,60);
ctx.fillText('r_s = 2GM/c²',30,80);
ctx.fillStyle='#ff60a0';ctx.font='bold 12px monospace';
ctx.fillText('= '+fmt(b.rs/1000,1)+' km',30,100);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('Photon sphere: 1.5·r_s',30,125);
ctx.fillText('ISCO: 3·r_s',30,142);
ctx.fillText('T_Hawking: '+fmt(6.169e-8/b.M,10)+' K',30,162);
setStats('<div>M: '+b.M+' M☉</div><div>r_s: '+fmt(b.rs/1000,1)+' km</div>');
badge('⚫ Black Hole · '+b.M+' M☉ · r_s='+fmt(b.rs/1000,1)+'km');SV('sbTime','—')},
onDown:function(){},
controls:function(){var b=STATE.blackhole;var h='<div class="sec"><h4>Black hole</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Mass</span><span>'+b.M+' M☉</span></div><input type="range" min="1" max="100" value="'+b.M+'" oninput="STATE.blackhole.M=parseInt(this.value);MODULES.blackhole.reset();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Grav lens strength</span><span>'+fmt(b.gravLens,1)+'</span></div><input type="range" min="0" max="3" step="0.1" value="'+b.gravLens+'" oninput="STATE.blackhole.gravLens=parseFloat(this.value);MODULES.blackhole.reset()"></div>';
h+='</div>';

/* ══════ 9. GRAVITATIONAL WAVES ══════ */
registerModule('gwaves',{title:'Gravitational Waves',icon:'🌊',desc:'Chirp waveform from binary merger.',init:function(){this.reset()},
reset:function(){var g=STATE.gwaves;g.t=0;g.chirp=[];g.strain=[];g.phase=0;g.phase_label='inspiral'},
tick:function(dt){STATE.time+=dt;var g=STATE.gwaves;if(!STATE.playing)return;
g.t+=dt*0.3;
// Chirp mass
var Mc=Math.pow(g.m1*g.m2,0.6)/Math.pow(g.m1+g.m2,0.2);
var McSec=Mc*M_SUN*G/Math.pow(C_LIGHT,3);
var tc=1;
var tau=Math.max(0.001,tc-g.t);
// Freq from PN
var f=Math.pow(5/(256*tau),3/8)/(Math.PI*McSec);
// Strain amplitude
var d_m=g.distance*1e6*PC;
var h0=(4/d_m)*Math.pow(McSec*C_LIGHT*C_LIGHT,5/3)*Math.pow(Math.PI*f,2/3);
g.freq=f;
g.amp=h0;
g.phase+=2*Math.PI*f*dt*0.01;
// Store
g.chirp.push({t:g.t,f:f,h:h0});
g.strain.push(Math.cos(g.phase)*h0*1e20);
if(g.chirp.length>2000){g.chirp.shift();g.strain.shift()}
if(g.t>tc){g.phase_label='merger';g.t=0}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var g=STATE.gwaves;
/* Waveform */
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('STRAIN h(t) — LIGO-style chirp',30,30);
var plotY=60,plotH=H*0.4;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(30,plotY,W-60,plotH);
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.lineWidth=1;ctx.strokeRect(30,plotY,W-60,plotH);
ctx.strokeStyle='#40e0ff';ctx.lineWidth=1.5;
ctx.beginPath();
var N=g.strain.length;
for(var i=0;i<N;i++){
  var x=30+i/N*(W-60);
  var y=plotY+plotH/2-g.strain[i]*plotH*0.4;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
ctx.fillStyle='#4090ff';ctx.font='10px monospace';
ctx.fillText('Time →',W/2-20,plotY+plotH+15);
/* Chirp frequency */
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('FREQUENCY CHIRP f(t)',30,plotY+plotH+50);
var fY=plotY+plotH+70,fH=H*0.25;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(30,fY,W-60,fH);
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.strokeRect(30,fY,W-60,fH);
if(g.chirp.length>1){
  var maxF=g.chirp[g.chirp.length-1].f;
  ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
  ctx.beginPath();
  g.chirp.forEach(function(p,i){
    var x=30+i/g.chirp.length*(W-60);
    var y=fY+fH-p.f/Math.max(maxF,1)*fH*0.9;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle='#ffd040';ctx.font='11px monospace';
  ctx.fillText('f = '+fmt(g.freq,1)+' Hz',W-150,fY+20);
}
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(20,20,280,0);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('m₁ = '+g.m1+' M☉,  m₂ = '+g.m2+' M☉',W-350,30);
ctx.fillText('Distance: '+g.distance+' Mpc',W-350,48);
var Mc=Math.pow(g.m1*g.m2,0.6)/Math.pow(g.m1+g.m2,0.2);
ctx.fillStyle='#ffd040';
ctx.fillText('Chirp mass: '+fmt(Mc,2)+' M☉',W-350,66);
setStats('<div>m₁: '+g.m1+' M☉</div><div>m₂: '+g.m2+' M☉</div><div>f: '+fmt(g.freq,1)+' Hz</div><div>h: '+fmt(g.amp,24)+'</div>');
badge('🌊 GW · '+g.m1+'+'+g.m2+' M☉');SV('sbTime',fmt(g.t,2)+'s');SV('sbVel',fmt(g.freq,1)+' Hz')},
onDown:function(){},
controls:function(){var g=STATE.gwaves;var h='<div class="sec"><h4>Binary parameters</h4>';
h+='<div class="ctrl"><div class="lbl"><span>m₁ (primary)</span><span>'+g.m1+' M☉</span></div><input type="range" min="5" max="100" value="'+g.m1+'" oninput="STATE.gwaves.m1=parseInt(this.value);MODULES.gwaves.reset()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>m₂ (secondary)</span><span>'+g.m2+' M☉</span></div><input type="range" min="5" max="80" value="'+g.m2+'" oninput="STATE.gwaves.m2=parseInt(this.value);MODULES.gwaves.reset()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Distance</span><span>'+g.distance+' Mpc</span></div><input type="range" min="40" max="2000" step="10" value="'+g.distance+'" oninput="STATE.gwaves.distance=parseInt(this.value)"></div>';
h+='</div>';

[['GW150914',36,29,410],['GW170817',1.46,1.27,40],['GW190521',85,66,5300]].forEach(function(p){
  h+='<div class="chip" onclick="STATE.gwaves.m1='+p[1]+';STATE.gwaves.m2='+p[2]+';STATE.gwaves.distance='+p[3]+';MODULES.gwaves.reset();renderLeftPanel()">'+p[0]+'</div>';
});
h+='</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Chirp mass</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">M_chirp = (m₁m₂)^(3/5)/(m₁+m₂)^(1/5)<br><br>Frequência (quadrupole):<br>f(t) = (5/(256τ))^(3/8) / (πM^5/8)<br><br>τ = t_coalescence − t<br><br>Strain: h ~ (4/d)·(Mc·c²)^(5/3)·(πf)^(2/3)</div></div>'}});

<script>
/* ══════ 10. EXOPLANET TRANSIT ══════ */
registerModule('exoplanet',{title:'Exoplanet Transit',icon:'🛸',desc:'Light curve of planet crossing star.',init:function(){this.build()},
build:function(){var e=STATE.exoplanet;e.data=[];e.phase=0;
var pl=EXOPLANETS[e.selected];
var duration=pl.period*0.1; // approx transit duration
for(var i=0;i<400;i++){
  var t=(i/400-0.5)*duration*2;
  var depth=pl.depth;
  // Transit shape: simplified trapezoidal
  var ingress=duration*0.1;
  var flux=1.0;
  if(Math.abs(t)<duration/2-ingress)flux=1-depth;
  else if(Math.abs(t)<duration/2)flux=1-depth*(1-(Math.abs(t)-(duration/2-ingress))/ingress);
  flux+=(Math.random()-0.5)*e.noise;
  e.data.push({t:t,flux:flux,model:flux-((Math.random()-0.5)*e.noise)});
}},
tick:function(dt){STATE.time+=dt;var e=STATE.exoplanet;e.phase+=dt*0.3},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,10);
var e=STATE.exoplanet;
var pl=EXOPLANETS[e.selected];
/* Star + planet visualization */
var cx=W/2,cy=H*0.3;
var starR=Math.min(W,H)*0.15;
var g=ctx.createRadialGradient(cx,cy,0,cx,cy,starR);
g.addColorStop(0,'#fff8d0');g.addColorStop(0.6,'#ffd040');g.addColorStop(1,'rgba(255,208,64,0.3)');
ctx.fillStyle=g;
ctx.beginPath();ctx.arc(cx,cy,starR,0,Math.PI*2);ctx.fill();
/* Planet transit */
var px=cx+Math.cos(e.phase)*starR*3;
var py=cy+Math.sin(e.phase*0.5)*starR*0.4;
var planetR=starR*Math.sqrt(pl.depth);
ctx.fillStyle='#201020';
ctx.beginPath();ctx.arc(px,py,planetR,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.stroke();
/* Light curve */
var lcX=40,lcY=H*0.55,lcW=W-80,lcH=H*0.38;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(lcX,lcY,lcW,lcH);
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.lineWidth=1;ctx.strokeRect(lcX,lcY,lcW,lcH);
/* Axes */
ctx.strokeStyle='rgba(64,144,255,.2)';
for(var i=0;i<=5;i++){
  var y=lcY+i*lcH/5;
  ctx.beginPath();ctx.moveTo(lcX,y);ctx.lineTo(lcX+lcW,y);ctx.stroke();
  ctx.fillStyle='#4858a8';ctx.font='9px monospace';
  ctx.fillText(fmt(1-(i*0.01),2),lcX-35,y+3);
}
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('RELATIVE FLUX',lcX,lcY-6);
/* Data */
ctx.fillStyle='#40e0ff';
e.data.forEach(function(d,i){
  var x=lcX+i/e.data.length*lcW;
  var y=lcY+lcH-(d.flux-0.98)/0.02*lcH;
  if(y>lcY&&y<lcY+lcH){ctx.fillRect(x-1,y-1,2,2)}
});
/* Model */
ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
ctx.beginPath();
e.data.forEach(function(d,i){
  var x=lcX+i/e.data.length*lcW;
  var y=lcY+lcH-(d.model-0.98)/0.02*lcH;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(20,20,260,120);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(20,20,260,120);
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('EXOPLANET TRANSIT',30,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText(pl.name,30,60);
ctx.fillText('Star: '+pl.star+' ('+pl.starT+' K)',30,76);
ctx.fillText('Period: '+pl.period+' days',30,92);
ctx.fillText('Radius: '+pl.radius+' R⊕',30,108);
ctx.fillText('Depth: '+fmt(pl.depth*100,2)+'%',30,124);
setStats('<div>Planet: '+pl.name+'</div><div>P: '+pl.period+' d</div><div>Depth: '+fmt(pl.depth*100,3)+'%</div>');
badge('🛸 '+pl.name+' · P='+pl.period+' d');SV('sbTime',fmt(e.phase,1));SV('sbVel','—')},
onDown:function(){},
controls:function(){var e=STATE.exoplanet;var h='<div class="sec"><h4>Planet</h4><div class="chip-row">';
EXOPLANETS.forEach(function(pl,i){
  h+='<div class="chip '+(e.selected===i?'active':'')+'" onclick="STATE.exoplanet.selected='+i+';MODULES.exoplanet.build();renderLeftPanel()">'+pl.name+'</div>';

return h},

/* ══════ 11. HR DIAGRAM ══════ */
registerModule('hr',{title:'HR Diagram',icon:'📈',desc:'Hertzsprung-Russell diagram.',init:function(){},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var h=STATE.hr;
/* Axes */
var px=80,py=60,pw=W-160,ph=H-140;
ctx.strokeStyle='#4090ff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(px,py+ph);ctx.lineTo(px,py);ctx.moveTo(px,py+ph);ctx.lineTo(px+pw,py+ph);ctx.stroke();
/* Grid + labels */
ctx.fillStyle='#4858a8';ctx.font='10px monospace';
/* X: Temperature (reversed) */
for(var T=30000;T>=3000;T-=3000){

}

/* Region labels */
if(h.showRegions){

  ctx.fillStyle='rgba(255,128,64,.15)';
  ctx.fillRect(px+pw*0.65,py+ph*0.15,pw*0.35,ph*0.3);
  ctx.fillStyle='rgba(255,128,64,.6)';

}
/* Stars */
HR_STARS.forEach(function(star){

  ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
});
/* Sun marker */
var sunX=px+(1-(5778-3000)/27000)*pw;
var sunY=py+(6-0)/10*ph;
ctx.strokeStyle='#ffd040';ctx.lineWidth=2;

ctx.fillText('Sun',sunX+10,sunY-10);

registerModule('cmb',{title:'CMB Power Spectrum',icon:'♨',desc:'Cosmic microwave background anisotropies.',init:function(){this.compute()},
compute:function(){var c=STATE.cmb;c.power=[];
// Approximate C_l^TT spectrum with peaks at l~220, 540, 810...
for(var l=2;l<=c.lmax;l++){
  var val=0;
  // Sachs-Wolfe plateau at low l
  if(l<20)val=1000/Math.pow(l,2)*3000;
  else{
    // Acoustic peaks
    var x=l/220;
    val=5000*Math.pow(Math.cos(x*Math.PI-Math.PI/2),2)*Math.exp(-l/2000)+500;
    // Damping tail
    val*=Math.exp(-Math.pow(l/1500,2));
  }
  val+=(Math.random()-0.5)*100;
  c.power.push({l:l,cl:Math.max(0,val)});
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var c=STATE.cmb;
/* CMB sky map (top) */
var skyY=30,skyH=H*0.35;
ctx.fillStyle='#050714';ctx.fillRect(30,skyY,W-60,skyH);
// Generate CMB-like noise
for(var i=0;i<40;i++)for(var j=0;j<20;j++){
  var v=0;
  for(var k=1;k<6;k++){
    v+=Math.sin(i*k*0.3+Math.cos(j*k*0.5))*0.5/k;
  }
  var hue=200+v*100;
  var col='hsl('+hue+',60%,'+(50+v*20)+'%)';
  ctx.fillStyle=col;
  ctx.fillRect(30+i*(W-60)/40,skyY+j*skyH/20,(W-60)/40+1,skyH/20+1);
}
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('CMB TEMPERATURE FLUCTUATIONS (simulated)',30,skyY-8);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('T = 2.72548 K',30,skyY+skyH+20);
/* Power spectrum */
var px=60,py=skyY+skyH+60,pw=W-120,ph=H-py-80;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(px,py,pw,ph);
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.lineWidth=1;ctx.strokeRect(px,py,pw,ph);
/* Axes */
ctx.strokeStyle='rgba(64,144,255,.2)';
for(var l=0;l<=1000;l+=200){
  var x=px+(l/1000)*pw;
  ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x,py+ph);ctx.stroke();
  ctx.fillStyle='#4858a8';ctx.font='9px monospace';
  ctx.fillText(l,x-8,py+ph+15);
}
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('Multipole ℓ',px+pw/2-40,py+ph+35);
/* Power curve */
ctx.strokeStyle='#ffd040';ctx.lineWidth=2.5;
ctx.beginPath();
c.power.forEach(function(p,i){
  var x=px+(p.l/c.lmax)*pw;
  var y=py+ph-Math.min(p.cl/5000,1)*ph*0.95;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Peak annotations */
ctx.fillStyle='#ff60a0';ctx.font='10px monospace';
ctx.fillText('1st peak',px+220/1000*pw-15,py+20);
ctx.fillText('2nd peak',px+540/1000*pw-15,py+35);
ctx.fillText('3rd peak',px+810/1000*pw-15,py+50);
setStats('<div>lmax: '+c.lmax+'</div><div>T: 2.72548 K</div>');
badge('♨ CMB · '+c.lmax+' multipoles');SV('sbTime','—')},

registerModule('galaxy',{title:'Galaxy Dynamics',icon:'🌠',desc:'Spiral galaxy with dark matter halo.',init:function(){this.reset()},
reset:function(){var g=STATE.galaxy;g.particles=[];
for(var i=0;i<g.n;i++){
  var r=0.05+Math.pow(Math.random(),0.5)*1.0;
  var a=Math.random()*Math.PI*2;
  // Spiral arms
  if(g.mode==='spiral'){
    var arm=Math.floor(Math.random()*2);
    a+=arm*Math.PI+Math.log(r+0.1)*2;
  }
  var noise=(Math.random()-0.5)*0.3;
  g.particles.push({
    r:r,a:a,
    x:Math.cos(a+noise)*r,
    y:Math.sin(a+noise)*r,
    vz:randn()*0.03,
    hue:(r*150+230)%360
  });
}
g.rotation=0},
tick:function(dt){STATE.time+=dt;var g=STATE.galaxy;if(!STATE.playing)return;
// Differentially rotate (flat rotation curve)
g.particles.forEach(function(p){
  var r=Math.sqrt(p.x*p.x+p.y*p.y)||0.01;
  var v=1/Math.sqrt(r+0.1);
  var omega=v/r;
  var angle=omega*dt*0.3;
  var ca=Math.cos(angle),sa=Math.sin(angle);
  var nx=p.x*ca-p.y*sa;
  var ny=p.x*sa+p.y*ca;
  p.x=nx;p.y=ny;
});
g.rotation+=dt*0.3},

registerModule('spectro',{title:'Stellar Spectroscopy',icon:'🌈',desc:'Spectral classification with absorption lines.',init:function(){this.build()},
build:function(){var s=STATE.spectro;
// Spectral types: O B A F G K M
var types={
  'O5V':{T:40000,color:'#a0c0ff',lines:[400,410,434,447,486,656]},
  'B5V':{T:15500,color:'#b8d0ff',lines:[393,397,410,434,447,486,656]},
  'A0V':{T:9500,color:'#d0e0ff',lines:[393,397,410,434,447,486,656]},
  'F0V':{T:7200,color:'#f8f8ff',lines:[393,397,410,434,438,486,518,589,656]},
  'G2V':{T:5778,color:'#fff8d0',lines:[393,397,410,434,438,486,518,589,656,777]},
  'K0V':{T:5250,color:'#ffe8c0',lines:[393,397,410,422,434,438,486,518,589,656,777]},
  'M0V':{T:3800,color:'#ffb080',lines:[410,434,486,518,589,656,660,706,766,777]}
};
s.template=types[s.type]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var s=STATE.spectro;
var t=s.template;
/* Continuous spectrum (rainbow) */
var sx=40,sy=80,sw=W-80,sh=H*0.4;
// Spectral range: 380-780 nm
var minWl=380,maxWl=780;
function wlToRGB(wl){
  var r=0,g=0,b=0;
  if(wl>=380&&wl<440){r=-(wl-440)/60;b=1}
  else if(wl<490){g=(wl-440)/50;b=1}
  else if(wl<510){g=1;b=-(wl-510)/20}
  else if(wl<580){r=(wl-510)/70;g=1}
  else if(wl<645){r=1;g=-(wl-645)/65}
  else if(wl<780){r=1}
  return [Math.max(0,r),Math.max(0,g),Math.max(0,b)];
}
for(var i=0;i<sw;i++){
  var wl=minWl+(i/sw)*(maxWl-minWl);
  var rgb=wlToRGB(wl);
  // Blackbody spectrum scaled to temp
  var intensity=blackbodyRadiance(wl*1e-9,t.T)/blackbodyPeakRadiance(t.T);
  intensity=clamp(intensity,0,1);
  // Apply absorption lines
  if(s.showLines){
    t.lines.forEach(function(line){
      var d=Math.abs(wl-line);
      if(d<3)intensity*=(0.1+d/3*0.9);
    });
  }
  ctx.fillStyle='rgb('+Math.floor(rgb[0]*255*intensity)+','+Math.floor(rgb[1]*255*intensity)+','+Math.floor(rgb[2]*255*intensity)+')';
  ctx.fillRect(sx+i,sy,1,sh);
}
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(sx,sy,sw,sh);
/* Wavelength markers */
ctx.fillStyle='#d8e0ff';ctx.font='10px monospace';
for(var wl=400;wl<=750;wl+=50){
  var x=sx+(wl-minWl)/(maxWl-minWl)*sw;
  ctx.fillText(wl+'nm',x-15,sy+sh+15);
}
/* Line labels */
if(s.showLines){
  t.lines.forEach(function(wl){
    var x=sx+(wl-minWl)/(maxWl-minWl)*sw;
    ctx.strokeStyle='#ff60a0';ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,sy-15);ctx.lineTo(x,sy);ctx.stroke();
    ctx.setLineDash([]);
  });
}
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('SPECTRAL TYPE: '+s.type+'  ·  T = '+t.T+' K',sx,sy-25);
/* Absorption spectrum (2D band) */
var bandY=sy+sh+60;
ctx.fillStyle='#050714';
ctx.fillRect(sx,bandY,sw,60);
for(var i=0;i<sw;i++){
  var wl2=minWl+(i/sw)*(maxWl-minWl);
  var intensity2=blackbodyRadiance(wl2*1e-9,t.T)/blackbodyPeakRadiance(t.T);
  if(s.showLines){
    t.lines.forEach(function(line){
      var d=Math.abs(wl2-line);
      if(d<3)intensity2*=(0.1+d/3*0.9);
    });
  }
  var gray=Math.floor(clamp(intensity2,0,1)*255);
  ctx.fillStyle='rgb('+gray+','+gray+','+gray+')';
  ctx.fillRect(sx+i,bandY,1,60);
}
ctx.strokeStyle='#4090ff';ctx.strokeRect(sx,bandY,sw,60);
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('INTENSITY PLOT (absorption lines visible)',sx,bandY-8);
/* Line list */
var listY=bandY+90;
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('KEY ABSORPTION LINES',sx,listY);
ctx.font='10px monospace';
var wls=t.lines;
wls.forEach(function(wl,i){
  var y=listY+20+i*14;
  ctx.fillStyle='#d8e0ff';
  ctx.fillText(wl+' nm',sx,y);
  var lbl='—';
  if(wl===656.3)lbl='H-α';
  else if(wl===486.1)lbl='H-β';
  else if(wl===434)lbl='H-γ';
  else if(wl===410)lbl='H-δ';
  else if(wl===589)lbl='Na-D';
  else if(wl===518)lbl='Mg-b';
  else if(wl===393)lbl='Ca-K';
  else if(wl===397)lbl='Ca-H';
  else if(wl===777)lbl='O-I';
  else if(wl===438)lbl='Fe';
  ctx.fillStyle='#ffd040';
  ctx.fillText(lbl,sx+80,y);
});
setStats('<div>Type: '+s.type+'</div><div>T: '+t.T+' K</div><div>Lines: '+t.lines.length+'</div>');
badge('🌈 '+s.type+' · T='+t.T+'K');SV('sbTime','—');SV('sbVel','T='+t.T+'K')},
onDown:function(){},
controls:function(){var s=STATE.spectro;var h='<div class="sec"><h4>Spectral type</h4><div class="chip-row">';
['O5V','B5V','A0V','F0V','G2V','K0V','M0V'].forEach(function(t){
  h+='<div class="chip '+(s.type===t?'active':'')+'" onclick="STATE.spectro.type=\''+t+'\';MODULES.spectro.build();renderLeftPanel()">'+t+'</div>';

return h},

/* ══════ 15. RADIO INTERFEROMETRY ══════ */
registerModule('interfero',{title:'Radio Interferometry',icon:'📡',desc:'Aperture synthesis with multiple telescopes.',init:function(){this.compute()},
compute:function(){var r=STATE.interfero;
r.uvPoints=[];
if(r.mode==='2'){
  // 2 telescopes
  for(var i=0;i<r.nTelescopes;i++){
    for(var j=i+1;j<r.nTelescopes;j++){
      var a1=i/r.nTelescopes*2*Math.PI;
      var a2=j/r.nTelescopes*2*Math.PI;
      var x1=Math.cos(a1)*r.baseline/2,y1=Math.sin(a1)*r.baseline/2;
      var x2=Math.cos(a2)*r.baseline/2,y2=Math.sin(a2)*r.baseline/2;
      var u=(x2-x1)/0.21; // wavelength 21cm
      var v=(y2-y1)/0.21;
      r.uvPoints.push({u:u,v:v,amp:1});
    }
  }
}else{
  for(var i=0;i<100;i++){
    var u=(Math.random()-0.5)*2*r.baseline/0.21;
    var v=(Math.random()-0.5)*2*r.baseline/0.21;
    r.uvPoints.push({u:u,v:v,amp:Math.random()});
  }
}
/* Fringes */
r.fringes=[];
for(var i=0;i<200;i++){
  var x=i/200;
  r.fringes.push(Math.cos(2*Math.PI*x*r.baseline*Math.sin(r.angle*Math.PI/180)*1000/0.21));
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,15);
var r=STATE.interfero;
/* Array configuration */
var ax=W*0.25,ay=H*0.4;
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('ARRAY CONFIGURATION',ax-150,60);
var arrR=Math.min(W,H)*0.18;
for(var i=0;i<r.nTelescopes;i++){
  var a=i/r.nTelescopes*2*Math.PI;
  var x=ax+Math.cos(a)*arrR;
  var y=ay+Math.sin(a)*arrR;
  ctx.fillStyle='#40e0ff';
  ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#4090ff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(x,y);ctx.stroke();
}
/* UV coverage */
var ux=W*0.65,uy=H*0.4;
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('UV COVERAGE (synthesized aperture)',ux-180,60);
var uScale=Math.min(W,H)*0.15/Math.max(r.baseline/0.21,1);
r.uvPoints.forEach(function(p){
  var x=ux+p.u*uScale;
  var y=uy-p.v*uScale;
  ctx.fillStyle='rgba(64,224,255,'+(0.3+p.amp*0.7)+')';
  ctx.fillRect(x-1,y-1,2,2);
  ctx.fillStyle='rgba(64,224,255,'+(0.3+p.amp*0.7)+')';
  ctx.fillRect(ux-p.u*uScale-1,uy+p.v*uScale-1,2,2);
});
/* Fringes */
var fy=H*0.75;
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('FRINGE PATTERN (baseline '+r.baseline+'m, λ=21cm)',40,fy-8);
ctx.fillStyle='rgba(5,7,20,.6)';ctx.fillRect(40,fy,W-80,80);
ctx.strokeStyle='#40e0ff';ctx.lineWidth=1.5;
ctx.beginPath();
r.fringes.forEach(function(v,i){
  var x=40+i/r.fringes.length*(W-80);
  var y=fy+40-v*30;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
setStats('<div>Telescopes: '+r.nTelescopes+'</div><div>Baseline: '+r.baseline+'m</div><div>UV points: '+r.uvPoints.length+'</div>');
badge('📡 Interferometry · '+r.nTelescopes+' dishes');SV('sbTime','—');SV('sbVel',r.baseline+'m')},
onDown:function(){},
controls:function(){var r=STATE.interfero;var h='<div class="sec"><h4>Telescopes</h4>';
h+='<div class="ctrl"><div class="lbl"><span>N dishes</span><span>'+r.nTelescopes+'</span></div><input type="range" min="2" max="12" value="'+r.nTelescopes+'" oninput="STATE.interfero.nTelescopes=parseInt(this.value);MODULES.interfero.compute();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Baseline</span><span>'+r.baseline+' m</span></div><input type="range" min="10" max="500" value="'+r.baseline+'" oninput="STATE.interfero.baseline=parseInt(this.value);MODULES.interfero.compute();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Source angle</span><span>'+r.angle+'°</span></div><input type="range" min="0" max="90" value="'+r.angle+'" oninput="STATE.interfero.angle=parseInt(this.value);MODULES.interfero.compute()"></div>';
h+='</div>';
h+='<div class="sec"><h4>Mode</h4><div class="chip-row">';
['2','aperture'].forEach(function(m){
  h+='<div class="chip '+(r.mode===m?'active':'')+'" onclick="STATE.interfero.mode=\''+m+'\';MODULES.interfero.compute();renderLeftPanel()">'+(m==='2'?'2-element':'Aperture synth')+'</div>';
});
h+='</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Interferometry</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Resolução: θ = λ/B<br><br>Coordenadas UV:<br>u = B_x/λ, v = B_y/λ<br><br>Visibilidade = FT da imagem<br><br>N telescópios → N(N−1)/2 baselines<br><br>ALMA: até 66 antenas, km-baselines</div></div>'}});

registerModule('distance',{title:'Cosmic Distance Ladder',icon:'📏',desc:'From parallax to supernovae.',init:function(){this.build()},
build:function(){var d=STATE.distance;
d.steps=[
  {name:'Radar (Solar System)',range:[1.5e8,1e13],method:'Tempo de eco de radar',unit:'m',color:'#40e0ff'},
  {name:'Parallax (Hipparcos)',range:[1e13,1e17],method:'θ = 1 AU/d',unit:'m',color:'#4090ff'},
  {name:'Parallax (Gaia)',range:[1e15,1e19],method:'μas parallax',unit:'m',color:'#a060ff'},
  {name:'Main Sequence Fitting',range:[1e17,1e20],method:'HR diagram matching',unit:'m',color:'#ff60a0'},
  {name:'Cepheids',range:[1e18,1e23],method:'P-L relation',unit:'m',color:'#ffd040'},
  {name:'Tully-Fisher',range:[1e20,1e23],method:'L ∝ v_rot⁴',unit:'m',color:'#ff8040'},
  {name:'Type Ia SNe',range:[1e22,1e26],method:'Standard candle',unit:'m',color:'#ff4060'},
  {name:'Redshift (H₀)',range:[1e24,1e27],method:'v = H₀·d',unit:'m',color:'#40ff90'}
]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,16);
var d=STATE.distance;
/* Log scale from 1e8 to 1e27 meters */
var minLog=8,maxLog=27;
function logToX(log){return 60+(log-minLog)/(maxLog-minLog)*(W-120)}
/* Axis */
var ax=60,ay=H-80,aw=W-120;
ctx.strokeStyle='#4090ff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+aw,ay);ctx.stroke();
/* Labels */
ctx.fillStyle='#4858a8';ctx.font='10px monospace';
for(var l=8;l<=27;l+=2){
  var x=logToX(l);
  ctx.beginPath();ctx.moveTo(x,ay);ctx.lineTo(x,ay+8);ctx.stroke();
  ctx.fillText('10^'+l,x-15,ay+22);
}
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('Distance (m, log scale)',W/2-80,ay+45);
/* Steps */
d.steps.forEach(function(s,i){
  var l1=Math.log10(s.range[0]);
  var l2=Math.log10(s.range[1]);
  var x1=logToX(l1),x2=logToX(l2);
  var y=60+i*35;
  ctx.fillStyle=s.color+'44';
  ctx.fillRect(x1,y,x2-x1,20);
  ctx.strokeStyle=s.color;ctx.lineWidth=2;
  ctx.strokeRect(x1,y,x2-x1,20);
  ctx.fillStyle=s.color;ctx.font='bold 11px monospace';
  ctx.fillText(s.name,x1+5,y+15);
  ctx.fillStyle='#d8e0ff';ctx.font='10px monospace';
  ctx.fillText(s.method,x2+10,y+15);
});
/* Reference markers */
var refs=[
  {log:1.496e11,label:'1 AU',color:'#40e0ff'},
  {log:3.086e16,label:'1 pc',color:'#40e0ff'},
  {log:9.461e15,label:'1 ly',color:'#40e0ff'},
  {log:1e21,label:'Milky Way',color:'#40e0ff'},
  {log:1e25,label:'Cosmic horizon',color:'#40e0ff'}
];
refs.forEach(function(r){
  var x=logToX(Math.log10(r.log));
  ctx.strokeStyle=r.color;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x,ay);ctx.lineTo(x,ay-380);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=r.color;ctx.font='9px monospace';
  ctx.fillText(r.label,x+3,ay-385);
});
setStats('<div>Steps: '+d.steps.length+'</div><div>Range: 10^8 - 10^27 m</div>');
badge('📏 Distance Ladder · '+d.steps.length+' rungs');SV('sbTime','—');SV('sbVel','—')},
onDown:function(){},
controls:function(){var d=STATE.distance;var h='<div class="sec"><h4>Methods</h4><div class="kv">';
d.steps.forEach(function(s){
  h+='<div class="row"><span class="k">'+s.name+'</span><span class="v">'+fmt(Math.log10(s.range[0]),1)+'-'+fmt(Math.log10(s.range[1]),1)+' log10 m</span></div>';
});
h+='</div></div>';
h+='<div class="sec"><h4>Famous distances</h4><div style="font-size:.6rem;color:var(--tx2);font-family:var(--mono);line-height:1.7">Moon: 384,400 km<br>Sun: 1 AU = 1.496×10⁸ km<br>Proxima Cen: 4.24 ly<br>Galactic center: 26,000 ly<br>Andromeda: 2.5 Mly<br>Horizon: 46 Gly<br>CMB: 13.8 Gyr</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Distance Ladder</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Cada degrau calibra o próximo:<br><br>Parallax: d[pc] = 1/π[arcsec]<br>Módulo: m−M = 5 log₁₀(d/10)<br>Cepheids: P-L relation<br>SNe Ia: standard candle<br>Redshift: v = H₀·d</div></div>'}});

/* ══════ 17. BIG BANG NUCLEO ══════ */
registerModule('bbn',{title:'Big Bang Nucleosynthesis',icon:'⚛',desc:'Primordial element formation.',init:function(){this.compute()},
compute:function(){var b=STATE.bbn;b.abundances={};
// Simplified BBN yields at ~200s
// Y_p (helium mass fraction), D/H, He-3/H, Li-7/H
var eta=6.1e-10;
var Omega_b=0.0224;
// Empirical fits from standard BBN
b.abundances={
  'H-1':0.752,       // mass fraction
  'He-4':0.248,      // Y_p
  'H-2':2.5e-5,      // D/H
  'He-3':1.0e-5,     // He-3/H
  'Li-7':5.0e-10     // Li-7/H
};
b.temperatureAt1s=1e10;
b.temperatureAt200s=1e9/200;
b.neutronFrac=0.15;
b.freezeOutTemp=0.8e9; // 0.8 MeV → 0.8e9 K
// Timeline
b.timeline=[
  {t:1e-43,name:'Planck epoch'},
  {t:1e-36,name:'Inflation'},
  {t:1e-12,name:'Electroweak'},
  {t:1e-6,name:'Quark confinement'},
  {t:1,name:'Neutrino decoupling'},
  {t:200,name:'BBN'},
  {t:1e5,name:'Matter-radiation equality'},
  {t:3.8e5,name:'Recombination (CMB)'},
  {t:1e13,name:'First stars'},
  {t:4.3e17,name:'Today'}
]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,17);
var b=STATE.bbn;
/* Timeline */
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('COSMIC TIMELINE',30,30);
var ty=50;
b.timeline.forEach(function(s,i){
  var y=ty+i*20;
  var x=30;
  ctx.fillStyle='#40e0ff';ctx.font='bold 10px monospace';
  ctx.fillText(fmtLogTime(s.t),x,y);
  ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
  ctx.fillText(s.name,x+90,y);
});
/* Abundance bars */
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('PRIMORDIAL ABUNDANCES (BBN)',W*0.45,30);
var ax=W*0.45,ay=50;
for(var el in b.abundances){
  var ab=b.abundances[el];
  var y=ay+Object.keys(b.abundances).indexOf(el)*40;
  ctx.fillStyle='#d8e0ff';ctx.font='bold 11px monospace';
  ctx.fillText(el,ax,y+15);
  ctx.fillStyle='#40e0ff';ctx.font='10px monospace';
  ctx.fillText(fmt(ab,10),ax+60,y+15);
  // Bar (log scale)
  var logV=Math.log10(Math.max(ab,1e-12))+12;
  var barW=logV/12*(W*0.4);
  ctx.fillStyle='#40e0ff';
  ctx.fillRect(ax+140,y+5,barW,15);
}
/* Details */
var dy=H*0.55;
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('PHYSICAL CONTEXT',30,dy);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('T at t=1s: '+b.temperatureAt1s.toExponential(2)+' K',30,dy+25);
ctx.fillText('T at BBN (t=200s): '+b.temperatureAt200s.toExponential(2)+' K',30,dy+42);
ctx.fillText('Neutron fraction at freeze-out: '+b.neutronFrac,30,dy+59);
ctx.fillText('Baryon-to-photon ratio η: 6.1×10⁻¹⁰',30,dy+76);
ctx.fillText('Baryon density Ω_b h²: 0.0224',30,dy+93);
ctx.fillText('Freeze-out temp: 0.8 MeV ≈ 10¹⁰ K',30,dy+110);
/* Reaction chain */
var ry=dy+150;
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('REACTION CHAIN',30,ry);
ctx.fillStyle='#ffd040';ctx.font='11px monospace';
ctx.fillText('p + n → D + γ',30,ry+25);
ctx.fillText('D + p → ³He + γ',30,ry+42);
ctx.fillText('D + D → ³He + n  or  T + p',30,ry+59);
ctx.fillText('³He + n → T + p',30,ry+76);
ctx.fillText('T + D → ⁴He + n',30,ry+93);
ctx.fillStyle='#40ff90';
ctx.fillText('→ ⁴He bottleneck stops Li, Be, B production',30,ry+118);
function fmtLogTime(t){
  if(t<1)return fmt(t,2)+' s';
  if(t<60)return fmt(t,0)+' s';
  if(t<3600)return fmt(t/60,1)+' min';
  if(t<86400)return fmt(t/3600,1)+' hr';
  if(t<1e6*86400)return fmt(t/86400,0)+' days';
  if(t<1e10*86400)return fmt(t/(1e6*86400),0)+' Myr';
  return fmt(t/(1e9*86400),1)+' Gyr';
}
setStats('<div>H: '+fmt(b.abundances['H-1']*100,2)+'%</div><div>He: '+fmt(b.abundances['He-4']*100,2)+'%</div><div>Li-7: '+b.abundances['Li-7'].toExponential(2)+'</div>');
badge('⚛ BBN · He-4 '+(b.abundances['He-4']*100).toFixed(1)+'%');SV('sbTime','—');SV('sbVel','T~10⁹K')},
onDown:function(){},
controls:function(){var b=STATE.bbn;var h='<div class="sec"><h4>Timeline</h4><div style="font-size:.6rem;color:var(--tx2);font-family:var(--mono);line-height:1.7">Planck: 10⁻⁴³ s<br>Inflação: 10⁻³⁶ s<br>EW: 10⁻¹² s<br>QCD: 10⁻⁶ s<br>ν decoupling: 1 s<br>BBN: 200 s<br>CMB: 380,000 yr<br>Estrelas: 200 Myr<br>Hoje: 13.8 Gyr</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>BBN</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Alpher, Bethe, Gamow (1948)<br><br>Y_p (He-4 mass fraction):<br>Y ≈ 2n/(n+p)<br><br>Neutron/proton freeze-out:<br>n/p = exp(−Δm·c²/kT_f)<br>≈ 1/7 após decaimento<br><br>BBN testa η com precisão incrível.</div></div>'}});
</script>
<script>
/* ══════ 18. SOLAR SAIL ══════ */
registerModule('sails',{title:'Solar Sail',icon:'⛵',desc:'Radiation pressure propulsion.',init:function(){this.reset()},
reset:function(){var s=STATE.sails;s.vel=0;s.dist=1;s.trail=[];s.thrustForce=0},
tick:function(dt){STATE.time+=dt;var s=STATE.sails;if(!STATE.playing)return;
// Radiation pressure P = S/c * (1+r) at 1 AU
var P=1361/C_LIGHT; // N/m²
var force=P*s.area*(1+s.r)*Math.pow(1/s.dist,2);
// Tilt angle: cos²θ effective thrust
var theta=s.sailAngle*Math.PI/180;
var accel=force*Math.cos(theta)*Math.cos(theta)/s.mass;
s.thrustForce=force;
// Escape Sun
var gForce=G*M_SUN*s.mass/Math.pow(s.dist*AU,2);
var gravAccel=gForce/s.mass;
// Net
var netAccel=(accel-gravAccel);
// Distance update
s.vel+=netAccel*dt*1e5;
s.dist+=s.vel*dt*1e-11;
s.trail.push(s.dist);
if(s.trail.length>3000)s.trail.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,18);
var s=STATE.sails;
/* Sun */
var sunX=40,sunY=H/2;
var g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,60);
g.addColorStop(0,'#fff8d0');g.addColorStop(0.4,'#ffd040');g.addColorStop(1,'rgba(255,208,64,0)');
ctx.fillStyle=g;ctx.beginPath();ctx.arc(sunX,sunY,60,0,Math.PI*2);ctx.fill();
/* Radiation rays */
ctx.strokeStyle='rgba(255,208,64,.2)';
for(var i=0;i<15;i++){
  var y=sunY-200+i*30;
  ctx.beginPath();ctx.moveTo(sunX+50,y);ctx.lineTo(W-50,y);ctx.stroke();
}
/* Sail position */
var sx=200+(W-250)*(s.dist-1)/20;
sx=Math.min(sx,W-80);
var sy=H/2;
/* Sail */
ctx.save();
ctx.translate(sx,sy);
ctx.rotate(-s.sailAngle*Math.PI/180);
ctx.fillStyle='rgba(192,208,255,0.7)';
ctx.strokeStyle='#4090ff';ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-30,0);ctx.lineTo(0,-30);ctx.lineTo(30,0);ctx.lineTo(0,30);ctx.closePath();
ctx.fill();ctx.stroke();
// Grid lines
ctx.strokeStyle='rgba(64,144,255,.5)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(0,30);ctx.moveTo(-30,0);ctx.lineTo(30,0);ctx.stroke();
ctx.restore();
/* Force vectors */
ctx.strokeStyle='#40ff90';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+50,sy);ctx.stroke();
ctx.fillStyle='#40ff90';ctx.font='10px monospace';
ctx.fillText('Thrust',sx+55,sy+4);
ctx.strokeStyle='#ff4060';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-50,sy);ctx.stroke();
ctx.fillStyle='#ff4060';
ctx.fillText('Gravity',sx-100,sy+4);
/* Trail */
if(s.trail.length>1){
  ctx.strokeStyle='rgba(64,224,255,.3)';ctx.lineWidth=1;
  ctx.beginPath();
  s.trail.forEach(function(d,i){
    var x=200+(W-250)*(d-1)/20;
    if(x<10||x>W-10)return;
    var y=sy+30;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(W-280,20,260,140);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(W-280,20,260,140);
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('SOLAR SAIL',W-270,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('Area: '+s.area+' m²',W-270,60);
ctx.fillText('Mass: '+s.mass+' kg',W-270,76);
ctx.fillText('Distance: '+fmt(s.dist,3)+' AU',W-270,92);
ctx.fillText('Velocity: '+fmt(s.vel,3)+' km/s',W-270,108);
ctx.fillStyle='#40ff90';
ctx.fillText('Force: '+fmt(s.thrustForce*1000,3)+' mN',W-270,128);
ctx.fillText('Pressure: '+fmt(1361/C_LIGHT*1e6,2)+' μPa',W-270,148);
setStats('<div>Dist: '+fmt(s.dist,3)+' AU</div><div>Vel: '+fmt(s.vel,3)+' km/s</div><div>Force: '+fmt(s.thrustForce*1000,2)+' mN</div>');
badge('⛵ Solar Sail · '+fmt(s.dist,2)+' AU');SV('sbTime',fmt(s.dist,2)+'AU');SV('sbVel',fmt(s.vel,2)+' km/s')},
onDown:function(){},
controls:function(){var s=STATE.sails;var h='<div class="sec"><h4>Sail</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Area</span><span>'+s.area+' m²</span></div><input type="range" min="100" max="100000" step="100" value="'+s.area+'" oninput="STATE.sails.area=parseInt(this.value);renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Mass</span><span>'+s.mass+' kg</span></div><input type="range" min="10" max="1000" step="10" value="'+s.mass+'" oninput="STATE.sails.mass=parseInt(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Reflectivity r</span><span>'+fmt(s.r,2)+'</span></div><input type="range" min="0" max="1" step="0.05" value="'+s.r+'" oninput="STATE.sails.r=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Sail angle</span><span>'+s.sailAngle+'°</span></div><input type="range" min="0" max="90" value="'+s.sailAngle+'" oninput="STATE.sails.sailAngle=parseInt(this.value);renderLeftPanel()"></div>';
h+='</div>';
h+='<div class="sec"><h4>Missions</h4><div class="chip-row">';
[['IKAROS',200,315],['LightSail-2',32,5],['Breakthrough',100000,1]].forEach(function(p){
  h+='<div class="chip" onclick="STATE.sails.area='+p[1]+';STATE.sails.mass='+p[2]+';MODULES.sails.reset();renderLeftPanel()">'+p[0]+'</div>';
});
h+='</div></div>';
h+='<button class="btn primary full" onclick="MODULES.sails.reset()">↺ Reset</button>';
return h},
