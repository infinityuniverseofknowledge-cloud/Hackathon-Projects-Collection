registerModule('elevator',{title:'Space Elevator',icon:'🏗',desc:'Tether dynamics and stress analysis.',init:function(){this.compute()},
compute:function(){var e=STATE.elevator;e.stress=[];
// Calculate stress profile along tether
var omega=7.292115e-5;
for(var i=0;i<100;i++){
  var h=(i/100)*e.L*1000;
  var r=R_EARTH+h;
  var g=G*M_EARTH/(r*r);
  var cent=omega*omega*r;
  // Net force per unit length
  var stress=(g-cent)*1000; // Pa per kg/m
  e.stress.push({h:h,r:r,stress:stress,grav:g,cent:cent});
}
/* Fixed point at GEO */
e.geoAlt=Math.pow(G*M_EARTH/(omega*omega),1/3)-R_EARTH;
/* Climbing time */
e.climbTime=e.h*1000/e.climberSpeed/(86400*365.25);
/* Tension max */
e.maxStress=Math.max.apply(null,e.stress.map(function(s){return Math.abs(s.stress)}))},
tick:function(dt){STATE.time+=dt;var e=STATE.elevator;if(!STATE.playing)return;
e.climber=(e.climber+dt*e.climberSpeed/1000)%e.h},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,19);
var e=STATE.elevator;
/* Earth */
var earthX=W*0.5,earthY=H-40;
var earthR=Math.min(W,H)*0.35;
var eg=ctx.createRadialGradient(earthX-20,earthY-20,0,earthX,earthY,earthR);
eg.addColorStop(0,'#60a0d8');
eg.addColorStop(0.5,'#2a5a8a');
eg.addColorStop(1,'#102040');
ctx.fillStyle=eg;
ctx.beginPath();ctx.arc(earthX,earthY,earthR,Math.PI,0);ctx.closePath();ctx.fill();
/* Elevator cable */
var cableX=earthX;
var cableTopY=20;
ctx.strokeStyle='#40ff90';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(cableX,earthY-earthR);ctx.lineTo(cableX,cableTopY);ctx.stroke();
/* Climber */
var climberY=earthY-earthR+(cableTopY-(earthY-earthR))*(e.climber/e.h);
ctx.fillStyle='#ffd040';
ctx.fillRect(cableX-6,climberY,12,16);
ctx.fillStyle='#020108';
ctx.font='bold 8px monospace';ctx.textAlign='center';
ctx.fillText('▲',cableX,climberY+11);
ctx.textAlign='left';
/* Labels */
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('GEO ('+fmt(e.geoAlt/1000,0)+' km)',cableX+10,earthY-earthR-200);
ctx.fillText('Space elevator top',cableX+10,cableTopY+15);
ctx.fillStyle='#d8e0ff';ctx.font='10px monospace';
ctx.fillText('Surface',cableX+10,earthY-earthR+15);
/* Stress profile */
var sx=W*0.7,sy=60,sw=W*0.25,sh=H-150;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(sx,sy,sw,sh);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(sx,sy,sw,sh);
ctx.fillStyle='#4090ff';ctx.font='bold 11px monospace';
ctx.fillText('STRESS PROFILE',sx,sy-6);
/* Plot */
ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
ctx.beginPath();
e.stress.forEach(function(s,i){
  var y=sy+(i/e.stress.length)*sh;
  var x=sx+sw/2+(s.stress/1e6)*sw/2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Geo marker */
var geoSy=sy+(e.geoAlt*1000/(e.L*1000))*sh;
ctx.strokeStyle='#40e0ff';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(sx,geoSy);ctx.lineTo(sx+sw,geoSy);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#40e0ff';ctx.font='9px monospace';
ctx.fillText('GEO',sx+sw-30,geoSy-3);
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(20,20,220,180);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(20,20,220,180);
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('ELEVATOR STATS',30,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';

ctx.fillText('Cable length: '+e.L+' km',30,92);

registerModule('rover',{title:'Mars Rover',icon:'🚙',desc:'Navigate Martian terrain with slopes.',init:function(){this.reset()},
reset:function(){var r=STATE.rover;r.x=0;r.z=0;r.traverse=0;r.battery=100;r.samples=[];r.speed=0;
r.terrain=[];
for(var i=0;i<100;i++){
  var row=[];
  for(var j=0;j<100;j++){
    var h=Math.sin(i*0.15)*2+Math.cos(j*0.1)*1.5+Math.sin((i+j)*0.05)*1+randn()*0.3;
    row.push(h);
  }
  r.terrain.push(row);
}},
tick:function(dt){STATE.time+=dt;var r=STATE.rover;if(!STATE.playing)return;
// Auto-navigate: move forward avoiding steep slopes
var ahead=terrainAt(r.x+Math.cos(r.yaw)*1,r.z+Math.sin(r.yaw)*1);
var here=terrainAt(r.x,r.z);
r.slope=Math.abs(ahead-here)*90;
if(r.slope>25)r.yaw+=(Math.random()-0.5)*0.5;
r.speed=clamp(2-r.slope*0.05,0.2,2);
r.x+=Math.cos(r.yaw)*r.speed*dt;
r.z+=Math.sin(r.yaw)*r.speed*dt;
r.x=clamp(r.x,0,99);r.z=clamp(r.z,0,99);
r.traverse+=r.speed*dt;
r.battery=Math.max(0,r.battery-dt*0.05);
// Collect samples
if(Math.random()<dt*0.3&&r.battery>20){
  r.samples.push({x:r.x,z:r.z,type:randomSampleType()});
}
function randomSampleType(){
  var t=['Basalt','Olivine','Sulfate','Hematite','Clay','Carbonate'];
  return t[Math.floor(Math.random()*t.length)];
}
function terrainAt(x,z){
  x=clamp(Math.floor(x),0,99);z=clamp(Math.floor(z),0,99);
  return r.terrain[x][z];
}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#1a0a05';ctx.fillRect(0,0,W,H);
var r=STATE.rover;
/* Render terrain top-down */

var zoom=3;
for(var i=-30;i<30;i++){

}
/* Rover */
ctx.save();
ctx.translate(centerX,centerY);
ctx.rotate(r.yaw);
ctx.fillStyle='#40e0ff';
ctx.fillRect(-10,-6,20,12);
ctx.fillStyle='#4090ff';
ctx.fillRect(-10,-6,4,12);ctx.fillRect(6,-6,4,12);

r.samples.forEach(function(s){

});

ctx.fillStyle='rgba(5,7,20,.85)';
ctx.fillRect(20,20,240,180);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(20,20,240,180);

ctx.fillText('ROVER TELEMETRY',30,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';

ctx.fillText('Battery: '+fmt(r.battery,1)+'%',30,128);
ctx.fillStyle='#ffd040';
ctx.fillText('Slope: '+fmt(r.slope,1)+'°',30,148);
ctx.fillStyle='#ff60a0';
ctx.fillText('Samples: '+r.samples.length,30,168);
setStats('<div>Pos: '+fmt(r.x,1)+','+fmt(r.z,1)+'</div><div>Battery: '+fmt(r.battery,0)+'%</div><div>Samples: '+r.samples.length+'</div>');
badge('🚙 Rover · '+r.samples.length+' samples');SV('sbTime',fmt(r.traverse,0)+'m');SV('sbVel',fmt(r.speed,1)+' m/s')},

registerModule('asteroid',{title:'Asteroid Mining',icon:'💎',desc:'Rendezvous + landing trajectory.',init:function(){this.reset()},

  if(d<0.05){
    a.phase='capture';
    a.landed=true;
    toast('🎯 Probe captured asteroid!','success');
  }else{

    a.probe.x+=a.probe.vx*dt*0.3;
    a.probe.y+=a.probe.vy*dt*0.3;

  }

  if(a.trail.length>2000)a.trail.shift();
}else if(a.landed){

  var rr=Math.sqrt(Math.pow(a.probe.x-a.target.x,2)+Math.pow(a.probe.y-a.target.y,2));

}

registerModule('exofit',{title:'Exoplanet Fit',icon:'🔬',desc:'Fit transit parameters to noisy data.',init:function(){this.reset()},
reset:function(){var e=STATE.exofit;
// Generate data with true params
var trueP=4.23,trueRp=1.9;
e.data=[];
for(var i=0;i<200;i++){
  var t=(i/200-0.5)*trueP*2;
  var depth=trueRp*trueRp/100; // Rp/Rstar in Rjup/Rsun
  var flux=1;
  if(Math.abs(t)<0.15)flux=1-depth;
  flux+=(Math.random()-0.5)*0.0005;
  e.data.push({t:t,flux:flux});
}
e.fit={P:trueP*1.05,Rp:trueRp*0.8};
e.iterations=0},
fit:function(){var e=STATE.exofit;
// Gradient descent on P, Rp
var lr=0.01;
for(var iter=0;iter<50;iter++){
  var gP=0,gRp=0;
  var chi2=0;
  e.data.forEach(function(d){
    var depth=e.fit.Rp*e.fit.Rp/100;
    var model=Math.abs(d.t)<e.fit.P/28?1-depth:1;
    var r=model-d.flux;
    chi2+=r*r;
    var dModel_dRp=-2*e.fit.Rp/100;
    var dModel_dP=Math.abs(d.t)<e.fit.P/28?0:-depth*Math.sign(d.t)*0.1;
    gP+=2*r*dModel_dP;
    gRp+=2*r*dModel_dRp;
  });
  e.fit.P-=lr*gP*0.001;
  e.fit.Rp-=lr*gRp*0.1;
  e.iterations++;
}
e.chi2=chi2;
},
tick:function(dt){STATE.time+=dt;var e=STATE.exofit;if(!STATE.playing)return;e.iterations++;if(e.iterations%10===0)MODULES.exofit.fit()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var e=STATE.exofit;
/* Data + fit */
var px=60,py=80,pw=W-120,ph=H*0.5;
ctx.fillStyle='rgba(5,7,20,.6)';
ctx.fillRect(px,py,pw,ph);
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.lineWidth=1;ctx.strokeRect(px,py,pw,ph);
/* Data points */
ctx.fillStyle='#40e0ff';
e.data.forEach(function(d,i){
  var x=px+i/e.data.length*pw;
  var y=py+ph/2-(d.flux-1)*ph*20;
  ctx.fillRect(x-1,y-1,2,2);
});
/* Model curve */
ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
ctx.beginPath();
var first=true;
for(var i=0;i<200;i++){
  var t=(i/200-0.5)*e.fit.P*2;

registerModule('telescope',{title:'Telescope Optics',icon:'🔭',desc:'Ray tracing through optical systems.',init:function(){this.build()},
build:function(){var t=STATE.telescope;
t.rays=[];
// Parallel rays entering aperture
for(var i=0;i<12;i++){
  var y=-t.aperture/2+i*(t.aperture/11);
  t.rays.push({startY:y,path:[]});
}
// Compute focus: 1/f = 1/obj + 1/img (for refractor)
t.focal=t.focal;
t.fRatio=t.focal/t.aperture;
t.magnification=t.focal/t.eyepiece;
t.exitPupil=t.aperture/t.magnification;
// Angular resolution (Dawes' limit)
t.resolution=116/t.aperture; // arcsec
t.lightGrasp=Math.pow(t.aperture/7,2);
},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var t=STATE.telescope;
var ox=W*0.1,oy=H/2;
var sc=Math.min(W*0.7/t.focal,H*0.5/t.aperture);
sc=Math.min(sc,0.5);
/* Lens */
var lensX=ox+100;
var lensH=t.aperture*sc;
ctx.strokeStyle='#40e0ff';ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(lensX,oy-lensH/2);ctx.lineTo(lensX,oy+lensH/2);ctx.stroke();
ctx.fillStyle='#40e0ff';ctx.font='bold 11px monospace';
ctx.fillText('Objective',lensX-30,oy-lensH/2-10);
/* Draw rays */
var rays=[];
for(var i=0;i<12;i++){
  var y=oy-lensH/2+i*(lensH/11);
  var focusX=lensX+t.focal*sc;
  // Ray from left, through lens, to focus
  rays.push({y1:y,x1:ox,y2:y,x2:lensX,x3:focusX,y3:oy});
}
rays.forEach(function(r){
  ctx.strokeStyle='rgba(255,208,64,.5)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(r.x1,r.y1);
  ctx.lineTo(r.x2,r.y2);
  ctx.lineTo(r.x3,r.y3);
  ctx.stroke();
});
/* Focal point */
var focusX=lensX+t.focal*sc;
ctx.fillStyle='#ff60a0';
ctx.beginPath();ctx.arc(focusX,oy,5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ff60a0';ctx.font='bold 11px monospace';
ctx.fillText('Focus',focusX-20,oy-15);
/* Eyepiece (after focus) */
var eyeX=focusX+t.eyepiece*sc*2;
ctx.strokeStyle='#a060ff';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(eyeX,oy-lensH*0.15);ctx.lineTo(eyeX,oy+lensH*0.15);ctx.stroke();
ctx.fillStyle='#a060ff';
ctx.fillText('Eyepiece',eyeX-30,oy-lensH*0.15-8);
/* Light from source */
ctx.strokeStyle='rgba(64,144,255,.3)';ctx.lineWidth=1;
for(var i=0;i<6;i++){
  var y=oy-100+i*40;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(ox,y);ctx.stroke();
}
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(W-300,20,280,260);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(W-300,20,280,260);
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('TELESCOPE SPECS',W-290,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('Type: '+t.type,W-290,60);
ctx.fillText('Aperture: '+t.aperture+' mm',W-290,76);
ctx.fillText('Focal length: '+t.focal+' mm',W-290,92);
ctx.fillText('F-ratio: f/'+fmt(t.fRatio,1),W-290,108);
ctx.fillText('Eyepiece: '+t.eyepiece+' mm',W-290,124);
ctx.fillStyle='#40ff90';ctx.font='bold 12px monospace';
ctx.fillText('Magnification: '+fmt(t.magnification,0)+'×',W-290,148);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('Exit pupil: '+fmt(t.exitPupil,2)+' mm',W-290,168);
ctx.fillStyle='#ffd040';
ctx.fillText('Resolution: '+fmt(t.resolution,2)+'"',W-290,188);
ctx.fillStyle='#ff60a0';
ctx.fillText('Light grasp: '+fmt(t.lightGrasp,1)+'×',W-290,208);
ctx.fillStyle='#a060ff';ctx.font='10px monospace';
ctx.fillText('FOV: '+fmt(t.eyepiece/(t.focal)*57.3,2)+'°',W-290,232);
ctx.fillText('Limiting mag: '+fmt(2+5*Math.log10(t.aperture/7),1),W-290,250);
setStats('<div>Aperture: '+t.aperture+'mm</div><div>f/'+fmt(t.fRatio,1)+'</div><div>Mag: '+fmt(t.magnification,0)+'×</div><div>Res: '+fmt(t.resolution,2)+'"</div>');
badge('🔭 Telescope · '+t.aperture+'mm f/'+fmt(t.fRatio,1));SV('sbTime','—');SV('sbVel',t.aperture+'mm')},
onDown:function(){},
controls:function(){var t=STATE.telescope;var h='<div class="sec"><h4>Optical system</h4>';

registerModule('aurora',{title:'Aurora Borealis',icon:'🌌',desc:'Magnetosphere + solar wind dynamics.',init:function(){this.reset()},
reset:function(){var a=STATE.aurora;a.particles=[];
for(var i=0;i<300;i++){
  a.particles.push({
    x:Math.random(),y:Math.random(),
    phase:Math.random()*Math.PI*2,
    speed:0.5+Math.random()*0.5,
    hue:100+Math.random()*80,
    life:Math.random()
  });
}},
tick:function(dt){STATE.time+=dt;var a=STATE.aurora;if(!STATE.playing)return;
a.particles.forEach(function(p){
  p.life+=dt*0.3*p.speed;
  p.y=Math.max(0,p.y-dt*0.05*p.speed);
  if(p.life>1){p.life=0;p.x=Math.random();p.y=Math.random()*0.5+0.5}
});
a.Kp=Math.max(0,Math.min(9,-a.Bz*0.8+a.solarWind/200));
a.intensity=Math.min(1,Math.abs(a.Bz)/10*0.7+a.solarWind/800*0.5)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
starfield(ctx,W,H,24);
var a=STATE.aurora;
/* Stars */
for(var i=0;i<100;i++){
  var sx=(i*131)%W;
  var sy=(i*97)%(H*0.3);
  ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.5)+')';
  ctx.fillRect(sx,sy,1,1);
}
/* Aurora curtains */
a.particles.forEach(function(p){
  if(p.life>1)return;
  var y=H*0.15+p.y*H*0.4;

  var hue=p.hue;
  var g=ctx.createRadialGradient(x,y,0,x,y,80);

ctx.beginPath();

ctx.lineTo(mx-110,my-5);
ctx.lineTo(mx-110,my+5);

ctx.fillStyle='#4090ff';ctx.font='bold 10px monospace';

ctx.fillStyle='#40ff90';ctx.font='bold 12px monospace';
ctx.fillText('Storm level: '+(a.Kp>7?'G3+ SEVERE':a.Kp>5?'G1 MODERATE':'QUIET'),30,130);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
ctx.fillText('Visibility: '+(a.Kp>4?'Mid-latitudes':'High latitudes'),30,160);
ctx.fillText('Altitude: '+a.altitude+' km',30,180);
setStats('<div>Solar wind: '+a.solarWind+' km/s</div><div>Bz: '+a.Bz+' nT</div><div>Kp: '+fmt(a.Kp,1)+'</div>');
badge('🌌 Aurora · Kp='+fmt(a.Kp,1));SV('sbTime','Kp='+fmt(a.Kp,1));SV('sbVel',a.solarWind+'km/s')},

registerModule('timedilation',{title:'Time Dilation',icon:'⏱',desc:'Special + general relativity effects.',init:function(){this.reset()},
reset:function(){var t=STATE.timedilation;t.t0=0;t.proper=0;t.coord=0;t.trail=[]},
tick:function(dt){STATE.time+=dt;var t=STATE.timedilation;if(!STATE.playing)return;
t.t0+=dt;
var dil;
if(t.mode==='SR'){
  dil=lorentzFactor(t.v*C_LIGHT);
}else if(t.mode==='GR'){
  // At radius r from mass M
  var rs=schwarzschildRadius(t.M*M_SUN);
  dil=1/Math.sqrt(1-rs/(t.r*1000));
}else if(t.mode==='GPS'){
  // GPS satellites: combined SR + GR effect
  var v=3874; // m/s orbital
  var r=26560e3;
  var srFactor=1/Math.sqrt(1-(v/C_LIGHT)*(v/C_LIGHT));
  var grFactor=Math.sqrt(1-2*G*M_EARTH/(r*C_LIGHT*C_LIGHT));
  dil=srFactor*grFactor;
}
t.dilationFactor=dil;
t.proper+=dt/dil;
t.coord+=dt;
t.trail.push({coord:t.coord,proper:t.proper});
if(t.trail.length>1000)t.trail.shift()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000003';ctx.fillRect(0,0,W,H);
var t=STATE.timedilation;

ctx.strokeStyle='#ff60a0';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#020108';ctx.font='bold 40px monospace';ctx.textBaseline='middle';
ctx.fillText('👨‍🚀',bx,by);ctx.textBaseline='alphabetic';
ctx.fillStyle='#ff60a0';ctx.font='bold 12px monospace';

}
/* Info */
ctx.fillStyle='rgba(5,7,20,.9)';
ctx.fillRect(20,20,300,140);
ctx.strokeStyle='#4090ff';ctx.lineWidth=1;ctx.strokeRect(20,20,300,140);

if(t.mode==='SR'){

}else if(t.mode==='GR'){
  ctx.fillText('M = '+t.M+' M☉',30,60);
  ctx.fillText('r = '+t.r+' km',30,80);

}else{
  ctx.fillText('GPS satellites',30,60);
  ctx.fillText('v = 3.874 km/s',30,80);
  ctx.fillText('r = 26,560 km',30,100);
}
ctx.fillStyle='#40ff90';ctx.font='bold 12px monospace';
ctx.fillText('Dilation factor: '+fmt(t.dilationFactor,6),30,130);
/* Analogy panel */
ctx.fillStyle='#4090ff';ctx.font='bold 12px monospace';
ctx.fillText('EXAMPLE',W-300,40);
ctx.fillStyle='#d8e0ff';ctx.font='11px monospace';
if(t.mode==='SR'){
  var v=t.v;
  var gamma=lorentzFactor(v*C_LIGHT);
  ctx.fillText('At v='+fmt(v,2)+'c:',W-300,60);
  ctx.fillText('1 year proper = '+fmt(gamma,3)+' yr coord',W-300,80);

  ctx.fillText('At r='+t.r+' km from '+t.M+'M☉ BH:',W-300,60);
  ctx.fillText('1 year proper = '+fmt(fac,3)+' yr coord',W-300,80);
  ctx.fillText('Interstellar Miller planet:',W-300,100);
  ctx.fillText('1 hr = 7 yr',W-300,120);
}else{
  ctx.fillText('GPS time correction:',W-300,60);
  ctx.fillText('SR: −7 μs/day',W-300,80);
  ctx.fillText('GR: +45 μs/day',W-300,100);
  ctx.fillText('Net: +38 μs/day',W-300,120);
  ctx.fillText('→ 10 km position error if ignored',W-300,140);
}
setStats('<div>Mode: '+t.mode+'</div><div>γ: '+fmt(t.dilationFactor,6)+'</div><div>t: '+fmt(t.coord,2)+'s</div><div>τ: '+fmt(t.proper,2)+'s</div>');
badge('⏱ Time Dilation · '+t.mode+' · γ='+fmt(t.dilationFactor,4));SV('sbTime',fmt(t.coord,2)+'s');SV('sbVel',fmt(t.proper,2)+'s')},
onDown:function(){},
controls:function(){var t=STATE.timedilation;var h='<div class="sec"><h4>Mode</h4><div class="chip-row">';
[['SR','Special'],['GR','General'],['GPS','GPS']].forEach(function(m){
  h+='<div class="chip '+(t.mode===m[0]?'active':'')+'" onclick="STATE.timedilation.mode=\''+m[0]+'\';MODULES.timedilation.reset();renderLeftPanel()">'+m[1]+'</div>';
});
h+='</div></div>';
if(t.mode==='SR'){
  h+='<div class="sec"><h4>Velocity</h4>';
  h+='<div class="ctrl"><div class="lbl"><span>v/c</span><span>'+fmt(t.v,3)+'</span></div><input type="range" min="0" max="0.999" step="0.001" value="'+t.v+'" oninput="STATE.timedilation.v=parseFloat(this.value);renderLeftPanel()"></div>';
  h+='</div>';
}else if(t.mode==='GR'){
  h+='<div class="sec"><h4>Black hole</h4>';
  h+='<div class="ctrl"><div class="lbl"><span>Mass</span><span>'+t.M+' M☉</span></div><input type="range" min="1" max="100" value="'+t.M+'" oninput="STATE.timedilation.M=parseInt(this.value);renderLeftPanel()"></div>';
  h+='<div class="ctrl"><div class="lbl"><span>Radius</span><span>'+t.r+' km</span></div><input type="range" min="100" max="10000" step="50" value="'+t.r+'" oninput="STATE.timedilation.r=parseInt(this.value);renderLeftPanel()"></div>';
  h+='</div>';
}else{
  h+='<div class="sec"><h4>GPS</h4>';
  h+='<div style="font-size:.6rem;color:var(--tx2);font-family:var(--mono);line-height:1.7">Satélites GPS orbitam a 20,200 km<br>Velocidade orbital: 3.874 km/s<br><br>SR: relógios do satélite correm mais devagar<br>GR: relógios do satélite correm mais rápido<br><br>Resultado: +38 μs/dia ajuste necessário!</div></div>';
}
h+='<div class="sec"><h4>Presets</h4><div class="chip-row">';
[['Muon',0.998],['ISS',0.000026],['SR-71',0.000001],['LHC',0.999999]].forEach(function(p){
  if(t.mode==='SR')h+='<div class="chip" onclick="STATE.timedilation.v='+p[1]+';renderLeftPanel()">'+p[0]+'</div>';
});
if(t.mode==='GR'){
  [['Sgr A*',4.3e6,10000],['Cygnus X-1',21,1000],['Gargantua',1e8,1e7]].forEach(function(p){
    h+='<div class="chip" onclick="STATE.timedilation.M=Math.min('+p[1]+',100);STATE.timedilation.r=Math.min('+p[2]+',10000);renderLeftPanel()">'+p[0]+'</div>';
  });
}
h+='</div></div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Time Dilation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Especial (SR):</b><br>γ = 1/√(1 − v²/c²)<br>Δt = γ·Δτ<br><br><b>Geral (GR):</b><br>Δt = Δτ/√(1 − r_s/r)<br>r_s = 2GM/c²<br><br><b>GPS combinado:</b><br>Δt = Δτ·γ_SR·(1/√(1−r_s/r))</div></div>'}});

/* ══════════════════════════════════════════════════════════════
   UI + BOOT
   ══════════════════════════════════════════════════════════════ */
function buildTabs(){var t=$('tbTabs');t.innerHTML='';
TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});
i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;
$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});
var m=MODULES[k];
SV('sbMode',(m&&m.title)||k);
try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}
renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;
$$('.rp-tab').forEach(function(t){t.classList.remove('active')});
e.classList.add('active');
$$('.rp-pane').forEach(function(p){p.classList.remove('active')});
var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
if(p)p.classList.add('active');
renderRightPanel()}
function renderLeftPanel(){
  var b=$('lpBody');if(!b)return;
  var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}
  var h='';
  h+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.7rem">'+m.icon+' '+m.title+'</h4>';
  h+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+esc(m.desc||'')+'</div></div>';
  try{if(m.controls)h+=m.controls()}
  catch(e){h+='<div class="sec"><div class="empty" style="color:var(--p1)">controls error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}
  b.innerHTML=h;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var s=$('rpState');
  if(s){
    var stats='<div class="sec"><h4>Live State</h4><div class="kv">';
    stats+='<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>';
    stats+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>';
    stats+='<div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div>';
    stats+='</div></div>';
    s.innerHTML=stats;
  }
  var mp=$('rpMath');
  if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){var p=$('rpLogs');if(!p)return;
var h='<div class="sec"><h4>Log</h4>';
if(!LOG.length)h+='<div class="empty">No events</div>';
else LOG.slice().reverse().forEach(function(l){
  var c=l.type==='error'?'var(--p3)':l.type==='success'?'var(--p2)':'var(--p1)';
  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});
h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['deepspace','paper','nova','solar'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){openModal('❓ COSMOS — Space Mission Studio','<div class="sec"><h4>🌌 25 Módulos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">MECÂNICA ORBITAL</b><br>Orbits · Solar System · Hohmann · N-Body · Lagrange<br>Rocket · Gravity Assist · Asteroid Mining · Rover<br><br><b style="color:var(--p1)">ASTROFÍSICA</b><br>Black Hole · Grav. Waves · Exoplanet · HR Diagram<br>Galaxy · Spectroscopy · CMB · BBN · Aurora<br><br><b style="color:var(--p1)">OBSERVAÇÃO</b><br>Star Chart · Interferometry · Distance Ladder<br>Telescope · Exoplanet Fit<br><br><b style="color:var(--p1)">EXÓTICOS</b><br>Solar Sail · Space Elevator · Time Dilation</div></div><div class="sec"><h4>🔬 Física Real</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">• Kepler equation solver (Newton-Raphson)<br>• RK4 N-body com G real<br>• Schwarzschild metric + geodesics<br>• Chirp mass + quadrupole formula<br>• Planck blackbody + Wien displacement<br>• Hohmann transfer exact Δv<br>• Lorentz factor + gravitational dilation<br>• BBN primordial abundances<br>• 60 estrelas catalogadas + 12 DSOs</div></div><div class="sec"><h4>⌨️ Atalhos</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Space=Play · →=Step · R=Reset · T=Tema · ?=Help</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#000003';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#4090ff';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('COSMOS ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('COSMOS ready — 25 módulos de astronomia e missão espacial','success',3000);
});
console.log('%c COSMOS ','background:linear-gradient(90deg,#4090ff,#a060ff,#ff60a0,#ffd040,#40e0ff);color:#01020a;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('Kepler · RK4 N-body · Schwarzschild · Chirp mass · Planck · Hohmann · Lorentz · BBN · 60 real stars');
