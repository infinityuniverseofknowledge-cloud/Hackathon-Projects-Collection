<!DOCTYPE html>
<html lang="pt-BR" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEUROLAB — AI/ML Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
:root{
  --bg:#05030a;--panel:#0a0616;--panel2:#0f0820;--panel3:#160c30;--panel4:#1e1040;
  --bd:#1c1040;--bd2:#301880;--tx:#f0e6ff;--tx2:#a898d8;--tx3:#685898;
  --p1:#ff40a0;--p2:#40e0ff;--p3:#40ff90;--p4:#ffd040;
  --p5:#a060ff;--p6:#ff8040;--p7:#40ffd0;--p8:#ff60ff;
  --g1:linear-gradient(135deg,#ff40a0,#a060ff);
  --gHolo:linear-gradient(120deg,#ff40a0,#a060ff,#40e0ff,#40ff90,#ffd040,#ff40a0);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f8f5ff;--panel:#fff;--panel2:#f8f5ff;--panel3:#f0e8ff;--panel4:#e0d8f8;--bd:#d0c8e8;--bd2:#a898c8;--tx:#1a1030;--tx2:#504078;--tx3:#8070a0;--p1:#c02080;--p2:#0060c0;--p3:#008040;--p4:#a08000;--p5:#6020c0;--p6:#c04000;--p7:#008080;--p8:#c000c0;--g1:linear-gradient(135deg,#c02080,#6020c0)}
[data-theme="matrix"]{--bg:#000a05;--panel:#021008;--panel2:#041410;--panel3:#062018;--panel4:#0a2c20;--bd:#082015;--bd2:#104028;--tx:#c0ffd0;--tx2:#70b088;--tx3:#407050;--p1:#20ff40;--p2:#40e0ff;--p3:#20ff80;--p4:#ffe040;--p5:#a060ff;--p6:#ff8040;--p7:#40ffd0;--p8:#ff60ff;--g1:linear-gradient(135deg,#20ff40,#40e0ff)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#05030a}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p3);box-shadow:0 0 10px var(--p3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#020105;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,64,160,.015) 0,rgba(255,64,160,.015) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(10,6,22,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
#statusbar .sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,64,160,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#05030a;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#05030a;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p3)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p1)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('playground')">NEUROLAB</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace">
      <div id="canvasWrap"><canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
      </div>
    </div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Epoch</span><span class="sb-val c2" id="sbEpoch">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Loss</span><span class="sb-val c3" id="sbLoss">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Acc</span><span class="sb-val c4" id="sbAcc">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Params</span><span class="sb-val c5" id="sbParams">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Playground</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   CORE UTILS
   ══════════════════════════════════════════════════════════ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ══════════════════════════════════════════════════════════
   CANVAS
   ══════════════════════════════════════════════════════════ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

/* ══════════════════════════════════════════════════════════
   MODULE REGISTRY
   ══════════════════════════════════════════════════════════ */
var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

/* ══════════════════════════════════════════════════════════
   LOG
   ══════════════════════════════════════════════════════════ */
var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   MATRIX — real linear algebra
   ══════════════════════════════════════════════════════════ */
function Mat(rows,cols,data){
  this.r=rows;this.c=cols;
  this.d=data||new Float32Array(rows*cols);
}
Mat.zeros=function(r,c){return new Mat(r,c,new Float32Array(r*c))};
Mat.randn=function(r,c,scale){scale=scale||0.5;var m=new Mat(r,c);for(var i=0;i<r*c;i++)m.d[i]=randn()*scale;return m};
Mat.fromArray=function(arr){var m=new Mat(arr.length,1);for(var i=0;i<arr.length;i++)m.d[i]=arr[i];return m};
Mat.range=function(n){var m=new Mat(n,1);for(var i=0;i<n;i++)m.d[i]=i;return m};
Mat.prototype.get=function(i,j){return this.d[i*this.c+j]};
Mat.prototype.set=function(i,j,v){this.d[i*this.c+j]=v};
Mat.prototype.fill=function(v){for(var i=0;i<this.d.length;i++)this.d[i]=v;return this};
Mat.prototype.clone=function(){return new Mat(this.r,this.c,new Float32Array(this.d))};
Mat.prototype.map=function(fn){var m=new Mat(this.r,this.c);for(var i=0;i<this.d.length;i++)m.d[i]=fn(this.d[i],i);return m};
Mat.prototype.add=function(o){var m=new Mat(this.r,this.c);if(o instanceof Mat){for(var i=0;i<m.d.length;i++)m.d[i]=this.d[i]+o.d[i]}else{for(var i2=0;i2<m.d.length;i2++)m.d[i2]=this.d[i2]+o}return m};
Mat.prototype.sub=function(o){var m=new Mat(this.r,this.c);if(o instanceof Mat){for(var i=0;i<m.d.length;i++)m.d[i]=this.d[i]-o.d[i]}else{for(var i2=0;i2<m.d.length;i2++)m.d[i2]=this.d[i2]-o}return m};
Mat.prototype.mul=function(o){var m=new Mat(this.r,this.c);if(o instanceof Mat){for(var i=0;i<m.d.length;i++)m.d[i]=this.d[i]*o.d[i]}else{for(var i2=0;i2<m.d.length;i2++)m.d[i2]=this.d[i2]*o}return m};
Mat.prototype.scale=function(s){return this.map(function(x){return x*s})};
Mat.prototype.T=function(){var m=new Mat(this.c,this.r);for(var i=0;i<this.r;i++)for(var j=0;j<this.c;j++)m.d[j*this.r+i]=this.d[i*this.c+j];return m};
Mat.prototype.matmul=function(o){
  if(this.c!==o.r)throw new Error('dim mismatch: '+this.r+'x'+this.c+' · '+o.r+'x'+o.c);
  var m=new Mat(this.r,o.c);
  for(var i=0;i<this.r;i++){
    for(var k=0;k<this.c;k++){
      var a=this.d[i*this.c+k];
      if(a===0)continue;
      for(var j=0;j<o.c;j++)m.d[i*o.c+j]+=a*o.d[k*o.c+j];
    }
  }
  return m;
};
Mat.prototype.sum=function(){var s=0;for(var i=0;i<this.d.length;i++)s+=this.d[i];return s};
Mat.prototype.mean=function(){return this.sum()/this.d.length};
Mat.prototype.max=function(){var m=-Infinity;for(var i=0;i<this.d.length;i++)if(this.d[i]>m)m=this.d[i];return m};
Mat.prototype.argmax=function(){var m=-Infinity,idx=0;for(var i=0;i<this.d.length;i++)if(this.d[i]>m){m=this.d[i];idx=i}return idx};
Mat.prototype.norm=function(){var s=0;for(var i=0;i<this.d.length;i++)s+=this.d[i]*this.d[i];return Math.sqrt(s)};
Mat.prototype.toArray=function(){return Array.from(this.d)};

/* ══════════════════════════════════════════════════════════
   ACTIVATIONS (12)
   ══════════════════════════════════════════════════════════ */
var ACTIVATIONS={
  'Linear':{f:function(x){return x},df:function(x){return 1},color:'#a898d8'},
  'ReLU':{f:function(x){return x>0?x:0},df:function(x){return x>0?1:0},color:'#40ff90'},
  'LeakyReLU':{f:function(x){return x>0?x:0.01*x},df:function(x){return x>0?1:0.01},color:'#40ffd0'},
  'ELU':{f:function(x){return x>0?x:Math.exp(x)-1},df:function(x){return x>0?1:Math.exp(x)},color:'#40e0ff'},
  'Sigmoid':{f:function(x){return 1/(1+Math.exp(-clamp(x,-30,30)))},df:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return s*(1-s)},color:'#ff40a0'},
  'Tanh':{f:function(x){return Math.tanh(x)},df:function(x){var t=Math.tanh(x);return 1-t*t},color:'#ffd040'},
  'Softplus':{f:function(x){return Math.log(1+Math.exp(clamp(x,-30,30)))},df:function(x){return 1/(1+Math.exp(-clamp(x,-30,30)))},color:'#a060ff'},
  'Swish':{f:function(x){return x/(1+Math.exp(-clamp(x,-30,30)))},df:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return s+x*s*(1-s)},color:'#ff8040'},
  'GELU':{f:function(x){return 0.5*x*(1+Math.tanh(Math.sqrt(2/Math.PI)*(x+0.044715*x*x*x)))},df:function(x){var t=Math.tanh(Math.sqrt(2/Math.PI)*(x+0.044715*x*x*x));return 0.5*(1+t)+0.5*x*(1-t*t)*Math.sqrt(2/Math.PI)*(1+0.134145*x*x)},color:'#40d0ff'},
  'Mish':{f:function(x){return x*Math.tanh(Math.log(1+Math.exp(clamp(x,-30,30))))},df:function(x){var sp=Math.log(1+Math.exp(clamp(x,-30,30)));var t=Math.tanh(sp);var s=1/(1+Math.exp(-clamp(x,-30,30)));return t+x*(1-t*t)*s},color:'#ff60c0'},
  'Softmax':{f:function(x){return Math.exp(clamp(x,-30,30))},df:function(x){return 1},color:'#ffb040'},
  'Sin':{f:function(x){return Math.sin(x)},df:function(x){return Math.cos(x)},color:'#a0a0ff'}
};
function actMat(m,name){
  if(name==='Softmax'){
    var mx=m.max();var ex=m.map(function(x){return Math.exp(x-mx)});
    var s=0;for(var i=0;i<ex.d.length;i++)s+=ex.d[i];
    return ex.scale(1/(s||1));
  }
  var a=ACTIVATIONS[name];
  return a?m.map(a.f):m;
}

/* ══════════════════════════════════════════════════════════
   LOSSES (8)
   ══════════════════════════════════════════════════════════ */
var LOSSES={
  'MSE':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var e=p[i]-y[i];s+=e*e}return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++)g[i]=2*(p[i]-y[i])/p.length;return g}},
  'MAE':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++)s+=Math.abs(p[i]-y[i]);return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++)g[i]=Math.sign(p[i]-y[i])/p.length;return g}},
  'Huber':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var e=p[i]-y[i];s+=Math.abs(e)<1?0.5*e*e:Math.abs(e)-0.5}return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++){var e=p[i]-y[i];g[i]=(Math.abs(e)<1?e:Math.sign(e))/p.length}return g}},
  'BCE':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var pi=clamp(p[i],1e-7,1-1e-7);s+=-(y[i]*Math.log(pi)+(1-y[i])*Math.log(1-pi))}return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++){var pi=clamp(p[i],1e-7,1-1e-7);g[i]=(pi-y[i])/(pi*(1-pi)*p.length)}return g}},
  'CrossEntropy':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++)s+=-y[i]*Math.log(clamp(p[i],1e-7,1));return s},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++)g[i]=-y[i]/clamp(p[i],1e-7,1);return g}},
  'Hinge':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var yy=y[i]*2-1;s+=Math.max(0,1-yy*p[i])}return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++){var yy=y[i]*2-1;g[i]=(yy*p[i]<1?-yy:0)/p.length}return g}},
  'KL':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var pi=clamp(p[i],1e-7,1);var yi=clamp(y[i],1e-7,1);s+=yi*Math.log(yi/pi)}return s},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++)g[i]=-y[i]/clamp(p[i],1e-7,1);return g}},
  'LogCosh':{f:function(p,y){var s=0;for(var i=0;i<p.length;i++){var e=p[i]-y[i];s+=Math.log(Math.cosh(clamp(e,-20,20)))}return s/p.length},d:function(p,y){var g=new Array(p.length);for(var i=0;i<p.length;i++)g[i]=Math.tanh(p[i]-y[i])/p.length;return g}}
};

/* ══════════════════════════════════════════════════════════
   OPTIMIZERS (8)
   ══════════════════════════════════════════════════════════ */
function OptState(){this.m={};this.v={};this.t=0}
function optStep(name,params,grads,state,lr,cfg){
  cfg=cfg||{};
  state.t++;
  var t=state.t;
  for(var key in params){
    if(!params.hasOwnProperty(key))continue;
    var p=params[key],g=grads[key];
    if(!state.m[key]){state.m[key]=p.clone().fill(0);state.v[key]=p.clone().fill(0)}
    var m=state.m[key],v=state.v[key];
    for(var i=0;i<p.d.length;i++){
      var gi=g.d[i];
      if(name==='SGD'){p.d[i]-=lr*gi}
      else if(name==='Momentum'){m.d[i]=0.9*m.d[i]+gi;p.d[i]-=lr*m.d[i]}
      else if(name==='NAG'){var d=0.9*m.d[i]+gi;m.d[i]=d;p.d[i]-=lr*d}
      else if(name==='AdaGrad'){v.d[i]+=gi*gi;p.d[i]-=lr*gi/(Math.sqrt(v.d[i])+1e-8)}
      else if(name==='RMSProp'){v.d[i]=0.9*v.d[i]+0.1*gi*gi;p.d[i]-=lr*gi/(Math.sqrt(v.d[i])+1e-8)}
      else if(name==='Adam'){m.d[i]=0.9*m.d[i]+0.1*gi;v.d[i]=0.999*v.d[i]+0.001*gi*gi;var mh=m.d[i]/(1-Math.pow(0.9,t));var vh=v.d[i]/(1-Math.pow(0.999,t));p.d[i]-=lr*mh/(Math.sqrt(vh)+1e-8)}
      else if(name==='AdamW'){m.d[i]=0.9*m.d[i]+0.1*gi;v.d[i]=0.999*v.d[i]+0.001*gi*gi;var mh2=m.d[i]/(1-Math.pow(0.9,t));var vh2=v.d[i]/(1-Math.pow(0.999,t));p.d[i]-=lr*(mh2/(Math.sqrt(vh2)+1e-8)+0.01*p.d[i])}
      else if(name==='Nadam'){m.d[i]=0.9*m.d[i]+0.1*gi;v.d[i]=0.999*v.d[i]+0.001*gi*gi;var mh3=m.d[i]/(1-Math.pow(0.9,t));var vh3=v.d[i]/(1-Math.pow(0.999,t));p.d[i]-=lr*(0.9*mh3+0.1*gi/(1-Math.pow(0.9,t)))/(Math.sqrt(vh3)+1e-8)}
    }
  }
}
var OPTIMIZERS=['SGD','Momentum','NAG','AdaGrad','RMSProp','Adam','AdamW','Nadam'];

/* ══════════════════════════════════════════════════════════
   MLP — real backprop
   ══════════════════════════════════════════════════════════ */
function MLP(sizes,actName,lastAct){
  this.sizes=sizes;
  this.act=actName;
  this.lastAct=lastAct||null;
  this.W=[];this.b=[];
  for(var i=0;i<sizes.length-1;i++){
    var scale=Math.sqrt(2/sizes[i]);
    this.W.push(Mat.randn(sizes[i+1],sizes[i],scale));
    this.b.push(Mat.zeros(sizes[i+1],1));
  }
}
MLP.prototype.forward=function(x,keepCache){
  var a=x,cache=keepCache?[{a:a}]:null;
  for(var i=0;i<this.W.length;i++){
    var z=this.W[i].matmul(a).add(this.b[i]);
    var isLast=(i===this.W.length-1);
    var f=isLast&&this.lastAct?this.lastAct:this.act;
    var act=actMat(z,f);
    if(cache)cache.push({z:z,a:act,f:f,prev:a});
    a=act;
  }
  return {out:a,cache:cache};
};
MLP.prototype.backward=function(cache,y,lossFn){
  var L=cache.length-1;
  var out=cache[L].a;
  var pred=out.toArray();
  var yArr=y.toArray?y.toArray():(Array.isArray(y)?y:[y]);
  var lossVal=LOSSES[lossFn].f(pred,yArr);
  var dOut=new Mat(out.r,out.c,new Float32Array(LOSSES[lossFn].d(pred,yArr)));
  /* If last activation is softmax+crossentropy, gradient simplifies — we use generic path */
  var grads={W:[],b:[]};
  var d=dOut;
  for(var i=L-1;i>=0;i--){
    var lc=cache[i+1];
    /* dL/dz = dL/da * da/dz */
    var f=lc.f;
    var dz=d;
    if(f!=='Linear'){
      var a=lc.z;
      var actDef=ACTIVATIONS[f]||ACTIVATIONS['Linear'];
      dz=d.mul(a.map(actDef.df));
    }
    /* Gradient for W and b */
    var aPrev=lc.prev;
    grads.W[i]=dz.matmul(aPrev.T());
    grads.b[i]=Mat.fromArray([dz.sum()]);
    /* Propagate to previous layer */
    if(i>0){
      d=this.W[i].T().matmul(dz);
    }
  }
  return {loss:lossVal,gradsW:grads.W,gradsB:grads.b,pred:pred};
};
MLP.prototype.numParams=function(){
  var n=0;
  for(var i=0;i<this.W.length;i++){n+=this.W[i].d.length+this.b[i].d.length}
  return n;
};

/* ══════════════════════════════════════════════════════════
   DATASETS (22)
   ══════════════════════════════════════════════════════════ */
var DATASETS={
  'Circle':function(n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*2*Math.PI;var r=Math.random()<0.5?0.3+Math.random()*0.2:0.7+Math.random()*0.25;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r,l:r<0.5?0:1})}return p},
  'XOR':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=(x*y>0)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Moons':function(n){var p=[];for(var i=0;i<n;i++){if(i%2===0){var a=Math.random()*Math.PI;p.push({x:Math.cos(a)*0.6-0.3+randn()*0.1,y:Math.sin(a)*0.6-0.2+randn()*0.1,l:0})}else{var a2=Math.random()*Math.PI;p.push({x:Math.cos(a2+Math.PI)*0.6+0.3+randn()*0.1,y:Math.sin(a2+Math.PI)*0.6+0.2+randn()*0.1,l:1})}}return p},
  'Spiral':function(n){var p=[];for(var i=0;i<n;i++){var t=i/n*4*Math.PI;var r=0.1+t*0.07;var c=i%2;var off=c*Math.PI;p.push({x:Math.cos(t+off)*r+randn()*0.05,y:Math.sin(t+off)*r+randn()*0.05,l:c})}return p},
  'Gaussians':function(n){var p=[];for(var i=0;i<n;i++){var l=i%2;var cx=l?0.5:-0.5,cy=l?0.5:-0.5;p.push({x:cx+randn()*0.25,y:cy+randn()*0.25,l:l})}return p},
  'Blobs':function(n){var p=[];for(var i=0;i<n;i++){var k=i%3;var cx=(k-1)*0.6,cy=(k===1?0.5:-0.3);p.push({x:cx+randn()*0.2,y:cy+randn()*0.2,l:k===2?1:0})}return p},
  'Two Lines':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=x+randn()*0.15;p.push({x:x,y:y,l:y>0?1:0})}return p},
  'Stripes':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=(Math.sin(x*5)>0)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Checkerboard':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=((Math.floor((x+1)*2.5)+Math.floor((y+1)*2.5))%2===0)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Concentric':function(n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*2*Math.PI;var r=Math.random();var l=Math.floor(r*3)%2;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r,l:l})}return p},
  'Ring':function(n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*2*Math.PI;var r=0.5+randn()*0.05;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r,l:0});var a2=Math.random()*2*Math.PI;var r2=0.2+randn()*0.05;p.push({x:Math.cos(a2)*r2,y:Math.sin(a2)*r2,l:1})}return p.slice(0,n)},
  'Wavy':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1;var y=Math.sin(x*6)*0.4+randn()*0.1;var yy=Math.random()*2-1;p.push({x:x,y:yy,l:yy>y?1:0})}return p},
  'Helix':function(n){var p=[];for(var i=0;i<n;i++){var t=i/n*6;var l=i%2;p.push({x:Math.cos(t+l*Math.PI)*0.6+randn()*0.05,y:Math.sin(t+l*Math.PI)*0.6+randn()*0.05,l:l})}return p},
  'Slope':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=(y>0.5*x-0.2)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Corners':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=(Math.abs(x)>0.5||Math.abs(y)>0.5)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Cross':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*2-1,y=Math.random()*2-1;var l=(Math.abs(x)<0.3||Math.abs(y)<0.3)?1:0;p.push({x:x,y:y,l:l})}return p},
  'Donut':function(n){var p=[];for(var i=0;i<n;i++){var a=Math.random()*2*Math.PI;var r=Math.random()*0.9;var l=(r>0.4&&r<0.7)?1:0;p.push({x:Math.cos(a)*r,y:Math.sin(a)*r,l:l})}return p},
  'Sine':function(n){var p=[];for(var i=0;i<n;i++){var x=Math.random()*6-3;var y=Math.sin(x)+randn()*0.2;p.push({x:x/3,y:y/2,l:0})}return p},
  'Clusters':function(n){var p=[];for(var c=0;c<5;c++){for(var i=0;i<n/5;i++){p.push({x:randn()*0.15+Math.cos(c/5*2*Math.PI)*0.6,y:randn()*0.15+Math.sin(c/5*2*Math.PI)*0.6,l:c%2})}}return p},
  'Random':function(n){var p=[];for(var i=0;i<n;i++)p.push({x:Math.random()*2-1,y:Math.random()*2-1,l:Math.random()<0.5?0:1});return p},
  'Two Gaussians':function(n){var p=[];for(var i=0;i<n;i++){var l=i%2;var cx=l?0.2:-0.2;p.push({x:cx+randn()*0.4,y:randn()*0.4,l:l})}return p},
  'Bimodal':function(n){var p=[];for(var i=0;i<n;i++){var l=i%2;var cx=l?0.5:-0.5;p.push({x:cx+randn()*0.15,y:cx+randn()*0.15,l:l})}return p}
};
var DATASET_NAMES=Object.keys(DATASETS);

/* ══════════════════════════════════════════════════════════
   COLOR / RENDER HELPERS
   ══════════════════════════════════════════════════════════ */
var CLS_COLORS=['#40e0ff','#ff40a0','#40ff90','#ffd040','#a060ff','#ff8040'];
function clsColor(l){return CLS_COLORS[l%CLS_COLORS.length]}
function drawDecisionBoundary(ctx,net,plotX,plotY,plotW,plotH,res){
  res=res||40;
  var cw=plotW/res,ch=plotH/res;
  for(var i=0;i<res;i++){
    for(var j=0;j<res;j++){
      var x=((i+0.5)/res)*2-1;
      var y=((j+0.5)/res)*2-1;
      var out=net.forward(Mat.fromArray([x,y]),false).out;
      var v=out.d.length===1?out.d[0]:(out.argmax()===1?1:0);
      ctx.fillStyle=v>0.5?'rgba(255,64,160,0.18)':'rgba(64,224,255,0.18)';
      ctx.fillRect(plotX+i*cw,plotY+j*ch,cw,ch);
    }
  }
}
function drawPoints(ctx,pts,plotX,plotY,plotW,plotH,r){
  r=r||4;
  pts.forEach(function(p){
    var px=plotX+(p.x+1)/2*plotW;
    var py=plotY+(p.y+1)/2*plotH;
    ctx.fillStyle=clsColor(p.l);
    ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke();
  });
}
function drawSparkline(ctx,x,y,w,h,values,color){
  if(values.length<2)return;
  var mx=Math.max.apply(null,values);
  var mn=Math.min.apply(null,values);
  if(mx===mn){mx=mn+1}
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<values.length;i++){
    var px=x+i/(values.length-1)*w;
    var py=y+h-(values[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
}
</script>
<script>

function pgRebuild(){
  var p=STATE.playground;
  p.net=new MLP(p.layers,p.act,p.lastAct);
  p.optState=new OptState();
  p.epoch=0;p.lossHistory=[];p.accHistory=[];
  p.data=DATASETS[p.dataset](p.n);
}
function pgStep(){
  var p=STATE.playground;
  if(!p.data||!p.net)return;
  var idx=[];
  for(var i=0;i<p.data.length;i++)idx.push(i);
  for(var k=idx.length-1;k>0;k--){var j=rnd(0,k);var t=idx[k];idx[k]=idx[j];idx[j]=t}
  var bs=Math.min(p.batch,idx.length);
  var totalLoss=0;var correct=0;
  var params=[];var gradsW=[];var gradsB=[];
  for(var k2=0;k2<bs;k2++){
    var pt=p.data[idx[k2]];
    var x=Mat.fromArray([pt.x,pt.y]);
    var y=Mat.fromArray([pt.l]);
    var r=p.net.forward(x,true);
    var bp=p.net.backward(r.cache,y,p.loss);
    totalLoss+=bp.loss;
    if(Math.abs(r.out.d[0]-pt.l)<0.5)correct++;
    if(k2===0){gradsW=bp.gradsW.map(function(g){return g.scale(1/bs)});gradsB=bp.gradsB.map(function(g){return g.scale(1/bs)})}
    else{for(var li=0;li<gradsW.length;li++){gradsW[li]=gradsW[li].add(bp.gradsW[li].scale(1/bs));gradsB[li]=gradsB[li].add(bp.gradsB[li].scale(1/bs))}}
  }
  var paramsW={};var paramsB={};var ggW={};var ggB={};
  for(var li2=0;li2<p.net.W.length;li2++){paramsW['W'+li2]=p.net.W[li2];paramsB['b'+li2]=p.net.b[li2];ggW['W'+li2]=gradsW[li2];ggB['b'+li2]=gradsB[li2]}
  optStep(p.opt,paramsW,ggW,p.optState,p.lr);
  optStep(p.opt,paramsB,ggB,p.optState,p.lr);
  p.epoch++;
  var avgLoss=totalLoss/bs;
  var acc=correct/bs;
  p.lossHistory.push(avgLoss);
  p.accHistory.push(acc);
  if(p.lossHistory.length>500){p.lossHistory.shift();p.accHistory.shift()}
  SV('sbEpoch',p.epoch);
  SV('sbLoss',fmt(avgLoss,4));
  SV('sbAcc',fmt(acc*100,1)+'%');
  SV('sbParams',p.net.numParams());
}

/* ══════════════ MODULE 5: OPTIMIZERS ══════════════ */
var OPT_FNS={
  'Rosenbrock':{f:function(x,y){return Math.pow(1-x,2)+100*Math.pow(y-x*x,2)},min:[1,1],range:2},
  'Sphere':{f:function(x,y){return x*x+y*y},min:[0,0],range:3},
  'Beale':{f:function(x,y){return Math.pow(1.5-x+x*y,2)+Math.pow(2.25-x+x*y*y,2)+Math.pow(2.625-x+x*y*y*y,2)},min:[3,0.5],range:3},
  'Goldstein':{f:function(x,y){return (1+Math.pow(x+y+1,2)*(19-14*x+3*x*x-14*y+6*x*y+3*y*y))*(30+Math.pow(2*x-3*y,2)*(18-32*x+12*x*x+48*y-36*x*y+27*y*y))},min:[0,-1],range:2}
};
registerModule('optimizers',{title:'Optimizer Race',icon:'🚀',desc:'8 optimizers racing on 2D loss surface.',init:function(){this.reset()},
reset:function(){var o=STATE.optimizers;o.positions={};o.paths={};o.states={};o.step=0;
o.opt.forEach(function(name){o.positions[name]=[-1.5,1.5];o.paths[name]=[[-1.5,1.5]];o.states[name]=new OptState()})},
step:function(){var o=STATE.optimizers;var fn=OPT_FNS[o.fn];
o.opt.forEach(function(name){
  var p=o.positions[name];
  var eps=1e-4;
  var gx=(fn.f(p[0]+eps,p[1])-fn.f(p[0]-eps,p[1]))/(2*eps);
  var gy=(fn.f(p[0],p[1]+eps)-fn.f(p[0],p[1]-eps))/(2*eps);
  var params={W:Mat.fromArray([p[0]])};var gW={W:Mat.fromArray([gx])};
  var params2={W:Mat.fromArray([p[1]])};var gW2={W:Mat.fromArray([gy])};
  optStep(name,params,gW,o.states[name],o.lr);
  optStep(name,params2,gW2,o.states[name],o.lr);
  var nx=params.W.d[0];var ny=params2.W.d[0];
  nx=clamp(nx,-3,3);ny=clamp(ny,-3,3);
  o.positions[name]=[nx,ny];
  o.paths[name].push([nx,ny]);
  if(o.paths[name].length>300)o.paths[name].shift();
});
o.step++},
tick:function(dt){STATE.time+=dt;var o=STATE.optimizers;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*o.speed;while(this._acc>=1){this.step();this._acc-=1}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var o=STATE.optimizers;
var sz=Math.min(W-260,H-80);var cx=W/2-100,cy=H/2;var fn=OPT_FNS[o.fn];var R=fn.range;
/* heatmap */
var res=50;
for(var i=0;i<res;i++)for(var j=0;j<res;j++){
  var x=(i/res-0.5)*2*R;var y=(j/res-0.5)*2*R;
  var v=fn.f(x,y);var t=clamp(Math.log(v+1)/8,0,1);
  var r=Math.floor(255*Math.pow(t,0.5));var g=Math.floor(80*Math.pow(t,2));var b=Math.floor(180*(1-t));
  ctx.fillStyle='rgba('+r+','+g+','+b+',0.6)';
  ctx.fillRect(cx-sz/2+i/res*sz,cy-sz/2+j/res*sz,sz/res+0.5,sz/res+0.5);
}
/* min point */
var mx=cx-sz/2+(fn.min[0]/(2*R)+0.5)*sz;var my=cy-sz/2+(fn.min[1]/(2*R)+0.5)*sz;
ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(mx,my,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
/* paths */
o.opt.forEach(function(name,i){
  var col=CLS_COLORS[i%CLS_COLORS.length];
  var path=o.paths[name];if(!path||path.length<2)return;
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
  path.forEach(function(p,j){
    var px=cx-sz/2+(p[0]/(2*R)+0.5)*sz;var py=cy-sz/2+(p[1]/(2*R)+0.5)*sz;
    if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  });
  ctx.stroke();
  var p=path[path.length-1];
  var px=cx-sz/2+(p[0]/(2*R)+0.5)*sz;var py=cy-sz/2+(p[1]/(2*R)+0.5)*sz;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
});
/* legend */
var lx=cx+sz/2+20;var ly=cy-sz/2;
ctx.fillStyle='rgba(10,6,22,.9)';ctx.strokeStyle='rgba(255,64,160,.3)';ctx.beginPath();ctx.roundRect(lx,ly,180,o.opt.length*24+20,8);ctx.fill();ctx.stroke();
ctx.fillStyle='#ff40a0';ctx.font='bold 11px monospace';ctx.textAlign='left';ctx.fillText('Optimizers',lx+10,ly+20);
o.opt.forEach(function(name,i){
  var col=CLS_COLORS[i%CLS_COLORS.length];
  ctx.fillStyle=col;ctx.fillRect(lx+10,ly+30+i*24,16,4);
  ctx.fillStyle='#e0e8ff';ctx.font='11px monospace';ctx.fillText(name,lx+30,ly+35+i*24);
  var pos=o.positions[name];
  ctx.fillStyle='#a898d8';ctx.font='9px monospace';ctx.fillText('('+fmt(pos[0],2)+','+fmt(pos[1],2)+')',lx+30,ly+46+i*24);
});
badge('🚀 '+o.fn+' · lr='+o.lr+' · step '+o.step);SV('sbMode','Optimizers')},
onDown:function(){},
controls:function(){var o=STATE.optimizers;var h='<div class="sec"><h4>Optimizers (race)</h4><div class="chip-row">';
OPTIMIZERS.forEach(function(name){

  h+='<div class="chip '+(active?'active':'')+'" onclick="if(STATE.optimizers.opt.indexOf(\''+name+'\')>=0){STATE.optimizers.opt=STATE.optimizers.opt.filter(function(x){return x!==\''+name+'\'});}else{STATE.optimizers.opt.push(\''+name+'\');}MODULES.optimizers.reset();renderLeftPanel()">'+name+'</div>';

registerModule('backprop',{title:'Backprop Step-by-Step',icon:'🔙',desc:'Chain rule em rede pequena.',init:function(){var b=STATE.backprop;
b.net=new MLP(b.sizes,'Sigmoid','Sigmoid');
b.step=0;
b.x=Mat.fromArray(b.input);
b.y=Mat.fromArray(b.target);
b.forwardCache=b.net.forward(b.x,true);
b.bp=b.net.backward(b.forwardCache,b.y,'MSE');
b.stages=[];
/* Enumerate stages */
b.stages.push({title:'Input x',val:b.input.join(', ')});
var cache=b.forwardCache;
for(var i=1;i<cache.length;i++){
  var z=cache[i].z;var a=cache[i].a;
  b.stages.push({title:'z'+i+' (pre-activation)',val:Array.from(z.d).map(function(x){return fmt(x,3)}).join(', ')});
  b.stages.push({title:'a'+i+' = σ(z'+i+')',val:Array.from(a.d).map(function(x){return fmt(x,3)}).join(', ')});
}
b.stages.push({title:'Loss L (MSE)',val:fmt(b.bp.loss,5)});
b.stages.push({title:'∂L/∂a_out',val:b.bp.pred.map(function(x,i){return fmt(2*(x-b.y.d[i])/b.y.d.length,4)}).join(', ')});
for(var li=b.bp.gradsW.length-1;li>=0;li--){
  b.stages.push({title:'∇W'+(li+1),val:'norm='+fmt(b.bp.gradsW[li].norm(),4)+' ('+b.bp.gradsW[li].r+'×'+b.bp.gradsW[li].c+')'});
  b.stages.push({title:'∇b'+(li+1),val:b.bp.gradsB[li].toArray().map(function(x){return fmt(x,4)}).join(', ')});
}
},

draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var b=STATE.backprop;

ctx.fillStyle='#ff40a0';ctx.font='bold 12px monospace';ctx.textAlign='left';
ctx.fillText('FORWARD PASS →',60,40);
var cache=b.forwardCache;
/* draw net */
var nodePos=[];
b.sizes.forEach(function(sz,li){

  }
});
for(var li=1;li<b.sizes.length;li++){

for(var li=0;li<b.sizes.length;li++){

    ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    if(cache&&cache[li]){

ctx.fillStyle='#ff40a0';ctx.font='bold 11px monospace';ctx.textAlign='left';
ctx.fillText('BACKWARD PASS (chain rule)',px+12,py+22);
var visible=Math.min(b.stages.length,14);
for(var i=0;i<visible;i++){
  var s=b.stages[i];
  var sy=py+44+i*20;
  ctx.fillStyle=(i<b.stages.length-2)?'#ffd040':'#40e0ff';

}
badge('🔙 Backprop · '+b.sizes.join('·')+' · loss='+fmt(b.bp.loss,4));SV('sbMode','Backprop')},

registerModule('linreg',{title:'Linear Regression',icon:'📏',desc:'Gradient descent fit.',init:function(){var l=STATE.linreg;
l.data=[];l.w=randn()*0.5;l.b=randn()*0.5;l.step=0;l.lossHistory=[];
for(var i=0;i<l.n;i++){var x=Math.random()*2-1;var y=0.7*x+0.3+randn()*0.2;l.data.push({x:x,y:y})}},
step:function(){var l=STATE.linreg;var dw=0,db=0;var N=l.data.length;
l.data.forEach(function(p){var pred=l.w*p.x+l.b;var e=pred-p.y;dw+=2*e*p.x/N;db+=2*e/N});
l.w-=l.lr*dw;l.b-=l.lr*db;l.step++;
var loss=0;l.data.forEach(function(p){var e=l.w*p.x+l.b-p.y;loss+=e*e});loss/=N;
l.lossHistory.push(loss);if(l.lossHistory.length>300)l.lossHistory.shift()},

registerModule('logreg',{title:'Logistic Regression',icon:'🎯',desc:'Classificador binário linear.',init:function(){var l=STATE.logreg;l.data=DATASETS[l.dataset](l.n);l.w=0;l.b=0;l.step=0},
step:function(){var l=STATE.logreg;var dw=0,db=0;var N=l.data.length;
l.data.forEach(function(p){var z=l.w*p.x+l.b;var pred=1/(1+Math.exp(-z));var e=pred-p.l;dw+=e*p.x/N;db+=e/N});
l.w-=l.lr*dw;l.b-=l.lr*db;l.step++;
var correct=0;l.data.forEach(function(p){var pred=1/(1+Math.exp(-(l.w*p.x+l.b)))>0.5?1:0;if(pred===p.l)correct++});
l.acc=correct/N},

registerModule('kmeans',{title:'K-Means',icon:'🎨',desc:'Clustering com Lloyd\'s algorithm.',init:function(){var k=STATE.kmeans;
k.points=[];for(var i=0;i<k.n;i++){var c=rnd(0,k.k-1);var cx=Math.cos(c/k.k*2*Math.PI)*0.7;var cy=Math.sin(c/k.k*2*Math.PI)*0.7;k.points.push({x:cx+randn()*0.15,y:cy+randn()*0.15,c:-1})}

/* ══════════════ MODULE 10: PCA ══════════════ */
registerModule('pca',{title:'PCA',icon:'📐',desc:'Análise de componentes principais.',init:function(){var p=STATE.pca;
p.data=[];var angle=Math.PI/6;
var cs=Math.cos(angle),sn=Math.sin(angle);
for(var i=0;i<p.n;i++){var a=randn()*0.5;var b=randn()*0.1;p.data.push({x:cs*a-sn*b,y:sn*a+cs*b})}
/* compute mean */
var mx=0,my=0;p.data.forEach(function(q){mx+=q.x;my+=q.y});mx/=p.n;my/=p.n;p.mean=[mx,my];
/* covariance */
var sxx=0,sxy=0,syy=0;
p.data.forEach(function(q){var dx=q.x-mx,dy=q.y-my;sxx+=dx*dx;sxy+=dx*dy;syy+=dy*dy});
sxx/=p.n;sxy/=p.n;syy/=p.n;
/* eigendecomp of 2x2 symmetric */
var trace=sxx+syy;var det=sxx*syy-sxy*sxy;
var l1=trace/2+Math.sqrt(trace*trace/4-det);var l2=trace/2-Math.sqrt(trace*trace/4-det);
var v1x,v1y;
if(Math.abs(sxy)>1e-6){v1x=l1-syy;v1y=sxy;var n=Math.sqrt(v1x*v1x+v1y*v1y);v1x/=n;v1y/=n}
else{v1x=1;v1y=0}
p.axis=[{x:v1x,y:v1y,l:l1},{x:-v1y,y:v1x,l:l2}]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var p=STATE.pca;
var sz=Math.min(W-240,H-80);var px=40,py=40;
ctx.strokeStyle='rgba(255,64,160,.1)';for(var i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(px+sz*i/10,py);ctx.lineTo(px+sz*i/10,py+sz);ctx.stroke();ctx.beginPath();ctx.moveTo(px,py+sz*i/10);ctx.lineTo(px+sz,py+sz*i/10);ctx.stroke()}
p.data.forEach(function(q){var cx=px+(q.x+1)/2*sz;var cy=py+(q.y+1)/2*sz;ctx.fillStyle='rgba(64,224,255,.6)';ctx.beginPath();ctx.arc(cx,cy,2.5,0,Math.PI*2);ctx.fill()});
var mx=px+(p.mean[0]+1)/2*sz;var my=py+(p.mean[1]+1)/2*sz;
p.axis.forEach(function(a,i){
  var len=Math.sqrt(a.l)*3;
  var x1=mx-a.x*len;var y1=my-a.y*len;var x2=mx+a.x*len;var y2=my+a.y*len;
  ctx.strokeStyle=i===0?'#ff40a0':'#ffd040';ctx.lineWidth=3;ctx.setLineDash(i===0?[]:[5,4]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
});
ctx.fillStyle='#40ff90';ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();
var pn=px+sz+20;
ctx.fillStyle='rgba(10,6,22,.9)';ctx.strokeStyle='rgba(255,64,160,.3)';ctx.beginPath();ctx.roundRect(pn,py,W-pn-20,sz,8);ctx.fill();ctx.stroke();
ctx.fillStyle='#ff40a0';ctx.font='bold 12px monospace';ctx.textAlign='left';ctx.fillText('PCA',pn+12,py+24);
ctx.fillStyle='#e0e8ff';ctx.font='11px monospace';
ctx.fillText('PC1 (λ='+fmt(p.axis[0].l,3)+')',pn+12,py+50);
ctx.fillText('  dir=('+fmt(p.axis[0].x,3)+', '+fmt(p.axis[0].y,3)+')',pn+12,py+68);
ctx.fillText('PC2 (λ='+fmt(p.axis[1].l,3)+')',pn+12,py+96);
ctx.fillText('  dir=('+fmt(p.axis[1].x,3)+', '+fmt(p.axis[1].y,3)+')',pn+12,py+114);
ctx.fillStyle='#40ff90';ctx.fillText('Mean: ('+fmt(p.mean[0],3)+', '+fmt(p.mean[1],3)+')',pn+12,py+142);
ctx.fillStyle='#ffd040';ctx.fillText('Var total: '+fmt(p.axis[0].l+p.axis[1].l,3),pn+12,py+170);
ctx.fillStyle='#a060ff';ctx.fillText('PC1 %: '+fmt(p.axis[0].l/(p.axis[0].l+p.axis[1].l)*100,1)+'%',pn+12,py+190);
badge('📐 PCA · PC1 '+fmt(p.axis[0].l/(p.axis[0].l+p.axis[1].l)*100,1)+'%');SV('sbMode','PCA')},

h+='<div class="ctrl"><div class="lbl"><span>Points</span><span>'+p.n+'</span></div><input type="range" min="50" max="1000" step="10" value="'+p.n+'" oninput="STATE.pca.n=parseInt(this.value);MODULES.pca.init();renderLeftPanel()"></div>';

/* ══════════════ MODULE 11: DECISION TREE ══════════════ */
registerModule('dectree',{title:'Decision Tree',icon:'🌲',desc:'Splits recursivos por Gini.',init:function(){var d=STATE.dectree;d.data=DATASETS['Moons'](d.n);d.tree=this.build(d.data,d.depth)},
build:function(data,depth){
  if(depth<=0||data.length<4)return {leaf:true,l:mode(data)};
  var best=null;
  for(var axis=0;axis<2;axis++){
    var vals=data.map(function(p){return axis===0?p.x:p.y}).sort(function(a,b){return a-b});
    for(var i=0;i<vals.length-1;i++){
      var th=(vals[i]+vals[i+1])/2;
      var left=data.filter(function(p){return (axis===0?p.x:p.y)<th});
      var right=data.filter(function(p){return (axis===0?p.x:p.y)>=th});
      if(left.length<2||right.length<2)continue;
      var g=gini(left)+gini(right);
      if(best===null||g<best.g){best={axis:axis,th:th,g:g,left:left,right:right}}
    }
  }
  if(!best)return {leaf:true,l:mode(data)};
  return {leaf:false,axis:best.axis,th:best.th,left:this.build(best.left,depth-1),right:this.build(best.right,depth-1)};
  function mode(arr){var c={};arr.forEach(function(p){c[p.l]=(c[p.l]||0)+1});var bm=0,bc=-1;for(var k in c){if(c[k]>bc){bc=c[k];bm=parseInt(k)}}return bm}
  function gini(arr){var c={};arr.forEach(function(p){c[p.l]=(c[p.l]||0)+1});var s=0;for(var k in c){var pk=c[k]/arr.length;s+=pk*(1-pk)}return s*arr.length/100}
},
predict:function(tree,p){
  if(tree.leaf)return tree.l;
  var v=tree.axis===0?p.x:p.y;
  return v<tree.th?this.predict(tree.left,p):this.predict(tree.right,p);
},
drawRect:function(ctx,tree,x,y,w,h){
  if(tree.leaf){
    ctx.fillStyle=tree.l===0?'rgba(64,224,255,.15)':'rgba(255,64,160,.15)';
    ctx.fillRect(x,y,w,h);
    return;
  }
  if(tree.axis===0){
    var wl=w*tree.th;
    /* recompute based on split in data range -1..1: ratio = (th+1)/2 */
    var ratio=(tree.th+1)/2;
    this.drawRect(ctx,tree.left,x,y,w*ratio,h);
    this.drawRect(ctx,tree.right,x+w*ratio,y,w*(1-ratio),h);
  }else{
    var ratio=(tree.th+1)/2;
    this.drawRect(ctx,tree.left,x,y,w,h*ratio);
    this.drawRect(ctx,tree.right,x,y+h*ratio,w,h*(1-ratio));
  }
},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var d=STATE.dectree;
var sz=Math.min(W-80,H-100);var px=(W-sz)/2,py=(H-sz)/2;
this.drawRect(ctx,d.tree,px,py,sz,sz);
drawPoints(ctx,d.data,px,py,sz,sz,3);
ctx.strokeStyle='#40ff90';ctx.lineWidth=2;ctx.strokeRect(px,py,sz,sz);
var correct=0;d.data.forEach(function(p){if(this.predict(d.tree,p)===p.l)correct++},this);
var acc=correct/d.data.length;
badge('🌲 Tree · depth='+d.depth+' · acc='+fmt(acc*100,1)+'%');SV('sbMode','Decision Tree');SV('sbAcc',fmt(acc*100,1)+'%')},
onDown:function(){},
controls:function(){var d=STATE.dectree;var h='<div class="sec"><h4>Tree</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Max depth</span><span>'+d.depth+'</span></div><input type="range" min="1" max="8" value="'+d.depth+'" oninput="STATE.dectree.depth=parseInt(this.value);MODULES.dectree.init();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Points</span><span>'+d.n+'</span></div><input type="range" min="50" max="600" step="10" value="'+d.n+'" oninput="STATE.dectree.n=parseInt(this.value);MODULES.dectree.init();renderLeftPanel()"></div>';
h+='<button class="btn primary full" onclick="MODULES.dectree.init()">🎲 New tree</button>';
h+='</div>';
return h},

registerModule('knn',{title:'KNN',icon:'📍',desc:'K-Nearest Neighbors classifier.',init:function(){var k=STATE.knn;k.data=DATASETS['Moons'](k.n)},
tick:function(dt){STATE.time+=dt},
classify:function(x,y,k){

  var cnt={};

  var bm=0,bc=-1;for(var j in cnt){if(cnt[j]>bc){bc=cnt[j];bm=parseInt(j)}}

},

/* ══════════════ MODULE 13: NAIVE BAYES ══════════════ */
registerModule('naivebayes',{title:'Naive Bayes',icon:'🎲',desc:'Gaussian Naive Bayes classifier.',init:function(){var n=STATE.naivebayes;n.data=DATASETS['Gaussians'](n.n);
n.gaussians=[];
[0,1].forEach(function(cls){
  var pts=n.data.filter(function(p){return p.l===cls});
  var mx=0,my=0;pts.forEach(function(p){mx+=p.x;my+=p.y});mx/=pts.length;my/=pts.length;
  var vx=0,vy=0;pts.forEach(function(p){vx+=(p.x-mx)*(p.x-mx);vy+=(p.y-my)*(p.y-my)});vx/=pts.length;vy/=pts.length;
  n.gaussians.push({cls:cls,mx:mx,my:my,vx:vx,vy:vy,prior:pts.length/n.data.length});
})},
pdf:function(x,m,v){return Math.exp(-(x-m)*(x-m)/(2*v))/Math.sqrt(2*Math.PI*v)},
classify:function(x,y){
  var n=STATE.naivebayes;var best=0,bp=-Infinity;
  n.gaussians.forEach(function(g){

    if(logp>bp){bp=logp;best=g.cls}
  },this);

},

registerModule('svm',{title:'SVM',icon:'⚔',desc:'Support Vector Machine (linear + RBF).',init:function(){var s=STATE.svm;s.data=DATASETS['Moons'](s.n);s.alphas=[];for(var i=0;i<s.n;i++)s.alphas.push(0);this.train()},
kernel:function(a,b){
  var s=STATE.svm;
  if(s.kernel==='linear')return a.x*b.x+a.y*b.y;
  var d=(a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y);
  return Math.exp(-s.gamma*d);
},
train:function(){var s=STATE.svm;var N=s.n;
for(var iter=0;iter<30;iter++){
  for(var i=0;i<N;i++){
    var ei=this.decision(s.data[i])-s.data[i].l;
    if((s.data[i].l*ei<-0.001&&s.alphas[i]<s.C)||(s.data[i].l*ei>0.001&&s.alphas[i]>0)){
      var j=rnd(0,N-1);if(j===i)continue;
      var ej=this.decision(s.data[j])-s.data[j].l;
      var ai=s.alphas[i],aj=s.alphas[j];
      var L,H;
      if(s.data[i].l!==s.data[j].l){L=Math.max(0,aj-ai);H=Math.min(s.C,s.C+aj-ai)}
      else{L=Math.max(0,ai+aj-s.C);H=Math.min(s.C,ai+aj)}
      if(L===H)continue;
      var eta=2*this.kernel(s.data[i],s.data[j])-this.kernel(s.data[i],s.data[i])-this.kernel(s.data[j],s.data[j]);
      if(eta>=0)continue;
      var ajNew=aj-s.data[j].l*(ei-ej)/eta;
      ajNew=clamp(ajNew,L,H);
      if(Math.abs(ajNew-aj)<1e-5)continue;
      s.alphas[i]=ai+s.data[i].l*s.data[j].l*(aj-ajNew);
      s.alphas[j]=ajNew;
    }
  }
}},
decision:function(p){var s=STATE.svm;var sum=0;
for(var i=0;i<s.n;i++){if(s.alphas[i]>1e-5){sum+=s.alphas[i]*s.data[i].l*this.kernel(s.data[i],p)}}
/* no explicit bias — SVM usually has b, we use sign of sum */
return sum},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var s=STATE.svm;

var res=40;
for(var i=0;i<res;i++)for(var j=0;j<res;j++){

  ctx.fillRect(px+i/res*sz,py+j/res*sz,sz/res+0.5,sz/res+0.5);
}
drawPoints(ctx,s.data,px,py,sz,sz,3);
/* support vectors */
s.data.forEach(function(p,i){if(s.alphas[i]>1e-5){
  var cx=px+(p.x+1)/2*sz;var cy=py+(p.y+1)/2*sz;

badge('⚔ SVM · '+s.kernel+' · '+nSupport+' SV');SV('sbMode','SVM')},

registerModule('cnn',{title:'CNN Convolution',icon:'🔲',desc:'Filtro convolucional 2D.',init:function(){var c=STATE.cnn;

c.filter=[];for(var y=0;y<c.filterSize;y++){var row=[];for(var x=0;x<c.filterSize;x++){row.push(Math.random()<0.5?1:0)}c.filter.push(row)}
this.convolve()},
convolve:function(){var c=STATE.cnn;var out=[];var k=c.filterSize;
for(var y=0;y<=c.size-k;y++){
  var row=[];
  for(var x=0;x<=c.size-k;x++){
    var s=0;
    for(var fy=0;fy<k;fy++)for(var fx=0;fx<k;fx++)s+=c.image[y+fy][x+fx]*c.filter[fy][fx];
    row.push(s);
  }
  out.push(row);
}
c.result=out},

registerModule('rnn',{title:'RNN Sequence',icon:'🔄',desc:'Recurrent net em sequence.',init:function(){var r=STATE.rnn;
r.hidden=8;r.step=0;r.weights=null;r.h=null;r.loss=0;
r.Wx=Mat.randn(r.hidden,1,0.5);r.Wh=Mat.randn(r.hidden,r.hidden,0.5);r.Why=Mat.randn(1,r.hidden,0.5);r.bh=Mat.zeros(r.hidden,1);r.by=Mat.zeros(1,1);
r.h=Mat.zeros(r.hidden,1)},
forward:function(x){
  var r=STATE.rnn;
  var h=actMat(r.Wx.matmul(x).add(r.Wh.matmul(r.h)).add(r.bh),'Tanh');
  var y=actMat(r.Why.matmul(h).add(r.by),'Sigmoid');
  return {h:h,y:y};
},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*8;while(this._acc>=1){
  var r=STATE.rnn;var chars=r.seq.split('');
  var i=r.step%chars.length;
  var next=chars[(i+1)%chars.length];
  var c=chars[i].charCodeAt(0)/128;
  var nc=next.charCodeAt(0)/128;
  var out=this.forward(Mat.fromArray([c]));
  r.h=out.h;
  var loss=Math.pow(out.y.d[0]-nc,2);
  r.loss=r.loss*0.95+loss*0.05;
  r.step++;
  if(r.step>5000)r.step=0;
  this._acc-=1;
}},

registerModule('autoencoder',{title:'Autoencoder',icon:'🗜',desc:'Compressão 2D → 1D → 2D.',init:function(){var a=STATE.autoencoder;
a.data=DATASETS['Circle'](a.n);
a.enc=new MLP([2,8,4,1],'ReLU','Tanh');
a.dec=new MLP([1,4,8,2],'ReLU','Tanh');
a.encState=new OptState();a.decState=new OptState();a.step=0;a.loss=0},
step:function(){var a=STATE.autoencoder;var N=a.n;var bs=Math.min(16,N);
var totalLoss=0;
for(var i=0;i<bs;i++){
  var p=a.data[rnd(0,N-1)];
  var x=Mat.fromArray([p.x,p.y]);
  var enc=a.enc.forward(x,true);
  var dec=a.dec.forward(enc.out,true);
  var y=Mat.fromArray([p.x,p.y]);
  var bp=a.dec.backward(dec.cache,y,'MSE');
  totalLoss+=bp.loss;
  /* update dec */
  var dW={},dB={},gW={},gB={};
  for(var li=0;li<a.dec.W.length;li++){dW['W'+li]=a.dec.W[li];dB['b'+li]=a.dec.b[li];gW['W'+li]=bp.gradsW[li].scale(0.5);gB['b'+li]=bp.gradsB[li].scale(0.5)}
  optStep('Adam',dW,gW,a.decState,0.01);
  optStep('Adam',dB,gB,a.decState,0.01);
  /* update enc via dec.W gradients (approximate) */
  var d1=a.dec.W[0].T().matmul(bp.gradsW[0]).scale(0.5);
  var eW={W0:a.enc.W[0],W1:a.enc.W[1],W2:a.enc.W[2]};
  var eB={b0:a.enc.b[0],b1:a.enc.b[1],b2:a.enc.b[2]};
  var egW={W0:d1,W1:d1,W2:d1};
  var egB={b0:bp.gradsB[0].scale(0.5),b1:bp.gradsB[0].scale(0.5),b2:bp.gradsB[0].scale(0.5)};
  optStep('Adam',eW,egW,a.encState,0.005);
  optStep('Adam',eB,egB,a.encState,0.005);
}
a.loss=a.loss*0.9+totalLoss/bs*0.1;
a.step++},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*40;while(this._acc>=1){this.step();this._acc-=1}},

/* original */

ctx.fillStyle='#ff40a0';ctx.font='bold 11px monospace';ctx.textAlign='left';

/* reconstructed */
var rx=px+sz+40;var ry=py;

registerModule('qlearn',{title:'Q-Learning GridWorld',icon:'🏆',desc:'Reinforcement learning em gridworld.',init:function(){var q=STATE.qlearn;
q.Q={};for(var y=0;y<q.rows;y++)for(var x=0;x<q.cols;x++){q.Q[y+','+x]=[0,0,0,0]}
q.agent=[0,0];q.episode=0;q.steps=0;q.epsilon=1.0;q.reward=0;q.path=[];q.totalReward=0},
qGet:function(s,a){return STATE.qlearn.Q[s][a]},
qSet:function(s,a,v){STATE.qlearn.Q[s][a]=v},
step:function(){var q=STATE.qlearn;
var actions=[[1,0],[-1,0],[0,1],[0,-1]];
var sx=q.agent[0],sy=q.agent[1];
var s=sy+','+sx;
var a;
if(Math.random()<q.epsilon)a=rnd(0,3);
else{
  var best=0;var bv=q.qGet(s,0);
  for(var i=1;i<4;i++){var v=q.qGet(s,i);if(v>bv){bv=v;best=i}}
  a=best;
}
var nx=sx+actions[a][0];var ny=sy+actions[a][1];
var r=-1;
if(nx<0||nx>=q.cols||ny<0||ny>=q.rows){nx=sx;ny=sy;r=-5}
else if(nx===q.goal[0]&&ny===q.goal[1]){r=100}
var ns=ny+','+nx;
var maxNext=Math.max.apply(null,q.Q[ns]);
var oldQ=q.qGet(s,a);
var newQ=oldQ+q.lr*(r+q.gamma*maxNext-oldQ);
q.qSet(s,a,newQ);
q.agent=[nx,ny];
q.steps++;
q.reward+=r;
q.path.push([nx,ny]);
if(q.path.length>200)q.path.shift();
if(r===100||q.steps>200){
  q.episode++;
  q.epsilon=Math.max(0.05,q.epsilon*0.995);
  q.agent=[0,0];
  q.steps=0;
  q.totalReward+=q.reward;
  q.reward=0;
  q.path=[];
}},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*30;while(this._acc>=1){this.step();this._acc-=1}},

registerModule('attention',{title:'Self-Attention',icon:'👁',desc:'Transformer attention weights.',init:function(){var a=STATE.attention;
a.dim=8;a.Q=[];a.K=[];a.V=[];
for(var i=0;i<a.seq.length;i++){
  var q=new Array(a.dim);var k=new Array(a.dim);var v=new Array(a.dim);
  for(var d=0;d<a.dim;d++){q[d]=randn();k[d]=randn();v[d]=randn()}
  a.Q.push(q);a.K.push(k);a.V.push(v);
}
var n=a.seq.length;
a.weights=[];
for(var i=0;i<n;i++){
  var row=[];
  var scores=[];
  for(var j=0;j<n;j++){
    var s=0;for(var d2=0;d2<a.dim;d2++)s+=a.Q[i][d2]*a.K[j][d2];
    s/=Math.sqrt(a.dim);
    scores.push(s);
  }
  var mx=Math.max.apply(null,scores);var ex=scores.map(function(x){return Math.exp(x-mx)});
  var sum=ex.reduce(function(a,b){return a+b},0);
  row=ex.map(function(x){return x/sum});
  a.weights.push(row);
}},

registerModule('roc',{title:'ROC / Confusion',icon:'📈',desc:'Curva ROC + AUC + confusion matrix.',init:function(){var r=STATE.roc;
r.yTrue=[];r.yScore=[];
for(var i=0;i<r.n;i++){
  var l=i%2;
  r.yTrue.push(l);
  var score=l?0.5+randn()*0.2:0.5+randn()*0.2-0.4;
  r.yScore.push(clamp(score,0,1));
}
this.compute()},
compute:function(){var r=STATE.roc;
var pairs=[];
for(var i=0;i<r.n;i++)pairs.push({s:r.yScore[i],y:r.yTrue[i]});
pairs.sort(function(a,b){return b.s-a.s});
var P=pairs.filter(function(p){return p.y===1}).length;
var N=pairs.filter(function(p){return p.y===0}).length;
r.roc=[{fpr:0,tpr:0}];
var tp=0,fp=0;
for(var i=0;i<pairs.length;i++){
  if(pairs[i].y===1)tp++;else fp++;
  r.roc.push({fpr:fp/N,tpr:tp/P});
}
/* AUC via trapezoid */
var auc=0;
for(var i=1;i<r.roc.length;i++){
  var x1=r.roc[i-1].fpr,x2=r.roc[i].fpr;
  var y1=r.roc[i-1].tpr,y2=r.roc[i].tpr;
  auc+=(x2-x1)*(y1+y2)/2;
}
r.auc=auc;
/* confusion matrix at threshold */
var t=r.threshold;
var cm={tp:0,fp:0,tn:0,fn:0};
for(var i=0;i<r.n;i++){
  var pred=r.yScore[i]>=t?1:0;
  if(pred===1&&r.yTrue[i]===1)cm.tp++;
  else if(pred===1&&r.yTrue[i]===0)cm.fp++;
  else if(pred===0&&r.yTrue[i]===0)cm.tn++;
  else cm.fn++;
}
r.cm=cm;
r.acc=(cm.tp+cm.tn)/r.n;
r.prec=cm.tp/(cm.tp+cm.fp)||0;
r.recall=cm.tp/(cm.tp+cm.fn)||0;
r.f1=2*r.prec*r.recall/(r.prec+r.recall)||0},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);var r=STATE.roc;
/* ROC */
var sz=Math.min(W*0.45,H-120);var px=60,py=60;
ctx.strokeStyle='rgba(255,64,160,.15)';for(var i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(px+sz*i/10,py);ctx.lineTo(px+sz*i/10,py+sz);ctx.stroke();ctx.beginPath();ctx.moveTo(px,py+sz*i/10);ctx.lineTo(px+sz,py+sz*i/10);ctx.stroke()}

  var h='';
  h+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.7rem">'+m.icon+' '+m.title+'</h4>';
  h+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+esc(m.desc||'')+'</div></div>';
  try{if(m.controls)h+=m.controls()}
  catch(e){h+='<div class="sec"><div class="empty" style="color:var(--p1)">controls error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}
  b.innerHTML=h;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var s=$('rpState');
  if(s)s.innerHTML='<div class="sec"><h4>Live</h4><div class="kv"><div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div><div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div><div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div></div></div>';
  var mp=$('rpMath');
  if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){var p=$('rpLogs');if(!p)return;
var h='<div class="sec"><h4>Log</h4>';
if(!LOG.length)h+='<div class="empty">No events</div>';
else LOG.slice().reverse().forEach(function(l){
  var c=l.type==='error'?'var(--p1)':l.type==='success'?'var(--p3)':'var(--p2)';
  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});
h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['neon','paper','matrix'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){openModal('❓ NEUROLAB — Help','<div class="sec"><h4>🧠 20 Módulos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">Playground</b> — MLP com backprop real<br><b style="color:var(--p1)">Datasets</b> · <b style="color:var(--p1)">Activations</b> · <b style="color:var(--p1)">Losses</b><br><b style="color:var(--p1)">Optimizers</b> · <b style="color:var(--p1)">Backprop</b> · <b style="color:var(--p1)">LinReg</b> · <b style="color:var(--p1)">LogReg</b><br><b style="color:var(--p1)">K-Means</b> · <b style="color:var(--p1)">PCA</b> · <b style="color:var(--p1)">DecTree</b> · <b style="color:var(--p1)">KNN</b><br><b style="color:var(--p1)">Naive Bayes</b> · <b style="color:var(--p1)">SVM</b> · <b style="color:var(--p1)">CNN</b> · <b style="color:var(--p1)">RNN</b><br><b style="color:var(--p1)">Autoencoder</b> · <b style="color:var(--p1)">Q-Learning</b> · <b style="color:var(--p1)">Attention</b> · <b style="color:var(--p1)">ROC</b></div></div><div class="sec"><h4>⌨️ Shortcuts</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Space=Play · →=Step · R=Reset · T=Theme · ?=Help</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#020105';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#ff40a0';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('NEUROLAB ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('NEUROLAB ready — 20 módulos ML','success',3000);
});
console.log('%c NEUROLAB ','background:linear-gradient(90deg,#ff40a0,#a060ff,#40e0ff,#40ff90);color:#05030a;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
</script>
</body></html>
