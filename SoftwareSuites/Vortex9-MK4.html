function unlockAchievement(id){
  if(EXP.unlockedAch.indexOf(id)>=0)return;
  var a=ACHIEVEMENTS.find(function(x){return x.id===id});
  if(!a)return;
  EXP.unlockedAch.push(id);
  var pop=document.getElementById('achPop');
  if(pop){
    var n=document.getElementById('achName');
    var d=document.getElementById('achDesc');
    if(n)n.textContent=a.n;
    if(d)d.textContent=a.d;
    pop.classList.add('on');
    setTimeout(function(){pop.classList.remove('on')},4000);
  }
  toast('★ '+a.n,'gr',3000);
  try{AUDIO.chord([800,1200,1600],0.4);FX.trigger(0.8,0.4)}catch(e){}
  if(EXP.unlockedAch.length>=10&&EXP.unlockedAch.indexOf('completionist')<0)setTimeout(function(){unlockAchievement('completionist')},1500);
}
function checkAchievements(){
  var p=EXP.progress;
  if(p.jumps>0)unlockAchievement('first_jump');
  if(SHIP.warp>=9.5)unlockAchievement('speed_demon');
  if(Object.keys(p.sectors||{}).length>=5)unlockAchievement('explorer');
  if(p.scans>=20)unlockAchievement('scan_master');
  if(p.weaponsFired>=50)unlockAchievement('gunner');
  if(p.redAlerts>=10)unlockAchievement('red_alert');
  if(SHIP.hull<20)unlockAchievement('survivor');
  if(p.repairs>=30)unlockAchievement('engineer');
  if(p.trades>=10)unlockAchievement('trader');
  if(p.research>=5)unlockAchievement('researcher');
  if(Object.keys(EXP.inventory).length>=20)unlockAchievement('collector');
  if(p.missions>=5)unlockAchievement('mission_master');
  if(p.codexRead&&p.codexRead.length>=25)unlockAchievement('codex');
  if(EXP.stats.totalPlayTime>=1800)unlockAchievement('veteran');
  if(SHIP.hull<10)unlockAchievement('necromancer');
}

/* ═══════════════════ RESEARCH ═══════════════════ */
function unlockResearch(id){
  var r=RESEARCH.find(function(x){return x.id===id});
  if(!r){toast('Unknown research: '+id,'rd');return}
  if(r.unlocked){toast('Already researched','am');return}
  var missing=(r.req||[]).filter(function(q){var rr=RESEARCH.find(function(x){return x.id===q});return !rr||!rr.unlocked});
  if(missing.length){toast('Prerequisites: '+missing.join(', '),'am');return}
  if(EXP.researchPoints<r.cost){toast('Need '+(r.cost-Math.floor(EXP.researchPoints))+' more RP','am');return}
  EXP.researchPoints-=r.cost;
  r.unlocked=true;
  EXP.progress.research++;
  toast('Researched: '+r.n,'gr',3000);
  try{AUDIO.chord([600,900,1200],0.3);FX.trigger(1.2,0.5)}catch(e){}
  if(id==='r_basic_sensors')SHIP.sensors.range=10;
  if(id==='r_long_sensors')SHIP.sensors.range=50;
  if(id==='r_shield_1')SHIP.shieldRegen*=1.25;
  if(id==='r_shield_2')SHIP.shieldRegen*=1.5;
  if(id==='r_weapons_1')SHIP.powerDist.weapons=Math.min(100,SHIP.powerDist.weapons+15);
  if(id==='r_torpedo_1')SHIP.weapons.torpedoes.count=SHIP.weapons.torpedoes.maxCount;
  if(id==='r_quantum')SHIP.weapons.quantum.count=SHIP.weapons.quantum.maxCount;
  if(id==='r_nanites'){SHIP.nanites.active=true;SHIP.nanites.rate=0.5}
  if(id==='r_cloak')SHIP.cloak.power=100;
}
function isResearched(id){var r=RESEARCH.find(function(x){return x.id===id});return r&&r.unlocked}

function getItem(id){return ITEM_DB.find(function(x){return x.id===id||x.n.toLowerCase()===String(id).toLowerCase()})}
function buyItem(nameOrId){
  var item=getItem((nameOrId||'').trim());
  if(!item){toast('Unknown item: '+nameOrId,'rd');return}
  var price=EXP.marketPrices[item.id]||100;
  if(EXP.credits<price){toast('Insufficient credits ('+EXP.credits+'/'+price+')','am');return}
  EXP.credits-=price;
  EXP.inventory[item.id]=(EXP.inventory[item.id]||0)+1;
  EXP.progress.items++;EXP.progress.trades++;
  EXP.trades.push({t:SHIP.time,item:item.id,price:price,type:'buy'});
  toast('Bought '+item.n+' for '+price+' cr','gr');
  try{AUDIO.blip(1200,0.15,'sine',0.04)}catch(e){}
}
function sellItem(nameOrId){
  var item=getItem((nameOrId||'').trim());
  if(!item){toast('Unknown item','rd');return}
  if(!EXP.inventory[item.id]||EXP.inventory[item.id]<=0){toast('No '+item.n,'am');return}
  var price=Math.floor((EXP.marketPrices[item.id]||100)*0.8);
  EXP.inventory[item.id]--;
  if(EXP.inventory[item.id]===0)delete EXP.inventory[item.id];
  EXP.credits+=price;EXP.stats.creditsEarned+=price;EXP.progress.trades++;
  EXP.trades.push({t:SHIP.time,item:item.id,price:price,type:'sell'});
  toast('Sold '+item.n+' for '+price+' cr','gr');
}

function loadProgress(){
  try{
    var s=STORE.load('save_slot_1',null);

    EXP.latinum=s.latinum||EXP.latinum;
    EXP.researchPoints=s.researchPoints||EXP.researchPoints;
    EXP.inventory=s.inventory||EXP.inventory;
    EXP.unlockedAch=s.achievements||[];
    EXP.progress=s.progress||EXP.progress;
    EXP.stats=s.stats||EXP.stats;

      var r=RESEARCH.find(function(x){return x.id===id});
      if(r)r.unlocked=true;
    });
    if(s.ship){
      SHIP.fuel=s.ship.fuel||SHIP.fuel;
      SHIP.hull=s.ship.hull||SHIP.hull;
      SHIP.warp=s.ship.warp||0;
      if(s.ship.pos)SHIP.pos=s.ship.pos;
      SHIP.heading=s.ship.heading||0;
    }
    if(s.sector&&window.V9)window.V9.sector=s.sector;
    if(s.factions)s.factions.forEach(function(f){
      var fac=FACTIONS.find(function(x){return x.id===f.id});
      if(fac)fac.stance=f.stance;
    });
    if(s.missions)EXP.missions=s.missions;

}

/* ═══════════════════ AUTOCOMPLETE ═══════════════════ */
function initAutocomplete(){
  var inp=document.getElementById('cmdInput');
  if(!inp)return;
  if(document.getElementById('autocomplete'))return;
  var ac=document.createElement('div');
  ac.className='autocomplete';
  ac.id='autocomplete';
  inp.parentElement.style.position='relative';
  inp.parentElement.appendChild(ac);
  var cmdList=Object.keys(CMDS.commands);
  var selIdx=0;
  function refresh(){
    var filter=inp.value.toLowerCase().trim();
    if(!filter){ac.classList.remove('on');return}
    var matches=cmdList.filter(function(c){return c.indexOf(filter)>=0});
    if(!matches.length){ac.classList.remove('on');return}
    ac.innerHTML='';
    matches.slice(0,8).forEach(function(m,i){
      var d=document.createElement('div');
      d.className='ac'+(i===selIdx?' sel':'');
      d.innerHTML='<span>'+m+'</span>';
      d.onclick=function(){inp.value=m;ac.classList.remove('on');CMDS.run()};
      ac.appendChild(d);
    });
    ac.classList.add('on');
  }
  inp.addEventListener('input',refresh);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Tab'&&ac.classList.contains('on')){
      e.preventDefault();
      var filter=inp.value.toLowerCase().trim();
      var matches=cmdList.filter(function(c){return c.indexOf(filter)>=0});
      if(matches[selIdx]){inp.value=matches[selIdx];ac.classList.remove('on')}
    }
  });
}

var R={};

function bg(){
  var c=CTX.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  c.addColorStop(0,'rgba(0,12,30,.5)');
  c.addColorStop(1,'rgba(0,0,5,.92)');
  CTX.fillStyle=c;
  CTX.fillRect(0,0,W,H);
}
function ttl(t,sub){
  CTX.fillStyle='rgba(0,229,255,.9)';
  CTX.font='bold 14px monospace';
  CTX.textAlign='left';
  CTX.fillText(t,20,28);
  if(sub){CTX.fillStyle='rgba(255,0,170,.8)';CTX.font='10px monospace';CTX.fillText(sub,20,44)}
}
function stars_bg(dt){
  for(var i=0;i<stars3D.length;i+=3){
    var s=stars3D[i];
    var px=W/2+s.x/s.z*W/2*0.9;
    var py=H/2+s.y/s.z*H/2*0.9;
    if(px<0||px>W||py<0||py>H)continue;
    CTX.globalAlpha=(1-s.z)*0.5;
    CTX.fillStyle=s.c;
    CTX.fillRect(px,py,1,1);
  }
  CTX.globalAlpha=1;
}

R.HOLODECK=function(dt){

    CTX.lineWidth=1;
    CTX.beginPath();CTX.arc(cx,cy,r,0,Math.PI*2);CTX.stroke();
    for(var k=0;k<6;k++){

    }
  }
  CTX.strokeStyle='rgba(255,0,170,.4)';
  for(var x=cx-100;x<=cx+100;x+=20){CTX.beginPath();CTX.moveTo(x,cy-60);CTX.lineTo(x,cy+60);CTX.stroke()}
  for(var y=cy-60;y<=cy+60;y+=20){CTX.beginPath();CTX.moveTo(cx-100,y);CTX.lineTo(cx+100,y);CTX.stroke()}

R.MEDBAY=function(dt){
  bg();stars_bg(dt);
  ttl('✚ MEDICAL BAY','Sickbay Operations');
  var cy=H/2;
  for(var i=0;i<3;i++){
    var x=100+i*300;
    var y=cy-100;
    CTX.strokeStyle='rgba(0,255,136,.9)';
    CTX.lineWidth=2;
    CTX.beginPath();
    for(var k=0;k<200;k++){
      var px=x+k;
      var t=(k+SHIP.time*100)%200;
      var py=y+40;
      if(t<50)py=y+40-Math.sin(t/50*Math.PI)*30;
      else if(t<60)py=y+40+Math.sin((t-50)/10*Math.PI)*15;
      if(k===0)CTX.moveTo(px,py);else CTX.lineTo(px,py);

      CTX.fillText(r.d.substring(0,22),x+8,y+8);
      CTX.fillStyle='rgba(255,170,0,.9)';
      CTX.fillText('⚡ '+r.cost,x+8,y+20);
      x+=boxW+10;
    });
  }
  CTX.fillStyle='rgba(0,229,255,.9)';
  CTX.font='bold 12px monospace';CTX.textAlign='right';
  CTX.fillText('⚡ '+Math.floor(EXP.researchPoints)+' RP',W-20,30);
  CTX.textAlign='left';
};

R.ACHIEVEMENTS=function(dt){
  bg();stars_bg(dt);
  ttl('★ ACHIEVEMENTS',EXP.unlockedAch.length+' / '+ACHIEVEMENTS.length);
  var cols=4;
  var cw=(W-80)/cols;
  var ch=60;
  ACHIEVEMENTS.forEach(function(a,i){
    var col=i%cols,row=Math.floor(i/cols);
    var x=40+col*cw,y=80+row*ch;
    if(y>H-80)return;
    var unlocked=EXP.unlockedAch.indexOf(a.id)>=0;
    CTX.fillStyle=unlocked?'rgba(0,255,136,.12)':'rgba(100,100,140,.1)';
    CTX.fillRect(x,y,cw-10,ch-10);
    CTX.strokeStyle=unlocked?'rgba(0,255,136,.7)':'rgba(100,100,140,.4)';
    CTX.lineWidth=unlocked?2:1;
    CTX.strokeRect(x,y,cw-10,ch-10);
    if(unlocked){CTX.shadowColor='rgba(0,255,136,.4)';CTX.shadowBlur=15;CTX.strokeRect(x,y,cw-10,ch-10);CTX.shadowBlur=0}
    CTX.fillStyle=unlocked?'rgba(255,170,0,.95)':'rgba(100,100,140,.5)';
    CTX.font='20px monospace';CTX.textAlign='center';
    CTX.fillText(a.icon,x+cw/2-5,y+30);
    CTX.fillStyle=unlocked?'rgba(0,229,255,.95)':'rgba(150,150,180,.5)';
    CTX.font='9px monospace';
    CTX.fillText(a.n,x+cw/2-5,y+46);
    CTX.textAlign='left';
  });
};

R.ENCOUNTERS=function(dt){
  bg();stars_bg(dt);
  ttl('◈ ENCOUNTER LOG',EXP.encounterLog.length+' events');
  if(!EXP.encounterLog.length){
    CTX.fillStyle='rgba(150,150,180,.5)';
    CTX.font='12px monospace';CTX.textAlign='center';
    CTX.fillText('No encounters logged',W/2,H/2);
    CTX.textAlign='left';
    return;
  }
  EXP.encounterLog.slice(0,15).forEach(function(e,i){
    CTX.fillStyle='rgba(0,229,255,.8)';
    CTX.font='10px monospace';CTX.textAlign='left';
    CTX.fillText('['+fmt(e.t,1)+'s]  '+e.name,40,80+i*22);
    CTX.fillStyle='rgba(255,170,0,.6)';
    CTX.font='8px monospace';
    CTX.fillText(e.type.toUpperCase(),40,80+i*22+12);
  });
  if(EXP.currentEncounter){
    CTX.fillStyle='rgba(255,0,170,.9)';
    CTX.font='bold 12px monospace';CTX.textAlign='center';
    CTX.fillText('⚠ ACTIVE: '+EXP.currentEncounter.name,W/2,H-40);
  }
};

R.DIPLOMACY=function(dt){
  bg();stars_bg(dt);
  ttl('✉ DIPLOMACY','Faction Relations');
  var cx=W/2,cy=H/2;
  var R=Math.min(W,H)*0.32;
  CTX.fillStyle='rgba(0,229,255,.9)';
  CTX.beginPath();CTX.arc(cx,cy,8,0,Math.PI*2);CTX.fill();
  FACTIONS.forEach(function(f,i){
    var ang=i/FACTIONS.length*Math.PI*2+SHIP.time*0.05;
    var x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    var col=f.stance>=70?'0,255,136':f.stance>=40?'0,229,255':f.stance>=20?'255,170,0':'255,51,85';
    CTX.strokeStyle='rgba('+col+',.5)';
    CTX.lineWidth=1+f.stance/50;
    CTX.beginPath();CTX.moveTo(cx,cy);CTX.lineTo(x,y);CTX.stroke();
    CTX.fillStyle='rgba('+col+',.9)';
    CTX.beginPath();CTX.arc(x,y,14,0,Math.PI*2);CTX.fill();
    CTX.fillStyle='rgba(200,210,255,.9)';
    CTX.font='bold 9px monospace';CTX.textAlign='center';
    CTX.fillText(f.n,x,y-20);
    CTX.fillStyle='rgba('+col+',.9)';
    CTX.fillText(f.stance+'%',x,y+4);
  });
  CTX.textAlign='left';
};

R.ECONOMY=function(dt){
  bg();stars_bg(dt);
  ttl('💱 ECONOMY','Trade & Markets');
  CTX.fillStyle='rgba(0,229,255,.9)';
  CTX.font='bold 14px monospace';CTX.textAlign='left';
  CTX.fillText('◆ CREDITS: '+EXP.credits,20,80);
  CTX.fillStyle='rgba(255,170,0,.9)';
  CTX.fillText('★ LATINUM: '+EXP.latinum,20,100);
  CTX.fillStyle='rgba(255,0,170,.9)';
  CTX.font='bold 10px monospace';
  CTX.fillText('MARKET',20,140);
  CTX.font='10px monospace';
  var items=Object.keys(EXP.marketPrices).slice(0,15);
  items.forEach(function(k,i){
    var item=getItem(k);if(!item)return;
    var col=i%2,row=Math.floor(i/2);
    var x=20+col*(W-40)/2;
    var y=160+row*18;
    var price=EXP.marketPrices[k];
    var trend=Math.sin(SHIP.time*0.3+i)>0?'▲':'▼';
    var tc=trend==='▲'?'255,51,85':'0,255,136';
    CTX.fillStyle='rgba(0,229,255,.8)';
    CTX.textAlign='left';CTX.fillText(item.n,x,y);
    CTX.fillStyle='rgba(255,170,0,.9)';
    CTX.textAlign='right';CTX.fillText(price+'cr',x+(W-40)/2-70,y);
    CTX.fillStyle='rgba('+tc+',.9)';
    CTX.fillText(trend,x+(W-40)/2-50,y);
    CTX.textAlign='left';
  });
};

R.NAVLONG=function(dt){
  bg();
  ttl('⌖ LONG-RANGE NAV','Deep Space');
  var cx=W/2,cy=H/2;
  var R=Math.min(W,H)*0.42;
  for(var i=1;i<=5;i++){
    CTX.strokeStyle='rgba(0,229,255,.15)';
    CTX.beginPath();CTX.arc(cx,cy,R*i/5,0,Math.PI*2);CTX.stroke();
    CTX.fillStyle='rgba(0,229,255,.4)';
    CTX.font='9px monospace';CTX.textAlign='left';
    CTX.fillText((i*10)+'AU',cx+R*i/5+4,cy+3);
  }
  EXP.longRange.contacts.forEach(function(c){
    var r=c.dist/50*R;
    var x=cx+Math.cos(c.bearing)*r,y=cy+Math.sin(c.bearing)*r;
    var col=c.type==='DERELICT'?'255,51,85':c.type==='SIGNAL'?'255,0,170':'0,229,255';
    CTX.fillStyle='rgba('+col+',.9)';
    CTX.beginPath();CTX.arc(x,y,2,0,Math.PI*2);CTX.fill();
  });
  CTX.fillStyle='#7cf0ff';
  CTX.beginPath();CTX.arc(cx,cy,5,0,Math.PI*2);CTX.fill();
  CTX.textAlign='left';
};

R.SUBSYSTEMS=function(dt){
  bg();stars_bg(dt);
  ttl('⚙ SUBSYSTEMS','Detailed Health');
  var keys=Object.keys(SHIP.systems);
  var cols=2;
  var cw=(W-60)/cols;
  keys.forEach(function(k,i){
    var s=SHIP.systems[k];
    var col=i%cols,row=Math.floor(i/cols);
    var x=30+col*cw,y=70+row*60;
    var hp=s.health;
    var hc=hp<50?'255,51,85':hp<80?'255,170,0':'0,255,136';
    CTX.fillStyle='rgba(0,229,255,.05)';
    CTX.fillRect(x,y,cw-20,50);
    CTX.strokeStyle='rgba('+hc+',.6)';
    CTX.lineWidth=1;
    CTX.strokeRect(x,y,cw-20,50);
    CTX.fillStyle='rgba(0,229,255,.9)';
    CTX.font='bold 10px monospace';CTX.textAlign='left';
    CTX.fillText(s.name,x+10,y+16);
    CTX.font='9px monospace';
    CTX.fillStyle='rgba(200,210,255,.7)';
    CTX.fillText('Power: '+s.power+' MW',x+10,y+30);
    CTX.fillStyle='rgba('+hc+',.9)';
    CTX.fillText('Health: '+Math.round(hp)+'%',x+10,y+44);
    CTX.fillStyle='rgba(0,0,0,.4)';
    CTX.fillRect(x+10,y+48,cw-40,3);
    CTX.fillStyle='rgba('+hc+',.9)';
    CTX.fillRect(x+10,y+48,(cw-40)*hp/100,3);
  });
};

R.AICORE=function(dt){
  bg();stars_bg(dt);
  ttl('◉ AI CORE','Ship\'s AI');
  var cx=W/2,cy=H/2;
  var R=Math.min(W,H)*0.18;
  var aware=SHIP.ai.awareness/100;
  for(var i=0;i<5;i++){
    var r=R*(0.7+i*0.15);
    CTX.strokeStyle='rgba(0,229,255,'+(0.15+i*0.05+aware*0.1)+')';
    CTX.lineWidth=1.5;
    CTX.beginPath();
    CTX.ellipse(cx,cy,r,r*(0.6+Math.sin(SHIP.time*0.3+i)*0.2),SHIP.time*(i%2?1:-1)*0.2,0,Math.PI*2);
    CTX.stroke();
  }
  var g=CTX.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,'rgba(0,229,255,'+(0.7+aware*0.3)+')');
  g.addColorStop(0.5,'rgba(255,0,170,'+(0.3+aware*0.4)+')');
  g.addColorStop(1,'transparent');
  CTX.fillStyle=g;
  CTX.beginPath();CTX.arc(cx,cy,R,0,Math.PI*2);CTX.fill();
  for(var k=0;k<30;k++){
    var ang=SHIP.time*2+k*0.2;
    var rr=R*(0.3+Math.sin(SHIP.time*3+k)*0.2);
    var px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr;
    CTX.fillStyle='rgba(200,240,255,'+(0.4+Math.random()*0.5)+')';
    CTX.beginPath();CTX.arc(px,py,1.5,0,Math.PI*2);CTX.fill();
  }
  CTX.fillStyle='rgba(0,229,255,.9)';
  CTX.font='bold 12px monospace';CTX.textAlign='center';
  CTX.fillText('MOOD: '+SHIP.ai.mood.toUpperCase(),cx,cy+R+40);
  CTX.fillStyle='rgba(255,0,170,.9)';
  CTX.font='10px monospace';
  CTX.fillText('AWARENESS: '+fmt(SHIP.ai.awareness,1)+'%',cx,cy+R+60);
  CTX.fillStyle='rgba(200,210,255,.9)';
  CTX.font='11px monospace';
  CTX.fillText('"'+SHIP.ai.lastMessage+'"',cx,cy-R-20);
  CTX.textAlign='left';
};

/* Expose renderers + API */
window.V9X_RENDERERS=R;
window.V9X={
  encounterChoose:function(i){
    if(!EXP.currentEncounter)return;
    var opt=EXP.currentEncounter.options[i];
    if(opt){try{opt.act()}catch(e){}EXP.currentEncounter=null;OV.close()}
  },
  buy:buyItem,sell:sellItem,research:unlockResearch,
  openScreen:function(id){UI.setScreen(id)},
  save:saveProgress,load:loadProgress,export:exportState,
  getItem:getItem,
  EXP:EXP,SHIP:SHIP,AUDIO:AUDIO,FX:FX,UI:UI,CMDS:CMDS,SCREENS:SCREENS
};

})();
</script>
