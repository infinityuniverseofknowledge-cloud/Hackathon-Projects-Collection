<!DOCTYPE html><html lang="pt-BR" data-theme="grid"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GRID — Power Systems Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;transition:background .3s,color .3s}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;transition:background .2s}::-webkit-scrollbar-thumb:hover{background:var(--p1)}
:root{--bg:#060810;--panel:#0c1018;--panel2:#141a24;--panel3:#1e2634;--panel4:#2a3244;--bd:#1a2028;--bd2:#304058;--tx:#e8f0ff;--tx2:#88a0c0;--tx3:#4a5868;--p1:#40ffd0;--p2:#40a0ff;--p3:#ffb040;--p4:#ff4080;--p5:#a060ff;--p6:#ff8040;--g1:linear-gradient(135deg,#40ffd0,#40a0ff);--gHolo:linear-gradient(120deg,#40ffd0,#40a0ff,#a060ff,#ff4080,#ffb040,#40ffd0);--mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;--sans:'Inter','SF Pro',system-ui,sans-serif;--disp:'Orbitron',monospace;--t1:all .2s cubic-bezier(.4,0,.2,1);--shadow:0 4px 24px rgba(0,0,0,.4);--glow:0 0 20px rgba(64,255,208,.3)}
[data-theme="day"]{--bg:#f0f4f8;--panel:#fff;--panel2:#f4f7fa;--panel3:#e4eaf0;--panel4:#d4dce4;--bd:#c8d0d8;--bd2:#98a8b8;--tx:#080f18;--tx2:#405060;--tx3:#8090a0;--p1:#00a080;--p2:#0080c0;--p3:#d08020;--p4:#c03060;--p5:#7030c0;--p6:#e06030;--g1:linear-gradient(135deg,#00a080,#0080c0);--shadow:0 4px 24px rgba(0,0,0,.08);--glow:0 0 20px rgba(0,160,128,.2)}
[data-theme="sunset"]{--bg:#0a0608;--panel:#140c10;--panel2:#1e1218;--panel3:#2a1a24;--panel4:#3a2430;--bd:#28161c;--bd2:#4a2a38;--tx:#ffe8f0;--tx2:#c090a0;--tx3:#806070;--p1:#ff4090;--p2:#ffb040;--p3:#ffd060;--p4:#40a0ff;--p5:#a060ff;--g1:linear-gradient(135deg,#ff4090,#ffb040)}
[data-theme="matrix"]{--bg:#020804;--panel:#041008;--panel2:#081810;--panel3:#0c2418;--panel4:#123020;--bd:#082014;--bd2:#104028;--tx:#c0ffe0;--tx2:#70c090;--tx3:#406850;--p1:#40ff80;--p2:#40ffe0;--p3:#c0ff40;--p4:#ff4080;--g1:linear-gradient(135deg,#40ff80,#40ffe0)}
[data-theme="royal"]{--bg:#080614;--panel:#100c20;--panel2:#181430;--panel3:#241e48;--panel4:#302860;--bd:#1c1840;--bd2:#383060;--tx:#e8e0ff;--tx2:#a090c0;--tx3:#605880;--p1:#a060ff;--p2:#ff60c0;--p3:#40d0ff;--p4:#ffb040;--g1:linear-gradient(135deg,#a060ff,#ff60c0)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;z-index:100;position:relative}
#topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--g1);opacity:.6}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;cursor:pointer;padding:6px 12px;border-radius:6px;transition:var(--t1)}
.tb-logo:hover{background-color:var(--panel2)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.58rem;color:var(--tx3);flex:1;min-width:0;overflow:hidden;white-space:nowrap}

.breadcrumb .bc-item.active{color:var(--p1);background:rgba(64,255,208,.08)}
.breadcrumb .bc-sep{color:var(--tx3);opacity:.5}
.tb-search{position:relative;flex-shrink:0;width:200px}
.tb-search input{width:100%;background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px 6px 30px;font-size:.62rem;font-family:var(--mono);color:var(--tx);transition:var(--t1)}
.tb-search input:focus{border-color:var(--p1);box-shadow:var(--glow);width:100%}
.tb-search::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:1rem;pointer-events:none}
.tb-search .kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.5rem;color:var(--tx3);background:var(--panel3);padding:1px 5px;border-radius:3px;pointer-events:none}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:34px;height:34px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.95rem;position:relative}
.tb-btn:hover{background:var(--panel2);color:var(--p1);border-color:var(--bd)}

.tb-btn.pulse{animation:btnPulse 1.2s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(64,255,208,.4)}50%{box-shadow:0 0 0 8px rgba(64,255,208,0)}}
.tb-btn .badge-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--p4);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}

.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono);display:flex;align-items:center;gap:6px}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--p1);box-shadow:0 0 8px var(--p1)}
.panel-body{flex:1;overflow-y:auto;padding:8px;scroll-behavior:smooth}
.cat-section{margin-bottom:6px;border-radius:6px;overflow:hidden;transition:var(--t1)}
.cat-head{padding:7px 10px;background:var(--panel3);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.6rem;font-family:var(--mono);font-weight:700;color:var(--tx2);transition:var(--t1)}
.cat-head:hover{background:var(--panel4);color:var(--tx)}
.cat-head .cat-arrow{transition:transform .2s;color:var(--tx3);font-size:.7rem}
.cat-section.open .cat-arrow{transform:rotate(90deg);color:var(--p1)}
.cat-items{max-height:0;overflow:hidden;transition:max-height .25s ease;background:var(--panel2)}
.cat-section.open .cat-items{max-height:1000px}
.cat-item{padding:6px 12px 6px 20px;font-size:.6rem;font-family:var(--mono);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;gap:8px;border-left:2px solid transparent}
.cat-item:hover{background:var(--panel3);color:var(--tx);border-left-color:var(--p1)}
.cat-item.active{background:rgba(64,255,208,.1);color:var(--p1);border-left-color:var(--p1);font-weight:600}
.cat-item .ci-icon{font-size:.85rem;opacity:.8}
.cat-item .ci-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg);position:relative}
#canvasWrap{flex:1;position:relative;background:#020408;overflow:hidden;min-height:0;transition:background .3s}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(64,255,208,.008) 0,rgba(64,255,208,.008) 1px,transparent 1px,transparent 4px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(12,16,24,.85);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-family:var(--mono);font-size:.58rem;color:var(--p1);max-width:340px;box-shadow:var(--shadow);transition:var(--t1)}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:36px;padding:4px;gap:2px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:5px;transition:var(--t1);letter-spacing:.3px}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--bg);background:var(--g1);font-weight:700}
.rp-body{flex:1;overflow-y:auto;padding:10px;scroll-behavior:smooth}
.rp-pane{display:none;animation:fadeIn .2s ease}
.rp-pane.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.55rem;color:var(--tx3);flex-shrink:0;overflow-x:auto;position:relative}
#statusbar::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p1),transparent);opacity:.4}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap;transition:var(--t1)}
#statusbar .sb-item:hover{color:var(--tx)}
#statusbar .sb-val{color:var(--p1);font-weight:600}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}.sb-val.c6{color:var(--p6)}
.sec{margin-bottom:14px;animation:fadeIn .25s ease}
.sec h4{font-size:.56rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--panel3);color:var(--p1);padding:1px 6px;border-radius:10px;font-size:.5rem;font-weight:600}
.lbl{font-size:.56rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;font-weight:600;font-family:var(--mono);letter-spacing:.3px}
.lbl span:last-child{color:var(--p1);text-transform:none;font-weight:700}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer;transition:background .2s}
.ctrl input[type=range]:hover{background:var(--bd2)}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--g1);border-radius:50%;cursor:pointer;box-shadow:0 0 12px rgba(64,255,208,.5);transition:transform .15s}
.ctrl input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--p1);border-radius:50%;cursor:pointer;border:none}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:6px 9px;color:var(--tx);font-size:.64rem;font-family:var(--mono);transition:var(--t1)}
.ctrl textarea{resize:vertical;min-height:50px;line-height:1.4}
.ctrl input:focus,.ctrl textarea:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(64,255,208,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:5px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;white-space:nowrap;font-family:var(--sans)}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:var(--bg);border-color:transparent}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.56rem}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:.56rem;font-family:var(--mono);color:var(--tx2);transition:var(--t1);font-weight:500}
.chip:hover{border-color:var(--p1);color:var(--p1);transform:translateY(-1px)}
.chip.active{background:var(--g1);color:var(--bg);border-color:transparent;font-weight:700;box-shadow:0 0 12px rgba(64,255,208,.3)}
.kv{font-family:var(--mono);font-size:.56rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);gap:8px;transition:var(--t1)}
.kv .row:hover{background:rgba(64,255,208,.03)}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.56rem;word-break:break-all;max-width:170px;font-weight:600}
.kv .v.c2{color:var(--p2)}.kv .v.c3{color:var(--p3)}.kv .v.c4{color:var(--p4)}
.empty{text-align:center;padding:24px 16px;color:var(--tx3);font-size:.62rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;animation:modalFade .2s ease}
.modal-bg.show{display:flex}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:12px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:modalPop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal.lg{max-width:1000px}.modal.sm{max-width:500px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;color:var(--p1);font-family:var(--disp);letter-spacing:1.5px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;color:var(--tx3);cursor:pointer;font-size:1rem;border-radius:5px;transition:var(--t1);display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--panel3);color:var(--p4)}
#cmdPalette{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:6000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#cmdPalette.show{display:flex}
.cmd-box{background:var(--panel);border:1px solid var(--bd);border-radius:12px;width:min(600px,90vw);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:modalPop .2s ease}
.cmd-input{width:100%;padding:16px 20px;background:transparent;border:none;border-bottom:1px solid var(--bd);font-size:.9rem;font-family:var(--mono);color:var(--tx);outline:none}
.cmd-input::placeholder{color:var(--tx3)}
.cmd-results{max-height:400px;overflow-y:auto;padding:8px}
.cmd-item{padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:var(--t1);font-size:.7rem}
.cmd-item:hover,.cmd-item.selected{background:var(--panel2);color:var(--p1)}
.cmd-item .cmd-icon{font-size:1.1rem;opacity:.8}
.cmd-item .cmd-name{flex:1;font-weight:500}
.cmd-item .cmd-cat{font-family:var(--mono);font-size:.55rem;color:var(--tx3)}
.cmd-empty{padding:30px 20px;text-align:center;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.66rem;max-width:340px;min-width:180px;animation:tin .35s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;font-family:var(--mono);pointer-events:auto;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.toast.fade-out{opacity:0;transform:translateX(20px)}
.toast.success{border-left-color:var(--p1)}
.toast.warn{border-left-color:var(--p3)}
.toast.error{border-left-color:var(--p4)}
.toast .toast-icon{font-size:1rem}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.code{font-family:var(--mono);font-size:.6rem;background:rgba(0,0,0,.35);padding:10px 12px;border-radius:6px;border:1px solid var(--bd);line-height:1.5;white-space:pre;overflow-x:auto;color:var(--tx);position:relative}
.code::before{content:'</>';position:absolute;top:6px;right:10px;font-size:.5rem;color:var(--tx3);opacity:.6}
.tooltip{position:relative}
.tooltip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);border-radius:5px;padding:4px 8px;font-size:.55rem;font-family:var(--mono);color:var(--tx);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:1000;box-shadow:var(--shadow)}
.tooltip:hover::after{opacity:1}
.spinner{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--p1);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{height:4px;background:var(--panel4);border-radius:2px;overflow:hidden;margin:6px 0}
.progress-bar .fill{height:100%;background:var(--g1);transition:width .3s ease;box-shadow:0 0 8px var(--p1)}
.grid-overlay{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:12px;cursor:pointer;transition:var(--t1)}
.card:hover{border-color:var(--p1);background:var(--panel3);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-title{font-size:.68rem;font-weight:600;color:var(--tx);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-desc{font-size:.55rem;color:var(--tx3);font-family:var(--mono);line-height:1.5}
.fab{position:fixed;bottom:44px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--g1);border:none;color:var(--bg);cursor:pointer;font-size:1.3rem;box-shadow:0 8px 24px rgba(64,255,208,.4);z-index:8000;transition:var(--t1);display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 12px 32px rgba(64,255,208,.6)}
@media(max-width:1000px){#leftPanel{width:240px}#rightPanel{width:280px}.tb-search{width:160px}}
@media(max-width:760px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-search{width:120px}#cmdPalette{padding-top:8vh}}
@media(max-width:500px){.tb-search{display:none}.breadcrumb{font-size:.5rem}}
</style></head><body>
<div id="app">
<div id="topbar">
<div class="tb-logo" onclick="openHome()">GRID</div>

var MU0=4e-7*Math.PI,EPS0=8.854e-12,C=3e8;
var RHO_CU=1.68e-8,RHO_AL=2.65e-8;
var FREQ=60,FREQ_EU=50,OMEGA=2*Math.PI*FREQ;
var SBASE=100e6,VBASE=138e3;
function R2P(re,im){return Math.sqrt(re*re+im*im)}function P2R(m,th){return[ m*Math.cos(th),m*Math.sin(th)]}
function polar(m,th){return{re:m*Math.cos(th),im:m*Math.sin(th)}}
function cAdd(a,b){return{re:a.re+b.re,im:a.im+b.im}}
function cSub(a,b){return{re:a.re-b.re,im:a.im-b.im}}
function cMul(a,b){return{re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function cDiv(a,b){var d=b.re*b.re+b.im*b.im;return{re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d}}
function cAbs(a){return Math.sqrt(a.re*a.re+a.im*a.im)}
function cAngle(a){return Math.atan2(a.im,a.re)}
function cConj(a){return{re:a.re,im:-a.im}}
function seriesZ(z1,z2){return cAdd(z1,z2)}
function parallelZ(z1,z2){return cDiv(cMul(z1,z2),cAdd(z1,z2))}
function powerFromVI(V,I){var S=cMul(V,cConj(I));return{P:S.re,Q:S.im,S:cAbs(S),pf:Math.cos(Math.atan2(S.im,S.re))}}
function powerFromPQ(P,Q){return{S:Math.sqrt(P*P+Q*Q),pf:P/Math.sqrt(P*P+Q*Q),theta:Math.atan2(Q,P)}}
function threePhaseP(VLL,IL,pf){return Math.sqrt(3)*VLL*IL*pf}
function lineCurrent(P,VLL,pf){return P/(Math.sqrt(3)*VLL*pf)}
function perUnit(zBase,SBase,VBase){var Zbase=VBase*VBase/SBase;return zBase/Zbase}
function zBaseCalc(VLL,S3ph){return VLL*VLL/S3ph}

var a=polar(1,2*Math.PI/3);var a2=polar(1,4*Math.PI/3);
var I0=cDiv(cAdd(cAdd(abc.a,abc.b),abc.c),{re:3,im:0});
var I1=cDiv(cAdd(cAdd(abc.a,cMul(a,abc.b)),cMul(a2,abc.c)),{re:3,im:0});
var I2=cDiv(cAdd(cAdd(abc.a,cMul(a2,abc.b)),cMul(a,abc.c)),{re:3,im:0});
return{I0:I0,I1:I1,I2:I2}}
function parkTransform(abc,theta){
var c=Math.cos(theta),s=Math.sin(theta),c2=Math.cos(theta-2*Math.PI/3),s2=Math.sin(theta-2*Math.PI/3),c3=Math.cos(theta+2*Math.PI/3),s3=Math.sin(theta+2*Math.PI/3);
var d=2/3*(abc.a*c+abc.b*c2+abc.c*c3);
var q=2/3*(abc.a*(-s)+abc.b*(-s2)+abc.c*(-s3));
var z=1/3*(abc.a+abc.b+abc.c);
return{d:d,q:q,z:z}}
function inversePark(dqz,theta){
var c=Math.cos(theta),s=Math.sin(theta),c2=Math.cos(theta-2*Math.PI/3),s2=Math.sin(theta-2*Math.PI/3),c3=Math.cos(theta+2*Math.PI/3),s3=Math.sin(theta+2*Math.PI/3);
return{a:dqz.d*c-dqz.q*s+dqz.z,b:dqz.d*c2-dqz.q*s2+dqz.z,c:dqz.d*c3-dqz.q*s3+dqz.z}}
function swingEquation(Pm,Pe,H,f){return (Pm-Pe)*f/(2*H)}
function synchronizingPower(V1,V2,X,delta){return V1*V2/X*Math.cos(delta)}
function powerTransfer(V1,V2,X,delta){return V1*V2/X*Math.sin(delta)}
function criticalClearingAngle(Pm,Pmax){if(Pm>=Pmax)return Math.PI;return Math.acos(0)}
function symmetricalFaultZth(Z1,Z2,Z0){return cAdd(Z1,cAdd(Z2,Z0))}
function lineImpedance(length_km,R_per_km,X_per_km){return{re:R_per_km*length_km,im:X_per_km*length_km}}
function loadFlowNR(ybus,pSpec,qSpec,vInit,maxIter){var n=vInit.length;var V=vInit.slice();var iter=0;while(iter<maxIter){var P=[],Q=[];for(var i=0;i<n;i++){var pi=0,qi=0;for(var k=0;k<n;k++){var Y=ybus[i][k];var th=Math.atan2(Y.im,Y.re);var mag=R2P(Y.re,Y.im);var Vi=V[i].mag,Vk=V[k].mag;var ti=V[i].ang,tk=V[k].ang;pi+=mag*Vi*Vk*Math.cos(th+tk-ti);qi+=mag*Vi*Vk*Math.sin(th+tk-ti)}P.push(pi);Q.push(qi)}var maxErr=0;for(var j=0;j<n;j++){maxErr=Math.max(maxErr,Math.abs(P[j]-pSpec[j]),Math.abs(Q[j]-qSpec[j]))}if(maxErr<1e-4)break;var J=[],M=[];for(var ii=0;ii<n;ii++){for(var jj=0;jj<n;jj++){if(ii!==jj){var Y2=ybus[ii][jj];var th2=Math.atan2(Y2.im,Y2.re);var Vm2=R2P(Y2.re,Y2.im);J.push(0);M.push(0)}}}for(var vv=0;vv<n;vv++){var dV=0;V[vv].mag+=dV*0.01}iter++}return{V:V,iter:iter,err:maxErr||0}}
function shortCircuit(V,Zr,Xr){return V/(Math.sqrt(Zr*Zr+Xr*Xr))}
function inductanceCoax(r1,r2,mu){return mu/(2*Math.PI)*Math.log(r2/r1)}
function skinDepth(rho,f,mu){return Math.sqrt(rho/(Math.PI*f*mu))}
function coronaDischarge(V,rc,d,delta,m){var E0=30*delta*m;var Ec=V/(rc*Math.log(d/rc));return Ec/E0}
function sagCable(w,L,T){return w*L*L/(8*T)}
function transformerEMF(N,f,Phi){return 4.44*N*f*Phi}
function transformerEfficiency(Pout,Pcore,Pcu){return Pout/(Pout+Pcore+Pcu)}
function transformerRegulation(Vnl,Vfl){return (Vnl-Vfl)/Vfl}
function inductionSlip(ns,nr){return (ns-nr)/ns}
function synchronousSpeed(f,poles){return 120*f/poles}
function motorTorque(P,n){return 9.55*P/n}

function drawArrow(ctx,x1,y1,x2,y2,color,lw){color=color||'#40ffd0';lw=lw||2;ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();var ang=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(ang-0.4),y2-10*Math.sin(ang-0.4));ctx.lineTo(x2-10*Math.cos(ang+0.4),y2-10*Math.sin(ang+0.4));ctx.closePath();ctx.fill()}

registerModule('transformer',{title:'Transformador',icon:'⚙',desc:'Modelo elétrico, regulação, eficiência',cat:'machines',init:function(){this.compute()},compute:function(){var t=STATE.transformer;t.ratio=t.V1/t.V2;t.Phicore=t.V2/(4.44*60*1000);t.I1=t.S/(Math.sqrt(3)*t.V1);t.I2=t.S/(Math.sqrt(3)*t.V2);t.eff=1-(t.Pcore+t.Pcu)/(t.S+t.Pcore+t.Pcu);t.regul=t.Zpct/100*(t.X_R/Math.sqrt(1+t.X_R*t.X_R))}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var t=STATE.transformer;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('TRANSFORMADOR — '+fmt(t.V1/1000,1)+'kV/'+fmt(t.V2/1000,1)+'kV · '+fmt(t.S/1e6,0)+'MVA',24,32);var cx=W/2,cy=H/2;ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;for(var i=0;i<2;i++){var ox=cx-40+i*80;ctx.beginPath();for(var j=0;j<8;j++){var y=cy-60+j*16;ctx.arc(ox,y,8,0,Math.PI*2);ctx.moveTo(ox,y+16)}ctx.stroke()}ctx.strokeStyle='#40a0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-80,cy);ctx.lineTo(cx-48,cy);ctx.moveTo(cx+48,cy);ctx.lineTo(cx+80,cy);ctx.stroke();ctx.fillStyle='#40ffd0';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('N1:N2',cx,cy+90);ctx.textAlign='left';var ix=W-300,iy=60;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,220);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,220);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('PARÂMETROS',ix+10,iy+22);[['Ratio',fmt(t.ratio,2)+':1'],['V1',fmt(t.V1/1000,2)+' kV'],['V2',fmt(t.V2/1000,2)+' kV'],['I1',fmt(t.I1,1)+' A'],['I2',fmt(t.I2,1)+' A'],['Zpct',t.Zpct+'%'],['Eficiência',fmt(t.eff*100,2)+'%'],['Regulação',fmt(t.regul*100,3)+'%']].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+50+i*22);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+140,iy+50+i*22)});setStats('<div>V1: '+fmt(t.V1/1000,1)+'kV</div><div>V2: '+fmt(t.V2/1000,1)+'kV</div><div>η: '+fmt(t.eff*100,1)+'%</div>');badge('⚙ Trafo · η='+fmt(t.eff*100,1)+'%');SV('sbV',fmt(t.V1/1000,1)+'kV');SV('sbI',fmt(t.I1,0)+'A');SV('sbP',fmt(t.S/1e6,0)+'MVA');SV('sbF',t.ratio.toFixed(1)+':1');SV('sbPF',fmt(t.eff,3))},controls:function(){var t=STATE.transformer;return '<div class="sec"><h4>Primário</h4><div class="ctrl"><div class="lbl"><span>V1 (kV)</span><span>'+(t.V1/1000).toFixed(1)+'</span></div><input type="range" min="0.4" max="765" step="0.1" value="'+(t.V1/1000)+'" oninput="STATE.transformer.V1=parseFloat(this.value)*1000;MODULES.transformer.compute()"></div><div class="ctrl"><div class="lbl"><span>S (MVA)</span><span>'+(t.S/1e6).toFixed(0)+'</span></div><input type="range" min="0.1" max="1000" step="0.1" value="'+(t.S/1e6)+'" oninput="STATE.transformer.S=parseFloat(this.value)*1e6;MODULES.transformer.compute()"></div></div><div class="sec"><h4>Secundário</h4><div class="ctrl"><div class="lbl"><span>V2 (kV)</span><span>'+(t.V2/1000).toFixed(2)+'</span></div><input type="range" min="0.1" max="500" step="0.1" value="'+(t.V2/1000)+'" oninput="STATE.transformer.V2=parseFloat(this.value)*1000;MODULES.transformer.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.transformer.V1=138e3;STATE.transformer.V2=13.8e3;STATE.transformer.S=50e6;MODULES.transformer.compute()">138/13.8kV 50MVA</div><div class="chip" onclick="STATE.transformer.V1=345e3;STATE.transformer.V2=138e3;STATE.transformer.S=300e6;MODULES.transformer.compute()">345/138kV 300MVA</div><div class="chip" onclick="STATE.transformer.V1=13800;STATE.transformer.V2=380;STATE.transformer.S=1e6;MODULES.transformer.compute()">Distribuição</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Transformador</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Relações ideais:</b><br>V1/V2 = N1/N2 = a<br>I1/I2 = N2/N1 = 1/a<br>Z1/Z2 = a²<br><br><b>EMF:</b><br>E = 4.44 · f · N · Φm<br><br><b>Perdas:</b><br>• Cobre: Pcu = I²R (∝ carga²)<br>• Núcleo: Pcore = f(B) (constante)<br>• Eficiência: η = S·PF / (S·PF + Pcu + Pcore)<br><br><b>Regulação:</b><br>%Reg = (V_nl - V_fl)/V_fl · 100<br>Melhor com PF alto<br><br><b>Refrigeração:</b><br>• ONAN (natural)<br>• ONAF (ar forçado)<br>• OFAF (óleo+ar forçados)<br>• OFWF (água)<br><br><b>Tipos:</b><br>• Núcleo (distribuição)<br>• Casca (potência)<br>• Autotransformador<br>• Isolamento a óleo/seco</div></div>'}});
registerModule('syncgen',{title:'Gerador Síncrono',icon:'⊙',desc:'Modelo clássico, ângulo de carga',cat:'machines',init:function(){this.compute()},compute:function(){var g=STATE.syncgen;g.Pe=g.E*g.V/g.Xd*Math.sin(g.delta);g.history=[];for(var t=0;t<=5;t+=0.05){var Pe=g.E*g.V/g.Xd*Math.sin(g.delta*Math.exp(-g.D*t/2/g.H));g.history.push({t:t,P:Pe,delta:g.delta*Math.exp(-g.D*t/2/g.H)})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var g=STATE.syncgen;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('GERADOR SÍNCRONO — Pe='+fmt(g.Pe,3)+' pu · δ='+fmt(deg(g.delta),1)+'°',24,32);var px=60,py=70,pw=W-140,ph=200;drawAxes(ctx,px,py,pw,ph,'δ (rad)','Pe (pu)');ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();for(var d=0;d<=Math.PI;d+=0.02){var Pe=g.E*g.V/g.Xd*Math.sin(d);var x=px+d/Math.PI*pw;var y=py+ph-Pe/2*ph;if(d===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();var xm=px+g.delta/Math.PI*pw;var ym=py+ph-g.Pe/2*ph;ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(xm,ym,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff4080';ctx.font='bold 10px monospace';ctx.fillText('op',xm+10,ym);var ix=W-300,iy=300;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('MODELO',ix+10,iy+22);[['E (pu)',g.E],['V (pu)',g.V],['Xd (pu)',g.Xd],['δ (rad)',fmt(g.delta,3)],['δ (°)',fmt(deg(g.delta),2)],['Pe (pu)',fmt(g.Pe,4)],['Pmax',fmt(g.E*g.V/g.Xd,3)]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+140,iy+48+i*20)});setStats('<div>Pe: '+fmt(g.Pe,3)+'pu</div><div>δ: '+fmt(deg(g.delta),1)+'°</div>');badge('⊙ δ='+fmt(deg(g.delta),1)+'°');SV('sbV',fmt(g.V,2));SV('sbI',fmt(g.Pe,2));SV('sbP',fmt(g.Pe*100,1)+'MW');SV('sbF','60Hz');SV('sbPF','0.95')},controls:function(){var g=STATE.syncgen;return '<div class="sec"><h4>Tensões</h4><div class="ctrl"><div class="lbl"><span>E (pu)</span><span>'+g.E+'</span></div><input type="range" min="0.5" max="2" step="0.01" value="'+g.E+'" oninput="STATE.syncgen.E=parseFloat(this.value);MODULES.syncgen.compute()"></div><div class="ctrl"><div class="lbl"><span>V (pu)</span><span>'+g.V+'</span></div><input type="range" min="0.5" max="1.5" step="0.01" value="'+g.V+'" oninput="STATE.syncgen.V=parseFloat(this.value);MODULES.syncgen.compute()"></div><div class="ctrl"><div class="lbl"><span>Xd (pu)</span><span>'+g.Xd+'</span></div><input type="range" min="0.3" max="3" step="0.05" value="'+g.Xd+'" oninput="STATE.syncgen.Xd=parseFloat(this.value);MODULES.syncgen.compute()"></div></div><div class="sec"><h4>Operação</h4><div class="ctrl"><div class="lbl"><span>δ (°)</span><span>'+fmt(deg(g.delta),1)+'</span></div><input type="range" min="0" max="90" step="0.5" value="'+fmt(deg(g.delta),1)+'" oninput="STATE.syncgen.delta=rad(parseFloat(this.value));MODULES.syncgen.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Gerador Síncrono</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Modelo clássico:</b><br>E = V + jXd·Ia (fasorial)<br>Pe = E·V/Xd · sin δ<br><br><b>Ângulo de carga δ:</b><br>• δ = 0: sem carga<br>• δ = 30-45°: econômico<br>• δ = 90°: limite estabilidade estática<br>• δ &gt; 90°: instável<br><br><b>Potência máxima:</b><br>Pmax = E·V/Xd<br><br><b>Controle:</b><br>• Excitação → E → tensão/PF<br>• Válvula → Pm → frequência/potência<br><br><b>Tipos:</b><br>• Máquina síncrona<br>• PMSG (permanente)<br>• DFIG (dupla excitação)<br>• Brushless<br><br><b>Aplicações:</b><br>• Usinas hidrelétricas<br>• Térmicas (nuclear/carvão)<br>• Eólicas (DFIG/PMSG)<br>• Compensadores síncronos</div></div>'}});
registerModule('induction',{title:'Motor de Indução',icon:'⟲',desc:'Curva torque-velocidade, escorregamento',cat:'machines',init:function(){this.compute()},compute:function(){var m=STATE.induction;m.ns=synchronousSpeed(m.f,m.poles);m.speed=m.ns*(1-m.slip);m.torque=3*m.V*m.V*m.Rr/m.slip/(2*Math.PI*m.ns/60*Math.pow(m.Rs+m.Rr/m.slip,2)+0);m.torque=1.5*m.V*m.V*m.Rr/m.slip/(Math.pow(m.Rs+m.Rr/m.slip,2)+Math.pow(m.Xs+m.Xr,2));m.curve=[];for(var s=0.001;s<=1;s+=0.01){var T=1.5*m.V*m.V*m.Rr/s/(Math.pow(m.Rs+m.Rr/s,2)+Math.pow(m.Xs+m.Xr,2));m.curve.push({s:s,T:T,speed:m.ns*(1-s)})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var m=STATE.induction;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('MOTOR INDUÇÃO — ns='+fmt(m.ns,0)+'rpm · s='+fmt(m.slip,3)+' · T='+fmt(m.torque,2)+'Nm',24,32);var px=60,py=70,pw=W-140,ph=220;drawAxes(ctx,px,py,pw,ph,'Speed (rpm)','Torque (Nm)');ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();m.curve.forEach(function(p,i){var x=px+p.speed/m.ns*pw;var y=py+ph-p.T/Math.max.apply(null,m.curve.map(function(c){return c.T}))*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var cx=px+m.speed/m.ns*pw;var cy=py+ph-m.torque/Math.max.apply(null,m.curve.map(function(c){return c.T}))*ph;ctx.fillStyle='#ff4080';ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();var ix=W-300,iy=310;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('MOTOR',ix+10,iy+22);[['Poles',m.poles],['ns (rpm)',fmt(m.ns,0)],['Slip',fmt(m.slip,4)],['Speed (rpm)',fmt(m.speed,0)],['Torque (Nm)',fmt(m.torque,2)],['Freq (Hz)',m.f],['V (V)',m.V]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+140,iy+48+i*20)});setStats('<div>T: '+fmt(m.torque,1)+'Nm</div><div>s: '+fmt(m.slip*100,1)+'%</div>');badge('⟲ Motor · '+fmt(m.torque,1)+'Nm');SV('sbV',m.V+'V');SV('sbI','—');SV('sbP',fmt(m.torque*m.speed*2*Math.PI/60/1000,2)+'kW');SV('sbF',m.f+'Hz');SV('sbPF','0.85')},controls:function(){var m=STATE.induction;return '<div class="sec"><h4>Motor</h4><div class="ctrl"><div class="lbl"><span>V (V)</span><span>'+m.V+'</span></div><input type="range" min="100" max="1000" step="10" value="'+m.V+'" oninput="STATE.induction.V=parseFloat(this.value);MODULES.induction.compute()"></div><div class="ctrl"><div class="lbl"><span>Pólos</span><span>'+m.poles+'</span></div><input type="range" min="2" max="12" step="2" value="'+m.poles+'" oninput="STATE.induction.poles=parseInt(this.value);MODULES.induction.compute()"></div><div class="ctrl"><div class="lbl"><span>Escorregamento</span><span>'+fmt(m.slip,4)+'</span></div><input type="range" min="0.001" max="0.3" step="0.001" value="'+m.slip+'" oninput="STATE.induction.slip=parseFloat(this.value);MODULES.induction.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.induction.V=220;STATE.induction.poles=4;STATE.induction.f=60;MODULES.induction.compute()">220V 4-polos</div><div class="chip" onclick="STATE.induction.V=380;STATE.induction.poles=4;MODULES.induction.compute()">380V 4-polos</div><div class="chip" onclick="STATE.induction.V=480;STATE.induction.poles=6;MODULES.induction.compute()">480V 6-polos</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Motor de Indução</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Velocidade síncrona:</b><br>ns = 120·f/p (rpm)<br><br><b>Escorregamento:</b><br>s = (ns - n)/ns<br>Tipicamente 2-5% em carga nominal<br><br><b>Torque:</b><br>T ∝ V² · Rr/s / [(Rs+Rr/s)² + (Xs+Xr)²]<br><br><b>Características:</b><br>• Torque de partida (s=1) alto<br>• Torque máximo em s ~ Rr/(Xs+Xr)<br>• Regeneração se n &gt; ns<br><br><b>Controle:</b><br>• V/f constante (escalar)<br>• Vetorial (FOC)<br>• DTC (direct torque control)<br><br><b>Aplicações:</b><br>• Bombas, ventiladores<br>• Compressores<br>• Esteiras<br>• Trens elétricos<br>• Elevadores<br>• Indústria (80% dos motores)</div></div>'}});
registerModule('dcmotor',{title:'Motor DC',icon:'⊙',desc:'Excitação, torque-velocidade',cat:'machines',init:function(){this.compute()},compute:function(){var m=STATE.dcmotor;m.Ia=m.V/m.Ra;m.speed=1000;m.torque=m.Kt*m.Ia*m.Ifield;m.Pout=m.torque*m.speed*2*Math.PI/60;m.curve=[];for(var n=0;n<=3000;n+=50){var E=m.Ke*m.Ifield*n*2*Math.PI/60;var Ia=(m.V-E)/m.Ra;m.curve.push({n:n,I:Math.max(0,Ia),T:m.Kt*m.Ifield*Math.max(0,Ia)})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var m=STATE.dcmotor;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('MOTOR DC — Ia='+fmt(m.Ia,2)+'A · T='+fmt(m.torque,2)+'Nm · n='+fmt(m.speed,0)+'rpm',24,32);var px=60,py=70,pw=W-140,ph=220;drawAxes(ctx,px,py,pw,ph,'Speed (rpm)','Torque (Nm)');ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();m.curve.forEach(function(p,i){var x=px+p.n/3000*pw;var y=py+ph-Math.min(p.T/50,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var ix=W-300,iy=310;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('MOTOR DC',ix+10,iy+22);[['V (V)',m.V],['Ra (Ω)',m.Ra],['Ke',m.Ke],['Kt',m.Kt],['Ifield',m.Ifield],['Ia (A)',fmt(m.Ia,2)],['T (Nm)',fmt(m.torque,3)],['Pout (kW)',fmt(m.Pout/1000,3)]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+140,iy+48+i*20)});setStats('<div>Ia: '+fmt(m.Ia,2)+'A</div><div>T: '+fmt(m.torque,2)+'Nm</div>');badge('⊙ DC Motor · '+fmt(m.torque,2)+'Nm');SV('sbV',m.V+'V');SV('sbI',fmt(m.Ia,2)+'A');SV('sbP',fmt(m.Pout/1000,2)+'kW');SV('sbF','—');SV('sbPF','—')},controls:function(){var m=STATE.dcmotor;return '<div class="sec"><h4>Tensão</h4><div class="ctrl"><div class="lbl"><span>V (V)</span><span>'+m.V+'</span></div><input type="range" min="12" max="600" step="1" value="'+m.V+'" oninput="STATE.dcmotor.V=parseFloat(this.value);MODULES.dcmotor.compute()"></div></div><div class="sec"><h4>Parâmetros</h4><div class="ctrl"><div class="lbl"><span>Ra (Ω)</span><span>'+m.Ra+'</span></div><input type="range" min="0.1" max="5" step="0.05" value="'+m.Ra+'" oninput="STATE.dcmotor.Ra=parseFloat(this.value);MODULES.dcmotor.compute()"></div><div class="ctrl"><div class="lbl"><span>Ke</span><span>'+m.Ke+'</span></div><input type="range" min="0.1" max="5" step="0.05" value="'+m.Ke+'" oninput="STATE.dcmotor.Ke=parseFloat(this.value);MODULES.dcmotor.compute()"></div><div class="ctrl"><div class="lbl"><span>Ifield</span><span>'+m.Ifield+'</span></div><input type="range" min="0.1" max="2" step="0.05" value="'+m.Ifield+'" oninput="STATE.dcmotor.Ifield=parseFloat(this.value);MODULES.dcmotor.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Motor DC</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Equações:</b><br>E = Ke·Φ·n (força contra-eletromotriz)<br>T = Kt·Φ·Ia (torque)<br>Ia = (V - E)/Ra<br>n = (V - Ia·Ra)/(Ke·Φ)<br><br><b>Tipos:</b><br>• Sep. excited<br>• Shunt: n ~ const<br>• Série: T alto em partida<br>• Composto<br>• PMDC (ímã permanente)<br><br><b>Vantagens:</b><br>• Controle simples<br>• Torque em baixa velocidade<br>• Partida sem transformador<br><br><b>Desvantagens:</b><br>• Escovas (manutenção)<br>• Comutador<br>• Menos eficiente que AC<br><br><b>Aplicações:</b><br>• EVs antigos<br>• Elevadores<br>• Bicicletas elétricas<br>• Robótica<br>• Impressoras<br>• Brinquedos</div></div>'}});
</script>
<script>
registerModule('symcomp',{title:'Componentes Simétricas',icon:'⊕',desc:'Fortescue: I0, I1, I2',cat:'analysis',init:function(){this.compute()},compute:function(){var s=STATE.symcomp;var Ia=polar(s.Ia,rad(s.angA));var Ib=polar(s.Ib,rad(s.angB));var Ic=polar(s.Ic,rad(s.angC));var r=symmetricalComponents({a:Ia,b:Ib,c:Ic});s.I0=r.I0;s.I1=r.I1;s.I2=r.I2;s.I0mag=cAbs(s.I0);s.I1mag=cAbs(s.I1);s.I2mag=cAbs(s.I2)},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var s=STATE.symcomp;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('COMP. SIMÉTRICAS — I0='+fmt(s.I0mag,1)+' I1='+fmt(s.I1mag,1)+' I2='+fmt(s.I2mag,1),24,32);var cx=W/2,cy=H/2;var scale=Math.min(W,H)*0.3/(s.Ia+1);ctx.strokeStyle='rgba(64,255,208,.2)';ctx.beginPath();ctx.arc(cx,cy,scale*s.Ia*1.5,0,Math.PI*2);ctx.stroke();drawPhasor(ctx,cx,cy,s.Ia*scale,0,'#ff4080','Ia');drawPhasor(ctx,cx,cy,s.Ib*scale,rad(-120),'#40ffd0','Ib');drawPhasor(ctx,cx,cy,s.Ic*scale,rad(120),'#40a0ff','Ic');drawPhasor(ctx,cx,cy,s.I1mag*scale,cAngle(s.I1),'#ffb040','I1');drawPhasor(ctx,cx,cy,s.I2mag*scale,cAngle(s.I2),'#a060ff','I2');drawPhasor(ctx,cx,cy,s.I0mag*scale,cAngle(s.I0),'#40ff80','I0');var ix=W-300,iy=60;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,200);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,200);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('SEQUÊNCIAS',ix+10,iy+22);[['I0 (zero)',fmt(s.I0mag,2)],['I1 (positiva)',fmt(s.I1mag,2)],['I2 (negativa)',fmt(s.I2mag,2)],['Ia',s.Ia+'∠'+s.angA],['Ib',s.Ib+'∠'+s.angB],['Ic',s.Ic+'∠'+s.angC]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+50+i*22);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+150,iy+50+i*22)});setStats('<div>I0: '+fmt(s.I0mag,1)+'</div><div>I1: '+fmt(s.I1mag,1)+'</div><div>I2: '+fmt(s.I2mag,1)+'</div>');badge('⊕ I0/I1/I2 = '+fmt(s.I0mag,0)+'/'+fmt(s.I1mag,0)+'/'+fmt(s.I2mag,0));SV('sbV','—');SV('sbI',fmt(s.I1mag,1)+'A');SV('sbP','—');SV('sbF','—');SV('sbPF','—')},controls:function(){var s=STATE.symcomp;return '<div class="sec"><h4>Fase A</h4><div class="ctrl"><div class="lbl"><span>Ia (A)</span><span>'+s.Ia+'</span></div><input type="range" min="0" max="200" step="1" value="'+s.Ia+'" oninput="STATE.symcomp.Ia=parseFloat(this.value);MODULES.symcomp.compute()"></div></div><div class="sec"><h4>Fase B</h4><div class="ctrl"><div class="lbl"><span>Ib (A)</span><span>'+s.Ib+'</span></div><input type="range" min="0" max="200" step="1" value="'+s.Ib+'" oninput="STATE.symcomp.Ib=parseFloat(this.value);MODULES.symcomp.compute()"></div><div class="ctrl"><div class="lbl"><span>∠Ib (°)</span><span>'+s.angB+'</span></div><input type="range" min="-180" max="180" step="1" value="'+s.angB+'" oninput="STATE.symcomp.angB=parseFloat(this.value);MODULES.symcomp.compute()"></div></div><div class="sec"><h4>Fase C</h4><div class="ctrl"><div class="lbl"><span>Ic (A)</span><span>'+s.Ic+'</span></div><input type="range" min="0" max="200" step="1" value="'+s.Ic+'" oninput="STATE.symcomp.Ic=parseFloat(this.value);MODULES.symcomp.compute()"></div><div class="ctrl"><div class="lbl"><span>∠Ic (°)</span><span>'+s.angC+'</span></div><input type="range" min="-180" max="180" step="1" value="'+s.angC+'" oninput="STATE.symcomp.angC=parseFloat(this.value);MODULES.symcomp.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.symcomp.Ia=100;STATE.symcomp.Ib=100;STATE.symcomp.Ic=100;STATE.symcomp.angA=0;STATE.symcomp.angB=-120;STATE.symcomp.angC=120;MODULES.symcomp.compute()">Equilibrado</div><div class="chip" onclick="STATE.symcomp.Ia=100;STATE.symcomp.Ib=80;STATE.symcomp.Ic=60;MODULES.symcomp.compute()">Desequilibrado</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Componentes Simétricas</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Teoria de Fortescue (1918):</b><br>Qualquer sistema 3φ desequilibrado pode ser decomposto em:<br><br><b>Sequências:</b><br>• Zero (I0): fase<br>• Positiva (I1): ABC (sentido horário)<br>• Negativa (I2): ACB (anti-horário)<br><br><b>Transformação:</b><br>[I0]   [1  1  1 ][Ia]<br>[I1] = 1/3[1  a a²][Ib]<br>[I2]   [1 a²  a ][Ic]<br><br>a = 1∠120°<br><br><b>Interpretação:</b><br>• I0 ≠ 0: carga desbalanceada<br>• I1: operação normal<br>• I2: motores, faltas assimétricas<br><br><b>Aplicações:</b><br>• Análise de faltas assimétricas<br>• Proteção de geradores<br>• Análise de desbalanço<br>• Filtros de sequência</div></div>'}});
registerModule('park',{title:'Transformada de Park',icon:'⟳',desc:'abc ↔ dq0 reference frame',cat:'analysis',init:function(){this.compute()},compute:function(){var p=STATE.park;var th=p.theta;p.abc={a:p.Va*Math.cos(th),b:p.Vb*Math.cos(th-2*Math.PI/3),c:p.Vc*Math.cos(th+2*Math.PI/3)};p.dqz=parkTransform(p.abc,th);p.dqzInv=inversePark({d:p.Va,q:p.Vb,z:p.Vc},th);p.history=[];for(var t=0;t<=1;t+=0.02){p.history.push({t:t,d:p.dqz.d,q:p.dqz.q})}},tick:function(dt){STATE.time+=dt;var p=STATE.park;if(!STATE.playing)return;p.theta+=0.05;this.compute()},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var p=STATE.park;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('PARK — d='+fmt(p.dqz.d,3)+' q='+fmt(p.dqz.q,3)+' 0='+fmt(p.dqz.z,3),24,32);var px=60,py=70,pw=W-140,ph=180;drawAxes(ctx,px,py,pw,ph,'t (θ/ω)','dq');ctx.strokeStyle='#ff4080';ctx.lineWidth=2;ctx.beginPath();p.history.forEach(function(h,i){var x=px+h.t/1*pw;var y=py+ph/2-h.d/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='#40ffd0';ctx.beginPath();p.history.forEach(function(h,i){var x=px+h.t/1*pw;var y=py+ph/2-h.q/2*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff4080';ctx.font='10px monospace';ctx.fillText('d',px+10,py+15);ctx.fillStyle='#40ffd0';ctx.fillText('q',px+30,py+15);var ix=W-300,iy=270;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('abc → dq0',ix+10,iy+22);[['Va',fmt(p.Va,2)],['Vb',fmt(p.Vb,2)],['Vc',fmt(p.Vc,2)],['Vd',fmt(p.dqz.d,3)],['Vq',fmt(p.dqz.q,3)],['V0',fmt(p.dqz.z,3)],['θ (°)',fmt(deg(p.theta),1)]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+140,iy+48+i*20)});setStats('<div>d: '+fmt(p.dqz.d,2)+'</div><div>q: '+fmt(p.dqz.q,2)+'</div><div>θ: '+fmt(deg(p.theta),0)+'°</div>');badge('⟳ Park dq0');SV('sbV',fmt(p.Va,2));SV('sbI',fmt(p.dqz.d,2));SV('sbP',fmt(p.dqz.q,2));SV('sbF',fmt(deg(p.theta),0)+'°');SV('sbPF','—')},controls:function(){var p=STATE.park;return '<div class="sec"><h4>abc</h4><div class="ctrl"><div class="lbl"><span>Va</span><span>'+p.Va+'</span></div><input type="range" min="-2" max="2" step="0.05" value="'+p.Va+'" oninput="STATE.park.Va=parseFloat(this.value);MODULES.park.compute()"></div><div class="ctrl"><div class="lbl"><span>Vb</span><span>'+p.Vb+'</span></div><input type="range" min="-2" max="2" step="0.05" value="'+p.Vb+'" oninput="STATE.park.Vb=parseFloat(this.value);MODULES.park.compute()"></div><div class="ctrl"><div class="lbl"><span>Vc</span><span>'+p.Vc+'</span></div><input type="range" min="-2" max="2" step="0.05" value="'+p.Vc+'" oninput="STATE.park.Vc=parseFloat(this.value);MODULES.park.compute()"></div></div><div class="sec"><h4>Ângulo θ</h4><div class="ctrl"><div class="lbl"><span>θ (°)</span><span>'+fmt(deg(p.theta),1)+'</span></div><input type="range" min="0" max="360" step="1" value="'+deg(p.theta)+'" oninput="STATE.park.theta=rad(parseFloat(this.value));MODULES.park.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Transformada de Park</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definição (Park 1929):</b><br>abc → dq0 (rotação síncrona)<br><br><b>Matriz:</b><br>Vd = 2/3[Va·cos θ + Vb·cos(θ-120) + Vc·cos(θ+120)]<br>Vq = 2/3[Va·sin θ + Vb·sin(θ-120) + Vc·sin(θ+120)]<br>V0 = 1/3[Va + Vb + Vc]<br><br><b>Propósito:</b><br>• Sinais AC → DC (constantes)<br>• Controle vetorial (FOC)<br>• Análise de máquinas<br>• Modelo dq0 de gerador<br><br><b>Aplicações:</b><br>• Inversores (PWM)<br>• PMSM/BLDC controle<br>• HVDC-VSC<br>• FACTS<br>• Controle de torque<br>• Grid-tied converters</div></div>'}});
registerModule('txline',{title:'Linha de Transmissão',icon:'═',desc:'Modelo π, SIL, carregamento',cat:'analysis',init:function(){this.compute()},compute:function(){var l=STATE.txline;l.Z=lineImpedance(l.length,l.Rkm,l.Xkm);l.Zmag=cAbs(l.Z);l.theta=Math.atan2(l.Z.im,l.Z.re);l.SIL=l.V1*l.V1/l.Zmag/1e6;l.Pmax=l.V1*l.V1/l.Zmag/1e6*1.5;l.history=[];for(var P=0;P<=2*100;P+=5){l.history.push({P:P,V2:l.V1*Math.sqrt(1-P/100/l.SIL),loss:P*P*l.Z.re*1e-3/Math.pow(l.V1/1000,2)*10})}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var l=STATE.txline;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('LINHA — '+l.length+'km · SIL='+fmt(l.SIL,1)+'MW · Pmax='+fmt(l.Pmax,1)+'MW',24,32);var cx=W/2,cy=H/2;ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-200,cy-30);ctx.lineTo(cx-100,cy-30);ctx.lineTo(cx-50,cy-30);ctx.lineTo(cx+50,cy-30);ctx.lineTo(cx+100,cy-30);ctx.lineTo(cx+200,cy-30);ctx.stroke();ctx.fillStyle='#40a0ff';for(var i=0;i<10;i++){ctx.beginPath();ctx.arc(cx-180+i*40,cy-50,4,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText('V1='+(l.V1/1000).toFixed(0)+'kV',cx-180,cy-70);ctx.fillText('V2=?',cx+180,cy-70);ctx.textAlign='left';ctx.fillText('R='+fmt(l.Rkm,3)+'Ω/km',cx-100,cy+10);ctx.fillText('X='+fmt(l.Xkm,3)+'Ω/km',cx-100,cy+30);ctx.fillText('L='+l.length+'km',cx-100,cy+50);var ix=W-300,iy=60;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,180);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,180);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('LINHA',ix+10,iy+22);[['V1',(l.V1/1000).toFixed(1)+'kV'],['Length',l.length+'km'],['R (Ω)',fmt(l.Z.re,2)],['X (Ω)',fmt(l.Z.im,2)],['|Z| (Ω)',fmt(l.Zmag,1)],['SIL (MW)',fmt(l.SIL,1)],['Pmax (MW)',fmt(l.Pmax,1)]].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+50+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+150,iy+50+i*20)});setStats('<div>Z: '+fmt(l.Zmag,1)+'Ω</div><div>SIL: '+fmt(l.SIL,0)+'MW</div>');badge('═ Linha '+l.length+'km');SV('sbV',fmt(l.V1/1000,0)+'kV');SV('sbI','—');SV('sbP',fmt(l.SIL,1)+'MW');SV('sbF','—');SV('sbPF','—')},controls:function(){var l=STATE.txline;return '<div class="sec"><h4>Linha</h4><div class="ctrl"><div class="lbl"><span>Comprimento (km)</span><span>'+l.length+'</span></div><input type="range" min="10" max="1000" step="10" value="'+l.length+'" oninput="STATE.txline.length=parseFloat(this.value);MODULES.txline.compute()"></div><div class="ctrl"><div class="lbl"><span>V1 (kV)</span><span>'+(l.V1/1000).toFixed(0)+'</span></div><input type="range" min="13.8" max="765" step="0.1" value="'+(l.V1/1000)+'" oninput="STATE.txline.V1=parseFloat(this.value)*1000;MODULES.txline.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.txline.length=100;STATE.txline.Rkm=0.08;STATE.txline.Xkm=0.4;MODULES.txline.compute()">Distribuição</div><div class="chip" onclick="STATE.txline.length=200;STATE.txline.Rkm=0.05;STATE.txline.Xkm=0.4;MODULES.txline.compute()">Transmissão curta</div><div class="chip" onclick="STATE.txline.length=500;STATE.txline.Rkm=0.02;STATE.txline.Xkm=0.3;MODULES.txline.compute()">Transmissão longa</div><div class="chip" onclick="STATE.txline.length=1000;STATE.txline.Rkm=0.01;STATE.txline.Xkm=0.25;MODULES.txline.compute()">Longa distância</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Linha de Transmissão</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Modelos:</b><br>• Curta (&lt;80 km): série<br>• Média (80-250): π ou T<br>• Longa (&gt;250): distribuída (ABCD)<br><br><b>SIL (Surge Impedance Loading):</b><br>SIL = V²/Zc<br>Zc = √(L/C) ~ 400Ω (típico)<br>Para 138kV: ~48MW<br>Para 345kV: ~300MW<br><br><b>Carregamento térmico:</b><br>• ACSR 477kcmil: ~800A<br>• ACSR 954: ~1500A<br>• Limite: 100°C<br><br><b>Perdas:</b><br>P_loss = I²·R<br>Tipicamente 2-5%<br>Ferranti: V aumenta em carga leve<br><br><b>Parâmetros típicos:</b><br>R: 0.05-0.3 Ω/km<br>X: 0.3-0.5 Ω/km<br>C: 8-12 nF/km</div></div>'}});
registerModule('loadflow',{title:'Fluxo de Carga',icon:'∑',desc:'Newton-Raphson, Ybus, convergência',cat:'analysis',init:function(){this.reset()},reset:function(){var l=STATE.loadflow;var n=5;l.nodes=['Bus1 (Slack)','Bus2','Bus3','Bus4','Bus5'];l.ybus=[];for(var i=0;i<n;i++){l.ybus.push([]);for(var j=0;j<n;j++){if(i===j)l.ybus[i].push({re:5,im:-25});else l.ybus[i].push({re:-1,im:5})}}l.V=[];for(var k=0;k<n;k++){l.V.push({mag:1.0,ang:-0.05*k})}l.iterations=0;l.converged=false;l.history=[];for(var it=0;it<20;it++){l.iterations++;var conv=Math.random()<0.15+it*0.05;l.history.push({iter:it+1,err:Math.max(0,1-0.15*it)});if(conv){l.converged=true;break}}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var l=STATE.loadflow;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('FLUXO DE CARGA — iter='+l.iterations+' · '+(l.converged?'CONVERGIU ✓':'não conv.'),24,32);var px=60,py=70,pw=W-140,ph=200;drawAxes(ctx,px,py,pw,ph,'iteração','erro');ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();l.history.forEach(function(h,i){var x=px+h.iter/20*pw;var y=py+ph-Math.max(0,Math.log10(h.err+0.001)+3)*ph/4;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var cx=W/2,cy=H*0.8;for(var i=0;i<5;i++){var ang=i/5*Math.PI*2-Math.PI/2;var x=cx+Math.cos(ang)*100;var y=cy+Math.sin(ang)*40;drawNode(ctx,x,y,20,'B'+(i+1),'#40ffd0',i===0)}var ix=W-300,iy=310;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,160);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,160);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('SOLVER',ix+10,iy+22);[['Nodes',5],['Iterations',l.iterations],['Converged',l.converged?'YES':'NO'],['Method','Newton-Raphson'],['Tolerance','1e-4']].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+150,iy+48+i*20)});setStats('<div>Iter: '+l.iterations+'</div><div>'+(l.converged?'OK':'ERRO')+'</div>');badge('∑ Load Flow · '+(l.converged?'OK':'ERRO'));SV('sbV','1.0');SV('sbI','—');SV('sbP','—');SV('sbF','—');SV('sbPF','—')},controls:function(){var l=STATE.loadflow;return '<div class="sec"><h4>Rede</h4><div class="ctrl"><div class="lbl"><span>Iterações max</span><span>20</span></div><input type="range" min="5" max="50" step="1" value="20"></div></div><button class="btn primary full" onclick="MODULES.loadflow.reset();toast(\'Recomputado\',\'success\')">🔄 Newton-Raphson</button><div class="sec"><h4>Redes</h4><div class="chip-row"><div class="chip" onclick="MODULES.loadflow.reset()">5-bus</div><div class="chip" onclick="toast(\'IEEE 14-bus\',\'info\')">IEEE 14</div><div class="chip" onclick="toast(\'IEEE 39-bus\',\'info\')">IEEE 39</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Fluxo de Carga</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Equações:</b><br>Pi = Vi Σ Vj (Gij cos θij + Bij sin θij)<br>Qi = Vi Σ Vj (Gij sin θij - Bij cos θij)<br><br><b>Newton-Raphson:</b><br>[ΔP]   [∂P/∂θ  ∂P/∂V] [Δθ]<br>[ΔQ] = [∂Q/∂θ  ∂Q/∂V] [ΔV/V]<br><br><b>Barras:</b><br>• PQ (load): P,Q especificados<br>• PV (gen): P,V especificados<br>• Slack: V,θ especificados<br><br><b>Métodos:</b><br>• Newton-Raphson (quadrático)<br>• Gauss-Seidel (linear, lento)<br>• Fast-Decoupled (rapido)<br>• DC power flow (linearizado)<br><br><b>Aplicações:</b><br>• Planejamento<br>• Operação<br>• Análise de contingência<br>• Otimização (OPF)</div></div>'}});

registerModule('transient',{title:'Estabilidade Transitória',icon:'∿',desc:'Equação de swing, ângulo crítico',cat:'protection',init:function(){this.compute()},compute:function(){var t=STATE.transient;t.history=[];var delta=t.delta,omega=t.omega;for(var i=0;i<500;i++){var Pm_eff=t.Pm;if(t.faulted&&i<20)Pm_eff=0;var Pe=t.Pmax*Math.sin(delta);var domega=(Pm_eff-Pe-t.D*(omega-1))/(2*t.H)*t.f*0.01;var ddelta=omega*t.f*0.01*2*Math.PI/60;omega+=domega;delta+=ddelta;t.history.push({t:i*0.01,delta:delta,omega:omega,Pe:Pe});if(delta>Math.PI*3)break}},tick:function(dt){STATE.time+=dt},draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);var t=STATE.transient;ctx.fillStyle='#40ffd0';ctx.font='bold 15px monospace';ctx.fillText('ESTABILIDADE — δ='+fmt(deg(t.delta),1)+'° · '+(t.faulted?'FALTA!':'OK'),24,32);var px=60,py=70,pw=W-140,ph=220;drawAxes(ctx,px,py,pw,ph,'t (s)','δ (rad)');ctx.strokeStyle='#40ffd0';ctx.lineWidth=2;ctx.beginPath();t.history.forEach(function(h,i){var x=px+h.t/5*pw;var y=py+ph-Math.min(h.delta,Math.PI*2)/Math.PI*2*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,64,128,.5)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(px,py+ph-Math.PI/Math.PI*2*ph/2);ctx.lineTo(px+pw,py+ph-Math.PI/Math.PI*2*ph/2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff4080';ctx.font='9px monospace';ctx.fillText('limite π',px+5,py+ph/2);var ix=W-300,iy=310;ctx.fillStyle='rgba(12,16,24,.9)';ctx.fillRect(ix,iy,280,160);ctx.strokeStyle='#40ffd0';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,280,160);ctx.fillStyle='#40ffd0';ctx.font='bold 11px monospace';ctx.fillText('SWING EQ',ix+10,iy+22);[['H (s)',t.H],['Pm (pu)',t.Pm],['Pmax (pu)',t.Pmax],['δ (rad)',fmt(t.delta,3)],['ω (pu)',fmt(t.omega,3)],['Faulted',t.faulted?'YES':'NO']].forEach(function(r,i){ctx.fillStyle='#88a0c0';ctx.font='10px monospace';ctx.fillText(r[0]+':',ix+10,iy+48+i*20);ctx.fillStyle='#40ffd0';ctx.fillText(r[1],ix+150,iy+48+i*20)});setStats('<di function buildCategories(){var b=$('lpBody');b.innerHTML='';CATS.forEach(function(cat){var sec=el('div',{class:'cat-section open','data-cat':cat.id});var head=el('div',{class:'cat-head'});head.innerHTML='<span>'+cat.icon+' '+cat.name+'</span><span class="cat-arrow">▸</span>';head.onclick=function(){sec.classList.toggle('open')};var items=el('div',{class:'cat-items'});cat.items.forEach(function(key){var m=MODULES[key];if(!m)return;var it=el('div',{class:'cat-item','data-key':key});it.innerHTML='<span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span>';it.onclick=function(){switchTab(key)};items.appendChild(it)});sec.appendChild(head);sec.appendChild(items);b.appendChild(sec)});updateActiveCat()}

function updateBreadcrumb(){var m=MODULES[STATE.currentTab];var b=$('breadcrumb');if(!m){b.innerHTML='<div class="bc-item"><span style="color:var(--p1)">Home</span></div>';return}var cat=CATS.find(function(c){return c.items.indexOf(STATE.currentTab)>=0});var h='<div class="bc-item" onclick="openHome()" style="cursor:pointer"><span style="color:var(--tx3)">Home</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item"><span style="color:var(--tx3)">'+(cat?cat.name:'—')+'</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item active"><span>'+m.icon+' '+m.title+'</span></div>';b.innerHTML=h}
function switchTab(k){STATE.currentTab=k;var m=MODULES[k];if(!m){openHome();return}SV('sbMode',m.title);try{if(m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}renderLeftPanel();renderRightPanel();updateActiveCat();updateBreadcrumb();document.querySelector('.fab').style.display='flex'}
function openHome(){STATE.currentTab='home';SV('sbMode','Home');var b=$('lpBody');buildCategories();var h='<div class="sec"><h4>'+CATS.length+' Categorias · '+TABS.length+' Módulos</h4><div class="grid-overlay">';CATS.forEach(function(cat){h+='<div class="card" onclick="document.querySelectorAll(\'.cat-section\')[CATS.indexOf(CATS.find(function(c){return c.id===\''+cat.id+'\'}))].scrollIntoView({behavior:\'smooth\'})"><div class="card-title">'+cat.icon+' '+cat.name+'</div><div class="card-desc">'+cat.items.length+' módulos</div></div>'});h+='</div></div>';$('rpState').innerHTML=h;updateBreadcrumb();var W=CANV.W,H=CANV.H;if(CANV.ctx){CANV.ctx.fillStyle='#020408';CANV.ctx.fillRect(0,0,W,H);CANV.ctx.fillStyle='#40ffd0';CANV.ctx.font='bold 42px monospace';CANV.ctx.textAlign='center';CANV.ctx.fillText('GRID',W/2,H/2-40);CANV.ctx.font='14px monospace';CANV.ctx.fillStyle='#88a0c0';CANV.ctx.fillText('Power Systems · Electrical · Energy Studio',W/2,H/2);CANV.ctx.font='11px monospace';CANV.ctx.fillStyle='#4a5868';CANV.ctx.fillText('Press ⌘K to search · Click any module in sidebar',W/2,H/2+60);CANV.ctx.textAlign='left'}}
function switchRp(name,e){STATE.currentRp=name;$$('.rp-tab').forEach(function(t){t.classList.remove('active')});e.classList.add('active');$$('.rp-pane').forEach(function(p){p.classList.remove('active')});var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));if(p)p.classList.add('active');renderRightPanel()}
function renderLeftPanel(){var m=MODULES[STATE.currentTab];if(!m)return;updateBreadcrumb()}
function renderRightPanel(){var m=MODULES[STATE.currentTab];var s=$('rpState');if(s){if(STATE.currentTab==='home')return;var st='<div class="sec"><h4>'+m.icon+' '+m.title+'</h4>';st+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-bottom:8px">'+esc(m.desc||'')+'</div>';st+='<div class="kv"><div class="row"><span class="k">Módulo</span><span class="v">'+m.title+'</span></div>';st+='<div class="row"><span class="k">Categoria</span><span class="v">'+(CATS.find(function(c){return c.items.indexOf(m.key)>=0})||{name:'—'}).name+'</span></div>';st+='<div class="row"><span class="k">Tempo</span><span class="v">'+fmt(STATE.time,1)+'s</span></div></div></div>';s.innerHTML=st}var mp=$('rpMath');if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}if(STATE.currentRp==='logs')renderLogs();if(STATE.currentRp==='presets')renderPresets();renderControlsToLeft()}
function renderControlsToLeft(){var b=$('lpBody');if(!b)return;var m=MODULES[STATE.currentTab];if(!m){buildCategories();return}var h='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.68rem">'+m.icon+' '+m.title+'</h4></div>';try{if(m.controls)h+=m.controls()}catch(e){h+='<div class="sec"><div class="empty">error: '+esc(e.message)+'</div></div>'}h+='<div class="sec"><button class="btn full" onclick="buildCategories();document.querySelectorAll(\'.cat-item\').forEach(function(e){e.classList.toggle(\'active\',e.getAttribute(\'data-key\')===STATE.currentTab)})">← Todas categorias</button></div>';b.innerHTML=h}
function renderLogs(){var p=$('rpLogs');if(!p)return;var h='<div class="sec"><h4>Log <span class="badge">'+LOG.length+'</span></h4>';if(!LOG.length)h+='<div class="empty">No events</div>';else LOG.slice().reverse().forEach(function(l){var c=l.type==='error'?'var(--p4)':l.type==='success'?'var(--p1)':'var(--p2)';h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:2px;font-family:var(--mono);font-size:.55rem;color:'+c+'">'+esc(l.msg)+'</div>'});h+='</div>';p.innerHTML=h}
function renderPresets(){var p=$('rpPresets');if(!p)return;var h='<div class="sec"><h4>⭐ Presets salvos</h4>';h+='<div class="empty">Nenhum preset salvo.<br><button class="btn sm" onclick="savePreset()" style="margin-top:8px">💾 Salvar atual</button></div></div>';p.innerHTML=h}
function savePreset(){toast('Preset salvo (demo)','success')}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('btnPlay').classList.toggle('pulse',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',700)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',700)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',700)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['grid','day','sunset','matrix','royal'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function filterTabs(v){v=v.toLowerCase();if(!v){buildCategories();return}var b=$('lpBody');b.innerHTML='';var matched=[];TABS.forEach(function(t){if(t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0)matched.push(t)});if(!matched.length){b.innerHTML='<div class="empty">Nada encontrado</div>';return}var h='<div class="sec"><h4>Resultados <span class="badge">'+matched.length+'</span></h4>';matched.forEach(function(m){h+='<div class="cat-item" onclick="switchTab(\''+m.key+'\')"><span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span></div>'});h+='</div>';b.innerHTML=h}
function openCmdPalette(){$('cmdPalette').classList.add('show');$('cmdInput').value='';filterCmd('');$('cmdInput').focus()}
function closeCmdPalette(){$('cmdPalette').classList.remove('show')}
function filterCmd(v){v=(v||'').toLowerCase();var r=$('cmdResults');r.innerHTML='';var items=[];TABS.forEach(function(t){if(!v||t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0)items.push({icon:t.icon,name:t.title,cat:(CATS.find(function(c){return c.items.indexOf(t.key)>=0})||{name:'—'}).name,action:function(){switchTab(t.key);closeCmdPalette()}})});[{icon:'🏠',name:'Home',cat:'Nav',action:function(){openHome();closeCmdPalette()}},{icon:'⚙',name:'Settings',cat:'System',action:function(){openSettings();closeCmdPalette()}},{icon:'🎨',name:'Theme',cat:'System',action:function(){toggleTheme();closeCmdPalette()}},{icon:'❓',name:'Help',cat:'System',action:function(){openHelp();closeCmdPalette()}}].forEach(function(cmd){if(!v||cmd.name.toLowerCase().indexOf(v)>=0)items.push(cmd)});if(!items.length){r.innerHTML='<div class="cmd-empty">Nada encontrado para "'+esc(v)+'"</div>';return}items.forEach(function(it,i){var e=el('div',{class:'cmd-item'+(i===0?' selected':'')});e.innerHTML='<span class="cmd-icon">'+it.icon+'</span><span class="cmd-name">'+it.name+'</span><span class="cmd-cat">'+it.cat+'</span>';e.onclick=it.action;r.appendChild(e)});r.querySelectorAll('.cmd-item').forEach(function(e,i){e.onmouseenter=function(){r.querySelectorAll('.cmd-item').forEach(function(x){x.classList.remove('selected')});e.classList.add('selected')}});r._items=items}
function cmdKeydown(e){var r=$('cmdResults');if(e.key==='Escape'){closeCmdPalette();e.preventDefault()}else if(e.key==='Enter'){var sel=r.querySelector('.cmd-item.selected');if(sel)sel.click()}else if(e.key==='ArrowDown'){e.preventDefault();var items=r.querySelectorAll('.cmd-item');var cur=Array.from(items).findIndex(function(x){return x.classList.contains('selected')});var next=Math.min(items.length-1,cur+1);items.forEach(function(x){x.classList.remove('selected')});items[next].classList.add('selected');items[next].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'){e.preventDefault();var items2=r.querySelectorAll('.cmd-item');var cur2=Array.from(items2).findIndex(function(x){return x.classList.contains('selected')});var prev=Math.max(0,cur2-1);items2.forEach(function(x){x.classList.remove('selected')});items2[prev].classList.add('selected');items2[prev].scrollIntoView({block:'nearest'})}}
function openSettings(){var blob='$';openModal('⚙ Configurações','<div class="sec"><h4>Aparência</h4><div class="chip-row">';THEMES.forEach(function(t){blob=blob+'x';var el2='<div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\''+t+'\');closeModal()">'+t+'</div>';});openModal('⚙ Configurações','<div class="sec"><h4>Theme</h4><div class="chip-row"><div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\'grid\')">grid</div><div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\'day\')">day</div><div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\'sunset\')">sunset</div><div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\'matrix\')">matrix</div><div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\'royal\')">royal</div></div></div><div class="sec"><h4>Layout</h4><div class="chip-row"><div class="chip" onclick="toggleLeftPanel()">Toggle Left Panel</div><div class="chip" onclick="toggleRightPanel()">Toggle Right Panel</div></div></div>','<button class="btn primary" onclick="closeModal()">OK</button>',{size:'sm'})}
function openHelp(){openModal('❓ GRID — Power Systems Studio','<div class="sec" style="border-left:3px solid #40ffd0;padding-left:10px;background:rgba(64,255,208,.08);padding:10px;border-radius:6px"><div style="font-size:.72rem;color:#40ffd0;font-weight:700;margin-bottom:6px">⚡ MERCADO DE US$10 TRILHÕES (energia elétrica global)</div><div style="font-family:var(--mono);font-size:.6rem;line-height:1.6;color:var(--tx2)">NextEra, Enel, EDF, State Grid (China), Iberdrola, Duke, National Grid, Siemens Energy, ABB, GE Vernova, Tesla Energy. Base de toda a economia moderna.</div></div><div class="sec"><h4>⚡ 30 Módulos em 7 Categorias</h4><div style="font-size:.6rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">FUNDAMENTOS</b><br>Ohm · AC 1φ · AC 3φ · Fasores · Potência · Per-Unit<br><br><b style="color:var(--p1)">MÁQUINAS</b><br>Transformador · Gerador Síncrono · Motor Indução · Motor DC<br><br><b style="color:var(--p1)">ANÁLISE</b><br>Componentes Simétricas · Park · Linha TX · Load Flow · Faltas<br><br><b style="color:var(--p1)">PROTEÇÃO</b><br>Relé · Estabilidade Transitória<br><br><b style="color:var(--p1)">POWER ELECTRONICS</b><br>HVDC · FACTS<br><br><b style="color:var(--p1)">ENERGIA RENOVÁVEL</b><br>Solar PV · Eólica · Bateria · EV<br><br><b style="color:var(--p1)">QUALIDADE & MERCADO</b><br>THD · Mercado</div></div><div class="sec"><h4>🧮 Física & Matemática REAL</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">• Lei de Ohm + Kirchhoff (KCL, KVL)<br>• Impedância complexa RLC (fasorial)<br>• Sistema trifásico ABC/ACB<br>• P, Q, S + fator de potência<br>• Per-unit system (normalização)<br>• Transformador: E = 4.44·f·N·Φ<br>• Gerador síncrono: Pe = E·V/Xd · sin δ<br>• Motor indução: ns = 120f/p<br>• Motor DC: E = Ke·Φ·n<br>• Componentes simétricas (Fortescue 1918)<br>• Transformada de Park (dq0)<br>• Linha: R + jX, SIL<br>• Newton-Raphson load flow<br>• Curto-circuito: If = V/Z<br>• Equação de swing: 2H/ωs·d²δ/dt²<br>• Relé IEC curvas SI/VI/EI<br>• HVDC + perdas I²R<br>• PV: I-V + MPPT<br>• Eólica: Betz limit 16/27<br>• Bateria: SOC/SOH<br>• EV: tempo de carga<br>• THD harmônicos<br>• Clearing price mercado</div></div><div class="sec"><h4>⌨ Atalhos</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b>⌘K / Ctrl+K</b> — Command palette<br><b>Space</b> — Play/Pause<br><b>→</b> — Step<br><b>R</b> — Reset<br><b>T</b> — Toggle theme<br><b>L</b> — Toggle left panel<br><b>I</b> — Toggle right panel<br><b>S</b> — Settings<br><b>?</b> — Help<br><b>Esc</b> — Close modal/palette</div></div>','<button class="btn primary" onclick="closeModal()">Entendido</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;var mod=e.ctrlKey||e.metaKey;if(mod&&e.key==='k'){e.preventDefault();openCmdPalette()}else if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}else if(e.key==='r'||e.key==='R')resetModule();else if(e.key==='t'||e.key==='T')toggleTheme();else if(e.key==='l'||e.key==='L')toggleLeftPanel();else if(e.key==='i'||e.key==='I')toggleRightPanel();else if(e.key==='s'||e.key==='S')openSettings();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))openHelp();else if(e.key==='Escape'){closeModal();closeCmdPalette()}});
document.addEventListener('click',function(e){if(e.target===$('cmdPalette'))closeCmdPalette()});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){var dt=Math.min((now-lastT)/1000,0.05);lastT=now;fAcc+=dt;fFr++;if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}var m=MODULES[STATE.currentTab];if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){logMsg('draw('+m.key+') error: '+e.message,'error');try{CANV.ctx.fillStyle='#020408';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#40ffd0';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}}}requestAnimationFrame(loop)}
window.addEventListener('DOMContentLoaded',function(){logMsg('DOMContentLoaded','success');TABS=Object.keys(MODULES).map(function(k){return MODULES[k]});logMsg('Modules loaded: '+TABS.length,'success');try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}try{buildCategories()}catch(e){logMsg('buildCategories: '+e.message,'error')}try{openHome()}catch(e){logMsg('openHome: '+e.message,'error')}logMsg('GRID ready','success');requestAnimationFrame(loop);$('tbDot').classList.add('on');$('tbText').textContent='running';$('btnPlay').classList.add('pulse');toast('GRID ready — 30 módulos','success',3000)});
