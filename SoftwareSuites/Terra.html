<title>TERRA · Suite Geológica</title>
<style>
:root{--bg:#0a0805;--pn:#1e1810;--ink:#e8dcc8;--ink2:#a89878;--ink3:#4a3c28;--acc:#ffb800;--acc2:#ff4d2d;--ok:#00ff9d;--mo:'JetBrains Mono',monospace;--di:'Orbitron',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--mo);display:grid;grid-template-columns:260px 1fr;grid-template-rows:52px 1fr;grid-template-areas:"h h" "n m";height:100vh;overflow:hidden}
header{grid-area:h;background:linear-gradient(180deg,#1e1810,#0d0a08);border-bottom:1px solid var(--ink3);display:flex;align-items:center;padding:0 20px;gap:14px}
.logo{font-family:var(--di);font-weight:900;letter-spacing:5px;color:var(--acc);text-shadow:0 0 20px var(--acc)}
.tag{font-size:9px;color:var(--ink3);border:1px solid var(--ink3);padding:3px 8px;border-radius:2px;letter-spacing:2px}
nav{grid-area:n;background:var(--pn);border-right:1px solid var(--ink3);overflow-y:auto;padding:8px 0}
.cat{font-family:var(--di);font-size:9px;letter-spacing:2.5px;color:var(--acc);padding:10px 16px 6px;text-transform:uppercase;border-bottom:1px solid var(--ink3);margin-bottom:4px;display:flex;justify-content:space-between}
.item{padding:7px 16px;font-size:11px;color:var(--ink2);cursor:pointer;border-left:2px solid transparent;transition:.15s}
.item:hover{background:rgba(255,184,0,.05);color:var(--ink)}
.item.on{background:rgba(255,184,0,.1);color:var(--acc);border-left-color:var(--acc)}
main{grid-area:m;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1e1810,#0a0805)}
canvas{display:block;width:100%;height:100%}
.boot{position:fixed;inset:0;background:#0a0805;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.5s;font-family:var(--mo)}
.boot.d{opacity:0;pointer-events:none}
.bl{font-family:var(--di);font-size:2.2rem;letter-spacing:12px;color:var(--acc);text-shadow:0 0 40px var(--acc);margin-bottom:8px}
.bs{font-size:10px;letter-spacing:4px;color:var(--ink3);margin-bottom:40px}
.bb{width:min(420px,70vw);height:2px;background:var(--ink3);overflow:hidden;margin-bottom:16px}
.bf{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:.2s}
.bm{font-size:10px;color:var(--ink2);letter-spacing:1.5px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-areas:"h" "m"}nav{display:none}}
</style></head><body>

R.ts=function(){clearC();headC('Tempo Geológico','Escala');var y0=120;var totalTime=4600;var xL=60;var xR=S.W-60;TIMESCALE.forEach(function(g,i){var y=y0+i*24;if(y>S.H-70)return;var barW=(g.end-g.start)/totalTime*(xR-xL);S.ctx.fillStyle=g.c;S.ctx.globalAlpha=.7;S.ctx.fillRect(xL,y-10,barW,20);S.ctx.globalAlpha=1;S.ctx.strokeStyle='rgba(0,0,0,.3)';S.ctx.strokeRect(xL,y-10,barW,20);if(barW>60){S.ctx.fillStyle='#0a0805';S.ctx.font='bold 10px "Orbitron",monospace';S.ctx.textAlign='left';S.ctx.fillText(g.period||g.era||g.eon,xL+4,y+4)}})};

function buildNav(){var n=$q('nav');n.innerHTML='';var cats={'Sismologia':[['eq','Terremotos','△']],'Vulcanologia':[['vol','Vulcões','🌋']],'Mineralogia':[['min','Minerais','💎']],'Tectônica':[['pl','Placas','🌍']],'Tempo Geológico':[['ts','Escala','⏳']]};Object.keys(cats).forEach(function(c){var g=el('div',{c:'cat'});g.innerHTML='<span>'+c+'</span><span>'+cats[c].length+'</span>';n.appendChild(g);cats[c].forEach(function(m){var it=el('div',{c:'item'+(m[0]===S.module?' on':'')});it.setAttribute('data-id',m[0]);it.innerHTML='<span style="margin-right:8px">'+m[2]+'</span>'+m[1];it.onclick=function(){switchMod(m[0])};n.appendChild(it)})})}
function switchMod(id){S.module=id;var m=MODULES.find(function(x){return x.id===id});if(m)$q('tag').textContent=m.cat+' · '+m.name;document.querySelectorAll('.item').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-id')===id)});if(typeof R[id]==='function')R[id]()}
MODULES=[{id:'eq',name:'Terremotos',cat:'Sismologia'},{id:'vol',name:'Vulcões',cat:'Vulcanologia'},{id:'min',name:'Minerais',cat:'Mineralogia'},{id:'pl',name:'Placas',cat:'Tectônica'},{id:'ts',name:'Tempo Geológico',cat:'Tempo Geológico'}];
function resize(){S.dpr=Math.min(window.devicePixelRatio||1,2);S.W=S.cv.clientWidth;S.H=S.cv.clientHeight;S.cv.width=S.W*S.dpr;S.cv.height=S.H*S.dpr;S.ctx.setTransform(1,0,0,1,0,0);S.ctx.scale(S.dpr,S.dpr);if(typeof R[S.module]==='function')R[S.module]()}
function loop(){requestAnimationFrame(loop);if(typeof R[S.module]==='function')R[S.module]()}
function boot(){var st=[['inicializando…',10],['12.000 sismógrafos…',30],['modelo PREM…',50],['catálogos…',70],['indexando…',90],['pronto',100]];var i=0;function nx(){if(i>=st.length){setTimeout(function(){$q('boot').classList.add('d')},300);return}$q('bm').textContent=st[i][0];$q('bf').style.width=st[i][1]+'%';i++;setTimeout(nx,150)}nx()}
function init(){S.cv=$q('cv');S.ctx=S.cv.getContext('2d');resize();buildNav();window.addEventListener('resize',resize);switchMod('eq');boot();loop();document.addEventListener('keydown',function(e){var n=parseInt(e.key,10);if(n>=1&&n<=5){var m=MODULES[n-1];if(m)switchMod(m.id)}})}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
