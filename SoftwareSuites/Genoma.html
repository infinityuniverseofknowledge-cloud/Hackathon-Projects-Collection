registerModule('protein',{
  title:'Protein Viewer',
  icon:'🥚',
  desc:'Translate DNA to protein, predict secondary structure (Chou-Fasman), analyze amino acid composition.',
  init:function(){
    if(!STATE.protein.sequence){
      STATE.protein.sequence=translate(STATE.dna.sequence,0).replace(/\*.*$/,'');
    }
    this.compute();
  },
  compute:function(){
    var p=STATE.protein;
    p.secondary=predictSecondaryStructure(p.sequence);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var p=STATE.protein;
    /* Header */
    ctx.fillStyle='#ff40a0';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('🥚 PROTEIN VIEWER',20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText('Length: '+p.sequence.length+' aa | MW: '+fmt(proteinMW(p.sequence)/1000,1)+' kDa | pI: '+fmt(isoelectricPoint(p.sequence),1),20,44);
    /* Secondary structure strip */
    var ssY=70;
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText('Secondary structure (Chou-Fasman):',20,ssY-4);
    var ssW=W-40;
    var ssH=20;
    var ssX=20;
    for(var i=0;i<p.secondary.length;i++){
      var x=ssX+(i/p.secondary.length)*ssW;
      var w=ssW/p.secondary.length+1;
      var s=p.secondary[i];
      ctx.fillStyle=s==='H'?'#ff40a0':s==='E'?'#40d0ff':'rgba(88,120,144,.3)';
      ctx.fillRect(x,ssY,w,ssH);
    }
    /* Legend */
    ctx.font='10px monospace';
    ctx.fillStyle='#ff40a0';
    ctx.fillText('■ α-helix',20,ssY+ssH+14);
    ctx.fillStyle='#40d0ff';
    ctx.fillText('■ β-sheet',100,ssY+ssH+14);
    ctx.fillStyle='#587890';
    ctx.fillText('■ coil',180,ssY+ssH+14);
    /* Amino acid sequence with coloring by property */
    var seqY=ssY+ssH+40;
    var charW=9;
    var lineH=20;
    var perLine=Math.floor((W-60)/charW);
    var aaColors={
      polar:'#40d0ff',
      nonpolar:'#40ff90',
      positive:'#ff5060',
      negative:'#ffe040',
      special:'#a060ff'
    };
    var pos=0,line=0;
    while(pos<p.sequence.length){
      var lineLen=Math.min(perLine,p.sequence.length-pos);
      var y=seqY+line*lineH;
      if(y>H-40)break;
      /* Position */
      ctx.fillStyle='#587890';
      ctx.font='9px monospace';
      ctx.textAlign='right';
      ctx.fillText((pos+1).toString(),25,y+12);
      /* Amino acids */
      for(var j=0;j<lineLen;j++){
        var aa=p.sequence[pos+j];
        var info=AA_INFO[aa]||AA_INFO['A'];
        ctx.fillStyle=aaColors[info.class]||'#808080';
        ctx.font='bold 11px monospace';
        ctx.textAlign='center';
        ctx.fillText(aa,40+j*charW+charW/2,y+12);
        /* Secondary structure marker */
        if(p.secondary[pos+j]==='H'){
          ctx.fillStyle='rgba(255,64,160,.4)';
          ctx.fillRect(40+j*charW+1,y+16,charW-2,2);
        } else if(p.secondary[pos+j]==='E'){
          ctx.fillStyle='rgba(64,208,255,.4)';
          ctx.fillRect(40+j*charW+1,y+16,charW-2,2);
        }
      }
      pos+=lineLen;
      line++;
    }
    setStatsHTML(
      '<div>AA: '+p.sequence.length+'</div>'+
      '<div>MW: '+fmt(proteinMW(p.sequence)/1000,1)+' kDa</div>'+
      '<div>pI: '+fmt(isoelectricPoint(p.sequence),1)+'</div>'+
      '<div>Helix: '+fmt(p.secondary.split('H').length-1,0)+' aa</div>'+
      '<div>Sheet: '+fmt(p.secondary.split('E').length-1,0)+' aa</div>'
    );
    updateBadge('🥚 Protein · '+p.sequence.length+' aa · pI '+fmt(isoelectricPoint(p.sequence),1));
    $('sbMode').textContent='Protein';
  },
  onDown:function(){},
  controls:function(){
    var p=STATE.protein;
    var html='';
    html+='<div class="sec"><h4>Protein Sequence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.protein.sequence=this.value.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g,\'\');MODULES.protein.compute()">'+esc(p.sequence)+'</textarea></div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);margin-bottom:6px">'+p.sequence.length+' amino acids</div>';
    html+='<button class="btn full sm" onclick="STATE.protein.sequence=translate(STATE.dna.sequence,0).replace(/\\*.*$/,\'\');MODULES.protein.compute();renderLeftPanel()">🧬 From DNA viewer</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.protein.sequence=randomProtein(150);MODULES.protein.compute();renderLeftPanel()">🎲 Random 150 aa</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="loadInsulinProtein()">💉 Insulin (human)</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Color Scheme</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
      '<span style="color:#40d0ff">■ Polar</span><br>'+
      '<span style="color:#40ff90">■ Nonpolar</span><br>'+
      '<span style="color:#ff5060">■ Positive (basic)</span><br>'+
      '<span style="color:#ffe040">■ Negative (acidic)</span><br>'+
      '<span style="color:#a060ff">■ Special</span>'+
      '</div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var p=STATE.protein;
    /* AA composition */
    var comp={};
    for(var i=0;i<p.sequence.length;i++){
      comp[p.sequence[i]]=(comp[p.sequence[i]]||0)+1;
    }
    var sorted=Object.keys(comp).sort(function(a,b){return comp[b]-comp[a]});
    var html='<div class="sec"><h4>Amino Acid Composition</h4>';
    html+='<div style="max-height:200px;overflow-y:auto">';
    sorted.forEach(function(aa){
      var info=AA_INFO[aa]||{name:'?'};
      var pct=comp[aa]/p.sequence.length*100;
      html+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-family:var(--mono);font-size:.6rem">';
      html+='<span style="color:var(--c1);font-weight:700">'+aa+'</span>';
      html+='<span style="color:var(--tx3)">'+info.name+'</span>';
      html+='<span style="color:var(--c2)">'+comp[aa]+' ('+fmt(pct,1)+'%)</span>';
      html+='</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Chou-Fasman</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Empirical method using per-residue propensity values for helix (P<sub>α</sub>) and sheet (P<sub>β</sub>) formation:<br><br>'+
      'If P<sub>α</sub>(aa) > 1.05 and P<sub>α</sub> > P<sub>β</sub> → helix<br>'+
      'If P<sub>β</sub>(aa) > 1.05 and P<sub>β</sub> > P<sub>α</sub> → sheet<br>'+
      'Otherwise → coil'+
      '</div></div>';
    html+='<div class="sec"><h4>Properties</h4><div class="kv">'+
      '<div class="row"><span class="k">Length</span><span class="v">'+p.sequence.length+' aa</span></div>'+
      '<div class="row"><span class="k">Molecular weight</span><span class="v">'+fmt(proteinMW(p.sequence)/1000,2)+' kDa</span></div>'+
      '<div class="row"><span class="k">Isoelectric point</span><span class="v">pH '+fmt(isoelectricPoint(p.sequence),2)+'</span></div>'+
      '</div></div>';
    return html;
  }
});
function randomProtein(n){
  var aa='ACDEFGHIKLMNPQRSTVWY';
  var out='';
  for(var i=0;i<n;i++)out+=aa[rnd(0,aa.length-1)];
  return out;
}
function loadInsulinProtein(){
  /* Human insulin — mature chain A + B */
  STATE.protein.sequence='FVNQHLCGSHLVEALYLVCGERGFFYTPKTRREAEDLQVGQVELGGGPGAGSLQPLALEGSLQKRGIVEQCCTSICSLYQLENYCN';
  MODULES.protein.compute();
  renderLeftPanel();
}
</script>
<script>
/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'dna',icon:'🧬',label:'DNA'},
  {key:'align',icon:'⚖️',label:'Alignment'},
  {key:'phylo',icon:'🌲',label:'Phylogeny'},
  {key:'orf',icon:'🎯',label:'ORF'},
  {key:'gc',icon:'📊',label:'GC'},
  {key:'restriction',icon:'✂️',label:'Restriction'},
  {key:'protein',icon:'🥚',label:'Protein'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--c4)':l.type==='success'?'var(--c1)':'var(--c2)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['helix','paper','violet'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    dna:{sequence:STATE.dna.sequence.substring(0,100),frame:STATE.dna.frame},
    align:{mode:STATE.align.mode,match:STATE.align.match},
    phylo:{numTaxa:STATE.phylo.numTaxa,length:STATE.phylo.length},
    orf:{minLength:STATE.orf.minLength},
    gc:{windowSize:STATE.gc.windowSize,step:STATE.gc.step},
    restriction:{activeEnzymes:STATE.restriction.activeEnzymes}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='genoma-config.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Config exported','success');
}
function showHelp(){
  openModal('❓ GENOMA — Help',
    '<div class="sec"><h4>🧬 About</h4><div class="text-xs" style="line-height:1.75;color:var(--tx2);font-family:var(--mono)">A bioinformatics workbench with real sequence algorithms — Needleman-Wunsch, Smith-Waterman, UPGMA phylogeny, ORF detection, GC analysis, restriction digests, and Chou-Fasman secondary structure prediction.</div></div>'+
    '<div class="sec"><h4>📚 Modules</h4><div class="text-xs" style="line-height:1.85;color:var(--tx2);font-family:var(--mono)">'+
    '<b class="text-c1">🧬 DNA Viewer</b> — sequence + translation + complement<br>'+
    '<b class="text-c1">⚖️ Alignment</b> — global (NW) and local (SW) DP<br>'+
    '<b class="text-c1">🌲 Phylogeny</b> — UPGMA with Jukes-Cantor<br>'+
    '<b class="text-c1">🎯 ORF Finder</b> — 6-frame open reading frame scan<br>'+
    '<b class="text-c1">📊 GC Analysis</b> — sliding window GC profile<br>'+
    '<b class="text-c1">✂️ Restriction</b> — enzyme cut site mapping<br>'+
    '<b class="text-c1">🥚 Protein</b> — translation, pI, secondary structure'+
    '</div></div>'+
    '<div class="sec"><h4>⌨️ Shortcuts</h4><div class="text-xs" style="font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+
    '<b class="text-c1">1-7</b> — Jump to module<br>'+
    '<b class="text-c1">T</b> — Cycle theme<br>'+
    '<b class="text-c1">?</b> — This help'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key>='1'&&e.key<='7'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Loading genetic code (64 codons)...',
  'Compiling amino acid property tables...',
  'Warming up Smith-Waterman aligner...',
  'Building UPGMA distance matrices...',
  'Preparing restriction enzyme database...',
  'Loading Chou-Fasman propensities...',
  'Calculating Jukes-Cantor corrections...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('GENOMA ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('GENOMA initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});

console.log('%c GENOMA ','background:linear-gradient(90deg,#40ff90,#40d0ff);color:#04080f;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('%cBioinformatics Studio','color:#40ff90;font-weight:600');
console.log('%cDNA · Alignment · Phylogeny · ORF · GC · Restriction · Protein','color:#40d0ff');
console.log('%cPress ? for help','color:#90a8d0');
</script>
</body></html>
