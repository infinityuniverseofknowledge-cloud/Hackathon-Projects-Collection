<!DOCTYPE html>
<html lang="en" data-theme="helix">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GENOMA — Bioinformatics Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#04080f;--bg2:#080f18;--bg3:#0c1828;--bg4:#142438;
  --panel:#080f18;--panel2:#0c1828;--panel3:#142438;--panel4:#1e3450;
  --bd:#182c48;--bd2:#284868;--bd3:#3a6a98;
  --tx:#e0ecff;--tx2:#90a8d0;--tx3:#587890;--mu:#384870;
  --c1:#40ff90;--c1h:#80ffc0;--c1l:#20c060;
  --c2:#40d0ff;--c2h:#80e0ff;--c2l:#20a0c0;
  --c3:#ffe040;--c3h:#fff080;--c3l:#c0a020;
  --c4:#ff5060;--c4h:#ff90a0;--c4l:#c03040;
  --c5:#ff9040;--c5h:#ffb080;--c5l:#c06020;
  --c6:#a060ff;--c6h:#c090ff;--c6l:#7030c0;
  --c7:#40ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff40a0;--c8h:#ff80c0;--c8l:#c02070;
  --ok:#40ff90;--warn:#ffe040;--err:#ff5060;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40ff90,#40d0ff);
  --g2:linear-gradient(135deg,#ffe040,#ff9040);
  --gHolo:linear-gradient(120deg,#40ff90,#40d0ff,#ffe040,#ff9040,#a060ff,#40ff90);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.75);
  --sh2:0 16px 48px rgba(0,0,0,.95);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f8f5ea;--bg2:#f0ead8;--bg3:#e0d8c0;--panel:#fff;--panel2:#f8f5ea;--panel3:#f0ead8;--panel4:#e0d8c0;
  --bd:#c8bca0;--bd2:#a09080;--tx:#0a1810;--tx2:#405040;--tx3:#708070;
  --c1:#008040;--c2:#0060c0;--c3:#c08000;--c4:#c00040;--c6:#6020c0;
  --g1:linear-gradient(135deg,#008040,#0060c0)}
[data-theme="violet"]{--bg:#0a0418;--bg2:#140830;--bg3:#201048;--panel:#140830;--panel2:#201048;
  --bd:#3c2070;--bd2:#5c30a0;--tx:#e8d8ff;--tx2:#a890d8;--tx3:#6850a0;
  --c1:#c060ff;--c2:#40d0ff;--c3:#ffe040;--c4:#ff4080;
  --g1:linear-gradient(135deg,#c060ff,#40d0ff)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#04080f;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-dna{width:180px;height:240px;margin-bottom:20px}
.boot-dna svg{width:100%;height:100%}
.boot-dna .rail{stroke:#40ff90;stroke-width:3;fill:none}
.boot-dna .rail2{stroke:#40d0ff}
.boot-dna .rung{stroke:rgba(255,255,255,.5);stroke-width:2;animation:pulse-rung 2s ease-in-out infinite}
.boot-dna .rung:nth-child(odd){animation-delay:.3s}
.boot-dna .rung:nth-child(even){animation-delay:.6s}
@keyframes pulse-rung{0%,100%{opacity:.3}50%{opacity:1}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#40ff90;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#142438;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40ff90}
.boot-pct{font-size:.7rem;color:#40ff90;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#587890;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#04080f;box-shadow:0 0 14px rgba(64,255,144,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#142438;transition:var(--t1)}
.tb-status .dot.on{background:var(--c1);box-shadow:0 0 10px var(--c1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:300px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#020608;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(8,15,24,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,255,144,.15)}
.ctrl textarea{resize:vertical;min-height:100px;line-height:1.6;font-size:.65rem;letter-spacing:1px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#04080f;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(64,255,144,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#04080f;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* DNA VIEWER */
.dna-view{font-family:var(--mono);font-size:.72rem;line-height:1.7;letter-spacing:2px;word-break:break-all;user-select:text}
.dna-view .A{color:#40ff90}
.dna-view .T{color:#ff5060}
.dna-view .G{color:#40d0ff}
.dna-view .C{color:#ffe040}
.dna-view .U{color:#a060ff}
.dna-view .N{color:#808080}
.dna-row{display:flex;align-items:center;padding:2px 0;font-family:var(--mono);font-size:.68rem;line-height:1.4}
.dna-pos{color:var(--tx3);min-width:50px;text-align:right;padding-right:8px;font-size:.6rem}
.dna-seq{flex:1;letter-spacing:2px;word-break:break-all}
.dna-seq .A{color:#40ff90}
.dna-seq .T{color:#ff5060}
.dna-seq .G{color:#40d0ff}
.dna-seq .C{color:#ffe040}
.dna-seq .U{color:#a060ff}

/* ALIGNMENT GRID */
.align-grid{font-family:var(--mono);font-size:.62rem;overflow-x:auto;padding:8px;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd);line-height:1.4}
.align-row{display:flex;align-items:center;gap:1px;margin-bottom:1px}
.align-cell{width:14px;height:16px;text-align:center;line-height:16px;border-radius:2px;transition:var(--t1)}
.align-cell.match{background:rgba(64,255,144,.25);color:#80ffc0}
.align-cell.mismatch{background:rgba(255,80,96,.25);color:#ff90a0}
.align-cell.gap{background:rgba(128,128,128,.15);color:#808080}
.align-cell.label{width:30px;text-align:right;color:var(--c2);font-weight:700}

/* GC CHART */
.gc-chart{width:100%;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd);margin-bottom:10px;display:block}

/* TREE */
.tree-canvas{width:100%;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd);display:block}

/* PROTEIN */
.protein-seq{font-family:var(--mono);font-size:.7rem;line-height:1.8;letter-spacing:1.5px;word-break:break-all;user-select:text}
.protein-seq .polar{color:#40d0ff}
.protein-seq .nonpolar{color:#40ff90}
.protein-seq .positive{color:#ff5060}
.protein-seq .negative{color:#ffe040}
.protein-seq .special{color:#a060ff}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c1)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-dna">
    <svg viewBox="0 0 180 240">
      <g>
        <path class="rail" d="M30,10 Q90,60 30,120 Q-30,180 30,230"/>
        <path class="rail rail2" d="M150,10 Q90,60 150,120 Q210,180 150,230"/>
      </g>
      <line class="rung" x1="45" y1="30" x2="135" y2="30"/>
      <line class="rung" x1="55" y1="60" x2="125" y2="60"/>
      <line class="rung" x1="65" y1="90" x2="115" y2="90"/>
      <line class="rung" x1="60" y1="120" x2="120" y2="120"/>
      <line class="rung" x1="65" y1="150" x2="115" y2="150"/>
      <line class="rung" x1="55" y1="180" x2="125" y2="180"/>
      <line class="rung" x1="45" y1="210" x2="135" y2="210"/>
    </svg>
  </div>
  <div class="boot-logo">GENOMA</div>
  <div class="boot-sub">BIOINFORMATICS STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('dna')">GENOMA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Length</span><span class="sb-val c2" id="sbLen">0 bp</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">GC</span><span class="sb-val c3" id="sbGC">—</span></div>

/* ================================================================
   SEQUENCE UTILITIES
   ================================================================ */
function cleanDNA(seq){return seq.toUpperCase().replace(/[^ATGCU]/g,'').replace(/U/g,'T')}
function cleanRNA(seq){return seq.toUpperCase().replace(/[^ATGCU]/g,'').replace(/T/g,'U')}
function cleanProtein(seq){return seq.toUpperCase().replace(/[^ACDEFGHIKLMNPQRSTVWY]/g,'')}

function complement(seq){
  var map={A:'T',T:'A',G:'C',C:'G',N:'N',U:'A'};
  var out='';
  for(var i=0;i<seq.length;i++)out+=map[seq[i]]||'N';
  return out;
}
function reverseComplement(seq){
  return complement(seq).split('').reverse().join('');
}
function transcribe(seq){return cleanDNA(seq).replace(/T/g,'U')}
function translate(seq,frame){
  frame=frame||0;
  var dna=cleanDNA(seq);
  var protein='';
  for(var i=frame;i+2<dna.length;i+=3){
    var codon=dna.substring(i,i+3);
    protein+=CODON_TABLE[codon]||'X';
  }
  return protein;
}
function gcContent(seq){
  var dna=cleanDNA(seq);
  if(!dna.length)return 0;
  var gc=0;
  for(var i=0;i<dna.length;i++){
    if(dna[i]==='G'||dna[i]==='C')gc++;
  }
  return gc/dna.length;
}
function meltingTemp(seq){
  /* Wallace rule for short seqs, salt-adjusted for long */
  var dna=cleanDNA(seq);
  var len=dna.length;
  if(len<14){
    var at=0,gc=0;
    for(var i=0;i<len;i++){
      if(dna[i]==='A'||dna[i]==='T')at++;
      else gc++;
    }
    return 2*at+4*gc;
  }
  var gcFrac=gcContent(dna);
  return 64.9+41*(gcFrac*len-16.4)/len;
}
function molecularWeight(seq){
  /* Average nucleotide MW ~330 Da per bp */
  return cleanDNA(seq).length*330;
}
function nucleotideCounts(seq){
  var dna=cleanDNA(seq);
  var c={A:0,T:0,G:0,C:0};
  for(var i=0;i<dna.length;i++)c[dna[i]]=(c[dna[i]]||0)+1;
  return c;
}

/* Random sequence generator */
function randomDNA(len){
  var bases='ATGC';
  var out='';
  for(var i=0;i<len;i++)out+=bases[rnd(0,3)];
  return out;
}

/* ================================================================
   SEQUENCE ALIGNMENT (Needleman-Wunsch / Smith-Waterman)
   ================================================================ */
function needlemanWunsch(seqA,seqB,matchScore,mismatchScore,gapScore){
  matchScore=matchScore!=null?matchScore:2;
  mismatchScore=mismatchScore!=null?mismatchScore:-1;
  gapScore=gapScore!=null?gapScore:-2;
  var n=seqA.length,m=seqB.length;
  /* F matrix */
  var F=[];
  for(var i=0;i<=n;i++){
    F.push(new Array(m+1));
    F[i][0]=i*gapScore;
  }
  for(var j=0;j<=m;j++)F[0][j]=j*gapScore;
  for(var i2=1;i2<=n;i2++){
    for(var j2=1;j2<=m;j2++){
      var match=F[i2-1][j2-1]+(seqA[i2-1]===seqB[j2-1]?matchScore:mismatchScore);
      var del=F[i2-1][j2]+gapScore;
      var ins=F[i2][j2-1]+gapScore;
      F[i2][j2]=Math.max(match,del,ins);
    }
  }
  /* Traceback */
  var alignA='',alignB='',matchLine='';
  var i3=n,j3=m;
  while(i3>0||j3>0){
    if(i3>0&&j3>0&&F[i3][j3]===F[i3-1][j3-1]+(seqA[i3-1]===seqB[j3-1]?matchScore:mismatchScore)){
      alignA=seqA[i3-1]+alignA;
      alignB=seqB[j3-1]+alignB;
      matchLine=(seqA[i3-1]===seqB[j3-1]?'|':' ')+matchLine;
      i3--;j3--;
    } else if(i3>0&&F[i3][j3]===F[i3-1][j3]+gapScore){
      alignA=seqA[i3-1]+alignA;
      alignB='-'+alignB;
      matchLine=' '+matchLine;
      i3--;
    } else {
      alignA='-'+alignA;
      alignB=seqB[j3-1]+alignB;
      matchLine=' '+matchLine;
      j3--;
    }
  }
  var identity=0;
  for(var k=0;k<matchLine.length;k++)if(matchLine[k]==='|')identity++;
  return {
    score:F[n][m],
    alignedA:alignA,
    alignedB:alignB,
    matchLine:matchLine,
    identity:identity,
    length:alignA.length,
    identityPct:matchLine.length?identity/matchLine.length:0,
    matrix:F
  };
}
function smithWaterman(seqA,seqB,matchScore,mismatchScore,gapScore){
  matchScore=matchScore!=null?matchScore:2;
  mismatchScore=mismatchScore!=null?mismatchScore:-1;
  gapScore=gapScore!=null?gapScore:-2;
  var n=seqA.length,m=seqB.length;
  var H=[];
  for(var i=0;i<=n;i++){
    H.push(new Array(m+1).fill(0));
  }
  var maxScore=0,maxI=0,maxJ=0;
  for(var i2=1;i2<=n;i2++){
    for(var j2=1;j2<=m;j2++){
      var match=H[i2-1][j2-1]+(seqA[i2-1]===seqB[j2-1]?matchScore:mismatchScore);
      var del=H[i2-1][j2]+gapScore;
      var ins=H[i2][j2-1]+gapScore;
      H[i2][j2]=Math.max(0,match,del,ins);
      if(H[i2][j2]>maxScore){
        maxScore=H[i2][j2];maxI=i2;maxJ=j2;
      }
    }
  }
  /* Traceback from max */
  var alignA='',alignB='',matchLine='';
  var i3=maxI,j3=maxJ;
  while(i3>0&&j3>0&&H[i3][j3]>0){
    if(H[i3][j3]===H[i3-1][j3-1]+(seqA[i3-1]===seqB[j3-1]?matchScore:mismatchScore)){
      alignA=seqA[i3-1]+alignA;
      alignB=seqB[j3-1]+alignB;
      matchLine=(seqA[i3-1]===seqB[j3-1]?'|':' ')+matchLine;
      i3--;j3--;
    } else if(H[i3][j3]===H[i3-1][j3]+gapScore){
      alignA=seqA[i3-1]+alignA;
      alignB='-'+alignB;
      matchLine=' '+matchLine;
      i3--;
    } else {
      alignA='-'+alignA;
      alignB=seqB[j3-1]+alignB;
      matchLine=' '+matchLine;
      j3--;
    }
  }
  var identity=0;
  for(var k=0;k<matchLine.length;k++)if(matchLine[k]==='|')identity++;
  return {
    score:maxScore,
    alignedA:alignA,
    alignedB:alignB,
    matchLine:matchLine,
    identity:identity,
    length:alignA.length,
    identityPct:matchLine.length?identity/matchLine.length:0,
    startA:maxI-alignA.length,
    startB:maxJ-alignB.length,
    matrix:H
  };
}

/* ================================================================
   UPGMA PHYLOGENETIC TREE
   ================================================================ */
function hammingDistance(a,b){
  var len=Math.min(a.length,b.length);
  var d=0;
  for(var i=0;i<len;i++)if(a[i]!==b[i])d++;
  return d+Math.abs(a.length-b.length);
}
function jukesCantor(p){
  /* Jukes-Cantor correction */
  if(p>=0.75)return 3;
  return -0.75*Math.log(1-4*p/3);
}
function upgma(sequences,names){
  var n=sequences.length;
  /* Distance matrix (Jukes-Cantor corrected) */
  var D=[];
  for(var i=0;i<n;i++){
    D.push(new Array(n).fill(0));
  }
  for(var i2=0;i2<n;i2++){
    for(var j2=i2+1;j2<n;j2++){
      var raw=hammingDistance(sequences[i2],sequences[j2])/Math.max(1,sequences[i2].length);
      D[i2][j2]=jukesCantor(raw);
      D[j2][i2]=D[i2][j2];
    }
  }
  /* Build tree bottom-up */
  var clusters=[];
  for(var i3=0;i3<n;i3++){
    clusters.push({
      id:i3,
      name:names[i3],
      seq:sequences[i3],
      height:0,
      left:null,
      right:null,
      size:1,
      members:[i3]
    });
  }
  var dMatrix=D.map(function(row){return row.slice()});
  var activeClusters=clusters.map(function(_,i){return i});
  var clusterMap={};
  clusters.forEach(function(c,i){clusterMap[i]=c});
  var nextId=n;
  var mergeHistory=[];
  while(activeClusters.length>1){
    /* Find minimum distance pair */
    var minD=Infinity,minI=-1,minJ=-1;
    for(var a=0;a<activeClusters.length;a++){
      for(var b=a+1;b<activeClusters.length;b++){
        var ci=activeClusters[a],cj=activeClusters[b];
        if(dMatrix[ci][cj]<minD){
          minD=dMatrix[ci][cj];minI=ci;minJ=cj;
        }
      }
    }
    /* Merge */
    var newCluster={
      id:nextId,
      name:null,
      height:minD/2,
      left:clusterMap[minI],
      right:clusterMap[minJ],
      size:clusterMap[minI].size+clusterMap[minJ].size,
      members:clusterMap[minI].members.concat(clusterMap[minJ].members)
    };
    mergeHistory.push({
      left:clusterMap[minI],
      right:clusterMap[minJ],
      dist:minD,
      newCluster:newCluster
    });
    /* Update distance matrix (UPGMA: average) */
    /* Add new column/row */
    var newRow=D.length;
    for(var k=0;k<D.length;k++){
      D[k].push(0);
    }
    D.push(new Array(D.length+1).fill(0));
    /* Compute average distances */
    for(var m=0;m<activeClusters.length;m++){
      var other=activeClusters[m];
      if(other===minI||other===minJ)continue;
      var distAvg=(dMatrix[minI][other]*clusterMap[minI].size+dMatrix[minJ][other]*clusterMap[minJ].size)/newCluster.size;
      D[nextId][other]=distAvg;
      D[other][nextId]=distAvg;
    }
    clusterMap[nextId]=newCluster;
    /* Remove merged clusters from active list */
    activeClusters=activeClusters.filter(function(x){return x!==minI&&x!==minJ});
    activeClusters.push(nextId);
    nextId++;
  }
  return {
    root:clusterMap[activeClusters[0]],
    distanceMatrix:D,
    initialMatrix:D.slice(0,n).map(function(r){return r.slice(0,n)}),
    merges:mergeHistory,
    names:names
  };
}

/* ================================================================
   ORF FINDER
   ================================================================ */
function findORFs(seq,minLength,frame){
  minLength=minLength||100;
  var dna=cleanDNA(seq);
  var orfs=[];
  var frames=frame===undefined?[0,1,2,-1,-2,-3]:[frame];
  frames.forEach(function(f){
    var strand=dna;
    var offset=0;
    var strandSign=1;
    if(f<0){
      strand=reverseComplement(dna);
      offset=Math.abs(f)-1;
      strandSign=-1;
    } else {
      offset=f;
    }
    var inORF=false,start=0;
    for(var i=offset;i+2<strand.length;i+=3){
      var codon=strand.substring(i,i+3);
      if(!inORF&&codon==='ATG'){
        inORF=true;start=i;
      } else if(inORF&&(codon==='TAA'||codon==='TAG'||codon==='TGA')){
        var length=i+3-start;
        if(length>=minLength){
          orfs.push({
            start:strandSign>0?start:strand.length-i-3,
            end:strandSign>0?i+3:strand.length-start,
            length:length,
            frame:f,
            strand:strandSign>0?'+':'-',
            sequence:strand.substring(start,i+3),
            protein:translate(strand.substring(start,i+3))
          });
        }
        inORF=false;
      }
    }
  });
  return orfs;
}

   ================================================================ */
var RESTRICTION_ENZYMES=[
  {name:'EcoRI',site:'GAATTC',cut:1,type:'sticky'},
  {name:'BamHI',site:'GGATCC',cut:1,type:'sticky'},
  {name:'HindIII',site:'AAGCTT',cut:1,type:'sticky'},
  {name:'XhoI',site:'CTCGAG',cut:1,type:'sticky'},
  {name:'SalI',site:'GTCGAC',cut:1,type:'sticky'},
  {name:'PstI',site:'CTGCAG',cut:1,type:'sticky'},
  {name:'KpnI',site:'GGTACC',cut:1,type:'sticky'},
  {name:'SacI',site:'GAGCTC',cut:1,type:'sticky'},
  {name:'SmaI',site:'CCCGGG',cut:3,type:'blunt'},
  {name:'HaeIII',site:'GGCC',cut:2,type:'blunt'},
  {name:'AluI',site:'AGCT',cut:2,type:'blunt'},
  {name:'TaqI',site:'TCGA',cut:1,type:'sticky'},
  {name:'NotI',site:'GCGGCCGC',cut:2,type:'sticky'},
  {name:'SphI',site:'GCATGC',cut:5,type:'sticky'}
];
function findRestrictionSites(seq,enzymes){
  var dna=cleanDNA(seq);
  var sites=[];
  enzymes.forEach(function(enzyme){
    var site=enzyme.site;
    var len=site.length;
    /* Forward */
    for(var i=0;i+len<=dna.length;i++){
      if(dna.substring(i,i+len)===site){
        sites.push({
          enzyme:enzyme.name,
          position:i,
          cutPos:i+enzyme.cut,
          strand:'+',
          site:site,
          type:enzyme.type
        });
      }
    }
    /* Reverse (only for palindromic check — most RE sites are palindromic but let's handle both) */
    var rc=reverseComplement(site);
    if(rc!==site){
      for(var j=0;j+len<=dna.length;j++){
        if(dna.substring(j,j+len)===rc){
          sites.push({
            enzyme:enzyme.name,
            position:j,
            cutPos:j+len-enzyme.cut,
            strand:'-',
            site:site,
            type:enzyme.type
          });
        }
      }
    }
  });
  sites.sort(function(a,b){return a.cutPos-b.cutPos});
  return sites;
}

/* ================================================================
   PROTEIN SECONDARY STRUCTURE (Chou-Fasman heuristic)
   ================================================================ */
var HELIX_PROP={'A':1.42,'R':0.98,'N':0.67,'D':1.01,'C':0.70,'E':1.51,'Q':1.11,'G':0.57,'H':1.00,'I':1.08,'L':1.21,'K':1.16,'M':1.45,'F':1.13,'P':0.57,'S':0.77,'T':0.83,'W':1.08,'Y':0.69,'V':1.06};
var SHEET_PROP={'A':0.83,'R':0.93,'N':0.89,'D':0.54,'C':1.19,'E':0.37,'Q':1.10,'G':0.75,'H':0.87,'I':1.60,'L':1.30,'K':0.74,'M':1.05,'F':1.38,'P':0.55,'S':0.75,'T':1.19,'W':1.37,'Y':1.47,'V':1.70};
function predictSecondaryStructure(protein){
  var structure='';
  for(var i=0;i<protein.length;i++){
    var aa=protein[i];
    var h=HELIX_PROP[aa]||1;
    var s=SHEET_PROP[aa]||1;
    if(h>1.05&&h>s)structure+='H';
    else if(s>1.05&&s>h)structure+='E';
    else structure+='-';
  }
  return structure;
}
function isoelectricPoint(protein){
  /* Simplified pI estimation */
  var counts={D:0,E:0,C:0,Y:0,H:0,K:0,R:0};
  for(var i=0;i<protein.length;i++)if(counts[protein[i]]!==undefined)counts[protein[i]]++;
  var pKa={D:3.9,E:4.3,C:8.3,Y:10.1,H:6.0,K:10.5,R:12.5};
  for(var pH=0;pH<=14;pH+=0.1){
    var charge=0;
    charge+=counts.D*(-1/(1+Math.pow(10,pKa.D-pH)));
    charge+=counts.E*(-1/(1+Math.pow(10,pKa.E-pH)));
    charge+=counts.C*(-1/(1+Math.pow(10,pKa.C-pH)));
    charge+=counts.Y*(-1/(1+Math.pow(10,pKa.Y-pH)));
    charge+=counts.H*(1/(1+Math.pow(10,pH-pKa.H)));
    charge+=counts.K*(1/(1+Math.pow(10,pH-pKa.K)));
    charge+=counts.R*(1/(1+Math.pow(10,pH-pKa.R)));
    if(charge<0)return pH;
  }
  return 7;
}
function proteinMW(protein){
  var total=0;
  for(var i=0;i<protein.length;i++){
    total+=(AA_INFO[protein[i]]?AA_INFO[protein[i]].mw:110);
  }
  total-=protein.length*18.015;/* Water loss per peptide bond */
  return total;
}

registerModule('align',{
  title:'Sequence Alignment',
  icon:'⚖️',
  desc:'Needleman-Wunsch (global) and Smith-Waterman (local) alignment with traceback matrices.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var a=STATE.align;
    var seqA=cleanDNA(a.seqA).substring(0,80);
    var seqB=cleanDNA(a.seqB).substring(0,80);
    if(!seqA||!seqB)return;
    a.result=a.mode==='global'?
      needlemanWunsch(seqA,seqB,a.match,a.mismatch,a.gap):
      smithWaterman(seqA,seqB,a.match,a.mismatch,a.gap);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var a=STATE.align;
    if(!a.result){
      ctx.fillStyle='#587890';
      ctx.font='14px monospace';
      ctx.textAlign='center';
      ctx.fillText('Enter two sequences',W/2,H/2);
      return;
    }
    /* Header */
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('⚖️ '+(a.mode==='global'?'NEEDLEMAN-WUNSCH (Global)':'SMITH-WATERMAN (Local)'),20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText('Score: '+a.result.score+' | Identity: '+a.result.identity+'/'+a.result.length+' ('+fmt(a.result.identityPct*100,1)+'%)',20,44);
    /* Aligned sequences with highlighting */
    var startY=70;
    var rowH=22;
    var charW=12;
    var maxChars=Math.floor((W-100)/charW);
    var alignedA=a.result.alignedA;
    var alignedB=a.result.alignedB;
    var matchLine=a.result.matchLine;
    for(var chunk=0;chunk*maxChars<alignedA.length;chunk++){
      var y=startY+chunk*(rowH*3+20);
      if(y>H-60)break;
      var start=chunk*maxChars;
      var end=Math.min(start+maxChars,alignedA.length);
      /* Seq A */
      ctx.fillStyle='#587890';
      ctx.font='10px monospace';
      ctx.textAlign='right';
      ctx.fillText('Seq A',80,y+13);
      for(var i=start;i<end;i++){
        var c=alignedA[i];
        var col=c==='A'?'#40ff90':c==='T'?'#ff5060':c==='G'?'#40d0ff':c==='C'?'#ffe040':c==='-'?'#505050':'#808080';
        ctx.fillStyle=col;
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.fillText(c,90+(i-start)*charW+charW/2,y+13);
      }
      /* Match line */
      for(var j=start;j<end;j++){
        var m=matchLine[j];
        ctx.fillStyle=m==='|'?'#40ff90':'#505050';
        ctx.font='bold 11px monospace';
        ctx.textAlign='center';
        ctx.fillText(m==='|'?'│':'·',90+(j-start)*charW+charW/2,y+30);
      }
      /* Seq B */
      ctx.fillStyle='#587890';
      ctx.font='10px monospace';
      ctx.textAlign='right';
      ctx.fillText('Seq B',80,y+47);
      for(var k=start;k<end;k++){
        var c2=alignedB[k];
        var col2=c2==='A'?'#40ff90':c2==='T'?'#ff5060':c2==='G'?'#40d0ff':c2==='C'?'#ffe040':c2==='-'?'#505050':'#808080';
        ctx.fillStyle=col2;
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.fillText(c2,90+(k-start)*charW+charW/2,y+47);
      }
    }
    /* Statistics */
    var statY=H-160;
    ctx.fillStyle='rgba(12,24,40,.6)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(20,statY,W-40,140,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('ALIGNMENT STATISTICS',32,statY+20);
    ctx.font='11px monospace';
    ctx.fillStyle='#c8d8e8';
    ctx.fillText('Score:',32,statY+44);
    ctx.fillStyle='#40ff90';
    ctx.font='bold 14px monospace';
    ctx.fillText(a.result.score,120,statY+44);
    ctx.fillStyle='#c8d8e8';
    ctx.font='11px monospace';
    ctx.fillText('Alignment length:',32,statY+66);
    ctx.fillStyle='#40d0ff';
    ctx.fillText(a.result.length+' bp',180,statY+66);
    ctx.fillStyle='#c8d8e8';
    ctx.fillText('Identities:',32,statY+88);
    ctx.fillStyle='#40ff90';
    ctx.fillText(a.result.identity+' matches',180,statY+88);
    ctx.fillStyle='#c8d8e8';
    ctx.fillText('Identity %:',32,statY+110);
    ctx.fillStyle=a.result.identityPct>0.9?'#40ff90':a.result.identityPct>0.7?'#ffe040':'#ff5060';
    ctx.font='bold 14px monospace';
    ctx.fillText(fmt(a.result.identityPct*100,1)+'%',180,statY+110);
    /* Scoring params */
    ctx.font='10px monospace';
    ctx.fillStyle='#587890';
    ctx.textAlign='right';
    ctx.fillText('Match: +'+a.match, W-32, statY+44);
    ctx.fillText('Mismatch: '+a.mismatch, W-32, statY+62);
    ctx.fillText('Gap: '+a.gap, W-32, statY+80);
    setStatsHTML(
      '<div>Score: '+a.result.score+'</div>'+
      '<div>Identity: '+fmt(a.result.identityPct*100,1)+'%</div>'+
      '<div>Length: '+a.result.length+'</div>'
    );
    updateBadge('⚖️ Alignment · '+a.mode+' · score '+a.result.score);
    $('sbMode').textContent='Alignment';
  },
  onDown:function(){},
  controls:function(){
    var a=STATE.align;
    var html='';
    html+='<div class="sec"><h4>Mode</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(a.mode==='global'?'active':'')+'" onclick="STATE.align.mode=\'global\';MODULES.align.compute();renderLeftPanel()">🌐 Global (NW)</div>';
    html+='<div class="chip '+(a.mode==='local'?'active':'')+'" onclick="STATE.align.mode=\'local\';MODULES.align.compute();renderLeftPanel()">📍 Local (SW)</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Sequence A</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.align.seqA=this.value;MODULES.align.compute()">'+esc(a.seqA)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Sequence B</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.align.seqB=this.value;MODULES.align.compute()">'+esc(a.seqB)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Scoring</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Match</span><span>'+a.match+'</span></div>';
    html+='<input type="range" min="1" max="5" step="1" value="'+a.match+'" oninput="STATE.align.match=parseInt(this.value);MODULES.align.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Mismatch</span><span>'+a.mismatch+'</span></div>';
    html+='<input type="range" min="-5" max="0" step="1" value="'+a.mismatch+'" oninput="STATE.align.mismatch=parseInt(this.value);MODULES.align.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Gap penalty</span><span>'+a.gap+'</span></div>';
    html+='<input type="range" min="-5" max="0" step="1" value="'+a.gap+'" oninput="STATE.align.gap=parseInt(this.value);MODULES.align.compute();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Test Cases</h4>';
    html+='<button class="btn full sm" onclick="alignIdentical()">Identical sequences</button>';

    html+='<button class="btn full sm" style="margin-top:4px" onclick="alignDeletion()">Deletion</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="alignRandom()">🎲 Random pair</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var a=STATE.align;
    if(!a.result)return '<div class="empty">No alignment</div>';
    return '<div class="sec"><h4>Needleman-Wunsch</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Dynamic programming recurrence:<br><br>'+
      'F(i,j) = max of:<br>'+
      '&nbsp;&nbsp;F(i−1,j−1) + s(aᵢ,bⱼ)  (diagonal)<br>'+
      '&nbsp;&nbsp;F(i−1,j) + gap  (up)<br>'+
      '&nbsp;&nbsp;F(i,j−1) + gap  (left)<br><br>'+
      'F(0,0)=0, F(i,0)=i·gap, F(0,j)=j·gap'+
      '</div></div>'+
      '<div class="sec"><h4>Smith-Waterman</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Same recurrence but with floor at 0:<br><br>'+
      'H(i,j) = max(0, diag, up, left)<br><br>'+
      'Start traceback from max cell. Finds best local substring alignment.'+
      '</div></div>'+
      '<div class="sec"><h4>Results</h4><div class="kv">'+
      '<div class="row"><span class="k">Score</span><span class="v">'+a.result.score+'</span></div>'+
      '<div class="row"><span class="k">Identity</span><span class="v">'+fmt(a.result.identityPct*100,1)+'%</span></div>'+
      '<div class="row"><span class="k">Length</span><span class="v">'+a.result.length+'</span></div>'+
      '</div></div>';
  }
});
function alignIdentical(){
  var s=randomDNA(60);
  STATE.align.seqA=s;STATE.align.seqB=s;
  MODULES.align.compute();renderLeftPanel();
}
function alignOneMutation(){
  var s=randomDNA(60);
  var pos=rnd(20,40);
  var mut=s.substring(0,pos)+(s[pos]==='A'?'T':'A')+s.substring(pos+1);
  STATE.align.seqA=s;STATE.align.seqB=mut;
  MODULES.align.compute();renderLeftPanel();
}
function alignInsertion(){
  var s=randomDNA(60);
  var pos=rnd(25,35);
  var ins=s.substring(0,pos)+randomDNA(5)+s.substring(pos);
  STATE.align.seqA=s;STATE.align.seqB=ins;
  MODULES.align.compute();renderLeftPanel();
}
function alignDeletion(){
  var s=randomDNA(65);
  var pos=rnd(25,35);
  var del=s.substring(0,pos)+s.substring(pos+5);
  STATE.align.seqA=s;STATE.align.seqB=del;
  MODULES.align.compute();renderLeftPanel();
}
function alignRandom(){
  STATE.align.seqA=randomDNA(60);
  STATE.align.seqB=randomDNA(60);
  MODULES.align.compute();renderLeftPanel();
}

/* ================================================================
   MODULE: PHYLOGENETIC TREE
   ================================================================ */
registerModule('phylo',{
  title:'Phylogenetic Tree',
  icon:'🌲',
  desc:'UPGMA hierarchical clustering with Jukes-Cantor distance correction. Builds a tree from sequence data.',
  init:function(){
    this.generate();
  },
  generate:function(){
    var p=STATE.phylo;
    p.sequences=[];
    p.names=[];
    /* Create a base sequence, then mutate to form a tree-like structure */
    var base=randomDNA(p.length);
    for(var i=0;i<p.numTaxa;i++){
      var seq=base.split('');
      var rate=0.05+i*0.03;
      for(var j=0;j<seq.length;j++){
        if(Math.random()<rate)seq[j]=['A','T','G','C'][rnd(0,3)];
      }
      p.sequences.push(seq.join(''));
      p.names.push('Taxon_'+String.fromCharCode(65+i));
    }
    p.result=upgma(p.sequences,p.names);
    logMsg('UPGMA: '+p.numTaxa+' taxa','info');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var p=STATE.phylo;
    /* Header */
    ctx.fillStyle='#a060ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('🌲 PHYLOGENETIC TREE — UPGMA',20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText(p.numTaxa+' taxa | '+p.length+' bp | Jukes-Cantor corrected distances',20,44);
    if(!p.result)return;
    /* Draw tree */
    this.drawTree(ctx,p.result.root,50,H-60,30,W-150);
    setStatsHTML(
      '<div>Taxa: '+p.numTaxa+'</div>'+
      '<div>Length: '+p.length+' bp</div>'+
      '<div>Merges: '+p.result.merges.length+'</div>'
    );
    updateBadge('🌲 UPGMA · '+p.numTaxa+' taxa');
    $('sbMode').textContent='Phylogeny';
  },
  drawTree:function(ctx,node,left,right,xScale,maxX){
    /* Compute leaf y positions */
    var leaves=[];
    function collect(n,depth){
      if(!n.left&&!n.right){
        leaves.push({node:n,depth:depth,y:0});
        return;
      }
      collect(n.left,depth+1);
      collect(n.right,depth+1);
    }
    collect(node,0);
    /* Assign y positions */
    var spacing=(right-left)/Math.max(1,leaves.length-1);
    leaves.forEach(function(l,i){l.y=left+i*spacing;});
    /* Collect all nodes with computed y and x */
    var xMin=0,xMax=node.height||1;
    function computePos(n){
      if(!n.left&&!n.right){
        var leaf=leaves.find(function(l){return l.node===n;});
        n._y=leaf.y;
        n._x=xScale+(n.height/xMax)*(maxX-xScale);
        return;
      }
      computePos(n.left);
      computePos(n.right);
      n._y=(n.left._y+n.right._y)/2;
      n._x=xScale+(n.height/xMax)*(maxX-xScale);
    }
    computePos(node);
    /* Draw edges */
    function drawNode(n){
      if(n.left&&n.right){
        var yL=n.left._y,yR=n.right._y;
        var xL=n.left._x,xR=n.right._x;
        ctx.strokeStyle='#40ff90';
        ctx.lineWidth=2;
        /* Horizontal to each child */
        ctx.beginPath();
        ctx.moveTo(n._x,n._y);
        ctx.lineTo(xL,yL);
        ctx.moveTo(n._x,n._y);
        ctx.lineTo(xR,yR);
        ctx.stroke();
        /* Vertical connector */
        ctx.beginPath();
        ctx.moveTo(n._x,yL);
        ctx.lineTo(n._x,yR);
        ctx.stroke();
        drawNode(n.left);
        drawNode(n.right);
      }
    }
    drawNode(node);
    /* Draw leaves */
    leaves.forEach(function(l){
      ctx.fillStyle='#40d0ff';
      ctx.beginPath();
      ctx.arc(l.node._x,l.y,4,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#e0ecff';
      ctx.font='11px monospace';
      ctx.textAlign='left';
      ctx.fillText(l.node.name,l.node._x+8,l.y+4);
    });
    /* Scale bar */
    var sx=maxX-100,sy=H-30;
    ctx.strokeStyle='#587890';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+80,sy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy-4);ctx.lineTo(sx,sy+4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx+80,sy-4);ctx.lineTo(sx+80,sy+4);ctx.stroke();
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(fmt(xMax/5,3),sx+40,sy-8);
  },
  onDown:function(){},
  controls:function(){
    var p=STATE.phylo;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.phylo.generate()">🌲 Generate new tree</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Number of taxa</span><span>'+p.numTaxa+'</span></div>';
    html+='<input type="range" min="3" max="10" step="1" value="'+p.numTaxa+'" oninput="STATE.phylo.numTaxa=parseInt(this.value);MODULES.phylo.generate();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Sequence length</span><span>'+p.length+' bp</span></div>';
    html+='<input type="range" min="20" max="200" step="10" value="'+p.length+'" oninput="STATE.phylo.length=parseInt(this.value);MODULES.phylo.generate();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Distance Matrix</h4>';
    if(p.result){
      html+='<table class="data-table" style="font-size:.55rem">';
      html+='<thead><tr><th></th>';
      for(var i=0;i<p.numTaxa;i++)html+='<th>'+p.names[i].substring(6)+'</th>';
      html+='</tr></thead><tbody>';
      for(var i2=0;i2<p.numTaxa;i2++){
        html+='<tr><td class="c1">'+p.names[i2].substring(6)+'</td>';
        for(var j=0;j<p.numTaxa;j++){
          html+='<td>'+(i2===j?'—':fmt(p.result.initialMatrix[i2][j],3))+'</td>';
        }
        html+='</tr>';
      }
      html+='</tbody></table>';
    }
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var p=STATE.phylo;
    var html='<div class="sec"><h4>UPGMA Algorithm</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Unweighted Pair Group Method with Arithmetic mean:<br><br>'+
      '1. Compute distance matrix<br>'+
      '2. Find pair with minimum distance<br>'+
      '3. Merge into cluster at height d/2<br>'+
      '4. Update distances as size-weighted average<br>'+
      '5. Repeat until one cluster remains'+
      '</div></div>';
    html+='<div class="sec"><h4>Jukes-Cantor</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Corrects for multiple substitutions at the same site:<br><br>'+
      'd = −(3/4)·ln(1 − (4/3)·p)<br><br>'+
      'where p is the observed proportion of differences.'+
      '</div></div>';
    if(p.result){
      html+='<div class="sec"><h4>Merge History</h4>';
      p.result.merges.forEach(function(m,i){
        html+='<div class="kv" style="margin-bottom:4px">';
        html+='<div class="row"><span class="k">Merge '+(i+1)+'</span><span class="v">d='+fmt(m.dist,4)+'</span></div>';
        html+='</div>';
      });
      html+='</div>';
    }
    return html;
  }
});
</script>
<script>
/* ================================================================
   MODULE: ORF FINDER
   ================================================================ */
registerModule('orf',{
  title:'ORF Finder',
  icon:'🎯',
  desc:'Open Reading Frame detection across all 6 reading frames (3 forward + 3 reverse).',
  init:function(){
    if(!STATE.orf.sequence)STATE.orf.sequence=STATE.dna.sequence;
    this.scan();
  },
  scan:function(){
    var o=STATE.orf;
    o.orfs=findORFs(o.sequence,o.minLength);
    logMsg('ORF scan: '+o.orfs.length+' ORFs found (min '+o.minLength+' bp)','info');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var o=STATE.orf;
    var dna=cleanDNA(o.sequence);
    /* Header */
    ctx.fillStyle='#ffe040';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('🎯 ORF FINDER — 6-frame scan',20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText('Sequence: '+dna.length+' bp | Min ORF: '+o.minLength+' bp | Found: '+o.orfs.length,20,44);
    /* 6-frame visualization */
    var startY=70;
    var frameH=Math.min(60,(H-140)/6);
    var frames=[1,2,3,-1,-2,-3];
    var x=60;
    var maxX=W-40;
    var bpPerPx=(maxX-x)/Math.max(1,dna.length);
    frames.forEach(function(f,i){
      var y=startY+i*frameH;
      /* Frame label */
      ctx.fillStyle=f>0?'#40ff90':'#ff5060';
      ctx.font='bold 10px monospace';
      ctx.textAlign='right';
      ctx.fillText('F'+f,x-4,y+frameH/2+3);
      /* Line */
      ctx.strokeStyle='rgba(88,120,144,.4)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x,y+frameH/2);
      ctx.lineTo(maxX,y+frameH/2);
      ctx.stroke();
      /* ORFs in this frame */
      o.orfs.forEach(function(orf){
        if(orf.frame!==f)return;
        var x1=x+(f>0?orf.start:Math.min(orf.start,orf.end))*bpPerPx;
        var x2=x+(f>0?orf.end:Math.max(orf.start,orf.end))*bpPerPx;
        var w=Math.max(2,x2-x1);
        var isSelected=o.orfs.indexOf(orf)===o.selectedORF;
        ctx.fillStyle=isSelected?'#ffe040':(f>0?'#40ff90':'#ff5060');
        ctx.globalAlpha=isSelected?1:0.75;
        ctx.fillRect(x1,y+frameH*0.25,w,frameH*0.5);
        ctx.globalAlpha=1;
        /* ATG marker */
        ctx.fillStyle='#fff';
        ctx.font='8px monospace';
        ctx.textAlign='left';
        if(w>20)ctx.fillText('ATG',x1+2,y+frameH/2-2);
        if(w>40)ctx.fillText('STOP',x2-22,y+frameH/2-2);
      });
    });
    /* Selected ORF details */
    if(o.selectedORF>=0&&o.orfs[o.selectedORF]){
      var sel=o.orfs[o.selectedORF];
      var detailY=H-160;
      ctx.fillStyle='rgba(12,24,40,.7)';
      ctx.strokeStyle='rgba(255,224,64,.4)';
      ctx.beginPath();ctx.roundRect(20,detailY,W-40,140,6);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffe040';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('SELECTED ORF',32,detailY+20);
      ctx.font='11px monospace';
      ctx.fillStyle='#c8d8e8';
      ctx.fillText('Frame:',32,detailY+44);
      ctx.fillStyle='#40ff90';
      ctx.fillText('F'+sel.frame,110,detailY+44);
      ctx.fillStyle='#c8d8e8';
      ctx.fillText('Position:',32,detailY+64);
      ctx.fillStyle='#40d0ff';
      ctx.fillText(sel.start+' - '+sel.end+' bp',110,detailY+64);
      ctx.fillStyle='#c8d8e8';
      ctx.fillText('Length:',32,detailY+84);
      ctx.fillStyle='#40ff90';
      ctx.fillText(sel.length+' bp ('+(sel.length/3)+' codons)',110,detailY+84);
      /* Protein sequence in small font */
      ctx.fillStyle='#587890';
      ctx.font='9px monospace';
      ctx.fillText('Protein:',32,detailY+108);
      ctx.fillStyle='#ffe040';
      ctx.font='9px monospace';
      var prot=sel.protein.substring(0,Math.floor((W-160)/6));
      ctx.fillText(prot,110,detailY+108);
    }
    setStatsHTML(
      '<div>ORFs: '+o.orfs.length+'</div>'+
      '<div>Longest: '+(o.orfs.length?Math.max.apply(null,o.orfs.map(function(x){return x.length})):0)+' bp</div>'+
      '<div>Min: '+o.minLength+' bp</div>'
    );
    updateBadge('🎯 ORF Finder · '+o.orfs.length+' ORFs');
    $('sbMode').textContent='ORF';
  },
  onDown:function(p){
    var o=STATE.orf;
    var dna=cleanDNA(o.sequence);
    var startY=70;
    var frameH=Math.min(60,(CANV.H-140)/6);
    var x=60;
    var maxX=CANV.W-40;
    var bpPerPx=(maxX-x)/Math.max(1,dna.length);
    var frames=[1,2,3,-1,-2,-3];
    var frameIdx=Math.floor((p.y-startY)/frameH);
    if(frameIdx<0||frameIdx>5)return;
    var f=frames[frameIdx];
    var bp=Math.round((p.x-x)/bpPerPx);
    /* Find nearest ORF in this frame */
    var best=-1,bestDist=Infinity;
    o.orfs.forEach(function(orf,i){
      if(orf.frame!==f)return;
      var mid=(orf.start+orf.end)/2;
      var d=Math.abs(mid-bp);
      if(d<bestDist){bestDist=d;best=i;}
    });
    if(best>=0)o.selectedORF=best;
    renderLeftPanel();
  },
  controls:function(){
    var o=STATE.orf;
    var html='';
    html+='<div class="sec"><h4>Sequence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.orf.sequence=this.value.toUpperCase();MODULES.orf.scan()">'+esc(o.sequence)+'</textarea></div>';
    html+='<button class="btn full sm" onclick="STATE.orf.sequence=randomDNA(500);MODULES.orf.scan();renderLeftPanel()">🎲 Random 500 bp</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.orf.sequence=STATE.dna.sequence;MODULES.orf.scan();renderLeftPanel()">Load from DNA viewer</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Minimum ORF length</span><span>'+o.minLength+' bp</span></div>';
    html+='<input type="range" min="30" max="500" step="10" value="'+o.minLength+'" oninput="STATE.orf.minLength=parseInt(this.value);MODULES.orf.scan();renderLeftPanel()"></div>';
    html+='</div>';

registerModule('gc',{
  title:'GC Content',
  icon:'📊',
  desc:'Sliding-window GC content profile. High GC regions are often coding or structurally important.',
  init:function(){
    if(!STATE.gc.sequence)STATE.gc.sequence=STATE.dna.sequence;
    this.compute();
  },
  compute:function(){
    var g=STATE.gc;
    var dna=cleanDNA(g.sequence);
    g.profile=[];
    g.composition=nucleotideCounts(dna);
    if(!g.showWindow||dna.length<g.windowSize){
      /* Single point */
      g.profile.push({pos:0,gc:gcContent(dna)});
    } else {
      for(var i=0;i+g.windowSize<=dna.length;i+=g.step){
        var win=dna.substring(i,i+g.windowSize);
        g.profile.push({pos:i,gc:gcContent(win)});
      }
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var g=STATE.gc;
    var dna=cleanDNA(g.sequence);
    /* Header */
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('📊 GC CONTENT ANALYSIS',20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText('Sequence: '+dna.length+' bp | Overall GC: '+fmt(gcContent(dna)*100,1)+'%',20,44);
    /* Composition pie-like bar */
    var barY=70;
    var barH=30;
    var compBarX=40;
    var compBarW=W-80;
    var total=dna.length||1;
    var cumulative=0;
    var colors={A:'#40ff90',T:'#ff5060',G:'#40d0ff',C:'#ffe040'};
    ['A','T','G','C'].forEach(function(base){
      var frac=(g.composition[base]||0)/total;
      var x=compBarX+cumulative*compBarW;
      var w=frac*compBarW;
      ctx.fillStyle=colors[base];
      ctx.fillRect(x,barY,w,barH);
      if(w>30){
        ctx.fillStyle='#020608';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.fillText(base+' '+fmt(frac*100,1)+'%',x+w/2,barY+20);
      }
      cumulative+=frac;
    });
    ctx.strokeStyle='rgba(88,120,144,.5)';
    ctx.strokeRect(compBarX,barY,compBarW,barH);
    /* GC profile chart */
    var chartY=130;
    var chartH=H-chartY-100;
    var chartX=50;
    var chartW=W-100;
    ctx.fillStyle='rgba(12,24,40,.5)';
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.beginPath();ctx.roundRect(chartX,chartY,chartW,chartH,6);ctx.fill();ctx.stroke();
    /* Grid lines */
    ctx.strokeStyle='rgba(88,120,144,.15)';
    for(var gi=0;gi<=4;gi++){
      var gy=chartY+gi*chartH/4;
      ctx.beginPath();ctx.moveTo(chartX,gy);ctx.lineTo(chartX+chartW,gy);ctx.stroke();
      ctx.fillStyle='#587890';
      ctx.font='9px monospace';
      ctx.textAlign='right';
      ctx.fillText(((4-gi)*25)+'%',chartX-4,gy+4);
    }
    /* Expected 50% line */
    ctx.strokeStyle='rgba(255,224,64,.3)';
    ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.moveTo(chartX,chartY+chartH/2);
    ctx.lineTo(chartX+chartW,chartY+chartH/2);
    ctx.stroke();
    ctx.setLineDash([]);
    /* Profile line */
    if(g.profile.length>1){
      ctx.strokeStyle='#40d0ff';
      ctx.lineWidth=2;
      ctx.beginPath();
      g.profile.forEach(function(p,i){
        var x=chartX+(i/(g.profile.length-1))*chartW;
        var y=chartY+chartH-p.gc*chartH;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();
      /* Fill */
      ctx.fillStyle='rgba(64,208,255,.15)';
      ctx.beginPath();
      ctx.moveTo(chartX,chartY+chartH);
      g.profile.forEach(function(p,i){
        var x=chartX+(i/(g.profile.length-1))*chartW;
        var y=chartY+chartH-p.gc*chartH;
        ctx.lineTo(x,y);
      });
      ctx.lineTo(chartX+chartW,chartY+chartH);
      ctx.closePath();
      ctx.fill();
      /* Peak */
      var maxGC=0,maxIdx=0;
      g.profile.forEach(function(p,i){
        if(p.gc>maxGC){maxGC=p.gc;maxIdx=i;}
      });
      var px=chartX+(maxIdx/(g.profile.length-1))*chartW;
      var py=chartY+chartH-maxGC*chartH;
      ctx.fillStyle='#ffe040';
      ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe040';
      ctx.font='10px monospace';
      ctx.textAlign='left';
      ctx.fillText('Peak: '+fmt(maxGC*100,1)+'%',px+8,py-4);
    }
    /* Legend */
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.textAlign='left';
    ctx.fillText('GC% — window size '+g.windowSize+' bp, step '+g.step+' bp',chartX+8,chartY+16);
    setStatsHTML(
      '<div>Length: '+dna.length+' bp</div>'+
      '<div>GC: '+fmt(gcContent(dna)*100,1)+'%</div>'+
      '<div>AT: '+fmt((1-gcContent(dna))*100,1)+'%</div>'
    );
    updateBadge('📊 GC Content · '+fmt(gcContent(dna)*100,1)+'%');
    $('sbMode').textContent='GC Analysis';
  },
  onDown:function(){},
  controls:function(){
    var g=STATE.gc;
    var html='';
    html+='<div class="sec"><h4>Sequence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.gc.sequence=this.value.toUpperCase();MODULES.gc.compute()">'+esc(g.sequence)+'</textarea></div>';
    html+='<button class="btn full sm" onclick="STATE.gc.sequence=randomDNA(500);MODULES.gc.compute();renderLeftPanel()">🎲 Random 500 bp</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.gc.sequence=highGC();MODULES.gc.compute();renderLeftPanel()">High GC</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.gc.sequence=lowGC();MODULES.gc.compute();renderLeftPanel()">Low GC</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.gc.sequence=gcIsland();MODULES.gc.compute();renderLeftPanel()">GC island</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Window</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Window size</span><span>'+g.windowSize+' bp</span></div>';
    html+='<input type="range" min="10" max="200" step="10" value="'+g.windowSize+'" oninput="STATE.gc.windowSize=parseInt(this.value);MODULES.gc.compute();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Step</span><span>'+g.step+' bp</span></div>';
    html+='<input type="range" min="1" max="50" step="1" value="'+g.step+'" oninput="STATE.gc.step=parseInt(this.value);MODULES.gc.compute();renderLeftPanel()"></div>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var g=STATE.gc;
    var dna=cleanDNA(g.sequence);
    var html='<div class="sec"><h4>GC Content</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'GC% = (G + C) / (A + T + G + C) × 100<br><br>'+
      'GC content correlates with:<br>'+
      '• Thermal stability (higher GC = higher Tm)<br>'+
      '• Gene density<br>'+
      '• Codon usage bias<br>'+
      '• Chromosome structure'+
      '</div></div>';
    html+='<div class="sec"><h4>Composition</h4><div class="kv">';
    ['A','T','G','C'].forEach(function(base){
      var count=g.composition[base]||0;
      var pct=dna.length?(count/dna.length*100):0;
      html+='<div class="row"><span class="k">'+base+'</span><span class="v">'+count+' ('+fmt(pct,1)+'%)</span></div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>GC Islands</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Regions with GC > 50% over 200+ bp are often CpG islands — associated with promoters and gene starts in vertebrates.'+
      '</div></div>';
    return html;
  }
});
function highGC(){var out='';for(var i=0;i<500;i++)out+=Math.random()<0.75?['G','C'][rnd(0,1)]:['A','T'][rnd(0,1)];return out;}
function lowGC(){var out='';for(var i=0;i<500;i++)out+=Math.random()<0.25?['G','C'][rnd(0,1)]:['A','T'][rnd(0,1)];return out;}
function gcIsland(){
  var out='';
  for(var i=0;i<500;i++){
    if(i>150&&i<350)out+=Math.random()<0.8?['G','C'][rnd(0,1)]:['A','T'][rnd(0,1)];
    else out+=Math.random()<0.4?['G','C'][rnd(0,1)]:['A','T'][rnd(0,1)];
  }
  return out;
}

registerModule('restriction',{
  title:'Restriction Sites',
  icon:'✂️',
  desc:'Find restriction enzyme cut sites and simulate a restriction digest with fragment sizes.',
  init:function(){
    if(!STATE.restriction.sequence)STATE.restriction.sequence=STATE.dna.sequence;
    this.scan();
  },
  scan:function(){
    var r=STATE.restriction;
    var enzymes=RESTRICTION_ENZYMES.filter(function(e){return r.activeEnzymes.indexOf(e.name)>=0;});
    r.sites=findRestrictionSites(r.sequence,enzymes);
    logMsg('Digest: '+r.sites.length+' cut sites','info');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#020608';
    ctx.fillRect(0,0,W,H);
    var r=STATE.restriction;
    var dna=cleanDNA(r.sequence);
    /* Header */
    ctx.fillStyle='#ff9040';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText('✂️ RESTRICTION SITE MAP',20,26);
    ctx.fillStyle='#587890';
    ctx.font='10px monospace';
    ctx.fillText(dna.length+' bp | '+r.activeEnzymes.length+' enzymes | '+r.sites.length+' sites',20,44);
    /* Linear map */
    var mapY=90;
    var mapX=80;
    var mapW=W-160;
    var mapH=40;
    ctx.fillStyle='rgba(20,36,56,.8)';
    ctx.strokeStyle='rgba(255,144,64,.5)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(mapX,mapY,mapW,mapH,8);ctx.fill();ctx.stroke();
    /* Strand line */
    ctx.strokeStyle='#40d0ff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(mapX+10,mapY+mapH/2);
    ctx.lineTo(mapX+mapW-10,mapY+mapH/2);
    ctx.stroke();
    /* Position labels */
    for(var i=0;i<=5;i++){
      var x=mapX+10+i*(mapW-20)/5;
      ctx.strokeStyle='rgba(88,120,144,.5)';
      ctx.beginPath();
      ctx.moveTo(x,mapY+mapH-5);
      ctx.lineTo(x,mapY+mapH);
      ctx.stroke();
      ctx.fillStyle='#587890';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(Math.round(dna.length*i/5),x,mapY+mapH+14);
    }
    /* Cut sites */
    var enzymeColors={'EcoRI':'#40ff90','BamHI':'#40d0ff','HindIII':'#ffe040','XhoI':'#ff40a0','PstI':'#a060ff','SalI':'#ff5060','KpnI':'#40ffd0','SacI':'#ff9040','SmaI':'#c060ff','HaeIII':'#40e0ff','AluI':'#80ff90','TaqI':'#ff80c0','NotI':'#ffe080','SphI':'#80c0ff'};
    var lastLabelY=0;
    r.sites.forEach(function(site){
      var x=mapX+10+(site.cutPos/Math.max(1,dna.length))*(mapW-20);
      var col=enzymeColors[site.enzyme]||'#ffffff';
      ctx.strokeStyle=col;
      ctx.lineWidth=site.strand==='+'?2:1.5;
      ctx.beginPath();
      if(site.strand==='+'){
        ctx.moveTo(x,mapY+8);
        ctx.lineTo(x,mapY+mapH-8);
      } else {
        ctx.setLineDash([3,3]);
        ctx.moveTo(x,mapY+8);
        ctx.lineTo(x,mapY+mapH-8);
        ctx.setLineDash([]);
      }
      ctx.stroke();
      /* Label */
      var labelY=mapY-10-((lastLabelY+1)%3)*14;
      lastLabelY++;
      ctx.fillStyle=col;
      ctx.font='bold 9px monospace';
      ctx.textAlign='center';
      ctx.fillText(site.enzyme,x,labelY);
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(x,mapY+mapH+22,3,0,Math.PI*2);ctx.fill();
    });
    /* Fragment visualization */
    if(r.showCutMap&&r.sites.length){
      var fragY=mapY+mapH+50;
      var positions=[0].concat(r.sites.map(function(s){return s.cutPos})).concat([dna.length]);
      positions.sort(function(a,b){return a-b});
      ctx.fillStyle='#ff9040';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('DIGEST FRAGMENTS ('+(positions.length-1)+' fragments)',20,fragY-8);
      for(var k=0;k<positions.length-1;k++){
        var fragStart=positions[k];
        var fragEnd=positions[k+1];
        var fragLen=fragEnd-fragStart;
        var x1=mapX+10+(fragStart/dna.length)*(mapW-20);
        var x2=mapX+10+(fragEnd/dna.length)*(mapW-20);
        var hue=(k*60)%360;
        ctx.fillStyle='hsla('+hue+',70%,55%,0.4)';
        ctx.fillRect(x1,fragY,x2-x1,30);
        ctx.strokeStyle='hsla('+hue+',70%,55%,1)';
        ctx.lineWidth=1.5;
        ctx.strokeRect(x1,fragY,x2-x1,30);
        if(x2-x1>40){
          ctx.fillStyle='#e0ecff';
          ctx.font='bold 10px monospace';
          ctx.textAlign='center';
          ctx.fillText(fragLen+' bp',(x1+x2)/2,fragY+20);
        }
      }
      /* Fragment size table */
      var tableY=fragY+60;
      if(tableY+80<H){
        ctx.fillStyle='rgba(12,24,40,.6)';
        ctx.strokeStyle='rgba(255,144,64,.3)';
        ctx.beginPath();ctx.roundRect(20,tableY,W-40,Math.min(80,H-tableY-20),6);ctx.fill();ctx.stroke();
        ctx.fillStyle='#ff9040';
        ctx.font='bold 11px monospace';
        ctx.textAlign='left';
        ctx.fillText('FRAGMENT SIZES (bp)',32,tableY+18);
        ctx.font='10px monospace';
        var sizes=positions.slice(1).map(function(e,i){return e-positions[i]});
        sizes.sort(function(a,b){return b-a});
        var cols=Math.floor((W-60)/60);
        sizes.forEach(function(sz,i){
          var col=i%cols;
          var row=Math.floor(i/cols);
          if(tableY+30+row*16>H-20)return;
          ctx.fillStyle='#e0ecff';
          ctx.fillText(sz+' bp',32+col*60,tableY+36+row*16);
        });
      }
    }
    setStatsHTML(
      '<div>Sites: '+r.sites.length+'</div>'+
      '<div>Enzymes: '+r.activeEnzymes.length+'</div>'+
      '<div>Fragments: '+(r.sites.length+1)+'</div>'
    );
    updateBadge('✂️ Restriction Digest · '+r.sites.length+' cuts');
    $('sbMode').textContent='Restriction';
  },
  onDown:function(){},
  controls:function(){
    var r=STATE.restriction;
    var html='';
    html+='<div class="sec"><h4>Sequence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.restriction.sequence=this.value.toUpperCase();MODULES.restriction.scan()">'+esc(r.sequence)+'</textarea></div>';
    html+='<button class="btn full sm" onclick="STATE.restriction.sequence=randomDNA(1000);MODULES.restriction.scan();renderLeftPanel()">🎲 Random 1000 bp</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.restriction.sequence=STATE.dna.sequence;MODULES.restriction.scan();renderLeftPanel()">Load from DNA viewer</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Enzymes</h4>';
    RESTRICTION_ENZYMES.forEach(function(enzyme){
      var active=r.activeEnzymes.indexOf(enzyme.name)>=0;
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.6rem">';
      html+='<div><span style="color:'+(active?'var(--c1)':'var(--tx3)')+'">'+enzyme.name+'</span>';
      html+='<span style="color:var(--tx3);margin-left:8px">'+enzyme.site+'</span></div>';
      html+='<div class="chip '+(active?'active':'')+'" style="padding:2px 6px;font-size:.5rem" onclick="toggleEnzyme(\''+enzyme.name+'\')">'+(active?'ON':'OFF')+'</div>';
      html+='</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Quick Select</h4>';
    html+='<button class="btn full sm" onclick="selectCommonEnzymes()">Common 5</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="selectAllEnzymes()">Select all</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.restriction.activeEnzymes=[];MODULES.restriction.scan();renderLeftPanel()">Clear</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var r=STATE.restriction;
    var html='<div class="sec"><h4>Restriction Enzymes</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Molecular scissors that cut DNA at specific recognition sequences. Most are palindromic — read the same on both strands.<br><br>'+
      'Example: EcoRI recognizes GAATTC,<br>cuts between G and A on each strand:<br><br>'+
      '5\'-G↓AATTC-3\'<br>'+
      '3\'-CTTAA↑G-5\'<br><br>'+
      'Produces "sticky ends" — overhangs that can be ligated with complementary ends.'+
      '</div></div>';
    if(r.sites.length){
      html+='<div class="sec"><h4>Cut Sites</h4>';
      html+='<div style="max-height:200px;overflow-y:auto">';
      r.sites.forEach(function(s){
        html+='<div class="kv" style="margin-bottom:2px;font-size:.58rem">';
        html+='<div class="row"><span class="k">'+s.enzyme+'</span><span class="v">pos '+s.cutPos+' ('+s.strand+')</span></div>';
        html+='</div>';
      });
      html+='</div></div>';
    }
    return html;
  }
});
function toggleEnzyme(name){
  var r=STATE.restriction;
  var i=r.activeEnzymes.indexOf(name);
  if(i>=0)r.activeEnzymes.splice(i,1);
  else r.activeEnzymes.push(name);
  MODULES.restriction.scan();
  renderLeftPanel();
}
function selectCommonEnzymes(){STATE.restriction.activeEnzymes=['EcoRI','BamHI','HindIII','XhoI','PstI'];MODULES.restriction.scan();renderLeftPanel();}
function selectAllEnzymes(){STATE.restriction.activeEnzymes=RESTRICTION_ENZYMES.map(function(e){return e.name});MODULES.restriction.scan();renderLeftPanel();}
