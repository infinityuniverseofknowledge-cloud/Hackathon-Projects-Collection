registerModule('pathway',{title:'Metabolic Pathway',icon:'⛓',desc:'Glycolysis pathway with flux analysis.',init:function(){this.build()},
build:function(){var p=STATE.pathway;
// Simplified glycolysis
p.nodes=[
  {id:'GLC',name:'Glucose',x:0.1,y:0.5},
  {id:'G6P',name:'G6P',x:0.25,y:0.5},
  {id:'F6P',name:'F6P',x:0.38,y:0.5},
  {id:'FBP',name:'F-1,6-BP',x:0.5,y:0.5},
  {id:'GAP',name:'GAP',x:0.62,y:0.5},
  {id:'PEP',name:'PEP',x:0.78,y:0.5},
  {id:'PYR',name:'Pyruvate',x:0.9,y:0.5}
];
p.edges=[
  {from:'GLC',to:'G6P',enzyme:'HK',flux:1.0},
  {from:'G6P',to:'F6P',enzyme:'PGI',flux:1.0},
  {from:'F6P',to:'FBP',enzyme:'PFK-1',flux:0.8,limiting:true},
  {from:'FBP',to:'GAP',enzyme:'Aldolase',flux:0.8},
  {from:'GAP',to:'PEP',enzyme:'GAPDH...',flux:0.8},
  {from:'PEP',to:'PYR',enzyme:'PK',flux:0.8}
];
// ATP/NADH production
p.ATP=0;p.NADH=0;p.glucoseConsumed=0;p.t=0;
p.fluxes=p.edges.map(function(e){return e.flux})},
step:function(){var p=STATE.pathway;var dt=0.1;
// Simplified: substrate flux with feedback
var flux=p.edges[0].flux;
p.glucoseConsumed+=flux*dt*0.1;
// ATP: 2 net per glucose (2 invested - 4 produced)
p.ATP+=flux*dt*0.1*2;
p.NADH+=flux*dt*0.1*2;
p.t+=dt},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*20;var k=0;while(this._acc>=1&&k<3){this.step();this._acc-=1;k++}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var p=STATE.pathway;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('METABOLIC PATHWAY — Glycolysis',30,30);
ctx.fillStyle='#20e0ff';ctx.font='11px monospace';
ctx.fillText('Glucose → 2 Pyruvate + 2 ATP + 2 NADH',30,52);
/* Draw pathway */
var px=40,py=100,pw=W-80,ph=H*0.55;
// Nodes as molecules
p.nodes.forEach(function(n){
  var x=px+n.x*pw;
  var y=py+n.y*ph;
  // Circle
  ctx.fillStyle='rgba(32,255,128,.15)';
  ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#20ff80';ctx.lineWidth=2;ctx.stroke();
  // Name
  ctx.fillStyle='#e0ffe8';ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillText(n.name,x,y+4);
});
// Edges with enzymes
p.edges.forEach(function(e){
  var from=p.nodes.filter(function(n){return n.id===e.from})[0];
  var to=p.nodes.filter(function(n){return n.id===e.to})[0];
  var x1=px+from.x*pw+22;
  var y1=py+from.y*ph;
  var x2=px+to.x*pw-22;
  var y2=py+to.y*ph;
  // Arrow
  ctx.strokeStyle=e.limiting?'#ff40a0':'#20e0ff';
  ctx.lineWidth=e.limiting?3:2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  // Arrowhead
  var angle=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-10*Math.cos(angle-0.4),y2-10*Math.sin(angle-0.4));
  ctx.lineTo(x2-10*Math.cos(angle+0.4),y2-10*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fillStyle=e.limiting?'#ff40a0':'#20e0ff';
  ctx.fill();
  // Enzyme label
  var mx=(x1+x2)/2;
  var my=(y1+y2)/2-8;
  ctx.fillStyle=e.limiting?'#ff40a0':'#ffd040';
  ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillText(e.enzyme,mx,my);
  // Flux indicator
  ctx.fillStyle='#20ff80';
  ctx.font='bold 10px monospace';
  ctx.fillText('v='+fmt(e.flux,2),mx,my+12);
});
ctx.textAlign='left';
/* Energy production */
var ey=py+ph+50;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('ENERGY PRODUCTION',30,ey);
ctx.fillStyle='rgba(4,18,10,.6)';ctx.fillRect(30,ey+10,W-80,90);
ctx.strokeStyle='#20ff80';ctx.strokeRect(30,ey+10,W-80,90);
ctx.fillStyle='#ffd040';ctx.font='bold 20px monospace';
ctx.fillText('ATP',50,ey+45);
ctx.fillStyle='#ffd040';ctx.font='bold 28px monospace';
ctx.fillText(fmt(p.ATP,1),50,ey+80);
ctx.fillStyle='#20e0ff';ctx.font='bold 20px monospace';
ctx.fillText('NADH',300,ey+45);
ctx.fillStyle='#20e0ff';ctx.font='bold 28px monospace';
ctx.fillText(fmt(p.NADH,1),300,ey+80);
ctx.fillStyle='#20ff80';ctx.font='bold 20px monospace';
ctx.fillText('Glucose consumed',500,ey+45);
ctx.fillStyle='#20ff80';ctx.font='bold 28px monospace';
ctx.fillText(fmt(p.glucoseConsumed,2),500,ey+80);
/* Rate limiting step info */
var ry=ey+130;
if(ry<H-60){
  ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
  ctx.fillText('RATE-LIMITING STEP: PFK-1 (phosphofructokinase-1)',30,ry);
  ctx.fillStyle='#e0ffe8';ctx.font='11px monospace';
  ctx.fillText('Regulated by: ATP (inhibitor), AMP (activator), F-2,6-BP (activator)',30,ry+20);
  ctx.fillText('Committed step of glycolysis — determines overall flux',30,ry+40);
}
SV('sbLen',fmt(p.t,1));SV('sbGC','—');SV('sbMode','Metabolic');SV('sbIter',p.nodes.length);
setStats('<div>ATP: '+fmt(p.ATP,1)+'</div><div>NADH: '+fmt(p.NADH,1)+'</div><div>Glucose: '+fmt(p.glucoseConsumed,2)+'</div>');
badge('⛓ Glycolysis · ATP='+fmt(p.ATP,0))},
onDown:function(){},
controls:function(){var p=STATE.pathway;var h='<div class="sec"><h4>Parameters</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Glucose supply</span><span>'+fmt(p.edges[0].flux,2)+'</span></div><input type="range" min="0.1" max="2" step="0.1" value="'+p.edges[0].flux+'" oninput="STATE.pathway.edges[0].flux=parseFloat(this.value);STATE.pathway.edges[1].flux=parseFloat(this.value);MODULES.pathway.updateFlux()"></div>';
h+='</div>';
h+='<div class="sec"><h4>State</h4><div class="kv">';
h+='<div class="row"><span class="k">ATP</span><span class="v">'+fmt(p.ATP,2)+'</span></div>';
h+='<div class="row"><span class="k">NADH</span><span class="v">'+fmt(p.NADH,2)+'</span></div>';
h+='<div class="row"><span class="k">Glucose</span><span class="v">'+fmt(p.glucoseConsumed,2)+'</span></div>';
h+='</div></div>';
h+='<button class="btn primary full" onclick="STATE.pathway.ATP=0;STATE.pathway.NADH=0;STATE.pathway.glucoseConsumed=0;STATE.pathway.t=0;toast(\'Reset\',\'success\')">↺ Reset</button>';
return h},
updateFlux:function(){
  var p=STATE.pathway;
  var v=p.edges[0].flux;
  // PFK-1 limiting factor
  var pfkFlux=Math.min(1.2,v*0.8)*0.8;
  p.edges[2].flux=pfkFlux;
  p.edges[3].flux=pfkFlux;
  p.edges[4].flux=pfkFlux;
  p.edges[5].flux=pfkFlux;
},
mathPanel:function(){return '<div class="sec"><h4>Glycolysis</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">10 reações enzimáticas:<br>Glucose → G6P → F6P → F-1,6-BP<br>→ GAP → ... → PEP → Pyruvate<br><br>Net: 1 glucose → 2 ATP + 2 NADH + 2 pyruvate<br><br>PFK-1 = rate-limiting (allosteric regulation).</div></div>'}});

function buildTabs(){var t=$('tbTabs');t.innerHTML='';
TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});
i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;
$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});
var m=MODULES[k];
SV('sbMode',(m&&m.title)||k);
try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}
renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;
$$('.rp-tab').forEach(function(t){t.classList.remove('active')});
e.classList.add('active');
$$('.rp-pane').forEach(function(p){p.classList.remove('active')});
var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
if(p)p.classList.add('active');
renderRightPanel()}
function renderLeftPanel(){
  var b=$('lpBody');if(!b)return;

  var h='';
  h+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.7rem">'+m.icon+' '+m.title+'</h4>';

  catch(e){h+='<div class="sec"><div class="empty" style="color:var(--p3)">controls error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}

}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];

    var stats='<div class="sec"><h4>Live State</h4><div class="kv">';

  }

  if(STATE.currentRp==='logs')renderLogs();

function renderLogs(){var p=$('rpLogs');if(!p)return;
var h='<div class="sec"><h4>Log</h4>';
if(!LOG.length)h+='<div class="empty">No events</div>';
else LOG.slice().reverse().forEach(function(l){
  var c=l.type==='error'?'var(--p3)':l.type==='success'?'var(--p1)':'var(--p2)';
  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});
h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['bio','paper','cell'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){openModal('❓ BIOFORGE — Help','<div class="sec"><h4>🧬 20 Módulos Biológicos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">DNA</b> · <b style="color:var(--p1)">Dogma</b> · <b style="color:var(--p1)">Alignment</b> · <b style="color:var(--p1)">Phylogeny</b><br><b style="color:var(--p1)">PopGen</b> · <b style="color:var(--p1)">Epidemic</b> · <b style="color:var(--p1)">Folding</b> · <b style="color:var(--p1)">MD</b><br><b style="color:var(--p1)">Enzyme</b> · <b style="color:var(--p1)">GeneNet</b> · <b style="color:var(--p1)">HH Neuron</b><br><b style="color:var(--p1)">SNN</b> · <b style="color:var(--p1)">CRISPR</b> · <b style="color:var(--p1)">RNA Fold</b><br><b style="color:var(--p1)">GA</b> · <b style="color:var(--p1)">Mutation</b> · <b style="color:var(--p1)">Codon</b><br><b style="color:var(--p1)">Restriction</b> · <b style="color:var(--p1)">Gel</b> · <b style="color:var(--p1)">Pathway</b></div></div><div class="sec"><h4>🔬 Algoritmos Reais</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Needleman-Wunsch · Smith-Waterman · UPGMA<br>Wright-Fisher · SIR/SEIR (RK4) · Lennard-Jones<br>Nussinov · Hodgkin-Huxley · Izhikevich<br>Michaelis-Menten · Repressilator (Elowitz)</div></div><div class="sec"><h4>⌨️ Atalhos</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">Space=Play · →=Step · R=Reset · T=Tema · ?=Help</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'})}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#000a05';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#20ff80';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('BIOFORGE ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('BIOFORGE ready — 20 módulos de biologia computacional','success',3000);
});
