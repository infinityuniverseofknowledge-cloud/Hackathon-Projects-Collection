<!DOCTYPE html>
<html lang="pt-BR" data-theme="bio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>BIOFORGE — Computational Biology Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#020604;--panel:#04120a;--panel2:#081c12;--panel3:#0c2818;--panel4:#103422;
  --bd:#0a2418;--bd2:#124028;--tx:#e0ffe8;--tx2:#80c098;--tx3:#3a7050;
  --p1:#20ff80;--p2:#20e0ff;--p3:#ff40a0;--p4:#ffd040;--p5:#a060ff;--p6:#ff8040;
  --g1:linear-gradient(135deg,#20ff80,#20e0ff);
  --gHolo:linear-gradient(120deg,#20ff80,#20e0ff,#a060ff,#ff40a0,#ffd040,#20ff80);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f5fff8;--panel:#fff;--panel2:#f0fff8;--panel3:#e0ffe8;--panel4:#c8f8d8;--bd:#c0e8d0;--bd2:#88c0a0;--tx:#0a2018;--tx2:#2a6040;--tx3:#608070;--p1:#00a040;--p2:#0080c0;--g1:linear-gradient(135deg,#00a040,#0080c0)}
[data-theme="cell"]{--bg:#0a0810;--panel:#100c18;--panel2:#181020;--panel3:#201828;--panel4:#2a2038;--bd:#28203a;--bd2:#402850;--tx:#e8e0f0;--tx2:#a898b0;--tx3:#605068;--p1:#40ffb0;--p2:#ff80c0;--g1:linear-gradient(135deg,#40ffb0,#ff80c0)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#020604}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#000a05;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(32,255,128,.012) 0,rgba(32,255,128,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(4,18,10,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p4)}.sb-val.c4{color:var(--p5)}.sb-val.c5{color:var(--p3)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(32,255,128,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#020604;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#020604;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p1)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p3)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('dna')">BIOFORGE</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Len</span><span class="sb-val c2" id="sbLen">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">GC</span><span class="sb-val c3" id="sbGC">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Time</span><span class="sb-val c4" id="sbTime">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Iter</span><span class="sb-val c5" id="sbIter">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">DNA</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ══════ UTILS ══════ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ══════ CANVAS ══════ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
function onTouchStart(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchMove(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()}
function onTouchEnd(e){onUp();e.preventDefault()}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

/* ══════ MODULE REGISTRY ══════ */
var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}

/* ══════ LOG ══════ */
var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   BIOLOGY CONSTANTS
   ══════════════════════════════════════════════════════════ */
var NUCLEOTIDES='ATGC';
var NUCLEOTIDES_RNA='AUGC';
var AMINO_ACIDS='ACDEFGHIKLMNPQRSTVWY';
var AA_NAMES={
  A:'Alanine',R:'Arginine',N:'Asparagine',D:'Aspartate',C:'Cysteine',
  Q:'Glutamine',E:'Glutamate',G:'Glycine',H:'Histidine',I:'Isoleucine',
  L:'Leucine',K:'Lysine',M:'Methionine',F:'Phenylalanine',P:'Proline',
  S:'Serine',T:'Threonine',W:'Tryptophan',Y:'Tyrosine',V:'Valine','*':'Stop'
};
var AA_COLOR={
  A:'#80d080',R:'#4060e0',N:'#40a040',D:'#e04040',C:'#e0e040',
  Q:'#40c080',E:'#c04040',G:'#a0a0a0',H:'#80a0e0',I:'#80c080',
  L:'#60a060',K:'#6080e0',M:'#e0d040',F:'#c08060',P:'#d0a080',
  S:'#a0d0a0',T:'#a0c0c0',W:'#a080e0',Y:'#e0c080',V:'#60a060','*':'#ff2020'
};
var AA_HYDRO={
  A:1.8,R:-4.5,N:-3.5,D:-3.5,C:2.5,Q:-3.5,E:-3.5,G:-0.4,H:-3.2,
  I:4.5,L:3.8,K:-3.9,M:1.9,F:2.8,P:-1.6,S:-0.8,T:-0.7,W:-0.9,Y:-1.3,V:4.2,'*':0
};
var CODON_TABLE={
  'UUU':'F','UUC':'F','UUA':'L','UUG':'L','CUU':'L','CUC':'L','CUA':'L','CUG':'L',
  'AUU':'I','AUC':'I','AUA':'I','AUG':'M','GUU':'V','GUC':'V','GUA':'V','GUG':'V',
  'UCU':'S','UCC':'S','UCA':'S','UCG':'S','CCU':'P','CCC':'P','CCA':'P','CCG':'P',
  'ACU':'T','ACC':'T','ACA':'T','ACG':'T','GCU':'A','GCC':'A','GCA':'A','GCG':'A',
  'UAU':'Y','UAC':'Y','UAA':'*','UAG':'*','CAU':'H','CAC':'H','CAA':'Q','CAG':'Q',
  'AAU':'N','AAC':'N','AAA':'K','AAG':'K','GAU':'D','GAC':'D','GAA':'E','GAG':'E',
  'UGU':'C','UGC':'C','UGA':'*','UGG':'W','CGU':'R','CGC':'R','CGA':'R','CGG':'R',
  'AGU':'S','AGC':'S','AGA':'R','AGG':'R','GGU':'G','GGC':'G','GGA':'G','GGG':'G'
};
function dnaToRNA(s){return s.replace(/T/g,'U')}
function rnaToDNA(s){return s.replace(/U/g,'T')}
function complement(s){return s.split('').map(function(c){return {'A':'T','T':'A','G':'C','C':'G'}[c]||'N'}).join('')}
function reverseComplement(s){return complement(s).split('').reverse().join('')}
function translate(rna){
  var prot='';
  for(var i=0;i+2<rna.length;i+=3){
    var c=rna.substr(i,3);
    prot+=CODON_TABLE[c]||'X';
  }
  return prot;
}
function translateAll(rna){
  var p1=translate(rna);
  return {frame1:p1};
}
function gcContent(s){
  var gc=0,valid=0;
  for(var i=0;i<s.length;i++){if(s[i]==='G'||s[i]==='C'){gc++;valid++}else if(s[i]==='A'||s[i]==='T'||s[i]==='U')valid++}
  return valid?gc/valid:0;
}
function randomDNA(n,gcBias){
  gcBias=gcBias==null?0.5:gcBias;
  var s='';
  for(var i=0;i<n;i++){
    var r=Math.random();
    if(r<gcBias/2)s+='G';
    else if(r<gcBias)s+='C';
    else if(r<gcBias+(1-gcBias)/2)s+='A';
    else s+='T';
  }
  return s;
}
function meltingTemp(s){
  // Wallace rule for short oligos, GC% based for longer
  if(s.length<14){
    var at=0,gc=0;
    for(var i=0;i<s.length;i++){if(s[i]==='A'||s[i]==='T')at++;else gc++}
    return 2*at+4*gc;
  }
  return 64.9+41*(gcContent(s)*s.length-16.4)/s.length;
}

/* ══════════════════════════════════════════════════════════
   SEQUENCE ALIGNMENT (Needleman-Wunsch + Smith-Waterman)
   ══════════════════════════════════════════════════════════ */
function needlemanWunsch(seq1,seq2,match,mismatch,gap){
  match=match||1;mismatch=mismatch||-1;gap=gap||-1;
  var n=seq1.length,m=seq2.length;
  var S=[];
  for(var i=0;i<=n;i++){S.push(new Array(m+1))}
  var T=[];
  for(var i=0;i<=n;i++){T.push(new Array(m+1))}
  for(var i=0;i<=n;i++){S[i][0]=i*gap;T[i][0]='up'}
  for(var j=0;j<=m;j++){S[0][j]=j*gap;T[0][j]='left'}
  T[0][0]='done';
  for(var i=1;i<=n;i++){
    for(var j=1;j<=m;j++){
      var scoreDiag=S[i-1][j-1]+(seq1[i-1]===seq2[j-1]?match:mismatch);
      var scoreUp=S[i-1][j]+gap;
      var scoreLeft=S[i][j-1]+gap;
      var best=Math.max(scoreDiag,scoreUp,scoreLeft);
      S[i][j]=best;
      if(best===scoreDiag)T[i][j]='diag';
      else if(best===scoreUp)T[i][j]='up';
      else T[i][j]='left';
    }
  }
  // Traceback
  var a1='',a2='';
  var i=n,j=m;
  while(i>0||j>0){
    var dir=T[i][j];
    if(dir==='diag'){a1=seq1[i-1]+a1;a2=seq2[j-1]+a2;i--;j--}
    else if(dir==='up'){a1=seq1[i-1]+a1;a2='-'+a2;i--}
    else{a1='-'+a1;a2=seq2[j-1]+a2;j--}
  }
  return {S:S,T:T,a1:a1,a2:a2,score:S[n][m]};
}
function smithWaterman(seq1,seq2,match,mismatch,gap){
  match=match||2;mismatch=mismatch||-1;gap=gap||-1;
  var n=seq1.length,m=seq2.length;
  var S=[];
  for(var i=0;i<=n;i++){S.push(new Array(m+1).fill(0))}
  var T=[];
  for(var i=0;i<=n;i++){T.push(new Array(m+1).fill('done'))}
  var maxScore=0,maxI=0,maxJ=0;
  for(var i=1;i<=n;i++){
    for(var j=1;j<=m;j++){
      var scoreDiag=S[i-1][j-1]+(seq1[i-1]===seq2[j-1]?match:mismatch);
      var scoreUp=S[i-1][j]+gap;
      var scoreLeft=S[i][j-1]+gap;
      var best=Math.max(0,scoreDiag,scoreUp,scoreLeft);
      S[i][j]=best;
      if(best===0)T[i][j]='done';
      else if(best===scoreDiag)T[i][j]='diag';
      else if(best===scoreUp)T[i][j]='up';
      else T[i][j]='left';
      if(best>maxScore){maxScore=best;maxI=i;maxJ=j}
    }
  }
  var a1='',a2='';
  var i=maxI,j=maxJ;
  while(i>0&&j>0&&T[i][j]!=='done'){
    var dir=T[i][j];
    if(dir==='diag'){a1=seq1[i-1]+a1;a2=seq2[j-1]+a2;i--;j--}
    else if(dir==='up'){a1=seq1[i-1]+a1;a2='-'+a2;i--}
    else{a1='-'+a1;a2=seq2[j-1]+a2;j--}
  }
  return {S:S,T:T,a1:a1,a2:a2,score:maxScore,startI:i,startJ:j};
}

/* ══════════════════════════════════════════════════════════
   PHYSICS ODE HELPERS
   ══════════════════════════════════════════════════════════ */
function rk4(y,t,dt,deriv){
  var n=y.length;
  var k1=deriv(y,t);
  var y2=new Array(n);for(var i=0;i<n;i++)y2[i]=y[i]+k1[i]*dt/2;
  var k2=deriv(y2,t+dt/2);
  var y3=new Array(n);for(var i=0;i<n;i++)y3[i]=y[i]+k2[i]*dt/2;
  var k3=deriv(y3,t+dt/2);
  var y4=new Array(n);for(var i=0;i<n;i++)y4[i]=y[i]+k3[i]*dt;
  var k4=deriv(y4,t+dt);
  var out=new Array(n);
  for(var i=0;i<n;i++)out[i]=y[i]+(k1[i]+2*k2[i]+2*k3[i]+k4[i])*dt/6;
  return out;
}
function euler(y,dt,deriv){
  var d=deriv(y);
  for(var i=0;i<y.length;i++)y[i]+=d[i]*dt;
  return y;
}

/* ══════════════════════════════════════════════════════════
   RANDOM HELPERS
   ══════════════════════════════════════════════════════════ */
function randomChoice(arr){return arr[Math.floor(Math.random()*arr.length)]}
function randomSample(arr,n,replace){
  replace=replace!==false;
  var out=[];
  if(replace){for(var i=0;i<n;i++)out.push(randomChoice(arr))}
  else{
    var pool=arr.slice();
    for(var i=0;i<n&&pool.length;i++){
      var idx=rnd(0,pool.length-1);
      out.push(pool[idx]);pool.splice(idx,1);
    }
  }
  return out;
}

/* ══════════════════════════════════════════════════════════
   DRAW HELPERS
   ══════════════════════════════════════════════════════════ */
function drawSparkline(ctx,x,y,w,h,values,color,fill){
  if(values.length<2)return;
  var mx=Math.max.apply(null,values);
  var mn=Math.min.apply(null,values);
  if(mx===mn){mx=mn+1}
  ctx.beginPath();
  for(var i=0;i<values.length;i++){
    var px=x+i/(values.length-1)*w;
    var py=y+h-(values[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  if(fill){
    ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();
    var g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,color+'88');g.addColorStop(1,color+'00');
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
}
function drawMultiSeries(ctx,x,y,w,h,series,colors,labels){
  if(!series.length||!series[0].length)return;
  var mx=-Infinity,mn=Infinity;
  series.forEach(function(s){s.forEach(function(v){if(v>mx)mx=v;if(v<mn)mn=v})});
  if(mx===mn){mx=mn+1}
  series.forEach(function(s,i){
    ctx.beginPath();
    for(var j=0;j<s.length;j++){
      var px=x+j/(s.length-1)*w;
      var py=y+h-(s[j]-mn)/(mx-mn)*h;
      if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=2;ctx.stroke();
  });
  // Legend
  if(labels){
    ctx.font='10px monospace';
    labels.forEach(function(l,i){
      ctx.fillStyle=colors[i%colors.length];
      ctx.fillRect(x+i*70,y-12,10,8);
      ctx.fillStyle='#e0ffe8';
      ctx.fillText(l,x+i*70+14,y-5);
    });
  }
}
function drawHeatmap(ctx,matrix,x,y,w,h,minV,maxV){
  var n=matrix.length,m=matrix[0].length;
  var cw=w/m,ch=h/n;
  for(var i=0;i<n;i++){
    for(var j=0;j<m;j++){
      var v=matrix[i][j];
      var t=(v-minV)/(maxV-minV||1);
      ctx.fillStyle='hsla('+(240-t*180)+',80%,'+(20+t*50)+'%,'+(0.3+t*0.7)+')';
      ctx.fillRect(x+j*cw,y+i*ch,cw+0.5,ch+0.5);
    }
  }
}

registerModule('align',{title:'Sequence Alignment',icon:'🎯',desc:'Needleman-Wunsch and Smith-Waterman DP.',init:function(){var a=STATE.align;
a.seq1=randomDNA(12,0.5);a.seq2=randomDNA(12,0.5);

compute:function(){var a=STATE.align;
a.result=a.mode==='global'?needlemanWunsch(a.seq1,a.seq2,a.match,a.mismatch,a.gap):smithWaterman(a.seq1,a.seq2,a.match,a.mismatch,a.gap)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var a=STATE.align;var r=a.result;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('SEQUENCE ALIGNMENT — '+(a.mode==='global'?'Needleman-Wunsch':'Smith-Waterman'),30,30);
ctx.fillStyle='#20e0ff';ctx.font='12px monospace';
ctx.fillText('Seq1: '+a.seq1,30,55);
ctx.fillText('Seq2: '+a.seq2,30,72);
/* DP matrix */
var mx=200,my=100;
var cellSize=Math.min(28,(H-200)/(a.seq1.length+1),(W-mx-40)/(a.seq2.length+1));
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('DP MATRIX S[i][j]',30,my-10);
// Find min/max for coloring
var minV=Infinity,maxV=-Infinity;
for(var i=0;i<=a.seq1.length;i++)for(var j=0;j<=a.seq2.length;j++){var v=r.S[i][j];if(v<minV)minV=v;if(v>maxV)maxV=v}
for(var i=0;i<=a.seq1.length;i++){
  for(var j=0;j<=a.seq2.length;j++){
    var x=mx+j*cellSize;
    var y=my+i*cellSize;
    var v=r.S[i][j];
    var t=(v-minV)/(maxV-minV||1);
    ctx.fillStyle='hsla(140,'+(80-t*40)+'%,'+(15+t*60)+'%,0.9)';
    ctx.fillRect(x,y,cellSize,cellSize);
    ctx.strokeStyle='rgba(32,255,128,.2)';ctx.strokeRect(x,y,cellSize,cellSize);
    ctx.fillStyle='#e0ffe8';ctx.font=Math.min(11,cellSize*0.5)+'px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(v,x+cellSize/2,y+cellSize/2);
    ctx.textBaseline='alphabetic';
  }
}
// Row/col headers
ctx.fillStyle='#ff40a0';ctx.font='bold 12px monospace';ctx.textAlign='center';
for(var i=0;i<a.seq1.length;i++)ctx.fillText(a.seq1[i],mx-cellSize/2,my+(i+1)*cellSize+cellSize/2+4);
ctx.fillStyle='#ffd040';
for(var j=0;j<a.seq2.length;j++)ctx.fillText(a.seq2[j],mx+(j+1)*cellSize+cellSize/2,my-cellSize/2+4);
// Highlight traceback path
if(r.T){
  var i2=a.mode==='global'?a.seq1.length:r.startI+ r.a1.replace(/-/g,'').length;
  var j2=a.mode==='global'?a.seq2.length:r.startJ+ r.a2.replace(/-/g,'').length;
  // Actually do simple: for global, start from (n,m). For local, start from max.
  var ci,cj;
  if(a.mode==='global'){ci=a.seq1.length;cj=a.seq2.length}
  else{
    // Find max
    var mxs=-Infinity,mi=0,mj=0;
    for(var i=0;i<=a.seq1.length;i++)for(var j=0;j<=a.seq2.length;j++){if(r.S[i][j]>mxs){mxs=r.S[i][j];mi=i;mj=j}}
    ci=mi;cj=mj;
  }
  ctx.strokeStyle='#ffd040';ctx.lineWidth=2;
  ctx.beginPath();
  while(ci>=0&&cj>=0&&(a.mode==='global'||r.S[ci][cj]>0)){
    var x=mx+cj*cellSize+cellSize/2;
    var y=my+ci*cellSize+cellSize/2;
    if(ci===a.seq1.length&&cj===a.seq2.length)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    var d=r.T[ci][cj];
    if(d==='diag'){ci--;cj--}
    else if(d==='up'){ci--}
    else if(d==='left'){cj--}
    else break;
  }
  ctx.stroke();
}
// Alignment output
ctx.textAlign='left';
var ay=my+(a.seq1.length+1)*cellSize+50;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('ALIGNMENT',30,ay-10);
ctx.fillStyle='#20e0ff';ctx.font='14px monospace';
ctx.fillText(r.a1,30,ay+10);
// Match indicator
var matchLine='';
for(var i=0;i<r.a1.length;i++){
  if(r.a1[i]===r.a2[i])matchLine+='|';
  else if(r.a1[i]==='-'||r.a2[i]==='-')matchLine+=' ';
  else matchLine+='.';
}
ctx.fillStyle='#ffd040';
ctx.fillText(matchLine,30,ay+28);
ctx.fillStyle='#ff40a0';
ctx.fillText(r.a2,30,ay+46);
// Score & stats
ctx.fillStyle='#e0ffe8';ctx.font='12px monospace';
ctx.fillText('Score: '+r.score+'    Match='+a.match+' Mismatch='+a.mismatch+' Gap='+a.gap,30,ay+80);
var matches=0,mismatches=0,gaps=0;
for(var i=0;i<r.a1.length;i++){
  if(r.a1[i]==='-'||r.a2[i]==='-')gaps++;
  else if(r.a1[i]===r.a2[i])matches++;
  else mismatches++;
}
ctx.fillText('Matches: '+matches+'  Mismatches: '+mismatches+'  Gaps: '+gaps+'  Identity: '+fmt(matches/(matches+mismatches+gaps)*100,1)+'%',30,ay+100);
SV('sbLen',a.seq1.length+'×'+a.seq2.length);SV('sbGC','—');SV('sbMode','Alignment');
setStats('<div>Mode: '+a.mode+'</div><div>Score: '+r.score+'</div><div>Identity: '+fmt(matches/(matches+mismatches+gaps)*100,1)+'%</div>');
badge('🎯 Alignment · score='+r.score)},

['global','local'].forEach(function(m){h+='<div class="chip '+(a.mode===m?'active':'')+'" onclick="STATE.align.mode=\''+m+'\';MODULES.align.compute();renderLeftPanel()">'+(m==='global'?'Needleman-Wunsch':'Smith-Waterman')+'</div>'});

/* ══════ 4. PHYLOGENY ══════ */
registerModule('phylo',{title:'Phylogenetic Tree',icon:'🌳',desc:'UPGMA clustering from sequence distances.',init:function(){this.build()},
build:function(){var p=STATE.phylo;
p.seqs=[];
var template=randomDNA(p.seqLen,0.5);
for(var i=0;i<p.n;i++){
  var mut=Math.random()*0.3;
  var s='';
  for(var j=0;j<p.seqLen;j++){
    s+=Math.random()<mut?randomChoice(['A','T','G','C']):template[j];
  }
  p.seqs.push({name:'Seq'+i,seq:s});
}
// Distance matrix (hamming or p-distance)
p.matrix=[];
for(var i=0;i<p.n;i++){
  p.matrix.push([]);
  for(var j=0;j<p.n;j++){
    if(i===j){p.matrix[i].push(0);continue}
    var diff=0;
    for(var k=0;k<p.seqLen;k++)if(p.seqs[i].seq[k]!==p.seqs[j].seq[k])diff++;
    p.matrix[i].push(diff/p.seqLen);
  }
}
// UPGMA
var clusters=p.seqs.map(function(s,i){return {id:i,name:s.name,size:1,children:null,height:0}});
var active=clusters.slice();
while(active.length>1){
  var minD=Infinity,mini=0,minj=1;
  for(var i=0;i<active.length;i++)for(var j=i+1;j<active.length;j++){
    var d=this.clusterDist(active[i],active[j],p);
    if(d<minD){minD=d;mini=i;minj=j}
  }
  var newCluster={
    id:'c'+clusters.length,
    name:'',
    size:active[mini].size+active[minj].size,
    children:[active[mini],active[minj]],
    height:minD/2
  };
  clusters.push(newCluster);
  active.splice(Math.max(mini,minj),1);
  active.splice(Math.min(mini,minj),1);
  active.push(newCluster);
}
p.tree=active[0];
// store cluster distances
p.clusterDists={};
for(var i=0;i<clusters.length;i++)for(var j=0;j<clusters.length;j++){
  if(clusters[i].children===null||clusters[j].children===null){p.clusterDists[clusters[i].id+'_'+clusters[j].id]=0;continue}
  p.clusterDists[clusters[i].id+'_'+clusters[j].id]=0;
}
// Better: compute distance between two clusters recursively as average of leaf distances
function avgDist(a,b){
  if(!a.children&&!b.children){return p.matrix[a.id][b.id]}
  var aLeaves=a.children?null:[a];
  if(!aLeaves){aLeaves=a.children[0].children?[]:[a.children[0],a.children[1]]}
  var bLeaves=b.children?null:[b];
  if(!bLeaves){bLeaves=b.children[0].children?[]:[b.children[0],b.children[1]]}
  var sum=0,cnt=0;
  aLeaves.forEach(function(al){bLeaves.forEach(function(bl){sum+=p.matrix[al.id][bl.id];cnt++})});
  return sum/cnt;
}
},
clusterDist:function(c1,c2,p){
  // Get leaves of each
  function leaves(c){if(!c.children)return [c];return leaves(c.children[0]).concat(leaves(c.children[1]))}
  var L1=leaves(c1),L2=leaves(c2);
  var sum=0,cnt=0;
  L1.forEach(function(a){L2.forEach(function(b){sum+=p.matrix[a.id][b.id];cnt++})});
  return sum/cnt;
},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var p=STATE.phylo;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('PHYLOGENETIC TREE (UPGMA)',30,30);
/* Layout tree */
function layout(node,depth,x0,x1,y){
  // count leaves
}
var leaves=[];
function collectLeaves(n,out){if(!n.children){out.push(n);return}collectLeaves(n.children[0],out);collectLeaves(n.children[1],out)}
collectLeaves(p.tree,leaves);
var leafY={};
leaves.forEach(function(l,i){leafY[l.id]=i});
/* Draw tree in left half */
var px=30,py=100,pw=W*0.55,ph=H-160;
var rowH=ph/leaves.length;
// Compute x for each cluster based on height
var maxH=0;
function maxHeight(n){if(!n.children)return n.height;return Math.max(n.height,Math.max(maxHeight(n.children[0]),maxHeight(n.children[1])))}
maxH=maxHeight(p.tree)||1;
function drawNode(node){
  if(!node.children){
    // leaf
    var y=py+leafY[node.id]*rowH+rowH/2;
    ctx.fillStyle='#20e0ff';
    ctx.beginPath();ctx.arc(px+node.height/maxH*pw,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e0ffe8';ctx.font='11px monospace';
    ctx.fillText(node.name,px+node.height/maxH*pw+10,y+4);
    return {x:px+node.height/maxH*pw,y:y};
  }
  var a=drawNode(node.children[0]);
  var b=drawNode(node.children[1]);
  var x=px+node.height/maxH*pw;
  var y=(a.y+b.y)/2;
  ctx.strokeStyle='#20ff80';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x,a.y);ctx.lineTo(a.x,a.y);
  ctx.moveTo(x,b.y);ctx.lineTo(b.x,b.y);
  ctx.moveTo(x,a.y);ctx.lineTo(x,b.y);
  ctx.stroke();
  ctx.fillStyle='#ffd040';
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();

registerModule('popgen',{title:'Population Genetics',icon:'👥',desc:'Wright-Fisher drift + Hardy-Weinberg + selection.',init:function(){this.reset()},
reset:function(){var p=STATE.popgen;
p.loci=[];
for(var i=0;i<p.nLoci;i++){
  var f=p.p0;
  p.loci.push({freq:f,history:[f],fixed:false,fixedAt:null});
}
p.generations=0;p.history=[[p.p0,1-p.p0,0]];p.fixedCount=0},
step:function(){var p=STATE.popgen;
var N=p.N;
p.loci.forEach(function(l){
  if(l.fixed)return;
  // Selection then drift
  var f=l.freq;
  var s=p.s;
  var wAA=1+s, wAa=1+s*0.5, waa=1;
  var pF=f,qF=1-f;
  var wBar=pF*pF*wAA+2*pF*qF*wAa+qF*qF*waa;
  var pSel=(pF*pF*wAA+pF*qF*wAa)/wBar;
  // Wright-Fisher sampling from 2N alleles
  var alleles=0;
  for(var i=0;i<2*N;i++){
    if(Math.random()<pSel)alleles++;
  }
  f=alleles/(2*N);
  l.freq=f;
  l.history.push(f);
  if(f===0||f===1){l.fixed=true;l.fixedAt=p.generations;l.freq=f}
});
p.generations++;
p.fixedCount=p.loci.filter(function(l){return l.fixed}).length;
// Aggregate stats
var mean=0,het=0;
p.loci.forEach(function(l){mean+=l.freq;het+=2*l.freq*(1-l.freq)});
mean/=p.nLoci;het/=p.nLoci;
p.history.push([mean,1-mean,het]);
if(p.history.length>500)p.history.shift()},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*4;var k=0;while(this._acc>=1&&k<3){this.step();this._acc-=1;k++}},

ctx.fillStyle='#20e0ff';ctx.font='12px monospace';
ctx.fillText('N='+p.N+' · '+p.nLoci+' loci · s='+fmt(p.s,3)+' · gen='+p.generations,30,55);

p.loci.forEach(function(l,li){
  if(l.history.length<2)return;

  }

/* Reference lines at 0 and 1 */
ctx.strokeStyle='rgba(255,64,160,.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);

p.loci.forEach(function(l){meanF+=l.freq;het+=2*l.freq*(1-l.freq)});
meanF/=p.nLoci;het/=p.nLoci;

registerModule('epidemic',{title:'Epidemic Modeling',icon:'🦠',desc:'SIR/SEIR compartmental models with RK4.',init:function(){this.reset()},
reset:function(){var e=STATE.epidemic;
if(e.mode==='SIR'){e.y=[e.S-1,1,0];e.labels=['S','I','R'];e.colors=['#20e0ff','#ff40a0','#40ff90']}

e.t=0;e.history=[e.y.slice()]},
deriv:function(y){var e=STATE.epidemic;
if(e.mode==='SIR'){

  var dS=-e.beta*S*I/e.N;

  var dI=e.sigma*E-e.gamma*I;
  var dR=e.gamma*I;
  return [dS,dE,dI,dR];
}
},

registerModule('folding',{title:'Protein Folding',icon:'📦',desc:'HP 2D lattice model with Monte Carlo.',init:function(){this.reset()},
reset:function(){var f=STATE.folding;
// Random HP sequence
f.seq='';
for(var i=0;i<f.n;i++)f.seq+=Math.random()<0.5?'H':'P';
// Random self-avoiding walk on 2D lattice
f.lattice=[];
var x=0,y=0;f.lattice.push([0,0]);
var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
var prev=null;
for(var i=1;i<f.n;i++){
  var candidates=[];
  for(var d=0;d<4;d++){
    var nx=x+dirs[d][0],ny=y+dirs[d][1];
    var occupied=false;
    for(var j=0;j<f.lattice.length;j++){
      if(f.lattice[j][0]===nx&&f.lattice[j][1]===ny){occupied=true;break}
    }
    if(!occupied)candidates.push([nx,ny]);
  }
  if(candidates.length===0){f.n=i;break}
  var c=randomChoice(candidates);
  f.lattice.push(c);x=c[0];y=c[1];
}
f.n=f.lattice.length;
f.energy=this.computeEnergy(f.lattice,f.seq);
f.steps=0;f.history=[f.energy]},
computeEnergy:function(lattice,seq){
  var e=0;
  for(var i=0;i<lattice.length;i++){
    if(seq[i]!=='H')continue;
    for(var j=i+1;j<lattice.length;j++){
      if(seq[j]!=='H')continue;
      var dx=Math.abs(lattice[i][0]-lattice[j][0]);
      var dy=Math.abs(lattice[i][1]-lattice[j][1]);
      if(dx+dy===1)e-=1;
    }
  }
  return e},
step:function(){var f=STATE.folding;
// Monte Carlo: try pivot move
var i=rnd(1,f.lattice.length-1);
var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
var dir=randomChoice(dirs);
// Try to move tail from position i in direction dir (rotation of suffix)
var oldSuffix=[];
for(var j=i;j<f.lattice.length;j++)oldSuffix.push(f.lattice[j]);
var dx=dir[0],dy=dir[1];
var newLattice=f.lattice.slice(0,i);
// Reflect suffix: for simplicity, just jiggle last point
// Try: move last point (simple end move)
var last=f.lattice[f.lattice.length-1];
var prevP=f.lattice[f.lattice.length-2];
var newLast=[prevP[0]+dir[0],prevP[1]+dir[1]];
// Check self-avoidance
var collide=false;
for(var k=0;k<f.lattice.length-1;k++){
  if(f.lattice[k][0]===newLast[0]&&f.lattice[k][1]===newLast[1]){collide=true;break}
}
if(collide)return;
var oldEnergy=this.computeEnergy(f.lattice,f.seq);
var testLattice=f.lattice.slice();testLattice[testLattice.length-1]=newLast;
var newEnergy=this.computeEnergy(testLattice,f.seq);
var dE=newEnergy-oldEnergy;
var accept=false;
if(dE<=0)accept=true;
else if(Math.random()<Math.exp(-dE/f.temp))accept=true;
if(accept){
  f.lattice=testLattice;
  f.energy=newEnergy;
}
f.steps++;
f.history.push(f.energy);
if(f.history.length>500)f.history.shift()},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*30;var k=0;while(this._acc>=1&&k<10){this.step();this._acc-=1;k++}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var f=STATE.folding;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('PROTEIN FOLDING — HP Lattice Model',30,30);
/* Compute bounds */
var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
f.lattice.forEach(function(p){if(p[0]<minX)minX=p[0];if(p[0]>maxX)maxX=p[0];if(p[1]<minY)minY=p[1];if(p[1]>maxY)maxY=p[1]});
var spanX=Math.max(maxX-minX+1,1),spanY=Math.max(maxY-minY+1,1);
var cell=Math.min((W-120)/spanX,(H-260)/spanY,40);
var cx=(W-cell*spanX)/2;
var cy=100;
/* Draw H-H contacts (favorable) */
for(var i=0;i<f.lattice.length;i++){
  if(f.seq[i]!=='H')continue;
  for(var j=i+1;j<f.lattice.length;j++){
    if(f.seq[j]!=='H')continue;
    var dx=Math.abs(f.lattice[i][0]-f.lattice[j][0]);
    var dy=Math.abs(f.lattice[i][1]-f.lattice[j][1]);
    if(dx+dy===1){
      var x1=cx+(f.lattice[i][0]-minX)*cell+cell/2;
      var y1=cy+(f.lattice[i][1]-minY)*cell+cell/2;
      var x2=cx+(f.lattice[j][0]-minX)*cell+cell/2;
      var y2=cy+(f.lattice[j][1]-minY)*cell+cell/2;
      ctx.strokeStyle='rgba(255,64,160,.7)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
}
/* Backbone */
ctx.strokeStyle='#20e0ff';ctx.lineWidth=2;
ctx.beginPath();
f.lattice.forEach(function(p,i){
  var x=cx+(p[0]-minX)*cell+cell/2;
  var y=cy+(p[1]-minY)*cell+cell/2;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Monomers */
f.lattice.forEach(function(p,i){
  var x=cx+(p[0]-minX)*cell+cell/2;
  var y=cy+(p[1]-minY)*cell+cell/2;
  var col=f.seq[i]==='H'?'#ffd040':'#20e0ff';
  ctx.fillStyle=col+'88';
  ctx.beginPath();ctx.arc(x,y,cell*0.3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#000';ctx.font='bold '+Math.min(14,cell*0.4)+'px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(f.seq[i],x,y);
  ctx.textBaseline='alphabetic';
});
ctx.textAlign='left';
/* Sequence */
var sy=cy+spanY*cell+40;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('SEQUENCE ('+f.seq.length+' aa)',30,sy);
ctx.font='12px monospace';
for(var i=0;i<f.seq.length;i++){
  ctx.fillStyle=f.seq[i]==='H'?'#ffd040':'#20e0ff';
  ctx.fillText(f.seq[i],30+i*10,sy+20);
}
/* Legend */
ctx.fillStyle='#e0ffe8';ctx.font='11px monospace';
ctx.fillText('H = Hydrophobic (favorable contacts)',30,sy+45);
ctx.fillText('P = Polar/neutral',30,sy+62);
/* Energy chart */
var ey=sy+90;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('ENERGY OVER TIME',30,ey);
drawSparkline(ctx,30,ey+10,W-80,120,f.history,'#ff40a0',true);
SV('sbLen',f.n);SV('sbGC','—');SV('sbMode','Folding');SV('sbIter',f.steps);
setStats('<div>Length: '+f.n+' aa</div><div>Energy: '+f.energy+'</div><div>H contacts: '+(-f.energy)+'</div><div>Steps: '+f.steps+'</div>');
badge('📦 Folding · E='+f.energy)},
onDown:function(){},
controls:function(){var f=STATE.folding;var h='<div class="sec"><h4>Parameters</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Sequence length</span><span>'+f.n+' aa</span></div><input type="range" min="8" max="40" value="'+f.n+'" oninput="STATE.folding.n=parseInt(this.value);MODULES.folding.reset();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Temperature T</span><span>'+fmt(f.temp,2)+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+f.temp+'" oninput="STATE.folding.temp=parseFloat(this.value)"></div>';
h+='</div>';
h+='<div class="sec"><h4>Sequence</h4>';
h+='<div class="ctrl"><input type="text" value="'+attr(f.seq)+'" onchange="STATE.folding.seq=this.value.toUpperCase().replace(/[^HP]/g,\'\');MODULES.folding.reset();renderLeftPanel()"></div>';
h+='</div>';
h+='<button class="btn primary full" onclick="MODULES.folding.reset();toast(\'New chain\',\'success\')">🎲 New random chain</button>';
h+='<button class="btn full sm" style="margin-top:4px" onclick="for(var i=0;i<1000;i++)MODULES.folding.step();toast(\'1000 steps\',\'success\')">⚡ 1000 steps</button>';
return h},
mathPanel:function(){return '<div class="sec"><h4>HP Model</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">Dill (1985)<br><br>2 tipos de resíduos:<br>H (hidrofóbico) — interage<br>P (polar) — não interage<br><br>Energia: −1 por par H-H adjacente<br><br>Metropolis: aceita se ΔE≤0<br>ou com prob e^(−ΔE/T)</div></div>'}});

<script>
/* ══════ 8. MOLECULAR DYNAMICS ══════ */
registerModule('md',{title:'Molecular Dynamics',icon:'⚛',desc:'Lennard-Jones particles with velocity Verlet.',init:function(){this.reset()},
reset:function(){var m=STATE.md;m.particles=[];m.velocities=[];m.history=[];m.energyHistory=[];
for(var i=0;i<m.n;i++){
  m.particles.push({
    x:Math.random()*m.L,y:Math.random()*m.L,
    fx:0,fy:0
  });
  // Maxwell-Boltzmann-like
  m.velocities.push({vx:randn()*0.3,vy:randn()*0.3});
}
m.history.push(m.particles.map(function(p){return [p.x,p.y]}))},
step:function(){var m=STATE.md;
var dt=m.dt;
// Zero forces
m.particles.forEach(function(p){p.fx=0;p.fy=0});
var potential=0;
// Lennard-Jones forces
for(var i=0;i<m.n;i++){
  for(var j=i+1;j<m.n;j++){
    var dx=m.particles[j].x-m.particles[i].x;
    var dy=m.particles[j].y-m.particles[i].y;
    if(m.usePBC){
      if(dx>m.L/2)dx-=m.L;if(dx<-m.L/2)dx+=m.L;
      if(dy>m.L/2)dy-=m.L;if(dy<-m.L/2)dy+=m.L;
    }
    var r2=dx*dx+dy*dy;
    if(r2<0.0001)r2=0.0001;
    var r=Math.sqrt(r2);
    var sr6=Math.pow(m.sigma/r,6);
    var sr12=sr6*sr6;
    potential+=4*m.eps*(sr12-sr6);
    var force=24*m.eps*(2*sr12-sr6)/r2;
    m.particles[i].fx-=force*dx;
    m.particles[i].fy-=force*dy;
    m.particles[j].fx+=force*dx;
    m.particles[j].fy+=force*dy;
  }
}
// Velocity Verlet
var kinetic=0;
for(var i=0;i<m.n;i++){
  var v=m.velocities[i];
  v.vx+=m.particles[i].fx*dt*0.5;
  v.vy+=m.particles[i].fy*dt*0.5;
  m.particles[i].x+=v.vx*dt;
  m.particles[i].y+=v.vy*dt;
  if(m.usePBC){
    if(m.particles[i].x<0)m.particles[i].x+=m.L;
    if(m.particles[i].x>=m.L)m.particles[i].x-=m.L;
    if(m.particles[i].y<0)m.particles[i].y+=m.L;
    if(m.particles[i].y>=m.L)m.particles[i].y-=m.L;
  }
  v.vx+=m.particles[i].fx*dt*0.5;
  v.vy+=m.particles[i].fy*dt*0.5;
  kinetic+=0.5*(v.vx*v.vx+v.vy*v.vy);
}
// Thermostat (simple velocity rescaling)
var targetT=m.temp;
var currentT=kinetic/m.n;
if(currentT>0.001){
  var scale=Math.sqrt(targetT/currentT);
  scale=1+(scale-1)*0.05;
  for(var i=0;i<m.n;i++){m.velocities[i].vx*=scale;m.velocities[i].vy*=scale}
}
m.energyHistory.push(potential+kinetic);
if(m.energyHistory.length>500)m.energyHistory.shift()},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*200;var k=0;while(this._acc>=1&&k<20){this.step();this._acc-=1;k++}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var m=STATE.md;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('MOLECULAR DYNAMICS — Lennard-Jones',30,30);
/* Simulation box */
var sz=Math.min(W-80,H-200);
var px=(W-sz)/2,py=80;
ctx.strokeStyle='#20ff80';ctx.lineWidth=2;
ctx.strokeRect(px,py,sz,sz);
ctx.fillStyle='rgba(4,18,10,.4)';ctx.fillRect(px,py,sz,sz);
/* Particles with velocity coloring */
m.particles.forEach(function(p,i){
  var v=m.velocities[i];
  var speed=Math.hypot(v.vx,v.vy);
  var x=px+p.x/m.L*sz;
  var y=py+p.y/m.L*sz;
  // Draw particle
  var g=ctx.createRadialGradient(x,y,0,x,y,m.sigma*sz/m.L*2);
  g.addColorStop(0,'rgba(32,255,128,'+(0.4+speed*0.5)+')');
  g.addColorStop(1,'rgba(32,255,128,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(x,y,m.sigma*sz/m.L*2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#20ff80';
  ctx.beginPath();ctx.arc(x,y,Math.max(2,m.sigma*sz/m.L*0.8),0,Math.PI*2);ctx.fill();
  // Velocity vector
  ctx.strokeStyle='rgba(32,224,255,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+v.vx*20,y+v.vy*20);ctx.stroke();
});
/* Energy chart */
var ey=py+sz+40;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('TOTAL ENERGY',30,ey);
if(ey+100<H)drawSparkline(ctx,30,ey+10,W-80,Math.min(100,H-ey-30),m.energyHistory,'#ffd040',true);
SV('sbLen',m.n+' particles');SV('sbGC','—');SV('sbMode','MD');
var totalE=m.energyHistory[m.energyHistory.length-1]||0;
setStats('<div>N: '+m.n+'</div><div>L: '+m.L+'</div><div>E: '+fmt(totalE,2)+'</div><div>T*: '+m.temp+'</div>');
badge('⚛ MD · '+m.n+' particles')},
onDown:function(){},
controls:function(){var m=STATE.md;var h='<div class="sec"><h4>System</h4>';
h+='<div class="ctrl"><div class="lbl"><span>N particles</span><span>'+m.n+'</span></div><input type="range" min="10" max="150" step="5" value="'+m.n+'" oninput="STATE.md.n=parseInt(this.value);MODULES.md.reset();renderLeftPanel()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>σ (size)</span><span>'+fmt(m.sigma,3)+'</span></div><input type="range" min="0.15" max="0.5" step="0.01" value="'+m.sigma+'" oninput="STATE.md.sigma=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>ε (strength)</span><span>'+fmt(m.eps,2)+'</span></div><input type="range" min="0.1" max="3" step="0.1" value="'+m.eps+'" oninput="STATE.md.eps=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>dt</span><span>'+fmt(m.dt,4)+'</span></div><input type="range" min="0.001" max="0.02" step="0.001" value="'+m.dt+'" oninput="STATE.md.dt=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>T (target)</span><span>'+fmt(m.temp,2)+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+m.temp+'" oninput="STATE.md.temp=parseFloat(this.value)"></div>';
h+='<div class="chip '+(m.usePBC?'active':'')+'" onclick="STATE.md.usePBC=!STATE.md.usePBC;renderLeftPanel()">Periodic BC: '+(m.usePBC?'ON':'OFF')+'</div>';
h+='</div>';
h+='<button class="btn primary full" onclick="MODULES.md.reset();toast(\'Reset\',\'success\')">🎲 Reset system</button>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Lennard-Jones</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">V(r) = 4ε[(σ/r)¹² − (σ/r)⁶]<br><br>F = −dV/dr<br><br>Verlet:<br>v(t+dt/2) = v + F/m·dt/2<br>x(t+dt) = x + v(t+dt/2)·dt</div></div>'}});

/* ══════ 9. ENZYME KINETICS ══════ */
registerModule('enzyme',{title:'Enzyme Kinetics',icon:'⚙',desc:'Michaelis-Menten + inhibition.',init:function(){this.reset()},
reset:function(){var e=STATE.enzyme;e.S=10;e.product=0;e.t=0;e.history=[];
if(e.mode==='progress')e.history=[{t:0,S:e.S,P:0}]},
deriv:function(y){var e=STATE.enzyme;
var S=y[0],P=y[1];
var Vmax=e.Vmax;
var KmEff=e.Km;
if(e.inhibitor==='competitive')KmEff=e.Km*(1+e.I/e.Ki);
else if(e.inhibitor==='noncompetitive')Vmax=e.Vmax/(1+e.I/e.Ki);
var v=Vmax*S/(KmEff+S);
return [-v,v];
},
step:function(){var e=STATE.enzyme;
if(e.mode==='progress'){
  var dt=0.02;
  var y=rk4([e.S,e.product],e.t,dt,this.deriv.bind(this));
  e.S=Math.max(0,y[0]);e.product=y[1];e.t+=dt;
  e.history.push({t:e.t,S:e.S,P:e.product});
  if(e.history.length>2000)e.history.shift();
  if(e.S<0.001&&e.product>e.Vmax*0.5){/* complete */}
}},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*20;var k=0;while(this._acc>=1&&k<4){this.step();this._acc-=1;k++}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var e=STATE.enzyme;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('ENZYME KINETICS — Michaelis-Menten',30,30);
/* Progress curve */
var px=40,py=100,pw=W-80,ph=H/2-80;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('PROGRESS CURVE',30,py-10);
ctx.fillStyle='rgba(4,18,10,.6)';ctx.fillRect(px,py,pw,ph);
ctx.strokeStyle='rgba(32,255,128,.3)';ctx.strokeRect(px,py,pw,ph);
var series=[e.history.map(function(h){return h.S}),e.history.map(function(h){return h.P})];
drawMultiSeries(ctx,px+10,py+20,pw-20,ph-40,series,['#20e0ff','#ff40a0'],['Substrate','Product']);
ctx.fillStyle='#a0c0b0';ctx.font='10px monospace';
ctx.fillText('Time',px+pw/2,py+ph-10);
/* Michaelis-Menten curve */
var my=py+ph+60;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('MICHAELIS-MENTEN CURVE  v = Vmax·[S]/(Km+[S])',30,my-10);
var vw=W-80,vh=200;
var KmEff=e.Km;
var VmaxEff=e.Vmax;
if(e.inhibitor==='competitive')KmEff=e.Km*(1+e.I/e.Ki);
else if(e.inhibitor==='noncompetitive')VmaxEff=e.Vmax/(1+e.I/e.Ki);
var maxS=e.Km*10;
var maxV=VmaxEff*1.1;
// Axes
ctx.strokeStyle='#20ff80';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(60,my+vh);ctx.lineTo(60+vw,my+vh);
ctx.moveTo(60,my+vh);ctx.lineTo(60,my+20);ctx.stroke();
// Curve
ctx.strokeStyle='#20ff80';ctx.lineWidth=2.5;
ctx.beginPath();
for(var i=0;i<=100;i++){
  var S=maxS*i/100;
  var v=VmaxEff*S/(KmEff+S);
  var x=60+S/maxS*vw;
  var y=my+vh-v/maxV*vh;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.stroke();
// Km and Vmax markers
var xKm=60+KmEff/maxS*vw;
var yVmax=my+vh-VmaxEff/maxV*vh;
ctx.strokeStyle='#ff40a0';ctx.lineWidth=1;ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(xKm,my+vh);ctx.lineTo(xKm,yVmax);
ctx.moveTo(60,yVmax);ctx.lineTo(xKm,yVmax);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ff40a0';ctx.font='10px monospace';
ctx.fillText('Km = '+fmt(KmEff,2),xKm+4,my+vh-4);
ctx.fillStyle='#20e0ff';
ctx.fillText('Vmax = '+fmt(VmaxEff,2),64,yVmax+3);
ctx.fillStyle='#a0c0b0';
ctx.fillText('[S]',60+vw-20,my+vh+15);
ctx.fillText('v',40,my+30);
/* Lineweaver-Burk (double reciprocal) */
var lx=60+vw+80,ly=my+20;
if(lx+300<W){
  ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
  ctx.fillText('Lineweaver-Burk (1/v vs 1/[S])',lx,ly-10);
  var lbW=260,lbH=150;
  ctx.strokeStyle='rgba(32,255,128,.3)';ctx.strokeRect(lx,ly,lbW,lbH);
  // Line: 1/v = (Km/Vmax)(1/S) + 1/Vmax
  var xIntercept=-1/KmEff;
  var yIntercept=1/VmaxEff;
  var slope=KmEff/VmaxEff;
  // Plot 1/S in [0, 2/Km]
  var maxInvS=2/KmEff;
  var maxInvV=slope*maxInvS+yIntercept;
  ctx.strokeStyle='#20e0ff';ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<=20;i++){
    var invS=maxInvS*i/20;
    var invV=slope*invS+yIntercept;
    var x=lx+invS/maxInvS*lbW;
    var y=ly+lbH-invV/maxInvV*lbH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // Intercepts
  ctx.fillStyle='#ff40a0';ctx.font='10px monospace';
  ctx.fillText('1/Vmax = '+fmt(yIntercept,2),lx+4,ly+lbH-yIntercept/maxInvV*lbH-4);
  ctx.fillStyle='#ffd040';
  ctx.fillText('x-int = -1/Km',lx+4,ly+lbH-4);
}
/* Current state */
var sy=my+vh+40;
ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';
ctx.fillText('STATE (t='+fmt(e.t,2)+')',30,sy);
ctx.fillStyle='#e0ffe8';ctx.font='12px monospace';
ctx.fillText('[S] = '+fmt(e.S,3)+'    [P] = '+fmt(e.product,3)+'    v = '+fmt(VmaxEff*e.S/(KmEff+e.S),4),30,sy+20);
SV('sbLen',fmt(e.t,1));SV('sbGC','—');SV('sbMode','Enzyme');SV('sbIter',e.history.length);
setStats('<div>[S]: '+fmt(e.S,2)+'</div><div>[P]: '+fmt(e.product,2)+'</div><div>Km: '+fmt(KmEff,3)+'</div><div>Vmax: '+fmt(VmaxEff,3)+'</div>');
badge('⚙ Enzyme · [S]='+fmt(e.S,1))},
onDown:function(){},
controls:function(){var e=STATE.enzyme;var h='<div class="sec"><h4>Enzyme</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Vmax</span><span>'+fmt(e.Vmax,2)+'</span></div><input type="range" min="0.1" max="3" step="0.05" value="'+e.Vmax+'" oninput="STATE.enzyme.Vmax=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Km</span><span>'+fmt(e.Km,2)+'</span></div><input type="range" min="0.05" max="3" step="0.05" value="'+e.Km+'" oninput="STATE.enzyme.Km=parseFloat(this.value)"></div>';
h+='<div class="ctrl"><div class="lbl"><span>[S]₀ initial</span><span>'+fmt(e.S,2)+'</span></div><input type="range" min="0.5" max="30" step="0.5" value="'+e.S+'" oninput="STATE.enzyme.S=parseFloat(this.value);STATE.enzyme.product=0;STATE.enzyme.t=0;STATE.enzyme.history=[{t:0,S:STATE.enzyme.S,P:0}];renderLeftPanel()"></div>';
h+='</div>';
h+='<div class="sec"><h4>Inhibition</h4><div class="chip-row">';
['none','competitive','noncompetitive'].forEach(function(m){h+='<div class="chip '+(e.inhibitor===m?'active':'')+'" onclick="STATE.enzyme.inhibitor=\''+m+'\';renderLeftPanel()">'+m+'</div>'});
h+='</div>';
if(e.inhibitor!=='none'){
  h+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>[I]</span><span>'+fmt(e.I,2)+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+e.I+'" oninput="STATE.enzyme.I=parseFloat(this.value);renderLeftPanel()"></div>';
  h+='<div class="ctrl"><div class="lbl"><span>Ki</span><span>'+fmt(e.Ki,2)+'</span></div><input type="range" min="0.1" max="5" step="0.1" value="'+e.Ki+'" oninput="STATE.enzyme.Ki=parseFloat(this.value);renderLeftPanel()"></div>';
}
h+='</div>';

registerModule('grn',{title:'Gene Network',icon:'🔗',desc:'Repressilator and toggle switch ODEs.',init:function(){this.reset()},
reset:function(){var g=STATE.grn;
g.t=0;g.history=[];
if(g.mode==='repressilator'){
  g.state=[1,0.5,0.2,1,0.5,0.2]; // m1,p1,m2,p2,m3,p3
}else{
  g.state=[1,0.2,1,0.2]; // m1,p1,m2,p2
}
},
deriv:function(y){var g=STATE.grn;
if(g.mode==='repressilator'){
  // Elowitz-Leibler repressilator
  var m1=y[0],p1=y[1],m2=y[2],p2=y[3],m3=y[4],p3=y[5];
  var a=g.alpha,b=g.beta,n=g.n;
  var dm1=-m1+a/(1+Math.pow(p3,n));
  var dp1=b*(m1-p1);
  var dm2=-m2+a/(1+Math.pow(p1,n));
  var dp2=b*(m2-p2);
  var dm3=-m3+a/(1+Math.pow(p2,n));
  var dp3=b*(m3-p3);
  return [dm1,dp1,dm2,dp2,dm3,dp3];
}else{
  // Toggle switch
  var u=y[0],v=y[1]; // protein concentrations
  var a=g.alpha,b=g.beta,n=g.n;
  var du=a/(1+Math.pow(v,n))-u;
  var dv=a/(1+Math.pow(u,n))-v;
  return [du,dv];
}
},
step:function(){var g=STATE.grn;var dt=0.05;
for(var i=0;i<3;i++){
  g.state=rk4(g.state,g.t,dt,this.deriv.bind(this));
  g.t+=dt;
}
g.history.push(g.state.slice());
if(g.history.length>3000)g.history.shift()},

registerModule('hh',{title:'Hodgkin-Huxley',icon:'⚡',desc:'Full neuron action potential model.',init:function(){this.reset()},
reset:function(){var h=STATE.hh;
h.V=-65;h.m=0.05;h.h=0.6;h.n=0.3;h.t=0;h.history=[{t:0,V:-65,m:0.05,h:0.6,n:0.3}];
h.spikes=[];h.lastSpikeTime=-100},
deriv:function(y){var h=STATE.hh;
var V=y[0],m=y[1],hh=y[2],n=y[3];
// Standard HH parameters (squid axon)
var gNa=120,gK=36,gL=0.3;
var ENa=50,EK=-77,EL=-54.387;
var Cm=1;
// Gating variable steady states
function alphaM(V){return 0.1*(V+40)/(1-Math.exp(-(V+40)/10))}
function betaM(V){return 4*Math.exp(-(V+65)/18)}
function alphaH(V){return 0.07*Math.exp(-(V+65)/20)}
function betaH(V){return 1/(1+Math.exp(-(V+35)/10))}
function alphaN(V){return 0.01*(V+55)/(1-Math.exp(-(V+55)/10))}
function betaN(V){return 0.125*Math.exp(-(V+65)/80)}
var am=alphaM(V),bm=betaM(V);
var ah=alphaH(V),bh=betaH(V);
var an=alphaN(V),bn=betaN(V);
// Currents
var INa=gNa*Math.pow(m,3)*hh*(V-ENa);
var IK=gK*Math.pow(n,4)*(V-EK);
var IL=gL*(V-EL);
var Iext=h.Iext;
var dV=(Iext-INa-IK-IL)/Cm;
var dm=am*(1-m)-bm*m;
var dh=ah*(1-hh)-bh*hh;
var dn=an*(1-n)-bn*n;
return [dV,dm,dh,dn];
},
step:function(){var h=STATE.hh;
var dt=0.01;
for(var i=0;i<5;i++){
  var y=rk4([h.V,h.m,h.h,h.n],h.t,dt,this.deriv.bind(this));
  h.V=y[0];h.m=y[1];h.h=y[2];h.n=y[3];h.t+=dt;
  // Spike detection
  if(h.V>0&&h.t-h.lastSpikeTime>5){h.spikes.push(h.t);h.lastSpikeTime=h.t}
}
h.history.push({t:h.t,V:h.V,m:h.m,h:h.h,n:h.n});
if(h.history.length>5000)h.history.shift()},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*50;var k=0;while(this._acc>=1&&k<4){this.step();this._acc-=1;k++}},

/* ══════ 12. SPIKING NEURAL NETWORK ══════ */
registerModule('snn',{title:'Spiking Neural Network',icon:'🧠',desc:'Izhikevich neurons with synaptic connections.',init:function(){this.reset()},
reset:function(){var s=STATE.snn;s.neurons=[];
// 80% excitatory (regular spiking), 20% inhibitory (fast spiking)
for(var i=0;i<s.n;i++){
  var isExc=Math.random()<s.excitatory;
  var params=isExc?{a:0.02,b:0.2,c:-65,d:8,color:'#20e0ff'}:{a:0.1,b:0.2,c:-65,d:2,color:'#ff40a0'};
  s.neurons.push({
    v:-65,u:params.b*-65,
    a:params.a,b:params.b,c:params.c,d:params.d,
    exc:isExc,color:params.color,
    x:Math.random(),y:Math.random(),
    lastSpike:-1000
  });
}
// Random connections
s.synapses=[];
for(var i=0;i<s.n;i++){
  for(var k=0;k<5;k++){
    var j=rnd(0,s.n-1);
    if(i===j)continue;
    s.synapses.push({from:i,to:j,weight:s.neurons[i].exc?randn()*3+3:-randn()*3-3});
  }
}
s.t=0;s.raster=[];s.history=[];s.lastSpikeTime=-1000},
step:function(){var s=STATE.snn;var dt=0.5;s.t+=dt;
// Input noise
for(var i=0;i<s.n;i++){
  var n=s.neurons[i];
  // Izhikevich model
  var I=5*randn();
  if(n.exc)I+=5;
  n.v+=0.04*n.v*n.v+5*n.v+140-n.u+I;
  n.u+=n.a*(n.b*n.v-n.u);
  if(n.v>=30){
    n.v=n.c;n.u+=n.d;
    // Propagate to targets
    s.synapses.forEach(function(syn){
      if(syn.from===i){
        // Add synaptic current to target (delayed by storing in target's pending)
        s.neurons[syn.to].v+=syn.weight;
      }
    });
    // Record spike
    s.raster.push({neuron:i,t:s.t});
    n.lastSpike=s.t;
    if(s.raster.length>5000)s.raster.shift();
  }
}
// Record voltage of first few neurons
if(s.history.length===0||s.t-s.history[s.history.length-1].t>=1){
  s.history.push({t:s.t,v0:s.neurons[0].v,v1:s.neurons[1].v,v2:s.neurons[2].v});
  if(s.history.length>2000)s.history.shift();
}},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;if(!this._acc)this._acc=0;this._acc+=dt*200;var k=0;while(this._acc>=1&&k<10){this.step();this._acc-=1;k++}},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var s=STATE.snn;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('SPIKING NEURAL NETWORK — Izhikevich',30,30);
/* Network layout */
var nx=40,ny=80,nw=W*0.4,nh=H-180;
ctx.fillStyle='rgba(4,18,10,.6)';ctx.fillRect(nx,ny,nw,nh);
ctx.strokeStyle='rgba(32,255,128,.3)';ctx.strokeRect(nx,ny,nw,nh);
ctx.fillStyle='#20ff80';ctx.font='bold 11px monospace';
ctx.fillText('NETWORK TOPOLOGY',nx+8,ny+15);
/* Draw synapses (light) */
ctx.strokeStyle='rgba(32,255,128,.05)';ctx.lineWidth=0.5;
s.synapses.forEach(function(syn){
  var a=s.neurons[syn.from],b=s.neurons[syn.to];
  var x1=nx+a.x*nw,y1=ny+a.y*nh;
  var x2=nx+b.x*nw,y2=ny+b.y*nh;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
});
/* Draw neurons - flash if recent spike */
var now=s.t;
s.neurons.forEach(function(n,i){
  var x=nx+n.x*nw,y=nx+0;
  y=ny+n.y*nh;
  var since=now-n.lastSpike;

registerModule('rnafold',{title:'RNA Folding',icon:'🔷',desc:'Nussinov algorithm for secondary structure.',init:function(){this.reset()},
reset:function(){var r=STATE.rnafold;
r.seq=randomDNA(r.seqLen||30,0.5).replace(/T/g,'U');
this.fold()},
fold:function(){var r=STATE.rnafold;
var seq=r.seq;var n=seq.length;
var minLoop=r.minLoop;
// Nussinov DP
var M=[];
for(var i=0;i<n;i++){M.push(new Array(n).fill(0))}
function canPair(a,b){
  return (a==='A'&&b==='U')||(a==='U'&&a!==b&&b==='A')||(a==='G'&&b==='C')||(a==='C'&&b==='G')||(a==='G'&&b==='U')||(a==='U'&&b==='G');
}
for(var len=minLoop+1;len<=n;len++){
  for(var i=0;i<n-len+1;i++){
    var j=i+len-1;
    var best=M[i][j-1];
    for(var k=i;k<j-minLoop;k++){
      if(canPair(seq[k],seq[j])){
        var val=(k>i?M[i][k-1]:0)+1+(k+1<=j-1?M[k+1][j-1]:0);
        if(val>best)best=val;
      }
    }
    M[i][j]=best;
  }
}
// Traceback
r.pairs=[];
function traceback(i,j){
  while(j>i){
    if(M[i][j]===M[i][j-1]){j--;continue}
    var found=false;
    for(var k=i;k<j-minLoop;k++){
      if(canPair(seq[k],seq[j])){
        var val=(k>i?M[i][k-1]:0)+1+(k+1<=j-1?M[k+1][j-1]:0);
        if(val===M[i][j]){
          r.pairs.push([k,j]);
          traceback(k+1,j-1);
          j=k-1;
          found=true;
          break;
        }
      }
    }
    if(!found)break;
  }
}
if(n>minLoop+1)traceback(0,n-1);
r.energy=-r.pairs.length;
// Build structure string
r.structure=new Array(n).fill('.');
r.pairs.forEach(function(p){r.structure[p[0]]='(';r.structure[p[1]]=')'});
r.structure=r.structure.join('');
r.n=n},

for(var i=0;i<r.n;i++){

  });
}
ctx.textAlign='left';
/* Energy plot */
var ey=130+Math.max(0,(r.n*cellW)/2)+80;
if(ey<H-150){

}
/* Matrix heatmap */
var mx=Math.max(30, W*0.55);

if(cell>2&&mx+cell*r.n<W-20){
  ctx.fillStyle='#20ff80';ctx.font='bold 12px monospace';

  for(var i=0;i<r.n;i++){
    for(var j=0;j<r.n;j++){
      if(j<i){ctx.fillStyle='rgba(20,30,20,.5)';ctx.fillRect(mx+j*cell,my+i*cell,cell,cell)}
      else{
        var v=r.M?r.M[i][j]:0;
      }
    }
  }
  // Matrix not stored; skip
}
SV('sbLen',r.n+' nt');SV('sbGC',fmt(gcContent(r.seq.replace(/U/g,'T'))*100,1)+'%');SV('sbMode','RNA Fold');SV('sbIter',r.pairs.length);
setStats('<div>Length: '+r.n+' nt</div><div>Pairs: '+r.pairs.length+'</div><div>Energy: '+r.energy+'</div>');
badge('🔷 RNA Fold · '+r.pairs.length+' pairs')},

<script>
/* ══════ 15. GENETIC ALGORITHM ══════════ */
registerModule('ga',{title:'Genetic Algorithm',icon:'🎯',desc:'Evolutionary optimization on 2D function.',init:function(){this.reset()},
reset:function(){var g=STATE.ga;
g.population=[];
for(var i=0;i<g.popSize;i++){
  var ind={x:randn()*2,y:randn()*2};
  ind.fitness=this.fitness(ind.x,ind.y);
  g.population.push(ind);
}
g.generations=0;g.fitness=[];
g.population.forEach(function(ind){g.fitness.push(ind.fitness)});
g.best=g.population.reduce(function(a,b){return a.fitness>b.fitness?a:b})},
fitness:function(x,y){
  var g=STATE.ga;
  if(g.target==='sphere')return -(x*x+y*y);
  if(g.target==='rastrigin'){
    var A=10;
    return -(A*2+(x*x-Math.cos(2*Math.PI*x))+(y*y-Math.cos(2*Math.PI*y)));
  }
  if(g.target==='rosenbrock')return -(Math.pow(1-x,2)+100*Math.pow(y-x*x,2));
  if(g.target==='ackley'){
    var a=20,b=0.2,c=2*Math.PI;
    return -( -a*Math.exp(-b*Math.sqrt(0.5*(x*x+y*y))) - Math.exp(0.5*(Math.cos(c*x)+Math.cos(c*y))) + a + Math.E );
  }
  return -(x*x+y*y);
},
step:function(){var g=STATE.ga;
// Sort by fitness
g.population.sort(function(a,b){return b.fitness-a.fitness});
// Elitism
var newPop=[g.population[0],g.population[1]];
// Generate children
while(newPop.length<g.popSize){
  // Tournament selection
  var p1=this.tournament(),p2=this.tournament();
  var child1,child2;
  if(Math.random()<g.crossover){
    var alpha=Math.random();
    child1={x:p1.x*alpha+p2.x*(1-alpha),y:p1.y*alpha+p2.y*(1-alpha)};
    child2={x:p2.x*alpha+p1.x*(1-alpha),y:p2.y*alpha+p1.y*(1-alpha)};
  }else{
    child1={x:p1.x,y:p1.y};
    child2={x:p2.x,y:p2.y};
  }
  // Mutation
  if(Math.random()<g.mutation)child1.x+=randn()*0.5;
  if(Math.random()<g.mutation)child1.y+=randn()*0.5;
  if(Math.random()<g.mutation)child2.x+=randn()*0.5;
  if(Math.random()<g.mutation)child2.y+=randn()*0.5;
  child1.fitness=this.fitness(child1.x,child1.y);

registerModule('mutation',{title:'Mutation & Evolution',icon:'💫',desc:'Mutation accumulation and molecular evolution.',init:function(){this.reset()},
reset:function(){var m=STATE.mutation;
m.origSeq=randomDNA(80,0.5);
m.seq=m.origSeq;

step:function(){var m=STATE.mutation;
var newSeq=m.seq.split('');
var subs=0,transitions=0,transversions=0,indels=0;
// Substitutions
for(var i=0;i<newSeq.length;i++){
  if(Math.random()<m.rate){
    var orig=newSeq[i];
    var choices=['A','T','G','C'].filter(function(x){return x!==orig});
    newSeq[i]=randomChoice(choices);
    subs++;
    // Transition (purine↔purine or pyrimidine↔pyrimidine)
    var purines=['A','G'],pyrimidines=['T','C'];
    if((purines.indexOf(orig)>=0&&purines.indexOf(newSeq[i])>=0)||(pyrimidines.indexOf(orig)>=0&&pyrimidines.indexOf(newSeq[i])>=0))transitions++;
    else transversions++;
  }
}
m.seq=newSeq.join('');
m.generations++;
m.mutations.push({gen:m.generations,subs:subs,transitions:transitions,transversions:transversions});
m.history.push({gen:m.generations,subs:subs,transitions:transitions,transversions:transversions,indels:indels});
if(m.history.length>1000)m.history.shift()},

registerModule('codon',{title:'Codon Usage',icon:'📊',desc:'Codon Adaptation Index and codon bias.',init:function(){this.reset()},
reset:function(){var c=STATE.codon;c.seq=randomDNA(90,0.6);this.compute()},
compute:function(){var c=STATE.codon;
// Build codon usage table
var codons={};
for(var i=0;i+2<c.seq.length;i+=3){
  var codon=c.seq.substr(i,3);
  if(!/^[ATGC]{3}$/.test(codon))continue;
  codons[codon]=(codons[codon]||0)+1;
}
c.table=codons;
// Compute relative adaptiveness (simplified CAI)
// Reference: E. coli preferred codons (rough)
var preferred={
  'TTT':0.5,'TTC':1,'TTA':0.1,'TTG':0.1,'CTT':0.1,'CTC':0.1,'CTA':0.05,'CTG':1,
  'ATT':0.5,'ATC':1,'ATA':0.05,'ATG':1,
  'GTT':0.5,'GTC':0.3,'GTA':0.2,'GTG':1,
  'TCT':0.5,'TCC':0.3,'TCA':0.1,'TCG':0.1,'CCT':0.3,'CCC':0.2,'CCA':0.3,'CCG':1,
  'ACT':0.5,'ACC':1,'ACA':0.1,'ACG':0.1,'GCT':0.5,'GCC':0.5,'GCA':0.3,'GCG':1,
  'TAT':0.5,'TAC':1,'TAA':1,'TAG':0.05,'CAT':0.5,'CAC':1,'CAA':0.3,'CAG':1,
  'AAT':0.3,'AAC':1,'AAA':1,'AAG':0.2,'GAT':0.5,'GAC':1,'GAA':1,'GAG':0.2,
  'TGT':0.5,'TGC':1,'TGA':1,'TGG':1,'CGT':1,'CGC':0.5,'CGA':0.05,'CGG':0.05,
  'AGT':0.1,'AGC':1,'AGA':0.05,'AGG':0.05,'GGT':1,'GGC':0.5,'GGA':0.05,'GGG':0.05
};
// Compute CAI (geometric mean of relative adaptiveness)
var prod=1,n=0;
for(var k in codons){
  if(preferred[k]){
    prod*=preferred[k];
    n++;
  }
}
c.CAI=n>0?Math.pow(prod,1/n):0;
// Also compute per-amino-acid codon usage
c.byAA={};
for(var k in codons){
  var aa=CODON_TABLE[dnaToRNA(k)];
  if(!c.byAA[aa])c.byAA[aa]=[];
  c.byAA[aa].push({codon:k,count:codons[k]});
}
for(var aa in c.byAA){c.byAA[aa].sort(function(a,b){return b.count-a.count})}
},

var RESTRICTION_ENZYMES={
  'EcoRI':{site:'GAATTC',cut:1,color:'#20ff80'},
  'BamHI':{site:'GGATCC',cut:1,color:'#20e0ff'},
  'HindIII':{site:'AAGCTT',cut:1,color:'#ffd040'},
  'PstI':{site:'CTGCAG',cut:5,color:'#ff40a0'},
  'SmaI':{site:'CCCGGG',cut:3,color:'#a060ff'},
  'XbaI':{site:'TCTAGA',cut:1,color:'#ff8040'},
  'SalI':{site:'GTCGAC',cut:1,color:'#40ff90'},
  'NotI':{site:'GCGGCCGC',cut:2,color:'#ff60ff'},
  'SacI':{site:'GAGCTC',cut:5,color:'#40ffd0'},
  'KpnI':{site:'GGTACC',cut:5,color:'#ffb040'}
};
registerModule('restriction',{title:'Restriction Mapping',icon:'🔪',desc:'Find restriction sites and predict digests.',init:function(){this.scan()},
scan:function(){var r=STATE.restriction;
if(!r.seq)r.seq=randomDNA(200,0.5);
r.sites=[];
r.enzymes.forEach(function(name){
  var enz=RESTRICTION_ENZYMES[name];
  if(!enz)return;
  var site=enz.site;
  for(var i=0;i+site.length<=r.seq.length;i++){
    if(r.seq.substr(i,site.length)===site){
      r.sites.push({enzyme:name,pos:i+enz.cut,site:site,color:enz.color});
    }
  }
});
r.sites.sort(function(a,b){return a.pos-b.pos});
// Digest fragments
r.fragments=[];
var positions=[0].concat(r.sites.map(function(s){return s.pos})).concat([r.seq.length]);
for(var i=0;i<positions.length-1;i++){
  r.fragments.push({start:positions[i],end:positions[i+1],len:positions[i+1]-positions[i]});
}
r.fragments.sort(function(a,b){return b.len-a.len})},

/* Linear map */

registerModule('gel',{title:'Gel Electrophoresis',icon:'▮',desc:'Simulate agarose gel separation by size.',init:function(){this.reset()},
reset:function(){var g=STATE.gel;g.lanes=[];g.t=0;g.progress=0;g.running=true;
// Create 4 sample lanes + ladder
g.lanes.push({name:'Ladder',fragments:[10000,8000,6000,5000,4000,3000,2000,1500,1000,500,200],color:'#ffd040'});
g.lanes.push({name:'Sample A',fragments:[5000,3000,1200],color:'#20ff80'});
g.lanes.push({name:'Sample B',fragments:[4500,2500,1000],color:'#20e0ff'});
g.lanes.push({name:'Sample C',fragments:[7000,2000,800,400],color:'#ff40a0'});
g.lanes.push({name:'Digest D',fragments:[3500,3000,2000,900],color:'#a060ff'});
},
tick:function(dt){STATE.time+=dt;if(!STATE.playing)return;var g=STATE.gel;g.t+=dt;g.progress=Math.min(1,g.progress+dt*0.1)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000a05';ctx.fillRect(0,0,W,H);
var g=STATE.gel;
ctx.fillStyle='#20ff80';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('GEL ELECTROPHORESIS — Agarose 1%',30,30);
ctx.fillStyle='#20e0ff';ctx.font='11px monospace';
ctx.fillText('Migration distance ∝ log(MW)  ·  Smaller fragments migrate faster',30,52);
/* Gel frame */
var gx=60,gy=80,gw=W-120,gh=H-160;
ctx.fillStyle='rgba(10,20,15,.9)';ctx.fillRect(gx,gy,gw,gh);
ctx.strokeStyle='#20ff80';ctx.lineWidth=2;ctx.strokeRect(gx,gy,gw,gh);
/* Lane separators */
var laneW=gw/g.lanes.length;
for(var i=0;i<=g.lanes.length;i++){
  ctx.strokeStyle='rgba(32,255,128,.3)';
  ctx.beginPath();ctx.moveTo(gx+i*laneW,gy);ctx.lineTo(gx+i*laneW,gy+gh);ctx.stroke();
}
/* Loading wells */
for(var i=0;i<g.lanes.length;i++){
  var x=gx+i*laneW+laneW/2;
  ctx.fillStyle='rgba(10,30,20,.9)';
  ctx.fillRect(x-15,gy+5,30,12);
  ctx.strokeStyle='#20ff80';ctx.lineWidth=1;ctx.strokeRect(x-15,gy+5,30,12);
}
/* Draw bands */
var maxBp=10000;
var minBp=200;
for(var i=0;i<g.lanes.length;i++){
  var lane=g.lanes[i];
  var x=gx+i*laneW+laneW/2;
  // Sort fragments by size desc (largest migrate slowest)
  var sorted=lane.fragments.slice().sort(function(a,b){return b-a});
  sorted.forEach(function(bp){
    // Migration distance: log scale
    var logBp=Math.log10(bp);
    var logMin=Math.log10(minBp);
    var logMax=Math.log10(maxBp);
    var t=(logMax-logBp)/(logMax-logMin); // 0=slow (large), 1=fast (small)
    var y=gy+30+t*(gh-60)*g.progress;
    // Band width and intensity by amount
    var w=20+Math.log10(bp)*2;
    var intensity=0.7+Math.random()*0.3;
    ctx.fillStyle=lane.color;
    ctx.globalAlpha=intensity;
    ctx.fillRect(x-w/2,y-2,w,4);
    ctx.globalAlpha=1;
    // Glow
    ctx.shadowColor=lane.color;ctx.shadowBlur=8;
    ctx.fillRect(x-w/2,y-1,w,2);
    ctx.shadowBlur=0;
  });
  // Lane label
  ctx.fillStyle=lane.color;ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillText(lane.name,x,gy-8);
  ctx.textAlign='left';
}
/* Size ruler (left) */
ctx.fillStyle='#a0c0b0';ctx.font='9px monospace';
var sizes=[10000,5000,2000,1000,500,200];
sizes.forEach(function(bp){
  var logBp=Math.log10(bp);
  var logMin=Math.log10(minBp);
  var logMax=Math.log10(maxBp);
  var t=(logMax-logBp)/(logMax-logMin);
  var y=gy+30+t*(gh-60)*g.progress;
  if(y<gy+gh){
    ctx.fillStyle='rgba(160,192,176,.6)';
    ctx.fillRect(gx-30,y-1,20,2);
    ctx.fillStyle='#a0c0b0';
    ctx.fillText(bp>=1000?(bp/1000)+'kb':bp+'bp',gx-30,y+3);
  }
});
/* Progress */
ctx.fillStyle='#e0ffe8';ctx.font='11px monospace';
ctx.fillText('Run progress: '+fmt(g.progress*100,0)+'%',gx,gy+gh+22);
ctx.fillText('Voltage: 100V    Time: '+fmt(g.t,1)+'s',gx,gy+gh+40);
SV('sbLen',g.lanes.length+' lanes');SV('sbGC','—');SV('sbMode','Gel');SV('sbIter',fmt(g.progress*100,0));
setStats('<div>Lanes: '+g.lanes.length+'</div><div>Progress: '+fmt(g.progress*100,0)+'%</div>');
badge('▮ Gel · '+fmt(g.progress*100,0)+'%')},
onDown:function(){},
controls:function(){var g=STATE.gel;var h='<div class="sec"><h4>Simulation</h4>';
h+='<div class="kv"><div class="row"><span class="k">Progress</span><span class="v">'+fmt(g.progress*100,0)+'%</span></div></div>';
h+='<button class="btn primary full" style="margin-top:8px" onclick="MODULES.gel.reset()">▶ Run gel</button>';
h+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.gel.progress=1">⏭ Complete</button>';
