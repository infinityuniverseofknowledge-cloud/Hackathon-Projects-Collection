registerModule('spectral',{title:'Spectral Classification',icon:'🌈',desc:'Stellar spectra, absorption lines, temperature',cat:'stellar',init:function(){this.compute()},
compute:function(){var s=STATE.spectral;s.spectrum=[];for(var lam=350;lam<=750;lam+=0.5){var bb=planck(lam*1e-9,s.T);var cont=bb}var maxBB=planck(550e-9,s.T);s.lines=[{lam:656.3,name:'Hα',strength:s.T<10000&&s.T>4000?0.8:0.2},{lam:486.1,name:'Hβ',strength:s.T<15000&&s.T>5000?0.6:0.15},{lam:434.0,name:'Hγ',strength:s.T<12000?0.4:0.1},{lam:393.4,name:'Ca K',strength:s.T<7000?0.9:0.05},{lam:396.8,name:'Ca H',strength:s.T<7000?0.7:0.05},{lam:518.4,name:'Mg b',strength:s.T<6000?0.5:0.05},{lam:589.0,name:'Na D',strength:s.T<5500?0.6:0.02},{lam:430.8,name:'CH G-band',strength:s.T<5500?0.5:0.02}];for(var lam2=350;lam2<=750;lam2+=0.5){var val=planck(lam2*1e-9,s.T)/maxBB;s.lines.forEach(function(ln){val*=(1-ln.strength*Math.exp(-Math.pow((lam2-ln.lam)/1.5,2)))});s.spectrum.push({lambda:lam2,I:val})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var s=STATE.spectral;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('SPECTRAL — T='+s.T+' K · Class '+spectralClass(s.T),24,32);var px=60,py=60,pw=W-140,ph=H-160;drawAxes(ctx,px,py,pw,ph,'λ (nm)','Intensity');for(var i=0;i<s.spectrum.length-1;i++){var p=s.spectrum[i];var x=px+(p.lambda-350)/400*pw;var y=py+ph-p.I*ph;ctx.fillStyle=wavelengthToRGB(p.lambda);ctx.fillRect(x,y,2,py+ph-y)}s.lines.forEach(function(ln){var x=px+(ln.lam-350)/400*pw;ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,py);ctx.lineTo(x,py+ph);ctx.stroke();if(ln.strength>0.3){ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.save();ctx.translate(x-3,py+ph-10);ctx.rotate(-PI/2);ctx.fillText(ln.name,0,0);ctx.restore()}});setStats('<div>T: '+s.T+' K</div><div>Class: '+spectralClass(s.T)+'</div>');badge('🌈 '+spectralClass(s.T)+' star');SV('sbT',s.T+' K');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
controls:function(){var s=STATE.spectral;return '<div class="sec"><h4>Temperature</h4><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+s.T+'</span></div><input type="range" min="2000" max="40000" step="100" value="'+s.T+'" oninput="STATE.spectral.T=parseFloat(this.value);MODULES.spectral.compute()"></div></div><div class="sec"><h4>Spectral Classes</h4><div class="chip-row"><div class="chip" onclick="STATE.spectral.T=35000;MODULES.spectral.compute()">O (35kK)</div><div class="chip" onclick="STATE.spectral.T=15000;MODULES.spectral.compute()">B (15kK)</div><div class="chip" onclick="STATE.spectral.T=9000;MODULES.spectral.compute()">A (9kK)</div><div class="chip" onclick="STATE.spectral.T=7000;MODULES.spectral.compute()">F (7kK)</div><div class="chip" onclick="STATE.spectral.T=5772;MODULES.spectral.compute()">G (Sun)</div><div class="chip" onclick="STATE.spectral.T=4500;MODULES.spectral.compute()">K (4.5kK)</div><div class="chip" onclick="STATE.spectral.T=3000;MODULES.spectral.compute()">M (3kK)</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Spectral Classification</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Harvard classification:</b><br>O: &gt; 30000 K, He II, N III<br>B: 10000-30000 K, He I<br>A: 7500-10000 K, H max<br>F: 6000-7500 K, Ca II, metals<br>G: 5200-6000 K, Ca II strong (Sun)<br>K: 3700-5200 K, metals, CH<br>M: &lt; 3700 K, TiO, VO<br><br><b>Yerkes luminosity classes:</b><br>I: supergiants<br>II: bright giants<br>III: giants<br>IV: subgiants<br>V: main sequence<br>VI: subdwarfs<br>VII: white dwarfs<br><br><b>Saha equation:</b><br>N_{i+1}/N_i = (2Z_{i+1}/N_e·Z_i)·(2πm_e kT/h²)^(3/2)·exp(-χ/kT)<br><br><b>Boltzmann:</b><br>N_2/N_1 = (g_2/g_1)exp(-ΔE/kT)</div></div>'}});
registerModule('stellarStructure',{title:'Stellar Structure',icon:'🔵',desc:'Interior profiles: density, temperature, pressure',cat:'stellar',init:function(){this.compute()},
compute:function(){var s=STATE.stellarStructure;s.layers=[];s.profile=[];for(var r=0;r<=1;r+=0.02){var rho=150000*Math.pow(1-r*r,1.5);var T=1.5e7*Math.pow(1-r,1.5)+5800*0.01;var P=2.4e16*Math.pow(1-r,2.5);s.layers.push({r:r,rho:rho,T:T,P:P});s.profile.push({r:r,rho:rho/Math.pow(10,Math.floor(Math.log10(rho))),T:T/1.5e7,P:P/2.4e16})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var s=STATE.stellarStructure;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('STELLAR STRUCTURE — M='+s.M+' M_sun · R='+s.R+' R_sun · T_eff='+s.T+' K',24,32);var cx=W/2,cy=H*0.55;var maxR=Math.min(W,H)*0.35;for(var i=s.layers.length-1;i>=0;i--){var l=s.layers[i];var r=l.r*maxR;var Tnorm=Math.log10(Math.max(l.T,1000))/Math.log10(1.5e7);var col='rgb('+Math.floor(255*Tnorm)+','+Math.floor(100*Tnorm)+','+Math.floor(50+100*Tnorm)+')';ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,PI2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('Core',cx,cy+4);ctx.textAlign='left';var px=W*0.62,py=60,pw=W*0.33,ph=H*0.8;ctx.fillStyle='rgba(8,6,26,.9)';ctx.fillRect(px,py,pw,ph);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.2;ctx.strokeRect(px,py,pw,ph);ctx.fillStyle='#a080ff';ctx.font='bold 11px monospace';ctx.fillText('PROFILES',px+10,py+22);ctx.font='10px monospace';var plotH=ph-60;var plotY=py+40;ctx.strokeStyle='#ff8020';ctx.lineWidth=2;ctx.beginPath();s.profile.forEach(function(p,i){var x=px+10+p.r*(pw-20);var y=plotY+plotH-30-p.T*plotH*0.3;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff8020';ctx.fillText('T (K) log',px+10,py+ph-15);ctx.strokeStyle='#00d4ff';ctx.beginPath();s.profile.forEach(function(p,i){var x=px+10+p.r*(pw-20);var y=plotY+plotH-30-Math.log10(Math.max(p.rho*150000,1))/Math.log10(150000)*plotH*0.3;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.fillText('ρ log',px+90,py+ph-15);setStats('<div>M: '+s.M+' M_sun</div><div>T_core: 1.5e7 K</div><div>ρ_c: 150 g/cm³</div>');badge('🔵 Structure');SV('sbT',s.T+' K');SV('sbL',s.L+' L_sun');SV('sbZ','—');SV('sbM',s.M+' M_sun');SV('sbD',s.R+' R_sun')},
controls:function(){var s=STATE.stellarStructure;return '<div class="sec"><h4>Mass</h4><div class="ctrl"><div class="lbl"><span>M (M_sun)</span><span>'+s.M+'</span></div><input type="range" min="0.2" max="30" step="0.1" value="'+s.M+'" oninput="STATE.stellarStructure.M=parseFloat(this.value);MODULES.stellarStructure.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.stellarStructure.M=1;MODULES.stellarStructure.compute()">Sun (G2V)</div><div class="chip" onclick="STATE.stellarStructure.M=0.3;MODULES.stellarStructure.compute()">M dwarf</div><div class="chip" onclick="STATE.stellarStructure.M=15;MODULES.stellarStructure.compute()">O/B supergiant</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Stellar Structure</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Four equations:</b><br>1. Hydrostatic: dP/dr = −Gmρ/r²<br>2. Mass: dm/dr = 4πr²ρ<br>3. Energy: dL/dr = 4πr²ρ·ε<br>4. Transport: dT/dr = −(3κρL)/(16πacr²T³)<br><br><b>Energy sources:</b><br>• pp-chain (M &lt; 1.3 M_sun)<br>• CNO cycle (M &gt; 1.3 M_sun)<br>ε ∝ ρT⁴ (pp), ρT²⁰ (CNO)<br><br><b>Core (Sun):</b><br>T ~ 15 MK<br>ρ ~ 150 g/cm³<br>P ~ 2.4×10¹⁶ Pa<br>79% H, 20% He, 1% metals<br><br><b>Energy transport:</b><br>• Radiative zone (0.25-0.7 R_sun)<br>• Convective zone (0.7-1.0 R_sun)<br>• Photosphere T = 5772 K<br><br><b>Standard solar model:</b><br>Bahcall (1960s-today)</div></div>'}});
registerModule('binary',{title:'Binary Stars',icon:'◉',desc:'Kepler orbits for two-body system',cat:'stellar',init:function(){this.reset()},
reset:function(){var b=STATE.binary;b.P=2*PI*Math.sqrt(Math.pow(b.a*AU,3)/(G*(b.M1+b.M2)*M_SUN));b.t=0;b.trace=[]},
step:function(dt){var b=STATE.binary;b.t+=dt;var omega=PI2/b.P;var M=omega*b.t;var E=M;for(var i=0;i<20;i++)E=E-(E-b.e*Math.sin(E)-M)/(1-b.e*Math.cos(E));var nu=2*Math.atan2(Math.sqrt(1+b.e)*Math.sin(E/2),Math.sqrt(1-b.e)*Math.cos(E/2));var r=b.a*(1-b.e*Math.cos(E));var Mtotal=b.M1+b.M2;var x1=-r*b.M2/Mtotal*Math.cos(nu);var y1=-r*b.M2/Mtotal*Math.sin(nu);var x2=r*b.M1/Mtotal*Math.cos(nu);var y2=r*b.M1/Mtotal*Math.sin(nu);b.position={x1:x1,y1:y1,x2:x2,y2:y2};b.trace.push({x1:x1,y1:y1,x2:x2,y2:y2,r:r});if(b.trace.length>500)b.trace.shift()},
tick:function(dt){STATE.time+=dt;var b=STATE.binary;if(!STATE.playing)return;this.step(dt*0.05)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var b=STATE.binary;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('BINARY — M1='+b.M1+' M2='+b.M2+' M_sun · a='+b.a+' AU · e='+b.e,24,32);var cx=W/2,cy=H/2,scale=Math.min(W,H)*0.35/b.a;ctx.strokeStyle='rgba(160,128,255,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-300,cy);ctx.lineTo(cx+300,cy);ctx.moveTo(cx,cy-300);ctx.lineTo(cx,cy+300);ctx.stroke();ctx.strokeStyle='rgba(160,128,255,.4)';ctx.beginPath();ctx.ellipse(cx-b.a*b.e*scale,cy,b.a*scale,Math.sqrt(1-b.e*b.e)*b.a*scale,0,0,PI2);ctx.stroke();b.trace.forEach(function(t,i){ctx.fillStyle='rgba(0,212,255,'+(i/b.trace.length*0.5)+')';ctx.beginPath();ctx.arc(cx+t.x1*scale,cy-t.y1*scale,2,0,PI2);ctx.fill();ctx.fillStyle='rgba(255,128,64,'+(i/b.trace.length*0.5)+')';ctx.beginPath();ctx.arc(cx+t.x2*scale,cy-t.y2*scale,2,0,PI2);ctx.fill()});if(b.position){var T1=5772*Math.pow(b.M1,0.5);var T2=5772*Math.pow(b.M2,0.5);drawStar(ctx,cx+b.position.x1*scale,cy-b.position.y1*scale,15*Math.sqrt(b.M1),T1);drawStar(ctx,cx+b.position.x2*scale,cy-b.position.y2*scale,15*Math.sqrt(b.M2),T2)}setStats('<div>M1: '+b.M1+' M_sun</div><div>M2: '+b.M2+' M_sun</div><div>P: '+fmt(b.P/86400,2)+' d</div>');badge('◉ Binary a='+b.a+' AU');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',(b.M1+b.M2)+' M_sun');SV('sbD',b.a+' AU')},
controls:function(){var b=STATE.binary;return '<div class="sec"><h4>Masses</h4><div class="ctrl"><div class="lbl"><span>M1 (M_sun)</span><span>'+b.M1+'</span></div><input type="range" min="0.2" max="20" step="0.1" value="'+b.M1+'" oninput="STATE.binary.M1=parseFloat(this.value);MODULES.binary.reset()"></div><div class="ctrl"><div class="lbl"><span>M2 (M_sun)</span><span>'+b.M2+'</span></div><input type="range" min="0.2" max="20" step="0.1" value="'+b.M2+'" oninput="STATE.binary.M2=parseFloat(this.value);MODULES.binary.reset()"></div></div><div class="sec"><h4>Orbit</h4><div class="ctrl"><div class="lbl"><span>a (AU)</span><span>'+b.a+'</span></div><input type="range" min="0.1" max="10" step="0.1" value="'+b.a+'" oninput="STATE.binary.a=parseFloat(this.value);MODULES.binary.reset()"></div><div class="ctrl"><div class="lbl"><span>e</span><span>'+b.e+'</span></div><input type="range" min="0" max="0.9" step="0.05" value="'+b.e+'" oninput="STATE.binary.e=parseFloat(this.value);MODULES.binary.reset()"></div></div><button class="btn primary full" onclick="STATE.binary.trace=[];MODULES.binary.reset()">↺ Reset</button>'},mathPanel:function(){return '<div class="sec"><h4>Binary Stars</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Kepler\'s 3rd law:</b><br>P² = 4π²a³/[G(M1+M2)]<br><br><b>Center of mass:</b><br>M1·r1 = M2·r2<br>Both orbit the barycenter<br><br><b>Mass function:</b><br>f(M) = (M2 sin i)³/(M1+M2)²<br>= P·K1³(1−e²)^1.5/(2πG)<br><br><b>Types:</b><br>• Visual: resolved orbits<br>• Spectroscopic: RV curves<br>• Eclipsing: light curves<br>• Astrometric: wobble<br><br><b>Interacting binaries:</b><br>• Roche lobe overflow<br>• Common envelope<br>• Cataclysmic variables<br>• X-ray binaries<br>• Gravitational wave sources<br><br><b>Chirp mass (GW):</b><br>Mc = (M1M2)^(3/5)/(M1+M2)^(1/5)<br><br><b>Examples:</b><br>Sirius A+B (white dwarf)<br>Algol (eclipsing)<br>Cygnus X-1 (BH + O)<br>GW150914 (2× 30 M_sun BBH)</div></div>'}});
registerModule('variables',{title:'Variable Stars',icon:'📈',desc:'Cepheids, RR Lyrae, period-luminosity',cat:'stellar',init:function(){this.compute()},
compute:function(){var v=STATE.variables;v.lc=[];if(v.type==='cepheid'){v.P=5;v.L=1000;v.T=5772}else if(v.type==='rrlyrae'){v.P=0.5;v.L=50;v.T=7000}else if(v.type==='mira'){v.P=330;v.L=5000;v.T=3000}else if(v.type==='delta'){v.P=9;v.L=2000;v.T=7000}else{v.P=1;v.L=1;v.T=5772}for(var t=0;t<=2*v.P;t+=v.P/50){var phase=t/v.P%1;var shape;if(v.type==='cepheid')shape=Math.pow(Math.sin(phase*PI),1.5);else if(v.type==='mira')shape=Math.pow(Math.sin(phase*PI),2);else shape=Math.sin(phase*PI2);v.lc.push({t:t,L:v.L*(0.5+0.5*shape)})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var v=STATE.variables;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('VARIABLE — '+v.type+' · P='+v.P+' d · L='+v.L+' L_sun',24,32);var px=60,py=60,pw=W-140,ph=H-160;drawAxes(ctx,px,py,pw,ph,'phase','L/L_sun');ctx.strokeStyle='#ffb040';ctx.lineWidth=2;ctx.beginPath();v.lc.forEach(function(p,i){var x=px+(p.t/(2*v.P))*pw;var y=py+ph-Math.min(p.L/(2*v.L),1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ffb040';ctx.font='10px monospace';ctx.fillText('Light curve',px+10,py+15);setStats('<div>Type: '+v.type+'</div><div>P: '+v.P+' d</div><div>L: '+v.L+' L_sun</div>');badge('📈 '+v.type);SV('sbT',v.T+' K');SV('sbL',v.L+' L_sun');SV('sbZ','—');SV('sbM','—');SV('sbD',v.P+' d')},
controls:function(){var v=STATE.variables;return '<div class="sec"><h4>Type</h4><div class="chip-row"><div class="chip '+(v.type==='cepheid'?'active':'')+'" onclick="STATE.variables.type=\'cepheid\';MODULES.variables.compute();renderLeftPanel()">Cepheid</div><div class="chip '+(v.type==='rrlyrae'?'active':'')+'" onclick="STATE.variables.type=\'rrlyrae\';MODULES.variables.compute();renderLeftPanel()">RR Lyrae</div><div class="chip '+(v.type==='mira'?'active':'')+'" onclick="STATE.variables.type=\'mira\';MODULES.variables.compute();renderLeftPanel()">Mira</div><div class="chip '+(v.type==='delta'?'active':'')+'" onclick="STATE.variables.type=\'delta\';MODULES.variables.compute();renderLeftPanel()">δ Scuti</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Variable Stars</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Cepheids:</b><br>P = 1-50 days<br>Period-Luminosity relation (Leavitt 1912):<br>M_V = -2.43(log P - 1) - 4.05<br>Standard candles → cosmic distance ladder<br><br><b>RR Lyrae:</b><br>P ~ 0.5 d, M_V ~ 0.5<br>Old population (globulars)<br><br><b>Mira:</b><br>P &gt; 100 d, AGB stars<br>Amplitude &gt; 2.5 mag<br><br><b>δ Scuti:</b><br>P ~ hours, A-F main sequence<br>Radial pulsations<br><br><b>Physical mechanism:</b><br>κ-mechanism (opacity valve)<br>He II ionization zone<br>Eddington valve<br><br><b>Distance ladder:</b><br>Parallax → Cepheids → SN Ia → Hubble<br><br><b>Henrietta Leavitt (1912):</b><br>Harvard computers<br>Discovered P-L relation</div></div>'}});
</script>
<script>
registerModule('galaxy',{title:'Galaxy Morphology',icon:'🌌',desc:'Spiral, elliptical, irregular galaxies',cat:'galactic',init:function(){this.compute()},
compute:function(){var g=STATE.galaxy;g.stars=[];if(g.type==='spiral'){for(var i=0;i<2000;i++){var r=Math.pow(Math.random(),0.5)*g.size;var theta=Math.random()*PI2;var arm=Math.floor(theta/(PI2/g.arms));var armPhi=theta%(PI2/g.arms);var offset=Math.log(r+1)*0.8;var th=arm*(PI2/g.arms)+armPhi*0.4+offset+r*0.02;var x=r*Math.cos(th)+rndn()*10;var y=r*Math.sin(th)+rndn()*10;if(r<g.size*0.15&&Math.random()<0.5)continue;g.stars.push({x:x,y:y,r:r,z:rndn()*5,type:r<g.size*0.1?'core':'disk'})}}else if(g.type==='elliptical'){for(var j=0;j<2000;j++){var r2=Math.pow(Math.random(),2)*g.size;var ang=Math.random()*PI2;var x2=r2*Math.cos(ang);var y2=r2*Math.sin(ang)*0.7;g.stars.push({x:x2,y:y2,r:r2,z:rndn()*3,type:'bulge'})}}else{for(var k=0;k<2000;k++){var x3=rndn()*g.size;var y3=rndn()*g.size;g.stars.push({x:x3,y:y3,r:Math.sqrt(x3*x3+y3*y3),z:rndn()*5,type:'irregular'})}}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var g=STATE.galaxy;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('GALAXY — '+g.type+' · '+g.stars.length+' stars',24,32);var cx=W/2,cy=H/2,scale=Math.min(W,H)*0.4/g.size;g.stars.forEach(function(s){var x=cx+s.x*scale;var y=cy-s.y*scale;var r=Math.sqrt(x*x+y*y);if(r>Math.min(W,H)*0.5)return;var color;if(s.type==='core')color='rgba(255,220,150,.9)';else if(s.type==='bulge')color='rgba(255,200,120,.6)';else color='rgba(180,200,255,.7)';ctx.fillStyle=color;ctx.fillRect(x,y,1.5,1.5)});setStats('<div>Type: '+g.type+'</div><div>Stars: '+g.stars.length+'</div>');badge('🌌 '+g.type);SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD',g.size+' kpc')},
controls:function(){var g=STATE.galaxy;return '<div class="sec"><h4>Type</h4><div class="chip-row"><div class="chip '+(g.type==='spiral'?'active':'')+'" onclick="STATE.galaxy.type=\'spiral\';MODULES.galaxy.compute();renderLeftPanel()">Spiral</div><div class="chip '+(g.type==='elliptical'?'active':'')+'" onclick="STATE.galaxy.type=\'elliptical\';MODULES.galaxy.compute();renderLeftPanel()">Elliptical</div><div class="chip '+(g.type==='irregular'?'active':'')+'" onclick="STATE.galaxy.type=\'irregular\';MODULES.galaxy.compute();renderLeftPanel()">Irregular</div></div></div><div class="sec"><h4>Arms (if spiral)</h4><div class="ctrl"><div class="lbl"><span>N arms</span><span>'+g.arms+'</span></div><input type="range" min="2" max="6" step="1" value="'+g.arms+'" oninput="STATE.galaxy.arms=parseInt(this.value);MODULES.galaxy.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Galaxy Morphology</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Hubble classification (1926):</b><br>E0-E7: elliptical (E7 flattest)<br>S0: lenticular<br>Sa-Sc: spiral (Sa tight arms)<br>SBa-SBc: barred spiral<br>Irr: irregular<br><br><b>Properties:</b><br>Spirals: disk + bulge + halo<br>Ellipticals: bulge only<br>~60% have bars<br>~1% peculiar/interacting<br><br><b>Scaling relations:</b><br>Tully-Fisher (spirals): L ∝ V^4<br>Faber-Jackson (ellipticals): L ∝ σ^4<br>Fundamental plane: R ∝ σ^a·I^b<br><br><b>Mass ranges:</b><br>Dwarf: 10⁷ M_sun<br>Milky Way: 10¹² M_sun<br>BCG: 10¹³ M_sun<br><br><b>Examples:</b><br>M31 (Andromeda): Sa<br>M87: E1, SMBH 6.5e9 M_sun<br>LMC: Irr<br>M51: Sc interacting</div></div>'}});
registerModule('rotation',{title:'Galaxy Rotation Curves',icon:'📈',desc:'Dark matter evidence from flat rotation curves',cat:'galactic',init:function(){this.compute()},
compute:function(){var r=STATE.rotation;r.curve=[];for(var r_kpc=0.1;r_kpc<=50;r_kpc+=0.5){var M_vis=1e11*(r_kpc/15);var M_dark=r.darkMatter?1e11*(r_kpc/15)*3:0;var M_total=r.M_vis+M_dark;var vc=Math.sqrt(G*M_total*1e-3*1.989e30*1e9/(r_kpc*3.086e16*1e3))/1000;r.curve.push({r:r_kpc,v:vc,vKepler:Math.sqrt(G*r.M_vis*1e-3*1.989e30*1e9/(r_kpc*3.086e16*1e3))/1000})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var r=STATE.rotation;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('ROTATION CURVE — '+r.M_vis/1e11+'×10¹¹ M_sun disk · dark matter: '+(r.darkMatter?'ON':'OFF'),24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'R (kpc)','V_c (km/s)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();r.curve.forEach(function(p,i){var x=px+p.r/50*pw;var y=py+ph-Math.min(p.v/400,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,128,64,.5)';ctx.setLineDash([3,3]);ctx.beginPath();r.curve.forEach(function(p,i){var x=px+p.r/50*pw;var y=py+ph-Math.min(p.vKepler/400,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('— Observed (flat)',px+10,py+15);ctx.fillStyle='#ff8020';ctx.fillText('— Keplerian (visible only)',px+10,py+30);setStats('<div>V_flat: ~220 km/s</div>');badge('📈 Rotation curve');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',r.M_vis/1e12+' ×10¹² M_sun');SV('sbD','—')},
controls:function(){var r=STATE.rotation;return '<div class="sec"><h4>Dark Matter</h4><div class="chip-row"><div class="chip '+(r.darkMatter?'active':'')+'" onclick="STATE.rotation.darkMatter=true;MODULES.rotation.compute()">With DM</div><div class="chip '+(!r.darkMatter?'active':'')+'" onclick="STATE.rotation.darkMatter=false;MODULES.rotation.compute()">Visible only</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Galaxy Rotation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Keplerian (visible):</b><br>V_c = √(GM/r) → should decline as 1/√r<br><br><b>Observed (flat):</b><br>V_c = const ~ 200-250 km/s<br>up to 50+ kpc<br><br><b>Implication:</b><br>Mass continues to increase<br>M(r) = V²r/G ∝ r<br>Missing mass = dark matter<br><br><b>Evidence (1960s-70s):</b><br>Rubin, Ford, Roberts<br>Vera Rubin (1928-2016)<br><br><b>Dark matter halo:</b><br>NFW profile:<br>ρ(r) = ρ_s/[(r/r_s)(1+r/r_s)²]<br>Isothermal: ρ ∝ 1/r²<br><br><b>Nature of DM:</b><br>• WIMPs (not detected)<br>• Axions<br>• Sterile neutrinos<br>• MACHOs (ruled out)<br>~27% of universe energy density<br><br><b>Dark matter fraction:</b><br>~85% of all matter</div></div>'}});
registerModule('tullyFisher',{title:'Tully-Fisher Relation',icon:'📏',desc:'L ∝ V^4 scaling for spiral galaxies',cat:'galactic',init:function(){this.compute()},
compute:function(){var t=STATE.tullyFisher;t.scatter=[];for(var i=0;i<80;i++){var Vc=100+Math.random()*250;var L=Math.pow(Vc/200,4)*1e10*Math.exp(rndn()*0.3);t.scatter.push({Vc:Vc,L:L})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var t=STATE.tullyFisher;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('TULLY-FISHER — L ∝ V_c^4',24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'log V_c (km/s)','log L (L_sun)');t.scatter.forEach(function(s){var x=px+(Math.log10(s.Vc)-2)/(Math.log10(400)-2)*pw;var y=py+ph-(Math.log10(s.L)-8.5)/(Math.log10(1e12)-8.5)*ph;ctx.fillStyle='rgba(0,212,255,.7)';ctx.beginPath();ctx.arc(x,y,3,0,PI2);ctx.fill()});ctx.strokeStyle='#ffb040';ctx.lineWidth=2;var x1=px,x2=px+pw;var y1=py+ph-(Math.log10(Math.pow(Math.pow(10,2)/200,4)*1e10)-8.5)/(Math.log10(1e12)-8.5)*ph;var y2=py+ph-(Math.log10(Math.pow(Math.pow(10,2.6)/200,4)*1e10)-8.5)/(Math.log10(1e12)-8.5)*ph;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.fillStyle='#ffb040';ctx.font='10px monospace';ctx.fillText('L = L_0(V/200)^4',px+10,py+15);setStats('<div>Slope: 4.0</div><div>Reference: 200 km/s</div>');badge('📏 Tully-Fisher');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
controls:function(){return '<div class="sec"><h4>Info</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">Empirical scaling relation for spiral galaxies. Enables distance measurement from rotation velocity.</div></div>'},mathPanel:function(){return '<div class="sec"><h4>Tully-Fisher</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Relation:</b><br>L ∝ V_max^4 (B band)<br>L ∝ V_max^3.5 (I band)<br><br><b>Tully & Fisher (1977):</b><br>Discovered using 21cm HI linewidths<br>V_max from line width W_20<br><br><b>Physical basis:</b><br>V_max² ∝ M/R<br>L ∝ M (approx)<br>→ L ∝ V^4 (from luminosity-mass)<br><br><b>Scatter:</b><br>~0.3 mag (~15% distance)<br>Improves with inclination correction<br><br><b>Uses:</b><br>• Distance indicator (standard candle)<br>• Spiral galaxies<br>• Hubble constant determination<br>• Peculiar velocities<br><br><b>Related:</b><br>Faber-Jackson (ellipticals): L ∝ σ^4<br>Fundamental plane of ellipticals<br>Baryonic Tully-Fisher: M_b ∝ V^4<br><br><b>SPARC sample:</b><br>Lelli, McGaugh, Schombert (2016)<br>175 disk galaxies</div></div>'}});
registerModule('distance',{title:'Cosmic Distance Ladder',icon:'📐',desc:'Parallax → Cepheids → SNe Ia → Hubble',cat:'galactic',init:function(){this.compute()},
compute:function(){var d=STATE.distance;d.ladder=[{name:'Parallax',range:'1 pc - 1 kpc',method:'Geometric',accuracy:'1%',ref:'Hipparcos, Gaia'},{name:'Main sequence fitting',range:'1 pc - 10 kpc',method:'Stellar',accuracy:'10%',ref:'H-R diagram'},{name:'Cepheids',range:'1 kpc - 30 Mpc',method:'Period-Luminosity',accuracy:'5-10%',ref:'Leavitt, HST'},{name:'RR Lyrae',range:'1 kpc - 1 Mpc',method:'P-L relation',accuracy:'10%',ref:'Globular clusters'},{name:'Tip of RGB',range:'10 kpc - 10 Mpc',method:'I-band magnitude',accuracy:'10%',ref:'Dwarf galaxies'},{name:'Tully-Fisher',range:'1 Mpc - 100 Mpc',method:'Rotation curve',accuracy:'15%',ref:'Disk galaxies'},{name:'Faber-Jackson',range:'10 Mpc - 500 Mpc',method:'Velocity dispersion',accuracy:'15%',ref:'Ellipticals'},{name:'SN Ia (standard candles)',range:'100 Mpc - 1000 Mpc',method:'Peak magnitude',accuracy:'5-7%',ref:'Phillips 1993'},{name:'Surface brightness fluc.',range:'10 Mpc - 100 Mpc',method:'Stellar luminosity',accuracy:'5%',ref:'Tonry'},{name:'Hubble law',range:'z &gt; 0.01',method:'Redshift',accuracy:'Depends H0',ref:'Hubble 1929'}]},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var d=STATE.distance;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('COSMIC DISTANCE LADDER',24,32);var y0=60;d.ladder.forEach(function(rung,i){var y=y0+i*46;ctx.fillStyle='rgba(160,128,255,'+(0.15-i*0.01)+')';ctx.fillRect(60,y,W-120,40);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.5;ctx.strokeRect(60,y,W-120,40);ctx.fillStyle='#e0f0ff';ctx.font='bold 11px monospace';ctx.fillText(rung.name,70,y+18);ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText(rung.range,70,y+34);ctx.fillStyle='#ffb040';ctx.fillText(rung.method,W*0.4,y+18);ctx.fillStyle='#40ffb0';ctx.fillText('±'+rung.accuracy,W*0.65,y+18);ctx.fillStyle='#a89ce0';ctx.fillText(rung.ref,W*0.65,y+34)});setStats('<div>Rungs: '+d.ladder.length+'</div>');badge('📐 Distance ladder');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
controls:function(){return '<div class="sec"><h4>Info</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">Cosmic distance ladder uses overlapping methods at increasing distances. Each rung calibrated by the previous.</div></div>'},mathPanel:function(){return '<div class="sec"><h4>Distance Ladder</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Parallax (closest):</b><br>d(pc) = 1/p(arcsec)<br>Gaia: μas precision → 10 kpc<br><br><b>Cepheids (Leavitt 1912):</b><br>P-L relation absolute<br>M = a·log P + b<br>HST Key Project: H0 = 72 ± 8<br><br><b>SN Ia (Phillips 1993):</b><br>Peak M_B correlated with decline rate<br>Standardized candles<br>Visible to z ~ 2<br>Discovery of accelerating universe (1998)<br>Nobel 2011 (Perlmutter, Schmidt, Riess)<br><br><b>Hubble constant tension:</b><br>CMB (Planck): H0 = 67.4 ± 0.5<br>Local (SH0ES): H0 = 73.0 ± 1.0<br>5σ discrepancy!<br>Possible new physics<br><br><b>TRGB:</b><br>Tip of Red Giant Branch<br>I-band ~ -4 mag<br>Distance to 20 Mpc</div></div>'}});
registerModule('milkyway',{title:'Milky Way Structure',icon:'🌌',desc:'Our Galaxy from outside: bulge, disk, halo',cat:'galactic',init:function(){this.compute()},
compute:function(){var m=STATE.milkyway;m.stars=[];for(var i=0;i<3000;i++){var r=Math.pow(Math.random(),0.5)*m.R;if(Math.random()<0.3){r=Math.random()*4}var theta=Math.random()*PI2;var arm=Math.floor(theta/(PI2/m.arms));var armPhi=theta%(PI2/m.arms);var th=arm*(PI2/m.arms)+armPhi*0.3+Math.log(r+1)*0.9;var x=r*Math.cos(th)+rndn()*2;var y=r*Math.sin(th)+rndn()*2;m.stars.push({x:x,y:y,r:r,type:r<4?'bulge':'disk'})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var m=STATE.milkyway;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('MILKY WAY — R_disk ~ 15 kpc · R_sun = 8 kpc',24,32);var cx=W/2,cy=H/2,scale=Math.min(W,H)*0.4/m.R;m.stars.forEach(function(s){var x=cx+s.x*scale;var y=cy-s.y*scale;if(s.type==='bulge'){ctx.fillStyle='rgba(255,200,120,.8)'}else{ctx.fillStyle='rgba(180,200,255,.6)'}ctx.fillRect(x,y,1.5,1.5)});ctx.fillStyle='#ffff00';var sunX=cx+m.r*scale;ctx.beginPath();ctx.arc(sunX,cy,6,0,PI2);ctx.fill();ctx.fillStyle='#ffff00';ctx.font='bold 11px monospace';ctx.fillText('Sun',sunX+10,cy);ctx.strokeStyle='rgba(255,255,0,.3)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(cx,cy,m.r*scale,0,PI2);ctx.stroke();ctx.setLineDash([]);setStats('<div>R: '+m.R+' kpc</div><div>Sun: '+m.r+' kpc</div><div>Stars: '+m.stars.length+'</div>');badge('🌌 Milky Way');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','10¹² M_sun');SV('sbD','R='+m.R+' kpc')},
controls:function(){var m=STATE.milkyway;return '<div class="sec"><h4>Galaxy parameters</h4><div class="ctrl"><div class="lbl"><span>R_disk (kpc)</span><span>'+m.R+'</span></div><input type="range" min="8" max="30" step="1" value="'+m.R+'" oninput="STATE.milkyway.R=parseFloat(this.value);MODULES.milkyway.compute()"></div><div class="ctrl"><div class="lbl"><span>R_sun (kpc)</span><span>'+m.r+'</span></div><input type="range" min="4" max="15" step="0.5" value="'+m.r+'" oninput="STATE.milkyway.r=parseFloat(this.value);MODULES.milkyway.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Milky Way</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Structure:</b><br>• Disk: 30 kpc diameter, 1 kpc thick<br>• Bulge: 4 kpc, older stars<br>• Halo: 100 kpc, globulars, dark matter<br>• Bar: elongated, ~8 kpc<br>• 4 major spiral arms<br><br><b>Sun position:</b><br>R_sun = 8.2 kpc (Zhu 2018)<br>z_sun ~ 20 pc above plane<br>V_sun ~ 232 km/s (Gaia)<br>Period ~ 225 Myr<br><br><b>Components:</b><br>• Thin disk: young stars, gas<br>• Thick disk: old, metal-poor<br>• Bulge: 10 Gyr<br>• Globulars: 100-200, old<br>• Streams: tidal debris<br><br><b>Mass:</b><br>Stars: 6×10¹⁰ M_sun<br>Gas: 5×10⁹ M_sun<br>Total: ~1.5×10¹² M_sun<br>Dark halo: 90% of mass<br><br><b>SMBH:</b><br>Sgr A*: 4.3×10⁶ M_sun<br>Nobel 2020 (Genzel, Ghez)</div></div>'}});
</script>
<script>
registerModule('hubble',{title:'Hubble-Lemaître Law',icon:'📈',desc:'Redshift-distance relation, expanding universe',cat:'cosmo',init:function(){this.compute()},
compute:function(){var h=STATE.hubble;h.points=[];for(var i=0;i<40;i++){var d=Math.random()*800;var v=h.H0*d+rndn()*300;if(v<0)v=0;h.points.push({d:d,v:v,z:velToRedshift(v*1000)})}h.v=h.H0*h.d;h.z=velToRedshift(h.v*1000)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var h=STATE.hubble;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('HUBBLE LAW — H₀='+h.H0+' km/s/Mpc · v='+fmt(h.v,0)+' km/s',24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'d (Mpc)','v (km/s)');h.points.forEach(function(p){var x=px+p.d/800*pw;var y=py+ph-Math.min(p.v/80000,1)*ph;ctx.fillStyle='rgba(0,212,255,.7)';ctx.beginPath();ctx.arc(x,y,3,0,PI2);ctx.fill()});ctx.strokeStyle='#ffb040';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py+ph);ctx.lineTo(px+pw,py+ph-h.H0*800/80000*ph);ctx.stroke();ctx.fillStyle='#ffb040';ctx.font='10px monospace';ctx.fillText('v = H₀ · d',px+pw-100,py+20);setStats('<div>H0: '+h.H0+' km/s/Mpc</div><div>v: '+fmt(h.v,0)+' km/s</div><div>z: '+fmt(h.z,4)+'</div>');badge('📈 Hubble Law');SV('sbT','—');SV('sbL','—');SV('sbZ',fmt(h.z,4));SV('sbM','—');SV('sbD',h.d+' Mpc')},
controls:function(){var h=STATE.hubble;return '<div class="sec"><h4>Hubble constant</h4><div class="ctrl"><div class="lbl"><span>H0 (km/s/Mpc)</span><span>'+h.H0+'</span></div><input type="range" min="50" max="100" step="0.5" value="'+h.H0+'" oninput="STATE.hubble.H0=parseFloat(this.value);MODULES.hubble.compute()"></div></div><div class="sec"><h4>Distance</h4><div class="ctrl"><div class="lbl"><span>d (Mpc)</span><span>'+h.d+'</span></div><input type="range" min="1" max="800" step="1" value="'+h.d+'" oninput="STATE.hubble.d=parseFloat(this.value);MODULES.hubble.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.hubble.H0=67.4;MODULES.hubble.compute()">Planck 67.4</div><div class="chip" onclick="STATE.hubble.H0=73.0;MODULES.hubble.compute()">SH0ES 73.0</div><div class="chip" onclick="STATE.hubble.H0=70.0;MODULES.hubble.compute()">Round 70</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Hubble-Lemaître Law</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Law (1929):</b><br>v = H0 · d<br>H0 ~ 67-73 km/s/Mpc<br><br><b>Redshift:</b><br>z = (λ_obs − λ_rest)/λ_rest<br>v ≈ c·z (z &lt;&lt; 1)<br>Relativistic: (1+z) = √((1+β)/(1−β))<br><br><b>Hubble time:</b><br>1/H0 = 13.8 Gyr (age of universe)<br>H0 in SI: 2.2×10⁻¹⁸ s⁻¹<br><br><b>Hubble radius:</b><br>c/H0 ~ 14 Gly (not horizon)<br><br><b>Interpretation:</b><br>Space itself expands<br>No center of expansion<br>All galaxies recede from each other<br><br><b>Hubble tension:</b><br>CMB (Planck): 67.4 ± 0.5<br>Local (SH0ES): 73.0 ± 1.0<br>5σ discrepancy<br><br><b>Historical:</b><br>Slipher (1917): redshifts<br>Hubble (1929): v-d relation<br>Lemaître (1927): predicted<br>Nobel 2020: Genzel, Ghez (Sgr A*)</div></div>'}});
registerModule('cosmology',{title:'ΛCDM Cosmology',icon:'🌠',desc:'Friedmann equation, expansion history',cat:'cosmo',init:function(){this.compute()},
compute:function(){var c=STATE.cosmology;c.aHistory=[];for(var i=-4;i<=1;i+=0.05){var a=Math.pow(10,i);var H=friedmannH(a);var t=0;for(var j=0;j<100;j++){var aa=Math.pow(10,i-j/100*(i+4));if(aa>0){var HH=friedmannH(aa);if(HH>0)t+=1/HH*Math.pow(10,i-j/100*(i+4))*Math.log(10)*0.01}}c.aHistory.push({a:a,t:t,H:H})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var c=STATE.cosmology;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('ΛCDM — Ω_m='+OMEGA_M+' Ω_Λ='+OMEGA_L+' H₀='+c.H,24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'log(a)','H(a) [s⁻¹]');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();c.aHistory.forEach(function(p,i){var x=px+(Math.log10(p.a)+4)/5*pw;var y=py+ph-Math.min(Math.log10(p.H+1e-20)/Math.log10(1e20)+1,1)*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();var labels=['Inflation','Radiation','Matter','Dark Energy'];ctx.fillStyle='#5c5078';ctx.font='10px monospace';labels.forEach(function(l,i){ctx.fillText(l,px+10+i*150,py+15)});setStats('<div>Ω_m: '+OMEGA_M+'</div><div>Ω_Λ: '+OMEGA_L+'</div><div>Age: 13.8 Gyr</div>');badge('🌠 ΛCDM');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
controls:function(){var c=STATE.cosmology;return '<div class="sec"><h4>Parameters</h4><div class="ctrl"><div class="lbl"><span>Ω_m</span><span>'+OMEGA_M+'</span></div><input type="range" min="0.1" max="0.6" step="0.01" value="'+OMEGA_M+'" oninput="OMEGA_M=parseFloat(this.value);MODULES.cosmology.compute()"></div><div class="ctrl"><div class="lbl"><span>Ω_Λ</span><span>'+OMEGA_L+'</span></div><input type="range" min="0.3" max="0.9" step="0.01" value="'+OMEGA_L+'" oninput="OMEGA_L=parseFloat(this.value);MODULES.cosmology.compute()"></div><div class="ctrl"><div class="lbl"><span>H₀ (km/s/Mpc)</span><span>'+c.H+'</span></div><input type="range" min="50" max="100" step="0.5" value="'+c.H+'" oninput="STATE.cosmology.H=parseFloat(this.value);H0=parseFloat(this.value)*1000/Mpc;MODULES.cosmology.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>ΛCDM Cosmology</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Friedmann equation:</b><br>(ȧ/a)² = H² = 8πGρ/3 − kc²/a² + Λc²/3<br><br><b>Density parameters:</b><br>Ω_m = 0.315 (matter)<br>Ω_Λ = 0.685 (dark energy)<br>Ω_b = 0.049 (baryons)<br>Ω_DM = 0.266 (dark matter)<br>Ω_k ≈ 0 (flat)<br><br><b>Components scale as:</b><br>Matter: ρ ∝ a⁻³<br>Radiation: ρ ∝ a⁻⁴<br>Λ: ρ = const<br><br><b>Expansion epochs:</b><br>Inflation: a: e⁶⁰<br>Radiation: a &lt; 10⁻⁴<br>Matter: 10⁻⁴ &lt; a &lt; 0.7<br>Dark energy: a &gt; 0.7<br><br><b>Observations (Planck 2018):</b><br>Age: 13.797 Gyr<br>H0: 67.4 km/s/Mpc<br>Ω_Λ = 0.685 ± 0.007<br>Ω_m = 0.315 ± 0.007<br>n_s = 0.965 (spectral index)<br>τ = 0.054 (optical depth)<br><br><b>Concordance model:</b><br>ΛCDM = best fit to all data</div></div>'}});
registerModule('cmb',{title:'Cosmic Microwave Background',icon:'🟠',desc:'Planck spectrum, anisotropies, power spectrum',cat:'cosmo',init:function(){this.compute()},
compute:function(){var c=STATE.cmb;c.spectrum=[];for(var lam=0.1;lam<=10;lam+=0.05){var B=planck(lam*1e-3,c.T);var lam_cm=lam*0.1;c.spectrum.push({lambda:lam_cm,B:B})}c.cl=[];for(var l=2;l<=2000;l+=10){var amp=0;var peaks=[220,540,810,1120,1420];peaks.forEach(function(pk){amp+=Math.exp(-Math.pow((l-pk)/80,2))*(1+Math.random()*0.05)});amp*=l/(l+100)*(l/1000+1);c.cl.push({l:l,Dl:amp*6000})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var c=STATE.cmb;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('CMB — T='+c.T+' K · z=1100 · '+(c.anomalies?'with anomalies':'standard'),24,32);var px=60,py=60,pw=W-140,ph=H*0.4;drawAxes(ctx,px,py,pw,ph,'λ (mm)','B_λ');c.spectrum.forEach(function(p){var x=px+p.lambda/10*pw;var y=py+ph-Math.min(p.B/Math.pow(10,-10),1)*ph;ctx.fillStyle='#ff8020';ctx.fillRect(x,y,2,py+ph-y)});ctx.fillStyle='#ff8020';ctx.font='10px monospace';ctx.fillText('Planck spectrum',px+10,py+15);var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'multipole l','D_l (μK²)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();c.cl.forEach(function(p,i){var x=px+Math.log10(p.l)/Math.log10(2000)*pw;var y=p2+ph*0.6-Math.min(p.Dl/6000,1)*ph*0.6;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('Acoustic peaks',px+10,p2+15);setStats('<div>T: '+c.T+' K</div><div>z: 1100</div><div>Peak l: 220</div>');badge('🟠 CMB T='+c.T+' K');SV('sbT',c.T+' K');SV('sbL','—');SV('sbZ','1100');SV('sbM','—');SV('sbD','—')},
controls:function(){var c=STATE.cmb;return '<div class="sec"><h4>Temperature</h4><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+c.T+'</span></div><input type="range" min="2.7" max="2.73" step="0.001" value="'+c.T+'" oninput="STATE.cmb.T=parseFloat(this.value);MODULES.cmb.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.cmb.T=2.72548;MODULES.cmb.compute()">COBE 2.725</div><div class="chip" onclick="STATE.cmb.anomalies=!STATE.cmb.anomalies;MODULES.cmb.compute()">Toggle anomalies</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Cosmic Microwave Background</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Discovery:</b><br>Penzias & Wilson (1964) → Nobel 1978<br>Serendipitous, Bell Labs<br><br><b>Properties:</b><br>T = 2.72548 ± 0.00057 K<br>Perfect blackbody (Planck)<br>Peak λ = 1.06 mm (microwave)<br>Recombination at z = 1100<br>Surface of last scattering<br><br><b>Anisotropies (ΔT/T ~ 10⁻⁵):</b><br>• Dipole (our motion): 3.35 mK<br>• Acoustic peaks (matter-radiation)<br>• Sachs-Wolfe<br>• Sunyaev-Zel\'dovich<br><br><b>Acoustic peaks:</b><br>First peak l ~ 220<br>Sound horizon at recombination<br>151 ± 3 Mpc comoving<br>Determines curvature (flat)<br>Second peak: baryon density<br>Third peak: dark matter<br><br><b>Missions:</b><br>COBE (1989) → Nobel 2006<br>WMAP (2001)<br>Planck (2009) → best data<br>CMB-S4 (future)<br>LiteBIRD (B-modes)<br><br><b>Polarization:</b><br>E-modes (density)<br>B-modes (gravitational waves)</div></div>'}});
registerModule('bao',{title:'Baryon Acoustic Oscillations',icon:'🌊',desc:'Standard ruler for cosmology',cat:'cosmo',init:function(){this.compute()},
compute:function(){var b=STATE.bao;b.r_d=147.1;b.dragEpoch=1059;b.correlation=[];for(var r=20;r<=200;r+=2){var amp=0;if(r>100&&r<180)amp+=0.5*Math.exp(-Math.pow((r-150)/15,2));amp+=Math.exp(-Math.pow(r/50,2));b.correlation.push({r:r,xi:amp})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var b=STATE.bao;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('BAO — r_d='+b.r_d+' Mpc · z_drag='+b.dragEpoch,24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'comoving r (Mpc/h)','ξ(r)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();b.correlation.forEach(function(p,i){var x=px+p.r/200*pw;var y=py+ph-p.xi*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.strokeStyle='rgba(255,128,64,.5)';ctx.setLineDash([3,3]);var peakX=px+150/200*pw;ctx.beginPath();ctx.moveTo(peakX,py);ctx.lineTo(peakX,py+ph);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff8020';ctx.font='10px monospace';ctx.fillText('BAO peak',peakX+3,py+15);setStats('<div>r_d: '+b.r_d+' Mpc</div><div>z_drag: '+b.dragEpoch+'</div>');badge('🌊 BAO ruler');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD',b.r_d+' Mpc')},
controls:function(){return '<div class="sec"><h4>Info</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">Baryon Acoustic Oscillations: frozen sound waves from early universe. Standard ruler for cosmology.</div></div>'},mathPanel:function(){return '<div class="sec"><h4>BAO</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Physics:</b><br>Before recombination (z &gt; 1100)<br>Photon-baryon plasma<br>Sound waves propagate<br>Sound horizon at drag epoch:<br>r_d = 147.1 Mpc (comoving)<br><br><b>After recombination:</b><br>Photons free-stream (CMB)<br>Baryons frozen in overdensity shell<br>Detectable as peak in galaxy correlation<br><br><b>Detection:</b><br>SDSS (Eisenstein 2005)<br>2dF, BOSS, eBOSS, DESI<br>~150 Mpc peak confirmed<br><br><b>Uses:</b><br>• Standard ruler at all z<br>• Measure H(z), D_A(z)<br>• Dark energy equation of state<br>• Test of ΛCDM<br>• Constrains curvature<br><br><b>Advantages:</b><br>Linear regime (well understood)<br>Two-point correlation function<br>Angular + radial modes<br><br><b>DESI 2024:</b><br>Hint of evolving dark energy<br>w0 = -0.7, wa = -0.6<br>Tension with Λ<br>~3σ significance</div></div>'}});
registerModule('inflation',{title:'Cosmic Inflation',icon:'💨',desc:'Exponential expansion in early universe',cat:'cosmo',init:function(){this.compute()},
compute:function(){var i=STATE.inflation;i.timeline=[];for(var logt=-36;logt<=-32;logt+=0.05){var t=Math.pow(10,logt);var a=Math.exp(H0*i.H_initial*1e-6*t*1e-10);i.timeline.push({t:t,a:a})}i.N=60},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var i=STATE.inflation;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('INFLATION — N='+i.N+' e-folds · a grows by e^'+i.N,24,32);var px=60,py=60,pw=W-140,ph=H-140;drawAxes(ctx,px,py,pw,ph,'log t (s)','log a');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();i.timeline.forEach(function(p,idx){var x=px+(Math.log10(p.t)+36)/4*pw;var y=py+ph-Math.min(Math.log10(p.a)+30,30)/30*ph;if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('a(t) ∝ e^(Ht)',px+10,py+15);ctx.fillStyle='#5c5078';ctx.fillText('Reheating',px+pw-100,py+ph-10);setStats('<div>N: '+i.N+' e-folds</div><div>H: 10³⁶ s⁻¹</div>');badge('💨 Inflation');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
controls:function(){var i=STATE.inflation;return '<div class="sec"><h4>e-folds</h4><div class="ctrl"><div class="lbl"><span>N</span><span>'+i.N+'</span></div><input type="range" min="20" max="80" step="1" value="'+i.N+'" oninput="STATE.inflation.N=parseInt(this.value);MODULES.inflation.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Cosmic Inflation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Idea (Guth 1980, Linde, Albrecht-Steinhardt):</b><br>Exponential expansion a ∝ e^(Ht)<br>Duration ~ 10⁻³² s<br>Scale factor grows by e^60+<br><br><b>Solves problems:</b><br>• Horizon (causality)<br>• Flatness (Ω_k→0)<br>• Monopole (dilution)<br>• Seeds of structure<br><br><b>Mechanism:</b><br>Inflaton field slowly rolling<br>Slow-roll parameters ε, η<br>Ends with reheating<br><br><b>Predictions:</b><br>• Nearly scale-invariant spectrum<br>n_s = 0.965 (measured!)<br>• Gaussian fluctuations<br>• Tensor-to-scalar r &lt; 0.06<br>• No topological defects<br><br><b>Quantum fluctuations:</b><br>Stretched to cosmic scales<br>Seed density perturbations<br>Become galaxies, CMB<br><br><b>Models:</b><br>• Chaotic (Linde)<br>• Natural<br>• Higgs inflation<br>• Starobinsky R²<br><br><b>Detection of B-modes:</b><br>Primordial GW<br>BICEP, LiteBIRD future</div></div>'}});
registerModule('darkmatter',{title:'Dark Matter Halo',icon:'⚫',desc:'NFW profile, rotation curves, evidence',cat:'cosmo',init:function(){this.compute()},
compute:function(){var d=STATE.darkmatter;d.halo=[];var rho0=1e7;for(var r=0.1;r<=200;r*=1.15){var rs=20;var x=r/rs;var rho=rho0/(x*Math.pow(1+x,2));var M=4*PI*rho0*rs*rs*rs*(Math.log(1+x)-x/(1+x));var v=Math.sqrt(G*M*1.989e30/(r*3.086e16*1e3))/1000;d.halo.push({r:r,rho:rho,M:M,v:v})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var d=STATE.darkmatter;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('DARK MATTER HALO — NFW profile · M='+fmtSci(d.M_halo,2)+' M_sun',24,32);var px=60,py=60,pw=W-140,ph=H*0.4;drawAxes(ctx,px,py,pw,ph,'log r (kpc)','log ρ (M_sun/kpc³)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();d.halo.forEach(function(p,i){var x=px+(Math.log10(p.r)+1)/3.3*pw;var y=py+ph-Math.min(Math.log10(p.rho)+3,12)/15*ph;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('NFW ρ(r)',px+10,py+15);var p2=py+ph+40;drawAxes(ctx,px,p2,pw,ph*0.6,'R (kpc)','V_c (km/s)');ctx.strokeStyle='#ff8020';ctx.lineWidth=2;ctx.beginPath();d.halo.forEach(function(p,i){var x=px+p.r/200*pw;var y=p2+ph*0.6-Math.min(p.v/300,1)*ph*0.6;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#ff8020';ctx.font='10px monospace';ctx.fillText('Rotation curve',px+10,p2+15);setStats('<div>M: '+fmtSci(d.M_halo,2)+' M_sun</div><div>c: '+d.c+'</div><div>r_s: '+d.r+' kpc</div>');badge('⚫ DM halo');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',fmtSci(d.M_halo,2)+' M_sun');SV('sbD',d.r+' kpc')},
controls:function(){var d=STATE.darkmatter;return '<div class="sec"><h4>Halo parameters</h4><div class="ctrl"><div class="lbl"><span>M_halo (M_sun)</span><span>'+fmtSci(d.M_halo,2)+'</span></div><input type="range" min="9" max="15" step="0.1" value="'+Math.log10(d.M_halo)+'" oninput="STATE.darkmatter.M_halo=Math.pow(10,parseFloat(this.value));MODULES.darkmatter.compute()"></div><div class="ctrl"><div class="lbl"><span>concentration c</span><span>'+d.c+'</span></div><input type="range" min="3" max="30" step="0.5" value="'+d.c+'" oninput="STATE.darkmatter.c=parseFloat(this.value);MODULES.darkmatter.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Dark Matter</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Evidence:</b><br>1. Galaxy rotation curves (flat)<br>2. Cluster dynamics (Zwicky 1933)<br>3. Gravitational lensing<br>4. CMB acoustic peaks<br>5. Structure formation<br>6. Bullet cluster<br>7. BAO<br><br><b>NFW profile (Navarro-Frenk-White):</b><br>ρ(r) = ρ_0/[(r/r_s)(1+r/r_s)²]<br>r_s: scale radius<br>M(r) = 4πρ_0 r_s³[ln(1+x)−x/(1+x)]<br><br><b>Concentration:</b><br>c = R_vir/r_s ~ 10<br>Higher M → lower c<br><br><b>Other profiles:</b><br>• Isothermal: ρ ∝ r⁻²<br>• Einasto<br>• Burkert (cores)<br>• Moore<br><br><b>Particle candidates:</b><br>• WIMPs (10-1000 GeV) — not found<br>• Axions (10⁻⁶ eV)<br>• Sterile ν (keV)<br>• Primordial BHs<br>• Fuzzy DM<br><br><b>Detectors:</b><br>XENON, LUX, PandaX, LZ<br>No direct detection yet</div></div>'}});
</script>
<script>
registerModule('schwarzschild',{title:'Schwarzschild BH',icon:'⚫',desc:'Non-rotating black hole geometry',cat:'relativistic',init:function(){this.compute()},
compute:function(){var s=STATE.schwarzschild;s.rs=schwarzschildR(s.M*M_SUN);s.isco=iscoR(s.M*M_SUN);s.photon=photonSphereR(s.M*M_SUN);s.T=hawkingT(s.M*M_SUN);s.entropy=bekensteinEntropy(s.M*M_SUN);s.lifetime=hawkingLifetime(s.M*M_SUN);s.radius_km=s.rs/1000},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var s=STATE.schwarzschild;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('SCHWARZSCHILD BH — M='+s.M+' M_sun · rs='+fmt(s.radius_km,2)+' km',24,32);var cx=W*0.35,cy=H*0.5;var maxR=Math.min(W,H)*0.4;ctx.fillStyle='rgba(0,0,0,1)';ctx.beginPath();ctx.arc(cx,cy,maxR*0.15,0,PI2);ctx.fill();ctx.strokeStyle='#ff8040';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,maxR*0.15,0,PI2);ctx.stroke();ctx.fillStyle='#ff8040';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('Event horizon',cx,cy+maxR*0.15+15);ctx.textAlign='left';ctx.strokeStyle='rgba(0,212,255,.6)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx,cy,maxR*0.25,0,PI2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#00d4ff';ctx.textAlign='center';ctx.fillText('Photon sphere (1.5 rs)',cx,cy-maxR*0.25-5);ctx.textAlign='left';ctx.strokeStyle='rgba(160,128,255,.4)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(cx,cy,maxR*0.35,0,PI2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#a080ff';ctx.textAlign='center';ctx.fillText('ISCO (3 rs)',cx,cy+maxR*0.35+15);ctx.textAlign='left';var ix=W*0.62,iy=60,iw=W*0.33,ih=H-100;ctx.fillStyle='rgba(8,6,26,.9)';ctx.fillRect(ix,iy,iw,ih);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,iw,ih);ctx.fillStyle='#a080ff';ctx.font='bold 11px monospace';ctx.fillText('BLACK HOLE',ix+10,iy+22);ctx.font='10px monospace';[['Mass',s.M+' M_sun'],['r_s',fmt(s.radius_km,3)+' km'],['ISCO',fmt(s.isco/1000,3)+' km'],['Photon',fmt(s.photon/1000,3)+' km'],['T_H',fmtSci(s.T,2)+' K'],['S',fmtSci(s.entropy,2)+' k_B'],['Lifetime',fmtSci(s.lifetime/3.15e7,2)+' yr']].forEach(function(r,i){ctx.fillStyle='#a89ce0';ctx.fillText(r[0]+':',ix+10,iy+50+i*24);ctx.fillStyle='#a080ff';ctx.fillText(r[1],ix+80,iy+50+i*24)});setStats('<div>M: '+s.M+' M_sun</div><div>rs: '+fmt(s.radius_km,2)+' km</div><div>T: '+fmtSci(s.T,2)+' K</div>');badge('⚫ BH M='+s.M+' M_sun');SV('sbT',fmtSci(s.T,2)+' K');SV('sbL','—');SV('sbZ','—');SV('sbM',s.M+' M_sun');SV('sbD',fmt(s.radius_km,2)+' km')},
controls:function(){var s=STATE.schwarzschild;return '<div class="sec"><h4>Mass</h4><div class="ctrl"><div class="lbl"><span>log M (M_sun)</span><span>'+Math.log10(s.M).toFixed(2)+'</span></div><input type="range" min="-1" max="10" step="0.1" value="'+Math.log10(s.M)+'" oninput="STATE.schwarzschild.M=Math.pow(10,parseFloat(this.value));MODULES.schwarzschild.compute()"></div></div><div class="sec"><h4>Examples</h4><div class="chip-row"><div class="chip" onclick="STATE.schwarzschild.M=10;MODULES.schwarzschild.compute()">Stellar (10 M_sun)</div><div class="chip" onclick="STATE.schwarzschild.M=4.3e6;MODULES.schwarzschild.compute()">Sgr A*</div><div class="chip" onclick="STATE.schwarzschild.M=6.5e9;MODULES.schwarzschild.compute()">M87*</div><div class="chip" onclick="STATE.schwarzschild.M=1e10;MODULES.schwarzschild.compute()">Ultramassive</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Schwarzschild BH</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Metric (1916):</b><br>ds² = −(1−rs/r)c²dt² + (1−rs/r)⁻¹dr² + r²dΩ²<br><br><b>Event horizon:</b><br>r_s = 2GM/c²<br>Sun: 2.95 km<br>10 M_sun: 30 km<br>Sgr A*: 1.3×10⁷ km<br><br><b>Photon sphere:</b><br>r_ph = 1.5 r_s<br>Unstable circular photon orbits<br><br><b>ISCO:</b><br>r_isco = 3 r_s = 6GM/c²<br>Innermost Stable Circular Orbit<br>Inner edge of accretion disk<br><br><b>Hawking radiation (1974):</b><br>T_H = ℏc³/(8πGMk_B)<br>Solar mass: 6×10⁻⁸ K<br>Stellar: 10⁻⁷ K<br>Evaporation time: 10⁶⁷ yr (M_sun)<br><br><b>Entropy:</b><br>S = A/(4 l_P²) · k_B<br>Bekenstein-Hawking<br>Holographic principle<br><br><b>Observations:</b><br>EHT: M87* (2019), Sgr A* (2022)<br>LIGO/Virgo: mergers<br>Nobel 2020: Genzel, Ghez</div></div>'}});
registerModule('kerr',{title:'Kerr Black Hole',icon:'🔄',desc:'Rotating black hole, ergosphere, frame dragging',cat:'relativistic',init:function(){this.compute()},
compute:function(){var k=STATE.kerr;k.rs=schwarzschildR(k.M*M_SUN);k.rp=k.rs/2+Math.sqrt(Math.pow(k.rs/2,2)-Math.pow(k.a*G*k.M*M_SUN/(C*C),2));k.ergo=k.rs;k.isco=k.rs*(1+Math.sqrt(1-k.a*k.a));k.a_star=k.a},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var k=STATE.kerr;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('KERR BH — M='+k.M+' M_sun · a*='+k.a,24,32);var cx=W/2,cy=H/2,maxR=Math.min(W,H)*0.35;ctx.save();ctx.translate(cx,cy);ctx.fillStyle='rgba(0,0,0,1)';ctx.beginPath();ctx.ellipse(0,0,maxR*k.rp/k.rs*0.3,maxR*0.2,0,0,PI2);ctx.fill();ctx.restore();ctx.strokeStyle='#ff8040';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,maxR*0.3,0,PI2);ctx.stroke();ctx.fillStyle='#ff8040';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('Event horizon',cx,cy+maxR*0.3+15);ctx.textAlign='left';ctx.strokeStyle='rgba(255,128,64,.5)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.ellipse(cx,cy,maxR*0.45,maxR*0.3,0,0,PI2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff8040';ctx.textAlign='center';ctx.fillText('Ergosphere',cx,cy-maxR*0.3-5);ctx.textAlign='left';ctx.fillStyle='#00d4ff';ctx.textAlign='center';ctx.fillText('Spin axis ↻',cx+maxR*0.5,cy);ctx.textAlign='left';var ix=W*0.65,iy=60,iw=W*0.32,ih=H-100;ctx.fillStyle='rgba(8,6,26,.9)';ctx.fillRect(ix,iy,iw,ih);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,iw,ih);ctx.fillStyle='#a080ff';ctx.font='bold 11px monospace';ctx.fillText('KERR BH',ix+10,iy+22);ctx.font='10px monospace';[['Mass',k.M+' M_sun'],['a* (spin)',k.a],['r_s',fmt(k.rs/1000,2)+' km'],['r+ (horizon)',fmt(k.rp/1000,2)+' km'],['r_ergo (eq)',fmt(k.ergo/1000,2)+' km'],['r_isco',fmt(k.isco/1000,2)+' km'],['Type',k.a<0.1?'Slow':k.a>0.9?'Near-extremal':'Moderate']].forEach(function(r,i){ctx.fillStyle='#a89ce0';ctx.fillText(r[0]+':',ix+10,iy+50+i*24);ctx.fillStyle='#a080ff';ctx.fillText(r[1],ix+120,iy+50+i*24)});setStats('<div>M: '+k.M+' M_sun</div><div>a*: '+k.a+'</div><div>r+: '+fmt(k.rp/1000,2)+' km</div>');badge('🔄 Kerr a*='+k.a);SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',k.M+' M_sun');SV('sbD',k.a)},
controls:function(){var k=STATE.kerr;return '<div class="sec"><h4>Mass</h4><div class="ctrl"><div class="lbl"><span>log M (M_sun)</span><span>'+Math.log10(k.M).toFixed(2)+'</span></div><input type="range" min="-1" max="10" step="0.1" value="'+Math.log10(k.M)+'" oninput="STATE.kerr.M=Math.pow(10,parseFloat(this.value));MODULES.kerr.compute()"></div></div><div class="sec"><h4>Spin a*</h4><div class="ctrl"><div class="lbl"><span>a*</span><span>'+k.a+'</span></div><input type="range" min="0" max="0.998" step="0.01" value="'+k.a+'" oninput="STATE.kerr.a=parseFloat(this.value);MODULES.kerr.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.kerr.M=6.5e9;STATE.kerr.a=0.9;MODULES.kerr.compute()">M87*</div><div class="chip" onclick="STATE.kerr.M=10;STATE.kerr.a=0.7;MODULES.kerr.compute()">Cygnus X-1</div><div class="chip" onclick="STATE.kerr.M=62;STATE.kerr.a=0.67;MODULES.kerr.compute()">GW150914</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Kerr Black Hole</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Metric (Kerr 1963):</b><br>Depends on (M, a)<br>a = J/(Mc), dimensionless a* = a/M<br>a* ∈ [0, 0.998] (Thorne limit)<br><br><b>Horizons:</b><br>r± = M ± √(M² − a²)<br>r+ = outer event horizon<br>r− = inner (Cauchy) horizon<br>Naked singularity if a &gt; M<br><br><b>Ergosphere:</b><br>Region where ω_frame &gt; c<br>Outside horizon<br>Penrose process: extract energy<br>Kerr max efficiency 29%<br><br><b>Frame dragging:</b><br>Lense-Thirring effect<br>Precession of gyroscopes<br>Gravity Probe B (2011)<br><br><b>ISCO (Bardeen 1972):</b><br>r_isco = M[3 + √(9−8a²)]<br>a=0: 6M (Schwarzschild)<br>a=1: 1M (prograde)<br>a=1: 9M (retrograde)<br><br><b>Energy extraction:</b><br>Up to 29% of Mc²<br>vs 5.7% Schwarzschild<br><br><b>Examples:</b><br>M87*: a* &gt; 0.9<br>Sgr A*: a* ~ 0.9<br>GRS 1915+105: a* &gt; 0.98<br><br><b>Nobel 2020:</b> Penrose</div></div>'}});
registerModule('lensing',{title:'Gravitational Lensing',icon:'🔍',desc:'Einstein rings, multiple images, microlensing',cat:'relativistic',init:function(){this.compute()},
compute:function(){var l=STATE.lensing;l.thetaE=einsteinRadius(l.M*M_SUN,l.D_L*Mpc,l.D_LS*Mpc,l.D_S*Mpc);l.images=[];var beta=0;var theta=0;for(var t=-0.3;t<=0.3;t+=0.005){var t2=t*l.thetaE+0.5*l.thetaE;var val=t2-(l.thetaE*l.thetaE)/Math.max(t2,1e-30);l.images.push({beta:t,theta1:t2})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var l=STATE.lensing;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('GRAVITATIONAL LENS — M='+fmtSci(l.M,2)+' M_sun · θ_E='+fmt(l.thetaE,4),24,32);var cx=W*0.35,cy=H/2;var maxR=Math.min(W,H)*0.35;ctx.fillStyle='rgba(160,128,255,.4)';ctx.beginPath();ctx.arc(cx,cy,60,0,PI2);ctx.fill();ctx.fillStyle='#a080ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('Lens',cx,cy+4);ctx.textAlign='left';ctx.strokeStyle='#ff8040';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,maxR*0.6,0,PI2);ctx.stroke();ctx.fillStyle='#ff8040';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('Einstein ring',cx,cy-maxR*0.6-5);ctx.textAlign='left';ctx.fillStyle='#00d4ff';ctx.beginPath();ctx.arc(cx,cy-maxR*0.6+5,6,0,PI2);ctx.fill();ctx.beginPath();ctx.arc(cx,cy+maxR*0.6-5,6,0,PI2);ctx.fill();ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(cx,cy-20,8,0,PI2);ctx.fill();var ix=W*0.65,iy=60,iw=W*0.32,ih=H-100;ctx.fillStyle='rgba(8,6,26,.9)';ctx.fillRect(ix,iy,iw,ih);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,iw,ih);ctx.fillStyle='#a080ff';ctx.font='bold 11px monospace';ctx.fillText('LENSING',ix+10,iy+22);ctx.font='10px monospace';[['Lens mass',fmtSci(l.M,2)+' M_sun'],['D_L',l.D_L+' Mpc'],['D_S',l.D_S+' Mpc'],['D_LS',l.D_LS+' Mpc'],['θ_E',fmt(l.thetaE,5)+' rad'],['θ_E (arcsec)',fmt(l.thetaE*206265,3)]].forEach(function(r,i){ctx.fillStyle='#a89ce0';ctx.fillText(r[0]+':',ix+10,iy+50+i*24);ctx.fillStyle='#a080ff';ctx.fillText(r[1],ix+120,iy+50+i*24)});setStats('<div>M: '+fmtSci(l.M,2)+' M_sun</div><div>θ_E: '+fmt(l.thetaE*206265,2)+'"</div>');badge('🔍 Lensing θ_E='+fmt(l.thetaE*206265,2)+'"');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',fmtSci(l.M,2)+' M_sun');SV('sbD',fmt(l.thetaE*206265,2)+'"')},
controls:function(){var l=STATE.lensing;return '<div class="sec"><h4>Lens mass</h4><div class="ctrl"><div class="lbl"><span>log M</span><span>'+Math.log10(l.M).toFixed(2)+'</span></div><input type="range" min="10" max="14" step="0.1" value="'+Math.log10(l.M)+'" oninput="STATE.lensing.M=Math.pow(10,parseFloat(this.value));MODULES.lensing.compute()"></div></div><div class="sec"><h4>Distances (Mpc)</h4><div class="ctrl"><div class="lbl"><span>D_L</span><span>'+l.D_L+'</span></div><input type="range" min="1" max="2000" step="1" value="'+l.D_L+'" oninput="STATE.lensing.D_L=parseFloat(this.value);MODULES.lensing.compute()"></div><div class="ctrl"><div class="lbl"><span>D_S</span><span>'+l.D_S+'</span></div><input type="range" min="100" max="5000" step="10" value="'+l.D_S+'" oninput="STATE.lensing.D_S=parseFloat(this.value);MODULES.lensing.compute()"></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Gravitational Lensing</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Deflection angle:</b><br>α = 4GM/(c²b) (Einstein 1915)<br>Confirmed by Eddington 1919<br><br><b>Einstein radius:</b><br>θ_E = √(4GM D_LS/(c² D_L D_S))<br><br><b>Lens equation:</b><br>β = θ − θ_E²/θ<br>Two solutions: θ± = (β ± √(β²+4θ_E²))/2<br><br><b>Types:</b><br>• Strong: multiple images, arcs, rings<br>• Weak: statistical shear (cosmic shear)<br>• Microlensing: brightening<br><br><b>Applications:</b><br>• Dark matter mapping<br>• Hubble constant (time delays)<br>• Magnification of distant objects<br>• Exoplanet detection (microlensing)<br>• MACHO searches<br><br><b>Famous:</b><br>Einstein Cross (QSO 2237+0305)<br>Abell 1689 (strong lensing cluster)<br>Bullet Cluster (DM+BAC)<br>James Webb: SMACS 0723<br><br><b>Cosmic shear:</b><br>Weak lensing by LSS<br>Probes Ω_m, σ_8<br>Euclid, Rubin LSST</div></div>'}});
registerModule('gravwaves',{title:'Gravitational Waves',icon:'🌊',desc:'Binary mergers, chirp mass, LIGO detection',cat:'relativistic',init:function(){this.compute()},
compute:function(){var g=STATE.gravwaves;g.Mc=chirpMass(g.M1*M_SUN,g.M2*M_SUN)/M_SUN;g.strain=gravWaveStrain(g.M1*M_SUN,g.M2*M_SUN,g.d);g.chi=(g.M1*g.M2)/Math.pow(g.M1+g.M2,2);g.f_isco=C*C*C/(6*Math.sqrt(2)*Math.PI*G*(g.M1+g.M2)*M_SUN)},
