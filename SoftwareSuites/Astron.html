<!DOCTYPE html><html lang="en" data-theme="astron"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ASTRON — Astronomy & Cosmology Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;transition:background .3s,color .3s}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--p1)}
:root{--bg:#02010a;--panel:#08061a;--panel2:#0e0c26;--panel3:#181438;--panel4:#241e4c;--bd:#181440;--bd2:#302870;--tx:#f0e8ff;--tx2:#a89ce0;--tx3:#5c5078;--p1:#a080ff;--p2:#00d4ff;--p3:#ff80c0;--p4:#ffb040;--p5:#40ffb0;--p6:#ff6060;--g1:linear-gradient(135deg,#a080ff,#00d4ff);--gHolo:linear-gradient(120deg,#a080ff,#00d4ff,#ff80c0,#ffb040,#40ffb0,#a080ff);--mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;--sans:'Inter','SF Pro',system-ui,sans-serif;--disp:'Orbitron',monospace;--t1:all .2s cubic-bezier(.4,0,.2,1);--shadow:0 4px 24px rgba(0,0,0,.5);--glow:0 0 24px rgba(160,128,255,.4)}
[data-theme="day"]{--bg:#f4f0fc;--panel:#fff;--panel2:#f6f2fc;--panel3:#e8e0f8;--panel4:#d4c8ec;--bd:#c8b8e4;--bd2:#9078c0;--tx:#100828;--tx2:#402868;--tx3:#8070a0;--p1:#6020c0;--p2:#0080c0;--p3:#c02080;--p4:#d08020;--p5:#00a080;--p6:#c03030;--g1:linear-gradient(135deg,#6020c0,#0080c0);--shadow:0 4px 24px rgba(0,0,0,.08)}
[data-theme="nebula"]{--bg:#040210;--panel:#0a0620;--panel2:#140c30;--panel3:#201848;--panel4:#2c2460;--bd:#1a1440;--bd2:#382c68;--tx:#f0e0ff;--tx2:#c0a0e0;--tx3:#7060a0;--p1:#ff60c0;--p2:#a080ff;--g1:linear-gradient(135deg,#ff60c0,#a080ff)}
[data-theme="solar"]{--bg:#0a0402;--panel:#1a0a04;--panel2:#281408;--panel3:#3a2010;--panel4:#4c2c18;--bd:#301a0c;--bd2:#603820;--tx:#fff4e0;--tx2:#c09070;--tx3:#806040;--p1:#ff8020;--p2:#ffb040;--g1:linear-gradient(135deg,#ff8020,#ffb040)}
[data-theme="matrix"]{--bg:#020804;--panel:#041008;--panel2:#081810;--panel3:#0c2418;--panel4:#123020;--bd:#082014;--bd2:#104028;--tx:#c0ffd8;--tx2:#70b888;--tx3:#406848;--p1:#40ff80;--p2:#00e0ff;--g1:linear-gradient(135deg,#40ff80,#00e0ff)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;z-index:100;position:relative}
#topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--g1);opacity:.6}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;cursor:pointer;padding:6px 12px;border-radius:6px;transition:var(--t1)}
.tb-logo:hover{background-color:var(--panel2)}
.breadcrumb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.58rem;color:var(--tx3);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.breadcrumb .bc-item{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;transition:var(--t1)}
.breadcrumb .bc-item.active{color:var(--p1);background:rgba(160,128,255,.1)}
.breadcrumb .bc-sep{color:var(--tx3);opacity:.5}
.tb-search{position:relative;flex-shrink:0;width:220px}
.tb-search input{width:100%;background:var(--panel2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px 6px 30px;font-size:.62rem;font-family:var(--mono);color:var(--tx);transition:var(--t1)}
.tb-search input:focus{border-color:var(--p1);box-shadow:var(--glow)}
.tb-search::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:1rem;pointer-events:none}
.tb-search .kbd-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.5rem;color:var(--tx3);background:var(--panel3);padding:1px 5px;border-radius:3px;pointer-events:none}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:34px;height:34px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.95rem;position:relative}
.tb-btn:hover{background:var(--panel2);color:var(--p1);border-color:var(--bd)}
.tb-btn.pulse{animation:btnPulse 1.2s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(160,128,255,.4)}50%{box-shadow:0 0 0 8px rgba(160,128,255,0)}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:280px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono);display:flex;align-items:center;gap:6px}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--p1);box-shadow:0 0 8px var(--p1)}
.panel-body{flex:1;overflow-y:auto;padding:8px;scroll-behavior:smooth}
.cat-section{margin-bottom:6px;border-radius:6px;overflow:hidden}
.cat-head{padding:7px 10px;background:var(--panel3);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.6rem;font-family:var(--mono);font-weight:700;color:var(--tx2);transition:var(--t1)}
.cat-head:hover{background:var(--panel4);color:var(--tx)}
.cat-head .cat-arrow{transition:transform .2s;color:var(--tx3);font-size:.7rem}
.cat-section.open .cat-arrow{transform:rotate(90deg);color:var(--p1)}
.cat-items{max-height:0;overflow:hidden;transition:max-height .3s ease}
.cat-section.open .cat-items{max-height:1500px}
.cat-item{padding:6px 12px 6px 20px;font-size:.6rem;font-family:var(--mono);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;gap:8px;border-left:2px solid transparent}
.cat-item:hover{background:var(--panel3);color:var(--tx);border-left-color:var(--p1)}
.cat-item.active{background:rgba(160,128,255,.12);color:var(--p1);border-left-color:var(--p1);font-weight:600}
.cat-item .ci-icon{font-size:.85rem;opacity:.85}
.cat-item .ci-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg);position:relative}
#canvasWrap{flex:1;position:relative;background:#000005;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(160,128,255,.006) 0,rgba(160,128,255,.006) 1px,transparent 1px,transparent 4px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(8,6,26,.85);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;font-family:var(--mono);font-size:.58rem;color:var(--p1);max-width:340px;box-shadow:var(--shadow)}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.4}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.4,0,.2,1);overflow:hidden}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:36px;padding:4px;gap:2px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:5px;transition:var(--t1)}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--bg);background:var(--g1);font-weight:700}
.rp-body{flex:1;overflow-y:auto;padding:10px;scroll-behavior:smooth}
.rp-pane{display:none;animation:fadeIn .2s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.55rem;color:var(--tx3);flex-shrink:0;overflow-x:auto;position:relative}
#statusbar::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p1),transparent);opacity:.5}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1);font-weight:600}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}.sb-val.c6{color:var(--p6)}
.sec{margin-bottom:14px;animation:fadeIn .25s ease}
.sec h4{font-size:.56rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--panel3);color:var(--p1);padding:1px 6px;border-radius:10px;font-size:.5rem;font-weight:600}
.lbl{font-size:.56rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;font-weight:600;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none;font-weight:700}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--g1);border-radius:50%;cursor:pointer;box-shadow:0 0 12px rgba(160,128,255,.6);transition:transform .15s}
.ctrl input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:6px 9px;color:var(--tx);font-size:.64rem;font-family:var(--mono);transition:var(--t1)}
.ctrl input:focus,.ctrl textarea:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(160,128,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:5px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1);transform:translateY(-1px)}
.btn.primary{background:var(--g1);color:var(--bg);border-color:transparent}
.btn.primary:hover{box-shadow:var(--glow)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.56rem}
.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:99px;cursor:pointer;font-size:.56rem;font-family:var(--mono);color:var(--tx2);transition:var(--t1)}
.chip:hover{border-color:var(--p1);color:var(--p1);transform:translateY(-1px)}
.chip.active{background:var(--g1);color:var(--bg);border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.56rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.56rem;word-break:break-all;max-width:170px;font-weight:600}
.empty{text-align:center;padding:24px 16px;color:var(--tx3);font-size:.62rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;animation:modalFade .2s ease}
.modal-bg.show{display:flex}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:12px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:modalPop .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal.lg{max-width:1000px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;color:var(--p1);font-family:var(--disp);letter-spacing:1.5px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;color:var(--tx3);cursor:pointer;font-size:1rem;border-radius:5px;transition:var(--t1);display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--panel3);color:var(--p6)}
#cmdPalette{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:6000;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#cmdPalette.show{display:flex}
.cmd-box{background:var(--panel);border:1px solid var(--bd);border-radius:12px;width:min(600px,90vw);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:modalPop .2s ease}
.cmd-input{width:100%;padding:16px 20px;background:transparent;border:none;border-bottom:1px solid var(--bd);font-size:.9rem;font-family:var(--mono);color:var(--tx);outline:none}
.cmd-input::placeholder{color:var(--tx3)}
.cmd-results{max-height:400px;overflow-y:auto;padding:8px}
.cmd-item{padding:10px 14px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:var(--t1);font-size:.7rem}
.cmd-item:hover,.cmd-item.selected{background:var(--panel2);color:var(--p1)}
.cmd-item .cmd-icon{font-size:1.1rem;opacity:.85}
.cmd-item .cmd-name{flex:1;font-weight:500}
.cmd-item .cmd-cat{font-family:var(--mono);font-size:.55rem;color:var(--tx3)}
.cmd-empty{padding:30px 20px;text-align:center;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.66rem;max-width:340px;min-width:180px;animation:tin .35s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;font-family:var(--mono);pointer-events:auto;box-shadow:var(--shadow);transition:opacity .3s,transform .3s}
.toast.fade-out{opacity:0;transform:translateX(20px)}
.toast.success{border-left-color:var(--p5)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p6)}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.fab{position:fixed;bottom:44px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--g1);border:none;color:var(--bg);cursor:pointer;font-size:1.3rem;box-shadow:0 8px 24px rgba(160,128,255,.5);z-index:8000;transition:var(--t1);display:flex;align-items:center;justify-content:center}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 12px 32px rgba(160,128,255,.7)}
.grid-overlay{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:12px;cursor:pointer;transition:var(--t1)}
.card:hover{border-color:var(--p1);background:var(--panel3);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-title{font-size:.68rem;font-weight:600;color:var(--tx);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-desc{font-size:.55rem;color:var(--tx3);font-family:var(--mono);line-height:1.5}
@media(max-width:1000px){#leftPanel{width:240px}#rightPanel{width:280px}.tb-search{width:160px}}
@media(max-width:760px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-search{width:120px}}
@media(max-width:500px){.tb-search{display:none}.breadcrumb{font-size:.5rem}}
</style></head><body>
<div id="app">
<div id="topbar">
<div class="tb-logo" onclick="openHome()">ASTRON</div>
<div class="breadcrumb" id="breadcrumb"><div class="bc-item"><span style="color:var(--tx3)">Home</span></div></div>
<div class="tb-search"><input type="text" id="tabSearch" placeholder="Search modules..." oninput="filterTabs(this.value)"><span class="kbd-hint">⌘K</span></div>
<div class="tb-actions">
<button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause">⏸</button>
<button class="tb-btn" onclick="stepOnce()" title="Step">⏭</button>
<button class="tb-btn" onclick="resetModule()" title="Reset">↺</button>
<button class="tb-btn" onclick="toggleLeftPanel()" title="Left panel">◀</button>
<button class="tb-btn" onclick="toggleRightPanel()" title="Right panel">▶</button>
<button class="tb-btn" onclick="openSettings()" title="Settings">⚙</button>
<button class="tb-btn" onclick="toggleTheme()" title="Theme">🎨</button>
<button class="tb-btn" onclick="openHelp()" title="Help">❓</button>
</div></div>
<div id="main">
<div id="leftPanel"><div class="panel-head"><span class="panel-title"><span class="dot"></span>Modules</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
<div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
<div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
</div></div>
<div id="rightPanel"><div class="rp-tabs">
<div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
<div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
<div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
</div><div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div></div>
</div>
<div id="statusbar">
<div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
<div class="sb-item"><span style="color:var(--tx3)">T</span><span class="sb-val c2" id="sbT">0</span></div>
<div class="sb-item"><span style="color:var(--tx3)">L</span><span class="sb-val c3" id="sbL">0</span></div>
<div class="sb-item"><span style="color:var(--tx3)">z</span><span class="sb-val c4" id="sbZ">0</span></div>
<div class="sb-item"><span style="color:var(--tx3)">M</span><span class="sb-val c5" id="sbM">0</span></div>
<div class="sb-item"><span style="color:var(--tx3)">d</span><span class="sb-val c6" id="sbD">0</span></div>
<div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Home</span></div>
</div>

compute:function(){var b=STATE.blackbody;b.spectrum=[];for(var lam=1;lam<=3000;lam+=5){b.spectrum.push({lambda:lam,B:planck(lam*1e-9,b.T)})}b.peak=wienPeak(b.T)*1e9;b.color=tempColor(b.T);b.L=stefanL(R_SUN,b.T)},

registerModule('hrdiagram',{title:'H-R Diagram',icon:'📊',desc:'Hertzsprung-Russell diagram with main sequence',cat:'stellar',init:function(){this.compute()},
compute:function(){var h=STATE.hrdiagram;h.stars=[];for(var i=0;i<60;i++){var M=Math.random()*20+0.2;var L=massLuminosity(M);var T=5772*Math.pow(M,0.5);var R=Math.sqrt(L)/Math.pow(T/5772,2);h.stars.push({M:M,L:L,T:T,R:R,type:'main'})}for(var j=0;j<20;j++){h.stars.push({M:1,L:Math.random()*1000+100,T:3000+Math.random()*2000,R:10,type:'giant'})}for(var k=0;k<10;k++){h.stars.push({M:15,L:Math.random()*1e5+1e4,T:3500+Math.random()*5000,R:500,type:'super'})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var h=STATE.hrdiagram;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('H-R DIAGRAM — '+h.stars.length+' stars',24,32);var px=80,py=60,pw=W-160,ph=H-140;drawAxes(ctx,px,py,pw,ph,'T (K)','L / L_sun');var Tmin=2500,Tmax=50000;var Lmin=-5,Lmax=6;ctx.strokeStyle='rgba(160,128,255,.3)';ctx.font='9px monospace';ctx.fillStyle='#5c5078';[3000,5000,10000,30000].forEach(function(T){var x=px+Math.log10(Tmax/T)/Math.log10(Tmax/Tmin)*pw;ctx.fillText(T+'K',x-10,py+ph+15)});h.stars.forEach(function(s){var x=px+Math.log10(Tmax/s.T)/Math.log10(Tmax/Tmin)*pw;var y=py+(Lmax-Math.log10(s.L))/(Lmax-Lmin)*ph;if(y<py||y>py+ph||x<px||x>px+pw)return;var col=tempColor(s.T);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,s.type==='main'?3:5,0,PI2);ctx.fill()});ctx.fillStyle='rgba(160,128,255,.9)';ctx.font='bold 10px monospace';ctx.fillText('Main Sequence',px+pw*0.55,py+ph*0.35);ctx.fillText('Giants',px+pw*0.2,py+ph*0.15);ctx.fillText('Supergiants',px+pw*0.15,py+ph*0.05);setStats('<div>Stars: '+h.stars.length+'</div>');badge('📊 H-R Diagram');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD','—')},
