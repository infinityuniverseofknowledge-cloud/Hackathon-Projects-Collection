controls:function(){var j=STATE.jets;return '<div class="sec"><h4>Lorentz factor</h4><div class="ctrl"><div class="lbl"><span>Γ</span><span>'+j.gamma+'</span></div><input type="range" min="1" max="50" step="0.5" value="'+j.gamma+'" oninput="STATE.jets.gamma=parseFloat(this.value);MODULES.jets.compute()"></div></div><div class="sec"><h4>Viewing angle</h4><div class="ctrl"><div class="lbl"><span>θ (deg)</span><span>'+fmt(deg(j.theta),1)+'</span></div><input type="range" min="0" max="90" step="0.5" value="'+deg(j.theta)+'" oninput="STATE.jets.theta=rad(parseFloat(this.value));MODULES.jets.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.jets.gamma=10;STATE.jets.theta=rad(5);MODULES.jets.compute()">Blazar</div><div class="chip" onclick="STATE.jets.gamma=50;STATE.jets.theta=rad(2);MODULES.jets.compute()">Blazar strong</div><div class="chip" onclick="STATE.jets.gamma=10;STATE.jets.theta=rad(70);MODULES.jets.compute()">Radio galaxy</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Relativistic Jets</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Doppler factor:</b><br>D = 1/[Γ(1 − β·cos θ)]<br>Doppler boosting: I ∝ D³<br><br><b>Superluminal motion:</b><br>β_app = β·sin θ/(1 − β·cos θ)<br>Apparent &gt; c possible<br>Max at θ = arccos(β)<br>β_app_max = Γ (for γ » 1)<br><br><b>Lorentz factor:</b><br>Γ = 1/√(1 − β²)<br>AGN jets: Γ ~ 10-50<br>GRB jets: Γ ~ 100-1000<br><br><b>Beaming cone:</b><br>1/Γ half-angle<br>Γ=10 → 5.7°<br>Γ=1000 → 0.06°<br><br><b>Energy:</b><br>Jets carry ~10% of AGN L<br>P_jet ~ 10⁴⁴-10⁴⁶ erg/s<br>Mechanical vs radiative<br><br><b>Famous:</b><br>M87 jet (EHT)<br>3C 273 (quasar, first)<br>Cen A (nearest AGN)<br>GRB jets (internal/external shocks)<br><br><b>Multi-messenger:</b><br>IC 170922A — neutrino + blazar<br>IceCube + Fermi</div></div>'}});
</script>
<script>
registerModule('exoplanetTransit',{title:'Exoplanet Transit',icon:'🪐',desc:'Transit light curve, radius, orbital parameters',cat:'exo',init:function(){this.compute()},
compute:function(){var e=STATE.exoplanetTransit;e.depth=transitDepth(e.Rp,e.Rs);e.duration=transitDuration(e.P*86400,e.Rs*R_SUN,e.Rp*R_JUP,e.a*AU,0);e.flux=[];for(var t=-e.P/2;t<=e.P/2;t+=e.P/100){var phase=t/e.P;var dist=e.a*Math.sin(phase*PI2);var r=Math.sqrt(dist*dist);var impact=0;if(r<e.Rs*R_SUN+e.Rp*R_JUP){var overlap=Math.min(1,(e.Rs*R_SUN+e.Rp*R_JUP-r)/(2*e.Rp*R_JUP));e.flux.push({t:t,depth:e.depth*overlap})}else{e.flux.push({t:t,depth:0})}}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var e=STATE.exoplanetTransit;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('TRANSIT — Rp='+e.Rp+' R_J · Rs='+e.Rs+' R_sun · depth='+fmt(e.depth*100,3)+'%',24,32);var px=60,py=60,pw=W-140,ph=H*0.4;drawAxes(ctx,px,py,pw,ph,'time (d)','flux');e.flux.forEach(function(p,i){var x=px+(p.t+e.P/2)/e.P*pw;var y=py+20+(p.depth)*ph*5;ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;if(i===0)ctx.beginPath();if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('Light curve (depth × 5)',px+10,py+15);var cx=W/2,cy=H*0.75;var maxR=Math.min(W,H)*0.18;ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(cx,cy,maxR*e.Rs/1.5,0,PI2);ctx.fill();ctx.fillStyle='#a080ff';ctx.beginPath();ctx.arc(cx-maxR*1.5,cy+30,maxR*e.Rp/2,0,PI2);ctx.fill();ctx.fillStyle='#e0f0ff';ctx.font='10px monospace';ctx.fillText('Star',cx-20,cy-maxR*e.Rs/1.5-10);ctx.fillText('Planet',cx-maxR*1.5-20,cy+30+maxR*e.Rp/2+15);setStats('<div>Depth: '+fmt(e.depth*100,3)+'%</div><div>Rp: '+e.Rp+' R_J</div>');badge('🪐 Transit depth='+fmt(e.depth*100,2)+'%');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD',e.P+' d')},
controls:function(){var e=STATE.exoplanetTransit;return '<div class="sec"><h4>Planet</h4><div class="ctrl"><div class="lbl"><span>Rp (R_Jup)</span><span>'+e.Rp+'</span></div><input type="range" min="0.1" max="2.5" step="0.05" value="'+e.Rp+'" oninput="STATE.exoplanetTransit.Rp=parseFloat(this.value);MODULES.exoplanetTransit.compute()"></div><div class="ctrl"><div class="lbl"><span>P (days)</span><span>'+e.P+'</span></div><input type="range" min="0.5" max="1000" step="1" value="'+e.P+'" oninput="STATE.exoplanetTransit.P=parseFloat(this.value);MODULES.exoplanetTransit.compute()"></div><div class="ctrl"><div class="lbl"><span>a (AU)</span><span>'+e.a+'</span></div><input type="range" min="0.01" max="2" step="0.01" value="'+e.a+'" oninput="STATE.exoplanetTransit.a=parseFloat(this.value);MODULES.exoplanetTransit.compute()"></div></div><div class="sec"><h4>Known planets</h4><div class="chip-row"><div class="chip" onclick="STATE.exoplanetTransit.Rp=1.4;STATE.exoplanetTransit.P=4.2;STATE.exoplanetTransit.a=0.05;MODULES.exoplanetTransit.compute()">Hot Jupiter</div><div class="chip" onclick="STATE.exoplanetTransit.Rp=0.1;STATE.exoplanetTransit.P=365;STATE.exoplanetTransit.a=1;MODULES.exoplanetTransit.compute()">Earth-like</div><div class="chip" onclick="STATE.exoplanetTransit.Rp=0.5;STATE.exoplanetTransit.P=10;STATE.exoplanetTransit.a=0.1;MODULES.exoplanetTransit.compute()">Super-Earth</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Exoplanet Transit</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Transit depth:</b><br>ΔF/F = (Rp/Rs)²<br>Earth-Sun: 84 ppm<br>Jupiter-Sun: 1.0%<br>Hot Jupiter: 1-2%<br><br><b>Duration:</b><br>t_dur ≈ (P/π)·arcsin(√[(Rs+Rp)²−b²]/a)<br>b = impact parameter<br><br><b>Probability:</b><br>P_transit ≈ Rs/a<br>Earth: 0.5%<br>Hot Jupiter: 10%<br><br><b>Kepler mission:</b><br>2009-2018<br>~2,700 confirmed planets<br>Thousands of candidates<br>200,000 stars monitored<br>30 min cadence<br><br><b>TESS (2018+):</b><br>All-sky survey<br>Bright stars (continuations)<br>~200-500 planets/year<br><br><b>JWST:</b><br>Atmospheric spectra<br>CO₂, H₂O, CH₄<br>Biosignatures (future)<br><br><b>Timing variations:</b><br>TTV → more planets<br>Orbital dynamics</div></div>'}});
registerModule('exoplanetRV',{title:'Radial Velocity Method',icon:'📉',desc:'Doppler wobble detection of exoplanets',cat:'exo',init:function(){this.compute()},
compute:function(){var e=STATE.exoplanetRV;e.K=radialVelocityK(0,M_EARTH*e.Mp,M_SUN*e.Mstar,e.P*86400,0);e.K=28.4*e.Mp/Math.pow(e.Mstar,2/3)*Math.pow(1/e.P/365.25,1/3);e.rv=[];for(var t=-2;t<=2;t+=0.02){e.rv.push({t:t,v:e.K*Math.sin(t*PI2)})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var e=STATE.exoplanetRV;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('RADIAL VELOCITY — Mp='+e.Mp+' M_E · K='+fmt(e.K,2)+' m/s',24,32);var px=60,py=60,pw=W-140,ph=H-160;drawAxes(ctx,px,py,pw,ph,'phase','RV (m/s)');ctx.strokeStyle='#00d4ff';ctx.lineWidth=2;ctx.beginPath();e.rv.forEach(function(p,i){var x=px+(p.t+2)/4*pw;var y=py+ph/2-p.v/Math.max(e.K,1)*ph/2;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle='#00d4ff';ctx.font='10px monospace';ctx.fillText('RV curve',px+10,py+15);setStats('<div>K: '+fmt(e.K,2)+' m/s</div><div>Mp: '+e.Mp+' M_E</div>');badge('📉 RV K='+fmt(e.K,1)+' m/s');SV('sbT','—');SV('sbL','—');SV('sbZ','—');SV('sbM',e.Mstar+' M_sun');SV('sbD',e.P+' d')},
controls:function(){var e=STATE.exoplanetRV;return '<div class="sec"><h4>Planet</h4><div class="ctrl"><div class="lbl"><span>Mp (M_Earth)</span><span>'+e.Mp+'</span></div><input type="range" min="0.1" max="5000" step="0.1" value="'+e.Mp+'" oninput="STATE.exoplanetRV.Mp=parseFloat(this.value);MODULES.exoplanetRV.compute()"></div><div class="ctrl"><div class="lbl"><span>P (days)</span><span>'+e.P+'</span></div><input type="range" min="1" max="1000" step="1" value="'+e.P+'" oninput="STATE.exoplanetRV.P=parseFloat(this.value);MODULES.exoplanetRV.compute()"></div></div><div class="sec"><h4>Presets</h4><div class="chip-row"><div class="chip" onclick="STATE.exoplanetRV.Mp=317.8;STATE.exoplanetRV.P=4.2;MODULES.exoplanetRV.compute()">Hot Jupiter</div><div class="chip" onclick="STATE.exoplanetRV.Mp=1;STATE.exoplanetRV.P=365;MODULES.exoplanetRV.compute()">Earth</div><div class="chip" onclick="STATE.exoplanetRV.Mp=17;STATE.exoplanetRV.P=100;MODULES.exoplanetRV.compute()">Neptune-like</div><div class="chip" onclick="STATE.exoplanetRV.Mp=0.5;STATE.exoplanetRV.P=10;MODULES.exoplanetRV.compute()">Super-Earth</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Radial Velocity Method</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Doppler shift:</b><br>Δλ/λ = v_r/c<br>Star wobbles around barycenter<br><br><b>RV semi-amplitude:</b><br>K = (2πG/P)^(1/3)·Mp sin i/(Mp+M_star)^(2/3)·1/√(1−e²)<br>Simplified:<br>K = 28.4 m/s · (Mp sin i/M_J)·(P/1yr)^(-1/3)·(M_star/M_sun)^(-2/3)<br><br><b>Sensitivity:</b><br>Earth-Sun: K = 9 cm/s<br>Jupiter-Sun: 12.5 m/s<br>Hot Jupiter: 50-200 m/s<br>Current limit: ~30 cm/s (ESPRESSO)<br>Future: 1 cm/s (EXPRESS)\n<br><b>Advantages:</b><br>• Mass (not radius)<br>• Non-transiting OK<br>• Confirms transit planets<br>• Orbital eccentricity<br><br><b>Disadvantages:</b><br>• sin i ambiguity<br>• Activity jitter<br>• Long-period hard<br><br><b>First detection:</b><br>51 Peg b (Mayor, Queloz 1995)<br>Nobel 2019<br><br><b>Instruments:</b><br>HARPS, HIRES, ESPRESSO, NEID</div></div>'}});
registerModule('habitable',{title:'Habitable Zone',icon:'🌍',desc:'Where liquid water can exist — Kopparapu 2013',cat:'exo',init:function(){this.compute()},
compute:function(){var h=STATE.habitable;var ri=Math.sqrt(h.L/1.107);var ro=Math.sqrt(h.L/0.356);var rc=Math.sqrt(h.L/0.53);h.zone=[{name:'Recent Venus',r:ri*1.776,color:'rgba(255,200,100,.3)'},{name:'Runaway Greenhouse',r:ri,color:'rgba(255,128,64,.4)'},{name:'Maximum Greenhouse',r:ro,color:'rgba(0,180,255,.3)'},{name:'Early Mars',r:rc*1.7,color:'rgba(160,128,255,.3)'}];h.T_eq=equilibriumTemp(h.L*L_SUN,AU,h.albedo);h.earth_T=equilibriumTemp(L_SUN,AU,0.3)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var h=STATE.habitable;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('HABITABLE ZONE — L='+h.L+' L_sun · T_eq='+fmt(h.T_eq-273.15,1)+'°C',24,32);var cx=W*0.35,cy=H/2;var maxR=Math.min(W,H)*0.4;ctx.fillStyle='#ffb040';ctx.beginPath();ctx.arc(cx,cy,15,0,PI2);ctx.fill();ctx.fillStyle='rgba(255,180,64,.3)';ctx.beginPath();ctx.arc(cx,cy,25,0,PI2);ctx.fill();h.zone.forEach(function(z){var r=z.r*maxR/3;ctx.strokeStyle=z.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,PI2);ctx.stroke()});var earthR=maxR/3;ctx.fillStyle='#40ffb0';ctx.beginPath();ctx.arc(cx+earthR,cy,8,0,PI2);ctx.fill();ctx.fillStyle='#40ffb0';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('Earth',cx+earthR,cy-15);ctx.textAlign='left';var legend=W*0.6;ctx.font='10px monospace';h.zone.forEach(function(z,i){ctx.fillStyle=z.color;ctx.fillRect(legend,60+i*30,20,12);ctx.fillStyle='#a89ce0';ctx.fillText(z.name,legend+30,70+i*30);ctx.fillStyle='#a080ff';ctx.fillText(fmt(z.r,3)+' AU',legend+30,85+i*30)});setStats('<div>L: '+h.L+' L_sun</div><div>T_eq: '+fmt(h.T_eq-273.15,1)+'°C</div>');badge('🌍 HZ L='+h.L);SV('sbT',fmt(h.T_eq,0)+' K');SV('sbL',h.L+' L_sun');SV('sbZ','—');SV('sbM','—');SV('sbD',fmt(1/Math.sqrt(h.L),2)+' AU')},
controls:function(){var h=STATE.habitable;return '<div class="sec"><h4>Star luminosity</h4><div class="ctrl"><div class="lbl"><span>L (L_sun)</span><span>'+h.L+'</span></div><input type="range" min="0.001" max="1000" step="0.01" value="'+h.L+'" oninput="STATE.habitable.L=parseFloat(this.value);MODULES.habitable.compute()"></div></div><div class="sec"><h4>Albedo</h4><div class="ctrl"><div class="lbl"><span>α</span><span>'+h.albedo+'</span></div><input type="range" min="0" max="0.9" step="0.05" value="'+h.albedo+'" oninput="STATE.habitable.albedo=parseFloat(this.value);MODULES.habitable.compute()"></div></div><div class="sec"><h4>Stars</h4><div class="chip-row"><div class="chip" onclick="STATE.habitable.L=0.01;MODULES.habitable.compute()">M dwarf</div><div class="chip" onclick="STATE.habitable.L=0.1;MODULES.habitable.compute()">K star</div><div class="chip" onclick="STATE.habitable.L=1;MODULES.habitable.compute()">Sun (G)</div><div class="chip" onclick="STATE.habitable.L=10;MODULES.habitable.compute()">F star</div><div class="chip" onclick="STATE.habitable.L=100;MODULES.habitable.compute()">A star</div></div></div>'},mathPanel:function(){return '<div class="sec"><h4>Habitable Zone</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definition:</b><br>Region where liquid water possible<br>Distance from star critical<br>Not proof of life — necessary condition<br><br><b>Kopparapu et al. (2013):</b><br>Inner edge: runaway greenhouse<br>Outer edge: maximum greenhouse<br>Conservative vs optimistic<br><br><b>Recent Venus (inner):</b><br>0.75 AU for Sun<br>Hothouse Earth scenario<br><br><b>Early Mars (outer):</b><br>1.77 AU for Sun<br>Early warm Mars<br><br><b>Star type:</b><br>M dwarf: HZ 0.1-0.3 AU<br>K star: HZ 0.4-0.9 AU<br>G star (Sun): HZ 0.95-1.67 AU<br>F star: HZ 1.2-2.3 AU<br><br><b>Factors beyond distance:</b><br>• Atmosphere composition<br>• Magnetic field<br>• Plate tectonics<br>• Moon (tides, axis stability)<br>• Giant planet dynamics<br>• Tidal locking (M dwarfs)<br><br><b>Earth analog:</b><br>~50 candidates known<br>Kepler, TESS, future missions</div></div>'}});
registerModule('starFormation',{title:'Star Formation',icon:'☁',desc:'Jeans instability, molecular clouds, collapse',cat:'ism',init:function(){this.reset()},
reset:function(){var s=STATE.starFormation;s.t=0;s.collapse=false;s.radius=1;s.rho=1e-20;s.T=10;s.jeans=jeansMass(s.T,s.rho,2.33);s.freefall=freeFallTime(s.rho);s.profile=[]},
step:function(dt){var s=STATE.starFormation;if(s.collapse){s.t+=dt*1e6;s.rho*=1.01;s.radius*=0.99;s.T=Math.max(10,s.T*1.001);s.freefall=freeFallTime(s.rho)}s.jeans=jeansMass(s.T,s.rho,2.33);s.profile.push({t:s.t/1e6,r:s.radius,rho:s.rho/TILE_})},
tick:function(dt){STATE.time+=dt;var s=STATE.starFormation;if(!STATE.playing)return;this.step(dt)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var s=STATE.starFormation;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('STAR FORMATION — M='+s.M_cloud+' M_sun · T='+s.T+' K',24,32);var cx=W/2,cy=H/2;var cloudR=Math.min(W,H)*0.4*s.radius;for(var i=0;i<50;i++){var ang=Math.random()*PI2;var r=Math.random()*cloudR;ctx.fillStyle='rgba(100,150,255,'+(0.1+Math.random()*0.3)+')';ctx.beginPath();ctx.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,2+Math.random()*4,0,PI2);ctx.fill()}if(s.collapse){var coreR=Math.max(10,cloudR*0.2);ctx.fillStyle='#ffb040';ctx.beginPath();ctx.arc(cx,cy,coreR,0,PI2);ctx.fill();ctx.fillStyle='#ffff80';ctx.beginPath();ctx.arc(cx,cy,coreR*0.4,0,PI2);ctx.fill()}var ix=60,iy=60,iw=280,ih=H-100;ctx.fillStyle='rgba(8,6,26,.9)';ctx.fillRect(ix,iy,iw,ih);ctx.strokeStyle='#a080ff';ctx.lineWidth=1.2;ctx.strokeRect(ix,iy,iw,ih);ctx.fillStyle='#a080ff';ctx.font='bold 11px monospace';ctx.fillText('CLOUD',ix+10,iy+22);ctx.font='10px monospace';[['M_cloud',s.M_cloud+' M_sun'],['T',s.T+' K'],['ρ',fmtSci(s.rho,2)+' kg/m³'],['R',fmt(s.radius*10,2)+' pc'],['M_J',fmtSci(s.jeans/M_SUN,2)+' M_sun'],['t_ff',fmtSci(s.freefall/3.15e13,2)+' Myr'],['Status',s.collapse?'COLLAPSING':'stable']].forEach(function(r,i){ctx.fillStyle='#a89ce0';ctx.fillText(r[0]+':',ix+10,iy+50+i*24);ctx.fillStyle='#a080ff';ctx.fillText(r[1],ix+130,iy+50+i*24)});setStats('<div>M_J: '+fmtSci(s.jeans/M_SUN,2)+' M_sun</div><div>t_ff: '+fmtSci(s.freefall/3.15e13,2)+' Myr</div>');badge('☁ '+s.M_cloud+' M_sun');SV('sbT',s.T+' K');SV('sbL','—');SV('sbZ','—');SV('sbM',s.M_cloud+' M_sun');SV('sbD',fmtSci(s.jeans/M_SUN,2)+' M_J')},
controls:function(){var s=STATE.starFormation;return '<div class="sec"><h4>Cloud</h4><div class="ctrl"><div class="lbl"><span>M (M_sun)</span><span>'+s.M_cloud+'</span></div><input type="range" min="10" max="100000" step="10" value="'+s.M_cloud+'" oninput="STATE.starFormation.M_cloud=parseFloat(this.value);MODULES.starFormation.reset()"></div><div class="ctrl"><div class="lbl"><span>T (K)</span><span>'+s.T+'</span></div><input type="range" min="5" max="100" step="1" value="'+s.T+'" oninput="STATE.starFormation.T=parseFloat(this.value);MODULES.starFormation.reset()"></div><div class="ctrl"><div class="lbl"><span>log n (cm⁻³)</span><span>'+Math.log10(s.rho*1.67e-27*1e6/2.33*1e6).toFixed(2)+'</span></div><input type="range" min="1" max="10" step="0.1" value="'+Math.log10(s.rho*1.67e-27*1e6/2.33*1e6)+'" oninput="STATE.starFormation.rho=Math.pow(10,parseFloat(this.value))/1e6*2.33/1.67e-27*1e-6;MODULES.starFormation.reset()"></div></div><div class="sec"><h4>Actions</h4><button class="btn '+(s.collapse?'primary':'')+' full" onclick="STATE.starFormation.collapse=!STATE.starFormation.collapse;toast(STATE.starFormation.collapse?\'\':\'\',\'info\')">'+(s.collapse?'⏹ Stop collapse':'▶ Start collapse')+'</button></div>'},mathPanel:function(){return '<div class="sec"><h4>Star Formation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Jeans criterion:</b><br>M &gt; M_J → collapse<br>M_J = (5kT/GμmH)^(3/2) · (3/4πρ)^(1/2)<br>~10⁴-10⁶ M_sun for GMCs<br><br><b>Free-fall time:</b><br>t_ff = √(3π/32Gρ)<br>~10⁶ yr for typical cloud<br><br><b>Stages:</b><br>1. Molecular cloud (H₂, dust)<br>2. Dense core collapse<br>3. Protostar (T Tauri)<br>4. T Tauri phase, jets/outflows<br>5. Main sequence arrival<br><br><b>Mass ranges:</b><br>Brown dwarf: &lt; 0.08 M_sun<br>Low-mass: 0.08-0.5<br>Solar-type: 0.5-8<br>Massive: &gt; 8 (O, B stars)<br><br><b>IMF (Salpeter 1955):</b><br>ξ(m) ∝ m^(-2.35)<br>Kroupa, Chabrier (modern)<br><br><b>Result:</b><br>~50% binaries<br>Clusters: 10²-10⁶ stars<br>Massive stars ionize (HII regions)<br><br><b>Observatories:</b><br>ALMA, JWST, VLT, Hubble</div></div>'}});
registerModule('ism',{title:'Interstellar Medium',icon:'☁',desc:'Phases of ISM: HII, HI, molecular, hot',cat:'ism',init:function(){this.compute()},
compute:function(){var i=STATE.ism;i.phaseData={'HII':{T:1e4,n:100,name:'H II region (ionized)',color:'#ff4080'},'HI':{T:100,n:1,name:'H I cloud (neutral)',color:'#00d4ff'},'Molecular':{T:20,n:1000,name:'Molecular cloud (cold)',color:'#a080ff'},'WIM':{T:8000,n:0.1,name:'Warm ionized medium',color:'#40ffb0'},'HIM':{T:1e6,n:0.001,name:'Hot ionized medium (coronal)',color:'#ffb040'},'CNM':{T:50,n:50,name:'Cold neutral medium',color:'#80c0ff'}};i.current=i.phaseData[i.phase];i.emission=[];for(var lam=100;lam<=10000;lam+=20){var B=planck(lam*1e-9,i.current.T);i.emission.push({lambda:lam,B:B})}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);var i=STATE.ism;ctx.fillStyle='#a080ff';ctx.font='bold 15px monospace';ctx.fillText('ISM — '+i.phase+' · T='+i.current.T+' K · n='+i.current.n+' cm⁻³',24,32);var px=60,py=60,pw=W-140,ph=H-160;drawAxes(ctx,px,py,pw,ph,'λ (nm)','B_λ');var maxB=Math.max.apply(null,i.emission.map(function(p){return p.B}));i.emission.forEach(function(p,idx){var x=px+Math.log10(p.lambda/100)/Math.log10(100)*pw;var y=py+ph-Math.min(p.B/maxB,1)*ph;ctx.fillStyle=i.current.color;ctx.fillRect(x,y,3,py+ph-y)});setStats('<div>Phase: '+i.phase+'</div><div>T: '+i.current.T+' K</div><div>n: '+i.current.n+' cm⁻³</div>');badge('☁ '+i.phase);SV('sbT',i.current.T+' K');SV('sbL','—');SV('sbZ','—');SV('sbM','—');SV('sbD',i.current.n+' cm⁻³')},
controls:function(){var i=STATE.ism;var h='<div class="sec"><h4>ISM Phase</h4><div class="chip-row">';Object.keys(i.phaseData).forEach(function(p){h+='<div class="chip '+(i.phase===p?'active':'')+'" onclick="STATE.ism.phase=\''+p+'\';MODULES.ism.compute();renderLeftPanel()">'+p+'</div>'});h+='</div></div>';return h},
mathPanel:function(){return '<div class="sec"><h4>Interstellar Medium</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Phases (Field, McKee, Heiles):</b><br><br><b>HIM (Hot Ionized Medium):</b><br>T ~ 10⁶ K, n ~ 10⁻³<br>Supernova-heated, X-ray<br>~50% of volume<br><br><b>WIM (Warm Ionized Medium):</b><br>T ~ 8000 K, n ~ 0.1<br>Hα emission<br>~20-50% of volume<br><br><b>CNM (Cold Neutral):</b><br>T ~ 50-100 K, n ~ 30-50<br>21-cm line<br>~2% of volume<br><br><b>HII regions:</b><br>T ~ 10⁴ K, n ~ 10²-10⁴<br>Around O/B stars<br>Hα, bremsstrahlung<br><br><b>Molecular clouds:</b><br>T ~ 10-50 K, n ~ 10²-10⁶<br>H₂, CO, dust<br>Star formation sites<br><br><b>21-cm line (HI):</b><br>Hyperfine transition of H<br>1420 MHz (21 cm)<br>Ewen-Purcell 1951<br>Traces Galactic structure<br><br><b>Composition:</b><br>H 70%, He 28%, metals 2%<br>Dust: 1% by mass<br>UV extinction, IR emission<br><br><b>Mass:</b> ~10% of Galaxy</div></div>'}});
var TILE_=1;

<script>
function buildCategories(){var b=$('lpBody');b.innerHTML='';CATS.forEach(function(cat){var sec=el('div',{class:'cat-section open','data-cat':cat.id});var head=el('div',{class:'cat-head'});head.innerHTML='<span>'+cat.icon+' '+cat.name+'</span><span class="cat-arrow">▸</span>';head.onclick=function(){sec.classList.toggle('open')};var items=el('div',{class:'cat-items'});cat.items.forEach(function(key){var m=MODULES[key];if(!m)return;var it=el('div',{class:'cat-item','data-key':key});it.innerHTML='<span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span>';it.onclick=function(){switchTab(key)};items.appendChild(it)});sec.appendChild(head);sec.appendChild(items);b.appendChild(sec)});updateActiveCat()}
function updateActiveCat(){$$('.cat-item').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-key')===STATE.currentTab)})}
function updateBreadcrumb(){var m=MODULES[STATE.currentTab];var b=$('breadcrumb');if(!m||STATE.currentTab==='home'){b.innerHTML='<div class="bc-item"><span style="color:var(--p1)">Home</span></div>';return}var cat=CATS.find(function(c){return c.items.indexOf(STATE.currentTab)>=0});var h='<div class="bc-item" onclick="openHome()" style="cursor:pointer"><span style="color:var(--tx3)">Home</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item"><span style="color:var(--tx3)">'+(cat?cat.name:'—')+'</span></div>';h+='<span class="bc-sep">›</span>';h+='<div class="bc-item active"><span>'+m.icon+' '+m.title+'</span></div>';b.innerHTML=h}
function switchTab(k){STATE.currentTab=k;var m=MODULES[k];if(!m){openHome();return}SV('sbMode',m.title);try{if(m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}renderLeftPanel();renderRightPanel();updateActiveCat();updateBreadcrumb()}
function openHome(){STATE.currentTab='home';SV('sbMode','Home');var b=$('lpBody');buildCategories();var h='<div class="sec"><h4>7 Categories · '+Object.keys(MODULES).length+' Modules</h4><div class="grid-overlay">';CATS.forEach(function(cat){h+='<div class="card" onclick="document.querySelector(\'.cat-section[data-cat=&quot;'+cat.id+'&quot;]\').scrollIntoView({behavior:\'smooth\'})"><div class="card-title">'+cat.icon+' '+cat.name+'</div><div class="card-desc">'+cat.items.length+' modules</div></div>'});h+='</div></div>';$('rpState').innerHTML=h;updateBreadcrumb();var W=CANV.W,H=CANV.H;if(CANV.ctx){CANV.ctx.fillStyle='#000005';CANV.ctx.fillRect(0,0,W,H);for(var i=0;i<300;i++){var x=Math.random()*W;var y=Math.random()*H;var s=Math.random()*2;var alpha=Math.random();CANV.ctx.fillStyle='rgba(255,255,255,'+alpha+')';CANV.ctx.fillRect(x,y,s,s)}CANV.ctx.fillStyle='#a080ff';CANV.ctx.font='bold 52px monospace';CANV.ctx.textAlign='center';CANV.ctx.fillText('ASTRON',W/2,H/2-50);CANV.ctx.font='14px monospace';CANV.ctx.fillStyle='#a89ce0';CANV.ctx.fillText('Astronomy · Astrophysics · Cosmology Studio',W/2,H/2-10);CANV.ctx.font='12px monospace';CANV.ctx.fillStyle='#5c5078';CANV.ctx.fillText('Press ⌘K or Ctrl+K to search · 30 modules',W/2,H/2+40);CANV.ctx.textAlign='left'}}
function switchRp(name,e){STATE.currentRp=name;$$('.rp-tab').forEach(function(t){t.classList.remove('active')});e.classList.add('active');$$('.rp-pane').forEach(function(p){p.classList.remove('active')});var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));if(p)p.classList.add('active');renderRightPanel()}
function renderLeftPanel(){var m=MODULES[STATE.currentTab];if(!m){buildCategories();return}updateBreadcrumb()}
function renderRightPanel(){var m=MODULES[STATE.currentTab];var s=$('rpState');if(s){if(STATE.currentTab==='home')return;var st='<div class="sec"><h4>'+m.icon+' '+m.title+'</h4>';st+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-bottom:8px">'+esc(m.desc||'')+'</div>';st+='<div class="kv"><div class="row"><span class="k">Module</span><span class="v">'+m.title+'</span></div>';var cat=CATS.find(function(c){return c.items.indexOf(m.key)>=0});st+='<div class="row"><span class="k">Category</span><span class="v">'+(cat?cat.name:'—')+'</span></div>';st+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div></div></div>';s.innerHTML=st}var mp=$('rpMath');if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}if(STATE.currentRp==='logs')renderLogs();renderControlsToLeft()}
function renderControlsToLeft(){var b=$('lpBody');if(!b)return;var m=MODULES[STATE.currentTab];if(!m){buildCategories();return}var h='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.68rem">'+m.icon+' '+m.title+'</h4></div>';try{if(m.controls)h+=m.controls()}catch(e){h+='<div class="sec"><div class="empty">error: '+esc(e.message)+'</div></div>'}h+='<div class="sec"><button class="btn full" onclick="buildCategories();updateActiveCat()">← All categories</button></div>';b.innerHTML=h}
function renderLogs(){var p=$('rpLogs');if(!p)return;var h='<div class="sec"><h4>Log <span class="badge">'+LOG.length+'</span></h4>';if(!LOG.length)h+='<div class="empty">No events</div>';else LOG.slice().reverse().forEach(function(l){var c=l.type==='error'?'var(--p6)':l.type==='success'?'var(--p5)':'var(--p1)';h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:2px;font-family:var(--mono);font-size:.55rem;color:'+c+'">'+esc(l.msg)+'</div>'});h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('btnPlay').classList.toggle('pulse',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',700)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',700)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',700)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['astron','day','nebula','solar','matrix'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function filterTabs(v){v=v.toLowerCase();if(!v){buildCategories();return}var b=$('lpBody');b.innerHTML='';var matched=[];TABS.forEach(function(t){if(t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0)matched.push(t)});if(!matched.length){b.innerHTML='<div class="empty">Nothing found</div>';return}var h='<div class="sec"><h4>Results <span class="badge">'+matched.length+'</span></h4>';matched.forEach(function(m){h+='<div class="cat-item" onclick="switchTab(\''+m.key+'\')"><span class="ci-icon">'+m.icon+'</span><span class="ci-label">'+m.title+'</span></div>'});h+='</div>';b.innerHTML=h}
function openCmdPalette(){$('cmdPalette').classList.add('show');$('cmdInput').value='';filterCmd('');$('cmdInput').focus()}
function closeCmdPalette(){$('cmdPalette').classList.remove('show')}
function filterCmd(v){v=(v||'').toLowerCase();var r=$('cmdResults');r.innerHTML='';var items=[];TABS.forEach(function(t){if(!v||t.title.toLowerCase().indexOf(v)>=0||t.desc.toLowerCase().indexOf(v)>=0){var cat=CATS.find(function(c){return c.items.indexOf(t.key)>=0});items.push({icon:t.icon,name:t.title,cat:cat?cat.name:'—',action:function(){switchTab(t.key);closeCmdPalette()}})}});[{icon:'🏠',name:'Home',cat:'Nav',action:function(){openHome();closeCmdPalette()}},{icon:'⚙',name:'Settings',cat:'System',action:function(){openSettings();closeCmdPalette()}},{icon:'🎨',name:'Theme',cat:'System',action:function(){toggleTheme();closeCmdPalette()}},{icon:'❓',name:'Help',cat:'System',action:function(){openHelp();closeCmdPalette()}}].forEach(function(cmd){if(!v||cmd.name.toLowerCase().indexOf(v)>=0)items.push(cmd)});if(!items.length){r.innerHTML='<div class="cmd-empty">Nothing found for "'+esc(v)+'"</div>';return}items.forEach(function(it,i){var e=el('div',{class:'cmd-item'+(i===0?' selected':'')});e.innerHTML='<span class="cmd-icon">'+it.icon+'</span><span class="cmd-name">'+it.name+'</span><span class="cmd-cat">'+it.cat+'</span>';e.onclick=it.action;r.appendChild(e)});r.querySelectorAll('.cmd-item').forEach(function(e){e.onmouseenter=function(){r.querySelectorAll('.cmd-item').forEach(function(x){x.classList.remove('selected')});e.classList.add('selected')}})}
function cmdKeydown(e){var r=$('cmdResults');if(e.key==='Escape'){closeCmdPalette();e.preventDefault()}else if(e.key==='Enter'){var sel=r.querySelector('.cmd-item.selected');if(sel)sel.click()}else if(e.key==='ArrowDown'){e.preventDefault();var items=r.querySelectorAll('.cmd-item');var cur=Array.from(items).findIndex(function(x){return x.classList.contains('selected')});var next=Math.min(items.length-1,cur+1);items.forEach(function(x){x.classList.remove('selected')});items[next].classList.add('selected');items[next].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'){e.preventDefault();var items2=r.querySelectorAll('.cmd-item');var cur2=Array.from(items2).findIndex(function(x){return x.classList.contains('selected')});var prev=Math.max(0,cur2-1);items2.forEach(function(x){x.classList.remove('selected')});items2[prev].classList.add('selected');items2[prev].scrollIntoView({block:'nearest'})}}
function openSettings(){openModal('⚙ Settings','<div class="sec"><h4>Theme</h4><div class="chip-row">'+THEMES.map(function(t){return '<div class="chip" onclick="document.documentElement.setAttribute(\'data-theme\',\''+t+'\');closeModal();toast(\'Theme: '+t+'\',\'success\')">'+t+'</div>'}).join('')+'</div></div><div class="sec"><h4>Layout</h4><div class="chip-row"><div class="chip" onclick="toggleLeftPanel()">Toggle Left Panel</div><div class="chip" onclick="toggleRightPanel()">Toggle Right Panel</div></div></div>','<button class="btn primary" onclick="closeModal()">OK</button>','sm')}
function openHelp(){openModal('❓ ASTRON — Astronomy & Cosmology Studio','<div class="sec" style="border-left:3px solid #a080ff;padding-left:10px;background:rgba(160,128,255,.08);padding:10px;border-radius:6px"><div style="font-size:.72rem;color:#a080ff;font-weight:700;margin-bottom:6px">🌌 GLOBAL SPACE ECONOMY: $500 BILLION+</div><div style="font-family:var(--mono);font-size:.6rem;line-height:1.6;color:var(--tx2)">SpaceX ($180B), NASA ($25B/yr), ESA, CNSA, JAXA, Roscosmos. JWST, Hubble, Euclid, Rubin LSST, LIGO, EHT, ALMA, Gaia. NewSpace: Starlink, Blue Origin, Rocket Lab.</div></div><div class="sec"><h4>🌌 30 Modules in 7 Categories</h4><div style="font-size:.6rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)"><b style="color:var(--p1)">STELLAR (6)</b> Blackbody · H-R Diagram · Spectral · Stellar Structure · Binary Stars · Variables<br><br><b style="color:var(--p1)">GALACTIC (5)</b> Galaxy · Rotation Curves · Tully-Fisher · Distance Ladder · Milky Way<br><br><b style="color:var(--p1)">COSMOLOGY (6)</b> Hubble Law · ΛCDM · CMB · BAO · Inflation · Dark Matter<br><br><b style="color:var(--p1)">RELATIVISTIC (4)</b> Schwarzschild · Kerr · Lensing · Gravitational Waves<br><br><b style="color:var(--p1)">HIGH-ENERGY (4)</b> Supernovae · GRB · AGN · Jets<br><br><b style="color:var(--p1)">EXOPLANETS (3)</b> Transit · Radial Velocity · Habitable Zone<br><br><b style="color:var(--p1)">ISM (2)</b> Star Formation · ISM Phases</div></div><div class="sec"><h4>🧮 Real Physics</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">• Planck radiation: B_λ(T) = 2hc²/λ⁵/(exp(hc/λkT)-1)<br>• Wien displacement λ_max·T = 2.898×10⁻³ m·K<br>• Stefan-Boltzmann L = 4πR²σT⁴<br>• Mass-luminosity L ∝ M^3.5<br>• Kepler 3rd law P² = 4π²a³/[G(M1+M2)]<br>• Saha + Boltzmann equations<br>• NFW dark matter halo profile<br>• Tully-Fisher L ∝ V^4<br>• Hubble-Lemaître v = H₀·d<br>• Friedmann equation (ȧ/a)² = 8πGρ/3 + Λc²/3<br>• CMB acoustic peaks<br>• BAO sound horizon r_d = 147 Mpc<br>• Schwarzschild r_s = 2GM/c²<br>• Hawking temperature T = ℏc³/(8πGMk_B)<br>• Kerr metric (a*, ergosphere, ISCO)<br>• Einstein radius θ_E = √(4GM D_LS/(c²D_LD_S))<br>• Chirp mass Mc = (M1M2)^(3/5)/(M1+M2)^(1/5)<br>• GW strain h ~ 10⁻²¹<br>• Supernova light curves (Phillips 1993)<br>• AGN Eddington luminosity<br>• Relativistic beaming Doppler factor<br>• Transit depth ΔF/F = (Rp/Rs)²<br>• RV semi-amplitude K = 28.4 m/s · (Mp/M_J)·...<br>• Habitable zone (Kopparapu 2013)<br>• Jeans mass M_J = (5kT/GμmH)^(3/2)·(3/4πρ)^(1/2)<br>• Free-fall time t_ff = √(3π/32Gρ)<br>• ISM phases (Field-McKee-Heiles)</div></div><div class="sec"><h4>⌨ Keyboard Shortcuts</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b>⌘K / Ctrl+K</b> — Command palette<br><b>Space</b> — Play/Pause<br><b>→</b> — Step forward<br><b>R</b> — Reset module<br><b>T</b> — Toggle theme<br><b>L</b> — Toggle left panel<br><b>I</b> — Toggle right panel<br><b>S</b> — Settings<br><b>?</b> — This help<br><b>Esc</b> — Close modal</div></div><div class="sec"><h4>💼 Industry Leaders</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)"><b>Space agencies:</b> NASA, ESA, JAXA, CNSA, ISRO, Roscosmos<br><b>Commercial:</b> SpaceX, Blue Origin, Rocket Lab, ULA<br><b>Instruments:</b> JWST, Hubble, ALMA, VLT, Keck, Gemini<br><b>Ground surveys:</b> Rubin LSST, DESI, Euclid, LIGO, Virgo<br><b>Space telescopes:</b> Gaia, TESS, Kepler, Chandra, XMM<br><b>Radio:</b> EHT, FAST, GBT, VLA, MeerKAT<br><b>Market size:</b> $500B+ (2024)</div></div>','<button class="btn primary" onclick="closeModal()">Got it</button>','lg')}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;var mod=e.ctrlKey||e.metaKey;if(mod&&e.key==='k'){e.preventDefault();openCmdPalette()}else if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}else if(e.key==='r'||e.key==='R')resetModule();else if(e.key==='t'||e.key==='T')toggleTheme();else if(e.key==='l'||e.key==='L')toggleLeftPanel();else if(e.key==='i'||e.key==='I')toggleRightPanel();else if(e.key==='s'||e.key==='S')openSettings();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))openHelp();else if(e.key==='Escape'){closeModal();closeCmdPalette()}});

var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){var dt=Math.min((now-lastT)/1000,0.05);lastT=now;fAcc+=dt;fFr++;if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}var m=MODULES[STATE.currentTab];if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){logMsg('draw('+m.key+') error: '+e.message,'error');try{CANV.ctx.fillStyle='#000005';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#a080ff';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}}}requestAnimationFrame(loop)}
