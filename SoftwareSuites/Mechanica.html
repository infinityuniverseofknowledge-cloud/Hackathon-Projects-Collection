/* ══════════════ Heat — 2D ══════════════ */
R.heat2d=function(dt){
  clear();
  headline('Heat Conduction — 2D','Laplace equation · Gauss-Seidel');
  var nx=40,ny=40;
  var boundary={top:100,bottom:20,left:60,right:40};
  var result=Heat.solveSteady(nx,ny,1,1,boundary,50,300);
  var T=result.T;
  /* Find min/max */
  var minT=Infinity,maxT=-Infinity;
  for(var i=0;i<T.length;i++){
    if(T[i]<minT)minT=T[i];
    if(T[i]>maxT)maxT=T[i];
  }
  /* Render heatmap */
  var padL=80,padT=100;
  var size=Math.min(S.W-padL-100,S.H-padT-100);
  var cellW=size/nx,cellH=size/ny;
  for(var i2=0;i2<nx;i2++){
    for(var j=0;j<ny;j++){
      var v=(T[j*nx+i2]-minT)/(maxT-minT+1e-9);
      var r=clamp(v*255,0,255);
      var g=clamp((1-Math.abs(v-0.5)*2)*180,0,255);
      var b=clamp((1-v)*255,0,255);
      S.ctx.fillStyle='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
      S.ctx.fillRect(padL+i2*cellW,padT+j*cellH,cellW+0.5,cellH+0.5);
    }
  }
  /* Border */
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.lineWidth=2;
  S.ctx.strokeRect(padL,padT,size,size);
  /* Boundary labels */
  S.ctx.fillStyle='#ff4d94';
  S.ctx.font='600 11px "JetBrains Mono",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('Top: 100°C',padL+size/2,padT-10);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.fillText('Bottom: 20°C',padL+size/2,padT+size+18);
  S.ctx.save();
  S.ctx.translate(padL-20,padT+size/2);
  S.ctx.rotate(-Math.PI/2);
  S.ctx.fillStyle='#2ecc71';
  S.ctx.fillText('Left: 60°C',0,0);
  S.ctx.restore();
  S.ctx.save();
  S.ctx.translate(padL+size+20,padT+size/2);
  S.ctx.rotate(Math.PI/2);
  S.ctx.fillStyle='#ffa500';
  S.ctx.fillText('Right: 40°C',0,0);
  S.ctx.restore();
  /* Results */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,90,320,200);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,90.5,319,199);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('SOLUTION INFO',S.W-320,110);
  var rows=[
    ['Grid',nx+' × '+ny+' nodes'],
    ['Iterations',result.iterations],
    ['T range',fmt(minT,1)+' to '+fmt(maxT,1)+' °C'],
    ['Mean T',fmt(T.reduce(function(a,b){return a+b},0)/T.length,2)+' °C'],
    ['Center T',fmt(T[Math.floor(ny/2)*nx+Math.floor(nx/2)],2)+' °C'],
    ['Solver','Gauss-Seidel'],
    ['Convergence','ΔT < 1e-6']
  ];
  rows.forEach(function(r,i){
    var y=140+i*24;
    S.ctx.fillStyle='#8894b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(r[0],S.W-320,y);
    S.ctx.fillStyle='#e0e5f0';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),S.W-30,y);
  });
  /* Colorbar */
  var cbX=padL+size+40,cbY=padT,cbW=20,cbH=size;
  var grad=S.ctx.createLinearGradient(cbX,cbY+cbH,cbX,cbY);
  grad.addColorStop(0,'rgb(0,180,255)');
  grad.addColorStop(0.5,'rgb(128,180,128)');
  grad.addColorStop(1,'rgb(255,60,60)');
  S.ctx.fillStyle=grad;
  S.ctx.fillRect(cbX,cbY,cbW,cbH);
  S.ctx.fillStyle='#e0e5f0';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText(fmt(maxT,1)+'°C',cbX+cbW+4,cbY+12);
  S.ctx.fillText(fmt(minT,1)+'°C',cbX+cbW+4,cbY+cbH);
};

/* ══════════════ Thermal Stress ══════════════ */
R.thermal_stress=function(dt){
  clear();
  headline('Thermal Stress','restrained expansion analysis');
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  var E=S.sim.E||200;
  var alpha=S.sim.alpha||11.7;
  var dT=S.sim.dT||50;
  var A=S.sim.Ath||100;
  var sigma=-E*1000*alpha*1e-6*dT;
  var strainFree=alpha*1e-6*dT;
  var force=Math.abs(sigma)*A;
  /* Plot stress vs ΔT */
  var dTmax=200;
  axes(padL,padT,plotW,plotH,'ΔT (K)','stress (MPa)');
  S.ctx.strokeStyle='#ff4d94';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var dTi=dTmax*i/100;
    var si=-E*1000*alpha*1e-6*dTi;
    var x=padL+(dTi/dTmax)*plotW;
    var y=padT+plotH/2-(si/(E*1000*alpha*1e-6*dTmax/2))*(plotH/2-20);
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Current point */
  var xCur=padL+(dT/dTmax)*plotW;
  var yCur=padT+plotH/2-(sigma/(E*1000*alpha*1e-6*dTmax/2))*(plotH/2-20);
  S.ctx.beginPath();
  S.ctx.arc(xCur,yCur,8,0,Math.PI*2);
  S.ctx.fillStyle='#ffa500';
  S.ctx.fill();
  /* Zero line */
  S.ctx.strokeStyle='rgba(45,127,255,.15)';
  S.ctx.setLineDash([4,4]);
  S.ctx.beginPath();
  S.ctx.moveTo(padL,padT+plotH/2);
  S.ctx.lineTo(padL+plotW,padT+plotH/2);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* Results */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,90,320,240);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,90.5,319,239);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('THERMAL STRESS',S.W-320,110);
  var rows=[
    ['E',fmt(E,1)+' GPa'],
    ['α',fmt(alpha,2)+' ×10⁻⁶/K'],
    ['ΔT',fmt(dT,1)+' K'],
    ['A (area)',fmt(A,1)+' mm²'],
    ['',''],
    ['Free strain',strainFree.toExponential(3)],
    ['Free expansion',fmt(strainFree*1000,3)+' mm/m'],
    ['',''],
    ['Thermal stress',fmt(sigma,2)+' MPa'],
    ['Thermal force',fmt(force/1000,2)+' kN'],
    ['Type',sigma<0?'COMPRESSION':'TENSION']
  ];
  rows.forEach(function(r,i){
    if(!r[0])return;
    var y=140+i*18;
    S.ctx.fillStyle='#8894b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(r[0],S.W-320,y);
    S.ctx.fillStyle=i>=8?(sigma<0?'#ff4d94':'#2ecc71'):'#e0e5f0';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),S.W-30,y);
  });
};

/* ══════════════ Fluid Network ══════════════ */
R.fluidnet=function(dt){
  clear();
  headline('Pipe Network Solver','nodal pressure analysis');
  if(!S.model||S.model.type!=='Fluid'){
    S.model={
      type:'Fluid',
      nodes:[
        {x:100,y:300,p:100000,fixP:true}, /* reservoir */
        {x:250,y:300},
        {x:400,y:300},
        {x:400,y:450,p:0,fixP:true}, /* drain */
        {x:250,y:450,q:0}
      ],
      elements:[
        {n1:0,n2:1,R:1e6},
        {n1:1,n2:2,R:1e6},
        {n1:2,n2:3,R:1e6},
        {n1:1,n2:4,R:2e6},
        {n1:4,n2:3,R:2e6}
      ]
    };
  }
  try{
    var result=Fluid.solveNetwork(S.model);
    /* Draw pipes */
    S.model.elements.forEach(function(el,i){
      var n1=S.model.nodes[el.n1];
      var n2=S.model.nodes[el.n2];
      var flow=result.flows[i];
      var maxFlow=Math.max.apply(null,result.flows.map(Math.abs))||1;
      var col=flow>0?'#2d7fff':'#ffa500';
      var width=2+Math.abs(flow)/maxFlow*4;
      S.ctx.strokeStyle=col;
      S.ctx.lineWidth=width;
      S.ctx.beginPath();
      S.ctx.moveTo(n1.x,n1.y);
      S.ctx.lineTo(n2.x,n2.y);
      S.ctx.stroke();
      /* Flow direction arrow */
      var mx=(n1.x+n2.x)/2,my=(n1.y+n2.y)/2;
      S.ctx.fillStyle=col;
      S.ctx.beginPath();
      S.ctx.arc(mx,my,5,0,Math.PI*2);
      S.ctx.fill();
      S.ctx.fillStyle='#e0e5f0';
      S.ctx.font='9px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText(fmt(Math.abs(flow)*1000,3)+' L/s',mx,my+18);
    });
    /* Draw nodes */
    S.model.nodes.forEach(function(n,i){
      S.ctx.beginPath();
      S.ctx.arc(n.x,n.y,10,0,Math.PI*2);
      S.ctx.fillStyle=n.fixP?'#ffa500':'#2d7fff';
      S.ctx.fill();
      S.ctx.strokeStyle='#08090d';
      S.ctx.lineWidth=2;
      S.ctx.stroke();
      S.ctx.fillStyle='#e0e5f0';
      S.ctx.font='500 10px "JetBrains Mono",monospace';
      S.ctx.textAlign='left';
      S.ctx.fillText('N'+i,n.x+14,n.y-12);
      S.ctx.fillStyle='#5c9fff';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText(fmt(result.p[i]/1000,1)+' kPa',n.x+14,n.y+16);
    });
  }catch(e){
    S.ctx.fillStyle='#ff3355';
    S.ctx.font='14px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('Solver error: '+e.message,S.W/2,S.H/2);
  }
};

/* ══════════════ Pipe Flow ══════════════ */
R.pipe=function(dt){
  clear();
  headline('Pipe Flow Analysis','Darcy-Weisbach with Colebrook');
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  var D=S.sim.D||0.05; /* m */
  var v=S.sim.v||2; /* m/s */
  var rho=S.sim.rho||998;
  var mu=S.sim.mu||0.001;
  var eps=S.sim.eps||0.000045; /* m (steel) */
  var Re=Fluid.reynolds(rho,v,D,mu);
  var f=Fluid.friction(Re,eps,D);
  var L=S.sim.Lp||100;
  var dP=f*(L/D)*(rho*v*v/2);
  var hf=f*(L/D)*(v*v/(2*9.81));
  /* Re vs friction factor */
  axes(padL,padT,plotW,plotH,'Reynolds number Re','friction factor f');
  /* Compute f(Re) curve */
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  var first=true;
  for(var i=0;i<150;i++){
    var logRe=2+i*6/150;
    var Rei=Math.pow(10,logRe);
    var fi=Fluid.friction(Rei,eps,D);
    var x=padL+(logRe-2)/6*plotW;
    var y=padT+clamp(fi*plotH*2,0,plotH-10);
    if(first){S.ctx.moveTo(x,y);first=false}
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* Current point */
  var xCur=padL+(Math.log10(Re)-2)/6*plotW;
  var yCur=padT+clamp(f*plotH*2,0,plotH-10);
  if(xCur>padL&&xCur<padL+plotW){
    S.ctx.beginPath();
    S.ctx.arc(xCur,yCur,7,0,Math.PI*2);
    S.ctx.fillStyle='#ffa500';
    S.ctx.fill();
  }
  /* Laminar/transition markers */
  S.ctx.strokeStyle='rgba(255,77,148,.4)';
  S.ctx.setLineDash([6,4]);
  var xLaminar=padL+(Math.log10(2300)-2)/6*plotW;
  S.ctx.beginPath();
  S.ctx.moveTo(xLaminar,padT);
  S.ctx.lineTo(xLaminar,padT+plotH);
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  S.ctx.fillStyle='#ff4d94';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('Re=2300 (transition)',xLaminar,padT-6);
  /* Results */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,90,320,260);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,90.5,319,259);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('PIPE FLOW RESULTS',S.W-320,110);
  var rows=[
    ['Diameter D',fmt(D*1000,1)+' mm'],
    ['Velocity v',fmt(v,2)+' m/s'],
    ['Density ρ',fmt(rho,0)+' kg/m³'],
    ['Viscosity μ',mu.toExponential(2)+' Pa·s'],
    ['Roughness ε',fmt(eps*1000,3)+' mm'],
    ['Length L',fmt(L,1)+' m'],
    ['',''],
    ['Reynolds Re',Re.toExponential(3)],
    ['Flow regime',Re<2300?'Laminar':Re<4000?'Transitional':'Turbulent'],
    ['Friction f',fmt(f,5)],
    ['',''],
    ['Pressure drop ΔP',fmt(dP/1000,3)+' kPa'],
    ['Head loss hf',fmt(hf,4)+' m'],
    ['Relative roughness',fmt(eps/D,5)]
  ];
  rows.forEach(function(r,i){
    if(!r[0])return;
    var y=140+i*18;
    S.ctx.fillStyle='#8894b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(r[0],S.W-320,y);
    S.ctx.fillStyle=i>=11?'#ffa500':'#e0e5f0';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),S.W-30,y);
  });
};

/* ══════════════ Optimization ══════════════ */
R.optimize=function(dt){
  clear();
  headline('Optimization','gradient · golden · Nelder-Mead');
  /* Demonstrate 2D optimization */
  var padL=60,padT=120,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  /* Objective: Rosenbrock */
  function f(x){return Math.pow(1-x[0],2)+100*Math.pow(x[1]-x[0]*x[0],2)}
  function grad(x){return [-2*(1-x[0])-400*x[0]*(x[1]-x[0]*x[0]),200*(x[1]-x[0]*x[0])]}
  if(!S.sim.optResult||S.sim.optType!=='rosen'){
    try{
      S.sim.optResult=Opt.nelderMead(f,[-1,1],{tol:1e-6,maxIter:200});
      S.sim.optType='rosen';
    }catch(e){}
  }
  /* Plot contour */
  var xmin=-2,xmax=2,ymin=-1,ymax=3;
  var nx=60,ny=60;
  var cellW=plotW/nx,cellH=plotH/ny;
  var maxLogF=-Infinity,minLogF=Infinity;
  var grid=[];
  for(var i=0;i<nx;i++){
    grid.push([]);
    for(var j=0;j<ny;j++){
      var x=xmin+(xmax-xmin)*i/(nx-1);
      var y=ymin+(ymax-ymin)*(ny-1-j)/(ny-1);
      var val=Math.log10(f([x,y])+1e-10);
      grid[i].push(val);
      if(val>maxLogF)maxLogF=val;
      if(val<minLogF)minLogF=val;
    }
  }
  for(var i2=0;i2<nx;i2++){
    for(var j2=0;j2<ny;j2++){
      var v=(grid[i2][j2]-minLogF)/(maxLogF-minLogF);
      var r=clamp(255*(1-v),0,255);
      var g=clamp(60+v*40,0,255);
      var b=clamp(v*180,0,255);
      S.ctx.fillStyle='rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
      S.ctx.fillRect(padL+i2*cellW,padT+j2*cellH,cellW+0.5,cellH+0.5);
    }
  }
  /* Border */
  S.ctx.strokeStyle='rgba(45,127,255,.4)';
  S.ctx.strokeRect(padL,padT,plotW,plotH);
  /* Optimum marker */
  var ropt=S.sim.optResult;
  if(ropt){
    var xr=padL+((ropt.x[0]-xmin)/(xmax-xmin))*plotW;
    var yr=padT+((ymax-ropt.x[1])/(ymax-ymin))*plotH;
    S.ctx.beginPath();
    S.ctx.arc(xr,yr,8,0,Math.PI*2);
    S.ctx.fillStyle='#2ecc71';
    S.ctx.fill();
    S.ctx.strokeStyle='#fff';
    S.ctx.lineWidth=2;
    S.ctx.stroke();
    S.ctx.fillStyle='#2ecc71';
    S.ctx.font='600 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('Optimum',xr+12,yr-8);
  }
  /* Results */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,90,320,260);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,90.5,319,259);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('OPTIMIZATION RESULT',S.W-320,110);
  S.ctx.fillStyle='#8894b0';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText('Rosenbrock function:',S.W-320,132);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('f(x,y) = (1-x)² + 100(y-x²)²',S.W-320,148);
  if(ropt){
    var rows=[
      ['Method','Nelder-Mead simplex'],
      ['Converged','yes'],
      ['x*',fmt(ropt.x[0],6)],
      ['y*',fmt(ropt.x[1],6)],
      ['f*',ropt.f.toExponential(3)],
      ['',''],
      ['True optimum','(1, 1)'],
      ['True f','0'],
      ['Error',fmt(Math.sqrt(Math.pow(ropt.x[0]-1,2)+Math.pow(ropt.x[1]-1,2)),6)]
    ];
    rows.forEach(function(r,i){
      if(!r[0])return;
      var y=180+i*20;
      S.ctx.fillStyle='#8894b0';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.textAlign='left';
      S.ctx.fillText(r[0],S.W-320,y);
      S.ctx.fillStyle=i>=2&&i<=4?'#2ecc71':'#e0e5f0';
      S.ctx.textAlign='right';
      S.ctx.fillText(String(r[1]),S.W-30,y);
    });
  }
};

/* ══════════════ Linear Algebra ══════════════ */
R.linear=function(dt){
  clear();
  headline('Linear Algebra','matrix operations');
  var padL=60,padT=120;
  /* Demo 3x3 matrix and its operations */
  var A=Mat.zeros(3);
  A[0][0]=4;A[0][1]=1;A[0][2]=2;
  A[1][0]=1;A[1][1]=3;A[1][2]=1;
  A[2][0]=2;A[2][1]=1;A[2][2]=5;
  /* Solve Ax = b */
  var b=new Float64Array([1,2,3]);
  var x=Mat.solve(A,b);
  /* Determinant */
  var det=Mat.det(A);
  /* Eigenvalues */
  var eig=Mat.jacobiEigen(A);
  /* Display matrix */
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 13px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('MATRIX A (3×3)',padL,padT-10);
  for(var i=0;i<3;i++){
    for(var j=0;j<3;j++){
      S.ctx.fillStyle='rgba(14,16,24,.9)';
      S.ctx.fillRect(padL+j*80,padT+i*40,70,34);
      S.ctx.strokeStyle='rgba(45,127,255,.4)';

      S.ctx.fillStyle='#e0e5f0';
      S.ctx.font='500 13px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText(fmt(A[i][j],0),padL+j*80+35,padT+i*40+22);
    }
  }
  /* Solution vector */
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 13px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('SOLUTION x = A⁻¹b',padL+280,padT-10);
  for(var i2=0;i2<3;i2++){
    S.ctx.fillStyle='rgba(14,16,24,.9)';
    S.ctx.fillRect(padL+280,padT+i2*40,120,34);
    S.ctx.strokeStyle='rgba(46,204,113,.5)';
    S.ctx.strokeRect(padL+280.5,padT+i2*40+.5,119,33);
    S.ctx.fillStyle='#2ecc71';
    S.ctx.font='500 13px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(fmt(x[i2],6),padL+280+60,padT+i2*40+22);
  }
  /* Results */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,padT,320,240);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,padT+.5,319,239);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('RESULTS',S.W-320,padT+22);
  var rows=[
    ['Determinant',fmt(det,4)],
    ['Trace',fmt(A[0][0]+A[1][1]+A[2][2],4)],
    ['',''],
    ['λ₁',fmt(eig.values[0],4)],
    ['λ₂',fmt(eig.values[1],4)],
    ['λ₃',fmt(eig.values[2],4)],
    ['',''],
    ['Algorithm','LU + Jacobi'],
    ['Condition',Math.abs(det)>1e-6?'Well-conditioned':'Ill-conditioned']
  ];
  rows.forEach(function(r,i){
    if(!r[0])return;
    var y=padT+50+i*22;
    S.ctx.fillStyle='#8894b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(r[0],S.W-320,y);

    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),S.W-30,y);
  });
};

/* ══════════════ ODE Solver ══════════════ */
R.ode=function(dt){
  clear();
  headline('ODE Solver','Runge-Kutta 4th order');
  var padL=60,padT=120,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  /* Solve dy/dt = -ky with RK4 */
  var k=S.sim.kOde||0.5;
  function f(t,y){return -k*y}
  var traj=ODE.rk4(f,[1],0,10,500);
  axes(padL,padT,plotW,plotH,'time t','y(t)');
  /* Analytical comparison */
  S.ctx.strokeStyle='rgba(255,165,0,.4)';
  S.ctx.lineWidth=1;
  S.ctx.setLineDash([4,4]);
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var t=10*i/100;
    var y=Math.exp(-k*t);
    var x=padL+(t/10)*plotW;
    var yy=padT+plotH-y*plotH*0.9;
    if(i===0)S.ctx.moveTo(x,yy);
    else S.ctx.lineTo(x,yy);
  }
  S.ctx.stroke();
  S.ctx.setLineDash([]);
  /* RK4 solution */
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  traj.forEach(function(p,i){
    var x=padL+(p.t/10)*plotW;
    var yy=padT+plotH-p.y[0]*plotH*0.9;

  S.ctx.fillText('■ RK4 numerical',padL+10,padT+20);
  S.ctx.fillStyle='#ffa500';
  S.ctx.fillText('--- Analytical e^(-kt)',padL+200,padT+20);
  /* Info */
  S.ctx.fillStyle='rgba(14,16,24,.92)';
  S.ctx.fillRect(S.W-340,90,320,160);
  S.ctx.strokeStyle='#2d7fff';
  S.ctx.strokeRect(S.W-339.5,90.5,319,159);
  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.fillText('ODE INFO',S.W-320,110);
  var rows=[
    ['Equation','dy/dt = -ky'],
    ['k',fmt(k,3)],
    ['Method','RK4'],
    ['Steps','500'],
    ['t range','0 to 10'],
    ['Final y',fmt(traj[traj.length-1].y[0],6)],
    ['Analytical',fmt(Math.exp(-k*10),6)],
    ['Error',fmt(Math.abs(traj[traj.length-1].y[0]-Math.exp(-k*10)),8)]
  ];
  rows.forEach(function(r,i){
    var y=140+i*20;
    S.ctx.fillStyle='#8894b0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(r[0],S.W-320,y);
    S.ctx.fillStyle='#e0e5f0';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),S.W-30,y);
  });
};

  mass:{base:'kg',units:{'kg':1,'g':0.001,'mg':1e-6,'lb':0.453592,'oz':0.0283495,'ton':1000}},
  force:{base:'N',units:{'N':1,'kN':1000,'MN':1e6,'lbf':4.44822,'kgf':9.80665,'dyn':1e-5}},

  energy:{base:'J',units:{'J':1,'kJ':1000,'MJ':1e6,'cal':4.184,'kcal':4184,'kWh':3.6e6,'BTU':1055.06,'eV':1.602e-19}},
  power:{base:'W',units:{'W':1,'kW':1000,'MW':1e6,'hp':745.7,'BTU/h':0.29307}},
  temperature:{base:'K',custom:true},

  angle:{base:'rad',units:{'rad':1,'deg':Math.PI/180,'grad':Math.PI/200,'rev':2*Math.PI}}
};
R.unitconv=function(dt){

    S.ctx.textAlign='left';

    S.ctx.font='10px "JetBrains Mono",monospace';

  /* Interactive converter */

  S.ctx.fillStyle='#5c9fff';
  S.ctx.font='600 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CONVERSION EXAMPLE',S.W-340,S.H-158);
  var examples=[
    ['100 MPa','= '+fmt(100*1e6/6894.76,2)+' psi','am'],
    ['500 mm','= '+fmt(500/25.4,3)+' in','cb'],
    ['75 kg','= '+fmt(75/0.453592,2)+' lb','gr'],
    ['2000 W','= '+fmt(2000/745.7,3)+' hp','pk'],
    ['1 kcal','= '+fmt(4184,1)+' J','tl'],
    ['1 atm','= '+fmt(101325/1000,2)+' kPa','rd']
  ];
  examples.forEach(function(ex,i){
    S.ctx.fillStyle='#e0e5f0';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(ex[0],S.W-340,S.H-130+i*22);
    S.ctx.fillStyle={am:'#ffa500',cb:'#5c9fff',gr:'#2ecc71',pk:'#ff4d94',tl:'#4dd4c8',rd:'#ff3355'}[ex[2]];
    S.ctx.textAlign='right';
    S.ctx.fillText(ex[1],S.W-30,S.H-130+i*22);
  });
};

/* ══════════════ Report Generator ══════════════ */
R.report=function(dt){

/* ══════════════ Reference ══════════════ */
R.reference=function(dt){
  clear();
  headline('Reference','formulas and shortcuts');
  var sections=[
    {h:'Stress & Strain',items:[
      'σ = F/A (axial)',
      'ε = ΔL/L',
      'E = σ/ε (Hooke)',
      'ν = −ε_lateral/ε_axial',
      'G = E/(2(1+ν))',
      'σ_von Mises = √(σ₁²−σ₁σ₂+σ₂²)'
    ]},
    {h:'Beam Theory',items:[
      'EI·v\'\' = M(x) (Euler-Bernoulli)',
      'M = −EI·v\'\'',
      'V = dM/dx',
      'δ_max = 5wL⁴/(384EI) (SS beam)',
      'δ_max = PL³/(48EI) (center load)'
    ]},
    {h:'Buckling',items:[
      'P_cr = π²EI/(KL)² (Euler)',
      'K: 0.5 fixed-fixed',
      'K: 0.7 fixed-pinned',
      'K: 1.0 pinned-pinned',
      'K: 2.0 fixed-free'
    ]},
    {h:'Heat Transfer',items:[
      'q = k·A·ΔT/L (conduction)',
      'q = h·A·ΔT (convection)',
      'q = εσA(T₁⁴−T₂⁴) (radiation)',
      '∇²T = 0 (steady state)'
    ]},
    {h:'Fluid Mechanics',items:[
      'Re = ρvD/μ',
      'ΔP = f·(L/D)·ρv²/2',
      '1/√f = −2log(ε/3.7D + 2.51/(Re√f))',
      'hf = f·L·v²/(2gD)'
    ]},
    {h:'Dynamics',items:[
      'mx\'\' + cx\' + kx = F(t)',
      'ωn = √(k/m)',
      'ζ = c/(2√(km))',
      'ωd = ωn√(1−ζ²)'
    ]},
    {h:'Fatigue',items:[
      'Se ≈ 0.5·Su (steel)',
      'Miner\'s rule: Σ(ni/Ni) ≤ 1',
      'Goodman: σa/Se + σm/Su = 1/SF'
    ]},
    {h:'Shortcuts',items:[
      '/ : search modules',
      '1-9 : jump to module',
      'Esc : clear search'
    ]}
  ];
  var colW=(S.W-60)/2;
  sections.forEach(function(sec,i){
    var col=i%2,row=Math.floor(i/2);
    var x=30+col*colW;
    var sy=90+row*220;
    if(sy>S.H-40)return;
    S.ctx.fillStyle='#5c9fff';
    S.ctx.font='600 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(sec.h.toUpperCase(),x,sy);
    S.ctx.strokeStyle='rgba(45,127,255,.3)';
    S.ctx.lineWidth=1;
    S.ctx.beginPath();
    S.ctx.moveTo(x,sy+6);
    S.ctx.lineTo(x+100,sy+6);
    S.ctx.stroke();
    S.ctx.fillStyle='#e0e5f0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    sec.items.forEach(function(it,j){
      S.ctx.fillText('▸ '+it,x,sy+26+j*16);
    });
  });
};

<script>
/* ═══════════════════════════════════════════════════
   MECHANICA · Info panel + interactions
   ═══════════════════════════════════════════════════ */

function renderModule(){
  var r=R[S.module];
  if(r)r(0);
}

function renderInfo(){
  var body=$('infoBody');
  var id=S.module;
  var html='';
  if(id==='dashboard'){
    html+='<div class="sec-head">System</div>';
    html+=prop('Modules',MODULES.length,'cb');
    html+=prop('Materials',MATERIALS.length,'am');
    html+=prop('Sections',SECTIONS.length,'gr');
    html+='<div class="sec-head">Solver capabilities</div>';
    html+='<div class="hint">Real numerical solvers:<br>';
    html+='• LU decomposition with partial pivoting<br>';
    html+='• Jacobi eigenvalue algorithm<br>';
    html+='• 4th order Runge-Kutta integration<br>';
    html+='• Gauss-Seidel for Laplace equation<br>';
    html+='• Nelder-Mead simplex optimization<br>';
    html+='• Golden section 1D minimization</div>';
    html+='<div class="sec-head">Quick start</div>';
    html+='<div class="hint">Try the interactive Truss Designer — click "Member" tool then click two nodes.</div>';
  }
  else if(id==='trussed'||id==='truss'){
    html+='<div class="sec-head">Model info</div>';
    if(S.model){
      html+=prop('Type',S.model.type,'cb');
      html+=prop('Nodes',S.model.nodes.length,'cb');
      html+=prop('Elements',S.model.elements.length,'cb');
      html+=prop('Total DOF',S.model.nodes.length*2,'am');
    }
    if(S.sim.trussResult){
      var r=S.sim.trussResult;
      var maxDisp=Math.max.apply(null,Array.from(r.u).map(Math.abs));
      var maxForce=Math.max.apply(null,r.memberResults.map(function(m){return Math.abs(m.force)}));
      html+='<div class="sec-head">Results</div>';
      html+=prop('Max disp',fmt(maxDisp,5)+' mm','gr');
      html+=prop('Max force',fmt(maxForce,3)+' kN','am');
      html+=prop('Status','Converged ✓','gr');
    }
    html+='<div class="sec-head">Actions</div>';
    html+='<button class="btn full primary" onclick="S.sim.trussResult=null;renderModule();renderInfo()">Re-solve</button>';
    html+='<button class="btn full" style="margin-top:6px" onclick="S.model=null;S.sim.trussResult=null;renderModule();renderInfo()">Reset</button>';
    html+='<div class="sec-head">Editing tools</div>';
    html+='<div class="hint">Click the toolbar buttons on canvas bottom:<br>• Select — pick nodes<br>• + Node — add node<br>• + Member — connect two nodes<br>• Fix — toggle support<br>• Load — add force</div>';
  }
  else if(id==='materials'){
    html+='<div class="sec-head">Database</div>';
    html+=prop('Total materials',MATERIALS.length,'cb');
    var cats={};
    MATERIALS.forEach(function(m){cats[m.cat]=(cats[m.cat]||0)+1});
    Object.keys(cats).forEach(function(c){
      html+=prop(c,cats[c]+' materials','am');
    });
    html+='<div class="sec-head">Properties included</div>';
    html+='<div class="hint">• E — Young\'s modulus (GPa)<br>• ν — Poisson\'s ratio<br>• ρ — Density (kg/m³)<br>• σy — Yield strength (MPa)<br>• σu — Ultimate strength (MPa)<br>• α — Thermal expansion<br>• k — Thermal conductivity<br>• c — Specific heat</div>';
  }
  else if(id==='sections'){
    html+='<div class="sec-head">Properties</div>';
    html+=prop('Total sections',SECTIONS.length,'cb');
    html+=prop('Types',SECTIONS.map(function(s){return s.type}).filter(function(v,i,a){return a.indexOf(v)===i}).length,'am');
    html+='<div class="sec-head">Symbols</div>';
    html+='<div class="hint">A — Cross-sectional area<br>Ix — Moment of inertia (x-axis)<br>Iy — Moment of inertia (y-axis)<br>rx — Radius of gyration (x)<br>ry — Radius of gyration (y)<br>Zx — Section modulus (x)</div>';
  }
  else if(id==='beam'||id==='frame'){
    if(S.model){
      html+='<div class="sec-head">Model</div>';
      html+=prop('Type',S.model.type,'cb');
      html+=prop('Nodes',S.model.nodes.length);
      html+=prop('Members',S.model.elements.length);
    }
    if(S.sim.beamResult){
      var r2=S.sim.beamResult;
      html+='<div class="sec-head">Results</div>';
      var maxM=Math.max.apply(null,r2.memberResults.map(function(m){return Math.max(Math.abs(m.M1),Math.abs(m.M2))}));
      html+=prop('Max moment',fmt(maxM,1)+' N·mm','am');
      html+=prop('Status','Solved ✓','gr');
    }
  }
  else if(id==='modal'){
    html+='<div class="sec-head">Model</div>';
    html+=prop('System','5-DOF mass-spring','cb');
    html+=prop('Method','Generalized eigen','am');
    html+='<div class="sec-head">Note</div>';
    html+='<div class="hint">Natural frequencies increase with mode number. Mode shapes are orthogonal.</div>';
  }
  else if(id==='buckling'){
    html+='<div class="sec-head">Parameters</div>';
    html+='<div class="field"><label>E (GPa)</label><input type="number" value="'+(S.sim.E||200)+'" onchange="S.sim.E=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>I (cm⁴)</label><input type="number" value="'+(S.sim.I||8356)+'" onchange="S.sim.I=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>L (mm)</label><input type="number" value="'+(S.sim.L||3000)+'" onchange="S.sim.L=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>K factor</label><select onchange="S.sim.K=parseFloat(this.value);renderInfo()"><option value="0.5">0.5 (fixed-fixed)</option><option value="0.7">0.7 (fixed-pinned)</option><option value="1" selected>1.0 (pinned-pinned)</option><option value="2">2.0 (fixed-free)</option></select></div>';
  }
  else if(id==='heat1d'){
    html+='<div class="sec-head">Parameters</div>';
    html+='<div class="field"><label>Hot face (°C)</label><input type="number" value="'+(S.sim.Th||100)+'" onchange="S.sim.Th=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>Cold face (°C)</label><input type="number" value="'+(S.sim.Tc||20)+'" onchange="S.sim.Tc=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>k (W/m·K)</label><input type="number" value="'+(S.sim.k||50)+'" onchange="S.sim.k=parseFloat(this.value);renderInfo()"></div>';
    html+='<div class="field"><label>L (m)</label><input type="number" value="'+(S.sim.L||0.2)+'" step="0.01" onchange="S.sim.L=parseFloat(this.value);renderInfo()"></div>';
  }
  else if(id==='report'){
    html+='<div class="sec-head">Report contents</div>';
    html+='<div class="hint">Generated sections:<br>• Model description<br>• Material summary<br>• Solver performance<br>• Analysis results<br>• Recommendations</div>';
    html+='<div class="sec-head">Export formats</div>';
    html+='<div class="hint">• HTML (standalone)<br>• Plain text<br>• JSON<br>• CSV</div>';
  }
  else {
    var m=MODULES.find(function(x){return x.id===id});
    if(m){
      html+='<div class="sec-head">'+m.name+'</div>';
      html+='<div class="hint">'+m.sub+'</div>';
    }
  }
  body.innerHTML=html;
}
function prop(k,v,cls){
  return '<div class="prop"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v)+'</span></div>';
}

/* ══════════ Interactions ══════════ */
function bindInteractions(){
  /* Canvas click for truss editor */
  S.cv.addEventListener('click',function(e){
    var r=S.cv.getBoundingClientRect();
    var x=e.clientX-r.left;
    var y=e.clientY-r.top;
    /* Toolbar clicks */
    if(y>S.H-80&&y<S.H-20){
      var tools=[
        {id:'select',x:30,y:S.H-70},
        {id:'addNode',x:140,y:S.H-70},
        {id:'addElement',x:250,y:S.H-70},
        {id:'fix',x:360,y:S.H-70},
        {id:'load',x:470,y:S.H-70}
      ];
      for(var i=0;i<tools.length;i++){
        if(x>=tools[i].x&&x<=tools[i].x+100&&y>=tools[i].y&&y<=tools[i].y+40){
          S.mode=tools[i].id;
          toast('Tool: '+tools[i].id,'cb');
          S.sim.trussResult=null;
          return;
        }
      }
    }
    /* Truss editing */
    if(S.module==='trussed'||S.module==='truss'){
      if(!S.model||S.model.type!=='Truss')return;
      /* Find node under cursor */
      var found=-1;
      for(var j=0;j<S.model.nodes.length;j++){
        var n=S.model.nodes[j];
        if(Math.hypot(n.x-x,n.y-y)<15){found=j;break}
      }
      if(S.mode==='select'){
        S.selectedNode=found>=0?found:null;
      } else if(S.mode==='addNode'){
        S.model.nodes.push({x:x,y:y});
        S.sim.trussResult=null;
        toast('Node added','cb');
      } else if(S.mode==='addElement'){
        if(found>=0){
          if(S.pendingNode===null||S.pendingNode===undefined){
            S.pendingNode=found;
            toast('Click second node','cb');
          } else if(S.pendingNode!==found){
            S.model.elements.push({n1:S.pendingNode,n2:found,E:200,A:10});
            S.pendingNode=null;
            S.sim.trussResult=null;
            toast('Member added','gr');
          }
        } else {
          S.pendingNode=null;
        }
      } else if(S.mode==='fix'){
        if(found>=0){
          var nd=S.model.nodes[found];
          if(!nd.fixX&&!nd.fixY){nd.fixX=true;nd.fixY=true}
          else{nd.fixX=false;nd.fixY=false}
          S.sim.trussResult=null;
        }
      } else if(S.mode==='load'){
        if(found>=0){
          var nd2=S.model.nodes[found];
          nd2.fy=(nd2.fy||0)-10000; /* cycle load: -10kN, -20kN, reset */
          if(nd2.fy<=-30000)nd2.fy=0;
          S.sim.trussResult=null;
        }
      }
      updateStatus();
    }
    /* Report export button */
    if(S.module==='report'&&S.sim.reportBtn){
      var rb=S.sim.reportBtn;
      if(x>=rb.x&&x<=rb.x+rb.w&&y>=rb.y&&y<=rb.y+rb.h){
        exportReport();
      }
    }
  });
  /* Keyboard */
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();document.querySelector('.nav-search input').focus()}
    else if(e.key==='Escape'){var s=document.querySelector('.nav-search input');if(s){s.blur();s.value='';buildNav()}}
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  /* Search */
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    nav.appendChild(searchBox);
    searchBox.appendChild(searchInput);
    if(!q){buildNav();var nav2=$('nav');nav2.insertBefore(searchBox,nav2.firstChild);searchBox.appendChild(searchInput);return}
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.ico+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}

function exportReport(){
  var html='<!DOCTYPE html><html><head><title>Mechanica Report</title>';
  html+='<style>body{font-family:Inter,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.6;color:#1a1a2a}h1{color:#2d7fff}h2{color:#333;border-bottom:2px solid #2d7fff;padding-bottom:8px;margin-top:32px}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px;border:1px solid #ddd;text-align:left;font-size:13px}th{background:#f0f4ff;font-family:monospace}.num{text-align:right;font-family:monospace;color:#2d7fff}</style></head><body>';
  html+='<h1>MECHANICA · Engineering Report</h1>';
  html+='<p>Generated: '+new Date().toISOString()+'</p>';
  html+='<h2>Model Summary</h2>';
  if(S.model){
    html+='<table><tr><th>Property</th><th>Value</th></tr>';
    html+='<tr><td>Type</td><td class="num">'+esc(S.model.type)+'</td></tr>';
    html+='<tr><td>Nodes</td><td class="num">'+S.model.nodes.length+'</td></tr>';
    html+='<tr><td>Elements</td><td class="num">'+S.model.elements.length+'</td></tr>';
    html+='<tr><td>Degrees of freedom</td><td class="num">'+(S.model.nodes.length*2)+'</td></tr>';
    html+='</table>';
  } else {
    html+='<p><em>No model loaded</em></p>';
  }
  html+='<h2>Available Resources</h2>';
  html+='<table><tr><th>Resource</th><th>Count</th></tr>';

/* ══════════ Main loop ══════════ */
var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;
  S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.clearRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff3355';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

/* ══════════ Boot ══════════ */
function boot(){
  var stages=[
    {msg:'initializing linear algebra engine…',pct:15},
    {msg:'loading material database…',pct:35},
    {msg:'compiling FEM element library…',pct:55},
    {msg:'calibrating solvers…',pct:75},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,180);
  }
  setTimeout(next,200);
}

/* ══════════ Init ══════════ */
function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  updateStatus();
  boot();
  requestAnimationFrame(loop);
  console.log('%c MECHANICA ','background:linear-gradient(90deg,#2d7fff,#ffa500);color:#08090d;padding:10px 22px;border-radius:6px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('Engineering Simulation Studio · '+MODULES.length+' modules · real FEM engine');
  console.log('Solvers: LU · Jacobi · RK4 · Gauss-Seidel · Nelder-Mead · Golden');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

window.exportReport=exportReport;
</script>
