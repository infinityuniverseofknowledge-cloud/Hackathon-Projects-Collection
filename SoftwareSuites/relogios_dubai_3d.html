<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dubai Gold & Diamond Watches</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; overflow:hidden; background:#000; color:#fff; font-family:monospace; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:20px; }
  #title { text-align:center; font-size:1.4rem; color:#ffd700; text-shadow:0 0 15px #ffd700, 2px 2px 0 #000; letter-spacing:3px; }
  #hint { text-align:center; font-size:0.8rem; color:#aaa; opacity:0.8; }
  #loading { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:100; color:#ffd700; font-size:1.2rem; }
</style>
</head>
<body>

<div id="loading">MONTANDO A COLEÇÃO...</div>
<div id="hud">
  <div id="title">DUBAI COLLECTION</div>
  <div id="hint">🖱️ Arraste para girar · Voxel Art</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ==========================================
// SETUP
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 40, 100);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 20, 35);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI / 2 + 0.1;

// ==========================================
// ILUMINAÇÃO DE ESTÚDIO
// ==========================================
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
keyLight.position.set(15, 30, 15);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffd700, 1.0);
rimLight.position.set(-15, 15, -15);
scene.add(rimLight);
const blueLight = new THREE.PointLight(0x4a8fa8, 0.5, 30);
blueLight.position.set(0, 10, 20);
scene.add(blueLight);

// ==========================================
// MATERIAIS
// ==========================================
const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
const matGoldDark = new THREE.MeshStandardMaterial({ color: 0xc8a800, metalness: 0.8, roughness: 0.2 });
const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
const matDiamond = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.0, emissive: 0x444444 });
const matLeather = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 });
const matBlue = new THREE.MeshStandardMaterial({ color: 0x0044ff, metalness: 0.5, emissive: 0x0022aa });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x00ff44, metalness: 0.5, emissive: 0x00aa22 });

// ==========================================
// SISTEMA VOXEL (InstancedMesh)
// ==========================================
const voxels = {
  gold: [], goldDark: [], black: [], diamond: [],
  leather: [], blue: [], green: []
};

const V = (type, x, y, z, w=1, h=1, d=1, rx=0, ry=0, rz=0) => {
  voxels[type].push({ x, y, z, w, h, d, rx, ry, rz });
};

// ==========================================
// CONSTRUÇÃO DO PÓDIO
// ==========================================
// Base preta
for(let x=-15; x<=15; x++) for(let z=-10; z<=10; z++) V('black', x, 0, z, 1, 1, 1);
// Borda dourada
for(let x=-16; x<=16; x++) { V('goldDark', x, 0, -11, 1, 1, 1); V('goldDark', x, 0, 11, 1, 1, 1); }
for(let z=-11; z<=11; z++) { V('goldDark', -16, 0, z, 1, 1, 1); V('goldDark', 16, 0, z, 1, 1, 1); }

// Nível 2
for(let x=-10; x<=10; x++) for(let z=-6; z<=6; z++) V('black', x, 1, z, 1, 1, 1);
for(let x=-11; x<=11; x++) { V('gold', x, 1, -7, 1, 1, 1); V('gold', x, 1, 7, 1, 1, 1); }
for(let z=-7; z<=7; z++) { V('gold', x, 1, z, 1, 1, 1); V('gold', x, 1, z, 1, 1, 1); }

// Nível 3 (Central)
for(let x=-5; x<=5; x++) for(let z=-3; z<=3; z++) V('black', x, 2, z, 1, 1, 1);
for(let x=-6; x<=6; x++) { V('gold', x, 2, -4, 1, 1, 1); V('gold', x, 2, 4, 1, 1, 1); }

// ==========================================
// FUNÇÃO PARA CRIAR RELÓGIOS
// ==========================================
const buildWatch = (cx, cz, rotY, type) => {
  const cy = type === 'center' ? 3 : 1.5;
  const r = 3.5; // Raio do mostrador
  const depth = 1.5; // Espessura

  // Mostrador (Círculo Voxel)
  for(let x=-r; x<=r; x++) {
    for(let z=-r; z<=r; z++) {
      if (x*x + z*z <= r*r) {
        // Base do relógio
        V('goldDark', cx + x, cy, cz + z, 1, depth, 1);
        
        // Detalhes internos
        if (x*x + z*z < r*r - 1) {
          V('gold', cx + x, cy + depth/2 + 0.1, cz + z, 1, 0.2, 1);
        }
      }
      // Aro do relógio (Bordas)
      if (x*x + z*z > r*r && x*x + z*z <= (r+0.8)*(r+0.8)) {
        if (type === 'diamond') {
          V('diamond', cx + x, cy, cz + z, 0.8, depth+0.2, 0.8);
        } else if (type === 'blue') {
           if ((x+z)%2===0) V('blue', cx + x, cy, cz + z, 0.8, depth, 0.8);
           else V('gold', cx + x, cy, cz + z, 0.8, depth, 0.8);
        } else if (type === 'green') {
           if ((x+z)%2===0) V('green', cx + x, cy, cz + z, 0.8, depth, 0.8);
           else V('gold', cx + x, cy, cz + z, 0.8, depth, 0.8);
        } else {
          V('gold', cx + x, cy, cz + z, 0.8, depth, 0.8);
        }
      }
    }
  }

  // Ponteiros do relógio
  V('black', cx, cy + depth/2 + 0.2, cz, 0.4, 0.2, 2);
  V('black', cx, cy + depth/2 + 0.2, cz, 2, 0.2, 0.4);
  V('black', cx, cy + depth/2 + 0.3, cz, 0.6, 0.3, 0.6); // Centro

  // Coroa lateral
  V('gold', cx + r + 1, cy, cz, 1, 1, 1);

  // Pulseira
  for(let z=r+1; z<=r+5; z++) {
    for(let x=-2; x<=2; x++) {
      if (type === 'leather') {
        V('leather', cx + x, cy, cz + z, 1, depth, 1);
        V('leather', cx + x, cy, cz - z, 1, depth, 1);
      } else if (type === 'diamond') {
        V('diamond', cx + x, cy, cz + z, 1, depth, 1);
        V('diamond', cx + x, cy, cz - z, 1, depth, 1);
      } else {
        // Pulseira de elos de ouro
        V('gold', cx + x, cy, cz + z, 0.8, depth, 0.8);
        V('gold', cx + x, cy, cz - z, 0.8, depth, 0.8);
      }
    }
  }
};

// Construindo os 5 Relógios
buildWatch(-9, 0, 0, 'gold');       // Esquerda (Ouro com diamantes na borda)
buildWatch(0, -5, 0, 'leather');    // Topo (Couro marrom)
buildWatch(9, 0, 0, 'diamond');     // Direita (Totalmente diamante)
buildWatch(-6, 6, 0, 'blue');       // Baixo Esq (Azul)
buildWatch(6, 6, 0, 'green');       // Baixo Dir (Verde)

// ==========================================
// ELEMENTOS FLUTUANTES (Diamantes e Barras)
// ==========================================
// Barras de Ouro
[[-14, 3, -5], [14, 3, 5], [-12, 6, 4], [12, 4, -4]].forEach(p => {
  V('gold', p[0], p[1], p[2], 2, 0.5, 1);
  V('goldDark', p[0], p[1]-0.3, p[2], 2, 0.1, 1); // Sombra
});

// Diamantes Flutuantes
for(let i=0; i<80; i++) {
  const x = (Math.random() - 0.5) * 40;
  const y = Math.random() * 15 + 2;
  const z = (Math.random() - 0.5) * 25;
  // Evita colocar dentro dos relógios
  if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;
  
  V('diamond', x, y, z, 0.6, 0.6, 0.6, Math.random(), Math.random(), 0);
}

// Letreiro "DUBAI" no topo (Blocos de Ouro)
const drawDubaiText = (startX, y, z) => {
  // D
  V('gold', startX, y, z, 1, 3, 1); V('gold', startX+1, y+2, z, 1, 1, 1); V('gold', startX+1, y, z, 1, 1, 1);
  // U
  V('gold', startX+3, y, z, 1, 3, 1); V('gold', startX+4, y, z, 1, 1, 1); V('gold', startX+5, y, z, 1, 3, 1); V('gold', startX+4, y+2, z, 1, 1, 1);
  // B
  V('gold', startX+7, y, z, 1, 3, 1); V('gold', startX+8, y+2, z, 1, 1, 1); V('gold', startX+8, y+1, z, 1, 1, 1); V('gold', startX+8, y, z, 1, 1, 1);
  // A
  V('gold', startX+10, y, z, 1, 2, 1); V('gold', startX+11, y+2, z, 1, 1, 1); V('gold', startX+12, y, z, 1, 2, 1); V('gold', startX+11, y+1, z, 1, 1, 1);
  // I
  V('gold', startX+14, y, z, 1, 3, 1);
};
drawDubaiText(-7, 14, -5);

// ==========================================
// RENDERIZAÇÃO INSTANCEDMESH
// ==========================================
const geo = new THREE.BoxGeometry(1, 1, 1);
const dummy = new THREE.Object3D();
const materials = {
  gold: matGold, goldDark: matGoldDark, black: matBlack, 
  diamond: matDiamond, leather: matLeather, blue: matBlue, green: matGreen
};

for (const [type, list] of Object.entries(voxels)) {
  if (list.length === 0) continue;
  const mesh = new THREE.InstancedMesh(geo, materials[type], list.length);
  
  list.forEach((b, i) => {
    dummy.position.set(b.x, b.y, b.z);
    dummy.scale.set(b.w, b.h, b.d);
    dummy.rotation.set(b.rx, b.ry, b.rz);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);
}

// ==========================================
// PLANO DE FUNDO E LOOP
// ==========================================
// Grid sutil no chão
const grid = new THREE.GridHelper(60, 60, 0xffd700, 0x222222);
grid.position.y = -0.5;
scene.add(grid);

setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 300);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
