<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RPG Overworld</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#050708;font-family:'Courier New',monospace;touch-action:none}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #stick{position:fixed;bottom:26px;left:26px;width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);z-index:20;touch-action:none}
  #stick::before{content:'';position:absolute;inset:22px;border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
  #knob{position:absolute;width:56px;height:56px;border-radius:50%;top:50%;left:50%;
    background:radial-gradient(circle at 32% 28%,#fff,#7a8899);
    box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 -3px 6px rgba(0,0,0,.25);
    transform:translate(-50%,-50%);transition:transform .04s linear;pointer-events:none}
  #hud{position:fixed;top:14px;left:14px;color:#bff;font-size:11px;
    background:rgba(0,0,0,.55);padding:7px 11px;border-radius:5px;
    border:1px solid rgba(100,255,255,.25);z-index:20;line-height:1.6}
  #hud b{color:#fff}
  #battle{position:fixed;inset:0;background:#0a0e1a;color:#fff;z-index:30;display:none;flex-direction:column;font-family:'Courier New',monospace}
  #battle.show{display:flex}
  #bTop{flex:1;display:flex;align-items:center;justify-content:center;gap:60px;position:relative}
  .enemyBox{text-align:center}
  .enemyName{font-size:18px;color:#fbb;letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 8px #f66}
  .bar{width:220px;height:14px;background:#222;border:2px solid #555;border-radius:3px;overflow:hidden;margin:6px auto}
  .barFill{height:100%;background:linear-gradient(180deg,#f44,#a22);transition:width .3s}
  .barFill.hp{background:linear-gradient(180deg,#4f4,#282)}
  #bLog{height:80px;background:#111a26;border-top:2px solid #333;border-bottom:2px solid #333;
    padding:12px;font-size:14px;line-height:1.5;color:#cfd;overflow:hidden}
  #bMenu{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#333;padding:2px}
  .btn{background:#1a2230;color:#8fd;padding:18px;text-align:center;font-size:16px;letter-spacing:2px;
    cursor:pointer;border:none;font-family:inherit;transition:background .1s}
  .btn:hover,.btn:active{background:#2a3548;color:#fff}
  .btn.disabled{opacity:.4;pointer-events:none}
  #fade{position:fixed;inset:0;background:#000;z-index:40;pointer-events:none;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div>FPS: <b id="fps">--</b></div>
  <div>POS: <b id="pos">0,0</b></div>
  <div>MAP: <b id="mapname">Overworld</b></div>
</div>
<div id="stick"><div id="knob"></div></div>

<div id="battle">
  <div id="bTop">
    <div class="enemyBox">
      <div class="enemyName" id="enemyName">SLIME</div>
      <canvas id="enemyCanvas" width="128" height="128" style="image-rendering:pixelated"></canvas>
      <div class="bar"><div class="barFill" id="enemyHP" style="width:100%"></div></div>
    </div>
  </div>
  <div id="bLog">Um inimigo apareceu!</div>
  <div id="bMenu">
    <button class="btn" data-act="attack">ATACAR</button>
    <button class="btn" data-act="defend">DEFENDER</button>
    <button class="btn" data-act="heal">CURAR</button>
    <button class="btn" data-act="flee">FUGIR</button>
  </div>
  <div style="padding:8px;background:#0a0e1a;font-size:12px;color:#89a;text-align:center">
    SEU HP: <span id="playerHPText" style="color:#4f4">30/30</span>
  </div>
</div>

<div id="fade"></div>

<script>
'use strict';

/* =============================================================================
   UTIL
============================================================================= */
const mulberry32 = s => () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = s;
  t = Math.imul(t ^ t >>> 15, t | 1);
  t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
function nc(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return { c, x };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const TILE = 32;
const MAP_W = 80, MAP_H = 60;
const SEED = 1337;

/* =============================================================================
   TEXTURAS DE TERRENO — com pixels semi-transparentes nas bordas (anti-aliasing suave)
============================================================================= */
function aaEdge(x, TILE) {
  // Aplica 1px de borda semi-transparente para suavizar textura contra fundo
  const img = x.getImageData(0, 0, TILE, TILE);
  const d = img.data;
  for (let py = 0; py < TILE; py++) {
    for (let px = 0; px < TILE; px++) {
      if (px !== 0 && py !== 0 && px !== TILE - 1 && py !== TILE - 1) continue;
      const i = (py * TILE + px) * 4;
      const isCorner = (px === 0 || px === TILE - 1) && (py === 0 || py === TILE - 1);
      d[i + 3] = isCorner ? 230 : 245;
    }
  }
  x.putImageData(img, 0, 0);
}

function mkGrass(seed, dark) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 7919 + (dark ? 13 : 7));
  const base   = dark ? '#3d6e2a' : '#5f9550';
  const shade  = dark ? '#2a5220' : '#456f38';
  const light  = dark ? '#4d8a38' : '#7abb60';
  const darker = dark ? '#1f3814' : '#385a26';
  const highlight = dark ? '#5da548' : '#96d97a';
  x.fillStyle = base; x.fillRect(0, 0, TILE, TILE);
  // ruído principal
  for (let i = 0; i < 260; i++) {
    const px = (r() * TILE) | 0, py = (r() * TILE) | 0;
    const v = r();
    x.fillStyle = v < .22 ? shade : v < .48 ? light : v < .72 ? base : v < .9 ? darker : highlight;
    x.fillRect(px, py, 1, 1);
    // clusters semi-aleatórios para AA-feel
    if (r() < .12) {
      x.globalAlpha = .5;
      x.fillRect(px + 1, py, 1, 1);
      x.globalAlpha = 1;
    }
  }
  // tufos de grama detalhados
  for (let i = 0; i < 7; i++) {
    const px = 5 + ((r() * (TILE - 10)) | 0);
    const py = 5 + ((r() * (TILE - 10)) | 0);
    x.fillStyle = light;
    x.fillRect(px, py, 1, 4);
    x.fillRect(px + 1, py + 1, 1, 3);
    x.fillRect(px - 1, py + 2, 1, 2);
    x.fillStyle = highlight;
    x.fillRect(px, py, 1, 1);
    x.fillStyle = shade;
    x.fillRect(px - 2, py + 3, 1, 1);
    x.fillRect(px + 2, py + 4, 1, 1);
  }
  // sombreamento suave radial
  const g = x.createRadialGradient(TILE/2, TILE/2, 2, TILE/2, TILE/2, TILE*.75);
  g.addColorStop(0, 'rgba(255,255,255,0.05)');
  g.addColorStop(.7, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.14)');
  x.fillStyle = g; x.fillRect(0, 0, TILE, TILE);
  aaEdge(x, TILE);
  return c;
}

function mkFlower(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 5077 + 99);
  x.drawImage(mkGrass(seed, false), 0, 0);
  const colors = [
    ['#ff5566','#ffddaa','#cc3344'],
    ['#ffaa33','#ffeeaa','#cc7722'],
    ['#cc66ff','#eeddff','#9933cc'],
    ['#66aaff','#ddeeff','#3377cc'],
    ['#ff88cc','#ffe0f0','#cc5599']
  ];
  const n = 2 + (r() * 3 | 0);
  for (let i = 0; i < n; i++) {
    const px = 6 + ((r() * (TILE - 12)) | 0);
    const py = 6 + ((r() * (TILE - 12)) | 0);
    const [pet, center, dark] = colors[(r() * colors.length) | 0];
    // caule
    x.fillStyle = '#3a5a20';
    x.fillRect(px, py + 2, 1, 3);
    x.fillRect(px + 1, py + 3, 1, 1);
    // pétalas com anti-alias (pixel central + 4 laterais semi-transparentes)
    x.fillStyle = pet;
    x.fillRect(px - 1, py, 3, 1);
    x.fillRect(px, py - 1, 1, 3);
    x.globalAlpha = .7;
    x.fillStyle = dark;
    x.fillRect(px - 2, py, 1, 1);
    x.fillRect(px + 2, py, 1, 1);
    x.fillRect(px, py - 2, 1, 1);
    x.fillRect(px, py + 2, 1, 1);
    x.globalAlpha = 1;
    // centro
    x.fillStyle = center;
    x.fillRect(px, py, 1, 1);
  }
  aaEdge(x, TILE);
  return c;
}

function mkSand(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 3221 + 5);
  x.fillStyle = '#e2ca94'; x.fillRect(0, 0, TILE, TILE);
  for (let i = 0; i < 260; i++) {
    const px = (r() * TILE) | 0, py = (r() * TILE) | 0;
    const v = r();
    x.fillStyle = v < .3 ? '#d4b878' : v < .55 ? '#f0deaa' : v < .8 ? '#c8a868' : '#f6e4bc';
    x.fillRect(px, py, 1, 1);
    if (r() < .1) {
      x.globalAlpha = .5;
      x.fillRect(px + 1, py + 1, 1, 1);
      x.globalAlpha = 1;
    }
  }
  // ondulações de areia
  for (let i = 0; i < 4; i++) {
    const py = 6 + ((r() * (TILE - 12)) | 0);
    x.fillStyle = '#c8a868';
    for (let xx = 4; xx < TILE - 4; xx += 2)
      x.fillRect(xx, py + Math.floor(Math.sin(xx * .5) * 1.5), 2, 1);
  }
  aaEdge(x, TILE);
  return c;
}

function mkWater(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 1039 + 17);
  const g = x.createLinearGradient(0, 0, 0, TILE);
  g.addColorStop(0, '#3d80d0');
  g.addColorStop(.5, '#2868b4');
  g.addColorStop(1, '#1c4d8c');
  x.fillStyle = g; x.fillRect(0, 0, TILE, TILE);
  // ondulações
  for (let i = 0; i < 4; i++) {
    const py = 3 + i * 8 + ((r() * 3) | 0);
    const px = (r() * 8) | 0;
    x.fillStyle = 'rgba(180,220,255,0.5)';
    x.fillRect(px, py, 7, 1);
    x.fillRect(px + 14, py + 2, 9, 1);
    x.globalAlpha = .5;
    x.fillStyle = 'rgba(120,180,240,0.6)';
    x.fillRect(px + 3, py + 1, 6, 1);
    x.globalAlpha = 1;
    // brilho pontual
    if (r() < .3) {
      x.fillStyle = '#f0f8ff';
      x.fillRect(px + 5, py, 2, 1);
    }
  }
  aaEdge(x, TILE);
  return c;
}

function mkStone(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 2017 + 3);
  x.fillStyle = '#74747c'; x.fillRect(0, 0, TILE, TILE);
  for (let i = 0; i < 150; i++) {
    const px = (r() * TILE) | 0, py = (r() * TILE) | 0;
    const v = r();
    x.fillStyle = v < .35 ? '#5f5f68' : v < .7 ? '#8a8a94' : '#4c4c54';
    x.fillRect(px, py, 1, 1);
  }
  // paralelepípedos com sombreamento
  for (let yy = 0; yy < TILE; yy += 8) {
    x.fillStyle = 'rgba(30,30,38,0.55)';
    x.fillRect(0, yy, TILE, 1);
    x.fillStyle = 'rgba(200,200,210,0.15)';
    x.fillRect(0, yy + 1, TILE, 1);
    const off = (yy / 8) % 2 ? 4 : 12;
    for (let xx = off; xx < TILE; xx += 16) {
      x.fillStyle = 'rgba(30,30,38,0.55)';
      x.fillRect(xx, yy, 1, 8);
      x.fillStyle = 'rgba(200,200,210,0.15)';
      x.fillRect(xx + 1, yy, 1, 8);
    }
  }
  aaEdge(x, TILE);
  return c;
}

/* =============================================================================
   SPRITES DE OBJETOS — mais detalhados e com sombras suaves
============================================================================= */
function mkOak() {
  const W = 48, H = 64;
  const { c, x } = nc(W, H);
  const r = mulberry32(111);
  // sombra elíptica suave no chão
  x.save();
  const gs = x.createRadialGradient(24, 60, 2, 24, 60, 18);
  gs.addColorStop(0, 'rgba(0,0,0,0.4)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(24, 60, 18, 6, 0, 0, Math.PI * 2); x.fill();
  x.restore();
  // tronco com gradiente
  const tg = x.createLinearGradient(18, 44, 30, 60);
  tg.addColorStop(0, '#4a2f18');
  tg.addColorStop(.5, '#6b4526');
  tg.addColorStop(1, '#3a2010');
  x.fillStyle = tg; x.fillRect(20, 44, 8, 16);
  x.fillStyle = 'rgba(0,0,0,0.3)'; x.fillRect(25, 44, 3, 16);
  // raízes
  x.fillStyle = '#4a2f18';
  x.fillRect(17, 58, 4, 3); x.fillRect(27, 58, 4, 3);
  x.fillStyle = '#6b4526';
  x.fillRect(17, 58, 1, 3); x.fillRect(27, 58, 1, 3);
  // copa densa multi-camada
  const canopy = (cx, cy, r0, colA, colB, colC, colHL) => {
    for (let yy = -r0; yy <= r0; yy++) {
      for (let xx = -r0; xx <= r0; xx++) {
        const d = Math.hypot(xx, yy);
        if (d > r0) continue;
        const v = r();
        const edge = d > r0 - 1.5;
        x.fillStyle = v < .5 ? colA : v < .78 ? colB : v < .94 ? colC : colHL;
        x.globalAlpha = edge ? .65 : 1;
        x.fillRect(cx + xx, cy + yy, 1, 1);
      }
    }
    x.globalAlpha = 1;
  };
  canopy(24, 22, 14, '#2e6b1e', '#3d8428', '#1e4a12', '#55aa44');
  canopy(13, 27, 9, '#2e6b1e', '#3d8428', '#1e4a12', '#55aa44');
  canopy(35, 27, 9, '#2e6b1e', '#3d8428', '#1e4a12', '#55aa44');
  canopy(24, 33, 11, '#3d8428', '#4d9c38', '#1e4a12', '#78c864');
  canopy(24, 13, 10, '#3d8428', '#55aa44', '#2e6b1e', '#90e878');
  // highlights
  x.globalAlpha = .8;
  x.fillStyle = '#a8f088';
  x.fillRect(18, 8, 2, 2); x.fillRect(28, 12, 2, 2);
  x.fillRect(14, 20, 3, 2); x.fillRect(34, 22, 2, 2);
  x.fillRect(22, 28, 2, 2);
  x.globalAlpha = 1;
  return c;
}

function mkPine() {
  const W = 44, H = 76;
  const { c, x } = nc(W, H);
  const r = mulberry32(222);
  // sombra
  const gs = x.createRadialGradient(22, 70, 2, 22, 70, 15);
  gs.addColorStop(0, 'rgba(0,0,0,0.4)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(22, 70, 15, 5, 0, 0, Math.PI * 2); x.fill();
  // tronco
  const tg = x.createLinearGradient(18, 56, 26, 72);
  tg.addColorStop(0, '#4a2f18');
  tg.addColorStop(1, '#2a1808');
  x.fillStyle = tg; x.fillRect(19, 56, 6, 16);
  x.fillStyle = '#6b4526'; x.fillRect(19, 56, 2, 16);
  // 4 camadas de folhagem
  const layer = (cx, cy, halfW, h, colA, colB, colDark, colHL) => {
    for (let yy = 0; yy < h; yy++) {
      const w = halfW - Math.floor(halfW * (yy / h));
      for (let xx = -w; xx <= w; xx++) {
        const v = r();
        const edge = Math.abs(xx) > w - 1.3;
        x.fillStyle = v < .48 ? colA : v < .75 ? colB : v < .93 ? colDark : colHL;
        x.globalAlpha = edge ? .55 : 1;
        x.fillRect(cx + xx, cy + yy, 1, 1);
      }
    }
    x.globalAlpha = 1;
  };
  layer(22, 6, 11, 20, '#2a5a18', '#3a7824', '#0f2e0a', '#66b84a');
  layer(22, 22, 14, 20, '#2a5a18', '#3a7824', '#0f2e0a', '#66b84a');
  layer(22, 38, 16, 20, '#1e4a12', '#2a5a18', '#0a2406', '#5aa040');
  // neve
  x.fillStyle = '#ddeaff';
  x.fillRect(20, 5, 4, 2);
  x.fillStyle = '#ffffff';
  x.fillRect(21, 4, 2, 1);
  return c;
}

function mkRock() {
  const W = 32, H = 28;
  const { c, x } = nc(W, H);
  const r = mulberry32(333);
  const gs = x.createRadialGradient(16, 25, 1, 16, 25, 12);
  gs.addColorStop(0, 'rgba(0,0,0,0.35)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(16, 25, 12, 3.5, 0, 0, Math.PI * 2); x.fill();
  // corpo irregular
  for (let yy = 4; yy < 22; yy++) {
    const w = 13 - Math.abs(yy - 13) * .55 + (r() * 3 | 0) - 1;
    for (let xx = -w; xx <= w; xx++) {
      const v = r();
      const edge = Math.abs(xx) > w - 1.4;
      x.fillStyle = v < .4 ? '#7a7a82' : v < .7 ? '#9a9aa2' : v < .9 ? '#5a5a62' : '#b0b0b8';
      x.globalAlpha = edge ? .55 : 1;
      x.fillRect(16 + xx, yy, 1, 1);
    }
  }
  x.globalAlpha = 1;
  // brilho
  x.fillStyle = '#c8c8d0';
  x.fillRect(10, 7, 6, 2);
  x.fillRect(12, 6, 3, 1);
  return c;
}

function mkBush() {
  const W = 34, H = 26;
  const { c, x } = nc(W, H);
  const r = mulberry32(444);
  const gs = x.createRadialGradient(17, 22, 1, 17, 22, 12);
  gs.addColorStop(0, 'rgba(0,0,0,0.3)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(17, 22, 12, 3, 0, 0, Math.PI * 2); x.fill();
  for (let yy = 3; yy < 22; yy++) {
    const w = 11 - Math.abs(yy - 12) * .35 + (r() * 3 | 0) - 1;
    for (let xx = -w; xx <= w; xx++) {
      const v = r();
      const edge = Math.abs(xx) > w - 1.3;
      x.fillStyle = v < .45 ? '#2e6b1e' : v < .75 ? '#3d8428' : v < .92 ? '#1e4a12' : '#5aa840';
      x.globalAlpha = edge ? .6 : 1;
      x.fillRect(17 + xx, yy, 1, 1);
    }
  }
  x.globalAlpha = 1;
  // brilhos
  x.fillStyle = '#a8f088';
  x.fillRect(12, 8, 2, 2); x.fillRect(21, 10, 2, 2); x.fillRect(17, 6, 1, 1);
  // frutinhas
  x.fillStyle = '#e04455';
  x.fillRect(14, 13, 1, 1); x.fillRect(20, 15, 1, 1);
  x.fillStyle = '#ff6677';
  x.fillRect(14, 12, 1, 1); x.fillRect(20, 14, 1, 1);
  return c;
}

function mkHouse() {
  const W = 96, H = 96;
  const { c, x } = nc(W, H);
  const r = mulberry32(555);
  // sombra
  const gs = x.createRadialGradient(48, 90, 4, 48, 90, 46);
  gs.addColorStop(0, 'rgba(0,0,0,0.4)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(48, 90, 44, 8, 0, 0, Math.PI * 2); x.fill();
  // paredes com gradiente
  const wg = x.createLinearGradient(0, 40, 0, 88);
  wg.addColorStop(0, '#f0e2bc');
  wg.addColorStop(.6, '#e8d8b0');
  wg.addColorStop(1, '#c8b488');
  x.fillStyle = wg; x.fillRect(12, 40, 72, 44);
  x.fillStyle = 'rgba(120,90,50,0.25)'; x.fillRect(12, 40, 72, 2);
  // textura de pedra/tijolo
  for (let i = 0; i < 260; i++) {
    const px = 12 + ((r()*72)|0);
    const py = 44 + ((r()*40)|0);
    x.fillStyle = r() < .5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.06)';
    x.fillRect(px, py, 1, 1);
  }
  // linhas horizontais de tijolo
  x.fillStyle = 'rgba(120,90,50,0.35)';
  for (let yy = 52; yy < 84; yy += 8) x.fillRect(12, yy, 72, 1);
  // telhado
  for (let yy = 0; yy < 34; yy++) {
    const w = 48 + yy;
    const tg = x.createLinearGradient(0, 40 - yy + 8, 0, 40 - yy + 9);
    x.fillStyle = yy < 8 ? '#c04a38' : yy < 20 ? '#a84030' : '#8a3226';
    x.fillRect(48 - w, 40 - yy + 8, w * 2, 1);
  }
  // textura de telhas
  x.fillStyle = 'rgba(60,20,10,0.3)';
  for (let yy = 0; yy < 34; yy += 3) x.fillRect(0, 14 + yy, W, 1);
  // contorno telhado com sombra
  x.strokeStyle = '#5a1f10'; x.lineWidth = 2;
  x.beginPath();

/* =============================================================================
   PERSONAGEM — 32x32, 4 dir × 4 frames com sombreamento e anti-aliasing
============================================================================= */
function mkCharacterSheet() {
  const S = 32, COLS = 4, ROWS = 4;
  const { c, x } = nc(S * COLS, S * ROWS);
  for (let dir = 0; dir < ROWS; dir++)
    for (let f = 0; f < COLS; f++)
      drawChar(x, f * S, dir * S, dir, f);
  return c;
}

============================================================================= */
function mkEnemy() {
  const S = 32;
  const { c, x } = nc(S, S);
  const r = mulberry32(7777);
  // sombra
  const gs = x.createRadialGradient(16, 27, 1, 16, 27, 12);
  gs.addColorStop(0, 'rgba(0,0,0,0.4)');
  gs.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gs;
  x.beginPath(); x.ellipse(16, 27, 12, 3, 0, 0, Math.PI * 2); x.fill();
  // corpo de slime
  for (let yy = 8; yy < 26; yy++) {
    const w = 12 - Math.abs(yy - 20) * .35 + (r() * 2 | 0) - 1;
    for (let xx = -w; xx <= w; xx++) {
      const v = r();
      const edge = Math.abs(xx) > w - 1.3;
      x.fillStyle = v < .35 ? '#3ab058' : v < .6 ? '#50d078' : v < .85 ? '#288a44' : '#80ffaa';
      x.globalAlpha = edge ? .55 : 1;
      x.fillRect(16 + xx, yy, 1, 1);
    }
  }
  x.globalAlpha = 1;
  // brilho superior
  x.fillStyle = 'rgba(255,255,255,0.6)';
  x.fillRect(9, 11, 4, 2);
  x.fillRect(10, 10, 2, 1);
  // olhos
  x.fillStyle = '#1a0a2a'; x.fillRect(11, 15, 3, 3);
  x.fillStyle = '#fff'; x.fillRect(11, 15, 1, 1);
  x.fillStyle = '#1a0a2a'; x.fillRect(19, 15, 3, 3);
  x.fillStyle = '#fff'; x.fillRect(19, 15, 1, 1);
  return c;
}

============================================================================= */
function mkFloorWood(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 911 + 1);
  const g = x.createLinearGradient(0, 0, 0, TILE);
  g.addColorStop(0, '#a07a4a');
  g.addColorStop(1, '#7a5830');
  x.fillStyle = g; x.fillRect(0, 0, TILE, TILE);
  // pranchas horizontais
  for (let yy = 0; yy < TILE; yy += 8) {
    x.fillStyle = 'rgba(40,20,5,0.5)';
    x.fillRect(0, yy, TILE, 1);
    x.fillStyle = 'rgba(200,160,100,0.15)';
    x.fillRect(0, yy + 1, TILE, 1);
    // offsets verticais
    const off = (yy / 8) % 2 ? 5 : 17;
    x.fillStyle = 'rgba(40,20,5,0.5)';
    x.fillRect(off, yy, 1, 8);
  }
  // textura
  for (let i = 0; i < 200; i++) {
    const px = (r() * TILE) | 0, py = (r() * TILE) | 0;
    const v = r();
    x.fillStyle = v < .5 ? 'rgba(60,30,10,0.15)' : 'rgba(220,180,120,0.1)';
    x.fillRect(px, py, 1, 1);
  }
  return c;
}

function mkWallStone(seed) {
  const { c, x } = nc(TILE, TILE);
  const r = mulberry32(seed * 131 + 3);
  x.fillStyle = '#5a4a3a'; x.fillRect(0, 0, TILE, TILE);
  for (let i = 0; i < 150; i++) {
    const px = (r() * TILE) | 0, py = (r() * TILE) | 0;
    const v = r();
    x.fillStyle = v < .35 ? '#4a3a2a' : v < .7 ? '#6a5a4a' : '#3a2a1a';
    x.fillRect(px, py, 1, 1);
  }
  // tijolos grandes
  for (let yy = 0; yy < TILE; yy += 10) {
    x.fillStyle = 'rgba(20,10,5,0.6)'; x.fillRect(0, yy, TILE, 2);
    const off = (yy / 10) % 2 ? 0 : 8;
    for (let xx = off; xx < TILE; xx += 16) {
      x.fillStyle = 'rgba(20,10,5,0.6)'; x.fillRect(xx, yy, 2, 10);
    }
  }
  // brilho superior
  x.fillStyle = 'rgba(180,160,140,0.15)';
  for (let yy = 0; yy < TILE; yy += 10) x.fillRect(0, yy + 2, TILE, 1);
  return c;
}

/* =============================================================================
   JOYSTICK
============================================================================= */
class Joystick {
  constructor() {
    this.el = document.getElementById('stick');
    this.knob = document.getElementById('knob');
    this.active = false;
    this.dx = 0; this.dy = 0;
    this.max = 42;
    this.bind();
  }
  bind() {
    const s = e => { e.preventDefault(); this.active = true; this.move(e); };
    const m = e => { if (!this.active) return; e.preventDefault(); this.move(e); };
    const e_ = e => { e.preventDefault(); this.active = false; this.dx = 0; this.dy = 0;
      this.knob.style.transform = 'translate(-50%,-50%)'; };
    this.el.addEventListener('touchstart', s, { passive: false });
    this.el.addEventListener('touchmove', m, { passive: false });
    this.el.addEventListener('touchend', e_, { passive: false });
    this.el.addEventListener('touchcancel', e_, { passive: false });
    this.el.addEventListener('mousedown', s);
    window.addEventListener('mousemove', m);
    window.addEventListener('mouseup', e_);
  }
  move(e) {
    const r = this.el.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    let x = t.clientX - r.left - r.width / 2;
    let y = t.clientY - r.top - r.height / 2;
    const d = Math.hypot(x, y);
    if (d > this.max) { const a = Math.atan2(y, x); x = Math.cos(a) * this.max; y = Math.sin(a) * this.max; }
    this.dx = x / this.max;
    this.dy = y / this.max;
    this.knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  }
}

/* =============================================================================
   MUNDO (OVERWORLD)
============================================================================= */
const worldMap = [];
for (let y = 0; y < MAP_H; y++) { worldMap[y] = []; for (let x = 0; x < MAP_W; x++) worldMap[y][x] = { g:'grass', o:null, v:0, doorId:null }; }

let nextHouseId = 1;
const houses = []; // { id, x, y, doorTx, doorTy, enemyDefeated }

(function generateOverworld() {
  const r = mulberry32(SEED);

  // bordas
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const dE = Math.min(x, y, MAP_W-1-x, MAP_H-1-y);
    if (dE < 2) worldMap[y][x].g = 'water';
    else if (dE < 4) worldMap[y][x].g = 'sand';
    else if (dE < 6 && r() < .5) worldMap[y][x].g = 'grassD';
  }

  // lago
  const lakeX = Math.floor(MAP_W/2) + 6, lakeY = Math.floor(MAP_H/2), lakeR = 9;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const d = Math.hypot(x-lakeX, y-lakeY) + (r()-.5)*2.2;
    if (d < lakeR) worldMap[y][x].g = 'water';
    else if (d < lakeR+2.5) worldMap[y][x].g = 'sand';
  }

  // rio
  let rx = lakeX, ry = lakeY + lakeR + 2;
  while (ry < MAP_H - 4) {
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
      const nx = rx+dx, ny = ry+dy;
      if (nx > 0 && nx < MAP_W-1 && ny > 0 && ny < MAP_H-1) worldMap[ny][nx].g = 'water';
    }
    ry += 1;
    rx += (r()<.5?-1:1) * (r()<.35?1:0);
    rx = clamp(rx, 8, MAP_W-9);
  }

  // praia
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (worldMap[y][x].g !== 'grass' && worldMap[y][x].g !== 'grassD') continue;
    for (let dy=-2; dy<=2; dy++) for (let dx=-2; dx<=2; dx++) {
      const nx = x+dx, ny = y+dy;
      if (nx<0||nx>=MAP_W||ny<0||ny>=MAP_H) continue;
      if (worldMap[ny][nx].g === 'water' && r()<.7) worldMap[y][x].g = 'sand';
    }
  }

  // variação de grama
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (worldMap[y][x].g !== 'grass') continue;
    const v = r();
    if (v < .04) worldMap[y][x].g = 'flower';
    else if (v < .14) worldMap[y][x].g = 'grassD';
    worldMap[y][x].v = (r()*4)|0;
  }

  // estradas
  const pathY = Math.floor(MAP_H/3);
  for (let x = 8; x < MAP_W-8; x++) {
    if (worldMap[pathY][x].g !== 'water' && worldMap[pathY][x].g !== 'sand') { worldMap[pathY][x].g = 'stone'; worldMap[pathY][x].o = null; }
    if (worldMap[pathY+1][x].g !== 'water' && worldMap[pathY+1][x].g !== 'sand') { worldMap[pathY+1][x].g = 'stone'; worldMap[pathY+1][x].o = null; }
  }
  const pathX = Math.floor(MAP_W/4);
  for (let y = 8; y < MAP_H-8; y++) {
    if (worldMap[y][pathX].g !== 'water' && worldMap[y][pathX].g !== 'sand') { worldMap[y][pathX].g = 'stone'; worldMap[y][pathX].o = null; }
    if (worldMap[y][pathX+1].g !== 'water' && worldMap[y][pathX+1].g !== 'sand') { worldMap[y][pathX+1].g = 'stone'; worldMap[y][pathX+1].o = null; }
  }

  // casas
  const houseSpots = [
    [pathX-6, pathY-6], [pathX+6, pathY-6],
    [pathX-6, pathY+7], [pathX+7, pathY+7],
    [pathX-8, pathY+22], [pathX+12, pathY+20],
    [pathX+24, pathY-4], [pathX+30, pathY+16]
  ];
  for (const [hx, hy] of houseSpots) {
    if (hx < 4 || hx+3 > MAP_W-4 || hy < 4 || hy+3 > MAP_H-4) continue;
    // limpa área
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) {
      worldMap[hy+dy][hx+dx].g = 'grass';
      worldMap[hy+dy][hx+dx].o = 'house';
      worldMap[hy+dy][hx+dx].doorId = null;
    }
    // porta (base central da casa)
    const doorTx = hx + 1, doorTy = hy + 2;
    worldMap[doorTy][doorTx].o = 'door';
    worldMap[doorTy][doorTx].doorId = nextHouseId;
    houses.push({
      id: nextHouseId,
      x: hx, y: hy,
      doorTx, doorTy,
      enemyDefeated: false,
      interior: null
    });
    nextHouseId++;
  }

  // árvores
  for (let i = 0; i < 260; i++) {
    const tx = 6 + ((r()*(MAP_W-12))|0), ty = 6 + ((r()*(MAP_H-12))|0);
    const t = worldMap[ty][tx];
    if (t.g !== 'grass' && t.g !== 'grassD' && t.g !== 'flower') continue;
    if (t.o) continue;
    t.o = r() < .35 ? 'pine' : 'oak';
    if (r() < .35) {
      const nx = tx + (r()<.5?1:-1), ny = ty + (r()<.5?1:-1);
      if (nx > 2 && nx < MAP_W-3 && ny > 2 && ny < MAP_H-3) {
        const n = worldMap[ny][nx];
        if (!n.o && (n.g === 'grass' || n.g === 'grassD' || n.g === 'flower')) n.o = t.o;
      }
    }
  }
  // rochas e arbustos
  for (let i = 0; i < 60; i++) {
    const tx = 6 + ((r()*(MAP_W-12))|0), ty = 6 + ((r()*(MAP_H-12))|0);
    const t = worldMap[ty][tx];
    if (!t.o && (t.g==='grass'||t.g==='grassD'||t.g==='flower'||t.g==='sand')) t.o = 'rock';
  }
  for (let i = 0; i < 90; i++) {
    const tx = 6 + ((r()*(MAP_W-12))|0), ty = 6 + ((r()*(MAP_H-12))|0);
    const t = worldMap[ty][tx];
    if (!t.o && (t.g==='grass'||t.g==='grassD'||t.g==='flower')) t.o = 'bush';
  }
})();

/* =============================================================================
   INTERIORES
============================================================================= */
const INT_W = 14, INT_H = 10;

function buildInterior(house) {
  const map = [];
  for (let y = 0; y < INT_H; y++) {
    map[y] = [];
    for (let x = 0; x < INT_W; x++) {
      map[y][x] = { g: 'wood', o: null, v: (x+y)%4, doorId: null };
    }
  }
  // paredes
  for (let x = 0; x < INT_W; x++) { map[0][x].g = 'wall'; map[0][x].o = 'wall'; map[INT_H-1][x].g = 'wall'; map[INT_H-1][x].o = 'wall'; }
  for (let y = 0; y < INT_H; y++) { map[y][0].g = 'wall'; map[y][0].o = 'wall'; map[y][INT_W-1].g = 'wall'; map[y][INT_W-1].o = 'wall'; }
  // porta de saída (base da parede inferior)
  const doorTx = Math.floor(INT_W / 2);
  const doorTy = INT_H - 1;
  map[doorTy][doorTx].o = 'exitDoor';
  // móveis
  map[2][2].o = 'table'; map[2][INT_W-3].o = 'table';
  map[3][2].o = 'chest';
  // inimigo
  const enemy = {
    x: (INT_W - 3) * TILE,
    y: (INT_H - 4) * TILE,
    hp: 24, maxHp: 24, atk: 5, name: 'SLIME',
    alive: !house.enemyDefeated,
    contactCooldown: 0
  };
  return { map, enemy, doorTx, doorTy, houseId: house.id };
}

/* =============================================================================
   ESTADO GLOBAL
============================================================================= */
const STATE = { OVER: 0, INT: 1, BATTLE: 2, FADE: 3 };
let state = STATE.OVER;
let currentMap = worldMap;
let currentInterior = null;
let currentHouse = null;
let mapW = MAP_W, mapH = MAP_H;
let mapName = 'Overworld';

const player = {
  x: 200, y: 200, vx: 0, vy: 0,
  speed: 165, accel: 1000, friction: 12,
  dir: 0, animTime: 0, frame: 0, moving: false,
  hp: 30, maxHp: 30, atk: 6,
  invuln: 0
};

/* =============================================================================
   COLISÃO
============================================================================= */
function isSolidTx(tx, ty) {
  if (tx < 0 || tx >= mapW || ty < 0 || ty >= mapH) return true;
  const t = currentMap[ty][tx];
  if (t.g === 'water') return true;
  if (t.o === 'oak' || t.o === 'pine' || t.o === 'rock' || t.o === 'house' || t.o === 'wall' || t.o === 'table' || t.o === 'chest') return true;
  return false;
}

function checkDoorTile(fx, fy) {
  // colisão pequena no "pé" do jogador
  const bw = 16, bh = 4;
  const cx = Math.floor(fx / TILE);
  const cy = Math.floor((fy - 2) / TILE);
  if (cx < 0 || cx >= mapW || cy < 0 || cy >= mapH) return null;
  const t = currentMap[cy][cx];
  if (t.o === 'door' && t.doorId) return { kind: 'entrance', doorId: t.doorId };
  if (t.o === 'exitDoor') return { kind: 'exit' };
  return null;
}

function canMoveTo(fx, fy) {
  const bw = 14, bh = 8;
  const l = fx - bw/2, rr = fx + bw/2;
  const t = fy - bh, b = fy - 1;
  const x1 = Math.floor(l / TILE), x2 = Math.floor(rr / TILE);
  const y1 = Math.floor(t / TILE), y2 = Math.floor(b / TILE);
  for (let ty = y1; ty <= y2; ty++)
    for (let tx = x1; tx <= x2; tx++)
      if (isSolidTx(tx, ty)) return false;
  return true;
}

/* =============================================================================
   RENDER TERRAIN / OBJETOS
============================================================================= */
function drawGround(c0, c1, r0, r1) {
  for (let ty = r0; ty <= r1; ty++) {
    for (let tx = c0; tx <= c1; tx++) {
      if (tx < 0 || tx >= mapW || ty < 0 || ty >= mapH) continue;
      const t = currentMap[ty][tx];
      const v = t.v || 0;
      let tile;
      switch (t.g) {
        case 'grass': tile = T.grass[v]; break;
        case 'grassD': tile = T.grassD[v]; break;
        case 'flower': tile = T.flower[v]; break;
        case 'sand': tile = T.sand[v]; break;
        case 'water': tile = T.water[v]; break;
        case 'stone': tile = T.stone[v]; break;
        case 'wood': tile = T.wood[v]; break;
        case 'wall': tile = T.wall; break;
        default: tile = T.grass[0];
      }
      ctx.drawImage(tile, tx * TILE, ty * TILE);
    }
  }
}

function collectObjects(c0, c1, r0, r1) {
  const list = [];
  for (let ty = r0 - 1; ty <= r1 + 2; ty++) {
    for (let tx = c0 - 1; tx <= c1 + 2; tx++) {
      if (tx < 0 || tx >= mapW || ty < 0 || ty >= mapH) continue;
      const t = currentMap[ty][tx];
      const o = t.o;
      if (!o) continue;
      if (o === 'house' || o === 'wall') continue;

      let img, w, h, dx, dy;
      if (o === 'oak')       { img = T.oak; w = 48; h = 64; dx = -8; dy = -32; }
      else if (o === 'pine') { img = T.pine; w = 44; h = 76; dx = -6; dy = -44; }
      else if (o === 'rock') { img = T.rock; w = 32; h = 28; dx = 0; dy = -4; }
      else if (o === 'bush') { img = T.bush; w = 34; h = 26; dx = -1; dy = -4; }
      else if (o === 'table'){ img = T.table; w = 32; h = 32; dx = 0; dy = -16; }
      else if (o === 'chest'){ img = T.chest; w = 32; h = 32; dx = 0; dy = -16; }
      else if (o === 'door') { img = null; }
      else if (o === 'exitDoor') {
        // porta como arco escuro
        img = null;
      } else continue;

      if (!img) continue;
      const baseY = (ty + 1) * TILE;
      list.push({ img, x: tx * TILE + dx, y: baseY + dy - h + h, w, h, sortY: baseY });
    }
  }
  return list;
}

function drawDoors() {
  // Desenha portas de entrada/saída como arcos escuros no chão
  for (let ty = 0; ty < mapH; ty++) {
    for (let tx = 0; tx < mapW; tx++) {
      const o = currentMap[ty][tx].o;
      if (o === 'door' || o === 'exitDoor') {
        const px = tx * TILE, py = ty * TILE;
        // base escura
        ctx.fillStyle = 'rgba(20,10,5,0.85)';
        ctx.fillRect(px + 4, py + 6, TILE - 8, TILE - 6);
        ctx.fillStyle = 'rgba(60,35,15,0.9)';
        ctx.fillRect(px + 6, py + 8, TILE - 12, TILE - 8);
        // placa
        ctx.fillStyle = '#e0b040';
        ctx.fillRect(px + TILE/2 - 3, py + 14, 6, 4);
        ctx.fillStyle = '#3a2008';
        ctx.fillRect(px + TILE/2 - 1, py + 15, 2, 2);
      }
    }
  }
}

function drawHouses(c0, c1, r0, r1) {
  for (let ty = r0 - 3; ty <= r1 + 3; ty++) {
    for (let tx = c0 - 3; tx <= c1 + 3; tx++) {
      if (tx < 0 || tx >= mapW || ty < 0 || ty >= mapH) continue;
      if (currentMap[ty][tx].o !== 'house') continue;
      const isTopLeft =
        (tx === 0 || currentMap[ty][tx-1].o !== 'house') &&
        (ty === 0 || currentMap[ty-1][tx].o !== 'house');
      if (!isTopLeft) continue;
      const px = tx * TILE - 32;
      const py = ty * TILE - 40;
      ctx.drawImage(T.house, px, py);
    }
  }
}

/* =============================================================================
   CÂMERA
============================================================================= */
let camX = 0, camY = 0, camInit = false;

/* =============================================================================
   BATTLE
============================================================================= */
const battle = {
  active: false,
  enemy: null,
  playerDefending: false,
  busy: false,
  turn: 'player',
  log: ''
};

const $battle = document.getElementById('battle');
const $bLog = document.getElementById('bLog');
const $enemyHP = document.getElementById('enemyHP');
const $enemyName = document.getElementById('enemyName');
const $enemyCanvas = document.getElementById('enemyCanvas');
const $playerHPText = document.getElementById('playerHPText');

function drawEnemyToBattleCanvas() {
  const bctx = $enemyCanvas.getContext('2d');
  bctx.imageSmoothingEnabled = false;
  bctx.clearRect(0, 0, 128, 128);
  bctx.drawImage(T.enemy, 0, 0, 32, 32, 0, 0, 128, 128);
}

function openBattle(enemy) {
  battle.active = true;
  battle.enemy = { ...enemy };
  battle.enemy.hp = battle.enemy.maxHp;
  battle.playerDefending = false;
  battle.busy = false;
  battle.turn = 'player';
  battle.log = 'Um ' + enemy.name + ' selvagem apareceu!';
  $battle.classList.add('show');
  $enemyName.textContent = enemy.name;
  $enemyHP.style.width = '100%';
  $bLog.textContent = battle.log;
  drawEnemyToBattleCanvas();
  updateBattleUI();
  state = STATE.BATTLE;
}

function updateBattleUI() {
  $enemyHP.style.width = (100 * battle.enemy.hp / battle.enemy.maxHp) + '%';
  $playerHPText.textContent = player.hp + '/' + player.maxHp;
  document.querySelectorAll('.btn').forEach(b => b.classList.toggle('disabled', battle.busy));
}

function logBattle(msg) {
  battle.log = msg;
  $bLog.textContent = msg;
}

function enemyTurn() {
  if (battle.enemy.hp <= 0) return;
  battle.busy = true;
  updateBattleUI();
  setTimeout(() => {
    let dmg = battle.enemy.atk + Math.floor(Math.random() * 3);
    if (battle.playerDefending) dmg = Math.floor(dmg / 2);
    player.hp -= dmg;
    if (player.hp < 0) player.hp = 0;
    logBattle(battle.enemy.name + ' atacou! Dano: ' + dmg);
    updateBattleUI();
    if (player.hp <= 0) {
      setTimeout(() => {
        logBattle('Você foi derrotado...');
        setTimeout(() => {
          player.hp = player.maxHp;
          player.x = 200; player.y = 200;
          closeBattle();
          state = STATE.OVER;
          currentMap = worldMap;
          mapW = MAP_W; mapH = MAP_H;
          mapName = 'Overworld';
          currentInterior = null;
          camInit = false;
        }, 1200);
      }, 400);
      return;
    }
    setTimeout(() => {
      battle.busy = false;
      battle.playerDefending = false;
      battle.turn = 'player';
      updateBattleUI();
    }, 400);
  }, 600);
}

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (battle.busy || battle.turn !== 'player' || !battle.active) return;
    const act = btn.dataset.act;
    battle.busy = true;
    updateBattleUI();
    if (act === 'attack') {
      const dmg = player.atk + Math.floor(Math.random() * 4);
      battle.enemy.hp -= dmg;
      if (battle.enemy.hp < 0) battle.enemy.hp = 0;
      logBattle('Você atacou! Dano: ' + dmg);
      updateBattleUI();
      if (battle.enemy.hp <= 0) {
        setTimeout(() => {
          logBattle('Você venceu!');
          if (currentHouse) currentHouse.enemyDefeated = true;
          if (currentInterior) currentInterior.enemy.alive = false;
          setTimeout(closeBattle, 900);
        }, 400);
        return;
      }
      battle.turn = 'enemy';
      setTimeout(enemyTurn, 500);
    } else if (act === 'defend') {
      battle.playerDefending = true;
      logBattle('Você se defendeu.');
      battle.turn = 'enemy';
      setTimeout(enemyTurn, 500);
    } else if (act === 'heal') {
      const heal = 8 + Math.floor(Math.random() * 4);
      player.hp = Math.min(player.maxHp, player.hp + heal);
      logBattle('Você se curou! +' + heal + ' HP');
      updateBattleUI();
      battle.turn = 'enemy';
      setTimeout(enemyTurn, 500);
    } else if (act === 'flee') {
      if (Math.random() < .5) {
        logBattle('Você fugiu com sucesso!');
        setTimeout(closeBattle, 700);
      } else {
        logBattle('Não conseguiu fugir!');
        battle.turn = 'enemy';
        setTimeout(enemyTurn, 500);
      }
    }
  });
});

function closeBattle() {
  battle.active = false;
  $battle.classList.remove('show');
  state = currentInterior ? STATE.INT : STATE.OVER;
  // empurra o player para longe do inimigo para não re-trigger imediato
  if (currentInterior) {
    currentInterior.enemy.contactCooldown = 1.5;
  }
}

/* =============================================================================
   TRANSIÇÕES
============================================================================= */
const $fade = document.getElementById('fade');
function fadeTransition(cb) {
  state = STATE.FADE;
  $fade.style.opacity = '1';
  setTimeout(() => {
    cb();
    $fade.style.opacity = '0';
    setTimeout(() => { state = (battle.active ? STATE.BATTLE : (currentInterior ? STATE.INT : STATE.OVER)); }, 350);
  }, 350);
}

function enterHouse(doorId) {
  const house = houses.find(h => h.id === doorId);
  if (!house) return;
  fadeTransition(() => {
    if (!house.interior) house.interior = buildInterior(house);
    // se inimigo já foi derrotado, remove
    if (house.enemyDefeated) house.interior.enemy.alive = false;
    currentInterior = house.interior;
    currentHouse = house;
    currentMap = house.interior.map;
    mapW = INT_W; mapH = INT_H;
    mapName = 'Interior';
    // posiciona player acima da porta de saída
    player.x = house.interior.doorTx * TILE + TILE/2;
    player.y = (house.interior.doorTy - 1) * TILE + TILE/2;
    player.vx = 0; player.vy = 0;
    camInit = false;
  });
}

function exitHouse() {
  fadeTransition(() => {
    const house = currentHouse;
    currentMap = worldMap;
    mapW = MAP_W; mapH = MAP_H;
    mapName = 'Overworld';
    currentInterior = null;
    // posiciona player abaixo da porta da casa
    player.x = house.doorTx * TILE + TILE/2;
    player.y = (house.doorTy + 1) * TILE + TILE/2;
    player.vx = 0; player.vy = 0;
    camInit = false;
  });
}

/* =============================================================================
   INPUT
============================================================================= */
const joy = new Joystick();

/* =============================================================================
   MAIN LOOP
============================================================================= */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

let last = performance.now();
let fpsAcc = 0, fpsCnt = 0, fpsT = 0;

function updatePlayer(dt) {
  if (state !== STATE.OVER && state !== STATE.INT) return;
  const mag = Math.hypot(joy.dx, joy.dy);
  if (mag > .15) {
    const nx = joy.dx / mag, ny = joy.dy / mag;
    player.vx += nx * player.accel * dt;
    player.vy += ny * player.accel * dt;
    if (Math.abs(joy.dx) > Math.abs(joy.dy)) player.dir = joy.dx > 0 ? 2 : 1;
    else player.dir = joy.dy > 0 ? 0 : 3;
    player.moving = true;
  } else {
    player.vx -= player.vx * player.friction * dt;
    player.vy -= player.vy * player.friction * dt;
    player.moving = false;
  }
  const v = Math.hypot(player.vx, player.vy);
  if (v > player.speed) { player.vx = player.vx/v*player.speed; player.vy = player.vy/v*player.speed; }

  const nx = player.x + player.vx * dt;
  const ny = player.y + player.vy * dt;
  if (canMoveTo(nx, player.y)) player.x = nx; else player.vx = 0;
  if (canMoveTo(player.x, ny)) player.y = ny; else player.vy = 0;

  if (player.moving && v > 20) {
    player.animTime += dt;
    player.frame = Math.floor(player.animTime * 8) % 4;
  } else { player.frame = 0; player.animTime = 0; }

  if (player.invuln > 0) player.invuln -= dt;
}

function checkTriggers(dt) {
  if (state !== STATE.OVER && state !== STATE.INT) return;

  // porta
  const door = checkDoorTile(player.x, player.y);
  if (door && !player._doorCooldown) {
    if (door.kind === 'entrance') {
      enterHouse(door.doorId);
    } else if (door.kind === 'exit') {
      exitHouse();
    }
    player._doorCooldown = 1;
  }
  if (player._doorCooldown > 0) player._doorCooldown -= dt;

  // inimigo no interior
  if (state === STATE.INT && currentInterior && currentInterior.enemy.alive) {
    const e = currentInterior.enemy;
    if (e.contactCooldown > 0) e.contactCooldown -= dt;
    else {
      const dx = player.x - (e.x + TILE/2);
      const dy = player.y - (e.y + TILE/2);
      const d = Math.hypot(dx, dy);
      if (d < 28) {
        openBattle(e);
      }
    }
  }
}

function drawEnemyInWorld() {
  if (!currentInterior || !currentInterior.enemy.alive) return;
  const e = currentInterior.enemy;
  ctx.drawImage(T.enemy, e.x, e.y - TILE, TILE, TILE);
}

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .08) dt = .08;

  updatePlayer(dt);
  checkTriggers(dt);

  // câmera com sub-pixel (sem arredondar)
  if (state !== STATE.BATTLE) {
    const targetX = player.x - canvas.width / 2;
    const targetY = player.y - canvas.height / 2 - 16;
    if (!camInit) { camX = targetX; camY = targetY; camInit = true; }
    camX += (targetX - camX) * Math.min(1, dt * 8);
    camY += (targetY - camY) * Math.min(1, dt * 8);
  }

  const c0 = Math.floor(camX / TILE) - 1;
  const c1 = Math.floor((camX + canvas.width) / TILE) + 1;
  const r0 = Math.floor(camY / TILE) - 1;
  const r1 = Math.floor((camY + canvas.height) / TILE) + 1;

  ctx.fillStyle = '#0a0e0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // translação sub-pixel: movimento suave da câmera
  ctx.translate(-camX, -camY);

  drawGround(c0, c1, r0, r1);
  if (state === STATE.OVER) {
    drawHouses(c0, c1, r0, r1);
    drawDoors();
  }

  const objs = collectObjects(c0, c1, r0, r1);
  objs.push({ sortY: player.y, isPlayer: true });
  if (state === STATE.INT && currentInterior && currentInterior.enemy.alive) {
    const e = currentInterior.enemy;
    objs.push({ sortY: e.y + TILE, isEnemy: true, e });
  }
  objs.sort((a, b) => a.sortY - b.sortY);

  for (const o of objs) {
    if (o.isPlayer) {
      const sx = player.frame * FRAME_W;
      const sy = player.dir * FRAME_H;
      ctx.drawImage(CHAR_SHEET, sx, sy, FRAME_W, FRAME_H,
        player.x - 16, player.y - 30, FRAME_W, FRAME_H);
    } else if (o.isEnemy) {
      ctx.drawImage(T.enemy, o.e.x, o.e.y - TILE, TILE, TILE);
    } else {
      ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
    }
  }

  ctx.restore();
