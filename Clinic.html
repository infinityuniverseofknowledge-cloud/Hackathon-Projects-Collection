<script>
/* ══════════════ Pharmacokinetics ══════════════ */
R.pharmPK=function(dt){
  clear();
  headline('Pharmacokinetics','concentration-time profiles');
  if(!S.sim.pk){S.sim.pk={dose:500,vd:50,ke:0.15}}
  var p=S.sim.pk;
  /* Generate concentration profile */
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'time (h)','concentration (mg/L)');
  var tEnd=48;
  var points=[];
  for(var t=0;t<=tEnd;t+=0.2){
    points.push({t:t,c:pkOneCompartment(p.dose,p.vd,p.ke,t)});
  }
  var maxC=max(points.map(function(x){return x.c}));
  S.ctx.strokeStyle='#00d97d';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  points.forEach(function(pt,i){
    var x=padL+(pt.t/tEnd)*plotW;
    var y=padT+plotH-(pt.c/maxC)*plotH;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  });
  S.ctx.stroke();
  /* Labels */
  var hl=halfLife(p.ke);
  S.ctx.fillStyle='#5ceecc';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Cmax (t=0): '+fmt(p.dose/p.vd,3)+' mg/L',padL,padT+20);
  S.ctx.fillText('Half-life: '+fmt(hl,2)+' h',padL,padT+45);
  S.ctx.fillText('Time to steady state (~5 half-lives): '+fmt(5*hl,1)+' h',padL,padT+70);
  S.ctx.fillText('Clearance: '+fmt(p.vd*p.ke,2)+' L/h',padL,padT+95);
  /* Mark half-lives */
  for(var i=1;i<=5;i++){
    var tHl=hl*i;
    if(tHl>tEnd)break;
    var x=padL+(tHl/tEnd)*plotW;
    S.ctx.strokeStyle='rgba(255,45,85,.4)';
    S.ctx.setLineDash([4,4]);
    S.ctx.beginPath();S.ctx.moveTo(x,padT);S.ctx.lineTo(x,padT+plotH);S.ctx.stroke();
    S.ctx.setLineDash([]);
    S.ctx.fillStyle='#ff7088';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(i+'×t½',x,padT+plotH+15);
  }
};

/* ══════════════ Pharmacodynamics ══════════════ */
R.pharmPD=function(dt){
  clear();
  headline('Pharmacodynamics','dose-response relationship');
  if(!S.sim.pd){S.sim.pd={emax:100,ec50:5,hill:1}}
  var p=S.sim.pd;
  var padL=80,padT=140,padR=40,padB=100;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'log concentration','effect (% Emax)');
  /* Sigmoid Emax */
  S.ctx.strokeStyle='#00d97d';
  S.ctx.lineWidth=2.5;
  S.ctx.beginPath();
  for(var i=0;i<=100;i++){
    var c=Math.pow(10,-2+i*4/100);
    var e=hillEquation(p.emax,p.ec50,p.hill,c);
    var x=padL+(i/100)*plotW;
    var y=padT+plotH-e/p.emax*plotH;
    if(i===0)S.ctx.moveTo(x,y);
    else S.ctx.lineTo(x,y);
  }
  S.ctx.stroke();
  /* EC50 marker */
  var xEC=padL+(Math.log10(p.ec50)+2)/4*plotW;
  S.ctx.strokeStyle='rgba(255,45,85,.5)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();S.ctx.moveTo(xEC,padT);S.ctx.lineTo(xEC,padT+plotH);S.ctx.stroke();
  S.ctx.setLineDash([]);
  S.ctx.fillStyle='#ff7088';
  S.ctx.font='10px "JetBrains Mono",monospace';

/* ══════════════ Punnett Square ══════════════ */
R.punnett=function(dt){
  clear();
  headline('Punnett Square','Mendelian inheritance');
  if(!S.sim.pun){S.sim.pun={mother:'Aa',father:'Aa'}}
  var p=S.sim.pun;
  var mother=[p.mother[0],p.mother[1]];
  var father=[p.father[0],p.father[1]];
  var result=punnettSquare(mother,father);
  var padL=200,padT=200;
  var cellSize=100;
  /* Headers */
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 16px "Orbitron",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('Mother: '+p.mother,padL+cellSize,padT-60);
  S.ctx.fillText('Father: '+p.father,padL-60,padT+cellSize+20);
  /* Father alleles on rows */
  for(var i=0;i<2;i++){
    var x=padL-60;
    var y=padT+i*cellSize+cellSize/2;
    S.ctx.fillStyle='#a855f7';
    S.ctx.font='700 24px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(father[i],x,y);
  }
  /* Mother alleles on cols */
  for(var j=0;j<2;j++){
    var x=padL+j*cellSize+cellSize/2;
    var y=padT-20;
    S.ctx.fillStyle='#ff2d55';
    S.ctx.font='700 24px "Orbitron",monospace';
    S.ctx.fillText(mother[j],x,y);
  }
  /* Cells */
  for(var i=0;i<2;i++)for(var j=0;j<2;j++){
    var x=padL+j*cellSize;
    var y=padT+i*cellSize;
    var geno=result.offspring[i*2+j];
    var isHomo=geno[0]===geno[1];
    var isDom=geno[0]===p.mother[0].toUpperCase()&&geno[1]===geno[0];
    S.ctx.fillStyle=geno.indexOf('A')>=0?'rgba(0,217,125,.15)':'rgba(255,45,85,.15)';
    S.ctx.fillRect(x+2,y+2,cellSize-4,cellSize-4);
    S.ctx.strokeStyle='#00aaff';
    S.ctx.lineWidth=1;
    S.ctx.strokeRect(x+2.5,y+2.5,cellSize-5,cellSize-5);
    S.ctx.fillStyle='#c8d8e0';
    S.ctx.font='700 36px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.textBaseline='middle';
    S.ctx.fillText(geno,x+cellSize/2,y+cellSize/2);
    S.ctx.textBaseline='alphabetic';
  }
  /* Counts */
  var y=padT+2*cellSize+80;
  S.ctx.fillStyle='#c8d8e0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Genotype counts:',padL-140,y);
  var counts=result.counts;
  var idx=0;
  for(var g in counts){
    S.ctx.fillStyle='#00d97d';
    S.ctx.font='700 14px "JetBrains Mono",monospace';
    S.ctx.fillText(g+': '+counts[g]+'/4 ('+pct(counts[g]/4,0)+')',padL-140,y+30+idx*22);
    idx++;
  }
  /* Phenotype */
  var dominant=0;
  for(var g in counts)if(g.indexOf(p.mother[0].toUpperCase())>=0)dominant+=counts[g];
  S.ctx.fillStyle='#5cc5ff';
  S.ctx.font='700 14px "JetBrains Mono",monospace';
  S.ctx.fillText('Dominant phenotype: '+pct(dominant/4,0),padL-140,y+30+idx*22+10);
  S.ctx.fillText('Recessive phenotype: '+pct((4-dominant)/4,0),padL-140,y+30+idx*22+35);
};

/* ══════════════ Hardy-Weinberg ══════════════ */
R.hardy=function(dt){
  clear();
  headline('Hardy-Weinberg Equilibrium','allele frequencies');
  if(!S.sim.hw){S.sim.hw={p:0.7}}
  var p=S.sim.hw.p;
  var hw=hardyWeinberg(p);
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'allele frequency p','genotype frequency');
  /* Curves */
  var colors={AA:'#00d97d',Aa:'#ffb800',aa:'#ff2d55'};
  ['AA','Aa','aa'].forEach(function(g){
    S.ctx.strokeStyle=colors[g];
    S.ctx.lineWidth=2.5;
    S.ctx.beginPath();
    for(var i=0;i<=100;i++){
      var pp=i/100;

      var y=padT+plotH-hw2[g]*plotH;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
  });
  /* Current marker */
  var xc=padL+p*plotW;
  S.ctx.strokeStyle='rgba(255,255,255,.4)';
  S.ctx.setLineDash([5,5]);
  S.ctx.beginPath();S.ctx.moveTo(xc,padT);S.ctx.lineTo(xc,padT+plotH);S.ctx.stroke();

  S.ctx.fillStyle='#00d97d';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('■ p² (AA) = '+fmt(hw.AA,4),padL+10,padT+20);
  S.ctx.fillStyle='#ffb800';
  S.ctx.fillText('■ 2pq (Aa) = '+fmt(hw.Aa,4),padL+10,padT+40);
  S.ctx.fillStyle='#ff2d55';
  S.ctx.fillText('■ q² (aa) = '+fmt(hw.aa,4),padL+10,padT+60);
  S.ctx.fillStyle='#8898a8';
  S.ctx.fillText('p = '+p+'  ·  q = '+fmt(1-p,3),padL+10,padT+90);
};

/* ══════════════ Pedigree ══════════════ */
R.pedigree=function(dt){
  clear();
  headline('Pedigree Analysis','inheritance patterns');
  var padL=80,padT=160;
  /* Draw three generations */
  var gens=[
    {y:padT,persons:[{x:200,sex:'M',affected:true},{x:400,sex:'F',affected:false}]},
    {y:padT+120,persons:[{x:150,sex:'M',affected:false},{x:250,sex:'F',affected:true},{x:350,sex:'M',affected:true},{x:450,sex:'F',affected:false}]},
    {y:padT+240,persons:[{x:200,sex:'M',affected:true},{x:300,sex:'F',affected:false},{x:400,sex:'M',affected:false}]}
  ];
  /* Connecting lines */
  S.ctx.strokeStyle='#5cc5ff';
  S.ctx.lineWidth=1.5;
  gens.forEach(function(g,i){
    if(g.persons.length>1){
      S.ctx.beginPath();
      S.ctx.moveTo(g.persons[0].x+20,g.y);
      S.ctx.lineTo(g.persons[1].x-20,g.y);
      S.ctx.stroke();
    }
    if(i<gens.length-1){
      gens[i+1].persons.forEach(function(p){
        S.ctx.beginPath();
        S.ctx.moveTo((g.persons[0].x+g.persons[1].x)/2,g.y+20);
        S.ctx.lineTo(p.x,g.y+120-20);
        S.ctx.stroke();
      });
    }
  });
  /* Persons */
  gens.forEach(function(g){
    g.persons.forEach(function(p){
      S.ctx.fillStyle=p.affected?'#ff2d55':'#8898a8';
      S.ctx.fillRect(p.x-20,p.y-20,40,40);
      S.ctx.fillStyle='#06090d';
      S.ctx.font='700 14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.textBaseline='middle';
      S.ctx.fillText(p.sex==='M'?'♂':'♀',p.x,p.y);
      S.ctx.textBaseline='alphabetic';
    });
  });
  /* Legend */
  S.ctx.fillStyle='#8898a8';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Interpretation',80,padT+330);
  var pats=[
    'Autosomal dominant: every generation, males=females, no skipping',
    'Autosomal recessive: skips generations, consanguinity risk',
    'X-linked recessive: males > females, no male-to-male',
    'X-linked dominant: affected father → all daughters',
    'Mitochondrial: maternal inheritance'
  ];
  pats.forEach(function(p,i){
    S.ctx.fillStyle='#5cc5ff';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.fillText('▸ '+p,80,padT+355+i*18);
  });
};

/* ══════════════ LOD Score ══════════════ */
R.lod=function(dt){
  clear();
  headline('LOD Score','genetic linkage analysis');
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB;
  axes(padL,padT,plotW,plotH,'recombination fraction θ','LOD score');
  /* LOD curves for various pedigree types */
  var pedigrees=[
    {name:'Large pedigree (phase known)',lods:function(th){return 10*Math.log10((1-th)/0.5)},color:'#00d97d'},
    {name:'Small pedigree n=10',lods:function(th){return 3*Math.log10((1-th)/0.5)},color:'#5cc5ff'},
    {name:'Single sib pair',lods:function(th){return 1.5*Math.log10((1-th)/0.5)},color:'#ffb800'}
  ];
  pedigrees.forEach(function(pe){
    S.ctx.strokeStyle=pe.color;
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    for(var i=0;i<=45;i++){
      var th=i/100;
      var lod=pe.lods(th);
      var x=padL+(i/45)*plotW;
      var y=padT+plotH/2-lod/15*plotH/2;
      if(i===0)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    S.ctx.fillStyle=pe.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('■ '+pe.name,padL+10+pedigrees.indexOf(pe)*220,padT+20);
  });
  /* Thresholds */
  S.ctx.strokeStyle='rgba(255,45,85,.4)';
  S.ctx.setLineDash([5,5]);
  [3,1.5].forEach(function(t){
    var y=padT+plotH/2-t/15*plotH/2;
    S.ctx.beginPath();S.ctx.moveTo(padL,y);S.ctx.lineTo(padL+plotW,y);S.ctx.stroke();
    S.ctx.fillStyle='#ff7088';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('LOD='+t,padL+5,y-3);
  });
  S.ctx.setLineDash([]);
  S.ctx.strokeStyle='rgba(136,152,168,.4)';
  S.ctx.beginPath();S.ctx.moveTo(padL,padT+plotH/2);S.ctx.lineTo(padL+plotW,padT+plotH/2);S.ctx.stroke();
};

R.sir=function(dt){

  if(!S.sim.sir){S.sim.sir={beta:0.5,gamma:0.2,pop:1000000,initial:10,days:180}}
  var p=S.sim.sir;
  var result=sirModel(p.beta,p.gamma,p.pop,p.initial,p.days);

R.r0=function(dt){

    {name:'From serial interval',formula:'R₀ = (1 + r·T_serial) from exponential growth',example:'r=0.3/day, T_s=5d: R₀ ≈ 2.5'},
    {name:'From final attack rate',formula:'R₀ = ln(S₀/S∞) / (S₀−S∞) from SIR',example:'AR=60%: R₀ ≈ 1.9'},
    {name:'Next-generation matrix',formula:'R₀ = ρ(K) largest eigenvalue of K',example:'Multi-group models'},
    {name:'Branching process',formula:'R₀ = 1 + (E[R₀] excess) / p_branching',example:'Contact tracing data'},
    {name:'From CFR + IFR',formula:'R₀ relates to attack rate and IFR',example:'Epidemiological inference'}
  ];
  var y=140;

R.tests=function(dt){

  var m=testMetrics(p.tp,p.fp,p.tn,p.fn);
  var padL=60,padT=140;

  var table=[
    ['','Disease+','Disease−'],
    ['Test+','TP = '+p.tp,'FP = '+p.fp],
    ['Test−','FN = '+p.fn,'TN = '+p.tn]
  ];
  var cellW=180,cellH=60;
  table.forEach(function(row,i){
    row.forEach(function(cell,j){
      var x=padL+j*cellW;
      var y=padT+i*cellH;

      S.ctx.textAlign='center';
      S.ctx.textBaseline='middle';
      S.ctx.fillText(cell,x+cellW/2-1,y+cellH/2);
      S.ctx.textBaseline='alphabetic';
    });
  });
  /* Metrics */
  var mx=padL+cellW*3+40;
  var metrics=[
    {k:'Sensitivity (TPR)',v:pct(m.sensitivity,1),c:'#00d97d'},
    {k:'Specificity (TNR)',v:pct(m.specificity,1),c:'#00d97d'},
    {k:'PPV',v:pct(m.ppv,1),c:'#5cc5ff'},
    {k:'NPV',v:pct(m.npv,1),c:'#5cc5ff'},

    {k:'LR−',v:fmt(m.lrNeg,3),c:'#ffb800'},
    {k:'Accuracy',v:pct(m.accuracy,1),c:'#00d97d'},
    {k:'Prevalence',v:pct(m.prevalence,1),c:'#ff7088'}
  ];

    var cy=padT+i*30;
    S.ctx.fillStyle='#8898a8';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(metric.k,mx,cy+15);
    S.ctx.fillStyle=metric.c;
    S.ctx.font='700 14px "Orbitron",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(metric.v,mx+300,cy+15);
  });
};

/* ══════════════ Info panel ══════════════ */
function prop(k,v,cls){return '<div class="prop"><span class="k">'+esc(k)+'</span><span class="v '+(cls||'')+'">'+esc(v)+'</span></div>'}
function renderInfo(){
  var body=$('infoBody');
  var id=S.module;
  var html='';
  if(id==='dashboard'){
    html+='<div class="sec-head">System</div>';
    html+=prop('Modules',MODULES.length,'bl');
    html+=prop('Drugs in DB',DRUG_DB.length,'rd');
    html+=prop('Organisms',ORGANISMS.length,'cy');
    html+=prop('Lab values',LAB_VALUES.length,'am');
    html+='<div class="sec-head">Capabilities</div>';
    html+='<div class="hint">Real clinical algorithms:<br>• EKG synthesis (P/QRS/T gaussian)<br>• SOFA, qSOFA, APACHE II, GCS<br>• CHA₂DS₂-VASc, Wells, CURB-65<br>• Cockcroft-Gault, MDRD, CKD-EPI<br>• PK 1/2-compartment, Emax, Hill<br>• Acid-base interpretation (Winter)<br>• SIR/SEIR epidemic models<br>• Punnett, Hardy-Weinberg, LOD<br>• Diagnostic test metrics<br>• Insulin, warfarin, renal dosing</div>';
  }
  else if(id==='ecg12'||id==='ecgInterp'||id==='arrhythmia'||id==='axis'||id==='qtc'){
    html+='<div class="sec-head">Disclaimer</div>';
    html+='<div class="hint"><span class="crit">EDUCATIONAL ONLY.</span> Not a medical device. Do not use for clinical decision-making. Real diagnostics require certified hardware and clinical expertise.</div>';
  }
  else if(id==='sepsis'||id==='sofa'||id==='qsofa'||id==='apache'){
    html+='<div class="sec-head">Sepsis-3</div>';
    html+=prop('SOFA ≥ 2','Sepsis','rd');
    html+=prop('Lactate > 2','Shock risk','am');
    html+=prop('MAP < 65','Vasopressors','rd');
    html+='<div class="hint">Sepsis-3 (2016) replaced SIRS criteria. Real-time early warning saves lives: 7.6% mortality increase per hour of delayed antibiotics.</div>';
  }
  else if(id==='pharmPK'||id==='pharmPD'||id==='doseCalc'||id==='renalDose'){
    html+='<div class="sec-head">Pharmacology</div>';
    html+=prop('Drug DB',DRUG_DB.length+' drugs','rd');
    html+=prop('CYP pathways',CYP_INTERACTIONS.length,'am');
    html+='<div class="hint">Population PK/PD uses nonlinear mixed-effects (NLME). Tools: NONMEM ($50k+), Monolix, nlmixr2 (free).</div>';
  }

    html+='<div class="sec-head">Drug interactions</div>';
    html+=prop('CYP families',CYP_INTERACTIONS.length,'am');
    html+=prop('QT drugs',QT_DRUGS.length,'rd');
    html+='<div class="hint">CYP3A4 metabolizes ~50% of drugs. Inhibitors increase levels; inducers decrease. Grapefruit inhibits CYP3A4.</div>';
  }
  else if(id==='sir'||id==='seir'||id==='herd'||id==='r0'){
    html+='<div class="sec-head">Epidemiology</div>';
    html+=prop('R₀ > 1','Epidemic grows','rd');
    html+=prop('R₀ < 1','Epidemic dies out','gr');
    html+='<div class="hint">R₀ = β/γ. Measles R₀ ≈ 12-18, requires 92-95% herd immunity. Influenza R₀ ≈ 1.5-2, requires 33-50%.</div>';
  }

/* ══════════════ Interactions ══════════════ */
function bindInteractions(){
  S.cv.addEventListener('click',function(e){
    var r=S.cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    if(S.module==='arrhythmia'&&S.sim.arrBtns){
      S.sim.arrBtns.forEach(function(b){
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          S.sim.arr.rhythm=b.k;
          toast('Rhythm: '+b.k,'rd');
        }
      });
    }
  });
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#06090d';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff2d55';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'loading clinical guidelines…',pct:10},
    {msg:'initializing EKG synthesis…',pct:22},
    {msg:'loading drug database…',pct:34},
    {msg:'calibrating PK/PD models…',pct:48},
    {msg:'connecting to EHR…',pct:62},
    {msg:'verifying sepsis criteria…',pct:78},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,150);
  }
  setTimeout(next,150);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  boot();
  requestAnimationFrame(loop);
  console.log('%c CLINIC ','background:linear-gradient(90deg,#00aaff,#00ddcc,#ff2d55);color:#06090d;padding:10px 22px;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('Clinical Medicine & Diagnostics Workbench · '+MODULES.length+' modules');
  console.log('Real algorithms: EKG synthesis · SOFA · PK/PD · SIR · SIRS · Sepsis-3');
  console.log('⚠ EDUCATIONAL USE ONLY — not a medical device');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
