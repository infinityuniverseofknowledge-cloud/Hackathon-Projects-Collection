registerModule('waves',{
  title:'Wave Equation 2D',
  icon:'〰️',
  desc:'Finite-difference solution of the 2D wave equation ∂²u/∂t² = c²∇²u. Watch ripples propagate, reflect and interfere.',
  init:function(){
    initWaves();
  },
  tick:function(dt){
    var w=STATE.waves;
    var u=w.u,uPrev=w.uPrev,uNext=w.uNext;
    var Nx=w.Nx,Ny=w.Ny;
    var c=w.c;
    var c2=c*c;
    var damp=w.damping;
    for(var y=1;y<Ny-1;y++){
      for(var x=1;x<Nx-1;x++){
        var i=y*Nx+x;
        var lap=u[(y-1)*Nx+x]+u[(y+1)*Nx+x]+u[y*Nx+(x-1)]+u[y*Nx+(x+1)]-4*u[i];
        uNext[i]=2*u[i]-uPrev[i]+c2*lap-damp*(u[i]-uPrev[i]);
      }
    }
    /* Swap */
    var tmp=w.uPrev;
    w.uPrev=w.u;
    w.u=w.uNext;
    w.uNext=tmp;
    /* Continuous source */
    if(w.source==='continuous'){
      var cx=w.exciteX,cy=w.exciteY;
      var t=STATE.time;
      var val=Math.sin(t*8)*1.5;
      for(var dy=-2;dy<=2;dy++){
        for(var dx=-2;dx<=2;dx++){
          var xx=cx+dx,yy=cy+dy;
          if(xx>0&&xx<Nx-1&&yy>0&&yy<Ny-1){
            w.u[yy*Nx+xx]+=val*0.3;
          }
        }
      }
    }
    STATE.time+=dt;
    STATE.steps++;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    var w=STATE.waves;
    var Nx=w.Nx,Ny=w.Ny;
    var cellW=W/Nx;
    var cellH=H/Ny;
    /* Fast image render */
    if(!w.imgData||w.imgData.width!==Nx||w.imgData.height!==Ny){
      w.imgCanvas=document.createElement('canvas');
      w.imgCanvas.width=Nx;w.imgCanvas.height=Ny;
      w.imgCtx=w.imgCanvas.getContext('2d');
      w.imgData=w.imgCtx.createImageData(Nx,Ny);
    }
    var data=w.imgData.data;
    var u=w.u;
    for(var y=0;y<Ny;y++){
      for(var x=0;x<Nx;x++){
        var i=y*Nx+x;
        var v=u[i];
        /* Color mapping: blue for negative, red for positive */
        var idx=i*4;
        if(v>0){
          data[idx]=Math.min(255,Math.floor(v*200));
          data[idx+1]=Math.min(255,Math.floor(v*100));
          data[idx+2]=Math.min(255,Math.floor(v*50));
        } else {
          data[idx]=Math.min(255,Math.floor(-v*50));
          data[idx+1]=Math.min(255,Math.floor(-v*100));
          data[idx+2]=Math.min(255,Math.floor(-v*200));
        }
        data[idx+3]=255;
      }
    }
    w.imgCtx.putImageData(w.imgData,0,0);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(w.imgCanvas,0,0,W,H);
    /* Source highlight */
    if(w.source==='continuous'){
      ctx.strokeStyle='#ffe040';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(w.exciteX*cellW,w.exciteY*cellH,10,0,Math.PI*2);
      ctx.stroke();
    }
    setStatsHTML(
      '<div>Grid: '+Nx+'×'+Ny+'</div>'+
      '<div>Wave speed c: '+w.c.toFixed(2)+'</div>'+
      '<div>Damping: '+w.damping.toFixed(3)+'</div>'+
      '<div>Source: '+w.source+'</div>'
    );
    updateBadge('〰️ Wave Equation · '+w.source);
    $('sbMode').textContent='Waves';
    $('sbBodies').textContent=Nx*Ny;
  },
  onDown:function(p){
    var w=STATE.waves;
    var x=Math.floor(p.x/CANV.W*w.Nx);
    var y=Math.floor(p.y/CANV.H*w.Ny);
    /* Pulse */
    for(var dy=-6;dy<=6;dy++){
      for(var dx=-6;dx<=6;dx++){
        var xx=x+dx,yy=y+dy;
        if(xx>0&&xx<w.Nx-1&&yy>0&&yy<w.Ny-1){
          var r=Math.hypot(dx,dy);
          if(r<6){
            w.u[yy*w.Nx+xx]+=Math.cos(r/6*Math.PI/2)*2;
          }
        }
      }
    }
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  controls:function(){
    var w=STATE.waves;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="initWaves()">↺ Reset</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.waves.onDown({x:CANV.W/2,y:CANV.H/2})">⚡ Center pulse</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="wavesRipple()">💧 Ripple pattern</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="wavesPlaneWave()">🌊 Plane wave</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Wave speed c</span><span>'+w.c.toFixed(2)+'</span></div>';
    html+='<input type="range" min="0.1" max="0.7" step="0.02" value="'+w.c+'" oninput="STATE.waves.c=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Damping</span><span>'+w.damping.toFixed(4)+'</span></div>';
    html+='<input type="range" min="0" max="0.02" step="0.0005" value="'+w.damping+'" oninput="STATE.waves.damping=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Source</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(w.source==='pulse'?'active':'')+'" onclick="STATE.waves.source=\'pulse\';renderLeftPanel()">Pulse (click)</div>';
    html+='<div class="chip '+(w.source==='continuous'?'active':'')+'" onclick="STATE.waves.source=\'continuous\';renderLeftPanel()">Continuous</div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Grid</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Resolution X</span><span>'+w.Nx+'</span></div>';
    html+='<input type="range" min="60" max="300" step="20" value="'+w.Nx+'" oninput="STATE.waves.Nx=parseInt(this.value);initWaves();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click or drag on canvas to create ripples.</div>';
    return html;
  },
  mathPanel:function(){
    var w=STATE.waves;
    return '<div class="sec"><h4>2D Wave Equation</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '∂²u/∂t² = c²·(∂²u/∂x² + ∂²u/∂y²)<br><br>'+
      'Discretized with central differences:<br>'+
      'u(i,j,n+1) = 2u(i,j,n) − u(i,j,n−1)<br>'+
      '&nbsp;&nbsp;+ c²·(u(i±1,j,n) + u(i,j±1,n) − 4u(i,j,n))<br><br>'+
      'Stability: c·Δt/Δx ≤ 1/√2 (CFL condition)'+
      '</div></div>'+
      '<div class="sec"><h4>Interference</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'When two wavefronts cross:<br>'+
      '• Constructive: peaks add → higher amplitude<br>'+
      '• Destructive: peak + trough cancel<br><br>'+
      'This linear superposition is why Fourier analysis works.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Grid</span><span class="v">'+w.Nx+'×'+w.Ny+'</span></div>'+
      '<div class="row"><span class="k">c</span><span class="v">'+w.c.toFixed(3)+'</span></div>'+
      '<div class="row"><span class="k">Damping</span><span class="v">'+w.damping.toFixed(4)+'</span></div>'+
      '</div></div>';
  }
});
function initWaves(){
  var w=STATE.waves;
  var W=CANV.W,H=CANV.H;
  w.Ny=Math.max(30,Math.floor(w.Nx*H/W));
  var N=w.Nx*w.Ny;
  w.u=new Float64Array(N);
  w.uPrev=new Float64Array(N);
  w.uNext=new Float64Array(N);
  w.imgData=null;
}
function wavesRipple(){
  var w=STATE.waves;
  for(var y=0;y<w.Ny;y++){
    for(var x=0;x<w.Nx;x++){
      var dx=x-w.Nx/2,dy=y-w.Ny/2;
      var r=Math.hypot(dx,dy);
      w.u[y*w.Nx+x]+=Math.cos(r/8)*Math.exp(-r/40)*2;
    }
  }
}
function wavesPlaneWave(){
  var w=STATE.waves;
  for(var y=0;y<w.Ny;y++){
    for(var x=0;x<w.Nx;x++){
      if(x<w.Nx*0.3){
        w.u[y*w.Nx+x]+=Math.sin(x*0.3)*0.5;
      }
    }
  }
}

    '<div class="sec"><h4>⌨️ Shortcuts</h4><div class="text-xs" style="font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+
    '<b class="text-c1">Space</b> — Play/pause<br>'+
    '<b class="text-c1">R</b> — Reset current module<br>'+
    '<b class="text-c1">.</b> — Step one frame<br>'+
    '<b class="text-c1">1-7</b> — Jump to module<br>'+
    '<b class="text-c1">T</b> — Cycle theme<br>'+
    '<b class="text-c1">?</b> — This help'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='.')stepModule();
  else if(e.key>='1'&&e.key<='7'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Compiling Verlet integration engine...',
  'Loading RK4 coefficients...',
  'Preparing SPH kernel functions...',
  'Initializing ray-tracing optics...',
  'Setting up electric field solver...',
  'Warming up collision impulses...',
  'Allocating 2D wave grid...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('FÍSICA ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.033);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  }
  var m2=MODULES[STATE.currentTab];
  if(m2&&m2.draw){try{m2.draw(CANV.ctx);}catch(e){console.error(e);}}
  $('sbTime').textContent=fmt(STATE.time,2)+'s';
  $('sbSteps').textContent=STATE.steps;
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('FÍSICA initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
