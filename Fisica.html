<!DOCTYPE html>
<html lang="en" data-theme="cosmos">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>FÍSICA — Physics Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#03060f;--bg2:#070b18;--bg3:#0c1228;--bg4:#141c38;
  --panel:#070b18;--panel2:#0c1228;--panel3:#141c38;--panel4:#1e2850;
  --bd:#1a2248;--bd2:#2c3a68;--bd3:#4058a0;
  --tx:#e8ecff;--tx2:#a0a8d0;--tx3:#606890;--mu:#404870;
  --c1:#ffa030;--c1h:#ffc080;--c1l:#c07020;
  --c2:#40d0ff;--c2h:#80e0ff;--c2l:#20a0c0;
  --c3:#40ff90;--c3h:#80ffc0;--c3l:#20c060;
  --c4:#ff5060;--c4h:#ff90a0;--c4l:#c03040;
  --c5:#ffe040;--c5h:#fff080;--c5l:#c0a020;
  --c6:#a060ff;--c6h:#c090ff;--c6l:#7030c0;
  --c7:#40ffd0;--c7h:#80ffe0;--c7l:#20c090;
  --c8:#ff40ff;--c8h:#ff80ff;--c8l:#c020c0;
  --ok:#40ff90;--warn:#ffe040;--err:#ff5060;--info:#40d0ff;
  --g1:linear-gradient(135deg,#ffa030,#ff40ff);
  --g2:linear-gradient(135deg,#40d0ff,#a060ff);
  --gHolo:linear-gradient(120deg,#ffa030,#ff40ff,#a060ff,#40d0ff,#40ff90,#ffa030);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.75);
  --sh2:0 16px 48px rgba(0,0,0,.95);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="nebula"]{--bg:#0a0218;--bg2:#14052c;--bg3:#200a40;--panel:#14052c;--panel2:#200a40;
  --bd:#3c1a68;--bd2:#5c2a98;--tx:#f0d8ff;--tx2:#b090d8;--tx3:#7050a0;
  --c1:#ff60d0;--c2:#60a0ff;--c3:#80ffa0;--c6:#c060ff;
  --g1:linear-gradient(135deg,#ff60d0,#c060ff)}
[data-theme="light"]{--bg:#f5f8ff;--bg2:#eef2fc;--bg3:#e0e8f8;--panel:#fff;--panel2:#f5f8ff;--panel3:#eef2fc;--panel4:#e0e8f8;
  --bd:#c0cae0;--bd2:#90a0c0;--tx:#081428;--tx2:#305080;--tx3:#607898;
  --c1:#c06000;--c2:#0060c0;--c3:#008040;--c6:#6020c0;
  --g1:linear-gradient(135deg,#c06000,#6020c0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#03060f;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-atom{width:180px;height:180px;margin-bottom:24px;position:relative;animation:spin 6s linear infinite}
.boot-atom svg{width:100%;height:100%}
.boot-atom ellipse{fill:none;stroke:#ffa030;stroke-width:1.5;opacity:.5}
.boot-atom circle.nucleus{fill:#ffa030;filter:drop-shadow(0 0 12px #ffa030)}
.boot-atom circle.electron{fill:#40d0ff;filter:drop-shadow(0 0 8px #40d0ff);animation:orbit 3s linear infinite}
.boot-atom circle.electron:nth-child(2){animation-duration:4s;animation-direction:reverse}
.boot-atom circle.electron:nth-child(3){animation-duration:5s}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#ffa030;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#141c38;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ffa030}
.boot-pct{font-size:.7rem;color:#ffa030;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#606890;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#03060f;box-shadow:0 0 14px rgba(255,160,48,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#03060f;border-color:transparent}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#141c38;transition:var(--t1)}
.tb-status .dot.on{background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:280px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#02040a;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(7,11,24,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,160,48,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#03060f;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,160,48,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#03060f;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:240px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-atom">
    <svg viewBox="0 0 180 180">
      <ellipse cx="90" cy="90" rx="70" ry="26" transform="rotate(0 90 90)"/>
      <ellipse cx="90" cy="90" rx="70" ry="26" transform="rotate(60 90 90)"/>
      <ellipse cx="90" cy="90" rx="70" ry="26" transform="rotate(120 90 90)"/>
      <circle class="nucleus" cx="90" cy="90" r="12"/>
      <circle class="electron" cx="160" cy="90" r="6"/>
    </svg>
  </div>
  <div class="boot-logo">FÍSICA</div>
  <div class="boot-sub">PHYSICS STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('nbody')">FÍSICA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">running</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="stepModule()" title="Step (.)">⏭</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">t</span><span class="sb-val c2" id="sbTime">0.00s</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Steps</span><span class="sb-val c3" id="sbSteps">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Energy</span><span class="sb-val c5" id="sbEnergy">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Bodies</span><span class="sb-val c4" id="sbBodies">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">N-Body</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function rndN(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}

/* ================================================================
   VECTOR MATH
   ================================================================ */
var V={
  add:function(a,b){return [a[0]+b[0],a[1]+b[1]]},
  sub:function(a,b){return [a[0]-b[0],a[1]-b[1]]},
  scale:function(a,s){return [a[0]*s,a[1]*s]},
  dot:function(a,b){return a[0]*b[0]+a[1]*b[1]},
  cross:function(a,b){return a[0]*b[1]-a[1]*b[0]},
  len:function(a){return Math.sqrt(a[0]*a[0]+a[1]*a[1])},
  norm:function(a){var l=V.len(a);return l>0?[a[0]/l,a[1]/l]:[0,0]},
  len2:function(a){return a[0]*a[0]+a[1]*a[1]}
};

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();

}
function resizeCanvas(){

  CANV.dpr=window.devicePixelRatio||1;

  CANV.canvas.style.height=CANV.H+'px';

}
var INPUT={down:false,lastX:0,lastY:0,x:0,y:0,dx:0,dy:0};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onWheel(e){e.preventDefault();var m=MODULES[STATE.currentTab];if(m&&m.onWheel)m.onWheel(e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def;}

function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}
function drawArrow(ctx,x1,y1,x2,y2,color,w){
  w=w||1.5;
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-y1,x2-x1);
  var hl=6+w;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(ang-0.4),y2-hl*Math.sin(ang-0.4));
  ctx.lineTo(x2-hl*Math.cos(ang+0.4),y2-hl*Math.sin(ang+0.4));
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}

/* ================================================================
   MODULE: N-BODY GRAVITY
   ================================================================ */
registerModule('nbody',{
  title:'N-Body Gravity',
  icon:'🪐',
  desc:'Gravitational N-body simulation with velocity Verlet integration. Bodies attract each other with F = G·m₁·m₂/r².',
  init:function(){
    this.setPreset(STATE.nbody.preset);
  },
  setPreset:function(name){
    var nb=STATE.nbody;
    nb.preset=name;
    nb.bodies=[];
    var W=CANV.W,H=CANV.H;
    var cx=W/2,cy=H/2;
    if(name==='solar'){
      /* Sun + planets */
      nb.bodies.push({x:cx,y:cy,vx:0,vy:0,m:8000,r:14,c:'#ffe040',name:'Sun',fixed:true});
      var planets=[
        {dist:80,m:8,r:4,c:'#40d0ff',name:'Mercury'},
        {dist:120,m:16,r:6,c:'#ffa030',name:'Venus'},
        {dist:170,m:20,r:7,c:'#40a0ff',name:'Earth'},
        {dist:220,m:12,r:5,c:'#ff5060',name:'Mars'},
        {dist:300,m:80,r:12,c:'#ff9040',name:'Jupiter'}
      ];
      planets.forEach(function(p){
        var v=Math.sqrt(nb.G*nb.bodies[0].m/p.dist);
        nb.bodies.push({x:cx+p.dist,y:cy,vx:0,vy:v,m:p.m,r:p.r,c:p.c,name:p.name});
      });
    } else if(name==='binary'){
      /* Two stars orbiting + outer planets */
      nb.bodies.push({x:cx-60,y:cy,vx:0,vy:55,m:4000,r:12,c:'#ffe040'});
      nb.bodies.push({x:cx+60,y:cy,vx:0,vy:-55,m:4000,r:12,c:'#ffa030'});
      for(var i=0;i<4;i++){
        var d=180+i*50;
        var v=Math.sqrt(nb.G*4000/d);
        nb.bodies.push({x:cx,y:cy+d,vx:v,vy:0,m:10,r:4,c:'#40d0ff'});
      }
    } else if(name==='cluster'){
      /* Random cluster */
      for(var i2=0;i2<40;i2++){
        var a=Math.random()*Math.PI*2;
        var d2=Math.random()*180+30;
        var bx=cx+Math.cos(a)*d2;
        var by=cy+Math.sin(a)*d2;
        var m=rndF(20,100);
        var vt=Math.sqrt(nb.G*400/Math.max(d2,20))*0.8;
        var dir=a+Math.PI/2;
        nb.bodies.push({x:bx,y:by,vx:Math.cos(dir)*vt,vy:Math.sin(dir)*vt,m:m,r:Math.pow(m,0.3)+2,c:pickColor()});
      }
    } else if(name==='figure8'){
      /* Three-body figure-8 (known periodic solution) */
      var s=1;
      nb.bodies.push({x:cx-0.97000436*s*80,y:cy+0.24308753*s*80,vx:0.46620369*s*80,vy:0.43236573*s*80,m:1000,r:8,c:'#ff40ff'});
      nb.bodies.push({x:cx+0.97000436*s*80,y:cy-0.24308753*s*80,vx:0.46620369*s*80,vy:0.43236573*s*80,m:1000,r:8,c:'#40d0ff'});
      nb.bodies.push({x:cx,y:cy,vx:-0.93240737*s*80,vy:-0.86473146*s*80,m:1000,r:8,c:'#40ff90'});
    }
    nb.bodies.forEach(function(b){b.trail=[]});
    logMsg('N-body: '+name+' preset with '+nb.bodies.length+' bodies','info');
  },
  tick:function(dt){
    var nb=STATE.nbody;
    var substeps=2;
    var h=nb.dt/substeps;
    for(var step=0;step<substeps;step++)this.integrate(h);
    /* Trails */
    if(nb.trails){
      nb.bodies.forEach(function(b){
        b.trail.push([b.x,b.y]);
        if(b.trail.length>nb.trailLen)b.trail.shift();
      });
    }
    STATE.time+=dt;
    STATE.steps++;
  },
  integrate:function(h){
    var nb=STATE.nbody;
    var n=nb.bodies.length;
    var G=nb.G;
    var eps2=nb.softening*nb.softening;
    /* Compute accelerations */
    var acc=[];
    for(var i=0;i<n;i++)acc.push([0,0]);
    for(var i2=0;i2<n;i2++){
      for(var j=i2+1;j<n;j++){
        var a=nb.bodies[i2],b=nb.bodies[j];
        var dx=b.x-a.x,dy=b.y-a.y;
        var r2=dx*dx+dy*dy+eps2;
        var invR3=1/(r2*Math.sqrt(r2));
        var fx=G*dx*invR3;
        var fy=G*dy*invR3;
        if(!a.fixed){
          acc[i2][0]+=fx*b.m;
          acc[i2][1]+=fy*b.m;
        }
        if(!b.fixed){
          acc[j][0]-=fx*a.m;
          acc[j][1]-=fy*a.m;
        }
      }
    }
    /* Velocity Verlet: half-step velocities */
    for(var i3=0;i3<n;i3++){
      var b2=nb.bodies[i3];
      if(b2.fixed)continue;
      b2.vx+=acc[i3][0]*h*0.5;
      b2.vy+=acc[i3][1]*h*0.5;
      b2.x+=b2.vx*h;
      b2.y+=b2.vy*h;
    }
    /* Recompute accelerations at new positions */
    var acc2=[];
    for(var i4=0;i4<n;i4++)acc2.push([0,0]);
    for(var i5=0;i5<n;i5++){
      for(var j2=i5+1;j2<n;j2++){
        var a2=nb.bodies[i5],b3=nb.bodies[j2];
        var dx2=b3.x-a2.x,dy2=b3.y-a2.y;
        var r22=dx2*dx2+dy2*dy2+eps2;
        var invR32=1/(r22*Math.sqrt(r22));
        var fx2=G*dx2*invR32;
        var fy2=G*dy2*invR32;
        if(!a2.fixed){acc2[i5][0]+=fx2*b3.m;acc2[i5][1]+=fy2*b3.m;}
        if(!b3.fixed){acc2[j2][0]-=fx2*a2.m;acc2[j2][1]-=fy2*a2.m;}
      }
    }
    /* Complete velocity step */
    for(var i6=0;i6<n;i6++){
      var b4=nb.bodies[i6];
      if(b4.fixed)continue;
      b4.vx+=acc2[i6][0]*h*0.5;
      b4.vy+=acc2[i6][1]*h*0.5;
    }
  },
  energy:function(){
    var nb=STATE.nbody;
    var KE=0,PE=0;
    for(var i=0;i<nb.bodies.length;i++){
      var b=nb.bodies[i];
      KE+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);
      for(var j=i+1;j<nb.bodies.length;j++){
        var b2=nb.bodies[j];
        var r=Math.max(1,Math.hypot(b.x-b2.x,b.y-b2.y));
        PE-=nb.G*b.m*b2.m/r;
      }
    }
    return {KE:KE,PE:PE,total:KE+PE};
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    /* Stars */
    ctx.fillStyle='rgba(255,255,255,.15)';
    for(var i=0;i<80;i++){
      var sx=(i*137)%W;
      var sy=(i*79)%H;
      ctx.fillRect(sx,sy,1,1);
    }
    var nb=STATE.nbody;
    /* Trails */
    if(nb.trails){
      nb.bodies.forEach(function(b){
        if(b.trail.length<2)return;
        ctx.strokeStyle=b.c;
        ctx.lineWidth=1;
        ctx.globalAlpha=0.4;
        ctx.beginPath();
        for(var k=0;k<b.trail.length;k++){
          var t=b.trail[k];
          if(k===0)ctx.moveTo(t[0],t[1]);else ctx.lineTo(t[0],t[1]);
        }
        ctx.stroke();
        ctx.globalAlpha=1;
      });
    }
    /* Bodies */
    nb.bodies.forEach(function(b){
      /* Glow */
      var grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
      grad.addColorStop(0,b.c);
      grad.addColorStop(0.3,b.c+'80');
      grad.addColorStop(1,b.c+'00');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*3,0,Math.PI*2);ctx.fill();
      /* Core */
      ctx.fillStyle=b.c;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=1;
      ctx.stroke();
      /* Velocity vector */
      if(nb.showVelocity){
        drawArrow(ctx,b.x,b.y,b.x+b.vx*0.5,b.y+b.vy*0.5,'#40ff90',1.5);
      }
      /* Label */
      if(b.name){
        ctx.fillStyle='rgba(224,232,255,.6)';
        ctx.font='9px monospace';
        ctx.textAlign='center';
        ctx.fillText(b.name,b.x,b.y-b.r-4);
      }
    });
    var E=this.energy();
    setStatsHTML(
      '<div>Bodies: '+nb.bodies.length+'</div>'+
      '<div>KE: '+fmt(E.KE,0)+'</div>'+
      '<div>PE: '+fmt(E.PE,0)+'</div>'+
      '<div>E total: '+fmt(E.total,0)+'</div>'
    );
    updateBadge('🪐 N-Body · '+nb.preset+' · '+nb.bodies.length+' bodies');
    $('sbMode').textContent='N-Body';
    $('sbBodies').textContent=nb.bodies.length;
    $('sbEnergy').textContent=fmt(E.total,0);
  },
  onDown:function(p){
    /* Click to add a small body */
    var nb=STATE.nbody;
    var cx=CANV.W/2,cy=CANV.H/2;
    var dx=p.x-cx,dy=p.y-cy;
    var dist=Math.max(30,Math.hypot(dx,dy));
    var mass=20;
    var v=Math.sqrt(nb.G*(nb.bodies[0]?nb.bodies[0].m:4000)/dist);
    var ang=Math.atan2(dy,dx);
    nb.bodies.push({
      x:p.x,y:p.y,
      vx:-Math.sin(ang)*v,vy:Math.cos(ang)*v,
      m:mass,r:5,c:pickColor(),
      trail:[]
    });
  },
  onUp:function(){},
  onWheel:function(){},
  controls:function(){
    var nb=STATE.nbody;
    var html='';
    html+='<div class="sec"><h4>Preset</h4>';
    html+='<div class="chip-row">';
    [['solar','☀️ Solar'],['binary','✨ Binary'],['cluster','🌌 Cluster'],['figure8','∞ Figure-8']].forEach(function(p){
      html+='<div class="chip '+(nb.preset===p[0]?'active':'')+'" onclick="MODULES.nbody.setPreset(\''+p[0]+'\');renderLeftPanel()">'+p[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Physics</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Gravitational G</span><span>'+nb.G+'</span></div>';
    html+='<input type="range" min="100" max="1500" step="50" value="'+nb.G+'" oninput="STATE.nbody.G=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Softening ε</span><span>'+nb.softening+'</span></div>';
    html+='<input type="range" min="1" max="30" step="1" value="'+nb.softening+'" oninput="STATE.nbody.softening=parseInt(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Time step dt</span><span>'+nb.dt.toFixed(3)+'</span></div>';
    html+='<input type="range" min="0.005" max="0.05" step="0.005" value="'+nb.dt+'" oninput="STATE.nbody.dt=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Show trails</span><div class="chip '+(nb.trails?'active':'')+'" onclick="STATE.nbody.trails=!STATE.nbody.trails;renderLeftPanel()">'+(nb.trails?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Velocity vectors</span><div class="chip '+(nb.showVelocity?'active':'')+'" onclick="STATE.nbody.showVelocity=!STATE.nbody.showVelocity;renderLeftPanel()">'+(nb.showVelocity?'ON':'OFF')+'</div></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="MODULES.nbody.init()">↺ Reset</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="STATE.nbody.bodies.forEach(function(b){b.trail=[]})">Clear trails</button>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click anywhere to add a body with orbital velocity.</div>';
    return html;
  },
  mathPanel:function(){
    var E=this.energy();
    return '<div class="sec"><h4>Newtonian Gravity</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'F = G·m₁·m₂ / r²  (along r̂)<br><br>'+
      'Acceleration on body i:<br>'+
      'aᵢ = G·Σⱼ mⱼ·(rⱼ−rᵢ)/|rⱼ−rᵢ|³<br><br>'+
      '<b class="text-c1">Softening ε</b> prevents singularities at r→0: r² → r² + ε²'+
      '</div></div>'+
      '<div class="sec"><h4>Velocity Verlet</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'v(t+Δt/2) = v(t) + a(t)·Δt/2<br>'+
      'x(t+Δt) = x(t) + v(t+Δt/2)·Δt<br>'+
      'v(t+Δt) = v(t+Δt/2) + a(t+Δt)·Δt/2<br><br>'+
      'Symplectic → conserves energy over long times.'+
      '</div></div>'+
      '<div class="sec"><h4>Energy</h4><div class="kv">'+

      '<div class="row"><span class="k">Total</span><span class="v">'+fmt(E.total,1)+'</span></div>'+

});

registerModule('chaos',{
  title:'Chaos & Attractors',
  icon:'🌀',
  desc:'Double pendulum with RK4 and Lorenz attractor. Both are deterministic yet unpredictable — initial conditions matter.',
  init:function(){
    var c=STATE.chaos;
    c.th1=Math.PI/2;c.th2=Math.PI/2;
    c.w1=0;c.w2=0;
    c.lx=0.1;c.ly=0;c.lz=0;
    c.lorenzTrace=[];
    c.trail=[];
    c.energyHistory=[];
    /* Ghost = same system with slightly different initial condition */
    c.ghost={
      th1:c.th1+1e-3,th2:c.th2,
      w1:0,w2:0,
      trail:[]
    };
  },
  tick:function(dt){
    var c=STATE.chaos;
    var steps=4;
    var h=dt/steps;
    for(var s=0;s<steps;s++){
      if(c.type==='double'){
        var s1=this.doublePendulumDeriv(c.th1,c.th2,c.w1,c.w2);
        /* RK4 */
        var k1=s1;
        var s2=this.doublePendulumDeriv(
          c.th1+k1[0]*h/2,c.th2+k1[1]*h/2,
          c.w1+k1[2]*h/2,c.w2+k1[3]*h/2);
        var k2=s2;
        var s3=this.doublePendulumDeriv(
          c.th1+k2[0]*h/2,c.th2+k2[1]*h/2,
          c.w1+k2[2]*h/2,c.w2+k2[3]*h/2);
        var k3=s3;
        var s4=this.doublePendulumDeriv(
          c.th1+k3[0]*h,c.th2+k3[1]*h,
          c.w1+k3[2]*h,c.w2+k3[3]*h);
        var k4=s4;
        c.th1+=(k1[0]+2*k2[0]+2*k3[0]+k4[0])*h/6;
        c.th2+=(k1[1]+2*k2[1]+2*k3[1]+k4[1])*h/6;
        c.w1+=(k1[2]+2*k2[2]+2*k3[2]+k4[2])*h/6;
        c.w2+=(k1[3]+2*k2[3]+2*k3[3]+k4[3])*h/6;
        if(c.damping>0){
          c.w1*=(1-c.damping*h);
          c.w2*=(1-c.damping*h);
        }
        /* Ghost */
        var g=c.ghost;
        var g1=this.doublePendulumDeriv(g.th1,g.th2,g.w1,g.w2);
        var g2=this.doublePendulumDeriv(g.th1+g1[0]*h/2,g.th2+g1[1]*h/2,g.w1+g1[2]*h/2,g.w2+g1[3]*h/2);
        var g3=this.doublePendulumDeriv(g.th1+g2[0]*h/2,g.th2+g2[1]*h/2,g.w1+g2[2]*h/2,g.w2+g2[3]*h/2);
        var g4=this.doublePendulumDeriv(g.th1+g3[0]*h,g.th2+g3[1]*h,g.w1+g3[2]*h,g.w2+g3[3]*h);
        g.th1+=(g1[0]+2*g2[0]+2*g3[0]+g4[0])*h/6;
        g.th2+=(g1[1]+2*g2[1]+2*g3[1]+g4[1])*h/6;
        g.w1+=(g1[2]+2*g2[2]+2*g3[2]+g4[2])*h/6;
        g.w2+=(g1[3]+2*g2[3]+2*g3[3]+g4[3])*h/6;
      } else {
        /* Lorenz */
        var l1=this.lorenzDeriv(c.lx,c.ly,c.lz);
        var l2=this.lorenzDeriv(c.lx+l1[0]*h/2,c.ly+l1[1]*h/2,c.lz+l1[2]*h/2);
        var l3=this.lorenzDeriv(c.lx+l2[0]*h/2,c.ly+l2[1]*h/2,c.lz+l2[2]*h/2);
        var l4=this.lorenzDeriv(c.lx+l3[0]*h,c.ly+l3[1]*h,c.lz+l3[2]*h);
        c.lx+=(l1[0]+2*l2[0]+2*l3[0]+l4[0])*h/6;
        c.ly+=(l1[1]+2*l2[1]+2*l3[1]+l4[1])*h/6;
        c.lz+=(l1[2]+2*l2[2]+2*l3[2]+l4[2])*h/6;
        c.lorenzTrace.push([c.lx,c.ly,c.lz]);
        if(c.lorenzTrace.length>2000)c.lorenzTrace.shift();
      }
    }
    /* Trails */
    if(c.type==='double'){
      var pts=this.doublePendulumPoints(c.th1,c.th2);
      c.trail.push(pts);
      if(c.trail.length>c.trailMax)c.trail.shift();
      var gpts=this.doublePendulumPoints(c.ghost.th1,c.ghost.th2);
      c.ghost.trail.push(gpts);
      if(c.ghost.trail.length>c.trailMax)c.ghost.trail.shift();
    }
    /* Energy tracking */
    if(c.type==='double'){
      c.energyHistory.push(this.doublePendulumEnergy());
      if(c.energyHistory.length>500)c.energyHistory.shift();
    }
    STATE.time+=dt;
    STATE.steps++;
  },
  lorenzDeriv:function(x,y,z){
    var c=STATE.chaos;
    return [
      c.sigma*(y-x),
      x*(c.rho-z)-y,
      x*y-c.beta*z
    ];
  },
  doublePendulumDeriv:function(th1,th2,w1,w2){
    var c=STATE.chaos;
    var g=c.g, L1=c.L1, L2=c.L2, m1=c.m1, m2=c.m2;
    var d=th2-th1;
    var cosd=Math.cos(d), sind=Math.sin(d);
    var denom1=L1*(2*m1+m2-m2*Math.cos(2*d));
    var denom2=L2*(2*m1+m2-m2*Math.cos(2*d));
    var a1=(-g*(2*m1+m2)*Math.sin(th1)-m2*g*Math.sin(th1-2*th2)-2*sind*m2*(w2*w2*L2+w1*w1*L1*cosd))/denom1;
    var a2=(2*sind*(w1*w1*L1*(m1+m2)+g*(m1+m2)*Math.cos(th1)+w2*w2*L2*m2*cosd))/denom2;
    return [w1,w2,a1,a2];
  },
  doublePendulumPoints:function(th1,th2){
    var c=STATE.chaos;
    var cx=CANV.W/2, cy=CANV.H*0.35;
    var x1=cx+Math.sin(th1)*c.L1;
    var y1=cy+Math.cos(th1)*c.L1;
    var x2=x1+Math.sin(th2)*c.L2;
    var y2=y1+Math.cos(th2)*c.L2;
    return {cx:cx,cy:cy,x1:x1,y1:y1,x2:x2,y2:y2};
  },
  doublePendulumEnergy:function(){
    var c=STATE.chaos;
    var L1=c.L1,L2=c.L2,m1=c.m1,m2=c.m2,g=c.g;
    /* Use th measured from downward vertical: y = L·cos(th) - L, so height from pivot = -L·cos(th) */
    var v1sq=L1*L1*c.w1*c.w1;
    var vx2=L1*c.w1*Math.cos(c.th1)+L2*c.w2*Math.cos(c.th2);
    var vy2=-L1*c.w1*Math.sin(c.th1)-L2*c.w2*Math.sin(c.th2);
    var v2sq=vx2*vx2+vy2*vy2;
    var KE=0.5*m1*v1sq+0.5*m2*v2sq;
    var PE=-m1*g*L1*Math.cos(c.th1)-m2*g*(L1*Math.cos(c.th1)+L2*Math.cos(c.th2));
    return {KE:KE,PE:PE,total:KE+PE};
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var c=STATE.chaos;
    if(c.type==='double'){
      this.drawDoublePendulum(ctx);
    } else {
      this.drawLorenz(ctx);
    }
    $('sbMode').textContent='Chaos';
  },
  drawDoublePendulum:function(ctx){
    var W=CANV.W,H=CANV.H;
    var c=STATE.chaos;
    /* Trails */
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(255,160,48,.3)';
    ctx.beginPath();
    var first=true;
    c.trail.forEach(function(p){
      if(first){ctx.moveTo(p.x2,p.y2);first=false;}else ctx.lineTo(p.x2,p.y2);
    });
    ctx.stroke();
    /* Ghost trail */
    ctx.strokeStyle='rgba(64,208,255,.3)';
    ctx.beginPath();
    first=true;
    c.ghost.trail.forEach(function(p){
      if(first){ctx.moveTo(p.x2,p.y2);first=false;}else ctx.lineTo(p.x2,p.y2);
    });
    ctx.stroke();
    /* Ghost pendulum */
    var gpts=this.doublePendulumPoints(c.ghost.th1,c.ghost.th2);
    ctx.strokeStyle='rgba(64,208,255,.5)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(gpts.cx,gpts.cy);ctx.lineTo(gpts.x1,gpts.y1);ctx.lineTo(gpts.x2,gpts.y2);ctx.stroke();
    ctx.fillStyle='rgba(64,208,255,.5)';
    ctx.beginPath();ctx.arc(gpts.x2,gpts.y2,5,0,Math.PI*2);ctx.fill();
    /* Main pendulum */
    var pts=this.doublePendulumPoints(c.th1,c.th2);
    /* Rods */
    ctx.strokeStyle='#ffa030';
    ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(pts.cx,pts.cy);ctx.lineTo(pts.x1,pts.y1);ctx.stroke();
    ctx.strokeStyle='#ff40ff';
    ctx.beginPath();ctx.moveTo(pts.x1,pts.y1);ctx.lineTo(pts.x2,pts.y2);ctx.stroke();
    /* Pivot */
    ctx.fillStyle='#e8ecff';
    ctx.beginPath();ctx.arc(pts.cx,pts.cy,5,0,Math.PI*2);ctx.fill();
    /* Bobs */
    var grad1=ctx.createRadialGradient(pts.x1,pts.y1,0,pts.x1,pts.y1,16);
    grad1.addColorStop(0,'#ffa030');grad1.addColorStop(0.5,'#ffa03080');grad1.addColorStop(1,'#ffa03000');
    ctx.fillStyle=grad1;
    ctx.beginPath();ctx.arc(pts.x1,pts.y1,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffa030';
    ctx.beginPath();ctx.arc(pts.x1,pts.y1,8,0,Math.PI*2);ctx.fill();
    var grad2=ctx.createRadialGradient(pts.x2,pts.y2,0,pts.x2,pts.y2,18);
    grad2.addColorStop(0,'#ff40ff');grad2.addColorStop(0.5,'#ff40ff80');grad2.addColorStop(1,'#ff40ff00');
    ctx.fillStyle=grad2;
    ctx.beginPath();ctx.arc(pts.x2,pts.y2,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff40ff';
    ctx.beginPath();ctx.arc(pts.x2,pts.y2,9,0,Math.PI*2);ctx.fill();
    /* Energy chart */
    var ecH=80;
    var ecY=H-ecH-20;
    var ecX=40;
    var ecW=W-80;
    ctx.fillStyle='rgba(7,11,24,.5)';
    ctx.strokeStyle='rgba(255,160,48,.3)';
    ctx.beginPath();ctx.roundRect(ecX,ecY,ecW,ecH,6);ctx.fill();ctx.stroke();
    if(c.energyHistory.length>2){
      var minE=Infinity,maxE=-Infinity;
      c.energyHistory.forEach(function(e){
        if(e.total<minE)minE=e.total;
        if(e.total>maxE)maxE=e.total;
      });
      var range=maxE-minE||1;
      ctx.strokeStyle='#ffa030';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      for(var i=0;i<c.energyHistory.length;i++){
        var x=ecX+(i/(c.energyHistory.length-1))*ecW;
        var y=ecY+ecH-((c.energyHistory[i].total-minE)/range)*ecH;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.fillStyle='#ffa030';
    ctx.font='9px monospace';
    ctx.textAlign='left';
    ctx.fillText('TOTAL ENERGY (should be conserved)',ecX+6,ecY+12);
    /* Info */
    var E=this.doublePendulumEnergy();
    /* Lyapunov distance */
    var lyapDist=Math.hypot(c.th1-c.ghost.th1,c.th2-c.ghost.th2);
    setStatsHTML(
      '<div>θ₁: '+fmt(c.th1*180/Math.PI,1)+'°</div>'+
      '<div>θ₂: '+fmt(c.th2*180/Math.PI,1)+'°</div>'+
      '<div>ω₁: '+fmt(c.w1,2)+'</div>'+
      '<div>Energy: '+fmt(E.total,0)+'</div>'+
      '<div>Divergence: '+fmt(lyapDist,4)+'</div>'
    );
    updateBadge('🌀 Double Pendulum · chaotic');
    $('sbEnergy').textContent=fmt(E.total,0);
    $('sbBodies').textContent='2';
  },
  drawLorenz:function(ctx){
    var W=CANV.W,H=CANV.H;
    var c=STATE.chaos;
    /* Auto-fit view to trace bounding box */
    var minX=Infinity,maxX=-Infinity,minZ=Infinity,maxZ=-Infinity;
    c.lorenzTrace.forEach(function(p){
      if(p[0]<minX)minX=p[0];if(p[0]>maxX)maxX=p[0];
      if(p[2]<minZ)minZ=p[2];if(p[2]>maxZ)maxZ=p[2];
    });
    if(!isFinite(minX)){minX=-25;maxX=25;minZ=0;maxZ=50;}
    var pad=60;
    var scaleX=(W-pad*2)/Math.max(maxX-minX,1);
    var scaleZ=(H-pad*2)/Math.max(maxZ-minZ,1);
    var scale=Math.min(scaleX,scaleZ);
    var cx=(W-(minX+maxX)*scale)/2;
    var cy=H-(H-(minZ+maxZ)*scale)/2;
    /* Trails with fading */
    ctx.lineWidth=1.5;
    for(var i=1;i<c.lorenzTrace.length;i++){
      var alpha=i/c.lorenzTrace.length;
      var hue=200+alpha*160;
      ctx.strokeStyle='hsla('+hue+',80%,60%,'+alpha+')';
      ctx.beginPath();
      var p1=c.lorenzTrace[i-1],p2=c.lorenzTrace[i];
      ctx.moveTo(p1[0]*scale+cx,cy-p1[2]*scale);
      ctx.lineTo(p2[0]*scale+cx,cy-p2[2]*scale);
      ctx.stroke();
    }
    /* Current point */
    var px=c.lx*scale+cx,py=cy-c.lz*scale;
    ctx.fillStyle='#ffe040';
    ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();
    setStatsHTML(
      '<div>x: '+fmt(c.lx,2)+'</div>'+
      '<div>y: '+fmt(c.ly,2)+'</div>'+
      '<div>z: '+fmt(c.lz,2)+'</div>'+
      '<div>σ ρ β: '+c.sigma+' '+c.rho+' '+fmt(c.beta,2)+'</div>'+
      '<div>Points: '+c.lorenzTrace.length+'</div>'
    );
    updateBadge('🌀 Lorenz Attractor · σ='+c.sigma+' ρ='+c.rho+' β='+fmt(c.beta,2));
    $('sbBodies').textContent='1';
  },
  onDown:function(p){
    var c=STATE.chaos;
    if(c.type==='double'){
      /* Perturb pendulum toward click */
      var cx=CANV.W/2,cy=CANV.H*0.35;

      c.ghost.trail=[];
    }
  },
  onUp:function(){},
  onWheel:function(){},

  mathPanel:function(){
    var c=STATE.chaos;
    if(c.type==='double'){
      return '<div class="sec"><h4>Double Pendulum Equations</h4>'+

        '&nbsp;&nbsp;&nbsp;&nbsp;− 2sin(θ₁−θ₂)m₂(θ̇₂²L₂ + θ̇₁²L₁cos(θ₁−θ₂))]<br>'+
        '&nbsp;&nbsp;&nbsp;&nbsp;/ [L₁(2m₁+m₂−m₂cos(2θ₁−2θ₂))]<br><br>'+
        'θ̈₂ = [2sin(θ₁−θ₂)(θ̇₁²L₁(m₁+m₂)<br>'+
        '&nbsp;&nbsp;&nbsp;&nbsp;+ g(m₁+m₂)cosθ₁ + θ̇₂²L₂m₂cos(θ₁−θ₂))]<br>'+
        '&nbsp;&nbsp;&nbsp;&nbsp;/ [L₂(2m₁+m₂−m₂cos(2θ₁−2θ₂))]'+
        '</div></div>'+
        '<div class="sec"><h4>Integrator: RK4</h4>'+
        '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
        'yₙ₊₁ = yₙ + (k₁ + 2k₂ + 2k₃ + k₄)/6<br><br>'+
        'k₁ = f(yₙ)<br>k₂ = f(yₙ + h·k₁/2)<br>k₃ = f(yₙ + h·k₂/2)<br>k₄ = f(yₙ + h·k₃)<br><br>'+
        '4th-order accuracy — energy conserved well.'+
        '</div></div>';
    } else {
      return '<div class="sec"><h4>Lorenz Equations</h4>'+
        '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
        'ẋ = σ(y − x)<br>'+
        'ẏ = x(ρ − z) − y<br>'+
        'ż = xy − βz<br><br>'+
        'Current: σ='+c.sigma+' ρ='+c.rho+' β='+fmt(c.beta,2)+
        '</div></div>'+
        '<div class="sec"><h4>Butterfly Effect</h4>'+
        '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
        'A tiny difference in initial conditions grows exponentially — this is the defining feature of chaos.<br><br>'+
        'Lyapunov exponent λ ≈ 0.906 for classic parameters, so divergence doubles every ~ln(2)/λ ≈ 0.77 time units.<br><br>'+
        'The attractor has fractal dimension ≈ 2.06.'+
        '</div></div>';
    }
  }
});
function setLorenz(name){
  var c=STATE.chaos;
  if(name==='classic'){c.sigma=10;c.rho=28;c.beta=8/3;}
  else if(name==='stable'){c.sigma=10;c.rho=14;c.beta=8/3;}
  else if(name==='chaotic'){c.sigma=10;c.rho=35;c.beta=8/3;}

  c.lorenzTrace=[];
  renderLeftPanel();
}

registerModule('sph',{
  title:'SPH Fluid',
  icon:'💧',
  desc:'Smoothed Particle Hydrodynamics — real fluid simulation with density, pressure and viscosity kernels.',
  init:function(){
    initSPH();
  },
  tick:function(dt){
    var s=STATE.sph;
    if(s.paused)return;
    var sub=2;
    var h=dt/sub;

    STATE.time+=dt;
    STATE.steps++;
  },
  draw:function(ctx){

    /* Particles */

      }

      var grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s.h*1.5);

  controls:function(){

    html+='<input type="range" min="0" max="1000" step="20" value="'+s.viscosity+'" oninput="STATE.sph.viscosity=parseInt(this.value);renderLeftPanel()"></div>';

    html+='<input type="range" min="0" max="2000" step="50" value="'+s.G+'" oninput="STATE.sph.G=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';

    html+='</div>';

  mathPanel:function(){
    var s=STATE.sph;
    return '<div class="sec"><h4>SPH Method</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Smoothed Particle Hydrodynamics — meshfree Lagrangian fluid solver.<br><br>'+
      'Each particle carries mass, position, velocity. Density estimated from neighbors weighted by kernel:<br><br>'+
      'ρᵢ = Σⱼ mⱼ·W(rᵢⱼ, h)<br><br>'+
      'Pressure: P = k·(ρ − ρ₀)<br><br>'+
      'Force = −∇P + viscosity + gravity'+
      '</div></div>'+
      '<div class="sec"><h4>Kernel</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Poly6 kernel (used here):<br>'+
      'W(r,h) = (315/64πh⁹)·(h²−r²)³ for r<h<br><br>'+
      'Viscosity kernel (Laplacian):<br>'+
      '∇²W(r,h) = (45/πh⁶)·(h−r)'+
      '</div></div>'+
      '<div class="sec"><h4>Parameters</h4><div class="kv">'+
      '<div class="row"><span class="k">Particles</span><span class="v">'+s.particles.length+'</span></div>'+
      '<div class="row"><span class="k">Rest density</span><span class="v">'+s.restDensity+'</span></div>'+
      '<div class="row"><span class="k">Kernel h</span><span class="v">'+s.h+'</span></div>'+
      '</div></div>';
  }
});
function initSPH(){
  var s=STATE.sph;
  var W=CANV.W,H=CANV.H;
  s.W=W;s.H=H;
  s.particles=[];
  var cols=Math.ceil(Math.sqrt(s.N*W/H));
  var rows=Math.ceil(s.N/cols);
  var cw=(W-40)/cols;
  var ch=(H*0.4)/rows;
  var idx=0;
  for(var y=0;y<rows&&idx<s.N;y++){
    for(var x=0;x<cols&&idx<s.N;x++){
      s.particles.push({
        x:40+x*cw+rndF(-2,2),
        y:H*0.55+y*ch+rndF(-2,2),
        vx:rndF(-10,10),vy:rndF(-10,10),
        color:'#40d0ff'
      });
      idx++;
    }
  }
}
function addSPHDrop(){
  var s=STATE.sph;
  var W=CANV.W;
  for(var i=0;i<50;i++){
    s.particles.push({
      x:W/2+rndF(-30,30),
      y:40+rndF(-20,20),
      vx:rndF(-30,30),vy:rndF(-30,30),
      color:'#40d0ff'
    });
  }
}
function simulateSPH(dt){
  var s=STATE.sph;
  var parts=s.particles;
  var n=parts.length;
  var h=s.h;
  var h2=h*h;
  var poly6=(315/(64*Math.PI*Math.pow(h,9)));
  var spikyGrad=(-45/(Math.PI*Math.pow(h,6)));
  var viscLap=(45/(Math.PI*Math.pow(h,6)));
  var restDensity=s.restDensity;
  /* Compute density */
  for(var i=0;i<n;i++){
    var p=parts[i];
    p.density=0;
  }
  for(var i2=0;i2<n;i2++){
    var pi=parts[i2];
    var rho=0;
    for(var j=0;j<n;j++){
      if(i2===j)continue;
      var pj=parts[j];
      var dx=pj.x-pi.x,dy=pj.y-pi.y;
      var r2=dx*dx+dy*dy;
      if(r2<h2){
        var diff=h2-r2;
        rho+=diff*diff*diff;
      }
    }
    rho*=poly6;
    /* self-contribution */
    rho+=poly6*h2*h2*h2;
    pi.density=rho;
  }
  /* Compute pressure */
  for(var i3=0;i3<n;i3++){
    parts[i3].pressure=s.stiff*(parts[i3].density-restDensity);
  }
  /* Forces */
  for(var i4=0;i4<n;i4++){
    var pi4=parts[i4];
    var fx=0,fy=0;
    for(var j2=0;j2<n;j2++){
      if(i4===j2)continue;
      var pj2=parts[j2];
      var dx2=pj2.x-pi4.x,dy2=pj2.y-pi4.y;
      var r2b=dx2*dx2+dy2*dy2;
      if(r2b<h2&&r2b>0.0001){
        var r=Math.sqrt(r2b);
        var ux=dx2/r,uy=dy2/r;
        /* Pressure force */
        var pterm=(pi4.pressure+pj2.pressure)/(2*pj2.density);
        var spiky=(h-r)*(h-r);
        var pf=spikyGrad*spiky*pterm;
        fx+=pf*ux;
        fy+=pf*uy;
        /* Viscosity */
        var vl=viscLap*(h-r)/pj2.density;
        fx+=s.viscosity*vl*(pj2.vx-pi4.vx);
        fy+=s.viscosity*vl*(pj2.vy-pi4.vy);
      }
    }
    /* Gravity */
    fy+=s.G;
    pi4.fx=fx;
    pi4.fy=fy;
  }
  /* Integrate */
  for(var i5=0;i5<n;i5++){
    var p5=parts[i5];
    p5.vx+=p5.fx*dt;
    p5.vy+=p5.fy*dt;
    p5.vx*=s.damping;
    p5.vy*=s.damping;
    p5.x+=p5.vx*dt;
    p5.y+=p5.vy*dt;
    /* Walls */
    var pad=15;
    if(p5.x<pad){p5.x=pad;p5.vx=-p5.vx*0.5;}
    if(p5.x>s.W-pad){p5.x=s.W-pad;p5.vx=-p5.vx*0.5;}
    if(p5.y<pad){p5.y=pad;p5.vy=-p5.vy*0.5;}
    if(p5.y>s.H-pad){p5.y=s.H-pad;p5.vy=-p5.vy*0.5;}
  }
}
</script>
<script>
/* ================================================================
   MODULE: OPTICS (ray tracing)
   ================================================================ */
registerModule('optics',{
  title:'Ray Optics',
  icon:'🔦',
  desc:'Geometric optics: refraction (Snell\'s law), reflection, total internal reflection, lens focusing.',
  init:function(){
    this.setPreset(STATE.optics.preset);
  },
  setPreset:function(name){
    var o=STATE.optics;
    o.preset=name;
    o.elements=[];
    o.rays=[];
    var W=CANV.W,H=CANV.H;
    if(name==='converging'){
      /* Convex lens */
      o.elements.push({type:'lens',x:W*0.5,y:H*0.5,rx:20,ry:140,focal:180});
    } else if(name==='diverging'){
      o.elements.push({type:'lens',x:W*0.5,y:H*0.5,rx:20,ry:140,focal:-180});
    } else if(name==='mirror'){
      o.elements.push({type:'mirror',x:W*0.6,y:0,w:20,h:H*0.7,y0:H*0.15,focal:250});
    } else if(name==='prism'){
      o.elements.push({type:'prism',x:W/2,y:H/2,size:120,ior:1.5});
    } else if(name==='refraction'){
      o.elements.push({type:'interface',x:W*0.5,y:0,w:20,h:H,y0:0,n1:1,n2:1.5});
    } else if(name==='totalInternal'){
      o.elements.push({type:'interface',x:W*0.5,y:0,w:20,h:H,y0:0,n1:1.5,n2:1});
    }
    logMsg('Optics: '+name+' preset','info');
  },
  tick:function(dt){STATE.time+=dt;},
  traceRay:function(x0,y0,dx,dy,depth){
    if(depth>12)return null;
    var o=STATE.optics;
    var W=CANV.W,H=CANV.H;
    var best=null;
    var bestT=Infinity;
    var bestNormal=null;
    o.elements.forEach(function(e){
      if(e.type==='lens'){
        /* Vertical lens: intersect ellipse or slab */
        var t=(e.x-x0)/dx;
        if(t>0.001&&t<bestT){
          var y=y0+dy*t;
          if(Math.abs(y-e.y)<e.ry){
            best=e;bestT=t;bestNormal=[1,0];
          }
        }
      } else if(e.type==='mirror'){
        /* Vertical mirror slab */
        var t2=(e.x-x0)/dx;
        if(t2>0.001&&t2<bestT){
          var y2=y0+dy*t2;
          if(y2>e.y0&&y2<e.y0+e.h){
            best=e;bestT=t2;bestNormal=[-1,0];
          }
        }
      } else if(e.type==='interface'){
        var t3=(e.x-x0)/dx;
        if(t3>0.001&&t3<bestT){
          best=e;bestT=t3;bestNormal=[-1,0];
        }
      } else if(e.type==='prism'){
        /* Triangle intersection — simple */
        var tri=[
          [e.x-e.size/2,e.y+e.size*0.4],
          [e.x+e.size/2,e.y+e.size*0.4],
          [e.x,e.y-e.size*0.5]
        ];
        /* Check 3 edges */
        for(var i=0;i<3;i++){
          var p1=tri[i],p2=tri[(i+1)%3];
          var ex=p2[0]-p1[0],ey=p2[1]-p1[1];
          var den=dx*ey-dy*ex;
          if(Math.abs(den)<1e-6)continue;
          var t4=((p1[0]-x0)*ey-(p1[1]-y0)*ex)/den;
          var u=((p1[0]-x0)*dy-(p1[1]-y0)*dx)/den;
          if(t4>0.001&&t4<bestT&&u>=0&&u<=1){
            best=e;bestT=t4;
            var len=Math.hypot(ex,ey);
            var nx=-ey/len,ny=ex/len;
            bestNormal=[nx,ny];
          }
        }
      }
    });
    /* If no hit, return infinity ray */
    if(!best){
      return {path:[[x0,y0],[x0+dx*2000,y0+dy*2000]],hit:false};
    }
    var hx=x0+dx*bestT,hy=y0+dy*bestT;
    var seg1=[[x0,y0],[hx,hy]];
    var reflect=function(nx,ny,dxx,dyy){
      var dot=dxx*nx+dyy*ny;
      return [dxx-2*dot*nx,dyy-2*dot*ny];
    };
    var refract=function(dxx,dyy,nx,ny,n1,n2){
      var eta=n1/n2;
      var cosI=-(dxx*nx+dyy*ny);
      /* Ensure normal points toward ray origin */
      if(cosI<0){nx=-nx;ny=-ny;cosI=-cosI;}
      var k=1-eta*eta*(1-cosI*cosI);
      if(k<0)return null; /* TIR */
      var cosT=Math.sqrt(k);
      return [eta*dxx+(eta*cosI-cosT)*nx,eta*dyy+(eta*cosI-cosT)*ny];
    };
    var next;
    if(best.type==='mirror'){
      var r=reflect(bestNormal[0],bestNormal[1],dx,dy);
      next=this.traceRay(hx+bestNormal[0]*0.01,hy+bestNormal[1]*0.01,r[0],r[1],depth+1);
    } else if(best.type==='interface'){
      /* Determine side */
      var n1=dx>0?best.n1:best.n2;
      var n2=dx>0?best.n2:best.n1;
      var n=dx>0?[-1,0]:[1,0];
      var rf=refract(dx,dy,n[0],n[1],n1,n2);
      if(!rf){
        /* Total internal reflection */
        var rr=reflect(n[0],n[1],dx,dy);
        next=this.traceRay(hx+n[0]*0.01,hy+n[1]*0.01,rr[0],rr[1],depth+1);
      } else {
        next=this.traceRay(hx+n[0]*0.01,hy+n[1]*0.01,rf[0],rf[1],depth+1);
      }
    } else if(best.type==='lens'){
      /* Thin lens: apply focal length formula */
      var yRel=hy-best.y;
      /* Ray transfer: slope change ∝ -y/f */
      var slopeBefore=dy/dx;
      var slopeAfter=slopeBefore-yRel/best.focal;
      var newDx=1,newDy=slopeAfter;
      var norm=Math.hypot(newDx,newDy);
      next=this.traceRay(hx+0.01,hy,newDx/norm,newDy/norm,depth+1);
    } else if(best.type==='prism'){
      /* Compute normal by which edge was hit */
      var n1p=1,n2p=1.5;
      /* Simplify — one refraction through entry */
      var rf2=refract(dx,dy,bestNormal[0],bestNormal[1],n1p,n2p);
      if(!rf2){
        var rr2=reflect(bestNormal[0],bestNormal[1],dx,dy);
        next=this.traceRay(hx+bestNormal[0]*0.01,hy+bestNormal[1]*0.01,rr2[0],rr2[1],depth+1);
      } else {
        next=this.traceRay(hx+bestNormal[0]*0.01,hy+bestNormal[1]*0.01,rf2[0],rf2[1],depth+1);
      }
    }
    if(next){
      return {path:seg1.concat(next.path),hit:true};
    }
    return {path:seg1,hit:true};
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var o=STATE.optics;
    /* Elements */
    o.elements.forEach(function(e){
      if(e.type==='lens'){
        /* Lens shape */
        var convex=e.focal>0;
        ctx.strokeStyle='#40d0ff';
        ctx.lineWidth=3;
        ctx.beginPath();
        if(convex){
          ctx.moveTo(e.x,e.y-e.ry);
          ctx.quadraticCurveTo(e.x+e.rx*2,e.y,e.x,e.y+e.ry);
          ctx.quadraticCurveTo(e.x-e.rx*2,e.y,e.x,e.y-e.ry);
        } else {
          ctx.moveTo(e.x-e.rx,e.y-e.ry);
          ctx.quadraticCurveTo(e.x,e.y,e.x-e.rx,e.y+e.ry);
          ctx.moveTo(e.x+e.rx,e.y-e.ry);
          ctx.quadraticCurveTo(e.x,e.y,e.x+e.rx,e.y+e.ry);
        }
        ctx.stroke();
        ctx.fillStyle='rgba(64,208,255,.1)';
        ctx.fill();
        /* Focal points */
        ctx.fillStyle='#ffe040';
        ctx.beginPath();ctx.arc(e.x+Math.abs(e.focal),e.y,4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(e.x-Math.abs(e.focal),e.y,4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffe040';
        ctx.font='10px monospace';
        ctx.textAlign='center';
        ctx.fillText('F',e.x+Math.abs(e.focal),e.y-10);
        ctx.fillText('F',e.x-Math.abs(e.focal),e.y-10);
      } else if(e.type==='mirror'){
        ctx.strokeStyle='#a060ff';
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(e.x,e.y0);ctx.lineTo(e.x,e.y0+e.h);
        ctx.stroke();
        /* Curvature */
        ctx.strokeStyle='rgba(160,96,255,.4)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(e.x-5,e.y0);ctx.quadraticCurveTo(e.x+e.rx,e.y0+e.h/2,e.x-5,e.y0+e.h);
        ctx.stroke();
      } else if(e.type==='interface'){
        ctx.fillStyle=dx0color(e,'left')||'rgba(64,208,255,.15)';
        function dx0color(e,side){return null;}
        /* Draw gradient for medium change */
        var grad=ctx.createLinearGradient(e.x-e.w,0,e.x+e.w,0);
        grad.addColorStop(0,'rgba(64,208,255,.1)');
        grad.addColorStop(0.5,'rgba(64,208,255,.3)');
        grad.addColorStop(1,'rgba(255,160,48,.1)');
        ctx.fillStyle=grad;
        ctx.fillRect(e.x-e.w/2,0,e.w,H);
        ctx.strokeStyle='rgba(255,160,48,.5)';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(e.x,e.y0);ctx.lineTo(e.x,e.y0+e.h);ctx.stroke();
        /* IOR labels */
        ctx.fillStyle='#40d0ff';
        ctx.font='bold 12px monospace';
        ctx.textAlign='center';
        ctx.fillText('n₁='+e.n1,e.x-60,30);
        ctx.fillStyle='#ffa030';
        ctx.fillText('n₂='+e.n2,e.x+60,30);
      } else if(e.type==='prism'){
        ctx.strokeStyle='#ff40ff';
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(e.x-e.size/2,e.y+e.size*0.4);
        ctx.lineTo(e.x+e.size/2,e.y+e.size*0.4);
        ctx.lineTo(e.x,e.y-e.size*0.5);
        ctx.closePath();
        ctx.fillStyle='rgba(255,64,255,.1)';
        ctx.fill();
        ctx.stroke();
      }
    });
    /* Ray source */
    var src=o.raySource;
    ctx.fillStyle=src.color;
    ctx.beginPath();ctx.arc(src.x,src.y,6,0,Math.PI*2);ctx.fill();
    /* Cast rays */
    var N=src.numRays;
    for(var i=0;i<N;i++){
      var frac=N===1?0:(i/(N-1)-0.5);
      var angle=src.angle+frac*src.spread;
      var dx=Math.cos(angle),dy=Math.sin(angle);
      var result=this.traceRay(src.x+dx*8,src.y+dy*8,dx,dy,0);
      if(result){
        /* Color varies by ray */
        var hue=(i/N)*360;
        ctx.strokeStyle='hsla('+hue+',80%,65%,0.8)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        result.path.forEach(function(p,idx){
          if(idx===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);
        });
        ctx.stroke();
      }
    }
    setStatsHTML(
      '<div>Elements: '+o.elements.length+'</div>'+
      '<div>Rays: '+o.raySource.numRays+'</div>'+
      '<div>Source angle: '+fmt(o.raySource.angle*180/Math.PI,1)+'°</div>'
    );
    updateBadge('🔦 Ray Optics · '+o.preset);
    $('sbMode').textContent='Optics';
  },
  onDown:function(p){
    var o=STATE.optics;
    o.raySource.x=p.x;
    o.raySource.y=p.y;
  },
  onMove:function(p){
    if(INPUT.down)this.onDown(p);
  },
  onUp:function(){},
  controls:function(){
    var o=STATE.optics;
    var html='';
    html+='<div class="sec"><h4>Setup</h4>';
    html+='<div class="chip-row">';
    [['converging','Convex lens'],['diverging','Concave lens'],['mirror','Mirror'],['prism','Prism'],['refraction','Air→Glass'],['totalInternal','Glass→Air']].forEach(function(p){
      html+='<div class="chip '+(o.preset===p[0]?'active':'')+'" onclick="MODULES.optics.setPreset(\''+p[0]+'\');renderLeftPanel()">'+p[1]+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Light Source</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Angle</span><span>'+fmt(o.raySource.angle*180/Math.PI,0)+'°</span></div>';
    html+='<input type="range" min="-1.57" max="1.57" step="0.05" value="'+o.raySource.angle+'" oninput="STATE.optics.raySource.angle=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Beam spread</span><span>'+fmt(o.raySource.spread,2)+'</span></div>';
    html+='<input type="range" min="0" max="1.5" step="0.02" value="'+o.raySource.spread+'" oninput="STATE.optics.raySource.spread=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Number of rays</span><span>'+o.raySource.numRays+'</span></div>';
    html+='<input type="range" min="1" max="21" step="1" value="'+o.raySource.numRays+'" oninput="STATE.optics.raySource.numRays=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click anywhere on the canvas to move the light source.</div>';
    return html;
  },
  mathPanel:function(){
    var o=STATE.optics;
    return '<div class="sec"><h4>Snell\'s Law</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'n₁·sinθ₁ = n₂·sinθ₂<br><br>'+
      'Where n is the refractive index.<br>'+
      'Air: 1.00, Water: 1.33, Glass: 1.5, Diamond: 2.42'+
      '</div></div>'+
      '<div class="sec"><h4>Total Internal Reflection</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'If n₁>n₂, there\'s a critical angle θc where sinθ₂=1:<br><br>'+
      'θc = arcsin(n₂/n₁)<br><br>'+
      'Beyond θc the ray is 100% reflected. This is how fiber optics work.'+
      '</div></div>'+
      '<div class="sec"><h4>Lens Formula</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      '1/f = 1/v − 1/u<br><br>'+
      'Thin lens approximation: rays parallel to axis converge at focal distance f from lens center.<br><br>'+
      'Convex (f>0): converging<br>Concave (f<0): diverging'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE: ELECTRIC FIELD
   ================================================================ */
registerModule('efield',{
  title:'Electric Field',
  icon:'⚡',
  desc:'Point charges create electric field lines. Superposition of Coulomb fields from multiple charges.',
  init:function(){
    var W=CANV.W,H=CANV.H;
    STATE.efield.charges=[
      {x:W*0.35,y:H/2,q:1},
      {x:W*0.65,y:H/2,q:-1}
    ];
  },
  tick:function(dt){STATE.time+=dt;},
  fieldAt:function(x,y){
    var E=[0,0];
    STATE.efield.charges.forEach(function(c){
      var dx=x-c.x,dy=y-c.y;
      var r2=dx*dx+dy*dy+100;
      var r3=r2*Math.sqrt(r2);
      var k=50000;
      E[0]+=k*c.q*dx/r3;
      E[1]+=k*c.q*dy/r3;
    });
    return E;
  },
  potential:function(x,y){
    var V=0;
    STATE.efield.charges.forEach(function(c){
      var r=Math.sqrt((x-c.x)*(x-c.x)+(y-c.y)*(y-c.y))+10;
      V+=50000*c.q/r;
    });
    return V;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var e=STATE.efield;
    /* Field magnitude background */
    if(e.showField){
      var step=e.resolution;
      for(var y=step/2;y<H;y+=step){
        for(var x=step/2;x<W;x+=step){
          var E=this.fieldAt(x,y);
          var mag=Math.hypot(E[0],E[1]);
          var alpha=Math.min(1,Math.log(1+mag)/8);
          if(alpha<0.02)continue;
          var norm=1/(mag+1e-6);
          var ux=E[0]*norm,uy=E[1]*norm;
          var len=Math.min(step*0.7,4+alpha*step*0.6);
          ctx.strokeStyle='rgba(64,208,255,'+alpha+')';
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(x-ux*len/2,y-uy*len/2);
          ctx.lineTo(x+ux*len/2,y+uy*len/2);
          ctx.stroke();
          /* Arrow head */
          ctx.beginPath();
          var ax=x+ux*len/2,ay=y+uy*len/2;
          ctx.moveTo(ax,ay);
          ctx.lineTo(ax-ux*3-uy*2,ay-uy*3+ux*2);
          ctx.lineTo(ax-ux*3+uy*2,ay-uy*3-ux*2);
          ctx.fillStyle='rgba(64,208,255,'+alpha+')';
          ctx.fill();
        }
      }
    }
    /* Field lines emanating from positive charges */
    e.charges.forEach(function(c){
      if(c.q<=0)return;
      var N=Math.max(6,Math.abs(c.q)*8);
      for(var i=0;i<N;i++){
        var angle=(i/N)*Math.PI*2;
        var px=c.x,py=c.y;
        ctx.strokeStyle='rgba(255,160,48,.6)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(px,py);
        for(var step=0;step<200;step++){
          var E2=this.fieldAt(px,py);
          var m2=Math.hypot(E2[0],E2[1])+1e-6;
          px+=E2[0]/m2*3;
          py+=E2[1]/m2*3;
          ctx.lineTo(px,py);
          if(px<0||px>W||py<0||py>H)break;
          /* Check if hit a negative charge */
          var stop=false;
          e.charges.forEach(function(c2){
            if(c2.q<0&&Math.hypot(px-c2.x,py-c2.y)<8)stop=true;
          });
          if(stop)break;
        }
        ctx.stroke();
      }
    });
    /* Charges */
    e.charges.forEach(function(c){
      var isPos=c.q>0;
      var color=isPos?'#ff5060':'#40d0ff';
      var grad=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,30);
      grad.addColorStop(0,color);
      grad.addColorStop(0.5,color+'80');
      grad.addColorStop(1,color+'00');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(c.x,c.y,30,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(c.x,c.y,14,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 16px monospace';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(isPos?'+':'−',c.x,c.y+1);
      ctx.textBaseline='alphabetic';
    });
    setStatsHTML(
      '<div>Charges: '+e.charges.length+'</div>'+
      '<div>Net Q: '+fmt(e.charges.reduce(function(s,c){return s+c.q},0),2)+'</div>'
    );
    updateBadge('⚡ Electric Field · '+e.charges.length+' charges');
    $('sbMode').textContent='E-Field';
  },
  onDown:function(p){
    var e=STATE.efield;
    /* Check if hit a charge */
    e.dragIdx=-1;
    for(var i=0;i<e.charges.length;i++){
      var c=e.charges[i];
      if(Math.hypot(c.x-p.x,c.y-p.y)<20){e.dragIdx=i;return;}
    }
    /* Otherwise add a new charge (right click = negative, left = positive) */
    var q=p.x<CANV.W/2?1:-1;
    /* Alternate */
    e.charges.push({x:p.x,y:p.y,q:e.charges.length%2===0?1:-1});
  },
  onMove:function(p){
    var e=STATE.efield;
    if(INPUT.down&&e.dragIdx>=0){
      e.charges[e.dragIdx].x=p.x;
      e.charges[e.dragIdx].y=p.y;
    }
  },
  onUp:function(){STATE.efield.dragIdx=-1;},
  controls:function(){
    var e=STATE.efield;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="efieldPreset(\'dipole\')">+ − Dipole</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="efieldPreset(\'quadrupole\')">Quadrupole</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="efieldPreset(\'like\')">Two + charges</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="efieldPreset(\'line\')">Line of charges</button>';
    html+='<button class="btn full sm danger" style="margin-top:4px" onclick="STATE.efield.charges=[]">Clear all</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Display</h4>';
    html+='<div class="ctrl flex-between" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:.68rem;color:var(--tx2)">Field vectors</span><div class="chip '+(e.showField?'active':'')+'" onclick="STATE.efield.showField=!STATE.efield.showField;renderLeftPanel()">'+(e.showField?'ON':'OFF')+'</div></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Vector density</span><span>'+e.resolution+'</span></div>';
    html+='<input type="range" min="12" max="40" step="4" value="'+e.resolution+'" oninput="STATE.efield.resolution=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Charges</h4>';
    if(!e.charges.length)html+='<div class="text-xs text-dim" style="font-family:var(--mono)">No charges.</div>';
    e.charges.forEach(function(c,i){
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.62rem">';
      html+='<span style="color:'+(c.q>0?'var(--c4)':'var(--c2)')+'">q'+(i+1)+' = '+(c.q>0?'+':'')+c.q+'</span>';
      html+='<div><button class="btn sm" onclick="STATE.efield.charges['+i+'].q*=2;renderLeftPanel()">×2</button>';
      html+='<button class="btn sm" onclick="STATE.efield.charges['+i+'].q=-STATE.efield.charges['+i+'].q;renderLeftPanel()" style="margin-left:3px">±</button>';
      html+='<button class="btn sm danger" onclick="STATE.efield.charges.splice('+i+',1);renderLeftPanel()" style="margin-left:3px">✕</button></div>';
      html+='</div>';
    });
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click to add charge. Drag to move.</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Coulomb\'s Law</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'For a point charge Q at position r₀:<br><br>'+
      'E(r) = k·Q·(r−r₀) / |r−r₀|³<br><br>'+
      'k = 1/(4πε₀) ≈ 8.99×10⁹ N·m²/C²'+
      '</div></div>'+
      '<div class="sec"><h4>Superposition</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'For multiple charges:<br>'+
      'E_total = Σᵢ Eᵢ(r)<br><br>'+
      'Electric potential:<br>'+
      'V(r) = Σᵢ k·Qᵢ / |r−rᵢ|'+
      '</div></div>'+
      '<div class="sec"><h4>Field lines</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Field lines start on positive charges and end on negative charges. Density of lines ∝ |E|. '+
      'Traced by integrating dr/ds = E/|E|.'+
      '</div></div>';
  }
});
function efieldPreset(name){
  var W=CANV.W,H=CANV.H;
  var e=STATE.efield;
  e.charges=[];
  if(name==='dipole'){
    e.charges=[{x:W*0.35,y:H/2,q:1},{x:W*0.65,y:H/2,q:-1}];
  } else if(name==='quadrupole'){
    e.charges=[
      {x:W*0.35,y:H*0.35,q:1},
      {x:W*0.65,y:H*0.35,q:-1},
      {x:W*0.35,y:H*0.65,q:-1},
      {x:W*0.65,y:H*0.65,q:1}
    ];
  } else if(name==='like'){
    e.charges=[{x:W*0.35,y:H/2,q:1},{x:W*0.65,y:H/2,q:1}];
  } else if(name==='line'){
    for(var i=0;i<6;i++){
      e.charges.push({x:W*0.3+i*W*0.08,y:H/2,q:i%2===0?1:-1});
    }
  }
  renderLeftPanel();
}

<script>
/* ================================================================
   MODULE: COLLISIONS
   ================================================================ */
registerModule('collisions',{
  title:'Elastic Collisions',
  icon:'💥',
  desc:'Balls with realistic elastic collisions. Momentum and energy are conserved when restitution = 1.',
  init:function(){
    this.reset();
  },
  reset:function(){
    var c=STATE.collisions;
    var W=CANV.W,H=CANV.H;
    c.balls=[];
    for(var i=0;i<c.N;i++){
      var r=c.ballRadius;
      var ball={
        x:rndF(r*2,W-r*2),
        y:rndF(r*2,H*0.7),
        vx:rndF(-150,150),
        vy:rndF(-150,50),
        m:r*0.3,
        r:r,
        c:pickColor(),
        trail:[]
      };
      c.balls.push(ball);
    }
  },
  tick:function(dt){
    var c=STATE.collisions;
    if(c.paused)return;
    var W=CANV.W,H=CANV.H;
    /* Integrate */
    c.balls.forEach(function(b){
      b.vy+=c.gravity*dt;
      b.vx*=(1-0.001);
      b.vy*=(1-0.001);
      b.x+=b.vx*dt;
      b.y+=b.vy*dt;
      /* Trails */
      b.trail.push([b.x,b.y]);
      if(b.trail.length>40)b.trail.shift();
    });
    /* Walls */
    if(c.walls){
      c.balls.forEach(function(b){
        if(b.x-b.r<0){b.x=b.r;b.vx=-b.vx*c.restitution;}
        if(b.x+b.r>W){b.x=W-b.r;b.vx=-b.vx*c.restitution;}
        if(b.y-b.r<0){b.y=b.r;b.vy=-b.vy*c.restitution;}
        if(b.y+b.r>H){b.y=H-b.r;b.vy=-b.vy*c.restitution;b.vx*=0.98;}
      });
    }
    /* Ball-ball collisions */
    for(var i=0;i<c.balls.length;i++){
      for(var j=i+1;j<c.balls.length;j++){
        var a=c.balls[i],b2=c.balls[j];
        var dx=b2.x-a.x,dy=b2.y-a.y;
        var d=Math.hypot(dx,dy);
        var minD=a.r+b2.r;
        if(d<minD&&d>0.001){
          /* Separate */
          var overlap=(minD-d)/2;
          var nx=dx/d,ny=dy/d;
          a.x-=nx*overlap;a.y-=ny*overlap;
          b2.x+=nx*overlap;b2.y+=ny*overlap;
          /* Elastic collision (1D along normal) */
          var rvx=b2.vx-a.vx,rvy=b2.vy-a.vy;
          var vn=rvx*nx+rvy*ny;
          if(vn>0)continue;/* separating already */
          var mA=a.m,mB=b2.m;
          var jImp=-(1+c.restitution)*vn/(1/mA+1/mB);
          a.vx-=jImp*nx/mA;a.vy-=jImp*ny/mA;
          b2.vx+=jImp*nx/mB;b2.vy+=jImp*ny/mB;
        }
      }
    }
    STATE.time+=dt;
    STATE.steps++;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02040a';
    ctx.fillRect(0,0,W,H);
    var c=STATE.collisions;
    /* Trails */
    c.balls.forEach(function(b){
      if(b.trail.length<2)return;
      ctx.strokeStyle=b.c+'40';
      ctx.lineWidth=1;
      ctx.beginPath();
      for(var i=0;i<b.trail.length;i++){
        var t=b.trail[i];
        if(i===0)ctx.moveTo(t[0],t[1]);else ctx.lineTo(t[0],t[1]);
      }
      ctx.stroke();
    });
    /* Balls */
    c.balls.forEach(function(b){
      var grad=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
      grad.addColorStop(0,'#fff');
      grad.addColorStop(0.4,b.c);
      grad.addColorStop(1,b.c+'80');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.4)';
      ctx.lineWidth=1;
      ctx.stroke();
      /* Velocity vector */
      if(c.showVectors){
        ctx.strokeStyle='rgba(64,255,144,.6)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(b.x,b.y);
        ctx.lineTo(b.x+b.vx*0.15,b.y+b.vy*0.15);
        ctx.stroke();
      }
    });
    /* Energy */
    var KE=0,PE=0;
    c.balls.forEach(function(b){
      KE+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);
      PE+=b.m*c.gravity*(H-b.y);
    });
    setStatsHTML(
      '<div>Balls: '+c.balls.length+'</div>'+
      '<div>KE: '+fmt(KE,0)+'</div>'+
      '<div>PE: '+fmt(PE,0)+'</div>'+
      '<div>E total: '+fmt(KE+PE,0)+'</div>'+
      '<div>Restitution: '+c.restitution.toFixed(2)+'</div>'
    );
    updateBadge('💥 Collisions · '+c.balls.length+' balls · e='+c.restitution.toFixed(2));
    $('sbMode').textContent='Collisions';
    $('sbBodies').textContent=c.balls.length;
    $('sbEnergy').textContent=fmt(KE+PE,0);
  },
  onDown:function(p){
    /* Grab nearest ball and fling */
    var c=STATE.collisions;
    c.dragBall=null;
    for(var i=c.balls.length-1;i>=0;i--){
      var b=c.balls[i];
      if(Math.hypot(b.x-p.x,b.y-p.y)<b.r*1.5){
        c.dragBall=i;
        c._dragPrev=[p.x,p.y];
        return;
      }
    }
    /* Add new ball */
    c.balls.push({
      x:p.x,y:p.y,vx:0,vy:0,m:c.ballRadius*0.3,r:c.ballRadius,
      c:pickColor(),trail:[]
    });
  },
  onMove:function(p){
    var c=STATE.collisions;
    if(INPUT.down&&c.dragBall!=null){
      var b=c.balls[c.dragBall];
      var prev=c._dragPrev;
      b.vx=(p.x-prev[0])*30;
      b.vy=(p.y-prev[1])*30;
      b.x=p.x;b.y=p.y;
      c._dragPrev=[p.x,p.y];
