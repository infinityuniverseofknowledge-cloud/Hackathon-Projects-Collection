<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CIPHER — Cryptography & Security Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#03080a;--bg2:#06120e;--bg3:#0a1c14;--bg4:#0f2a1c;
  --panel:#06120e;--panel2:#0a1c14;--panel3:#0f2a1c;--panel4:#154028;
  --bd:#0a2418;--bd2:#184830;--bd3:#28705a;
  --tx:#d0ffd8;--tx2:#80c0a0;--tx3:#4a8060;--mu:#2a5040;
  --c1:#40ff80;--c1h:#80ffb0;--c1l:#20c060;
  --c2:#ffd040;--c2h:#ffe880;--c2l:#c0a020;
  --c3:#40d0ff;--c3h:#80e0ff;--c3l:#2090c0;
  --c4:#ff60a0;--c4h:#ff90c0;--c4l:#c03080;
  --c5:#c060ff;--c5h:#d090ff;--c5l:#8030c0;
  --c6:#ff8040;--c6h:#ffa870;--c6l:#c05020;
  --ok:#40ff80;--warn:#ffd040;--err:#ff60a0;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40ff80,#40d0ff);
  --g2:linear-gradient(135deg,#ffd040,#ff8040);
  --gHolo:linear-gradient(120deg,#40ff80,#ffd040,#40d0ff,#ff60a0,#c060ff,#40ff80);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f8f0;--bg2:#e0f0e0;--bg3:#d0e8d0;--panel:#fff;--panel2:#f0f8f0;--panel3:#e0f0e0;
  --bd:#c0d8c0;--bd2:#a0c0a0;--tx:#0a2010;--tx2:#306040;--tx3:#609080;
  --c1:#00a040;--c2:#a08000;--c3:#0060a0;--c4:#c02060;--c5:#8030c0;--c6:#c05020;
  --g1:linear-gradient(135deg,#00a040,#0060a0)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101014;--bg3:#18181e;--panel:#101014;--panel2:#18181e;--panel3:#202028;
  --bd:#282830;--bd2:#404048;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#03080a;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-lock{width:140px;height:140px;margin-bottom:20px;position:relative}
.boot-lock svg{width:100%;height:100%}
.boot-lock .shackle{animation:unlock 2.4s ease-in-out infinite}
.boot-lock .keyhole{animation:glow 1.6s ease-in-out infinite}
@keyframes unlock{0%,45%{transform:translateY(0)}55%,100%{transform:translateY(-18px)}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1;filter:drop-shadow(0 0 12px #40ff80)}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.66rem;color:#40ff80;letter-spacing:10px;margin-bottom:26px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#0a1c14;border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40ff80}
.boot-pct{font-size:.66rem;color:#40ff80;margin-bottom:14px}
.boot-log{font-size:.58rem;color:#4a8060;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff80}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#03080a;box-shadow:0 0 12px rgba(64,255,128,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#0a1c14;transition:var(--t1)}
.tb-status .dot.on{background:var(--c1);box-shadow:0 0 10px var(--c1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#02060a;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(6,18,14,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,255,128,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#03080a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(64,255,128,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.warn{color:var(--c2);border-color:var(--c2)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#03080a;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c1)}.toast.warn{border-left-color:var(--c2)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-lock">
    <svg viewBox="0 0 100 100">
      <path class="shackle" d="M30 45 V30 Q30 15 50 15 Q70 15 70 30 V45" fill="none" stroke="#40ff80" stroke-width="5" stroke-linecap="round"/>
      <rect x="20" y="45" width="60" height="45" rx="6" fill="#0a1c14" stroke="#40ff80" stroke-width="3"/>
      <circle class="keyhole" cx="50" cy="65" r="5" fill="#ffd040"/>
      <rect class="keyhole" x="47" y="65" width="6" height="12" fill="#ffd040"/>
    </svg>
  </div>
  <div class="boot-logo">CIPHER</div>
  <div class="boot-sub">CRYPTOGRAPHY LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('classical')">CIPHER</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">secure</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Key</span><span class="sb-val c2" id="sbKey">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Entropy</span><span class="sb-val c3" id="sbEntropy">—</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Bits</span><span class="sb-val c4" id="sbBits">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Strength</span><span class="sb-val c5" id="sbStrength">—</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Classical</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:.95rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}

/* ================================================================
   MATH UTILITIES (BigInt, primes, modular arithmetic)
   ================================================================ */
function modpow(base,exp,mod){
  /* All BigInt */
  base=BigInt(base);exp=BigInt(exp);mod=BigInt(mod);
  var r=1n;
  base=((base%mod)+mod)%mod;
  while(exp>0n){
    if(exp&1n)r=(r*base)%mod;
    exp>>=1n;
    base=(base*base)%mod;
  }
  return r;
}
function egcd(a,b){
  if(b===0n)return [a,1n,0n];
  var r=egcd(b,a%b);
  return [r[0],r[2],r[1]-(a/b)*r[2]];
}
function modinv(a,m){
  var r=egcd(a,m);
  return ((r[1]%m)+m)%m;
}
function gcdBig(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){var t=b;b=a%b;a=t}return a}
/* Miller-Rabin primality test */
function isPrime(n){
  n=BigInt(n);
  if(n<2n)return false;
  if(n===2n||n===3n)return true;
  if(n%2n===0n)return false;
  var d=n-1n,r=0n;
  while(d%2n===0n){d/=2n;r++}
  /* Deterministic for n < 3.3e24 with these bases */
  var witnesses=[2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n];
  for(var i=0;i<witnesses.length;i++){
    var a=witnesses[i];
    if(a>=n)continue;
    var x=modpow(a,d,n);
    if(x===1n||x===n-1n)continue;
    var cont=false;
    for(var j=0n;j<r-1n;j++){
      x=(x*x)%n;
      if(x===n-1n){cont=true;break;}
    }
    if(!cont)return false;
  }
  return true;
}
function randomPrime(bits){
  var min=1n<<BigInt(bits-1);
  var max=(1n<<BigInt(bits))-1n;
  for(var attempt=0;attempt<2000;attempt++){
    /* Random odd number in range */
    var n=min;
    for(var i=1;i<bits;i++){
      if(Math.random()<0.5)n|=1n<<BigInt(i);
    }
    n|=1n; /* odd */
    if(isPrime(n))return n;
  }
  /* Fallback: known primes */
  return 104729n;
}
/* Classical FNV-1a style hash producing arbitrary bits */
function hashString(str,bits){
  bits=bits||256;
  /* Simple but real avalanche: FNV-1a with multiple rounds */
  var hash=new Array(bits);
  for(var i=0;i<bits;i++){
    var h=2166136261>>>0;
    var seed=i;
    for(var j=0;j<str.length;j++){
      h^=str.charCodeAt(j)+seed;
      h=Math.imul(h,16777619)>>>0;
    }
    hash[i]=h;
  }
  /* Mixing rounds for diffusion */
  for(var round=0;round<3;round++){
    var newH=hash.slice();
    for(var i=0;i<bits;i++){
      newH[i]=(hash[i]^hash[(i+1)%bits]^(hash[(i+7)%bits]<<3))>>>0;
      newH[i]=Math.imul(newH[i],2654435761)>>>0;
    }
    hash=newH;
  }
  return hash;
}
function hashToHex(hash){
  return hash.map(function(h){return (h>>>0).toString(16).padStart(8,'0')}).join('');
}
/* Shannon entropy of a string */
function shannonEntropy(str){
  if(!str.length)return 0;
  var freq={};
  for(var i=0;i<str.length;i++)freq[str[i]]=(freq[str[i]]||0)+1;
  var H=0;
  for(var c in freq){
    var p=freq[c]/str.length;
    H-=p*Math.log2(p);
  }
  return H;
}
/* Password entropy estimate (bits) */
function passwordBits(str){
  if(!str.length)return 0;
  var sets=0;
  if(/[a-z]/.test(str))sets+=26;
  if(/[A-Z]/.test(str))sets+=26;
  if(/[0-9]/.test(str))sets+=10;
  if(/[^a-zA-Z0-9]/.test(str))sets+=33;
  if(sets===0)return 0;
  return str.length*Math.log2(sets);
}
function crackTime(bits){
  /* Assume 1e12 guesses/sec */
  var guesses=Math.pow(2,bits)/2;
  var seconds=guesses/1e12;
  if(seconds<1)return '<1s';
  if(seconds<60)return fmt(seconds,1)+'s';
  if(seconds<3600)return fmt(seconds/60,1)+'min';
  if(seconds<86400)return fmt(seconds/3600,1)+'h';
  if(seconds<31536000)return fmt(seconds/86400,1)+'d';
  var years=seconds/31536000;
  if(years<1e3)return fmt(years,0)+'y';
  if(years<1e6)return fmt(years/1e3,1)+'ky';
  if(years<1e9)return fmt(years/1e6,1)+'My';
  if(years<1e12)return fmt(years/1e9,1)+'Gy';
  return '> universe age';
}

   ================================================================ */
function caesarCipher(text,shift){
  return text.toUpperCase().split('').map(function(c){
    if(c>='A'&&c<='Z'){
      var code=c.charCodeAt(0)-65;
      return String.fromCharCode(((code+shift)%26+26)%26+65);
    }
    return c;
  }).join('');
}
function vigenereCipher(text,key){
  key=key.toUpperCase().replace(/[^A-Z]/g,'');
  if(!key.length)key='A';
  return text.toUpperCase().split('').map(function(c,i){
    if(c>='A'&&c<='Z'){
      var k=key.charCodeAt(i%key.length)-65;
      var code=c.charCodeAt(0)-65;
      return String.fromCharCode((code+k)%26+65);
    }
    return c;
  }).join('');
}
function vigenereDecrypt(text,key){
  key=key.toUpperCase().replace(/[^A-Z]/g,'');
  if(!key.length)key='A';
  return text.toUpperCase().split('').map(function(c,i){
    if(c>='A'&&c<='Z'){
      var k=key.charCodeAt(i%key.length)-65;
      var code=c.charCodeAt(0)-65;
      return String.fromCharCode(((code-k)%26+26)%26+65);
    }
    return c;
  }).join('');
}
function xorCipher(text,key){
  var out='';
  for(var i=0;i<text.length;i++){
    out+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));
  }
  return out;
}
function frequencyAnalysis(text){
  var freq={};
  for(var i=0;i<26;i++)freq[String.fromCharCode(65+i)]=0;
  var letters=0;
  for(var i=0;i<text.length;i++){
    var c=text[i].toUpperCase();
    if(c>='A'&&c<='Z'){freq[c]++;letters++}
  }
  var out={};
  for(var k in freq)out[k]=letters?freq[k]/letters:0;
  return {freq:out,letters:letters};
}
/* Cracker: try all 26 shifts, score by chi-squared against English */
var ENGLISH_FREQ={A:8.167,B:1.492,C:2.782,D:4.253,E:12.702,F:2.228,G:2.015,H:6.094,I:6.966,J:0.153,K:0.772,L:4.025,M:2.406,N:6.749,O:7.507,P:1.929,Q:0.095,R:5.987,S:6.327,T:9.056,U:2.758,V:0.978,W:2.360,X:0.150,Y:1.974,Z:0.074};
function chiSquared(freq,letters){
  if(!letters)return Infinity;
  var chi=0;
  for(var c in ENGLISH_FREQ){
    var obs=freq[c]*letters;
    var exp=ENGLISH_FREQ[c]/100*letters;
    chi+=Math.pow(obs-exp,2)/Math.max(0.001,exp);
  }
  return chi;
}

registerModule('rsa',{
  title:'RSA Encryption',
  icon:'🔐',
  desc:'Generate real RSA keys with Miller-Rabin prime testing, encrypt text with modular exponentiation, and decrypt. Uses BigInt for arbitrary precision.',
  init:function(){
    this.generateKeys();
    logMsg('RSA: key generation initialized','success');
  },
  generateKeys:function(){
    var r=STATE.rsa;
    r.p=randomPrime(r.bits);
    var q=null;
    /* Ensure p ≠ q */
    do { q=randomPrime(r.bits); } while(q===r.p);
    r.q=q;
    r.n=r.p*r.q;
    r.phi=(r.p-1n)*(r.q-1n);
    /* Choose e coprime to phi */
    r.e=65537n;
    while(gcdBig(r.e,r.phi)!==1n)r.e+=2n;
    /* d = e^-1 mod phi */
    r.d=modinv(r.e,r.phi);
    r.message='HI';
    this.encrypt();
    logMsg('RSA: p='+r.p+' q='+r.q+' n='+r.n+'',' success');
  },
  encrypt:function(){
    var r=STATE.rsa;
    if(!r.n)return;
    /* Convert message to number (base 256) */
    var text=r.message.substring(0,8);
    var m=0n;
    for(var i=0;i<text.length;i++)m=(m<<8n)|BigInt(text.charCodeAt(i));
    if(m>=r.n){
      /* Message too long — truncate */
      text=text.substring(0,4);
      m=0n;
      for(var j=0;j<text.length;j++)m=(m<<8n)|BigInt(text.charCodeAt(j));
    }
    r.mRaw=m;
    r.ciphertext=modpow(m,r.e,r.n);
    r.decrypted=modpow(r.ciphertext,r.d,r.n);
    /* Convert back to string */
    var dec='';
    var d=r.decrypted;
    while(d>0n){
      dec=String.fromCharCode(Number(d&0xFFn))+dec;
      d>>=8n;
    }
    r.decryptedText=dec;
  },

registerModule('hash',{
  title:'Hash Function',
  icon:'#️⃣',
  desc:'Real avalanche effect visualization. Change one bit of input and see how many output bits flip. This is the foundation of cryptographic hashing.',
  init:function(){
    this.compute();
    logMsg('Hash: initialized, '+STATE.hash.bits+' bits','success');
  },
  compute:function(){
    var h=STATE.hash;
    h.hash=hashString(h.input,h.bits);
    h.hashHex=hashToHex(h.hash);
    /* Compute avalanche: flip one bit of input, see output changes */
    var orig=h.hash;
    var flip=hashString(h.input+'X',h.bits); /* Simple perturbation */
    h.avalanche=[];
    var flips=0;
    for(var i=0;i<h.bits;i++){
      var xored=(orig[i]^flip[i])>>>0;
      var changed=0;
      for(var b=0;b<32;b++)if((xored>>>b)&1)changed++;
      h.avalanche.push(changed);
      flips+=changed;
    }
    h.avalancheRate=flips/(h.bits*32);
  },
  tick:function(dt){STATE.time+=dt;},
  step:function(){ this.compute(); },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02060a';
    ctx.fillRect(0,0,W,H);
    var h=STATE.hash;
    if(!h.hash)return;
    var pad=30;
    var y=40;
    drawGlowText(ctx,'HASH FUNCTION · '+h.bits+' BITS','#40ff80',pad,y,'#40ff80',14);
    y+=30;
    /* Input */
    drawTextBox(ctx,pad,y,W-2*pad,50,'INPUT',h.input,'#40d0ff');
    y+=70;
    /* Arrow */
    ctx.strokeStyle='#40ff80';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W/2,y);ctx.lineTo(W/2,y+24);ctx.stroke();
    ctx.fillStyle='#40ff80';
    ctx.beginPath();ctx.moveTo(W/2,y+24);ctx.lineTo(W/2-8,y+16);ctx.lineTo(W/2+8,y+16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';
    ctx.fillText('hash(input) — '+h.bits+' rounds of mixing',W/2,y+44);
    y+=60;
    /* Hash output as hex grid */
    ctx.fillStyle='rgba(6,18,14,.7)';
    ctx.strokeStyle='rgba(255,208,64,.4)';
    ctx.beginPath();ctx.roundRect(pad,y,W-2*pad,90,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('DIGEST (hex)',pad+14,y+20);
    var hex=h.hashHex;
    ctx.font='11px monospace';
    ctx.fillStyle='#d0ffd8';
    ctx.textAlign='left';
    /* Wrap into lines */
    var lineLen=Math.floor((W-2*pad-28)/7);
    for(var i=0;i<Math.min(6,Math.ceil(hex.length/lineLen));i++){
      ctx.fillText(hex.substring(i*lineLen,(i+1)*lineLen),pad+14,y+38+i*14);
    }
    y+=110;
    /* Avalanche visualization */
    if(h.avalanche&&h.avalanche.length>0){
      ctx.fillStyle='rgba(6,18,14,.7)';
      ctx.strokeStyle='rgba(192,96,255,.4)';
      var avH=Math.min(220,H-y-40);
      if(avH>100){
        ctx.beginPath();ctx.roundRect(pad,y,W-2*pad,avH,8);ctx.fill();ctx.stroke();
        ctx.fillStyle='#c060ff';
        ctx.font='bold 11px monospace';
        ctx.textAlign='left';
        ctx.fillText('AVALANCHE EFFECT',pad+14,y+20);
        ctx.fillStyle='#d0ffd8';
        ctx.font='10px monospace';
        ctx.fillText('Each word of output vs. one-character input change:',pad+14,y+38);
        /* Heatmap grid */
        var cols=16;
        var rows=Math.ceil(h.bits/cols);
        var cellW=(W-2*pad-28)/cols;
        var cellH=Math.min(20,(avH-60)/rows);
        for(var i=0;i<h.bits;i++){
          var ci=i%cols,ri=Math.floor(i/cols);
          var v=h.avalanche[i]; /* 0..32 flips */
          var intensity=v/32;
          var cx=pad+14+ci*cellW;
          var cy=y+54+ri*cellH;
          ctx.fillStyle='rgb('+Math.round(intensity*200+30)+','+Math.round((1-intensity)*80+40)+','+Math.round(intensity*100+80)+')';
          ctx.fillRect(cx,cy,cellW-1,cellH-1);
          /* Bit count */
          if(cellW>24&&cellH>14){
            ctx.fillStyle='#ffffff';
            ctx.font='8px monospace';
            ctx.textAlign='center';
            ctx.fillText(v,cx+cellW/2-0.5,cy+cellH/2+3);
          }
        }
        /* Stats row */
        ctx.fillStyle='#ffd040';
        ctx.font='bold 11px monospace';
        ctx.textAlign='left';
        ctx.fillText('Flip rate: '+fmt(h.avalancheRate*100,1)+'%  (ideal ≈ 50%)',pad+14,y+avH-10);
      }
    }
    setStatsHTML(
      '<div>Bits: '+h.bits+'</div>'+
      '<div>Hex len: '+h.hashHex.length+'</div>'+
      '<div>Flip rate: '+fmt(h.avalancheRate*100,1)+'%</div>'+
      '<div>Input len: '+h.input.length+'</div>'
    );
    updateBadge('#️⃣ Hash · '+h.bits+' bits · avalanche '+fmt(h.avalancheRate*100,1)+'%');

    html+='</div>';
    html+='<div class="sec"><h4>Try these</h4><div class="chip-row">';
    ['hello world','hello worle','hello world!','Hello World','','a','The quick brown fox'].forEach(function(s){
      html+='<div class="chip" onclick="STATE.hash.input=\''+s+'\';MODULES.hash.compute();renderLeftPanel()">'+esc(s.substring(0,18)||'(empty)')+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Digest (hex)</h4>';
    html+='<div style="font-family:var(--mono);font-size:.55rem;line-height:1.6;color:var(--c2);word-break:break-all;background:var(--bg);padding:8px;border:1px solid var(--bd);border-radius:4px;max-height:150px;overflow:auto">'+h.hashHex+'</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Properties</h4>';
    html+='<div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)">'+
      '<b style="color:var(--c1)">Deterministic:</b> same input → same hash<br>'+
      '<b style="color:var(--c1)">Avalanche:</b> tiny change → ~50% bits flip<br>'+
      '<b style="color:var(--c1)">One-way:</b> can\'t invert<br>'+
      '<b style="color:var(--c1)">Collision-resistant:</b> hard to find two inputs with same hash'+

  },
  mathPanel:function(){

      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+

      '<b style="color:var(--c1)">Second preimage:</b> given x, hard to find x\'≠x with h(x)=h(x\')<br>'+

var DH_PRIMES=[
  {p:23n,g:5n},
  {p:47n,g:5n},
  {p:97n,g:5n},
  {p:191n,g:19n},
  {p:251n,g:6n},
  {p:467n,g:2n},
  {p:1009n,g:11n},
  {p:2003n,g:5n}
];
registerModule('dh',{
  title:'Diffie-Hellman',
  icon:'🔑',
  desc:'Interactive key exchange. Alice and Bob agree on a shared secret over an insecure channel. Toggle Eve to see a man-in-the-middle attack.',
  init:function(){
    this.setup();
    logMsg('Diffie-Hellman: initialized','success');
  },
  setup:function(){
    var d=STATE.dh;
    var pset=DH_PRIMES[DH_PRIMES.length-2];
    d.p=pset.p;
    d.g=pset.g;
    d.aliceSecret=BigInt(rnd(2,20));
    d.bobSecret=BigInt(rnd(2,20));

function dhSetPrime(i){
  var pset=DH_PRIMES[i];
  var d=STATE.dh;
  d.p=pset.p;d.g=pset.g;
  if(d.aliceSecret>=d.p)d.aliceSecret=2n;
  if(d.bobSecret>=d.p)d.bobSecret=2n;
  MODULES.dh.setup();
}

}

function blockHash(index,prevHash,data,nonce){
  var str=index+'|'+prevHash+'|'+data+'|'+nonce;
  /* Simple deterministic hash from string */
  var h=0n;
  for(var i=0;i<str.length;i++){
    h=((h*31n)+BigInt(str.charCodeAt(i)))&((1n<<64n)-1n);
    h^=(h<<13n);
    h^=(h>>7n);
    h^=(h<<17n);
    h=h&((1n<<64n)-1n);
  }
  /* 16 hex chars */
  return h.toString(16).padStart(16,'0');
}
function meetsDifficulty(hash,difficulty){
  for(var i=0;i<difficulty;i++){
    if(hash[i]!=='0')return false;
  }
  return true;
}
registerModule('chain',{
  title:'Blockchain',
  icon:'⛓️',
  desc:'Real proof-of-work mining. Mine blocks with nonce increment, watch difficulty adjust, tamper with the chain and see hashes fail.',
  init:function(){
    this.initChain();
    logMsg('Blockchain: genesis + 2 blocks mined','success');
  },
  initChain:function(){
    var c=STATE.chain;
    c.blocks=[];
    /* Genesis */
    var genesis={index:0,prevHash:'0'.repeat(16),data:'Genesis Block',nonce:0,hash:'',timestamp:Date.now()};
    genesis.hash=blockHash(genesis.index,genesis.prevHash,genesis.data,genesis.nonce);
    /* Mine genesis to difficulty */
    while(!meetsDifficulty(genesis.hash,c.difficulty)){
      genesis.nonce++;
      genesis.hash=blockHash(genesis.index,genesis.prevHash,genesis.data,genesis.nonce);
      if(genesis.nonce>500000)break;
    }
    c.blocks.push(genesis);
    /* Two more blocks */
    this.addBlockMined('Alice → Bob: 5 BTC');
    this.addBlockMined('Bob → Carol: 2 BTC');
    c.tampered=false;
  },
  addBlockMined:function(data){
    var c=STATE.chain;
    var prev=c.blocks[c.blocks.length-1];
    var block={index:c.blocks.length,prevHash:prev.hash,data:data,nonce:0,hash:'',timestamp:Date.now()};
    /* Mine */
    while(!meetsDifficulty(block.hash,c.difficulty)){
      block.nonce++;
      block.hash=blockHash(block.index,block.prevHash,block.data,block.nonce);
      if(block.nonce>1000000)break;
    }
    c.blocks.push(block);
  },
  mineCurrent:function(){
    var c=STATE.chain;
    var prev=c.blocks[c.blocks.length-1];
    var block={index:c.blocks.length,prevHash:prev.hash,data:'New block · '+new Date().toLocaleTimeString(),nonce:0,hash:'',timestamp:Date.now()};
    c.mining=true;
    c.currentNonce=0;
    logMsg('Mining block '+block.index+' at difficulty '+c.difficulty,'info');
    var self=this;
    var step=function(){
      var b=block;
      b.nonce=c.currentNonce;
      b.hash=blockHash(b.index,b.prevHash,b.data,b.nonce);
      c.currentHash=b.hash;
      if(meetsDifficulty(b.hash,c.difficulty)){
        c.blocks.push(b);
        c.mining=false;
        logMsg('Block '+b.index+' mined! nonce='+b.nonce,'success');
        toast('Block mined in '+b.nonce+' hashes','success');
        return;
      }
      c.currentNonce++;
      if(c.currentNonce>500000){
        c.mineBatch=true;
        return;
      }
      if(c.mineBatch){
        /* Batched step (fast) */
        for(var k=0;k<3000;k++){
          c.currentNonce++;
          b.nonce=c.currentNonce;
          b.hash=blockHash(b.index,b.prevHash,b.data,b.nonce);
          if(meetsDifficulty(b.hash,c.difficulty)){
            c.currentHash=b.hash;
            c.blocks.push(b);
            c.mining=false;
            c.mineBatch=false;
            logMsg('Block '+b.index+' mined! nonce='+b.nonce,'success');
            toast('Block mined in '+b.nonce+' hashes','success');
            return;
          }
        }
      }
      requestAnimationFrame(step);
    };
    c.mineBatch=false;
    requestAnimationFrame(step);
  },
  tamper:function(){
    var c=STATE.chain;
    if(c.blocks.length<2)return;
    /* Modify a non-genesis block */
    c.blocks[1].data='⚠ TAMPERED: Eve → Mallory: 9999 BTC';
    /* Recompute hashes without re-mining */
    for(var i=1;i<c.blocks.length;i++){
      c.blocks[i].hash=blockHash(c.blocks[i].index,c.blocks[i].prevHash,c.blocks[i].data,c.blocks[i].nonce);
    }
    c.tampered=true;
    logMsg('Chain tampered! Block 1 data modified','warn');
    toast('Chain tampered! Watch validation fail','error');
  },
  validate:function(){
    var c=STATE.chain;
    for(var i=1;i<c.blocks.length;i++){
      var b=c.blocks[i];
      var recomputed=blockHash(b.index,b.prevHash,b.data,b.nonce);
      if(recomputed!==b.hash)return {ok:false,index:i,reason:'hash mismatch'};
      if(b.prevHash!==c.blocks[i-1].hash)return {ok:false,index:i,reason:'prevHash mismatch'};
      if(!meetsDifficulty(b.hash,c.difficulty))return {ok:false,index:i,reason:'difficulty not met'};
    }
    return {ok:true};
  },
  tick:function(dt){
    STATE.time+=dt;
  },
  step:function(){ this.mineCurrent(); },
  draw:function(ctx){

    html+='</div>';
    html+='<div class="sec"><h4>Chain state</h4><div class="kv">';
    html+='<div class="row"><span class="k">Blocks</span><span class="v">'+c.blocks.length+'</span></div>';
    html+='<div class="row"><span class="k">Total work</span><span class="v">'+c.blocks.reduce(function(s,b){return s+b.nonce},0)+' hashes</span></div>';
    html+='<div class="row"><span class="k">Valid</span><span class="v" style="color:'+(val.ok?'var(--c1)':'var(--err)')+'">'+(val.ok?'YES':'NO')+'</span></div>';
    if(!val.ok){
      html+='<div class="row"><span class="k">Reason</span><span class="v" style="color:var(--err)">'+val.reason+' at #'+val.index+'</span></div>';
    }
    html+='</div></div>';
    html+='<div class="sec"><h4>Blocks</h4>';
    html+='<div style="font-family:var(--mono);font-size:.55rem;line-height:1.65;color:var(--tx2);max-height:200px;overflow:auto">';
    c.blocks.forEach(function(b){
      var meets=meetsDifficulty(b.hash,c.difficulty);
      html+='<div style="padding:4px 6px;border-left:2px solid '+(meets?'var(--c1)':'var(--err)')+';margin-bottom:3px;background:var(--panel3);border-radius:2px">'+
        '<div style="color:'+(meets?'var(--c1)':'var(--err)')+';font-weight:700">#'+b.index+' nonce='+b.nonce+'</div>'+
        '<div style="color:var(--tx3)">'+b.hash.substring(0,20)+'…</div>'+
        '<div style="color:var(--tx2)">'+esc(b.data.substring(0,40))+'</div>'+
        '</div>';
    });
    html+='</div></div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.chain;
    return '<div class="sec"><h4>Proof of Work</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Find nonce such that:<br>'+
      'hash(block || nonce) &lt; target<br><br>'+
      'target = 16^(-difficulty) · maxHash<br><br>'+
      'Expected hashes: 16^difficulty<br>'+
      'Current: 16^'+c.difficulty+' = '+Math.pow(16,c.difficulty).toLocaleString()+
      '</div></div>'+
      '<div class="sec"><h4>Chain linkage</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Each block contains prevHash.<br><br>'+
      'Tampering with block i changes its hash → next block&apos;s prevHash no longer matches → all subsequent blocks become invalid.<br><br>'+
      'To rewrite history you must re-mine all blocks — expensive.'+
      '</div></div>'+
      '<div class="sec"><h4>51% attack</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'If an attacker controls >50% of hash power, they can:<br>'+
      '• mine a competing chain faster<br>'+
      '• reverse their own transactions<br>'+
      '• censor blocks<br><br>'+
      'Cannot steal coins or create them from nothing (in Bitcoin).'+
      '</div></div>';
  }
});
</script>
<script>
var TABS=[
  {key:'classical',icon:'📜',label:'Classical'},
  {key:'rsa',icon:'🔐',label:'RSA'},
  {key:'hash',icon:'#️⃣',label:'Hash'},
  {key:'dh',icon:'🔑',label:'Diffie-Hellman'},
  {key:'chain',icon:'⛓️',label:'Blockchain'}
];
function buildTabs(){
  var tabs=$('tbTabs');tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active')});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active')});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');if(!body)return;
  var m=MODULES[STATE.currentTab];if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.7rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4><div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div style="font-size:.6rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b style="color:var(--c1)">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.6rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c1)':l.type==='warn'?'var(--c2)':'var(--c3)';
    html+='<div style="padding:3px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Running':'Paused','info',900);
}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900);}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['matrix','light','mono'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function showHelp(){
  openModal('❓ CIPHER — Help',
    '<div class="sec"><h4>🔐 About</h4><div style="font-size:.62rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)">A hands-on cryptography workbench in one HTML file. Real BigInt RSA key generation, real hash avalanche analysis, real DH key exchange, and a real proof-of-work blockchain — no servers, no dependencies.</div></div>'+
    '<div class="sec"><h4>📚 Modules</h4><div style="font-size:.62rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)">'+
    '<b style="color:var(--c1)">📜 Classical</b> — Caesar, Vigenère, XOR + auto-cracker<br>'+
    '<b style="color:var(--c1)">🔐 RSA</b> — Miller-Rabin primes, modular exponentiation<br>'+
    '<b style="color:var(--c1)">#️⃣ Hash</b> — avalanche effect heatmap<br>'+
    '<b style="color:var(--c1)">🔑 Diffie-Hellman</b> — key exchange + MITM demo<br>'+
    '<b style="color:var(--c1)">⛓️ Blockchain</b> — proof-of-work mining + tamper test'+
    '</div></div>'+
    '<div class="sec"><h4>⌨️ Shortcuts</h4><div style="font-size:.62rem;font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+
    '<b style="color:var(--c1)">Space</b> — Play/pause<br>'+
    '<b style="color:var(--c1)">→</b> — Single step<br>'+
    '<b style="color:var(--c1)">R</b> — Reset module<br>'+
    '<b style="color:var(--c1)">1-5</b> — Jump to module<br>'+
    '<b style="color:var(--c1)">T</b> — Cycle theme<br>'+
    '<b style="color:var(--c1)">?</b> — This help'+
    '</div></div>'+
    '<div class="sec"><h4>🎮 Tips</h4><div style="font-size:.6rem;font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    '• Classical: try the auto-crack on any message — it uses chi-squared to find the shift<br>'+
    '• RSA: increase bits and watch n grow — this is why 2048-bit is standard<br>'+
    '• Hash: change one letter and watch the avalanche heatmap light up<br>'+
    '• Diffie-Hellman: toggle MITM to see why authentication matters<br>'+
    '• Blockchain: tamper with block 1 and see the whole chain go red'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='5'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

var BOOT_STEPS=[
  'Initializing BigInt modular arithmetic...',
  'Loading Miller-Rabin witness set...',
  'Seeding English frequency tables (ETAOIN SHRDLU)...',
  'Compiling chi-squared cracker...',
  'Warming up hash avalanche mixer...',
  'Building DH groups (prime + generator)...',
  'Loading genesis block with proof of work...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('CIPHER ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('CIPHER initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='secure';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});

console.log('%c CIPHER ','background:linear-gradient(90deg,#40ff80,#ffd040,#40d0ff);color:#03080a;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('%cCryptography & Security Lab','color:#40ff80;font-weight:600');
console.log('%cClassical · RSA · Hash · Diffie-Hellman · Blockchain','color:#ffd040');
console.log('%cPress ? for help','color:#80c0a0');
</script>
