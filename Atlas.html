<!DOCTYPE html>
<html lang="en" data-theme="atlas">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f1a">
<title>ATLAS — Cartography Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#0a0f1a;--bg2:#0e1520;--bg3:#141c2c;--bg4:#1a2438;
  --panel:#0c1420;--panel2:#111a28;--panel3:#182438;--panel4:#202e44;
  --bd:#1c2840;--bd2:#2c3c58;--bd3:#405474;
  --tx:#e4ecf4;--tx2:#a0b0c8;--tx3:#687890;--mu:#485870;
  --c1:#d4a858;--c1h:#f0c880;--c1l:#a07830;
  --c2:#40a0ff;--c2h:#80c0ff;--c2l:#2070c0;
  --c3:#40e888;--c3h:#80ffc0;--c3l:#20a860;
  --c4:#ff6060;--c4h:#ff9090;--c4l:#c03030;
  --c5:#c060ff;--c5h:#d0a0ff;--c5l:#7030c0;
  --c6:#ff9040;--c6h:#ffb080;--c6l:#c04800;
  --c7:#40e0d0;--c7h:#80f0e8;--c7l:#20a098;
  --c8:#ff40a0;--c8h:#ff80c0;--c8l:#c02070;
  --ok:#40e888;--warn:#d4a858;--err:#ff6060;--info:#40a0ff;
  /* Map palette */
  --ocean:#0a1a30;--ocean-deep:#061220;--land:#2a3c50;--land-hi:#384c64;--land-bd:#4a6080;
  --graticule:#1c3050;--coast:#5080b0;
  --g1:linear-gradient(135deg,#d4a858,#40a0ff);
  --g2:linear-gradient(135deg,#40e888,#40a0ff);
  --g3:linear-gradient(135deg,#c060ff,#40e0d0);
  --gHolo:linear-gradient(120deg,#d4a858,#ff9040,#40e888,#40a0ff,#c060ff,#d4a858);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --sh2:0 16px 48px rgba(0,0,0,.9);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Cinzel','Cormorant Garamond',serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="ocean"]{--bg:#041220;--bg2:#082030;--bg3:#0c2c40;--panel:#082030;--panel2:#0c2c40;--panel3:#103850;
  --bd:#1c5070;--bd2:#2c6c94;--tx:#d0f0ff;--tx2:#90c8e8;--tx3:#5a90b0;
  --c1:#40c0ff;--c1h:#80d8ff;--c2:#40ffc0;--c3:#ffe040;--c4:#ff4080;
  --ocean:#020c1a;--ocean-deep:#000610;--land:#1a3858;--land-hi:#284870;--land-bd:#4080b0;
  --g1:linear-gradient(135deg,#40c0ff,#40ffc0)}
[data-theme="parchment"]{--bg:#e8dcc0;--bg2:#ddd0b0;--bg3:#d0c0a0;--panel:#f4e8cc;--panel2:#ede0c4;--panel3:#e0d0b0;--panel4:#d0c0a0;
  --bd:#b8a880;--bd2:#a09068;--tx:#2a1c0c;--tx2:#4c3c1c;--tx3:#7c6848;--mu:#a09070;
  --c1:#a07830;--c1h:#c09848;--c2:#2060a0;--c3:#409040;--c4:#a03030;
  --ocean:#a8c0d0;--ocean-deep:#90a8c0;--land:#e0d0a8;--land-hi:#ecd8b0;--land-bd:#a08868;
  --graticule:#c0b090;--coast:#806848;
  --g1:linear-gradient(135deg,#a07830,#a03030)}
[data-theme="blueprint"]{--bg:#0a1428;--bg2:#0c1a34;--bg3:#122040;--panel:#0c1a34;--panel2:#122040;--panel3:#182848;
  --bd:#284878;--bd2:#3868a8;--tx:#d0e0f8;--tx2:#88a8d8;--tx3:#5078b0;
  --c1:#40a0ff;--c1h:#80c0ff;--c2:#40ffff;--c3:#40ffa0;--c4:#ff6080;
  --ocean:#040a18;--ocean-deep:#020610;--land:#0c1c38;--land-hi:#142848;--land-bd:#40a0ff;
  --graticule:#204878;--coast:#40a0ff;
  --g1:linear-gradient(135deg,#40a0ff,#40ffff)}
[data-theme="military"]{--bg:#0e1410;--bg2:#141c14;--bg3:#1c281c;--panel:#141c14;--panel2:#1c281c;--panel3:#243024;
  --bd:#344430;--bd2:#4c6044;--tx:#d4e0c4;--tx2:#a0b090;--tx3:#6a7c60;
  --c1:#a0c060;--c1h:#c0e080;--c2:#40a0ff;--c3:#40d060;--c4:#d04040;
  --ocean:#0a120a;--ocean-deep:#060c06;--land:#2c3828;--land-hi:#3c4834;--land-bd:#607050;
  --g1:linear-gradient(135deg,#a0c060,#40d060)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#0a0f1a;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-globe{position:relative;width:140px;height:140px;margin-bottom:20px}
.boot-globe svg{width:100%;height:100%;animation:spin 8s linear infinite}
.boot-globe circle{fill:none;stroke:#d4a858;stroke-width:1.5;opacity:.6}
.boot-globe path{fill:none;stroke:#40a0ff;stroke-width:1;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:12px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.68rem;color:#d4a858;letter-spacing:8px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#141c2c;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #d4a858}
.boot-pct{font-size:.68rem;color:#d4a858;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#687890;text-align:left;width:min(420px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40e888}.boot-log .warn{color:#d4a858}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-proj{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);padding:2px;align-items:center}
.tb-proj-btn{padding:5px 9px;border-radius:3px;font-family:var(--mono);font-size:.6rem;font-weight:700;color:var(--tx3);cursor:pointer;transition:var(--t1)}
.tb-proj-btn:hover{background:var(--panel3);color:var(--tx)}
.tb-proj-btn.active{background:var(--g1);color:#0a0f1a}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0f1a;box-shadow:0 0 14px rgba(212,168,88,.35)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#0a0f1a;border-color:transparent}
.tb-coord{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;min-width:160px;text-align:center}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:280px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#mapWrap{flex:1;position:relative;background:var(--ocean);overflow:hidden;min-height:0;cursor:grab}
#mapWrap.dragging{cursor:grabbing}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%}
#mapOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(12,20,32,.88);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 12px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:260px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right}
.co-compass{background:rgba(12,20,32,.85);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:50%;width:60px;height:60px;pointer-events:auto;position:relative}
.co-scale{background:rgba(12,20,32,.85);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:4px 10px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto}

#rightPanel{width:280px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:4px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

/* ============ STATUS BAR ============ */
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#0a0f1a;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.62rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(212,168,88,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#0a0f1a;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(212,168,88,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:rgba(255,96,96,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle{position:relative;width:36px;height:20px;background:var(--panel4);border-radius:var(--rf);cursor:pointer;transition:var(--t2);flex-shrink:0;display:inline-block}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--t2)}
.toggle.on::after{left:18px}

/* ============ LIST ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:6px 9px;border-radius:var(--rxs);cursor:pointer;font-size:.66rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(212,168,88,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:7px}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.58rem;color:var(--tx3)}

/* ============ TABLE ============ */
.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table tbody tr{cursor:pointer;transition:var(--t1)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* ============ HELPER ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.62rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}
.kv{font-family:var(--mono);font-size:.65rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all}
.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:.95rem;font-weight:800;color:var(--c1);line-height:1.1}
.stat .sl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:3px}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:800px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c1)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:220px}#rightPanel{width:240px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-globe">
    <svg viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="60"/>
      <ellipse cx="70" cy="70" rx="60" ry="20"/>
      <ellipse cx="70" cy="70" rx="40" ry="60"/>
      <ellipse cx="70" cy="70" rx="20" ry="60"/>
      <line x1="10" y1="70" x2="130" y2="70"/>
      <path d="M40,30 Q70,20 100,30 Q105,50 90,70 Q75,90 60,100 Q50,80 40,60 Q30,45 40,30Z"/>
      <path d="M80,90 Q95,85 105,95 Q100,110 85,110 Q80,100 80,90Z"/>
    </svg>
  </div>
  <div class="boot-logo">ATLAS</div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   GEOGRAPHIC MATH
   Real formulas from geodesy and cartography
   ================================================================ */
var GEO={
  D2R:Math.PI/180,
  R2D:180/Math.PI,
  EARTH_R_KM:6371.0088,        /* Mean Earth radius */
  EARTH_R_EQ:6378.137,          /* Equatorial radius */
  EARTH_R_POLAR:6356.7523,      /* Polar radius */
  EARTH_FLATTENING:1/298.257223563,

  /* Haversine formula — great-circle distance between two points */
  haversine:function(lat1,lon1,lat2,lon2){
    var f1=lat1*this.D2R,f2=lat2*this.D2R;
    var dLat=(lat2-lat1)*this.D2R;
    var dLon=(lon2-lon1)*this.D2R;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(f1)*Math.cos(f2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    var c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return this.EARTH_R_KM*c;
  },

  /* Vincenty formula — more accurate ellipsoidal distance */
  vincenty:function(lat1,lon1,lat2,lon2){
    var a=this.EARTH_R_EQ;
    var b=this.EARTH_R_POLAR;
    var f=this.EARTH_FLATTENING;
    var L=(lon2-lon1)*this.D2R;
    var U1=Math.atan((1-f)*Math.tan(lat1*this.D2R));
    var U2=Math.atan((1-f)*Math.tan(lat2*this.D2R));
    var sinU1=Math.sin(U1),cosU1=Math.cos(U1);
    var sinU2=Math.sin(U2),cosU2=Math.cos(U2);
    var lambda=L,lambdaP,iterLimit=100;
    var sinLambda,cosLambda,sinSigma,cosSigma,sigma,sinAlpha,cosSqAlpha,cos2SigmaM;
    do{
      sinLambda=Math.sin(lambda);
      cosLambda=Math.cos(lambda);
      sinSigma=Math.sqrt((cosU2*sinLambda)*(cosU2*sinLambda)+
        (cosU1*sinU2-sinU1*cosU2*cosLambda)*(cosU1*sinU2-sinU1*cosU2*cosLambda));
      if(sinSigma===0)return 0;
      cosSigma=sinU1*sinU2+cosU1*cosU2*cosLambda;
      sigma=Math.atan2(sinSigma,cosSigma);
      sinAlpha=cosU1*cosU2*sinLambda/sinSigma;
      cosSqAlpha=1-sinAlpha*sinAlpha;
      cos2SigmaM=cosSqAlpha!==0?cosSigma-2*sinU1*sinU2/cosSqAlpha:0;
      var C=f/16*cosSqAlpha*(4+f*(4-3*cosSqAlpha));
      lambdaP=lambda;
      lambda=L+(1-C)*f*sinAlpha*(sigma+C*sinSigma*(cos2SigmaM+C*cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)));
    }while(Math.abs(lambda-lambdaP)>1e-12&&--iterLimit>0);
    if(iterLimit===0)return this.haversine(lat1,lon1,lat2,lon2);
    var uSq=cosSqAlpha*(a*a-b*b)/(b*b);
    var A=1+uSq/16384*(4096+uSq*(-768+uSq*(320-175*uSq)));
    var B=uSq/1024*(256+uSq*(-128+uSq*(74-47*uSq)));
    var deltaSigma=B*sinSigma*(cos2SigmaM+B/4*(cosSigma*(-1+2*cos2SigmaM*cos2SigmaM)-
      B/6*cos2SigmaM*(-3+4*sinSigma*sinSigma)*(-3+4*cos2SigmaM*cos2SigmaM)));
    var s=b*A*(sigma-deltaSigma);
    return s;
  },

  /* Initial bearing (forward azimuth) */
  bearing:function(lat1,lon1,lat2,lon2){
    var f1=lat1*this.D2R,f2=lat2*this.D2R;
    var dLon=(lon2-lon1)*this.D2R;
    var y=Math.sin(dLon)*Math.cos(f2);
    var x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dLon);
    var b=Math.atan2(y,x)*this.R2D;
    return (b+360)%360;
  },

  /* Destination point given start, bearing, distance */
  destination:function(lat,lon,bearingDeg,distKm){
    var f1=lat*this.D2R;
    var l1=lon*this.D2R;
    var br=bearingDeg*this.D2R;
    var dr=distKm/this.EARTH_R_KM;
    var f2=Math.asin(Math.sin(f1)*Math.cos(dr)+Math.cos(f1)*Math.sin(dr)*Math.cos(br));
    var l2=l1+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(f1),
      Math.cos(dr)-Math.sin(f1)*Math.sin(f2));
    l2=(l2+3*Math.PI)%(2*Math.PI)-Math.PI;
    return {lat:f2*this.R2D,lon:l2*this.R2D};
  },

  /* Midpoint along great circle */
  midpoint:function(lat1,lon1,lat2,lon2){
    var f1=lat1*this.D2R,f2=lat2*this.D2R;
    var dLon=(lon2-lon1)*this.D2R;
    var Bx=Math.cos(f2)*Math.cos(dLon);
    var By=Math.cos(f2)*Math.sin(dLon);
    var f3=Math.atan2(Math.sin(f1)+Math.sin(f2),
      Math.sqrt((Math.cos(f1)+Bx)*(Math.cos(f1)+Bx)+By*By));
    var l3=lon1*this.D2R+Math.atan2(By,Math.cos(f1)+Bx);
    return {lat:f3*this.R2D,lon:((l3*this.R2D+540)%360)-180};
  },

  /* Interpolate along great circle with fraction t (0-1) */
  interpolate:function(lat1,lon1,lat2,lon2,t){
    var f1=lat1*this.D2R,l1=lon1*this.D2R;
    var f2=lat2*this.D2R,l2=lon2*this.D2R;
    var d=2*Math.asin(Math.sqrt(Math.pow(Math.sin((f2-f1)/2),2)+
      Math.cos(f1)*Math.cos(f2)*Math.pow(Math.sin((l2-l1)/2),2)));
    if(d<1e-10)return {lat:lat1,lon:lon1};
    var A=Math.sin((1-t)*d)/Math.sin(d);
    var B=Math.sin(t*d)/Math.sin(d);
    var x=A*Math.cos(f1)*Math.cos(l1)+B*Math.cos(f2)*Math.cos(l2);
    var y=A*Math.cos(f1)*Math.sin(l1)+B*Math.cos(f2)*Math.sin(l2);
    var z=A*Math.sin(f1)+B*Math.sin(f2);
    return {lat:Math.atan2(z,Math.sqrt(x*x+y*y))*this.R2D,lon:Math.atan2(y,x)*this.R2D};
  },

  /* Spherical polygon area (km²) using Girard's theorem */
  sphericalArea:function(points){
    if(points.length<3)return 0;
    var total=0;
    for(var i=0;i<points.length;i++){
      var p1=points[i];
      var p2=points[(i+1)%points.length];
      var p3=points[(i+2)%points.length];
      var f1=p1.lat*this.D2R,l1=p1.lon*this.D2R;
      var f2=p2.lat*this.D2R,l2=p2.lon*this.D2R;
      var f3=p3.lat*this.D2R,l3=p3.lon*this.D2R;
      var A=Math.sin(l3-l2)*Math.cos(f1);
      var B=Math.cos(f2)*Math.sin(f3)-Math.sin(f2)*Math.cos(f3)*Math.cos(l3-l2);
      var C=Math.sin(l3-l1)*Math.cos(f2);
      var D=Math.cos(f1)*Math.sin(f3)-Math.sin(f1)*Math.cos(f3)*Math.cos(l3-l1);
      total+=Math.atan2(A*B-C*D,Math.sqrt(A*A+C*C)*Math.sqrt(B*B+D*D));
    }
    return Math.abs(total)*this.EARTH_R_KM*this.EARTH_R_KM;
  },

  /* Point in polygon (ray casting) */
  pointInPolygon:function(lat,lon,polygon){
    var inside=false;
    var n=polygon.length;
    for(var i=0,j=n-1;i<n;j=i++){
      var pi=polygon[i],pj=polygon[j];
      if(((pi.lat>lat)!==(pj.lat>lat))&&
         (lon<(pj.lon-pi.lon)*(lat-pi.lat)/(pj.lat-pi.lat)+pi.lon)){
        inside=!inside;
      }
    }
    return inside;
  },

  /* Bounding box */
  bbox:function(points){
    var minLat=90,maxLat=-90,minLon=180,maxLon=-180;
    points.forEach(function(p){
      if(p.lat<minLat)minLat=p.lat;
      if(p.lat>maxLat)maxLat=p.lat;
      if(p.lon<minLon)minLon=p.lon;
      if(p.lon>maxLon)maxLon=p.lon;
    });
    return {minLat:minLat,maxLat:maxLat,minLon:minLon,maxLon:maxLon};
  },

  /* Centroid of polygon (simple arithmetic mean) */
  centroid:function(points){
    var sumLat=0,sumLon=0;
    points.forEach(function(p){sumLat+=p.lat;sumLon+=p.lon;});
    return {lat:sumLat/points.length,lon:sumLon/points.length};
  },

  /* Coordinate formatting: decimal to DMS */
  toDMS:function(decimal,isLat){
    var dir=decimal>=0?(isLat?'N':'E'):(isLat?'S':'W');
    decimal=Math.abs(decimal);
    var d=Math.floor(decimal);
    var m=Math.floor((decimal-d)*60);
    var s=((decimal-d)*60-m)*60;
    return d+'°'+String(m).padStart(2,'0')+'\''+s.toFixed(1)+'"'+dir;
  },
  fromDMS:function(d,m,s,dir){
    var dec=d+m/60+s/3600;
    if(dir==='S'||dir==='W')dec=-dec;
    return dec;
  },

  /* UTM zone from lat/lon */
  utmZone:function(lat,lon){
    var zone=Math.floor((lon+180)/6)+1;
    if(lat>=56&&lat<64&&lon>=3&&lon<12)zone=32;
    return zone;
  },
  utmBand:function(lat){
    if(lat>=-80&&lat<=84){
      var bands='CDEFGHJKLMNPQRSTUVWX';
      return bands[Math.floor((lat+80)/8)];
    }
    return 'Z';
  },

  /* Approximate timezone offset from longitude */
  approxTimezone:function(lon){return Math.round(lon/15);},

  /* Sun position — simplified solar ephemeris */
  sunPosition:function(date){
    var jd=date.getTime()/86400000+2440587.5;
    var n=jd-2451545.0;
    var L=(280.460+0.9856474*n)%360;
    var g=((357.528+0.9856003*n)%360)*this.D2R;
    var lambda=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*this.D2R;
    var eps=(23.439-0.0000004*n)*this.D2R;
    var ra=Math.atan2(Math.cos(eps)*Math.sin(lambda),Math.cos(lambda));
    var dec=Math.asin(Math.sin(eps)*Math.sin(lambda));
    return {ra:ra,dec:dec,gmst:this.gmst(jd)};
  },
  gmst:function(jd){
    var T=(jd-2451545)/36525;
    var gmst=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000;
    return ((gmst%360)+360)%360;
  },
  /* Solar elevation at location and time */
  solarElevation:function(date,lat,lon){
    var sun=this.sunPosition(date);
    var lst=this.gmst(date.getTime()/86400000+2440587.5)+lon;
    var ha=(lst-sun.ra*this.R2D)*this.D2R;
    var latR=lat*this.D2R;
    var sinAlt=Math.sin(latR)*Math.sin(sun.dec)+Math.cos(latR)*Math.cos(sun.dec)*Math.cos(ha);
    return Math.asin(clamp(sinAlt,-1,1))*this.R2D;
  },
  /* Subsolar point */
  subsolar:function(date){
    var sun=this.sunPosition(date);
    var gmst=this.gmst(date.getTime()/86400000+2440587.5);
    var lon=(sun.ra*this.R2D-gmst+540)%360-180;
    return {lat:sun.dec*this.R2D,lon:lon};
  }
};

/* ================================================================
   PROJECTIONS — Real cartographic transformations
   Each projection has forward(lat,lon) → {x,y} and inverse(x,y) → {lat,lon}
   All projections output in normalized range suitable for canvas
   ================================================================ */
var PROJECTIONS={
  equirect:{
    name:'Equirectangular',
    short:'Equi',
    bounds:{xMin:-180,xMax:180,yMin:-90,yMax:90},
    forward:function(lat,lon){
      return {x:lon,y:lat};
    },
    inverse:function(x,y){
      return {lat:y,lon:x};
    }
  },
  mercator:{
    name:'Mercator',
    short:'Merc',
    bounds:{xMin:-180,xMax:180,yMin:-85.05,yMax:85.05},
    forward:function(lat,lon){
      lat=clamp(lat,-85.05,85.05);
      var latR=lat*GEO.D2R;
      var y=Math.log(Math.tan(Math.PI/4+latR/2))*GEO.R2D;
      return {x:lon,y:y};
    },
    inverse:function(x,y){
      var latR=Math.atan(Math.sinh(y*GEO.D2R));
      return {lat:latR*GEO.R2D,lon:x};
    }
  },
  mollweide:{
    name:'Mollweide (Equal-Area)',
    short:'Moll',
    bounds:{xMin:-180,xMax:180,yMin:-90,yMax:90},
    forward:function(lat,lon){
      var latR=lat*GEO.D2R;
      var lonR=lon*GEO.D2R;
      var theta=latR;
      for(var i=0;i<20;i++){
        var dtheta=(2*theta+Math.sin(2*theta)-Math.PI*Math.sin(latR))/(2+2*Math.cos(2*theta));
        theta-=dtheta;
        if(Math.abs(dtheta)<1e-8)break;
      }
      var x=2*Math.sqrt(2)/Math.PI*lonR*Math.cos(theta)*GEO.R2D;
      var y=Math.sqrt(2)*Math.sin(theta)*GEO.R2D;
      return {x:x,y:y};
    },
    inverse:function(x,y){
      var theta=Math.asin(clamp(y/(Math.sqrt(2)*GEO.R2D),-1,1));
      var latR=Math.asin(clamp((2*theta+Math.sin(2*theta))/Math.PI,-1,1));
      var lonR=Math.PI*x/(2*Math.sqrt(2)*Math.cos(theta)*GEO.R2D);
      return {lat:latR*GEO.R2D,lon:lonR*GEO.R2D};
    }
  },
  robinson:{
    name:'Robinson',
    short:'Robi',
    /* Robinson projection uses a table of coordinates at every 5° of latitude */
    table:[[0,1.0000,0.0000],[5,0.9986,0.0620],[10,0.9954,0.1240],[15,0.9900,0.1860],
      [20,0.9822,0.2480],[25,0.9730,0.3100],[30,0.9600,0.3720],[35,0.9427,0.4340],
      [40,0.9216,0.4958],[45,0.8962,0.5571],[50,0.8679,0.6176],[55,0.8350,0.6769],
      [60,0.7986,0.7346],[65,0.7597,0.7903],[70,0.7186,0.8435],[75,0.6732,0.8936],
      [80,0.6213,0.9394],[85,0.5722,0.9761],[90,0.5322,1.0000]],
    forward:function(lat,lon){
      var al=Math.abs(lat);
      var i=Math.min(17,Math.floor(al/5));
      var f=(al-i*5)/5;
      var X=this.table[i][1]+(this.table[i+1][1]-this.table[i][1])*f;
      var Y=this.table[i][2]+(this.table[i+1][2]-this.table[i][2])*f;
      var x=0.8487*X*lon;
      var y=1.3523*Y*(lat<0?-1:1)*GEO.R2D*90;
      y=1.3523*Y*(lat<0?-1:1)*57.2958*1;
      /* Simplify to a scaled coordinate */
      return {x:x,y:y*0.0116};
    },
    inverse:function(x,y){
      /* Invert approximately */
      var lat=y*90/(1.3523*1.0000)/0.0116/57.2958;
      lat=clamp(lat,-90,90);
      var al=Math.abs(lat);
      var i=Math.min(17,Math.floor(al/5));
      var f=(al-i*5)/5;

};

  {name:'Alps',points:[[47,7],[46,9],[46,11],[46,13],[45,15]],elev:4000},
  {name:'Ural',points:[[68,60],[65,59],[60,58],[55,58],[50,57],[45,55]],elev:1800},
  {name:'Atlas',points:[[32,-6],[31,-4],[31,-2],[30,0],[31,3],[33,6],[34,9]],elev:3000},
  {name:'Altai',points:[[50,88],[48,90],[46,92],[44,94],[42,96]],elev:4000},
  {name:'Great Dividing Range',points:[[-15,145],[-20,147],[-25,150],[-30,151],[-35,149],[-38,146]],elev:2000}
];

/* ================================================================
   TECTONIC PLATES — simplified
   ================================================================ */
var PLATES=[
  {name:'Pacific',points:[[60,-170],[55,-140],[40,-125],[20,-105],[-10,-80],[-40,-70],[-60,-75],[-60,-120],[-55,-160],[-30,-180],[-10,175],[15,160],[30,145],[45,155],[60,-170]]},
  {name:'North American',points:[[80,-170],[70,-140],[45,-130],[30,-115],[15,-105],[10,-85],[15,-80],[25,-80],[35,-75],[45,-60],[60,-50],[70,-30],[80,-60],[80,-170]]},
  {name:'South American',points:[[15,-80],[10,-70],[5,-50],[-10,-35],[-30,-40],[-55,-60],[-55,-75],[-40,-75],[-20,-70],[-10,-80],[5,-80],[15,-80]]},
  {name:'African',points:[[37,-15],[35,10],[30,25],[30,45],[10,50],[-20,50],[-35,25],[-35,15],[-20,-10],[-5,-10],[10,-15],[25,-20],[37,-15]]},
  {name:'Eurasian',points:[[80,-10],[75,30],[70,60],[65,100],[60,140],[55,170],[45,180],[30,140],[25,120],[35,90],[35,60],[40,30],[45,10],[55,-10],[70,-20],[80,-10]]},
  {name:'Indo-Australian',points:[[30,60],[20,75],[0,90],[-15,100],[-20,120],[-40,140],[-45,160],[-40,180],[-20,180],[0,160],[10,140],[25,100],[30,60]]},
  {name:'Antarctic',points:[[-60,-180],[-70,-150],[-80,-100],[-85,-50],[-80,0],[-75,50],[-70,100],[-70,150],[-65,180],[-75,180],[-85,-180],[-60,-180]]},
  {name:'Nazca',points:[[-5,-105],[-15,-90],[-25,-75],[-40,-75],[-45,-90],[-30,-110],[-15,-115],[-5,-105]]},
  {name:'Cocos',points:[[15,-115],[10,-100],[0,-95],[-10,-100],[-5,-115],[5,-120],[15,-115]]},
  {name:'Caribbean',points:[[20,-85],[15,-70],[10,-60],[5,-58],[5,-68],[10,-80],[15,-90],[20,-85]]}
];
</script>
<script>
/* ================================================================
   APPLICATION STATE
   ================================================================ */
var STATE={
  currentTab:'map',
  projection:'equirect',
  center:{lat:20,lon:0},
  zoom:1,
  width:0,
  height:0,
  showGraticule:true,
  showCities:true,
  showRivers:true,
  showMountains:true,
  showContinents:true,
  showPlates:false,
  showDayNight:true,
  showCityLabels:true,
  showCountryLabels:false,
  drawMode:'marker',       /* marker, route, polygon, measure */
  markers:[
    {name:'New York',lat:40.7128,lon:-74.0060},
    {name:'London',lat:51.5074,lon:-0.1278},
    {name:'Tokyo',lat:35.6762,lon:139.6503}
  ],
  routes:[],
  polygons:[],
  currentRoute:[],
  currentPolygon:[],
  selectedCity:null,
  hoverCity:null,
  dragStart:null,
  dragging:false,
  offsetX:0,
  offsetY:0,
  theme:'atlas',
  selectedMarkerIdx:-1,
  currentTime:new Date(),
  timeAnimating:false,
  animationSpeed:1
};

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};

function initCanvas(){
  CANV.canvas=$('mapCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onLeave);
  CANV.canvas.addEventListener('wheel',onWheel,{passive:false});
  CANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault();onRightClick(e);});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}

function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;
  CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
  STATE.width=CANV.W;
  STATE.height=CANV.H;
}

/* ================================================================
   PROJECTION COORDINATE HELPERS
   Map coordinate system:
   - Each projection outputs coordinates in some range
   - We normalize by taking all output and mapping to canvas via bounds
   - Zoom scales around center
   ================================================================ */
function getProj(){return PROJECTIONS[STATE.projection];}

/* Compute scale factor that maps projection bounds to canvas, given zoom */
function getProjectionScale(){
  var proj=getProj();
  var bounds=proj.bounds;
  var projW=bounds.xMax-bounds.xMin;
  var projH=bounds.yMax-bounds.yMin;
  /* Base scale so projection fills canvas at zoom 1 */
  var scaleX=CANV.W/projW;
  var scaleY=CANV.H/projH;
  var baseScale=Math.min(scaleX,scaleY);
  return baseScale*STATE.zoom;
}

/* Projection coordinate → canvas pixel */
function projToCanvas(projCoord){
  var proj=getProj();
  var bounds=proj.bounds;
  var cxProj=(bounds.xMin+bounds.xMax)/2;
  var cyProj=(bounds.yMin+bounds.yMax)/2;
  var scale=getProjectionScale();
  var x=(projCoord.x-cxProj)*scale+CANV.W/2;
  var y=(cyProj-projCoord.y)*scale+CANV.H/2;
  return {x:x,y:y};
}

/* Canvas pixel → projection coordinate */
function canvasToProj(cx,cy){
  var proj=getProj();
  var bounds=proj.bounds;
  var cxProj=(bounds.xMin+bounds.xMax)/2;
  var cyProj=(bounds.yMin+bounds.yMax)/2;
  var scale=getProjectionScale();
  return {
    x:(cx-CANV.W/2)/scale+cxProj,
    y:cyProj-(cy-CANV.H/2)/scale
  };
}

/* Lat/lon → canvas pixel (using current projection) */
function latLonToCanvas(lat,lon){
  /* Adjust longitude relative to center for wrap-around projection */
  var adjustedLon=lon;
  if(STATE.projection!=='orthographic'&&STATE.projection!=='azimuthal'){
    /* Wrap longitudes around center for smoother panning */
    while(adjustedLon-STATE.center.lon>180)adjustedLon-=360;
    while(adjustedLon-STATE.center.lon<-180)adjustedLon+=360;
  }
  /* Update orthographic/azimuthal center */
  if(STATE.projection==='orthographic')PROJECTIONS.orthographic.center={lat:STATE.center.lat,lon:STATE.center.lon};
  if(STATE.projection==='azimuthal')PROJECTIONS.azimuthal.center={lat:STATE.center.lat,lon:STATE.center.lon};

  var projCoord=getProj().forward(lat,adjustedLon);
  if(projCoord.visible===false)return null;
  return projToCanvas(projCoord);
}

/* Canvas pixel → lat/lon */
function canvasToLatLon(cx,cy){
  var proj=getProj();
  if(STATE.projection==='orthographic')proj.center={lat:STATE.center.lat,lon:STATE.center.lon};
  if(STATE.projection==='azimuthal')proj.center={lat:STATE.center.lat,lon:STATE.center.lon};
  var pc=canvasToProj(cx,cy);
  var ll=proj.inverse(pc.x,pc.y);
  if(!ll)return null;
  /* Normalize */
  ll.lon=((ll.lon+540)%360)-180;
  return ll;
}

/* ================================================================
   RENDER
   ================================================================ */
var cssVars={};
function readCssVars(){
  var style=getComputedStyle(document.documentElement);
  cssVars.ocean=style.getPropertyValue('--ocean').trim()||'#0a1a30';
  cssVars.oceanDeep=style.getPropertyValue('--ocean-deep').trim()||'#061220';
  cssVars.land=style.getPropertyValue('--land').trim()||'#2a3c50';
  cssVars.landHi=style.getPropertyValue('--land-hi').trim()||'#384c64';
  cssVars.landBd=style.getPropertyValue('--land-bd').trim()||'#4a6080';
  cssVars.graticule=style.getPropertyValue('--graticule').trim()||'#1c3050';
  cssVars.coast=style.getPropertyValue('--coast').trim()||'#5080b0';
}

function render(){
  var ctx=CANV.ctx;
  readCssVars();
  /* Ocean background */
  ctx.fillStyle=cssVars.ocean;
  ctx.fillRect(0,0,CANV.W,CANV.H);
  /* Subtle radial gradient for ocean depth */
  var grad=ctx.createRadialGradient(CANV.W/2,CANV.H/2,0,CANV.W/2,CANV.H/2,Math.max(CANV.W,CANV.H)*0.7);
  grad.addColorStop(0,'rgba(20,60,100,.15)');
  grad.addColorStop(1,'rgba(0,0,20,.4)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,CANV.W,CANV.H);
  /* Graticule */
  if(STATE.showGraticule)drawGraticule(ctx);
  /* Continents */
  if(STATE.showContinents)drawContinents(ctx);
  /* Tectonic plates */
  if(STATE.showPlates)drawPlates(ctx);
  /* Mountains */
  if(STATE.showMountains)drawMountains(ctx);
  /* Rivers */
  if(STATE.showRivers)drawRivers(ctx);
  /* Day/night terminator */
  if(STATE.showDayNight)drawDayNight(ctx);
  /* User-drawn polygons */
  drawUserPolygons(ctx);
  /* User-drawn routes */
  drawUserRoutes(ctx);
  /* Cities */
  if(STATE.showCities)drawCities(ctx);
  /* User markers */
  drawMarkers(ctx);
  /* Current in-progress drawing */
  drawInProgress(ctx);
  /* Hover highlight */
  drawHover(ctx);
  /* Update overlay */
  updateOverlay();
}

function drawGraticule(ctx){
  ctx.strokeStyle=cssVars.graticule;
  ctx.lineWidth=0.5;
  ctx.globalAlpha=0.5;
  /* Meridians every 30° */
  for(var lon=-180;lon<=180;lon+=30){
    var started=false;
    ctx.beginPath();
    for(var lat=-90;lat<=90;lat+=2){
      var p=latLonToCanvas(lat,lon);
      if(!p){started=false;continue;}
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
  /* Parallels every 30° */
  for(var lat2=-60;lat2<=60;lat2+=30){
    var started2=false;
    ctx.beginPath();
    for(var lon2=-180;lon2<=180;lon2+=2){
      var p2=latLonToCanvas(lat2,lon2);
      if(!p2){started2=false;continue;}
      if(!started2){ctx.moveTo(p2.x,p2.y);started2=true;}
      else ctx.lineTo(p2.x,p2.y);
    }
    ctx.stroke();
  }
  /* Equator and prime meridian */
  ctx.globalAlpha=0.7;
  ctx.strokeStyle=cssVars.coast;
  ctx.lineWidth=0.8;
  /* Equator */
  var eqStarted=false;
  ctx.beginPath();
  for(var lonE=-180;lonE<=180;lonE+=2){
    var pE=latLonToCanvas(0,lonE);
    if(!pE){eqStarted=false;continue;}
    if(!eqStarted){ctx.moveTo(pE.x,pE.y);eqStarted=true;}
    else ctx.lineTo(pE.x,pE.y);
  }
  ctx.stroke();
  /* Prime meridian */
  var pmStarted=false;
  ctx.beginPath();
  for(var latM=-90;latM<=90;latM+=2){
    var pM=latLonToCanvas(latM,0);
    if(!pM){pmStarted=false;continue;}
    if(!pmStarted){ctx.moveTo(pM.x,pM.y);pmStarted=true;}
    else ctx.lineTo(pM.x,pM.y);
  }
  ctx.stroke();
  ctx.globalAlpha=1;
}

function drawContinents(ctx){
  CONTINENTS.forEach(function(cont){
    /* Fill */
    ctx.beginPath();
    var started=false;
    var points=cont.points;
    for(var i=0;i<points.length;i++){
      var p=latLonToCanvas(points[i][0],points[i][1]);
      if(!p)continue;
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    }
    if(!started)return;
    ctx.closePath();
    /* Fill with subtle gradient */
    ctx.fillStyle=cssVars.land;
    ctx.fill();
    /* Coast outline */
    ctx.strokeStyle=cssVars.coast;
    ctx.lineWidth=1;
    ctx.globalAlpha=0.8;
    ctx.stroke();
    ctx.globalAlpha=1;
  });
}

function drawPlates(ctx){
  PLATES.forEach(function(plate){
    ctx.beginPath();
    var started=false;
    for(var i=0;i<plate.points.length;i++){
      var p=latLonToCanvas(plate.points[i][0],plate.points[i][1]);
      if(!p){started=false;continue;}
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle='#ff9040';
    ctx.lineWidth=1.5;
    ctx.globalAlpha=0.5;
    ctx.setLineDash([4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
    /* Label centroid */
    var c=GEO.centroid(plate.points.map(function(p){return {lat:p[0],lon:p[1]};}));
    var cp=latLonToCanvas(c.lat,c.lon);
    if(cp){
      ctx.fillStyle='#ff9040';
      ctx.font='bold 9px monospace';
      ctx.textAlign='center';
      ctx.globalAlpha=0.7;
      ctx.fillText(plate.name,cp.x,cp.y);
      ctx.globalAlpha=1;
    }
  });
}

function drawMountains(ctx){
  MOUNTAINS.forEach(function(range){
    /* Draw as dashed brown line */
    ctx.beginPath();
    var started=false;
    for(var i=0;i<range.points.length;i++){
      var p=latLonToCanvas(range.points[i][0],range.points[i][1]);
      if(!p){started=false;continue;}
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle='#a88868';
    ctx.lineWidth=2;
    ctx.globalAlpha=0.7;
    ctx.stroke();
    ctx.globalAlpha=1;
    /* Symbol triangles along line */
    for(var i2=0;i2<range.points.length;i2++){
      var p2=latLonToCanvas(range.points[i2][0],range.points[i2][1]);
      if(!p2)continue;
      ctx.fillStyle='#a88868';
      ctx.beginPath();
      ctx.moveTo(p2.x,p2.y-4);
      ctx.lineTo(p2.x-3,p2.y+2);
      ctx.lineTo(p2.x+3,p2.y+2);
      ctx.closePath();
      ctx.fill();
    }
  });
}

function drawRivers(ctx){
  ctx.strokeStyle='#40a0ff';
  ctx.lineWidth=1.2;
  ctx.globalAlpha=0.65;
  RIVERS.forEach(function(river){
    ctx.beginPath();
    var started=false;
    for(var i=0;i<river.points.length;i++){
      var p=latLonToCanvas(river.points[i][0],river.points[i][1]);
      if(!p){started=false;continue;}
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  });
  ctx.globalAlpha=1;
}

function drawDayNight(ctx){
  /* Draw night region as semi-transparent overlay */
  var date=STATE.currentTime;
  var sub=GEO.subsolar(date);
  /* For each pixel column, compute terminator latitude */
  ctx.fillStyle='rgba(0,0,20,.55)';
  /* Approach: sample grid and shade night regions */
  /* For equirect: calculate per column. For other projs, iterate grid */
  var step=Math.max(1,Math.floor(Math.min(CANV.W,CANV.H)/120));
  for(var y=0;y<CANV.H;y+=step){
    for(var x=0;x<CANV.W;x+=step){
      var ll=canvasToLatLon(x,y);
      if(!ll)continue;
      var el=GEO.solarElevation(date,ll.lat,ll.lon);
      if(el<0){
        var alpha=clamp(-el/30,0,0.7);
        ctx.fillStyle='rgba(0,0,20,'+alpha+')';
        ctx.fillRect(x,y,step,step);
      }
    }
  }
  /* Draw subsolar point marker */
  var sp=latLonToCanvas(sub.lat,sub.lon);
  if(sp){
    ctx.fillStyle='rgba(255,240,140,.9)';
    ctx.beginPath();
    ctx.arc(sp.x,sp.y,6,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(255,240,140,.5)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(sp.x,sp.y,10,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawCities(ctx){
  CITIES.forEach(function(city){
    var p=latLonToCanvas(city.lat,city.lon);
    if(!p)return;
    if(p.x<-20||p.x>CANV.W+20||p.y<-20||p.y>CANV.H+20)return;
    /* Size proportional to population */
    var size=Math.max(1.5,Math.min(5,Math.log10(city.pop)*0.55));
    /* Color by population */
    var color=city.pop>5000000?'#ff6060':city.pop>1000000?'#ff9040':city.pop>100000?'#ffd040':'#d4a858';
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,size,0,Math.PI*2);
    ctx.fill();
    /* Label for large cities */
    if(STATE.showCityLabels&&city.pop>2000000){
      ctx.fillStyle='#e4ecf4';
      ctx.font='9px monospace';
      ctx.textAlign='left';
      ctx.fillText(city.name,p.x+size+2,p.y+3);
    }
  });
}

function drawMarkers(ctx){
  STATE.markers.forEach(function(m,i){
    var p=latLonToCanvas(m.lat,m.lon);
    if(!p)return;
    var selected=i===STATE.selectedMarkerIdx;
    /* Pin shape */
    ctx.save();
    ctx.translate(p.x,p.y);
    /* Shadow */
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(0,0,8,3,0,0,Math.PI*2);
    ctx.fill();
    /* Pin body */
    ctx.fillStyle=selected?'#40e888':'#d4a858';
    ctx.beginPath();
    ctx.arc(0,-16,8,Math.PI,0);
    ctx.lineTo(4,-8);
    ctx.lineTo(0,0);
    ctx.lineTo(-4,-8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';
    ctx.lineWidth=1;
    ctx.stroke();
    /* Inner dot */
    ctx.fillStyle='#0a0f1a';
    ctx.beginPath();
    ctx.arc(0,-16,3,0,Math.PI*2);
    ctx.fill();
    /* Label */
    ctx.fillStyle='#e4ecf4';
    ctx.font='bold 10px monospace';
    ctx.textAlign='center';
    ctx.fillText(m.name,p.x,p.y+13);
    ctx.restore();
  });
}

function drawUserRoutes(ctx){
  STATE.routes.forEach(function(route){
    if(route.length<2)return;
    /* Draw great-circle arc */
    ctx.strokeStyle='#40e888';
    ctx.lineWidth=2;
    ctx.beginPath();
    var started=false;
    for(var i=0;i<route.length-1;i++){
      var a=route[i],b=route[i+1];
      for(var t=0;t<=1;t+=0.02){
        var pt=GEO.interpolate(a.lat,a.lon,b.lat,b.lon,t);
        var p=latLonToCanvas(pt.lat,pt.lon);
        if(!p){started=false;continue;}
        if(!started){ctx.moveTo(p.x,p.y);started=true;}
        else ctx.lineTo(p.x,p.y);
      }
    }
    ctx.stroke();
    /* Waypoints */
    route.forEach(function(wp){
      var p=latLonToCanvas(wp.lat,wp.lon);
      if(!p)return;
      ctx.fillStyle='#40e888';
      ctx.beginPath();
      ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle='#0a0f1a';
      ctx.lineWidth=1;
      ctx.stroke();
    });
  });
}

function drawUserPolygons(ctx){
  STATE.polygons.forEach(function(poly){
    if(poly.points.length<2)return;
    ctx.beginPath();
    var started=false;
    poly.points.forEach(function(pt){
      var p=latLonToCanvas(pt.lat,pt.lon);
      if(!p)return;
      if(!started){ctx.moveTo(p.x,p.y);started=true;}
      else ctx.lineTo(p.x,p.y);
    });
    if(started){
      ctx.closePath();
      ctx.fillStyle='rgba(212,168,88,.2)';
      ctx.fill();
      ctx.strokeStyle='#d4a858';
      ctx.lineWidth=1.5;
      ctx.stroke();
      /* Vertices */
      poly.points.forEach(function(pt){
        var p=latLonToCanvas(pt.lat,pt.lon);
        if(!p)return;
        ctx.fillStyle='#d4a858';
        ctx.beginPath();
        ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fill();
      });
    }
  });
}

function drawInProgress(ctx){
  if(STATE.drawMode==='route'&&STATE.currentRoute.length>0){
    /* Draw pending great-circle from each waypoint to mouse */
    ctx.strokeStyle='rgba(64,232,136,.5)';
    ctx.lineWidth=2;
    ctx.setLineDash([5,5]);
    for(var i=0;i<STATE.currentRoute.length-1;i++){
      var a=STATE.currentRoute[i],b=STATE.currentRoute[i+1];
      ctx.beginPath();
      var started=false;
      for(var t=0;t<=1;t+=0.05){
        var pt=GEO.interpolate(a.lat,a.lon,b.lat,b.lon,t);
        var p=latLonToCanvas(pt.lat,pt.lon);
        if(!p){started=false;continue;}
        if(!started){ctx.moveTo(p.x,p.y);started=true;}
        else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }
    /* Last segment to mouse */
    if(STATE.hoverLatLon){
      var a2=STATE.currentRoute[STATE.currentRoute.length-1];
      var b2=STATE.hoverLatLon;
      ctx.beginPath();
      var started2=false;
      for(var t2=0;t2<=1;t2+=0.05){
        var pt2=GEO.interpolate(a2.lat,a2.lon,b2.lat,b2.lon,t2);
        var p2=latLonToCanvas(pt2.lat,pt2.lon);
        if(!p2){started2=false;continue;}
        if(!started2){ctx.moveTo(p2.x,p2.y);started2=true;}
        else ctx.lineTo(p2.x,p2.y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    /* Waypoints */
    STATE.currentRoute.forEach(function(wp,i){
      var p=latLonToCanvas(wp.lat,wp.lon);
      if(!p)return;
      ctx.fillStyle='#40e888';
      ctx.beginPath();
      ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#0a0f1a';
      ctx.font='bold 9px monospace';
      ctx.textAlign='center';
      ctx.fillText(String(i+1),p.x,p.y+3);
    });
  }
  if(STATE.drawMode==='polygon'&&STATE.currentPolygon.length>0){
    ctx.strokeStyle='rgba(212,168,88,.6)';
    ctx.lineWidth=2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    var started3=false;
    STATE.currentPolygon.forEach(function(pt){
      var p=latLonToCanvas(pt.lat,pt.lon);
      if(!p)return;
      if(!started3){ctx.moveTo(p.x,p.y);started3=true;}
      else ctx.lineTo(p.x,p.y);
    });
    if(STATE.hoverLatLon){
      var ph=latLonToCanvas(STATE.hoverLatLon.lat,STATE.hoverLatLon.lon);
      if(ph)ctx.lineTo(ph.x,ph.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    STATE.currentPolygon.forEach(function(pt){
      var p=latLonToCanvas(pt.lat,pt.lon);
      if(!p)return;
      ctx.fillStyle='#d4a858';
      ctx.beginPath();
      ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fill();
    });
  }
  if(STATE.drawMode==='measure'&&STATE.currentRoute.length>0){
    /* Similar to route drawing but style differ */
    ctx.strokeStyle='rgba(64,160,255,.7)';
    ctx.lineWidth=1.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    var started4=false;
    STATE.currentRoute.forEach(function(pt){
      var p=latLonToCanvas(pt.lat,pt.lon);
      if(!p)return;
      if(!started4){ctx.moveTo(p.x,p.y);started4=true;}
      else ctx.lineTo(p.x,p.y);
    });
    if(STATE.hoverLatLon){
      var ph2=latLonToCanvas(STATE.hoverLatLon.lat,STATE.hoverLatLon.lon);
      if(ph2)ctx.lineTo(ph2.x,ph2.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    /* Show total distance */
    if(STATE.currentRoute.length>=2){
      var total=0;
      for(var i2=0;i2<STATE.currentRoute.length-1;i2++){
        var a3=STATE.currentRoute[i2],b3=STATE.currentRoute[i2+1];
        total+=GEO.haversine(a3.lat,a3.lon,b3.lat,b3.lon);
      }
      if(STATE.hoverLatLon){
        var last=STATE.currentRoute[STATE.currentRoute.length-1];
        total+=GEO.haversine(last.lat,last.lon,STATE.hoverLatLon.lat,STATE.hoverLatLon.lon);
      }
      var mid=latLonToCanvas(
        (STATE.currentRoute[0].lat+STATE.currentRoute[STATE.currentRoute.length-1].lat)/2,
        (STATE.currentRoute[0].lon+STATE.currentRoute[STATE.currentRoute.length-1].lon)/2);
      if(mid){
        ctx.fillStyle='rgba(0,0,0,.75)';
        var text=fmt(total,1)+' km';
        var w=ctx.measureText(text).width+16;
        ctx.fillRect(mid.x-w/2,mid.y-24,w,18);
        ctx.fillStyle='#40a0ff';
        ctx.font='bold 11px monospace';
        ctx.textAlign='center';
        ctx.fillText(text,mid.x,mid.y-10);
      }
    }
  }
  if(STATE.drawMode==='marker'&&STATE.hoverLatLon){
    var p=latLonToCanvas(STATE.hoverLatLon.lat,STATE.hoverLatLon.lon);
    if(p){
      ctx.strokeStyle='rgba(212,168,88,.6)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.arc(p.x,p.y,10,0,Math.PI*2);
      ctx.stroke();
    }
  }
}

function drawHover(ctx){
  if(!STATE.hoverCity)return;
  var p=latLonToCanvas(STATE.hoverCity.lat,STATE.hoverCity.lon);
  if(!p)return;
  ctx.strokeStyle='#d4a858';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(p.x,p.y,10,0,Math.PI*2);
  ctx.stroke();
  /* Tooltip */
  var text=STATE.hoverCity.name+', '+STATE.hoverCity.country;
  ctx.font='11px monospace';
  var w=ctx.measureText(text).width+16;
  ctx.fillStyle='rgba(12,20,32,.92)';
  ctx.fillRect(p.x-w/2,p.y-32,w,20);
  ctx.strokeStyle='#d4a858';
  ctx.lineWidth=1;
  ctx.strokeRect(p.x-w/2,p.y-32,w,20);
  ctx.fillStyle='#d4a858';
  ctx.textAlign='center';
  ctx.fillText(text,p.x,p.y-18);
}

/* ================================================================
   OVERLAY
   ================================================================ */
function updateOverlay(){
  $('tbCoord').textContent=fmt(STATE.center.lat,4)+'° , '+fmt(STATE.center.lon,4)+'°';
  $('sbLat').textContent=fmt(STATE.center.lat,4)+'°';
  $('sbLon').textContent=fmt(STATE.center.lon,4)+'°';
  $('sbProj').textContent=getProj().short;
  $('sbZoom').textContent=fmt(STATE.zoom,2)+'×';
  $('sbMarkers').textContent=STATE.markers.length;
  $('sbRoute').textContent=STATE.routes.length?STATE.routes.length+' route(s)':'—';
  /* Scale bar */
  var mpp=TILE.metersPerPixel(STATE.center.lat,zoomToTileZoom(STATE.zoom));
  var kmPer100px=mpp*100/1000;
  var scaleText;
  if(kmPer100px<1)scaleText=fmt(kmPer100px*1000,0)+' m';
  else if(kmPer100px<100)scaleText=fmt(kmPer100px,1)+' km';
  else scaleText=fmt(kmPer100px,0)+' km';
  $('coScale').textContent='100px ≈ '+scaleText;
  /* Stats */
  var stats='<div>Lat '+fmt(STATE.center.lat,3)+'°</div>';
  stats+='<div>Lon '+fmt(STATE.center.lon,3)+'°</div>';
  stats+='<div>Projection '+getProj().short+'</div>';
  stats+='<div>Zoom '+fmt(STATE.zoom,2)+'×</div>';
  $('coStats').innerHTML=stats;
  /* Mode indicator */
  var modeLabels={marker:'Marker',route:'Route',polygon:'Polygon',measure:'Measure'};
  $('sbMode').textContent=modeLabels[STATE.drawMode]||'Map';
  $('btnDrawMode').classList.toggle('active',STATE.drawMode!=='marker');
}

function zoomToTileZoom(zoom){
  return Math.log2(zoom)+2;
}

/* ================================================================
   INTERACTION
   ================================================================ */
function canvasPos(e){
  var r=CANV.canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top,clientX:e.clientX,clientY:e.clientY};
}

function findNearestCity(lat,lon,maxDist){
  maxDist=maxDist||2;
  var best=null,bestD=maxDist;
  CITIES.forEach(function(c){
    var d=GEO.haversine(lat,lon,c.lat,c.lon);
    /* Convert to deg approx */
    var dDeg=d/111;
    if(dDeg<bestD){bestD=dDeg;best=c;}
  });
  return best;
}

function onDown(e){
  var p=canvasPos(e);
  STATE.dragStart={x:p.x,y:p.y,centerLat:STATE.center.lat,centerLon:STATE.center.lon};
  STATE.dragging=false;
  /* Left click places */
  if(e.button===0&&STATE.drawMode!=='marker'){
    var ll=canvasToLatLon(p.x,p.y);
    if(ll){
      if(STATE.drawMode==='route'||STATE.drawMode==='measure'){
        STATE.currentRoute.push(ll);
      } else if(STATE.drawMode==='polygon'){
        STATE.currentPolygon.push(ll);
      }
    }
  }
}

function onMove(e){
  var p=canvasPos(e);
  var ll=canvasToLatLon(p.x,p.y);
  STATE.hoverLatLon=ll;
  /* Update coordinate display */
  if(ll){
    $('tbCoord').textContent=GEO.toDMS(ll.lat,true)+' · '+GEO.toDMS(ll.lon,false);
  }
  /* Hover detection */
  if(ll){
    STATE.hoverCity=findNearestCity(ll.lat,ll.lon,1.5);
  } else STATE.hoverCity=null;
  /* Dragging */
  if(STATE.dragStart){
    var dx=p.x-STATE.dragStart.x;
    var dy=p.y-STATE.dragStart.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3)STATE.dragging=true;
    if(STATE.dragging){
      /* Pan the map */
      var scale=getProjectionScale();
      var proj=getProj();
      if(STATE.projection==='orthographic'||STATE.projection==='azimuthal'){
        /* Rotate center */
        var lat0=STATE.dragStart.centerLat;
        var lon0=STATE.dragStart.centerLon;
        /* Simple screen-based adjustment */
        var newLat=clamp(lat0-dy/(CANV.H)*60,-85,85);
        var newLon=((lon0-dx/(CANV.W)*90+540)%360)-180;
        STATE.center.lat=newLat;
        STATE.center.lon=newLon;
      } else {
        STATE.center.lat=clamp(STATE.dragStart.centerLat+dy/(CANV.H)*140*STATE.zoom,-90,90);
        STATE.center.lon=STATE.dragStart.centerLon-dx/(CANV.W)*360/STATE.zoom;
        while(STATE.center.lon>180)STATE.center.lon-=360;
        while(STATE.center.lon<-180)STATE.center.lon+=360;
      }
    }
  }
  render();
}

function onUp(e){
  if(!STATE.dragging&&e.button===0&&STATE.drawMode==='marker'&&STATE.hoverLatLon){
    /* Place a marker */
    STATE.markers.push({name:'Marker '+(STATE.markers.length+1),lat:STATE.hoverLatLon.lat,lon:STATE.hoverLatLon.lon});
    toast('Marker added at '+fmt(STATE.hoverLatLon.lat,2)+', '+fmt(STATE.hoverLatLon.lon,2),'success');
    renderRightPanel();
  }
  STATE.dragStart=null;
  STATE.dragging=false;
}

function onLeave(){STATE.dragStart=null;STATE.dragging=false;STATE.hoverLatLon=null;STATE.hoverCity=null}

function onWheel(e){
  e.preventDefault();
  var p=canvasPos(e);
  var factor=e.deltaY<0?1.15:1/1.15;
  var oldZoom=STATE.zoom;
  STATE.zoom=clamp(STATE.zoom*factor,0.4,80);
  /* Zoom to cursor */
  if(STATE.hoverLatLon){
    /* Slight adjust center toward cursor */
    var ll=canvasToLatLon(p.x,p.y);
    if(ll){
      STATE.center.lat=STATE.center.lat+(ll.lat-STATE.center.lat)*0.1;
      STATE.center.lon=STATE.center.lon+(ll.lon-STATE.center.lon)*0.1;
    }
  }
  render();
}

function onRightClick(e){
  /* Delete nearest marker */
  var p=canvasPos(e);
  var ll=canvasToLatLon(p.x,p.y);
  if(!ll)return;
  var nearest=-1;
  var nd=3/111;
  STATE.markers.forEach(function(m,i){
    var d=GEO.haversine(ll.lat,ll.lon,m.lat,m.lon)/111;
    if(d<nd){nd=d;nearest=i;}
  });
  if(nearest>=0){
    STATE.markers.splice(nearest,1);
    toast('Marker removed','info');
    renderRightPanel();
  }
  render();
}

function onTouchStart(e){
  if(e.touches.length===1){
    var t=e.touches[0];
    onDown({clientX:t.clientX,clientY:t.clientY,button:0});
  } else if(e.touches.length===2){
    /* Pinch zoom */
    var dx=e.touches[0].clientX-e.touches[1].clientX;
    var dy=e.touches[0].clientY-e.touches[1].clientY;
    STATE.pinchDist=Math.sqrt(dx*dx+dy*dy);
  }
  e.preventDefault();
}
function onTouchMove(e){
  if(e.touches.length===1){
    onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});
  } else if(e.touches.length===2){
    var dx2=e.touches[0].clientX-e.touches[1].clientX;
    var dy2=e.touches[0].clientY-e.touches[1].clientY;
    var dist=Math.sqrt(dx2*dx2+dy2*dy2);
    if(STATE.pinchDist){
      var factor=dist/STATE.pinchDist;
      STATE.zoom=clamp(STATE.zoom*factor,0.4,80);
      STATE.pinchDist=dist;
      render();
    }
  }
  e.preventDefault();
}
function onTouchEnd(e){
  onUp({button:0});
  STATE.pinchDist=0;
  e.preventDefault();
}

/* ================================================================
   DRAW MODE
   ================================================================ */
var DRAW_MODES=['marker','route','polygon','measure'];
function cycleDrawMode(){
  var idx=DRAW_MODES.indexOf(STATE.drawMode);
  idx=(idx+1)%DRAW_MODES.length;
  STATE.drawMode=DRAW_MODES[idx];
  /* Finalize in-progress shapes */
  if(STATE.currentRoute.length>1){
    STATE.routes.push(STATE.currentRoute);
    STATE.currentRoute=[];
  } else STATE.currentRoute=[];
  if(STATE.currentPolygon.length>2){
    STATE.polygons.push({points:STATE.currentPolygon});
    STATE.currentPolygon=[];
  } else STATE.currentPolygon=[];
  toast('Draw mode: '+STATE.drawMode,'info',1200);
  render();
  updateOverlay();
}
</script>

/* ================================================================
   ROUTE COMPUTATION
   ================================================================ */
function computeRoute(){
  var fromStr=$('rtFrom').value;
  var toStr=$('rtTo').value;
  var from=parseCoords(fromStr);
  var to=parseCoords(toStr);
  if(!from||!to){toast('Invalid coordinates','error');return}
  var dist=GEO.haversine(from.lat,from.lon,to.lat,to.lon);
  var vDist=GEO.vincenty(from.lat,from.lon,to.lat,to.lon);
  var bearing=GEO.bearing(from.lat,from.lon,to.lat,to.lon);
  var mid=GEO.midpoint(from.lat,from.lon,to.lat,to.lon);
  var html='<div class="sec"><h4>Route Results</h4>';
  html+='<div class="stats-grid">';
  html+='<div class="stat"><div class="sv">'+fmt(dist,1)+'</div><div class="sl">km (haversine)</div></div>';
  html+='<div class="stat"><div class="sv">'+fmt(vDist,1)+'</div><div class="sl">km (vincenty)</div></div>';
  html+='<div class="stat"><div class="sv">'+fmt(bearing,1)+'°</div><div class="sl">bearing</div></div>';
  html+='<div class="stat"><div class="sv">'+fmt(dist/1.852,0)+'</div><div class="sl">nm</div></div>';
  html+='</div>';
  html+='<div class="kv">';
  html+='<div class="row"><span class="k">Flight time (900 km/h)</span><span class="v">'+fmtHours(dist/900)+'</span></div>';
  html+='<div class="row"><span class="k">Midpoint</span><span class="v">'+fmt(mid.lat,2)+', '+fmt(mid.lon,2)+'</span></div>';
  html+='<div class="row"><span class="k">Antipode</span><span class="v">'+fmt(-from.lat,2)+', '+fmt(((from.lon+360)%360)-180,2)+'</span></div>';
  html+='</div>';
  html+='<button class="btn primary full" style="margin-top:10px" onclick="drawRouteOnMap('+from.lat+','+from.lon+','+to.lat+','+to.lon+')">✈️ Draw on Map</button>';
  html+='</div>';
  var result=$('routeResult');
  if(!result){
    result=el('div',{id:'routeResult',class:'sec'});
    var lpb=$('lpBody');
    lpb.appendChild(result);
  }
  result.innerHTML=html;
}
function parseCoords(s){
  if(!s)return null;
  s=s.trim();
  /* Try "lat, lon" or "lat lon" */
  var parts=s.split(/[,\s]+/).filter(Boolean);
  if(parts.length<2)return null;
  var lat=parseFloat(parts[0]);
  var lon=parseFloat(parts[1]);
  if(isNaN(lat)||isNaN(lon))return null;
  return {lat:lat,lon:lon};
}
function fmtHours(h){
  var hours=Math.floor(h);
  var mins=Math.floor((h-hours)*60);
  return hours+'h '+mins+'m';
}
function drawRouteOnMap(lat1,lon1,lat2,lon2){
  STATE.routes.push([{lat:lat1,lon:lon1},{lat:lat2,lon:lon2}]);
  STATE.center={lat:(lat1+lat2)/2,lon:(lon1+lon2)/2};
  STATE.zoom=Math.max(STATE.zoom,2);
  render();

  toast('Route drawn','success');
}

/* ================================================================
   COORDINATE CONVERTER
   ================================================================ */
function convertCoords(){
  var lat=parseFloat($('cvLat').value);
  var lon=parseFloat($('cvLon').value);
  if(isNaN(lat)||isNaN(lon)){toast('Invalid coordinates','error');return}
  var html='';
  /* Decimal */
  html+='<div class="kv">';
  html+='<div class="row"><span class="k">Decimal</span><span class="v">'+fmt(lat,6)+', '+fmt(lon,6)+'</span></div>';
  html+='<div class="row"><span class="k">DMS</span><span class="v">'+GEO.toDMS(lat,true)+' '+GEO.toDMS(lon,false)+'</span></div>';
  /* DMS breakdown */
  html+='<div class="row"><span class="k">Latitude</span><span class="v">'+fmt(Math.abs(lat),4)+'° '+(lat>=0?'N':'S')+'</span></div>';
  html+='<div class="row"><span class="k">Longitude</span><span class="v">'+fmt(Math.abs(lon),4)+'° '+(lon>=0?'E':'W')+'</span></div>';
  /* UTM */
  html+='<div class="row"><span class="k">UTM Zone</span><span class="v">'+GEO.utmZone(lat,lon)+GEO.utmBand(lat)+'</span></div>';
  /* Timezone */
  var tz=GEO.approxTimezone(lon);
  html+='<div class="row"><span class="k">Timezone (est)</span><span class="v">UTC'+(tz>=0?'+':'')+tz+'</span></div>';
  /* Solar */
  var elev=GEO.solarElevation(STATE.currentTime,lat,lon);
  html+='<div class="row"><span class="k">Sun elevation</span><span class="v">'+fmt(elev,2)+'°</span></div>';
  html+='</div>';
  /* Reverse geocode to nearest city */
  var nearest=null,nd=Infinity;
  CITIES.forEach(function(c){
    var d=GEO.haversine(lat,lon,c.lat,c.lon);
    if(d<nd){nd=d;nearest=c;}
  });
  if(nearest){
    html+='<div style="margin-top:12px;padding:10px;background:var(--panel3);border-radius:var(--rxs)">'+
      '<div class="text-xs text-dim">Nearest city</div>'+
      '<div style="font-size:.8rem;font-weight:700;color:var(--c1);margin-top:4px">'+esc(nearest.name)+'</div>'+
      '<div class="text-xs" style="color:var(--tx3)">'+esc(nearest.country)+' · '+fmt(nd,1)+' km away</div></div>';
  }
  $('cvOutput').innerHTML=html;
  /* Center map on it */
  STATE.center.lat=lat;
  STATE.center.lon=lon;
  render();
}

   EXPORT
   ================================================================ */
function exportGeoJSON(){
  var features=[];
  STATE.markers.forEach(function(m){
    features.push({
      type:'Feature',
      geometry:{type:'Point',coordinates:[m.lon,m.lat]},
      properties:{name:m.name,type:'marker'}
    });
  });
  STATE.routes.forEach(function(r,i){
    features.push({
      type:'Feature',
      geometry:{type:'LineString',coordinates:r.map(function(p){return [p.lon,p.lat]})},
      properties:{name:'Route '+(i+1)}
    });
  });
  STATE.polygons.forEach(function(poly,i){
    var coords=poly.points.map(function(p){return [p.lon,p.lat]});
    coords.push(coords[0]);
    features.push({
      type:'Feature',
      geometry:{type:'Polygon',coordinates:[coords]},
      properties:{name:'Polygon '+(i+1)}
    });
  });
  var geojson={
    type:'FeatureCollection',
    features:features
  };
  var blob=new Blob([JSON.stringify(geojson,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='atlas-features.geojson';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Exported '+features.length+' features','success');
}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='d'||e.key==='D')cycleDrawMode();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   ANIMATION LOOP
   ================================================================ */
var _lastFrame=performance.now();
function animationLoop(now){
  var dt=(now-_lastFrame)/1000;
  _lastFrame=now;
  if(STATE.timeAnimating){
    STATE.currentTime=new Date(STATE.currentTime.getTime()+dt*86400*STATE.animationSpeed);
    /* Redraw only solar-dependent layers — for simplicity, full render */
    render();
    /* Update left panel sun labels */
    var hl=$('hourLabel');
    if(hl)hl.textContent=fmt(STATE.currentTime.getUTCHours()+STATE.currentTime.getUTCMinutes()/60,2);
  }
  requestAnimationFrame(animationLoop);
}

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Initializing projection engine (8 projections)...',
  'Loading geodesic formulas (Haversine, Vincenty)...',
  'Preparing '+(CONTINENTS.length)+' continent outlines...',
  'Loading '+CITIES.length+' cities worldwide...',
  'Compiling '+RIVERS.length+' river systems...',
  'Preparing '+MOUNTAINS.length+' mountain ranges...',
  'Loading '+PLATES.length+' tectonic plates...',
  'Warming up solar ephemeris...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(6,14);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('ATLAS ready · Press ? for help','success',3500);
      },400);
    }
  },150);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  initCanvas();
  buildTabs();
  buildProjPicker();
  renderLeftPanel();
  renderRightPanel();
  updateOverlay();
  render();
  requestAnimationFrame(animationLoop);
  bootSequence();
});
