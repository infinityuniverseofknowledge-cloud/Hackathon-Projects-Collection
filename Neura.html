<!DOCTYPE html>
<html lang="en" data-theme="neural">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEURA — Neural Networks Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#050810;--bg2:#0a1020;--bg3:#101a30;--bg4:#182448;
  --panel:#0a1020;--panel2:#101a30;--panel3:#182448;--panel4:#202c60;
  --bd:#1a2448;--bd2:#2c3a70;--bd3:#4050a0;
  --tx:#e0ecff;--tx2:#90a8d8;--tx3:#586ea0;--mu:#384880;
  --c1:#40e0ff;--c1h:#80f0ff;--c1l:#20a0c0;
  --c2:#ff40b0;--c2h:#ff80d0;--c2l:#c02080;
  --c3:#40ff90;--c3h:#80ffc0;--c3l:#20c060;
  --c4:#ff5060;--c4h:#ff90a0;--c4l:#c03040;
  --c5:#ffe040;--c5h:#fff080;--c5l:#c0a020;
  --c6:#a060ff;--c6h:#c090ff;--c6l:#7030c0;
  --c7:#ffa040;--c7h:#ffc080;--c7l:#c07020;
  --c8:#40ffd0;--c8h:#80ffe0;--c8l:#20c090;
  --ok:#40ff90;--warn:#ffe040;--err:#ff5060;--info:#40e0ff;
  --g1:linear-gradient(135deg,#40e0ff,#a060ff);
  --g2:linear-gradient(135deg,#ff40b0,#a060ff);
  --gHolo:linear-gradient(120deg,#40e0ff,#a060ff,#ff40b0,#ffe040,#40ff90,#40e0ff);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.75);
  --sh2:0 16px 48px rgba(0,0,0,.95);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="sunset"]{--bg:#100508;--bg2:#200a14;--bg3:#301020;--panel:#200a14;--panel2:#301020;
  --bd:#48203a;--bd2:#703060;--tx:#ffe0ec;--tx2:#d890b0;--tx3:#a06080;
  --c1:#ff60a0;--c2:#ffa040;--c3:#ffe040;--c6:#c040ff;
  --g1:linear-gradient(135deg,#ff60a0,#ffa040)}
[data-theme="light"]{--bg:#f5f8ff;--bg2:#eef4ff;--bg3:#dde8fa;--panel:#fff;--panel2:#f5f8ff;--panel3:#eef4ff;--panel4:#dde8fa;
  --bd:#c0d0e8;--bd2:#90a8d0;--tx:#081428;--tx2:#305080;--tx3:#607898;
  --c1:#0060c0;--c2:#c00060;--c3:#008040;--c6:#6020c0;
  --g1:linear-gradient(135deg,#0060c0,#6020c0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#050810;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-net{width:220px;height:140px;margin-bottom:24px}
.boot-net svg{width:100%;height:100%}
.boot-net circle{fill:#0a1020;stroke:#40e0ff;stroke-width:1.5}
.boot-net circle.active{fill:#40e0ff;filter:drop-shadow(0 0 8px #40e0ff);animation:blink 1.4s infinite}
.boot-net circle.active:nth-child(2n){animation-delay:.3s}
.boot-net circle.active:nth-child(3n){animation-delay:.6s}
.boot-net line{stroke:#a060ff;stroke-width:1;opacity:.4}
.boot-net line.active{stroke:#ff40b0;opacity:1;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#40e0ff;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#101a30;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40e0ff}
.boot-pct{font-size:.7rem;color:#40e0ff;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#586ea0;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:6px;font-size:1rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#050810;box-shadow:0 0 14px rgba(64,224,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#050810;border-color:transparent}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#182448;transition:var(--t1)}
.tb-status .dot.on{background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:280px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#03060c;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(10,16,32,.9);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:320px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,224,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#050810;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(64,224,255,.5)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.success{color:var(--c3);border-color:var(--c3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#050810;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* LOSS CHART */
.loss-chart{background:#03060c;border:1px solid var(--bd);border-radius:var(--rxs);width:100%;height:auto;display:block;margin-bottom:10px}
.chart-label{font-family:var(--mono);font-size:.6rem;color:var(--tx3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;font-weight:700;display:flex;justify-content:space-between}

/* LAYER DIAGRAM */
.layer-diagram{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd);font-family:var(--mono);font-size:.55rem;overflow-x:auto;margin-bottom:10px}
.layer-col{display:flex;flex-direction:column;gap:2px;align-items:center}
.layer-col .ln-label{color:var(--c2);font-size:.5rem;margin-bottom:3px}
.layer-col .ln-neuron{width:14px;height:14px;border-radius:50%;background:var(--panel3);border:1px solid var(--c1)}
.layer-col .ln-neuron.active{background:var(--g1);border-color:var(--c1h);box-shadow:0 0 6px var(--c1)}
.layer-arrow{color:var(--tx3);font-size:1rem}

/* KERNEL GRID */
.kernel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:120px;margin:0 auto 10px}
.kernel-cell{padding:4px;text-align:center;background:var(--panel3);border:1px solid var(--bd);border-radius:2px;font-family:var(--mono);font-size:.58rem;color:var(--c1);cursor:ns-resize;user-select:none}
.kernel-cell:hover{background:var(--panel4);border-color:var(--c1)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--c4)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ATTENTION HEATMAP */
.attn-tokens{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;justify-content:center}
.attn-token{padding:5px 10px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);cursor:pointer;font-family:var(--mono);font-size:.65rem;transition:var(--t1);color:var(--tx2)}
.attn-token:hover{border-color:var(--c1);color:var(--c1)}
.attn-token.active{background:var(--g1);color:#050810;border-color:transparent;font-weight:700}

@media(max-width:1000px){#leftPanel{width:240px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-net">
    <svg viewBox="0 0 220 140">
      <!-- Layer 1 -->
      <circle cx="30" cy="40" r="10"/><circle cx="30" cy="70" r="10"/><circle cx="30" cy="100" r="10"/>
      <!-- Layer 2 -->
      <circle class="active" cx="90" cy="30" r="10"/><circle class="active" cx="90" cy="60" r="10"/>
      <circle class="active" cx="90" cy="90" r="10"/><circle class="active" cx="90" cy="120" r="10"/>
      <!-- Layer 3 -->
      <circle class="active" cx="150" cy="50" r="10"/><circle class="active" cx="150" cy="90" r="10"/>
      <!-- Layer 4 -->
      <circle cx="200" cy="70" r="10"/>
      <!-- Connections L1-L2 -->
      <g><line x1="30" y1="40" x2="90" y2="30"/><line x1="30" y1="40" x2="90" y2="60"/>
      <line x1="30" y1="70" x2="90" y2="60"/><line x1="30" y1="70" x2="90" y2="90"/>
      <line x1="30" y1="100" x2="90" y2="90"/><line x1="30" y1="100" x2="90" y2="120"/></g>
      <!-- Connections L2-L3 -->
      <g><line class="active" x1="90" y1="30" x2="150" y2="50"/><line class="active" x1="90" y1="60" x2="150" y2="50"/>
      <line class="active" x1="90" y1="60" x2="150" y2="90"/><line class="active" x1="90" y1="90" x2="150" y2="90"/>
      <line class="active" x1="90" y1="90" x2="150" y2="50"/><line class="active" x1="90" y1="120" x2="150" y2="90"/></g>
      <!-- Connections L3-L4 -->
      <g><line x1="150" y1="50" x2="200" y2="70"/><line x1="150" y1="90" x2="200" y2="70"/></g>
    </svg>
  </div>
  <div class="boot-logo">NEURA</div>
  <div class="boot-sub">NEURAL NETWORKS STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('mlp')">NEURA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">▶</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="stepModule()" title="Step (.)">⏭</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function rndN(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?3:d;if(!isFinite(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2400;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:1rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   MATRIX (row-major, Float64Array backed)
   ================================================================ */
function Mat(rows,cols,data){
  this.rows=rows;this.cols=cols;
  this.data=data||new Float64Array(rows*cols);
}
Mat.zeros=function(r,c){return new Mat(r,c)};
Mat.ones=function(r,c){var m=new Mat(r,c);m.data.fill(1);return m};
Mat.rand=function(r,c,scale){var m=new Mat(r,c);scale=scale||1;for(var i=0;i<m.data.length;i++)m.data[i]=(Math.random()*2-1)*scale;return m};
Mat.randn=function(r,c,std){var m=new Mat(r,c);std=std||1;for(var i=0;i<m.data.length;i++)m.data[i]=rndN()*std;return m};
Mat.xavier=function(fanIn,fanOut){return Mat.randn(fanIn,fanOut,Math.sqrt(2/(fanIn+fanOut)))};
Mat.he=function(fanIn,fanOut){return Mat.randn(fanIn,fanOut,Math.sqrt(2/fanIn))};
Mat.prototype.at=function(i,j){return this.data[i*this.cols+j]};
Mat.prototype.set=function(i,j,v){this.data[i*this.cols+j]=v};
Mat.prototype.clone=function(){var m=new Mat(this.rows,this.cols);m.data.set(this.data);return m};
Mat.prototype.fill=function(v){this.data.fill(v);return this};
Mat.prototype.add=function(o){
  var r=new Mat(this.rows,this.cols);
  if(o instanceof Mat){
    if(o.rows===this.rows&&o.cols===this.cols){
      for(var i=0;i<this.data.length;i++)r.data[i]=this.data[i]+o.data[i];
    } else if(o.rows===1&&o.cols===this.cols){
      /* Broadcast row */
      for(var i2=0;i2<this.rows;i2++)for(var j=0;j<this.cols;j++)r.data[i2*this.cols+j]=this.data[i2*this.cols+j]+o.data[j];
    } else throw new Error('add shape mismatch');
  } else {
    for(var i3=0;i3<this.data.length;i3++)r.data[i3]=this.data[i3]+o;
  }
  return r;
};
Mat.prototype.sub=function(o){
  var r=new Mat(this.rows,this.cols);
  if(o instanceof Mat){
    for(var i=0;i<this.data.length;i++)r.data[i]=this.data[i]-o.data[i];
  } else for(var i2=0;i2<this.data.length;i2++)r.data[i2]=this.data[i2]-o;
  return r;
};
Mat.prototype.scale=function(s){var r=new Mat(this.rows,this.cols);for(var i=0;i<this.data.length;i++)r.data[i]=this.data[i]*s;return r};
Mat.prototype.hadamard=function(o){var r=new Mat(this.rows,this.cols);for(var i=0;i<this.data.length;i++)r.data[i]=this.data[i]*o.data[i];return r};
Mat.prototype.matmul=function(B){
  var A=this;
  if(A.cols!==B.rows)throw new Error('matmul shape '+A.rows+'x'+A.cols+' * '+B.rows+'x'+B.cols);
  var C=new Mat(A.rows,B.cols);
  for(var i=0;i<A.rows;i++){
    for(var k=0;k<A.cols;k++){
      var a=A.data[i*A.cols+k];
      if(a===0)continue;
      for(var j=0;j<B.cols;j++){
        C.data[i*B.cols+j]+=a*B.data[k*B.cols+j];
      }
    }
  }
  return C;
};
Mat.prototype.T=function(){
  var r=new Mat(this.cols,this.rows);
  for(var i=0;i<this.rows;i++)for(var j=0;j<this.cols;j++)r.data[j*this.rows+i]=this.data[i*this.cols+j];
  return r;
};
Mat.prototype.apply=function(fn){var r=new Mat(this.rows,this.cols);for(var i=0;i<this.data.length;i++)r.data[i]=fn(this.data[i]);return r};
Mat.prototype.applyIdx=function(fn){var r=new Mat(this.rows,this.cols);for(var i=0;i<this.data.length;i++)r.data[i]=fn(this.data[i],i);return r};
Mat.prototype.sumAxis0=function(){
  /* Sum over rows → [1, cols] */
  var r=new Mat(1,this.cols);
  for(var i=0;i<this.rows;i++)for(var j=0;j<this.cols;j++)r.data[j]+=this.data[i*this.cols+j];
  return r;
};
Mat.prototype.meanAxis0=function(){
  var s=this.sumAxis0();
  return s.scale(1/this.rows);
};
Mat.prototype.max=function(){var m=-Infinity;for(var i=0;i<this.data.length;i++)if(this.data[i]>m)m=this.data[i];return m};
Mat.prototype.mean=function(){var s=0;for(var i=0;i<this.data.length;i++)s+=this.data[i];return s/this.data.length};
Mat.prototype.norm=function(){var s=0;for(var i=0;i<this.data.length;i++)s+=this.data[i]*this.data[i];return Math.sqrt(s)};

/* ================================================================
   ACTIVATIONS
   ================================================================ */
var ACT={
  relu:{name:'ReLU',fn:function(x){return x>0?x:0},df:function(x){return x>0?1:0}},
  leaky:{name:'LeakyReLU',fn:function(x){return x>0?x:0.01*x},df:function(x){return x>0?1:0.01}},
  sigmoid:{name:'Sigmoid',fn:function(x){return 1/(1+Math.exp(-clamp(x,-30,30)))},df:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return s*(1-s)}},
  tanh:{name:'Tanh',fn:function(x){return Math.tanh(x)},df:function(x){var t=Math.tanh(x);return 1-t*t}},
  linear:{name:'Linear',fn:function(x){return x},df:function(x){return 1}},
  elu:{name:'ELU',fn:function(x){return x>0?x:Math.exp(clamp(x,-30,0))-1},df:function(x){return x>0?1:Math.exp(clamp(x,-30,0))}},
  swish:{name:'Swish',fn:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return x*s},df:function(x){var s=1/(1+Math.exp(-clamp(x,-30,30)));return s+x*s*(1-s)}}
};

/* Softmax applied row-wise */
function softmaxRows(M){
  var R=new Mat(M.rows,M.cols);
  for(var i=0;i<M.rows;i++){
    var mx=-Infinity;
    for(var j=0;j<M.cols;j++)if(M.data[i*M.cols+j]>mx)mx=M.data[i*M.cols+j];
    var s=0;
    for(var j2=0;j2<M.cols;j2++){
      var e=Math.exp(M.data[i*M.cols+j2]-mx);
      R.data[i*M.cols+j2]=e;
      s+=e;
    }
    for(var j3=0;j3<M.cols;j3++)R.data[i*M.cols+j3]/=s;
  }
  return R;
}

/* ================================================================
   LOSSES
   ================================================================ */
function mseLoss(pred,target){
  var s=0;
  for(var i=0;i<pred.data.length;i++){var d=pred.data[i]-target.data[i];s+=d*d;}
  return s/pred.data.length;
}
function mseGrad(pred,target){
  var R=new Mat(pred.rows,pred.cols);
  var n=pred.data.length;
  for(var i=0;i<n;i++)R.data[i]=2*(pred.data[i]-target.data[i])/n;
  return R;
}
function crossEntropyLoss(probs,targetIdx){
  /* probs: [batch, classes]  targetIdx: array of class indices */
  var s=0;
  for(var i=0;i<probs.rows;i++){
    var p=clamp(probs.data[i*probs.cols+targetIdx[i]],1e-9,1);
    s-=Math.log(p);
  }
  return s/probs.rows;
}
function crossEntropyGradFromProbs(probs,targetIdx){
  /* Returns gradient w.r.t. LOGITS (softmax+CE combined) */
  var R=new Mat(probs.rows,probs.cols);
  for(var i=0;i<probs.rows;i++){
    for(var j=0;j<probs.cols;j++){
      var y=(j===targetIdx[i])?1:0;
      R.data[i*probs.cols+j]=(probs.data[i*probs.cols+j]-y)/probs.rows;
    }
  }
  return R;
}
function accuracy(probs,targetIdx){
  var c=0;
  for(var i=0;i<probs.rows;i++){
    var best=0;
    for(var j=1;j<probs.cols;j++)if(probs.data[i*probs.cols+j]>probs.data[i*probs.cols+best])best=j;
    if(best===targetIdx[i])c++;
  }
  return c/probs.rows;
}
function binaryAccuracy(probs,targetIdx){
  /* probs: [batch, 1] with sigmoid outputs */
  var c=0;
  for(var i=0;i<probs.rows;i++){
    var pred=probs.data[i]>0.5?1:0;
    if(pred===targetIdx[i])c++;
  }
  return c/probs.rows;
}
</script>
<script>
/* ================================================================
   DENSE LAYER
   ================================================================ */
function Dense(nIn,nOut,activation,init){
  this.nIn=nIn;this.nOut=nOut;
  this.act=activation||ACT.relu;
  this.W=(init==='he')?Mat.he(nIn,nOut):((init==='xavier')?Mat.xavier(nIn,nOut):Mat.randn(nIn,nOut,Math.sqrt(1/nIn)));
  this.b=Mat.zeros(1,nOut);
  this.gradW=null;this.gradB=null;
  /* Cached for backward */
  this._input=null;this._z=null;this._a=null;
  /* Optimizer state */
  this._mW=Mat.zeros(nIn,nOut);this._vW=Mat.zeros(nIn,nOut);
  this._mB=Mat.zeros(1,nOut);this._vB=Mat.zeros(1,nOut);
  this._t=0;
}
Dense.prototype.forward=function(X){
  this._input=X;
  this._z=X.matmul(this.W).add(this.b);
  this._a=this._z.apply(this.act.fn);
  return this._a;
};
Dense.prototype.backward=function(dA){
  /* dA: gradient w.r.t. output activation a, shape [batch, nOut] */
  var dZ=dA.hadamard(this._z.apply(this.act.df));
  this.gradW=this._input.T().matmul(dZ);
  this.gradB=dZ.sumAxis0();
  /* Gradient w.r.t. input */
  return dZ.matmul(this.W.T());
};
Dense.prototype.zeroGrad=function(){
  this.gradW=Mat.zeros(this.nIn,this.nOut);
  this.gradB=Mat.zeros(1,this.nOut);
};

/* ================================================================
   MLP with softmax classification or regression
   ================================================================ */
function MLP(sizes,activation,outputType,init){
  /* sizes: array of layer sizes, e.g. [2, 8, 8, 2] */
  this.sizes=sizes;
  this.layers=[];
  this.outputType=outputType||'softmax'; /* 'softmax' | 'regression' | 'binary' */
  for(var i=0;i<sizes.length-1;i++){
    var isLast=i===sizes.length-2;
    var act=(this.outputType==='regression'||isLast)?ACT.linear:activation;
    var ini=init||(activation===ACT.relu?'he':'xavier');
    this.layers.push(new Dense(sizes[i],sizes[i+1],act,ini));
  }
}
MLP.prototype.forward=function(X){
  var a=X;
  for(var i=0;i<this.layers.length;i++)a=this.layers[i].forward(a);
  this._logits=a;
  if(this.outputType==='softmax')return softmaxRows(a);
  if(this.outputType==='binary')return a.apply(function(x){return 1/(1+Math.exp(-clamp(x,-30,30)))});
  return a;
};
MLP.prototype.backward=function(gradOutput){
  /* gradOutput should already be gradient w.r.t. the last activation */
  var g=gradOutput;
  for(var i=this.layers.length-1;i>=0;i--)g=this.layers[i].backward(g);
};
MLP.prototype.zeroGrad=function(){for(var i=0;i<this.layers.length;i++)this.layers[i].zeroGrad()};
MLP.prototype.paramCount=function(){
  var n=0;
  for(var i=0;i<this.layers.length;i++)n+=this.layers[i].nIn*this.layers[i].nOut+this.layers[i].nOut;
  return n;
};
MLP.prototype.sgdStep=function(lr){
  for(var i=0;i<this.layers.length;i++){
    var L=this.layers[i];
    for(var k=0;k<L.W.data.length;k++)L.W.data[k]-=lr*L.gradW.data[k];
    for(var k2=0;k2<L.b.data.length;k2++)L.b.data[k2]-=lr*L.gradB.data[k2];
  }
};
MLP.prototype.momentumStep=function(lr,beta){
  beta=beta||0.9;
  for(var i=0;i<this.layers.length;i++){
    var L=this.layers[i];
    for(var k=0;k<L.W.data.length;k++){
      L._mW.data[k]=beta*L._mW.data[k]+L.gradW.data[k];
      L.W.data[k]-=lr*L._mW.data[k];
    }
    for(var k2=0;k2<L.b.data.length;k2++){
      L._mB.data[k2]=beta*L._mB.data[k2]+L.gradB.data[k2];
      L.b.data[k2]-=lr*L._mB.data[k2];
    }
  }
};
MLP.prototype.adamStep=function(lr,beta1,beta2,eps){
  beta1=beta1||0.9;beta2=beta2||0.999;eps=eps||1e-8;
  for(var i=0;i<this.layers.length;i++){
    var L=this.layers[i];
    L._t++;
    var bc1=1-Math.pow(beta1,L._t);
    var bc2=1-Math.pow(beta2,L._t);
    for(var k=0;k<L.W.data.length;k++){
      L._mW.data[k]=beta1*L._mW.data[k]+(1-beta1)*L.gradW.data[k];
      L._vW.data[k]=beta2*L._vW.data[k]+(1-beta2)*L.gradW.data[k]*L.gradW.data[k];
      var mHat=L._mW.data[k]/bc1;
      var vHat=L._vW.data[k]/bc2;
      L.W.data[k]-=lr*mHat/(Math.sqrt(vHat)+eps);
    }
    for(var k2=0;k2<L.b.data.length;k2++){
      L._mB.data[k2]=beta1*L._mB.data[k2]+(1-beta1)*L.gradB.data[k2];
      L._vB.data[k2]=beta2*L._vB.data[k2]+(1-beta2)*L.gradB.data[k2]*L.gradB.data[k2];
      var mHat2=L._mB.data[k2]/bc1;
      var vHat2=L._vB.data[k2]/bc2;
      L.b.data[k2]-=lr*mHat2/(Math.sqrt(vHat2)+eps);
    }
  }
};
MLP.prototype.step=function(lr,optimizer){
  if(optimizer==='sgd')this.sgdStep(lr);
  else if(optimizer==='momentum')this.momentumStep(lr);
  else this.adamStep(lr);
};

/* ================================================================
   DATASETS (2D classification)
   ================================================================ */
var DATASETS={
  xor:function(n){
    var X=[],y=[];
    for(var i=0;i<n;i++){
      var a=Math.random()*2-1;
      var b=Math.random()*2-1;
      var label=(a*b>0)?1:0;
      X.push([a*0.9+rndN()*0.06,b*0.9+rndN()*0.06]);
      y.push(label);
    }
    return {X:X,y:y,classes:2,range:1.2};
  },
  circles:function(n){
    var X=[],y=[];
    for(var i=0;i<n;i++){
      var outer=i%2===0;
      var r=outer?(0.75+Math.random()*0.2):(Math.random()*0.35);
      var a=Math.random()*Math.PI*2;
      X.push([Math.cos(a)*r+rndN()*0.04,Math.sin(a)*r+rndN()*0.04]);
      y.push(outer?0:1);
    }
    return {X:X,y:y,classes:2,range:1.2};
  },
  moons:function(n){
    var X=[],y=[];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI;
      var upper=i%2===0;
      var x,yy;
      if(upper){x=Math.cos(a)*0.8-0.2;yy=Math.sin(a)*0.8-0.15;}
      else{x=-Math.cos(a)*0.8+0.2;yy=-Math.sin(a)*0.8+0.25;}
      X.push([x+rndN()*0.05,yy+rndN()*0.05]);
      y.push(upper?0:1);
    }
    return {X:X,y:y,classes:2,range:1.2};
  },
  spiral:function(n){
    var X=[],y=[];
    var perClass=Math.floor(n/3);
    for(var c=0;c<3;c++){
      for(var i=0;i<perClass;i++){
        var r=(i/perClass)*0.9+0.05;
        var a=(i/perClass)*4+c*(Math.PI*2/3)+rndN()*0.08;
        X.push([Math.cos(a)*r+rndN()*0.03,Math.sin(a)*r+rndN()*0.03]);
        y.push(c);
      }
    }
    return {X:X,y:y,classes:3,range:1.2};
  },
  gaussian:function(n){
    var X=[],y=[];
    var centers=[[-0.5,-0.4],[0.5,-0.4],[0,0.5]];
    for(var i=0;i<n;i++){
      var c=i%3;
      X.push([centers[c][0]+rndN()*0.18,centers[c][1]+rndN()*0.18]);
      y.push(c);
    }
    return {X:X,y:y,classes:3,range:1.2};
  },
  blobs:function(n){
    var X=[],y=[];
    for(var i=0;i<n;i++){
      var c=i%4;
      var cx=(c%2)*0.7-0.35;
      var cy=Math.floor(c/2)*0.7-0.35;
      X.push([cx+rndN()*0.15,cy+rndN()*0.15]);
      y.push(c);
    }
    return {X:X,y:y,classes:4,range:1.2};
  },
  linear:function(n){
    var X=[],y=[];
    for(var i=0;i<n;i++){
      var a=Math.random()*2-1;
      var b=Math.random()*2-1;
      var label=(a+b>0)?1:0;
      X.push([a,b]);
      y.push(label);
    }
    return {X:X,y:y,classes:2,range:1.2};
  }
};

/* ================================================================
   2D CONVOLUTION
   ================================================================ */
var KERNELS={
  identity:[[0,0,0],[0,1,0],[0,0,0]],
  edge:[[-1,-1,-1],[-1,8,-1],[-1,-1,-1]],
  edgeH:[[-1,-2,-1],[0,0,0],[1,2,1]],
  edgeV:[[-1,0,1],[-2,0,2],[-1,0,1]],
  blur:[[1/9,1/9,1/9],[1/9,1/9,1/9],[1/9,1/9,1/9]],
  sharpen:[[0,-1,0],[-1,5,-1],[0,-1,0]],
  emboss:[[-2,-1,0],[-1,1,1],[0,1,2]],
  sobelX:[[-1,0,1],[-2,0,2],[-1,0,1]],
  sobelY:[[-1,-2,-1],[0,0,0],[1,2,1]],
  laplacian:[[0,1,0],[1,-4,1],[0,1,0]],
  gaussian:[[1,2,1],[2,4,2],[1,2,1]],
  outline:[[-1,-1,-1],[-1,9,-1],[-1,-1,-1]]
};
function convolve2D(image,w,h,kernel,stride){
  stride=stride||1;
  var kh=kernel.length,kw=kernel[0].length;
  var oh=Math.floor((h-kh)/stride)+1;
  var ow=Math.floor((w-kw)/stride)+1;
  var out=new Float64Array(oh*ow);
  for(var y=0;y<oh;y++){
    for(var x=0;x<ow;x++){
      var s=0;
      for(var ky=0;ky<kh;ky++){
        for(var kx=0;kx<kw;kx++){
          s+=image[(y*stride+ky)*w+(x*stride+kx)]*kernel[ky][kx];
        }
      }
      out[y*ow+x]=s;
    }
  }
  return {data:out,w:ow,h:oh};
}
function maxPool2D(image,w,h,size){
  var oh=Math.floor(h/size),ow=Math.floor(w/size);
  var out=new Float64Array(oh*ow);
  for(var y=0;y<oh;y++)for(var x=0;x<ow;x++){
    var mx=-Infinity;
    for(var dy=0;dy<size;dy++)for(var dx=0;dx<size;dx++){
      var v=image[(y*size+dy)*w+(x*size+dx)];
      if(v>mx)mx=v;
    }
    out[y*ow+x]=mx;
  }
  return {data:out,w:ow,h:oh};
}
function normalizeImage(data){
  var mn=Infinity,mx=-Infinity;
  for(var i=0;i<data.length;i++){if(data[i]<mn)mn=data[i];if(data[i]>mx)mx=data[i];}
  if(mx-mn<1e-9)return new Float64Array(data.length);
  var out=new Float64Array(data.length);
  for(var j=0;j<data.length;j++)out[j]=(data[j]-mn)/(mx-mn);
  return out;
}

/* ================================================================
   SIMPLE RNN (Elman)
   ================================================================ */
function RNN(nIn,nHidden,seqLen){
  this.nIn=nIn;this.nH=nHidden;this.seqLen=seqLen;
  /* Weights */
  this.Wx=Mat.randn(nIn,nHidden,0.3);
  this.Wh=Mat.randn(nHidden,nHidden,0.3);
  this.Whh=Mat.randn(nHidden,1,0.3);
  this.bh=Mat.zeros(1,nHidden);
  this.by=Mat.zeros(1,1);
  /* Optimizer state */
  this.m={Wx:Mat.zeros(nIn,nHidden),Wh:Mat.zeros(nHidden,nHidden),Whh:Mat.zeros(nHidden,1),bh:Mat.zeros(1,nHidden),by:Mat.zeros(1,1)};
  this.v={Wx:Mat.zeros(nIn,nHidden),Wh:Mat.zeros(nHidden,nHidden),Whh:Mat.zeros(nHidden,1),bh:Mat.zeros(1,nHidden),by:Mat.zeros(1,1)};
  this.t=0;
}
RNN.prototype.forward=function(seq){
  /* seq: array of scalars (length seqLen). Predict next after each input. */
  var states=[];
  var outputs=[];
  var h=Mat.zeros(1,this.nH);
  states.push(h);
  for(var t=0;t<seq.length;t++){
    var x=new Mat(1,this.nIn);
    /* One-hot encode last N values? Simple: use scalar plus sin/cos phase. */
    x.data[0]=seq[t];
    if(this.nIn>1)x.data[1]=Math.sin(seq[t]*Math.PI);
    if(this.nIn>2)x.data[2]=Math.cos(seq[t]*Math.PI);
    if(this.nIn>3)x.data[3]=seq[t]*seq[t];
    var z=x.matmul(this.Wx).add(h.matmul(this.Wh)).add(this.bh);
    h=z.apply(Math.tanh);
    var y=z.matmul(this.Whh).add(this.by);
    /* y is pre-activation of scalar output */
    outputs.push(y.data[0]);
    states.push(h);
  }
  this._states=states;
  this._outputs=outputs;
  return outputs;
};
/* ================================================================
   SCALED DOT-PRODUCT ATTENTION
   ================================================================ */
function attention(Q,K,V,scale){
  /* Q,K,V: [n, d] matrices */
  var d=Q.cols;
  var scores=Q.matmul(K.T());
  var sc=1/Math.sqrt(scale||d);
  var scaled=scores.scale(sc);
  /* Row-wise softmax */
  var weights=softmaxRows(scaled);
  var out=weights.matmul(V);
  return {scores:scores,weights:weights,output:out};
}

  LOG.push({t:Date.now(),msg:msg,type:type});

  if(STATE.currentRp==='logs')renderLogs();
}

function drawLossChart(ctx,x,y,w,h,history,label,color){
  ctx.fillStyle='rgba(3,6,12,.7)';
  ctx.strokeStyle='rgba(64,224,255,.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,4);
  ctx.fill();ctx.stroke();
  if(!history||history.length<2){
    ctx.fillStyle='rgba(90,110,160,.6)';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText('waiting...',x+w/2,y+h/2+4);
    return;
  }
  var minV=Infinity,maxV=-Infinity;
  history.forEach(function(v){if(v<minV)minV=v;if(v>maxV)maxV=v;});
  if(maxV-minV<1e-9){maxV=minV+1;}
  ctx.strokeStyle=color||'#40e0ff';
  ctx.lineWidth=2;
  ctx.beginPath();
  var N=history.length;
  var view=Math.min(N,200);
  var offset=N-view;
  for(var i=0;i<view;i++){
    var v=history[offset+i];
    var px=x+(i/(view-1))*w;
    var py=y+h-((v-minV)/(maxV-minV))*h*0.85-h*0.075;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
  /* Labels */
  ctx.fillStyle='rgba(144,168,216,.9)';
  ctx.font='9px monospace';
  ctx.textAlign='left';
  ctx.fillText(label||'loss',x+5,y+12);
  ctx.textAlign='right';
  ctx.fillStyle=color||'#40e0ff';
  ctx.fillText(fmt(history[history.length-1],4),x+w-5,y+12);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(88,110,160,.7)';
  ctx.fillText(fmt(minV,3),x+5,y+h-4);
  ctx.fillText(fmt(maxV,3),x+5,y+24);
}
if(!CanvasRenderingContext2D.prototype.roundRect){

    this.arcTo(x+w,y+h,x,y+h,r);

    this.closePath();

registerModule('perceptron',{

  icon:'⚡',
  desc:'Single linear neuron. Learn a decision boundary. Watch how it fails on non-linearly-separable data.',
  init:function(){
    var p=STATE.perceptron;
    p.data=DATASETS[p.dataset](300);
    p.w=[rndN()*0.1,rndN()*0.1];
    p.b=0;
    p.history=[];
    p.loss=null;p.accuracy=0;
    p.init=true;
  },
  tick:function(dt){
    var p=STATE.perceptron;
    if(!p.data)return;
    /* One pass over data — SGD */
    var X=p.data.X,y=p.data.y;
    var epochLoss=0;
    var correct=0;
    var n=X.length;
    for(var i=0;i<n;i++){
      var xi=X[i];
      var zi=p.w[0]*xi[0]+p.w[1]*xi[1]+p.b;
      var pi=1/(1+Math.exp(-clamp(zi,-30,30)));
      var yi=y[i];
      var err=pi-yi;
      p.w[0]-=p.lr*err*xi[0];
      p.w[1]-=p.lr*err*xi[1];
      p.b-=p.lr*err;
      epochLoss+=(yi*Math.log(pi+1e-9)+(1-yi)*Math.log(1-pi+1e-9));
      if((pi>0.5?1:0)===yi)correct++;
    }
    p.loss=-epochLoss/n;
    p.accuracy=correct/n;
    p.history.push(p.loss);
    if(p.history.length>500)p.history.shift();
    STATE.epoch++;
    STATE.time+=dt;
    STATE.steps++;
    $('sbLoss').textContent=fmt(p.loss,4);
    $('sbAcc').textContent=fmt(p.accuracy*100,1)+'%';

    var res=28;
    for(var gy=0;gy<res;gy++){
      for(var gx=0;gx<res;gx++){
        var vx=p.data.range*(-1+2*gx/(res-1));
        var vy=p.data.range*(1-2*gy/(res-1));
        var zi=p.w[0]*vx+p.w[1]*vy+p.b;
        var prob=1/(1+Math.exp(-clamp(zi,-30,30)));
        var r=Math.floor(255*prob), b=Math.floor(255*(1-prob));
        ctx.fillStyle='rgba('+Math.floor(64*prob+20)+',30,'+Math.floor(64*(1-prob)+20)+',0.35)';
        ctx.fillStyle='rgba('+(prob>0.5?Math.floor(80+80*prob):20)+','+(prob>0.5?40:Math.floor(80*(1-prob)))+','+(prob<0.5?Math.floor(80+80*(1-prob)):20)+',0.35)';
        ctx.fillRect(px0+gx*plotSize/res,py0+gy*plotSize/res,plotSize/res+1,plotSize/res+1);
      }
    }
    /* Data points */
    p.data.X.forEach(function(pt,i){
      var sx=px0+(pt[0]/p.data.range*0.5+0.5)*plotSize;
      var sy=py0+(0.5-pt[1]/p.data.range*0.5)*plotSize;
      ctx.fillStyle=p.data.y[i]===0?'#40e0ff':'#ff40b0';
      ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.stroke();
    });
    /* Decision line */
    if(Math.abs(p.w[1])>1e-6){
      var xx0=-p.data.range, xx1=p.data.range;
      function lineY(x){return -(p.w[0]*x+p.b)/p.w[1];}
      var y0=lineY(xx0),y1=lineY(xx1);

      var sy0=py0+(0.5-(y0/p.data.range)*0.5)*plotSize;
      var sx1=px0+((xx1/p.data.range)*0.5+0.5)*plotSize;
      var sy1=py0+(0.5-(y1/p.data.range)*0.5)*plotSize;

      ctx.lineWidth=2;
      ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.lineTo(sx1,sy1);ctx.stroke();

    ctx.lineTo(cx2+p.w[0]*wScale,cy2-p.w[1]*wScale);

    );

    $('sbMode').textContent='Perceptron';
  },

registerModule('mlp',{
  title:'MLP Playground',
  icon:'🧠',
  desc:'Multi-layer perceptron with backpropagation. Adjust architecture, train live, watch decision boundaries form.',
  init:function(){
    var m=STATE.mlp;
    m.data=DATASETS[m.dataset](400);
    var nc=m.data.classes;
    var sizes=[2].concat(m.hidden).concat([nc]);
    m.net=new MLP(sizes,ACT[m.activation],nc>2?'softmax':(nc===2?'binary':'softmax'));
    m.epochs=0;m.loss=null;m.acc=0;m.lossHistory=[];m.gridCache=null;
    logMsg('MLP init: '+sizes.join('→')+' ('+m.net.paramCount()+' params)','info');
  },
  computeGrid:function(){
    var m=STATE.mlp;
    var res=m.gridRes;
    var range=m.data.range;
    var X=new Mat(res*res,2);
    for(var gy=0;gy<res;gy++){
      for(var gx=0;gx<res;gx++){
        var i=gy*res+gx;
        X.data[i*2]=(-1+2*gx/(res-1))*range;
        X.data[i*2+1]=(1-2*gy/(res-1))*range;
      }
    }
    var probs=m.net.forward(X);
    m.gridCache={probs:probs,res:res};
  },
  tick:function(dt){
    var m=STATE.mlp;
    if(!m.net||!m.data)return;
    if(!m.training){STATE.time+=dt;return;}
    /* Do stepsPerFrame training steps */
    for(var step=0;step<m.stepsPerFrame;step++){
      /* Mini-batch */
      var n=m.data.X.length;
      var bs=Math.min(m.batchSize,n);
      var indices=[];
      for(var i=0;i<bs;i++)indices.push(rnd(0,n-1));
      var X=new Mat(bs,2);
      var yIdx=new Array(bs);
      for(var b=0;b<bs;b++){
        var idx=indices[b];
        X.data[b*2]=m.data.X[idx][0];
        X.data[b*2+1]=m.data.X[idx][1];
        yIdx[b]=m.data.y[idx];
      }
      var probs=m.net.forward(X);
      var grad;
      if(m.net.outputType==='binary'){
        /* Binary cross-entropy with sigmoid */
        grad=new Mat(bs,1);
        for(var b2=0;b2<bs;b2++){
          grad.data[b2]=(probs.data[b2]-yIdx[b2])/bs;
        }
        /* Need to route through the sigmoid backprop — combine with the sigmoid derivative */
        var lastLayer=m.net.layers[m.net.layers.length-1];
        var dZ=grad;
        lastLayer.gradW=lastLayer._input.T().matmul(dZ);
        lastLayer.gradB=dZ.sumAxis0();
        var g=dZ.matmul(lastLayer.W.T());
        for(var l=m.net.layers.length-2;l>=0;l--)g=m.net.layers[l].backward(g);
      } else {
        grad=crossEntropyGradFromProbs(probs,yIdx);
        m.net.backward(grad);
      }
      m.net.step(m.lr,m.optimizer);
      m.epochs++;
    }
    /* Full-data evaluation */
    var nAll=m.data.X.length;
    var XAll=new Mat(nAll,2);
    for(var i2=0;i2<nAll;i2++){
      XAll.data[i2*2]=m.data.X[i2][0];
      XAll.data[i2*2+1]=m.data.X[i2][1];
    }
    var allProbs=m.net.forward(XAll);
    m.loss=crossEntropyLoss(allProbs,m.data.y);
    m.acc=accuracy(allProbs,m.data.y);
    m.lossHistory.push(m.loss);
    if(m.lossHistory.length>2000)m.lossHistory.shift();
    /* Update grid every N epochs */
    if(m.epochs%3===0)this.computeGrid();
    STATE.epoch=m.epochs;
    STATE.time+=dt;
    STATE.steps++;
    $('sbLoss').textContent=fmt(m.loss,4);
    $('sbAcc').textContent=fmt(m.acc*100,1)+'%';
    $('sbEpoch').textContent=m.epochs;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#03060c';
    ctx.fillRect(0,0,W,H);
    var m=STATE.mlp;
    if(!m.net||!m.data)return;
    /* Decision boundary */
    var plotSize=Math.min(H-40,W*0.6);
    var px0=20,py0=(H-plotSize)/2;
    var res=m.gridRes;
    var palette=[[64,224,255],[255,64,176],[64,255,144],[255,224,64]];
    if(m.gridCache){
      var probs=m.gridCache.probs;
      var cell=plotSize/res;
      for(var gy=0;gy<res;gy++){
        for(var gx=0;gx<res;gx++){
          var i=gy*res+gx;
          var r=0,g=0,b=0;
          for(var c=0;c<m.data.classes;c++){
            var p=probs.data[i*m.data.classes+c];
            r+=palette[c%palette.length][0]*p;
            g+=palette[c%palette.length][1]*p;
            b+=palette[c%palette.length][2]*p;
          }
          ctx.fillStyle='rgba('+Math.floor(r*0.25)+','+Math.floor(g*0.25)+','+Math.floor(b*0.25)+',0.55)';
          ctx.fillRect(px0+gx*cell,py0+gy*cell,cell+1,cell+1);
        }
      }
    } else {
      ctx.fillStyle='#0a1020';
      ctx.fillRect(px0,py0,plotSize,plotSize);
    }
    /* Border */
    ctx.strokeStyle='rgba(64,224,255,.4)';
    ctx.lineWidth=1;
    ctx.strokeRect(px0,py0,plotSize,plotSize);
    /* Data points */
    m.data.X.forEach(function(pt,i){
      var sx=px0+(pt[0]/(2*m.data.range)+0.5)*plotSize;
      var sy=py0+(0.5-pt[1]/(2*m.data.range))*plotSize;
      var c=m.data.y[i];
      var col=palette[c%palette.length];
      ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
      ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.stroke();
    });
    /* Right side: network + loss */
    var rightX=px0+plotSize+20;
    var rightW=W-rightX-20;
    /* Loss chart */
    drawLossChart(ctx,rightX,20,rightW,110,m.lossHistory,'loss','#40e0ff');
    /* Architecture diagram */
    ctx.fillStyle='rgba(144,168,216,.9)';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('NETWORK — '+m.net.paramCount()+' params',rightX,160);
    var archX=rightX;
    var archY=180;
    var archH=Math.min(220,H-archY-20);
    var layerXs=[];
    var sizes=m.net.sizes;
    var colW=rightW/(sizes.length);
    sizes.forEach(function(sz,li){
      var x=archX+(li+0.5)*colW;
      layerXs.push(x);
      var maxNeurons=Math.max.apply(null,sizes);
      var maxSpacing=archH/Math.max(1,sizes[0]);
      var radius=Math.min(9,(archH-40)/Math.max(1,sz)/2);
      var spacing=(archH-40)/Math.max(1,sz-1);
      if(sz===1)spacing=1;
      for(var n=0;n<sz;n++){
        var y=archY+archH/2+(n-(sz-1)/2)*Math.min(spacing,radius*3);
        ctx.fillStyle='#101a30';
        ctx.strokeStyle='#40e0ff';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.stroke();
      }
      ctx.fillStyle='rgba(144,168,216,.7)';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(sz,x,archY+archH+16);
    });
    /* Connections */
    for(var li=0;li<sizes.length-1;li++){
      var x1=layerXs[li],x2=layerXs[li+1];
      var s1=sizes[li],s2=sizes[li+1];
      var W1=m.net.layers[li].W;
      var weights=W1.data;
      var maxW=0;
      for(var k=0;k<weights.length;k++)maxW=Math.max(maxW,Math.abs(weights[k]));
      maxW=maxW||1;
      for(var n1=0;n1<s1;n1++){
        var y1=archY+archH/2+(n1-(s1-1)/2)*Math.min((archH-40)/Math.max(1,s1-1),27);
        for(var n2=0;n2<s2;n2++){
          var y2=archY+archH/2+(n2-(s2-1)/2)*Math.min((archH-40)/Math.max(1,s2-1),27);
          var w=weights[n1*s2+n2];
          var alpha=Math.abs(w)/maxW*0.6;
          ctx.strokeStyle=w>0?'rgba(64,224,255,'+alpha+')':'rgba(255,64,176,'+alpha+')';
          ctx.lineWidth=0.6+Math.abs(w)/maxW*2;
          ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        }
      }
    }
    setStatsHTML(
      '<div>Arch: '+m.net.sizes.join('→')+'</div>'+
      '<div>Params: '+m.net.paramCount()+'</div>'+
      '<div>Loss: '+fmt(m.loss,4)+'</div>'+
      '<div>Acc: '+fmt(m.acc*100,1)+'%</div>'+
      '<div>Epoch: '+m.epochs+'</div>'
    );
    updateBadge('🧠 MLP · '+m.net.sizes.join('→')+' · '+m.optimizer);
    $('sbMode').textContent='MLP';
  },
  onDown:function(p){
    /* Add data point by clicking on plot */
    var W=CANV.W,H=CANV.H;
    var plotSize=Math.min(H-40,W*0.6);
    var px0=20,py0=(H-plotSize)/2;
    if(p.x<px0||p.x>px0+plotSize||p.y<py0||p.y>py0+plotSize)return;
    var m=STATE.mlp;
    var vx=((p.x-px0)/plotSize-0.5)*2*m.data.range;
    var vy=(0.5-(p.y-py0)/plotSize)*2*m.data.range;
    /* Class based on right-click or shift */
    var cls=0;
    if(INPUT.down)cls=m.data.classes-1;
    m.data.X.push([vx,vy]);
    m.data.y.push(cls);
  },
  onUp:function(){},
  controls:function(){
    var m=STATE.mlp;
    var html='';
    html+='<div class="sec"><h4>Training</h4>';
    html+='<button class="btn full '+(m.training?'danger':'primary')+'" onclick="STATE.mlp.training=!STATE.mlp.training;renderLeftPanel()">'+(m.training?'⏸ Stop':'▶ Train')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.mlp.init()">↺ Reinitialize</button>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Steps per frame</span><span>'+m.stepsPerFrame+'</span></div>';
    html+='<input type="range" min="1" max="10" step="1" value="'+m.stepsPerFrame+'" oninput="STATE.mlp.stepsPerFrame=parseInt(this.value);renderLeftPanel()"></div>';

    html+='<div class="sec"><h4>Dataset</h4>';
    html+='<div class="chip-row">';

    });

    html+='<div class="sec"><h4>Activation</h4>';

    ['relu','tanh','sigmoid','leaky','elu','swish'].forEach(function(a){
      html+='<div class="chip '+(m.activation===a?'active':'')+'" onclick="STATE.mlp.activation=\''+a+'\';MODULES.mlp.init();renderLeftPanel()">'+ACT[a].name+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Optimizer</h4>';
    html+='<div class="chip-row">';
    [['sgd','SGD'],['momentum','Momentum'],['adam','Adam']].forEach(function(o){
      html+='<div class="chip '+(m.optimizer===o[0]?'active':'')+'" onclick="STATE.mlp.optimizer=\''+o[0]+'\';renderLeftPanel()">'+o[1]+'</div>';
    });
    html+='</div>';
    html+='<div class="ctrl" style="margin-top:8px"><div class="lbl"><span>Learning rate</span><span>'+m.lr.toFixed(4)+'</span></div>';
    html+='<input type="range" min="0.0001" max="0.1" step="0.0005" value="'+m.lr+'" oninput="STATE.mlp.lr=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Batch size</span><span>'+m.batchSize+'</span></div>';
    html+='<input type="range" min="4" max="128" step="4" value="'+m.batchSize+'" oninput="STATE.mlp.batchSize=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click on the plot to add points (they get the last class).</div>';
    return html;
  },
  mathPanel:function(){
    var m=STATE.mlp;
    if(!m.net)return '<div class="empty">No network</div>';
    var html='<div class="sec"><h4>Forward pass</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    'z⁽ˡ⁾ = a⁽ˡ⁻¹⁾·W⁽ˡ⁾ + b⁽ˡ⁾<br>'+
    'a⁽ˡ⁾ = σ(z⁽ˡ⁾)<br>'+
    'output = softmax(z⁽ᴸ⁾)'+
    '</div></div>';
    html+='<div class="sec"><h4>Backward pass</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    'δ⁽ᴸ⁾ = ŷ − y &nbsp;(softmax+CE)<br>'+
    'δ⁽ˡ⁾ = (δ⁽ˡ⁺¹⁾·W⁽ˡ⁺¹⁾ᵀ) ⊙ σ\'(z⁽ˡ⁾)<br>'+
    '∂L/∂W⁽ˡ⁾ = a⁽ˡ⁻¹⁾ᵀ·δ⁽ˡ⁾<br>'+
    '∂L/∂b⁽ˡ⁾ = Σ_batch δ⁽ˡ⁾'+
    '</div></div>';
    html+='<div class="sec"><h4>Layers</h4>';
    m.net.layers.forEach(function(L,i){
      html+='<div class="kv" style="margin-bottom:6px">';
      html+='<div class="row"><span class="k">L'+(i+1)+'</span><span class="v">'+L.nIn+'→'+L.nOut+' ('+L.act.name+')</span></div>';
      var wnorm=L.W.norm();
      var gnorm=L.gradW?L.gradW.norm():0;
      html+='<div class="row"><span class="k">&nbsp;‖W‖</span><span class="v">'+fmt(wnorm,3)+'</span></div>';
      html+='<div class="row"><span class="k">&nbsp;‖∇W‖</span><span class="v">'+fmt(gnorm,4)+'</span></div>';
      html+='</div>';
    });
    html+='</div>';
    return html;
  }
});

registerModule('regression',{
  title:'Polynomial Regression',
  icon:'📈',
  desc:'Fit a polynomial to noisy data via gradient descent. Watch coefficients converge.',
  init:function(){
    var r=STATE.regression;
    r.coeffs=new Float64Array(r.degree+1);
    /* Random small init */
    for(var i=0;i<r.coeffs.length;i++)r.coeffs[i]=rndN()*0.1;
    r.data=generateRegressionData(r.degree,r.noise);
    r.iterations=0;r.loss=null;r.lossHistory=[];
  },
  tick:function(dt){
    var r=STATE.regression;
    if(!r.training){STATE.time+=dt;return;}
    /* Gradient descent on MSE */
    var grad=new Float64Array(r.coeffs.length);
    var loss=0;
    var n=r.data.length;
    for(var i=0;i<n;i++){
      var x=r.data[i][0],y=r.data[i][1];
      var pred=polyEval(r.coeffs,x);
      var err=pred-y;
      loss+=err*err;
      var xp=1;
      for(var k=0;k<r.coeffs.length;k++){
        grad[k]+=2*err*xp/n;
        xp*=x;
      }
    }
    loss/=n;
    for(var k2=0;k2<r.coeffs.length;k2++)r.coeffs[k2]-=r.lr*grad[k2];
    r.loss=loss;
    r.iterations++;
    r.lossHistory.push(loss);
    if(r.lossHistory.length>3000)r.lossHistory.shift();
    STATE.steps++;
    STATE.time+=dt;
    $('sbLoss').textContent=fmt(loss,5);
    $('sbEpoch').textContent=r.iterations;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#03060c';
    ctx.fillRect(0,0,W,H);
    var r=STATE.regression;
    if(!r.data)return;
    /* Plot area */
    var plotX=40,plotY=40,plotW=W-80,plotH=H*0.55;
    ctx.fillStyle='rgba(3,6,12,.8)';
    ctx.strokeStyle='rgba(64,224,255,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,6);ctx.fill();ctx.stroke();
    /* Axes */
    var xMin=-1.2,xMax=1.2;
    var yMin=Math.min.apply(null,r.data.map(function(p){return p[1]}))-0.3;
    var yMax=Math.max.apply(null,r.data.map(function(p){return p[1]}))+0.3;
    /* Grid */
    ctx.strokeStyle='rgba(64,224,255,.08)';
    for(var gi=0;gi<10;gi++){
      var gx=plotX+gi*plotW/10;
      var gy=plotY+gi*plotH/10;
      ctx.beginPath();ctx.moveTo(gx,plotY);ctx.lineTo(gx,plotY+plotH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(plotX,gy);ctx.lineTo(plotX+plotW,gy);ctx.stroke();
    }
    /* Axes labels */
    ctx.fillStyle='rgba(88,110,160,.7)';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    for(var xi=0;xi<=5;xi++){
      var xv=xMin+(xMax-xMin)*xi/5;
      ctx.fillText(xv.toFixed(1),plotX+xi*plotW/5,plotY+plotH+14);
    }
    /* Data points */
    r.data.forEach(function(pt){
      var sx=plotX+(pt[0]-xMin)/(xMax-xMin)*plotW;
      var sy=plotY+(1-(pt[1]-yMin)/(yMax-yMin))*plotH;
      ctx.fillStyle='rgba(64,224,255,.7)';
      ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();
    });
    /* Fitted curve */
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2.5;
    ctx.beginPath();
    for(var xi2=0;xi2<=200;xi2++){
      var xv2=xMin+(xMax-xMin)*xi2/200;
      var yv=polyEval(r.coeffs,xv2);
      var sx2=plotX+xi2*plotW/200;
      var sy2=plotY+(1-(yv-yMin)/(yMax-yMin))*plotH;
      if(sy2<plotY-50||sy2>plotY+plotH+50){ctx.stroke();ctx.beginPath();continue;}
      if(xi2===0)ctx.moveTo(sx2,sy2);else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
    /* Loss chart */
    drawLossChart(ctx,plotX,plotY+plotH+30,plotW,120,r.lossHistory,'MSE loss','#ff40b0');
    /* Coefficients */
    ctx.fillStyle='rgba(144,168,216,.9)';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('COEFFICIENTS',plotX,plotY+plotH+180);
    var coeffStr='y = ';
    for(var ci=r.coeffs.length-1;ci>=0;ci--){
      var sign=r.coeffs[ci]>=0?'+':'−';
      var term=Math.abs(r.coeffs[ci]).toFixed(3);
      var pow=ci===0?'':(ci===1?'x':'x^'+ci);
      coeffStr+=(ci<r.coeffs.length-1?' '+sign+' ':'')+term+pow;
    }
    ctx.fillStyle='#40e0ff';
    ctx.font='11px monospace';
    ctx.fillText(coeffStr,plotX,plotY+plotH+198);
    setStatsHTML(
      '<div>Degree: '+r.degree+'</div>'+

      '<div>Loss: '+fmt(r.loss,6)+'</div>'+
      '<div>lr: '+r.lr.toFixed(4)+'</div>'
    );
    updateBadge('📈 Polynomial Regression · degree '+r.degree);

  },
  onDown:function(){},

  controls:function(){

    html+='</div>';
    html+='<div class="sec"><h4>Model</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Polynomial degree</span><span>'+r.degree+'</span></div>';
    html+='<input type="range" min="1" max="8" step="1" value="'+r.degree+'" oninput="STATE.regression.degree=parseInt(this.value);MODULES.regression.init();renderLeftPanel()"></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Noise σ</span><span>'+r.noise.toFixed(3)+'</span></div>';
    html+='<input type="range" min="0" max="0.5" step="0.01" value="'+r.noise+'" oninput="STATE.regression.noise=parseFloat(this.value);STATE.regression.data=generateRegressionData(STATE.regression.degree,STATE.regression.noise)"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Optimization</h4>';

function polyEval(coeffs,x){
  var y=0,p=1;
  for(var i=0;i<coeffs.length;i++){y+=coeffs[i]*p;p*=x;}
  return y;
}
function generateRegressionData(degree,noise){
  var data=[];
  var target=function(x){return 0.5*Math.sin(x*Math.PI*1.5)+0.3*x+0.1;};
  for(var i=0;i<40;i++){
    var x=rndF(-1,1);
    data.push([x,target(x)+rndN()*noise]);
  }
  return data;
}

function generateImage(type,w,h){
  var img=new Float64Array(w*h);
  if(type==='checker'){
    for(var y=0;y<h;y++)for(var x=0;x<w;x++){
      img[y*w+x]=((Math.floor(x/8)+Math.floor(y/8))%2)?0.85:0.15;
    }
  } else if(type==='circles'){
    for(var y2=0;y2<h;y2++)for(var x2=0;x2<w;x2++){
      var dx=x2-w/2,dy=y2-h/2;
      var r=Math.sqrt(dx*dx+dy*dy);
      img[y2*w+x2]=(Math.sin(r*0.5)*0.5+0.5);
    }
  } else if(type==='noise'){
    for(var i=0;i<img.length;i++)img[i]=Math.random();
  } else if(type==='gradient'){
    for(var y3=0;y3<h;y3++)for(var x3=0;x3<w;x3++)img[y3*w+x3]=x3/w;
  } else if(type==='stairs'){
    for(var y4=0;y4<h;y4++)for(var x4=0;x4<w;x4++){
      img[y4*w+x4]=Math.floor(x4/8)/ (w/8);
    }
  } else if(type==='text'){
    for(var y5=0;y5<h;y5++)for(var x5=0;x5<w;x5++)img[y5*w+x5]=0.1;
    /* Draw an "N" shape */
    for(var i2=8;i2<h-8;i2++){
      img[i2*w+16]=0.9;img[i2*w+30]=0.9;
      var t=(i2-8)/(h-16);
      var xpos=Math.floor(16+t*14);
      img[i2*w+xpos]=0.9;
    }
  }
  return img;
}
function cycleKernel(r,col){
  var v=STATE.cnn.custom[r][col];
  var options=[-2,-1,-0.5,0,0.2,0.5,1,2];
  var idx=options.indexOf(v);
  if(idx===-1)idx=0;
  else idx=(idx+1)%options.length;
  STATE.cnn.custom[r][col]=options[idx];
  renderLeftPanel();
}

registerModule('autoencoder',{
  title:'Autoencoder',
  icon:'🗜️',
  desc:'Compress data into a low-dimensional latent space and reconstruct it. Watch information loss.',
  init:function(){
    var a=STATE.autoencoder;
    a.data=makeAutoencoderData();
    var dimIn=2;
    var h=a.hidden;
    a.net=new MLP([dimIn,h,2],ACT.tanh,'regression','xavier');
    a.epochs=0;a.loss=null;a.lossHistory=[];
  },
  tick:function(dt){
    var a=STATE.autoencoder;
    if(!a.training||!a.net){STATE.time+=dt;return;}
    /* Train with mini-batches */
    var n=a.data.length;
    var bs=Math.min(32,n);
    var X=new Mat(bs,2);
    for(var i=0;i<bs;i++){
      var idx=rnd(0,n-1);
      X.data[i*2]=a.data[idx][0];
      X.data[i*2+1]=a.data[idx][1];
    }
    var pred=a.net.forward(X);
    var grad=mseGrad(pred,X);
    a.net.backward(grad);
    a.net.adamStep(a.lr);
    a.epochs++;
    /* Full loss */
    var XAll=new Mat(n,2);
    for(var i2=0;i2<n;i2++){XAll.data[i2*2]=a.data[i2][0];XAll.data[i2*2+1]=a.data[i2][1];}
    var out=a.net.forward(XAll);
    a.loss=mseLoss(out,XAll);
    a.lossHistory.push(a.loss);
    if(a.lossHistory.length>2000)a.lossHistory.shift();
    STATE.epoch=a.epochs;
    STATE.time+=dt;
    STATE.steps++;
    $('sbLoss').textContent=fmt(a.loss,5);
    $('sbEpoch').textContent=a.epochs;
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#03060c';
    ctx.fillRect(0,0,W,H);
    var a=STATE.autoencoder;
    if(!a.net)return;
    /* Left: 2D data + reconstruction */
    var plotSize=Math.min(H-60,W*0.45);
    var px0=20,py0=(H-plotSize)/2;
    ctx.strokeStyle='rgba(64,224,255,.3)';
    ctx.lineWidth=1;
    ctx.strokeRect(px0,py0,plotSize,plotSize);
    ctx.fillStyle='rgba(144,168,216,.8)';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('ORIGINAL (blue) vs RECONSTRUCTED (pink)',px0,py0-10);
    /* Fit X data */
    var XAll=new Mat(a.data.length,2);
    for(var i=0;i<a.data.length;i++){XAll.data[i*2]=a.data[i][0];XAll.data[i*2+1]=a.data[i][1];}
    var rec=a.net.forward(XAll);
    /* Normalize coordinates for display */
    var range=1.2;
    for(var i2=0;i2<a.data.length;i2++){
      var x=a.data[i2][0],y=a.data[i2][1];
      var sx=px0+(x/range*0.5+0.5)*plotSize;
      var sy=py0+(0.5-y/range*0.5)*plotSize;
      ctx.fillStyle='rgba(64,224,255,.7)';
      ctx.beginPath();ctx.arc(sx,sy,3,0,Math.PI*2);ctx.fill();
      var rx=rec.data[i2*2],ry=rec.data[i2*2+1];
      var rsx=px0+(rx/range*0.5+0.5)*plotSize;
      var rsy=py0+(0.5-ry/range*0.5)*plotSize;
      ctx.fillStyle='rgba(255,64,176,.7)';
      ctx.beginPath();ctx.arc(rsx,rsy,2.5,0,Math.PI*2);ctx.fill();
      /* Line */
      ctx.strokeStyle='rgba(255,224,64,.15)';
      ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(rsx,rsy);ctx.stroke();
    }
    /* Right: latent space visualization */
    var lx=px0+plotSize+40;
    var ly=py0;
    var lw=Math.min(W-lx-20,plotSize);
    var lh=plotSize;
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.strokeRect(lx,ly,lw,lh);
    ctx.fillStyle='rgba(144,168,216,.8)';
    ctx.font='bold 11px monospace';
    ctx.fillText('LATENT SPACE (compressed to '+a.hidden+'D)',lx,ly-10);
    /* Get latent codes */
    var X=new Mat(a.data.length,2);
    for(var i3=0;i3<a.data.length;i3++){X.data[i3*2]=a.data[i3][0];X.data[i3*2+1]=a.data[i3][1];}
    /* Forward up to bottleneck */
    var h1=a.net.layers[0].forward(X);
    /* Project N-dim latent to 2D for display (use first 2 dims or PCA-ish) */
    for(var i4=0;i4<a.data.length;i4++){
      var zx,zy;
      if(a.hidden>=2){
        zx=h1.data[i4*a.hidden];
        zy=h1.data[i4*a.hidden+1];
      } else {
        zx=h1.data[i4*a.hidden];
        zy=Math.sin(zx*3);
      }
      var szx=lx+lw/2+zx*lw/4;
      var szy=ly+lh/2+zy*lh/4;
      /* Color by position in original space */
      var hue=Math.atan2(a.data[i4][1],a.data[i4][0])*180/Math.PI+180;
      ctx.fillStyle='hsl('+hue+',80%,60%)';
      ctx.beginPath();ctx.arc(szx,szy,4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.stroke();
    }
    /* Loss chart */
    drawLossChart(ctx,px0,H-110,W-40,90,a.lossHistory,'MSE reconstruction loss','#a060ff');
    setStatsHTML(
      '<div>Bottleneck: '+a.hidden+'D</div>'+
      '<div>Params: '+a.net.paramCount()+'</div>'+
      '<div>Loss: '+fmt(a.loss,5)+'</div>'+
      '<div>Epoch: '+a.epochs+'</div>'
    );
    updateBadge('🗜️ Autoencoder · 2→'+a.hidden+'→2');
    $('sbMode').textContent='Autoencoder';
  },
  onDown:function(){},
  onUp:function(){},
  controls:function(){
    var a=STATE.autoencoder;
    var html='';
    html+='<div class="sec"><h4>Training</h4>';
    html+='<button class="btn full '+(a.training?'danger':'primary')+'" onclick="STATE.autoencoder.training=!STATE.autoencoder.training;renderLeftPanel()">'+(a.training?'⏸ Stop':'▶ Train')+'</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.autoencoder.init()">↺ Reinitialize</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Architecture</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Bottleneck size</span><span>'+a.hidden+'</span></div>';
    html+='<input type="range" min="1" max="8" step="1" value="'+a.hidden+'" oninput="STATE.autoencoder.hidden=parseInt(this.value);MODULES.autoencoder.init();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Optimization</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Learning rate</span><span>'+a.lr.toFixed(4)+'</span></div>';
    html+='<input type="range" min="0.001" max="0.05" step="0.001" value="'+a.lr+'" oninput="STATE.autoencoder.lr=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Data lies on a 1D manifold (a curve) embedded in 2D. The autoencoder learns to compress it.</div>';
    return html;
  },
  mathPanel:function(){
    var a=STATE.autoencoder;
    return '<div class="sec"><h4>Architecture</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'x ∈ ℝ² → h ∈ ℝ'+a.hidden+' → x̂ ∈ ℝ²<br><br>'+
      '<b class="text-c1">Encoder:</b> h = tanh(W₁x + b₁)<br>'+
      '<b class="text-c1">Decoder:</b> x̂ = tanh(W₂h + b₂)<br><br>'+
      '<b class="text-c1">Loss:</b> L = ‖x̂ − x‖²'+
      '</div></div>'+
      '<div class="sec"><h4>Purpose</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'The bottleneck forces the network to discover the underlying structure of the data. '+
      'If the data lives on a lower-dimensional manifold, the encoder will find coordinates for it.'+
      '</div></div>';
  }
});
function makeAutoencoderData(){
  var pts=[];
  var n=300;
  for(var i=0;i<n;i++){
    var t=Math.random()*Math.PI*2;
    var x=Math.cos(t)*0.8;
    var y=Math.sin(t*2)*0.5;
    pts.push([x+rndN()*0.03,y+rndN()*0.03]);
  }
  return pts;
}

registerModule('rnn',{
  title:'Recurrent Net',
  icon:'🔁',
  desc:'Predict the next value in a sequence. Trains a real recurrent network with time-based structure.',
  init:function(){
    var r=STATE.rnn;
    r.net=new RNN(4,r.hidden,r.seqLen);
    r.sequence=generateSequence(r.pattern,r.seqLen);
    r.predictions=null;
    r.loss=null;
    r.epochs=0;
    r.lossHistory=[];
  },
  tick:function(dt){
    var r=STATE.rnn;
    if(!r.net||!r.training){STATE.time+=dt;return;}
    /* Train on the sequence: predict next value given previous values */
    for(var step=0;step<3;step++){
      var seq=r.sequence;
      var L=seq.length;
      /* Forward through first L-1 values, predict each next */
      var preds=r.net.forward(seq.slice(0,L-1));
      /* Compute loss and gradient */
      var states=r.net._states;
      /* Backward through time (simplified — just compute output layer gradient) */
      var dWx=Mat.zeros(r.net.Wx.rows,r.net.Wx.cols);
      var dWh=Mat.zeros(r.net.Wh.rows,r.net.Wh.cols);
      var dWhh=Mat.zeros(r.net.Whh.rows,r.net.Whh.cols);
      var dbh=Mat.zeros(1,r.net.bh.cols);
      var dby=Mat.zeros(1,r.net.by.cols);
      var loss=0;
      var dhNext=Mat.zeros(1,r.net.nH);
      /* BPTT */
      for(var t=L-2;t>=0;t--){
        var target=seq[t+1];
        var pred=preds[t];
        var dPred=2*(pred-target)/(L-1);
        loss+=(pred-target)*(pred-target);
        var hPrev=states[t]; /* state BEFORE input t */
        var z=t === 0 ? null : null;
        /* Recompute z (before tanh) — we didn't cache it, approximate using atanh(h) */
        var h=states[t+1];
        var dz=new Float64Array(r.net.nH);
        for(var i=0;i<r.net.nH;i++){
          var hv=clamp(h.data[i],-0.999,0.999);
          var df=1-hv*hv;
          dz[i]=dhNext.data[i]*df;
        }
        /* output layer grads */
        for(var i2=0;i2<r.net.nH;i2++){
          dWhh.data[i2]+=dz[i2]*0;
        }
        for(var i3=0;i3<r.net.nH;i3++){
          dWhh.data[i3]+=0;
        }
        /* dWhh: dL/dWhh = h * dPred */
        for(var i4=0;i4<r.net.nH;i4++){
          dWhh.data[i4]+=h.data[i4]*dPred;
        }
        dby.data[0]+=dPred;
        /* dh from output */
        for(var i5=0;i5<r.net.nH;i5++)dz[i5]+=r.net.Whh.data[i5]*dPred;
        /* Now compute gradients w.r.t. Wh, Wx, bh using dz */
        var x=new Mat(1,r.net.nIn);
        x.data[0]=seq[t];
        if(r.net.nIn>1)x.data[1]=Math.sin(seq[t]*Math.PI);
        if(r.net.nIn>2)x.data[2]=Math.cos(seq[t]*Math.PI);
        if(r.net.nIn>3)x.data[3]=seq[t]*seq[t];
        for(var i6=0;i6<r.net.nIn;i6++)
          for(var j=0;j<r.net.nH;j++)
            dWx.data[i6*r.net.nH+j]+=x.data[i6]*dz[j];
        for(var i7=0;i7<r.net.nH;i7++)
          for(var j2=0;j2<r.net.nH;j2++)
            dWh.data[i7*r.net.nH+j2]+=hPrev.data[i7]*dz[j2];
        for(var i8=0;i8<r.net.nH;i8++)dbh.data[i8]+=dz[i8];
        /* Backprop to previous h */
        var dhPrev=new Mat(1,r.net.nH);
        for(var j3=0;j3<r.net.nH;j3++){
          var s=0;
          for(var i9=0;i9<r.net.nH;i9++)s+=dz[i9]*r.net.Wh.data[j3*r.net.nH+i9];
          dhPrev.data[j3]=s;
        }
        dhNext=dhPrev;
      }
      /* Apply update */
      var lr=r.lr;
      for(var i10=0;i10<r.net.Wx.data.length;i10++)r.net.Wx.data[i10]-=lr*dWx.data[i10];
      for(var i11=0;i11<r.net.Wh.data.length;i11++)r.net.Wh.data[i11]-=lr*dWh.data[i11];
      for(var i12=0;i12<r.net.Whh.data.length;i12++)r.net.Whh.data[i12]-=lr*dWhh.data[i12];
      for(var i13=0;i13<r.net.bh.data.length;i13++)r.net.bh.data[i13]-=lr*dbh.data[i13];
      for(var i14=0;i14<r.net.by.data.length;i14++)r.net.by.data[i14]-=lr*dby.data[i14];
      r.loss=loss/(L-1);
      r.epochs++;
      r.lossHistory.push(r.loss);
      if(r.lossHistory.length>1000)r.lossHistory.shift();
    }
    STATE.epoch=r.epochs;
    STATE.time+=dt;
    STATE.steps++;
    $('sbLoss').textContent=fmt(r.loss,5);
    $('sbEpoch').textContent=r.epochs;
  },

      'LSTMs and GRUs use gating mechanisms to fix this.'+

});
function generateSequence(type,len){
  var seq=[];
  for(var i=0;i<len;i++){
    var t=i/len;
    if(type==='sine')seq.push(Math.sin(t*Math.PI*4)*0.8);
    else if(type==='damped')seq.push(Math.sin(t*Math.PI*6)*Math.exp(-t*2)*0.9);
    else if(type==='square')seq.push(Math.sin(t*Math.PI*5)>0?0.8:-0.8);
    else if(type==='chirp')seq.push(Math.sin(t*Math.PI*2+t*t*Math.PI*8)*0.8);
    else if(type==='randwalk'){seq.push((seq.length?seq[seq.length-1]:0)+rndN()*0.15);}
  }
  /* Normalize */
  var mn=Math.min.apply(null,seq),mx=Math.max.apply(null,seq);
  var span=mx-mn||1;
  return seq.map(function(v){return (v-mn)/span*2-1;});
}

registerModule('attention',{
  title:'Attention',
  icon:'🎯',
  desc:'Self-attention on a sequence of tokens. Watch how each token attends to the others.',
  init:function(){
    var a=STATE.attention;
    var n=a.tokens.length;
    var d=a.headDim;
    /* Create embeddings: deterministic per-token (hash-based) */
    a.embeddings=new Mat(n,d);
    for(var i=0;i<n;i++){
      for(var k=0;k<d;k++){
        var h=0;
        var s=a.tokens[i];
        for(var c=0;c<s.length;c++)h=(h*31+s.charCodeAt(c)+k*7)%1000;
        a.embeddings.data[i*d+k]=Math.sin(h*0.1)*0.8;
      }
    }
    /* Random Q,K,V projections (fixed seed-ish) */
    a.Wq=Mat.randn(d,d,0.6);
    a.Wk=Mat.randn(d,d,0.6);
    a.Wv=Mat.randn(d,d,0.6);
    a.Q=a.embeddings.matmul(a.Wq);
    a.K=a.embeddings.matmul(a.Wk);
    a.V=a.embeddings.matmul(a.Wv);
    var attn=attention(a.Q,a.K,a.V,d);
    a.scores=attn.scores;
    a.weights=attn.weights;
    a.output=attn.output;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#03060c';
    ctx.fillRect(0,0,W,H);
    var a=STATE.attention;
    if(!a.weights)return;
    var n=a.tokens.length;
    /* Tokens row */
    var tokY=40;
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    var tokW=Math.min(120,(W-80)/n);
    var tokPositions=[];
    for(var i=0;i<n;i++){
      var x=W/2+(i-(n-1)/2)*tokW;
      tokPositions.push(x);
      var selected=i===a.selected;
      ctx.fillStyle=selected?'#40e0ff':'rgba(24,36,72,.9)';
      ctx.strokeStyle=selected?'#fff':'rgba(64,224,255,.5)';
      ctx.lineWidth=selected?2:1;
      ctx.beginPath();
      ctx.roundRect(x-tokW*0.4,tokY-16,tokW*0.8,32,6);
      ctx.fill();ctx.stroke();
      ctx.fillStyle=selected?'#03060c':'#e0ecff';
      ctx.fillText(a.tokens[i],x,tokY+5);
    }
    /* Attention heatmap grid */
    var gridX=W/2-n*tokW/2;
    var gridY=tokY+60;
    var cellSize=Math.min(50,(W-80)/n);
    gridX=W/2-n*cellSize/2;
    ctx.fillStyle='rgba(144,168,216,.9)';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('ATTENTION WEIGHTS (rows=query, cols=key)',gridX,gridY-8);
    for(var qi=0;qi<n;qi++){
      for(var ki=0;ki<n;ki++){
        var w=a.weights.data[qi*n+ki];
        var x=gridX+ki*cellSize;
        var y=gridY+qi*cellSize;
        /* Color by weight */
        var r2=Math.floor(64+w*200);
        var g=Math.floor(20+w*100);
        var b=Math.floor(40+w*180);
        ctx.fillStyle='rgb('+Math.min(255,r2)+','+Math.min(255,g)+','+Math.min(255,b)+')';
        ctx.fillRect(x+1,y+1,cellSize-2,cellSize-2);
        ctx.fillStyle=w>0.5?'#03060c':'#e0ecff';
        ctx.font=Math.floor(cellSize*0.22)+'px monospace';
        ctx.textAlign='center';
        if(cellSize>26)ctx.fillText(w.toFixed(2),x+cellSize/2,y+cellSize/2+4);
      }
      /* Row label */
      ctx.fillStyle=a.selected===qi?'#40e0ff':'#90a8d8';
      ctx.font='11px monospace';
      ctx.textAlign='right';
      ctx.fillText(a.tokens[qi],gridX-4,gridY+qi*cellSize+cellSize/2+4);
    }
    /* Column labels */
    for(var kc=0;kc<n;kc++){
      ctx.save();
      ctx.translate(gridX+kc*cellSize+cellSize/2,gridY-22);
      ctx.rotate(-Math.PI/4);
      ctx.fillStyle='#90a8d8';
      ctx.font='10px monospace';
      ctx.textAlign='left';
      ctx.fillText(a.tokens[kc],0,0);
      ctx.restore();
    }
    /* Highlight selected row */
    var hlY=gridY+a.selected*cellSize;
    ctx.strokeStyle='#ffe040';
    ctx.lineWidth=2;
    ctx.strokeRect(gridX,hlY,n*cellSize,cellSize);
    /* Selected token's attention distribution */
    var outY=gridY+n*cellSize+30;
    ctx.fillStyle='rgba(144,168,216,.9)';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('"'+a.tokens[a.selected]+'" attends to:',gridX,outY);
    var maxW=Math.max.apply(null,Array.from(a.weights.data.slice(a.selected*n,a.selected*n+n)));
    for(var ki2=0;ki2<n;ki2++){
      var w2=a.weights.data[a.selected*n+ki2];
      var barX=gridX+120+ki2*Math.min(80,(W-gridX-140)/n);
      var barW=Math.min(60,(W-gridX-140)/n-10);
      var barH=Math.floor(w2/maxW*30);
      ctx.fillStyle='rgba(24,36,72,.5)';
      ctx.fillRect(barX,outY,barW,30);
      ctx.fillStyle='#ff40b0';
      ctx.fillRect(barX,outY+30-barH,barW,barH);
      ctx.fillStyle='#90a8d8';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(a.tokens[ki2].substring(0,4),barX+barW/2,outY+44);
      ctx.fillStyle='#40e0ff';
      ctx.fillText((w2*100).toFixed(0)+'%',barX+barW/2,outY-4);
    }
    setStatsHTML(
      '<div>Tokens: '+n+'</div>'+
      '<div>Head dim: '+a.headDim+'</div>'+
      '<div>Selected: '+a.tokens[a.selected]+'</div>'
    );
    updateBadge('🎯 Self-Attention · '+n+' tokens');
    $('sbMode').textContent='Attention';
  },
  onDown:function(p){
    var a=STATE.attention;
    var n=a.tokens.length;
    var tokY=40;
    var tokW=Math.min(120,(CANV.W-80)/n);
    if(p.y<tokY+20&&p.y>tokY-20){
      var idx=Math.round((p.x-W/2)/tokW+(n-1)/2);

    }

      var qi=Math.floor((p.y-gridY)/cellSize);

  },
  onUp:function(){},
  controls:function(){

    html+='</div>';

    html+='<input type="range" min="0.1" max="3" step="0.05" value="'+a.temperature+'" oninput="STATE.attention.temperature=parseFloat(this.value);MODULES.attention.init();renderLeftPanel()"></div>';

      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+

function setSentence(s){
  var tokens=s.trim().split(/\s+/).slice(0,10).filter(function(t){return t;});
  if(tokens.length<2){toast('Need at least 2 tokens','warn');return;}
  STATE.attention.tokens=tokens;
  STATE.attention.selected=Math.min(STATE.attention.selected,tokens.length-1);
  MODULES.attention.init();
  renderLeftPanel();
}
