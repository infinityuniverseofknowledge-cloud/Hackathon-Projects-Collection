  {key:'cnn',icon:'🔬',label:'CNN'},
  {key:'autoencoder',icon:'🗜️',label:'Autoencoder'},
  {key:'rnn',icon:'🔁',label:'RNN'},
  {key:'attention',icon:'🎯',label:'Attention'},
  {key:'about',icon:'ℹ️',label:'About'}
];
function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  STATE.epoch=0;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4>'+
      '<div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,2)+'s</span></div>'+
      '<div class="row"><span class="k">Epoch</span><span class="v">'+STATE.epoch+'</span></div>'+
      '<div class="row"><span class="k">Steps</span><span class="v">'+STATE.steps+'</span></div>'+
      '</div></div>'+
      '<div class="sec"><h4>Status</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);color:var(--tx2);line-height:1.6">'+
      (STATE.playing?'🟢 Running':'🔴 Paused')+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty"><div class="e-icon">∑</div>No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b class="text-c1">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--c4)':l.type==='success'?'var(--c3)':l.type==='warn'?'var(--c5)':'var(--c2)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}

/* ================================================================
   ACTIONS
   ================================================================ */
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Playing':'Paused','info',1000);
}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
    toast('Reset','success',1000);
  }
}
function stepModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].tick){
    MODULES[STATE.currentTab].tick(1/60);
  }
  STATE.steps++;
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['neural','sunset','light'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    mlp:{dataset:STATE.mlp.dataset,hidden:STATE.mlp.hidden,activation:STATE.mlp.activation,optimizer:STATE.mlp.optimizer,lr:STATE.mlp.lr},
    perceptron:{dataset:STATE.perceptron.dataset,lr:STATE.perceptron.lr},
    regression:{degree:STATE.regression.degree,lr:STATE.regression.lr},
    attention:{tokens:STATE.attention.tokens,headDim:STATE.attention.headDim}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='neura-config.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},500);
  toast('Config exported','success');
}

/* Keyboard */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='.')stepModule();
  else if(e.key>='1'&&e.key<='8'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Allocating weight matrices...',
  'Loading activation functions...',
  'Warming up backprop engine...',
  'Preparing datasets (XOR, spiral, moons)...',
  'Initializing convolution kernels...',
  'Setting up RNN cell state...',
  'Building attention projections...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('NEURA ready · Press ? for help','success',3500);
      },400);
    }
  },160);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  }
  var m2=MODULES[STATE.currentTab];
  if(m2&&m2.draw){try{m2.draw(CANV.ctx);}catch(e){console.error(e);}}
  var m3=MODULES[STATE.currentTab];
  if(m3&&m3.mathPanel&&STATE.currentRp==='math'){
    /* Refresh math panel periodically */
    if(STATE.steps%30===0)renderRightPanel();
  }
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('NEURA initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  setInterval(function(){
    if(STATE.currentRp==='logs')renderLogs();
  },1000);
});
