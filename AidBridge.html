<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<title>AIDBRIDGE — Emergency Response Coordination</title>
<style>
/* ================================================================
   AIDBRIDGE — Design System
   Crisis-response tuned: high contrast, battery-friendly, glove-safe
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#fff}

:root{
  --bg:#0a0d14;--bg2:#0f131e;--bg3:#161b28;--bg4:#1e2434;
  --panel:#111623;--panel2:#1a2032;--panel3:#242c42;--panel4:#2f3852;
  --bd:#232b42;--bd2:#374162;--bd3:#4c5880;
  --tx:#eef2ff;--tx2:#a8b2d0;--tx3:#707a9c;--mu:#4a5470;
  --c1:#3b82f6;--c1h:#60a5fa;--c1l:#1d4ed8;
  --c2:#10b981;--c2h:#34d399;--c2l:#059669;
  --c3:#f59e0b;--c3h:#fbbf24;--c3l:#d97706;
  --c4:#ef4444;--c4h:#f87171;--c4l:#dc2626;
  --c5:#8b5cf6;--c5h:#a78bfa;--c5l:#7c3aed;
  --c6:#06b6d4;--c6h:#22d3ee;--c6l:#0891b2;
  --c7:#ec4899;--c7h:#f472b6;--c7l:#db2777;
  --c8:#84cc16;--c8h:#a3e635;--c8l:#65a30d;
  /* Semantic — crisis-optimized */
  --critical:#ef4444;
  --urgent:#f97316;
  --attention:#f59e0b;
  --safe:#10b981;
  --info:#3b82f6;
  --neutral:#6b7280;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;
  --g1:linear-gradient(135deg,#3b82f6,#06b6d4);
  --g2:linear-gradient(135deg,#10b981,#84cc16);
  --g3:linear-gradient(135deg,#f59e0b,#ef4444);
  --g4:linear-gradient(135deg,#8b5cf6,#ec4899);
  --gCritical:linear-gradient(135deg,#dc2626,#f87171);
  --gUrgent:linear-gradient(135deg,#ea580c,#fbbf24);
  --gSafe:linear-gradient(135deg,#059669,#34d399);
  --r:12px;--rs:8px;--rxs:6px;--rxxs:4px;--rf:9999px;
  --sh1:0 1px 3px rgba(0,0,0,.5);
  --sh2:0 4px 16px rgba(0,0,0,.6);
  --sh3:0 8px 32px rgba(0,0,0,.8);
  --shIn:inset 0 1px 0 rgba(255,255,255,.06);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}

[data-theme="day"]{
  --bg:#f1f5f9;--bg2:#e2e8f0;--bg3:#cbd5e1;--bg4:#94a3b8;
  --panel:#fff;--panel2:#f8fafc;--panel3:#e2e8f0;--panel4:#cbd5e1;
  --bd:#cbd5e1;--bd2:#94a3b8;--bd3:#64748b;
  --tx:#0f172a;--tx2:#334155;--tx3:#64748b;--mu:#94a3b8;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 16px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
}
[data-theme="contrast"]{
  --bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1e1e1e;
  --panel:#0a0a0a;--panel2:#141414;--panel3:#1e1e1e;--panel4:#282828;
  --bd:#333;--bd2:#555;--bd3:#777;
  --tx:#fff;--tx2:#ddd;--tx3:#999;--mu:#666;
  --c1:#00aaff;--c2:#00ff88;--c3:#ffaa00;--c4:#ff3333;--c5:#cc55ff;
  --critical:#ff3333;--urgent:#ff7700;--attention:#ffaa00;
  --safe:#00ff88;--info:#00aaff;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

/* ================================================================
   LAYOUT
   ================================================================ */
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s;
}
.sb-head{
  padding:16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:40px;height:40px;border-radius:10px;
  background:var(--g1);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  box-shadow:0 4px 14px rgba(59,130,246,.5);
}
.sb-title{font-weight:800;font-size:1.05rem;letter-spacing:.3px;line-height:1}
.sb-sub{font-size:.58rem;color:var(--tx3);letter-spacing:1.3px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-status{
  padding:10px 16px;background:var(--bg2);
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:8px;font-size:.68rem;flex-shrink:0;
}
.sb-status .pulse{
  width:8px;height:8px;border-radius:50%;
  background:var(--safe);
  box-shadow:0 0 10px var(--safe);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.sb-nav{flex:1;overflow-y:auto;padding:8px}
.sb-cat{
  font-size:.58rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.4px;text-transform:uppercase;
  padding:12px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.8rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:2px;
  position:relative;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.nav-item .ni-icon{font-size:1.05rem;width:22px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.6rem;font-weight:700;
  padding:2px 7px;border-radius:var(--rf);
  background:var(--critical);color:#fff;
  min-width:20px;text-align:center;
}
.nav-item.active .ni-badge{background:rgba(255,255,255,.28)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:56px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.2rem;align-items:center;justify-content:center;
}
.tb-menu:hover{background:var(--panel2);color:var(--tx)}
.tb-title{font-weight:700;font-size:1rem;flex-shrink:0}
.tb-sub{font-size:.65rem;color:var(--tx3);margin-left:6px;font-weight:600}
.tb-search{flex:1;max-width:420px;position:relative;margin-left:auto}
.tb-search input{
  width:100%;padding:9px 14px 9px 38px;
  background:var(--bg2);border:1px solid var(--bd);
  border-radius:var(--rxs);color:var(--tx);
  font-size:.78rem;transition:var(--t);
}
.tb-search input:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.tb-search .icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--tx3);font-size:.9rem;pointer-events:none;
}
.tb-actions{display:flex;gap:6px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:5px;right:5px;
  min-width:17px;height:17px;padding:0 4px;
  background:var(--critical);color:#fff;
  border-radius:var(--rf);
  font-size:.58rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* PAGE */
.page{flex:1;overflow-y:auto;padding:22px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.4rem;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.page-desc{font-size:.75rem;color:var(--tx3);margin-top:4px}

/* ================================================================
   BUTTONS
   ================================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--panel2);
  color:var(--tx);font-size:.78rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--bd2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(59,130,246,.3)}
.btn.primary:hover{box-shadow:0 6px 22px rgba(59,130,246,.5)}
.btn.success{background:var(--g2);color:#fff;border-color:transparent}
.btn.danger{background:var(--gCritical);color:#fff;border-color:transparent}
.btn.warn{background:var(--gUrgent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:6px 11px;font-size:.72rem}
.btn.xs{padding:3px 9px;font-size:.66rem}
.btn.lg{padding:12px 22px;font-size:.88rem}
.btn.icon-only{padding:9px;width:38px;height:38px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
  box-shadow:var(--sh1);
}
.card.pad-lg{padding:24px}
.card.pad-sm{padding:14px}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;margin-bottom:20px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
  position:relative;overflow:hidden;
  transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.critical::before{background:var(--gCritical)}
.kpi.urgent::before{background:var(--gUrgent)}
.kpi.safe::before{background:var(--gSafe)}
.kpi.info::before{background:var(--g1)}
.kpi.violet::before{background:var(--g4)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.66rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;
  margin-bottom:8px;
}
.kpi-value{
  font-size:1.7rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;
  color:var(--tx);
}
.kpi-hint{
  font-size:.68rem;color:var(--tx3);
  margin-top:8px;line-height:1.4;
}

/* ================================================================
   TABLE
   ================================================================ */
.table-wrap{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;
}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.92rem;font-weight:700}
.table-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.78rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:11px 14px;text-align:left;
  font-size:.64rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.7px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{
  padding:12px 14px;border-bottom:1px solid var(--bd);
  color:var(--tx);vertical-align:middle;
}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

/* ================================================================
   BADGES
   ================================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:var(--rf);
  font-size:.65rem;font-weight:700;
  white-space:nowrap;
}
.badge.critical{background:rgba(239,68,68,.18);color:var(--critical);border:1px solid rgba(239,68,68,.35)}
.badge.urgent{background:rgba(249,115,22,.18);color:var(--urgent);border:1px solid rgba(249,115,22,.35)}
.badge.attention{background:rgba(245,158,11,.18);color:var(--attention);border:1px solid rgba(245,158,11,.35)}
.badge.safe{background:rgba(16,185,129,.18);color:var(--safe);border:1px solid rgba(16,185,129,.35)}
.badge.info{background:rgba(59,130,246,.18);color:var(--info);border:1px solid rgba(59,130,246,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}

/* ================================================================
   FORMS
   ================================================================ */
.form{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-size:.68rem;font-weight:700;
  color:var(--tx2);text-transform:uppercase;
  letter-spacing:.55px;
}
.field label .req{color:var(--critical);margin-left:3px}
.field input,.field select,.field textarea{
  padding:10px 13px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.8rem;transition:var(--t);
  font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(59,130,246,.18);
}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field small{font-size:.65rem;color:var(--tx3)}

/* ================================================================
   MODAL
   ================================================================ */
.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.modal-head h2{font-size:1.05rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:22px}
.modal-foot{
  padding:16px 22px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
  flex-wrap:wrap;
}

/* ================================================================
   TOASTS
   ================================================================ */
.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  padding:12px 18px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd);
  border-left:4px solid var(--info);
  box-shadow:var(--sh3);
  font-size:.78rem;font-weight:500;
  max-width:360px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:11px;
}
.toast.success{border-left-color:var(--safe)}
.toast.error{border-left-color:var(--critical)}
.toast.warn{border-left-color:var(--attention)}
.toast.info{border-left-color:var(--info)}
.toast.critical{border-left-color:var(--critical);background:linear-gradient(135deg,var(--panel),rgba(239,68,68,.1))}
.toast .t-icon{font-size:1.1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

/* ================================================================
   CHARTS
   ================================================================ */
.chart-box{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:18px;
}
.chart-box h3{font-size:.88rem;font-weight:700;margin-bottom:14px}
.chart-canvas{width:100%;height:240px;display:block}
.chart-legend{
  display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;
  font-size:.7rem;color:var(--tx2);
}
.chart-legend .li{display:flex;align-items:center;gap:6px}
.chart-legend .dot{width:11px;height:11px;border-radius:3px}

/* ================================================================
   MISC
   ================================================================ */
.empty{
  text-align:center;padding:56px 20px;color:var(--tx3);
  font-size:.82rem;
}
.empty .icon{font-size:3rem;margin-bottom:14px;opacity:.35;display:block}
.empty h4{font-size:.95rem;color:var(--tx2);margin-bottom:6px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 12px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.68rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#fff;border-color:var(--c1)}

.divider{height:1px;background:var(--bd);margin:18px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--bd);
  font-size:.78rem;
  gap:12px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}
.stat-line .sl-value.pos{color:var(--safe)}
.stat-line .sl-value.neg{color:var(--critical)}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.7rem;font-weight:600;color:var(--tx2);
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--safe)}

.spinner{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--bd);border-top-color:var(--c1);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Priority color strip on rows */
tr.p-critical td:first-child{border-left:4px solid var(--critical)}
tr.p-urgent td:first-child{border-left:4px solid var(--urgent)}
tr.p-attention td:first-child{border-left:4px solid var(--attention)}
tr.p-safe td:first-child{border-left:4px solid var(--safe)}
tr.p-info td:first-child{border-left:4px solid var(--info)}

/* Card grid for boards */
.board-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
.board-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  transition:var(--t);cursor:pointer;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.board-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.board-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;bottom:0;
  background:var(--info);
}
.board-card.critical::before{background:var(--critical)}
.board-card.urgent::before{background:var(--urgent)}
.board-card.attention::before{background:var(--attention)}
.board-card.safe::before{background:var(--safe)}
.bc-head{
  display:flex;justify-content:space-between;align-items:start;gap:10px;
  margin-bottom:10px;
}
.bc-title{font-weight:700;font-size:.88rem;line-height:1.3;color:var(--tx)}
.bc-meta{font-size:.68rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.bc-desc{
  font-size:.75rem;color:var(--tx2);line-height:1.55;
  margin-bottom:12px;flex:1;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden;
}
.bc-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:12px;border-top:1px solid var(--bd);
  font-size:.68rem;color:var(--tx3);
  gap:8px;flex-wrap:wrap;
}

/* Status indicator dot */
.dot-stat{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--safe);
  margin-right:5px;vertical-align:middle;
}
.dot-stat.critical{background:var(--critical);animation:pulse 1.5s infinite}
.dot-stat.urgent{background:var(--urgent)}
.dot-stat.attention{background:var(--attention)}

/* QR display box */
.qr-box{
  background:#fff;padding:16px;border-radius:var(--rxs);
  display:inline-block;position:relative;
}
.qr-box canvas{display:block}

/* Map container */
.map-wrap{
  position:relative;background:#000;
  border-radius:var(--rxs);overflow:hidden;
  border:1px solid var(--bd);
}
.map-canvas{display:block;cursor:crosshair;width:100%;background:#0a0d14}
.map-legend{
  position:absolute;top:12px;left:12px;
  background:rgba(10,13,20,.92);backdrop-filter:blur(8px);
  border:1px solid var(--bd);border-radius:var(--rxs);
  padding:10px 12px;font-size:.68rem;
  display:flex;flex-direction:column;gap:6px;
}
.map-legend .li{display:flex;align-items:center;gap:7px}
.map-legend .pin{width:10px;height:10px;border-radius:50%}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* Print */
@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .page{padding:0;background:#fff;color:#000}
  body{overflow:visible;height:auto;background:#fff}
  .modal{position:static;background:none;display:block!important}
  .modal-box{max-width:none;box-shadow:none;border:none}
  .modal-head,.modal-foot{display:none}
  .modal-body{padding:0}
}

/* Responsive */
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:800;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh3)}
  .tb-menu{display:flex}
  .form-row,.form-row.three{grid-template-columns:1fr}
  .grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}
  .page{padding:14px}
  .page-title{font-size:1.15rem}
  .kpi-value{font-size:1.4rem}
  .tb-search{display:none}
  .board-grid{grid-template-columns:1fr}
}
@media (min-width:901px){.sidebar{transform:none!important}}

/* Utility */
.text-critical{color:var(--critical)}
.text-urgent{color:var(--urgent)}
.text-attention{color:var(--attention)}
.text-safe{color:var(--safe)}
.text-info{color:var(--info)}
.text-mu{color:var(--tx3)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}

/* ---------- DOM utils ---------- */
function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='style'&&typeof attrs[k]==='object')Object.assign(e.style,attrs[k]);
    else if(k==='text')e.textContent=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0)e[k]=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  if(children){
    if(typeof children==='string')e.innerHTML=children;
    else if(Array.isArray(children))children.forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    else e.appendChild(children);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(prefix){return (prefix||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var d=new Date(iso);
  var s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function parseNum(v){
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

/* ---------- Toast ---------- */
function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ',critical:'🆘'};
  var t2=el('div',{class:'toast '+type});
  t2.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t2);
  setTimeout(function(){
    t2.classList.add('leaving');
    setTimeout(function(){t2.remove()},320);
  },3600);
}

/* ---------- Modal ---------- */
function openModal(opts){
  opts=opts||{};
  var box=$('modalBox');
  box.className='modal-box'+(opts.wide?' wide':'')+(opts.narrow?' narrow':'');
  $('modalTitle').textContent=opts.title||'';
  $('modalBody').innerHTML=opts.body||'';
  $('modalFoot').innerHTML=opts.foot||'<button class="btn" onclick="closeModal()">'+t('cancel')+'</button>';
  $('modal').classList.add('open');
  if(opts.onOpen)setTimeout(opts.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,message,onConfirm,danger){
  openModal({
    title:title,
    narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.65;font-size:.85rem">'+esc(message)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">'+t('cancel')+'</button>'+
         '<button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">Confirm</button>',
    onOpen:function(){
      $('confirmYes').onclick=function(){closeModal();onConfirm()};
    }
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal({
    title:title,
    narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">'+t('cancel')+'</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');
      inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

/* ================================================================
   CRYPTO — AES-GCM encryption for sync bundles
   ================================================================ */
var Crypto={
  async deriveKey(passphrase,salt){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(passphrase),{name:'PBKDF2'},false,['deriveKey']);
    return await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},
      km,
      {name:'AES-GCM',length:256},
      false,
      ['encrypt','decrypt']
    );
  },
  async encrypt(plaintext,passphrase){
    if(!window.crypto||!window.crypto.subtle)throw new Error('Web Crypto not available');
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await this.deriveKey(passphrase,salt);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(plaintext));
    var combined=new Uint8Array(salt.length+iv.length+ct.byteLength);
    combined.set(salt,0);
    combined.set(iv,salt.length);
    combined.set(new Uint8Array(ct),salt.length+iv.length);
    return this.b64(combined);
  },
  async decrypt(b64,passphrase){
    var data=this.unb64(b64);
    var salt=data.slice(0,16);
    var iv=data.slice(16,28);
    var ct=data.slice(28);
    var key=await this.deriveKey(passphrase,salt);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  },
  b64(buf){
    var bin='';
    var bytes=new Uint8Array(buf);
    for(var i=0;i<bytes.byteLength;i++)bin+=String.fromCharCode(bytes[i]);
    return btoa(bin);
  },
  unb64(str){
    var bin=atob(str);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return bytes;
  }
};

  }catch(e){
    console.error('Save failed',e);
    toast('Storage full or unavailable','error');
  }

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var data=JSON.parse(raw);
    Object.keys(State).forEach(function(k){
      if(data[k]!==undefined)State[k]=data[k];
    });
    return true;
  }catch(e){return false}
}
function resetAll(){
  confirmDialog('Reset All Data','This will permanently erase all data in AidBridge. Continue?',function(){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  },true);

};
var CurrentRoute='dashboard';

function navigate(route){
  if(!ROUTES[route])route='dashboard';
  CurrentRoute=route;
  $('tbTitle').textContent=ROUTES[route].title;
  $('tbSub').textContent=ROUTES[route].sub;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var nav=$('sbNav');
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var html='';
  ['Overview','Coordination','Response','Command','Help'].forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      var badge='';
      var r=item.route;
      if(r==='needs'){
        var open=State.needs.filter(function(n){return n.status==='open'}).length;
        if(open>0)badge='<span class="ni-badge">'+open+'</span>';
      }else if(r==='tasks'){
        var active=State.tasks.filter(function(t){return t.status!=='completed'}).length;
        if(active>0)badge='<span class="ni-badge">'+active+'</span>';
      }else if(r==='incidents'){
        var activeInc=State.incidents.filter(function(i){return i.status==='active'}).length;
        if(activeInc>0)badge='<span class="ni-badge">'+activeInc+'</span>';
      }else if(r==='persons'){
        var critical=State.persons.filter(function(p){return p.priority==='critical'}).length;
        if(critical>0)badge='<span class="ni-badge">'+critical+'</span>';
      }
      html+='<div class="nav-item'+(r===CurrentRoute?' active':'')+'" onclick="navigate(\''+r+'\')">'+
            '<span class="ni-icon">'+item.meta.icon+'</span>'+
            '<span>'+esc(item.meta.title)+'</span>'+badge+'</div>';
    });
  });
  nav.innerHTML=html;
}

var AlertState={unread:0};

function showAlerts(){
  var alerts=[];
  // Critical incidents
  State.incidents.filter(function(i){return i.status==='active'&&i.severity==='critical'}).forEach(function(i){
    alerts.push({type:'critical',icon:'⚠️',title:'CRITICAL incident',msg:i.title,ts:i.createdAt,route:'incidents'});
  });
  // Critical needs open
  State.needs.filter(function(n){return n.status==='open'&&n.priority==='critical'}).forEach(function(n){
    alerts.push({type:'critical',icon:'🆘',title:'Critical need open',msg:n.title,ts:n.createdAt,route:'needs'});
  });
  // Vulnerable persons not checked in recently
  var cutoff=Date.now()-6*3600000;
  State.persons.forEach(function(p){
    if(p.priority==='critical'&&(!p.lastCheckIn||new Date(p.lastCheckIn).getTime()<cutoff)){
      alerts.push({type:'urgent',icon:'👥',title:'Vulnerable — no recent check-in',msg:p.name,ts:p.createdAt,route:'persons'});
    }
  });
  // Overdue tasks
  State.tasks.forEach(function(tk){
    if(tk.status!=='completed'&&tk.due&&new Date(tk.due).getTime()<Date.now()){
      alerts.push({type:'urgent',icon:'⏰',title:'Task overdue',msg:tk.title,ts:tk.due,route:'tasks'});
    }
  });
  // Resources near full
  State.resources.forEach(function(r){
    if(r.type==='shelter'&&r.capacity>0&&r.current/r.capacity>0.9){
      alerts.push({type:'attention',icon:'📦',title:'Shelter near full',msg:r.name+' ('+r.current+'/'+r.capacity+')',ts:nowISO(),route:'resources'});
    }
  });
  alerts.sort(function(a,b){return (PRIORITY_ORDER[a.type]||9)-(PRIORITY_ORDER[b.type]||9)});

  var body='';
  if(alerts.length===0){
    body='<div class="empty"><span class="icon">✓</span><h4>All clear</h4><p>No critical alerts at this time.</p></div>';
  }else{
    alerts.forEach(function(a){
      body+='<div class="stat-line" style="cursor:pointer;padding:14px 0;border-bottom:1px solid var(--bd)" onclick="closeModal();navigate(\''+a.route+'\')">';
      body+='<div style="display:flex;gap:12px;align-items:start;flex:1">';
      body+='<span style="font-size:1.3rem">'+a.icon+'</span>';
      body+='<div><div style="font-weight:600;font-size:.8rem;color:'+PRIORITY_COLOR[a.type]+'">'+esc(a.title)+'</div>';
      body+='<div style="font-size:.72rem;color:var(--tx2);margin-top:2px">'+esc(a.msg)+'</div>';
      body+='<div style="font-size:.62rem;color:var(--tx3);margin-top:3px;font-family:var(--mono)">'+timeAgo(a.ts)+'</div></div>';
      body+='</div></div>';
    });
  }
  openModal({
    title:'🔔 Alerts ('+alerts.length+')',
    body:body,
    wide:true
  });
}

function updateAlerts(){
  var count=0;
  count+=State.incidents.filter(function(i){return i.status==='active'&&i.severity==='critical'}).length;
  count+=State.needs.filter(function(n){return n.status==='open'&&n.priority==='critical'}).length;
  count+=State.tasks.filter(function(tk){return tk.status!=='completed'&&tk.due&&new Date(tk.due).getTime()<Date.now()}).length;
  var badge=$('alertBadge');
  if(badge){
    if(count>0){badge.textContent=count;badge.style.display='flex'}
    else badge.style.display='none';
  }
  var statusEl=$('sbStatusText');
  if(statusEl){
    var state=count>0?'ELEVATED':'OPERATIONAL';
    statusEl.innerHTML=state+' · <span class="mono">'+new Date().toTimeString().slice(0,5)+'</span>';
  }
}

   CHART UTILITIES
   ================================================================ */
function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=44,padR=14,padT=14,padB=36;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  var steps=4;
  for(var i=0;i<=steps;i++){
    var y=padT+i*(cH/steps);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.textAlign='right';
    ctx.fillText(Math.round(max-(i*(max/steps))),padL-6,y+3);
  }
  var bw=cW/data.length*0.72;
  var gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.14;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    ctx.fillStyle=opts.colors?opts.colors[i%opts.colors.length]:(d.color||'#3b82f6');
    ctx.beginPath();
    var r=Math.min(4,bw/2);
    ctx.moveTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);
    ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);
    ctx.lineTo(x,padT+cH);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    ctx.font='10px -apple-system, sans-serif';
    var label=String(d.x);
    if(label.length>10)label=label.slice(0,9)+'…';
    ctx.fillText(label, x+bw/2, H-12);
  });
}

function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-30;
  var inner=r*0.6;
  var start=-Math.PI/2;
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16'][i%8];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();

function after_dashboard(){
  var c1=$('dashNeedsChart');
  if(c1){
    var byCat={};
    State.needs.filter(function(n){return n.status==='open'}).forEach(function(n){
      byCat[n.category]=(byCat[n.category]||0)+1;
    });
    var colors=['#ef4444','#f59e0b','#3b82f6','#10b981','#8b5cf6','#06b6d4','#ec4899','#84cc16'];
    var arr=Object.keys(byCat).map(function(k,i){return {x:k,y:byCat[k],color:colors[i%colors.length]}}).sort(function(a,b){return b.y-a.y});
    drawBarChart(c1,arr,{colors:arr.map(function(d){return d.color})});
  }
  var c2=$('dashCheckinChart');
  if(c2){
    var byHour={};
    for(var i=23;i>=0;i--){
      var h=new Date(Date.now()-i*3600000);
      var key=h.getHours()+':00';
      byHour[key]=0;
    }
    var cutoff=Date.now()-24*3600000;
    State.checkins.forEach(function(c){
      var t=new Date(c.createdAt).getTime();
      if(t<cutoff)return;
      var h=new Date(c.createdAt).getHours()+':00';
      if(byHour[h]!==undefined)byHour[h]++;
    });
    var arr=Object.keys(byHour).map(function(k){return {x:k,y:byHour[k]}});
    drawBarChart(c2,arr,{colors:['#10b981']});
  }
}

             (n.description||'').toLowerCase().indexOf(q)>-1||

function openNewNeed(){editNeed(null)}
function editNeed(id){
  var n=id?State.needs.find(function(x){return x.id===id}):
    {title:'',category:'Medical',priority:'urgent',description:'',contactName:'',contactPhone:'',location:'',status:'open'};
  if(id&&!n)return;

  html+='<div class="field"><label>Title <span class="req">*</span></label><input type="text" id="nTitle" value="'+esc(n.title)+'" placeholder="e.g. Insulin for diabetic residents"></div>';
  html+='<div class="form-row three">';
  html+='<div class="field"><label>Category</label><select id="nCat">'+cats.map(function(c){return '<option value="'+c+'"'+(n.category===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>';

  ['critical','urgent','attention','info'].forEach(function(p){html+='<option value="'+p+'"'+(n.priority===p?' selected':'')+'>'+PRIORITY_LABEL[p]+'</option>'});

  });
  html+='</select></div>';
  html+='</div>';
  html+='<div class="field"><label>Description</label><textarea id="nDesc" rows="3" placeholder="Details, quantities, urgency...">'+esc(n.description||'')+'</textarea></div>';
  html+='<div class="form-row">';
  html+='<div class="field"><label>Contact name</label><input type="text" id="nContact" value="'+esc(n.contactName||'')+'"></div>';
  html+='<div class="field"><label>Contact phone</label><input type="tel" id="nPhone" value="'+esc(n.contactPhone||'')+'"></div>';
  html+='</div>';
  html+='<div class="field"><label>Location</label><input type="text" id="nLoc" value="'+esc(n.location||'')+'" placeholder="Address or landmark"></div>';
  html+='</div>';
  openModal({
    title:id?'Edit Need':t('new_need'),
    wide:true,
    body:html,
    foot:(id?'<button class="btn danger" onclick="deleteNeed(\''+id+'\')">'+t('delete')+'</button>':'')+
         '<button class="btn" onclick="closeModal()">'+t('cancel')+'</button>'+
         '<button class="btn primary" id="saveN">'+t('save')+'</button>',
    onOpen:function(){
      $('nTitle').focus();
      $('saveN').onclick=function(){
        var title=$('nTitle').value.trim();
        if(!title){toast('Title is required','error');return}
        var data={
          title:title,
          category:$('nCat').value,
          priority:$('nPri').value,
          status:$('nStat').value,
          description:$('nDesc').value.trim(),
          contactName:$('nContact').value.trim(),
          contactPhone:$('nPhone').value.trim(),
          location:$('nLoc').value.trim()
        };
        if(id)Object.assign(n,data);
        else{
          data.id=uid('need');
          data.createdAt=nowISO();
          data.lat=0;data.lng=0;
          State.needs.unshift(data);
          toast('Need created','success');
        }
        saveState();closeModal();renderNav();renderPage();
      };
    }
  });

function viewNeed(id){
  var n=State.needs.find(function(x){return x.id===id});
  if(!n)return;
  var body='';
  body+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">';
  body+=priorityBadge(n.priority);
  body+='<span class="badge neutral">'+esc(n.category)+'</span>';
  body+='<span class="badge '+(n.status==='resolved'?'safe':'info')+'">'+n.status.toUpperCase()+'</span>';
  body+='</div>';
  body+='<div class="card pad-sm" style="background:var(--bg2)">';
  body+='<div style="font-size:.85rem;line-height:1.65;color:var(--tx)">'+esc(n.description||'No description')+'</div>';
  body+='</div>';
  body+='<div class="mt-16">';
  body+='<div class="stat-line"><span class="sl-label">Contact</span><span>'+esc(n.contactName||'—')+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Phone</span><span style="font-family:var(--mono)">'+esc(n.contactPhone||'—')+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Location</span><span>'+esc(n.location||'—')+'</span></div>';
  body+='<div class="stat-line"><span class="sl-label">Created</span><span style="font-family:var(--mono);font-size:.72rem">'+fmtDateTime(n.createdAt)+'</span></div>';
  if(n.assignedTo)body+='<div class="stat-line"><span class="sl-label">Assigned to</span><span>'+esc(n.assignedTo)+'</span></div>';
  body+='</div>';

  var foot='<button class="btn" onclick="closeModal()">Close</button>';
  if(n.status!=='resolved'){
    foot+='<button class="btn success" onclick="resolveNeed(\''+id+'\')">✓ Mark Resolved</button>';
  }
  foot+='<button class="btn" onclick="closeModal();editNeed(\''+id+'\')">✏️ '+t('edit')+'</button>';
  foot+='<button class="btn" onclick="closeModal();shareItemAsComm(\'need\',\''+id+'\')">📡 Share</button>';

  openModal({
    title:n.title,
    wide:true,
    body:body,
    foot:foot
  });
}

function resolveNeed(id){
  var n=State.needs.find(function(x){return x.id===id});
  if(!n)return;
  n.status='resolved';
  n.resolvedAt=nowISO();
  State.comms.unshift({
    id:uid('comm'),
    from:State.settings.operatorName||'Coordinator',
    to:'All teams',
    message:'RESOLVED: '+n.title,
    type:'broadcast',
    createdAt:nowISO()
  });
  saveState();closeModal();
  renderNav();renderPage();
  toast('Need marked resolved','success');
}

function deleteNeed(id){
  confirmDialog('Delete Need','Delete this need record?',function(){
    State.needs=State.needs.filter(function(x){return x.id!==id});
    saveState();closeModal();renderNav();renderPage();
    toast('Deleted','success');
  },true);
}

function findMatchingNeeds(offer){
  // Simple heuristic: category match + text similarity
  return State.needs.filter(function(n){
    if(n.status==='resolved')return false;
    if(n.category===offer.category)return true;
    // Cross-category heuristics
    var mappings={
      'Food':['Food'],
      'Water':['Water'],
      'Medical':['Medical'],
      'Shelter':['Shelter','Space'],
      'Space':['Shelter'],
      'Transport':['Transport'],
      'Fuel':['Fuel','Transport'],
      'Comms':['Comms'],
      'Equipment':['Equipment'],
      'Baby':['Baby'],
      'Manpower':['Other']
    };
    var offerMaps=mappings[offer.category]||[];
    if(offerMaps.indexOf(n.category)>-1)return true;
    // Text match
    var oWords=(offer.title+' '+(offer.description||'')).toLowerCase().split(/\s+/);
    var nWords=(n.title+' '+(n.description||'')).toLowerCase().split(/\s+/);
    var common=oWords.filter(function(w){return w.length>4&&nWords.indexOf(w)>-1});
    return common.length>=2;
  });
}

/* ================================================================
   TASKS
   ================================================================ */
var TasksFilter={status:'active',assignee:'',q:''};

function render_tasks(){
  var list=State.tasks.slice();
  if(TasksFilter.q){
    var q=TasksFilter.q.toLowerCase();
    list=list.filter(function(tk){return (tk.title||'').toLowerCase().indexOf(q)>-1});
  }
  if(TasksFilter.status==='active')list=list.filter(function(tk){return tk.status!=='completed'});
  else if(TasksFilter.status==='completed')list=list.filter(function(tk){return tk.status==='completed'});
  else if(TasksFilter.status==='overdue')list=list.filter(function(tk){return tk.status!=='completed'&&tk.due&&new Date(tk.due).getTime()<Date.now()});
  if(TasksFilter.assignee)list=list.filter(function(tk){return tk.assignee===TasksFilter.assignee});

  list.sort(function(a,b){
    var p=sortByPriority(a,b);
    if(p!==0)return p;
    return (a.due||'').localeCompare(b.due||'');
  });

  var assignees={};
  State.tasks.forEach(function(tk){if(tk.assignee)assignees[tk.assignee]=1});
  var active=list.filter(function(tk){return tk.status!=='completed'}).length;
  var overdue=list.filter(function(tk){return tk.status!=='completed'&&tk.due&&new Date(tk.due).getTime()<Date.now()}).length;

  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title">✅ Tasks</div>';
  html+='<div class="page-desc">'+State.tasks.length+' total · '+active+' active · '+overdue+' overdue</div></div>';
  html+='<button class="btn primary" onclick="openNewTask()">➕ '+t('new_task')+'</button>';
  html+='</div>';

  html+='<div class="card pad-sm" style="margin-bottom:14px">';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">';
  html+='<input type="text" placeholder="Search tasks..." value="'+esc(TasksFilter.q)+'" oninput="TasksFilter.q=this.value;renderPage()" style="flex:1;min-width:200px;padding:10px 14px;border-radius:var(--rxs);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:.78rem">';
  html+='<div class="chips">';
  [['active','Active'],['overdue','Overdue'],['completed','Completed'],['all','All']].forEach(function(s){
    html+='<span class="chip'+(TasksFilter.status===s[0]?' active':'')+'" onclick="TasksFilter.status=\''+s[0]+'\';renderPage()">'+s[1]+'</span>';
  });
  html+='</div>';
  if(Object.keys(assignees).length){
    html+='<select onchange="TasksFilter.assignee=this.value;renderPage()" style="padding:10px 14px;border-radius:var(--rxs);border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:.78rem">';
    html+='<option value="">All assignees</option>';
    Object.keys(assignees).sort().forEach(function(a){
      html+='<option value="'+esc(a)+'"'+(TasksFilter.assignee===a?' selected':'')+'>'+esc(a)+'</option>';
    });
    html+='</select>';
  }
  html+='</div></div>';

  if(list.length===0){
    html+='<div class="empty"><span class="icon">✅</span><h4>No tasks match</h4></div>';
    return html;
  }

  html+='<div class="table-wrap"><div class="table-scroll"><table>';

  html+='</div>';
  html+='<div class="form-row">';
  html+='<div class="field"><label>Due date/time</label><input type="datetime-local" id="tkDue" value="'+esc((tk.due||'').slice(0,16))+'"></div>';
  html+='<div class="field"><label>Status</label><select id="tkStat">';
  [['open','Open'],['in_progress','In Progress'],['blocked','Blocked'],['completed','Completed']].forEach(function(s){

    title:id?'Edit Task':t('new_task'),
    body:html,
    foot:(id?'<button class="btn danger" onclick="deleteTask(\''+id+'\')">'+t('delete')+'</button>':'')+
         '<button class="btn" onclick="closeModal()">'+t('cancel')+'</button>'+
         '<button class="btn primary" id="saveT">'+t('save')+'</button>',
    onOpen:function(){
      $('tkTitle').focus();
      $('saveT').onclick=function(){
        var title=$('tkTitle').value.trim();
        if(!title){toast('Title required','error');return}

          due:$('tkDue').value,
          status:$('tkStat').value,
          notes:$('tkNotes').value.trim()
        };
        if(id)Object.assign(tk,data);
        else{
          data.id=uid('task');

          State.tasks.unshift(data);
        }
        saveState();closeModal();renderNav();renderPage();
        toast('Saved','success');
      };
    }
  });

function toggleTask(id){
  var tk=State.tasks.find(function(x){return x.id===id});
  if(!tk)return;
  tk.status=tk.status==='completed'?'open':'completed';
  if(tk.status==='completed')tk.completedAt=nowISO();
  saveState();renderNav();renderPage();
}
function deleteTask(id){
  State.tasks=State.tasks.filter(function(x){return x.id!==id});
  saveState();renderNav();renderPage();
  toast('Task deleted','success');
}

function getMapCenter(){
  var lat=parseFloat($('mapCenterLat').value)||29.7604;
  var lng=parseFloat($('mapCenterLng').value)||-95.3698;
  return {lat:lat,lng:lng};
}

function fitAllOnMap(){
  var all=[];
  if(MapState.layers.needs)all=all.concat(State.needs.filter(function(x){return x.lat}));
  if(MapState.layers.offers)all=all.concat(State.offers.filter(function(x){return x.lat}));
  if(MapState.layers.incidents)all=all.concat(State.incidents.filter(function(x){return x.lat}));
  if(MapState.layers.persons)all=all.concat(State.persons.filter(function(x){return x.lat}));
  if(MapState.layers.resources)all=all.concat(State.resources.filter(function(x){return x.lat}));
  if(MapState.layers.checkins)all=all.concat(State.checkins.filter(function(x){return x.lat}));
  if(!all.length){toast('No entities with location data','warn');return}
  var minLat=Math.min.apply(null,all.map(function(x){return x.lat}));
  var maxLat=Math.max.apply(null,all.map(function(x){return x.lat}));
  var minLng=Math.min.apply(null,all.map(function(x){return x.lng}));
  var maxLng=Math.max.apply(null,all.map(function(x){return x.lng}));
  $('mapCenterLat').value=((minLat+maxLat)/2).toFixed(4);
  $('mapCenterLng').value=((minLng+maxLng)/2).toFixed(4);
  renderMapCanvas();
}

function useGPSForMap(){
  if(!navigator.geolocation){toast('GPS unavailable','error');return}
  navigator.geolocation.getCurrentPosition(function(pos){
    $('mapCenterLat').value=pos.coords.latitude.toFixed(4);
    $('mapCenterLng').value=pos.coords.longitude.toFixed(4);
    renderMapCanvas();
    toast('Centered on your location','success');
  },function(){toast('Could not get location','error')},{timeout:5000});
}

function renderMapCanvas(){
  var c=$('mapCanvas');
  if(!c)return;
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;
  c.height=rect.height*dpr;
  var ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.fillStyle='#0a0d14';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(59,130,246,.08)';
  ctx.lineWidth=1;
  for(var x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(var y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  var center=getMapCenter();
  var range=0.05/MapState.zoom; // degrees visible

  function toCanvas(lat,lng){
    var px=W/2+((lng-center.lng)/range)*W/2;
    var py=H/2-((lat-center.lat)/range)*H/2;
    return [px,py];
  }

  // Draw crosshair center
  ctx.strokeStyle='rgba(59,130,246,.4)';
  ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.setLineDash([]);

  var plotted=[];

  function plotEntity(lat,lng,color,size,label,onClick){
    if(!lat||!lng)return;
    var p=toCanvas(lat,lng);
    if(p[0]<-50||p[0]>W+50||p[1]<-50||p[1]>H+50)return;
    plotted.push({x:p[0],y:p[1],label:label,onClick:onClick});
    ctx.beginPath();
    ctx.arc(p[0],p[1],size+3,0,Math.PI*2);
    ctx.fillStyle=color+'22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p[0],p[1],size,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
    ctx.strokeStyle='#000';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  if(MapState.layers.incidents){
    State.incidents.filter(function(x){return x.lat}).forEach(function(i){
      var color=i.severity==='critical'?'#ef4444':i.severity==='urgent'?'#f59e0b':'#8b5cf6';
      plotEntity(i.lat,i.lng,color,10,i.title,function(){viewIncident(i.id)});
    });
  }
  if(MapState.layers.resources){
    State.resources.filter(function(x){return x.lat}).forEach(function(r){
      plotEntity(r.lat,r.lng,'#3b82f6',8,r.name,function(){viewResource(r.id)});
    });
  }
  if(MapState.layers.persons){
    State.persons.filter(function(x){return x.lat}).forEach(function(p){
      var color=p.priority==='critical'?'#dc2626':p.priority==='urgent'?'#ea580c':'#06b6d4';
      plotEntity(p.lat,p.lng,color,7,p.name,function(){viewPerson(p.id)});
    });
  }
  if(MapState.layers.needs){
    State.needs.filter(function(x){return x.lat&&x.status==='open'}).forEach(function(n){
      var color=n.priority==='critical'?'#ef4444':n.priority==='urgent'?'#f59e0b':'#10b981';
      plotEntity(n.lat,n.lng,color,6,n.title,function(){viewNeed(n.id)});
    });
  }
  if(MapState.layers.offers){
    State.offers.filter(function(x){return x.lat}).forEach(function(o){
      plotEntity(o.lat,o.lng,'#10b981',5,o.title,function(){viewOffer(o.id)});
    });
  }
  if(MapState.layers.checkins){
    State.checkins.filter(function(x){return x.lat}).forEach(function(c){
      var color=c.isSOS?'#ef4444':c.status==='safe'?'#a3e635':'#f59e0b';
      plotEntity(c.lat,c.lng,color,5,c.name,function(){});
    });
  }

  // Store plotted for hit detection
  c._plotted=plotted;

  // Zoom label
  var zl=$('mapZoomLabel');
  if(zl)zl.textContent=MapState.zoom.toFixed(1)+'×';

  // Coordinates label at bottom
  ctx.fillStyle='rgba(168,178,208,.6)';
  ctx.font='10px monospace';
  ctx.textAlign='left';
  ctx.fillText('Center: '+center.lat.toFixed(4)+', '+center.lng.toFixed(4),10,H-8);
  ctx.textAlign='right';
  ctx.fillText(plotted.length+' entities',W-10,H-8);
}

function after_map(){
  renderMapCanvas();
  var c=$('mapCanvas');
  if(c){
    c.onclick=function(e){
      var rect=c.getBoundingClientRect();
      var x=e.clientX-rect.left;
      var y=e.clientY-rect.top;
      var plotted=c._plotted||[];
      // Find nearest within 15px
      var best=null,bestD=15;
      plotted.forEach(function(p){
        var d=Math.sqrt((p.x-x)*(p.x-x)+(p.y-y)*(p.y-y));
        if(d<bestD){bestD=d;best=p}
      });
      if(best&&best.onClick)best.onClick();
    };
  }
}

function personCode(p){
  // Deterministic 6-char code from name
  var h=0;var s=(p.name||'')+(p.id||'');
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}
  return Math.abs(h).toString(36).toUpperCase().slice(0,4)+'-'+Math.abs(h*7).toString(36).toUpperCase().slice(0,2);
}

function after_sync(){
  var enc=$('syncEncrypt');
  if(enc){
    enc.onchange=function(){
      $('syncPassWrap').style.display=this.checked?'flex':'none';
    };
  }
  var file=$('importFile');
  if(file){
    file.onchange=function(){
      var f=this.files[0];
      if(!f)return;
      var r=new FileReader();
      r.onload=function(){
        tryImportBundle(r.result);
      };
      r.readAsText(f);
    };
  }
}

    data:{

async function tryImportBundle(text){
  text=text.trim();
  if(text.indexOf('AIDBRIDGE-ENCRYPTED:')===0){
    var pass=prompt('This bundle is encrypted. Enter passphrase:');
    if(!pass){toast('Import cancelled','warn');return}
    try{
      var payload=text.substring('AIDBRIDGE-ENCRYPTED:'.length);
      var decrypted=await Crypto.decrypt(payload,pass);
      mergeBundle(JSON.parse(decrypted));
    }catch(e){
      toast('Decryption failed — wrong passphrase?','error');
    }
  }else if(text.indexOf('AIDBRIDGE-BUNDLE:')===0){
    try{
      mergeBundle(JSON.parse(text.substring('AIDBRIDGE-BUNDLE:'.length)));
    }catch(e){
      toast('Invalid bundle','error');
    }
  }else{
    try{
      var data=JSON.parse(text);
      if(data.type==='aidbridge-bundle')mergeBundle(data);
      else if(data.needs||data.offers||data.persons)mergeBundle({data:data});
      else toast('Unrecognized format','error');
    }catch(e){
      toast('Could not parse import','error');
    }
  }
}

function importBundleFromText(){
  var txt=$('importText').value.trim();

}

function mergeBundle(bundle){
  var d=bundle.data||bundle;
  var counts={needs:0,offers:0,persons:0,incidents:0,tasks:0,resources:0,checkins:0,comms:0};
  function mergeArr(target,src,key,countName){
    if(!src||!Array.isArray(src))return;
    var existing={};
    target.forEach(function(x){existing[x.id]=x});
    src.forEach(function(item){
      if(!item.id)return;
      var current=existing[item.id];
      if(!current){
        target.push(item);
        counts[countName]++;
      }else{
        // Merge: prefer newer createdAt/updatedAt
        var ct=new Date(current.createdAt||current.updatedAt||0).getTime();
        var it=new Date(item.createdAt||item.updatedAt||0).getTime();
        if(it>ct){
          Object.assign(current,item);
          counts[countName]++;
        }
      }
    });
  }
  mergeArr(State.needs,d.needs,'id','needs');
  mergeArr(State.offers,d.offers,'id','offers');
  mergeArr(State.persons,d.persons,'id','persons');
  mergeArr(State.incidents,d.incidents,'id','incidents');
  mergeArr(State.tasks,d.tasks,'id','tasks');
  mergeArr(State.resources,d.resources,'id','resources');
  mergeArr(State.checkins,d.checkins,'id','checkins');
  mergeArr(State.comms,d.comms,'id','comms');
  if(d.teams&&Array.isArray(d.teams)){
    var teamIds=State.teams.map(function(t){return t.id});
    d.teams.forEach(function(t){if(teamIds.indexOf(t.id)===-1)State.teams.push(t)});
  }
  saveState();
  renderNav();renderPage();
  var total=Object.keys(counts).reduce(function(s,k){return s+counts[k]},0);
  toast('Imported: '+total+' records merged','success');
  if(!State.settings.lastSync){State.settings.lastSync=nowISO();saveState()}
}

function drawQRStyle(canvas,text){
  // Simplified visual code (not a real QR — visual identifier)
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  var cells=25;
  var cell=W/cells;
  var seed=0;
  for(var i=0;i<text.length;i++)seed=(seed*31+text.charCodeAt(i))>>>0;
  function rnd(){
    seed=(seed*1664525+1013904223)>>>0;
    return seed/4294967296;
  }
  // Position markers
  [[0,0],[cells-7,0],[0,cells-7]].forEach(function(m){
    ctx.fillStyle='#000';
    ctx.fillRect(m[0]*cell,m[1]*cell,7*cell,7*cell);
    ctx.fillStyle='#fff';
    ctx.fillRect((m[0]+1)*cell,(m[1]+1)*cell,5*cell,5*cell);
    ctx.fillStyle='#000';
    ctx.fillRect((m[0]+2)*cell,(m[1]+2)*cell,3*cell,3*cell);
  });
  // Data cells
  for(var y=0;y<cells;y++){
    for(var x=0;x<cells;x++){
      var inMarker=(x<8&&y<8)||(x>=cells-8&&y<8)||(x<8&&y>=cells-8);
      if(inMarker)continue;
      if(rnd()>0.5){
        ctx.fillStyle='#000';
        ctx.fillRect(x*cell,y*cell,cell,cell);
      }
    }
  }
}

      '<p>Each device has its own local copy. To share: (1) Export an encrypted bundle on device A, (2) Transfer the file via USB/Bluetooth/messaging, (3) Import on device B. IDs prevent duplicates — records merge cleanly.</p>'+
      '<h3 style="color:var(--info);font-size:.92rem;margin-top:14px;margin-bottom:8px">Print Center</h3>'+
      '<p>When devices fail or need to hand off, print person ID cards, blank intake forms, and situation reports. All print views are optimized for A4/Letter.</p>'+
      '</div>',
    foot:'<button class="btn primary" onclick="closeModal()">Got it</button>'
  });
}

/* ================================================================
   INITIALIZATION
   ================================================================ */
function initApp(){
  var loaded=loadState();
  if(!loaded||(!State.needs.length&&!State.offers.length&&!State.persons.length)){
    seedDemoData();
    saveState();
  }

  LANG=State.settings.locale||'en';
  document.documentElement.setAttribute('data-theme',State.settings.theme||'night');

  var search=$('globalSearch');
  if(search){
    search.onkeydown=function(e){
      if(e.key==='Enter'){
        var q=this.value.trim();
        if(!q)return;
        // Try to find across entities
        var found=null;
        State.needs.forEach(function(n){if(!found&&n.title.toLowerCase().indexOf(q.toLowerCase())>-1){found={route:'needs',view:'viewNeed',id:n.id}}});
        if(!found)State.persons.forEach(function(p){if(!found&&p.name.toLowerCase().indexOf(q.toLowerCase())>-1){found={route:'persons',view:'viewPerson',id:p.id}}});
        if(!found)State.incidents.forEach(function(i){if(!found&&i.title.toLowerCase().indexOf(q.toLowerCase())>-1){found={route:'incidents',view:'viewIncident',id:i.id}}});
        if(!found)State.resources.forEach(function(r){if(!found&&r.name.toLowerCase().indexOf(q.toLowerCase())>-1){found={route:'resources',view:'viewResource',id:r.id}}});
        if(found){
          navigate(found.route);
          setTimeout(function(){window[found.view](found.id)},100);
        }else{
          toast('No match found for "'+q+'"','warn');
        }
      }
    };
  }

  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    if(e.key==='Escape')closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){e.preventDefault();openNewNeed()}
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();var s=$('globalSearch');if(s)s.focus()}
    if(e.key==='?')openHelp();
    if(e.key==='g'){
      window._gk=true;setTimeout(function(){window._gk=false},1000);return;
    }
    if(window._gk){
      var map={'d':'dashboard','n':'needs','o':'offers','c':'checkins','p':'persons','i':'incidents','r':'resources','t':'tasks','m':'map','s':'settings'};
      if(map[e.key])navigate(map[e.key]);
    }
  });

  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});

  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='map')setTimeout(renderMapCanvas,20);
    else if(CurrentRoute==='dashboard')after_dashboard();
  });

  renderNav();
  renderPage();
  updateAlerts();
  setInterval(updateAlerts,30000);
  setInterval(saveState,20000);
  window.addEventListener('beforeunload',saveState);

  setTimeout(function(){toast('AidBridge ready — everything works offline','success')},400);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
</body>
</html>
