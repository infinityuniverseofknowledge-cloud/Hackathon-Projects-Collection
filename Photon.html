<!DOCTYPE html>
<html lang="pt-BR" data-theme="photon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PHOTON — Photonics & RF Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#030308;--panel:#0a0a14;--panel2:#101024;--panel3:#1a1a38;--panel4:#242450;
  --bd:#1c1c38;--bd2:#2e2e60;--tx:#e8e8ff;--tx2:#8890c0;--tx3:#4a4a80;
  --p1:#00e0ff;--p2:#40ff80;--p3:#ff3060;--p4:#ffb000;--p5:#c060ff;--p6:#ff80ff;
  --g1:linear-gradient(135deg,#00e0ff,#40ff80);
  --gHolo:linear-gradient(120deg,#00e0ff,#40ff80,#c060ff,#ff3060,#ffb000,#00e0ff);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#f5f8fc;--panel:#fff;--panel2:#f4f8fc;--panel3:#e4ecf8;--panel4:#d0dcec;--bd:#c0d0e4;--bd2:#88a8c8;--tx:#081828;--tx2:#285078;--tx3:#6090b8;--p1:#0080c0;--p2:#00a060;--g1:linear-gradient(135deg,#0080c0,#00a060)}
[data-theme="ir"]{--bg:#0a0404;--panel:#140a0a;--panel2:#1c1010;--panel3:#2a1818;--panel4:#382020;--bd:#2a1818;--bd2:#4a2828;--tx:#ffe0e0;--tx2:#c08080;--tx3:#805050;--p1:#ff4040;--p2:#ff8040;--g1:linear-gradient(135deg,#ff4040,#ff8040)}
[data-theme="uv"]{--bg:#05030a;--panel:#0a0614;--panel2:#100a1c;--panel3:#180a2a;--panel4:#201038;--bd:#201040;--bd2:#40206a;--tx:#e0d0ff;--tx2:#a080c0;--tx3:#7050a0;--p1:#a040ff;--p2:#ff40ff;--g1:linear-gradient(135deg,#a040ff,#ff40ff)}
[data-theme="ocean"]{--bg:#00060a;--panel:#02101a;--panel2:#041828;--panel3:#062438;--panel4:#0a3050;--bd:#062030;--bd2:#0a3860;--tx:#c0f0ff;--tx2:#70a8c8;--tx3:#407090;--p1:#40c0ff;--p2:#40ffd0;--g1:linear-gradient(135deg,#40c0ff,#40ffd0)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#030308}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes beam{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#010104;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,224,255,.012) 0,rgba(0,224,255,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(10,10,20,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p4)}.sb-val.c4{color:var(--p5)}.sb-val.c5{color:var(--p3)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(0,224,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#030308;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#030308;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p2)}.toast.warn{border-left-color:var(--p4)}.toast.error{border-left-color:var(--p3)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.code{font-family:var(--mono);font-size:.62rem;background:rgba(0,0,0,.4);padding:8px;border-radius:4px;border:1px solid var(--bd);line-height:1.5;white-space:pre;overflow-x:auto;color:var(--tx)}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('ray')">PHOTON</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">λ</span><span class="sb-val c2" id="sbWL">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">P</span><span class="sb-val c3" id="sbPwr">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">BW</span><span class="sb-val c4" id="sbBW">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">SNR</span><span class="sb-val c5" id="sbSNR">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Ray Optics</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function logInterp(v,a,b){a=Math.max(a,1e-30);b=Math.max(b,1e-30);return Math.exp(lerp(Math.log(a),Math.log(b),v))}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',function(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchmove',function(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchend',function(e){onUp();e.preventDefault()},{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}
var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ══════════════════════════════════════════════════════════
   CORE PHOTONICS / RF PHYSICS
   ══════════════════════════════════════════════════════════ */
var C=2.998e8;
var H_PL=6.626e-34;
var HBAR=1.055e-34;
var Q_E=1.602e-19;
var KB=1.381e-23;

function photonEnergy(lambda_m){return H_PL*C/lambda_m}
function photonFreq(lambda_m){return C/lambda_m}
function dbToLin(db){return Math.pow(10,db/10)}
function linToDb(x){return 10*Math.log10(x)}
function dbmToW(dbm){return Math.pow(10,dbm/10)*1e-3}
function wToDbm(w){return 10*Math.log10(w*1000)}

function fresnel(n1,n2,thetaI){
  var ti=thetaI*Math.PI/180;
  var st=n1*Math.sin(ti)/n2;
  if(Math.abs(st)>1)return {tir:true,R:1,T:0,Rs:1,Rp:1,thetaT:NaN,thetaBrew:0};
  var tt=Math.asin(st);
  var rs=(n1*Math.cos(ti)-n2*Math.cos(tt))/(n1*Math.cos(ti)+n2*Math.cos(tt));
  var rp=(n1*Math.cos(tt)-n2*Math.cos(ti))/(n1*Math.cos(tt)+n2*Math.cos(ti));
  var thetaBrew=Math.atan(n2/n1)*180/Math.PI;
  return {tir:false,Rs:rs*rs,Rp:rp*rp,R:(rs*rs+rp*rp)/2,thetaT:tt*180/Math.PI,thetaBrew:thetaBrew};
}
function snell(n1,n2,thetaI){
  var s=n1*Math.sin(thetaI*Math.PI/180)/n2;
  if(Math.abs(s)>1)return null;
  return Math.asin(s)*180/Math.PI;
}
function criticalAngle(n1,n2){
  if(n1<=n2)return null;
  return Math.asin(n2/n1)*180/Math.PI;
}
function abcdSpace(d){return [[1,d],[0,1]]}
function abcdLens(f){return [[1,0],[-1/f,1]]}
function abcdMirror(R){return [[1,0],[-2/R,1]]}
function abcdInterface(n1,n2){return [[1,0],[0,n1/n2]]}
function abcdMul(A,B){return [
  [A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],
  [A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]
]}
function gaussianBeam(z,w0,lambda){
  var zR=Math.PI*w0*w0/lambda;
  var wz=w0*Math.sqrt(1+(z/zR)*(z/zR));
  var Rz=z===0?Infinity:z*(1+(zR/z)*(zR/z));
  var gouy=Math.atan(z/zR);
  return {w:wz,R:Rz,zR:zR,gouy:gouy};
}
function slabModes(nCore,nClad,d,lambda,maxM){
  var k0=2*Math.PI/lambda;
  var V=k0*d/2*Math.sqrt(nCore*nCore-nClad*nClad);
  var modes=[];
  for(var m=0;m<Math.ceil(2*V/Math.PI)+1;m++){
    var g=function(b){
      var sb=Math.sqrt(Math.max(0,1-b*b));
      var lhs=V*sb;
      var rhs=(m*Math.PI/2)+Math.atan(b/Math.sqrt(Math.max(1e-12,1-b*b)));
      return lhs-rhs;
    };
    var blo=1e-4,bhi=0.9999;
    if(g(blo)*g(bhi)>0)continue;
    var bMid=0;
    for(var it=0;it<60;it++){
      bMid=(blo+bhi)/2;
      if(g(blo)*g(bMid)<=0)bhi=bMid;else blo=bMid;
    }
    var neff=Math.sqrt(nClad*nClad+bMid*bMid*(nCore*nCore-nClad*nClad));
    modes.push({m:m,b:bMid,neff:neff,beta:k0*neff});
    if(m>maxM)break;
  }
  return {V:V,modes:modes,numModes:modes.length};
}
function fiberDispersion(lambda,S0,lambda0,Dm){
  if(lambda0){
    return S0/4*(lambda-lambda0*lambda0*lambda0*lambda0/(lambda*lambda*lambda));
  }
  return Dm;
}
function ringResonator(R,nEff,lambda,lossDbcm,gapCoupling){
  var L=2*Math.PI*R;
  var a=Math.pow(10,-lossDbcm*L/(10*100));
  var k=Math.sqrt(gapCoupling);
  var t=Math.sqrt(1-gapCoupling);
  var beta=2*Math.PI*nEff/lambda;
  var phi=beta*L;
  var denom=1-2*a*t*Math.cos(phi)+a*a*t*t;
  var through=(a*a-2*a*t*Math.cos(phi)+t*t)/(denom+1e-12);
  var drop=(k*k*k*k)/(denom+1e-12);
  return {L:L,a:a,phi:phi,throughput:through,drop:drop,FSR:lambda*lambda/(nEff*L)};
}
function laserStep(N,S,I,Vact,tau,tauP,G0,N0,eps,beta,Gamma,dt){
  var G=G0*(N-N0)/(1+eps*S);
  var dN=I/(Q_E*Vact)-N/tau-G*S*Gamma;
  var dS=Gamma*G*S+beta*N/tau-S/tauP;
  return {N:Math.max(0,N+dN*dt),S:Math.max(0,S+dS*dt),G:G};
}
function photodiode(Popt,responsivity,Idark,Rload,B){
  var Iphoto=responsivity*Popt;
  var shot=2*Q_E*(Iphoto+Idark)*B;
  var thermal=4*KB*300*B/Rload;
  var total=shot+thermal;
  var snr=Iphoto*Iphoto/total;
  return {Iphoto:Iphoto,shot:shot,thermal:thermal,SNR:snr,SNRdb:10*Math.log10(snr)};
}
function mzmTransfer(V,Vpi,Vbias){
  var dphi=Math.PI*(V+Vbias)/Vpi;
  var P=Math.pow(Math.cos(dphi/2),2);
  return {P:P,phase:dphi};
}
function singleSlit(theta,a,lambda){
  var beta=Math.PI*a*Math.sin(theta)/lambda;
  if(Math.abs(beta)<1e-9)return 1;
  return Math.pow(Math.sin(beta)/beta,2);
}
function jonesIntensity(E){
  return Math.abs(E[0])*Math.abs(E[0])+Math.abs(E[1])*Math.abs(E[1]);
}
function arCoating(nSub,nFilm,nInc,lambda,d){
  var r1=(nInc-nFilm)/(nInc+nFilm);
  var r2=(nFilm-nSub)/(nFilm+nSub);
  var delta=2*Math.PI*nFilm*d/lambda;
  var r=r1+r2*Math.exp(-2*1j*delta);
  r=r/(1+r1*r2*Math.exp(-2*1j*delta));
  return {R:Math.abs(r)*Math.abs(r),r:r};
}
function txLine(Z0,beta_l,length,ZL,Zs){
  var betaL=beta_l*length;
  var t=Math.tan(betaL);
  var Zin=Z0*(ZL+1j*Z0*t)/(Z0+1j*ZL*t);
  var Gamma=(ZL-Z0)/(ZL+Z0);
  var VSWR=(1+Math.abs(Gamma))/(1-Math.abs(Gamma));
  return {Zin:Zin,Gamma:Gamma,VSWR:VSWR,betaL:betaL};
}
function gammaToZ(Gamma,Z0){
  return Z0*(1+Gamma)/(1-Gamma);
}
function zToGamma(Z,Z0){
  return (Z-Z0)/(Z+Z0);
}
function linkBudget(Ptx,length,attDbKm,connectorsDb,spliceDb,nSplices,marginDb){
  var fiberLoss=length*attDbKm;
  var totalLoss=fiberLoss+connectorsDb+nSplices*spliceDb+marginDb;
  var Prx=Ptx-totalLoss;
  return {Ptx:Ptx,fiberLoss:fiberLoss,connectorLoss:connectorsDb,spliceLoss:nSplices*spliceDb,margin:marginDb,totalLoss:totalLoss,Prx:Prx};
}
function matmul(A,B){
  return [
    [A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],
    [A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]
  ];
}

function drawGrid(ctx,x,y,w,h,rows,cols){
  ctx.strokeStyle='rgba(0,224,255,.08)';ctx.lineWidth=1;

}
function drawAxes(ctx,x,y,w,h,xLabel,yLabel){
  ctx.strokeStyle='rgba(0,224,255,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();
  ctx.fillStyle='#4a4a80';ctx.font='10px monospace';
  if(xLabel)ctx.fillText(xLabel,x+w/2-30,y+h+22);
  if(yLabel){ctx.save();ctx.translate(x-20,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(yLabel,0,0);ctx.restore()}
}
function wavelengthToRGB(lambda_nm){
  var r=0,g=0,b=0;
  if(lambda_nm<380)return '#000';
  if(lambda_nm<440){r=-(lambda_nm-440)/(440-380);b=1}
  else if(lambda_nm<490){g=(lambda_nm-440)/(490-440);b=1}
  else if(lambda_nm<510){g=1;b=-(lambda_nm-510)/(510-490)}
  else if(lambda_nm<580){r=(lambda_nm-510)/(580-510);g=1}
  else if(lambda_nm<645){r=1;g=-(lambda_nm-645)/(645-580)}
  else if(lambda_nm<780){r=1}
  else return '#800000';
  var f=1;
  if(lambda_nm>700)f=0.3+0.7*(780-lambda_nm)/(780-700);
  else if(lambda_nm<420)f=0.3+0.7*(lambda_nm-380)/(420-380);
  return 'rgb('+Math.floor(r*255*f)+','+Math.floor(g*255*f)+','+Math.floor(b*255*f)+')';
}

registerModule('abcd',{title:'ABCD / Ray Transfer',icon:'⊞',desc:'Matrix ray tracing through optical system.',init:function(){this.reset()},
reset:function(){var a=STATE.abcd;

  {type:'space',value:100,unit:'mm'},
  {type:'lens',value:50,unit:'mm'},
  {type:'space',value:50,unit:'mm'}
];
this.compute()},
compute:function(){var a=STATE.abcd;
a.M=[[1,0],[0,1]];
a.elements.forEach(function(e){
  if(e.type==='space')a.M=abcdMul(a.M,abcdSpace(e.value));
  else if(e.type==='lens')a.M=abcdMul(a.M,abcdLens(e.value));
  else if(e.type==='mirror')a.M=abcdMul(a.M,abcdMirror(e.value));
});
a.A=a.M[0][0];a.B=a.M[0][1];a.C=a.M[1][0];a.D=a.M[1][1];
a.det=a.A*a.D-a.B*a.C;
a.rays=[];
for(var y0=-3;y0<=3;y0+=1){
  a.rays.push({y0:y0,t0:0,color:'hsl('+(180+y0*30)+',80%,60%)',points:[]});
}
a.rays.forEach(function(ray){
  var y=ray.y0,t=ray.t0;
  var x=0;
  ray.points.push({x:x,y:y});
  a.elements.forEach(function(e){
    if(e.type==='space'){y=y+e.value*t;x+=e.value}
    else if(e.type==='lens'){t=t-y/e.value}
    ray.points.push({x:x,y:y});
  });
})},

registerModule('gaussian',{title:'Gaussian Beam',icon:'◉',desc:'w(z), R(z), Gouy phase, Rayleigh range.',init:function(){this.compute()},
compute:function(){var g=STATE.gaussian;
var w0=g.w0_um*1e-6;
var lam=g.lambda_nm*1e-9;
g.zR_m=Math.PI*w0*w0/lam;
g.zR_um=g.zR_m*1e6;
g.profile=[];
for(var z_um=-g.range_um;z_um<=g.range_um;z_um+=g.range_um/100){
  var z=z_um*1e-6;
  var b=gaussianBeam(z,w0,lam);
  g.profile.push({z_um:z_um,w_um:b.w*1e6,R_m:b.R,gouy:b.gouy});
}
g.current=gaussianBeam(g.z_um*1e-6,w0,lam);
g.divergence=lam/(Math.PI*w0)*1000;
},

registerModule('ring',{title:'Ring Resonator',icon:'○',desc:'Add-drop ring, FSR, Q factor.',init:function(){this.compute()},
compute:function(){var r=STATE.ring;
r.sweep=[];
var lambda0=r.lambda_nm;
for(var dl=-20;dl<=20;dl+=0.05){
  var lam=(lambda0+dl)*1e-9;
  var res=ringResonator(r.R_um*1e-6,r.nEff,lam,r.lossDbcm,r.gapK);
  r.sweep.push({lambda_nm:(lambda0+dl),through:res.throughput,drop:res.drop});
}
r.FSR_nm=lambda0*lambda0/(r.nEff*r.R_um*1e-6*2*Math.PI*1e9)*1e9;

var tau=2*Math.PI*r.R_um*1e-6*r.nEff/C;
r.Q=2*Math.PI*r.nEff/(lambda0*1e-9*(1-r.gapK)*alphaLoss+1e-9);
r.Q=Math.min(r.Q,1e7)},

registerModule('pin',{title:'PIN Photodiode',icon:'◐',desc:'Responsivity, bandwidth, SNR.',init:function(){this.compute()},
compute:function(){var p=STATE.pin;
p.Iphoto=p.resp*p.Popt_uW*1e-6;
p.pd=photodiode(p.Popt_uW*1e-6,p.resp,p.Idark_nA*1e-9,p.Rload_kOhm*1e3,p.B_GHz*1e9);
p.SNRdb=p.pd.SNRdb;
p.NEP=p.pd.shot/(p.resp*p.resp);
p.responsivityMax=Q_E*p.lambda_nm*1e-9/(H_PL*C);
p.spectrum=[];
for(var lam=800;lam<=1700;lam+=20){
  var R=0;
  if(lam<900)R=0;
  else if(lam<1550)R=p.resp*(1-Math.exp(-(lam-800)/300));
  else R=p.resp*(1-(lam-1550)/500);
  p.spectrum.push({lambda:lam,R:R});
}},

registerModule('mzm',{title:'MZM Modulator',icon:'⌇',desc:'Mach-Zehnder transfer + Vpi.',init:function(){this.compute()},
compute:function(){var m=STATE.mzm;
m.transfer=[];
for(var V=-2*m.Vpi;V<=2*m.Vpi;V+=m.Vpi/50){
  var res=mzmTransfer(V,m.Vpi,m.Vbias);
  m.transfer.push({V:V,P:res.P,phase:res.phase});
}

m.ext=m.current.P;
m.phase=m.current.phase},

});

badge('⌇ MZM · T='+fmt(m.ext*100,1)+'%');SV('sbPwr',fmt(m.ext*100,0)+'%')},

<script>
/* 14. IQ MODULATOR */
registerModule('iq',{title:'IQ Modulator',icon:'✦',desc:'QPSK/16QAM constellation.',init:function(){this.compute()},
compute:function(){var m=STATE.iq;
m.symbols=[];
if(m.format==='QPSK')m.symbols=[[1,1],[1,-1],[-1,1],[-1,-1]];
else if(m.format==='16QAM'){
  for(var i=0;i<4;i++)for(var j=0;j<4;j++)m.symbols.push([-3+2*i,-3+2*j]);
}else if(m.format==='64QAM'){
  for(var i=0;i<8;i++)for(var j=0;j<8;j++)m.symbols.push([-7+2*i,-7+2*j]);
}else if(m.format==='256QAM'){
  for(var i=0;i<16;i++)for(var j=0;j<16;j++)m.symbols.push([-15+2*i,-15+2*j]);
}
var maxA=0;
m.symbols.forEach(function(s){maxA=Math.max(maxA,Math.abs(s[0]),Math.abs(s[1]))});
m.symbols=m.symbols.map(function(s){return [s[0]/maxA,s[1]/maxA]});
m.received=m.symbols.map(function(s){
  var n1=(Math.random()*2-1)*m.noise;
  var n2=(Math.random()*2-1)*m.noise;
  return [s[0]+n1,s[1]+n2];
});
var sum=0;
m.symbols.forEach(function(s,i){
  sum+=Math.pow(s[0]-m.received[i][0],2)+Math.pow(s[1]-m.received[i][1],2);
});
m.evm=Math.sqrt(sum/m.symbols.length);
m.evm_db=20*Math.log10(m.evm);
m.BER=0.5*Math.exp(-1/(2*m.evm*m.evm));
m.SNR=1/(m.evm*m.evm);
m.SNR_db=10*Math.log10(m.SNR);
var bitsMap={QPSK:2,'16QAM':4,'64QAM':6,'256QAM':8};
m.bitsPerSymbol=bitsMap[m.format]||2;
m.spectralEfficiency=m.bitsPerSymbol},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010104';ctx.fillRect(0,0,W,H);
var m=STATE.iq;
ctx.fillStyle='#00e0ff';ctx.font='bold 14px monospace';
ctx.fillText('IQ MODULATOR — '+m.format+' · EVM='+fmt(m.evm_db,1)+'dB · SNR='+fmt(m.SNR_db,1)+'dB',30,30);
var cx=W/2,cy=H/2;
var r=Math.min(W,H)*0.35;
ctx.strokeStyle='rgba(0,224,255,.3)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(cx-r,cy);ctx.lineTo(cx+r,cy);ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy+r);ctx.stroke();
ctx.strokeStyle='rgba(0,224,255,.1)';
for(var rr=r/4;rr<=r;rr+=r/4){
  ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
}
m.symbols.forEach(function(s,i){
  var x=cx+s[0]*r;
  var y=cy-s[1]*r;
  ctx.fillStyle='#00e0ff';
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
});
m.received.forEach(function(s,i){
  var x=cx+s[0]*r;
  var y=cy-s[1]*r;
  ctx.fillStyle='rgba(255,176,0,.6)';
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
});
ctx.fillStyle='#8890c0';ctx.font='10px monospace';
ctx.fillText('I',cx+r+5,cy);
ctx.fillText('Q',cx,cy-r-5);
var ix=W-260,iy=60;
ctx.fillStyle='rgba(10,10,20,.9)';
ctx.fillRect(ix,iy,240,220);
ctx.strokeStyle='#00e0ff';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,220);
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('CONSTELLATION',ix+10,iy+22);
ctx.fillStyle='#8890c0';ctx.font='10px monospace';
ctx.fillText('Format:',ix+10,iy+48);
ctx.fillStyle='#00e0ff';
ctx.fillText(m.format,ix+160,iy+48);
ctx.fillStyle='#8890c0';
ctx.fillText('Symbols:',ix+10,iy+68);
ctx.fillStyle='#00e0ff';
ctx.fillText(m.symbols.length,ix+160,iy+68);
ctx.fillStyle='#8890c0';
ctx.fillText('Bits/symbol:',ix+10,iy+88);
ctx.fillStyle='#40ff80';
ctx.fillText(m.bitsPerSymbol,ix+160,iy+88);
ctx.fillStyle='#8890c0';
ctx.fillText('EVM:',ix+10,iy+108);
ctx.fillStyle=m.evm<0.1?'#40ff80':m.evm<0.2?'#ffb000':'#ff3060';
ctx.fillText(fmt(m.evm*100,2)+'%',ix+160,iy+108);
ctx.fillStyle='#8890c0';
ctx.fillText('EVM (dB):',ix+10,iy+128);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(m.evm_db,1)+' dB',ix+160,iy+128);
ctx.fillStyle='#8890c0';
ctx.fillText('SNR:',ix+10,iy+148);
ctx.fillStyle='#40ff80';
ctx.fillText(fmt(m.SNR_db,1)+' dB',ix+160,iy+148);
ctx.fillStyle='#8890c0';
ctx.fillText('BER:',ix+10,iy+168);
ctx.fillStyle=m.BER<1e-3?'#40ff80':'#ff3060';
ctx.fillText(m.BER.toExponential(2),ix+160,iy+168);
ctx.fillStyle='#8890c0';
ctx.fillText('Spec. eff:',ix+10,iy+188);
ctx.fillStyle='#c060ff';
ctx.fillText(m.spectralEfficiency+' b/s/Hz',ix+160,iy+188);
setStats('<div>'+m.format+'</div><div>EVM: '+fmt(m.evm_db,1)+'dB</div><div>SNR: '+fmt(m.SNR_db,1)+'dB</div>');
badge('✦ '+m.format+' · SNR='+fmt(m.SNR_db,1)+'dB');SV('sbSNR',fmt(m.SNR_db,0)+'dB')},
controls:function(){var m=STATE.iq;var h='<div class="sec"><h4>Format</h4><div class="chip-row">';
['QPSK','16QAM','64QAM','256QAM'].forEach(function(f){
  h+='<div class="chip '+(m.format===f?'active':'')+'" onclick="STATE.iq.format=\''+f+'\';MODULES.iq.compute();renderLeftPanel()">'+f+'</div>';
});
h+='</div></div>';
h+='<div class="sec"><h4>Channel</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Noise</span><span>'+fmt(m.noise,3)+'</span></div><input type="range" min="0" max="0.3" step="0.005" value="'+m.noise+'" oninput="STATE.iq.noise=parseFloat(this.value);MODULES.iq.compute()"></div>';
h+='</div>';
h+='<button class="btn primary full" onclick="MODULES.iq.compute();toast(\'Resampled\',\'success\')">🎲 Resample</button>';
return h},
mathPanel:function(){return '<div class="sec"><h4>IQ Modulation</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Sinal IQ:</b><br>E(t) = I(t)·cos(ωt) + Q(t)·sin(ωt)<br><br><b>Formatos:</b><br>QPSK: 2 bits/sym<br>16-QAM: 4 bits/sym<br>64-QAM: 6 bits/sym<br>256-QAM: 8 bits/sym<br><br><b>EVM:</b><br>EVM = √(Σ|error|²/Σ|ideal|²)<br>SNR = 1/EVM²<br><br><b>Shannon:</b><br>C = B·log2(1+SNR)</div></div>'}});

/* 15. MICHELSON */
registerModule('michelson',{title:'Michelson Interferometer',icon:'⊗',desc:'Fringes and OPD.',init:function(){this.compute()},
compute:function(){var m=STATE.michelson;
m.OPD=(m.d1_nm-m.d2_nm);
},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010104';ctx.fillRect(0,0,W,H);
var m=STATE.michelson;
ctx.fillStyle='#00e0ff';ctx.font='bold 14px monospace';
ctx.fillText('MICHELSON — OPD='+fmt(m.OPD,1)+'nm · λ='+m.lambda_nm+'nm',30,30);
var px=60,py=80,pw=W-120,ph=H-200;
var k=2*Math.PI/(m.lambda_nm*1e-9);
var dOPD=m.OPD*1e-9;
ctx.fillStyle='#010104';ctx.fillRect(px,py,pw,ph);
for(var xx=0;xx<pw;xx++){
  var intensity=m.I0/2*(1+m.contrast*Math.cos(k*(dOPD+(xx-pw/2)*0.01*1e-6)));
  var col=Math.floor(clamp(intensity/Math.max(m.I0,0.01),0,1)*255);
  ctx.fillStyle='rgb('+col+','+col+','+col+')';
  ctx.fillRect(px+xx,py,1,ph);
}
ctx.strokeStyle='#00e0ff';ctx.lineWidth=2;
ctx.strokeRect(px,py,pw,ph);
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('INTENSITY PROFILE',px,py+ph+20);
ctx.strokeStyle='#ffb000';ctx.lineWidth=1.5;
ctx.beginPath();
for(var xx2=0;xx2<pw;xx2++){
  var I2=m.I0/2*(1+m.contrast*Math.cos(k*(dOPD+(xx2-pw/2)*0.01*1e-6)));
  var y=py+ph+60+40-I2/Math.max(m.I0,0.01)*40;
  if(xx2===0)ctx.moveTo(px+xx2,y);else ctx.lineTo(px+xx2,y);
}
ctx.stroke();
var ix=W-260,iy=60;
ctx.fillStyle='rgba(10,10,20,.9)';
ctx.fillRect(ix,iy,240,180);
ctx.strokeStyle='#00e0ff';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,180);
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('INTERFEROMETER',ix+10,iy+22);
ctx.fillStyle='#8890c0';ctx.font='10px monospace';
ctx.fillText('λ:',ix+10,iy+48);
ctx.fillStyle='#00e0ff';
ctx.fillText(m.lambda_nm+' nm',ix+160,iy+48);
ctx.fillStyle='#8890c0';
ctx.fillText('Path 1:',ix+10,iy+68);
ctx.fillStyle='#40ff80';
ctx.fillText(m.d1_nm+' nm',ix+160,iy+68);
ctx.fillStyle='#8890c0';
ctx.fillText('Path 2:',ix+10,iy+88);
ctx.fillStyle='#40ff80';
ctx.fillText(m.d2_nm+' nm',ix+160,iy+88);
ctx.fillStyle='#8890c0';
ctx.fillText('OPD:',ix+10,iy+108);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(m.OPD,2)+' nm',ix+160,iy+108);
ctx.fillStyle='#8890c0';
ctx.fillText('Fringes:',ix+10,iy+128);
ctx.fillStyle='#c060ff';
ctx.fillText(fmt(Math.abs(m.OPD)/m.lambda_nm,3),ix+160,iy+128);
ctx.fillStyle='#8890c0';
ctx.fillText('Contrast:',ix+10,iy+148);
ctx.fillStyle='#40ff80';

registerModule('mzi',{title:'Mach-Zehnder',icon:'⊝',desc:'MZI transmission + tuning.',init:function(){this.compute()},
compute:function(){var m=STATE.mzi;
m.transmission=[];
for(var lam=m.lambda_nm-10;lam<=m.lambda_nm+10;lam+=0.05){
  var dL=m.dL_um*1e-6;
  var dphi=2*Math.PI*m.nEff*dL/(lam*1e-9)+Math.PI*m.V/m.Vpi;
  var T=Math.pow(Math.cos(dphi/2),2);
  m.transmission.push({lambda:lam,T:T});
}
m.FSR_nm=Math.pow(m.lambda_nm*1e-9,2)/(m.nEff*m.dL_um*1e-6)*1e9;
var dphi=2*Math.PI*m.nEff*m.dL_um*1e-6/(m.lambda_nm*1e-9)+Math.PI*m.V/m.Vpi;
m.currentT=Math.pow(Math.cos(dphi/2),2);
m.currentPhase=(dphi*180/Math.PI)%360;
m.ER=10*Math.log10(1/Math.max(1-m.currentT,1e-3))},

registerModule('grating',{title:'Diffraction Grating',icon:'≡',desc:'Orders, dispersion, resolution.',init:function(){this.compute()},
compute:function(){var g=STATE.grating;
g.orders=[];
for(var m=-3;m<=3;m++){
  var arg=g.lambda_nm*1e-9*m/(g.d_um*1e-6)-Math.sin(g.thetaI*Math.PI/180);
  if(Math.abs(arg)<=1){
    var theta=Math.asin(arg)*180/Math.PI;
    g.orders.push({m:m,theta:theta});
  }
}
g.resolution=Math.abs(g.m)*10000;
g.dispersion=g.m/(g.d_um*1e-6*Math.cos(Math.asin(Math.min(1,g.lambda_nm*1e-9/(g.d_um*1e-6)))))*1e-6;
},

registerModule('jones',{title:'Jones Polarization',icon:'⊕',desc:'Polarization states + waveplates.',init:function(){this.compute()},
compute:function(){var j=STATE.jones;
j.points=[];
var theta1=j.theta1*Math.PI/180;
var theta2=j.theta2*Math.PI/180;
j.E_in=[1,0];
var P1=[[Math.cos(theta1)**2,Math.cos(theta1)*Math.sin(theta1)],[Math.cos(theta1)*Math.sin(theta1),Math.sin(theta1)**2]];
var phi=j.phi*Math.PI/180;
var WP=[[1,0],[0,Math.exp(-1j*phi)]];
var P2=[[Math.cos(theta2)**2,Math.cos(theta2)*Math.sin(theta2)],[Math.cos(theta2)*Math.sin(theta2),Math.sin(theta2)**2]];
var E1=[P1[0][0]*j.E_in[0]+P1[0][1]*j.E_in[1],P1[1][0]*j.E_in[0]+P1[1][1]*j.E_in[1]];
var E2=[WP[0][0]*E1[0]+WP[0][1]*E1[1],WP[1][0]*E1[0]+WP[1][1]*E1[1]];
var E3=[P2[0][0]*E2[0]+P2[0][1]*E2[1],P2[1][0]*E2[0]+P2[1][1]*E2[1]];
j.E_out=E3;
j.I_in=jonesIntensity(j.E_in);
j.I_out=jonesIntensity(E3);
j.T=j.I_out/j.I_in;
for(var t=0;t<=2*Math.PI;t+=Math.PI/50){
  var phase_c=Math.cos(t);
  var Ex=E2[0].re*phase_c-E2[0].im*Math.sin(t);
  var Ey=E2[1].re*phase_c-E2[1].im*Math.sin(t);
  j.points.push({x:Ex,y:Ey});
}
var Ex0=E2[0],Ey0=E2[1];
j.stokes={
  S0:Math.abs(Ex0)**2+Math.abs(Ey0)**2,
  S1:Math.abs(Ex0)**2-Math.abs(Ey0)**2,
  S2:2*(Ex0.re*Ey0.re+Ex0.im*Ey0.im),
  S3:-2*(Ex0.re*Ey0.im-Ex0.im*Ey0.re)
};
j.DOP=Math.sqrt(j.stokes.S1**2+j.stokes.S2**2+j.stokes.S3**2)/(j.stokes.S0||1)},

registerModule('photonic',{title:'Photonic Crystal',icon:'⣿',desc:'1D Bragg mirror + bandgap.',init:function(){this.compute()},
compute:function(){var p=STATE.photonic;
p.spectrum=[];
for(var lam=1000;lam<=2000;lam+=2){
  var N=10;
  var n1=p.n1,n2=p.n2;
  var d1=lam/(4*n1);
  var d2=lam/(4*n2);
  var k0=2*Math.PI/lam;
  var M=[[1,0],[0,1]];
  for(var i=0;i<N;i++){
    var delta1=k0*n1*d1*1e-9*1e9;
    var delta2=k0*n2*d2*1e-9*1e9;
    var eta1=n1,eta2=n2,eta0=1;
    var M1=[[Math.cos(delta1),1j*Math.sin(delta1)/eta1],[1j*eta1*Math.sin(delta1),Math.cos(delta1)]];
    var M2=[[Math.cos(delta2),1j*Math.sin(delta2)/eta2],[1j*eta2*Math.sin(delta2),Math.cos(delta2)]];
    M=matmul(M,matmul(M1,M2));
  }
  var etaS=n2;
  var r=((M[0][0]+M[0][1]*etaS)*eta0-(M[1][0]+M[1][1]*etaS))/((M[0][0]+M[0][1]*etaS)*eta0+(M[1][0]+M[1][1]*etaS));
  p.spectrum.push({lambda:lam,R:Math.abs(r)**2});
}
p.bandgap=[];
for(var i=1;i<p.spectrum.length;i++){
  if(p.spectrum[i].R>0.9&&p.spectrum[i-1].R<=0.9)p.bandgap.push(p.spectrum[i].lambda);
  if(p.spectrum[i].R<=0.9&&p.spectrum[i-1].R>0.9)p.bandgap.push(p.spectrum[i].lambda);
}
p.bandwidth=p.bandgap.length>=2?(p.bandgap[1]-p.bandgap[0]||0):0},

registerModule('smith',{title:'Smith Chart',icon:'◍',desc:'Impedance mapping + matching.',init:function(){this.compute()},
compute:function(){var s=STATE.smith;
s.resCircles=[];
for(var R=0;R<=5;R+=0.5){
  s.resCircles.push({R:R,center:[R/(R+1),0],radius:1/(R+1)});
}
s.reactArcs=[];
for(var X=-5;X<=5;X+=0.5){
  if(Math.abs(X)<0.001)continue;
  s.reactArcs.push({X:X,center:[1,1/X],radius:1/Math.abs(X),sign:X>0?'up':'down'});
}
var ZL=s.ZL_complex[0]+1j*s.ZL_complex[1];
s.Gamma=zToGamma(ZL,s.Z0);
s.GammaMag=Math.abs(s.Gamma);
s.VSWR=(1+s.GammaMag)/(1-s.GammaMag);
s.RL=-20*Math.log10(s.GammaMag+1e-10);
},

registerModule('sparams',{title:'S-Parameters',icon:'⊟',desc:'Two-port network + filter response.',init:function(){this.compute()},

s.S21=[];

s.currentS21=dbToLin(s.S21_dB);
s.IL=-s.S21_dB;
s.RL=-s.S11_dB},

mathPanel:function(){return '<div class="sec"><h4>S-Parameters</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Definição:</b><br>[b1]   [S11 S12][a1]<br>[b2] = [S21 S22][a2]<br><br>S11: input reflection<br>S21: forward transmission<br><br><b>Conversões:</b><br>IL = -20·log|S21|<br>RL = -20·log|S11|<br>VSWR = (1+|S11|)/(1-|S11|)<br><br><b>Filtros:</b><br>Butterworth, Chebyshev, Bessel</div></div>'}});

/* 25. LINK BUDGET */
registerModule('link',{title:'Optical Link Budget',icon:'🔗',desc:'Power budget & reach.',init:function(){this.compute()},
compute:function(){var l=STATE.link;
var res=linkBudget(l.Ptx_dBm,l.length_km,l.attDbKm,l.connectorsDb,l.splices,l.spliceDb,l.marginDb);
l.Prx_dBm=res.Prx;
l.fiberLoss=res.fiberLoss;
l.totalLoss=res.totalLoss;
l.overBudget=l.Prx_dBm-l.sens_dBm;
l.marginAvailable=l.overBudget;
l.reach_km=(l.Ptx_dBm-l.sens_dBm-l.connectorsDb-l.splices*l.spliceDb-l.marginDb)/l.attDbKm;
l.distances=[];
l.power=[];
for(var d=0;d<=500;d+=10){
  var r=linkBudget(l.Ptx_dBm,d,l.attDbKm,l.connectorsDb,l.splices,d>0?l.spliceDb*d/100:0,l.marginDb);
  l.distances.push(d);
  l.power.push(r.Prx);
}
l.rx=res.Prx},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#010104';ctx.fillRect(0,0,W,H);
var l=STATE.link;
ctx.fillStyle='#00e0ff';ctx.font='bold 14px monospace';
ctx.fillText('LINK BUDGET — Ptx='+l.Ptx_dBm+'dBm · Prx='+fmt(l.Prx_dBm,1)+'dBm · Margin='+fmt(l.marginAvailable,1)+'dB',30,30);
var px=60,py=80,pw=W-120,ph=H*0.45;
drawAxes(ctx,px,py,pw,ph,'Distance (km)','Power (dBm)');
ctx.strokeStyle='#00e0ff';ctx.lineWidth=2.5;
ctx.beginPath();
l.distances.forEach(function(d,i){
  var x=px+d/500*pw;
  var y=py+ph-(l.power[i]+60)/60*ph;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
var sensY=py+ph-(l.sens_dBm+60)/60*ph;
ctx.strokeStyle='#ff3060';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(px,sensY);ctx.lineTo(px+pw,sensY);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ff3060';ctx.font='bold 10px monospace';
ctx.fillText('Sensitivity '+l.sens_dBm+' dBm',px+10,sensY-5);
var cx=px+l.length_km/500*pw;
var cy=py+ph-(l.Prx_dBm+60)/60*ph;
ctx.fillStyle='#40ff80';
ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fill();
var rX=px+Math.min(l.reach_km,500)/500*pw;
ctx.strokeStyle='#ffb000';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(rX,py);ctx.lineTo(rX,py+ph);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle='#ffb000';ctx.font='bold 10px monospace';
ctx.fillText('Reach '+fmt(l.reach_km,0)+'km',rX+5,py+15);
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('BUDGET BREAKDOWN',px,py+ph+25);
var items=[
  ['Ptx',l.Ptx_dBm,'#40ff80'],
  ['Fiber loss',-l.fiberLoss,'#ff3060'],
  ['Connectors',-l.connectorsDb,'#ffb000'],
  ['Splices',-l.splices*l.spliceDb,'#c060ff'],
  ['Margin',-l.marginDb,'#4a4a80']
];
items.forEach(function(item,i){
  var y=py+ph+50+i*18;
  ctx.fillStyle=item[2];ctx.font='10px monospace';
  ctx.fillText(item[0]+':',px,y);
  ctx.fillStyle=item[2];
  ctx.fillText((item[1]>0?'+':'')+fmt(item[1],2)+' dB',px+200,y);
});
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('Prx='+fmt(l.Prx_dBm,2)+' dBm',px,py+ph+50+items.length*18+15);
ctx.fillStyle='#ff3060';
ctx.fillText('Sens='+l.sens_dBm+' dBm',px+250,py+ph+50+items.length*18+15);
ctx.fillStyle=l.marginAvailable>0?'#40ff80':'#ff3060';
ctx.fillText('Margin='+fmt(l.marginAvailable,2)+' dB',px+450,py+ph+50+items.length*18+15);
var ix=W-260,iy=60;
ctx.fillStyle='rgba(10,10,20,.9)';
ctx.fillRect(ix,iy,240,240);
ctx.strokeStyle='#00e0ff';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,240);
ctx.fillStyle='#00e0ff';ctx.font='bold 11px monospace';
ctx.fillText('LINK INFO',ix+10,iy+22);
ctx.fillStyle='#8890c0';ctx.font='10px monospace';
ctx.fillText('Length:',ix+10,iy+48);
ctx.fillStyle='#00e0ff';
ctx.fillText(l.length_km+' km',ix+160,iy+48);
ctx.fillStyle='#8890c0';
ctx.fillText('Att fiber:',ix+10,iy+68);
ctx.fillStyle='#00e0ff';
ctx.fillText(l.attDbKm+' dB/km',ix+160,iy+68);
ctx.fillStyle='#8890c0';
ctx.fillText('Ptx:',ix+10,iy+88);
ctx.fillStyle='#40ff80';
ctx.fillText(l.Ptx_dBm+' dBm',ix+160,iy+88);
ctx.fillStyle='#8890c0';
ctx.fillText('Prx:',ix+10,iy+108);
ctx.fillStyle='#00e0ff';
ctx.fillText(fmt(l.Prx_dBm,2)+' dBm',ix+160,iy+108);
ctx.fillStyle='#8890c0';
ctx.fillText('Sens:',ix+10,iy+128);
ctx.fillStyle='#ff3060';
ctx.fillText(l.sens_dBm+' dBm',ix+160,iy+128);
ctx.fillStyle='#8890c0';
ctx.fillText('Margin:',ix+10,iy+148);
ctx.fillStyle=l.marginAvailable>0?'#40ff80':'#ff3060';
ctx.fillText(fmt(l.marginAvailable,2)+' dB',ix+160,iy+148);
ctx.fillStyle='#8890c0';
ctx.fillText('Reach:',ix+10,iy+168);
ctx.fillStyle='#ffb000';
ctx.fillText(fmt(l.reach_km,1)+' km',ix+160,iy+168);
ctx.fillStyle='#8890c0';
ctx.fillText('Status:',ix+10,iy+188);
ctx.fillStyle=l.marginAvailable>0?'#40ff80':'#ff3060';
ctx.fillText(l.marginAvailable>0?'OK':'FAIL',ix+160,iy+188);
ctx.fillStyle='#8890c0';
ctx.fillText('Type:',ix+10,iy+208);
ctx.fillStyle='#00e0ff';
ctx.fillText('DWDM 100G',ix+160,iy+208);
ctx.fillStyle='#8890c0';
ctx.fillText('Wavelengths:',ix+10,iy+228);
ctx.fillStyle='#c060ff';
ctx.fillText('80 (C-band)',ix+160,iy+228);
setStats('<div>Prx: '+fmt(l.Prx_dBm,1)+'dBm</div><div>Margin: '+fmt(l.marginAvailable,1)+'dB</div><div>Reach: '+fmt(l.reach_km,0)+'km</div>');
badge('🔗 Link · Margin='+fmt(l.marginAvailable,1)+'dB');SV('sbSNR',fmt(l.marginAvailable,0)+'dB')},
controls:function(){var l=STATE.link;var h='<div class="sec"><h4>Transmitter</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Ptx</span><span>'+l.Ptx_dBm+' dBm</span></div><input type="range" min="-10" max="10" step="0.5" value="'+l.Ptx_dBm+'" oninput="STATE.link.Ptx_dBm=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Sensitivity</span><span>'+l.sens_dBm+' dBm</span></div><input type="range" min="-40" max="-15" step="0.5" value="'+l.sens_dBm+'" oninput="STATE.link.sens_dBm=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='</div>';
h+='<div class="sec"><h4>Fiber link</h4>';
h+='<div class="ctrl"><div class="lbl"><span>Length</span><span>'+l.length_km+' km</span></div><input type="range" min="1" max="500" step="1" value="'+l.length_km+'" oninput="STATE.link.length_km=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Attenuation</span><span>'+l.attDbKm+' dB/km</span></div><input type="range" min="0.15" max="1" step="0.01" value="'+l.attDbKm+'" oninput="STATE.link.attDbKm=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Connectors</span><span>'+l.connectorsDb+' dB</span></div><input type="range" min="0" max="6" step="0.1" value="'+l.connectorsDb+'" oninput="STATE.link.connectorsDb=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Splices</span><span>'+l.splices+'</span></div><input type="range" min="0" max="50" step="1" value="'+l.splices+'" oninput="STATE.link.splices=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Margin</span><span>'+l.marginDb+' dB</span></div><input type="range" min="1" max="10" step="0.5" value="'+l.marginDb+'" oninput="STATE.link.marginDb=parseFloat(this.value);MODULES.link.compute()"></div>';
h+='</div>';
return h},
mathPanel:function(){return '<div class="sec"><h4>Optical Link Budget</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Equação:</b><br>Prx = Ptx − L_fiber − L_conn − L_splice − M<br><br><b>Perdas:</b><br>Fiber: 0.2 dB/km @ 1550nm<br>Connector: 0.5 dB each<br>Splice: 0.1 dB each<br>Margin: 3-6 dB<br><br><b>Reach:</b><br>L_max = (Ptx − Sens − Losses − M)/α<br><br><b>Sensibilidade:</b><br>10G PIN: −20 dBm<br>100G coherent: −28 dBm<br>400G: −32 dBm<br>Com EDFA: &lt; −40 dBm</div></div>'}});

<script>
function buildTabs(){var t=$('tbTabs');t.innerHTML='';
TABS.forEach(function(x){var i=el('div',{class:'tb-tab'+(x.key===STATE.currentTab?' active':''),'data-tab':x.key});
i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;
$$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===k)});
var m=MODULES[k];
SV('sbMode',(m&&m.title)||k);
try{if(m&&m.init)m.init()}catch(e){logMsg('init('+k+') error: '+e.message,'error')}
renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;
$$('.rp-tab').forEach(function(t){t.classList.remove('active')});
e.classList.add('active');
$$('.rp-pane').forEach(function(p){p.classList.remove('active')});
var p=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
if(p)p.classList.add('active');
renderRightPanel()}
function renderLeftPanel(){
  var b=$('lpBody');if(!b)return;
  var m=MODULES[STATE.currentTab];if(!m){b.innerHTML='';return}
  var h='';
  h+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--p1);font-size:.7rem">'+m.icon+' '+m.title+'</h4>';
  h+='<div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+esc(m.desc||'')+'</div></div>';
  try{if(m.controls)h+=m.controls()}
  catch(e){h+='<div class="sec"><div class="empty" style="color:var(--p1)">controls error: '+esc(e.message)+'</div></div>';logMsg('controls('+m.key+') error: '+e.message,'error')}
  b.innerHTML=h;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var s=$('rpState');
  if(s){
    var stats='<div class="sec"><h4>Live State</h4><div class="kv">';
    stats+='<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>';
    stats+='<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>';
    stats+='<div class="row"><span class="k">Tab</span><span class="v">'+STATE.currentTab+'</span></div>';
    stats+='</div></div>';
    s.innerHTML=stats;
  }
  var mp=$('rpMath');
  if(mp){try{if(m&&m.mathPanel)mp.innerHTML=m.mathPanel();else mp.innerHTML='<div class="empty">No math panel</div>'}catch(e){mp.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){var p=$('rpLogs');if(!p)return;
var h='<div class="sec"><h4>Log</h4>';
if(!LOG.length)h+='<div class="empty">No events</div>';
else LOG.slice().reverse().forEach(function(l){
  var c=l.type==='error'?'var(--p3)':l.type==='success'?'var(--p2)':'var(--p1)';
  h+='<div style="padding:3px 6px;border-left:2px solid '+c+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;color:'+c+'">'+esc(l.msg)+'</div>'
});
h+='</div>';p.innerHTML=h}
function togglePlay(){STATE.playing=!STATE.playing;$('btnPlay').textContent=STATE.playing?'⏸':'▶';$('tbDot').classList.toggle('on',STATE.playing);toast(STATE.playing?'Playing':'Paused','info',900)}
function stepOnce(){var m=MODULES[STATE.currentTab];if(m&&m.step)m.step();else toast('No step','info',900)}
function resetModule(){var m=MODULES[STATE.currentTab];if(m&&m.init){m.init();toast('Reset','success',900)}}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['photon','paper','ir','uv','ocean'];
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var i=THEMES.indexOf(c);var n=THEMES[(i+1)%THEMES.length];document.documentElement.setAttribute('data-theme',n);toast('Theme: '+n,'success')}
function showHelp(){
  var usd='US$';
  openModal('PHOTON — Photonics & RF Studio',
    '<div class="sec" style="border-left:3px solid #00e0ff;padding-left:12px;background:rgba(0,224,255,.1);padding:10px;border-radius:4px"><div style="font-size:.68rem;color:#00e0ff;font-weight:700;margin-bottom:6px">🔬 INDÚSTRIA DE '+usd+'1.2 TRILHÃO</div><div style="font-family:var(--mono);font-size:.6rem;line-height:1.7;color:var(--tx2)">Fotônica + RF: data centers, telecom 5G/6G, LiDAR, sensores, biotech, defesa. Cisco, Lumentum, Coherent, Broadcom, Nokia, Qualcomm RF, Infineon.</div></div>'
    +'<div class="sec"><h4>🔬 25 Módulos</h4><div style="font-size:.6rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)">'
    +'<b style="color:var(--p1)">ÓPTICA CLÁSSICA</b><br>Ray · Fresnel · ABCD · Gaussian · Lens<br><br>'
    +'<b style="color:var(--p1)">GUIA DE ONDA</b><br>Slab · Ring · Fiber<br><br>'
    +'<b style="color:var(--p1)">ATIVOS</b><br>Laser · Laser Diode · LED · Photodiode<br><br>'
    +'<b style="color:var(--p1)">MODULADORES</b><br>MZM · IQ Constellation<br><br>'
    +'<b style="color:var(--p1)">INTERFEROMETRIA</b><br>Michelson · MZI · Diffraction · Grating<br><br>'
    +'<b style="color:var(--p1)">POLARIZAÇÃO & FILMES</b><br>Jones · Thin Film · Photonic Crystal<br><br>'
    +'<b style="color:var(--p1)">RF/MICROWAVE</b><br>Tx Line · Smith · S-Params · Link Budget</div></div>'
    +'<div class="sec"><h4>🔬 Física Real</h4><div style="font-family:var(--mono);font-size:.62rem;line-height:1.9;color:var(--tx2)">'
    +'• Snell + Fresnel equations<br>'
    +'• ABCD matrix ray transfer<br>'
    +'• Gaussian beam (w, R, Gouy)<br>'
    +'• Thin lens imaging<br>'
    +'• Slab waveguide modes (V number)<br>'
    +'• Ring resonator (FSR, Q)<br>'
    +'• Fiber dispersion D(λ)<br>'
    +'• Laser rate equations (dN/dt, dS/dt)<br>'
    +'• LED ABC model + droop<br>'
    +'• PIN shot + thermal noise<br>'
    +'• MZM transfer cos²(πV/2Vπ)<br>'
    +'• IQ constellation (QPSK-256QAM)<br>'
    +'• Michelson OPD + fringes<br>'

    +'Cisco ('+usd+'200B) · Broadcom ('+usd+'800B) · Nokia ('+usd+'25B)<br>'
    +'Lumentum · Coherent · Infinera · Ciena<br>'
    +'Qualcomm ('+usd+'180B) RF · Skyworks · Qorvo<br>'
    +'ASML ('+usd+'350B) · Zeiss · Trumpf (lasers)<br>'
    +'IPG Photonics · II-VI · ams-OSRAM</div></div>',
    '<button class="btn primary" onclick="closeModal()">Entendido</button>',
    {size:'lg'})
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#010104';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#00e0ff';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}

});
console.log('%c PHOTON ','background:linear-gradient(90deg,#00e0ff,#40ff80,#c060ff,#ff3060,#ffb000);color:#030308;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
