<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DEVOPS — Infrastructure Workbench</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#02060a;color:#c0d8d0;font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
:root{
  --bg:#02060a;--bg2:#050c12;--panel:#08121c;--panel2:#0e1c2a;--panel3:#182c40;--panel4:#243d56;
  --bd:#0e1c2a;--bd2:#182c40;--bd3:#2e4d6a;
  --tx:#c0d8d0;--tx2:#7898a8;--tx3:#3d5a70;--tx4:#182c40;
  --gr:#00ff88;--gr2:#5cffb0;--gr3:#00a558;
  --am:#ffb000;--am2:#ffcc55;--am3:#cc8000;
  --cy:#00d4ff;--cy2:#5ce5ff;--cy3:#0891cc;
  --rd:#ff4444;--rd2:#ff8080;--rd3:#cc1a1a;
  --pu:#a855f7;--pu2:#c899ff;--pu3:#7c2ecc;
  --pk:#ff3d92;--pk2:#ff85c0;
  --bl:#3d80ff;--bl2:#80aaff;
  --mo:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --sa:'Inter',-apple-system,system-ui,sans-serif;
  --di:'Orbitron','Chakra Petch','Inter',sans-serif;
  --t:.15s cubic-bezier(.4,0,.2,1);
}
::selection{background:rgba(0,255,136,.35);color:#fff}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--bd3)}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 15% 15%,rgba(0,255,136,.08),transparent 40%),
  radial-gradient(circle at 85% 85%,rgba(0,212,255,.07),transparent 45%),
  radial-gradient(circle at 50% 50%,rgba(168,85,247,.04),transparent 60%),
  linear-gradient(rgba(0,255,136,.02) 1px,transparent 1px) 0 0/30px 30px,
  linear-gradient(90deg,rgba(0,255,136,.02) 1px,transparent 1px) 0 0/30px 30px,
  #02060a}

#shell{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}

.top{height:50px;background:linear-gradient(180deg,rgba(8,18,28,.96),rgba(2,6,10,.96));backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:12px;flex-shrink:0;position:relative;z-index:100}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),var(--cy),transparent);opacity:.7}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-name{font-family:var(--di);font-weight:900;font-size:1.3rem;letter-spacing:4px;color:var(--gr);text-shadow:0 0 22px rgba(0,255,136,.6)}
.brand-sub{font-family:var(--mo);font-size:9px;letter-spacing:2.4px;color:var(--tx3);text-transform:uppercase}
.div{width:1px;height:24px;background:var(--bd2)}
.chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:#000;border:1px solid var(--bd2);border-radius:3px}
.chip span{font-family:var(--mo);font-size:9px;letter-spacing:1.2px;color:var(--tx3);text-transform:uppercase}
.chip b{font-family:var(--mo);font-size:11px;color:var(--gr2);font-weight:600}
.chip b.cy{color:var(--cy2)}
.chip b.am{color:var(--am2)}
.chip b.pu{color:var(--pu2)}
.chip b.rd{color:var(--rd2)}
.chip b.on{color:var(--gr2)}
.chip b.off{color:var(--rd2)}
.stats{display:flex;gap:14px;margin-left:auto;font-family:var(--mo);font-size:10px;letter-spacing:.8px}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font-size:8px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px}
.stat .v{color:var(--gr2);font-weight:600}

.main{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}

.nav{width:250px;background:rgba(8,18,28,.94);backdrop-filter:blur(12px);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.nav-search{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-search input{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11px;color:var(--gr2);letter-spacing:.5px;transition:var(--t)}
.nav-search input:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,136,.12)}
.nav-search input::placeholder{color:var(--tx3)}
.nav-cat{padding:11px 0 3px}
.nav-cat-label{font-family:var(--mo);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);padding:0 13px 5px;font-weight:600}
.nav-item{padding:6px 13px;font-size:12px;color:var(--tx2);cursor:pointer;transition:var(--t);display:flex;align-items:center;gap:10px;position:relative}
.nav-item:hover{background:rgba(0,255,136,.06);color:var(--tx)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,255,136,.16),transparent);color:var(--gr2);border-left:2px solid var(--gr);padding-left:11px}
.nav-item .ico{font-size:13px;width:18px;text-align:center;opacity:.85;font-family:var(--mo)}

.stage{flex:1;position:relative;overflow:hidden;background:transparent;min-width:0;display:flex;flex-direction:column}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stageContent{position:absolute;inset:0;pointer-events:none;z-index:5}

.info{width:340px;background:rgba(8,18,28,.94);backdrop-filter:blur(12px);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.info-head{padding:13px 17px;border-bottom:1px solid var(--bd);position:relative;background:linear-gradient(180deg,rgba(0,255,136,.05),transparent)}
.info-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gr),transparent);opacity:.55}
.info-title{font-family:var(--di);font-size:1.15rem;font-weight:700;color:var(--tx);letter-spacing:.5px}
.info-sub{font-family:var(--mo);font-size:10px;color:var(--tx3);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.info-body{padding:14px 17px 24px;flex:1}

.prop{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-family:var(--mo);font-size:11px;gap:12px;align-items:baseline}
.prop:last-child{border-bottom:none}
.prop .k{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;flex-shrink:0}
.prop .v{color:var(--tx);text-align:right;font-weight:500;word-break:break-word}
.prop .v.gr{color:var(--gr2)}
.prop .v.cy{color:var(--cy2)}
.prop .v.am{color:var(--am2)}
.prop .v.pu{color:var(--pu2)}
.prop .v.rd{color:var(--rd2)}
.prop .v.pk{color:var(--pk2)}
.prop .v.bl{color:var(--bl2)}

.sec-head{font-family:var(--mo);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--tx3);margin:15px 0 9px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-head::before{content:'';flex:1;height:1px;background:var(--bd);order:-1}
.sec-head::after{content:'';flex:0 0 8px;height:1px;background:var(--gr)}
.sec-head:first-child{margin-top:0}

.btn{padding:7px 13px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);border-radius:3px;font-family:var(--mo);font-size:10.5px;font-weight:500;letter-spacing:.4px;cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel3);border-color:var(--gr);color:var(--gr2)}
.btn.primary{background:linear-gradient(135deg,var(--gr),var(--gr3));color:#02060a;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);box-shadow:0 4px 22px rgba(0,255,136,.4)}
.btn.cy{background:linear-gradient(135deg,var(--cy),var(--cy3));color:#02060a;border-color:transparent;font-weight:600}
.btn.am{background:linear-gradient(135deg,var(--am),var(--am3));color:#02060a;border-color:transparent;font-weight:600}
.btn.rd{background:rgba(255,68,68,.15);border-color:var(--rd);color:var(--rd2)}
.btn.pu{background:linear-gradient(135deg,var(--pu),var(--pu3));color:#fff;border-color:transparent;font-weight:600}
.btn.pk{background:linear-gradient(135deg,var(--pk),#cc0e6a);color:#fff;border-color:transparent;font-weight:600}
.btn.sm{padding:4px 8px;font-size:10px}
.btn.full{width:100%;justify-content:center}
.btn.active{background:linear-gradient(135deg,var(--gr),var(--gr3));color:#02060a;border-color:transparent}

.field{margin-bottom:11px}
.field label{display:block;font-family:var(--mo);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:#000;border:1px solid var(--bd);border-radius:3px;padding:7px 10px;font-family:var(--mo);font-size:11.5px;color:var(--gr2);letter-spacing:.3px;transition:var(--t)}
.field textarea{resize:vertical;min-height:70px;line-height:1.55;font-family:var(--mo);font-size:11px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gr);box-shadow:0 0 0 3px rgba(0,255,136,.1)}
.field select option{background:#08121c;color:var(--gr2)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 13px;background:rgba(8,18,28,.96);border:1px solid var(--bd2);border-left:3px solid var(--gr);font-family:var(--mo);font-size:10.5px;color:var(--tx);letter-spacing:.3px;max-width:340px;animation:tin .25s;backdrop-filter:blur(8px);pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.6);border-radius:3px}
.toast.cy{border-left-color:var(--cy)}
.toast.am{border-left-color:var(--am)}
.toast.rd{border-left-color:var(--rd)}
.toast.pu{border-left-color:var(--pu)}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

#boot{position:fixed;inset:0;background:#02060a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:9990;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.boot-canvas{width:220px;height:180px;position:relative;margin-bottom:8px}
.boot-canvas svg{width:100%;height:100%}
.boot-canvas svg *{opacity:0;animation:devIn .5s forwards}
.boot-canvas svg *:nth-child(1){animation-delay:.05s}
.boot-canvas svg *:nth-child(2){animation-delay:.1s}
.boot-canvas svg *:nth-child(3){animation-delay:.15s}
.boot-canvas svg *:nth-child(4){animation-delay:.2s}
.boot-canvas svg *:nth-child(5){animation-delay:.25s}
.boot-canvas svg *:nth-child(6){animation-delay:.3s}
.boot-canvas svg *:nth-child(7){animation-delay:.35s}
.boot-canvas svg *:nth-child(8){animation-delay:.4s}
.boot-canvas svg *:nth-child(9){animation-delay:.45s}
.boot-canvas svg *:nth-child(10){animation-delay:.5s}
.boot-canvas svg *:nth-child(11){animation-delay:.55s}
.boot-canvas svg *:nth-child(12){animation-delay:.6s}
.boot-canvas svg *:nth-child(13){animation-delay:.65s}
.boot-canvas svg *:nth-child(14){animation-delay:.7s}
.boot-canvas svg *:nth-child(15){animation-delay:.75s}
@keyframes devIn{to{opacity:1}}
.boot-mark{font-family:var(--di);font-size:2.6rem;font-weight:900;letter-spacing:8px;color:var(--gr);text-shadow:0 0 40px rgba(0,255,136,.7)}
.boot-sub{font-family:var(--mo);font-size:10px;letter-spacing:4px;color:var(--tx3);text-transform:uppercase}
.boot-bar{width:300px;height:2px;background:var(--panel3);overflow:hidden;border-radius:1px}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr),var(--cy));transition:width .3s;box-shadow:0 0 12px var(--gr)}

.hint{font-family:var(--mo);font-size:10.5px;color:var(--tx3);line-height:1.7;letter-spacing:.3px}
.hint b{color:var(--tx2)}
.kbd{display:inline-block;padding:1px 5px;background:var(--panel3);border:1px solid var(--bd2);border-radius:3px;font-family:var(--mo);font-size:9.5px;color:var(--gr2);font-weight:600;margin:0 2px}
.hidden{display:none!important}

@media(max-width:1000px){.nav{width:190px}.info{width:290px}}
@media(max-width:760px){.nav{width:56px}.nav-item span:not(.ico){display:none}.nav-cat-label{display:none}.info{width:240px}}
</style>
</head>
<body>

<div id="bg"></div>

<div id="boot">
  <div class="boot-canvas">
    <svg viewBox="0 0 220 180" fill="none" stroke="#00ff88" stroke-width="1.2">
      <rect x="15" y="15" width="55" height="40" rx="3"/>
      <rect x="15" y="70" width="55" height="40" rx="3"/>
      <rect x="15" y="125" width="55" height="40" rx="3"/>
      <rect x="85" y="45" width="55" height="40" rx="3" stroke="#00d4ff"/>
      <rect x="85" y="95" width="55" height="40" rx="3" stroke="#00d4ff"/>
      <rect x="155" y="70" width="55" height="40" rx="3" stroke="#ffb000"/>
      <line x1="70" y1="35" x2="85" y2="55"/>
      <line x1="70" y1="35" x2="85" y2="105"/>
      <line x1="70" y1="90" x2="85" y2="55"/>
      <line x1="70" y1="90" x2="85" y2="105"/>
      <line x1="70" y1="145" x2="85" y2="55"/>
      <line x1="70" y1="145" x2="85" y2="105"/>
      <line x1="140" y1="65" x2="155" y2="85"/>
      <line x1="140" y1="115" x2="155" y2="85"/>
      <circle cx="42" cy="35" r="3" fill="#00ff88" stroke="none"/>
      <circle cx="42" cy="90" r="3" fill="#00ff88" stroke="none"/>
      <circle cx="42" cy="145" r="3" fill="#00ff88" stroke="none"/>
      <circle cx="112" cy="65" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="112" cy="115" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="182" cy="90" r="4" fill="#ffb000" stroke="none"/>
      <text x="110" y="175" fill="#00ff88" font-size="9" text-anchor="middle" font-family="monospace" stroke="none">kubectl get pods -A</text>
    </svg>
  </div>
  <div class="boot-mark">DEVOPS</div>
  <div class="boot-sub">infrastructure workbench</div>
  <div class="boot-bar"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-sub" id="bootStatus" style="font-size:8px">initializing…</div>
</div>

<div id="shell">
  <header class="top">
    <div class="brand">
      <span class="brand-name">DEVOPS</span>
      <span class="brand-sub">infrastructure workbench</span>
    </div>
    <div class="div"></div>
    <div class="chip"><span>Nodes</span><b id="cNodes">3</b></div>
    <div class="chip"><span>Pods</span><b class="cy" id="cPods">0</b></div>
    <div class="chip"><span>RPS</span><b class="am" id="cRps">0</b></div>
    <div class="chip"><span>Module</span><b id="cModule">Dashboard</b></div>
    <div class="stats">
      <div class="stat"><span class="k">Status</span><span class="v" id="stStatus">idle</span></div>
      <div class="stat"><span class="k">Cluster</span><span class="v" id="stCluster">healthy</span></div>
    </div>
  </header>

  <div class="main">
    <aside class="nav" id="nav"></aside>
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div id="stageContent"></div>
    </section>
    <aside class="info">
      <div class="info-head">
        <div class="info-title" id="infoTitle">Dashboard</div>
        <div class="info-sub" id="infoSub">ready</div>
      </div>
      <div class="info-body" id="infoBody"></div>
    </aside>
  </div>
</div>

<div id="toasts"></div>
<script>
"use strict";
var $=function(i){return document.getElementById(i)};
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c!=null){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rnd(a,b+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function expo(n,d){if(n===0)return '0';if(!isFinite(n)||isNaN(n))return '—';d=d==null?2:d;var e=Math.floor(Math.log10(Math.abs(n)));return fmt(n/Math.pow(10,e),d)+'e'+e}
function commas(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function bytes(b){
  if(b===0)return '0 B';
  var k=1024,sizes=['B','KB','MB','GB','TB','PB'];
  var i=Math.floor(Math.log(b)/Math.log(k));
  return fmt(b/Math.pow(k,i),2)+' '+sizes[i];
}
function toast(msg,kind,dur){dur=dur||2400;var t=el('div',{class:'toast '+(kind||''),text:msg});$('toasts').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove()},320)},dur)}
function gauss(){
  var u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return a.length?s/a.length:0}
function variance(a){var m=mean(a),s=0;for(var i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return a.length?s/a.length:0}
function stdev(a){return Math.sqrt(variance(a))}
function percentile(a,p){
  var s=a.slice().sort(function(x,y){return x-y});
  var idx=(p/100)*(s.length-1);
  var lo=Math.floor(idx),hi=Math.ceil(idx);
  if(lo===hi)return s[lo];
  return lerp(s[lo],s[hi],idx-lo);
}

/* ══════════ MurmurHash3 (for hash ring) ══════════ */
function murmur3(key,seed){
  seed=seed||0;
  var h=seed>>>0;
  for(var i=0;i<key.length;i++){
    var k=key.charCodeAt(i);
    k=Math.imul(k,0xcc9e2d51);
    k=(k<<15)|(k>>>17);
    k=Math.imul(k,0x1b873593);
    h^=k;
    h=(h<<13)|(h>>>19);
    h=(Math.imul(h,5)+0xe6546b64)>>>0;
  }
  h^=key.length;
  h^=h>>>16;
  h=Math.imul(h,0x85ebca6b);
  h^=h>>>13;
  h=Math.imul(h,0xc2b2ae35);
  h^=h>>>16;
  return h>>>0;
}

/* ══════════ CRC32 ══════════ */
var CRC32_TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;
    t[n]=c;
  }
  return t;
})();
function crc32(str){
  var c=0xFFFFFFFF;
  for(var i=0;i<str.length;i++)c=CRC32_TABLE[(c^str.charCodeAt(i))&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}

/* ══════════ SHA256 (mini) ══════════ */
function sha256like(str){
  /* Simple deterministic hash for viz */
  var h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a];
  for(var i=0;i<str.length;i++){
    h[0]=(h[0]*31+str.charCodeAt(i))>>>0;
    h[1]=(h[1]^str.charCodeAt(i)*2654435761)>>>0;
    h[2]=(h[2]+str.charCodeAt(i)*1103515245)>>>0;
    h[3]=(h[3]*1664525+1013904223)>>>0;
  }
  var hex='';
  for(var j=0;j<4;j++)hex+=h[j].toString(16).padStart(8,'0');
  return hex;
}

/* ══════════ Semver ══════════ */
function parseSemver(s){
  var m=s.match(/^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/);
  if(!m)return null;
  return {major:parseInt(m[1]),minor:parseInt(m[2]),patch:parseInt(m[3]),prerelease:m[4]||null,build:m[5]||null};
}
function compareSemver(a,b){
  var A=parseSemver(a),B=parseSemver(b);
  if(!A||!B)return 0;
  if(A.major!==B.major)return A.major-B.major;
  if(A.minor!==B.minor)return A.minor-B.minor;
  if(A.patch!==B.patch)return A.patch-B.patch;
  if(A.prerelease&&!B.prerelease)return -1;
  if(!A.prerelease&&B.prerelease)return 1;
  return 0;
}

/* ══════════ Cron parser ══════════ */
function parseCron(expr){
  var parts=expr.trim().split(/\s+/);
  if(parts.length!==5)return null;
  var ranges=[
    {min:0,max:59},{min:0,max:23},{min:1,max:31},{min:1,max:12},{min:0,max:6}
  ];
  var out={minute:parseField(parts[0],0,59),hour:parseField(parts[1],0,23),dom:parseField(parts[2],1,31),month:parseField(parts[3],1,12),dow:parseField(parts[4],0,6)};
  return out;
}
function parseField(field,min,max){
  if(field==='*'){var a=[];for(var i=min;i<=max;i++)a.push(i);return a}
  if(field.indexOf('/')>=0){
    var parts=field.split('/');
    var step=parseInt(parts[1]);
    var base=parts[0]==='*'?min:parseInt(parts[0]);
    var r=[];for(var i=base;i<=max;i+=step)r.push(i);
    return r;
  }
  if(field.indexOf(',')>=0){
    var r=[];
    field.split(',').forEach(function(p){
      if(p.indexOf('-')>=0){
        var ab=p.split('-');
        for(var i=parseInt(ab[0]);i<=parseInt(ab[1]);i++)r.push(i);
      } else r.push(parseInt(p));
    });
    return r;
  }
  if(field.indexOf('-')>=0){
    var ab=field.split('-');
    var r=[];
    for(var i=parseInt(ab[0]);i<=parseInt(ab[1]);i++)r.push(i);
    return r;
  }
  return [parseInt(field)];
}
function nextCronRuns(expr,count){
  var c=parseCron(expr);
  if(!c)return [];
  var runs=[];
  var d=new Date();
  d.setSeconds(0);
  d.setMilliseconds(0);
  for(var i=0;i<10000&&runs.length<count;i++){
    d.setMinutes(d.getMinutes()+1);
    var m=d.getMinutes(),h=d.getHours(),dom=d.getDate(),mo=d.getMonth()+1,dow=d.getDay();
    if(c.minute.indexOf(m)>=0&&c.hour.indexOf(h)>=0&&c.dom.indexOf(dom)>=0&&c.month.indexOf(mo)>=0&&c.dow.indexOf(dow)>=0){
      runs.push(new Date(d));
    }
  }
  return runs;
}

/* ══════════ CIDR calculator ══════════ */
function parseCIDR(cidr){
  var m=cidr.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/);
  if(!m)return null;
  var ip=(parseInt(m[1])<<24)|(parseInt(m[2])<<16)|(parseInt(m[3])<<8)|parseInt(m[4]);
  var prefix=parseInt(m[5]);
  var mask=prefix===0?0:((0xFFFFFFFF<<(32-prefix))>>>0);
  var network=(ip&mask)>>>0;
  var broadcast=(network|~mask)>>>0;
  var hosts=prefix>=31?0:Math.pow(2,32-prefix)-2;
  return {ip:ip>>>0,prefix:prefix,mask:mask>>>0,network:network,broadcast:broadcast,hosts:hosts};
}
function ipStr(n){
  return ((n>>>24)&0xFF)+'.'+((n>>>16)&0xFF)+'.'+((n>>>8)&0xFF)+'.'+(n&0xFF);
}
function cidrContains(cidr,ipStr2){
  var c=parseCIDR(cidr);
  if(!c)return false;
  var m=ipStr2.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if(!m)return false;
  var ip=(parseInt(m[1])<<24)|(parseInt(m[2])<<16)|(parseInt(m[3])<<8)|parseInt(m[4]);
  return (ip&c.mask)===(c.network&c.mask);
}

/* ══════════ Exponential backoff with jitter ══════════ */
function expBackoff(attempt,base,max,jitter){
  base=base||100;max=max||30000;jitter=jitter==null?true:jitter;
  var exp=Math.min(max,base*Math.pow(2,attempt));
  if(jitter)return rnd(0,exp);
  return exp;
}

/* ══════════ Token bucket rate limiter ══════════ */
function TokenBucket(rate,capacity){
  this.rate=rate;
  this.capacity=capacity;
  this.tokens=capacity;
  this.lastRefill=Date.now();
}
TokenBucket.prototype.refill=function(){
  var now=Date.now();
  var elapsed=(now-this.lastRefill)/1000;
  this.tokens=Math.min(this.capacity,this.tokens+elapsed*this.rate);
  this.lastRefill=now;
};
TokenBucket.prototype.tryConsume=function(n){
  n=n||1;
  this.refill();
  if(this.tokens>=n){
    this.tokens-=n;
    return true;
  }
  return false;
};

/* ══════════ Leaky bucket rate limiter ══════════ */
function LeakyBucket(rate,capacity){
  this.rate=rate;
  this.capacity=capacity;
  this.level=0;
  this.last=Date.now();
}
LeakyBucket.prototype.tryAdd=function(n){
  var now=Date.now();
  var drain=(now-this.last)/1000*this.rate;
  this.level=Math.max(0,this.level-drain);
  this.last=now;
  if(this.level+n<=this.capacity){this.level+=n;return true}
  return false;
};

/* ══════════ Circuit breaker ══════════ */
function CircuitBreaker(threshold,timeout){
  this.state='CLOSED';
  this.failures=0;
  this.threshold=threshold||5;
  this.timeout=timeout||10000;
  this.openedAt=0;
  this.successes=0;
  this.halfOpenMax=3;
}
CircuitBreaker.prototype.recordSuccess=function(){
  if(this.state==='HALF_OPEN'){
    this.successes++;
    if(this.successes>=this.halfOpenMax){
      this.state='CLOSED';
      this.failures=0;
      this.successes=0;
    }
  } else {
    this.failures=0;
  }
};
CircuitBreaker.prototype.recordFailure=function(){
  this.failures++;
  if(this.state==='HALF_OPEN'){
    this.state='OPEN';
    this.openedAt=Date.now();
    this.successes=0;
    return;
  }
  if(this.failures>=this.threshold){
    this.state='OPEN';
    this.openedAt=Date.now();
  }
};
CircuitBreaker.prototype.allow=function(){
  if(this.state==='CLOSED')return true;
  if(this.state==='OPEN'){
    if(Date.now()-this.openedAt>this.timeout){
      this.state='HALF_OPEN';
      this.successes=0;
      return true;
    }
    return false;
  }
  return true;
};

/* ══════════ Consistent hash ring ══════════ */
function HashRing(nodes,replicas){
  replicas=replicas||150;
  this.nodes=nodes.slice();
  this.replicas=replicas;
  this.ring=[];
  for(var i=0;i<nodes.length;i++){
    for(var r=0;r<replicas;r++){
      var h=murmur3(nodes[i]+'#'+r,0);
      this.ring.push({hash:h,node:nodes[i]});
    }
  }
  this.ring.sort(function(a,b){return a.hash-b.hash});
}
HashRing.prototype.locate=function(key){
  var h=murmur3(key,0);
  var lo=0,hi=this.ring.length-1;
  if(h<=this.ring[0].hash)return this.ring[0].node;
  while(lo<hi){
    var mid=Math.floor((lo+hi)/2);
    if(this.ring[mid].hash<h)lo=mid+1;else hi=mid;
  }
  return this.ring[lo].node;
};

/* ══════════ Load balancer algorithms ══════════ */
function makeLoadBalancer(algorithm){
  var state={rr:0,conns:{},hash:null};
  return {
    algorithm:algorithm,
    pick:function(servers,key){
      if(servers.length===0)return null;
      switch(algorithm){
        case 'roundRobin':
          var s=servers[state.rr%servers.length];
          state.rr++;
          return s;
        case 'leastConn':
          var best=servers[0];
          for(var i=1;i<servers.length;i++){
            if((state.conns[servers[i].name]||0)<(state.conns[best.name]||0))best=servers[i];
          }
          return best;
        case 'random': return servers[ri(0,servers.length-1)];
        case 'ipHash':
          if(!state.hash)state.hash=new HashRing(servers.map(function(s){return s.name}),50);
          return servers.find(function(s){return s.name===state.hash.locate(key||'default')});
        case 'weightedRR':{
          var totalW=0;
          for(var i=0;i<servers.length;i++)totalW+=(servers[i].weight||1);
          var r=Math.random()*totalW;
          for(var i=0;i<servers.length;i++){
            r-=(servers[i].weight||1);
            if(r<=0)return servers[i];
          }
          return servers[servers.length-1];
        }
      }
      return servers[0];
    }
  };
}

/* ══════════ K8s rolling update ══════════ */
function rollingUpdate(desired,maxSurge,maxUnavailable){
  /* Returns array of {step, ready, updated, available} */
  var timeline=[];
  var ready=desired,updated=0,available=desired;
  var maxTotal=desired+maxSurge;
  var minAvailable=desired-maxUnavailable;
  timeline.push({step:0,ready:ready,updated:updated,total:ready+updated-available});
  /* Simple simulation */
  var step=0;
  while(updated<desired&&step<100){
    step++;
    /* Scale up new */
    var canAdd=Math.min(maxSurge,desired-updated);
    if(ready+canAdd>maxTotal)canAdd=maxTotal-ready;
    updated+=canAdd;
    ready+=canAdd;
    /* Scale down old */
    var canRemove=Math.min(maxUnavailable,available-minAvailable+maxUnavailable);
    if(available-canRemove>=minAvailable){
      available-=canRemove;
    }
    timeline.push({step:step,ready:ready,updated:updated,available:available});
  }
  return timeline;
}

/* ══════════ GitHub Actions workflow parser (mini) ══════════ */
function parseWorkflow(yaml){
  /* Very mini YAML-ish parser for workflow visualization */
  var lines=yaml.split('\n');
  var tree={name:'workflow',children:[]};
  var stack=[tree];
  var indentStack=[-1];
  lines.forEach(function(line){
    if(!line.trim()||line.trim().startsWith('#'))return;
    var indent=line.search(/\S/);
    var content=line.trim();
    while(indentStack[indentStack.length-1]>=indent){
      stack.pop();
      indentStack.pop();
    }
    var node={name:content,children:[],indent:indent};
    stack[stack.length-1].children.push(node);
    stack.push(node);
    indentStack.push(indent);
  });
  return tree;
}

/* ══════════ Prometheus metric parser ══════════ */
function parsePrometheus(text){
  var metrics={};
  text.split('\n').forEach(function(line){
    if(!line||line.startsWith('#'))return;
    var m=line.match(/^([a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{([^}]*)\})?\s+([\d.eE+-]+)(?:\s+(\d+))?/);
    if(m){
      var name=m[1],labels=m[2]||'',value=parseFloat(m[3]);
      if(!metrics[name])metrics[name]=[];
      var labelObj={};
      if(labels){
        labels.split(',').forEach(function(l){
          var kv=l.split('=');
          if(kv.length===2)labelObj[kv[0].trim()]=kv[1].trim().replace(/"/g,'');
        });
      }
      metrics[name].push({labels:labelObj,value:value});
    }
  });
  return metrics;
}

/* ══════════ PromQL mini evaluator ══════════ */
function promRate(series,window){
  /* Simple rate: (last - first) / window_seconds */
  if(series.length<2)return 0;
  return (series[series.length-1]-series[0])/window;
}
function promIncrease(series){
  if(series.length<2)return 0;
  return series[series.length-1]-series[0];
}
function promAvg(series){
  if(!series.length)return 0;
  var s=0;
  for(var i=0;i<series.length;i++)s+=series[i];
  return s/series.length;
}

/* ══════════ Docker image layer diff ══════════ */
function diffLayers(layers){
  /* layers: array of {files:{path:size}} */
  var result=[];
  for(var i=0;i<layers.length;i++){
    var added={},removed={};
    var prev=layers[i-1]?layers[i-1].files:{};
    var curr=layers[i].files;
    for(var p in curr){
      if(!(p in prev))added[p]=curr[p];
    }
    for(var p2 in prev){
      if(!(p2 in curr))removed[p2]=prev[p2];
    }
    result.push({index:i,added:added,removed:removed});
  }
  return result;
}

/* ══════════ Kubernetes scheduler (score nodes) ══════════ */
function schedulePod(pod,nodes){
  /* Filter nodes that don't fit */
  var feasible=nodes.filter(function(n){
    return n.cpuFree>=pod.cpuRequest&&n.memFree>=pod.memRequest&&!n.taints;
  });
  /* Score: LeastAllocated, BalancedAllocation, NodeAffinity */
  var scored=feasible.map(function(n){
    var cpuScore=100*(1-n.cpuUsed/n.cpuTotal);
    var memScore=100*(1-n.memUsed/n.memTotal);
    var balanced=100-Math.abs(n.cpuUsed/n.cpuTotal-n.memUsed/n.memTotal)*100;
    return {
      node:n,
      cpuScore:cpuScore,
      memScore:memScore,
      balanced:balanced,
      score:cpuScore*0.4+memScore*0.3+balanced*0.3
    };
  });
  scored.sort(function(a,b){return b.score-a.score});
  return scored;
}

/* ══════════ Span tree for tracing ══════════ */
function buildSpanTree(spans){
  var byId={};
  spans.forEach(function(s){byId[s.id]=s;s.children=[]});
  var roots=[];
  spans.forEach(function(s){
    if(s.parent&&byId[s.parent])byId[s.parent].children.push(s);
    else roots.push(s);
  });
  return roots;
}
function computeSpanDuration(span){
  var d=span.duration||0;
  span.children.forEach(function(c){d=Math.max(d,computeSpanDuration(c)+c.start)});
  return d;
}

/* ══════════ DNS resolver simulation ══════════ */
var DNS_ZONE={
  'api.example.com':{type:'A',value:'10.0.1.5',ttl:300},
  'app.example.com':{type:'A',value:'10.0.1.10',ttl:300},
  'www.example.com':{type:'CNAME',value:'app.example.com',ttl:300},
  'example.com':{type:'A',value:'10.0.0.1',ttl:3600},
  'mail.example.com':{type:'MX',value:'10 mail.example.com',ttl:3600}
};
function resolveDNS(name){
  var chain=[];
  var current=name;
  var hops=0;
  while(chain.length<10){
    var rec=DNS_ZONE[current];
    chain.push({name:current,record:rec});
    if(!rec)return {found:false,chain:chain};
    if(rec.type==='CNAME'){current=rec.value;hops++;continue}
    return {found:true,chain:chain,final:rec};
  }
  return {found:false,chain:chain};
}

function fuzzyMatch(query,text){
  query=query.toLowerCase();
  text=text.toLowerCase();
  var qi=0,ti=0;
  while(qi<query.length&&ti<text.length){
    if(query[qi]===text[ti])qi++;
    ti++;
  }
  return qi===query.length;
}

/* ═══════════════════════════════════════════════════

/* ══════════ Weighted round-robin (smooth) ══════════ */
function smoothWRR(servers){
  /* Nginx-style smooth weighted RR */
  var state={};
  servers.forEach(function(s){
    state[s.name]={weight:s.weight||1,current:0};
  });
  return function(){
    var total=0,best=null;
    var keys=Object.keys(state);
    keys.forEach(function(k){total+=state[k].weight});
    keys.forEach(function(k){
      state[k].current+=state[k].weight;
      if(!best||state[k].current>state[best].current)best=k;
    });
    state[best].current-=total;
    return best;
  };
}

/* ══════════ IPVS schedulers ══════════ */
function ipvsSchedule(servers,virtualIP,algorithm){
  switch(algorithm){
    case 'rr':
      var i=0;
      return function(){return servers[(i++)%servers.length]};
    case 'wrr':
      return smoothWRR(servers);
    case 'lc':{
      var conns={};
      servers.forEach(function(s){conns[s.name]=0});
      return function(){
        var best=servers[0];
        servers.forEach(function(s){if(conns[s.name]<conns[best.name])best=s});
        conns[best.name]++;
        return best;
      };
    }
    case 'sh':{
      var ring=new HashRing(servers.map(function(s){return s.name}),100);
      return function(ip){return servers.find(function(s){return s.name===ring.locate(ip)})};
    }
  }
  return function(){return servers[0]};
}

/* ══════════ Rate limiting algorithms ══════════ */
function fixedWindowLimiter(limit,windowMs){
  var state={count:0,windowStart:Date.now()};
  return function(){
    var now=Date.now();
    if(now-state.windowStart>windowMs){
      state.count=0;
      state.windowStart=now;
    }
    if(state.count<limit){state.count++;return true}
    return false;
  };
}
function slidingWindowLog(limit,windowMs){
  var log=[];
  return function(){
    var now=Date.now();
    while(log.length&&log[0]<now-windowMs)log.shift();
    if(log.length<limit){log.push(now);return true}
    return false;
  };
}
function slidingWindowCounter(limit,windowMs){
  var state={prevCount:0,currCount:0,prevStart:Date.now(),currStart:Date.now()};
  return function(){
    var now=Date.now();
    if(now-state.currStart>windowMs){
      state.prevCount=state.currCount;
      state.prevStart=state.currStart;
      state.currCount=0;
      state.currStart=now;
    }
    var elapsed=now-state.currStart;
    var prevWeight=1-elapsed/windowMs;
    var approx=state.prevCount*prevWeight+state.currCount;
    if(approx<limit){state.currCount++;return true}
    return false;
  };
}

/* ══════════ Kubernetes HPA scaling ══════════ */
function hpaCompute(currentReplicas,currentMetric,targetMetric,min,max,tolerance){
  tolerance=tolerance||0.1;
  var desired=Math.ceil(currentReplicas*currentMetric/targetMetric);
  /* Tolerance band */
  var ratio=currentMetric/targetMetric;
  if(ratio>1-tolerance&&ratio<1+tolerance)desired=currentReplicas;
  if(ratio>2)desired=currentReplicas*2;
  if(ratio<0.5)desired=Math.ceil(currentReplicas*0.5);
  return clamp(desired,min,max);
}

/* ══════════ Kubernetes liveness/readiness ══════════ */
function probeState(config){
  /* config: {initialDelay, period, timeout, failureThreshold, successThreshold, healthy} */
  var state={failures:0,successes:0,status:'pending',elapsed:0};
  var t=0;
  while(t<config.initialDelay+config.period*20&&state.status!=='ready'&&state.status!=='failed'){
    t+=config.period;
    if(t<config.initialDelay)continue;
    var ok=config.healthy();
    if(ok){
      state.successes++;
      state.failures=0;
      if(state.successes>=config.successThreshold)state.status='ready';
    } else {
      state.failures++;
      state.successes=0;
      if(state.failures>=config.failureThreshold)state.status='failed';
    }
  }
  return state;
}

/* ══════════ Retry patterns ══════════ */
function retryPolicy(attempt,errorType){
  if(errorType==='client')return {retry:false,delay:0};
  if(errorType==='server')return {retry:attempt<5,delay:expBackoff(attempt,100,30000,true)};
  if(errorType==='timeout')return {retry:attempt<3,delay:expBackoff(attempt,500,10000,false)};
  if(errorType==='ratelimit')return {retry:attempt<10,delay:rnd(1000,2000)};
  return {retry:attempt<3,delay:expBackoff(attempt,100,5000,true)};
}

/* ══════════ Bulkhead ══════════ */
function Bulkhead(maxConcurrent,queueSize){
  return {
    active:0,
    queue:[],
    maxConcurrent:maxConcurrent,
    queueSize:queueSize,
    tryAcquire:function(){
      if(this.active<this.maxConcurrent){this.active++;return true}
      if(this.queue.length<this.queueSize){this.queue.push(1);return false}
      return null;
    },
    release:function(){
      if(this.queue.length>0){this.queue.shift();return}
      this.active=Math.max(0,this.active-1);
    }
  };
}

/* ══════════ Prometheus alerting rules evaluation ══════════ */
function evaluateAlert(rule,metrics){
  /* rule: {expr:'avg_cpu > 80', for:'5m', severity:'warning'} */
  var parts=rule.expr.split(/\s+/);
  if(parts.length!==3)return {firing:false};
  var metric=parts[0],op=parts[1],threshold=parseFloat(parts[2]);
  var value=metrics[metric]||0;
  var triggers=false;
  switch(op){
    case '>':triggers=value>threshold;break;
    case '<':triggers=value<threshold;break;
    case '>=':triggers=value>=threshold;break;
    case '<=':triggers=value<=threshold;break;
    case '==':triggers=value===threshold;break;
  }
  return {firing:triggers,value:value,threshold:threshold};
}

/* ══════════ Error budget calculation ══════════ */
function errorBudget(slo,totalRequests,badRequests,periodMinutes){
  var allowed=totalRequests*(1-slo);
  var consumed=badRequests;
  var remaining=Math.max(0,allowed-consumed);
  var burnRate=(consumed/periodMinutes)/(allowed/periodMinutes);
  return {
    allowed:allowed,
    consumed:consumed,
    remaining:remaining,
    remainingPct:allowed>0?remaining/allowed*100:0,
    burnRate:burnRate,
    status:burnRate>2?'critical':(burnRate>1?'warning':'ok')
  };
}

function multiBurnRate(periodDays){

    {window:'1d',threshold:3,long:false},

  ];
}

/* ══════════ Git branch visualization helpers ══════════ */
function gitCommitGraph(commits){
  /* commits: [{id, parents:[...]}] */
  var lanes={};
  var nextLane=0;
  commits.forEach(function(c){
    if(c.parents.length===0){
      c.lane=nextLane++;
    } else {
      /* Use first parent's lane */
      var parent=commits.find(function(p){return p.id===c.parents[0]});
      if(parent&&parent.lane!==undefined)c.lane=parent.lane;
      else c.lane=nextLane++;
    }
  });
  return commits;
}

/* ══════════ Terraform plan diff ══════════ */
function tfPlanDiff(current,desired){
  var toCreate=[],toUpdate=[],toDelete=[];
  var currentKeys=Object.keys(current);
  var desiredKeys=Object.keys(desired);
  desiredKeys.forEach(function(k){
    if(!(k in current))toCreate.push(k);
    else if(JSON.stringify(current[k])!==JSON.stringify(desired[k]))toUpdate.push(k);
  });
  currentKeys.forEach(function(k){
    if(!(k in desired))toDelete.push(k);
  });
  return {toCreate:toCreate,toUpdate:toUpdate,toDelete:toDelete,total:toCreate.length+toUpdate.length+toDelete.length};
}

/* ══════════ Ansible idempotency simulation ══════════ */
function ansiblePlaybook(tasks,initialState){
  var state=Object.assign({},initialState);
  var results=[];
  tasks.forEach(function(task){
    var changed=false;
    if(task.action==='pkg'){
      if(!state.packages)state.packages={};
      if(!state.packages[task.name]){state.packages[task.name]=task.version;changed=true}
    } else if(task.action==='service'){
      if(!state.services)state.services={};
      if(state.services[task.name]!==task.state){state.services[task.name]=task.state;changed=true}
    } else if(task.action==='file'){
      if(!state.files)state.files={};
      if(state.files[task.name]!==task.content){state.files[task.name]=task.content;changed=true}
    } else if(task.action==='user'){
      if(!state.users)state.users={};
      if(!state.users[task.name]){state.users[task.name]=true;changed=true}
    }
    results.push({task:task,changed:changed});
  });
  return {results:results,state:state};
}

/* ══════════ Docker layer caching ══════════ */
function dockerLayerCache(instructions,baseCache){
  /* Simulate Docker layer caching - once a layer misses, all subsequent miss */
  var cache=baseCache||{};
  var layers=[];
  var cacheMiss=false;
  instructions.forEach(function(instr,i){
    var key=sha256like(instr);
    var hit=!cacheMiss&&cache[key];
    if(!hit)cacheMiss=true;
    var size=hit?0:ri(100000,5000000);
    layers.push({index:i,instruction:instr,hash:key.substring(0,12),cacheHit:hit,size:size});
    if(!hit)cache[key]=true;
  });
  return layers;
}

/* ══════════ Container image size estimator ══════════ */
function estimateImageSize(base,layers){
  var total=base;
  layers.forEach(function(l){
    if(l.type==='install')total+=l.size||ri(50e6,200e6);
    else if(l.type==='copy')total+=l.size||ri(1e6,50e6);
    else if(l.type==='build')total+=l.size||ri(10e6,100e6);
    else if(l.type==='remove')total-=l.size||ri(10e6,50e6);
  });
  return Math.max(0,total);
}

function buildNav(){
  var nav=$('nav');
  nav.innerHTML='';
  var groups={};
  MODULES.forEach(function(m){if(!groups[m.cat])groups[m.cat]=[];groups[m.cat].push(m)});
  Object.keys(groups).forEach(function(cat){
    var g=el('div',{class:'nav-cat'});
    g.appendChild(el('div',{class:'nav-cat-label',text:cat}));
    groups[cat].forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      g.appendChild(item);
    });
    nav.appendChild(g);
  });
}
function switchModule(id){
  S.module=id;
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.getAttribute('data-id')===id)});
  var m=MODULES.find(function(x){return x.id===id});
  if(m){
    $('infoTitle').textContent=m.name;
    $('infoSub').textContent=m.sub;
    $('cModule').textContent=m.name;
  }
  $('stageContent').innerHTML='';
  renderModule();
  renderInfo();
}

R.dashboard=function(dt){
  clear();
  headline('DevOps','infrastructure workbench · '+MODULES.length+' modules');
  /* Animated cluster diagram */
  var cx=S.W/2,cy=S.H/2;
  var ctrlY=cy-120;
  var nodeY=cy+20;
  /* Control plane */
  var ctrlW=200,ctrlH=60;
  S.ctx.fillStyle='rgba(0,255,136,.1)';
  S.ctx.fillRect(cx-ctrlW/2,ctrlY-ctrlH/2,ctrlW,ctrlH);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.lineWidth=2;
  S.ctx.strokeRect(cx-ctrlW/2+.5,ctrlY-ctrlH/2+.5,ctrlW-1,ctrlH-1);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('CONTROL PLANE',cx,ctrlY+4);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='9px "JetBrains Mono",monospace';
  S.ctx.fillText('API · etcd · Scheduler · Controller',cx,ctrlY+20);
  /* Worker nodes */
  var numNodes=3;
  var nodeSpacing=180;
  for(var i=0;i<numNodes;i++){
    var nx=cx+(i-(numNodes-1)/2)*nodeSpacing;
    var nw=150,nh=100;
    S.ctx.fillStyle='rgba(0,212,255,.08)';
    S.ctx.fillRect(nx-nw/2,nodeY-nh/2,nw,nh);
    S.ctx.strokeStyle='#00d4ff';
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(nx-nw/2+.5,nodeY-nh/2+.5,nw-1,nh-1);
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='700 11px "Orbitron",monospace';
    S.ctx.fillText('node-'+i,nx,nodeY-30);
    /* Connection to control plane */
    S.ctx.strokeStyle='rgba(0,255,136,.3)';
    S.ctx.setLineDash([4,4]);
    S.ctx.beginPath();
    S.ctx.moveTo(cx,ctrlY+ctrlH/2);
    S.ctx.lineTo(nx,nodeY-nh/2);
    S.ctx.stroke();
    S.ctx.setLineDash([]);
    /* Pods inside node */
    var numPods=3;
    for(var j=0;j<numPods;j++){
      var px=nx+(j-1)*40;
      var py=nodeY+10;
      var pulse=Math.sin(S.t*2+i+j)*0.3+0.7;
      S.ctx.fillStyle='rgba(0,255,136,'+pulse+')';
      S.ctx.beginPath();S.ctx.arc(px,py,6,0,Math.PI*2);S.ctx.fill();
      S.ctx.fillStyle='#02060a';
      S.ctx.font='7px "JetBrains Mono",monospace';
      S.ctx.fillText('p'+(i*numPods+j),px,py+2);
    }
  }
  /* Info cards */
  var cards=[
    {x:30,y:80,l:'Modules',v:MODULES.length,c:'#00ff88'},
    {x:S.W-220,y:80,l:'K8s resources',v:K8S_RESOURCES.length,c:'#00d4ff'},
    {x:30,y:S.H-90,l:'Cloud services',v:Object.keys(CLOUD_SERVICES).reduce(function(s,k){return s+CLOUD_SERVICES[k].length},0),c:'#ffb000'},
    {x:S.W-220,y:S.H-90,l:'K8s nodes',v:numNodes,c:'#a855f7'}
  ];
  cards.forEach(function(c){
    S.ctx.fillStyle='rgba(8,18,28,.9)';
    S.ctx.fillRect(c.x,c.y-25,180,55);
    S.ctx.strokeStyle=c.c;
    S.ctx.globalAlpha=.5;
    S.ctx.strokeRect(c.x+.5,c.y-24.5,179,54);
    S.ctx.globalAlpha=1;
    S.ctx.fillStyle='#3d5a70';
    S.ctx.font='500 8.5px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(c.l.toUpperCase(),c.x+12,c.y-9);
    S.ctx.fillStyle=c.c;
    S.ctx.font='700 18px "Orbitron",monospace';
    S.ctx.fillText(String(c.v),c.x+12,c.y+16);
  });
  $('cPods').textContent=9;
  $('cNodes').textContent=numNodes;

};

R.dockerfile=function(dt){
  clear();
  headline('Dockerfile Builder','multi-stage build recipe');
  if(!S.sim.dockerfile){
    S.sim.dockerfile={
      stages:[
        {name:'builder',base:'golang:1.22-alpine',cmds:[
          'WORKDIR /src','COPY . .','RUN go build -o /app ./cmd/server'
        ]},
        {name:'runtime',base:'alpine:3.19',cmds:[
          'RUN apk add --no-cache ca-certificates',
          'COPY --from=builder /app /usr/local/bin/app',
          'USER nobody','EXPOSE 8080','ENTRYPOINT ["/usr/local/bin/app"]'
        ]}
      ]
    };
  }
  var df=S.sim.dockerfile;
  /* Draw Dockerfile visualization */
  var padL=60,padT=120;
  var boxW=(S.W-padL*2)/df.stages.length-20;
  var boxH=S.H-padT-100;
  df.stages.forEach(function(stage,idx){
    var x=padL+idx*(boxW+20);
    var y=padT;
    /* Stage box */
    S.ctx.fillStyle=idx===0?'rgba(0,212,255,.08)':'rgba(0,255,136,.08)';
    S.ctx.fillRect(x,y,boxW,boxH);
    S.ctx.strokeStyle=idx===0?'#00d4ff':'#00ff88';
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(x+.5,y+.5,boxW-1,boxH-1);
    /* Stage header */
    S.ctx.fillStyle=idx===0?'#5ce5ff':'#5cffb0';
    S.ctx.font='700 14px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('STAGE '+idx+': '+stage.name,x+15,y+25);
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('FROM '+stage.base,x+15,y+45);
    /* Commands */
    stage.cmds.forEach(function(cmd,i){
      var cy=y+70+i*24;
      var cmdName=cmd.split(/\s+/)[0];
      var color='#00ff88';
      if(cmdName==='RUN')color='#ffb000';
      else if(cmdName==='COPY')color='#00d4ff';
      else if(cmdName==='FROM')color='#a855f7';
      else if(cmdName==='USER')color='#ff3d92';
      else if(cmdName==='EXPOSE')color='#3d80ff';
      else if(cmdName==='ENTRYPOINT'||cmdName==='CMD')color='#00ff88';
      S.ctx.fillStyle=color;
      S.ctx.font='700 10px "JetBrains Mono",monospace';
      S.ctx.fillText(cmdName,x+15,cy+4);
      S.ctx.fillStyle='#c0d8d0';
      S.ctx.font='10px "JetBrains Mono",monospace';
      var rest=cmd.substring(cmdName.length).trim();
      if(rest.length>30)rest=rest.substring(0,28)+'…';
      S.ctx.fillText(rest,x+70,cy+4);
    });
    /* Arrow between stages */
    if(idx<df.stages.length-1){
      S.ctx.strokeStyle='rgba(0,255,136,.5)';
      S.ctx.lineWidth=2;
      S.ctx.beginPath();
      S.ctx.moveTo(x+boxW+5,y+boxH/2);
      S.ctx.lineTo(x+boxW+15,y+boxH/2);
      S.ctx.stroke();
      S.ctx.beginPath();
      S.ctx.moveTo(x+boxW+15,y+boxH/2);
      S.ctx.lineTo(x+boxW+10,y+boxH/2-5);
      S.ctx.lineTo(x+boxW+10,y+boxH/2+5);
      S.ctx.closePath();
      S.ctx.fillStyle='rgba(0,255,136,.5)';
      S.ctx.fill();
    }
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,S.H-160,300,120);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,S.H-159.5,299,119);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('BEST PRACTICES',infoX+15,S.H-140);
  var rows=[
    ['✓ Multi-stage builds','shrink image'],
    ['✓ Pin base versions','reproducible'],
    ['✓ Non-root USER','security'],
    ['✓ .dockerignore','smaller context'],
    ['✗ RUN apt-get update alone','cached stale'],
    ['✗ Secrets in ENV','leaked']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,S.H-115+i*18);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.textAlign='right';
    S.ctx.fillText(r[1],infoX+285,S.H-115+i*18);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ Image Layers ══════════ */
R.layers=function(dt){
  clear();
  headline('Container Image Layers','caching & diff');
  if(!S.sim.layers){
    var instructions=[
      'FROM alpine:3.19',
      'RUN apk add --no-cache ca-certificates',
      'WORKDIR /app',
      'COPY package.json .',
      'RUN npm install',
      'COPY . .',
      'RUN npm run build',
      'EXPOSE 3000',
      'CMD ["node", "dist/index.js"]'
    ];
    S.sim.layers={instructions:instructions,cache:null,layers:null};
    S.sim.layers.layers=dockerLayerCache(instructions,{});
  }
  var l=S.sim.layers;
  /* Rerun cache simulation */
  l.layers=dockerLayerCache(l.instructions,{});
  /* Draw stacked layers */
  var padL=80,padT=120;
  var layerW=400;
  var layerH=Math.min(40,(S.H-padT-100)/l.layers.length);
  var startY=S.H-80-l.layers.length*layerH;
  l.layers.forEach(function(layer,i){
    var y=startY+i*layerH;
    /* Layer box */
    S.ctx.fillStyle=layer.cacheHit?'rgba(0,255,136,.15)':'rgba(255,176,0,.15)';
    S.ctx.fillRect(padL,y,layerW,layerH-2);
    S.ctx.strokeStyle=layer.cacheHit?'#00ff88':'#ffb000';
    S.ctx.lineWidth=1;
    S.ctx.strokeRect(padL+.5,y+.5,layerW-1,layerH-3);
    /* Index */
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('#'+layer.index,padL+5,y+layerH/2+3);
    /* Instruction */
    S.ctx.fillStyle='#c0d8d0';
    S.ctx.font='10px "JetBrains Mono",monospace';
    var instr=layer.instruction.length>42?layer.instruction.substring(0,40)+'…':layer.instruction;
    S.ctx.fillText(instr,padL+25,y+layerH/2+3);
    /* Cache status */
    S.ctx.fillStyle=layer.cacheHit?'#00ff88':'#ffb000';
    S.ctx.font='700 9px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(layer.cacheHit?'CACHED':'MISS',padL+layerW-10,y+layerH/2+3);
    /* Hash */
    S.ctx.fillStyle='#3d5a70';
    S.ctx.textAlign='left';
    S.ctx.fillText(layer.hash,padL+layerW+10,y+layerH/2+3);
    /* Size */
    S.ctx.fillStyle=layer.cacheHit?'#7898a8':'#ffb000';
    S.ctx.textAlign='right';
    S.ctx.fillText(bytes(layer.size),padL+layerW+120,y+layerH/2+3);
  });
  /* Total size */
  var totalSize=0;
  l.layers.forEach(function(layer){totalSize+=layer.size});
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('TOTAL: '+bytes(totalSize),padL,startY-20);
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,80,300,220);
  S.ctx.strokeStyle='#ffb000';
  S.ctx.strokeRect(infoX+.5,80.5,299,219);
  S.ctx.fillStyle='#ffcc55';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CACHE STATS',infoX+15,100);
  var cached=l.layers.filter(function(x){return x.cacheHit}).length;
  var rows=[
    ['Total layers',l.layers.length],
    ['Cached',cached],
    ['Missed',l.layers.length-cached],
    ['Cache hit rate',fmt(cached/l.layers.length*100,1)+'%'],
    ['Total size',bytes(totalSize)],
    ['Smallest',bytes(Math.min.apply(null,l.layers.map(function(x){return x.size||1e9})))],
    ['Largest',bytes(Math.max.apply(null,l.layers.map(function(x){return x.size})))],
    ['Avg size',bytes(totalSize/l.layers.length)],
    ['----------',''],
    ['Rule','cache miss stops caching'],
    ['Tip','order layers by change freq']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*18);
    S.ctx.fillStyle='#ffcc55';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*18);
    S.ctx.textAlign='left';
  });
};

R.containerNet=function(dt){

  } else if(mode==='host'){

  } else if(mode==='overlay'){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='12px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('Overlay network (VXLAN): multi-host',cx,cy-160);
    /* 2 hosts */
    var hosts=[{x:cx-200,y:cy,name:'host-1'},{x:cx+200,y:cy,name:'host-2'}];

<script>
/* ══════════════ K8s Pods ══════════════ */
R.k8sPods=function(dt){
  clear();
  headline('Kubernetes Pods','lifecycle & states');
  var phases=['Pending','ContainerCreating','Running','Ready','Terminating','Failed','Succeeded'];
  /* Draw state machine */
  var cx=S.W/2;
  var startY=140;
  var nodeW=140,nodeH=50;
  /* Horizontal flow */
  var transitions=[
    {from:'Pending',to:'ContainerCreating'},
    {from:'ContainerCreating',to:'Running'},
    {from:'Running',to:'Ready'},
    {from:'Ready',to:'Terminating'},
    {from:'Running',to:'Failed'},
    {from:'Running',to:'Succeeded'}
  ];
  /* Draw nodes */
  var nodePositions={
    'Pending':{x:80,y:startY},
    'ContainerCreating':{x:280,y:startY},
    'Running':{x:480,y:startY},
    'Ready':{x:680,y:startY},
    'Terminating':{x:680,y:startY+120},
    'Failed':{x:480,y:startY+240},
    'Succeeded':{x:280,y:startY+240}
  };
  /* Draw edges */
  transitions.forEach(function(t){
    var a=nodePositions[t.from],b=nodePositions[t.to];
    S.ctx.strokeStyle='rgba(0,255,136,.4)';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    S.ctx.moveTo(a.x+nodeW/2,a.y+nodeH/2);
    S.ctx.lineTo(b.x-nodeW/2,b.y+nodeH/2);
    S.ctx.stroke();
    /* Arrow */
    var ang=Math.atan2(b.y-a.y,b.x-a.x);
    S.ctx.beginPath();
    S.ctx.moveTo(b.x-nodeW/2,b.y+nodeH/2);
    S.ctx.lineTo(b.x-nodeW/2-10*Math.cos(ang-0.3),b.y+nodeH/2-10*Math.sin(ang-0.3));
    S.ctx.lineTo(b.x-nodeW/2-10*Math.cos(ang+0.3),b.y+nodeH/2-10*Math.sin(ang+0.3));
    S.ctx.closePath();
    S.ctx.fillStyle='rgba(0,255,136,.4)';
    S.ctx.fill();
  });
  /* Draw nodes */
  var colors={'Pending':'#ffb000','ContainerCreating':'#00d4ff','Running':'#00ff88','Ready':'#5cffb0','Terminating':'#ff3d92','Failed':'#ff4444','Succeeded':'#3d80ff'};
  phases.forEach(function(p){
    var pos=nodePositions[p];
    S.ctx.fillStyle=colors[p]+'20';
    S.ctx.fillRect(pos.x-nodeW/2,pos.y-nodeH/2,nodeW,nodeH);
    S.ctx.strokeStyle=colors[p];
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(pos.x-nodeW/2+.5,pos.y-nodeH/2+.5,nodeW-1,nodeH-1);
    S.ctx.fillStyle=colors[p];
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(p,pos.x,pos.y+4);
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,S.H-180,300,140);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,S.H-179.5,299,139);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('POD PHASES',infoX+15,S.H-160);
  var rows=[
    ['Pending','scheduled, not running'],
    ['ContainerCreating','pulling image'],
    ['Running','≥1 container active'],
    ['Succeeded','exit 0'],
    ['Failed','exit non-zero'],
    ['Unknown','unreachable node']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,S.H-135+i*18);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.textAlign='right';
    S.ctx.fillText(r[1],infoX+285,S.H-135+i*18);
    S.ctx.textAlign='left';
  });
};

/* ══════════════ K8s Deployments ══════════════ */
R.k8sDeploy=function(dt){
  clear();
  headline('K8s Deployments','rolling update strategy');
  if(!S.sim.k8sD){S.sim.k8sD={desired:6,maxSurge:2,maxUnavail:1,tl:null,step:0,running:true}}
  var k=S.sim.k8sD;
  if(!k.tl){
    k.tl=rollingUpdate(k.desired,k.maxSurge,k.maxUnavail);
    k.step=0;
  }
  /* Animate */
  if(k.running&&S.t-S.sim.lastStep>0.3){
    S.sim.lastStep=S.t;
    k.step++;
    if(k.step>=k.tl.length){k.step=0}
  }
  var current=k.tl[Math.min(k.step,k.tl.length-1)];
  /* Draw pods grid */
  var padL=80,padT=140;
  var podSize=50;
  var podSpacing=60;
  /* Old pods */
  S.ctx.fillStyle='#5ce5ff';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('OLD REPLICASET (v1.0)',padL,padT-15);
  S.ctx.fillText('NEW REPLICASET (v2.0)',padL,padT+120);
  /* Row 1: old */
  for(var i=0;i<k.desired;i++){
    var x=padL+i*podSpacing;
    var y=padT;
    var isAvailable=i<current.available;
    var isReady=i<current.ready-Math.max(0,current.updated-current.available);
    S.ctx.fillStyle=isReady?'rgba(0,212,255,.6)':'rgba(0,212,255,.15)';
    S.ctx.fillRect(x,y,podSize,podSize);
    S.ctx.strokeStyle=isReady?'#00d4ff':'rgba(0,212,255,.3)';
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(x+.5,y+.5,podSize-1,podSize-1);
    /* Pod icon */
    S.ctx.fillStyle=isReady?'#02060a':'#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('v1',x+podSize/2,y+podSize/2+4);
  }
  /* Row 2: new */
  for(var j=0;j<k.desired;j++){
    var x2=padL+j*podSpacing;
    var y2=padT+135;
    var isNew=j<current.updated;
    S.ctx.fillStyle=isNew?'rgba(0,255,136,.6)':'rgba(0,255,136,.15)';
    S.ctx.fillRect(x2,y2,podSize,podSize);
    S.ctx.strokeStyle=isNew?'#00ff88':'rgba(0,255,136,.3)';
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(x2+.5,y2+.5,podSize-1,podSize-1);
    S.ctx.fillStyle=isNew?'#02060a':'#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('v2',x2+podSize/2,y2+podSize/2+4);
  }
  /* Progress timeline */
  var tlY=padT+280;
  if(tlY+150<S.H){
    S.ctx.fillStyle='#5cffb0';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('PROGRESS',padL,tlY-10);
    /* Bars */
    var barW=(S.W-padL-80)/k.tl.length;
    k.tl.forEach(function(step,i){
      var x=padL+i*barW;
      var y=tlY;
      var h1=step.available/k.desired*60;
      var h2=step.updated/k.desired*60;
      S.ctx.fillStyle='rgba(0,212,255,.6)';
      S.ctx.fillRect(x,y+60-h1,barW*0.4-2,h1);
      S.ctx.fillStyle='rgba(0,255,136,.6)';
      S.ctx.fillRect(x+barW*0.45,y+60-h2,barW*0.4-2,h2);
      /* Current marker */
      if(i===k.step){
        S.ctx.strokeStyle='#ffb000';
        S.ctx.lineWidth=2;
        S.ctx.strokeRect(x-2,y-2,barW+2,64);
      }
    });
    /* Legend */
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('▪ Available (v1)',padL,tlY+80);
    S.ctx.fillStyle='#00ff88';
    S.ctx.fillText('▪ Updated (v2)',padL+140,tlY+80);
  }
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,80,300,220);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,80.5,299,219);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ROLLING UPDATE',infoX+15,100);
  var rows=[
    ['Desired replicas',k.desired],
    ['Max surge',k.maxSurge],
    ['Max unavailable',k.maxUnavail],
    ['Current step',k.step+'/'+(k.tl.length-1)],
    ['Ready',current.ready],
    ['Available',current.available],
    ['Updated',current.updated],
    ['----------',''],
    ['kubectl rollout undo','rollback'],
    ['kubectl rollout status','monitor']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*20);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.textAlign='right';
    S.ctx.fillText(String(r[1]),infoX+285,130+i*20);
    S.ctx.textAlign='left';
  });
};

R.k8sScheduler=function(dt){
  clear();
  headline('Kubernetes Scheduler','filter → score → bind');
  if(!S.sim.sched){
    var nodes=[
      {name:'node-1',cpuTotal:8000,cpuUsed:3000,memTotal:16000,memUsed:4000,taints:false},
      {name:'node-2',cpuTotal:8000,cpuUsed:6000,memTotal:16000,memUsed:8000,taints:false},
      {name:'node-3',cpuTotal:8000,cpuUsed:2000,memTotal:16000,memUsed:10000,taints:false},
      {name:'node-4',cpuTotal:8000,cpuUsed:5000,memTotal:16000,memUsed:2000,taints:true}
    ];
    S.sim.sched={nodes:nodes,pod:{cpuRequest:2000,memRequest:4000},scores:null};
  }
  var sc=S.sim.sched;
  var scores=schedulePod(sc.pod,sc.nodes.map(function(n){
    return {
      name:n.name,
      cpuTotal:n.cpuTotal,
      cpuUsed:n.cpuUsed,
      memTotal:n.memTotal,
      memUsed:n.memUsed,
      cpuFree:n.cpuTotal-n.cpuUsed,
      memFree:n.memTotal-n.memUsed,
      taints:n.taints
    };
  }));
  sc.scores=scores;
  /* Draw node cards */
  var padL=80,padT=140;
  var cardW=(S.W-padL*2)/sc.nodes.length-20;
  var cardH=S.H-padT-140;
  sc.nodes.forEach(function(n,i){
    var x=padL+i*(cardW+20);
    var y=padT;
    var feasible=!n.taints&&(n.cpuTotal-n.cpuUsed>=sc.pod.cpuRequest)&&(n.memTotal-n.memUsed>=sc.pod.memRequest);
    /* Card */
    S.ctx.fillStyle=feasible?'rgba(0,255,136,.08)':'rgba(255,68,68,.08)';
    S.ctx.fillRect(x,y,cardW,cardH);
    S.ctx.strokeStyle=feasible?'#00ff88':'#ff4444';
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(x+.5,y+.5,cardW-1,cardH-1);
    /* Header */
    S.ctx.fillStyle=feasible?'#5cffb0':'#ff8080';
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(n.name,x+cardW/2,y+25);
    /* Status */
    S.ctx.fillStyle=feasible?'#00ff88':'#ff4444';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(feasible?'FEASIBLE':(n.taints?'TAINTED':'NO CAPACITY'),x+cardW/2,y+45);
    /* CPU */
    var cpuUsedPct=n.cpuUsed/n.cpuTotal;
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('CPU',x+10,y+75);
    S.ctx.textAlign='right';
    S.ctx.fillText(n.cpuUsed+'/'+n.cpuTotal,x+cardW-10,y+75);
    /* CPU bar */
    var barW=cardW-20;
    S.ctx.fillStyle='rgba(0,212,255,.15)';
    S.ctx.fillRect(x+10,y+85,barW,12);
    S.ctx.fillStyle=n.cpuUsedPct>0.8?'#ff4444':(n.cpuUsedPct>0.6?'#ffb000':'#00d4ff');
    S.ctx.fillRect(x+10,y+85,barW*cpuUsedPct,12);
    /* Mem */
    var memUsedPct=n.memUsed/n.memTotal;
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('MEM',x+10,y+120);
    S.ctx.textAlign='right';
    S.ctx.fillText(n.memUsed+'/'+n.memTotal,x+cardW-10,y+120);
    /* Mem bar */
    S.ctx.fillStyle='rgba(168,85,247,.15)';
    S.ctx.fillRect(x+10,y+130,barW,12);
    S.ctx.fillStyle=memUsedPct>0.8?'#ff4444':(memUsedPct>0.6?'#ffb000':'#a855f7');
    S.ctx.fillRect(x+10,y+130,barW*memUsedPct,12);
    /* Score */
    if(feasible){
      var s=scores.find(function(sc){return sc.node.name===n.name});
      if(s){
        S.ctx.fillStyle='#ffb000';
        S.ctx.font='700 14px "Orbitron",monospace';
        S.ctx.textAlign='center';
        S.ctx.fillText(fmt(s.score,1),x+cardW/2,y+175);
        S.ctx.fillStyle='#7898a8';
        S.ctx.font='9px "JetBrains Mono",monospace';
        S.ctx.fillText('score',x+cardW/2,y+190);
        /* Breakdown */
        S.ctx.font='9px "JetBrains Mono",monospace';
        S.ctx.fillText('cpu:'+fmt(s.cpuScore,0)+' mem:'+fmt(s.memScore,0),x+cardW/2,y+210);
        S.ctx.fillText('balanced:'+fmt(s.balanced,0),x+cardW/2,y+225);
      }
    }
  });
  /* Best node */
  if(scores.length>0){
    S.ctx.fillStyle='#02060a';
    S.ctx.font='700 14px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('BEST: '+scores[0].node.name,S.W/2,S.H-50);
  } else {
    S.ctx.fillStyle='#ff4444';
    S.ctx.font='700 14px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText('NO FEASIBLE NODE',S.W/2,S.H-50);
  }
  /* Pod spec */
  S.ctx.fillStyle='#5ce5ff';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Pod request: cpu='+sc.pod.cpuRequest+'m mem='+sc.pod.memRequest+'Mi',80,S.H-60);
};

/* ══════════════ CI/CD Pipeline ══════════════ */
R.pipeline=function(dt){
  clear();
  headline('CI/CD Pipeline','stages & progression');
  if(!S.sim.pipeline){
    S.sim.pipeline={
      stages:[
        {name:'Checkout',duration:2,status:'success'},
        {name:'Install',duration:15,status:'success'},
        {name:'Lint',duration:8,status:'success'},
        {name:'Test',duration:45,status:'success'},
        {name:'Build',duration:30,status:'success'},
        {name:'Scan',duration:20,status:'running'},
        {name:'Deploy Staging',duration:40,status:'pending'},
        {name:'E2E Tests',duration:60,status:'pending'},
        {name:'Deploy Prod',duration:30,status:'pending'}
      ],
      progress:0
    };
  }
  var p=S.sim.pipeline;
  p.progress+=dt*0.15;
  if(p.progress>1)p.progress=0;
  /* Draw pipeline */
  var padT=140;
  var padL=60;
  var totalDuration=p.stages.reduce(function(s,st){return s+st.duration},0);
  /* Timeline */
  S.ctx.fillStyle='rgba(0,255,136,.05)';
  S.ctx.fillRect(padL,padT,S.W-padL*2,60);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.lineWidth=1;
  S.ctx.strokeRect(padL+.5,padT+.5,S.W-padL*2-1,59);
  /* Cumulative progress */
  var cumW=0;
  var totalW=S.W-padL*2;
  var elapsed=totalDuration*p.progress;
  var cumulative=0;
  p.stages.forEach(function(st,i){
    var w=st.duration/totalDuration*totalW;
    var x=padL+cumW;
    /* Actual stage state */
    var state=st.status;
    if(cumulative+p.duration<elapsed)state='success';
    else if(cumulative<elapsed)state='running';
    else state='pending';
    cumulative+=st.duration;
    /* Color by state */
    var color;
    if(state==='success')color='#00ff88';
    else if(state==='running')color='#ffb000';
    else if(state==='failed')color='#ff4444';
    else color='#3d5a70';
    S.ctx.fillStyle=color+'40';
    S.ctx.fillRect(x,padT,w,60);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(x+.5,padT+.5,w-1,59);
    /* Label */
    S.ctx.fillStyle=color;
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(st.name,x+w/2,padT+25);
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText(st.duration+'s',x+w/2,padT+45);
    cumW+=w;
  });
  /* Playhead */
  var headX=padL+p.progress*totalW;
  S.ctx.fillStyle='#00d4ff';
  S.ctx.beginPath();
  S.ctx.moveTo(headX,padT-10);
  S.ctx.lineTo(headX-8,padT-20);
  S.ctx.lineTo(headX+8,padT-20);
  S.ctx.closePath();
  S.ctx.fill();
  /* Stage list */
  var listY=padT+100;
  p.stages.forEach(function(st,i){
    var y=listY+i*32;
    var cumulative=0;
    for(var j=0;j<i;j++)cumulative+=p.stages[j].duration;
    var state=cumulative+p.duration<elapsed?'success':(cumulative<elapsed?'running':'pending');
    var color=state==='success'?'#00ff88':(state==='running'?'#ffb000':'#3d5a70');
    /* Status dot */
    S.ctx.fillStyle=color;
    S.ctx.beginPath();S.ctx.arc(padL+15,y+10,6,0,Math.PI*2);S.ctx.fill();

    S.ctx.fillStyle=state==='pending'?'#7898a8':'#c0d8d0';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';

    S.ctx.font='700 10px "JetBrains Mono",monospace';

/* ══════════════ Git Workflow ══════════════ */
R.gitFlow=function(dt){
  clear();
  headline('Git Workflow','branch strategies');
  if(!S.sim.git){S.sim.git={strategy:'gitflow'}}
  var strategies={
    gitflow:[
      {name:'main',color:'#00ff88',commits:8,y:80},
      {name:'develop',color:'#00d4ff',commits:12,y:120},
      {name:'feature/x',color:'#ffb000',commits:4,y:160},
      {name:'release/1.2',color:'#a855f7',commits:5,y:200},
      {name:'hotfix/1.2.1',color:'#ff4444',commits:3,y:240}
    ],
    trunk:[
      {name:'main',color:'#00ff88',commits:25,y:80},
      {name:'feat-1',color:'#ffb000',commits:3,y:120},
      {name:'feat-2',color:'#00d4ff',commits:2,y:150},
      {name:'feat-3',color:'#a855f7',commits:4,y:180}
    ],
    githubflow:[
      {name:'main',color:'#00ff88',commits:10,y:80},
      {name:'feature-a',color:'#ffb000',commits:5,y:120},
      {name:'feature-b',color:'#00d4ff',commits:4,y:160},
      {name:'feature-c',color:'#a855f7',commits:6,y:200}
    ]
  };
  var branches=strategies[S.sim.git.strategy];
  var padL=80;
  var commitSpacing=40;
  branches.forEach(function(br){
    /* Branch line */
    S.ctx.strokeStyle=br.color;
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    S.ctx.moveTo(padL,br.y);
    S.ctx.lineTo(padL+br.commits*commitSpacing,br.y);
    S.ctx.stroke();
    /* Branch name */
    S.ctx.fillStyle=br.color;
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(br.name,padL-10,br.y+4);
    /* Commits */
    for(var i=0;i<br.commits;i++){
      var x=padL+i*commitSpacing+20;
      S.ctx.fillStyle=br.color;
      S.ctx.beginPath();S.ctx.arc(x,br.y,6,0,Math.PI*2);S.ctx.fill();
      S.ctx.strokeStyle='#02060a';
      S.ctx.lineWidth=2;
      S.ctx.stroke();
      /* Hash */
      S.ctx.fillStyle='#7898a8';
      S.ctx.font='8px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText(sha256like(br.name+i).substring(0,5),x,br.y-12);
    }
  });
  /* Strategy buttons */
  var strats=['gitflow','trunk','githubflow'];
  strats.forEach(function(s,i){
    var x=60+i*160;
    var y=S.H-50;
    S.ctx.fillStyle=S.sim.git.strategy===s?'rgba(0,255,136,.3)':'rgba(8,18,28,.9)';
    S.ctx.fillRect(x,y,150,32);
    S.ctx.strokeStyle=S.sim.git.strategy===s?'#00ff88':'rgba(0,255,136,.4)';
    S.ctx.lineWidth=S.sim.git.strategy===s?2:1;
    S.ctx.strokeRect(x+.5,y+.5,149,31);
    S.ctx.fillStyle=S.sim.git.strategy===s?'#5cffb0':'#7898a8';
    S.ctx.font='600 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(s,x+75,y+20);
  });
  S.sim.gitBtns=strats.map(function(s,i){return {k:s,x:60+i*160,y:S.H-50,w:150,h:32}});
};

/* ══════════════ GitHub Actions ══════════════ */
R.ghActions=function(dt){
  clear();
  headline('GitHub Actions','workflow parser');
  if(!S.sim.gha){
    S.sim.gha={
      yaml:'name: CI\non: push\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - checkout\n      - setup-node\n      - npm-ci\n      - npm-test\n  build:\n    needs: test\n    steps:\n      - docker-build\n      - docker-push'
    };
  }
  var gha=S.sim.gha;
  var lines=gha.yaml.split('\n');
  /* Draw code */
  var padL=60,padT=140;
  S.ctx.fillStyle='rgba(8,18,28,.8)';
  S.ctx.fillRect(padL,padT,S.W/2-80,lines.length*20+30);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.lineWidth=1;
  S.ctx.strokeRect(padL+.5,padT+.5,S.W/2-80,lines.length*20+29);
  /* Line numbers */
  lines.forEach(function(line,i){
    var y=padT+20+i*20;
    S.ctx.fillStyle='#3d5a70';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(i+1,padL+25,y);
    /* Syntax highlight */
    var indent=line.search(/\S/);
    var indentStr=' '.repeat(indent);
    var content=line.trimStart();
    var color='#c0d8d0';
    if(content.startsWith('#'))color='#3d5a70';
    else if(content.endsWith(':'))color='#00d4ff';
    else if(content.startsWith('- '))color='#ffb000';
    else if(content.indexOf(':')>0&&content.indexOf(':')<content.length-1){
      var parts=content.split(':');
      S.ctx.fillStyle='#7898a8';
      S.ctx.textAlign='left';
      S.ctx.fillText(indentStr+parts[0]+':',padL+40,y);
      S.ctx.fillStyle='#5cffb0';
      S.ctx.fillText(parts.slice(1).join(':').trim(),padL+40+(indentStr+parts[0]+': ').length*7,y);
      return;
    }
    S.ctx.fillStyle=color;
    S.ctx.textAlign='left';
    S.ctx.fillText(line,padL+40,y);
  });
  /* Parsed tree */
  var treeX=S.W/2+60;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 13px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('PARSED JOBS',treeX,padT+10);
  /* Simple job viz */
  var jobs=[
    {name:'test',steps:['checkout','setup-node','npm-ci','npm-test'],deps:[]},
    {name:'build',steps:['docker-build','docker-push'],deps:['test']}
  ];
  var jobY=padT+50;
  jobs.forEach(function(job,i){
    var y=jobY+i*140;
    /* Job box */
    S.ctx.fillStyle='rgba(0,212,255,.1)';
    S.ctx.fillRect(treeX,y,260,120);
    S.ctx.strokeStyle='#00d4ff';
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(treeX+.5,y+.5,259,119);
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.fillText('job: '+job.name,treeX+15,y+25);
    /* Steps */
    job.steps.forEach(function(step,si){
      S.ctx.fillStyle='#7898a8';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText('▸ '+step,treeX+15,y+45+si*18);
    });
    /* Deps arrow */
    if(job.deps.length>0&&i>0){
      S.ctx.strokeStyle='rgba(0,255,136,.5)';
      S.ctx.lineWidth=2;
      S.ctx.beginPath();
      S.ctx.moveTo(treeX+130,y-20);
      S.ctx.lineTo(treeX+130,y);
      S.ctx.stroke();
    }
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,S.H-180,300,140);
  S.ctx.strokeStyle='#00d4ff';
  S.ctx.strokeRect(infoX+.5,S.H-179.5,299,139);
  S.ctx.fillStyle='#5ce5ff';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('WORKFLOW CONCEPTS',infoX+15,S.H-160);
  var rows=[
    ['on','trigger events'],
    ['jobs','parallel by default'],
    ['needs','dependency DAG'],
    ['steps','sequential in job'],
    ['uses','reusable action'],
    ['runs-on','runner label'],
    ['secrets','encrypted env']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,S.H-135+i*18);
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.textAlign='right';
    S.ctx.fillText(r[1],infoX+285,S.H-135+i*18);
    S.ctx.textAlign='left';
  });
};

    var props=[
      {label:'Downtime',value:s.downtime?'yes':'no',color:s.downtime?'#ff4444':'#00ff88'},
      {label:'Rollback',value:s.rollback,color:s.rollback==='instant'?'#00ff88':(s.rollback==='fast'||s.rollback==='medium'?'#ffb000':'#ff4444')},
      {label:'Cost',value:s.cost.toFixed(1)+'×',color:s.cost>1.5?'#ff4444':(s.cost>1.2?'#ffb000':'#00ff88')},
      {label:'Desc',value:s.desc,color:'#7898a8'}
    ];
    var px=350;
    props.forEach(function(p){
      S.ctx.fillStyle='#7898a8';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText(p.label+':',px,y+rowH/2+4);
      S.ctx.fillStyle=p.color;
      S.ctx.fillText(String(p.value),px+p.label.length*7+15,y+rowH/2+4);
      px+=180;
    });
  });
};

<script>
/* ══════════════ Terraform ══════════════ */
R.terraform=function(dt){
  clear();
  headline('Terraform','plan · apply · destroy');
  if(!S.sim.tf){
    S.sim.tf={
      current:{
        'aws_instance.web':{type:'t2.micro',count:3},
        'aws_sg.web':{port:80},
        'aws_vpc.main':{cidr:'10.0.0.0/16'}
      },
      desired:{
        'aws_instance.web':{type:'t3.micro',count:5},
        'aws_sg.web':{port:80},
        'aws_sg.ssh':{port:22},
        'aws_vpc.main':{cidr:'10.0.0.0/16'}
      }
    };
  }
  var tf=S.sim.tf;
  var diff=tfPlanDiff(tf.current,tf.desired);
  /* Draw plan */
  var padL=80,padT=140;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 13px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('TERRAFORM PLAN',padL,padT-20);
  var y=padT+10;
  /* Header */
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('Resource',padL,y);
  S.ctx.fillText('Action',padL+400,y);
  S.ctx.fillText('Current → Desired',padL+520,y);
  y+=25;
  /* Create */
  diff.toCreate.forEach(function(k){
    S.ctx.fillStyle='#00ff88';
    S.ctx.font='11px "JetBrains Mono",monospace';
    S.ctx.fillText('+ '+k,padL,y);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.fillText('create',padL+400,y);
    S.ctx.fillStyle='#7898a8';
    S.ctx.fillText('(none) → '+JSON.stringify(tf.desired[k]),padL+520,y);
    y+=22;
  });
  /* Update */
  diff.toUpdate.forEach(function(k){
    S.ctx.fillStyle='#ffb000';
    S.ctx.fillText('~ '+k,padL,y);
    S.ctx.fillStyle='#ffcc55';
    S.ctx.fillText('update',padL+400,y);
    S.ctx.fillStyle='#7898a8';
    var cur=JSON.stringify(tf.current[k]);
    var des=JSON.stringify(tf.desired[k]);
    S.ctx.fillText(cur+' → '+des,padL+520,y);
    y+=22;
  });
  /* Delete */
  diff.toDelete.forEach(function(k){
    S.ctx.fillStyle='#ff4444';
    S.ctx.fillText('- '+k,padL,y);
    S.ctx.fillStyle='#ff8080';
    S.ctx.fillText('destroy',padL+400,y);
    S.ctx.fillStyle='#7898a8';
    S.ctx.fillText(JSON.stringify(tf.current[k])+' → (none)',padL+520,y);
    y+=22;
  });
  /* Summary */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.fillText('Plan: '+diff.toCreate.length+' to add, '+diff.toUpdate.length+' to change, '+diff.toDelete.length+' to destroy',padL,S.H-80);
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,80,300,220);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,80.5,299,219);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('TERRAFORM WORKFLOW',infoX+15,100);
  var rows=[
    ['terraform init','download providers'],
    ['terraform plan','preview changes'],
    ['terraform apply','execute'],
    ['terraform destroy','tear down'],
    ['terraform fmt','format code'],
    ['terraform validate','syntax check'],
    ['terraform state','inspect state'],
    ['terraform import','adopt resource']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*20);
    S.ctx.fillStyle='#7898a8';
    S.ctx.textAlign='right';
    S.ctx.fillText(r[1],infoX+285,130+i*20);
    S.ctx.textAlign='left';
  });
};

R.ansible=function(dt){

  S.ctx.font='700 13px "Orbitron",monospace';

    S.ctx.fillStyle='rgba(0,255,136,.05)';
    S.ctx.fillRect(padL,y,S.W-padL-100,28);
    S.ctx.strokeStyle='rgba(0,255,136,.2)';

    S.ctx.textAlign='left';

  S.ctx.font='700 14px "Orbitron",monospace';

    ['Playbook','list of plays'],
    ['Play','maps hosts→tasks'],
    ['Task','single action'],
    ['Module','pkg/service/file/user'],
    ['Handler','triggered at end'],
    ['Role','reusable bundle'],
    ['Idempotent','same result, repeat OK'],
    ['----------',''],
    ['ansible-playbook site.yml','run'],
    ['ansible -m ping all','test']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,S.H-215+i*19);
