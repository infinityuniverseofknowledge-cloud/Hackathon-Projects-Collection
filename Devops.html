R.loadBalancer=function(dt){
  clear();
  headline('Load Balancer','6 scheduling algorithms');
  if(!S.sim.lb){
    S.sim.lb={
      algorithm:'roundRobin',
      servers:[
        {name:'srv-1',weight:1,conns:0},
        {name:'srv-2',weight:2,conns:0},
        {name:'srv-3',weight:1,conns:0}
      ],
      lb:makeLoadBalancer('roundRobin'),
      history:[]
    };
  }
  var lb=S.sim.lb;
  if(lb.lb.algorithm!==lb.algorithm){
    lb.lb=makeLoadBalancer(lb.algorithm);
    lb.history=[];
    lb.servers.forEach(function(s){s.conns=0});
  }
  /* Generate requests */
  if(S.t-S.sim.lastReq>0.15){
    S.sim.lastReq=S.t;
    var srv=lb.lb.pick(lb.servers,'client-'+ri(1,10));
    if(srv){
      srv.conns++;
      lb.history.push({server:srv.name,time:Date.now()});
      if(lb.history.length>50)lb.history.shift();
    }
  }
  /* Draw LB */
  var cx=S.W/2;
  S.ctx.fillStyle='rgba(255,176,0,.15)';
  S.ctx.fillRect(cx-100,140,200,60);
  S.ctx.strokeStyle='#ffb000';
  S.ctx.lineWidth=2;
  S.ctx.strokeRect(cx-99.5,140.5,199,59);
  S.ctx.fillStyle='#ffcc55';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='center';
  S.ctx.fillText('LOAD BALANCER',cx,170);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText(lb.algorithm,cx,190);
  /* Servers */
  lb.servers.forEach(function(s,i){
    var sx=cx+(i-(lb.servers.length-1)/2)*200;
    var sy=280;
    /* Connection */
    S.ctx.strokeStyle='rgba(0,255,136,.4)';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    S.ctx.moveTo(cx,200);
    S.ctx.lineTo(sx,sy);
    S.ctx.stroke();
    /* Server box */
    var load=s.conns/(Math.max.apply(null,lb.servers.map(function(x){return x.conns}))||1);
    var color=load>0.8?'#ff4444':(load>0.5?'#ffb000':'#00ff88');
    S.ctx.fillStyle=color+'20';
    S.ctx.fillRect(sx-80,sy,160,100);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=2;
    S.ctx.strokeRect(sx-79.5,sy+.5,159,99);
    /* Name */
    S.ctx.fillStyle=color;
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.fillText(s.name,sx,sy+25);
    /* Weight */
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('weight: '+s.weight,sx,sy+45);
    /* Connections */
    S.ctx.fillStyle=color;
    S.ctx.font='700 20px "Orbitron",monospace';
    S.ctx.fillText(s.conns,sx,sy+75);
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText('active conns',sx,sy+90);
  });
  /* Algorithm buttons */
  var algs=['roundRobin','leastConn','random','ipHash','weightedRR'];
  algs.forEach(function(a,i){
    var x=60+i*140;
    var y=S.H-50;
    S.ctx.fillStyle=lb.algorithm===a?'rgba(0,255,136,.3)':'rgba(8,18,28,.9)';
    S.ctx.fillRect(x,y,130,32);
    S.ctx.strokeStyle=lb.algorithm===a?'#00ff88':'rgba(0,255,136,.4)';
    S.ctx.lineWidth=lb.algorithm===a?2:1;
    S.ctx.strokeRect(x+.5,y+.5,129,31);
    S.ctx.fillStyle=lb.algorithm===a?'#5cffb0':'#7898a8';
    S.ctx.font='600 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(a,x+65,y+20);
  });
  S.sim.lbBtns=algs.map(function(a,i){return {k:a,x:60+i*140,y:S.H-50,w:130,h:32}});
  $('cRps').textContent=lb.history.length;
};

/* ══════════════ DNS ══════════════ */
R.dns=function(dt){
  clear();
  headline('DNS Resolver','A · CNAME · MX · NS');
  if(!S.sim.dns){S.sim.dns={query:'www.example.com',result:null}}
  var d=S.sim.dns;
  if(!d.result)d.result=resolveDNS(d.query);
  /* Draw resolution chain */
  var cx=S.W/2;
  var startY=180;
  var stepH=90;
  d.result.chain.forEach(function(step,i){
    var y=startY+i*stepH;
    /* Node */
    S.ctx.fillStyle='rgba(0,255,136,.1)';
    S.ctx.fillRect(cx-200,y,400,60);
    S.ctx.strokeStyle='#00ff88';
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(cx-199.5,y+.5,399,59);
    /* Name */
    S.ctx.fillStyle='#5cffb0';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(step.name,cx-185,y+25);
    /* Record */
    if(step.record){
      S.ctx.fillStyle='#00d4ff';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText(step.record.type+' → '+step.record.value,cx-185,y+45);
      S.ctx.fillStyle='#7898a8';
      S.ctx.textAlign='right';
      S.ctx.fillText('TTL='+step.record.ttl,cx+185,y+25);
    } else {
      S.ctx.fillStyle='#ff4444';
      S.ctx.font='10px "JetBrains Mono",monospace';
      S.ctx.fillText('NXDOMAIN',cx-185,y+45);
    }
    /* Arrow to next */
    if(i<d.result.chain.length-1){
      S.ctx.strokeStyle='rgba(0,255,136,.5)';
      S.ctx.lineWidth=2;
      S.ctx.beginPath();
      S.ctx.moveTo(cx,y+60);
      S.ctx.lineTo(cx,y+stepH);
      S.ctx.stroke();
      S.ctx.beginPath();
      S.ctx.moveTo(cx,y+stepH);
      S.ctx.lineTo(cx-6,y+stepH-10);
      S.ctx.lineTo(cx+6,y+stepH-10);
      S.ctx.closePath();
      S.ctx.fillStyle='rgba(0,255,136,.5)';
      S.ctx.fill();
    }
  });
  /* Query input */
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Query: '+d.query,60,S.H-70);
  /* Buttons */
  var queries=['www.example.com','api.example.com','example.com','mail.example.com'];
  queries.forEach(function(q,i){
    var x=60+i*180;
    var y=S.H-50;
    S.ctx.fillStyle=d.query===q?'rgba(0,255,136,.3)':'rgba(8,18,28,.9)';
    S.ctx.fillRect(x,y,170,32);
    S.ctx.strokeStyle=d.query===q?'#00ff88':'rgba(0,255,136,.4)';
    S.ctx.lineWidth=d.query===q?2:1;
    S.ctx.strokeRect(x+.5,y+.5,169,31);
    S.ctx.fillStyle=d.query===q?'#5cffb0':'#7898a8';
    S.ctx.font='600 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(q,x+85,y+20);
  });
  S.sim.dnsBtns=queries.map(function(q,i){return {k:q,x:60+i*180,y:S.H-50,w:170,h:32}});
};

/* ══════════════ CIDR ══════════════ */
R.cidr=function(dt){
  clear();
  headline('CIDR Calculator','subnet planning');
  if(!S.sim.cidr){S.sim.cidr={input:'10.0.0.0/24'}}
  var c=S.sim.cidr;
  var parsed=parseCIDR(c.input);
  /* Input display */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('CIDR: '+c.input,60,140);
  if(parsed){
    /* Info grid */
    var rows=[
      ['Network','#'+ipStr(parsed.network)],
      ['Broadcast',ipStr(parsed.broadcast)],
      ['Subnet mask',ipStr(parsed.mask)],
      ['Prefix length','/'+parsed.prefix],
      ['Total addresses',commas(Math.pow(2,32-parsed.prefix))],
      ['Usable hosts',commas(parsed.hosts)],
      ['First host',ipStr(parsed.network+1)],
      ['Last host',ipStr(parsed.broadcast-1)],
      ['Class',parsed.network>=0x0A000000&&parsed.network<0x0B000000?'A (10.0.0.0/8)':(parsed.network>=0xAC100000&&parsed.network<0xAC200000?'B (172.16.0.0/12)':(parsed.network>=0xC0A80000&&parsed.network<0xC0A90000?'C (192.168.0.0/16)':'—'))]
    ];
    var padL=60,padT=200;
    rows.forEach(function(r,i){
      var y=padT+i*30;
      S.ctx.fillStyle='#7898a8';
      S.ctx.font='11px "JetBrains Mono",monospace';
      S.ctx.textAlign='left';
      S.ctx.fillText(r[0],padL,y);
      S.ctx.fillStyle='#5cffb0';
      S.ctx.textAlign='right';
      S.ctx.fillText(r[1],padL+400,y);
    });
    /* Binary view */
    var binY=padT+30*rows.length+20;
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText('BINARY VIEW',padL,binY);
    var bin=parsed.network.toString(2).padStart(32,'0');
    for(var i=0;i<32;i++){
      var x=padL+i*15;
      S.ctx.fillStyle=i<parsed.prefix?'#00ff88':'#7898a8';
      S.ctx.font='700 11px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText(bin[i],x+7,binY+25);
    }
    /* Divider */
    S.ctx.strokeStyle='#ffb000';
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    S.ctx.moveTo(padL+parsed.prefix*15+7,binY+15);

/* ══════════════ Rate Limiting ══════════════ */
R.rateLimit=function(dt){
  clear();
  headline('Rate Limiting','4 algorithms');
  if(!S.sim.rl){
    S.sim.rl={
      algorithm:'token',
      limiters:{
        token:new TokenBucket(10,20),
        leaky:new LeakyBucket(10,20),
        fixed:fixedWindowLimiter(20,1000),
        sliding:slidingWindowLog(20,1000),
        swc:slidingWindowCounter(20,1000)
      },
      history:[],
      accepted:0,
      rejected:0
    };
  }
  var rl=S.sim.rl;
  /* Generate requests */
  if(S.t-S.sim.lastReq>0.03){
    S.sim.lastReq=S.t;
    var ok;
    if(rl.algorithm==='token')ok=rl.limiters.token.tryConsume(1);
    else if(rl.algorithm==='leaky')ok=rl.limiters.leaky.tryAdd(1);
    else if(rl.algorithm==='fixed')ok=rl.limiters.fixed();
    else if(rl.algorithm==='sliding')ok=rl.limiters.sliding();
    else if(rl.algorithm==='swc')ok=rl.limiters.swc();
    rl.history.push({time:Date.now(),ok:ok});
    if(rl.history.length>100)rl.history.shift();
    if(ok)rl.accepted++;else rl.rejected++;
  }
  /* Visualize timeline */
  var padL=60,padT=140;
  var plotW=S.W-padL*2,plotH=200;
  /* Timeline */
  S.ctx.fillStyle='rgba(8,18,28,.8)';
  S.ctx.fillRect(padL,padT,plotW,plotH);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.lineWidth=1;
  S.ctx.strokeRect(padL+.5,padT+.5,plotW-1,plotH-1);
  /* Plot history as dots */
  rl.history.forEach(function(h,i){
    var x=padL+(i/rl.history.length)*plotW;
    var y=padT+plotH/2+(h.ok?-30:30);
    S.ctx.fillStyle=h.ok?'#00ff88':'#ff4444';
    S.ctx.beginPath();S.ctx.arc(x,y,3,0,Math.PI*2);S.ctx.fill();
  });
  /* Legend */
  S.ctx.fillStyle='#00ff88';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('● accepted',padL,padT-10);
  S.ctx.fillStyle='#ff4444';
  S.ctx.fillText('● rejected',padL+120,padT-10);
  /* Stats */
  var total=rl.accepted+rl.rejected;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('Rate: '+fmt(rl.accepted/total*100,1)+'% accepted',padL,padT+plotH+50);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='11px "JetBrains Mono",monospace';
  S.ctx.fillText('accepted: '+rl.accepted+'  rejected: '+rl.rejected,padL,padT+plotH+75);
  /* Algorithm buttons */
  var algs=['token','leaky','fixed','sliding','swc'];
  algs.forEach(function(a,i){
    var x=60+i*130;
    var y=S.H-50;
    S.ctx.fillStyle=rl.algorithm===a?'rgba(0,255,136,.3)':'rgba(8,18,28,.9)';
    S.ctx.fillRect(x,y,120,32);
    S.ctx.strokeStyle=rl.algorithm===a?'#00ff88':'rgba(0,255,136,.4)';
    S.ctx.lineWidth=rl.algorithm===a?2:1;
    S.ctx.strokeRect(x+.5,y+.5,119,31);
    S.ctx.fillStyle=rl.algorithm===a?'#5cffb0':'#7898a8';
    S.ctx.font='600 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(a,x+60,y+20);
  });
  S.sim.rlBtns=algs.map(function(a,i){return {k:a,x:60+i*130,y:S.H-50,w:120,h:32}});
};

/* ══════════════ Circuit Breaker ══════════════ */
R.circuitBreaker=function(dt){
  clear();
  headline('Circuit Breaker','CLOSED → OPEN → HALF-OPEN');
  if(!S.sim.cb){
    S.sim.cb={
      cb:new CircuitBreaker(5,3000),
      history:[],
      requests:0
    };
  }
  var c=S.sim.cb;
  /* Simulate requests */
  if(S.t-S.sim.lastReq>0.1){
    S.sim.lastReq=S.t;
    var allowed=c.cb.allow();
    var success=Math.random()<0.7;
    if(allowed){
      c.requests++;
      if(success)c.cb.recordSuccess();
      else c.cb.recordFailure();
      c.history.push({time:Date.now(),allowed:true,success:success,state:c.cb.state});
    } else {
      c.history.push({time:Date.now(),allowed:false,success:false,state:c.cb.state});
    }
    if(c.history.length>60)c.history.shift();
  }
  /* State machine diagram */
  var cx=S.W/2;
  var cy=S.H/2;
  var states=[
    {name:'CLOSED',x:cx-200,y:cy-60,color:'#00ff88'},
    {name:'OPEN',x:cx+200,y:cy-60,color:'#ff4444'},
    {name:'HALF-OPEN',x:cx,y:cy+120,color:'#ffb000'}
  ];
  /* Draw state transitions */
  var transitions=[
    {from:0,to:1,label:'failures ≥ threshold'},
    {from:1,to:2,label:'timeout elapsed'},
    {from:2,to:0,label:'successes ≥ threshold'},
    {from:2,to:1,label:'any failure'}
  ];
  transitions.forEach(function(t){
    var a=states[t.from],b=states[t.to];
    var angle=Math.atan2(b.y-a.y,b.x-a.x);
    var x1=a.x+Math.cos(angle)*70;
    var y1=a.y+Math.sin(angle)*70;
    var x2=b.x-Math.cos(angle)*70;
    var y2=b.y-Math.sin(angle)*70;
    S.ctx.strokeStyle='rgba(120,152,168,.5)';
    S.ctx.lineWidth=1.5;
    S.ctx.beginPath();
    S.ctx.moveTo(x1,y1);
    S.ctx.lineTo(x2,y2);
    S.ctx.stroke();
    /* Arrow */
    S.ctx.beginPath();
    S.ctx.moveTo(x2,y2);
    S.ctx.lineTo(x2-10*Math.cos(angle-0.3),y2-10*Math.sin(angle-0.3));
    S.ctx.lineTo(x2-10*Math.cos(angle+0.3),y2-10*Math.sin(angle+0.3));
    S.ctx.closePath();
    S.ctx.fillStyle='rgba(120,152,168,.5)';
    S.ctx.fill();
    /* Label */
    var mx=(x1+x2)/2,my=(y1+y2)/2;
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(t.label,mx,my-10);
  });
  /* States */
  states.forEach(function(st){
    var isActive=c.cb.state===st.name;
    S.ctx.fillStyle=isActive?st.color+'40':'rgba(8,18,28,.9)';
    S.ctx.beginPath();
    S.ctx.arc(st.x,st.y,60,0,Math.PI*2);
    S.ctx.fill();
    S.ctx.strokeStyle=isActive?st.color:'rgba(120,152,168,.3)';
    S.ctx.lineWidth=isActive?3:1.5;
    S.ctx.stroke();
    S.ctx.fillStyle=isActive?st.color:'#7898a8';
    S.ctx.font='700 13px "Orbitron",monospace';
    S.ctx.textAlign='center';
    S.ctx.fillText(st.name,st.x,st.y+5);
  });
  /* Recent requests */
  var histY=cy+220;
  if(histY<S.H-60){
    c.history.slice(-30).forEach(function(h,i){
      var x=60+i*20;
      S.ctx.fillStyle=h.allowed?(h.success?'#00ff88':'#ffb000'):'#ff4444';
      S.ctx.fillRect(x,histY,16,30);
    });
  }
  /* Stats */
  var allowedCount=c.history.filter(function(h){return h.allowed}).length;
  var rejectedCount=c.history.length-allowedCount;
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('State: '+c.cb.state+' · Failures: '+c.cb.failures+'/'+c.cb.threshold,60,S.H-50);
  S.ctx.fillStyle='#7898a8';
  S.ctx.font='10px "JetBrains Mono",monospace';
  S.ctx.fillText('Requests: '+c.requests+' · Allowed: '+allowedCount+' · Rejected: '+rejectedCount,60,S.H-30);
};

/* ══════════════ Retries & Backoff ══════════════ */
R.retries=function(dt){
  clear();
  headline('Retries & Backoff','exponential with jitter');
  /* Plot backoff strategies */
  var padL=80,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=S.H-padT-padB-100;
  axes(padL,padT,plotW,plotH,'attempt','delay (ms)');
  var strategies=[
    {name:'fixed',color:'#7898a8',fn:function(i){return 1000}},
    {name:'linear',color:'#00d4ff',fn:function(i){return 1000*i}},
    {name:'exponential',color:'#00ff88',fn:function(i){return Math.min(30000,1000*Math.pow(2,i-1))}},
    {name:'exp + jitter',color:'#ffb000',fn:function(i){return Math.random()*Math.min(30000,1000*Math.pow(2,i-1))}},
    {name:'exp + full jitter',color:'#a855f7',fn:function(i){return Math.random()*Math.min(30000,500*Math.pow(2,i))}}
  ];
  strategies.forEach(function(s){
    S.ctx.strokeStyle=s.color;
    S.ctx.lineWidth=2;
    S.ctx.beginPath();
    for(var i=1;i<=8;i++){
      var delay=s.fn(i);
      var x=padL+((i-1)/7)*plotW;
      var y=padT+plotH-(delay/30000)*plotH*0.9;
      if(i===1)S.ctx.moveTo(x,y);
      else S.ctx.lineTo(x,y);
    }
    S.ctx.stroke();
    /* Legend */
    S.ctx.fillStyle=s.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    var li=strategies.indexOf(s);
    S.ctx.fillText('▪ '+s.name,padL+10+((li%3)*180),padT+20+Math.floor(li/3)*18);
  });
  /* Sample values */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('EXAMPLE DELAYS (attempts 1-5)',padL,S.H-140);
  var y=S.H-115;
  var samples=['fixed','linear','exponential','exp + jitter'];
  samples.forEach(function(name,si){
    var s=strategies.find(function(x){return x.name===name});
    S.ctx.fillStyle=s.color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(name+':',padL,y+si*20);
    for(var i=1;i<=5;i++){
      var d=s.fn(i);
      S.ctx.fillText(Math.round(d)+'ms',padL+120+(i-1)*90,y+si*20);
    }
  });
  /* Info */
  var infoX=S.W-280;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,80,260,260);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,80.5,259,259);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('BEST PRACTICES',infoX+15,100);
  var rows=[
    ['Retry idempotent ops only',''],
    ['Add jitter','prevent thundering herd'],
    ['Cap max delay','e.g. 30s'],
    ['Limit attempts','e.g. 5'],
    ['Retry budget','% of requests'],
    ['Backoff per method','GET vs POST'],
    ['----------',''],
    ['Full jitter','rand(0, 2^i * base)'],
    ['Equal jitter','half + rand(0, half)'],
    ['Decorrelated','rand(base, prev*3)']
  ];
  rows.forEach(function(r,i){
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(r[0],infoX+15,130+i*22);
    S.ctx.fillStyle='#5cffb0';
    S.ctx.fillText(r[1],infoX+15,146+i*22);
  });
};

/* ══════════════ Chaos Engineering ══════════════ */
R.chaos=function(dt){
  clear();
  headline('Chaos Engineering','fault injection');
  if(!S.sim.chaos){
    S.sim.chaos={
      faults:[],
      active:0
    };
  }
  var ch=S.sim.chaos;
  /* Random fault injection */
  if(Math.random()<0.03&&ch.faults.length<8){
    ch.faults.push({
      id:'f-'+Date.now(),
      fault:pick(CHAOS_FAULTS),
      target:pick(['pod-1','pod-2','node-1','service-a','service-b']),
      start:S.t,
      duration:rnd(3,8)
    });
    toast('Fault injected: '+ch.faults[ch.faults.length-1].fault.name,'rd');
  }
  /* Remove expired */
  ch.faults=ch.faults.filter(function(f){return S.t-f.start<f.duration});
  ch.active=ch.faults.length;
  /* Draw chaos grid */
  var padT=140;
  var cols=3;
  var cellW=(S.W-80)/cols;
  var cellH=90;
  CHAOS_FAULTS.forEach(function(fault,i){
    var col=i%cols,row=Math.floor(i/cols);
    var x=40+col*cellW;
    var y=padT+row*cellH;
    var active=ch.faults.some(function(f){return f.fault.name===fault.name});
    var color=active?'#ff4444':(fault.severity==='high'?'#ffb000':(fault.severity==='medium'?'#00d4ff':'#7898a8'));
    /* Card */
    S.ctx.fillStyle=color+'20';
    S.ctx.fillRect(x+5,y,cellW-20,cellH-10);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=active?3:1;
    S.ctx.strokeRect(x+5.5,y+.5,cellW-21,cellH-11);
    /* Name */
    S.ctx.fillStyle=color;
    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(fault.name,x+15,y+25);
    /* Details */
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText('target: '+fault.target,x+15,y+45);
    S.ctx.fillText('duration: '+fault.duration,x+15,y+60);
    S.ctx.fillText('severity: '+fault.severity,x+15,y+75);
    /* Active badge */
    if(active){
      S.ctx.fillStyle='#ff4444';
      S.ctx.font='700 10px "JetBrains Mono",monospace';
      S.ctx.textAlign='right';
      S.ctx.fillText('ACTIVE',x+cellW-25,y+25);
    }
  });
  /* Info */
  S.ctx.fillStyle='#ff8080';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ACTIVE FAULTS: '+ch.active,40,S.H-40);
};

/* ══════════════ Prometheus ══════════════ */
R.prometheus=function(dt){
  clear();
  headline('Prometheus','metrics & PromQL');
  if(!S.sim.prom){
    S.sim.prom={
      scrapes:[],
      time:0
    };
  }
  var pr=S.sim.prom;
  /* Generate metric series */
  if(S.t-S.sim.lastScrape>0.3){
    S.sim.lastScrape=S.t;
    pr.time++;
    pr.scrapes.push({
      time:pr.time,
      http_requests_total:100+pr.time*50+ri(-10,10),
      http_errors_total:5+pr.time*3+ri(-2,2),
      cpu_usage_pct:clamp(30+Math.sin(pr.time*0.2)*20+ri(-5,5),0,100),
      memory_bytes:8000000+Math.sin(pr.time*0.1)*500000,
      latency_p99_ms:120+Math.sin(pr.time*0.15)*40+ri(-10,10)
    });
    if(pr.scrapes.length>60)pr.scrapes.shift();
  }
  /* Plot metrics */
  var padL=60,padT=140,padR=40,padB=80;
  var plotW=S.W-padL-padR,plotH=(S.H-padT-padB-100)/2;
  var metrics=['http_requests_total','cpu_usage_pct','latency_p99_ms'];
  var colors=['#00ff88','#00d4ff','#ffb000'];
  metrics.forEach(function(metric,mi){
    var plotY=padT+mi*plotH;
    /* Frame */
    S.ctx.fillStyle='rgba(8,18,28,.5)';
    S.ctx.fillRect(padL,plotY,plotW,plotH-20);
    S.ctx.strokeStyle='rgba(0,255,136,.2)';
    S.ctx.strokeRect(padL+.5,plotY+.5,plotW-1,plotH-21);
    /* Metric name */
    S.ctx.fillStyle=colors[mi];
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(metric,padL+10,plotY+18);
    /* Plot */
    if(pr.scrapes.length>1){
      var maxV=0,minV=Infinity;
      pr.scrapes.forEach(function(s){
        if(s[metric]>maxV)maxV=s[metric];
        if(s[metric]<minV)minV=s[metric];
      });
      var range=maxV-minV||1;
      S.ctx.strokeStyle=colors[mi];
      S.ctx.lineWidth=1.5;
      S.ctx.beginPath();
      pr.scrapes.forEach(function(s,i){
        var x=padL+(i/pr.scrapes.length)*plotW;
        var y=plotY+plotH-20-((s[metric]-minV)/range)*(plotH-40)-10;
        if(i===0)S.ctx.moveTo(x,y);
        else S.ctx.lineTo(x,y);
      });
      S.ctx.stroke();
      /* Current value */
      var curr=pr.scrapes[pr.scrapes.length-1][metric];
      S.ctx.fillStyle=colors[mi];
      S.ctx.font='700 14px "Orbitron",monospace';
      S.ctx.textAlign='right';
      S.ctx.fillText(fmt(curr,0),padL+plotW-10,plotY+18);
    }
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,80,300,180);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,80.5,299,179);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('PROMQL EXAMPLES',infoX+15,100);
  var queries=[
    'rate(http_requests_total[5m])',
    'sum by (status) (http_errors_total)',
    'histogram_quantile(0.99, latency)',
    'avg_over_time(cpu_usage_pct[1h])',
    'increase(http_requests_total[1h])'
  ];
  queries.forEach(function(q,i){
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText(q,infoX+15,130+i*20);
  });
};

<script>

      S.ctx.strokeStyle='#00d4ff';
      S.ctx.lineWidth=1.5;
      S.ctx.beginPath();
      for(var i=0;i<=100;i++){
        var x=cx+(i/100)*cw;
        var y=cy+ch-((Math.sin(i*0.15+S.t*0.5)*0.3+0.5)+(Math.random()-0.5)*0.1)*ch;
        if(i===0)S.ctx.moveTo(x,y);
        else S.ctx.lineTo(x,y);
      }
      S.ctx.stroke();
    } else if(p.type==='gauge'){
      var val=Math.floor(5+Math.sin(S.t*0.3)*3);
      S.ctx.fillStyle='#00ff88';
      S.ctx.font='900 60px "Orbitron",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText(val,cx+cw/2,cy+ch/2+20);
    } else if(p.type==='heatmap'){
      for(var i=0;i<30;i++)for(var j=0;j<20;j++){
        var v=Math.sin(i*0.3+j*0.2+S.t)*0.5+0.5;
        S.ctx.fillStyle='rgba(255,176,0,'+v+')';
        S.ctx.fillRect(cx+i*(cw/30),cy+j*(ch/20),cw/30,ch/20);
      }
    }
  });
  /* Info */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 14px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('DASHBOARD: Production Overview',20,S.H-80);
};

R.tracing=function(dt){
  clear();
  headline('Distributed Tracing','span tree visualization');
  if(!S.sim.trace){
    var spans=[
      {id:'1',parent:null,name:'HTTP GET /api/checkout',service:'frontend',start:0,duration:180,kind:'SERVER'},
      {id:'2',parent:'1',name:'auth.validate',service:'auth',start:10,duration:20,kind:'CLIENT'},
      {id:'3',parent:'1',name:'cart.fetch',service:'cart',start:30,duration:40,kind:'CLIENT'},
      {id:'4',parent:'3',name:'db.query',service:'cart-db',start:35,duration:30,kind:'CLIENT'},
      {id:'5',parent:'1',name:'payment.charge',service:'payment',start:70,duration:90,kind:'CLIENT'},
      {id:'6',parent:'5',name:'stripe.api',service:'stripe',start:80,duration:70,kind:'CLIENT'},
      {id:'7',parent:'5',name:'db.insert',service:'payment-db',start:75,duration:60,kind:'CLIENT'},
      {id:'8',parent:'1',name:'email.send',service:'notification',start:160,duration:15,kind:'PRODUCER'}
    ];
    S.sim.trace={spans:spans};
  }
  var t=S.sim.trace;
  /* Draw span tree */
  var padL=80,padT=160;
  var rowH=32;
  var timeScale=(S.W-padL-100)/200; /* 200ms total */
  var colors={SERVER:'#00ff88',CLIENT:'#00d4ff',PRODUCER:'#a855f7',CONSUMER:'#ffb000',INTERNAL:'#7898a8'};
  t.spans.forEach(function(span,i){
    var y=padT+i*rowH;
    /* Find depth */
    var depth=0;
    var parent=span.parent;
    while(parent){
      depth++;
      var p=t.spans.find(function(s){return s.id===parent});
      if(!p)break;
      parent=p.parent;
    }
    /* Span bar */
    var x=padL+depth*30+span.start*timeScale;
    var w=span.duration*timeScale;
    var color=colors[span.kind]||'#7898a8';
    S.ctx.fillStyle=color+'40';
    S.ctx.fillRect(x,y,w,24);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=1.5;
    S.ctx.strokeRect(x+.5,y+.5,w-1,23);
    /* Span name */
    S.ctx.fillStyle=color;
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(span.name,x+8,y+16);
    /* Service */
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='9px "JetBrains Mono",monospace';
    S.ctx.fillText(span.service,padL-70+depth*30,y+16);
    /* Duration */
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.textAlign='right';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(span.duration+'ms',S.W-20,y+16);
  });
  /* Timeline */
  var tlY=padT+10*rowH+30;
  if(tlY<S.H-40){
    for(var i=0;i<=10;i++){
      var x=padL+i*timeScale*20;
      S.ctx.fillStyle='#7898a8';
      S.ctx.font='9px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText((i*20)+'ms',x,tlY);
      S.ctx.strokeStyle='rgba(120,152,168,.2)';
      S.ctx.beginPath();
      S.ctx.moveTo(x,tlY-20);
      S.ctx.lineTo(x,tlY-5);
      S.ctx.stroke();
    }
  }
  /* Legend */
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('SPAN KINDS',S.W-320,90);
  var kinds=['SERVER','CLIENT','PRODUCER','CONSUMER','INTERNAL'];
  kinds.forEach(function(k,i){
    S.ctx.fillStyle=colors[k];
    S.ctx.fillRect(S.W-320,110+i*20,12,12);
    S.ctx.fillStyle='#7898a8';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(k,S.W-300,120+i*20);
  });
};

R.alerts=function(dt){
  clear();
  headline('Alerting','rules & routing');
  if(!S.sim.alerts){
    S.sim.alerts={
      rules:[
        {name:'HighErrorRate',expr:'error_rate > 5',for:'5m',severity:'critical'},
        {name:'HighLatency',expr:'latency_p99 > 500',for:'10m',severity:'warning'},
        {name:'DiskSpaceLow',expr:'disk_free_pct < 10',for:'15m',severity:'warning'},
        {name:'PodCrash',expr:'pod_restarts > 3',for:'5m',severity:'critical'},
        {name:'HighCPU',expr:'cpu_usage > 80',for:'10m',severity:'warning'}
      ],
      metrics:{error_rate:3,latency_p99:400,disk_free_pct:25,pod_restarts:1,cpu_usage:65},
      firing:[]
    };
  }
  var a=S.sim.alerts;
  /* Update metrics */
  a.metrics.error_rate=clamp(a.metrics.error_rate+ri(-2,3),0,20);
  a.metrics.latency_p99=clamp(a.metrics.latency_p99+ri(-100,150),100,1500);
  a.metrics.disk_free_pct=clamp(a.metrics.disk_free_pct+ri(-3,2),0,100);
  a.metrics.pod_restarts=clamp(a.metrics.pod_restarts+ri(-1,1),0,10);
  a.metrics.cpu_usage=clamp(a.metrics.cpu_usage+ri(-10,12),0,100);
  /* Evaluate */
  a.firing=[];
  a.rules.forEach(function(rule){
    var result=evaluateAlert(rule,a.metrics);
    if(result.firing){
      a.firing.push({rule:rule,value:result.value});
    }
  });
  /* Draw rules */
  var padT=140;
  var rowH=60;
  a.rules.forEach(function(rule,i){
    var y=padT+i*rowH;
    var firing=a.firing.some(function(f){return f.rule.name===rule.name});
    var color=rule.severity==='critical'?'#ff4444':'#ffb000';
    /* Rule card */
    S.ctx.fillStyle=firing?color+'30':'rgba(8,18,28,.7)';
    S.ctx.fillRect(40,y,S.W-80,rowH-8);
    S.ctx.strokeStyle=firing?color:'rgba(120,152,168,.3)';
    S.ctx.lineWidth=firing?2:1;
    S.ctx.strokeRect(40.5,y+.5,S.W-81,rowH-9);

    S.ctx.font='700 12px "Orbitron",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(rule.name,60,y+25);
    /* Expr */
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(rule.expr,60,y+42);
    /* For duration */
    S.ctx.fillStyle='#7898a8';
    S.ctx.fillText('for: '+rule.for,300,y+42);
    /* Severity badge */
    S.ctx.fillStyle=color;
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(rule.severity.toUpperCase(),S.W-60,y+25);
    /* Status */
    S.ctx.fillStyle=firing?color:'#7898a8';
    S.ctx.font='700 11px "JetBrains Mono",monospace';
    S.ctx.fillText(firing?'FIRING':'inactive',S.W-60,y+45);
    S.ctx.textAlign='left';
  });
  /* Info */
  var infoX=S.W-320;
  S.ctx.fillStyle='rgba(8,18,28,.9)';
  S.ctx.fillRect(infoX,S.H-140,300,100);
  S.ctx.strokeStyle='#00ff88';
  S.ctx.strokeRect(infoX+.5,S.H-139.5,299,99);
  S.ctx.fillStyle='#5cffb0';
  S.ctx.font='700 12px "JetBrains Mono",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('ALERTING PIPELINE',infoX+15,S.H-120);
  var stages=['Metrics → Rules','→ Alerts','→ Alertmanager','→ Route → Notify'];
  stages.forEach(function(s,i){
    S.ctx.fillStyle='#5ce5ff';
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(s,infoX+15,S.H-95+i*18);
  });
};

R.slo=function(dt){

/* ══════════════ SBOM ══════════════ */
R.sbom=function(dt){
  clear();
  headline('SBOM & Vulnerability Scanning','supply chain security');
  if(!S.sim.sbom){
    var packages=[
      {name:'lodash',version:'4.17.19',cves:['CVE-2020-8203'],severity:'high'},
      {name:'axios',version:'0.21.0',cves:['CVE-2020-28168'],severity:'medium'},
      {name:'minimist',version:'1.2.5',cves:['CVE-2021-44906'],severity:'critical'},
      {name:'express',version:'4.17.1',cves:[],severity:'none'},
      {name:'react',version:'17.0.2',cves:[],severity:'none'},
      {name:'node-fetch',version:'2.6.0',cves:['CVE-2022-0235'],severity:'medium'},
      {name:'json5',version:'2.1.3',cves:['CVE-2022-46175'],severity:'high'}
    ];
    S.sim.sbom={packages:packages};
  }
  var sb=S.sim.sbom;
  var padT=140;
  sb.packages.forEach(function(pkg,i){
    var y=padT+i*40;
    var color=pkg.severity==='critical'?'#ff4444':(pkg.severity==='high'?'#ff8080':(pkg.severity==='medium'?'#ffb000':'#00ff88'));
    S.ctx.fillStyle='rgba(8,18,28,.8)';
    S.ctx.fillRect(40,y,S.W-80,35);
    S.ctx.strokeStyle=color;
    S.ctx.lineWidth=1;
    S.ctx.strokeRect(40.5,y+.5,S.W-81,34);
    /* Package */
    S.ctx.fillStyle='#5cffb0';
    S.ctx.font='700 12px "JetBrains Mono",monospace';
    S.ctx.textAlign='left';
    S.ctx.fillText(pkg.name+'@'+pkg.version,60,y+22);
    /* CVEs */
    S.ctx.fillStyle=color;
    S.ctx.font='10px "JetBrains Mono",monospace';
    S.ctx.fillText(pkg.cves.length?pkg.cves.join(', '):'no vulnerabilities',300,y+22);
    /* Severity */
    S.ctx.fillStyle=color;
    S.ctx.font='700 10px "JetBrains Mono",monospace';
    S.ctx.textAlign='right';
    S.ctx.fillText(pkg.severity.toUpperCase(),S.W-60,y+22);
  });
  /* Summary */
  var critical=sb.packages.filter(function(p){return p.severity==='critical'}).length;
  var high=sb.packages.filter(function(p){return p.severity==='high'}).length;
  var clean=sb.packages.filter(function(p){return p.cves.length===0}).length;
  S.ctx.fillStyle='#ff8080';
  S.ctx.font='700 12px "Orbitron",monospace';
  S.ctx.textAlign='left';
  S.ctx.fillText('SUMMARY: '+critical+' critical · '+high+' high · '+clean+' clean',40,S.H-50);
};

/* ══════════════ Info panel ══════════════ */
function renderInfo(){
  var body=$('infoBody');
  var id=S.module;
  var html='';
  if(id==='dashboard'){
    html+='<div class="sec-head">System</div>';
    html+=prop('Modules',MODULES.length,'gr');
    html+=prop('K8s resources',K8S_RESOURCES.length,'cy');
    html+=prop('Cloud services',Object.keys(CLOUD_SERVICES).reduce(function(s,k){return s+CLOUD_SERVICES[k].length},0),'am');
    html+='<div class="sec-head">Capabilities</div>';
    html+='<div class="hint">Real DevOps engineering:<br>• Kubernetes scheduler scoring<br>• Rolling update simulation<br>• Consistent hash ring (murmur3)<br>• Token/Leaky/Sliding rate limiters<br>• Circuit breaker state machine<br>• Exponential backoff + jitter<br>• CIDR calculator (bitwise)<br>• Semver comparison<br>• Cron expression parser<br>• Docker layer caching<br>• Ansible idempotency engine<br>• Terraform plan diff<br>• Prometheus metric parser<br>• DNS resolution chain<br>• Error budget & burn rate<br>• Load balancer algorithms</div>';
  }
  else if(id==='dockerfile'){
    html+='<div class="sec-head">Dockerfile</div>';
    html+='<div class="hint">Multi-stage builds separate build-time dependencies from runtime, dramatically reducing image size.<br><br>Order matters: place stable layers (package installs) before volatile ones (COPY source) for optimal caching.</div>';
  }
  else if(id==='layers'){
    html+='<div class="sec-head">Layer caching</div>';
    html+='<div class="hint">Each Dockerfile instruction creates a layer. When an instruction\'s inputs change, its cache is invalidated along with all subsequent layers.<br><br>Layers are content-addressable: identical instructions produce identical layer hashes.</div>';
  }
  else if(id==='k8sDeploy'){
    var k=S.sim.k8sD||{desired:6,maxSurge:2,maxUnavail:1};

function prop(k,v,cls){

}

/* ══════════════ Interactions ══════════════ */
function bindInteractions(){
  S.cv.addEventListener('click',function(e){
    var r=S.cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    var mod=S.module;
    var btnSets=[
      {id:'containerNet',key:'cnetBtns',prop:'mode',set:S.sim.cnet},
      {id:'k8sService',key:'k8sSBtns',prop:'type',set:S.sim.k8sS},
      {id:'gitFlow',key:'gitBtns',prop:'strategy',set:S.sim.git},
      {id:'loadBalancer',key:'lbBtns',prop:'algorithm',set:S.sim.lb},
      {id:'dns',key:'dnsBtns',prop:'query',set:S.sim.dns},
      {id:'cidr',key:'cidrBtns',prop:'input',set:S.sim.cidr},
      {id:'rateLimit',key:'rlBtns',prop:'algorithm',set:S.sim.rl}
    ];
    btnSets.forEach(function(bs){
      if(mod!==bs.id||!S.sim[bs.key])return;
      S.sim[bs.key].forEach(function(b){
        if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
          if(bs.set&&bs.prop)bs.set[bs.prop]=b.k;
          toast(bs.prop+': '+b.k,'gr');
        }
      });
    });
  });
  document.addEventListener('keydown',function(e){
    var t=(e.target.tagName||'').toLowerCase();
    if(t==='input'||t==='textarea')return;
    if(e.key==='/'){e.preventDefault();var sb=document.querySelector('.nav-search input');if(sb)sb.focus()}
    else if(e.key==='Escape'){var sb2=document.querySelector('.nav-search input');if(sb2){sb2.blur();sb2.value='';buildNav()}}
    else if(e.key==='r'||e.key==='R'){
      if(S.module==='md'||S.module==='k8sDeploy'){S.sim.k8sD={desired:6,maxSurge:2,maxUnavail:1,tl:null,step:0,running:true}}
      if(S.module==='chaos')S.sim.chaos={faults:[]};
    }
    else if(e.key>='1'&&e.key<='9'){
      var idx=parseInt(e.key)-1;
      if(MODULES[idx])switchModule(MODULES[idx].id);
    }
  });
  var searchBox=el('div',{class:'nav-search'});
  var searchInput=el('input',{placeholder:'search modules…',type:'text'});
  bindSearch(searchInput);
  var nav=$('nav');
  nav.insertBefore(searchBox,nav.firstChild);
  searchBox.appendChild(searchInput);
}
function bindSearch(searchInput){
  searchInput.addEventListener('input',function(){
    var q=this.value.toLowerCase().trim();
    var nav=$('nav');
    nav.innerHTML='';
    if(!q){
      buildNav();
      var nav2=$('nav');
      var sb2=el('div',{class:'nav-search'});
      var si=el('input',{placeholder:'search modules…',type:'text'});
      bindSearch(si);
      sb2.appendChild(si);
      nav2.insertBefore(sb2,nav2.firstChild);
      return;
    }
    var matches=MODULES.filter(function(m){
      return m.name.toLowerCase().indexOf(q)>=0||m.sub.toLowerCase().indexOf(q)>=0||m.cat.toLowerCase().indexOf(q)>=0;
    });
    matches.forEach(function(m){
      var item=el('div',{class:'nav-item'+(m.id===S.module?' active':''),'data-id':m.id});
      item.innerHTML='<span class="ico">'+m.icon+'</span><span>'+m.name+'</span>';
      item.onclick=function(){switchModule(m.id)};
      nav.appendChild(item);
    });
  });
}

function renderModule(){
  var r=R[S.module];
  if(r)r(0);
}

var lastFrame=performance.now();
function loop(now){
  var dt=Math.min((now-lastFrame)/1000,0.1);
  lastFrame=now;
  S.t+=dt;S.dt=dt;
  var r=R[S.module];
  if(r){
    try{r(dt)}catch(e){
      console.error(e);
      S.ctx.fillStyle='#02060a';
      S.ctx.fillRect(0,0,S.W,S.H);
      S.ctx.fillStyle='#ff4444';
      S.ctx.font='14px "JetBrains Mono",monospace';
      S.ctx.textAlign='center';
      S.ctx.fillText('Module error: '+e.message,S.W/2,S.H/2);
    }
  }
  requestAnimationFrame(loop);
}

function boot(){
  var stages=[
    {msg:'bootstrap cluster…',pct:10},
    {msg:'pulling container images…',pct:25},
    {msg:'applying terraform state…',pct:40},
    {msg:'starting control plane…',pct:55},
    {msg:'subscribing to prometheus…',pct:70},
    {msg:'ready',pct:100}
  ];
  var i=0;
  function next(){
    if(i>=stages.length){
      setTimeout(function(){
        $('boot').classList.add('done');
        setTimeout(function(){$('boot').style.display='none'},600);
      },200);
      return;
    }
    var s=stages[i++];
    $('bootStatus').textContent=s.msg;
    $('bootFill').style.width=s.pct+'%';
    setTimeout(next,180);
  }
  setTimeout(next,200);
}

function init(){
  initCanvas();
  buildNav();
  bindInteractions();
  switchModule('dashboard');
  boot();
  requestAnimationFrame(loop);
  console.log('%c DEVOPS ','background:linear-gradient(90deg,#00ff88,#00d4ff);color:#02060a;padding:10px 22px;border-radius:4px;font-weight:900;font-size:15px;letter-spacing:5px');
  console.log('DevOps & Cloud Infrastructure Workbench · '+MODULES.length+' modules');
  console.log('K8s · Docker · CI/CD · IaC · Observability · SRE');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
