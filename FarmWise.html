<!DOCTYPE html>
<html lang="en" data-theme="farm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a1408">
<title>FARMWISE — Precision Agriculture OS</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:14px;height:100%}
body{
  height:100vh;width:100vw;overflow:hidden;
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  color:var(--tx);background:var(--bg);
  -webkit-font-smoothing:antialiased;user-select:none;
}
img,svg{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
a{text-decoration:none;color:inherit}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
canvas{display:block}
::selection{background:var(--c1);color:#000}

:root{
  --bg:#0a1408;--bg2:#0f1c0d;--bg3:#152414;--bg4:#1d301c;
  --panel:#101c0e;--panel2:#182818;--panel3:#1f3420;--panel4:#2a4428;
  --bd:#1f3420;--bd2:#2e4e30;--bd3:#426a44;
  --tx:#e8f5e0;--tx2:#a8c8a0;--tx3:#708868;--mu:#486050;
  --c1:#00d97e;--c1h:#4dffa8;--c1l:#00a860;
  --c2:#f0b429;--c2h:#ffd05c;--c2l:#b88810;
  --c3:#4a90d9;--c3h:#7db3ec;--c3l:#3268a8;
  --c4:#e85a3b;--c4h:#ff8058;--c4l:#b83f28;
  --c5:#a855f7;--c5h:#d0a0ff;--c5l:#8033cc;
  --c6:#f4a261;--c6h:#ffc088;--c6l:#c87a3e;
  --c7:#8fb339;--c7h:#b3d060;--c7l:#6a8828;
  --c8:#d97757;--c8h:#f0a088;--c8l:#a85838;
  --ok:#00d97e;--warn:#f0b429;--err:#e85a3b;--info:#4a90d9;
  --critical:#e85a3b;--urgent:#f4a261;--attention:#f0b429;
  --safe:#00d97e;--medium:#4a90d9;
  --g1:linear-gradient(135deg,#00d97e,#4a90d9);
  --g2:linear-gradient(135deg,#f0b429,#e85a3b);
  --g3:linear-gradient(135deg,#00d97e,#f0b429);
  --g4:linear-gradient(135deg,#8fb339,#00d97e);
  --g5:linear-gradient(135deg,#a855f7,#e85a3b);
  --gHolo:linear-gradient(120deg,#00d97e,#4a90d9,#a855f7,#f0b429,#e85a3b,#00d97e);
  --r:10px;--rs:7px;--rxs:5px;--rxxs:3px;--rf:9999px;
  --sh1:0 2px 8px rgba(0,0,0,.6);
  --sh2:0 4px 16px rgba(0,0,0,.75);
  --sh3:0 8px 32px rgba(0,0,0,.85);
  --shGlow:0 0 24px rgba(0,217,126,.35);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --t:all .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f5f7f2;--bg2:#ecf0e6;--bg3:#dde3d4;--bg4:#c8d1be;
  --panel:#ffffff;--panel2:#f0f4ea;--panel3:#e0e8d8;--panel4:#c8d4bc;
  --bd:#d4dccc;--bd2:#a8b89c;--bd3:#7a8a70;
  --tx:#0a1410;--tx2:#3a4a30;--tx3:#5a6a50;--mu:#8090a0;
  --c1:#00a860;--c1h:#00c878;--c1l:#006838;
  --sh1:0 1px 3px rgba(0,0,0,.08);
  --sh2:0 4px 12px rgba(0,0,0,.12);
  --sh3:0 8px 32px rgba(0,0,0,.18);
}
[data-theme="autumn"]{
  --bg:#1a0e08;--bg2:#241408;--bg3:#321a0c;--bg4:#442412;
  --panel:#1e1208;--panel2:#321a0c;--panel3:#442412;--panel4:#5a3018;
  --bd:#442412;--bd2:#6a3820;--bd3:#8a5030;
  --tx:#ffe8d0;--tx2:#d8b088;--tx3:#a07858;--mu:#705038;
  --c1:#e8a020;--c1h:#ffc050;--c1l:#b87818;
  --c2:#d94520;--c2h:#f07050;--c2l:#a83018;
}
[data-theme="forest"]{
  --bg:#051208;--bg2:#0a1e10;--bg3:#102816;--bg4:#183820;
  --panel:#08180c;--panel2:#102816;--panel3:#183820;--panel4:#204a28;
  --bd:#183820;--bd2:#285030;--bd3:#3c7040;
  --tx:#c8f0d0;--tx2:#88c898;--tx3:#508868;--mu:#386848;
  --c1:#00ff88;--c1h:#80ffc0;--c1l:#00cc68;
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box;border:2px solid transparent}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;
}
.sb-head{
  padding:14px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;
  background:var(--g3);display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;box-shadow:var(--shGlow);
}
.sb-title{
  font-weight:800;font-size:.98rem;letter-spacing:1.5px;line-height:1;
  background:var(--g3);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
}
.sb-sub{font-size:.52rem;color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-farm{
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.farm-name{font-size:.78rem;font-weight:700;color:var(--tx)}
.farm-meta{font-size:.62rem;color:var(--tx3);margin-top:2px;display:flex;gap:8px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 8px}
.sb-cat{
  font-size:.55rem;font-weight:700;color:var(--tx3);
  letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:var(--rxs);
  color:var(--tx2);font-size:.76rem;font-weight:500;
  cursor:pointer;transition:var(--t);margin-bottom:1px;
}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:var(--g1);color:#000;font-weight:700;box-shadow:0 4px 12px rgba(0,217,126,.35)}
.nav-item .ni-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.nav-item .ni-badge{
  margin-left:auto;font-size:.55rem;font-weight:700;
  padding:1px 6px;border-radius:var(--rf);
  background:var(--c2);color:#000;
  min-width:16px;text-align:center;font-family:var(--mono);
}
.nav-item.active .ni-badge{background:rgba(0,0,0,.3);color:#fff}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  height:54px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.tb-menu{
  display:none;width:34px;height:34px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center;
}
.tb-title{font-weight:700;font-size:.98rem;flex-shrink:0}
.tb-sub{font-size:.62rem;color:var(--tx3);margin-left:8px;font-weight:500}
.tb-actions{display:flex;gap:5px;align-items:center;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border-radius:var(--rxs);
  background:transparent;border:none;color:var(--tx2);
  cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:var(--t);position:relative;
}
.icon-btn:hover{background:var(--panel2);color:var(--tx)}
.icon-btn .badge{
  position:absolute;top:4px;right:4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--c2);color:#000;border-radius:var(--rf);
  font-size:.55rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.page{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:12px;
}
.page-title{font-size:1.35rem;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-title .ic{
  width:34px;height:34px;border-radius:9px;background:var(--g3);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 4px 12px rgba(0,217,126,.35);
}
.page-desc{font-size:.72rem;color:var(--tx3);margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--rxs);
  border:1px solid var(--bd2);background:var(--panel2);
  color:var(--tx);font-size:.74rem;font-weight:600;
  cursor:pointer;transition:var(--t);white-space:nowrap;
}
.btn:hover{background:var(--panel3);border-color:var(--c1);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--g1);color:#000;border-color:transparent;font-weight:700}
.btn.primary:hover{box-shadow:0 4px 16px rgba(0,217,126,.4)}
.btn.warn{background:var(--c2);color:#000;border-color:transparent}
.btn.danger{background:var(--c4);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:5px 10px;font-size:.68rem}
.btn.xs{padding:3px 8px;font-size:.62rem}
.btn.lg{padding:11px 20px;font-size:.85rem}
.btn.icon-only{padding:8px;width:34px;height:34px}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh1);
}
.card.pad-lg{padding:22px}
.card.pad-sm{padding:11px}
.card.glow{border-color:var(--c1);box-shadow:var(--shGlow),var(--sh1)}

.kpi-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:18px;
}
.kpi{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;transition:var(--t);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--g1);
}
.kpi.gold::before{background:var(--g2)}
.kpi.blue::before{background:linear-gradient(135deg,#4a90d9,#a855f7)}
.kpi.terra::before{background:var(--g5)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi-label{
  font-size:.6rem;color:var(--tx3);font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px;
}
.kpi-value{
  font-size:1.5rem;font-weight:800;
  font-family:var(--mono);line-height:1.1;color:var(--tx);
}
.kpi-value.critical{color:var(--c4)}
.kpi-value.warn{color:var(--c2)}
.kpi-value.safe{color:var(--c1)}
.kpi-hint{font-size:.66rem;color:var(--tx3);margin-top:6px;line-height:1.4}
.kpi-delta{
  font-size:.66rem;font-weight:600;margin-top:6px;
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 6px;border-radius:var(--rf);
}
.kpi-delta.up{background:rgba(0,217,126,.15);color:var(--c1)}
.kpi-delta.down{background:rgba(232,90,59,.15);color:var(--c4)}
.kpi-delta.neutral{background:var(--panel3);color:var(--tx3)}

.table-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);
  gap:12px;flex-wrap:wrap;
}
.table-head h3{font-size:.9rem;font-weight:700}
.table-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;font-size:.76rem}
thead{background:var(--panel2);position:sticky;top:0;z-index:1}
th{
  padding:10px 14px;text-align:left;
  font-size:.6rem;font-weight:700;
  color:var(--tx3);text-transform:uppercase;
  letter-spacing:.7px;white-space:nowrap;
  border-bottom:1px solid var(--bd);
}
td{padding:11px 14px;border-bottom:1px solid var(--bd);color:var(--tx);vertical-align:middle}
tbody tr{transition:var(--t)}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.actions{white-space:nowrap;text-align:right}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--rf);
  font-size:.62rem;font-weight:700;white-space:nowrap;
}
.badge.critical{background:rgba(232,90,59,.18);color:var(--critical);border:1px solid rgba(232,90,59,.35)}
.badge.urgent{background:rgba(244,162,97,.18);color:var(--urgent);border:1px solid rgba(244,162,97,.35)}
.badge.attention{background:rgba(240,180,41,.18);color:var(--attention);border:1px solid rgba(240,180,41,.35)}
.badge.safe{background:rgba(0,217,126,.18);color:var(--safe);border:1px solid rgba(0,217,126,.35)}
.badge.info{background:rgba(74,144,217,.18);color:var(--info);border:1px solid rgba(74,144,217,.35)}
.badge.neutral{background:var(--panel3);color:var(--tx3)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-size:.64rem;font-weight:700;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.5px;
}
.field label .req{color:var(--c4);margin-left:3px}
.field label .hint{color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0;font-size:.65rem;margin-left:6px}
.field input,.field select,.field textarea{
  padding:9px 12px;border-radius:var(--rxs);
  border:1px solid var(--bd);background:var(--bg2);
  color:var(--tx);font-size:.76rem;transition:var(--t);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,217,126,.15);
}
.field textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.5}
.field small{font-size:.63rem;color:var(--tx3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row.three{grid-template-columns:1fr 1fr 1fr;gap:12px}
.field-row.four{grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

.modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.8);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--panel);border:1px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--sh3);
  max-width:640px;width:100%;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;
  animation:modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
.modal-box.wide{max-width:960px}
.modal-box.narrow{max-width:440px}
@keyframes modalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.modal-head h2{font-size:.95rem;font-weight:700}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-foot{
  padding:14px 18px;border-top:1px solid var(--bd);
  display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap;
}

.toast-container{
  position:fixed;bottom:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:11px 16px;border-radius:var(--rxs);
  background:var(--panel);border:1px solid var(--bd2);
  border-left:3px solid var(--info);box-shadow:var(--sh3);
  font-size:.72rem;font-weight:500;max-width:340px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:auto;display:flex;align-items:center;gap:10px;
}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--info)}
.toast .t-icon{font-size:1rem;flex-shrink:0}
.toast.leaving{opacity:0;transform:translateX(110%);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(110%)}to{opacity:1;transform:translateX(0)}}

.chart-box{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:12px}
.chart-canvas{width:100%;height:220px;display:block}
.chart-legend{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;
  font-size:.68rem;color:var(--tx2);
}
.chart-legend .li{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:10px;height:10px;border-radius:2px}

.empty{
  text-align:center;padding:44px 20px;color:var(--tx3);font-size:.78rem;
}
.empty .icon{font-size:2.4rem;margin-bottom:10px;opacity:.4;display:block}
.empty h4{font-size:.85rem;color:var(--tx2);margin-bottom:5px;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:4px 10px;border-radius:var(--rf);
  background:var(--panel2);border:1px solid var(--bd);
  font-size:.66rem;font-weight:600;color:var(--tx2);
  cursor:pointer;transition:var(--t);
}
.chip:hover{background:var(--panel3);color:var(--tx)}
.chip.active{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}

.divider{height:1px;background:var(--bd);margin:14px 0}

.stat-line{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bd);
  font-size:.74rem;gap:10px;
}
.stat-line:last-child{border-bottom:none}
.stat-line .sl-label{color:var(--tx2)}
.stat-line .sl-value{font-family:var(--mono);font-weight:700;text-align:right}
.stat-line .sl-value.pos{color:var(--c1)}
.stat-line .sl-value.neg{color:var(--c4)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:14px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.entity-card{
  background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r);padding:16px;
  cursor:pointer;transition:var(--t);
  position:relative;overflow:hidden;
}
.entity-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--c1)}
.entity-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;bottom:0;
  background:var(--c1);
}
.entity-card.gold::before{background:var(--c2)}
.entity-card.terra::before{background:var(--c4)}
.entity-card.purple::before{background:var(--c5)}
.entity-card.blue::before{background:var(--c3)}
.ec-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px}
.ec-title{font-weight:700;font-size:.88rem;line-height:1.3;color:var(--tx)}
.ec-meta{font-size:.66rem;color:var(--tx3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.ec-desc{font-size:.74rem;color:var(--tx2);line-height:1.55;margin-bottom:12px;flex:1}
.ec-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;border-top:1px solid var(--bd);
  font-size:.66rem;color:var(--tx3);gap:8px;flex-wrap:wrap;
}

.progress{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--g1);transition:width .5s;border-radius:4px}
.progress-fill.warn{background:var(--g2)}

.mono{font-family:var(--mono)}
.center{text-align:center}

<script>
"use strict";

function $(id){return document.getElementById(id)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){
  var e=document.createElement(t);
  if(a)for(var k in a){
    if(k==='class')e.className=a[k];
    else if(k==='style'&&typeof a[k]==='object')Object.assign(e.style,a[k]);
    else if(k==='text')e.textContent=a[k];
    else if(k==='html')e.innerHTML=a[k];
    else if(k.indexOf('on')===0)e[k]=a[k];
    else e.setAttribute(k,a[k]);
  }
  if(c){
    if(typeof c==='string')e.innerHTML=c;
    else if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});
    else e.appendChild(c);
  }
  return e;
}
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid(p){return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtDateTime(iso){
  if(!iso)return '—';
  var d=new Date(iso);if(isNaN(d))return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  if(!iso)return '—';
  var s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function addDays(iso,n){var d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function lastNDays(n){var a=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);a.push(d.toISOString().slice(0,10))}return a}
function monthStart(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10)}
function yearStart(){return new Date().getFullYear()+'-01-01'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function safeInt(v,d){var n=parseInt(v);return isNaN(n)?(d||0):n}
function safeFloat(v,d){var n=parseFloat(v);return isNaN(n)?(d||0):n}
function fmtMoney(n){
  n=Number(n)||0;
  var neg=n<0;n=Math.abs(n);
  return (neg?'-':'$')+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function fmtNum(n){
  n=Number(n)||0;
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function fmtArea(acres){
  return (Number(acres)||0).toFixed(2)+' ac';
}

function toast(msg,type){
  type=type||'info';
  var icons={success:'✓',error:'✕',warn:'⚠',info:'ℹ'};
  var t2=el('div',{class:'toast '+type});
  t2.innerHTML='<span class="t-icon">'+(icons[type]||'•')+'</span><span>'+esc(msg)+'</span>';
  $('toasts').appendChild(t2);
  setTimeout(function(){
    t2.classList.add('leaving');
    setTimeout(function(){t2.remove()},320);
  },2800);
}

function openModal(o){
  o=o||{};
  var box=$('modalBox');
  box.className='modal-box'+(o.wide?' wide':'')+(o.narrow?' narrow':'');
  $('modalTitle').textContent=o.title||'';
  $('modalBody').innerHTML=o.body||'';
  $('modalFoot').innerHTML=o.foot||'<button class="btn" onclick="closeModal()">Close</button>';
  $('modal').classList.add('open');
  if(o.onOpen)setTimeout(o.onOpen,20);
}
function closeModal(){$('modal').classList.remove('open')}
function confirmDialog(title,msg,fn,danger){
  openModal({
    title:title,narrow:true,
    body:'<p style="color:var(--tx2);line-height:1.6;font-size:.82rem">'+esc(msg)+'</p>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn '+(danger?'danger':'primary')+'" id="confirmYes">Confirm</button>',
    onOpen:function(){$('confirmYes').onclick=function(){closeModal();fn()}}
  });
}
function promptDialog(title,label,defaultVal,onOk,type){
  openModal({
    title:title,narrow:true,
    body:'<div class="field"><label>'+esc(label)+'</label>'+
         '<input type="'+(type||'text')+'" id="promptInput" value="'+esc(defaultVal||'')+'"></div>',
    foot:'<button class="btn" onclick="closeModal()">Cancel</button>'+
         '<button class="btn primary" id="promptOk">OK</button>',
    onOpen:function(){
      var inp=$('promptInput');inp.focus();inp.select();
      var go=function(){closeModal();onOk(inp.value)};
      $('promptOk').onclick=go;
      inp.onkeydown=function(e){if(e.key==='Enter')go()};
    }
  });
}

  sales:[],         // revenue from sales
  tasks:[],         // to-dos
  weather:[],       // weather log
  pests:[],         // pest & disease sightings
  irrigation:[],    // irrigation events
  activity:[]
};

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(State))}
  catch(e){toast('Save failed','error')}
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var d=JSON.parse(raw);
    Object.keys(State).forEach(function(k){if(d[k]!==undefined)State[k]=d[k]});
    return true;
  }catch(e){return false}
}
function logActivity(type,desc){
  State.activity.unshift({id:uid('a'),type:type,desc:desc,ts:nowISO()});
  if(State.activity.length>300)State.activity=State.activity.slice(0,300);
}

var CurrentRoute='dashboard';

function navigate(route){
  if(!ROUTES[route])route='dashboard';
  CurrentRoute=route;
  var r=ROUTES[route];
  $('tbTitle').textContent=r.title;
  $('tbSub').textContent=r.sub;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var nav=$('sbNav');
  if(!nav)return;
  var cats={};
  Object.keys(ROUTES).forEach(function(r){
    var r2=ROUTES[r];
    if(!cats[r2.cat])cats[r2.cat]=[];
    cats[r2.cat].push({route:r,meta:r2});
  });
  var order=['Overview','Land','Animals','Operations','Products','Environment','Analysis','System'];
  var html='';
  order.forEach(function(cat){
    if(!cats[cat])return;
    html+='<div class="sb-cat">'+esc(cat)+'</div>';
    cats[cat].forEach(function(item){
      var badge='';
      var r=item.route;
      if(r==='alerts'){
        var c=getAlertCount();
        if(c>0)badge='<span class="ni-badge">'+c+'</span>';
      }else if(r==='tasks'){
        var t=State.tasks.filter(function(x){return x.status==='open'&&x.due&&x.due<=addDays(today(),3)}).length;
        if(t>0)badge='<span class="ni-badge">'+t+'</span>';
      }else if(r==='inventory'){
        var low=State.inventory.filter(function(x){return x.quantity<=x.minStock}).length;
        if(low>0)badge='<span class="ni-badge">'+low+'</span>';
      }else if(r==='pests'){
        var p=State.pests.filter(function(x){return !x.resolved}).length;
        if(p>0)badge='<span class="ni-badge">'+p+'</span>';
      }
      html+='<div class="nav-item'+(item.route===CurrentRoute?' active':'')+'" onclick="navigate(\''+item.route+'\')">'+
            '<span class="ni-icon">'+item.meta.icon+'</span>'+
            '<span>'+esc(item.meta.title)+'</span>'+badge+'</div>';
    });
  });
  nav.innerHTML=html;
  updateSbFarm();
}

function findField(id){return State.fields.find(function(f){return f.id===id})}
function findCrop(id){return State.crops.find(function(c){return c.id===id})}
function findAnimal(id){return State.livestock.find(function(a){return a.id===id})}
function findEquipment(id){return State.equipment.find(function(e){return e.id===id})}

function fieldName(id){var f=findField(id);return f?f.name:'—'}
function cropName(id){var c=findCrop(id);return c?c.name:'—'}

function totalRevenue(){return State.sales.reduce(function(s,x){return s+x.total},0)}
function totalExpenses(){return State.expenses.reduce(function(s,x){return s+x.amount},0)}
function netProfit(){return totalRevenue()-totalExpenses()}

function fieldRevenue(fieldId){
  return State.harvests.filter(function(h){return h.fieldId===fieldId}).reduce(function(s,h){return s+(h.revenue||0)},0);
}
function cropRevenue(cropId){
  return State.harvests.filter(function(h){return h.cropId===cropId}).reduce(function(s,h){return s+(h.revenue||0)},0);
}
function fieldYield(fieldId){
  return State.harvests.filter(function(h){return h.fieldId===fieldId}).reduce(function(s,h){return s+(h.quantity||0)},0);
}
function cropYield(cropId){
  return State.harvests.filter(function(h){return h.cropId===cropId}).reduce(function(s,h){return s+(h.quantity||0)},0);
}

function getAlerts(){
  var alerts=[];
  // Low inventory
  State.inventory.forEach(function(i){
    if(i.quantity<=i.minStock){
      alerts.push({type:i.quantity===0?'critical':'urgent',icon:'📦',title:i.name+' low stock',msg:i.quantity+' '+i.unit+' remaining (min: '+i.minStock+')',route:'inventory'});
    }
  });
  // Overdue tasks
  State.tasks.forEach(function(t){
    if(t.status==='open'&&t.due&&t.due<today()){
      alerts.push({type:'urgent',icon:'⏰',title:'Overdue task',msg:t.title,route:'tasks'});
    }
  });
  // Equipment needing repair
  State.equipment.filter(function(e){return e.status==='needs_repair'}).forEach(function(e){
    alerts.push({type:'urgent',icon:'🔧',title:e.name+' needs repair',msg:e.notes||'Flagged for repair',route:'equipment'});
  });
  // Unresolved pests
  State.pests.filter(function(p){return !p.resolved}).forEach(function(p){
    alerts.push({type:'urgent',icon:'🐛',title:p.pest+' in '+fieldName(p.fieldId),msg:'Severity: '+p.severity,route:'pests'});
  });
  // Maintenance due
  State.maintenance.forEach(function(m){
    if(m.nextDue&&m.nextDue<=addDays(today(),7)){
      var eq=findEquipment(m.equipmentId);
      var d=daysBetween(today(),m.nextDue);
      if(d<0)alerts.push({type:'urgent',icon:'🔧',title:(eq?eq.name:'Equipment')+' maintenance overdue',msg:m.type+' was due '+Math.abs(d)+'d ago',route:'maintenance'});
      else alerts.push({type:'attention',icon:'🔧',title:(eq?eq.name:'Equipment')+' maintenance due',msg:m.type+' in '+d+'d',route:'maintenance'});
    }
  });
  // Planting harvest approaching
  State.plantings.filter(function(p){return p.status==='growing'||p.status==='seedling'}).forEach(function(p){
    var d=daysBetween(today(),p.expectedHarvest);
    if(d>=0&&d<=7){
      alerts.push({type:'attention',icon:'🌾',title:'Harvest approaching',msg:cropName(p.cropId)+' in '+fieldName(p.fieldId)+' — '+d+'d',route:'plantings'});
    }
  });
  // Pregnant animals
  State.livestock.filter(function(a){return a.status==='pregnant'}).forEach(function(a){
    alerts.push({type:'attention',icon:'🐄',title:'Pregnant animal',msg:a.name+' ('+a.tag+') — '+a.notes,route:'livestock'});
  });
  return alerts;
}
function getAlertCount(){return getAlerts().length}

function drawLineChart(canvas,series,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!series||!series.length)return;
  var padL=42,padR=14,padT=14,padB=28;
  var cW=W-padL-padR,cH=H-padT-padB;
  var allVals=[];
  series.forEach(function(s){s.data.forEach(function(d){if(d.y!=null)allVals.push(d.y)})});
  if(!allVals.length)return;
  var max=Math.max.apply(null,allVals);
  var min=opts.startAtZero?0:Math.min.apply(null,allVals);
  if(max===min)max=min+1;
  var range=max-min;
  max+=range*0.08;min-=range*0.08;
  if(opts.startAtZero&&min<0)min=0;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText((max-(i*((max-min)/4))).toFixed(range<10?1:0),padL-6,y+3);
  }
  var len=series[0].data.length;
  var labelEvery=Math.max(1,Math.floor(len/6));
  ctx.textAlign='center';
  series[0].data.forEach(function(d,i){
    if(i%labelEvery!==0 && i!==len-1)return;
    ctx.fillText(d.x,padL+(i/(len-1||1))*cW,H-8);
  });
  series.forEach(function(s,si){
    if(!s.data.length)return;
    var color=s.color||['#00d97e','#f0b429','#4a90d9','#e85a3b','#a855f7'][si%5];
    var grad=ctx.createLinearGradient(0,padT,0,padT+cH);
    grad.addColorStop(0,color+'40');grad.addColorStop(1,color+'00');
    ctx.beginPath();
    var first=true;
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
    if(opts.fill!==false){
      var lastX=padL+((len-1)/(len-1||1))*cW;
      ctx.lineTo(lastX,padT+cH);ctx.lineTo(padL,padT+cH);
      ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    }
    ctx.beginPath();
    s.data.forEach(function(d,i){
      if(d.y==null)return;
      var x=padL+(i/(len-1||1))*cW;
      var y=padT+cH-((d.y-min)/(max-min))*cH;
      ctx.moveTo(x,y);ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=color;ctx.fill();
  });
}
function drawBarChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var padL=42,padR=14,padT=14,padB=30;
  var cW=W-padL-padR,cH=H-padT-padB;
  var max=Math.max.apply(null,data.map(function(d){return d.y}))||1;
  max=Math.ceil(max*1.15);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim();
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.font='10px -apple-system, sans-serif';
  ctx.textAlign='right';
  for(var i=0;i<=4;i++){
    var y=padT+i*(cH/4);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cW,y);ctx.stroke();
    ctx.fillText(Math.round(max-(i*(max/4))),padL-6,y+3);
  }
  var bw=cW/data.length*0.7,gap=cW/data.length;
  data.forEach(function(d,i){
    var x=padL+i*gap+gap*0.15;
    var h=(d.y/max)*cH;
    var y=padT+cH-h;
    ctx.fillStyle=d.color||opts.color||'#00d97e';
    var r=Math.min(4,bw/2);
    ctx.beginPath();
    ctx.moveTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
    ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,padT+cH);ctx.lineTo(x,padT+cH);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
    ctx.textAlign='center';
    var label=String(d.x);
    if(label.length>8)label=label.slice(0,7)+'…';
    ctx.fillText(label,x+bw/2,H-10);
  });
}
function drawDonutChart(canvas,data,opts){
  opts=opts||{};
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(!data||!data.length)return;
  var total=data.reduce(function(s,d){return s+d.y},0)||1;
  var cx=W/2,cy=H/2;
  var r=Math.min(W,H)/2-24;
  var inner=r*0.6;
  var start=-Math.PI/2;
  var colors=['#00d97e','#f0b429','#4a90d9','#e85a3b','#a855f7','#f4a261','#8fb339','#d97757'];
  data.forEach(function(d,i){
    var angle=(d.y/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=d.color||colors[i%colors.length];
    ctx.fill();
    start+=angle;
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim();
  ctx.textAlign='center';
  ctx.font='700 16px -apple-system, sans-serif';
  ctx.fillText(opts.label||String(Math.round(total)),cx,cy+2);
  ctx.font='10px -apple-system, sans-serif';
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx3').trim();
  ctx.fillText(opts.sub||'',cx,cy+18);
}

      months[key]={rev:0,exp:0};
    }
    State.sales.forEach(function(s){
      var k=s.date.slice(0,7);
      if(months[k])months[k].rev+=s.total;
    });
    State.expenses.forEach(function(e){
      var k=e.date.slice(0,7);
      if(months[k])months[k].exp+=e.amount;
    });
    var arr=Object.keys(months).sort();
    var rev=arr.map(function(k){var d=new Date(k+'-01');return {x:d.toLocaleString('en-US',{month:'short'}),y:months[k].rev}});
    var exp=arr.map(function(k){var d=new Date(k+'-01');return {x:d.toLocaleString('en-US',{month:'short'}),y:months[k].exp}});
    drawLineChart(c1,[{data:rev,color:'#00d97e'},{data:exp,color:'#e85a3b'}],{startAtZero:true});
  }
  // Harvest by crop
  var c2=$('dashHarvestChart');
  if(c2){
    var byCrop={};
    State.harvests.forEach(function(h){
      var name=cropName(h.cropId);

}

function render_maintenance(){
  var html='';
  var overdue=State.maintenance.filter(function(m){return m.nextDue&&m.nextDue<today()}).length;
  var upcoming=State.maintenance.filter(function(m){return m.nextDue&&m.nextDue>=today()&&m.nextDue<=addDays(today(),7)}).length;
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">🔧</span>Maintenance</div>';
  html+='<div class="page-desc">'+State.maintenance.length+' records · '+overdue+' overdue · '+upcoming+' due soon</div></div>';
  html+='<button class="btn primary" onclick="editMaintenance(null)">➕ Log Service</button>';
  html+='</div>';

  if(!State.maintenance.length){
    html+='<div class="empty"><span class="icon">🔧</span><h4>No maintenance records</h4></div>';
    return html;
  }

  var sorted=State.maintenance.slice().sort(function(a,b){
    if(a.nextDue&&b.nextDue)return a.nextDue.localeCompare(b.nextDue);
    return 0;
  });

  html+='<div class="table-wrap"><div class="table-scroll"><table>';
  html+='<thead><tr><th>Equipment</th><th>Service</th><th>Performed</th><th class="num">Cost</th><th>Next due</th><th>Notes</th><th></th></tr></thead><tbody>';
  sorted.forEach(function(m){
    var eq=findEquipment(m.equipmentId);
    var due=m.nextDue?daysBetween(today(),m.nextDue):null;
    var status='';
    if(due!==null){
      if(due<0)status='<span class="badge critical">overdue</span>';
      else if(due<=7)status='<span class="badge urgent">in '+due+'d</span>';
      else status='<span class="badge info">in '+due+'d</span>';
    }
    html+='<tr onclick="editMaintenance(\''+m.id+'\')" style="cursor:pointer">';
    html+='<td>'+(eq?esc(eq.name):'—')+'</td>';
    html+='<td><strong>'+esc(m.type)+'</strong></td>';
    html+='<td>'+fmtDateShort(m.date)+'</td>';
    html+='<td class="num">'+fmtMoney(m.cost)+'</td>';
    html+='<td>'+status+'</td>';
    html+='<td style="font-size:.72rem;color:var(--tx2)">'+esc(m.notes||'—')+'</td>';
    html+='<td class="actions"><button class="btn ghost xs" onclick="event.stopPropagation();deleteMaintenance(\''+m.id+'\')" style="color:var(--c4)">🗑</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table></div></div>';
  return html;
}

function render_profitability(){
  var html='';
  html+='<div class="page-head">';
  html+='<div><div class="page-title"><span class="ic">📊</span>Profitability Analysis</div>';
  html+='<div class="page-desc">Revenue vs cost by crop and field</div></div>';
  html+='</div>';

  // By crop
  var cropStats={};
  State.crops.forEach(function(c){
    var harvests=State.harvests.filter(function(h){return h.cropId===c.id});
    var revenue=harvests.reduce(function(s,h){return s+(h.revenue||0)},0);
    var plantings=State.plantings.filter(function(p){return p.cropId===c.id});
    var cost=plantings.reduce(function(s,p){return s+(p.cost||0)},0);
    var yieldTotal=harvests.reduce(function(s,h){return s+h.quantity},0);
    if(revenue>0||cost>0||yieldTotal>0){
      cropStats[c.name]={revenue:revenue,cost:cost,profit:revenue-cost,yield:yieldTotal,harvests:harvests.length};
    }
  });

  html+='<h3 style="font-size:.9rem;margin-bottom:12px">By crop</h3>';
  html+='<div class="table-wrap mb-16"><div class="table-scroll"><table>';
  html+='<thead><tr><th>Crop</th><th class="num">Harvests</th><th class="num">Yield</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Margin</th></tr></thead><tbody>';
  Object.keys(cropStats).sort(function(a,b){return cropStats[b].profit-cropStats[a].profit}).forEach(function(k){
    var s=cropStats[k];
    var margin=s.revenue>0?(s.profit/s.revenue*100):0;

  html+='</tbody></table></div></div>';

  return html;

function after_reports(){
  // Finance
  var c1=$('repFinanceChart');
  if(c1){
    var months={};
    for(var i=5;i>=0;i--){
      var d=new Date();d.setMonth(d.getMonth()-i);
      var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      months[key]={rev:0,exp:0};
    }
    State.sales.forEach(function(s){var k=s.date.slice(0,7);if(months[k])months[k].rev+=s.total});
    State.expenses.forEach(function(e){var k=e.date.slice(0,7);if(months[k])months[k].exp+=e.amount});
    var arr=Object.keys(months).sort();
    var rev=arr.map(function(k){var d=new Date(k+'-01');return {x:d.toLocaleString('en-US',{month:'short'}),y:months[k].rev}});
    var exp=arr.map(function(k){var d=new Date(k+'-01');return {x:d.toLocaleString('en-US',{month:'short'}),y:months[k].exp}});
    drawLineChart(c1,[{data:rev,color:'#00d97e'},{data:exp,color:'#e85a3b'}],{startAtZero:true});
  }
  // Expenses by category
  var c2=$('repExpenseChart');
  if(c2){
    var cat={};
    State.expenses.forEach(function(e){cat[e.category]=(cat[e.category]||0)+e.amount});
    var arr=Object.keys(cat).map(function(k){return {x:k,y:cat[k]}}).sort(function(a,b){return b.y-a.y}).slice(0,7);
    var colors=['#00d97e','#f0b429','#4a90d9','#e85a3b','#a855f7','#f4a261','#8fb339'];
    arr.forEach(function(d,i){d.color=colors[i%colors.length]});
    drawDonutChart(c2,arr,{label:fmtMoney(totalExpenses()).replace('$',''),sub:'total'});
  }
  // Harvests by crop
  var c3=$('repHarvestChart');
  if(c3){
    var crop={};
    State.harvests.forEach(function(h){var name=cropName(h.cropId);crop[name]=(crop[name]||0)+h.quantity});
    var arr=Object.keys(crop).map(function(k){return {x:k,y:crop[k]}}).sort(function(a,b){return b.y-a.y}).slice(0,7);
    var colors=['#00d97e','#f0b429','#4a90d9','#e85a3b','#a855f7','#f4a261','#8fb339'];
    arr.forEach(function(d,i){d.color=colors[i%colors.length]});
    drawBarChart(c3,arr);
  }
  // Species
  var c4=$('repSpeciesChart');
  if(c4){
    var sp={};
    State.livestock.forEach(function(a){sp[a.species]=(sp[a.species]||0)+1});
    var arr=Object.keys(sp).map(function(k){return {x:k,y:sp[k]}});
    var colors=['#00d97e','#f0b429','#4a90d9','#e85a3b','#a855f7','#f4a261'];
    arr.forEach(function(d,i){d.color=colors[i%colors.length]});
    drawDonutChart(c4,arr,{label:String(State.livestock.length),sub:'animals'});
  }
}

    ['Pest sightings',State.pests.length],
    ['Irrigation events',State.irrigation.length]
  ];
  html+='<div class="kpi-grid" style="margin-bottom:16px">';
  stats.forEach(function(s){
    html+='<div class="kpi"><div class="kpi-label">'+s[0]+'</div><div class="kpi-value" style="font-size:1.3rem">'+s[1]+'</div></div>';
  });
  html+='</div>';
  html+='<div class="stat-line"><span class="sl-label">Storage used</span><span class="sl-value">'+(total/1024).toFixed(1)+' KB</span></div>';
  html+='</div>';

  html+='<button class="btn primary lg block" onclick="saveSettings()">💾 Save Settings</button>';
  return html;
}
function setThemeOption(t){
  State.settings.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  saveState();renderPage();
}
function saveSettings(){
  State.settings.farmName=$('stFarm').value.trim()||'My Farm';
  State.settings.farmer=$('stFarmer').value.trim();
  State.settings.location=$('stLocation').value.trim();
  saveState();updateSbFarm();renderPage();
  toast('Settings saved','success');
}
function exportData(){
  var json=JSON.stringify(State,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='farmwise-'+today()+'.json';
  a.click();
  State.settings.lastBackup=nowISO();
  saveState();
  toast('Exported ('+(json.length/1024).toFixed(1)+' KB)','success');
}
function importData(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,.txt';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!data.fields&&!data.settings){toast('Not a FarmWise file','error');return}
        confirmDialog('Import Data','Replace current data?',function(){
          Object.keys(State).forEach(function(k){if(data[k]!==undefined)State[k]=data[k]});
          saveState();renderNav();renderPage();updateSbFarm();
          toast('Imported','success');
        },true);
      }catch(e){toast('Import failed','error')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  confirmDialog('Reset All Data','Delete all farm data? This cannot be undone.',function(){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  },true);
}

/* ================================================================
   INIT
   ================================================================ */
function initApp(){
  var loaded=loadState();
  if(!loaded||!State.fields.length){
    seedDemoData();
    saveState();
  }
  document.documentElement.setAttribute('data-theme',State.settings.theme||'farm');
  var sbClose=$('sbClose');
  if(sbClose){
    sbClose.style.display=window.innerWidth<900?'flex':'none';
    sbClose.onclick=closeSidebar;
  }
  window.addEventListener('resize',function(){
    var c=$('sbClose');
    if(c)c.style.display=window.innerWidth<900?'flex':'none';
    if(CurrentRoute==='dashboard')after_dashboard();
    if(CurrentRoute==='weather')after_weather();
    if(CurrentRoute==='reports')after_reports();
  });
  var modal=$('modal');
  if(modal)modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.key==='Escape')closeModal();
    if(e.key==='?'){e.preventDefault();navigate('about')}
    if(e.key==='g'){
      window._gk=true;setTimeout(function(){window._gk=false},1000);return;
    }
    if(window._gk){
      var map={'d':'dashboard','f':'fields','c':'crops','l':'livestock','i':'inventory','e':'equipment','t':'tasks','h':'harvests','w':'weather','r':'reports','s':'settings'};
      if(map[e.key])navigate(map[e.key]);
    }
  });
  renderNav();
  renderPage();
  setInterval(function(){if(State.settings.autoSave)saveState()},30000);
  window.addEventListener('beforeunload',saveState);
  setTimeout(function(){toast('Welcome to FarmWise 🌾','success')},400);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
