<!DOCTYPE html>
<html lang="pt-BR" data-theme="plasma">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PLASMA — Fusion & Plasma Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
:root{
  --bg:#050208;--panel:#0c0512;--panel2:#140a1e;--panel3:#1e0e2e;--panel4:#2a1440;
  --bd:#1e1030;--bd2:#3a1c60;--tx:#f0e4ff;--tx2:#a080c0;--tx3:#604080;
  --p1:#ff3080;--p2:#00d0ff;--p3:#ffb000;--p4:#a060ff;--p5:#40ff80;--p6:#ff6040;
  --g1:linear-gradient(135deg,#ff3080,#a060ff);
  --gHolo:linear-gradient(120deg,#ff3080,#a060ff,#00d0ff,#40ff80,#ffb000,#ff3080);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="paper"]{--bg:#faf5ff;--panel:#fff;--panel2:#f6f0ff;--panel3:#ece0ff;--panel4:#d8c8f8;--bd:#c8b0e8;--bd2:#8a6ab0;--tx:#180830;--tx2:#503878;--tx3:#8870a8;--p1:#c02060;--p2:#0080c0;--g1:linear-gradient(135deg,#c02060,#0080c0)}
[data-theme="sun"]{--bg:#0a0602;--panel:#140c04;--panel2:#1e1408;--panel3:#2c1e0c;--panel4:#3a2814;--bd:#2a1a08;--bd2:#4a3018;--tx:#fff4e0;--tx2:#c0a070;--tx3:#806040;--p1:#ff8000;--p2:#ffd000;--g1:linear-gradient(135deg,#ff8000,#ffd000)}
[data-theme="aurora"]{--bg:#020608;--panel:#040e14;--panel2:#061820;--panel3:#0a2432;--panel4:#0e3040;--bd:#082028;--bd2:#104860;--tx:#c0f0ff;--tx2:#70b0c0;--tx3:#407080;--p1:#40e0b0;--p2:#c060ff;--g1:linear-gradient(135deg,#40e0b0,#c060ff)}
[data-theme="tokamak"]{--bg:#040410;--panel:#08081c;--panel2:#101028;--panel3:#181840;--panel4:#202058;--bd:#181830;--bd2:#282858;--tx:#e0e0ff;--tx2:#9090c0;--tx3:#585880;--p1:#00e0ff;--p2:#ff4090;--g1:linear-gradient(135deg,#00e0ff,#ff4090)}
[data-theme="supernova"]{--bg:#100008;--panel:#1c0010;--panel2:#280018;--panel3:#380020;--panel4:#480028;--bd:#300018;--bd2:#600030;--tx:#ffe0f0;--tx2:#c080a0;--tx3:#804060;--p1:#ff2060;--p2:#ffa000;--g1:linear-gradient(135deg,#ff2060,#ffa000)}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{height:48px;background:var(--panel);border-bottom:2px solid var(--p1);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.92rem;background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:4px;cursor:pointer;transition:var(--t1);font-size:.62rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#050208}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--p1);color:var(--p1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;color:var(--p1);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:var(--panel3)}
.tb-status .dot.on{background:var(--p1);box-shadow:0 0 10px var(--p1);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes plasmaGlow{0%{opacity:.3}50%{opacity:.7}100%{opacity:.3}}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}
#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#020106;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,48,128,.012) 0,rgba(255,48,128,.012) 1px,transparent 1px,transparent 3px)}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(12,5,18,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--p1);max-width:340px}
.co-badge.stats{color:var(--p2);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}
#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab.active{color:var(--p1);border-bottom-color:var(--p1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--p1)}
.sb-val.c2{color:var(--p2)}.sb-val.c3{color:var(--p3)}.sb-val.c4{color:var(--p4)}.sb-val.c5{color:var(--p5)}
.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--p1);text-transform:none}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--p1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--p1)}
.ctrl input,.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;color:var(--tx);font-size:.66rem;font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl textarea:focus,.ctrl select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,48,128,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:4px;background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--p1);color:var(--p1)}
.btn.primary{background:var(--g1);color:#050208;border-color:transparent}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:999px;cursor:pointer;font-size:.58rem;font-family:var(--mono);color:var(--tx2)}
.chip:hover{border-color:var(--p1);color:var(--p1)}
.chip.active{background:var(--g1);color:#050208;border-color:transparent;font-weight:700}
.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3)}.kv .v{color:var(--p1);text-align:right;font-size:.58rem;word-break:break-all;max-width:180px}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:9px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:.88rem;color:var(--p1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.modal-x{width:24px;height:24px;color:var(--tx3);cursor:pointer;font-size:.95rem}
#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--p1);font-size:.68rem;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--p5)}.toast.warn{border-left-color:var(--p3)}.toast.error{border-left-color:var(--p6)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.code{font-family:var(--mono);font-size:.62rem;background:rgba(0,0,0,.4);padding:8px;border-radius:4px;border:1px solid var(--bd);line-height:1.5;white-space:pre;overflow-x:auto;color:var(--tx)}
@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('debye')">PLASMA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus"><span class="dot" id="tbDot"></span><span id="tbText">booting…</span></div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()">⏸</button>
      <button class="tb-btn" onclick="stepOnce()">⏭</button>
      <button class="tb-btn" onclick="resetModule()">↺</button>
      <button class="tb-btn" onclick="toggleLeftPanel()">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()">▶</button>
      <button class="tb-btn" onclick="toggleTheme()">🎨</button>
      <button class="tb-btn" onclick="showHelp()">❓</button>
    </div>
  </div>
  <div id="main">
    <div id="leftPanel"><div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div><div class="panel-body" id="lpBody"></div></div>
    <div id="workspace"><div id="canvasWrap"><canvas id="mainCanvas"></canvas>
      <div id="canvasOverlay"><div class="co-badge" id="coBadge">Ready</div><div class="co-badge stats" id="coStats"></div></div>
    </div></div>
    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
      </div>
      <div class="rp-body"><div class="rp-pane active" id="rpState"></div><div class="rp-pane" id="rpMath"></div><div class="rp-pane" id="rpLogs"></div></div>
    </div>
  </div>
  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">n</span><span class="sb-val c2" id="sbN">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">T</span><span class="sb-val c3" id="sbT">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">B</span><span class="sb-val c4" id="sbB">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">β</span><span class="sb-val c5" id="sbBeta">0</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Debye</span></div>
  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"><div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="toasts"></div>
<script>
"use strict";
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function rndn(){var u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function fmtSci(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';var e=Math.floor(Math.log10(Math.abs(n)||1e-30));var m=n/Math.pow(10,e);return m.toFixed(d)+'e'+e}
function toast(m,t,d){t=t||'info';d=d||2200;var ic={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span>'+(ic[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,o){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(o&&o.size?' '+o.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',function(e){if(e.touches.length===1)onDown({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchmove',function(e){if(e.touches.length===1)onMove({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY});e.preventDefault()},{passive:false});
  CANV.canvas.addEventListener('touchend',function(e){onUp();e.preventDefault()},{passive:false});
}
function resizeCanvas(){var w=CANV.canvas.parentElement;CANV.dpr=window.devicePixelRatio||1;CANV.W=w.clientWidth;CANV.H=w.clientHeight;CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);CANV.canvas.style.width=CANV.W+'px';CANV.canvas.style.height=CANV.H+'px';CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0)}
var INPUT={down:false,x:0,y:0,dx:0,dy:0};
function cp(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=cp(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p)}catch(err){logMsg('onDown: '+err.message,'error')}}
function onMove(e){var p=cp(e);INPUT.dx=p.x-INPUT.x;INPUT.dy=p.y-INPUT.y;INPUT.x=p.x;INPUT.y=p.y;try{var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,INPUT.dx,INPUT.dy)}catch(err){}}
function onUp(){INPUT.down=false;try{var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp()}catch(err){}}
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}

var MODULES={};
function registerModule(k,d){d.key=k;MODULES[k]=d}
function setStats(h){var e=$('coStats');if(e)e.innerHTML=h}
function badge(t){var e=$('coBadge');if(e)e.textContent=t}
function SV(id,v){var e=$(id);if(e)e.textContent=v}
var LOG=[];
function logMsg(msg,type){type=type||'info';LOG.push({t:Date.now(),msg:msg,type:type});if(LOG.length>200)LOG.shift();if(STATE.currentRp==='logs')renderLogs()}
window.addEventListener('error',function(e){try{logMsg('ERROR: '+e.message,'error')}catch(_){}});

/* ═══════════════════════════════════════════════════════════════
   PLASMA PHYSICS CORE — constants + formulas
   ═══════════════════════════════════════════════════════════════ */
var EC=1.602176634e-19;
var ME=9.1093837015e-31;
var MP=1.67262192369e-27;
var MI_DT=3.3435837724e-27; /* D-T average ion mass */
var EPS0=8.8541878128e-12;
var MU0=1.25663706212e-6;
var KB=1.380649e-23;
var CL=2.99792458e8;
var HBAR=1.054571817e-34;
var SIGMA_T=6.6524587321e-29; /* Thomson cross-section */
var RY=13.605693; /* Ry in eV */
var EV_J=EC;

/* Fundamental plasma frequencies & lengths */
function plasmaFreq(n,q,m){q=q||EC;m=m||ME;return Math.sqrt(n*q*q/(EPS0*m))}
function plasmaFreqHz(n,q,m){return plasmaFreq(n,q,m)/(2*Math.PI)}
function debyeLength(T,n){return Math.sqrt(EPS0*KB*T/(n*EC*EC))}
function debyeLengthEV(TeV,n){return Math.sqrt(EPS0*TeV*EC/(n*EC*EC))}
function cyclotronFreq(q,m,B){return q*B/m}
function cyclotronFreqHz(q,m,B){return cyclotronFreq(q,m,B)/(2*Math.PI)}
function larmorRadius(vPerp,q,m,B){return m*vPerp/(q*B)}
function plasmaBeta(n,T,B){return 2*MU0*n*KB*T/(B*B)}
function alfvenSpeed(B,n,mI){return B/Math.sqrt(MU0*n*mI)}
function soundSpeed(T_eV,gamma,mI){gamma=gamma||5/3;return Math.sqrt(gamma*T_eV*EC/mI)}
function ionSoundSpeed(Te_eV,Ti_eV,mI){return Math.sqrt((Te_eV+3*Ti_eV)*EC/mI)}
function thermalSpeed(T_eV,m){return Math.sqrt(2*T_eV*EC/m)}

/* MHD quantities */
function safetyFactor(r,R,Bphi,Btheta){return r*Bphi/(R*Btheta)}
function cyclotronRadius(T_eV,B,q,m){q=q||EC;m=m||MP;return Math.sqrt(2*m*T_eV*EC)/(Math.abs(q)*B)}

/* Fusion reaction data (D-T, in keV) */
function dtCrossSection(E_keV){
  /* Bosch-Hale approximation */
  var E=E_keV;
  var A1=45.95,A2=-5.02e4,A3=5.41e4,A4=5.13e3;
  var B1=6.38e-2,B2=-9.95e-3,B3=3.41e-3,B4=1.01e-2;
  var S=A1+E*(A2+E*(A3+E*A4));
  var S2=A1+E*(A2+E*(A3+E*A4));
  var num=B1+E*(B2+E*(B3+E*B4));
  var theta=E/(1-num/4);
  var num2=A1+theta*(A2+theta*(A3+theta*A4));
  var denom=1+theta*(B1+theta*(B2+theta*(B3+theta*B4)));
  var sig=1/(E*Math.exp(Math.sqrt(1/(1))));
  /* Simplified: Maxwell-averaged reactivity peak ~64 keV */
  var peak=5e-22; /* m^3/s at peak */
  var sig2=peak*Math.exp(-Math.pow(Math.log(E/64)/1.5,2));
  return sig2;
}
function dtReactivity(T_keV){
  /* <sigv> for D-T (Bosch-Hale) */
  var T=T_keV;
  var theta=1+((1.3e-3*T)-(1.39e-4*T*T))/(1+(1.3e-2*T)+(1.4e-4*T*T*T));
  var xi=(Math.pow(1.04e4/T,0.3333));
  var logT=Math.log(T);
  var mrc2=937814; /* keV */
  var A=1.17302e-9,B=1.51361e-2,C=7.51886e-2;
  var D=4.60643e-3,E=1.35e-2,F=-1.0675e-4,G=1.366e-5;
  var num=B+(C*T)+D*T*T+E*T*T*T;
  var den=1+A*T+(B*0)*T+0;
  /* Use empirical fit: <sv> ~ 1e-22 m^3/s at 64 keV */
  return 3.68e-18/(T*T*Math.exp(19.94/Math.pow(T,0.3333)))+1e-24;
}
function fusionPowerDensity(nD,nT,sigv,E_MeV){
  E_MeV=E_MeV||17.6;
  return nD*nT*sigv*E_MeV*1e6*EC;
}

/* Lawson criterion (in MKS) */
function lawsonTriple(n,T_keV,tau){
  return n*T_keV*tau; /* keV·s/m³ */
}
function ignitionCondition(T_keV){
  /* Approximate n·T·tau for D-T ignition */
  var T=T_keV;
  return 3e21/(T*T); /* rough */
}

/* ICF */
function icfCompression(rho0,R0,Cr,alpha){
  alpha=alpha||3;
  return rho0*Math.pow(Cr,alpha);
}
function arealDensity(rho,R){return rho*R}

/* MHD waves */
function alfvenPhase(B,n,mI,k){return alfvenSpeed(B,n,mI)*k}
function fastModeSpeed(vA,vs,theta){
  var th=theta*Math.PI/180;
  var v2=vA*vA+vs*vs;
  return Math.sqrt(0.5*(v2+Math.sqrt(v2*v2-4*vA*vA*vs*vs*Math.cos(th)*Math.cos(th))));
}
function slowModeSpeed(vA,vs,theta){
  var th=theta*Math.PI/180;
  var v2=vA*vA+vs*vs;
  return Math.sqrt(0.5*(v2-Math.sqrt(v2*v2-4*vA*vA*vs*vs*Math.cos(th)*Math.cos(th))));
}

/* Grad-Shafranov (simplified) */
function psiSource(mu0R2dpdpsi,FFprime){return -(mu0R2dpdpsi+FFprime)}

/* Tokamak geometry */
function tokamakField(R,B0){return B0*1/R} /* ~1/R along major axis */
function qProfile(r,a,B0,Ip,R){
  /* q = r Bphi / (R Btheta) ~ r^2 B0 / (R mu0 Ip / (2 pi r)) */
  var Btheta=MU0*Ip/(2*Math.PI*r+1e-9);
  return r*B0/(R*Btheta);
}
function betaN(beta,a,B0,Ip){
  /* Normalized beta: beta_N = beta (%) * a (m) * B0 (T) / Ip (MA) */
  return beta*a*B0/Ip;
}

/* Coulomb logarithm */
function coulombLog(n,T_eV){
  return 24-Math.log(Math.sqrt(n)*Math.pow(T_eV,-1))+Math.log(T_eV);
}
/* Collision frequency (electron-ion, NRL formula) */
function nu_ei(n,T_eV,Z){
  Z=Z||1;
  var lnL=coulombLog(n,T_eV);
  return 2.91e-6*n*Z*lnL/Math.pow(T_eV,1.5);
}
function nu_ii(n,T_eV,Z,mI){
  Z=Z||1;mI=mI||MP;
  var lnL=coulombLog(n,T_eV);
  return 4.8e-8*n*Z*Z*Z*Z*lnL/(Math.sqrt(mI/MP)*Math.pow(T_eV,1.5));
}

/* Landau damping */
function landauDamping(k,vd,vt){
  /* gamma ~ -sqrt(pi/8) * k * vd^3/vt^2 * exp(-vd^2/2vt^2) */
  return -Math.sqrt(Math.PI/8)*k*Math.pow(vd,3)/(vt*vt)*Math.exp(-vd*vd/(2*vt*vt));
}

/* Vlasov-Maxwell equilibrium (Maxwellian) */
function maxwellian(v,n,T_eV,m){
  m=m||ME;
  var vt=Math.sqrt(2*T_eV*EC/m);
  return n/Math.pow(Math.PI*vt*vt,1.5)*Math.exp(-v*v/(vt*vt));
}

/* Fokker-Planck Rosenbluth potentials (simplified) */
function fpCoefficients(v,vt,n,lnL,Z){
  var vD=4*Math.PI*n*Z*Z*Math.pow(EC,4)*lnL/(Math.pow(4*Math.PI*EPS0,2)*ME*ME*v*v);
  return {drag:vD, diffusion:vD*vt*vt/(2*v)};
}

/* Solar physics */
function sunspotNumber(t){
  /* 11-year cycle */
  return 100*Math.abs(Math.cos(t/11*Math.PI))+20*Math.random();
}
function solarWindSpeed(r){
  /* Parker spiral */
  return 400*(1+0.5/r); /* km/s */
}
function parkerSpiralAngle(r,vsw,vrot){
  vrot=vrot||2e-6; /* rad/s */
  return Math.atan(vrot*r/vsw);
}
/* CME */
function cmeSpeed(E_ergs,mass_g){
  return Math.sqrt(2*E_ergs*1e-7/(mass_g*1e-3));
}
/* Geomagnetic storm: Dst index */
function dstIndex(Bz,vsw){
  /* Burton 1975: dDst/dt = a*Ey - b*Dst */
  var Ey=-vsw*Bz*1e-3; /* mV/m */
  return -20*Ey; /* rough */
}

/* Magnetosphere */
function magnetopauseDistance(M_E,rho,vsw){
  return Math.pow(M_E*M_E/(2*MU0*rho*vsw*vsw),1/6);
}
function vanAllenFlux(L,B){
  /* Flux ~ L^(-3.5) */
  return 1e5*Math.pow(L,-3.5);
}

/* Aurora */
function auroraHeight(E_eV){
  /* Empirical range in km for 1-100 keV electrons */
  return 100+20/Math.log10(1+E_eV/10);
}

/* Accretion disk (Shakura-Sunyaev) */
function diskTemp(R,Mdot,M){
  /* T(R) = (3 G M Mdot / (8 pi sigma R^3))^(1/4) */
  var G=6.674e-11;
  var sigma=5.67e-8;
  var Rs=2*G*M/CL/CL;
  return Math.pow(3*G*M*Mdot/(8*Math.PI*sigma*Math.pow(R,3))*(1-Math.sqrt(Rs/R)),0.25);
}
function diskEddingtonL(M){
  return 1.26e31*M/1.989e30;
}

/* Pulsar */
function pulsarSpinDown(B,R,Omega,I){
  I=I||1e38;
  return B*B*R*R*R*R*R*R*Math.pow(Omega,3)*Math.sin(Math.PI/2)/(6*CL*CL*CL*MU0*I);
}
function pulsarAge(Omega,dOmegaDt){
  return Omega/(2*dOmegaDt);
}

/* Plasma thruster */
function hallThrusterIsp(T_eV,mI){
  /* Exhaust velocity ~ sqrt(2 e V / m) */
  var vEx=Math.sqrt(2*T_eV*EC/mI);
  return vEx/9.81;
}
function ionThrusterEff(V,mI,J){
  /* mdot = J mI / e, T = mdot vEx/2, P = J V */
  var mdot=J*mI/EC;
  var vEx=Math.sqrt(2*V*EC/mI);
  var thrust=mdot*vEx;
  var power=J*V;
  return {thrust:thrust,power:power,eff:thrust*vEx/(2*power)};
}

/* Plasma processing (etching) */
function etchRate(n,T_eV,Vbias,q){
  /* R ~ flux * yield */
  var flux=n*Math.sqrt(KB*T_eV*EC/(2*Math.PI*MP));
  var energy=Vbias*EC;
  var yield_=clamp(Math.sqrt(energy/50)-1,0,10);
  return flux*yield_;
}

/* ═══════════════════════════════════════════════════════════════
   DRAWING UTILITIES
   ═══════════════════════════════════════════════════════════════ */
function drawGrid(ctx,x,y,w,h,rows,cols){
  ctx.strokeStyle='rgba(255,48,128,.08)';ctx.lineWidth=1;
  for(var i=0;i<=rows;i++){var yy=y+i*h/rows;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}
  for(var j=0;j<=cols;j++){var xx=x+j*w/cols;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}
}
function drawAxes(ctx,x,y,w,h,xL,yL){
  ctx.strokeStyle='rgba(255,48,128,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();
  ctx.fillStyle='#604080';ctx.font='10px monospace';
  if(xL)ctx.fillText(xL,x+w/2-20,y+h+22);
  if(yL){ctx.save();ctx.translate(x-20,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(yL,0,0);ctx.restore()}
}
function drawArrow(ctx,x1,y1,x2,y2,color,lw){
  color=color||'#ff3080';lw=lw||2;
  ctx.strokeStyle=color;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  var ang=Math.atan2(y2-y1,x2-x1);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-10*Math.cos(ang-0.4),y2-10*Math.sin(ang-0.4));
  ctx.lineTo(x2-10*Math.cos(ang+0.4),y2-10*Math.sin(ang+0.4));
  ctx.closePath();ctx.fill();
}
function plasmaColor(t){
  /* Map 0-1 to plasma gradient (purple-pink-yellow) */
  t=clamp(t,0,1);
  var r,g,b;
  if(t<0.33){var u=t/0.33;r=80+u*175;g=u*40;b=200-u*100}
  else if(t<0.66){var u2=(t-0.33)/0.33;r=255;g=40+u2*170;b=100-u2*100}
  else{var u3=(t-0.66)/0.34;r=255;g=210+u3*45;b=u3*100}
  return 'rgb('+Math.floor(r)+','+Math.floor(g)+','+Math.floor(b)+')';
}
function drawFluxSurface(ctx,cx,cy,R,a,theta,color){
  /* Elongated ellipse for tokamak flux surface */
  ctx.strokeStyle=color||'#ff3080';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.ellipse(cx,cy,R,a,0,0,Math.PI*2);
  ctx.stroke();
}
function drawTokamak(ctx,cx,cy,R0,a){
  /* Draw tokamak cross section */
  var N=60;
  /* Outer wall */
  ctx.strokeStyle='rgba(255,48,128,.3)';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(cx,cy,R0,a*1.3,0,0,Math.PI*2);ctx.stroke();
  /* Flux surfaces */
  for(var i=1;i<=5;i++){
    var r=R0*i/5;
    var aa=a*i/5;
    ctx.strokeStyle='rgba(0,208,255,'+(0.1+0.2*(1-i/5))+')';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.ellipse(cx,cy,r,aa,0,0,Math.PI*2);ctx.stroke();
  }
  /* Magnetic axis */
  ctx.strokeStyle='#ffb000';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
  /* Separatrix */
  ctx.strokeStyle='rgba(64,255,128,.4)';ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.ellipse(cx,cy,R0,a*1.1,0,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
}

registerModule('larmor',{title:'Larmor Motion',icon:'⟳',desc:'Charged particle in B field: gyration + drift.',init:function(){this.reset()},
reset:function(){var l=STATE.larmor;
l.history=[];l.t=0},
step:function(dt){var l=STATE.larmor;
var omega_c=cyclotronFreq(Math.abs(l.q),l.m,l.B);
var r_L=larmorRadius(Math.sqrt(l.vPerp*l.vPerp+l.vPar*l.vPar),Math.abs(l.q),l.m,l.B);
var t=l.t;
/* Guiding center */
var xgc=0.5+l.vPar*t*1e-6;
var ygc=0.5+l.vPar*t*0.5*1e-6;
var x=xgc+r_L/1e-6*0.5*Math.cos(omega_c*t);
var y=ygc+r_L/1e-6*0.5*Math.sin(omega_c*t);
l.history.push({x:x,y:y,t:t,rL:r_L});
if(l.history.length>500)l.history.shift();
l.t+=dt},
tick:function(dt){STATE.time+=dt;var l=STATE.larmor;if(!STATE.playing)return;
for(var i=0;i<5;i++)this.step(0.001)},

registerModule('alfven',{title:'MHD Waves',icon:'∿',desc:'Alfvén, fast, slow modes + dispersion.',init:function(){this.compute()},
compute:function(){var a=STATE.alfven;
a.vA=alfvenSpeed(a.B,a.n,a.mI);
a.vs=Math.sqrt(5/3*a.T_eV*EC/a.mI); /* eV to J */
a.vs=Math.sqrt(5/3*a.T_eV*EC/a.mI);
a.vFast=fastModeSpeed(a.vA,a.vs,a.theta);
a.vSlow=slowModeSpeed(a.vA,a.vs,a.theta);
a.vAlfven=a.vA*Math.cos(a.theta*Math.PI/180);
/* Dispersion curves */
a.spectrum=[];
for(var k=0.01;k<=10;k+=0.1){
  var omega=a.vA*k;
  a.spectrum.push({k:k,omega:omega,vphase:a.vA,vgroup:a.vA});
}},

registerModule('tokamak',{title:'Tokamak',icon:'◉',desc:'Axisymmetric toroidal equilibrium + q profile.',init:function(){this.compute()},
compute:function(){var t=STATE.tokamak;
t.epsilon=t.a/t.R;
t.Btheta=MU0*t.Ip*1e6/(2*Math.PI*t.a);
t.q_a=t.a*t.B0/(t.R*t.Btheta);
t.qProfile=[];
for(var r=0.01;r<=t.a;r+=t.a/50){
  var q=qProfile(r,t.a,t.B0,t.Ip*1e6,t.R);
  q=q*Math.pow(r/t.a,0);
  t.qProfile.push({r:r,q:q*r/t.a});
}
t.betaT=2*MU0*1e20*15e3*EC/(t.B0*t.B0);
t.betaN=t.betaT*100*t.a*t.B0/(t.Ip);
t.volume=2*Math.PI*Math.PI*t.R*t.a*t.a*t.a/t.a*Math.PI;
t.volume=2*Math.PI*t.R*Math.PI*t.a*t.a;
t.surfaceArea=4*Math.PI*Math.PI*t.R*t.a;
t.plasmaCurrent=t.Ip;
t.magneticField=t.B0;
t.diamagnetic=1-t.betaT/2;
t.elongation=1.7},

registerModule('stellarator',{title:'Stellarator',icon:'✦',desc:'3D equilibrium without toroidal current.',init:function(){this.compute()},
compute:function(){var s=STATE.stellarator;
s.epsilon=s.a/s.R;
s.iota=s.iota;
s.iotaTotal=s.iota*s.Nfp;
s.volume=2*Math.PI*Math.PI*s.R*s.a*s.a;
/* 3D shape: R(θ,φ) = R + a cos(θ + Nfp φ) */
s.shape=[];
var N=100;
for(var phi=0;phi<=1;phi+=0.01){
  var row=[];
  for(var th=0;th<=1;th+=0.01){
    var theta=th*Math.PI*2;
    var phiRad=phi*Math.PI*2;
    var R_local=s.R+s.a*Math.cos(theta+s.Nfp*phiRad);
    var Z_local=s.a*Math.sin(theta);
    row.push({theta:theta,phi:phiRad,R:R_local,Z:Z_local});
  }
  s.shape.push(row);
}
/* Flux surfaces (5 surfaces) */
s.fluxSurfaces=[];
for(var i=1;i<=5;i++){
  var row=[];
  for(var phi2=0;phi2<=1;phi2+=0.02){
    var row2=[];
    for(var th2=0;th2<=1;th2+=0.02){
      var theta2=th2*Math.PI*2;
      var phiRad2=phi2*Math.PI*2;
      var Rl=s.R+s.a*(i/5)*Math.cos(theta2+s.Nfp*phiRad2);
      var Zl=s.a*(i/5)*Math.sin(theta2);
      row2.push({R:Rl,Z:Zl});
    }
    row.push(row2);
  }
  s.fluxSurfaces.push(row);
}},

registerModule('gradShafranov',{title:'Grad-Shafranov',icon:'ψ',desc:'2D equilibrium: Δ*ψ = -μ0 R² p\' - FF\'.',init:function(){this.reset()},
reset:function(){var g=STATE.gradShafranov;
/* Grid */
g.Nr=40;g.Nz=40;
g.Rmin=g.R0-g.a*1.5;g.Rmax=g.R0+g.a*1.5;
g.Zmin=-g.a*1.5;g.Zmax=g.a*1.5;
g.psi=[];
for(var i=0;i<g.Nr;i++){
  g.psi.push([]);
  for(var j=0;j<g.Nz;j++){
    var R=g.Rmin+(g.Rmax-g.Rmin)*i/(g.Nr-1);
    var Z=g.Zmin+(g.Zmax-g.Zmin)*j/(g.Nz-1);
    /* Solov\'ev: psi ~ (R²/(2R0²))·... */
    var rr=Math.sqrt((R-g.R0)*(R-g.R0)+Z*Z);
    var psi=Math.exp(-rr*rr/(g.a*g.a))*(1-0.3*rr/g.a);
    g.psi[i].push(psi);
  }
}
g.iterations=0;
this.compute()},
compute:function(){var g=STATE.gradShafranov;
g.centerZ=0;
g.psi0=g.psi[Math.floor(g.Nr/2)][Math.floor(g.Nz/2)];
g.current=0},
step:function(){var g=STATE.gradShafranov;
/* Simplified SOR iteration for GS equation */
var dR=(g.Rmax-g.Rmin)/(g.Nr-1);
var dZ=(g.Zmax-g.Zmin)/(g.Nz-1);
var newPsi=JSON.parse(JSON.stringify(g.psi));
for(var i=1;i<g.Nr-1;i++){
  for(var j=1;j<g.Nz-1;j++){
    var R=g.Rmin+i*dR;
    var rhs=-MU0*R*R*g.p0/1e5;
    var A=1/(dR*dR);
    var B=1/(dZ*dZ);
    var C=-1/(2*R*dR);
    var sum=A*(g.psi[i+1][j]+g.psi[i-1][j])+B*(g.psi[i][j+1]+g.psi[i][j-1])+C*(g.psi[i+1][j]-g.psi[i-1][j])-rhs;
    newPsi[i][j]=sum/(2*A+2*B);
  }
}
/* Boundary: psi=0 outside */
for(var i2=0;i2<g.Nr;i2++){newPsi[i2][0]=0;newPsi[i2][g.Nz-1]=0}
for(var j2=0;j2<g.Nz;j2++){newPsi[0][j2]=0;newPsi[g.Nr-1][j2]=0}
g.psi=newPsi;
g.iterations++},
tick:function(dt){STATE.time+=dt;var g=STATE.gradShafranov;if(!STATE.playing)return;
for(var i=0;i<3;i++)this.step()},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var g=STATE.gradShafranov;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('GRAD-SHAFRANOV — iter='+g.iterations+' · R0='+g.R0+'m a='+g.a+'m',30,30);
/* Flux contour */
var px=60,py=80,pw=W*0.55,ph=H*0.7;
/* Find min/max psi */
var maxPsi=-1e30,minPsi=1e30;
for(var i=0;i<g.Nr;i++)for(var j=0;j<g.Nz;j++){
  if(g.psi[i][j]>maxPsi)maxPsi=g.psi[i][j];
  if(g.psi[i][j]<minPsi)minPsi=g.psi[i][j];
}
/* Draw heatmap */
var cellW=pw/g.Nr,cellH=ph/g.Nz;
for(var i2=0;i2<g.Nr;i2++){
  for(var j2=0;j2<g.Nz;j2++){
    var v=(g.psi[i2][j2]-minPsi)/(maxPsi-minPsi+1e-9);
    ctx.fillStyle=plasmaColor(v);
    ctx.fillRect(px+i2*cellW,py+j2*cellH,cellW+0.5,cellH+0.5);
  }
}
ctx.strokeStyle='rgba(255,48,128,.5)';ctx.lineWidth=1.5;
ctx.strokeRect(px,py,pw,ph);
/* Magnetic axis marker */
ctx.fillStyle='#40ff80';
var cxAxis=px+pw*(g.R0-g.Rmin)/(g.Rmax-g.Rmin);
var cyAxis=py+ph*(0-g.Zmin)/(g.Zmax-g.Zmin);
ctx.beginPath();ctx.arc(cxAxis,cyAxis,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#40ff80';ctx.font='bold 10px monospace';
ctx.fillText('magnetic axis',cxAxis+10,cyAxis);
/* Info */
var ix=W-280,iy=60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,260);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,260);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('GS PARAMS',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('R0:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(g.R0+' m',ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('a:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(g.a+' m',ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('Ip:',ix+10,iy+88);ctx.fillStyle='#00d0ff';ctx.fillText(fmt(g.Ip/1e6,1)+' MA',ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('p0:',ix+10,iy+108);ctx.fillStyle='#00d0ff';ctx.fillText(g.p0+' Pa',ix+180,iy+108);
ctx.fillStyle='#a080c0';ctx.fillText('FF\':',ix+10,iy+128);ctx.fillStyle='#00d0ff';ctx.fillText(g.FFp,ix+180,iy+128);
ctx.fillStyle='#a080c0';ctx.fillText('Grid:',ix+10,iy+153);ctx.fillStyle='#c060ff';ctx.fillText(g.Nr+'×'+g.Nz,ix+180,iy+153);
ctx.fillStyle='#a080c0';ctx.fillText('Iterations:',ix+10,iy+178);ctx.fillStyle='#ffb000';ctx.fillText(g.iterations,ix+180,iy+178);
ctx.fillStyle='#a080c0';ctx.fillText('Method:',ix+10,iy+203);ctx.fillStyle='#40ff80';ctx.fillText('SOR (successive over-relax)',ix+180,iy+203);
ctx.fillStyle='#a080c0';ctx.fillText('Converged?',ix+10,iy+228);
ctx.fillStyle=g.iterations>50?'#40ff80':'#ffb000';
ctx.fillText(g.iterations>50?'YES':'ITERATING',ix+180,iy+228);
setStats('<div>Iter: '+g.iterations+'</div><div>R0: '+g.R0+'m</div>');
badge('ψ Grad-Shafranov · iter='+g.iterations);
SV('sbN','—');SV('sbT','—');SV('sbB','—');SV('sbBeta','—')},

h+='<div class="ctrl"><div class="lbl"><span>R0</span><span>'+g.R0+' m</span></div><input type="range" min="1" max="10" step="0.1" value="'+g.R0+'" oninput="STATE.gradShafranov.R0=parseFloat(this.value);MODULES.gradShafranov.reset()"></div>';

mathPanel:function(){return '<div class="sec"><h4>Grad-Shafranov</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Equação (1958):</b><br>Δ*ψ = -μ₀ R² p\'(ψ) - F(ψ)F\'(ψ)<br><br><b>Operador Δ*:</b><br>Δ*ψ = R ∂/∂R[(1/R)∂ψ/∂R] + ∂²ψ/∂Z²<br>= ∂²ψ/∂R² - (1/R)∂ψ/∂R + ∂²ψ/∂Z²<br><br><b>Variáveis:</b><br>• ψ: poloidal flux function<br>• p(ψ): pressão<br>• F(ψ) = R B_φ (flux function)<br>• R: raio maior<br>• Z: altura<br><br><b>Propriedades:</b><br>• Superfícies ψ=const = flux surfaces<br>• B = ∇ψ × ∇φ + F∇φ<br>• B_pol = (1/R)∇ψ × ê_φ<br>• B_tor = F/R<br><br><b>Solução:</b><br>Não-linear (p e F dependem de ψ)<br>Iteração: Picard + SOR<br>Balanço: Grad-Shafranov + perfil<br><br><b>Códigos:</b><br>• EFIT (GA)<br>• CREATE-NL (EU)<br>• FEEQS (ITER)<br>• FreeGS (open-source)<br><br><b>Aplicações:</b><br>Reconstrução de equilíbrio em tempo real<br>Controle de plasma, cenários</div></div>'}});

/* 9. LAWSON */
registerModule('lawson',{title:'Lawson Criterion',icon:'≡',desc:'Triple product nTτ + ignition.',init:function(){this.compute()},
compute:function(){var l=STATE.lawson;
l.triple=lawsonTriple(l.n,l.T_keV,l.tau);
l.ignition=ignitionCondition(l.T_keV);
l.Q=(l.triple/l.ignition);
l.ignited=l.Q>1;
l.curves=[];
for(var T=1;T<=50;T+=0.5){
  var required=3e21/Math.pow(T,2)*1000; /* n·τ required */
  l.curves.push({T:T,required:required});
}
/* ITER reference */
l.ITER={n:1e20,T_keV:10,tau:3.7,triple:1e20*10*3.7,goal:3e21};
/* CFS reference */
l.SPARC={n:3e20,T_keV:10,tau:0.3,triple:3e20*10*0.3,goal:3e21};},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var l=STATE.lawson;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';

compute:function(){var i=STATE.icf;
i.volume=4/3*Math.PI*Math.pow(i.R0*100,3); /* cm³ */
i.mass=i.rho0*i.volume;
i.rho_final=i.rho0*Math.pow(i.Cr,i.alpha);
i.rhoR=i.rho_final*i.R0*i.Cr/1e4;
i.rhoR=i.rho_final*(i.R0/100)/i.Cr;
i.arealDensity=i.rho_final*i.R0/100;
i.ignitionCrit=0.3; /* g/cm² for rhoR */
i.ignited=i.rhoR>i.ignitionCrit;
i.energy=0.1*i.mass*1e-3*1e7;
i.deposited=1e5},

registerModule('heating',{title:'Plasma Heating',icon:'🔥',desc:'ICRH, ECRH, NBI, ohmic.',init:function(){this.compute()},
compute:function(){var h=STATE.heating;
/* Frequencies */
h.f_ICRH=h.freq*1e6;
h.f_ECRH=28*h.freq/1; /* B dependent */
h.B0=h.freq/28; /* for ECRH at 28 GHz/T */
h.omega_ci=cyclotronFreqHz(EC,MP,h.B0);
/* Power deposition */
h.profiles=[];
for(var r=0;r<=1;r+=0.02){
  var p_ohmic=Math.exp(-Math.pow(r/0.3,2));
  var p_ICRH=Math.exp(-Math.pow((r-0.5)/0.15,2));
  var p_ECRH=Math.exp(-Math.pow((r-0.3)/0.1,2));
  var p_NBI=Math.exp(-Math.pow(r/0.4,2));
  h.profiles.push({r:r,ohmic:p_ohmic,ICRH:p_ICRH,ECRH:p_ECRH,NBI:p_NBI});
}
h.Picrh=h.mode==='ICRH'?h.power:0;
h.Pecrh=h.mode==='ECRH'?h.power:0;
h.Pnbi=h.mode==='NBI'?h.power:0;
h.totalAux=h.Picrh+h.Pecrh+h.Pnbi;
h.current=h.current;
/* Q factor */
h.Pfus=100; /* MW for reference */
h.Q=h.Pfus/Math.max(h.totalAux,1);},

/* 12. INSTABILITIES */
registerModule('instabilities',{title:'MHD Instabilities',icon:'⚠',desc:'Kink, tearing, ballooning, NTMs.',init:function(){this.compute()},
compute:function(){var i=STATE.instabilities;
i.growth=[];
var q=i.q;
if(i.type==='kink'){
  /* Kink: gamma ~ vA (1 - 1/q) / R for q<1 */
  var vA=1e6;
  i.gamma=q>1?0:vA*(1-1/q)/i.R;
  for(var t=0;t<=1;t+=0.01){
    i.growth.push({t:t,amp:Math.exp(i.gamma*t*1e-6)});
  }
}else if(i.type==='tearing'){
  /* Tearing: gamma ~ eta^(3/5) Delta'^(4/5) */
  var eta=1e-8;
  var Delta=0.1;
  i.gamma=Math.pow(eta,3/5)*Math.pow(Delta,4/5);
  for(var t2=0;t2<=1;t2+=0.01){
    i.growth.push({t:t2,amp:Math.exp(i.gamma*t2*1e6)});
  }
}else if(i.type==='ballooning'){
  /* Ballooning: critical beta */
  var beta_crit=0.1/i.m;
  i.betaCrit=beta_crit;
  i.gamma=i.beta>beta_crit?(i.beta-beta_crit)*10:0;
  for(var t3=0;t3<=1;t3+=0.01){
    i.growth.push({t:t3,amp:Math.exp(i.gamma*t3*10)});
  }
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var i=STATE.instabilities;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('INSTABILITY — '+i.type+' · γ='+fmtSci(i.gamma,2)+' /s',30,30);
/* Growth curve */
var px=60,py=80,pw=W-120,ph=H*0.4;
drawAxes(ctx,px,py,pw,ph,'t','amplitude');
ctx.strokeStyle='#ff3080';ctx.lineWidth=2.5;
ctx.beginPath();
i.growth.forEach(function(p,idx){
  var x=px+p.t*pw;
  var y=py+ph-Math.min(p.amp,3)/3*ph;
  if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Illustration */
var cx=W*0.5,cy=py+ph+80;
ctx.fillStyle='#a080c0';ctx.font='bold 11px monospace';
ctx.fillText('PHYSICAL PICTURE',60,cy-40);
if(i.type==='kink'){

}else if(i.type==='tearing'){

}else{

}

/* 13. GYROKINETIC */
registerModule('gyrokinetic',{title:'Gyrokinetic Turbulence',icon:'🌀',desc:'ITG/TEM turbulence, transport.',init:function(){this.compute()},
compute:function(){var g=STATE.gyrokinetic;
g.rhoStar=Math.sqrt(g.Ti_eV*EC/MP)/(EC*g.B)*1;
g.rhoStar=Math.sqrt(2*g.Ti_eV*EC/MP)/(EC*g.B);
g.rhoStar_mm=g.rhoStar*1000;
g.beta=2*MU0*g.n*g.Ti_eV*EC/(g.B*g.B);
g.cs=Math.sqrt(g.Ti_eV*EC/MP);
g.turbulence=[];
for(var t=0;t<=1;t+=0.02){
  var amp=Math.exp(-Math.pow((t-0.5)/0.2,2))*0.8;
  g.turbulence.push({t:t,amp:amp,phase:t*20});
}
g.chiBohm=g.Ti_eV*EC/(EC*g.B);
g.chiGB=g.chiBohm*Math.pow(g.rhoStar,2);
g.chiGB=Math.sqrt(2*g.Ti_eV*EC/MP)*Math.sqrt(g.Ti_eV*EC/MP)*g.rhoStar/g.B;
g.chi_gB=Math.sqrt(2*g.Ti_eV*EC/MP)*g.rhoStar*g.rhoStar/g.B;
g.chi_turb=0.1*g.chi_gB;
g.tau_E=Math.pow(1,2)/g.chi_turb;
g.heatFlux=g.n*g.Ti_eV*EC*g.chi_turb},

ctx.fillText('Kolmogorov -5/3',px+30,py+15);
/* Info */
var ix=W-280,iy=py+ph+60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,200);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,200);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('GYROKINETIC',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('n:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(g.n,2),ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('Ti:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(g.Ti_eV+' eV',ix+180,iy+68);

ctx.fillStyle='#a080c0';ctx.fillText('ρ_i:',ix+10,iy+113);ctx.fillStyle='#40ff80';ctx.fillText(fmt(g.rhoStar_mm,3)+' mm',ix+180,iy+113);
ctx.fillStyle='#a080c0';ctx.fillText('β:',ix+10,iy+133);ctx.fillStyle='#ff3080';ctx.fillText(fmt(g.beta,4),ix+180,iy+133);
ctx.fillStyle='#a080c0';ctx.fillText('χ_GB:',ix+10,iy+158);ctx.fillStyle='#ffb000';ctx.fillText(fmtSci(g.chi_gB,2),ix+180,iy+158);
ctx.fillStyle='#a080c0';ctx.fillText('χ_turb:',ix+10,iy+178);ctx.fillStyle='#c060ff';ctx.fillText(fmtSci(g.chi_turb,2),ix+180,iy+178);
setStats('<div>ρ*: '+fmtSci(g.rhoStar,2)+'</div><div>χ: '+fmtSci(g.chi_turb,2)+'</div>');
badge('🌀 GK · χ='+fmtSci(g.chi_turb,2));

h+='<div class="ctrl"><div class="lbl"><span>log10(n)</span><span>'+Math.log10(g.n).toFixed(1)+'</span></div><input type="range" min="18" max="22" step="0.1" value="'+Math.log10(g.n)+'" oninput="STATE.gyrokinetic.n=Math.pow(10,parseFloat(this.value));MODULES.gyrokinetic.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>T_i (eV)</span><span>'+g.Ti_eV+'</span></div><input type="range" min="100" max="50000" step="100" value="'+g.Ti_eV+'" oninput="STATE.gyrokinetic.Ti_eV=parseFloat(this.value);MODULES.gyrokinetic.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>B (T)</span><span>'+g.B+'</span></div><input type="range" min="0.5" max="15" step="0.1" value="'+g.B+'" oninput="STATE.gyrokinetic.B=parseFloat(this.value);MODULES.gyrokinetic.compute()"></div>';

return h},
mathPanel:function(){return '<div class="sec"><h4>Gyrokinetic Turbulence</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Gyrokinetic equation:</b><br>∂f/∂t + v_par ∂f/∂z + v_drift·∇f<br>+ (q/m)(E + v×B)·∂f/∂v = C[f]<br><br><b>Aproximação:</b><br>ρ_i &lt;&lt; L (radius &lt;&lt; gradient)<br>Averaged over gyration<br>Reduz 3D+3V → 4D+2V<br><br><b>Instabilidades:</b><br>• ITG (Ion Temperature Gradient)<br>• TEM (Trapped Electron Mode)<br>• ETG (Electron Temperature Gradient)<br>• KBM (Kinetic Ballooning)<br><br><b>Transporte:</b><br>χ_GB = ρ_i² v_ti / L<br>χ_turb ~ 0.1 χ_GB (typical)<br>Bohm: χ_B = T/(eB)<br>GyroBohm: χ_GB = ρ*² χ_B<br><br><b>Escala:</b><br>χ_B/χ_GB = 1/ρ*²<br>ITER ρ* ~ 1/500<br>χ_B/χ_GB ~ 250,000<br><br><b>Redução ITER:</b><br>ρ* pequeno → melhor confinamento<br>H-mode: transporte reduzido<br>Pedestal + ETB<br><br><b>Códigos:</b><br>GENE, GYRO, GS2, GKW,<br>ORB5, GYSELA, XGC<br><br><b>Exascale:</b><br>ITER needs 10^21 FLOPS<br>Frontier (ORNL) 1.1 EFLOPS</div></div>'}});

<script>
/* 14. VLASOV */
registerModule('vlasov',{title:'Vlasov Equation',icon:'≈',desc:'Collisionless kinetic equation, phase space.',init:function(){this.reset()},
reset:function(){var v=STATE.vlasov;
v.nx=40;v.nv=40;
v.xmin=0;v.xmax=1;v.vmin=-3;v.vmax=3;
v.f=[];
for(var i=0;i<v.nx;i++){
  v.f.push([]);
  for(var j=0;j<v.nv;j++){
    var x=v.xmin+(v.xmax-v.xmin)*i/(v.nx-1);
    var vel=v.vmin+(v.vmax-v.vmin)*j/(v.nv-1);
    /* Initial: Maxwellian + perturbation */
    var M=Math.exp(-vel*vel/2)/(Math.sqrt(2*Math.PI));
    var pert=1+0.1*Math.cos(2*Math.PI*x);
    v.f[i].push(M*pert);
  }
}
v.t=0},
step:function(dt){var v=STATE.vlasov;
var dx=(v.xmax-v.xmin)/(v.nx-1);
var dv=(v.vmax-v.vmin)/(v.nv-1);
/* Solve df/dt + v df/dx = 0 (advection) */
var newF=[];
for(var i=0;i<v.nx;i++){
  newF.push([]);
  for(var j=0;j<v.nv;j++){
    var vel=v.vmin+j*dv;
    var x=v.xmin+i*dx;
    /* Upwind */
    var ip=(i-1+v.nx)%v.nx;
    var im=(i+1)%v.nx;
    var dfdx;
    if(vel>0)dfdx=(v.f[i][j]-v.f[ip][j])/dx;
    else dfdx=(v.f[im][j]-v.f[i][j])/dx;
    newF[i].push(v.f[i][j]-vel*dfdx*dt);
  }
}
v.f=newF;
v.t+=dt},
tick:function(dt){STATE.time+=dt;var v=STATE.vlasov;if(!STATE.playing)return;
for(var i=0;i<3;i++)this.step(0.01)},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var v=STATE.vlasov;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('VLASOV — t='+fmt(v.t,2)+' · phase space f(x,v)',30,30);
/* Phase space heatmap */
var px=60,py=80,pw=W*0.5,ph=H*0.5;
var maxF=0;
for(var i=0;i<v.nx;i++)for(var j=0;j<v.nv;j++)if(v.f[i][j]>maxF)maxF=v.f[i][j];
var cw=pw/v.nx,ch=ph/v.nv;
for(var i2=0;i2<v.nx;i2++){
  for(var j2=0;j2<v.nv;j2++){
    var val=v.f[i2][j2]/maxF;
    ctx.fillStyle=plasmaColor(val);
    ctx.fillRect(px+i2*cw,py+(v.nv-1-j2)*ch,cw+0.5,ch+0.5);
  }
}
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;
ctx.strokeRect(px,py,pw,ph);
/* Axis labels */
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('x',px+pw+5,py+ph/2);
ctx.fillText('v',px+pw/2,py+ph+15);
/* Density profile (integrate over v) */
var dx2=W*0.65,dy=80,dw=W*0.3,dh=H*0.3;
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('DENSITY n(x) = ∫f dv',dx2,dy-5);
drawAxes(ctx,dx2,dy,dw,dh,'x','n');
ctx.strokeStyle='#00d0ff';ctx.lineWidth=2;
ctx.beginPath();
var nProf=[];
for(var i3=0;i3<v.nx;i3++){
  var sum=0;
  for(var j3=0;j3<v.nv;j3++)sum+=v.f[i3][j3];
  nProf.push(sum);
}
var maxN=Math.max.apply(null,nProf);
nProf.forEach(function(nv,i4){
  var x=dx2+i4/v.nx*dw;
  var y=dy+dh-nv/maxN*dh;
  if(i4===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Info */
var ix=W-280,iy=dy+dh+60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,180);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,180);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('VLASOV',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';

registerModule('landau',{title:'Landau Damping',icon:'∿',desc:'Collisionless damping via wave-particle resonance.',init:function(){this.compute()},
compute:function(){var l=STATE.landau;
l.gamma=landauDamping(l.k,l.vD,l.vT);
l.spectrum=[];
for(var v=-4;v<=4;v+=0.02){
  var f=Math.exp(-v*v/(2*l.vT*l.vT))/(l.vT*Math.sqrt(2*Math.PI));
  l.spectrum.push({v:v,f:f,resonant:Math.abs(v-l.vD)<0.1});
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);

var px=60,py=80,pw=W-120,ph=H*0.4;
drawAxes(ctx,px,py,pw,ph,'v (phase velocity)','f(v)');

ctx.beginPath();
l.spectrum.forEach(function(p,i){
  var x=px+(p.v+4)/8*pw;

});

/* Phase velocity */
var vph=px+(l.vD+4)/8*pw;
ctx.strokeStyle='#ffb000';ctx.lineWidth=2;ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(vph,py);ctx.lineTo(vph,py+ph);ctx.stroke();

ctx.strokeStyle='rgba(255,48,128,.5)';
ctx.fillStyle='rgba(255,48,128,.15)';

var vRes2=px+(l.vD+0.5+4)/8*pw;
ctx.fillRect(vRes1,py,vRes2-vRes1,ph);
/* Slope at resonance */
var fRes=Math.exp(-l.vD*l.vD/(2*l.vT*l.vT))/(l.vT*Math.sqrt(2*Math.PI));
var dfdv=-l.vD/(l.vT*l.vT)*fRes;

drawGrid(ctx,60,ty+10,W-120,120,3,8);

ctx.beginPath();
for(var t=0;t<=1;t+=0.01){

ctx.stroke();

var ix=W-280,iy=60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,240);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,240);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('LANDAU PARAMS',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('k:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(l.k,ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('v_phase:',ix+10,iy+68);ctx.fillStyle='#ffb000';ctx.fillText(l.vD,ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('v_thermal:',ix+10,iy+88);ctx.fillStyle='#00d0ff';ctx.fillText(l.vT,ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('γ (damping):',ix+10,iy+113);ctx.fillStyle='#ff3080';ctx.fillText(fmt(l.gamma,4),ix+180,iy+113);
ctx.fillStyle='#a080c0';ctx.fillText('df/dv @ vph:',ix+10,iy+138);ctx.fillStyle='#c060ff';ctx.fillText(fmt(dfdv,4),ix+180,iy+138);
ctx.fillStyle='#a080c0';ctx.fillText('Sign:',ix+10,iy+163);
ctx.fillStyle=dfdv<0?'#40ff80':'#ff3060';

ctx.fillStyle='#a080c0';ctx.fillText('Energy:',ix+10,iy+238);ctx.fillStyle='#c060ff';ctx.fillText('Wave → particles',ix+180,iy+238);
setStats('<div>γ: '+fmt(l.gamma,4)+'</div><div>k: '+l.k+'</div>');
badge('∿ Landau · γ='+fmt(l.gamma,3));
SV('sbN','—');SV('sbT','—');SV('sbB','—');SV('sbBeta','—')},

/* 16. FOKKER-PLANCK */
registerModule('fp',{title:'Fokker-Planck',icon:'⊕',desc:'Coulomb collisions, Rosenbluth potentials.',init:function(){this.compute()},
compute:function(){var f=STATE.fp;
var coeffs=fpCoefficients(f.v,f.vt,f.n,f.lnL,f.Z);
f.drag=coeffs.drag;
f.diff=coeffs.diffusion;
f.distribution=[];
for(var v=0.01;v<=4;v+=0.05){
  var M=maxwellian(v,1,0.5,ME);
  var coeffs2=fpCoefficients(v,f.vt,f.n,f.lnL,f.Z);
  f.distribution.push({v:v,f:M,drag:coeffs2.drag,diff:coeffs2.diffusion});
}
f.lossRate=coeffs.drag*f.v;
f.relaxTime=1/Math.max(coeffs.drag,1e-30)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);

f.distribution.forEach(function(p,i){

});

/* Current v */
var vx=px+f.v/4*pw;
ctx.strokeStyle='#ffb000';ctx.setLineDash([3,3]);
ctx.beginPath();ctx.moveTo(vx,py);ctx.lineTo(vx,py+ph);ctx.stroke();
ctx.setLineDash([]);
/* Drag & diffusion */
var dx=W*0.65,dy=80,dw=W*0.3,dh=H*0.4;
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('DRAG & DIFFUSION',dx,dy-5);
drawAxes(ctx,dx,dy,dw,dh,'v','coeff');
var maxC=0;
f.distribution.forEach(function(p){maxC=Math.max(maxC,p.drag,p.diff)});
ctx.strokeStyle='#ff3080';ctx.lineWidth=2;
ctx.beginPath();
f.distribution.forEach(function(p,i){
  var x=dx+p.v/4*dw;
  var y=dy+dh-Math.min(p.drag/maxC,1)*dh;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);

ctx.beginPath();
f.distribution.forEach(function(p,i){

  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
ctx.fillStyle='#ff3080';ctx.font='10px monospace';
ctx.fillText('— Drag',dx+dw-100,dy+15);
ctx.fillStyle='#40ff80';
ctx.fillText('— Diffusion',dx+dw-100,dy+30);
/* Info */
var ix=W-280,iy=dy+dh+60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,200);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,200);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('FP PARAMS',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('n:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(f.n,2),ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('v:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(f.v,ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('v_t:',ix+10,iy+88);ctx.fillStyle='#00d0ff';ctx.fillText(f.vt,ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('ln Λ:',ix+10,iy+113);ctx.fillStyle='#ffb000';ctx.fillText(f.lnL,ix+180,iy+113);
ctx.fillStyle='#a080c0';ctx.fillText('Z:',ix+10,iy+133);ctx.fillStyle='#c060ff';ctx.fillText(f.Z,ix+180,iy+133);
ctx.fillStyle='#a080c0';ctx.fillText('Drag:',ix+10,iy+158);ctx.fillStyle='#ff3080';ctx.fillText(fmtSci(f.drag,2),ix+180,iy+158);
ctx.fillStyle='#a080c0';ctx.fillText('Diffusion:',ix+10,iy+178);ctx.fillStyle='#40ff80';ctx.fillText(fmtSci(f.diff,2),ix+180,iy+178);
setStats('<div>drag: '+fmtSci(f.drag,2)+'</div><div>diff: '+fmtSci(f.diff,2)+'</div>');
badge('⊕ FP · lnΛ='+f.lnL);
SV('sbN',fmtSci(f.n,2));SV('sbT','—');SV('sbB','—');SV('sbBeta','—')},

mathPanel:function(){return '<div class="sec"><h4>Fokker-Planck</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Equação:</b><br>∂f/∂t = -∂/∂v[A(v)f] + ½∂²/∂v²[D(v)f]<br><br><b>Coeficientes (Rosenbluth):</b><br>A(v) = Γ·∂h/∂v (drag)<br>D(v) = Γ·∂²g/∂v² (diffusion)<br>Γ = 4πn Z²e⁴ lnΛ/(4π ε₀)² m²<br><br><b>Coulomb logarithm:</b><br>ln Λ ≈ 24 - ln(√n/T)<br>Valores: 5-25<br><br><b>Pitch angle scattering:</b><br>Dominado em 90°<br>ν_⊥ = ν_∥/2<br><br><b>Relaxation times:</b><br>τ_e-e ~ (T_e^1.5/n) · 1e-6 s<br>τ_i-i ~ (T_i^1.5/n) · (m_i/m_e)^0.5<br><br><b>Applications:</b><br>• Runaway electrons<br>• Alpha particle slowing<br>• NBI thermalization<br>• Ohmic heating<br>• Solar wind electrons<br>• Cosmic ray propagation<br><br><b>Complements:</b><br>Vlasov (colisões) + FP (dissipação)<br>= Landau-FP equation</div></div>'}});

<script>

SV('sbN','—');SV('sbT','5800K');SV('sbB','1e-3T');SV('sbBeta','—')},

/* 18. PARKER SPIRAL */
registerModule('parker',{title:'Parker Spiral',icon:'💫',desc:'Solar wind magnetic field structure.',init:function(){this.compute()},
compute:function(){var p=STATE.parker;
p.spiral=[];
for(var r=1;r<=10;r+=0.1){
  var vsw=p.vsw*1000;
  var angle=Math.atan(p.vrot*(r*1.496e11)/vsw);
  var rAU=r;
  var x=rAU*Math.cos(angle);
  var y=rAU*Math.sin(angle);
  var Bmag=5e-9*Math.pow(1/rAU,2)*Math.sqrt(1+Math.pow(Math.tan(angle),2));
  p.spiral.push({r:rAU,x:x,y:y,angle:angle*180/Math.PI,B:Bmag});
}
p.angle1AU=Math.atan(p.vrot*1.496e11/(p.vsw*1000))*180/Math.PI;
p.B1AU=5e-9;
p.BR=5e-9*Math.pow(1,2);
p.BT=p.BR*Math.tan(p.angle1AU*Math.PI/180)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var p=STATE.parker;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('PARKER SPIRAL — angle@1AU='+fmt(p.angle1AU,1)+'°',30,30);
/* Sun + spiral */
var cx=W*0.35,cy=H*0.5;
var scale=Math.min(W,H)*0.5/10;
/* Sun */
ctx.fillStyle='#ffb000';
ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#020106';ctx.font='bold 11px monospace';ctx.textAlign='center';
ctx.fillText('☉',cx,cy+4);ctx.textAlign='left';
/* Spiral */
ctx.strokeStyle='#00d0ff';ctx.lineWidth=2;
ctx.beginPath();
p.spiral.forEach(function(s,i){
  var x=cx+s.x*scale;
  var y=cy+s.y*scale;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Earth marker */
var earthX=cx+Math.cos(p.angle1AU*Math.PI/180)*scale;
var earthY=cy+Math.sin(p.angle1AU*Math.PI/180)*scale;
ctx.fillStyle='#40ff80';
ctx.beginPath();ctx.arc(earthX,earthY,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#40ff80';ctx.font='bold 10px monospace';
ctx.fillText('Earth',earthX+8,earthY);
/* Info */
var ix=W-260,iy=60;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,240,240);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,240);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('PARKER INFO',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('v_sw:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(p.vsw+' km/s',ix+160,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('Ω_sun:',ix+10,iy+68);ctx.fillStyle='#ffb000';ctx.fillText((p.vrot*1e6).toFixed(1)+'e-6 rad/s',ix+160,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('Spiral angle:',ix+10,iy+93);ctx.fillStyle='#40ff80';ctx.fillText(fmt(p.angle1AU,2)+'°',ix+160,iy+93);
ctx.fillStyle='#a080c0';ctx.fillText('B @1AU:',ix+10,iy+118);ctx.fillStyle='#00d0ff';ctx.fillText('5 nT',ix+160,iy+118);
ctx.fillStyle='#a080c0';ctx.fillText('B_R:',ix+10,iy+143);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(p.BR*1e9,2)+' nT',ix+160,iy+143);
ctx.fillStyle='#a080c0';ctx.fillText('B_T:',ix+10,iy+163);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(p.BT*1e9,2)+' nT',ix+160,iy+163);
ctx.fillStyle='#a080c0';ctx.fillText('Tip:',ix+10,iy+188);ctx.fillStyle='#ffb000';ctx.fillText('Dipole + rot',ix+160,iy+188);
ctx.fillStyle='#a080c0';ctx.fillText('Sector:',ix+10,iy+213);ctx.fillStyle='#c060ff';ctx.fillText('4 sectors',ix+160,iy+213);
ctx.fillStyle='#a080c0';ctx.fillText('Polarity:',ix+10,iy+238);
ctx.fillStyle=p.vsw>0?'#ff3080':'#40ff80';
ctx.fillText('+ / -',ix+160,iy+238);
setStats('<div>v_sw: '+p.vsw+'km/s</div><div>Angle: '+fmt(p.angle1AU,1)+'°</div>');
badge('💫 Parker · '+p.vsw+'km/s');
SV('sbN','5e6');SV('sbT','10eV');SV('sbB','5nT');SV('sbBeta','—')},

registerModule('cme',{title:'CME / Space Weather',icon:'💥',desc:'Coronal mass ejection + Dst storm.',init:function(){this.compute()},
compute:function(){var c=STATE.cme;
c.history=[];
var t=0;
for(var i=0;i<50;i++){
  var shock=(i<10)?0:(1-Math.exp(-(i-10)/5));
  var dst=shock*c.Bz*20;
  c.history.push({t:i,shock:shock,dst:dst});
}
c.impact=c.Bz<-5&&c.speed>500;
c.peakDst=-100*c.Bz/10;
c.severity=c.peakDst<-300?'EXTREME':c.peakDst<-100?'STRONG':c.peakDst<-50?'MODERATE':'WEAK';
c.auroraLat=Math.max(30,67-Math.abs(c.peakDst)/2)},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var c=STATE.cme;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('SPACE WEATHER — Dst='+fmt(c.peakDst,0)+' nT · '+c.severity,30,30);
/* Sun + CME */
var cx=W*0.3,cy=H*0.4;
ctx.fillStyle='#ffb000';
ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.fill();
/* CME cone */
ctx.fillStyle='rgba(255,48,128,.3)';
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,150,-Math.PI/6,Math.PI/6);
ctx.closePath();ctx.fill();
/* Earth */
var ex=cx+Math.cos(0.2)*200;
var ey=cy+Math.sin(0.2)*200;
ctx.fillStyle='#40ff80';
ctx.beginPath();ctx.arc(ex,ey,15,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#020106';ctx.font='bold 10px monospace';ctx.textAlign='center';
ctx.fillText('Earth',ex,ey+4);ctx.textAlign='left';

ctx.beginPath();
ctx.ellipse(ex,ey,60,30,0.2,0,Math.PI*2);ctx.stroke();
/* Dst time series */
var dx=W*0.6,dy=80,dw=W*0.35,dh=H*0.35;
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';

drawAxes(ctx,dx,dy,dw,dh,'hours','Dst (nT)');

ctx.beginPath();
c.history.forEach(function(p,i){

});
ctx.stroke();
ctx.fillStyle='#ff3060';ctx.font='bold 10px monospace';
ctx.fillText('-100 nT (strong)',dx+10,dy+dh*0.4);

ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,200);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,200);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('SPACE WEATHER',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('v_CME:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(c.speed+' km/s',ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('n:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(c.density+' p/cc',ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('Bz:',ix+10,iy+88);ctx.fillStyle='#ff3080';ctx.fillText(c.Bz+' nT',ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('Dst:',ix+10,iy+113);ctx.fillStyle='#ffb000';ctx.fillText(fmt(c.peakDst,0)+' nT',ix+180,iy+113);
ctx.fillStyle='#a080c0';ctx.fillText('Severity:',ix+10,iy+138);
ctx.fillStyle=c.severity==='EXTREME'?'#ff3060':c.severity==='STRONG'?'#ffb000':'#40ff80';
ctx.fillText(c.severity,ix+180,iy+138);

ctx.fillStyle='#c060ff';ctx.fillText(fmt(c.auroraLat,1)+'°',ix+180,iy+188);
setStats('<div>Dst: '+fmt(c.peakDst,0)+'nT</div><div>'+c.severity+'</div>');
badge('💥 CME · Dst='+fmt(c.peakDst,0)+'nT');
SV('sbN',c.density+'p/cc');SV('sbT','—');SV('sbB',c.Bz+'nT');SV('sbBeta','—')},

/* 20. MAGNETOSPHERE */
registerModule('magneto',{title:'Magnetosphere',icon:'🛡',desc:'Van Allen belts, magnetopause, currents.',init:function(){this.compute()},
compute:function(){var m=STATE.magneto;
/* Dipole field at equator */
m.B_eq=3.1e-5*Math.pow(1/m.L,3);
/* Magnetopause distance (solar wind pressure) */
var rho=5e6*MP;
var vsw=400e3;
m.mp=Math.pow((8e22)/(2*MU0*rho*vsw*vsw),1/6)/6.371e6;
/* Van Allen flux */
m.flux=vanAllenFlux(m.L,m.B_eq);
/* Belts */
m.belts=[];
for(var L=1;L<=8;L+=0.1){
  var flux=vanAllenFlux(L,3.1e-5/Math.pow(L,3));
  m.belts.push({L:L,flux:flux,inner:L<2.5,outer:L>3});
}
/* Magnetic field lines */
m.lines=[];
for(var L2=1;L2<=8;L2+=1){
  var pts=[];
  for(var lat=-80;lat<=80;lat+=5){
    var r=L2*Math.pow(Math.cos(lat*Math.PI/180),2);
    var x=r*Math.cos(lat*Math.PI/180);
    var y=r*Math.sin(lat*Math.PI/180);
    pts.push({x:x,y:y});
  }
  m.lines.push({L:L2,pts:pts});
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var m=STATE.magneto;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('MAGNETOSPHERE — L='+m.L+' · Mp='+fmt(m.mp,2)+' R_E',30,30);

var cx=W*0.35,cy=H*0.5;
var scale=Math.min(W,H)*0.6/8;
/* Earth */
ctx.fillStyle='#40ff80';
ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
/* Field lines */
m.lines.forEach(function(line){
  ctx.strokeStyle='rgba(0,208,255,'+(line.L===Math.round(m.L)?0.9:0.2)+')';
  ctx.lineWidth=line.L===Math.round(m.L)?2:1;

  });

});
/* Van Allen belts */
ctx.fillStyle='rgba(255,48,128,.15)';

ctx.fillStyle='rgba(255,176,0,.15)';

ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,240,240);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('MAGNETO INFO',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('L shell:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(m.L,ix+160,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('B_eq:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(m.B_eq,2)+' T',ix+160,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('Magnetopause:',ix+10,iy+93);ctx.fillStyle='#ffb000';ctx.fillText(fmt(m.mp,2)+' R_E',ix+160,iy+93);
ctx.fillStyle='#a080c0';ctx.fillText('Flux:',ix+10,iy+118);ctx.fillStyle='#ff3080';ctx.fillText(fmtSci(m.flux,2),ix+160,iy+118);
ctx.fillStyle='#a080c0';ctx.fillText('Inner belt:',ix+10,iy+143);ctx.fillStyle='#40ff80';ctx.fillText('L=1.5-2.5',ix+160,iy+143);
ctx.fillStyle='#a080c0';ctx.fillText('Outer belt:',ix+10,iy+163);ctx.fillStyle='#ffb000';ctx.fillText('L=3-7',ix+160,iy+163);
ctx.fillStyle='#a080c0';ctx.fillText('Slot region:',ix+10,iy+183);ctx.fillStyle='#c060ff';ctx.fillText('L=2.5-3',ix+160,iy+183);
ctx.fillStyle='#a080c0';ctx.fillText('Currents:',ix+10,iy+208);ctx.fillStyle='#00d0ff';ctx.fillText('Ring, tail, etc',ix+160,iy+208);
ctx.fillStyle='#a080c0';ctx.fillText('Mp tip:',ix+10,iy+233);ctx.fillStyle='#ffb000';ctx.fillText('10 R_E dayside',ix+160,iy+233);
setStats('<div>L: '+m.L+'</div><div>Mp: '+fmt(m.mp,1)+'RE</div>');
badge('🛡 Magneto · L='+m.L);
SV('sbN','1e7');SV('sbT','100eV');SV('sbB',fmtSci(m.B_eq,2)+'T');SV('sbBeta','—')},

<script>
/* 22. ACCRETION DISK */
registerModule('accretion',{title:'Accretion Disk',icon:'🌀',desc:'Shakura-Sunyaev, black hole X-ray.',init:function(){this.compute()},
compute:function(){var a=STATE.accretion;
a.Rs=2*6.674e-11*a.M/(CL*CL);
a.Rin=6*a.Rs;
a.Tmax=diskTemp(a.Rin,a.Mdot,a.M);
a.spectrum=[];
for(var R=a.Rin;R<=100*a.Rs;R+=a.Rs){
  var T=diskTemp(R,a.Mdot,a.M);
  a.spectrum.push({R:R/Rs,T:T});
}
a.Ledd=diskEddingtonL(a.M);
a.L=a.Mdot*0.1*CL*CL;
a.eddRatio=a.L/a.Ledd;
a.Tmax_K=a.Tmax;
a.Tmax_eV=a.Tmax/11604;
/* Photon energy from peak (Wien) */
a.lambda_max=2.898e-3/a.Tmax;
a.E_keV=12.4/(a.lambda_max*1e9)*1e-3},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var a=STATE.accretion;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('ACCRETION — M='+fmt(a.M/1.989e30,1)+' M_sun · L/Ledd='+fmt(a.eddRatio,3),30,30);
/* Black hole + disk */
var cx=W*0.35,cy=H*0.5;
var scale=Math.min(W,H)*0.4;
/* Disk (flattened ellipse) */
for(var i=5;i>=1;i--){
  var rr=i/5*scale;
  var alpha=1-i/6;
  var temp=a.spectrum[Math.floor(i/5*(a.spectrum.length-1))];
  if(!temp)continue;
  var Tnorm=Math.min(temp.T/a.Tmax,1);
  var color=plasmaColor(1-Tnorm*0.7);
  ctx.fillStyle=color;
  ctx.globalAlpha=alpha*0.6;
  ctx.beginPath();
  ctx.ellipse(cx,cy,rr,rr*0.3,0,0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;
/* Black hole */
ctx.fillStyle='#000';
ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.fill();
/* Photon ring */
ctx.strokeStyle='#ffb000';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.stroke();
/* Temperature profile */
var px=W*0.65,py=80,pw=W*0.3,ph=H*0.4;
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('TEMPERATURE T(R)',px,py-5);
drawAxes(ctx,px,py,pw,ph,'R/R_s','T (K)');
ctx.strokeStyle='#ffb000';ctx.lineWidth=2;
ctx.beginPath();
a.spectrum.forEach(function(p,i){
  var x=px+Math.log10(p.R)/2*pw;
  var y=py+ph-p.T/a.Tmax*ph;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Info */
var ix=W-280,iy=py+ph+40;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,220);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,220);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('ACCRETION INFO',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('M:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(fmt(a.M/1.989e30,2)+' M_sun',ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('R_s:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(a.Rs,2)+' m',ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('L:',ix+10,iy+88);ctx.fillStyle='#ff3080';ctx.fillText(fmtSci(a.L,2)+' W',ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('L_Edd:',ix+10,iy+108);ctx.fillStyle='#ffb000';ctx.fillText(fmtSci(a.Ledd,2)+' W',ix+180,iy+108);
ctx.fillStyle='#a080c0';ctx.fillText('Edd ratio:',ix+10,iy+133);ctx.fillStyle='#c060ff';ctx.fillText(fmt(a.eddRatio,3),ix+180,iy+133);
ctx.fillStyle='#a080c0';ctx.fillText('T_max:',ix+10,iy+153);ctx.fillStyle='#40ff80';ctx.fillText(fmtSci(a.Tmax_K,2)+' K',ix+180,iy+153);
ctx.fillStyle='#a080c0';ctx.fillText('E_peak:',ix+10,iy+173);ctx.fillStyle='#00d0ff';ctx.fillText(fmt(a.E_keV,3)+' keV',ix+180,iy+173);
ctx.fillStyle='#a080c0';ctx.fillText('Spectrum:',ix+10,iy+198);ctx.fillStyle='#ffb000';ctx.fillText('X-ray',ix+180,iy+198);
ctx.fillStyle='#a080c0';ctx.fillText('Regime:',ix+10,iy+218);
ctx.fillStyle=a.eddRatio<0.01?'#ff3080':a.eddRatio<0.3?'#ffb000':'#40ff80';
ctx.fillText(a.eddRatio<0.01?'Quiescent':a.eddRatio<0.3?'LLAGN':'Bright AGN',ix+180,iy+218);
setStats('<div>M: '+fmt(a.M/1.989e30,1)+'Msun</div><div>L: '+fmt(a.eddRatio*100,2)+'%Ledd</div>');
badge('🌀 Accretion · L/Ledd='+fmt(a.eddRatio,2));
SV('sbN','—');SV('sbT',fmt(a.Tmax_K,0)+'K');SV('sbB','—');SV('sbBeta','—')},
controls:function(){var a=STATE.accretion;var h='<div class="sec"><h4>Black hole</h4>';
h+='<div class="ctrl"><div class="lbl"><span>log10(M/M_sun)</span><span>'+Math.log10(a.M/1.989e30).toFixed(2)+'</span></div><input type="range" min="-2" max="9" step="0.1" value="'+Math.log10(a.M/1.989e30)+'" oninput="STATE.accretion.M=Math.pow(10,parseFloat(this.value))*1.989e30;MODULES.accretion.compute()"></div>';
h+='<div class="ctrl"><div class="lbl"><span>Mdot (M_sun/yr)</span><span>'+fmtSci(a.Mdot/1.989e30*3.15e7,2)+'</span></div><input type="range" min="-12" max="-2" step="0.1" value="'+Math.log10(a.Mdot/1.989e30*3.15e7)+'" oninput="STATE.accretion.Mdot=Math.pow(10,parseFloat(this.value))*1.989e30/3.15e7;MODULES.accretion.compute()"></div>';
h+='</div>';
h+='<div class="sec"><h4>Objects</h4><div class="chip-row">';
[['Stellar BH',10,1e-10],['Sgr A*',4.3e6,1e-8],['M87*',6.5e9,1e-5],['Cygnus X-1',21,1e-8],['XRB',10,1e-8],['Quasar',1e9,1]].forEach(function(p){
  h+='<div class="chip" onclick="STATE.accretion.M='+p[1]+'*1.989e30;STATE.accretion.Mdot='+p[2]+'*1.989e30/3.15e7;MODULES.accretion.compute();renderLeftPanel()">'+p[0]+'</div>';

return h},
mathPanel:function(){return '<div class="sec"><h4>Accretion Disks</h4><div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)"><b>Shakura-Sunyaev (1973):</b><br>T(R) = [3 G M Mdot (1-√(R_in/R))/(8π σ R³)]^(1/4)<br><br><b>Viscosity:</b><br>α-prescription: ν = α c_s H<br>α ~ 0.01-0.1<br>MRI turbulence<br><br><b>Temperature profile:</b><br>T ∝ R^(-3/4)<br>Peak: ~1e7 K (stellar BH)<br>Emission: UV/X-ray<br><br><b>Efficiency:</b><br>η = 0.057 (Schwarzschild)<br>η = 0.42 (extremal Kerr)<br>vs 0.007 (fusion)<br><br><b>Eddington luminosity:</b><br>L_Edd = 4π G M m_p c/σ_T<br>= 1.26e31 W · (M/M_sun)<br>Acima: radiation pressure expels<br><br><b>Tipos:</b><br>• Thin disk (Shakura-Sunyaev)<br>• Slim disk (super-Edd)<br>• ADAF/RIAF (radiatively ineff.)<br>• Thick torus (Polish doughnut)<br><br><b>Observações:</b><br>• Cygnus X-1 (1964)<br>• Sgr A* (EHT 2022)<br>• M87* (EHT 2019)<br>• TDE (tidal disruption)</div></div>'}});

/* 23. PULSAR */
registerModule('pulsar',{title:'Pulsar / Magnetar',icon:'✴',desc:'Rotating neutron star, magnetic dipole.',init:function(){this.compute()},
compute:function(){var p=STATE.pulsar;
p.Omega=2*Math.PI/p.P;
p.Bcrit=4.4e13;
p.magnetar=p.B>p.Bcrit;
p.age=p.P/(2*p.dPdt)/3.15e7;
p.Pdot=p.dPdt;
/* Rotation energy */
p.Erot=0.5*1e38*p.Omega*p.Omega;
p.Lsd=pulsarSpinDown(p.B,1e4,p.Omega,1e38);
/* Light cylinder */
p.R_LC=CL/p.Omega;
/* Traces */
p.traces=[];
var t=0;
for(var i=0;i<200;i++){
  var phase=(i/200)%1;
  var pulse=Math.exp(-Math.pow(phase/0.05,2))+0.5*Math.exp(-Math.pow((phase-0.5)/0.05,2));
  p.traces.push({t:i,amp:pulse});
  t+=1;
}},
tick:function(dt){STATE.time+=dt},
draw:function(ctx){var W=CANV.W,H=CANV.H;ctx.fillStyle='#020106';ctx.fillRect(0,0,W,H);
var p=STATE.pulsar;
ctx.fillStyle='#ff3080';ctx.font='bold 14px monospace';ctx.textAlign='left';
ctx.fillText('PULSAR — B='+fmtSci(p.B,2)+' G · P='+p.P+' s',30,30);
/* Neutron star + magnetic field */
var cx=W*0.35,cy=H*0.5;
/* Field lines (dipole) */
ctx.strokeStyle='rgba(0,208,255,.4)';ctx.lineWidth=1.5;
for(var a=0;a<12;a++){
  var ang=a/12*Math.PI*2;
  ctx.beginPath();
  for(var r=15;r<=150;r+=5){
    var theta=(r-15)/135*Math.PI*0.9;
    var x=cx+Math.sin(theta)*r*Math.cos(ang)*0.5;
    var y=cy+Math.sin(theta)*r*Math.sin(ang)*0.5+Math.cos(theta)*r*0.3;
    if(r===15)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}
/* Star */
ctx.fillStyle='#ffb000';
ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.fill();
/* Beams */
ctx.fillStyle='rgba(255,176,0,.4)';
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx-100,cy-180);
ctx.lineTo(cx-50,cy-200);
ctx.closePath();ctx.fill();
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+100,cy+180);
ctx.lineTo(cx+50,cy+200);
ctx.closePath();ctx.fill();
/* Pulse profile */
var px=W*0.6,py=80,pw=W*0.35,ph=H*0.35;
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';

drawAxes(ctx,px,py,pw,ph,'phase','intensity');

ctx.beginPath();
p.traces.forEach(function(tr,i){
  var x=px+i/p.traces.length*pw;
  var y=py+ph-tr.amp*ph;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
});
ctx.stroke();
/* Info */
var ix=W-280,iy=py+ph+40;
ctx.fillStyle='rgba(12,5,18,.9)';ctx.fillRect(ix,iy,260,220);
ctx.strokeStyle='#ff3080';ctx.lineWidth=1.5;ctx.strokeRect(ix,iy,260,220);
ctx.fillStyle='#ff3080';ctx.font='bold 11px monospace';
ctx.fillText('PULSAR INFO',ix+10,iy+22);
ctx.fillStyle='#a080c0';ctx.font='10px monospace';
ctx.fillText('B:',ix+10,iy+48);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(p.B,2)+' G',ix+180,iy+48);
ctx.fillStyle='#a080c0';ctx.fillText('P:',ix+10,iy+68);ctx.fillStyle='#00d0ff';ctx.fillText(p.P+' s',ix+180,iy+68);
ctx.fillStyle='#a080c0';ctx.fillText('Pdot:',ix+10,iy+88);ctx.fillStyle='#00d0ff';ctx.fillText(fmtSci(p.Pdot,2),ix+180,iy+88);
ctx.fillStyle='#a080c0';ctx.fillText('Age:',ix+10,iy+113);ctx.fillStyle='#ffb000';ctx.fillText(fmtSci(p.age,2)+' yr',ix+180,iy+113);
ctx.fillStyle='#a080c0';ctx.fillText('E_rot:',ix+10,iy+138);ctx.fillStyle='#ff3080';ctx.fillText(fmtSci(p.Erot,2)+' J',ix+180,iy+138);
ctx.fillStyle='#a080c0';ctx.fillText('L_sd:',ix+10,iy+163);ctx.fillStyle='#40ff80';ctx.fillText(fmtSci(p.Lsd,2)+' W',ix+180,iy+163);
ctx.fillStyle='#a080c0';ctx.fillText('R_LC:',ix+10,iy+188);ctx.fillStyle='#c060ff';ctx.fillText(fmtSci(p.R_LC,2)+' m',ix+180,iy+188);
ctx.fillStyle='#a080c0';ctx.fillText('Magnetar?',ix+10,iy+213);
ctx.fillStyle=p.magnetar?'#ff3060':'#00d0ff';

setStats('<div>B: '+fmtSci(p.B,2)+'G</div><div>P: '+p.P+'s</div>');
badge('✴ Pulsar · B='+fmtSci(p.B,2)+'G');
SV('sbN','—');SV('sbT','1e6K');SV('sbB',fmtSci(p.B,2)+'G');SV('sbBeta','—')},
controls:function(){var p=STATE.pulsar;var h='<div class="sec"><h4>Star</h4>';
h+='<div class="ctrl"><div class="lbl"><span>log10(B/G)</span><span>'+Math.log10(p.B).toFixed(1)+'</span></div><input type="range" min="8" max="15" step="0.1" value="'+Math.log10(p.B)+'" oninput="STATE.pulsar.B=Math.pow(10,parseFloat(this.value));MODULES.pulsar.compute()"></div>';

h+='</div>';

/* 26. REACTOR DESIGN */
registerModule('tokamakPerf',{title:'Reactor Performance',icon:'🎯',desc:'ITER-like: Q, fusion power, H-factor.',init:function(){this.compute()},
compute:function(){var t=STATE.tokamakPerf;
/* IPB98(y,2) scaling (simplified) */
t.epsilon=t.a/t.R;
t.Bt=t.B0;
t.volume=2*Math.PI*t.R*Math.PI*t.a*t.a*t.a*1;
t.volume=2*Math.PI*t.R*Math.PI*t.a*t.a;
/* IPB98: tau_E ~ H98 * 0.0562 * Ip^0.93 * Bt^0.15 * P^-0.69 * n^0.41 * R^1.97 * a^-0.58 * M^0.19 * kappa^0.78 * eps^0.58 */
var IpMA=t.Ip;
var eps=t.epsilon;
t.tauE98=0.0562*Math.pow(IpMA,0.93)*Math.pow(t.B0,0.15)*Math.pow(t.Paux,-0.69)*Math.pow(t.n/1e19,0.41)*Math.pow(t.R,1.97)*Math.pow(t.a,-0.58)*1*Math.pow(1.7,0.78)*Math.pow(eps,0.58);
t.tauE=t.H98*t.tauE98;
/* Triple product */
t.triple=t.n*t.T_keV*t.tauE;
/* Fusion power (D-T) */
var sigv=dtReactivity(t.T_keV);
var nD=t.n/2,nT=t.n/2;
t.Pfus=nD*nT*sigv*17.6e6*EC*t.volume;
/* Q */
t.Q=t.Pfus/(t.Paux*1e6);
/* Alpha power */
t.Palpha=t.Pfus/5;
/* Neutron power */
t.Pneut=t.Pfus*4/5;
/* Greenwald density */
t.nGreenwald=t.Ip/(Math.PI*t.a*t.a);
/* Beta N */
t.betaT=2*MU0*t.n*t.T_keV*1000*EC/(t.B0*t.B0);
t.betaN=t.betaT*100*t.a*t.B0/t.Ip;
/* History */
if(!t.history)t.history=[];
t.history.push({t:STATE.time,Q:t.Q,Pfus:t.Pfus,tauE:t.tauE});
if(t.history.length>200)t.history.shift()},

if(t.history.length>200)t.history.shift()},

<script>
function buildTabs(){var t=$('tbTabs');t.innerHTML='';

i.innerHTML='<span class="tab-icon">'+x.icon+'</span><span>'+x.label+'</span>';
i.onclick=function(){switchTab(x.key)};
t.appendChild(i)})}
function switchTab(k){STATE.currentTab=k;

renderLeftPanel();renderRightPanel()}
function switchRp(name,e){STATE.currentRp=name;

function renderLeftPanel(){

}

}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce()}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal()
});
var lastT=performance.now(),fAcc=0,fFr=0;
function loop(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  fAcc+=dt;fFr++;
  if(fAcc>=0.5){var e=$('sbFps');if(e)e.textContent=Math.round(fFr/fAcc);fAcc=0;fFr=0}
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt)}catch(e){logMsg('tick error: '+e.message,'error')}}
  if(m&&m.draw){try{CANV.ctx.clearRect(0,0,CANV.W,CANV.H);m.draw(CANV.ctx)}catch(e){
    logMsg('draw('+m.key+') error: '+e.message,'error');
    try{CANV.ctx.fillStyle='#020106';CANV.ctx.fillRect(0,0,CANV.W,CANV.H);CANV.ctx.fillStyle='#ff3080';CANV.ctx.font='bold 14px monospace';CANV.ctx.textAlign='center';CANV.ctx.textBaseline='middle';CANV.ctx.fillText('Render error: '+e.message,CANV.W/2,CANV.H/2)}catch(_){}
  }}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  logMsg('DOMContentLoaded','success');
  try{buildTabs()}catch(e){logMsg('buildTabs: '+e.message,'error')}
  try{initCanvas()}catch(e){logMsg('initCanvas: '+e.message,'error')}
  try{var m=MODULES[STATE.currentTab];if(m&&m.init)m.init()}catch(e){logMsg('init: '+e.message,'error')}
  try{renderLeftPanel()}catch(e){logMsg('renderLeftPanel: '+e.message,'error')}
  try{renderRightPanel()}catch(e){logMsg('renderRightPanel: '+e.message,'error')}
  logMsg('PLASMA ready','success');
  requestAnimationFrame(loop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  toast('PLASMA ready — 26 módulos fusão + plasma','success',3000);
});
