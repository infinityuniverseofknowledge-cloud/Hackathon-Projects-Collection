<!DOCTYPE html>
<html lang="en" data-theme="lingua">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>LINGUA — Linguistics Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#0f0820;--bg2:#180e2e;--bg3:#221440;--bg4:#2e1c52;
  --panel:#180e2e;--panel2:#221440;--panel3:#2e1c52;--panel4:#3c2868;
  --bd:#3c2868;--bd2:#543a88;--bd3:#7058a8;
  --tx:#f8f0ff;--tx2:#c0a8e0;--tx3:#8870b0;--mu:#584080;
  --c1:#ff60e0;--c1h:#ff90e8;--c1l:#c030b0;
  --c2:#60e0ff;--c2h:#90e8ff;--c2l:#30b0c0;
  --c3:#ffe060;--c3h:#fff090;--c3l:#c0a030;
  --c4:#ff6080;--c4h:#ff90a0;--c4l:#c03060;
  --c5:#60ff90;--c5h:#90ffb0;--c5l:#30c060;
  --c6:#ffa060;--c6h:#ffc090;--c6l:#c07030;
  --c7:#60ffd0;--c7h:#90ffe0;--c7l:#30c090;
  --c8:#c060ff;--c8h:#d090ff;--c8l:#8030c0;
  --ok:#60ff90;--warn:#ffe060;--err:#ff6080;--info:#60e0ff;
  --g1:linear-gradient(135deg,#ff60e0,#60e0ff);
  --g2:linear-gradient(135deg,#ffe060,#ff6080);
  --gHolo:linear-gradient(120deg,#ff60e0,#60e0ff,#60ff90,#ffe060,#ff6080,#ff60e0);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.8);
  --sh2:0 16px 48px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --serif:'Georgia','Times New Roman',serif;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
}
[data-theme="parchment"]{--bg:#f8f0dc;--bg2:#f0e4c8;--bg3:#e0d0b0;--panel:#fff;--panel2:#f8f0dc;--panel3:#f0e4c8;--panel4:#e0d0b0;
  --bd:#c0a880;--bd2:#a08860;--tx:#201808;--tx2:#503c20;--tx3:#807040;
  --c1:#c02080;--c2:#0060c0;--c3:#c08000;--c4:#c00040;--c5:#008040;
  --g1:linear-gradient(135deg,#c02080,#0060c0)}
[data-theme="matrix"]{--bg:#000800;--bg2:#001200;--bg3:#001e00;--panel:#001200;--panel2:#001e00;
  --bd:#004000;--bd2:#006000;--tx:#c0ffd0;--tx2:#60ffa0;--tx3:#00c060;
  --c1:#00ff40;--c2:#00ffa0;--c3:#80ff40;--c4:#40ffc0;
  --g1:linear-gradient(135deg,#00ff40,#00ffa0)}
[data-theme="ink"]{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--panel:#141414;--panel2:#1e1e1e;
  --bd:#2e2e2e;--bd2:#484848;--tx:#f0f0f0;--tx2:#b8b8b8;--tx3:#707070;
  --c1:#40e0ff;--c2:#ff60e0;--c3:#ffe040;--c4:#ff4080;--c5:#40ff90;
  --g1:linear-gradient(135deg,#40e0ff,#ff60e0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* BOOT */
#boot{position:fixed;inset:0;background:#0f0820;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-script{width:200px;height:200px;margin-bottom:20px}
.boot-script svg{width:100%;height:100%}
.boot-script path{fill:none;stroke:#ff60e0;stroke-width:2.5;filter:drop-shadow(0 0 8px #ff60e0)}
.boot-script circle{fill:#60e0ff;filter:drop-shadow(0 0 6px #60e0ff);animation:fire 2s ease-in-out infinite}
.boot-script circle:nth-child(2n){animation-delay:.4s;fill:#ffe060}
.boot-script circle:nth-child(3n){animation-delay:.8s;fill:#60ff90}
.boot-script text{font-family:Georgia,serif;fill:#ffe060;font-size:24px;font-weight:bold}
@keyframes fire{0%,100%{opacity:.4}50%{opacity:1}}
.boot-logo{font-family:var(--disp);font-size:3.4rem;font-weight:900;letter-spacing:14px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:8px}
.boot-sub{font-size:.7rem;color:#ff60e0;letter-spacing:10px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#2e1c52;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #ff60e0}
.boot-pct{font-size:.7rem;color:#ff60e0;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#8870b0;text-align:left;width:min(440px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#60ff90}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* TOPBAR */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.9rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.65rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0f0820;box-shadow:0 0 14px rgba(255,96,224,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tb-status .dot{width:8px;height:8px;border-radius:50%;background:#2e1c52;transition:var(--t1)}
.tb-status .dot.on{background:var(--c5);box-shadow:0 0 10px var(--c5);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:320px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.6px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#080412;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.co-badge{background:rgba(24,14,46,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 10px;font-family:var(--mono);font-size:.62rem;color:var(--c1);pointer-events:auto;max-width:400px}
.co-badge.stats{color:var(--c2);display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:340px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(255,96,224,.15)}
.ctrl textarea{resize:vertical;min-height:80px;line-height:1.5;font-size:.68rem}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#0f0820;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(255,96,224,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 9px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.6rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#0f0820;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.62rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.6rem}

.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

/* Special blocks */
.ipa-cell{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);margin:2px;cursor:pointer;transition:var(--t1);min-width:44px;min-height:44px;font-family:Georgia,serif}
.ipa-cell:hover{background:var(--panel4);border-color:var(--c1)}
.ipa-cell.active{background:var(--c1);color:#0f0820;font-weight:bold}
.ipa-cell .sym{font-size:1.4rem;line-height:1;font-weight:bold}
.ipa-cell .desc{font-size:.5rem;color:var(--tx3);margin-top:2px;font-family:var(--mono)}
.ipa-cell.active .desc{color:#0f0820;opacity:.8}

.tree-node{display:inline-block;padding:3px 8px;background:var(--panel3);border:1px solid var(--c1);border-radius:var(--rxs);font-family:var(--mono);font-size:.62rem;margin:2px}
.tree-node.leaf{background:rgba(255,224,96,.2);border-color:var(--c3);color:var(--c3)}

.stat-item{padding:3px 8px;background:var(--panel3);border-radius:var(--rxs);font-family:var(--mono);font-size:.6rem;margin-bottom:2px;display:flex;justify-content:space-between}
.stat-item .key{color:var(--c2);font-weight:600}
.stat-item .val{color:var(--tx2)}

.token-chip{display:inline-block;padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);font-family:var(--mono);font-size:.65rem;margin:2px;transition:var(--t1)}
.token-chip.NN{background:rgba(64,224,255,.2);border-color:#40e0ff;color:#40e0ff}
.token-chip.VB{background:rgba(255,96,224,.2);border-color:#ff60e0;color:#ff60e0}
.token-chip.JJ{background:rgba(255,224,96,.2);border-color:#ffe060;color:#ffe060}
.token-chip.RB{background:rgba(96,255,144,.2);border-color:#60ff90;color:#60ff90}
.token-chip.DT{background:rgba(192,96,255,.2);border-color:#c060ff;color:#c060ff}
.token-chip.IN{background:rgba(255,160,96,.2);border-color:#ffa060;color:#ffa060}
.token-chip.PRP{background:rgba(96,255,208,.2);border-color:#60ffd0;color:#60ffd0}
.token-chip.CC{background:rgba(255,96,128,.2);border-color:#ff6080;color:#ff6080}

.syntax-tree{position:relative;font-family:var(--mono);font-size:.65rem;line-height:1.6}
.syntax-tree .level{display:flex;justify-content:center;gap:16px;margin-bottom:8px;position:relative}
.syntax-tree .node{padding:4px 10px;background:var(--panel3);border:1.5px solid var(--c1);border-radius:var(--rxs);text-align:center;position:relative}
.syntax-tree .node.leaf{background:rgba(255,224,96,.15);border-color:var(--c3);color:var(--c3)}

/* Mode buttons */
.mode-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.mode-tab{padding:5px 10px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);cursor:pointer;font-size:.62rem;font-family:var(--mono);color:var(--tx2);transition:var(--t1)}
.mode-tab:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.mode-tab.active{background:var(--g1);color:#0f0820;border-color:transparent;font-weight:700}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c5)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:280px}#rightPanel{width:300px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-script">
    <svg viewBox="0 0 200 200">
      <path d="M 40,40 Q 100,20 160,40 Q 180,100 160,160 Q 100,180 40,160 Q 20,100 40,40 Z"/>
      <path d="M 60,70 Q 100,60 140,70"/>
      <path d="M 60,100 Q 100,90 140,100"/>
      <path d="M 60,130 Q 100,120 140,130"/>
      <text x="70" y="85">A</text>
      <text x="110" y="85">Ω</text>
      <text x="70" y="118">文</text>
      <text x="110" y="118">अ</text>
      <text x="70" y="150">م</text>
      <text x="110" y="150">Я</text>
      <circle cx="55" cy="55" r="3"/>
      <circle cx="145" cy="55" r="3"/>
      <circle cx="55" cy="145" r="3"/>
      <circle cx="145" cy="145" r="3"/>
    </svg>
  </div>
  <div class="boot-logo">LINGUA</div>
  <div class="boot-sub">LINGUISTICS STUDIO</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('ipa')">LINGUA</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="exportState()" title="Export">⬇</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">

/* ================================================================
   CANVAS
   ================================================================ */
var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={down:false,x:0,y:0,lastX:0,lastY:0};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}e.preventDefault();}
function onTouchEnd(e){onUp({});e.preventDefault();}

var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def;}
function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

registerModule('ipa',{
  title:'IPA Chart',
  icon:'🔊',
  desc:'Interactive International Phonetic Alphabet. Every symbol organized by manner and place of articulation.',
  init:function(){},
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var ipa=STATE.ipa;
    var list=ipa.category==='consonants'?IPA_CONSONANTS:IPA_VOWELS;
    var cols=Math.floor((W-40)/110);
    var rows=Math.ceil(list.length/cols);
    var cellW=100,cellH=60;
    var startX=(W-cols*cellW)/2;
    var startY=80;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.fillText('INTERNATIONAL PHONETIC ALPHABET',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(ipa.category==='consonants'?IPA_CONSONANTS.length+' pulmonic consonants':IPA_VOWELS.length+' vowels',W/2,64);
    /* Cells */
    list.forEach(function(item,i){
      var x=startX+(i%cols)*cellW;
      var y=startY+Math.floor(i/cols)*cellH;
      var active=ipa.selected===item.sym;
      ctx.fillStyle=active?'#ff60e0':'rgba(46,28,82,.6)';
      ctx.strokeStyle=active?'#fff':'rgba(84,58,136,.6)';
      ctx.lineWidth=active?2:1;
      ctx.beginPath();ctx.roundRect(x+4,y+4,cellW-8,cellH-8,8);ctx.fill();ctx.stroke();
      /* Symbol */
      ctx.fillStyle=active?'#0f0820':'#ffe060';
      ctx.font='bold 26px Georgia,serif';
      ctx.textAlign='center';
      ctx.fillText(item.sym,x+cellW/2,y+34);
      /* Description (abbreviated) */
      ctx.fillStyle=active?'rgba(15,8,32,.7)':'#8870b0';
      ctx.font='8px monospace';
      var short=item.desc.length>18?item.desc.substring(0,16)+'…':item.desc;
      ctx.fillText(short,x+cellW/2,y+cellH-6);
    });
    /* Selected symbol detail */
    if(ipa.selected){
      var sel=list.find(function(s){return s.sym===ipa.selected});
      if(sel){
        var dx=20,dy=H-100;
        ctx.fillStyle='rgba(24,14,46,.95)';
        ctx.strokeStyle='#ff60e0';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.roundRect(dx,dy,W-40,80,8);ctx.fill();ctx.stroke();
        ctx.fillStyle='#ffe060';
        ctx.font='bold 36px Georgia,serif';
        ctx.textAlign='left';
        ctx.fillText(sel.sym,dx+20,dy+50);
        ctx.fillStyle='#ff60e0';
        ctx.font='bold 14px monospace';
        ctx.fillText(sel.desc,dx+90,dy+30);
        ctx.fillStyle='#c0a8e0';
        ctx.font='11px monospace';
        var vowelForm=VOWEL_FORMANTS[sel.sym];
        if(vowelForm){
          ctx.fillText('F1='+vowelForm[0]+' Hz  F2='+vowelForm[1]+' Hz',dx+90,dy+52);
        }
        ctx.fillText('Click symbol to hear description',dx+90,dy+70);
      }
    }
    setStatsHTML(
      '<div>Category: '+ipa.category+'</div>'+
      '<div>Symbols: '+list.length+'</div>'+
      '<div>Selected: '+(ipa.selected||'—')+'</div>'
    );
    updateBadge('🔊 IPA Chart · '+list.length+' symbols');
    $('sbMode').textContent='IPA';
  },
  onDown:function(p){
    var W=CANV.W,H=CANV.H;
    var list=STATE.ipa.category==='consonants'?IPA_CONSONANTS:IPA_VOWELS;
    var cols=Math.floor((W-40)/110);
    var cellW=100,cellH=60;
    var startX=(W-cols*cellW)/2;
    var startY=80;
    var col=Math.floor((p.x-startX)/cellW);
    var row=Math.floor((p.y-startY)/cellH);
    if(col<0||col>=cols||row<0)return;
    var idx=row*cols+col;
    if(idx>=0&&idx<list.length){
      STATE.ipa.selected=list[idx].sym;
    }
  },
  controls:function(){
    var ipa=STATE.ipa;
    var html='';
    html+='<div class="sec"><h4>Category</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(ipa.category==='consonants'?'active':'')+'" onclick="STATE.ipa.category=\'consonants\';renderLeftPanel()">Consonants</div>';
    html+='<div class="chip '+(ipa.category==='vowels'?'active':'')+'" onclick="STATE.ipa.category=\'vowels\';renderLeftPanel()">Vowels</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Selected symbol</h4>';
    if(ipa.selected){
      var list=ipa.category==='consonants'?IPA_CONSONANTS:IPA_VOWELS;
      var sel=list.find(function(s){return s.sym===ipa.selected});
      if(sel){
        html+='<div style="font-family:Georgia,serif;font-size:3rem;text-align:center;color:var(--c3);margin-bottom:8px">'+sel.sym+'</div>';
        html+='<div class="kv">';
        html+='<div class="row"><span class="k">Symbol</span><span class="v">'+sel.sym+'</span></div>';
        html+='<div class="row"><span class="k">Description</span><span class="v">'+sel.desc+'</span></div>';
        var form=VOWEL_FORMANTS[sel.sym];
        if(form){
          html+='<div class="row"><span class="k">F1</span><span class="v">'+form[0]+' Hz</span></div>';
          html+='<div class="row"><span class="k">F2</span><span class="v">'+form[1]+' Hz</span></div>';
        }
        html+='</div>';
      }
    } else {
      html+='<div class="text-xs text-dim">Click on the chart to select a symbol.</div>';
    }
    html+='</div>';
    html+='<div class="sec"><h4>Categories</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      '<b class="text-c1">Consonants:</b> airflow obstructed<br>'+
      '<b class="text-c1">Vowels:</b> airflow unobstructed<br><br>'+
      '<b>Manner:</b> plosive, fricative, nasal, approximant<br>'+
      '<b>Place:</b> bilabial, alveolar, velar, glottal<br>'+
      '<b>Voicing:</b> voiced vs voiceless'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>IPA Overview</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'The International Phonetic Alphabet is a standardized system for representing sounds of spoken language. Created in 1888 by the International Phonetic Association.<br><br>'+
      'Every distinct speech sound has one symbol. 107 letters, 52 diacritics, 4 tone marks.'+
      '</div></div>'+
      '<div class="sec"><h4>Speech Production</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Three systems interact to produce speech:<br><br>'+
      '<b class="text-c1">Pulmonic:</b> lungs push air<br>'+
      '<b class="text-c1">Laryngeal:</b> vocal folds vibrate<br>'+
      '<b class="text-c1">Supralaryngeal:</b> tongue, lips, palate shape sound'+
      '</div></div>'+
      '<div class="sec"><h4>Vowel space</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Vowels are described by:<br>'+
      '• Height (high/mid/low)<br>'+
      '• Backness (front/central/back)<br>'+
      '• Rounding (rounded/unrounded)<br><br>'+
      'Formant F1 correlates with height; F2 with backness.'+
      '</div></div>';
  }
});

registerModule('vowels',{
  title:'Vowel Space',
  icon:'🅰️',
  desc:'Formant chart showing vowels plotted by F1 and F2 frequencies — the classic vowel quadrilateral.',
  init:function(){},
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var v=STATE.vowels;
    /* Axes */
    var pad=100;
    var plotX=pad,plotY=80;
    var plotW=W-pad-60,plotH=H-pad-60;
    /* Background */
    ctx.fillStyle='rgba(46,28,82,.4)';
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,8);ctx.fill();
    ctx.strokeStyle='rgba(255,96,224,.4)';
    ctx.lineWidth=2;
    ctx.stroke();
    /* Grid */
    ctx.strokeStyle='rgba(255,96,224,.1)';
    ctx.lineWidth=1;
    var F1Min=200,F1Max=900;
    var F2Min=800,F2Max=2400;
    for(var f1=F1Min;f1<=F1Max;f1+=100){
      var y=plotY+((f1-F1Min)/(F1Max-F1Min))*plotH;
      ctx.beginPath();ctx.moveTo(plotX,y);ctx.lineTo(plotX+plotW,y);ctx.stroke();
      ctx.fillStyle='#8870b0';
      ctx.font='10px monospace';
      ctx.textAlign='right';
      ctx.fillText(f1.toString(),plotX-8,y+4);
    }
    for(var f2=F2Min;f2<=F2Max;f2+=200){
      var x=plotX+plotW-((f2-F2Min)/(F2Max-F2Min))*plotW;
      ctx.beginPath();ctx.moveTo(x,plotY);ctx.lineTo(x,plotY+plotH);ctx.stroke();
      ctx.fillStyle='#8870b0';
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText(f2.toString(),x,plotY+plotH+16);
    }
    /* Axis labels */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.fillText('F1 (Hz) — vowel height',plotX-40,plotY-20);
    ctx.fillText('F2 (Hz) — vowel backness',plotX+plotW/2,plotY+plotH+36);
    /* Plot vowels */
    Object.keys(VOWEL_FORMANTS).forEach(function(sym){
      var form=VOWEL_FORMANTS[sym];
      var x=plotX+plotW-((form[1]-F2Min)/(F2Max-F2Min))*plotW;
      var y=plotY+((form[0]-F1Min)/(F1Max-F1Min))*plotH;
      var isSelected=sym===v.selected;
      /* Dot */
      var r=isSelected?12:6;
      ctx.fillStyle=isSelected?'#ffe060':'rgba(255,96,224,.6)';
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=isSelected?'#fff':'#ff60e0';
      ctx.lineWidth=isSelected?2:1;
      ctx.stroke();
      /* Label */
      ctx.fillStyle=isSelected?'#ffe060':'#c0a8e0';
      ctx.font=(isSelected?'bold ':'')+'13px Georgia,serif';
      ctx.textAlign='center';
      ctx.fillText(sym,x,y-r-4);
    });
    /* Selected vowel info */
    if(v.selected){
      var selForm=VOWEL_FORMANTS[v.selected];
      var selDesc=(IPA_VOWELS.find(function(s){return s.sym===v.selected})||{}).desc;
      ctx.fillStyle='rgba(24,14,46,.95)';
      ctx.strokeStyle='#ffe060';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(20,20,280,60,8);ctx.fill();ctx.stroke();

      ctx.font='bold 28px Georgia,serif';
      ctx.textAlign='left';
      ctx.fillText(v.selected,32,58);
      ctx.fillStyle='#ff60e0';
      ctx.font='bold 12px monospace';
      ctx.fillText(selDesc,90,44);
      ctx.fillStyle='#c0a8e0';
      ctx.font='11px monospace';
      ctx.fillText('F1='+selForm[0]+' Hz  F2='+selForm[1]+' Hz',90,62);

      '<div>Vowels: '+Object.keys(VOWEL_FORMANTS).length+'</div>'+
      '<div>Selected: '+v.selected+'</div>'+

      '<div>F2: '+VOWEL_FORMANTS[v.selected][1]+' Hz</div>'
    );
    updateBadge('🅰️ Vowel Space · '+v.selected+' selected');
    $('sbMode').textContent='Vowel Space';
  },
  onDown:function(p){
    var W=CANV.W,H=CANV.H;
    var pad=100;
    var plotX=pad,plotY=80;
    var plotW=W-pad-60,plotH=H-pad-60;
    var F1Min=200,F1Max=900;
    var F2Min=800,F2Max=2400;
    var best=null,bestD=40;
    Object.keys(VOWEL_FORMANTS).forEach(function(sym){
      var f=VOWEL_FORMANTS[sym];
      var x=plotX+plotW-((f[1]-F2Min)/(F2Max-F2Min))*plotW;
      var y=plotY+((f[0]-F1Min)/(F1Max-F1Min))*plotH;
      var d=Math.hypot(x-p.x,y-p.y);
      if(d<bestD){bestD=d;best=sym;}
    });
    if(best)STATE.vowels.selected=best;
  },
  controls:function(){

    html+='<div style="text-align:center;color:var(--c1);font-family:var(--mono);font-size:.62rem;margin-bottom:12px">'+desc+'</div>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">F1</span><span class="v">'+form[0]+' Hz</span></div>';
    html+='<div class="row"><span class="k">F2</span><span class="v">'+form[1]+' Hz</span></div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="sec"><h4>Vowel categories</h4>';
    html+='<div class="chip-row">';
    ['i','e','a','o','u','ə'].forEach(function(s){
      html+='<div class="chip '+(v.selected===s?'active':'')+'" onclick="STATE.vowels.selected=\''+s+'\';renderLeftPanel()">'+s+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Instructions</h4>';
    html+='<div class="text-xs" style="font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
      'Click any vowel on the chart. The x-axis shows F2 (backness), y-axis shows F1 (height).'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){

      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Formants are resonant frequencies of the vocal tract. For vowels:<br><br>'+
      '<b class="text-c1">F1:</b> inversely related to tongue height (low F1 = high vowel)<br>'+
      '<b class="text-c1">F2:</b> related to tongue backness (high F2 = front vowel)<br>'+
      '<b class="text-c1">F3:</b> affected by lip rounding<br><br>'+

  }

registerModule('phonology',{
  title:'Phonological Rules',
  icon:'🔀',
  desc:'Apply sound change rules to words. Watch how languages transform over time.',
  init:function(){
    var p=STATE.phonology;
    p.word='impossible';
    p.output=this.applyRules(p.word);
  },
  applyRules:function(word){
    var p=STATE.phonology;
    var w=word;
    /* Simple rule applications */
    if(p.activeRules.indexOf('Nasal Assimilation')>=0){
      w=w.replace(/n(p|b|m)/g,'m$1');
      w=w.replace(/n(k|g)/g,'ŋ$1');
    }
    if(p.activeRules.indexOf('Final Devoicing')>=0){
      w=w.replace(/(b|d|g|v|z|ʒ)$/,'$1');
      if(w.match(/[bdgvz]$/)){w=w.slice(0,-1)+{'b':'p','d':'t','g':'k','v':'f','z':'s'}[w.slice(-1)];}
    }
    if(p.activeRules.indexOf('Palatalization')>=0){
      w=w.replace(/k(e|i)/g,'tʃ$1');
      w=w.replace(/g(e|i)/g,'dʒ$1');
    }
    if(p.activeRules.indexOf('Epenthesis')>=0){
      w=w.replace(/^s(t|p|k)/,'es$1');
    }
    if(p.activeRules.indexOf('Voicing Assimilation')>=0){
      w=w.replace(/sb/g,'zb');
      w=w.replace(/sd/g,'zd');
    }
    return w;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){

});
function togglePhonologyRule(name){
  var p=STATE.phonology;
  var i=p.activeRules.indexOf(name);
  if(i>=0)p.activeRules.splice(i,1);
  else p.activeRules.push(name);
  p.output=MODULES.phonology.applyRules(p.word);
  renderLeftPanel();
}

/* ================================================================

   ================================================================ */
registerModule('syntax',{
  title:'Syntax Trees',
  icon:'🌳',
  desc:'Build phrase structure trees for sentences. See how words group into phrases and clauses.',
  init:function(){
    this.parse();
  },
  parse:function(){
    var s=STATE.syntax;
    s.tokens=s.sentence.split(/\s+/).filter(function(w){return w;});
    /* Simple template-based tree generation */
    var tokens=s.tokens;
    s.tree=this.buildTree(tokens);
  },
  buildTree:function(tokens){
    /* Very simplified: identify likely NP and VP */
    var tree={label:'S',children:[]};
    /* Find first verb */
    var verbIdx=-1;
    for(var i=0;i<tokens.length;i++){
      if(POS_LEXICON[tokens[i].toLowerCase()]==='VB'||POS_LEXICON[tokens[i].toLowerCase()]==='VBZ'){verbIdx=i;break;}
    }
    /* Also check for 'runs' style */
    if(verbIdx<0){
      for(var j=0;j<tokens.length;j++){
        if(tokens[j].match(/s$/)){verbIdx=j;break;}
      }
    }
    if(verbIdx>0){
      /* NP before verb */
      var np={label:'NP',children:[]};
      for(var k=0;k<verbIdx;k++){
        np.children.push({label:POS_LEXICON[tokens[k].toLowerCase()]||'N',children:[{label:tokens[k],leaf:true}]});
      }
      tree.children.push(np);
      /* VP from verb onwards */
      var vp={label:'VP',children:[]};
      for(var l=verbIdx;l<tokens.length;l++){
        var tag=POS_LEXICON[tokens[l].toLowerCase()]||'V';
        if(tag==='RB'||tag==='JJ'){
          vp.children.push({label:'ADVP',children:[{label:tag,children:[{label:tokens[l],leaf:true}]}]});
        } else {
          vp.children.push({label:tag,children:[{label:tokens[l],leaf:true}]});
        }
      }
      tree.children.push(vp);
    } else {
      /* Just leaves */
      tokens.forEach(function(t){
        tree.children.push({label:POS_LEXICON[t.toLowerCase()]||'X',children:[{label:t,leaf:true}]});
      });
    }
    return tree;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var s=STATE.syntax;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('SYNTAX TREE',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText('Sentence: "'+s.sentence+'"',W/2,64);
    /* Tree rendering */
    if(s.tree){
      this.drawNode(ctx,s.tree,W/2,120,W-80);
    }
    /* Legend at bottom */
    var ly=H-120;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,ly,W-80,90,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('ABBREVIATIONS',60,ly+24);
    var abbrs=[
      'S = Sentence, NP = Noun Phrase, VP = Verb Phrase',
      'DT = Determiner, NN = Noun, VB = Verb, JJ = Adjective, RB = Adverb',
      'PP = Prepositional Phrase, ADVP = Adverb Phrase'
    ];
    abbrs.forEach(function(a,i){
      ctx.fillStyle='#c0a8e0';
      ctx.font='11px monospace';
      ctx.fillText(a,60,ly+46+i*18);
    });
    setStatsHTML(
      '<div>Tokens: '+s.tokens.length+'</div>'+
      '<div>Tree depth: '+this.treeDepth(s.tree)+'</div>'+
      '<div>Mode: '+s.mode+'</div>'
    );
    updateBadge('🌳 Syntax · '+s.tokens.length+' tokens');
    $('sbMode').textContent='Syntax';
  },
  treeDepth:function(node){
    if(!node.children||node.children.length===0)return 1;
    return 1+Math.max.apply(null,node.children.map(this.treeDepth.bind(this)));
  },
  drawNode:function(ctx,node,x,y,maxW){
    var nodeW=Math.max(50,node.label.length*10+20);
    var isLeaf=node.leaf;
    ctx.fillStyle=isLeaf?'rgba(255,224,96,.2)':'rgba(46,28,82,.8)';
    ctx.strokeStyle=isLeaf?'#ffe060':'#ff60e0';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(x-nodeW/2,y-14,nodeW,28,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=isLeaf?'#ffe060':'#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    ctx.fillText(node.label,x,y+4);
    /* Children */
    if(node.children&&node.children.length>0){
      var childY=y+70;
      var childSpacing=maxW/node.children.length;
      var startX=x-(maxW-nodeW)/2+childSpacing/2;
      node.children.forEach(function(child,i){
        var cx=startX+i*childSpacing;
        /* Connector */
        ctx.strokeStyle='rgba(255,96,224,.4)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(x,y+14);
        ctx.lineTo(cx,childY-14);
        ctx.stroke();
        this.drawNode(ctx,child,cx,childY,childSpacing-20);
      },this);
    }
  },
  onDown:function(){},
  controls:function(){
    var s=STATE.syntax;
    var html='';
    html+='<div class="sec"><h4>Sentence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.syntax.sentence=this.value;MODULES.syntax.parse()">'+esc(s.sentence)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Examples</h4>';
    [
      'The cat runs quickly',
      'A big dog chases the small cat',
      'The quick brown fox jumps over the lazy dog',
      'Mary reads books in the library',
      'She thinks that he knows the answer'
    ].forEach(function(ex){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.65rem" onclick="STATE.syntax.sentence=\''+ex+'\';MODULES.syntax.parse();renderLeftPanel()">'+ex+'</div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var s=STATE.syntax;
    return '<div class="sec"><h4>Phrase Structure</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Chomsky (1957) introduced phrase structure grammars where sentences decompose into nested phrases.<br><br>'+
      'Rules:<br>'+
      'S → NP VP<br>'+
      'NP → (DT) (JJ) N (PP)<br>'+
      'VP → V (NP) (PP) (ADVP)'+
      '</div></div>'+
      '<div class="sec"><h4>Recursion</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'The key insight: phrases can contain phrases of the same type. This recursive property explains how finite rules generate infinite sentences.'+
      '</div></div>'+
      '<div class="sec"><h4>Current parse</h4><div class="kv">'+
      '<div class="row"><span class="k">Sentence</span><span class="v">'+s.tokens.length+' tokens</span></div>'+
      '<div class="row"><span class="k">Depth</span><span class="v">'+this.treeDepth(s.tree)+'</span></div>'+
      '</div></div>';
  }
});

/* ================================================================
   MODULE 6: DEPENDENCY PARSER
   ================================================================ */
registerModule('parser',{
  title:'Dependency Parser',
  icon:'🔗',
  desc:'Universal Dependencies style parsing. Shows which words depend on which.',
  init:function(){
    this.parse();
  },
  parse:function(){
    var p=STATE.parser;
    var tokens=p.sentence.split(/\s+/).filter(function(w){return w;});
    p.tokens=tokens;
    /* Simple rule-based dependency parsing */
    p.dependencies=[];
    var verbIdx=-1,subjIdx=-1,objIdx=-1;
    for(var i=0;i<tokens.length;i++){
      var w=tokens[i].toLowerCase();
      var tag=POS_LEXICON[w]||POS_LEXICON[tokens[i]]||'NN';
      var dep='dep';
      if(tag==='VB'||w.match(/s$/)){dep='ROOT';verbIdx=i;}
      else if(tag==='DT')dep='det';
      else if(tag==='JJ')dep='amod';
      else if(tag==='RB')dep='advmod';
      else if(tag==='IN')dep='case';
      else if(tag==='CC')dep='cc';
      else if(tag==='PRP')dep='nsubj';
      else if(tag==='NN')dep=(subjIdx<0?'nsubj':'dobj');
      p.dependencies.push({word:tokens[i],tag:tag,dep:dep,head:verbIdx>=0?verbIdx:-1});
    }
    /* Fix subject detection */
    if(verbIdx>0&&subjIdx<0){
      p.dependencies[verbIdx-1].dep='nsubj';
      p.dependencies[verbIdx-1].head=verbIdx;
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var p=STATE.parser;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('DEPENDENCY PARSING',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(p.tokens?p.tokens.length+' tokens':'(no input)',W/2,64);
    if(!p.tokens)return;
    /* Word row */
    var y=200;
    var totalW=0;
    var wordWidths=p.tokens.map(function(t){return Math.max(50,t.length*14);});
    wordWidths.forEach(function(w){totalW+=w+10});
    var startX=(W-totalW)/2;
    var positions=[];
    var x=startX;
    p.tokens.forEach(function(t,i){
      positions.push(x+wordWidths[i]/2);
      var isRoot=p.dependencies[i].dep==='ROOT';
      var color=isRoot?'#ffe060':(p.dependencies[i].dep==='nsubj'?'#60e0ff':(p.dependencies[i].dep==='dobj'?'#60ff90':'#ff60e0'));
      ctx.fillStyle=color+'30';
      ctx.strokeStyle=color;
      ctx.lineWidth=isRoot?3:1.5;
      ctx.beginPath();ctx.roundRect(x,y-20,wordWidths[i],40,6);ctx.fill();ctx.stroke();
      ctx.fillStyle=color;
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText(t,x+wordWidths[i]/2,y+5);
      /* POS tag */
      ctx.fillStyle='#8870b0';
      ctx.font='10px monospace';
      ctx.fillText(p.dependencies[i].tag,x+wordWidths[i]/2,y+30);
      /* Dep relation */
      ctx.fillStyle='#c0a8e0';
      ctx.font='bold 10px monospace';
      ctx.fillText(p.dependencies[i].dep,x+wordWidths[i]/2,y-30);
      x+=wordWidths[i]+10;
    });
    /* Arcs */
    p.dependencies.forEach(function(d,i){
      if(d.head<0||d.head===i)return;
      var sx=positions[i];
      var ex=positions[d.head];
      var y0=y+60;
      var y1=y+60+Math.abs(ex-sx)*0.3+40;
      var color=d.dep==='nsubj'?'#60e0ff':(d.dep==='dobj'?'#60ff90':(d.dep==='ROOT'?'#ffe060':'#ff60e0'));
      ctx.strokeStyle=color;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(sx,y0);
      ctx.quadraticCurveTo((sx+ex)/2,y1,ex,y0);
      ctx.stroke();
      /* Arrow */
      var ang=Math.atan2(y0-y1,ex-(sx+ex)/2);
      ctx.beginPath();
      ctx.moveTo(ex,y0);
      ctx.lineTo(ex-8*Math.cos(ang-0.4),y0+8*Math.sin(ang-0.4));
      ctx.lineTo(ex-8*Math.cos(ang+0.4),y0+8*Math.sin(ang+0.4));
      ctx.closePath();
      ctx.fillStyle=color;
      ctx.fill();
      /* Label */
      ctx.fillStyle=color;
      ctx.font='10px monospace';
      ctx.textAlign='center';
      ctx.fillText(d.dep,(sx+ex)/2,y1-6);
    });
    /* Legend */
    var ly=H-140;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,ly,W-80,110,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('DEPENDENCY TYPES',60,ly+24);
    var deps=[
      ['nsubj','nominal subject'],
      ['dobj','direct object'],
      ['det','determiner'],
      ['amod','adjectival modifier'],
      ['advmod','adverbial modifier'],
      ['ROOT','main predicate']
    ];
    deps.forEach(function(d,i){
      ctx.fillStyle='#60e0ff';
      ctx.font='bold 10px monospace';
      ctx.fillText(d[0],60,ly+46+i*12);
      ctx.fillStyle='#c0a8e0';
      ctx.font='10px monospace';
      ctx.fillText('= '+d[1],150,ly+46+i*12);
    });
    setStatsHTML(
      '<div>Tokens: '+p.tokens.length+'</div>'+
      '<div>Relations: '+p.dependencies.filter(function(d){return d.head>=0&&d.dep!=='ROOT'}).length+'</div>'
    );
    updateBadge('🔗 Dependency parser · '+p.tokens.length+' tokens');
    $['sbMode'].textContent='Parser';
  },
  onDown:function(){},
  controls:function(){
    var p=STATE.parser;
    var html='';
    html+='<div class="sec"><h4>Sentence</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.parser.sentence=this.value;MODULES.parser.parse()">'+esc(p.sentence)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Examples</h4>';
    ['The cat runs quickly','John reads a book','Mary loves the blue sky','The children played in the park'].forEach(function(ex){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.65rem" onclick="STATE.parser.sentence=\''+ex+'\';MODULES.parser.parse();renderLeftPanel()">'+ex+'</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Relations</h4>';
    if(p.dependencies){
      p.dependencies.forEach(function(d){
        html+='<div class="stat-item"><span class="key">'+d.word+'</span><span class="val">'+d.tag+' · '+d.dep+'</span></div>';
      });
    }
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Universal Dependencies</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'UD is a cross-linguistically consistent annotation scheme for dependency parsing. Over 100 languages are annotated with ~40 relation types.'+
      '</div></div>'+
      '<div class="sec"><h4>Common relations</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '<b class="text-c1">nsubj:</b> nominal subject<br>'+
      '<b class="text-c1">obj:</b> direct object<br>'+
      '<b class="text-c1">det:</b> determiner<br>'+
      '<b class="text-c1">amod:</b> adjectival modifier<br>'+
      '<b class="text-c1">advmod:</b> adverbial modifier<br>'+
      '<b class="text-c1">case:</b> preposition/case marker'+
      '</div></div>'+
      '<div class="sec"><h4>Why dependencies?</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Unlike constituency trees, dependency graphs directly encode which words modify which. This is more flexible for free word order languages like Latin, Russian, and Warlpiri.'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   MODULE 7: WORD EMBEDDINGS
   ================================================================ */
registerModule('embeddings',{
  title:'Word Embeddings',
  icon:'📐',
  desc:'Word vectors in semantic space. Cosine similarity reveals which words are related.',
  init:function(){
    this.project();
  },
  project:function(){
    var e=STATE.embeddings;
    /* Simple PCA-like projection to 2D */
    var words=e.words;
    var vectors=words.map(function(w){return WORD_EMBEDDINGS[w]});
    /* Compute mean */
    var dim=vectors[0].length;
    var mean=new Array(dim).fill(0);
    vectors.forEach(function(v){v.forEach(function(x,i){mean[i]+=x})});
    mean=mean.map(function(x){return x/vectors.length});
    /* Center */
    var centered=vectors.map(function(v){return v.map(function(x,i){return x-mean[i]})});
    /* Use top 2 dims for simplicity or random projection */
    var p1=new Array(dim).fill(0);
    var p2=new Array(dim).fill(0);
    /* Random orthogonal-ish vectors */
    for(var i=0;i<dim;i++){
      p1[i]=Math.cos(i*0.7);
      p2[i]=Math.sin(i*1.3);
    }
    e.projections=words.map(function(w,i){
      var v=centered[i];
      var x=0,y=0;
      for(var j=0;j<dim;j++){x+=v[j]*p1[j];y+=v[j]*p2[j];}
      return {word:w,x:x,y:y};
    });
    /* Normalize */
    var maxR=0;
    e.projections.forEach(function(p){maxR=Math.max(maxR,Math.hypot(p.x,p.y))});
    if(maxR>0)e.projections.forEach(function(p){p.x/=maxR;p.y/=maxR;});
  },
  cosine:function(w1,w2){
    var v1=WORD_EMBEDDINGS[w1];
    var v2=WORD_EMBEDDINGS[w2];
    if(!v1||!v2)return 0;
    var dot=0,n1=0,n2=0;
    for(var i=0;i<v1.length;i++){
      dot+=v1[i]*v2[i];
      n1+=v1[i]*v1[i];
      n2+=v2[i]*v2[i];
    }
    return dot/(Math.sqrt(n1)*Math.sqrt(n2)+1e-9);
  },
  findNeighbors:function(word){
    var e=STATE.embeddings;
    var sims=e.words.filter(function(w){return w!==word}).map(function(w){
      return {word:w,sim:this.cosine(word,w)};
    },this);
    sims.sort(function(a,b){return b.sim-a.sim});
    return sims.slice(0,8);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var e=STATE.embeddings;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('WORD EMBEDDINGS',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(e.words.length+' words in 8-dimensional semantic space',W/2,64);
    /* Plot area */
    var plotX=80,plotY=90;
    var plotW=W-160,plotH=H-200;
    /* Background grid */
    ctx.fillStyle='rgba(46,28,82,.3)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(plotX,plotY,plotW,plotH,8);ctx.fill();ctx.stroke();
    /* Axes */
    ctx.strokeStyle='rgba(255,96,224,.2)';
    ctx.beginPath();
    ctx.moveTo(plotX+plotW/2,plotY);
    ctx.lineTo(plotX+plotW/2,plotY+plotH);
    ctx.moveTo(plotX,plotY+plotH/2);
    ctx.lineTo(plotX+plotW,plotY+plotH/2);
    ctx.stroke();
    /* Points */
    e.projections.forEach(function(p){
      var x=plotX+plotW/2+p.x*plotW*0.45;
      var y=plotY+plotH/2-p.y*plotH*0.45;
      var isSel=e.selected===p.word;
      /* Similarity to selected */
      var sim=e.selected?this.cosine(e.selected,p.word):0;
      var isNeighbor=sim>e.similarityThreshold&&!isSel;
      var color=isSel?'#ffe060':(isNeighbor?'#60ff90':'#ff60e0');
      var r=isSel?10:(isNeighbor?8:5);
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';
      ctx.lineWidth=isSel?2:1;
      ctx.stroke();
      /* Label */
      if(isSel||isNeighbor||e.words.length<40){
        ctx.fillStyle=color;
        ctx.font=(isSel?'bold ':'')+'11px monospace';
        ctx.textAlign='center';
        ctx.fillText(p.word,x,y-r-4);
      }
      /* Line to selected */
      if(isNeighbor&&e.selected){
        var selP=e.projections.find(function(pp){return pp.word===e.selected});
        if(selP){
          var sx=plotX+plotW/2+selP.x*plotW*0.45;
          var sy=plotY+plotH/2-selP.y*plotH*0.45;
          ctx.strokeStyle='rgba(96,255,144,'+sim*0.6+')';
          ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();
        }
      }
    },this);
    /* Neighbors panel */
    if(e.selected){
      var neighbors=this.findNeighbors(e.selected);
      var nx=W-260,ny=90;
      ctx.fillStyle='rgba(24,14,46,.95)';
      ctx.strokeStyle='#ffe060';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(nx,ny,240,Math.min(neighbors.length*28+60,H-ny-140),8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffe060';
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText('NEAREST TO: "'+e.selected+'"',nx+10,ny+24);
      neighbors.forEach(function(nb,i){
        ctx.fillStyle='#60e0ff';
        ctx.font='bold 11px monospace';
        ctx.fillText(nb.word,nx+10,ny+48+i*24);
        /* Bar */
        ctx.fillStyle='rgba(96,224,255,.2)';
        ctx.fillRect(nx+90,ny+40+i*24,130,10);
        ctx.fillStyle='#60e0ff';
        ctx.fillRect(nx+90,ny+40+i*24,130*Math.max(0,nb.sim),10);
        /* Value */
        ctx.fillStyle='#fff';
        ctx.font='9px monospace';
        ctx.fillText(fmt(nb.sim,3),nx+225,ny+49+i*24);
      });
    }
    setStatsHTML(
      '<div>Words: '+e.words.length+'</div>'+
      '<div>Dimensions: 8</div>'+
      '<div>Selected: '+(e.selected||'—')+'</div>'+
      '<div>Threshold: '+fmt(e.similarityThreshold,2)+'</div>'
    );
    updateBadge('📐 Embeddings · '+(e.selected||'no word selected'));
    $('sbMode').textContent='Embeddings';
    $('sbVocab').textContent=e.words.length;
  },
  onDown:function(p){
    var e=STATE.embeddings;
    var W=CANV.W,H=CANV.H;
    var plotX=80,plotY=90;
    var plotW=W-160,plotH=H-200;
    var best=null,bestD=30;
    e.projections.forEach(function(pr){
      var x=plotX+plotW/2+pr.x*plotW*0.45;
      var y=plotY+plotH/2-pr.y*plotH*0.45;
      var d=Math.hypot(x-p.x,y-p.y);
      if(d<bestD){bestD=d;best=pr.word;}
    });
    if(best)e.selected=best;
  },
  controls:function(){
    var e=STATE.embeddings;
    var html='';
    html+='<div class="sec"><h4>Selected word</h4>';
    if(e.selected){
      html+='<div style="font-size:1.6rem;text-align:center;color:var(--c3);font-family:var(--mono);margin-bottom:8px">"'+e.selected+'"</div>';
      var neighbors=this.findNeighbors(e.selected);
      html+='<div class="kv">';
      neighbors.slice(0,5).forEach(function(nb){
        html+='<div class="row"><span class="k">'+nb.word+'</span><span class="v">'+fmt(nb.sim,4)+'</span></div>';
      });
      html+='</div>';
    } else {
      html+='<div class="text-xs text-dim">Click any word to see its neighbors.</div>';
    }
    html+='</div>';
    html+='<div class="sec"><h4>Similarity threshold</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Threshold</span><span>'+fmt(e.similarityThreshold,2)+'</span></div>';
    html+='<input type="range" min="0" max="0.95" step="0.05" value="'+e.similarityThreshold+'" oninput="STATE.embeddings.similarityThreshold=parseFloat(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Word categories</h4>';
    var cats=[
      {name:'Animals',words:['cat','dog','fish','bird','horse']},
      {name:'Foods',words:['apple','bread','cheese','water','pizza']},
      {name:'Emotions',words:['happy','sad','love','angry','afraid']},
      {name:'Actions',words:['run','walk','jump','fly']},
      {name:'Cognition',words:['think','know','learn','understand']},

registerModule('pos',{
  title:'POS Tagger',
  icon:'🏷️',
  desc:'Part-of-speech tagging via HMM-style lexicon lookup. Every word gets a grammatical label.',
  init:function(){
    this.tag();
  },
  tag:function(){
    var p=STATE.pos;
    var words=p.text.split(/\s+/).filter(function(w){return w});
    p.tagged=words.map(function(w){
      var clean=w.toLowerCase().replace(/[.,!?;:]/g,'');
      var tag=POS_LEXICON[clean]||(clean.match(/ing$|ed$/)?'VB':(clean.match(/ly$/)?'RB':(clean.match(/s$/)?'NNS':(clean.match(/^[A-Z]/)?'NNP':'NN'))));
      return {word:w,tag:tag};
    });
    /* Compute stats */
    var counts={};
    p.tagged.forEach(function(t){counts[t.tag]=(counts[t.tag]||0)+1});
    p.counts=counts;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';

    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('PART-OF-SPEECH TAGGING',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';

    /* Tagged text (wrapped) */
    var x=60,y=110;

      DT:'#c060ff',NN:'#40e0ff',NNS:'#40e0ff',NNP:'#40e0ff',
      VB:'#ff60e0',VBZ:'#ff60e0',VBD:'#ff60e0',VBG:'#ff60e0',
      JJ:'#ffe060',JJR:'#ffe060',JJS:'#ffe060',
      RB:'#60ff90',IN:'#ffa060',CC:'#ff6080',PRP:'#60ffd0',PRP$:'#60ffd0'
    };
    p.tagged.forEach(function(t){
      var color=tagColors[t.tag]||'#c0a8e0';
      ctx.font='bold 14px monospace';
      var w=ctx.measureText(t.word).width+16;
      if(x+w>maxW){x=60;y+=36;}
      /* Word box */
      ctx.fillStyle=color+'20';
      ctx.strokeStyle=color;
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(x,y-16,w,32,6);ctx.fill();ctx.stroke();
      /* Word */
      ctx.fillStyle=color;
      ctx.textAlign='left';
      ctx.fillText(t.word,x+8,y+5);

      ctx.font='9px monospace';

    });
    /* Legend */

    ctx.strokeStyle='rgba(255,96,224,.3)';

    ctx.fillText('TAG SET',60,ly+24);

      ['DT','determiner (the, a)'],

      ['VB','verb (runs, jump)'],
      ['JJ','adjective (big, red)'],
      ['RB','adverb (quickly, very)'],
      ['IN','preposition (in, on, at)'],
      ['CC','conjunction (and, or, but)']
    ];
    tags.forEach(function(t,i){

    );

registerModule('ngrams',{
  title:'N-Gram Model',
  icon:'📊',
  desc:'Statistical language model. Compute n-gram frequencies and predict next word given context.',
  init:function(){
    this.compute();
  },
  compute:function(){
    var n=STATE.ngrams;
    var words=n.text.toLowerCase().split(/\s+/).filter(function(w){return w});
    n.words=words;
    /* Compute n-grams */
    n.counts={};
    n.contexts={};
    for(var i=0;i<=words.length-n.n;i++){
      var gram=words.slice(i,i+n.n).join(' ');
      n.counts[gram]=(n.counts[gram]||0)+1;
      if(n.n>=2){
        var ctx=words.slice(i,i+n.n-1).join(' ');
        var next=words[i+n.n-1];
        if(!n.contexts[ctx])n.contexts[ctx]={};
        n.contexts[ctx][next]=(n.contexts[ctx][next]||0)+1;
      }
    }
    /* Sort for top N */
    n.sorted=Object.keys(n.counts).map(function(k){return {gram:k,count:n.counts[k]}}).sort(function(a,b){return b.count-a.count});
    n.maxCount=n.sorted.length?n.sorted[0].count:0;
    /* Predict */
    this.predict();
  },
  predict:function(){
    var n=STATE.ngrams;
    var ctx=n.context.toLowerCase().trim();
    var candidates=n.contexts&&n.contexts[ctx]?n.contexts[ctx]:{};
    n.predictions=Object.keys(candidates).map(function(w){
      return {word:w,count:candidates[w],prob:candidates[w]/Object.values(candidates).reduce(function(a,b){return a+b},0)};
    }).sort(function(a,b){return b.prob-a.prob}).slice(0,10);
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var n=STATE.ngrams;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText(n.n+'-GRAM LANGUAGE MODEL',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(n.sorted.length+' unique '+n.n+'-grams from '+n.words.length+' words',W/2,64);
    /* Top n-grams bar chart */
    var cx=60,cy=100;
    var chartW=W-120,chartH=H*0.4;
    ctx.fillStyle='rgba(46,28,82,.4)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(cx,cy,chartW,chartH,8);ctx.fill();ctx.stroke();
    var top=n.sorted.slice(0,n.topN);
    var barW=chartW/top.length;
    top.forEach(function(item,i){
      var bh=(item.count/n.maxCount)*(chartH-40);
      var bx=cx+i*barW+barW*0.15;
      var by=cy+chartH-bh-20;
      var grad=ctx.createLinearGradient(bx,by,bx,cy+chartH-20);
      grad.addColorStop(0,'#ffe060');
      grad.addColorStop(1,'#ff60e0');
      ctx.fillStyle=grad;
      ctx.fillRect(bx,by,barW*0.7,bh);
      /* Count label */
      ctx.fillStyle='#fff';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(item.count.toString(),bx+barW*0.35,by-4);
      /* Gram label rotated */
      ctx.save();
      ctx.translate(bx+barW*0.35,cy+chartH-14);
      ctx.rotate(-Math.PI/3);
      ctx.fillStyle='#c0a8e0';
      ctx.font='10px monospace';
      ctx.textAlign='left';
      ctx.fillText(item.gram,0,0);
      ctx.restore();
    });
    /* Prediction panel */
    var py=cy+chartH+30;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='#ffe060';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(60,py,W-120,Math.min(200,H-py-40),8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe060';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PREDICT NEXT WORD AFTER: "'+n.context+'"',80,py+24);
    if(n.predictions){
      n.predictions.forEach(function(p,i){
        ctx.fillStyle='#60e0ff';
        ctx.font='bold 12px monospace';
        ctx.fillText('"' + p.word + '"',80,py+50+i*20);
        /* Probability bar */
        ctx.fillStyle='rgba(96,224,255,.2)';
        ctx.fillRect(200,py+42+i*20,300,12);
        ctx.fillStyle='#60e0ff';
        ctx.fillRect(200,py+42+i*20,300*p.prob,12);
        ctx.fillStyle='#fff';
        ctx.font='10px monospace';
        ctx.fillText(fmt(p.prob*100,1)+'%',510,py+52+i*20);
      });
    }
    if(!n.predictions||n.predictions.length===0){
      ctx.fillStyle='#8870b0';
      ctx.font='12px monospace';
      ctx.fillText('(no predictions — try "the" or "of")',80,py+60);
    }
    setStatsHTML(
      '<div>N: '+n.n+'</div>'+
      '<div>Vocab: '+Object.keys(n.counts).length+'</div>'+
      '<div>Context: "'+n.context+'"</div>'+
      '<div>Predictions: '+(n.predictions?n.predictions.length:0)+'</div>'
    );
    updateBadge('📊 N-Gram · '+n.n+'-gram · '+n.sorted.length+' unique');
    $('sbMode').textContent='N-Gram Model';
    $('sbVocab').textContent=Object.keys(n.counts).length;
  },
  onDown:function(){},
  controls:function(){
    var n=STATE.ngrams;
    var html='';
    html+='<div class="sec"><h4>Model order</h4>';
    html+='<div class="chip-row">';
    [1,2,3,4].forEach(function(k){
      html+='<div class="chip '+(n.n===k?'active':'')+'" onclick="STATE.ngrams.n='+k+';MODULES.ngrams.compute();renderLeftPanel()">'+k+'-gram</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Text corpus</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.ngrams.text=this.value;MODULES.ngrams.compute()">'+esc(n.text)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Sample corpora</h4>';
    Object.keys(CORPORA).forEach(function(key){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.65rem" onclick="STATE.ngrams.text=CORPORA[\''+key+'\'];MODULES.ngrams.compute();renderLeftPanel()">'+key+'</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Predict next word</h4>';
    html+='<div class="ctrl"><input type="text" value="'+esc(n.context)+'" oninput="STATE.ngrams.context=this.value;MODULES.ngrams.predict()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Top n-grams</h4>';
    n.sorted.slice(0,10).forEach(function(item){
      html+='<div class="stat-item"><span class="key">'+item.gram+'</span><span class="val">'+item.count+'</span></div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var n=STATE.ngrams;
    return '<div class="sec"><h4>N-gram models</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Predict the next word based on the previous N-1 words.<br><br>'+
      'P(w_n | w_1...w_{n-1}) ≈ P(w_n | w_{n-k}...w_{n-1})<br><br>'+
      'The chain rule + Markov assumption.'+
      '</div></div>'+
      '<div class="sec"><h4>Sparsity problem</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'For a 100,000-word vocabulary:<br>'+
      '• Bigrams: 10¹⁰ possible<br>'+
      '• Trigrams: 10¹⁵ possible<br>'+
      '• 5-grams: 10²⁵ possible<br><br>'+
      'Most are never observed — hence smoothing (Laplace, Kneser-Ney) and neural LMs.'+
      '</div></div>'+
      '<div class="sec"><h4>Current model</h4><div class="kv">'+
      '<div class="row"><span class="k">Order</span><span class="v">'+n.n+'-gram</span></div>'+
      '<div class="row"><span class="k">Words</span><span class="v">'+(n.words?n.words.length:0)+'</span></div>'+
      '<div class="row"><span class="k">Unique grams</span><span class="v">'+n.sorted.length+'</span></div>'+
      '<div class="row"><span class="k">Max count</span><span class="v">'+n.maxCount+'</span></div>'+
      '</div></div>';
  }
});

   ================================================================ */
registerModule('markov',{
  title:'Markov Text',
  icon:'🎲',
  desc:'Generate text with Markov chains. Learn transitions from a corpus and produce novel sentences.',
  init:function(){
    this.train();
    this.generate();
  },
  train:function(){
    var m=STATE.markov;
    var words=m.text.toLowerCase().split(/\s+/).filter(function(w){return w});
    m.chain={};
    for(var i=0;i<=words.length-m.order;i++){
      var key=words.slice(i,i+m.order).join(' ');
      var next=words[i+m.order];
      if(!next)continue;
      if(!m.chain[key])m.chain[key]=[];
      m.chain[key].push(next);
    }
    m.words=words;
    m.unique=Object.keys(m.chain).length;
  },
  generate:function(){
    var m=STATE.markov;
    var keys=Object.keys(m.chain);
    if(!keys.length)return;
    var current=keys[rnd(0,keys.length-1)];
    var result=current.split(' ');
    for(var i=0;i<m.maxWords;i++){
      var nexts=m.chain[current];
      if(!nexts||!nexts.length)break;
      var next=nexts[rnd(0,nexts.length-1)];
      result.push(next);
      current=result.slice(-m.order).join(' ');
    }
    m.generated=result.join(' ');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var m=STATE.markov;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('MARKOV CHAIN TEXT',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText('Order '+m.order+' · '+m.unique+' states · '+(m.words?m.words.length:0)+' words',W/2,64);
    /* Generated text */
    ctx.fillStyle='rgba(46,28,82,.6)';
    ctx.strokeStyle='rgba(96,255,144,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(40,90,W-80,H*0.5,10);ctx.fill();ctx.stroke();
    ctx.fillStyle='#60ff90';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('GENERATED TEXT',60,114);
    /* Word-wrap */
    var words=(m.generated||'').split(' ');
    var x=60,y=150;
    var maxW=W-120;
    ctx.font='16px Georgia,serif';
    words.forEach(function(w){
      var ww=ctx.measureText(w+' ').width;
      if(x+ww>maxW){x=60;y+=26;}
      ctx.fillStyle='#ffe060';
      ctx.fillText(w,x,y);
      x+=ww;
    });
    /* Stats panel */
    var sy=H*0.5+120;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,sy,W-80,H-sy-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('CHAIN STATISTICS',60,sy+24);
    /* Top transitions */
    var transitions=[];
    Object.keys(m.chain).forEach(function(k){
      transitions.push({key:k,next:m.chain[k]});
    });
    /* Show some example transitions */
    ctx.fillStyle='#c0a8e0';
    ctx.font='11px monospace';
    ctx.fillText('Sample state transitions:',60,sy+48);
    var shown=0;
    for(var k in m.chain){
      if(shown>=6)break;
      var nexts=m.chain[k];
      if(nexts.length>=3){
        ctx.fillStyle='#60e0ff';
        ctx.font='11px monospace';
        ctx.fillText('"'+k+'"',60,sy+70+shown*20);
        ctx.fillStyle='#ffe060';
        var uniq={};
        nexts.forEach(function(n){uniq[n]=(uniq[n]||0)+1});
        var list=Object.keys(uniq).slice(0,5).map(function(n){return n+'('+uniq[n]+')'}).join(', ');
        ctx.fillText('→ '+list,280,sy+70+shown*20);
        shown++;
      }
    }
    setStatsHTML(
      '<div>Order: '+m.order+'</div>'+
      '<div>States: '+m.unique+'</div>'+
      '<div>Words: '+(m.generated?m.generated.split(' ').length:0)+'</div>'+
      '<div>Corpus: '+(m.words?m.words.length:0)+'</div>'
    );
    updateBadge('🎲 Markov · order '+m.order+' · '+m.unique+' states');
    $['sbMode'].textContent='Markov';
  },
  onDown:function(){},
  controls:function(){
    var m=STATE.markov;

registerModule('bpe',{
  title:'BPE Tokenizer',
  icon:'🔤',
  desc:'Byte-Pair Encoding learns subword units. The tokenizer behind GPT, BERT, and modern LLMs.',
  init:function(){
    this.train();
  },
  train:function(){
    var b=STATE.bpe;
    /* Build word frequencies from corpus */
    var words=b.text.toLowerCase().split(/\s+/).filter(function(w){return w});
    var wordFreq={};
    words.forEach(function(w){
      var chars=w.split('');
      var key=chars.join(' ')+' </w>';
      wordFreq[key]=(wordFreq[key]||0)+1;
    });
    b.vocab=wordFreq;
    b.merges=[];
    /* Learn merges */
    for(var i=0;i<b.numMerges;i++){
      var pairs={};
      Object.keys(b.vocab).forEach(function(word){
        var symbols=word.split(' ');
        for(var j=0;j<symbols.length-1;j++){
          var pair=symbols[j]+' '+symbols[j+1];
          pairs[pair]=(pairs[pair]||0)+b.vocab[word];
        }
      });
      /* Find most frequent */
      var best=null,bestCount=0;
      Object.keys(pairs).forEach(function(p){
        if(pairs[p]>bestCount){bestCount=pairs[p];best=p;}
      });
      if(!best||bestCount<2)break;
      b.merges.push({pair:best,count:bestCount});
      /* Apply merge */
      var newVocab={};
      Object.keys(b.vocab).forEach(function(word){
        var parts=word.split(best);
        var joined=parts.join(best.replace(' ',''));
        newVocab[joined]=b.vocab[word];
      });
      b.vocab=newVocab;
    }
    b.currentMerges=b.merges.length;
    /* Test tokenization */
    this.testTokenize();
  },
  testTokenize:function(){
    var b=STATE.bpe;
    var word=b.testWord.toLowerCase();
    var symbols=word.split('').concat(['</w>']);
    /* Apply each merge in order */
    for(var i=0;i<b.merges.length;i++){
      var pair=b.merges[i].pair.split(' ');
      var newSyms=[];
      var j=0;
      while(j<symbols.length){
        if(j<symbols.length-1&&symbols[j]===pair[0]&&symbols[j+1]===pair[1]){
          newSyms.push(pair[0]+pair[1]);
          j+=2;
        } else {
          newSyms.push(symbols[j]);
          j++;
        }
      }
      symbols=newSyms;
    }
    b.tokens=symbols;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bpe;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('BPE TOKENIZER',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(b.merges.length+' merges learned',W/2,64);
    /* Test word tokenization */
    ctx.fillStyle='rgba(46,28,82,.6)';
    ctx.strokeStyle='rgba(255,96,224,.4)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(40,90,W-80,80,10);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffe060';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('TOKENIZATION OF: "'+b.testWord+'"',60,114);
    /* Token chips */
    var x=60,y=140;
    if(b.tokens){
      ctx.font='bold 18px monospace';
      b.tokens.forEach(function(t){
        var w=ctx.measureText(t).width+16;
        ctx.fillStyle='rgba(96,255,144,.2)';
        ctx.strokeStyle='#60ff90';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.roundRect(x,y-16,w,30,6);ctx.fill();ctx.stroke();
        ctx.fillStyle='#60ff90';
        ctx.textAlign='left';
        ctx.fillText(t,x+8,y+6);
        x+=w+6;
      });
    }
    /* Merges list */
    var my=190;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,my,W-80,H-my-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('LEARNED MERGES (top 30)',60,my+24);
    var cols=Math.floor((W-120)/280);
    b.merges.slice(0,30).forEach(function(merge,i){
      var col=i%cols;
      var row=Math.floor(i/cols);
      var px=60+col*280;
      var py=my+50+row*20;
      ctx.fillStyle='#60e0ff';
      ctx.font='bold 11px monospace';
      ctx.fillText((i+1)+'.',px,py);
      ctx.fillStyle='#ffe060';
      ctx.fillText(merge.pair,px+30,py);
      ctx.fillStyle='#8870b0';
      ctx.font='10px monospace';
      ctx.fillText('→ "'+merge.pair.replace(' ','')+'" ('+merge.count+')',px+110,py);
    });
    setStatsHTML(
      '<div>Merges: '+b.merges.length+'</div>'+
      '<div>Test word: '+b.testWord+'</div>'+
      '<div>Tokens: '+(b.tokens?b.tokens.length:0)+'</div>'
    );
    updateBadge('🔤 BPE · '+b.merges.length+' merges');
    $('sbMode').textContent='BPE Tokenizer';
  },
  onDown:function(){},
  controls:function(){
    var b=STATE.bpe;
    var html='';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.bpe.train();renderLeftPanel()">🔤 Train BPE</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Parameters</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Number of merges</span><span>'+b.numMerges+'</span></div>';
    html+='<input type="range" min="10" max="200" step="10" value="'+b.numMerges+'" oninput="STATE.bpe.numMerges=parseInt(this.value);renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Test word</h4>';
    html+='<div class="ctrl"><input type="text" value="'+esc(b.testWord)+'" oninput="STATE.bpe.testWord=this.value;MODULES.bpe.testTokenize()"></div>';
    html+='<div class="chip-row" style="margin-top:8px">';
    ['lowest','higher','running','unhappiness','tokenization','transformer'].forEach(function(w){
      html+='<div class="chip" onclick="STATE.bpe.testWord=\''+w+'\';MODULES.bpe.testTokenize();renderLeftPanel()">'+w+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Current tokenization</h4>';
    if(b.tokens){
      b.tokens.forEach(function(t){
        html+='<div class="stat-item"><span class="key">'+t+'</span></div>';
      });
    }
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var b=STATE.bpe;
    return '<div class="sec"><h4>Byte-Pair Encoding</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Algorithm (Sennrich et al. 2016):<br><br>'+
      '1. Start with characters as tokens<br>'+
      '2. Count all adjacent token pairs<br>'+
      '3. Merge the most frequent pair<br>'+
      '4. Repeat for N merges<br><br>'+
      'Result: a vocabulary of subword units balanced between characters (unlimited vocab) and words (large vocab).'+
      '</div></div>'+
      '<div class="sec"><h4>Why subwords?</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '• Handle rare words via smaller units<br>'+
      '• Balance vocab size vs sequence length<br>'+
      '• Generalize to unseen words<br>'+
      '• Used by GPT-2/3/4, BERT, RoBERTa, T5'+
      '</div></div>'+
      '<div class="sec"><h4>Current state</h4><div class="kv">'+
      '<div class="row"><span class="k">Merges</span><span class="v">'+b.merges.length+'</span></div>'+
      '<div class="row"><span class="k">Test word</span><span class="v">'+b.testWord+'</span></div>'+
      '<div class="row"><span class="k">Tokens produced</span><span class="v">'+(b.tokens?b.tokens.length:0)+'</span></div>'+
      '</div></div>';
  }
});
