registerModule('ner',{
  title:'Named Entity Recognition',
  icon:'👤',
  desc:'Identify people, organizations, locations in text. Pattern-based NER with regex and lexicon.',
  init:function(){
    this.extract();
  },
  extract:function(){
    var n=STATE.ner;
    var text=n.text;
    var entities=[];
    /* Capitalized word sequences (proper nouns) */
    var regex=/\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)\b/g;
    var match;
    var lastIdx=0;
    while((match=regex.exec(text))!==null){
      var ent=match[1];
      /* Skip sentence-initial words if not continuing a sequence */
      /* Determine type by heuristic */
      var type='UNKNOWN';
      var commonOrgs=['Google','Microsoft','Apple','Amazon','Facebook','IBM','Meta','Tesla','OpenAI','NASA'];
      var commonLocs=['California','Paris','London','New York','Tokyo','France','Germany','China','India','Brazil'];
      if(commonOrgs.indexOf(ent)>=0||/\b(Inc|Corp|Company|University|Institute)\b/.test(text.substring(match.index,match.index+50)))type='ORG';
      else if(commonLocs.indexOf(ent)>=0||/\b(City|State|Country|River|Mountain)\b/.test(text.substring(match.index,match.index+50)))type='LOC';
      else if(ent.split(/\s+/).length===2&&/[A-Z][a-z]+ [A-Z][a-z]+/.test(ent))type='PER';
      else if(ent.split(/\s+/).length===1)type='MISC';
      entities.push({text:ent,start:match.index,end:match.index+ent.length,type:type});
    }
    n.entities=entities;
    /* Also extract numeric entities */
    var nums=/\b(\d{4}|\d{1,3}(?:,\d{3})+)\b/g;
    while((match=nums.exec(text))!==null){
      entities.push({text:match[1],start:match.index,end:match.index+match[1].length,type:'NUM'});
    }
    n.entities.sort(function(a,b){return a.start-b.start});
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var n=STATE.ner;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('NAMED ENTITY RECOGNITION',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(n.entities.length+' entities found',W/2,64);
    /* Text with highlighted entities */
    var colors={PER:'#ffe060',ORG:'#60e0ff',LOC:'#60ff90',NUM:'#ff60e0',MISC:'#c060ff',UNKNOWN:'#8870b0'};
    var text=n.text;
    var x=60,y=120;
    var maxW=W-120;
    ctx.font='14px Georgia,serif';
    /* Build display with entity highlighting */
    var lastEnd=0;
    var entities=n.entities;
    var display=[];
    entities.forEach(function(ent){
      if(ent.start>lastEnd){
        display.push({type:'text',text:text.substring(lastEnd,ent.start)});
      }
      display.push({type:'entity',ent:ent});
      lastEnd=ent.end;
    });
    if(lastEnd<text.length)display.push({type:'text',text:text.substring(lastEnd)});
    var lineH=26;
    display.forEach(function(item){
      var parts=item.type==='text'?item.text.split(/(\s+)/):[' '+item.ent.text+' '];
      parts.forEach(function(p){
        if(!p)return;
        var color=item.type==='entity'?colors[item.ent.type]:'#c0a8e0';
        ctx.font=item.type==='entity'?'bold 14px Georgia,serif':'14px Georgia,serif';
        var w=ctx.measureText(p).width;
        if(x+w>maxW){x=60;y+=lineH;}
        if(item.type==='entity'&&p.indexOf(item.ent.text)>=0){
          ctx.fillStyle=colors[item.ent.type]+'40';
          ctx.fillRect(x-2,y-16,w+4,22);
          ctx.fillStyle=colors[item.ent.type];
        } else {
          ctx.fillStyle='#c0a8e0';
        }
        ctx.textAlign='left';
        ctx.fillText(p,x,y);
        /* Underline entities */
        if(item.type==='entity'&&p.indexOf(item.ent.text)>=0){
          ctx.fillStyle=colors[item.ent.type];
          ctx.fillRect(x,y+3,w,2);
        }
        x+=w;
      });
    });
    /* Entities list panel */
    var ly=y+40;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,ly,W-80,Math.min(H-ly-30,220),8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('EXTRACTED ENTITIES',60,ly+24);
    var counts={};
    n.entities.forEach(function(e){counts[e.type]=(counts[e.type]||0)+1});
    var ex=60;
    var ey=ly+50;
    var types=['PER','ORG','LOC','NUM','MISC'];
    types.forEach(function(t){
      if(!counts[t])return;
      ctx.fillStyle=colors[t];
      ctx.font='bold 11px monospace';
      ctx.fillText(t+':',ex,ey);
      ctx.fillStyle='#fff';
      ctx.fillText(counts[t].toString(),ex+40,ey);
      var list=n.entities.filter(function(e){return e.type===t}).slice(0,3).map(function(e){return '"'+e.text+'"'}).join(' ');
      ctx.fillStyle='#c0a8e0';
      ctx.font='10px monospace';
      ctx.fillText(list,ex+70,ey);
      ey+=22;
    });
    setStatsHTML(
      '<div>Entities: '+n.entities.length+'</div>'+
      '<div>Types: '+Object.keys(counts).length+'</div>'+
      '<div>PER: '+(counts.PER||0)+'</div>'+
      '<div>ORG: '+(counts.ORG||0)+'</div>'+
      '<div>LOC: '+(counts.LOC||0)+'</div>'
    );
    updateBadge('👤 NER · '+n.entities.length+' entities');
    $('sbMode').textContent='Named Entities';
  },
  onDown:function(){},
  controls:function(){
    var n=STATE.ner;
    var html='';
    html+='<div class="sec"><h4>Text</h4>';
    html+='<div class="ctrl"><textarea oninput="STATE.ner.text=this.value;MODULES.ner.extract()">'+esc(n.text)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Examples</h4>';
    [
      'John Smith works at Google in California.',
      'Mary Jones lives in Paris and studies at the Sorbonne.',
      'Microsoft was founded by Bill Gates and Paul Allen in 1975.',
      'Apple CEO Tim Cook announced new products in Cupertino.',
      'The Amazon river flows through Brazil and Peru.'
    ].forEach(function(t){
      html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.6rem" onclick="STATE.ner.text=\''+esc(t).replace(/'/g,"\\'")+'\';MODULES.ner.extract();renderLeftPanel()">'+t.substring(0,50)+'…</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Entities found</h4>';
    if(n.entities.length===0){
      html+='<div class="text-xs text-dim">No entities detected.</div>';
    } else {
      n.entities.forEach(function(e){
        html+='<div class="stat-item"><span class="key">'+e.type+'</span><span class="val">'+e.text+'</span></div>';
      });
    }
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var n=STATE.ner;
    return '<div class="sec"><h4>NER</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Identify and classify named entities in text:<br><br>'+
      '<b class="text-c1">PER:</b> person names<br>'+
      '<b class="text-c1">ORG:</b> organizations<br>'+
      '<b class="text-c1">LOC:</b> locations<br>'+
      '<b class="text-c1">DATE:</b> dates and times<br>'+
      '<b class="text-c1">NUM:</b> numbers/quantities<br>'+
      '<b class="text-c1">MISC:</b> miscellaneous'+
      '</div></div>'+
      '<div class="sec"><h4>State of the art</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Modern NER uses transformers (BERT, RoBERTa) reaching F1 > 93% on CoNLL-2003. Multi-lingual and cross-lingual NER is an active research area.'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Entities</span><span class="v">'+n.entities.length+'</span></div>'+
      '</div></div>';
  }
});
</script>
<script>

registerModule('sentiment',{
  title:'Sentiment Analysis',
  icon:'😊',
  desc:'Lexicon-based sentiment scoring. Detect positive, negative, and neutral text.',
  init:function(){
    var s=STATE.sentiment;
    s.lexicon={
      // Positive words with scores
      'love':2.5,'beautiful':2.2,'excellent':2.5,'amazing':2.4,'great':2.0,'good':1.5,'wonderful':2.3,
      'fantastic':2.4,'awesome':2.3,'best':2.5,'brilliant':2.4,'perfect':2.5,'outstanding':2.5,
      'nice':1.4,'happy':2.0,'joy':2.2,'delight':2.0,'pleased':1.6,'satisfied':1.4,
      'delicious':2.2,'tasty':1.8,'fresh':1.5,'recommend':1.7,'helpful':1.6,'friendly':1.5,
      'fast':1.0,'quick':1.0,'reliable':1.5,'clean':1.2,'comfortable':1.3,
      'impressive':2.0,'enjoy':1.8,'adore':2.3,'favorite':2.0,'superb':2.4,'super':1.8,
      // Negative words
      'hate':-2.5,'terrible':-2.5,'awful':-2.5,'bad':-1.5,'horrible':-2.6,'worst':-2.7,
      'disappointing':-2.0,'boring':-1.8,'bland':-1.5,'ugly':-2.0,'stupid':-2.2,
      'annoying':-1.9,'frustrating':-2.0,'useless':-2.3,'broken':-1.8,'slow':-1.2,
      'rude':-2.0,'unfriendly':-1.8,'dirty':-1.6,'uncomfortable':-1.5,'overpriced':-1.8,
      'waste':-2.0,'refund':-1.5,'poor':-1.7,'lacking':-1.4,'mediocre':-1.2,
      'disaster':-2.5,'scam':-2.7,'regret':-2.0,'sad':-1.8,'angry':-2.0
    };
    this.analyze();
  },
  analyze:function(){
    var s=STATE.sentiment;
    var words=s.text.toLowerCase().split(/\s+/);
    s.positiveWords=[];
    s.negativeWords=[];
    var totalScore=0;
    var count=0;
    words.forEach(function(w){
      var clean=w.replace(/[.,!?;:]/g,'');
      if(s.lexicon[clean]!==undefined){
        var score=s.lexicon[clean];
        totalScore+=score;
        count++;
        if(score>0)s.positiveWords.push({word:clean,score:score});
        else s.negativeWords.push({word:clean,score:score});
      }
    });
    s.score=totalScore;
    s.wordCount=words.length;
    s.hitCount=count;
    /* Sentiment label */
    if(totalScore>0.5)s.label='POSITIVE';
    else if(totalScore<-0.5)s.label='NEGATIVE';
    else s.label='NEUTRAL';
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var s=STATE.sentiment;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('SENTIMENT ANALYSIS',W/2,42);
    /* Big sentiment indicator */
    var cx=W/2,cy=180;
    var labelColor=s.label==='POSITIVE'?'#60ff90':(s.label==='NEGATIVE'?'#ff6080':'#ffe060');
    ctx.fillStyle=labelColor;
    ctx.font='bold 48px monospace';
    ctx.fillText(s.label,cx,cy);
    /* Gauge */
    var gaugeY=cy+40;
    var gaugeW=W*0.6;
    var gaugeX=(W-gaugeW)/2;
    var gaugeH=30;
    var grad=ctx.createLinearGradient(gaugeX,0,gaugeX+gaugeW,0);
    grad.addColorStop(0,'#ff6080');
    grad.addColorStop(0.5,'#ffe060');
    grad.addColorStop(1,'#60ff90');
    ctx.fillStyle=grad;
    ctx.fillRect(gaugeX,gaugeY,gaugeW,gaugeH);
    /* Marker */
    var maxScore=10;
    var norm=clamp((s.score+maxScore)/(2*maxScore),0,1);
    var markerX=gaugeX+norm*gaugeW;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.moveTo(markerX,gaugeY-8);
    ctx.lineTo(markerX-8,gaugeY-20);
    ctx.lineTo(markerX+8,gaugeY-20);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#000';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(fmt(s.score,2),markerX,gaugeY+gaugeH/2+5);
    /* Labels on gauge */
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.textAlign='left';
    ctx.fillText('NEGATIVE',gaugeX,gaugeY+gaugeH+16);
    ctx.textAlign='right';
    ctx.fillText('POSITIVE',gaugeX+gaugeW,gaugeY+gaugeH+16);
    /* Word breakdown */
    var wy=gaugeY+gaugeH+50;
    ctx.fillStyle='rgba(46,28,82,.6)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,wy,W-80,H-wy-30,8);ctx.fill();ctx.stroke();

      ctx.fillStyle='#60ff90';

      ctx.fillText(w.word,60,wy+68+i*18);
      ctx.fillStyle='#c0a8e0';
      ctx.fillText('+'+fmt(w.score,1),180,wy+68+i*18);
    });
    /* Negative words column */
    ctx.fillStyle='#ff6080';
    ctx.font='bold 11px monospace';
    ctx.fillText('NEGATIVE ('+s.negativeWords.length+')',W/2+40,wy+48);
    s.negativeWords.slice(0,8).forEach(function(w,i){
      ctx.fillStyle='#ff6080';
      ctx.font='11px monospace';
      ctx.fillText(w.word,W/2+40,wy+68+i*18);
      ctx.fillStyle='#c0a8e0';
      ctx.fillText(fmt(w.score,1),W/2+160,wy+68+i*18);
    });
    setStatsHTML(
      '<div>Label: '+s.label+'</div>'+
      '<div>Score: '+fmt(s.score,2)+'</div>'+
      '<div>Positive: '+s.positiveWords.length+'</div>'+
      '<div>Negative: '+s.negativeWords.length+'</div>'
    );
    updateBadge('😊 Sentiment · '+s.label+' ('+fmt(s.score,1)+')');
    $('sbMode').textContent='Sentiment';
    $('sbScore').textContent=fmt(s.score,1);
  },
  onDown:function(){},
  controls:function(){

    html+='<div class="ctrl"><textarea oninput="STATE.sentiment.text=this.value;MODULES.sentiment.analyze()">'+esc(s.text)+'</textarea></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Examples</h4>';
    [
      'I absolutely love this beautiful product.',
      'This is the worst experience I have ever had.',

    });
    html+='</div>';
    html+='<div class="sec"><h4>Result</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Label</span><span class="v" style="color:'+(s.label==='POSITIVE'?'var(--c5)':s.label==='NEGATIVE'?'var(--c4)':'var(--c3)')+'">'+s.label+'</span></div>';

   ================================================================ */
registerModule('cognates',{
  title:'Cognate Detection',
  icon:'🔍',
  desc:'Compare words across Germanic languages. Reveals systematic sound correspondences and shared ancestry.',
  init:function(){
    this.analyze();
  },
  analyze:function(){
    var c=STATE.cognates;
    var row=c.words[c.selected];
    /* Compute sound changes */
    var base=row[0];
    c.soundChanges=[];
    for(var i=1;i<row.length;i++){
      c.soundChanges.push(this.findChanges(base,row[i]));
    }
  },
  findChanges:function(w1,w2){
    var changes=[];
    var len=Math.min(w1.length,w2.length);
    for(var i=0;i<len;i++){
      if(w1[i]!==w2[i])changes.push(w1[i]+' → '+w2[i]);
    }
    return changes;
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var c=STATE.cognates;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('COGNATE DETECTION',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(c.words.length+' word sets · '+c.languages.length+' languages',W/2,64);
    /* Language headers */
    var colW=(W-80)/c.languages.length;
    c.languages.forEach(function(lang,i){
      var x=40+i*colW+colW/2;
      ctx.fillStyle='#ffe060';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText(lang,x,110);
    });
    /* Word rows */
    var colors=['#60e0ff','#ff60e0','#60ff90','#ffe060'];
    c.words.forEach(function(row,ri){
      var y=150+ri*45;
      var isSelected=ri===c.selected;
      if(isSelected){
        ctx.fillStyle='rgba(255,96,224,.1)';
        ctx.fillRect(30,y-25,W-60,40);
      }
      row.forEach(function(w,li){
        var x=40+li*colW+colW/2;
        ctx.fillStyle=colors[li%colors.length];
        ctx.font=(isSelected?'bold ':'')+'18px Georgia,serif';
        ctx.textAlign='center';
        ctx.fillText(w,x,y);
      });
    });
    /* Analysis panel */
    var ay=150+c.words.length*45+20;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,ay,W-80,H-ay-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('SOUND CORRESPONDENCES: "'+c.words[c.selected][0]+'"',60,ay+24);
    var row=c.words[c.selected];
    c.languages.slice(1).forEach(function(lang,li){
      var y2=ay+50+li*30;
      ctx.fillStyle=colors[(li+1)%colors.length];
      ctx.font='bold 12px monospace';
      ctx.fillText(lang+':',60,y2);
      ctx.fillStyle='#60e0ff';
      ctx.font='12px Georgia,serif';
      ctx.fillText('"'+row[li+1]+'"',150,y2);
      /* Sound changes */
      var changes=c.soundChanges[li]||[];
      ctx.fillStyle='#ffe060';
      ctx.font='11px monospace';
      ctx.fillText(changes.length>0?changes.join(', '):'(identical)',260,y2);
    });
    /* Summary of sound laws */
    var sy2=ay+50+c.languages.length*30+10;
    ctx.fillStyle='#c0a8e0';
    ctx.font='11px monospace';
    ctx.fillText('Grimm\'s Law: PIE *p *t *k → Germanic f θ h',60,sy2);
    ctx.fillText('Verner\'s Law: voiceless fricatives become voiced when stress follows',60,sy2+16);
    setStatsHTML(
      '<div>Word sets: '+c.words.length+'</div>'+
      '<div>Languages: '+c.languages.length+'</div>'+
      '<div>Selected: '+c.words[c.selected][0]+'</div>'
    );
    updateBadge('🔍 Cognates · "'+c.words[c.selected][0]+'"');
    $('sbMode').textContent='Cognates';
  },
  onDown:function(){},
  controls:function(){
    var c=STATE.cognates;
    var html='';
    html+='<div class="sec"><h4>Word sets</h4>';
    c.words.forEach(function(row,i){
      html+='<div style="padding:4px 8px;background:'+(i===c.selected?'rgba(255,96,224,.2)':'var(--panel3)')+';border-radius:var(--rxs);margin-bottom:3px;cursor:pointer;font-family:var(--mono);font-size:.65rem" onclick="STATE.cognates.selected='+i+';MODULES.cognates.analyze();renderLeftPanel()">';
      html+='<span style="color:var(--c1)">'+row[0]+'</span>';
      html+='<span style="color:var(--tx3);float:right">'+row.slice(1).join(' / ')+'</span>';
      html+='</div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Analysis</h4>';
    var row=c.words[c.selected];
    c.languages.forEach(function(lang,i){
      var changes=c.soundChanges[i-1]||[];
      html+='<div class="stat-item"><span class="key">'+lang+'</span><span class="val">'+row[i]+(i>0?' → '+changes.length+' changes':'')+'</span></div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Historical Linguistics</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Cognates are words in different languages descended from a common ancestor. Studying cognates reveals regular sound changes.<br><br>'+
      'Grimm\'s Law (1822): PIE stops → Germanic fricatives<br>'+
      '• *p → f (Latin pater → English father)<br>'+
      '• *t → θ (Latin tres → English three)<br>'+
      '• *k → h (Latin centum → English hundred)'+
      '</div></div>'+
      '<div class="sec"><h4>Verner\'s Law</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Exceptions to Grimm\'s Law: voiceless fricatives become voiced when the preceding syllable did not bear PIE accent.<br><br>'+
      'Latin "pater" → English "father" (f→v→d via Verner)'+
      '</div></div>'+
      '<div class="sec"><h4>Comparative method</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'By comparing cognates, linguists reconstruct proto-languages like Proto-Indo-European (spoken ~4500 BCE).'+
      '</div></div>';
  }
});

registerModule('families',{
  title:'Language Families',
  icon:'🌳',
  desc:'Phylogenetic tree of world language families. 142 families, ~7000 languages.',
  init:function(){
    this.countNodes(STATE.families.tree);
  },
  countNodes:function(node){
    if(!node.children){STATE.families.nodeCount++;return;}
    STATE.families.nodeCount++;
    node.children.forEach(this.countNodes.bind(this));
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var f=STATE.families;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('LANGUAGE FAMILIES',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText('~7000 languages in 142 families — showing 20 major families',W/2,64);
    /* Tree layout */
    var treeY=100;
    var treeH=H-140;
    /* Count root children */
    var rootChildren=f.tree.children;
    var colW=W/rootChildren.length;
    /* Draw tree recursively */
    this.drawTree(ctx,f.tree,W/2,treeY,W-80,treeH);
    setStatsHTML(
      '<div>Families: '+rootChildren.length+'</div>'+
      '<div>Nodes: '+f.nodeCount+'</div>'+
      '<div>Languages: ~7000</div>'
    );
    updateBadge('🌳 Language Families · '+rootChildren.length+' major families');
    $('sbMode').textContent='Language Families';
  },
  drawTree:function(ctx,node,x,y,maxW,maxH){
    if(!node.children)return;
    /* Draw children */
    var n=node.children.length;
    var childSpacing=maxW/n;
    var startX=x-(maxW-childSpacing)/2;
    var childY=y+maxH/Math.max(1,3+this.depth(node)-1);
    node.children.forEach(function(child,i){
      var cx=startX+i*childSpacing;
      /* Connector */
      ctx.strokeStyle='rgba(255,96,224,.4)';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(x,y+16);
      ctx.lineTo(cx,childY-4);
      ctx.stroke();
      /* Node */
      this.drawNode(ctx,child,cx,childY,childSpacing-10);
    },this);
  },
  depth:function(node){
    if(!node.children)return 0;
    var d=0;
    node.children.forEach(function(c){d=Math.max(d,1+this.depth(c))},this);
    return d;
  },
  drawNode:function(ctx,node,x,y,maxW){
    var hasChildren=node.children&&node.children.length>0;
    var color=hasChildren?'#ff60e0':'#60ff90';
    var fontSize=hasChildren?11:10;
    ctx.fillStyle=hasChildren?'rgba(255,96,224,.15)':'rgba(96,255,144,.2)';
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    var w=Math.min(maxW,Math.max(70,node.name.length*7+16));
    ctx.beginPath();ctx.roundRect(x-w/2,y-12,w,24,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=color;
    ctx.font='bold '+fontSize+'px monospace';
    ctx.textAlign='center';
    ctx.fillText(node.name,x,y+4);
    if(hasChildren){
      this.drawTree(ctx,node,x,y,maxW,80);
    }
  },
  onDown:function(){},
  controls:function(){
    var f=STATE.families;
    var html='';
    html+='<div class="sec"><h4>Statistics</h4>';
    html+='<div class="kv">';
    html+='<div class="row"><span class="k">Root families</span><span class="v">'+f.tree.children.length+'</span></div>';
    html+='<div class="row"><span class="k">Total nodes</span><span class="v">'+f.nodeCount+'</span></div>';
    html+='<div class="row"><span class="k">World languages</span><span class="v">~7,000</span></div>';
    html+='<div class="row"><span class="k">Speakers (IE)</span><span class="v">~3.2 billion</span></div>';
    html+='<div class="row"><span class="k">Speakers (Sino-Tib)</span><span class="v">~1.4 billion</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Top families</h4>';
    f.tree.children.slice(0,10).forEach(function(c){
      var count=c.children?c.children.reduce(function(s,x){return s+(x.children?x.children.length:1)},0):1;
      html+='<div class="stat-item"><span class="key">'+c.name+'</span><span class="val">'+count+' branches</span></div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Language Families</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Languages that share a common ancestor are grouped into families. The comparative method reconstructs proto-languages from cognates and systematic sound changes.'+
      '</div></div>'+
      '<div class="sec"><h4>Major families</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '<b class="text-c1">Indo-European:</b> 3.2B speakers, 445 languages<br>'+
      '<b class="text-c1">Sino-Tibetan:</b> 1.4B, 400+ languages<br>'+
      '<b class="text-c1">Niger-Congo:</b> 500M, 1500+ languages<br>'+
      '<b class="text-c1">Afro-Asiatic:</b> 500M, 300+ languages<br>'+
      '<b class="text-c1">Austronesian:</b> 380M, 1200+ languages'+
      '</div></div>'+
      '<div class="sec"><h4>Proto-Indo-European</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'Reconstructed from cognates across Sanskrit, Greek, Latin, and Germanic languages. Spoken ~4500 BCE on the Pontic-Caspian steppe. Contains words for father, mother, water, three, and star.'+
      '</div></div>';
  }
});

registerModule('typology',{
  title:'Linguistic Typology',
  icon:'🌍',
  desc:'Compare languages by structural features. WALS-style typological classification.',
  init:function(){
    this.match();
  },
  match:function(){
    var t=STATE.typology;
    t.matchedLanguages=t.languageDatabase.filter(function(lang){
      var score=0;
      if(lang.wordOrder===t.features.wordOrder)score+=2;
      if(lang.adjOrder===t.features.adjOrder)score+=1;
      if(lang.alignment===t.features.alignment)score+=2;
      if(lang.tone===t.features.tone)score+=1;
      if(lang.morphology===t.features.morphology)score+=2;
      return score>=5;
    });
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var t=STATE.typology;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('LINGUISTIC TYPOLOGY',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText('Word Order Universals (Greenberg 1963)',W/2,64);
    /* Feature grid */
    var y=100;
    var features=[
      {name:'Word Order',key:'wordOrder',options:['SVO','SOV','VSO','VOS','OVS','OSV'],color:'#ffe060'},
      {name:'Adjective Order',key:'adjOrder',options:['AdjN','NAdj'],color:'#60e0ff'},
      {name:'Alignment',key:'alignment',options:['nominative-accusative','ergative-absolutive'],color:'#60ff90'},
      {name:'Morphology',key:'morphology',options:['isolating','agglutinative','fusional','polysynthetic'],color:'#ff60e0'},
      {name:'Tone',key:'tone',options:[false,true],color:'#ffa060'}
    ];
    features.forEach(function(feat,i){
      var fy=y+i*60;
      ctx.fillStyle='rgba(24,14,46,.6)';
      ctx.strokeStyle=feat.color+'40';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(40,fy,W-80,50,8);ctx.fill();ctx.stroke();
      ctx.fillStyle=feat.color;
      ctx.font='bold 12px monospace';
      ctx.textAlign='left';
      ctx.fillText(feat.name,60,fy+22);
      /* Options */
      var ox=200;
      feat.options.forEach(function(opt){
        var isActive=t.features[feat.key]===opt;
        var label=opt===true?'yes':(opt===false?'no':opt);
        var w=label.length*8+20;
        ctx.fillStyle=isActive?feat.color:'rgba(46,28,82,.6)';
        ctx.beginPath();ctx.roundRect(ox,fy+12,w,26,4);ctx.fill();
        ctx.fillStyle=isActive?'#0f0820':'#c0a8e0';
        ctx.font='11px monospace';
        ctx.textAlign='center';
        ctx.fillText(label,ox+w/2,fy+29);
        ox+=w+8;
      });
    });
    /* Matched languages */
    var my=y+features.length*60+20;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='#60ff90';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(40,my,W-80,H-my-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#60ff90';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('MATCHING LANGUAGES ('+t.matchedLanguages.length+')',60,my+24);
    if(t.matchedLanguages.length===0){
      ctx.fillStyle='#8870b0';
      ctx.font='11px monospace';
      ctx.fillText('No exact matches. Try relaxing some features.',60,my+50);
    }
    t.matchedLanguages.slice(0,8).forEach(function(lang,i){
      ctx.fillStyle='#60e0ff';
      ctx.font='bold 11px monospace';
      ctx.fillText(lang.name,60+Math.floor(i/4)*300,my+50+(i%4)*22);
      ctx.fillStyle='#c0a8e0';
      ctx.font='10px monospace';
      ctx.fillText(lang.wordOrder+' · '+lang.alignment+' · '+lang.morphology,160+Math.floor(i/4)*300,my+50+(i%4)*22);
    });
    setStatsHTML(
      '<div>Matches: '+t.matchedLanguages.length+'</div>'+
      '<div>Word order: '+t.features.wordOrder+'</div>'+
      '<div>Alignment: '+t.features.alignment+'</div>'
    );
    updateBadge('🌍 Typology · '+t.matchedLanguages.length+' matches');
    $('sbMode').textContent='Typology';
  },
  onDown:function(p){
    /* Check which feature option was clicked */
    var t=STATE.typology;
    var features=[
      {key:'wordOrder',options:['SVO','SOV','VSO','VOS','OVS','OSV']},
      {key:'adjOrder',options:['AdjN','NAdj']},
      {key:'alignment',options:['nominative-accusative','ergative-absolutive']},
      {key:'morphology',options:['isolating','agglutinative','fusional','polysynthetic']},
      {key:'tone',options:[false,true]}
    ];
    var y=100;
    features.forEach(function(feat,i){
      var fy=y+i*60;
      var ox=200;
      feat.options.forEach(function(opt){
        var label=opt===true?'yes':(opt===false?'no':opt);
        var w=label.length*8+20;
        if(p.x>ox&&p.x<ox+w&&p.y>fy+12&&p.y<fy+38){
          t.features[feat.key]=opt;
          MODULES.typology.match();
          renderLeftPanel();
        }
        ox+=w+8;
      });
    });
  },
  controls:function(){
    var t=STATE.typology;
    var html='';
    html+='<div class="sec"><h4>Features</h4>';
    Object.keys(t.features).forEach(function(key){
      var v=t.features[key];
      var label=typeof v==='boolean'?(v?'yes':'no'):v;
      html+='<div class="stat-item"><span class="key">'+key+'</span><span class="val">'+label+'</span></div>';
    });
    html+='</div>';
    html+='<div class="sec"><h4>Matching languages</h4>';
    if(t.matchedLanguages.length===0){
      html+='<div class="text-xs text-dim">No matches. Click options on the canvas to change.</div>';
    } else {
      t.matchedLanguages.forEach(function(lang){
        html+='<div style="padding:4px 8px;background:var(--panel3);border-radius:var(--rxs);margin-bottom:3px;font-family:var(--mono);font-size:.6rem;border-left:3px solid var(--c5)">';
        html+='<div style="color:var(--c5);font-weight:600">'+lang.name+'</div>';
        html+='<div style="color:var(--tx3)">'+lang.wordOrder+' · '+lang.morphology+' · '+(lang.tone?'tonal':'atonal')+'</div>';
        html+='</div>';
      });
    }
    html+='</div>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5">Click options on the canvas to change features.</div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>Typology</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'Typology classifies languages by structural features, not by family. WALS (World Atlas of Language Structures) documents 192 features across 2,679 languages.'+
      '</div></div>'+
      '<div class="sec"><h4>Word order universals</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      'Greenberg (1963) observed correlations:<br><br>'+
      '• SOV languages tend to have postpositions<br>'+
      '• SVO languages tend to have prepositions<br>'+
      '• VSO languages are always prepositional<br><br>'+
      'These are statistical tendencies, not absolute laws.'+
      '</div></div>'+
      '<div class="sec"><h4>Why SVO dominates</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
      'SVO order helps avoid ambiguity in processing. It puts subject before object, matching topic-comment information flow.'+
      '</div></div>';
  }
});

/* ================================================================

   ================================================================ */
registerModule('conlang',{
  title:'Conlang Builder',
  icon:'🎨',
  desc:'Build your own constructed language. Design phonology, generate vocabulary, and set grammar rules.',
  init:function(){
    this.generateVocab();
  },
  generateVocab:function(){
    var c=STATE.conlang;
    var phon=c.phonology;
    var consonants=phon.filter(function(p){return p.type==='consonant'}).map(function(p){return p.sym});
    var vowels=phon.filter(function(p){return p.type==='vowel'}).map(function(p){return p.sym});
    /* Generate 50 random words using CV(C) pattern */
    var concepts=['water','fire','earth','sky','sun','moon','star','tree','stone','person',
                  'man','woman','child','mother','father','friend','eat','drink','sleep','walk',
                  'run','see','hear','speak','know','think','feel','love','give','take',
                  'big','small','good','bad','hot','cold','red','blue','green','one',
                  'two','three','four','five','yes','no','hello','goodbye','please','thank'];
    c.vocabulary=[];
    var rng=makeRNG(12345);
    concepts.forEach(function(concept){
      var len=rnd(1,3);
      var word='';
      for(var i=0;i<len;i++){
        if(consonants.length>0)word+=consonants[Math.floor(rng()*consonants.length)];
        if(vowels.length>0)word+=vowels[Math.floor(rng()*vowels.length)];
      }
      /* Plural suffix */
      if(c.grammar.pluralType==='suffix'){
        c.vocabulary.push({concept:concept,singular:word,plural:word+(consonants.length>0?consonants[0]:'')+(vowels.length>0?vowels[0]:'')});
      } else {
        c.vocabulary.push({concept:concept,singular:word,plural:word+'k'});
      }
    });
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#080412';
    ctx.fillRect(0,0,W,H);
    var c=STATE.conlang;
    /* Header */
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('CONLANG: "'+c.name+'"',W/2,42);
    ctx.fillStyle='#8870b0';
    ctx.font='11px monospace';
    ctx.fillText(c.phonology.length+' phonemes · '+c.vocabulary.length+' words · '+c.grammar.wordOrder+' word order',W/2,64);
    /* Phonology chart */
    var phy=100;
    ctx.fillStyle='rgba(46,28,82,.6)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,phy,W-80,100,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('PHONOLOGY',60,phy+24);
    /* Consonants row */
    ctx.fillStyle='#ffe060';
    ctx.font='bold 10px monospace';
    ctx.fillText('Consonants:',60,phy+50);
    var cx=150,cy=phy+50;
    c.phonology.filter(function(p){return p.type==='consonant'}).forEach(function(p){
      ctx.fillStyle='#ffe060';
      ctx.font='18px Georgia,serif';
      ctx.textAlign='center';
      ctx.fillText(p.sym,cx,cy);
      cx+=32;
    });
    /* Vowels row */
    ctx.fillStyle='#60ff90';
    ctx.font='bold 10px monospace';
    ctx.textAlign='left';
    ctx.fillText('Vowels:',60,phy+78);
    cx=150;
    var vy=phy+78;
    c.phonology.filter(function(p){return p.type==='vowel'}).forEach(function(p){
      ctx.fillStyle='#60ff90';
      ctx.font='18px Georgia,serif';
      ctx.textAlign='center';
      ctx.fillText(p.sym,cx,vy);
      cx+=32;
    });
    /* Vocabulary grid */
    var vy2=220;
    ctx.fillStyle='rgba(24,14,46,.9)';
    ctx.strokeStyle='rgba(255,96,224,.3)';
    ctx.beginPath();ctx.roundRect(40,vy2,W-80,H-vy2-30,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff60e0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('VOCABULARY',60,vy2+24);
    /* Grid layout */
    var cols=4;
    var colW=(W-100)/cols;
    c.vocabulary.slice(0,40).forEach(function(word,i){
      var col=i%cols;
      var row=Math.floor(i/cols);
      var x=60+col*colW;
      var y=vy2+50+row*28;
      if(y>H-40)return;
      ctx.fillStyle='#60e0ff';
      ctx.font='bold 11px monospace';
      ctx.textAlign='left';
      ctx.fillText(word.concept,x,y);
      ctx.fillStyle='#ffe060';
      ctx.font='bold 14px Georgia,serif';
      ctx.fillText(word.singular,x+80,y);
      ctx.fillStyle='#8870b0';
      ctx.font='9px monospace';
      ctx.fillText('/'+word.singular+'/',x+80,y+10);
    });
    setStatsHTML(
      '<div>Phonemes: '+c.phonology.length+'</div>'+
      '<div>Words: '+c.vocabulary.length+'</div>'+
      '<div>Syllables: '+c.syllables+'</div>'+
      '<div>Word order: '+c.grammar.wordOrder+'</div>'
    );
    updateBadge('🎨 Conlang · '+c.name+' · '+c.vocabulary.length+' words');
    $['sbMode'].textContent='Conlang Builder';
  },
  onDown:function(){},
  controls:function(){
    var c=STATE.conlang;
    var html='';
    html+='<div class="sec"><h4>Language name</h4>';
    html+='<div class="ctrl"><input type="text" value="'+esc(c.name)+'" oninput="STATE.conlang.name=this.value"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.conlang.generateVocab();renderLeftPanel()">🎲 Generate new vocabulary</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Phonology</h4>';
    html+='<div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-bottom:6px">Click to toggle phonemes:</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:3px">';
    var allPhonemes=['p','b','t','d','k','g','m','n','ŋ','f','v','s','z','ʃ','ʒ','h','l','r','j','w','θ','ð','a','e','i','o','u','ə','ɛ','ɔ','y','ø'];
    allPhonemes.forEach(function(sym){
      var active=c.phonology.some(function(p){return p.sym===sym});
      var isVowel='aeiouəɛɔyø'.indexOf(sym)>=0;
      html+='<div style="padding:6px 10px;background:'+(active?(isVowel?'rgba(96,255,144,.3)':'rgba(255,224,96,.3)'):'var(--panel3)')+';border:1px solid '+(active?(isVowel?'#60ff90':'#ffe060'):'var(--bd)')+';border-radius:var(--rxs);cursor:pointer;font-family:Georgia,serif;font-size:1rem;color:'+(active?(isVowel?'#60ff90':'#ffe060'):'var(--tx3)')+'" onclick="togglePhoneme(\''+sym+'\')">'+sym+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Grammar</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>Word order</span></div>';
    html+='<div class="chip-row">';
    ['SVO','SOV','VSO'].forEach(function(o){
      html+='<div class="chip '+(c.grammar.wordOrder===o?'active':'')+'" onclick="STATE.conlang.grammar.wordOrder=\''+o+'\';renderLeftPanel()">'+o+'</div>';
    });
    html+='</div></div>';
    html+='<div class="ctrl"><div class="lbl"><span>Plural type</span></div>';
    html+='<div class="chip-row">';
    ['suffix','prefix'].forEach(function(p){
      html+='<div class="chip '+(c.grammar.pluralType===p?'active':'')+'" onclick="STATE.conlang.grammar.pluralType=\''+p+'\';MODULES.conlang.generateVocab();renderLeftPanel()">'+p+'</div>';
    });
    html+='</div></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Sample words</h4>';
    c.vocabulary.slice(0,8).forEach(function(w){
      html+='<div class="stat-item"><span class="key">'+w.concept+'</span><span class="val">'+w.singular+' ('+w.plural+')</span></div>';
    });
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var c=STATE.conlang;
    return '<div class="sec"><h4>Constructed Languages</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.75;color:var(--tx2)">'+
      'A conlang is a language whose phonology, grammar, and vocabulary have been devised by an individual or group.<br><br>'+
      '<b class="text-c1">Auxlangs:</b> for international communication (Esperanto, Interlingua)<br>'+
      '<b class="text-c1">Artlangs:</b> for art/fiction (Quenya, Klingon, Dothraki, Na\'vi)<br>'+
      '<b class="text-c1">Engelangs:</b> for logic (Lojban, Ithkuil)'+
      '</div></div>'+
      '<div class="sec"><h4>Design decisions</h4>'+
      '<div class="text-xs" style="font-family:var(--mono);line-height:1.65;color:var(--tx2)">'+
      '• Phoneme inventory size (small = easier; Rotokas has 11; !Xóõ has 140+)<br>'+
      '• Syllable structure (CV is universal; complex clusters are rare)<br>'+
      '• Word order (SOV is most common worldwide)<br>'+
      '• Morphological type<br>'+
      '• Writing system'+
      '</div></div>'+
      '<div class="sec"><h4>Current conlang</h4><div class="kv">'+
      '<div class="row"><span class="k">Name</span><span class="v">'+c.name+'</span></div>'+
      '<div class="row"><span class="k">Phonemes</span><span class="v">'+c.phonology.length+'</span></div>'+
      '<div class="row"><span class="k">Vocabulary</span><span class="v">'+c.vocabulary.length+'</span></div>'+
      '<div class="row"><span class="k">Word order</span><span class="v">'+c.grammar.wordOrder+'</span></div>'+
      '<div class="row"><span class="k">Plural</span><span class="v">'+c.grammar.pluralType+'</span></div>'+
      '</div></div>';
  }
});
function togglePhoneme(sym){
  var c=STATE.conlang;
  var i=c.phonology.findIndex(function(p){return p.sym===sym});
  if(i>=0)c.phonology.splice(i,1);
  else {
    var isVowel='aeiouəɛɔyø'.indexOf(sym)>=0;
    c.phonology.push({sym:sym,type:isVowel?'vowel':'consonant'});
  }
  MODULES.conlang.generateVocab();
  renderLeftPanel();
}

function buildTabs(){
  var tabs=$('tbTabs');
  tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active');});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active');});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');
  if(!body)return;
  var m=MODULES[STATE.currentTab];
  if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.72rem">'+m.icon+' '+m.title+'</h4><div class="text-xs text-dim" style="font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}

function renderLogs(){
  var p=$('rpLogs');
  if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.62rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c5)':'var(--c1)';
    html+='<div style="padding:4px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.6rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){

var THEMES=['lingua','parchment','matrix','ink'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);

  document.documentElement.setAttribute('data-theme',next);

  toast('Theme: '+next,'success');
}
function exportState(){
  var data={
    version:'1.0',
    timestamp:new Date().toISOString(),
    ipa:{selected:STATE.ipa.selected,category:STATE.ipa.category},
    vowels:{selected:STATE.vowels.selected},
    phonology:{word:STATE.phonology.word,output:STATE.phonology.output,rules:STATE.phonology.activeRules},
    morphology:{word:STATE.morphology.word,language:STATE.morphology.language},
    syntax:{sentence:STATE.syntax.sentence},
    embeddings:{selected:STATE.embeddings.selected},
    pos:{tokens:STATE.pos.tagged?STATE.pos.tagged.length:0},
    ngrams:{n:STATE.ngrams.n,unique:STATE.ngrams.sorted?STATE.ngrams.sorted.length:0},
    markov:{order:STATE.markov.order,generated:STATE.markov.generated},
    bpe:{testWord:STATE.bpe.testWord,merges:STATE.bpe.merges.length},
    ner:{entities:STATE.ner.entities.length},
    sentiment:{label:STATE.sentiment.label,score:STATE.sentiment.score},
    cognates:{selected:STATE.cognates.selected},
    writing:{selected:STATE.writing.selected},
    typology:{matches:STATE.typology.matchedLanguages.length},
    conlang:{name:STATE.conlang.name,vocab:STATE.conlang.vocabulary.length}
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);

}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key>='1'&&e.key<='9'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='0')switchTab('markov');
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(4,10);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('LINGUA ready · Press ? for help','success',3500);
      },400);
    }
  },120);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  var m=MODULES[STATE.currentTab];
  if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
  if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  requestAnimationFrame(mainLoop);
}
