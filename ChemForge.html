<!DOCTYPE html>
<html lang="en" data-theme="lab">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>CHEMFORGE — Chemistry Studio</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
ul,ol{list-style:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--c1);background-clip:content-box}

:root{
  --bg:#0a0e14;--bg2:#0e141c;--bg3:#141c28;--bg4:#1c2638;
  --panel:#0c1219;--panel2:#121a24;--panel3:#1a2430;--panel4:#242e3c;
  --bd:#1c2838;--bd2:#2c3c50;--bd3:#405470;
  --tx:#e0e8f0;--tx2:#a0b0c0;--tx3:#687888;--mu:#404c5c;
  --c1:#40c8e0;--c1h:#80e0f0;--c1l:#20a0b8;
  --c2:#e86080;--c2h:#f0a0b8;--c2l:#c03858;
  --c3:#f0c040;--c3h:#f8e090;--c3l:#c09000;
  --c4:#a060e0;--c4h:#c0a0f0;--c4l:#7030b0;
  --c5:#50e080;--c5h:#90f0b0;--c5l:#20a850;
  --c6:#4090f0;--c6h:#80c0ff;--c6l:#2060c0;
  --c7:#f08040;--c7h:#ffb080;--c7l:#c04800;
  --c8:#e040a0;--c8h:#f080c0;--c8l:#b02078;
  --ok:#50e080;--warn:#f0c040;--err:#e86080;--info:#40c8e0;
  /* Element category colors */
  --el-alkali:#ff6b6b;--el-alkaline:#ffb84d;--el-transition:#6ec6ff;
  --el-post:#a0d8a0;--el-metalloid:#c0a0ff;--el-nonmetal:#7be87b;
  --el-halogen:#ffe066;--el-noble:#e8a0ff;--el-lanthanide:#ff90c8;
  --el-actinide:#ff80a0;--el-unknown:#909090;
  --g1:linear-gradient(135deg,#40c8e0,#a060e0);
  --g2:linear-gradient(135deg,#e86080,#f0c040);
  --g3:linear-gradient(135deg,#50e080,#40c8e0);
  --gHolo:linear-gradient(120deg,#40c8e0,#a060e0,#e040a0,#50e080,#f0c040,#40c8e0);
  --r:10px;--rs:7px;--rxs:5px;--rf:9999px;
  --sh:0 8px 32px rgba(0,0,0,.7);
  --sh2:0 16px 48px rgba(0,0,0,.9);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,-apple-system,sans-serif;
  --disp:'Orbitron','Audiowide',sans-serif;
  --t1:all .14s cubic-bezier(.4,0,.2,1);
  --t2:all .24s cubic-bezier(.4,0,.2,1);
}
[data-theme="clinical"]{--bg:#f0f4f8;--bg2:#e4ecf2;--bg3:#d4dce6;--panel:#fff;--panel2:#f5f8fb;--panel3:#e8eef4;
  --bd:#c4d0dc;--bd2:#a0b0c0;--tx:#0a1018;--tx2:#3a4858;--tx3:#708090;
  --c1:#0088a0;--c2:#c02850;--c3:#b08000;--c4:#7030a0;
  --g1:linear-gradient(135deg,#0088a0,#7030a0)}
[data-theme="dark"]{--bg:#000;--bg2:#080808;--bg3:#101010;--panel:#080808;--panel2:#101010;
  --bd:#1e1e1e;--bd2:#303030;--tx:#e0e0e0;--tx2:#a0a0a0;--tx3:#606060;
  --c1:#40ffff;--c2:#ff4080;--c3:#ffff40;--c4:#c040ff;
  --g1:linear-gradient(135deg,#40ffff,#c040ff)}
[data-theme="paper"]{--bg:#f0ede0;--bg2:#e8e2d0;--bg3:#dcd4c0;--panel:#fff;--panel2:#f8f4e8;--panel3:#ece4d0;
  --bd:#c8c0a8;--bd2:#a89880;--tx:#0e1408;--tx2:#484030;--tx3:#807860;
  --c1:#006888;--c2:#a02848;--c3:#906800;--c4:#6030a0;
  --g1:linear-gradient(135deg,#006888,#6030a0)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;background:#0a0e14;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-mol{position:relative;width:160px;height:120px;margin-bottom:20px}
.boot-mol svg{width:100%;height:100%}
.boot-mol .bond{stroke:#40c8e0;stroke-width:2;fill:none;stroke-dasharray:200;stroke-dashoffset:200;animation:drawBond 2s ease-out infinite}
.boot-mol .atom{fill:#a060e0;opacity:0;animation:atomPop 2s ease-out infinite}
.boot-mol .atom:nth-child(2){animation-delay:.3s;fill:#40c8e0}
.boot-mol .atom:nth-child(3){animation-delay:.6s;fill:#e86080}
.boot-mol .atom:nth-child(4){animation-delay:.9s;fill:#f0c040}
.boot-mol .atom:nth-child(5){animation-delay:1.2s;fill:#50e080}
@keyframes drawBond{0%{stroke-dashoffset:200}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes atomPop{0%{opacity:0;r:0}40%{opacity:1;r:6}100%{opacity:0;r:8}}
.boot-logo{font-family:var(--disp);font-size:3rem;font-weight:900;letter-spacing:10px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.68rem;color:#40c8e0;letter-spacing:8px;margin-bottom:32px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#141c28;border-radius:2px;overflow:hidden;margin-bottom:12px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40c8e0}
.boot-pct{font-size:.68rem;color:#40c8e0;margin-bottom:16px}
.boot-log{font-size:.6rem;color:#687888;text-align:left;width:min(420px,90vw);height:120px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#50e080}.boot-log .warn{color:#f0c040}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

/* ============ TOPBAR ============ */
#topbar{height:50px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:4px;font-size:.92rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:10px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:32px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#0a0e14;box-shadow:0 0 14px rgba(64,200,224,.35)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb-btn{width:32px;height:32px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-btn.active{background:var(--g1);color:#0a0e14;border-color:transparent}
.tb-info{font-family:var(--mono);font-size:.62rem;padding:4px 10px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;display:flex;gap:10px}

/* ============ MAIN ============ */
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:250px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:36px}
.panel-head{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#contentArea{flex:1;overflow:auto;padding:0;position:relative}

#rightPanel{width:290px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:36px}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:32px}
.rp-tab{flex:1;padding:6px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:4px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

/* ============ STATUS BAR ============ */
#statusbar{height:28px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:14px;font-family:var(--mono);font-size:.62rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}

/* ============ CONTROLS ============ */
.sec{margin-bottom:14px}
.sec h4{font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);margin-bottom:8px;font-weight:700;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.sec h4 .badge{background:var(--c1);color:#0a0e14;font-size:.55rem;padding:1px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:0}
.lbl{font-size:.6rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);font-family:var(--mono);letter-spacing:0;text-transform:none}
.ctrl{margin-bottom:10px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--c1);border-radius:50%;cursor:pointer;border:none}
.ctrl input[type=text],.ctrl input[type=number],.ctrl select,.ctrl textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px 9px;color:var(--tx);font-size:.68rem;transition:var(--t1);font-family:var(--mono)}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,200,224,.15)}
.ctrl textarea{resize:vertical;min-height:70px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.68rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.btn.primary{background:var(--g1);color:#0a0e14;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 16px rgba(64,200,224,.4)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel3);border-color:var(--bd)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:rgba(232,96,128,.1)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:4px 8px;font-size:.6rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.toggle{position:relative;width:36px;height:20px;background:var(--panel4);border-radius:var(--rf);cursor:pointer;transition:var(--t2);flex-shrink:0;display:inline-block}
.toggle.on{background:var(--c1)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:var(--t2)}
.toggle.on::after{left:18px}

/* ============ LIST ============ */
.list{display:flex;flex-direction:column;gap:2px}
.li{padding:6px 9px;border-radius:var(--rxs);cursor:pointer;font-size:.66rem;display:flex;align-items:center;gap:8px;transition:var(--t1);color:var(--tx2);font-family:var(--mono)}
.li:hover{background:var(--panel3);color:var(--tx)}
.li.active{background:rgba(64,200,224,.12);color:var(--c1);border-left:2px solid var(--c1);padding-left:7px}
.li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.58rem;color:var(--tx3)}

/* ============ TABLE ============ */
.data-table{width:100%;font-family:var(--mono);font-size:.62rem;border-collapse:collapse}
.data-table th{text-align:left;padding:5px 8px;background:var(--panel3);font-size:.55rem;text-transform:uppercase;letter-spacing:.9px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0}
.data-table td{padding:4px 8px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table tbody tr{cursor:pointer;transition:var(--t1)}
.data-table tbody tr:hover td{background:var(--panel3);color:var(--tx)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}.data-table td.c5{color:var(--c5)}

/* ============ HELPERS ============ */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.text-mono{font-family:var(--mono)}
.text-xs{font-size:.62rem}
.text-dim{color:var(--tx3)}
.text-c1{color:var(--c1)}.text-c2{color:var(--c2)}.text-c3{color:var(--c3)}.text-c4{color:var(--c4)}.text-c5{color:var(--c5)}
.kv{font-family:var(--mono);font-size:.65rem;line-height:1.75}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all}
.empty{text-align:center;padding:30px 20px;color:var(--tx3);font-size:.7rem;font-family:var(--mono)}
.empty .e-icon{font-size:2.5rem;opacity:.3;margin-bottom:10px}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:12px}
.stat{background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;text-align:center}
.stat .sv{font-family:var(--mono);font-size:.95rem;font-weight:800;color:var(--c1);line-height:1.1;word-break:break-all}
.stat .sl{font-size:.5rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:3px}

/* ============ MODAL ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:800px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.9rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:20px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:26px;height:26px;border-radius:var(--rxxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

/* ============ TOAST ============ */
#toasts{position:fixed;bottom:44px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.7rem;font-weight:500;max-width:340px;min-width:180px;animation:tin .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c5)}.toast.warn{border-left-color:var(--c3)}.toast.error{border-left-color:var(--c2)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

/* ============ PERIODIC TABLE ============ */
.periodic-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;padding:12px;min-width:900px}
.el-cell{aspect-ratio:1;border-radius:3px;cursor:pointer;transition:var(--t1);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-family:var(--mono);border:1px solid rgba(0,0,0,.3);min-width:0}
.el-cell:hover{transform:scale(1.15);z-index:5;box-shadow:0 0 12px currentColor}
.el-cell.selected{outline:2px solid #fff;outline-offset:1px;z-index:6}
.el-cell .el-num{position:absolute;top:1px;left:3px;font-size:.45rem;opacity:.7}
.el-cell .el-sym{font-size:.85rem;font-weight:800;line-height:1}
.el-cell .el-name{font-size:.45rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.el-cell .el-mass{font-size:.4rem;opacity:.6;display:none}
.el-cell:hover .el-mass,.el-cell.selected .el-mass{display:block}
.el-cell.small .el-name{display:none}
.el-placeholder{visibility:hidden}

/* Categories */
.cat-alkali{background:rgba(255,107,107,.25);color:#ff6b6b;border-color:#ff6b6b}
.cat-alkaline{background:rgba(255,184,77,.25);color:#ffb84d;border-color:#ffb84d}
.cat-transition{background:rgba(110,198,255,.25);color:#6ec6ff;border-color:#6ec6ff}
.cat-post{background:rgba(160,216,160,.25);color:#a0d8a0;border-color:#a0d8a0}
.cat-metalloid{background:rgba(192,160,255,.25);color:#c0a0ff;border-color:#c0a0ff}
.cat-nonmetal{background:rgba(123,232,123,.25);color:#7be87b;border-color:#7be87b}
.cat-halogen{background:rgba(255,224,102,.25);color:#ffe066;border-color:#ffe066}
.cat-noble{background:rgba(232,160,255,.25);color:#e8a0ff;border-color:#e8a0ff}
.cat-lanthanide{background:rgba(255,144,200,.25);color:#ff90c8;border-color:#ff90c8}
.cat-actinide{background:rgba(255,128,160,.25);color:#ff80a0;border-color:#ff80a0}
.cat-unknown{background:rgba(144,144,144,.25);color:#909090;border-color:#909090}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;font-family:var(--mono);font-size:.6rem}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.3)}

/* ============ MOLECULE EDITOR ============ */
.mol-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;background:var(--bg)}
.mol-toolbar{position:absolute;top:10px;left:10px;background:rgba(12,18,25,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:5;pointer-events:auto}
.mol-toolbar .tool-btn{width:30px;height:30px;border-radius:var(--rxxs);background:var(--panel3);border:1px solid var(--bd);cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.72rem;font-weight:700;transition:var(--t1);padding:0}
.mol-toolbar .tool-btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1)}
.mol-toolbar .tool-btn.active{background:var(--g1);color:#0a0e14;border-color:transparent}
.mol-toolbar .tool-btn.danger:hover{border-color:var(--c2);color:var(--c2)}
.mol-info{position:absolute;bottom:10px;right:10px;background:rgba(12,18,25,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px 12px;font-family:var(--mono);font-size:.62rem;color:var(--tx2);z-index:5;pointer-events:auto;line-height:1.6;max-width:240px}
.mol-info .val{color:var(--c1);font-weight:700}

/* ============ PROPERTIES CARD ============ */
.prop-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:.68rem}
.prop-row .pr-k{color:var(--tx3)}
.prop-row .pr-v{color:var(--c1);font-weight:600;text-align:right}
.rule-pass{color:var(--c5)!important}
.rule-fail{color:var(--c2)!important}
.rule-warn{color:var(--c3)!important}

/* Charts */
.chart-canvas{width:100%;height:auto;display:block;background:var(--bg);border-radius:var(--rxs);border:1px solid var(--bd)}
.chart-wrap{margin-bottom:12px}
.chart-label{font-family:var(--mono);font-size:.6rem;color:var(--tx3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;font-weight:700;display:flex;justify-content:space-between}

@media(max-width:1000px){#leftPanel{width:220px}#rightPanel{width:240px}}
@media(max-width:700px){#leftPanel{width:0;overflow:hidden}#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>

<script>
/* ================================================================
   SMILES PARSER — Simplified but real implementation
   Handles: atoms, aromatic, bonds (single/double/triple/aromatic),
   branches, ring closures, charges, isotopes (ignored)
   Returns: {atoms: [{symbol, aromatic, charge, position}], bonds: [{a, b, order}]}
   ================================================================ */
function parseSMILES(smiles){
  var atoms=[];
  var bonds=[];
  var stack=[];       /* Branch stack — stores current atom index */
  var ringMap={};     /* Digit → {atom, bondOrder} */
  var currentAtom=-1; /* Index of most recent atom */
  var pendingBond=1;  /* Bond order to apply to next atom */
  var pendingAromatic=false;
  var i=0;

  function addAtom(symbol,aromatic,charge){
    var atom={symbol:symbol,aromatic:aromatic,charge:charge||0};
    atoms.push(atom);
    var idx=atoms.length-1;
    if(currentAtom>=0){
      var order=pendingBond;
      if(pendingAromatic||(atoms[currentAtom].aromatic&&aromatic))order=1.5;
      bonds.push({a:currentAtom,b:idx,order:order});
    }
    currentAtom=idx;
    pendingBond=1;
    pendingAromatic=false;
    return idx;
  }

  while(i<smiles.length){
    var c=smiles[i];

    /* Bond symbols */
    if(c==='='){pendingBond=2;i++;continue;}
    if(c==='#'){pendingBond=3;i++;continue;}
    if(c==='-'){pendingBond=1;i++;continue;}
    if(c==='/'){pendingBond=1;i++;continue;} /* cis/trans, treat as single */
    if(c==='\\'){pendingBond=1;i++;continue;}

    /* Branching */
    if(c==='('){
      stack.push(currentAtom);
      i++;
      continue;
    }
    if(c===')'){
      currentAtom=stack.pop();
      i++;
      continue;
    }

    /* Ring closure */
    if(/\d/.test(c)){
      var num=c;
      i++;
      if(ringMap[num]!==undefined){
        /* Close the ring */
        var other=ringMap[num].atom;
        var order=ringMap[num].bondOrder;
        if(pendingBond!==1&&order===1)order=pendingBond;
        if(atoms[currentAtom].aromatic&&atoms[other].aromatic)order=1.5;
        bonds.push({a:currentAtom,b:other,order:order});
        delete ringMap[num];
        pendingBond=1;
      } else {
        ringMap[num]={atom:currentAtom,bondOrder:pendingBond};
        pendingBond=1;
      }
      continue;
    }

    /* Bracket atom [X] */
    if(c==='['){
      var start=i+1;
      var end=smiles.indexOf(']',i);
      if(end<0)break;
      var inner=smiles.substr(start,end-start);
      var symbol='';
      var charge=0;
      var aromatic=false;
      /* Parse isotope */
      var j=0;
      while(j<inner.length&&/\d/.test(inner[j]))j++;
      /* Parse element symbol */
      if(inner[j]==='@'){j++;if(inner[j]==='@')j++;} /* stereo */
      if(j<inner.length){
        symbol=inner[j];
        j++;
        if(j<inner.length&&/[a-z]/.test(inner[j])&&inner[j]!=='@'){
          symbol+=inner[j];
          j++;
        }
      }
      aromatic=symbol===symbol.toLowerCase()&&symbol.length===1;
      /* Parse charge */
      var chargePart=inner.substr(j);
      if(chargePart.indexOf('+')>-1){
        var m=chargePart.match(/\+(\d*)/);
        charge=m&&m[1]?parseInt(m[1]):1;
      } else if(chargePart.indexOf('-')>-1){
        var m2=chargePart.match(/-(\d*)/);
        charge=-(m2&&m2[1]?parseInt(m2[1]):1);
      }
      /* Handle H counts for [nH] etc */
      if(symbol==='n'&&inner.indexOf('H')>-1)symbol='n';
      addAtom(symbol,aromatic,charge);
      i=end+1;
      continue;
    }

    /* Organic subset atoms — 2-letter first */
    var two=smiles.substr(i,2);
    var found=false;
    ['Cl','Br','Si','Se','Na','Li','Mg','Ca','Al'].forEach(function(sym){
      if(two===sym){addAtom(sym,false,0);i+=2;found=true;}
    });
    if(found)continue;

    /* Single-letter atoms */
    var single=smiles[i];
    if(/[A-Z]/.test(single)){
      addAtom(single,false,0);
      i++;
      continue;
    }
    if(/[a-z]/.test(single)){
      /* Aromatic lowercase: c, n, o, s, p, b */
      addAtom(single,true,0);
      i++;
      continue;
    }

    /* Wildcard / unknown */
    i++;
  }
  return {atoms:atoms,bonds:bonds};
}

/* ================================================================
   MOLECULAR PROPERTIES
   ================================================================ */
function computeMolecularFormula(parsed){
  var counts={};
  parsed.atoms.forEach(function(a){
    var sym=a.symbol;
    /* Capitalize for standard notation */
    if(sym.length===1)sym=sym.toUpperCase();
    else sym=sym[0].toUpperCase()+sym[1].toLowerCase();
    counts[sym]=(counts[sym]||0)+1;
  });
  /* Implicit hydrogens — simplified valence model */
  var implicitH=countImplicitHydrogens(parsed);
  if(implicitH>0)counts['H']=(counts['H']||0)+implicitH;
  return counts;
}

/* Implicit hydrogen counting */
function countImplicitHydrogens(parsed){
  /* Standard valences */
  var valence={C:4,N:3,O:2,S:2,P:3,F:1,Cl:1,Br:1,I:1,Si:4,Se:2,B:3,Na:1,Li:1,Mg:2,Ca:2,K:1,Al:3};
  var bondSum=[];
  parsed.atoms.forEach(function(){bondSum.push(0);});
  parsed.bonds.forEach(function(b){
    var ord=b.order;
    if(ord===1.5)ord=1.5; /* Aromatic — 1.5 bond orders */
    bondSum[b.a]+=ord;
    bondSum[b.b]+=ord;
  });
  var totalH=0;
  parsed.atoms.forEach(function(a,i){
    var sym=a.symbol;
    /* Normalize */
    if(sym.length>1)sym=sym[0].toUpperCase()+sym.slice(1).toLowerCase();
    else sym=sym.toUpperCase();
    /* Aromatic lowercase — treat as their uppercase counterparts */
    var v=valence[sym];
    if(v===undefined)return;
    var used=bondSum[i];
    /* Aromatic rings: bond order 1.5 means 3 bonds in ring = 4.5, which is > 4 for carbon.
       Standard practice: aromatic ring bonds contribute ~1.5 each, so 3 aromatic bonds = 4.5.
       For valence purposes we round to the nearest available valence. */
    var h=Math.max(0,Math.round(v-used));
    totalH+=h;
  });
  return totalH;
}

/* Hill notation: C first, H second, then alphabetical */
function hillNotation(counts){
  var keys=Object.keys(counts).filter(function(k){return counts[k]>0;});
  var ordered=[];
  if(counts['C']){ordered.push('C');delete keys[keys.indexOf('C')];}
  if(counts['H']){ordered.push('H');if(keys.indexOf('H')>-1)keys.splice(keys.indexOf('H'),1);}
  keys.sort();
  ordered=ordered.concat(keys);
  var s='';
  ordered.forEach(function(k){
    s+=k;
    if(counts[k]>1)s+=counts[k];
  });
  return s;
}

/* Molecular weight */
function computeMW(counts){
  var mw=0;
  Object.keys(counts).forEach(function(sym){
    var e=ATOM[sym];
    if(e)mw+=e.mass*counts[sym];
  });
  return mw;
}

/* ================================================================
   LIPINSKI RULE OF FIVE (RO5)
   Simplified predictors
   ================================================================ */
function estimateLogP(parsed,counts){
  /* Simple logP prediction: fragment-based contribution */
  /* Values from Wildman-Crippen or simple atomic contributions */
  var frag={
    C:1.46,N:-1.23,O:-1.5,S:0.23,F:0.14,Cl:0.6,Br:0.88,I:1.12,P:0.54
  };
  var logp=0;
  Object.keys(counts).forEach(function(sym){
    if(frag[sym]!==undefined)logp+=frag[sym]*counts[sym];
  });
  /* Aromatic rings reduce logP slightly */
  var aromaticRings=countAromaticRings(parsed);
  logp-=0.5*aromaticRings;
  return logp;
}
function countAromaticRings(parsed){
  /* Count aromatic atoms in 6-rings */
  var aromatic=parsed.atoms.filter(function(a){return a.aromatic;});
  return Math.floor(aromatic.length/6);
}
function countHBD(parsed,counts){
  /* H-bond donors: N-H and O-H */
  var donors=0;
  parsed.atoms.forEach(function(a){
    if(a.symbol==='N'||a.symbol==='n'){
      /* Each N with H */
      var bonds=parsed.bonds.filter(function(b){return b.a===parsed.atoms.indexOf(a)||b.b===parsed.atoms.indexOf(a);});
      var heavyNeighbors=bonds.length;
      if(heavyNeighbors<3)donors++;
    }
    if(a.symbol==='O'||a.symbol==='o'){
      var bonds2=parsed.bonds.filter(function(b){return b.a===parsed.atoms.indexOf(a)||b.b===parsed.atoms.indexOf(a);});
      if(bonds2.length<2)donors++;
    }
  });
  return donors;
}
function countHBA(parsed){
  /* H-bond acceptors: N, O, and their aromatic forms */
  var acceptors=0;
  parsed.atoms.forEach(function(a){
    if(['N','n','O','o','S','s'].indexOf(a.symbol)>-1)acceptors++;
  });
  return acceptors;
}
function countRotatableBonds(parsed){
  /* Simplified: single bonds between two non-terminal heavy atoms */
  var count=0;
  parsed.bonds.forEach(function(b){
    if(b.order===1){
      var a1=parsed.atoms[b.a];
      var a2=parsed.atoms[b.b];
      if(a1.symbol!=='H'&&a2.symbol!=='H'&&!a1.aromatic&&!a2.aromatic)count++;
    }
  });
  return Math.max(0,count-2);
}
function computeTPSA(parsed){
  /* Topological Polar Surface Area — simplified fragments */
  var frag={N:12.03,O:17.07,S:38.8,P:38.8};
  var tpsa=0;
  parsed.atoms.forEach(function(a){
    var sym=a.symbol.toUpperCase();
    if(frag[sym])tpsa+=frag[sym];
  });
  /* Adjust for aromatic N/O which contribute less */
  parsed.atoms.forEach(function(a){
    if(a.aromatic&&a.symbol==='n')tpsa-=5;
    if(a.aromatic&&a.symbol==='o')tpsa-=5;
  });
  return Math.max(0,tpsa);
}
function lipinskiCheck(parsed,counts){
  var mw=computeMW(counts);
  var logp=estimateLogP(parsed,counts);
  var hbd=countHBD(parsed,counts);
  var hba=countHBA(parsed);
  var violations=0;
  if(mw>500)violations++;
  if(logp>5)violations++;
  if(hbd>5)violations++;
  if(hba>10)violations++;
  return {
    mw:mw,logp:logp,hbd:hbd,hba:hba,
    violations:violations,
    pass:mw<=500, logpPass:logp<=5,
    hbdPass:hbd<=5, hbaPass:hba<=10,
    druglike:violations<=1
  };
}

/* ================================================================
   REACTION BALANCER
   Uses Gaussian elimination over rational numbers
   ================================================================ */
function parseFormula(formula){
  /* Parse "H2O" or "Ca(OH)2" into element counts */
  var counts={};
  var i=0;
  var stack=[{mult:1}];
  while(i<formula.length){
    var c=formula[i];
    if(c==='('){
      stack.push({mult:1});
      i++;
    } else if(c===')'){
      var top=stack.pop();
      i++;
      /* Multiplier after ) */
      var num='';
      while(i<formula.length&&/\d/.test(formula[i])){num+=formula[i];i++;}
      var m=num?parseInt(num):1;
      var counts2={};
      Object.keys(top).forEach(function(k){
        if(k==='mult')return;
        counts2[k]=(counts2[k]||0)+top[k];
      });
      stack[stack.length-1].mult*=0; /* suppress */
      Object.keys(counts2).forEach(function(k){
        counts[k]=(counts[k]||0)+counts2[k]*m;
      });
    } else if(/[A-Z]/.test(c)){
      var sym=c;
      i++;
      if(i<formula.length&&/[a-z]/.test(formula[i])){sym+=formula[i];i++;}
      var num2='';
      while(i<formula.length&&/\d/.test(formula[i])){num2+=formula[i];i++;}
      var cnt=num2?parseInt(num2):1;
      counts[sym]=(counts[sym]||0)+cnt;
    } else {
      i++;
    }
  }
  return counts;
}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}

function balanceEquation(reactants,products){
  /* Build matrix: rows=elements, cols=reactants (positive) + products (negative) */
  var elements={};
  var rCounts=reactants.map(function(r){return parseFormula(r);});
  var pCounts=products.map(function(p){return parseFormula(p);});
  rCounts.concat(pCounts).forEach(function(c){
    Object.keys(c).forEach(function(e){elements[e]=true;});
  });
  var elemList=Object.keys(elements);
  var nR=reactants.length,nP=products.length;
  var cols=nR+nP;
  var A=[];
  elemList.forEach(function(e){
    var row=[];
    rCounts.forEach(function(c){row.push(c[e]||0);});
    pCounts.forEach(function(c){row.push(-(c[e]||0));});
    A.push(row);
  });
  /* Solve via row reduction over rationals represented as fractions
     Simplified: use floating point + rational reconstruction at the end */
  var M=A.map(function(r){return r.slice();});
  var rows=M.length;
  var lead=0;
  for(var c=0;c<cols&&lead<rows;c++){
    /* Find pivot */
    var piv=lead;
    while(piv<rows&&Math.abs(M[piv][c])<1e-9)piv++;
    if(piv>=rows)continue;
    var t=M[lead];M[lead]=M[piv];M[piv]=t;
    /* Normalize */
    var p=M[lead][c];
    for(var j=0;j<cols;j++)M[lead][j]/=p;
    /* Eliminate */
    for(var i=0;i<rows;i++){
      if(i!==lead&&Math.abs(M[i][c])>1e-9){
        var factor=M[i][c];
        for(var j2=0;j2<cols;j2++)M[i][j2]-=factor*M[lead][j2];
      }
    }
    lead++;
  }
  /* Null space vector — set free variable to 1 */
  var free=-1;
  for(var c2=0;c2<cols;c2++){
    var isPivot=false;
    for(var r=0;r<rows;r++){
      if(Math.abs(M[r][c2]-1)<1e-9){
        var onlyOne=true;
        for(var r2=0;r2<rows;r2++){
          if(r2!==r&&Math.abs(M[r2][c2])>1e-9){onlyOne=false;break;}
        }
        if(onlyOne){isPivot=true;break;}
      }
    }
    if(!isPivot){free=c2;break;}
  }
  if(free===-1)return null;
  var x=new Array(cols).fill(0);
  x[free]=1;
  for(var r3=0;r3<rows;r3++){
    var pivotCol=-1;
    for(var c3=0;c3<cols;c3++){
      if(Math.abs(M[r3][c3])>1e-9){pivotCol=c3;break;}
    }
    if(pivotCol>=0){
      var sum=0;
      for(var c4=pivotCol+1;c4<cols;c4++)sum+=M[r3][c4]*x[c4];
      x[pivotCol]=-sum;
    }
  }
  /* Normalize to integers */
  /* Multiply by common denominator */
  var scale=1;
  x.forEach(function(v){
    if(Math.abs(v)<1e-9)return;
    /* Rational approximation */
    for(var den=1;den<=100;den++){
      if(Math.abs(v*den-Math.round(v*den))<1e-6){
        scale=Math.max(scale,den);
        break;
      }
    }
  });
  x=x.map(function(v){return Math.round(v*scale);});
  /* Reduce by GCD */
  var g=x.reduce(function(a,b){return gcd(a,b);},0);
  if(g>1)x=x.map(function(v){return v/g;});
  /* Make all positive */
  if(x.some(function(v){return v<0;}))x=x.map(function(v){return -v;});
  return {
    reactants:x.slice(0,nR),
    products:x.slice(nR),
    balanced:true
  };
}

function calcWeakAcidPH(conc,pKa){
  /* Solve pH for weak acid: [H+]² + Ka[H+] - Ka*C = 0 */
  var Ka=Math.pow(10,-pKa);
  var C=conc;
  var a=1,b=Ka,c=-Ka*C;
  var H=(-b+Math.sqrt(b*b-4*a*c))/(2*a);
  return -Math.log10(H);
}

function titrationCurve(pKa,concAcid,concBase,isBase){
  /* Generate titration curve points */
  var points=[];
  /* For acid: pH vs volume of strong base added */
  /* At volume=0: weak acid solution */
  /* At equivalence: salt of weak acid */
  /* Simplification: use Henderson-Hasselbalch */
  var Veq=1.0; /* 1 L of strong base to neutralize */
  for(var v=0;v<=2*Veq;v+=0.02){
    var pH;
    if(isBase){
      /* Weak base titrated with strong acid */
      var pOH;
      if(v<Veq){
        /* Buffer region */
        var pOH0=14-pKa;
        var frac=v/Veq;
        pOH=pOH0+Math.log10((1-frac)/frac);
        pH=14-pOH;
      } else if(Math.abs(v-Veq)<0.05){
        pH=7-(14-pKa)/2;
        pH=14-(14-pKa)/2;
        /* equivalence of weak base: pH ~ 5.28 (if pKb=4.75) */
        var pOH_eq=-Math.log10(Math.sqrt(Math.pow(10,(pKa-14))*concAcid));
        pH=14-pOH_eq;
      } else {
        var excess=(v-Veq)*concBase;
        pH=14+Math.log10(Math.max(excess,1e-7));
        pH=14-(-Math.log10(Math.max(excess,1e-7)));
      }
    } else {
      /* Weak acid titrated with strong base */
      if(v<Veq){
        var pH0=pKa+Math.log10(v/(Veq-v+1e-9));
        pH=pKa+Math.log10(Math.max(v/(Veq-v),1e-6));
      } else if(Math.abs(v-Veq)<0.05){
        /* Equivalence: salt of weak acid */
        var Kb=Math.pow(10,-(14-pKa));
        var OH=Math.sqrt(Kb*concAcid);
        pH=14+Math.log10(OH);
      } else {
        var excessOH=(v-Veq)*concBase;
        var OH2=Math.max(excessOH,1e-7);
        pH=14+Math.log10(OH2);
      }
    }
    if(pH===undefined||isNaN(pH))pH=7;
    points.push({v:v,pH:clamp(pH,0,14)});
  }
  return points;
}

function kineticsFirstOrder(A0,k,tMax,dt){
  var points=[];
  var A=A0;
  for(var t=0;t<=tMax;t+=dt){
    points.push({t:t,A:A});
    A=A*Math.exp(-k*dt);
  }
  return points;
}
function kineticsSecondOrder(A0,k,tMax,dt){
  var points=[];
  var A=A0;
  for(var t=0;t<=tMax;t+=dt){
    points.push({t:t,A:A});
    A=A/(1+k*A*dt);
  }
  return points;
}
function halfLifeFirstOrder(k){return Math.log(2)/k}
function halfLifeSecondOrder(A0,k){return 1/(k*A0)}

function renderPeriodicTable(c){
  var html='<div style="overflow:auto"><div class="periodic-grid" id="periodicGrid">';
  /* 7 periods, 18 groups + lanthanide/actinide rows */
  var grid={};
  ELEMENTS.forEach(function(e,i){
    var sym=e[0];
    var group=e[4];
    var period=e[5];
    /* Handle lanthanides and actinides */
    if(sym==='La'||(e[3]==='lanthanide'&&e[4]<=17&&e[4]>=3)){
      /* Place in row 9 */
      var lanthIndex=i-(ELEMENTS.findIndex(function(x){return x[0]==='La'}));
      if(sym==='La')lanthIndex=0;
    }
    var key=period+'_'+group;
    grid[key]=e;
  });
  /* Draw main 7 periods */
  for(var row=1;row<=7;row++){
    for(var col=1;col<=18;col++){
      var key=row+'_'+col;
      var e=grid[key];
      if(e&&!(row===6&&col===3&&['La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu'].indexOf(e[0])>-1)
         &&!(row===7&&col===3&&['Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr'].indexOf(e[0])>-1)){
        html+=renderElementCell(e);
      } else {
        /* Placeholder or lanthanide/actinide marker */
        if(row===6&&col===3){
          html+='<div class="el-cell cat-lanthanide small" onclick="showLanthanideNote()" style="cursor:pointer"><span class="el-num">57-71</span><span class="el-sym">La-Lu</span></div>';
        } else if(row===7&&col===3){
          html+='<div class="el-cell cat-actinide small" onclick="showActinideNote()"><span class="el-num">89-103</span><span class="el-sym">Ac-Lr</span></div>';
        } else {
          html+='<div class="el-placeholder"></div>';
        }
      }
    }
  }
  /* Lanthanides row */
  html+='<div style="grid-column:1/-1;height:8px"></div>';
  ELEMENTS.filter(function(e){return ['La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu'].indexOf(e[0])>-1;}).forEach(function(e){
    html+=renderElementCell(e);
  });
  /* Actinides row */
  for(var i=0;i<3;i++)html+='<div class="el-placeholder"></div>';
  ELEMENTS.filter(function(e){return ['Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr'].indexOf(e[0])>-1;}).forEach(function(e){
    html+=renderElementCell(e);
  });
  html+='</div></div>';
  c.innerHTML=html;
}
function renderElementCell(e){
  var html='<div class="el-cell cat-'+e[3]+'" onclick="selectElement(\''+e[0]+'\')" title="'+esc(e[1])+'">';
  var z=ELEMENTS.findIndex(function(x){return x[0]===e[0]})+1;
  html+='<span class="el-num">'+z+'</span>';
  html+='<span class="el-sym">'+e[0]+'</span>';
  html+='<span class="el-name">'+e[1]+'</span>';
  html+='<span class="el-mass">'+e[2]+'</span>';
  html+='</div>';
  return html;
}

  $$('.el-cell').forEach(function(el2){

    '</div>'+
    '<div class="mol-info" id="molInfo"></div>';
  setTimeout(initMolCanvas,20);
}
var MOLCANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initMolCanvas(){
  MOLCANV.canvas=$('molCanvas');
  if(!MOLCANV.canvas)return;
  MOLCANV.ctx=MOLCANV.canvas.getContext('2d');
  resizeMolCanvas();
  window.addEventListener('resize',resizeMolCanvas);
  MOLCANV.canvas.addEventListener('mousedown',onMolDown);
  MOLCANV.canvas.addEventListener('mousemove',onMolMove);
  MOLCANV.canvas.addEventListener('mouseup',onMolUp);
  MOLCANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault();deleteSelectedAtom();});
  MOLCANV.canvas.addEventListener('touchstart',onMolTouchStart,{passive:false});
  MOLCANV.canvas.addEventListener('touchmove',onMolTouchMove,{passive:false});
  MOLCANV.canvas.addEventListener('touchend',onMolTouchEnd,{passive:false});
  drawMolecule();
  updateMolInfo();
}
function resizeMolCanvas(){
  if(!MOLCANV.canvas)return;
  var wrap=MOLCANV.canvas.parentElement;
  MOLCANV.dpr=window.devicePixelRatio||1;
  MOLCANV.W=wrap.clientWidth;
  MOLCANV.H=wrap.clientHeight;
  MOLCANV.canvas.width=MOLCANV.W*MOLCANV.dpr;
  MOLCANV.canvas.height=MOLCANV.H*MOLCANV.dpr;
  MOLCANV.canvas.style.width=MOLCANV.W+'px';
  MOLCANV.canvas.style.height=MOLCANV.H+'px';
  MOLCANV.ctx.setTransform(MOLCANV.dpr,0,0,MOLCANV.dpr,0,0);
  drawMolecule();
}
function drawMolecule(){
  if(!MOLCANV.ctx)return;
  var ctx=MOLCANV.ctx;
  ctx.fillStyle='#0a0e14';
  ctx.fillRect(0,0,MOLCANV.W,MOLCANV.H);
  /* Grid */
  ctx.strokeStyle='rgba(64,200,224,.06)';
  ctx.lineWidth=1;
  for(var x=0;x<MOLCANV.W;x+=30){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MOLCANV.H);ctx.stroke();
  }
  for(var y=0;y<MOLCANV.H;y+=30){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MOLCANV.W,y);ctx.stroke();
  }
  /* Bonds */
  MOLCANV.canvas.mol=STATE.molecule;
  STATE.molecule.bonds.forEach(function(b){
    var a1=STATE.molecule.atoms[b.a];
    var a2=STATE.molecule.atoms[b.b];
    if(!a1||!a2)return;
    drawBond(ctx,a1,a2,b.order);
  });
  /* Atoms */
  STATE.molecule.atoms.forEach(function(a,i){
    drawAtom(ctx,a,i===STATE.molecule.selectedAtom);
  });
}
function drawBond(ctx,a1,a2,order){
  var dx=a2.x-a1.x,dy=a2.y-a1.y;
  var len=Math.hypot(dx,dy);
  if(len<1)return;
  var ux=dx/len,uy=dy/len;
  /* Offset for multiple bonds */
  var perpX=-uy,perpY=ux;
  var offsets=[0];
  if(order===1.5){
    /* Aromatic — draw dashed inner circle inside ring not needed, use dashed line */
    ctx.strokeStyle='#40c8e0';
    ctx.lineWidth=2;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  if(order===2)offsets=[-4,4];
  if(order===3)offsets=[-6,0,6];
  ctx.strokeStyle='#a0b0c0';
  ctx.lineWidth=2;
  offsets.forEach(function(off){
    ctx.beginPath();
    ctx.moveTo(a1.x+perpX*off,a1.y+perpY*off);
    ctx.lineTo(a2.x+perpX*off,a2.y+perpY*off);
    ctx.stroke();
  });
}
function drawAtom(ctx,a,selected){
  var sym=a.symbol;
  /* Color by element category */
  var color='#80a0b0';
  var e=ATOM[sym]||ATOM[sym[0].toUpperCase()];
  if(e){
    var catColors={
      alkali:'#ff6b6b',alkaline:'#ffb84d',transition:'#6ec6ff',
      post:'#a0d8a0',metalloid:'#c0a0ff',nonmetal:'#7be87b',
      halogen:'#ffe066',noble:'#e8a0ff',lanthanide:'#ff90c8',
      actinide:'#ff80a0',unknown:'#909090'
    };
    color=catColors[e.category]||'#80a0b0';
  }
  var radius=14;
  /* Glow */
  var grad=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,radius*1.5);
  grad.addColorStop(0,color);
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(a.x,a.y,radius*1.5,0,Math.PI*2);ctx.fill();
  /* Circle */
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(a.x,a.y,radius,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.5)';
  ctx.lineWidth=1.5;
  ctx.stroke();
  /* Selected outline */
  if(selected){
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(a.x,a.y,radius+3,0,Math.PI*2);ctx.stroke();
  }
  /* Symbol */
  ctx.fillStyle='#0a0e14';
  ctx.font='bold 12px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(sym,a.x,a.y+1);
  ctx.textBaseline='alphabetic';
}
function updateMolInfo(){
  var m=STATE.molecule;
  var info=$('molInfo');
  if(!info)return;
  if(!m.atoms.length){
    info.innerHTML='<div style="color:var(--tx3)">Empty — click to place atoms</div>';
    $('sbAtoms').textContent='0';
    $('sbBonds').textContent='0';
    $('tbFormula').textContent='—';
    $('tbMW').textContent='—';
    return;
  }
  /* Count elements */
  var counts={};
  m.atoms.forEach(function(a){
    var sym=a.symbol;
    if(sym.length===1)sym=sym.toUpperCase();
    else sym=sym[0].toUpperCase()+sym[1].toLowerCase();
    counts[sym]=(counts[sym]||0)+1;
  });
  /* Implicit H */
  var bondSum=m.atoms.map(function(){return 0;});
  m.bonds.forEach(function(b){
    bondSum[b.a]+=b.order;
    bondSum[b.b]+=b.order;
  });
  var valence={C:4,N:3,O:2,S:2,P:3,H:1,F:1,Cl:1,Br:1,I:1,Si:4,Se:2,B:3};
  var totalH=0;
  m.atoms.forEach(function(a,i){
    var sym=a.symbol;
    if(sym.length>1)sym=sym[0].toUpperCase()+sym.slice(1).toLowerCase();
    else sym=sym.toUpperCase();
    var v=valence[sym];
    if(v===undefined)return;
    var h=Math.max(0,Math.round(v-bondSum[i]));
    totalH+=h;
  });
  if(totalH>0)counts['H']=(counts['H']||0)+totalH;
  /* Hill notation */
  var ordered=[];
  if(counts['C']){ordered.push('C');delete counts['C'];}
  if(counts['H']){ordered.push('H');delete counts['H'];}
  var rest=Object.keys(counts).sort();
  ordered=ordered.concat(rest);
  var formula='';
  /* Rebuild */
  var full={};
  m.atoms.forEach(function(a){
    var sym=a.symbol;
    if(sym.length===1)sym=sym.toUpperCase();
    else sym=sym[0].toUpperCase()+sym[1].toLowerCase();
    full[sym]=(full[sym]||0)+1;
  });
  if(totalH>0)full['H']=(full['H']||0)+totalH;
  var orderedFull=[];
  if(full['C']){orderedFull.push('C');}
  if(full['H']){orderedFull.push('H');}
  Object.keys(full).sort().forEach(function(k){
    if(k!=='C'&&k!=='H')orderedFull.push(k);
  });
  orderedFull.forEach(function(sym){
    formula+=sym;
    if(full[sym]>1)formula+=full[sym];
  });
  /* MW */
  var mw=0;
  Object.keys(full).forEach(function(sym){
    var e=ATOM[sym];
    if(e)mw+=e.mass*full[sym];
  });
  info.innerHTML=
    '<div><b style="color:var(--c1)">'+esc(formula)+'</b></div>'+
    '<div style="margin-top:4px">MW: <span class="val">'+fmt(mw,2)+' g/mol</span></div>'+
    '<div>Atoms: <span class="val">'+m.atoms.length+'</span></div>'+
    '<div>Bonds: <span class="val">'+m.bonds.length+'</span></div>';
  $('sbAtoms').textContent=m.atoms.length;
  $('sbBonds').textContent=m.bonds.length;
  $('tbFormula').textContent=formula;
  $('tbMW').textContent=fmt(mw,1);
  STATE.computedFormula=formula;
  STATE.computedMW=mw;
  /* Update right panel */
  if(STATE.currentTab==='editor')renderRightPanel();
}
function canvasPos(canvas,e){
  var r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function findAtomAt(x,y){
  var m=STATE.molecule;
  for(var i=m.atoms.length-1;i>=0;i--){
    var a=m.atoms[i];
    if(Math.hypot(a.x-x,a.y-y)<14)return i;
  }
  return -1;
}
function onMolDown(e){
  var p=canvasPos(MOLCANV.canvas,e);
  var idx=findAtomAt(p.x,p.y);
  var m=STATE.molecule;
  if(e.button===2){return;}
  if(idx>=0){
    /* Click on atom */
    if(m.selectedAtom>=0&&m.selectedAtom!==idx){
      /* Create bond */
      var exists=m.bonds.some(function(b){
        return (b.a===m.selectedAtom&&b.b===idx)||(b.b===m.selectedAtom&&b.a===idx);
      });
      if(!exists){
        m.bonds.push({a:m.selectedAtom,b:idx,order:m.currentBond});
      }
      m.selectedAtom=-1;
    } else {
      m.selectedAtom=idx;
    }
    drawMolecule();
    updateMolInfo();
    return;
  }
  /* Click on empty space — place atom */
  if(m.selectedAtom>=0){
    /* Place new atom connected to selected */
    var a={symbol:m.currentAtom,aromatic:false,charge:0,x:p.x,y:p.y};
    m.atoms.push(a);
    m.bonds.push({a:m.selectedAtom,b:m.atoms.length-1,order:m.currentBond});
    m.selectedAtom=-1;
  } else {
    /* Just place an unconnected atom */
    var a2={symbol:m.currentAtom,aromatic:false,charge:0,x:p.x,y:p.y};
    m.atoms.push(a2);
    m.selectedAtom=m.atoms.length-1;
  }
  drawMolecule();
  updateMolInfo();
}
var _molDragging=null;
function onMolMove(e){
  if(!_molDragging)return;
  var p=canvasPos(MOLCANV.canvas,e);
  var a=STATE.molecule.atoms[_molDragging];
  if(a){a.x=p.x;a.y=p.y;drawMolecule();}
}
function onMolUp(){
  _molDragging=null;
}
function onMolTouchStart(e){
  if(e.touches.length===1){
    var t=e.touches[0];
    onMolDown({clientX:t.clientX,clientY:t.clientY,button:0});
  }
  e.preventDefault();
}
function onMolTouchMove(e){
  e.preventDefault();
}
function onMolTouchEnd(e){e.preventDefault();}

function addAtomAtCenter(){
  var m=STATE.molecule;
  var a={symbol:m.currentAtom,aromatic:false,charge:0,x:MOLCANV.W/2+rndF(-30,30),y:MOLCANV.H/2+rndF(-30,30)};
  m.atoms.push(a);
  m.selectedAtom=m.atoms.length-1;
  drawMolecule();
  updateMolInfo();
}
function cycleBondOrder(){
  var m=STATE.molecule;
  m.currentBond=m.currentBond===1?2:m.currentBond===2?3:1;
  toast('Bond order: '+m.currentBond,'info',900);
  var btn=document.querySelectorAll('.mol-toolbar .tool-btn')[1];
  if(btn)btn.textContent=m.currentBond;
}
function deleteSelectedAtom(){
  var m=STATE.molecule;
  if(m.selectedAtom<0){toast('Select an atom first','warn');return}
  var idx=m.selectedAtom;
  m.atoms.splice(idx,1);
  /* Remove bonds and reindex */
  m.bonds=m.bonds.filter(function(b){return b.a!==idx&&b.b!==idx;});
  m.bonds.forEach(function(b){
    if(b.a>idx)b.a--;
    if(b.b>idx)b.b--;
  });
  m.selectedAtom=-1;
  drawMolecule();
  updateMolInfo();
}
function clearMolecule(){
  STATE.molecule={atoms:[],bonds:[],selectedAtom:-1,currentAtom:'C',currentBond:1,nextId:0};
  drawMolecule();
  updateMolInfo();
  toast('Cleared','info');
}
function loadSampleMolecule(name){
  if(name==='benzene'){
    var m={atoms:[],bonds:[],selectedAtom:-1,currentAtom:'C',currentBond:1,nextId:0};
    var cx=MOLCANV.W/2||400,cy=MOLCANV.H/2||300;
    for(var i=0;i<6;i++){
      var angle=i*Math.PI/3-Math.PI/2;
      m.atoms.push({symbol:'C',aromatic:true,charge:0,x:cx+Math.cos(angle)*80,y:cy+Math.sin(angle)*80});
    }
    for(var j=0;j<6;j++)m.bonds.push({a:j,b:(j+1)%6,order:1.5});
    STATE.molecule=m;
    drawMolecule();
    updateMolInfo();
    toast('Loaded benzene','success');
  }
  else if(name==='aspirin'){
    /* Simple sketch of aspirin structure */
    var m2={atoms:[],bonds:[],selectedAtom:-1,currentAtom:'C',currentBond:1,nextId:0};
    var cx2=MOLCANV.W/2||400,cy2=MOLCANV.H/2||300;
    /* Benzene ring */
    for(var k=0;k<6;k++){
      var angle2=k*Math.PI/3-Math.PI/2;
      m2.atoms.push({symbol:'C',aromatic:true,charge:0,x:cx2+Math.cos(angle2)*70,y:cy2+Math.sin(angle2)*70});
    }
    for(var l=0;l<6;l++)m2.bonds.push({a:l,b:(l+1)%6,order:1.5});
    /* Carboxyl group */
    var coohC=m2.atoms.length;
    m2.atoms.push({symbol:'C',aromatic:false,charge:0,x:cx2-120,y:cy2});
    m2.bonds.push({a:0,b:coohC,order:1});
    var o1=m2.atoms.length;
    m2.atoms.push({symbol:'O',aromatic:false,charge:0,x:cx2-160,y:cy2-30});
    m2.bonds.push({a:coohC,b:o1,order:2});
    var oh=m2.atoms.length;
    m2.atoms.push({symbol:'O',aromatic:false,charge:0,x:cx2-160,y:cy2+30});
    m2.bonds.push({a:coohC,b:oh,order:1});
    /* Acetyl group on ring */
    var acC=m2.atoms.length;
    m2.atoms.push({symbol:'C',aromatic:false,charge:0,x:cx2+120,y:cy2-30});
    m2.bonds.push({a:3,b:acC,order:1});
    var acO=m2.atoms.length;
    m2.atoms.push({symbol:'O',aromatic:false,charge:0,x:cx2+160,y:cy2-60});
    m2.bonds.push({a:acC,b:acO,order:2});
    var acMe=m2.atoms.length;
    m2.atoms.push({symbol:'C',aromatic:false,charge:0,x:cx2+120,y:cy2+30});
    m2.bonds.push({a:acC,b:acMe,order:1});
    STATE.molecule=m2;
    drawMolecule();
    updateMolInfo();
    toast('Loaded aspirin','success');
  }
  else if(name==='caffeine'){
    /* Simplified caffeine ring structure */
    var m3={atoms:[],bonds:[],selectedAtom:-1,currentAtom:'C',currentBond:1,nextId:0};
    var cx3=MOLCANV.W/2||400,cy3=MOLCANV.H/2||300;
    /* 6-membered ring + 5-membered ring approximation */
    var positions=[
      [0,-80],[70,-40],[70,40],[0,80],[-70,40],[-70,-40]
    ];
    positions.forEach(function(p){
      m3.atoms.push({symbol:'N',aromatic:false,charge:0,x:cx3+p[0],y:cy3+p[1]});
    });
    for(var m=0;m<6;m++)m3.bonds.push({a:m,b:(m+1)%6,order:1.5});
    /* Add methyls */
    for(var n=0;n<3;n++){
      var mi=m3.atoms.length;
      m3.atoms.push({symbol:'C',aromatic:false,charge:0,x:cx3+(n-1)*60,y:cy3-140});
      m3.bonds.push({a:n*2,b:mi,order:1});
    }
    STATE.molecule=m3;
    drawMolecule();
    updateMolInfo();
    toast('Loaded caffeine (simplified)','success');
  }
}
</script>
<script>
/* ================================================================
   SMILES MODULE
   ================================================================ */
function renderSMILESModule(c){
  var html='<div style="padding:14px">';
  html+='<div class="chart-label"><span>SMILES Structure Preview</span></div>';
  html+='<canvas class="chart-canvas" id="smilesCanvas" style="height:300px"></canvas>';
  html+='<div id="smilesAnalysis" style="margin-top:14px"></div>';
  html+='</div>';
  c.innerHTML=html;
  setTimeout(function(){
    parseAndAnalyzeSMILES();
  },20);
}
function loadSMILESExample(smiles,name){
  STATE.currentSMILES=smiles;
  var inp=$('smilesInput');
  if(inp)inp.value=smiles;
  parseAndAnalyzeSMILES();
  toast('Loaded '+name,'success',1200);
}
function parseAndAnalyzeSMILES(){
  var inp=$('smilesInput');
  var smiles=inp?inp.value:STATE.currentSMILES;
  STATE.currentSMILES=smiles;
  try{
    var parsed=parseSMILES(smiles);
    STATE.parsedMolecule=parsed;
    var counts=computeMolecularFormula(parsed);
    var formula=hillNotation(counts);
    var mw=computeMW(counts);
    STATE.computedFormula=formula;
    STATE.computedMW=mw;
    /* Draw structure */
    drawSMILESStructure(parsed);
    /* Analysis */
    var lip=lipinskiCheck(parsed,counts);
    var hbd=lip.hbd,hba=lip.hba,logp=lip.logp;
    var rotBonds=countRotatableBonds(parsed);
    var tpsa=computeTPSA(parsed);
    var html='';
    html+='<div class="stats-grid">';
    html+='<div class="stat"><div class="sv">'+formula+'</div><div class="sl">Formula</div></div>';
    html+='<div class="stat"><div class="sv">'+fmt(mw,2)+'</div><div class="sl">MW (g/mol)</div></div>';
    html+='<div class="stat"><div class="sv">'+parsed.atoms.length+'</div><div class="sl">Heavy atoms</div></div>';
    html+='<div class="stat"><div class="sv">'+parsed.bonds.length+'</div><div class="sl">Bonds</div></div>';
    html+='</div>';
    html+='<div class="chart-label" style="margin-top:14px"><span>Physicochemical Properties</span></div>';
    html+='<table class="data-table"><thead><tr><th>Property</th><th>Value</th><th>Range</th><th>Status</th></tr></thead><tbody>';
    html+='<tr><td>Molecular Weight</td><td class="c1">'+fmt(mw,2)+'</td><td class="text-dim">≤ 500</td><td class="'+(mw<=500?'c5':'c2')+'">'+(mw<=500?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='<tr><td>LogP (est.)</td><td class="c1">'+fmt(logp,2)+'</td><td class="text-dim">≤ 5</td><td class="'+(logp<=5?'c5':'c2')+'">'+(logp<=5?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='<tr><td>H-Bond Donors</td><td class="c1">'+hbd+'</td><td class="text-dim">≤ 5</td><td class="'+(hbd<=5?'c5':'c2')+'">'+(hbd<=5?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='<tr><td>H-Bond Acceptors</td><td class="c1">'+hba+'</td><td class="text-dim">≤ 10</td><td class="'+(hba<=10?'c5':'c2')+'">'+(hba<=10?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='<tr><td>Rotatable Bonds</td><td class="c1">'+rotBonds+'</td><td class="text-dim">≤ 10</td><td class="'+(rotBonds<=10?'c5':'c2')+'">'+(rotBonds<=10?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='<tr><td>TPSA</td><td class="c1">'+fmt(tpsa,1)+' Å²</td><td class="text-dim">≤ 140</td><td class="'+(tpsa<=140?'c5':'c2')+'">'+(tpsa<=140?'✓ PASS':'✕ FAIL')+'</td></tr>';
    html+='</tbody></table>';
    html+='<div style="margin-top:14px;padding:14px;background:var(--panel3);border-radius:var(--rxs);border-left:3px solid '+(lip.druglike?'var(--c5)':'var(--c2)')+'">';
    html+='<div style="font-weight:700;font-size:.8rem">'+(lip.druglike?'✓ DRUG-LIKE':'✕ NOT DRUG-LIKE')+'</div>';
    html+='<div class="text-xs text-dim" style="margin-top:6px;line-height:1.6">'+
      'Lipinski Rule of 5: '+(4-lip.violations)+'/4 pass. '+
      (lip.druglike?'This molecule is predicted to have good oral bioavailability.':'This molecule violates '+lip.violations+' Rule(s) of 5 and may have poor oral bioavailability.')+'</div>';
    html+='</div>';
    $('smilesAnalysis').innerHTML=html;
    /* Update topbar */
    $('tbFormula').textContent=formula;
    $('tbMW').textContent=fmt(mw,1);
    /* Update sb */
    $('sbAtoms').textContent=parsed.atoms.length;
    $('sbBonds').textContent=parsed.bonds.length;
    /* Update right panel */
    renderRightPanel();
  }catch(e){
    toast('Parse error: '+e.message,'error',4000);
  }
}
function drawSMILESStructure(parsed){
  var cv=$('smilesCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth;
  var H=300;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0e14';
  ctx.fillRect(0,0,W,H);
  if(!parsed||!parsed.atoms.length)return;
  /* Simple force-directed layout */
  var atoms=parsed.atoms.map(function(a,i){
    var angle=(i/parsed.atoms.length)*Math.PI*2;
    var r=Math.min(W,H)*0.35;
    return {x:W/2+Math.cos(angle)*r+rndF(-10,10),y:H/2+Math.sin(angle)*r+rndF(-10,10),symbol:a.symbol,aromatic:a.aromatic};
  });
  /* Force iterations */
  for(var iter=0;iter<150;iter++){
    /* Repulsion */
    for(var i=0;i<atoms.length;i++){
      for(var j=i+1;j<atoms.length;j++){
        var dx=atoms[j].x-atoms[i].x,dy=atoms[j].y-atoms[i].y;
        var d2=dx*dx+dy*dy;
        if(d2<1)d2=1;
        var f=4000/d2;
        var d=Math.sqrt(d2);
        var fx=f*dx/d,fy=f*dy/d;
        atoms[i].x-=fx;atoms[i].y-=fy;
        atoms[j].x+=fx;atoms[j].y+=fy;
      }
    }
    /* Bond attraction */
    parsed.bonds.forEach(function(b){
      var a1=atoms[b.a],a2=atoms[b.b];
      if(!a1||!a2)return;
      var dx=a2.x-a1.x,dy=a2.y-a1.y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<1)return;
      var target=70;
      var f=(d-target)*0.08;
      var fx=f*dx/d,fy=f*dy/d;
      a1.x+=fx;a1.y+=fy;
      a2.x-=fx;a2.y-=fy;
    });
    /* Center pulling */
    atoms.forEach(function(a){
      a.x+=(W/2-a.x)*0.01;
      a.y+=(H/2-a.y)*0.01;
    });
  }
  /* Clamp inside canvas */
  var pad=30;
  atoms.forEach(function(a){
    a.x=clamp(a.x,pad,W-pad);
    a.y=clamp(a.y,pad,H-pad);
  });
  /* Draw bonds */
  ctx.lineWidth=2;
  parsed.bonds.forEach(function(b){
    var a1=atoms[b.a],a2=atoms[b.b];
    if(!a1||!a2)return;
    var dx=a2.x-a1.x,dy=a2.y-a1.y;
    var len=Math.hypot(dx,dy);
    var ux=dx/len,uy=dy/len;
    var px=-uy,py=ux;
    if(b.order===1.5){
      ctx.strokeStyle='#40c8e0';
      ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
      ctx.setLineDash([]);
      return;
    }
    var offsets=[0];
    if(b.order===2)offsets=[-3,3];
    if(b.order===3)offsets=[-5,0,5];
    ctx.strokeStyle='#a0b0c0';
    offsets.forEach(function(o){
      ctx.beginPath();
      ctx.moveTo(a1.x+px*o,a1.y+py*o);
      ctx.lineTo(a2.x+px*o,a2.y+py*o);
      ctx.stroke();
    });
  });
  /* Draw atoms */
  atoms.forEach(function(a){
    var color='#80a0b0';
    var sym=a.symbol.length===1?a.symbol.toUpperCase():a.symbol[0].toUpperCase()+a.symbol[1].toLowerCase();
    var e=ATOM[sym];
    if(e){
      var catColors={alkali:'#ff6b6b',alkaline:'#ffb84d',transition:'#6ec6ff',post:'#a0d8a0',metalloid:'#c0a0ff',nonmetal:'#7be87b',halogen:'#ffe066',noble:'#e8a0ff',lanthanide:'#ff90c8',actinide:'#ff80a0'};
      color=catColors[e.category]||'#80a0b0';
    }
    var radius=16;
    var grad=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,radius*1.6);
    grad.addColorStop(0,color);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(a.x,a.y,radius*1.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(a.x,a.y,radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';
    ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#0a0e14';
    ctx.font='bold 11px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(sym,a.x,a.y+1);
    ctx.textBaseline='alphabetic';
  });
}

function renderLibraryGrid(filter){
  filter=filter||'';
  var grid=$('libGrid');
  if(!grid)return;
  var filtered=MOLECULES.filter(function(m){
    if(!filter)return true;
    return m.name.toLowerCase().indexOf(filter.toLowerCase())>-1||
      m.formula.toLowerCase().indexOf(filter.toLowerCase())>-1;
  });
  var html='<div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">';
  filtered.forEach(function(m){
    var mw=0;
    var counts=parseFormula(m.formula);
    Object.keys(counts).forEach(function(sym){
      var e=ATOM[sym];
      if(e)mw+=e.mass*counts[sym];
    });
    html+='<div style="background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:10px;cursor:pointer;transition:var(--t1)" onclick="loadMoleculeFromLibrary(\''+esc(m.name).replace(/'/g,"\\'")+'\')">'+

      '<div style="font-family:var(--mono);font-size:.68rem;color:var(--c3);margin-top:4px">'+esc(m.formula)+'</div>'+
      '<div style="font-family:var(--mono);font-size:.62rem;color:var(--tx3);margin-top:2px">MW: '+fmt(mw,2)+'</div>'+
      '<div style="font-size:.65rem;color:var(--tx2);margin-top:6px;line-height:1.4">'+esc(m.desc)+'</div>'+

}

function renderBalance(c){
  var html='<div style="padding:14px">';
  html+='<div class="chart-label"><span>Chemical Equation Balancer</span></div>';
  html+='<div style="background:var(--panel3);padding:14px;border-radius:var(--rxs);margin-bottom:14px;font-family:var(--mono);font-size:.75rem" id="balanceEquation">Enter reactants and products →</div>';
  html+='<button class="btn primary" onclick="doBalance()">⚖️ Balance Equation</button>';
  html+='<div id="balanceResult" style="margin-top:14px"></div>';
  html+='<div class="chart-label" style="margin-top:20px"><span>Presets</span></div>';
  html+='<div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">';
  BALANCE_PRESETS.forEach(function(p,i){
    html+='<div style="background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rxs);padding:8px;cursor:pointer;font-size:.68rem;font-family:var(--mono);text-align:center" onclick="loadBalancePreset('+i+');doBalance()">'+esc(p.name)+'</div>';
  });
  html+='</div>';
  html+='</div>';

function doBalance(){
  var rText=$('reactants').value;
  var pText=$('products').value;
  var reactants=rText.split(/[\+\n,]+/).map(function(s){return s.trim();}).filter(Boolean);
  var products=pText.split(/[\+\n,]+/).map(function(s){return s.trim();}).filter(Boolean);
  if(!reactants.length||!products.length){
    toast('Enter reactants and products','warn');
    return;
  }
  try{
    var result=balanceEquation(reactants,products);
    var el2=$('balanceResult');
    if(!result||!result.reactants){
      el2.innerHTML='<div style="color:var(--c2)">Could not balance — check formulas</div>';
      return;
    }
    var eqnHTML='';
    reactants.forEach(function(r,i){
      var coeff=result.reactants[i];
      if(i>0)eqnHTML+=' + ';
      if(coeff!==1)eqnHTML+='<span style="color:var(--c3)">'+coeff+'</span>';
      eqnHTML+' <span style="color:var(--c1)">'+esc(r)+'</span>';
    });
    eqnHTML+=' <span style="color:var(--c3);font-size:1rem">→</span> ';
    products.forEach(function(p,i){
      var coeff=result.products[i];
      if(i>0)eqnHTML+=' + ';
      if(coeff!==1)eqnHTML+='<span style="color:var(--c3)">'+coeff+'</span>';
      eqnHTML+' <span style="color:var(--c2)">'+esc(p)+'</span>';
    });
    var eqn=$('balanceEquation');
    if(eqn)eqn.innerHTML=eqnHTML;
    /* Verify */
    var rCheck=reactants.map(function(r){return parseFormula(r)});
    var pCheck=products.map(function(p){return parseFormula(p)});
    var rTotals={},pTotals={};
    rCheck.forEach(function(c2,i){
      Object.keys(c2).forEach(function(sym){
        rTotals[sym]=(rTotals[sym]||0)+c2[sym]*result.reactants[i];
      });
    });
    pCheck.forEach(function(c3,i){
      Object.keys(c3).forEach(function(sym){
        pTotals[sym]=(pTotals[sym]||0)+c3[sym]*result.products[i];
      });
    });
    var elements=Object.keys(Object.assign({},rTotals,pTotals));
    var html='<div class="chart-label"><span>Balanced Coefficients</span></div>';
    html+='<table class="data-table"><thead><tr><th>Species</th><th>Side</th><th>Coefficient</th></tr></thead><tbody>';
    reactants.forEach(function(r,i){
      html+='<tr><td class="c1">'+esc(r)+'</td><td>Reactant</td><td class="c3">'+result.reactants[i]+'</td></tr>';
    });
    products.forEach(function(p,i){
      html+='<tr><td class="c2">'+esc(p)+'</td><td>Product</td><td class="c3">'+result.products[i]+'</td></tr>';
    });
    html+='</tbody></table>';
    html+='<div class="chart-label" style="margin-top:14px"><span>Element Verification</span></div>';
    html+='<table class="data-table"><thead><tr><th>Element</th><th>Reactant side</th><th>Product side</th><th>Status</th></tr></thead><tbody>';
    elements.forEach(function(sym){
      var r2=rTotals[sym]||0;
      var p2=pTotals[sym]||0;
      var ok=Math.abs(r2-p2)<0.01;
      html+='<tr><td class="c1">'+sym+'</td><td>'+r2+'</td><td>'+p2+'</td><td class="'+(ok?'c5':'c2')+'">'+(ok?'✓':'✕')+'</td></tr>';
    });
    html+='</tbody></table>';
    $('balanceResult').innerHTML=html;
    toast('Equation balanced','success');
  }catch(e){
    toast('Error: '+e.message,'error',3000);
  }
}

function renderPH(c){
  var list=STATE.ph.mode==='acid'?ACIDS:BASES;
  var species=list[STATE.ph.species]||list[0];
  var pKa=species.pKa||species.pKb||7;
  var isStrong=species.strong;
  var pH;
  if(isStrong){
    if(STATE.ph.mode==='acid'){
      pH=-Math.log10(STATE.ph.conc);
    } else {
      pH=14+Math.log10(STATE.ph.conc);
    }
  } else {
    if(STATE.ph.mode==='acid'){
      pH=calcWeakAcidPH(STATE.ph.conc,pKa);
    } else {
      /* Weak base: pOH = calc, then pH = 14 - pOH */
      var pOH=calcWeakAcidPH(STATE.ph.conc,species.pKb||4.75);
      pH=14-pOH;
    }
  }
  var html='<div style="padding:14px">';
  html+='<div class="stats-grid">';
  html+='<div class="stat"><div class="sv">'+fmt(pH,2)+'</div><div class="sl">pH</div></div>';
  html+='<div class="stat"><div class="sv">'+fmt(Math.pow(10,-pH)*1e3,2)+'</div><div class="sl">[H⁺] mM</div></div>';
  html+='<div class="stat"><div class="sv">'+fmt(Math.pow(10,-(14-pH))*1e3,2)+'</div><div class="sl">[OH⁻] mM</div></div>';
  html+='<div class="stat"><div class="sv">'+esc(isStrong?'Strong':'Weak')+'</div><div class="sl">Acid/Base</div></div>';
  html+='</div>';
  html+='<div class="chart-label" style="margin-top:14px"><span>Titration Curve</span><span>'+esc(species.name)+'</span></div>';
  html+='<canvas class="chart-canvas" id="titrationCanvas" style="height:280px"></canvas>';
  html+='<div class="chart-label" style="margin-top:14px"><span>Universal Indicator Colors</span></div>';
  html+='<canvas class="chart-canvas" id="phScaleCanvas" style="height:80px"></canvas>';
  html+='</div>';
  c.innerHTML=html;
  setTimeout(function(){
    drawTitration(pKa,STATE.ph.conc,0.1,STATE.ph.mode==='base');
    drawPHScale(pH);
  },30);
}
function drawTitration(pKa,concAcid,concBase,isBase){
  var cv=$('titrationCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth;
  var H=280;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,W,H);
  var points=titrationCurve(pKa,concAcid,concBase,isBase);
  var padL=50,padR=20,padT=20,padB=40;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  /* Grid */
  ctx.strokeStyle='rgba(64,200,224,.1)';
  ctx.lineWidth=1;
  for(var gi=0;gi<=14;gi+=2){
    var y=padT+(1-gi/14)*plotH;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
    ctx.fillStyle='#687888';
    ctx.font='10px monospace';
    ctx.textAlign='right';
    ctx.fillText(String(gi),padL-4,y+3);
  }
  /* pH 7 line */
  var y7=padT+(1-7/14)*plotH;
  ctx.strokeStyle='rgba(80,224,128,.4)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(padL,y7);ctx.lineTo(padL+plotW,y7);ctx.stroke();
  ctx.setLineDash([]);
  /* Curve */
  var maxV=points[points.length-1].v;
  ctx.strokeStyle='#40c8e0';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  points.forEach(function(p,i){
    var x=padL+(p.v/maxV)*plotW;
    var y=padT+(1-p.pH/14)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Fill under */
  ctx.fillStyle='rgba(64,200,224,.12)';
  ctx.beginPath();
  points.forEach(function(p,i){
    var x=padL+(p.v/maxV)*plotW;
    var y=padT+(1-p.pH/14)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+plotW,padT+plotH);
  ctx.lineTo(padL,padT+plotH);
  ctx.closePath();
  ctx.fill();
  /* Equivalence marker */
  var eqX=padL+0.5*plotW;
  ctx.strokeStyle='#f0c040';
  ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(eqX,padT);ctx.lineTo(eqX,padT+plotH);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f0c040';
  ctx.font='10px monospace';
  ctx.textAlign='center';
  ctx.fillText('Equivalence',eqX,padT-6);
  /* Labels */
  ctx.fillStyle='#687888';
  ctx.font='10px monospace';
  ctx.textAlign='center';
  ctx.fillText('Volume of titrant added',padL+plotW/2,H-6);
  ctx.textAlign='left';
  ctx.save();
  ctx.translate(12,padT+plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';
  ctx.fillText('pH',0,0);
  ctx.restore();
  /* pKa marker */
  var pkaY=padT+(1-pKa/14)*plotH;
  if(pKa>0&&pKa<14){
    ctx.fillStyle='rgba(240,192,64,.7)';
    ctx.font='9px monospace';
    ctx.textAlign='left';
    ctx.fillText('pKa = '+fmt(pKa,2),padL+4,pkaY-3);
  }
}
function drawPHScale(currentPH){
  var cv=$('phScaleCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth;
  var H=80;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* Universal indicator colors */
  var colors=['#e01030','#e02020','#e05020','#e08020','#e0c020','#c0e040','#50d060','#20c0a0','#2080c0','#2050c0','#4020a0','#6020a0','#8020a0','#a020a0'];
  var segW=W/colors.length;
  for(var i=0;i<colors.length;i++){
    ctx.fillStyle=colors[i];
    ctx.fillRect(i*segW,0,segW+1,H-20);
    ctx.fillStyle='#000';
    ctx.font='10px monospace';
    ctx.textAlign='center';
    ctx.fillText(String(i),i*segW+segW/2,H-6);
  }
  /* Current pH marker */
  var mx=(currentPH/13)*(W-segW)+segW/2;
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(mx,4);
  ctx.lineTo(mx-8,-8);
  ctx.lineTo(mx+8,-8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#000';
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 12px monospace';
  ctx.textAlign='center';
  ctx.fillText('pH '+fmt(currentPH,1),mx,H+18);
}

function drawKineticsChart(points,order){
  var cv=$('kineticCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth,H=220;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,W,H);
  var padL=50,padR=20,padT=20,padB=30;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  /* Grid */
  ctx.strokeStyle='rgba(64,200,224,.1)';
  for(var gi=0;gi<=4;gi++){
    var y=padT+gi*plotH/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
  }
  for(var gi2=0;gi2<=5;gi2++){
    var x=padL+gi2*plotW/5;
    ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,padT+plotH);ctx.stroke();
  }
  /* Find max */
  var maxT=points[points.length-1].t;
  var maxA=Math.max.apply(null,points.map(function(p){return p.A;}));
  /* Curve */
  ctx.strokeStyle=order===1?'#40c8e0':'#f0c040';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  points.forEach(function(p,i){
    var x=padL+p.t/maxT*plotW;
    var y=padT+(1-p.A/maxA)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Fill */
  ctx.fillStyle=order===1?'rgba(64,200,224,.12)':'rgba(240,192,64,.12)';
  ctx.beginPath();
  points.forEach(function(p,i){
    var x=padL+p.t/maxT*plotW;
    var y=padT+(1-p.A/maxA)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+plotW,padT+plotH);
  ctx.lineTo(padL,padT+plotH);
  ctx.closePath();
  ctx.fill();
  /* Half-life markers */
  var hl=order===1?Math.log(2)/STATE.kinetics.k:1/(STATE.kinetics.k*STATE.kinetics.A0);
  for(var h=1;h<=3;h++){
    var th=h*hl;
    if(th>maxT)break;
    var hx=padL+th/maxT*plotW;
    ctx.strokeStyle='rgba(232,96,128,.5)';
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(hx,padT);ctx.lineTo(hx,padT+plotH);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#e86080';
    ctx.font='9px monospace';
    ctx.textAlign='center';
    ctx.fillText('t½×'+h,hx,padT-4);
  }
  /* Axis labels */
  ctx.fillStyle='#687888';
  ctx.font='10px monospace';
  ctx.textAlign='left';
  ctx.fillText('Time (s)',padL+plotW/2-20,H-6);
  ctx.save();
  ctx.translate(15,padT+plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';
  ctx.fillText('Concentration (M)',0,0);
  ctx.restore();
  /* Y labels */
  ctx.textAlign='right';
  ctx.fillStyle='#687888';
  ctx.fillText(fmt(maxA,2),padL-4,padT+10);
  ctx.fillText('0',padL-4,padT+plotH);
}
function drawKineticsLinear(points,order){
  var cv=$('kineticLinearCanvas');
  if(!cv)return;
  var wrap=cv.parentElement;
  var W=wrap.clientWidth,H=180;
  var dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,W,H);
  var padL=60,padR=20,padT=20,padB=30;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  /* Grid */
  ctx.strokeStyle='rgba(64,200,224,.1)';
  for(var gi=0;gi<=4;gi++){
    var y=padT+gi*plotH/4;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();
  }
  /* Transform */
  var transformed=points.map(function(p){
    if(order===1)return {t:p.t,y:Math.log(Math.max(p.A,1e-6))};
    else return {t:p.t,y:1/Math.max(p.A,1e-6)};
  });
  var minY=Math.min.apply(null,transformed.map(function(p){return p.y;}));
  var maxY=Math.max.apply(null,transformed.map(function(p){return p.y;}));
  var maxT=transformed[transformed.length-1].t;
  var range=maxY-minY||1;
  /* Line */
  ctx.strokeStyle=order===1?'#50e080':'#a060e0';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  transformed.forEach(function(p,i){
    var x=padL+p.t/maxT*plotW;
    var y=padT+(1-(p.y-minY)/range)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* Fill */
  ctx.fillStyle=order===1?'rgba(80,224,128,.1)':'rgba(160,96,224,.1)';
  ctx.beginPath();
  transformed.forEach(function(p,i){
    var x=padL+p.t/maxT*plotW;
    var y=padT+(1-(p.y-minY)/range)*plotH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.lineTo(padL+plotW,padT+plotH);
  ctx.lineTo(padL,padT+plotH);
  ctx.closePath();
  ctx.fill();
  /* Labels */
  ctx.fillStyle='#687888';
  ctx.font='10px monospace';
  ctx.textAlign='left';
  ctx.fillText('Time (s)',padL+plotW/2-20,H-6);
  ctx.save();
  ctx.translate(15,padT+plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';
  ctx.fillText(order===1?'ln[A]':'1/[A]',0,0);
  ctx.restore();
  ctx.textAlign='right';
  ctx.fillText(fmt(maxY,2),padL-4,padT+10);
  ctx.fillText(fmt(minY,2),padL-4,padT+plotH);
  /* Slope info */
  ctx.fillStyle=order===1?'#50e080':'#a060e0';
  ctx.textAlign='left';
  ctx.font='bold 10px monospace';
  ctx.fillText(order===1?'Slope = -k':'Slope = +k',padL+4,padT+10);
}

function estimateValence(sym){
  var v={H:1,He:0,Li:1,Be:2,B:3,C:4,N:3,O:2,F:1,Ne:0,Na:1,Mg:2,Al:3,Si:4,P:3,S:2,Cl:1,Ar:0,K:1,Ca:2};
  if(v[sym]!==undefined)return v[sym];
  /* Transition metals — variable */
  var e=ATOM[sym];
  if(e&&e.category==='transition')return 'variable';
  return '—';
}
