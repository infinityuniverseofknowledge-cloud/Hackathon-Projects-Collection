    ctx.fillText('Bits sent: '+b.nBits+' · Sifted key length: '+siftLen+' (50% expected)',44,statsY+44);
    ctx.fillStyle=b.matchRate>0.9?'#40ffb0':'#ff60a0';
    ctx.fillText('Match rate: '+fmt(b.matchRate*100,1)+'% · Errors in sifted key: '+errors,44,statsY+62);
    setStatsHTML(
      '<div>Bits: '+b.nBits+'</div>'+
      '<div>Sifted: '+siftLen+'</div>'+
      '<div>Match: '+fmt(b.matchRate*100,1)+'%</div>'+
      '<div>Eve: '+(b.eavesdrop?'YES':'no')+'</div>'
    );
    updateBadge('🔐 BB84 · '+siftLen+' sifted bits · match '+fmt(b.matchRate*100,1)+'%');
    $('sbMode').textContent='BB84';
  },
  onDown:function(){},
  controls:function(){
    var b=STATE.bb84;
    var html='';
    html+='<div class="sec"><h4>Eavesdropper</h4>';
    html+='<div class="chip-row">';
    html+='<div class="chip '+(b.eavesdrop?'':'active')+'" onclick="STATE.bb84.eavesdrop=false;MODULES.bb84.setup();renderLeftPanel()">No Eve</div>';
    html+='<div class="chip '+(b.eavesdrop?'active':'')+'" style="color:var(--err)" onclick="STATE.bb84.eavesdrop=true;MODULES.bb84.setup();renderLeftPanel()">⚠ With Eve</div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Number of bits</h4>';
    html+='<div class="ctrl"><div class="lbl"><span>n</span><span>'+b.nBits+'</span></div>';
    html+='<input type="range" min="8" max="48" step="1" value="'+b.nBits+'" oninput="STATE.bb84.nBits=parseInt(this.value);MODULES.bb84.setup();renderLeftPanel()"></div>';
    html+='</div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn primary full" onclick="MODULES.bb84.setup()">🎲 New exchange</button>';
    html+='</div>';
    html+='<div class="sec"><h4>Stats</h4><div class="kv">';
    html+='<div class="row"><span class="k">Bits exchanged</span><span class="v">'+b.nBits+'</span></div>';
    html+='<div class="row"><span class="k">Sifted length</span><span class="v">'+b.siftedKey.length+'</span></div>';
    html+='<div class="row"><span class="k">Match rate</span><span class="v">'+fmt(b.matchRate*100,1)+'%</span></div>';
    html+='<div class="row"><span class="k">QBER (error rate)</span><span class="v">'+fmt((1-b.matchRate)*100,1)+'%</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Interpretation</h4>';
    html+='<div style="font-family:var(--mono);font-size:.58rem;line-height:1.65;color:var(--tx2)">'+
      'Without Eve: match rate ~100%.<br>'+
      'With Eve (intercept-resend): ~75% — QBER≈25%.<br><br>'+
      'Above threshold (~11%), Alice and Bob abort.'+
      '</div></div>';
    return html;
  },
  mathPanel:function(){
    return '<div class="sec"><h4>BB84 steps</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '1. Alice picks random bits b_i and bases B_i ∈ {+, ×}<br>'+
      '2. She encodes b_i in basis B_i:<br>'+
      '&nbsp;&nbsp;Basis + → {|0⟩, |1⟩}<br>'+
      '&nbsp;&nbsp;Basis × → {|+⟩, |−⟩}<br>'+
      '3. Bob measures each qubit in random basis B\'_i<br>'+
      '4. Sifting: keep positions where B_i = B\'_i<br>'+
      '5. Compare a sample to detect Eve'+
      '</div></div>'+
      '<div class="sec"><h4>Why eavesdropping is detected</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'No-cloning theorem: Eve cannot copy the qubit.<br><br>'+
      'If she measures in wrong basis, she disturbs the state. Bob\'s result becomes random on ~25% of positions.<br><br>'+
      'Any nonzero QBER → possible eavesdropper.'+
      '</div></div>'+
      '<div class="sec"><h4>Security</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      'Information-theoretic security — not based on computational hardness.<br><br>'+
      'Theoretical limit: QBER &lt; 11% for secure key.<br>'+
      'Practical: QBER ~ 1-3% (channel noise).'+
      '</div></div>';
  }
});
</script>
<script>
/* ================================================================
   TABS
   ================================================================ */
var TABS=[
  {key:'circuit',icon:'⚛',label:'Circuit'},
  {key:'bloch',icon:'◉',label:'Bloch'},
  {key:'entangle',icon:'∞',label:'Entangle'},
  {key:'grover',icon:'🔍',label:'Grover'},
  {key:'shor',icon:'🔢',label:'Shor'},
  {key:'bb84',icon:'🔐',label:'BB84'}
];
function buildTabs(){
  var tabs=$('tbTabs');tabs.innerHTML='';
  TABS.forEach(function(t){
    var item=el('div',{class:'tb-tab'+(t.key===STATE.currentTab?' active':''),'data-tab':t.key});
    item.innerHTML='<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span>';
    item.onclick=function(){switchTab(t.key)};
    tabs.appendChild(item);
  });
}
function switchTab(key){
  STATE.currentTab=key;
  $$('.tb-tab').forEach(function(e){e.classList.toggle('active',e.getAttribute('data-tab')===key)});
  $('sbMode').textContent=(MODULES[key]&&MODULES[key].title)||key;
  if(MODULES[key]&&MODULES[key].init)MODULES[key].init();
  renderLeftPanel();
  renderRightPanel();
}
function switchRp(name,e){
  STATE.currentRp=name;
  $$('.rp-tab').forEach(function(t){t.classList.remove('active')});
  e.classList.add('active');
  $$('.rp-pane').forEach(function(p){p.classList.remove('active')});
  var pane=$('rp'+name.charAt(0).toUpperCase()+name.slice(1));
  if(pane)pane.classList.add('active');
  renderRightPanel();
}
function renderLeftPanel(){
  var body=$('lpBody');if(!body)return;
  var m=MODULES[STATE.currentTab];if(!m){body.innerHTML='';return;}
  var html='';
  html+='<div class="sec" style="margin-bottom:6px"><h4 style="border:none;padding:0;color:var(--c1);font-size:.7rem">'+m.icon+' '+m.title+'</h4><div style="font-size:.6rem;color:var(--tx3);font-family:var(--mono);line-height:1.5;margin-top:4px">'+m.desc+'</div></div>';
  if(m.controls)html+=m.controls();
  body.innerHTML=html;
}
function renderRightPanel(){
  var m=MODULES[STATE.currentTab];
  var statePane=$('rpState');
  if(statePane){
    statePane.innerHTML=
      '<div class="sec"><h4>Live</h4><div class="kv">'+
      '<div class="row"><span class="k">Module</span><span class="v">'+((m&&m.title)||'—')+'</span></div>'+
      '<div class="row"><span class="k">Time</span><span class="v">'+fmt(STATE.time,1)+'s</span></div>'+
      '<div class="row"><span class="k">Playing</span><span class="v">'+(STATE.playing?'yes':'paused')+'</span></div>'+
      '</div></div>';
  }
  var mathPane=$('rpMath');
  if(mathPane&&m&&m.mathPanel)mathPane.innerHTML=m.mathPanel();
  else if(mathPane)mathPane.innerHTML='<div class="empty">No math panel</div>';
  var helpPane=$('rpHelp');
  if(helpPane&&m)helpPane.innerHTML=
    '<div class="sec"><h4>Module</h4>'+
    '<div style="font-size:.6rem;font-family:var(--mono);line-height:1.6;color:var(--tx2)">'+
    '<b style="color:var(--c1)">'+m.icon+' '+m.title+'</b><br><br>'+m.desc+'</div></div>';
  if(STATE.currentRp==='logs')renderLogs();
}
function renderLogs(){
  var p=$('rpLogs');if(!p)return;
  var html='<div class="sec"><h4>Event Log</h4>';
  if(!LOG.length)html+='<div class="empty" style="padding:20px;font-size:.6rem">No events</div>';
  else LOG.slice().reverse().forEach(function(l){
    var color=l.type==='error'?'var(--err)':l.type==='success'?'var(--c3)':l.type==='warn'?'var(--c5)':'var(--c1)';
    html+='<div style="padding:3px 6px;border-left:2px solid '+color+';margin-bottom:3px;font-family:var(--mono);font-size:.58rem;background:var(--panel3);border-radius:2px">'+
      '<span style="color:var(--tx3)">'+new Date(l.t).toTimeString().substr(0,8)+'</span> '+
      '<span style="color:'+color+'">'+esc(l.msg)+'</span></div>';
  });
  html+='</div>';
  p.innerHTML=html;
}
function togglePlay(){
  STATE.playing=!STATE.playing;
  $('btnPlay').textContent=STATE.playing?'⏸':'▶';
  $('tbDot').classList.toggle('on',STATE.playing);
  toast(STATE.playing?'Playing':'Paused','info',900);
}
function stepOnce(){
  var m=MODULES[STATE.currentTab];
  if(m&&m.step)m.step();
  else toast('No step in this module','info',900);
}
function resetModule(){
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
    toast('Reset','success',900);
  }
}
function toggleLeftPanel(){$('leftPanel').classList.toggle('collapsed')}
function toggleRightPanel(){$('rightPanel').classList.toggle('collapsed')}
var THEMES=['quantum','light','mono'];
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var i=THEMES.indexOf(cur);
  var next=THEMES[(i+1)%THEMES.length];
  document.documentElement.setAttribute('data-theme',next);
  STATE.theme=next;
  toast('Theme: '+next,'success');
}
function showHelp(){
  openModal('❓ QUBIT — Help',
    '<div class="sec"><h4>⚛ About</h4><div style="font-size:.62rem;line-height:1.75;color:var(--tx2);font-family:var(--mono)">Real quantum circuit simulator with full statevector math (complex amplitudes), unitary gates, Bloch sphere, entanglement demos, and hands-on implementations of Grover, Shor-lite, and the BB84 QKD protocol.</div></div>'+
    '<div class="sec"><h4>📚 Modules</h4><div style="font-size:.62rem;line-height:1.85;color:var(--tx2);font-family:var(--mono)">'+
    '<b style="color:var(--c1)">⚛ Circuit</b> — build & run circuits with 13 gate types<br>'+
    '<b style="color:var(--c1)">◉ Bloch</b> — visualize single qubit state on 3D sphere<br>'+
    '<b style="color:var(--c1)">∞ Entangle</b> — Bell, GHZ, W states + correlations<br>'+
    '<b style="color:var(--c1)">🔍 Grover</b> — amplitude amplification, O(√N) search<br>'+
    '<b style="color:var(--c1)">🔢 Shor</b> — period finding + factoring on N=15,21,35<br>'+
    '<b style="color:var(--c1)">🔐 BB84</b> — quantum key distribution with eavesdropping'+
    '</div></div>'+
    '<div class="sec"><h4>⌨️ Shortcuts</h4><div style="font-size:.62rem;font-family:var(--mono);line-height:1.9;color:var(--tx2)">'+
    '<b style="color:var(--c1)">Space</b> — Play/pause<br>'+
    '<b style="color:var(--c1)">→</b> — Single step<br>'+
    '<b style="color:var(--c1)">M</b> — Measure (collapse state)<br>'+
    '<b style="color:var(--c1)">R</b> — Reset module<br>'+
    '<b style="color:var(--c1)">1-6</b> — Jump to module<br>'+
    '<b style="color:var(--c1)">T</b> — Cycle theme<br>'+
    '<b style="color:var(--c1)">?</b> — This help'+
    '</div></div>'+
    '<div class="sec"><h4>🎮 Circuit tips</h4><div style="font-size:.6rem;font-family:var(--mono);line-height:1.7;color:var(--tx2)">'+
    '• Choose a gate from left panel, then click a wire cell to place it<br>'+
    '• Right-click a cell to remove a gate<br>'+
    '• Multi-qubit gates span from the clicked wire downward<br>'+
    '• Try the presets: Bell, GHZ, QFT-3, Teleport'+
    '</div></div>',
    '<button class="btn primary" onclick="closeModal()">Got it</button>',{size:'lg'});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();stepOnce();}
  else if(e.key==='r'||e.key==='R')resetModule();
  else if(e.key==='m'||e.key==='M')measureAll();
  else if(e.key>='1'&&e.key<='6'){var idx=parseInt(e.key)-1;if(TABS[idx])switchTab(TABS[idx].key);}
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='?'||(e.shiftKey&&e.key==='/'))showHelp();
  else if(e.key==='Escape')closeModal();
});

/* ================================================================
   BOOT
   ================================================================ */
var BOOT_STEPS=[
  'Initializing statevector (complex amplitudes)...',
  'Loading unitary gate matrices (13 gates)...',
  'Calibrating Bloch sphere projection...',
  'Preparing Bell/GHZ/W entanglement presets...',
  'Wiring Grover diffusion operator...',
  'Building modular exponentiation table (Shor)...',
  'Seeding BB84 random bases...',
  'Ready.'
];
function bootSequence(){
  var pct=0,idx=0;
  var fill=$('bootFill'),log=$('bootLog'),pctEl=$('bootPct');
  var iv=setInterval(function(){
    pct+=rnd(8,18);if(pct>100)pct=100;
    fill.style.width=pct+'%';pctEl.textContent=pct+'%';
    if(idx<BOOT_STEPS.length){
      var l=el('div',{class:'ok'});
      l.textContent='[ OK ] '+BOOT_STEPS[idx];
      log.appendChild(l);log.scrollTop=log.scrollHeight;
      idx++;
    }
    if(pct>=100){
      clearInterval(iv);
      setTimeout(function(){
        $('boot').classList.add('hidden');
        toast('QUBIT ready · Press ? for help','success',3200);
      },400);
    }
  },140);
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
var lastFrameTime=performance.now();
var fpsAccum=0,fpsFrames=0;
function mainLoop(now){
  var dt=Math.min((now-lastFrameTime)/1000,0.05);
  lastFrameTime=now;
  fpsAccum+=dt;fpsFrames++;
  if(fpsAccum>=0.5){
    $('sbFps').textContent=Math.round(fpsFrames/fpsAccum);
    fpsAccum=0;fpsFrames=0;
  }
  if(STATE.playing){
    var m=MODULES[STATE.currentTab];
    if(m&&m.tick){try{m.tick(dt);}catch(e){console.error(e);}}
    if(m&&m.draw){try{m.draw(CANV.ctx);}catch(e){console.error(e);}}
  }
  requestAnimationFrame(mainLoop);
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  buildTabs();
  initCanvas();
  if(MODULES[STATE.currentTab]&&MODULES[STATE.currentTab].init){
    MODULES[STATE.currentTab].init();
  }
  renderLeftPanel();
  renderRightPanel();
  logMsg('QUBIT initialized','success');
  bootSequence();
  requestAnimationFrame(mainLoop);
  $('tbDot').classList.add('on');
  $('tbText').textContent='running';
  setInterval(function(){if(STATE.currentRp==='logs')renderLogs();},1000);
});

console.log('%c QUBIT ','background:linear-gradient(90deg,#40d0ff,#a060ff,#40ffb0);color:#05060f;padding:8px 20px;border-radius:4px;font-weight:900;font-size:16px;letter-spacing:4px');
console.log('%cQuantum Circuit Lab','color:#40d0ff;font-weight:600');
console.log('%cCircuit · Bloch · Entangle · Grover · Shor · BB84','color:#a060ff');
console.log('%cPress ? for help','color:#a8b0e0');
</script>
</body></html>
