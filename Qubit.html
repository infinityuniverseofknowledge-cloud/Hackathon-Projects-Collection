<!DOCTYPE html>
<html lang="en" data-theme="quantum">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>QUBIT — Quantum Circuit Lab</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px;height:100%;overflow:hidden}
body{height:100vh;width:100vw;overflow:hidden;font-family:var(--sans);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
canvas{display:block;touch-action:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px;border:2px solid transparent;background-clip:content-box}

:root{
  --bg:#05060f;--bg2:#0a0c1e;--bg3:#141830;--bg4:#20264a;
  --panel:#0a0c1e;--panel2:#141830;--panel3:#20264a;--panel4:#2c3364;
  --bd:#1e2450;--bd2:#323a78;--bd3:#4c56a8;
  --tx:#e8ecff;--tx2:#a8b0e0;--tx3:#6870a0;--mu:#3a4080;
  --c1:#40d0ff;--c1h:#80e0ff;--c1l:#20a0c0;
  --c2:#a060ff;--c2h:#c090ff;--c2l:#7030c0;
  --c3:#40ffb0;--c3h:#80ffd0;--c3l:#20c090;
  --c4:#ff60a0;--c4h:#ff90c0;--c4l:#c03080;
  --c5:#ffd040;--c5h:#ffe880;--c5l:#c0a020;
  --c6:#60ff60;--c6h:#a0ffa0;--c6l:#30c030;
  --c7:#ff8060;--c7h:#ffb0a0;--c7l:#c05040;
  --c8:#80d0ff;--c8h:#b0e0ff;--c8l:#4090c0;
  --ok:#40ffb0;--warn:#ffd040;--err:#ff60a0;--info:#40d0ff;
  --g1:linear-gradient(135deg,#40d0ff,#a060ff);
  --g2:linear-gradient(135deg,#40ffb0,#40d0ff);
  --gHolo:linear-gradient(120deg,#40d0ff,#a060ff,#40ffb0,#ffd040,#ff60a0,#40d0ff);
  --r:9px;--rs:6px;--rxs:4px;--rf:9999px;
  --sh:0 6px 24px rgba(0,0,0,.8);
  --sh2:0 14px 42px rgba(0,0,0,1);
  --mono:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
  --sans:'Inter','SF Pro',system-ui,sans-serif;
  --disp:'Orbitron','Audiowide',monospace;
  --t1:all .13s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#f0f4ff;--bg2:#e0e8ff;--bg3:#d0d8f8;--panel:#fff;--panel2:#f0f4ff;--panel3:#e0e8ff;
  --bd:#c0c8e8;--bd2:#a0a8d0;--tx:#101030;--tx2:#404878;--tx3:#8088b0;
  --c1:#0060c0;--c2:#7030c0;--c3:#008060;--c4:#c02060;--c5:#a08000;--c6:#008000;
  --g1:linear-gradient(135deg,#0060c0,#7030c0)}
[data-theme="mono"]{--bg:#08080a;--bg2:#101012;--bg3:#18181c;--panel:#101012;--panel2:#18181c;--panel3:#202026;
  --bd:#282830;--bd2:#404050;--tx:#e0e0e6;--tx2:#a0a0b0;--c1:#e0e0e6;--c2:#a0a0b0;--c3:#c0c0c8;
  --g1:linear-gradient(135deg,#e0e0e6,#808088)}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}

#boot{position:fixed;inset:0;background:#05060f;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;font-family:var(--mono);padding:20px}
#boot.hidden{opacity:0;pointer-events:none}
.boot-atom{width:180px;height:180px;margin-bottom:20px;position:relative}
.boot-atom .nucleus{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:radial-gradient(circle,#80e0ff,#40d0ff);box-shadow:0 0 30px #40d0ff,0 0 60px #a060ff;animation:pulseN 2s ease-in-out infinite}
.boot-atom .orbit{position:absolute;inset:0;border:1px solid rgba(64,208,255,.4);border-radius:50%;animation:spin 4s linear infinite}
.boot-atom .orbit:nth-child(2){transform:rotate(60deg)}
.boot-atom .orbit:nth-child(3){transform:rotate(120deg)}
.boot-atom .orbit::before{content:'';position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:#a060ff;box-shadow:0 0 12px #a060ff}
@keyframes spin{from{transform:rotate(0) rotateY(0)}to{transform:rotate(360deg) rotateY(360deg)}}
@keyframes pulseN{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.2)}}
.boot-logo{font-family:var(--disp);font-size:3.2rem;font-weight:900;letter-spacing:16px;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 3s linear infinite;margin-bottom:6px}
.boot-sub{font-size:.66rem;color:#40d0ff;letter-spacing:10px;margin-bottom:26px;opacity:.75}
.boot-bar{width:320px;max-width:80vw;height:2px;background:#141830;border-radius:2px;overflow:hidden;margin-bottom:10px}
.boot-bar-fill{height:100%;background:var(--g1);width:0;transition:width .3s;box-shadow:0 0 14px #40d0ff}
.boot-pct{font-size:.66rem;color:#40d0ff;margin-bottom:14px}
.boot-log{font-size:.58rem;color:#6870a0;text-align:left;width:min(460px,90vw);height:130px;overflow:hidden;line-height:1.7}
.boot-log .ok{color:#40ffb0}
@keyframes holo{0%{background-position:0% center}100%{background-position:300% center}}

#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;z-index:100}
.tb-logo{font-family:var(--disp);font-weight:900;letter-spacing:5px;font-size:.96rem;
  background:var(--gHolo);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:holo 8s linear infinite;padding-right:8px;cursor:pointer}
.tb-tabs{display:flex;gap:2px;flex:1;overflow-x:auto;align-items:center;height:100%}
.tb-tab{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rxs);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;height:30px}
.tb-tab:hover{background:var(--panel2);color:var(--tx)}
.tb-tab.active{background:var(--g1);color:#05060f;box-shadow:0 0 12px rgba(64,208,255,.4)}
.tb-tab .tab-icon{font-size:.85rem}
.tb-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tb-btn{width:30px;height:30px;border-radius:var(--rxs);background:var(--panel2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tb-btn:hover{background:var(--panel3);border-color:var(--c1);color:var(--c1)}
.tb-status{font-family:var(--mono);font-size:.6rem;padding:4px 9px;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--rxs);color:var(--c1);font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tb-status .dot{width:7px;height:7px;border-radius:50%;background:#141830;transition:var(--t1)}
.tb-status .dot.on{background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#main{flex:1;display:flex;overflow:hidden;min-height:0}
#leftPanel{width:290px;background:var(--panel2);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden}
#leftPanel.collapsed{width:0}
.panel-head{padding:9px 11px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.panel-title{font-size:.58rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);font-weight:700;font-family:var(--mono)}
.panel-body{flex:1;overflow-y:auto;padding:10px}

#workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
#canvasWrap{flex:1;position:relative;background:#02030a;overflow:hidden;min-height:0}
#mainCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#canvasOverlay{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.co-badge{background:rgba(10,12,30,.92);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 9px;font-family:var(--mono);font-size:.6rem;color:var(--c1);pointer-events:auto;max-width:340px}
.co-badge.stats{color:var(--c3);display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right;line-height:1.5}

#rightPanel{width:320px;background:var(--panel2);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#rightPanel.collapsed{width:0}
.rp-tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);flex-shrink:0;height:30px}
.rp-tab{flex:1;padding:5px;font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);cursor:pointer;transition:var(--t1);display:flex;align-items:center;justify-content:center;gap:3px;border-bottom:2px solid transparent}
.rp-tab:hover{color:var(--tx);background:var(--panel2)}
.rp-tab.active{color:var(--c1);border-bottom-color:var(--c1);background:var(--panel2)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.rp-pane{display:none}
.rp-pane.active{display:block}

#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:12px;font-family:var(--mono);font-size:.6rem;color:var(--tx3);flex-shrink:0;overflow-x:auto}
#statusbar .sb-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
#statusbar .sb-val{color:var(--c1)}
#statusbar .sb-val.c2{color:var(--c2)}.sb-val.c3{color:var(--c3)}.sb-val.c4{color:var(--c4)}.sb-val.c5{color:var(--c5)}

.sec{margin-bottom:12px}
.sec h4{font-size:.58rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--tx3);margin-bottom:7px;font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:.58rem;color:var(--tx3);display:flex;justify-content:space-between;margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-family:var(--mono)}
.lbl span:last-child{color:var(--c1);text-transform:none;letter-spacing:0}
.ctrl{margin-bottom:9px}
.ctrl input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--panel4);border-radius:2px;outline:none;cursor:pointer}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--c1);border-radius:50%;cursor:pointer;box-shadow:0 0 10px var(--c1)}
.ctrl input[type=number],.ctrl select,.ctrl textarea,.ctrl input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rxs);padding:5px 8px;color:var(--tx);font-size:.66rem;transition:var(--t1);font-family:var(--mono)}
.ctrl textarea{resize:vertical;min-height:60px;line-height:1.5}
.ctrl input:focus,.ctrl select:focus,.ctrl textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(64,208,255,.15)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--rxs);background:var(--panel3);border:1px solid var(--bd);color:var(--tx);cursor:pointer;transition:var(--t1);font-size:.66rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel4);border-color:var(--c1);color:var(--c1h)}
.btn.primary{background:var(--g1);color:#05060f;border-color:transparent}
.btn.primary:hover{box-shadow:0 0 14px rgba(64,208,255,.5)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.success{color:var(--c3);border-color:var(--c3)}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:3px 7px;font-size:.58rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chip-row{display:flex;gap:3px;flex-wrap:wrap}
.chip{padding:3px 8px;background:var(--panel3);border:1px solid var(--bd);border-radius:var(--rf);cursor:pointer;font-size:.58rem;font-family:var(--mono);transition:var(--t1);color:var(--tx2)}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.active{background:var(--g1);color:#05060f;border-color:transparent;font-weight:700}

.kv{font-family:var(--mono);font-size:.6rem;line-height:1.7}
.kv .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);gap:8px}
.kv .row:last-child{border-bottom:none}
.kv .k{color:var(--tx3);white-space:nowrap}
.kv .v{color:var(--c1);text-align:right;word-break:break-all;font-size:.58rem}
.empty{text-align:center;padding:28px 18px;color:var(--tx3);font-size:.68rem;font-family:var(--mono)}

.data-table{width:100%;font-family:var(--mono);font-size:.6rem;border-collapse:collapse}
.data-table th{text-align:left;padding:4px 7px;background:var(--panel3);font-size:.53rem;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;border-bottom:1px solid var(--bd)}
.data-table td{padding:3px 7px;border-bottom:1px solid var(--bd);color:var(--tx2)}
.data-table td.c1{color:var(--c1)}.data-table td.c2{color:var(--c2)}.data-table td.c3{color:var(--c3)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:5000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh2);max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.lg{max-width:1050px}
.modal-head{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h2{font-size:.88rem;font-weight:700;color:var(--c1);font-family:var(--disp);letter-spacing:1px}
.modal-body{padding:18px;overflow-y:auto;flex:1;user-select:text}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.modal-x{width:24px;height:24px;border-radius:var(--rxs);background:transparent;color:var(--tx3);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:var(--t1)}
.modal-x:hover{background:var(--panel2);color:var(--err)}

#toasts{position:fixed;bottom:40px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{padding:9px 14px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:var(--sh);font-size:.68rem;font-weight:500;max-width:320px;min-width:170px;animation:tin .3s;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);font-family:var(--mono);pointer-events:auto}
.toast.success{border-left-color:var(--c3)}.toast.warn{border-left-color:var(--c5)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1000px){#leftPanel{width:250px}#rightPanel{width:280px}}
@media(max-width:700px){#leftPanel,#rightPanel{width:0;overflow:hidden}.tb-tab span:not(.tab-icon){display:none}}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-atom">
    <div class="orbit"></div><div class="orbit"></div><div class="orbit"></div>
    <div class="nucleus"></div>
  </div>
  <div class="boot-logo">QUBIT</div>
  <div class="boot-sub">QUANTUM CIRCUIT LAB</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
  <div class="boot-log" id="bootLog"></div>
</div>

<div id="app">
  <div id="topbar">
    <div class="tb-logo" onclick="switchTab('circuit')">QUBIT</div>
    <div class="tb-tabs" id="tbTabs"></div>
    <div class="tb-status" id="tbStatus">
      <span class="dot" id="tbDot"></span>
      <span id="tbText">ready</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btnPlay" onclick="togglePlay()" title="Play/Pause (Space)">⏸</button>
      <button class="tb-btn" onclick="stepOnce()" title="Step (→)">⏭</button>
      <button class="tb-btn" onclick="resetModule()" title="Reset (R)">↺</button>
      <button class="tb-btn" onclick="measureAll()" title="Measure (M)">👁</button>
      <button class="tb-btn" onclick="toggleLeftPanel()" title="Toggle left">◀</button>
      <button class="tb-btn" onclick="toggleRightPanel()" title="Toggle right">▶</button>
      <button class="tb-btn" onclick="toggleTheme()" title="Theme (T)">🎨</button>
      <button class="tb-btn" onclick="showHelp()" title="Help (?)">❓</button>
    </div>
  </div>

  <div id="main">
    <div id="leftPanel">
      <div class="panel-head"><span class="panel-title">Controls</span><button class="tb-btn" style="width:20px;height:20px;font-size:.7rem" onclick="toggleLeftPanel()">⇤</button></div>
      <div class="panel-body" id="lpBody"></div>
    </div>

    <div id="workspace">
      <div id="canvasWrap">
        <canvas id="mainCanvas"></canvas>
        <div id="canvasOverlay">
          <div class="co-badge" id="coBadge">Ready</div>
          <div class="co-badge stats" id="coStats"></div>
        </div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="state" onclick="switchRp('state',this)">📊<span>State</span></div>
        <div class="rp-tab" data-tab="math" onclick="switchRp('math',this)">∑<span>Math</span></div>
        <div class="rp-tab" data-tab="logs" onclick="switchRp('logs',this)">📋<span>Log</span></div>
        <div class="rp-tab" data-tab="help" onclick="switchRp('help',this)">ℹ️<span>Info</span></div>
      </div>
      <div class="rp-body">
        <div class="rp-pane active" id="rpState"></div>
        <div class="rp-pane" id="rpMath"></div>
        <div class="rp-pane" id="rpLogs"></div>
        <div class="rp-pane" id="rpHelp"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <div class="sb-item"><span style="color:var(--tx3)">FPS</span><span class="sb-val" id="sbFps">--</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Qubits</span><span class="sb-val c2" id="sbQubits">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Dim</span><span class="sb-val c3" id="sbDim">2</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Gates</span><span class="sb-val c4" id="sbGates">0</span></div>
    <div class="sb-item"><span style="color:var(--tx3)">Norm</span><span class="sb-val c5" id="sbNorm">1.000</span></div>
    <div class="sb-item" style="margin-left:auto"><span style="color:var(--tx3)">Module</span><span class="sb-val" id="sbMode">Circuit</span></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ================================================================
   UTILITIES
   ================================================================ */
function $(i){return document.getElementById(i)}
function $$(s){return document.querySelectorAll(s)}
function el(t,a,c){var e=document.createElement(t);if(a)for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.indexOf('on')===0&&typeof v==='function')e[k]=v;else e.setAttribute(k,v)}if(c){if(typeof c==='string')e.innerHTML=c;else if(Array.isArray(c))c.forEach(function(x){if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});else e.appendChild(c)}return e}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndF(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmt(n,d){d=d==null?2:d;if(!isFinite(n)||isNaN(n))return '—';return Number(n).toFixed(d)}
function toast(m,t,d){t=t||'info';d=d||2200;var icons={success:'✓',warn:'⚠',error:'✕',info:'ℹ'};var e=el('div',{class:'toast '+t});e.innerHTML='<span style="font-size:.95rem">'+(icons[t]||'ℹ')+'</span><span>'+esc(m)+'</span>';$('toasts').appendChild(e);setTimeout(function(){e.style.opacity='0';e.style.transition='all .3s';setTimeout(function(){e.remove()},300)},d)}
function openModal(t,b,f,opts){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modalFoot').innerHTML=f||'<button class="btn" onclick="closeModal()">Close</button>';$('modal').className='modal'+(opts&&opts.size?' '+opts.size:'');$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
$('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal()})

/* ================================================================
   COMPLEX NUMBERS
   ================================================================ */
function C(re,im){return {re:re,im:im||0}}
function cadd(a,b){return {re:a.re+b.re,im:a.im+b.im}}
function csub(a,b){return {re:a.re-b.re,im:a.im-b.im}}
function cmul(a,b){return {re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}
function cscale(a,s){return {re:a.re*s,im:a.im*s}}
function cconj(a){return {re:a.re,im:-a.im}}
function cabs2(a){return a.re*a.re+a.a? a.im*a.im : a.re*a.re+a.im*a.im}
function cabs(a){return Math.sqrt(a.re*a.re+a.im*a.im)}
function carg(a){return Math.atan2(a.im,a.re)}
function cexp(theta){return {re:Math.cos(theta),im:Math.sin(theta)}}
function cdiv(a,b){var d=b.re*b.re+b.im*b.im;return {re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d}}
function cstr(a,d){
  d=d==null?3:d;
  if(Math.abs(a.im)<1e-9)return fmt(a.re,d);
  if(Math.abs(a.re)<1e-9)return fmt(a.im,d)+'i';
  return fmt(a.re,d)+(a.im>=0?'+':'-')+fmt(Math.abs(a.im),d)+'i';
}

/* ================================================================
   QUANTUM GATES (2x2 unitary matrices as complex arrays)
   ================================================================ */
var SQRT2_INV=1/Math.sqrt(2);
var GATES={
  I:{name:'I',matrix:[[C(1,0),C(0,0)],[C(0,0),C(1,0)]],qubits:1,color:'#6870a0',desc:'Identity'},
  H:{name:'H',matrix:[[C(SQRT2_INV),C(SQRT2_INV)],[C(SQRT2_INV),C(-SQRT2_INV)]],qubits:1,color:'#40d0ff',desc:'Hadamard — creates superposition'},
  X:{name:'X',matrix:[[C(0),C(1)],[C(1),C(0)]],qubits:1,color:'#ff60a0',desc:'Pauli-X — bit flip (NOT)'},
  Y:{name:'Y',matrix:[[C(0),C(0,-1)],[C(0,1),C(0)]],qubits:1,color:'#ff8060',desc:'Pauli-Y — bit+phase flip'},
  Z:{name:'Z',matrix:[[C(1),C(0)],[C(0),C(-1)]],qubits:1,color:'#40ffb0',desc:'Pauli-Z — phase flip'},
  S:{name:'S',matrix:[[C(1),C(0)],[C(0),C(0,1)]],qubits:1,color:'#a060ff',desc:'Phase gate — π/2'},
  T:{name:'T',matrix:[[C(1),C(0)],[C(0),cexp(Math.PI/4)]],qubits:1,color:'#ffd040',desc:'T gate — π/4'},
  Sdg:{name:'S†',matrix:[[C(1),C(0)],[C(0),C(0,-1)]],qubits:1,color:'#a060ff',desc:'S dagger'},
  Tdg:{name:'T†',matrix:[[C(1),C(0)],[C(0),cexp(-Math.PI/4)]],qubits:1,color:'#ffd040',desc:'T dagger'},
  Rx:{name:'Rx',matrix:null,qubits:1,color:'#ff8060',desc:'Rotation around X',param:true,
      matrixFn:function(theta){var c=Math.cos(theta/2),s=Math.sin(theta/2);
        return [[C(c),C(0,-s)],[C(0,-s),C(c)]]}},
  Ry:{name:'Ry',matrix:null,qubits:1,color:'#40ffb0',desc:'Rotation around Y',param:true,
      matrixFn:function(theta){var c=Math.cos(theta/2),s=Math.sin(theta/2);
        return [[C(c),C(-s)],[C(s),C(c)]]}},
  Rz:{name:'Rz',matrix:null,qubits:1,color:'#40d0ff',desc:'Rotation around Z',param:true,
      matrixFn:function(theta){var c=Math.cos(theta/2),s=Math.sin(theta/2);
        return [[cexp(-theta/2),C(0)],[C(0),cexp(theta/2)]]}}
};
var CGATES={
  CNOT:{name:'CNOT',qubits:2,color:'#a060ff',desc:'Controlled-NOT'},
  CZ:{name:'CZ',qubits:2,color:'#40ffb0',desc:'Controlled-Z'},
  SWAP:{name:'SWAP',qubits:2,color:'#ff60a0',desc:'Swap qubits'},
  Toffoli:{name:'CCX',qubits:3,color:'#ffd040',desc:'Toffoli — doubly-controlled X'}
};

/* ================================================================
   STATEVECTOR ENGINE
   ================================================================ */
function newState(n){
  var dim=1<<n;
  var psi=[];
  for(var i=0;i<dim;i++)psi.push(C(0,0));
  psi[0]=C(1,0);
  return psi;
}
function psiNorm(psi){
  var s=0;
  for(var i=0;i<psi.length;i++)s+=cabs2(psi[i]);
  return Math.sqrt(s);
}
function normalizePsi(psi){
  var n=psiNorm(psi);
  if(n<1e-12)return psi;
  for(var i=0;i<psi.length;i++)psi[i]=cscale(psi[i],1/n);
  return psi;
}
/* Bit test: is bit (n-1-qubitIdx) of idx set? */
function testBit(idx,qubit,nQubits){
  return (idx>>(nQubits-1-qubit))&1;
}
/* Apply 2x2 gate matrix to qubit, optionally controlled by ctrl bit */
function apply1Q(psi,matrix,qubit,nQubits,ctrl){
  var dim=psi.length;
  var newPsi=psi.slice();
  for(var i=0;i<dim;i++){
    var bit=testBit(i,qubit,nQubits);
    if(ctrl!==undefined&&ctrl!==null){
      if(!testBit(i,ctrl,nQubits))continue;
    }
    if(bit===0){
      var j=i|(1<<(nQubits-1-qubit));
      var a=psi[i],b=psi[j];
      newPsi[i]=cadd(cmul(matrix[0][0],a),cmul(matrix[0][1],b));
      newPsi[j]=cadd(cmul(matrix[1][0],a),cmul(matrix[1][1],b));
    }
  }
  return newPsi;
}
function applyCNOT(psi,ctrl,tgt,n){
  var dim=psi.length;
  var newPsi=psi.slice();
  for(var i=0;i<dim;i++){
    if(testBit(i,ctrl,n)&&!testBit(i,tgt,n)){
      var j=i|(1<<(n-1-tgt));
      newPsi[i]=psi[j];
      newPsi[j]=psi[i];
    }
  }
  return newPsi;
}
function applyCZ(psi,ctrl,tgt,n){
  var dim=psi.length;
  var newPsi=psi.slice();
  for(var i=0;i<dim;i++){
    if(testBit(i,ctrl,n)&&testBit(i,tgt,n)){
      newPsi[i]=cscale(psi[i],-1);
    }
  }
  return newPsi;
}
function applySWAP(psi,q1,q2,n){
  var dim=psi.length;
  var newPsi=psi.slice();
  for(var i=0;i<dim;i++){
    if(testBit(i,q1,n)!==testBit(i,q2,n)){
      var j=i;
      if(testBit(i,q1,n))j&=~(1<<(n-1-q1));else j|=(1<<(n-1-q1));
      if(testBit(i,q2,n))j&=~(1<<(n-1-q2));else j|=(1<<(n-1-q2));
      if(j>i){newPsi[i]=psi[j];newPsi[j]=psi[i];}
    }
  }
  return newPsi;
}
function applyToffoli(psi,c1,c2,tgt,n){
  var dim=psi.length;
  var newPsi=psi.slice();
  for(var i=0;i<dim;i++){
    if(testBit(i,c1,n)&&testBit(i,c2,n)&&!testBit(i,tgt,n)){
      var j=i|(1<<(n-1-tgt));
      newPsi[i]=psi[j];
      newPsi[j]=psi[i];
    }
  }
  return newPsi;
}
/* Apply gate by name */
function applyGate(psi,gateName,qubits,n,params){
  var dim=psi.length;
  if(gateName==='CNOT')return applyCNOT(psi,qubits[0],qubits[1],n);
  if(gateName==='CZ')return applyCZ(psi,qubits[0],qubits[1],n);
  if(gateName==='SWAP')return applySWAP(psi,qubits[0],qubits[1],n);
  if(gateName==='Toffoli')return applyToffoli(psi,qubits[0],qubits[1],qubits[2],n);
  var g=GATES[gateName];
  if(!g)throw new Error('Unknown gate: '+gateName);
  var m;
  if(g.param){
    var theta=(params&&params.theta!=null)?params.theta:Math.PI/2;
    m=g.matrixFn(theta);
  } else m=g.matrix;
  return apply1Q(psi,m,qubits[0],n,qubits[1]);
}
/* Measure — collapse to basis state */
function measurePsi(psi){
  var probs=psi.map(cabs2);
  var total=probs.reduce(function(s,p){return s+p},0);
  var r=Math.random()*total;
  var cum=0;
  var outcome=0;
  for(var i=0;i<probs.length;i++){
    cum+=probs[i];
    if(r<=cum){outcome=i;break;}
  }
  return outcome;
}

/* Pretty state name for n qubits */
function stateName(idx,n){
  var s='';
  for(var q=0;q<n;q++)s+=testBit(idx,q,n)?'1':'0';
  return '|'+s+'⟩';
}

var CANV={canvas:null,ctx:null,W:0,H:0,dpr:1};
function initCanvas(){
  CANV.canvas=$('mainCanvas');
  CANV.ctx=CANV.canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  CANV.canvas.addEventListener('mousedown',onDown);
  CANV.canvas.addEventListener('mousemove',onMove);
  CANV.canvas.addEventListener('mouseup',onUp);
  CANV.canvas.addEventListener('mouseleave',onUp);
  CANV.canvas.addEventListener('contextmenu',function(e){e.preventDefault();onRightClick(e)});
  CANV.canvas.addEventListener('touchstart',onTouchStart,{passive:false});
  CANV.canvas.addEventListener('touchmove',onTouchMove,{passive:false});
  CANV.canvas.addEventListener('touchend',onTouchEnd,{passive:false});
}
function resizeCanvas(){
  var wrap=CANV.canvas.parentElement;
  CANV.dpr=window.devicePixelRatio||1;
  CANV.W=wrap.clientWidth;CANV.H=wrap.clientHeight;
  CANV.canvas.width=Math.floor(CANV.W*CANV.dpr);
  CANV.canvas.height=Math.floor(CANV.H*CANV.dpr);
  CANV.canvas.style.width=CANV.W+'px';
  CANV.canvas.style.height=CANV.H+'px';
  CANV.ctx.setTransform(CANV.dpr,0,0,CANV.dpr,0,0);
}
var INPUT={down:false,x:0,y:0,lastX:0,lastY:0,dx:0,dy:0};
function canvasPos(e){var r=CANV.canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function onDown(e){var p=canvasPos(e);INPUT.down=true;INPUT.x=p.x;INPUT.y=p.y;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.dx=0;INPUT.dy=0;var m=MODULES[STATE.currentTab];if(m&&m.onDown)m.onDown(p,e);}
function onMove(e){var p=canvasPos(e);INPUT.dx=p.x-INPUT.lastX;INPUT.dy=p.y-INPUT.lastY;INPUT.lastX=p.x;INPUT.lastY=p.y;INPUT.x=p.x;INPUT.y=p.y;var m=MODULES[STATE.currentTab];if(m&&m.onMove)m.onMove(p,e);}
function onUp(e){INPUT.down=false;var m=MODULES[STATE.currentTab];if(m&&m.onUp)m.onUp(e);}
function onRightClick(e){var p=canvasPos(e);var m=MODULES[STATE.currentTab];if(m&&m.onRightClick)m.onRightClick(p,e);}
function onTouchStart(e){if(e.touches.length===1){var t=e.touches[0];onDown({clientX:t.clientX,clientY:t.clientY,button:0});}else if(e.touches.length===2){var t1=e.touches[0],t2=e.touches[1];INPUT.pinch=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);}e.preventDefault();}
function onTouchMove(e){if(e.touches.length===1){var t=e.touches[0];onMove({clientX:t.clientX,clientY:t.clientY});}else if(e.touches.length===2&&INPUT.pinch){var t1=e.touches[0],t2=e.touches[1];var d=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);INPUT.zoomDelta=d-INPUT.pinch;INPUT.pinch=d;}e.preventDefault();}
function onTouchEnd(e){onUp({});INPUT.pinch=0;e.preventDefault();}

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.beginPath();this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;
  };
}

/* Color by phase: 0 = cyan, π/2 = green, π = yellow, -π/2 = magenta */
function phaseColor(phase,alpha){
  var h=(phase+Math.PI)/(2*Math.PI)*360;
  var l=60;
  if(alpha!=null)l=30+alpha*50;
  return 'hsl('+Math.round(h)+',85%,'+Math.round(l)+'%)';
}

var MODULES={};
function registerModule(key,def){def.key=key;MODULES[key]=def;}
function setStatsHTML(h){var e=$('coStats');if(e)e.innerHTML=h}
function updateBadge(t){var e=$('coBadge');if(e)e.textContent=t}

var LOG=[];
function logMsg(msg,type){
  type=type||'info';
  LOG.push({t:Date.now(),msg:msg,type:type});
  if(LOG.length>200)LOG.shift();
  if(STATE.currentRp==='logs')renderLogs();
}

<script>
/* ================================================================
   STATE
   ================================================================ */
var STATE={
  currentTab:'circuit',
  currentRp:'state',
  theme:'quantum',
  playing:true,
  time:0,
  circuit:{
    nQubits:3,
    nColumns:10,
    gates:[],        /* {col,qubits:[...],name,params} */
    psi:null,
    selectedGate:'H',
    selectedParam:Math.PI/2,
    showProb:true,
    runResult:null,
    measurements:{},
    noiseLevel:0,
    shots:1024
  },
  bloch:{
    theta:Math.PI/3,   /* state polar angle */
    phi:0,             /* state azimuth */
    camX:0.6,
    camY:0.4,
    rotMode:false,
    gateHistory:[]
  },
  entangle:{
    preset:'bell-phi-plus',
    psi:null,
    nQubits:2,
    correlation:null,
    showMatrix:true
  },
  grover:{
    nQubits:4,
    target:11,
    iterations:0,
    amplitudes:null,
    history:[],
    psi:null,
    phase:0
  },
  shor:{
    N:15,
    a:7,
    foundPeriod:null,
    table:[],
    factor1:null,
    factor2:null,
    phase:0,
    showTable:true
  },
  bb84:{
    nBits:32,
    aliceBits:[],aliceBases:[],
    bobBases:[],bobResults:[],
    siftedKey:[],
    aliceSifted:[],
    matchRate:0,
    eavesdrop:false,
    eveBits:[],eveBases:[],
    running:false,
    step:0
  }
};

/* ================================================================
   MODULE 1: CIRCUIT
   ================================================================ */
registerModule('circuit',{
  title:'Quantum Circuit',
  icon:'⚛',
  desc:'Build circuits by placing gates on wires. Click a cell to place, right-click to remove. Real unitary matrix simulation.',
  init:function(){
    var c=STATE.circuit;
    c.psi=newState(c.nQubits);
    this.run();
  },
  run:function(){
    var c=STATE.circuit;
    var psi=newState(c.nQubits);
    /* Apply gates in column order */
    var sorted=c.gates.slice().sort(function(a,b){return a.col-b.col});
    try{
      sorted.forEach(function(g){
        psi=applyGate(psi,g.name,g.qubits,c.nQubits,g.params);
      });
      c.psi=psi;
      c.runResult='ok';
      logMsg('Circuit: '+(c.gates.length)+' gates, dim '+psi.length,'success');
    }catch(e){
      c.runResult='error: '+e.message;
      logMsg('Circuit error: '+e.message,'error');
    }
  },
  addGate:function(name,qubits,col,params){
    var c=STATE.circuit;
    /* Remove existing gate at same position */
    c.gates=c.gates.filter(function(g){
      return !(g.col===col&&g.qubits.some(function(q){return qubits.indexOf(q)>=0}));
    });
    c.gates.push({name:name,qubits:qubits,col:col,params:params||null});
    this.run();
  },
  removeGate:function(col,qubit){
    var c=STATE.circuit;
    c.gates=c.gates.filter(function(g){
      return !(g.col===col&&g.qubits.indexOf(qubit)>=0);
    });
    this.run();
  },
  tick:function(dt){STATE.time+=dt;},
  step:function(){ this.run(); },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02030a';
    ctx.fillRect(0,0,W,H);
    var c=STATE.circuit;
    if(!c.psi)return;
    /* Layout: circuit on top 55%, amplitudes on bottom 45% */
    var circH=H*0.5;
    var padding=60;
    var wireSpacing=Math.min(60,(circH-padding)/Math.max(1,c.nQubits));
    var wireStartY=60+wireSpacing/2;
    var colSpacing=Math.min(70,(W-2*padding-100)/c.nColumns);
    var colStartX=120;
    /* Wires */
    ctx.font='bold 13px monospace';
    ctx.textAlign='right';
    for(var q=0;q<c.nQubits;q++){
      var y=wireStartY+q*wireSpacing;
      ctx.fillStyle='#e8ecff';
      ctx.textAlign='right';
      ctx.fillText('|0⟩',80,y+5);
      ctx.fillStyle='rgba(64,208,255,.4)';
      ctx.fillText('q'+q,colStartX-40,y+5);
      /* Line */
      ctx.strokeStyle='rgba(64,208,255,.35)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(colStartX,y);
      ctx.lineTo(colStartX+c.nColumns*colSpacing,y);
      ctx.stroke();
    }
    /* Column guides */
    for(var col=0;col<=c.nColumns;col++){
      var x=colStartX+col*colSpacing;
      ctx.strokeStyle='rgba(64,208,255,.08)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,wireStartY-wireSpacing/2);ctx.lineTo(x,wireStartY+(c.nQubits-0.5)*wireSpacing);ctx.stroke();
    }
    /* Gates */
    c.gates.forEach(function(g){
      var cx=colStartX+(g.col+0.5)*colSpacing;
      var cy=wireStartY+g.qubits[0]*wireSpacing;
      var color=GATES[g.name]?GATES[g.name].color:CGATES[g.name].color;
      /* Draw box for single-qubit gates */
      if(g.qubits.length===1){
        ctx.fillStyle='rgba(10,12,30,.95)';
        ctx.strokeStyle=color;
        ctx.lineWidth=2.5;
        ctx.beginPath();
        ctx.roundRect(cx-22,cy-22,44,44,6);
        ctx.fill();
        ctx.stroke();
        /* Glow */
        ctx.save();
        ctx.shadowColor=color;ctx.shadowBlur=10;
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle=color;
        ctx.font='bold 18px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(g.name,cx,cy+1);
        ctx.textBaseline='alphabetic';
      } else {
        /* Multi-qubit gate: control lines + target */
        var ys=g.qubits.map(function(q){return wireStartY+q*wireSpacing});
        var yMin=Math.min.apply(null,ys);
        var yMax=Math.max.apply(null,ys);
        ctx.strokeStyle=color;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(cx,yMin);ctx.lineTo(cx,yMax);
        ctx.stroke();
        if(g.name==='CNOT'||g.name==='Toffoli'){
          /* Controls */
          for(var ci=0;ci<g.qubits.length-1;ci++){
            var yy=wireStartY+g.qubits[ci]*wireSpacing;
            ctx.fillStyle=color;
            ctx.beginPath();ctx.arc(cx,yy,6,0,Math.PI*2);ctx.fill();
          }
          /* Target: circle with plus */
          var ty=wireStartY+g.qubits[g.qubits.length-1]*wireSpacing;
          ctx.strokeStyle=color;
          ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(cx,ty,14,0,Math.PI*2);ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx-14,ty);ctx.lineTo(cx+14,ty);
          ctx.moveTo(cx,ty-14);ctx.lineTo(cx,ty+14);
          ctx.stroke();
        } else if(g.name==='SWAP'){
          g.qubits.forEach(function(q){
            var yy=wireStartY+q*wireSpacing;
            ctx.strokeStyle=color;
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.moveTo(cx-8,yy-8);ctx.lineTo(cx+8,yy+8);
            ctx.moveTo(cx-8,yy+8);ctx.lineTo(cx+8,yy-8);
            ctx.stroke();
          });
        } else if(g.name==='CZ'){
          for(var ci2=0;ci2<g.qubits.length-1;ci2++){
            var yy2=wireStartY+g.qubits[ci2]*wireSpacing;
            ctx.fillStyle=color;
            ctx.beginPath();ctx.arc(cx,yy2,6,0,Math.PI*2);ctx.fill();
          }
          var ty2=wireStartY+g.qubits[g.qubits.length-1]*wireSpacing;
          ctx.fillStyle=color;
          ctx.beginPath();ctx.arc(cx,ty2,8,0,Math.PI*2);ctx.fill();
        }
      }
    });
    /* Selected gate cursor */
    if(INPUT.x>colStartX-30&&INPUT.x<colStartX+c.nColumns*colSpacing+30&&INPUT.y>wireStartY-wireSpacing/2){
      var selCol=Math.floor((INPUT.x-colStartX)/colSpacing);
      var selQ=Math.floor((INPUT.y-wireStartY+wireSpacing/2)/wireSpacing);
      if(selCol>=0&&selCol<c.nColumns&&selQ>=0&&selQ<c.nQubits){
        var sx=colStartX+(selCol+0.5)*colSpacing;
        var sy=wireStartY+selQ*wireSpacing;
        var gcolor=GATES[c.selectedGate]?GATES[c.selectedGate].color:CGATES[c.selectedGate].color;
        ctx.strokeStyle=gcolor;
        ctx.setLineDash([4,3]);
        ctx.lineWidth=1.5;

    var dim=c.psi.length;
    var barW=Math.min(80,(CANV.W-2*ampPad-20)/dim);
    var barMaxH=H-ampTop-70;
    var barY=ampTop+30;
    var visibleDim=Math.min(dim,20);
    var offIdx=0;
    for(var i=0;i<visibleDim;i++){
      var idx=i;
      var amp=c.psi[idx];
      var prob=cabs2(amp);
      var barH=prob*barMaxH;
      var bx=ampPad+20+i*(barW+2);
      var by=barY+barMaxH-barH;
      var phase=carg(amp);
      var col=phaseColor(phase,prob);
      ctx.fillStyle=col;
      ctx.fillRect(bx,by,barW,barH);
      ctx.strokeStyle=col;
      ctx.lineWidth=1;
      ctx.strokeRect(bx,by,barW,barH);
      /* Label */
      ctx.fillStyle='#a8b0e0';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(stateName(idx,c.nQubits),bx+barW/2,barY+barMaxH+14);
      /* Probability */
      ctx.fillStyle='#40d0ff';
      ctx.font='9px monospace';
      ctx.fillText(fmt(prob*100,1)+'%',bx+barW/2,barY+barMaxH+26);
    }
    if(dim>visibleDim){
      ctx.fillStyle='#6870a0';
      ctx.font='10px monospace';
      ctx.textAlign='center';

    }
    /* Norm */
    var norm=psiNorm(c.psi);
    ctx.fillStyle='rgba(255,208,64,.15)';
    ctx.strokeStyle='#ffd040';
    ctx.beginPath();ctx.roundRect(CANV.W-160,ampTop+10,140,26,4);ctx.fill();ctx.stroke();

    /* Stats */
    var nonzero=0;
    for(var k=0;k<c.psi.length;k++)if(cabs2(c.psi[k])>1e-6)nonzero++;
    setStatsHTML(
      '<div>Qubits: '+c.nQubits+'</div>'+
      '<div>Dim: '+c.psi.length+'</div>'+
      '<div>Gates: '+c.gates.length+'</div>'+

    updateBadge('⚛ Circuit · '+c.gates.length+' gates · '+c.psi.length+' amps');
    $('sbMode').textContent='Circuit';
    $('sbQubits').textContent=c.nQubits;
    $('sbDim').textContent=c.psi.length;
    $('sbGates').textContent=c.gates.length;

/* Shannon entropy over basis probabilities */
function entropy(psi){
  if(!psi)return 0;
  var H=0;
  for(var i=0;i<psi.length;i++){
    var p=cabs2(psi[i]);
    if(p>1e-12)H-=p*Math.log2(p);
  }
  return H;
}
/* Measure all qubits, collapse state */
function measureAll(){
  var c=STATE.circuit;
  if(!c.psi)return;
  var outcome=measurePsi(c.psi);
  /* Collapse to |outcome⟩ */
  var newPsi=[];
  for(var i=0;i<c.psi.length;i++)newPsi.push(i===outcome?C(1,0):C(0,0));
  c.psi=newPsi;
  /* Record */
  var c2=STATE.measurements||(STATE.measurements={});
  c2[outcome]=(c2[outcome]||0)+1;
  logMsg('Measured: '+stateName(outcome,c.nQubits),'success');
  toast('Measured: '+stateName(outcome,c.nQubits),'success');
}
/* Monte Carlo sample shots */
function runShots(n){
  var c=STATE.circuit;
  if(!c.psi)return;
  var counts={};
  for(var i=0;i<n;i++){
    var outcome=measurePsi(c.psi);
    counts[outcome]=(counts[outcome]||0)+1;
  }
  /* Show histogram in modal */
  var html='<div class="sec"><h4>'+n+' measurement shots</h4>';
  html+='<table class="data-table"><thead><tr><th>State</th><th>Count</th><th>Fraction</th><th>|α|²</th></tr></thead><tbody>';
  Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).forEach(function(k){
    var idx=parseInt(k);
    html+='<tr><td class="c1">'+stateName(idx,c.nQubits)+'</td><td class="c2">'+counts[k]+'</td><td>'+fmt(counts[k]/n*100,2)+'%</td><td class="c3">'+fmt(cabs2(c.psi[idx])*100,2)+'%</td></tr>';
  });
  html+='</tbody></table></div>';
  openModal('🎲 Sampling',html);
}
/* Presets */
function loadCircuitPreset(name){
  var c=STATE.circuit;
  c.gates=[];
  if(name==='Bell'){
    c.nQubits=2;
    c.gates.push({name:'H',qubits:[0],col:0,params:null});
    c.gates.push({name:'CNOT',qubits:[0,1],col:1,params:null});
  } else if(name==='GHZ'){
    c.nQubits=3;
    c.gates.push({name:'H',qubits:[0],col:0,params:null});
    c.gates.push({name:'CNOT',qubits:[0,1],col:1,params:null});
    c.gates.push({name:'CNOT',qubits:[1,2],col:2,params:null});
  } else if(name==='Superposition'){
    c.nQubits=3;
    c.gates.push({name:'H',qubits:[0],col:0,params:null});
    c.gates.push({name:'H',qubits:[1],col:1,params:null});
    c.gates.push({name:'H',qubits:[2],col:2,params:null});
  } else if(name==='QFT-3'){
    c.nQubits=3;
    c.gates.push({name:'H',qubits:[0],col:0,params:null});
    c.gates.push({name:'H',qubits:[1],col:1,params:null});
    c.gates.push({name:'S',qubits:[1],col:2,params:null});
    c.gates.push({name:'H',qubits:[2],col:3,params:null});
    c.gates.push({name:'T',qubits:[2],col:4,params:null});
    c.gates.push({name:'S',qubits:[2],col:5,params:null});
  } else if(name==='Teleport'){
    c.nQubits=3;
    /* Prepare |ψ⟩ on qubit 0 in state |1⟩ */
    c.gates.push({name:'X',qubits:[0],col:0,params:null});
    /* Create Bell pair on 1-2 */
    c.gates.push({name:'H',qubits:[1],col:0,params:null});
    c.gates.push({name:'CNOT',qubits:[1,2],col:1,params:null});
    /* Bell measurement on 0-1 */
    c.gates.push({name:'CNOT',qubits:[0,1],col:2,params:null});
    c.gates.push({name:'H',qubits:[0],col:3,params:null});
  } else if(name==='Identity'){
    c.nQubits=2;
    c.gates.push({name:'X',qubits:[0],col:0,params:null});
    c.gates.push({name:'X',qubits:[0],col:1,params:null});
  }
  MODULES.circuit.init();
  renderLeftPanel();
}

   MODULE 2: BLOCH SPHERE
   ================================================================ */
registerModule('bloch',{
  title:'Bloch Sphere',
  icon:'◉',
  desc:'Visualize a single qubit on the Bloch sphere. Drag to rotate view. Apply gates to see the state vector move.',
  init:function(){},
  applyGate:function(name,params){
    var b=STATE.bloch;
    /* |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ) sin(θ/2)|1⟩ */
    var alpha=C(Math.cos(b.theta/2),0);
    var beta=cmul(cexp(b.phi),C(Math.sin(b.theta/2),0));
    var psi=[alpha,beta];
    psi=applyGate(psi,name,[0],1,params);
    /* Extract angles from new state */
    b.theta=2*Math.acos(clamp(cabs(psi[0]),0,1));
    if(cabs(psi[1])>1e-9)b.phi=carg(psi[1]);
    b.gateHistory.push(name);
    logMsg('Bloch: applied '+name,'info');
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02030a';
    ctx.fillRect(0,0,W,H);
    var b=STATE.bloch;
    /* 3D projection setup */
    var cx=W*0.5,cy=H*0.5;
    var R=Math.min(W,H)*0.32;
    var camX=b.camX,camY=b.camY;
    /* Rotation matrices for camera */
    function project(x,y,z){
      /* Rotate around Y axis by camX, then around X by camY */
      var cosX=Math.cos(camX),sinX=Math.sin(camX);
      var cosY=Math.cos(camY),sinY=Math.sin(camY);
      /* Y rotation */
      var x1=x*cosX+z*sinX;
      var z1=-x*sinX+z*cosX;
      /* X rotation */
      var y1=y*cosY-z1*sinY;
      var z2=y*sinY+z1*cosY;
      return {x:cx+x1*R,y:cy-y1*R,z:z2};
    }
    /* Draw sphere wireframe */
    /* Latitude lines */
    for(var lat=-60;lat<=60;lat+=30){
      var rad=lat*Math.PI/180;
      var r=Math.cos(rad);
      var yy=Math.sin(rad);
      ctx.strokeStyle='rgba(64,208,255,.15)';
      ctx.beginPath();
      var first=true;
      for(var a=0;a<=360;a+=10){
        var ar=a*Math.PI/180;
        var p=project(r*Math.cos(ar),yy,r*Math.sin(ar));
        if(first){ctx.moveTo(p.x,p.y);first=false;}
        else ctx.lineTo(p.x,p.y);
      }
      ctx.stroke();
    }
    /* Longitude lines */
    for(var lon=0;lon<180;lon+=30){
      var rad2=lon*Math.PI/180;
      ctx.strokeStyle='rgba(64,208,255,.15)';
      ctx.beginPath();
      var first2=true;
      for(var a2=-90;a2<=90;a2+=10){
        var ar2=a2*Math.PI/180;
        var p2=project(Math.cos(ar2)*Math.cos(rad2),Math.sin(ar2),Math.cos(ar2)*Math.sin(rad2));
        if(first2){ctx.moveTo(p2.x,p2.y);first2=false;}
        else ctx.lineTo(p2.x,p2.y);
      }
      ctx.stroke();
      ctx.beginPath();
      first2=true;
      for(var a3=-90;a3<=90;a3+=10){
        var ar3=a3*Math.PI/180;
        var p3=project(-Math.cos(ar3)*Math.cos(rad2),Math.sin(ar3),-Math.cos(ar3)*Math.sin(rad2));
        if(first2){ctx.moveTo(p3.x,p3.y);first2=false;}
        else ctx.lineTo(p3.x,p3.y);
      }
      ctx.stroke();
    }
    /* Axes */
    var axes=[
      {v:[1,0,0],color:'#ff60a0',label:'X'},
      {v:[0,1,0],color:'#40ffb0',label:'Y'},
      {v:[0,0,1],color:'#40d0ff',label:'Z'}
    ];
    axes.forEach(function(a){
      var p1=project(-a.v[0],-a.v[1],-a.v[2]);
      var p2=project(a.v[0],a.v[1],a.v[2]);
      ctx.strokeStyle=a.color;
      ctx.lineWidth=1.5;
      ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
      ctx.setLineDash([]);
      /* Labels */
      ctx.fillStyle=a.color;
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      var lp=project(a.v[0]*1.15,a.v[1]*1.15,a.v[2]*1.15);
      ctx.fillText(a.label,lp.x,lp.y+5);
    });
    /* State vector from θ, φ */
    var theta=b.theta,phi=b.phi;
    var sx=Math.sin(theta)*Math.cos(phi);
    var sy=Math.sin(theta)*Math.sin(phi);
    var sz=Math.cos(theta);
    var pOrigin=project(0,0,0);
    var pState=project(sx,sz,sy);
    /* Arrow */
    ctx.strokeStyle='#ffd040';
    ctx.lineWidth=3;
    ctx.shadowColor='#ffd040';
    ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(pOrigin.x,pOrigin.y);
    ctx.lineTo(pState.x,pState.y);
    ctx.stroke();
    ctx.shadowBlur=0;
    /* Arrow head */
    var ang=Math.atan2(pState.y-pOrigin.y,pState.x-pOrigin.x);
    ctx.fillStyle='#ffd040';
    ctx.beginPath();
    ctx.moveTo(pState.x,pState.y);
    ctx.lineTo(pState.x-Math.cos(ang-0.4)*12,pState.y-Math.sin(ang-0.4)*12);
    ctx.lineTo(pState.x-Math.cos(ang+0.4)*12,pState.y-Math.sin(ang+0.4)*12);
    ctx.closePath();
    ctx.fill();
    /* Origin dot */
    ctx.fillStyle='#ffd040';
    ctx.beginPath();ctx.arc(pOrigin.x,pOrigin.y,4,0,Math.PI*2);ctx.fill();
    /* Poles labels */
    ctx.fillStyle='#40ffb0';
    ctx.font='bold 12px monospace';
    ctx.textAlign='center';
    var pNorth=project(0,1.08,0);
    var pSouth=project(0,-1.08,0);
    ctx.fillText('|0⟩',pNorth.x,pNorth.y);
    ctx.fillText('|1⟩',pSouth.x,pSouth.y+14);
    /* Info panel */
    var thetaDeg=theta*180/Math.PI;
    var phiDeg=phi*180/Math.PI;
    ctx.fillStyle='rgba(10,12,30,.85)';
    ctx.strokeStyle='rgba(255,208,64,.4)';
    ctx.beginPath();ctx.roundRect(20,H-110,260,90,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText('|ψ⟩ = cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩',32,H-88);
    ctx.font='11px monospace';
    ctx.fillStyle='#e8ecff';
    ctx.fillText('θ = '+fmt(thetaDeg,2)+'°',32,H-64);
    ctx.fillText('φ = '+fmt(phiDeg,2)+'°',32,H-46);
    ctx.fillText('⟨X⟩ = '+fmt(sx,3)+'  ⟨Y⟩ = '+fmt(sy,3)+'  ⟨Z⟩ = '+fmt(sz,3),32,H-28);
    setStatsHTML(
      '<div>θ: '+fmt(thetaDeg,1)+'°</div>'+
      '<div>φ: '+fmt(phiDeg,1)+'°</div>'+
      '<div>⟨X⟩: '+fmt(sx,3)+'</div>'+
      '<div>⟨Y⟩: '+fmt(sy,3)+'</div>'+
      '<div>⟨Z⟩: '+fmt(sz,3)+'</div>'
    );
    updateBadge('◉ Bloch · θ='+fmt(thetaDeg,1)+'° φ='+fmt(phiDeg,1)+'°');
    $('sbMode').textContent='Bloch';
    $('sbQubits').textContent='1';
    $('sbDim').textContent='2';
  },
  onDown:function(p){ INPUT.lastX=p.x;INPUT.lastY=p.y; },
  onMove:function(p){
    if(!INPUT.down)return;
    var b=STATE.bloch;
    b.camX+=INPUT.dx*0.01;
    b.camY=clamp(b.camY-INPUT.dy*0.01,-1.4,1.4);
  },
  controls:function(){
    var html='';
    html+='<div class="sec"><h4>Apply gate</h4><div class="chip-row">';
    ['H','X','Y','Z','S','T','Sdg','Tdg'].forEach(function(g){

   ================================================================ */
var ENTANGLE_PRESETS={
  'bell-phi-plus':{name:'Bell |Φ+⟩',formula:'(1/√2)(|00⟩ + |11⟩)',n:2,ops:['H','CNOT']},
  'bell-phi-minus':{name:'Bell |Φ−⟩',formula:'(1/√2)(|00⟩ − |11⟩)',n:2,ops:['X','H','CNOT']},
  'bell-psi-plus':{name:'Bell |Ψ+⟩',formula:'(1/√2)(|01⟩ + |10⟩)',n:2,ops:['X','H','CNOT']},
  'bell-psi-minus':{name:'Bell |Ψ−⟩',formula:'(1/√2)(|01⟩ − |10⟩)',n:2,ops:['X','Z','H','CNOT']},
  'ghz':{name:'GHZ state',formula:'(1/√2)(|000⟩ + |111⟩)',n:3,ops:['H','CNOT','CNOT']},
  'w':{name:'W state',formula:'(1/√3)(|001⟩ + |010⟩ + |100⟩)',n:3,ops:['custom-w']},
  'product':{name:'Product state',formula:'|+⟩|+⟩ = (1/2)(|00⟩+|01⟩+|10⟩+|11⟩)',n:2,ops:['H','H']}
};
registerModule('entangle',{
  title:'Entanglement',
  icon:'∞',
  desc:'Prepare Bell, GHZ, and W states. See how amplitudes correlate across qubits — the hallmark of quantum entanglement.',
  init:function(){ this.prepare(); },
  prepare:function(){
    var e=STATE.entangle;
    var p=ENTANGLE_PRESETS[e.preset];
    var n=p.n;
    var psi=newState(n);
    try{
      p.ops.forEach(function(op,i){
        if(op==='custom-w'){
          /* |W⟩ = (|001⟩ + |010⟩ + |100⟩)/√3 */
          var inv=1/Math.sqrt(3);
          psi=[C(0),C(0),C(0),C(inv),C(0),C(inv),C(inv),C(0)];
        } else if(op==='H')psi=applyGate(psi,'H',[0],n,null);
        else if(op==='X')psi=applyGate(psi,'X',[0],n,null);
        else if(op==='Z')psi=applyGate(psi,'Z',[0],n,null);
        else if(op==='CNOT'){
          /* Find first two unconnected qubits */
          var firstFree=1;
          for(var q=1;q<n;q++){
            /* Simple linear chain */
            var target=Math.min(q,n-1);
            if(q===1||firstFree===1){
              psi=applyGate(psi,'CNOT',[q-1,q],n,null);
              if(q===1)firstFree=0;
              break;
            }
          }
          /* Actually build linear chain CNOT: 0→1, 1→2, ... */
          if(i===1)psi=applyGate(psi,'CNOT',[0,1],n,null);
          else if(i===2)psi=applyGate(psi,'CNOT',[1,2],n,null);
        }
      });
      e.psi=psi;
      e.nQubits=n;
      /* Correlation matrix for 2-qubit case */
      if(n===2){
        var corr=[[0,0],[0,0]];
        /* Correlation: E(ij) = P(same) - P(diff) etc. */
        for(var i2=0;i2<4;i2++){
          var p2=cabs2(psi[i2]);
          var a=(i2>>1)&1,b=i2&1;
          corr[a][b]+=p2;
        }
        e.correlation=corr;
      }
      logMsg('Entangle: '+p.name+' prepared','success');
    }catch(err){
      logMsg('Entangle error: '+err.message,'error');
    }
  },
  tick:function(dt){STATE.time+=dt;},
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02030a';
    ctx.fillRect(0,0,W,H);
    var e=STATE.entangle;
    if(!e.psi)return;
    var p=ENTANGLE_PRESETS[e.preset];
    /* Header */
    ctx.fillStyle='rgba(10,12,30,.9)';
    ctx.strokeStyle='rgba(160,96,255,.4)';
    ctx.beginPath();ctx.roundRect(30,20,W-60,70,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#a060ff';
    ctx.font='bold 14px monospace';
    ctx.textAlign='left';
    ctx.fillText(p.name,44,48);
    ctx.fillStyle='#e8ecff';
    ctx.font='14px monospace';
    ctx.fillText(p.formula,44,72);
    /* Amplitude bars with correlation visualization */
    var n=e.nQubits;
    var dim=e.psi.length;
    var padX=60;
    var topY=120;
    var barRowH=(H-topY-80)/dim;
    /* Show each basis state as a bar with probability and phase */
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('AMPLITUDES',padX,topY-6);
    for(var i=0;i<dim;i++){
      var amp=e.psi[i];
      var prob=cabs2(amp);
      var phase=carg(amp);
      var y=topY+i*barRowH+4;
      var barH=Math.min(barRowH-6,20);
      /* State name */
      ctx.fillStyle='#e8ecff';
      ctx.font='bold 12px monospace';
      ctx.textAlign='right';
      ctx.fillText(stateName(i,n),padX-10,y+barH/2+4);
      /* Bar */
      var barW=(W-padX-300)*prob;
      var color=phaseColor(phase,prob);
      ctx.fillStyle=color;
      ctx.fillRect(padX,y,barW,barH);
      /* Amplitude label */
      ctx.fillStyle='#a8b0e0';
      ctx.font='11px monospace';
      ctx.textAlign='left';
      ctx.fillText(cstr(amp,3),padX+barW+10,y+barH/2+4);
      /* Probability % */
      ctx.fillStyle='#ffd040';
      ctx.textAlign='right';
      ctx.fillText(fmt(prob*100,1)+'%',W-40,y+barH/2+4);
    }
    /* Correlation matrix (for 2 qubits) */
    if(e.nQubits===2&&e.correlation){
      var cx=W-260,cy=H-140;
      ctx.fillStyle='rgba(10,12,30,.9)';
      ctx.strokeStyle='rgba(64,255,176,.4)';
      ctx.beginPath();ctx.roundRect(cx,cy,220,120,8);ctx.fill();ctx.stroke();
      ctx.fillStyle='#40ffb0';
      ctx.font='bold 11px monospace';
      ctx.textAlign='left';
      ctx.fillText('CORRELATION P(q₀,q₁)',cx+14,cy+20);
      for(var a=0;a<2;a++){
        for(var b=0;b<2;b++){
          var cellX=cx+20+b*90;
          var cellY=cy+36+a*36;
          var pr=e.correlation[a][b];
          ctx.fillStyle='rgba(64,208,255,'+(pr*0.9+0.1)+')';
          ctx.fillRect(cellX,cellY,80,30);
          ctx.strokeStyle='rgba(64,208,255,.5)';
          ctx.strokeRect(cellX,cellY,80,30);
          ctx.fillStyle='#e8ecff';
          ctx.font='bold 11px monospace';
          ctx.textAlign='center';
          ctx.fillText('|'+a+b+'⟩: '+fmt(pr*100,1)+'%',cellX+40,cellY+20);
        }
      }
    }
    /* Bell inequality hint */
    ctx.fillStyle='rgba(255,208,64,.15)';
    ctx.strokeStyle='#ffd040';
    ctx.beginPath();ctx.roundRect(30,H-70,Math.min(400,W-60),50,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('CHSH inequality: |S| ≤ 2 for local hidden variables',44,H-50);
    ctx.fillStyle='#e8ecff';
    ctx.font='10px monospace';
    ctx.fillText('Quantum mechanics: |S| can reach 2√2 ≈ 2.828',44,H-32);
    var ent=cabs2(e.psi[0])+cabs2(e.psi[dim-1]);
    setStatsHTML(
      '<div>Preset: '+p.name+'</div>'+
      '<div>Qubits: '+n+'</div>'+
      '<div>Dim: '+dim+'</div>'+
      '<div>Entropy: '+fmt(entropy(e.psi),3)+'</div>'+
      '<div>Nonzero: '+countNonzero(e.psi)+'</div>'
    );
    updateBadge('∞ '+p.name+' · '+p.formula);
    $('sbMode').textContent='Entanglement';
    $('sbQubits').textContent=n;
    $('sbDim').textContent=dim;
  },
  onDown:function(){},
  controls:function(){
    var e=STATE.entangle;
    var html='';
    html+='<div class="sec"><h4>Preset</h4><div class="chip-row">';
    Object.keys(ENTANGLE_PRESETS).forEach(function(k){
      html+='<div class="chip '+(e.preset===k?'active':'')+'" onclick="STATE.entangle.preset=\''+k+'\';MODULES.entangle.prepare();renderLeftPanel()">'+ENTANGLE_PRESETS[k].name+'</div>';
    });
    html+='</div></div>';
    html+='<div class="sec"><h4>Current</h4>';
    html+='<div class="kv">';
    var p=ENTANGLE_PRESETS[e.preset];
    html+='<div class="row"><span class="k">Name</span><span class="v">'+p.name+'</span></div>';
    html+='<div class="row"><span class="k">Formula</span><span class="v">'+p.formula+'</span></div>';
    html+='<div class="row"><span class="k">Qubits</span><span class="v">'+p.n+'</span></div>';
    if(e.psi)html+='<div class="row"><span class="k">Entropy</span><span class="v">'+fmt(entropy(e.psi),3)+'</span></div>';
    html+='</div></div>';
    html+='<div class="sec"><h4>Actions</h4>';
    html+='<button class="btn full sm" onclick="measureAll()">👁 Measure</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="runShots(1024)">🎲 Sample 1024 shots</button>';
    html+='<button class="btn full sm" style="margin-top:4px" onclick="MODULES.entangle.prepare()">↻ Re-prepare</button>';
    html+='</div>';
    return html;
  },
  mathPanel:function(){
    var e=STATE.entangle;
    return '<div class="sec"><h4>Bell states (maximally entangled)</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '|Φ±⟩ = (1/√2)(|00⟩ ± |11⟩)<br>'+
      '|Ψ±⟩ = (1/√2)(|01⟩ ± |10⟩)<br><br>'+
      'Each has von Neumann entropy S=1 (max for 1 qubit).'+
      '</div></div>'+
      '<div class="sec"><h4>GHZ state</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '|GHZ⟩ = (1/√2)(|000⟩ + |111⟩)<br><br>'+
      'Measuring one qubit collapses the other two. Generalization to n qubits exists.'+
      '</div></div>'+
      '<div class="sec"><h4>W state</h4>'+
      '<div style="font-family:var(--mono);font-size:.6rem;line-height:1.75;color:var(--tx2)">'+
      '|W⟩ = (1/√3)(|001⟩ + |010⟩ + |100⟩)<br><br>'+
      'Robust to loss of one qubit (still entangled with remaining two).'+
      '</div></div>'+
      '<div class="sec"><h4>Current</h4><div class="kv">'+
      '<div class="row"><span class="k">Entropy</span><span class="v">'+fmt(entropy(e.psi),4)+'</span></div>'+
      '<div class="row"><span class="k">Max possible</span><span class="v">'+fmt(e.nQubits,1)+'</span></div>'+
      '<div class="row"><span class="k">Ratio</span><span class="v">'+fmt(entropy(e.psi)/e.nQubits,3)+'</span></div>'+
      '</div></div>';
  }
});
function countNonzero(psi){
  var n=0;
  for(var i=0;i<psi.length;i++)if(cabs2(psi[i])>1e-6)n++;
  return n;
}

<script>
/* ================================================================
   MODULE 4: GROVER'S SEARCH
   ================================================================ */
registerModule('grover',{
  title:"Grover's Search",
  icon:'🔍',
  desc:"Amplitude amplification: find a marked item in an unsorted list in O(√N) queries instead of O(N).",
  init:function(){ this.reset(); },
  reset:function(){
    var g=STATE.grover;
    g.iterations=0;
    g.history=[];
    var n=g.nQubits;
    var N=1<<n;
    /* Start in |0..0⟩ */
    var psi=newState(n);
    g.psi=psi;
    /* Apply H to all qubits → uniform superposition */
    for(var q=0;q<n;q++)psi=applyGate(psi,'H',[q],n,null);
    g.psi=psi;
    g.amplitudes=[];
    this.recordAmplitudes();
    logMsg('Grover: N='+N+', target='+g.target,'info');
  },
  recordAmplitudes:function(){
    var g=STATE.grover;
    var snapshot=[];
    for(var i=0;i<g.psi.length;i++)snapshot.push(cabs2(g.psi[i]));
    g.history.push({iteration:g.iterations,probs:snapshot});
    if(g.history.length>50)g.history.shift();
  },
  step:function(){
    var g=STATE.grover;
    var n=g.nQubits;
    var N=1<<n;
    var target=g.target;
    var psi=g.psi;
    /* Oracle: flip phase of target */
    var newPsi=psi.slice();
    newPsi[target]=cscale(newPsi[target],-1);
    /* Diffusion operator: 2|ψ⟩⟨ψ| - I where |ψ⟩ = H^n|0⟩ */
    /* Equivalent: H^n, oracle (flip |0..0⟩), H^n */
    for(var q=0;q<n;q++)newPsi=applyGate(newPsi,'H',[q],n,null);
    /* Flip phase of all except |0...0⟩ */
    for(var i=0;i<newPsi.length;i++){
      if(i!==0)newPsi[i]=cscale(newPsi[i],-1);
    }
    for(var q2=0;q2<n;q2++)newPsi=applyGate(newPsi,'H',[q2],n,null);
    g.psi=newPsi;
    g.iterations++;
    this.recordAmplitudes();
    /* Auto-stop at optimal iterations */
    var optimal=Math.round(Math.PI/4*Math.sqrt(N));
    if(g.iterations>=optimal)logMsg('Grover: optimal reached ('+optimal+' iterations)','success');
  },
  tick:function(dt){
    STATE.time+=dt;
    var g=STATE.grover;
    if(!STATE.playing)return;
    /* Auto-advance */
    if(!this._acc)this._acc=0;
    this._acc+=dt*1.5;
    var N=1<<g.nQubits;
    var optimal=Math.round(Math.PI/4*Math.sqrt(N));
    if(g.iterations<optimal&&this._acc>=1){
      this._acc=0;
      this.step();
    }
  },
  draw:function(ctx){
    var W=CANV.W,H=CANV.H;
    ctx.fillStyle='#02030a';
    ctx.fillRect(0,0,W,H);
    var g=STATE.grover;
    if(!g.psi)return;
    var N=g.psi.length;
    /* Header */
    ctx.fillStyle='rgba(10,12,30,.9)';
    ctx.strokeStyle='rgba(64,208,255,.4)';
    ctx.beginPath();ctx.roundRect(30,20,W-60,60,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#40d0ff';
    ctx.font='bold 12px monospace';
    ctx.textAlign='left';
    ctx.fillText("GROVER'S ALGORITHM · N="+N+' items · target '+stateName(g.target,g.nQubits),44,46);
    var optimal=Math.round(Math.PI/4*Math.sqrt(N));
    ctx.fillStyle='#a060ff';
    ctx.font='11px monospace';
    ctx.fillText('Iterations: '+g.iterations+' / '+optimal+' optimal',44,66);
    /* Amplitude bars */
    var barTop=110;
    var barBottom=H-200;
    var barAreaH=barBottom-barTop;
    var barW=Math.min(60,(W-100)/N);
    var startX=(W-N*(barW+4))/2;
    for(var i=0;i<N;i++){
      var amp=g.psi[i];
      var prob=cabs2(amp);
      var phase=carg(amp);
      var barH=prob*barAreaH;
      var bx=startX+i*(barW+4);
      var by=barBottom-barH;
      var isTarget=i===g.target;
      var col=isTarget?'#ffd040':phaseColor(phase,prob);
      /* Bar */
      ctx.fillStyle=col;
      ctx.fillRect(bx,by,barW,barH);
      /* Highlight target outline */
      if(isTarget){
        ctx.strokeStyle='#ff60a0';
        ctx.lineWidth=2.5;
        ctx.strokeRect(bx-2,by-2,barW+4,barH+4);
      }
      /* Label */
      ctx.fillStyle='#a8b0e0';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(stateName(i,g.nQubits),bx+barW/2,barBottom+14);
      /* Probability */
      ctx.fillStyle=isTarget?'#ffd040':'#40d0ff';
      ctx.font='bold 10px monospace';
      ctx.fillText(fmt(prob*100,1)+'%',bx+barW/2,barBottom+28);
    }
    /* Probability of target over iterations */
    var histY=H-140;
    var histH=110;
    ctx.fillStyle='rgba(10,12,30,.7)';
    ctx.strokeStyle='rgba(255,208,64,.3)';
    ctx.beginPath();ctx.roundRect(30,histY,W-60,histH,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd040';
    ctx.font='bold 11px monospace';
    ctx.textAlign='left';
    ctx.fillText('P(target) over iterations',44,histY+18);
    if(g.history.length>1){
      var chartX=44;
      var chartY=histY+28;
      var chartW=W-88;
      var chartH=histH-40;
      ctx.strokeStyle='rgba(255,208,64,.15)';
      ctx.strokeRect(chartX,chartY,chartW,chartH);
      ctx.strokeStyle='#ffd040';
      ctx.lineWidth=2;
      ctx.beginPath();
      g.history.forEach(function(h,i){
        var x=chartX+(i/Math.max(1,g.history.length-1))*chartW;
        var y=chartY+chartH-h.probs[g.target]*chartH;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();
      /* Mark points */
      g.history.forEach(function(h,i){
        var x=chartX+(i/Math.max(1,g.history.length-1))*chartW;
        var y=chartY+chartH-h.probs[g.target]*chartH;
        ctx.fillStyle='#ffd040';
        ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
      });
    }
    setStatsHTML(
      '<div>Qubits: '+g.nQubits+'</div>'+
      '<div>N: '+N+'</div>'+
      '<div>Iterations: '+g.iterations+'</div>'+
      '<div>Optimal: '+optimal+'</div>'+
      '<div>P(target): '+fmt(cabs2(g.psi[g.target])*100,2)+'%</div>'
    );
    updateBadge('🔍 Grover · iter '+g.iterations+'/'+optimal+' · P='+fmt(cabs2(g.psi[g.target])*100,1)+'%');
    $('sbMode').textContent="Grover's Search";
    $('sbQubits').textContent=g.nQubits;
    $('sbDim').textContent=N;
  },
  onDown:function(p){
    /* Click a bar to change target */
    var g=STATE.grover;
    var N=g.psi.length;
    var barTop=110;
    var barBottom=CANV.H-200;
    var barW=Math.min(60,(CANV.W-100)/N);
    var startX=(CANV.W-N*(barW+4))/2;
    for(var i=0;i<N;i++){
      var bx=startX+i*(barW+4);
      if(p.x>=bx&&p.x<=bx+barW&&p.y>=barTop&&p.y<=barBottom){
        g.target=i;
        this.reset();
        logMsg('Grover target changed to '+stateName(i,g.nQubits),'info');
        break;
      }
    }
  },
  controls:function(){
    var g=STATE.grover;
    var html='';

registerModule('shor',{
  title:"Shor's Factoring",
  icon:'🔢',
  desc:'Period finding via quantum Fourier transform, demonstrated on N=15, 21, 35. Classical post-processing extracts factors.',
  init:function(){ this.compute(); },
  compute:function(){
    var s=STATE.shor;
    /* Build modular exponentiation table a^k mod N */
    var table=[];
    var val=1;
    for(var k=0;k<16;k++){
      table.push({k:k,val:val});
      val=(val*s.a)%s.N;
    }
    s.table=table;
    /* Find period */
    s.foundPeriod=null;
    for(var p=1;p<20;p++){
      var v=Math.pow(s.a,p)%s.N;
      /* Use modular arithmetic to avoid precision issues */
      v=1;
      for(var i=0;i<p;i++)v=(v*s.a)%s.N;
      if(v===1){
        s.foundPeriod=p;
        break;
      }
    }
    /* Extract factors using continued fractions (simplified) */
    s.factor1=null;
    s.factor2=null;
    if(s.foundPeriod&&s.foundPeriod%2===0){
      var r=s.foundPeriod;
      var halfPow=1;
      for(var h=0;h<r/2;h++)halfPow=(halfPow*s.a)%s.N;
      if(halfPow!==s.N-1){
        var g1=gcd(halfPow-1,s.N);
        var g2=gcd(halfPow+1,s.N);
        if(g1>1&&g1<s.N&&g2>1&&g2<s.N){
          s.factor1=g1;
          s.factor2=g2;
        } else if(g1>1&&g1<s.N){
          s.factor1=g1;
          s.factor2=s.N/g1;
        }
      }
    }
    logMsg('Shor: a='+s.a+' N='+s.N+' period='+(s.foundPeriod||'none'),s.factor1?'success':'info');

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a;}

registerModule('bb84',{
  title:'BB84 Protocol',
  icon:'🔐',
  desc:'Quantum key distribution with random bases. Eavesdropping introduces measurable error — you can detect it.',
  init:function(){ this.setup(); },
  setup:function(){
    var b=STATE.bb84;
    b.aliceBits=[];
    b.aliceBases=[];
    b.bobBases=[];
    b.bobResults=[];
    b.siftedKey=[];
    b.aliceSifted=[];
    b.eveBits=[];
    b.eveBases=[];
    for(var i=0;i<b.nBits;i++){
      b.aliceBits.push(Math.random()<0.5?0:1);
      b.aliceBases.push(Math.random()<0.5?'+':'x');
      b.bobBases.push(Math.random()<0.5?'+':'x');
      b.eveBases.push(Math.random()<0.5?'+':'x');
    }
    b.step=0;
    b.running=false;
    this.runProtocol();
  },
  runProtocol:function(){
    var b=STATE.bb84;
    /* Simulate: Alice encodes bits in chosen bases. If eavesdropper, Eve measures in her bases (disturbing), then re-sends. Bob measures. */
    b.bobResults=[];
    var bitsSent=b.aliceBits.slice();
    if(b.eavesdrop){
      /* Eve measures in random bases; if she uses wrong basis, 50% chance of disturbing */
      for(var i=0;i<b.nBits;i++){
        var aBit=b.aliceBits[i];
        var aBasis=b.aliceBases[i];
        var eBasis=b.eveBases[i];
        var eMeas;
        if(eBasis===aBasis)eMeas=aBit;
        else eMeas=Math.random()<0.5?aBit:1-aBit; /* Random result in wrong basis */
        /* Re-encode in Eve's basis */
        bitsSent[i]=eMeas;
      }
    }
    /* Bob measures */
    for(var j=0;j<b.nBits;j++){
      var bobBit=bitsSent[j];
      if(b.bobBases[j]===b.aliceBases[j]){
        /* Correct basis → measure correctly (unless Eve disturbed) */
        b.bobResults.push(bobBit);
      } else {
        /* Wrong basis → random result */
        b.bobResults.push(Math.random()<0.5?0:1);
      }
    }
    /* Sifting: keep bits where bases match */
    b.siftedKey=[];
    b.aliceSifted=[];
    for(var k=0;k<b.nBits;k++){
      if(b.aliceBases[k]===b.bobBases[k]){
        b.siftedKey.push(b.bobResults[k]);
        b.aliceSifted.push(b.aliceBits[k]);
      }
    }
    /* Match rate */
    var matches=0;
    for(var l=0;l<b.siftedKey.length;l++){
      if(b.siftedKey[l]===b.aliceSifted[l])matches++;
    }
    b.matchRate=b.siftedKey.length>0?matches/b.siftedKey.length:1;
    logMsg('BB84: sifted key length '+b.siftedKey.length+', match rate '+fmt(b.matchRate*100,1)+'%',b.matchRate>0.9?'success':'warn');
